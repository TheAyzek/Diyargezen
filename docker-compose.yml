version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: diyargezen-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=diyargezen_super_secret_jwt_key_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=sqlite:////app/data/diyargezen.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: web/frontend/Dockerfile
    container_name: diyargezen-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: diyargezen-network
