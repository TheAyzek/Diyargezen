version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: diyargezen-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DIYARGEZEN_ENV=production
      - DIYARGEZEN_JWT_SECRET=${DIYARGEZEN_JWT_SECRET:?Set a unique secret of at least 32 characters}
      - DIYARGEZEN_JWT_EXPIRE_MINUTES=1440
      - DIYARGEZEN_DB_PATH=/var/lib/diyargezen/characters.db
      - DIYARGEZEN_CORS_ORIGINS=${DIYARGEZEN_CORS_ORIGINS:-http://localhost}
    volumes:
      - diyargezen-data:/var/lib/diyargezen
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: web/frontend/Dockerfile
    container_name: diyargezen-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: diyargezen-network

volumes:
  diyargezen-data:
