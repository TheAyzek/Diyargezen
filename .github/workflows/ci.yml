name: Diyargezen CI/CD Pipeline

on:
  push:
    branches: [ main, master, "feature/**", "codex/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Run Python Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r web/backend/requirements.txt

      - name: Install Qt headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libnss3 libasound2t64 libxkbcommon0 libxcb-cursor0

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests web/backend/tests --tb=short --import-mode=importlib -p no:cacheprovider

  frontend-build:
    name: Build React Frontend App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Test frontend contracts
        working-directory: web/frontend
        run: npm test

      - name: Build Vite Bundle
        working-directory: web/frontend
        run: npm run build

  docker-build:
    name: Verify Docker Compose Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose Syntax & Build
        env:
          DIYARGEZEN_JWT_SECRET: ci-only-ephemeral-key-never-use-in-production-12345
        run: |
          docker compose config
          docker compose build
