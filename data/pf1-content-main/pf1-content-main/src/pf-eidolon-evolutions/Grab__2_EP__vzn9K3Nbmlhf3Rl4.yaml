  description:
    value: >-
      <p>An eidolon becomes adept at grappling foes, gaining the grab
      ability.</p><p>Pick bite, claw, pincers, slam, tail slap, or tentacle
      attacks. Whenever the eidolon makes a successful attack of the selected
      type, it can attempt a free combat maneuver check.</p><p>If successful,
      the eidolon grapples the target. This ability only works on creatures of a
      size one category smaller than the eidolon or smaller.</p><p>Eidolons with
      this evolution receive a +4 bonus on CMB checks made to grapple.</p>
