name: Multiattack
system:
  associations:
    classes:
      - Eidolon
  description:
    value: >-
      <p>An eidolon gains
      @Compendium[pf-content.pf-feats.RmhtvELGu73iR8yh]{Multiattack} as a bonus
      feat if it has three or more natural attacks and does not already have
      that feat.</p><p>If it does not have the requisite three or more natural
      attacks, the eidolon instead gains a second attack with one of its natural
      weapons, albeit at a &ndash;5 penalty.</p><p>If the eidolon later gains 3
      or more natural attacks, it loses this additional attack and instead gains
      Multiattack.</p>
  subType: classFeat
  tags:
    - Eidolon
type: feat
