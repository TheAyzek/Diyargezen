name: Resistance (1 EP)
system:
  abilityType: ex
  description:
    instructions: <p>Add SR to Eidolon character sheet.</p>
    value: >-
      <p>An eidolon's form takes on a resiliency to one particular energy type,
      which is usually reflected in its physical body (ashen hide for fire, icy
      breath for cold, and so on). Pick one energy type (acid, cold,
      electricity, fire, or sonic).</p><p>The eidolon gains resist 5 against
      that energy type. This resistance increases by 5 for every 5 levels the
      summoner possesses, to a maximum of 15 at 10th level.</p><p>This evolution
      can be selected more than once. Its effects do not stack. Each time an
      eidolon selects this evolution, it applies to a different energy type.</p>
  subType: misc
  tags:
    - Eidolon Evolution
type: feat
