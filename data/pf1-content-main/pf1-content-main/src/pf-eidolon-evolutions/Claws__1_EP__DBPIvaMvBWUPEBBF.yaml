    value: >-
      <p>An eidolon has a pair of vicious claws at the end of its limbs, giving
      it two claw attacks. These attacks are primary attacks. The claws deal 1d4
      points of damage (1d6 if Large, 1d8 if
      Huge).</p><p><strong>Requirements</strong></p><p>The eidolon must have the
      limbs evolution to take this evolution. This evolution can only be applied
      to the limbs (legs) evolution once This evolution can be selected more
      than once, but the eidolon must possess an equal number of the limbs
      evolution.</p>
