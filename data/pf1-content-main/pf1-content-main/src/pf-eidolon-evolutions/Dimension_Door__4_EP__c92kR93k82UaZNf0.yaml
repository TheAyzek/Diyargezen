      eidolon's Hit Dice.</p><p>The save DC for this spell is 10 + 1/2 the
      eidolon's HD + the eidolon's Charisma
      modifier.</p><p><strong>Requirements</strong></p><p>The eidolon must have
      a Charisma score of at least 14 to take this evolution. The summoner must
      be at least 13th level before selecting this evolution.</p>
