name: Rend (2 EP)
system:
  abilityType: ex
  description:
    instructions: >-
      <p>Add @Compendium[pf-content.pf-eidolon-evolutions.62HGyWMZ3iBgFiE8]{Rend
      (Attack)} to the eidolon. Replace damage die if necessary.</p>
    value: >-
      <p>An eidolon learns to rip and tear the flesh of those it attacks with
      its claws, gaining the rend ability.</p><p>Whenever the eidolon makes two
      successful claw attacks against the same target in 1 round, its claws
      latch onto the flesh and deal extra damage. This damage is equal to the
      damage dealt by one claw attack plus 1-1/2 times the eidolon's Strength
      modifier.</p><p><strong>Requirements</strong></p><p>The eidolon must
      possess the claws evolution to select this evolution. The summoner must be
      at least 6th level before selecting this evolution.</p>
  subType: misc
  tags:
    - Eidolon Evolution
type: feat
