name: Eidolon Saves
system:
  associations:
    classes:
      - Eidolon
  description:
    value: >-
      <p>These are the eidolon's base saving throw bonuses. An eidolon possesses
      two good saving throws and one bad saving throw, determined by the
      creature's base form.</p><p><strong>Good Saves</strong>:
      [[ifelse(gt(@class.level, 14), 8, ifelse(gt(@class.level, 9), 6,
      ifelse(gt(@class.level, 4), 4, ifelse(gt(@class.level, 1), 3,
      2))))]]</p><p><strong>Bad Save</strong>: [[(floor((@class.level + 1) /
      4))]]</p><p>&nbsp;</p>
  subType: classFeat
  tags:
    - Eidolon
type: feat
