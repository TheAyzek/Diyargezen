  description:
    value: >-
      <p>If it hits with two or more natural attacks in 1 round, a creature with
      the rend special attack can cause tremendous damage by latching on to the
      opponent&rsquo;s body and tearing flesh. This attack deals an additional
      amount of damage, but no more than once per round. The type of attacks
      that must hit and the additional damage are included in the
      creature&rsquo;s description.</p><p>The additional damage is usually equal
      to the damage caused by one of the attacks plus 1-1/2 times the
      creature&rsquo;s Strength bonus.</p><p><em>Format</em>: rend (2 claws,
      1d8+9)</p><p><em>Location</em>: Special Attacks.</p><p><em>Usage:</em>
      Replace damage</p>
