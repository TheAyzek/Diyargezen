name: Ultimate Magic (4 EP)
system:
  abilityType: sp
  description:
    instructions: <p>Add the spell as a spell-like ability</p>
    value: >-
      <p>An eidolon learns to cast a powerful spell as a spell-like
      ability.</p><p>Select one spell from the following
      list:</p><ul><li><em>arcane sight</em>,</li><li><em>create food and
      water</em>,</li><li><em>cure serious
      wounds</em>,</li><li><em>daylight</em>,</li><li><em>fireball</em>,</li><li><em>fly</em>,</li><li><em>gaseous
      form</em>,</li><li><em>lightning bolt</em>,</li><li><em>major
      image</em>,</li><li><em>stinking cloud</em>,</li><li><em>tongues</em>,
      or</li><li><em>water breathing</em>.</li></ul><p>This spell can be cast
      once per day as a spell-like ability. The caster level for this evolution
      is equal to the eidolon's Hit Dice - 2.</p><p>The save DC for this spell
      is 10 + 1/2 the eidolon's HD + the eidolon's Charisma modifier. The
      eidolon must have a Charisma score of at least 13 and must possess the
      major magic evolution to take this
      evolution.</p><p><strong>Requirements</strong></p><p>The summoner must be
      at least 11th level before selecting this evolution. This evolution can be
      selected more than once. Each time an eidolon selects this evolution, it
      applies to a new spell from the above list.</p>
  subType: misc
  tags:
    - Eidolon Evolution
type: feat
