name: Minor Magic (2 EP)
system:
  abilityType: sp
  description:
    instructions: <p>Add the selected spell to the eidolon as a spell-like.</p>
    value: >-
      <p>An eidolon learns to cast a minor spell as a spell-like ability. Select
      one spell from the following list: <em>burning hands</em>, <em>comprehend
      languages</em>, <em>cure light wounds</em>, <em>detect
      chaos/evil/good/law</em>, <em>magic missile</em>, <em>obscuring mist</em>,
      <em>silent image</em>, <em>vanish </em>(self only), or
      <em>ventriloquism</em>. This spell can be cast once per day as a
      spell-like ability. At 7th level, this spell can be cast three times per
      day by spending 2 additional evolution points. The caster level for this
      evolution is equal to the eidolon's Hit Dice - 2. The save DC for this
      spell is 10 + 1/2 the eidolon's HD + the eidolon's Charisma
      modifier.&nbsp;</p><p><strong>Requirements</strong></p><p>The eidolon must
      have a Charisma score of at least 11 and must possess the basic magic
      evolution to take this evolution.&nbsp;</p><p>The summoner must be at
      least 4th level before selecting this evolution. This evolution can be
      selected more than once. Each time an eidolon selects this evolution, it
      applies to a new spell from the above list.</p>
  subType: misc
  tags:
    - Eidolon Evolution
type: feat
