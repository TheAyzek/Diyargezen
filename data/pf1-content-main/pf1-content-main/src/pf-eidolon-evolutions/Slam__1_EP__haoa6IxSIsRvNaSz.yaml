    value: >-
      <p>An eidolon can deliver a devastating slam attack. This attack is a
      primary attack. The slam deals 1d8 points of damage (2d6 if Large, 2d8 if
      Huge).</p><p>The eidolon must have the limbs (arms) evolution to take this
      evolution. Alternatively, the eidolon can replace the claws from its base
      form with this slam attack (this still costs 1 evolution
      point).</p><p>This evolution can be selected more than once, but the
      eidolon must possess an equal number of the limbs evolution.</p>
