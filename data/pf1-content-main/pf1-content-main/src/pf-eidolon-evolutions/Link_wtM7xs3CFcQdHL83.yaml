name: Link
system:
  abilityType: ex
  associations:
    classes:
      - Eidolon
  description:
    value: >-
      <p>A summoner and his eidolon share a mental link allows for communication
      across any distance (as long as they are on the same plane). This
      communication is a free action, allowing the summoner to give orders to
      his eidolon at any time. In addition, magic items interfere with the
      summoner's connection to his eidolon.</p><p>As a result, the summoner and
      his eidolon share magic item slots.</p><p>For example, if the summoner is
      wearing a ring, his eidolon can wear no more than one ring. In case of a
      conflict, the items worn by the summoner remain active, and those used by
      the eidolon become dormant. The eidolon must possess the appropriate
      appendages to utilize a magic item.</p>
  subType: classFeat
  tags:
    - Eidolon
type: feat
