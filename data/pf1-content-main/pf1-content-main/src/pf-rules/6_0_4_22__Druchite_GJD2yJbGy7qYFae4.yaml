        /><p>@Source[PZO92109;pages=43]</p><p>The black-and-violet ore known as
        druchite is synonymous with Shadow Absalom’s towering spires. The ore is
        so dark that even creatures that are adapted to see in lightless
        conditions can have extreme difficulty perceiving it. Druchite ore can
        be worked into armor and weapons by applying it in delicate veins or
        inlaid patterns across the equipment.</p><p>Druchite-veined armor grants
        the wearer additional defenses against creatures with darkvision. The
        wearer always benefits from a 10% miss chance while in an area of dim
        light or darkness, even if she is perceived by a creature using
        darkvision. Other sensory abilities, such as blindsense or true seeing,
        bypass this effect entirely. Druchite-veined weapons grant their wielder
        a +2 circumstance bonus on attack rolls against creatures perceiving
        them with darkvision. The wielder receives no bonus when attacking
        creatures using other senses, such as blindsense, or benefitting from
        true seeing.</p><p>Druchite has hardness 10 and 40 hit points per inch
        of thickness.</p><table><thead><tr><td>Type of Druchite-Veined
        Item</td><td>Item Price
        Modifier</td></tr></thead><tbody><tr><td>Ammunition</td><td>+12
        gp</td></tr><tr><td>Light armor</td><td>+1,000
        gp</td></tr><tr><td>Medium armor</td><td>+1,500
        gp</td></tr><tr><td>Heavy armor</td><td>+2,000
        gp</td></tr><tr><td>Weapon</td><td>+1,200 gp</td></tr></tbody></table>
