        Combat}</strong></li><li>@Compendium[pf-content.pf-rules.BA9GnqGPouWXISZm]{2.11.4.
        Siege Engines}</li></ul><hr /><p>@Source[PZO1118;pages=153]</p><p>Not
        every fight is for survival. Combatants sometimes find themselves in
        contests where the crowd’s reaction is at least as important as the
        outcome of the fight itself. Whether a bar brawl with the goal of
        rousing the local populace to rise up against a band of bullies or a
        sun-drenched and bloody gladiatorial contest where life and death
        actually hinge on the favor of the crowd, performance combats are fights
        in which showmanship and flair can be more important than ruthless
        fighting efficiency.</p><p>The following rules for performance combat
        allow you as the GM to run an encounter, or even a series of combat
        encounters, in which the combatants must not only win the battle, but
        also win over the
        crowd.</p><ul><li>@Compendium[pf-content.pf-rules.Oh6nM47XMjljsx1Z]{2.11.3.1.
        Types of Performance
        Combat}</li><li>@Compendium[pf-content.pf-rules.BipbhzlQ1Kmjo9RG]{2.11.3.2.
        Crowd
        Attitudes}</li><li>@Compendium[pf-content.pf-rules.4rFaiDXGOywk46xm]{2.11.3.3.
        Crowd's Starting
        Attitude}</li><li>@Compendium[pf-content.pf-rules.3dh0rKeTWE2IZgM8]{2.11.3.4.
        Performance Combat
        Check}</li><li>@Compendium[pf-content.pf-rules.UB7hSZVCiSaGvyAP]{2.11.3.5.
        Performance Combat Check
        DC}</li><li>@Compendium[pf-content.pf-rules.HFhU2Omn2KgQ4fyN]{2.11.3.6.
        Affecting the Crowd's Attitude}</li></ul>
