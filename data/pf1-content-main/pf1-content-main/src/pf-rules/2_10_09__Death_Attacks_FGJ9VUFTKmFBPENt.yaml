        Spell Resistance}</li></ul><hr /><p>@Source[PZO1110;pages=562]</p><p>In
        most cases, a death attack allows the victim a Fortitude save to avoid
        the effect, but if the save fails, the creature takes a large amount of
        damage, which might cause it to die instantly.</p><p>Raise dead doesn’t
        work on someone killed by a death attack or effect.</p><p>Death attacks
        slay instantly. A victim cannot be made stable and thereby kept
        alive.</p><p>In case it matters, a dead character, no matter how he
        died, has hit points equal to or less than his negative Constitution
        score.</p><p>The spell death ward protects against these attacks.</p>
