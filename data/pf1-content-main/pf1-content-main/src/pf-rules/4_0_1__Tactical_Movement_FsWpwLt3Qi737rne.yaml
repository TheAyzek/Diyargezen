        /><p>@Source[PZO1110;pages=170]</p><p>Tactical movement is used for
        combat. Characters generally don’t walk during combat, for obvious
        reasons— they hustle or run instead. A character who moves his speed and
        takes some action is hustling for about half the round and doing
        something else the other half.</p><h2>Hampered Movement</h2><p>Difficult
        terrain, obstacles, and poor visibility can hamper movement (see Table
        7–7 for details). When movement is hampered, each square moved into
        usually counts as two squares, effectively reducing the distance that a
        character can cover in a move. If more than one hampering condition
        applies, multiply all additional costs that apply. This is a specific
        exception to the normal rule for doubling.</p><p>In some situations,
        your movement may be so hampered that you don’t have sufficient speed
        even to move 5 feet (1 square). In such a case, you may use a full-round
        action to move 5 feet (1 square) in any direction, even diagonally. Even
        though this looks like a 5-foot step, it’s not, and thus it provokes
        attacks of opportunity normally. (You can’t take advantage of this rule
        to move through impassable terrain or to move when all movement is
        prohibited to you.)</p><p>You can’t run or charge through any square
        that would hamper your movement.</p><h2>Table 7-7: Hampered
        Movement</h2><table><thead><tr><td>Condition</td><td>Additional Movement
        Cost</td></tr></thead><tbody><tr><td>Difficult
        Terrain</td><td>×2</td></tr><tr><td>Obstacle*</td><td>×2</td></tr><tr><td>Poor
        Visibility</td><td>×2</td></tr><tr><td>Impassable</td><td>—</td></tr></tbody></table><p>*
        May require a skill check</p>
