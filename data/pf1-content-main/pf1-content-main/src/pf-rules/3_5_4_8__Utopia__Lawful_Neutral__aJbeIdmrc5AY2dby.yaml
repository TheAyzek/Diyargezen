        /><p>@Source[PZO1114;pages=193]</p><p>Utopia is a bastion of order
        against the chaos of Limbo and the countless demonic hordes of the
        Abyss. A great city of eternal perfection, Utopia’s streets and
        buildings are paragons of architecture and aesthetics; everything is
        ordered and nothing happens by chance. While no one race rules Utopia,
        axiomites and inevitables make their homes here, forever striving to
        expand their perfect city.</p><h2>Planar Traits</h2><p>Utopia has the
        following traits:</p><ul><li><strong>Finite
        Shape</strong></li><li><strong>Divinely Morphic</strong>: Deities with
        domains in Utopia can alter the plane at will.</li><li><strong>Strongly
        Law-Aligned</strong></li><li><strong>Enhanced Magic</strong>: Spells and
        spell-like abilities with the lawful descriptor are
        enhanced.</li><li><strong>Impeded Magic</strong>: Spells and spell-like
        abilities with the chaotic descriptor are impeded.</li></ul>
