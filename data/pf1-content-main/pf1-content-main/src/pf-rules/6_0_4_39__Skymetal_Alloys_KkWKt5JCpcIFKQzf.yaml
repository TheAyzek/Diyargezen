        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p>@Source[PZO9061]</p><p>Both ancient
        and modern metallurgists have devised numerous alloys that mix skymetals
        with other materials. Many of these are highly specialized, but one
        deserves special mention: glaucite. This dull gray metal is an alloy of
        adamantine and iron. Though it has hardness 15 and 30 hit points per
        inch of thickness, glaucite is half again as heavy as iron and difficult
        to work with. The material of choice for ship hulls and robot frames,
        but is generally sought after only by collectors and eccentrics as a
        material for new items or other projects.</p>
