        /><p>@Source[PZO90139;pages=64]</p><p>Philosophers speculate that the
        Spire upon which the Boneyard rests is composed of a condensed form of
        pure quintessence, but those brave enough to acquire some the substance
        report that ore mined from the Spire can be smelted and worked into
        weapons and armor. This substance, called spiresteel, exhibits an innate
        attraction for soul energy.</p><p>Armor crafted from spiresteel protects
        the wearer’s essence, applying half of its armor bonus to AC against
        attacks made by incorporeal creatures. Weapons crafted from spiresteel
        appear hungry for the very substance of the foes they are wielded
        against. When the wielder confirms a critical hit with a spiresteel
        weapon, the target must succeed at a Will save (DC = 10 + double the
        weapon’s enhancement bonus), or be staggered for 1 round as a portion of
        its soul is carved away.</p><p>Spiresteel can be used to craft any armor
        or weapon that is typically made of steel. Items made of spiresteel are
        always considered masterwork, and the masterwork costs are included in
        the listed prices.</p><p>Spiresteel has the same hit points and hardness
        as steel.</p><table><thead><tr><td>Type of Spiresteel Item</td><td>Item
        Price Modifier</td></tr></thead><tbody><tr><td>Ammunition</td><td>+10 gp
        per item</td></tr><tr><td>Light Armor</td><td>+1,000
        gp</td></tr><tr><td>Medium Armor</td><td>+2,000
        gp</td></tr><tr><td>Heavy Armor</td><td>+3,000
        gp</td></tr><tr><td>Weapon</td><td>+2,000 gp</td></tr></tbody></table>
