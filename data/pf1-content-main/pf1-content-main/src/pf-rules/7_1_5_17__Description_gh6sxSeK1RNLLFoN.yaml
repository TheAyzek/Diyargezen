        /><p>@Source[PZO1117;pages=134]</p><p>The description is the meat of the
        spell, and what you put here is the most important information of
        all.</p><p>Make sure the spell description is clear and concise.
        Remember that players are going to refer to the spell description in a
        hurry during their turn of combat, and if they have to fight their way
        through flowery language to figure out the details, the resulting delay
        will annoy other players and the GM. If the spell has several complex
        effects, put each effect into its own paragraph. If the spell allows the
        caster to choose from several options, put each option on its own line
        with an italicized name (see binding for an example).</p><p>Anything
        that appears in the spell stat block doesn’t need to appear again in the
        spell description—it’s redundant. For example, the fireball description
        doesn’t say, “The spell can reach up to 400 feet plus 40 feet per caster
        level.” Extraneous text like that is just more clutter for the player to
        sift through when looking up the spell’s effects in the middle of
        combat.</p><p>Avoid using language that implies something that the game
        mechanics of the spell don’t back up. For example, a spell’s description
        shouldn’t say “using the foul powers of necromancy” if the spell doesn’t
        actually have some sort of evil effect or the evil descriptor. This sort
        of mistake is most common with necromancy spells, which include not only
        many obviously evil spells, but also a fair share of helpful ones as
        well (such as astral projection, gentle repose, and undeath to death).
        People who read your spell description may not know your intent, and
        using flavorful language can trick readers into thinking a spell should
        have additional effects not explicitly spelled out in the
        description.</p><p>Remember that while you may be designing a spell with
        a particular character or class in mind, most spells are going to have a
        broader availability. You have to think of the spell in the hands of the
        biggest power gamer, and in use by a character who is very different
        than the one for whom it is designed. Even a simple sorcerer/wizard
        spell has to deal with two different types of casters: a wizard, who can
        learn many spells but can only cast a few per day, and a sorcerer, who
        knows few spells but can cast many per day. A spell that is good for a
        wizard may be too good when used by a sorcerer because the sorcerer can
        use it more times per day. Likewise, think of what happens if the PCs
        can access the spell in potion or scroll form—you may intend for the
        spell to be rare and for the PCs to not have it most of the time, but a
        wizard can create scrolls of rarely used spells and save them for just
        the right opportunity.</p><p>When you finish writing a spell
        description, have others look it over. They’ll notice things you missed,
        come up with questions your spell needs to address, and find ways your
        spell can be abused. Use that feedback to revise the spell.</p>
