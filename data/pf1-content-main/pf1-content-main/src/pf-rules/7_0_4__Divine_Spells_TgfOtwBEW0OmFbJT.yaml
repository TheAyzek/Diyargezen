        /><p>@Source[PZO1110;pages=220]</p><p>Clerics, druids, experienced
        paladins, and experienced rangers can cast divine spells. Unlike arcane
        spells, divine spells draw power from a divine source. Clerics gain
        spell power from deities or from divine forces. The divine force of
        nature powers druid and ranger spells, and the divine forces of law and
        good power paladin spells. Divine spells tend to focus on healing and
        protection and are less f lashy, destructive, and disruptive than arcane
        spells.</p><p>@Compendium[pf-content.pf-rules.i7TqrtEEGX6SwnaJ]{7.0.4.1.
        Preparing Divine
        Spells}</p><p>@Compendium[pf-content.pf-rules.ISmWmvL7xj6jzWuc]{7.0.4.2.
        Divine Magical
        Writing}</p><p>@Compendium[pf-content.pf-rules.NUiA6qsVNN3mnSYY]{7.0.4.3.
