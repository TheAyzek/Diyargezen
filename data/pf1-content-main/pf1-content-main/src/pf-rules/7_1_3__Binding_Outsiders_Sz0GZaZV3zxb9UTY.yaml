        Designing Spells}</li></ul><hr /><p>@Source[PZO1117;pages=101]</p><p>One
        of the most potent tools a spellcasters can wield is the command of
        summoned creatures; the most powerful of these spells call forth allies
        mightier than mere flesh, reaching from the depths of Hell to the peaks
        of Heaven, and even stranger places beyond the pale. When reaching for
        knowledge and forces from other planes, a spellcaster must have control
        over the strengths and weaknesses of their targets, or face doom far
        worse than any that might be visited upon them in the Material Plane. A
        spellcaster wishing to bind such creatures who cannot play to the
        desires of his summoned captive will surely lose control, and may find
        himself torn from his reality as a plaything of the multiverse’s
        cruelest tormentors.</p>
