        Cast a Quickened Spell}</strong></li></ul></li></ul><hr
        /><p>@Source[PZO1110;pages=188]</p><p>You can cast a quickened spell
        (see the Quicken Spell feat), or any spell whose casting time is
        designated as a free or swift action, as a swift action. Only one such
        spell can be cast in any round, and such spells don’t count toward your
        normal limit of one spell per round. Casting a spell as a swift action
        doesn’t incur an attack of opportunity.</p>
