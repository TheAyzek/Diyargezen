        /><p>@Source[PZO1110;pages=189]</p><p>When your current hit point total
        drops to exactly 0, you are
        @Compendium[pf1.conditions.zW6gVKSaVFTrd9PY]{Disabled}.</p><p>You gain
        the @Compendium[pf1.conditions.6LpiJdKskDFD4zLC]{Staggered} condition
        and can only take a single move or standard action each turn (but not
        both, nor can you take full-round actions). You can take move actions
        without further injuring yourself, but if you perform any standard
        action (or any other strenuous action) you take 1 point of damage after
        completing the act. Unless your activity increased your hit points, you
        are now at –1 hit points and
        @Compendium[pf1.conditions.BKxrsHSBNATa0e3D]{Dying}.</p><p>Healing that
        raises your hit points above 0 makes you fully functional again, just as
        if you’d never been reduced to 0 or fewer hit points.</p><p>You can also
        become disabled when recovering from dying. In this case, it’s a step
        toward recovery, and you can have fewer than 0 hit points (see
        @Compendium[pf-content.pf-rules.nEPpg39gAOwIxDki]{2.03.5. Stable
        Characters and Recovery}).</p>
