        Ability}</li><li>@Compendium[pf-content.pf-rules.A0PE1jTg1M6hXYax]{2.02.3.6.
        Withdraw}</li></ul><hr /><p>@Source[PZO1110;pages=188]</p><p>In some
        situations, your movement may be so hampered that you don’t have
        sufficient speed even to move 5 feet (a single square). In such a case,
        you may spend a full-round action to move 5 feet (1 square) in any
        direction, even diagonally. Even though this looks like a 5-foot step,
        it’s not, and thus it provokes attacks of opportunity normally.</p>
