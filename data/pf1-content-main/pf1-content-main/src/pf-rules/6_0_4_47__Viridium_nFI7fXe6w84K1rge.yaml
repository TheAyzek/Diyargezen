        <p>@Compendium[pf-content.pf-rules.4TX2Q1MaWt1B8298]{(Index)
        Items}</p><p>@Compendium[pf-content.pf-rules.j1KZwBRf9pU1Dg2C]{6.0.
        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p><strong>PFS
        Legal</strong></p><p>@Source[PZO1123;pages=52]</p><p>This deep green
        volcanic glass is similar to obsidian but is formed when molten rock is
        tainted with anomalous trace minerals from deep beneath the earth whose
        emanations are toxic to living things. It can be fragmented to razor
        sharpness, but even a tiny amount of viridium contacting the bloodstream
        can pass on a wasting sickness.</p><p>Any successful hit with a viridium
        weapon causes the target to contract leprosy (Fortitude DC 12 negates).
        On a successful critical hit, a tiny fragment of viridium breaks off
        within the target, affecting it as though with greenblood oil (Fortitude
        DC 13 negates).</p><p>A creature carrying a viridium weapon must save
        every 24 hours or contract leprosy unless the weapon is kept inside an
        extradimensional space (such as an efficient quiver) or a scabbard lined
        with lead.</p><p>Oozes, plants, and outsiders are immune to the deadly
        emanations of viridium.</p><p>Viridium weapons have half the hardness of
        their base weapon and have the fragile quality. Viridium can be
        magically strengthened at an additional cost of +1,000 gp for a weapon
        or +20 gp for ammunition. This removes the fragile quality from the item
        but does not otherwise affect its
        abilities.</p><table><thead><tr><td>Type of Viridium Item</td><td>Item
        Price Modifier</td></tr></thead><tbody><tr><td>Ammunition</td><td>+20 gp
        per item</td></tr><tr><td>Weapon</td><td>+200
        gp</td></tr></tbody></table>
