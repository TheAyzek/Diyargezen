      content: >-
        <p>@Compendium[pf-content.pf-rules.4TX2Q1MaWt1B8298]{(Index)
        Items}</p><p>@Compendium[pf-content.pf-rules.j1KZwBRf9pU1Dg2C]{6.0.
        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p><strong>PFS
        Legal</strong></p><p>@Source[PZO1123;pages=48], PFRPG Core Rulebook pg.
        154</p><p>Mined from rocks that fell from the heavens, this ultrahard
        metal adds to the quality of a weapon or suit of armor. Weapons
        fashioned from adamantine have a natural ability to bypass hardness when
        sundering weapons or attacking objects, ignoring hardness less than 20.
        Armor made from adamantine grants its wearer damage reduction of 1/— if
        it’s light armor, 2/— if it’s medium armor, and 3/— if it’s heavy
        armor.</p><p>Adamantine is so costly that weapons and armor made from it
        are always of masterwork quality; the masterwork cost is included in the
        prices given below. Thus, adamantine weapons and ammunition have a +1
        enhancement bonus on attack rolls, and the armor check penalty of
        adamantine armor is lessened by 1 compared to ordinary armor of its
        type. Items without metal parts cannot be made from adamantine. An arrow
        could be made of adamantine, but a quarterstaff could not.</p><p>Weapons
        and armor normally made of steel that are made of adamantine have
        one-third more hit points than normal. Adamantine has 40 hit points per
        inch of thickness and hardness 20.</p><table><thead><tr><td>Type of
        Adamantine Item</td><td>Item Price
        Modifier</td></tr></thead><tbody><tr><td>Ammunition</td><td>+60 gp per
        item</td></tr><tr><td>Light armor</td><td>+5,000
        gp</td></tr><tr><td>Medium armor</td><td>+10,000
        gp</td></tr><tr><td>Heavy armor</td><td>+15,000
        gp</td></tr><tr><td>Weapon</td><td>+3,000 gp</td></tr></tbody></table>
