        Resistance}</li><li>@Compendium[pf-content.pf-rules.RPid0ZvH9nAN4IgC]{2.10.13.
        Fear}</li><li><strong>@Compendium[pf-content.pf-rules.teI2mSg16BCYCEDS]{2.10.14.
