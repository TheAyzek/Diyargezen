        Traits}</li><li><strong>@Compendium[pf-content.pf-rules.CgVqFS1fjMtDuoH0]{1.2.7.
        Subraces}</strong></li></ul><hr /><p>In fantasy roleplaying games, race
        is fundamental. It both provides a starting point for character creation
        and sets the tone for a character as it progresses. Race mixes biology
        and culture, then translates those concepts into racial traits. Yet
        since both biology and culture are mutable—especially when one considers
        the powerful forces of magic—racial traits can be so diverse that two
        elves can be extremely different while still manifesting aspects of
        their shared heritage and culture. A race’s traits, its history, its
        relations with other races, and the culture that all of these things
        imply—all of these frame your character. This is true whether you play
        to or against the stereotypes. A savage and bloodthirsty half-orc who
        lives only for battle is fun to play, but so is a stern and conflicted
        half-orc paladin constantly struggling to keep her bloodlust in check.
        Both fit comfortably within the theme of half-orc, but come off as very
        different characters around the game table.</p><p>Below are listed the
        Race who have Subraces available to
