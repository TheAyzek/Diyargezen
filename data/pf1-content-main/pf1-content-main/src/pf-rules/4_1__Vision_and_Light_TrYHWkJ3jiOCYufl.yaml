        <p>@Compendium[pf-content.pf-rules.kAJexDuJ2IAXZODj]{(Index)
        Exploration}</p><p>@Compendium[pf-content.pf-rules.vsp6TyvvUw3KOD0b]{4.0.
        Movement}</p><p><strong>@Compendium[pf-content.pf-rules.TrYHWkJ3jiOCYufl]{4.1.
        Vision and
        Light}</strong></p><p>@Compendium[pf-content.pf-rules.1EvBiiUnVOT4cUbT]{4.2.
        Breaking and Entering}</p><hr
        /><p>@Source[PZO1110;pages=172]</p><p>Dwarves and half-orcs have
        darkvision, but the other races presented in Chapter 2 need light to see
        by. See Table 7–10 for the radius that a light source illuminates and
        how long it lasts. The increased entry indicates an area outside the lit
        radius in which the light level is increased by one step (from darkness
        to dim light, for example).</p><p>In an area of bright light, all
        characters can see clearly. Some creatures, such as those with light
        sensitivity and light blindness, take penalties while in areas of bright
        light. A creature can’t use Stealth in an area of bright light unless it
        is invisible or has cover. Areas of bright light include outside in
        direct sunshine and inside the area of a daylight spell.</p><p>Normal
        light functions just like bright light, but characters with light
        sensitivity and light blindness do not take penalties. Areas of normal
        light include underneath a forest canopy during the day, within 20 feet
        of a torch, and inside the area of a light spell.</p><p>In an area of
        dim light, a character can see somewhat. Creatures within this area have
        concealment (20% miss chance in combat) from those without darkvision or
        the ability to see in darkness. A creature within an area of dim light
        can make a Stealth check to conceal itself. Areas of dim light include
        outside at night with a moon in the sky, bright starlight, and the area
        between 20 and 40 feet from a torch.</p><p>In areas of darkness,
        creatures without darkvision are effectively blinded. In addition to the
        obvious effects, a blinded creature has a 50% miss chance in combat (all
        opponents have total concealment), loses any Dexterity bonus to AC,
        takes a –2 penalty to AC, and takes a –4 penalty on Perception checks
        that rely on sight and most Strength- and Dexterity-based skill checks.
        Areas of darkness include an unlit dungeon chamber, most caverns, and
        outside on a cloudy, moonless night.</p><p>Characters with low-light
        vision (elves, gnomes, and half-elves) can see objects twice as far away
        as the given radius. Double the effective radius of bright light, normal
        light, and dim light for such characters.</p><p>Characters with
        darkvision (dwarves and half-orcs) can see lit areas normally as well as
        dark areas within 60 feet. A creature can’t hide within 60 feet of a
        character with darkvision unless it is invisible or has
        cover.</p><h2>Table 7-10: Light Sources and
        Illumination</h2><table><thead><tr><td>Object</td><td>Normal</td><td>Increased</td><td>Duration</td></tr></thead><tbody><tr><td>Candle</td><td>n/a<sup>1</sup></td><td>5
        ft.</td><td>1 hr.</td></tr><tr><td>Everburning torch</td><td>20
        ft.</td><td>40 ft.</td><td>Permanent</td></tr><tr><td>Lamp,
        common</td><td>15 ft.</td><td>30 ft.</td><td>6
        hr./pint</td></tr><tr><td>Lantern, bullseye</td><td>60-ft.
        cone</td><td>120-ft. cone</td><td>6 hr./pint</td></tr><tr><td>Lantern,
        hooded</td><td>30 ft.</td><td>60 ft.</td><td>6
        hr./pint</td></tr><tr><td>Sunrod</td><td>30 ft.</td><td>60 ft.</td><td>6
        hr.</td></tr><tr><td>Torch</td><td>20 ft.</td><td>40 ft.</td><td>1
        hr.</td></tr><tr><td> </td><td> </td><td> </td><td>
        </td></tr><tr><td><strong>Spell</strong></td><td><strong>Normal</strong></td><td><strong>Increased</strong></td><td><strong>Duration</strong></td></tr><tr><td>Continual
        flame</td><td>20 ft.</td><td>40
        ft.</td><td>Permanent</td></tr><tr><td>Dancing lights
        (torches)</td><td>20 ft. (each)</td><td>40 ft. (each)</td><td>1
        min.</td></tr><tr><td>Daylight</td><td>60 ft.<sup>2</sup></td><td>120
        ft.</td><td>10 min./level</td></tr><tr><td>Light</td><td>20
        ft.</td><td>40 ft.</td><td>10 min./level</td></tr></tbody></table><p>1 A
        candle does not provide normal illumination, only dim light.<br />2 The
        light for a daylight spell is bright light.</p>
