        /><p>@Source[PZO1110;pages=415]</p><p>Stairs are the most common means
        of traveling up and down within a dungeon. A character can move up or
        down stairs as part of their movement without penalty, but they cannot
        run on them. Increase the DC of any Acrobatics skill check made on
        stairs by 4. Some stairs are particularly steep and are treated as
        difficult terrain.</p>
