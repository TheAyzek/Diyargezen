        /><p>@Source[PZO1110;pages=209]</p><p>Beneath the spell name is a line
        giving the school of magic (and the subschool, if any) to which the
        spell belongs.</p><p>Almost every spell belongs to one of eight schools
        of magic. A school of magic is a group of related spells that work in
        similar ways. A small number of spells (arcane mark, limited wish,
        permanency, prestidigitation, and wish) are universal, belonging to no
        school.</p>
