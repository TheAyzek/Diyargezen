        /><p>@Source[PZO1134;pages=182]</p><p><em>@UUID[Compendium.pf1.pf1e-rules.JournalEntry.x175kVqUfLGPt8tC.JournalEntryPage.kRK5XwVBvcMi35w2]{Bluff}</em></p><p>The
        Bluff skill is an extremely versatile, though sometimes misunderstood,
        social skill. Unlike Diplomacy and Intimidate, which can directly push
        their target toward a course of action, Bluff feeds the target
        misinformation. A skilled user of the Bluff skill needs to understand
        how the target’s mind works, in order to deliver just the right
        misinformation to achieve the desired results. The disadvantage is that
        such manipulation is less predictable and more difficult to pull off,
        but the advantage is that the target is not aware that he is being
        manipulated, whereas even the most successful Diplomacy or Intimidate
        attempt leaves the target realizing who has convinced him to take
        action. This section includes clarifications and details on several
        different ways to use Bluff—and on several things that don’t work.</p>
