      content: >-
        <h2> Gemsoul (Crystal Oread)</h2><p>@Source[PZO9492;pages=20]</p><p>With
        scintillating personalities to match their captivating appearances,
        gemsoul oreads command attention—and prefer it that
        way.</p><p><strong>Typical Alignment</strong> N<br /><strong>Ability
        Modifiers</strong> +2 Str, +2 Cha, –2 Wis<br /><strong>Alternate
        Spell-Like Ability</strong> Gemsouls gain <em>color spray</em> as a
        spell-like ability.<br /><strong>Crystal Affinity</strong> This racial
        trait functions as and can be replaced as the base oread’s earth
        affinity, except it benefits sorcerers with the deep earth bloodline and
        spellcasters with the Charm domain.</p><p>Gemsouls tend to have large
        egos and are flashy in their relationships. They gravitate towards
        artistic pursuits, most frequently of a performative nature, though they
        also have a strong tradition of symmetric poetry. Gemsouls prefer to
        make their homes in flamboyant societies or places where they can make
        meaningful personal contributions, as well as in nations that appreciate
        cultivated beauty, like Kyonin.</p><p>Gemsouls typically have dazzling,
        faceted skin, along with a cluster of crystalline formations instead of
        hair and pupil-less eyes of vivid colors. Some favor tattoos in complex,
        branching geometric shapes, and they can frequently be seen wearing
        silks or brightly dyed linen to contrast their complexions.</p><h2>
        Ironsoul (Metal Oread)</h2><p>@Source[PZO9492;pages=20]</p><p>Stolid and
        indomitable, ironsoul oreads undertake great works, both physical and
        conceptual, with unwavering determination.</p><p><strong>Typical
        Alignment</strong> LN<br /><strong>Ability Modifiers</strong> +2 Con, +2
        Wis, –2 Dex<br /><strong>Alternate Spell-Like Ability</strong> Ironsouls
        gain <em>unerring weapon</em> as a spell-like ability.<br
        /><strong>Metal Affinity</strong> This racial trait functions as and can
        be replaced as the base oread’s earth affinity, except it benefits
        sorcerers with the shaitan bloodline and spellcasters with the Metal
        subdomain.</p><p>Possessed of patience and a sense of self-refinement
        through struggle, ironsouls reflect their ancestry in their continuous
        and determined efforts towards self-improvement. Ironsouls are most at
        home in areas that reflect that same sense of directed and intentional
        growth, and they operate best within existing formal
        structures.</p><p>Ironsouls wear their elemental heritage on their skin,
        with most having some amount of metallic sheen. Their skin tone varies,
        with colors ranging from gold and silver to copper-green and dull, oxide
        gray.</p>
