        /><p>@Source[PZO1110;pages=441]</p><p>Infinities may be broken into
        smaller infinities, and planes into smaller, related planes. These
        layers are effectively separate planes of existence, and each layer can
        have its own features and qualities. Layers are connected to each other
        through a variety of planar gates, natural vortices, paths, and shifting
        borders.</p><p>Access to a layered plane from elsewhere usually happens
        on the first layer of the plane, which can be either the top or bottom
        layer, depending on the specific plane. Most fixed access points (such
        as portals and natural vortices) reach this layer, which makes it the
        gateway for other layers of the plane. The plane shift spell generally
        deposits the spellcaster on the first layer of the plane.</p>
