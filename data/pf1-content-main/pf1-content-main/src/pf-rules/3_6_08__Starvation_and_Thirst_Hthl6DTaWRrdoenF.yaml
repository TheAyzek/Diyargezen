        /><p>@Source[PZO1110;pages=444]</p><p>Characters might find themselves
        without food or water and with no means to obtain them. In normal
        climates, Medium characters need at least a gallon of fluids and about a
        pound of decent food per day to avoid starvation. (Small characters need
        half as much.) In very hot climates, characters need two or three times
        as much water to avoid dehydration.</p><p>A character can go without
        water for 1 day plus a number of hours equal to his Constitution score.
        After this time, the character must make a Constitution check each hour
        (DC 10, +1 for each previous check) or take 1d6 points of nonlethal
        damage. Characters that take an amount of nonlethal damage equal to
        their total hit points begin to take lethal damage instead.</p><p>A
        character can go without food for 3 days, in growing discomfort. After
        this time, the character must make a Constitution check each day (DC 10,
        +1 for each previous check) or take 1d6 points of nonlethal damage.
        Characters that take an amount of nonlethal damage equal to their total
        hit points begin to take lethal damage instead.</p><p>Characters who
        have taken nonlethal damage from lack of food or water are fatigued.
        Nonlethal damage from thirst or starvation cannot be recovered until the
        character gets food or water, as needed—not even magic that restores hit
        points heals this damage.</p>
