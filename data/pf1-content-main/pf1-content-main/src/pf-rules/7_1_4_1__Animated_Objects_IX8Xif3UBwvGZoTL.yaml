        /><p>@Source[PZO1117;pages=111]</p><p>Not all constructs are built with
        the Craft Construct feat. Spells like animate objects allow a caster to
        temporarily animate an existing object. These constructs are in many
        ways weaker than manufactured constructs, as they are susceptible to
        dispelling and antimagic.</p><p>A caster can use the animate objects
        spell to instantly create a temporary construct. A permanency spell cast
        upon an animated object makes the construct permanent; however, it can
        still be dispelled or suppressed by antimagic. Craft Construct creates
        permanent animated objects not susceptible to dispelling and antimagic.
        The CR of a potential animated object depends on its size and abilities,
        as explained in the animated object monster entry.</p>
