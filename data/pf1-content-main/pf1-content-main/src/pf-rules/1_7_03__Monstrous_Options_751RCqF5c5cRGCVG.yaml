        /><p>@Source[PZO9268]</p><p>Fantastical mounts are not uncommon in the
        Inner Sea region, rife as it is with magic and the extraordinary. The
        Monstrous Mount Choices section below details monsters that are ridden
        primarily by cavaliers, rangers, and paladins. Taking on a monstrous
        mount requires
        @Compendium[pf-content.pf-feats.iM39jZGfK4LeFiVd]{Monstrous Companion},
        but otherwise uses the rules for the animal companion class feature.
        Unlocking the most useful abilities and powerful attacks of a monstrous
        mount requires a second feat.</p><hr
        /><p>@Compendium[pf-content.pf-companions.05MMkjlN0ScXUTBu]{Griffon}</p><p>@Compendium[pf-content.pf-companions.jOCVxnqdxoEELlcZ]{Hippocampus}</p><p>@Compendium[pf-content.pf-companions.7b62oYvW4q9S4say]{Hippogriff}</p><p>@Compendium[pf-content.pf-companions.lcFDUyu832CP1iQh]{Worg}</p>
