        <p>@Compendium[pf-content.pf-rules.4TX2Q1MaWt1B8298]{(Index)
        Items}</p><p>@Compendium[pf-content.pf-rules.j1KZwBRf9pU1Dg2C]{6.0.
        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p><strong>PFS
        Legal</strong></p><p>@Source[PZO1123;pages=53]</p><p>This black volcanic
        glass is extremely sharp, and can be shaped into a variety of weapons
        that deal piercing and slashing damage. Bits of obsidian inserted into a
        length of tempered wood create effective swords called terbutjes (see
        page 38).</p><p>Obsidian weapons cost half as much as base items of
        their type, and weigh 75% of what base items of their type
        do.</p><p>Obsidian can be used to craft light and one-handed weapons
        that deal piercing or slashing damage, as well as spear tips and
        arrowheads.</p><p>Obsidian weapons have half the hardness of their base
        weapons and have the fragile quality.</p><p>The fragile glass nature of
        obsidian is perfect for creating sharp points and blades, but those same
        qualities make it unsuitable for creating armor. Armor cannot be
        constructed from obsidian. Magically strengthened obsidian does not have
        the fragile quality, and can be made into any armor or weapon that can
        be made of stone.</p>
