        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p><strong>PFS
        Legal</strong></p><p>@Source[PZO1123;pages=51]</p><p>This rough-spun
        cloth, ranging in color from golden-brown to brown-black, is woven from
        the mane of leonine magical beasts, primarily griffons but also chimeras
        and manticores, and is exceptionally strong and light. Wearing a cloak,
        robe, clothing outfit, or padded or quilted armor made from griffon mane
        grants a +2 competence bonus on Fly checks. If an item made of griffon
        mane is magically given the ability to fly, the cost to add that
        specific magical property is reduced by 10%, though this does not reduce
        the cost of any other abilities the item has.</p><p>Griffon mane has
        twice the number of hit points of normal cloth and hardness
        1.</p><table><thead><tr><td>Type of Griffon Mane Item</td><td>Item Price
        Modifier</td></tr></thead><tbody><tr><td>Light armor</td><td>+200
        gp</td></tr><tr><td>Other items</td><td>+50
        gp/lb.</td></tr></tbody></table>
