      content: >-
        <p>@Compendium[pf-content.pf-rules.4TX2Q1MaWt1B8298]{(Index)
        Items}</p><p>@Compendium[pf-content.pf-rules.j1KZwBRf9pU1Dg2C]{6.0.
        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p>@Source[PZO9061;pages=71]</p><p>The
        rarest of the known skymetals, this dull, coppery substance warps time
        around it, making things seem to speed up or slow down. Horacalcum is
        associated with illusion magic, humility, and pride. Almost never found
        in amounts greater than a pound, horacalcum is the same weight and
        density as steel, but is much more durable. A weapon made of horacalcum
        gains a +1 circumstance bonus on attack rolls (ammunition can be made of
        horacalcum, but does not grant any bonus on attack rolls). An entire
        suit of armor made from this rare metal is fantastically expensive, but
        since a suit of horacalcum armor simultaneously allows its wearer to
        react more quickly while perceiving time more slowly, some consider the
        cost justifiable. A suit of light horacalcum armor grants a +1 bonus on
        Initiative checks, medium horacalcum armor grants a +2 bonus on
        Initiative checks, and heavy horacalcum armor grants a +3 bonus on
        Initiative checks. Weapons and armor made of horacalcum are always of
        masterwork quality—the masterwork cost is included in the prices given
        below.</p><p>Weapons and armor made of horacalcum have one-fourth more
        hit points than normal. Horacalcum has 30 hit points per inch of
        thickness and hardness 15. A weapon made of horacalcum costs +6,000 gp.
        Light armor costs +10,000 gp, medium armor +30,000 gp, and heavy armor
        +60,000 gp.</p>
