        /><p>@Source[PZO9479;pages=24]</p><p>Lazurite is a decayed form of a
        radioactive material no longer found in its natural form within the
        Darklands, said to be the remnants of a long-dead god. Lazurite is
        encountered exclusively in Sekamina, and appears as a crumbling black
        dust that emits a strong aura of necromancy. A corpse left within 30
        feet of a naturally occurring deposit of lazurite for 24 hours has a 50%
        chance of spontaneously reanimating as a free-willed ghoul (often with
        the class levels it had in life). All undead within an area of lazurite
        radiation gain a +4 bonus on Will saves to resist channeled
        energy.</p><h2>Lazurite-Bonded Armor</h2><p>While crafting lazurite
        equipment has proven to be a notoriously difficult feat, some
        artificers, particularly among Darklands ghouls, have concocted a means
        of coaxing small amounts of lazurite into sets of armor. These sets of
        armor include thin lines of blackened lazurite crisscrossing the regular
        surface of the armor. A creature wearing a set of lazurite-bonded armor
        gains a +2 bonus on saves to resist channeled energy and against cure
        spells. The wearer must attempt a Will save against positive energy
        channeling, regardless of whether it’s harmful or helpful to the wearer.
        A living creature slain while wearing lazurite-bonded armor has a 10%
        chance of spontaneously rising as a ghoul after 24 hours.</p><p>A set of
        light armor bonded with lazurite costs an additional 1,500 gp. A set of
        medium armor bonded with lazurite costs an additional 2,500 gp. A set of
        heavy armor bonded with lazurite costs an additional 3,500 gp.</p>
