        /><p>@Source[PZO1110;pages=180]</p><p>Generally, when you are subject to
        an unusual or magical attack, you get a saving throw to avoid or reduce
        the effect. Like an attack roll, a saving throw is a d20 roll plus a
        bonus based on your class and level, and an associated ability score.
        Your saving throw modifier is:</p><blockquote><p>Base save bonus +
        ability modifier</p></blockquote><h2>Saving Throw Types</h2><p>The three
        different kinds of saving throws are Fortitude, Reflex, and
        Will:</p><p><strong>Fortitude</strong>: These saves measure your ability
        to stand up to physical punishment or attacks against your vitality and
        health. Apply your Constitution modifier to your Fortitude saving
        throws.</p><p><strong>Reflex</strong>: These saves test your ability to
        dodge area attacks and unexpected situations. Apply your Dexterity
        modifier to your Reflex saving throws.</p><p><strong>Will</strong>:
        These saves ref lect your resistance to mental influence as well as many
        magical effects. Apply your Wisdom modifier to your Will saving
        throws.</p><h2>Saving Throw Difficulty Class</h2><p>The DC for a save is
        determined by the attack itself.</p><h2>Automatic Failures and
        Successes</h2><p>A natural 1 (the d20 comes up 1) on a saving throw is
        always a failure (and may cause damage to exposed items; see Items
        Surviving after a Saving Throw on page 217). A natural 20 (the d20 comes
        up 20) is always a success.</p>
