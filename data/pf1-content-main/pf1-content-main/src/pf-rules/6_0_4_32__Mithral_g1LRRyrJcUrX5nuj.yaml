    text:
      content: >-
        <p>@Compendium[pf-content.pf-rules.4TX2Q1MaWt1B8298]{(Index)
        Items}</p><p>@Compendium[pf-content.pf-rules.j1KZwBRf9pU1Dg2C]{6.0.
        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p><strong>PFS
        Legal</strong></p><p>@Source[PZO1123;pages=51],
        @Source[PZO1110;pages=154]</p><p>Mithral is a rare, silvery metal that
        is lighter than steel but just as hard. When worked like steel, it can
        be used to create amazing armor, and is occasionally used for other
        items as well. Most mithral armors are one category lighter than normal
        for purposes of movement and other limitations. Heavy armors are treated
        as medium, and medium armors are treated as light, but light armors are
        still treated as light. This decrease does not apply to proficiency in
        wearing the armor. A character wearing mithral full plate must be
        proficient in wearing heavy armor to avoid adding the armor’s check
        penalty on all his attack rolls and skill checks that involve moving.
        Spell failure chances for armors and shields made from mithral are
        decreased by 10%, maximum Dexterity bonuses are increased by 2, and
        armor check penalties are decreased by 3 (to a minimum of 0).</p><p>An
        item made from mithral weighs half as much as the same item made from
        other metals. In the case of weapons, this lighter weight does not
        change a weapon’s size category or the ease with which it can be wielded
        (whether it is light, one-handed, or two-handed). Items not primarily of
        metal are not meaningfully affected by being partially made of mithral.
        (A longsword can be a mithral weapon, while a quarterstaff cannot.)
        Mithral weapons count as silver for the purpose of overcoming damage
        reduction.</p><p>Weapons and armors fashioned from mithral are always
        masterwork items as well; the masterwork cost is included in the prices
        given below.</p><p>Mithral has 30 hit points per inch of thickness and
        hardness 15.</p><table><thead><tr><td>Type of Mithral Item</td><td>Item
        Price Modifier</td></tr></thead><tbody><tr><td>Light
        armor</td><td>+1,000 gp</td></tr><tr><td>Medium armor</td><td>+4,000
        gp</td></tr><tr><td>Heavy armor</td><td>+9,000
        gp</td></tr><tr><td>Shield</td><td>+1,000 gp</td></tr><tr><td>Other
        items</td><td>+500 gp/lb.</td></tr></tbody></table>
