        /><p>@Source[PZO1110;pages=484]</p><p>Rods are scepter-like devices that
        have unique magical powers and do not usually have charges. Anyone can
        use a rod.</p><h2>Physical Description</h2><p>Rods weigh approximately 5
        pounds. They range from 2 feet to 3 feet long and are usually made of
        iron or some other metal. (Many, as noted in their descriptions, can
        function as light maces or clubs due to their hardy construction.) These
        sturdy items have AC 9, 10 hit points, hardness 10, and a break DC of
        27.</p><h2>Activation</h2><p>Details relating to rod use vary from item
        to item. Unless noted otherwise, you must be holding a rod to use its
        abilities. See the individual descriptions for specifics. Special
        Qualities: Roll d%. A 01 result indicates the rod is intelligent, 02–31
        indicates that something (a design, inscription, or the like) provides a
        clue to its function, and 32– 100 indicates no special qualities.
        Intelligent items have extra abilities and sometimes extraordinary
        powers and special purposes (see Intelligent Items later in this
        chapter).</p><p>Rods with charges can never be intelligent.</p>
