        /><p>@Source[PZO1110;pages=461]</p><p>In general, magic armor protects
        the wearer to a greater extent than nonmagical armor. Magic armor
        bonuses are enhancement bonuses, never rise above +5, and stack with
        regular armor bonuses (and with shield and magic shield enhancement
        bonuses). All magic armor is also masterwork armor, reducing armor check
        penalties by 1.</p><p>In addition to an enhancement bonus, armor may
        have special abilities. Special abilities usually count as additional
        bonuses for determining the market value of an item, but do not improve
        AC. A suit of armor cannot have an effective bonus (enhancement plus
        special ability bonus equivalents, including from character abilities
        and spells) higher than +10. A suit of armor with a special ability must
        also have at least a +1 enhancement bonus.</p><p>A suit of armor or a
        shield may be made of an unusual material.</p><p>Roll d%: 01–95
        indicates that the item is of a standard sort, and 96–100 indicates that
        it is made of a special material (see Chapter 6).</p><p>Armor is always
        created so that if the type of armor comes with a pair of boots, a helm,
        or a set of gauntlets, these pieces can be switched for other magic
        boots, helms, or gauntlets.</p><h2>Caster Level for Armor and
        Shields</h2><p>The caster level of a magic shield or magic armor with a
        special ability is given in the item description. For an item with only
        an enhancement bonus, the caster level is three times the enhancement
        bonus. If an item has both an enhancement bonus and a special ability,
        the higher of the two caster level requirements must be
        met.</p><h2>Shields</h2><p>Shield enhancement bonuses stack with armor
        enhancement bonuses. Shield enhancement bonuses do not act as attack or
        damage bonuses when the shield is used in a shield bash. The bashing
        special ability, however, does grant a +1 bonus on attack and damage
        rolls (see the special ability description).</p><p>A shield could be
        built that also acted as a magic weapon, but the cost of the enhancement
        bonus on attack rolls would need to be added into the cost of the shield
        and its enhancement bonus to AC.</p><p>As with armor, special abilities
        built into the shield add to the market value in the form of additions
        to the bonus of the shield, although they do not improve AC. A shield
        cannot have an effective bonus (enhancement plus special ability bonus
        equivalents) higher than +10. A shield with a special ability must also
        have at least a +1 enhancement bonus.</p><h2>Activation</h2><p>Usually a
        character benefits from magic armor and shields in exactly the way a
        character benefits from nonmagical armor and shields: by wearing them.
        If armor or a shield has a special ability that the user needs to
        activate, then the user usually needs to utter the command word (a
        standard action).</p><h2>Armor for Unusual Creatures</h2><p>The cost of
        armor for nonhumanoid creatures, as well as for creatures who are
        neither Small nor Medium, varies (see
        @Compendium[pf-content.pf-rules.ukz9B0kwM0KtLvRf]{6.0.3.2. Armor for
        Unusual Creatures}). The cost of the masterwork quality and any magical
        enhancement remains the same.</p><h2>Table 15-3: Armor and
        Shields</h2><table><tbody><tr><td><p>Minor</p></td><td><p>Medium</p></td><td><p>Major</p></td><td><p>Item</p></td><td><p>Base
