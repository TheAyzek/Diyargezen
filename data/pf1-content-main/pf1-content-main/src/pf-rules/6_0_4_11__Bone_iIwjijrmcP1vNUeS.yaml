        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p><strong>PFS
        Legal</strong></p><p>@Source[PZO1123;pages=52]</p><p>Bone can be used in
        place of wood and steel in weapons and armor. Other animal-based
        materials like horn, shell, and ivory also use the rules for bone weapon
        and armor. The cost of a bone weapon or bone armor is half the price of
        a normal weapon or armor of its type.</p><p>Light and one-handed melee
        weapons, as well as twohanded weapons that deal bludgeoning damage only,
        can be crafted from bone. Hafted two-handed weapons such as spears can
        be crafted with bone tips, as can arrowheads. Other two-handed weapons
        cannot be constructed of bone.</p><p>Bone weapons have half the hardness
        of their base weapons and have the fragile weapon quality. Masterwork
        bone weapons also have the fragile quality, but magic bone weapons do
        not. Bone weapons take a –2 penalty on damage rolls (minimum 1
        damage).</p><p>Studded leather, scale mail, breastplates, and wooden
        shields can all be constructed using bone. Bone either replaces the
        metal components of the armor, or in the case of wooden shields, large
        pieces of bone or shell replace the wood.</p><p>Bone armor has hardness
        5 and has the fragile armor quality. Masterwork bone armor also has the
        fragile quality, but magic bone armor does not. The armor/shield bonus
        of bone armor is reduced by 1, but in the case of studded leather, the
        armor check penalty is also reduced by 1 (to 0). Magically strengthened
        bone does not have the fragile quality or reduced armor/shield
        bonus.</p>
