        @UUID[Compendium.pf1.pf1e-rules.JournalEntry.x175kVqUfLGPt8tC.JournalEntryPage.wRWHk7tCUHR99PzD]{Stealth}</p><p>@UUID[Compendium.pf1.pf1e-rules.JournalEntry.x175kVqUfLGPt8tC.JournalEntryPage.pLdYavy4nssLEoGV]{Survival}
        @UUID[Compendium.pf1.pf1e-rules.JournalEntry.x175kVqUfLGPt8tC.JournalEntryPage.xhmDhOXuBbfVcD0Q]{Swim}
        @UUID[Compendium.pf1.pf1e-rules.JournalEntry.x175kVqUfLGPt8tC.JournalEntryPage.A8j7nF6qHwuGEC2E]{Use
        Magic Device}</p><hr /><p>Skill descriptions adhere to the following
        guidelines.</p><h2>Skill Name</h2><p>The skill name line includes (in
        addition to the name of the skill) the following information.</p><h2>Key
        Ability</h2><p>The abbreviation of the ability whose modif ier applies
        to the skill check.</p><h2>Trained Only</h2><p>If this notation is
        included in the skill name line, you must have at least 1 rank in the
        skill to use it. If this notation is omitted, the skill can be used
        untrained (with a rank of 0). If any special notes apply to trained or
        untrained use, they are covered in the Untrained section (see
        below).</p><h2>Armor Check Penalty</h2><p>If this notation is included
        in the skill name line, an armor check penalty applies (see Chapter 6)
        to checks using this skill. If this entry is absent, an armor check
        penalty does not apply. Description: The skill name line is followed by
        a general description of what using the skill
        represents.</p><h2>Check</h2><p>What a character (“you” in the skill
        description) can do with a successful skill check and the check’s
        Difficulty Class (DC).</p><h2>Action</h2><p>The type of action using the
        skill requires, or the amount of time required for a check.</p><h2>Try
        Again</h2><p>Any conditions that apply to successive attempts to use the
        skill successfully. If the skill doesn’t allow you to attempt the same
        task more than once, or if failure carries an inherent penalty (such as
        with the Climb skill), you can’t take 20. If this paragraph is omitted,
        the skill can be retried without any inherent penalty other than the
        additional time required.</p><h2>Special</h2><p>Any extra facts that
        apply to the skill, such as special effects deriving from its use or
        bonuses that certain characters receive because of class, feat choices,
        or race.</p><h2>Restriction</h2><p>The full utility of certain skills is
        restricted to characters of certain classes. This entry indicates
        whether any such restrictions exist for the
        skill.</p><h2>Untrained</h2><p>This entry indicates what a character
        without at least 1 rank in the skill can do with it. If this entry
        doesn’t appear, it means that the skill functions normally for untrained
        characters (if it can be used untrained) or that an untrained character
        can’t attempt checks with this skill (for skills that are designated
        “Trained Only”).</p><h2>Table 4-3: Skill
