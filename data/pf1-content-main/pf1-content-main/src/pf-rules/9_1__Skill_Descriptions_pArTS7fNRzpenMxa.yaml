        /><p>@Source[PZO1110;pages=87]</p><p>This section describes each skill,
        including common uses and typical modif iers. Characters can sometimes
        use skills for purposes other than those noted here, at the GM’s
        discretion. For a complete summary of all of the skills, see Table
        4–3.</p><hr /><p><strong>For Quick DC reference
        see</strong>:</p><ul><li>@Compendium[pf-content.gm-quick-reference.24U2PomHrVNzqRov]{Skill
        Check DC's}
        or</li><li>@Compendium[pf-content.gm-quick-reference.d0Tsfz1VOUYZYaX7]{Knowledge
        Check DC's}</li><li><p></p></li></ul><p><strong>For specific rules on
        each skill
        see</strong>:</p><p>@UUID[Compendium.pf1.pf1e-rules.JournalEntry.x175kVqUfLGPt8tC.JournalEntryPage.gGfJO90ZuRT4sZ9X]{Acrobatics}
