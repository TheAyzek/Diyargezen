        /><p>@Source[PZO1110;pages=554]</p><p>Some spells and abilities increase
        your ability scores. Ability score increases with a duration of 1 day or
        less give only temporary bonuses. For every two points of increase to a
        single ability, apply a +1 bonus to the skills and statistics listed
        with the relevant ability.</p><h2>Strength</h2><p>Temporary increases to
        your Strength score give you a bonus on Strength-based skill checks,
        melee attack rolls, and weapon damage rolls (if they rely on Strength).
        The bonus also applies to your Combat Maneuver Bonus (if you are Small
        or larger) and to your Combat Maneuver
        Defense.</p><h2>Dexterity</h2><p>Temporary increases to your Dexterity
        score give you a bonus on Dexterity-based skill checks, ranged attack
        rolls, initiative checks, and Ref lex saving throws. The bonus also
        applies to your Armor Class, your Combat Maneuver Bonus (if you are Tiny
        or smaller), and your Combat Maneuver
        Defense.</p><h2>Constitution</h2><p>Temporary increases to your
        Constitution score give you a bonus on your Fortitude saving throws. In
        addition, multiply your total Hit Dice by this bonus and add that amount
        to your current and total hit points. When the bonus ends, remove this
        total from your current and total hit
        points.</p><h2>Intelligence</h2><p>Temporary increases to your
        Intelligence score give you a bonus on Intelligence-based skill checks.
        This bonus also applies to any spell DCs based on
        Intelligence.</p><h2>Wisdom</h2><p>Temporary increases to your Wisdom
        score give you a bonus on Wisdom-based skill checks and Will saving
        throws. This bonus also applies to any spell DCs based on
        Wisdom.</p><h2>Charisma</h2><p>Temporary increases to your Charisma
        score give you a bonus on Charisma-based skill checks. This bonus also
        applies to any spell DCs based on Charisma and the DC to resist your
        channeled energy.</p><h2>Permanent Bonuses</h2><p>Ability bonuses with a
        duration greater than 1 day actually increase the relevant ability score
        after 24 hours. Modify all skills and statistics related to that
        ability. This might cause you to gain skill points, hit points, and
        other bonuses. These bonuses should be noted separately in case they are
        removed.</p>
