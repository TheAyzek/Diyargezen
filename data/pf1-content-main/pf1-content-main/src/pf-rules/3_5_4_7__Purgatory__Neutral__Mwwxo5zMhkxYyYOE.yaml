        /><p>@Source[PZO1114;pages=193]</p><p>Every soul passes through
        Purgatory to be judged before being sent on to its final destination in
        the Great Beyond. Vast graveyards and wastelands fill its gloomy
        expanses, along with dusty, echoing courts for the judgment of the dead.
        Purgatory is home to the aeons, a race who embody the dualistic nature
        of existence and who are constantly both at war and at peace with each
        other and themselves.</p><h2>Planar Traits</h2><p>Purgatory has the
        following traits:</p><ul><li><strong>Timeless</strong>: Age, hunger,
        thirst, afflictions (such as diseases, curses, and poisons), and natural
        healing don’t function in Purgatory, though they resume functioning when
        the traveler leaves Purgatory.</li><li><strong>Divinely
        Morphic</strong>: Deities with domains in Purgatory can alter the plane
        at will.</li><li><strong>Strongly
        Neutral-Aligned</strong></li><li><strong>Enhanced Magic</strong>: Spells
        and spell-like abilities with the death descriptor, or from the Death or
        Repose domains, are enhanced.</li></ul>
