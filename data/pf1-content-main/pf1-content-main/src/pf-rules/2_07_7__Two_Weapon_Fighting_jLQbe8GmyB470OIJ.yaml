        /><p>@Source[PZO1110;pages=202]</p><p>If you wield a second weapon in
        your off hand, you can get one extra attack per round with that weapon.
        You suffer a –6 penalty with your regular attack or attacks with your
        primary hand and a –10 penalty to the attack with your off hand when you
        fight this way. You can reduce these penalties in two ways.</p><p>First,
        if your off-hand weapon is light, the penalties are reduced by 2 each.
        An unarmed strike is always considered light. Second, the Two-Weapon
        Fighting feat lessens the primary hand penalty by 2, and the off-hand
        penalty by 6.</p><p>Table 8–7 summarizes the interaction of all these
        factors.</p><h2>Double Weapons</h2><p>You can use a double weapon to
        make an extra attack with the off-hand end of the weapon as if you were
        fighting with two weapons. The penalties apply as if the off-hand end of
        the weapon was a light weapon.</p><h2>Thrown Weapons</h2><p>The same
        rules apply when you throw a weapon from each hand. Treat a dart or
        shuriken as a light weapon when used in this manner, and treat a bolas,
        javelin, net, or sling as a one-handed weapon.</p><h2>Table 8-7:
        Two-Weapon Fighting
        Penalties</h2><table><thead><tr><td>Circumstances</td><td>Primary
        Hand</td><td>Off Hand</td></tr></thead><tbody><tr><td>Normal
        penalties</td><td>-6</td><td>-10</td></tr><tr><td>Off-hand weapon is
        light</td><td>-4</td><td>-8</td></tr><tr><td>Two-Weapon Fighting
        feat</td><td>-4</td><td>-4</td></tr><tr><td>Off-hand weapon is light and
        Two-Weapon Fighting feat</td><td>-2</td><td>-2</td></tr></tbody></table>
