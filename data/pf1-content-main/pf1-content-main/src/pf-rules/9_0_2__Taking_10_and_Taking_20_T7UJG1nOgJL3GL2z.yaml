        <p>@Compendium[pf-content.pf-rules.zUOuZVJH1nKufQSo]{(Index)
        Skills}</p><p>@Compendium[pf-content.pf-rules.lWtGhRUjHQa3Wd0W]{9.0.
        Acquiring
        Skills}</p><ul><li>@Compendium[pf-content.pf-rules.aUiz43uuVyTowC27]{9.0.1.
        Skill
        Checks}</li><li><strong>@Compendium[pf-content.pf-rules.T7UJG1nOgJL3GL2z]{9.0.2.
        Taking 10 and Taking
        20}</strong></li><li>@Compendium[pf-content.pf-rules.oHq025KMLI1X8ufB]{9.0.3.
        Aid Another}</li></ul><hr /><p>@Source[PZO1110;pages=86]</p><p>A skill
        check represents an attempt to accomplish some goal, usually while under
        some sort of time pressure or distraction. Sometimes, though, a
        character can use a skill under more favorable conditions, increasing
        the odds of success.</p><h2>Taking 10</h2><p>When your character is not
        in immediate danger or distracted, you may choose to take 10. Instead of
        rolling 1d20 for the skill check, calculate your result as if you had
        rolled a 10. For many routine tasks, taking 10 makes them automatically
        successful. Distractions or threats (such as combat) make it impossible
        for a character to take 10. In most cases, taking 10 is purely a safety
        measure—you know (or expect) that an average roll will succeed but fear
        that a poor roll might fail, so you elect to settle for the average roll
        (a 10). Taking 10 is especially useful in situations where a
        particularly high roll wouldn’t help.</p><h2>Taking 20</h2><p>When you
        have plenty of time, you are faced with no threats or distractions, and
        the skill being attempted carries no penalties for failure, you can take
        20. In other words, if you roll a d20 enough times, eventually you will
        get a 20. Instead of rolling 1d20 for the skill check, just calculate
        your result as if you had rolled a 20.</p><p>Taking 20 means you are
        trying until you get it right, and it assumes that you fail many times
        before succeeding. Taking 20 takes 20 times as long as making a single
        check would take (usually 2 minutes for a skill that takes 1 round or
        less to perform).</p><p>Since taking 20 assumes that your character will
        fail many times before succeeding, your character would automatically
        incur any penalties for failure before he or she could complete the task
        (hence why it is generally not allowed with skills that carry such
        penalties). Common “take 20” skills include Disable Device (when used to
        open locks), Escape Artist, and Perception (when attempting to find
        traps).</p><h2>Ability Checks and Caster Level Checks</h2><p>The normal
        take 10 and take 20 rules apply for ability checks.</p><p>Neither rule
        applies to concentration checks or caster level checks.</p>
