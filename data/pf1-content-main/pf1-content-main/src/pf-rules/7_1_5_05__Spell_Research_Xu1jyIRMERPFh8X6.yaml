        /><p>@Source[PZO1117;pages=129]</p><p>The game rules for what a caster
        must do to create a new spell are very vague (see Independent Research
        from the Core Rulebook). This is because, like the details of creating
        magic items, the nitty-gritty of what the caster is doing for this
        research isn't important for the progress of the campaign. Just as it's
        not necessary to know whether a wizard is using squid ink or ink from a
        rare plant when crafting a scroll of burning hands, it's not necessary
        to know whether he's modifying gestures described in Irulark's
        Incunabulum or altering the pronunciation of words detailed in Murlost's
        Great Grimoire to create a new 1st-level attack spell.</p><p>While it's
        fine to include these elements for flavor, particularly in a
        high-narrative campaign, they don't affect the outcome of the item
        crafting or spell research, both of which largely take place outside of
        game time. Therefore, this chapter is about the game mechanics of a
        player or GM designing a new spell, not the in-world requirements of a
        character researching a new spell.</p>
