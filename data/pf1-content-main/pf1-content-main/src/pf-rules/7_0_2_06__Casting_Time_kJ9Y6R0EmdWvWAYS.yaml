        /><p>@Source[PZO1110;pages=213]</p><p>Most spells have a casting time of
        1 standard action. Others take 1 round or more, while a few require only
        a swift action.</p><p>A spell that takes 1 round to cast is a full-round
        action. It comes into effect just before the beginning of your turn in
        the round after you began casting the spell. You then act normally after
        the spell is completed.</p><p>A spell that takes 1 minute to cast comes
        into effect just before your turn 1 minute later (and for each of those
        10 rounds, you are casting a spell as a full-round action, just as noted
        above for 1-round casting times). These actions must be consecutive and
        uninterrupted, or the spell automatically fails.</p><p>When you begin a
        spell that takes 1 round or longer to cast, you must continue the
        concentration from the current round to just before your turn in the
        next round (at least). If you lose concentration before the casting is
        complete, you lose the spell.</p><p>A spell with a casting time of 1
        swift action doesn’t count against your normal limit of one spell per
        round. However, you may cast such a spell only once per round. Casting a
        spell with a casting time of 1 swift action doesn’t provoke attacks of
        opportunity.</p><p>You make all pertinent decisions about a spell
        (range, target, area, effect, version, and so forth) when the spell
        comes into effect.</p>
