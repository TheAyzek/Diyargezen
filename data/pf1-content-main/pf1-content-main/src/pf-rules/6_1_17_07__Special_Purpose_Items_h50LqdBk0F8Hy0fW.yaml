        /><p>@Source[PZO1110;pages=535]</p><p>Some intelligent items have
        special purposes that guide their actions. Intelligent magic items with
        a special purpose gain a +2 Ego bonus. An item’s purpose must suit the
        type and alignment of the item and should always be treated reasonably.
        A purpose of “defeat/slay arcane spellcasters” doesn’t mean that the
        sword forces the wielder to kill every wizard she sees. Nor does it mean
        that the sword believes it is possible to kill every wizard, sorcerer,
        and bard in the world. It does mean that the item hates arcane
        spellcasters and wants to bring the local wizards’ cabal to ruin, as
        well as end the rule of a sorcererqueen in a nearby land. Likewise, a
        purpose of “defend elves” doesn’t mean that if the wielder is an elf, he
        only wants to help the wielder. It means that the item wants to be used
        in furthering the cause of elves, stamping out their enemies and aiding
        their leaders. A purpose of “defeat/slay all” isn’t just a matter of
        self-preservation. It means that the item won’t rest (or let its wielder
        rest) until it places itself above all others.</p><p>Table 15–25 has a
        number of sample purposes that a magic item might possess. If the
        wielder specifically ignores or goes against an intelligent item’s
        special purpose, the item gains a +4 bonus to its Ego until the wielder
        cooperates. This is in addition to the +2 Ego bonus gained by items with
        a special purpose.</p><h2>Table 15–25: Intelligent Item
        Purpose</h2><table><thead><tr><td>d%</td><td>Purpose</td><td>Ego
        Modifier</td></tr></thead><tbody><tr><td>01–20</td><td>Defeat/slay
        diametrically opposed
        alignment*</td><td>+2</td></tr><tr><td>21–30</td><td>Defeat/slay arcane
        spellcasters (including spellcasting monsters and those that use
        spell-like
        abilities)</td><td>+2</td></tr><tr><td>31–40</td><td>Defeat/slay divine
        spellcasters (including divine entities and
        servitors)</td><td>+2</td></tr><tr><td>41–50</td><td>Defeat/slay
        non-spellcasters</td><td>+2</td></tr><tr><td>51–55</td><td>Defeat/slay a
        particular creature type (see the bane special ability for
        choices)</td><td>+2</td></tr><tr><td>56–60</td><td>Defeat/slay a
        particular race or kind of
        creature</td><td>+2</td></tr><tr><td>61–70</td><td>Defend a particular
        race or kind of
        creature</td><td>+2</td></tr><tr><td>71–80</td><td>Defeat/slay the
        servants of a specific
        deity</td><td>+2</td></tr><tr><td>81–90</td><td>Defend the servants and
        interests of a specific
        deity</td><td>+2</td></tr><tr><td>91–95</td><td>Defeat/slay all (other
        than the item and the
        wielder)</td><td>+2</td></tr><tr><td>96–100</td><td>Choose
        one</td><td>+2</td></tr></tbody></table><p>* The purpose of the neutral
        (N) version of this item is to preserve the balance by defeating/slaying
        powerful beings of the extreme alignments (LG, LE, CG, CE).</p>
