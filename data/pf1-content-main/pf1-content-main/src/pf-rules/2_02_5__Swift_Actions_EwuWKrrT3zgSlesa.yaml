        /><p>@Source[PZO1110;pages=188]</p><p>A swift action consumes a very
        small amount of time, but represents a larger expenditure of effort than
        a free action. You can perform one swift action per turn without
        affecting your ability to perform other actions. In that regard, a swift
        action is like a free action. You can, however, perform only one single
        swift action per turn, regardless of what other actions you take. You
        can take a swift action anytime you would normally be allowed to take a
        free action. Swift actions usually involve spellcasting, activating a
        feat, or the activation of magic items.</p>
