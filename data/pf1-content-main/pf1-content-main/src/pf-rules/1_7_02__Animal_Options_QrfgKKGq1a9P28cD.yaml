        /><p>@Source[PZO1110]</p><p>Each animal companion has different starting
        sizes, speed, attacks, ability scores, and special qualities. All animal
        attacks are made using the creature's full base attack bonus unless
        otherwise noted. Animal attacks add the animal's Strength modifier to
        the damage roll, unless it is its only attack, in which case it adds
        1-1/2 its Strength modifier. Some have special abilities, such as
        scent.</p><p>See Special Abilities for more information on these
        abilities.</p><p>As you gain levels, your animal companion improves as
        well, usually at 4th or 7th level, in addition to the standard bonuses
        noted on @Compendium[pf-content.pf-rules.sjhxRhOgV3ynmqf9]{1.7. Animal
        Companions}. Instead of taking the listed benefit at 4th or 7th level,
        you can instead choose to increase the companion's Dexterity and
        Constitution by 2.</p><hr
