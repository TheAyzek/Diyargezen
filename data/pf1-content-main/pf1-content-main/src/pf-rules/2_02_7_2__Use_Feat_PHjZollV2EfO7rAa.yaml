        /><p>@Source[PZO1110;pages=189]</p><p>Certain feats let you take special
        actions in combat. Other feats do not require actions themselves, but
        they give you a bonus when attempting something you can already do. Some
        feats are not meant to be used within the framework of combat. The
        individual feat descriptions tell you what you need to know about
        them.</p>
