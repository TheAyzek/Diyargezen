        /><p>@Source[PZO1110;pages=551]</p><p>To create a magic ring, a
        character needs a heat source. He also needs a supply of materials, the
        most obvious being a ring or the pieces of the ring to be assembled. The
        cost for the materials is subsumed in the cost for creating the ring.
        Ring costs are difficult to determine. Refer to Table 15–29 and use the
        ring prices in the ring descriptions as a guideline. Creating a ring
        generally costs half the ring’s market price.</p><p>Rings that duplicate
        spells with costly material components add in the value of 50 × the
        spell’s component cost. Having a spell with a costly component as a
        prerequisite does not automatically incur this cost. The act of working
        on the ring triggers the prepared spells, making them unavailable for
        casting during each day of the ring’s creation. (That is, those spell
        slots are expended from the caster’s currently prepared spells, just as
        if they had been cast.)</p><p>Creating some rings may entail other
        prerequisites beyond or other than spellcasting. See the individual
        descriptions for details.</p><p>Forging a ring requires 1 day for each
        1,000 gp of the base price.</p><h2>Item Creation Feat
        Required</h2><p>Forge Ring.</p><h2>Skill Used in
        Creation</h2><p>Spellcraft or Craft ( jewelry).</p>
