        /><p>@Source[PZO1110;pages=535]</p><p>Ego is a measure of the total
        power and force of personality that an item possesses. An item’s Ego
        score is the sum of all of its Ego modifiers plus an additional bonus
        for the cost of the base magic item (excluding the cost of all of the
        intelligent item enhancements). An item’s Ego score helps determine
        whether the item or the character is dominant in their relationship, as
        detailed below.</p><table><thead><tr><td>Base Magic Item
        Value</td><td>Ego Modifier</td></tr></thead><tbody><tr><td>Up to 1,000
        gp</td><td>—</td></tr><tr><td>1,001 gp to 5,000
        gp</td><td>+1</td></tr><tr><td>5,001 gp to 10,000
        gp</td><td>+2</td></tr><tr><td>10,001 gp to 20,000
        gp</td><td>+3</td></tr><tr><td>20,001 gp to 50,000
        gp</td><td>+4</td></tr><tr><td>50,001 gp to 100,000
        gp</td><td>+6</td></tr><tr><td>100,001 gp to 200,000
        gp</td><td>+8</td></tr><tr><td>200,001 gp and
        higher</td><td>+12</td></tr></tbody></table>
