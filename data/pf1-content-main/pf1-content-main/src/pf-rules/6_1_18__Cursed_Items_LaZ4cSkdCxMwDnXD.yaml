        /><p>@Source[PZO1110;pages=536]</p><p>Cursed items are magic items with
        some sort of potentially negative impact. Occasionally they mix bad with
        good, forcing characters to make difficult choices. Cursed items are
        almost never made intentionally. Instead they are the result of rushed
        work, inexperienced crafters, or a lack of proper components. While many
        of these items still have functions, they either do not work as intended
        or come with serious drawbacks. When a magic item creation skill check
        fails by 5 or more, roll on Table 15–27 to determine the type of curse
        possessed by the item.</p><h2>Identifying Cursed Items</h2><p>Cursed
        items are identified like any other magic item with one exception:
        unless the check made to identify the item exceeds the DC by 10 or more,
        the curse is not detected. If the check is not made by 10 or more, but
        still succeeds, all that is revealed is the magic item’s original
        intent. If the item is known to be cursed, the nature of the curse can
        be determined using the standard DC to identify the
        item.</p><h2>Removing Cursed Items</h2><p>While some cursed items can be
        simply discarded, others force a compulsion upon the user to keep the
        item, no matter the costs. Others reappear even if discarded or are
        impossible to throw away. These items can only be discarded after the
        character or item is targeted by a remove curse or similar magic. The DC
        of the caster level check to undo the curse is equal to 10 + the item’s
        caster level. If the spell is successful, the item can be discarded on
        the following round, but the curse reasserts itself if the item is used
        again.</p>
