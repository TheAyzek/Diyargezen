        /><p>@Source[PZO1110;pages=564]</p><p>Spells, magic items, and certain
        monsters can affect characters with fear. In most cases, the character
        makes a Will saving throw to resist this effect, and a failed roll means
        that the character is shaken, frightened, or
        panicked.</p><h2>Shaken</h2><p>Characters who are shaken take a –2
        penalty on attack rolls, saving throws, skill checks, and ability
        checks.</p><h2>Frightened</h2><p>Characters who are frightened are
        shaken, and in addition they flee from the source of their fear as
        quickly as they can. They can choose the paths of their flight. Other
        than that stipulation, once they are out of sight (or hearing) of the
        source of their fear, they can act as they want. If the duration of
        their fear continues, however, characters can be forced to flee if the
        source of their fear presents itself again. Characters unable to flee
        can fight (though they are still
        shaken).</p><h2>Panicked</h2><p>Characters who are panicked are shaken,
        and they run away from the source of their fear as quickly as they can,
        dropping whatever they are holding. Other than running away from the
        source, their paths are random. They flee from all other dangers that
        confront them rather than facing those dangers. Once they are out of
        sight (or hearing) of any source of danger, they can act as they want.
        Panicked characters cower if they are prevented from
        fleeing.</p><h2>Becoming Even More Fearful</h2><p>Fear effects are
        cumulative. A shaken character who is made shaken again becomes
        frightened, and a shaken character who is made frightened becomes
        panicked instead. A frightened character who is made shaken or
        frightened becomes panicked instead.</p>
