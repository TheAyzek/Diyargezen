        /><p>@Source[PZO1110;pages=206]</p><p>From creating a wisp of light to
        causing the ground itself to shatter and break, spells are a source of
        immense power. A spell is a one-time magical effect. Spells come in two
        types: arcane (cast by bards, sorcerers, and wizards) and divine (cast
        by clerics, druids, and experienced paladins and rangers). Some
        spellcasters select their spells from a limited list of spells known,
        while others have access to a wide variety of options.</p><p>Most
        spellcasters prepare spells in advance—whether from a spellbook or
        through prayers—while some cast spells spontaneously without
        preparation. Despite these different ways characters use to learn or
        prepare their spells, when it comes to casting them, the spells are very
        much alike.</p>
