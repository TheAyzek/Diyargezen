        /><p>@Source[PZO1110;pages=440]</p><p>The four classic Inner Planes are
        the Plane of Air, the Plane of Earth, the Plane of Fire, and the Plane
        of Water—it is from these planes that the creatures known as elementals
        hail, yet they house many other strange denizens as well, such as the
        genie races, strange metal-eating xorns, unseen invisible stalkers, and
        mischievous
        mephits.</p><ul><li><p>@UUID[Compendium.pf-content.pf-rules.JournalEntry.mDgGgG7B4Ox86IEq]{3.5.3.1.1.
