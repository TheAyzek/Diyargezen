        Combat}</p><ul><li>@Compendium[pf-content.pf-rules.ryYgy2vRvnwdlDVK]{2.11.1.
        Firearms}</li><li>@Compendium[pf-content.pf-rules.Kvr4RvD9NW9Ftus1]{2.11.2.
