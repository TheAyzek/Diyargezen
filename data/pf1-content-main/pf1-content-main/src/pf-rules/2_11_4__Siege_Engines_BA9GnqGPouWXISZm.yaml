        Combat}</li><li><strong>@Compendium[pf-content.pf-rules.BA9GnqGPouWXISZm]{2.11.4.
        Siege Engines}</strong></li></ul><hr
        /><p>@Source[PZO1118;pages=158]</p><p>A classic trope of fantasy warfare
        is the storming of a castle or other large fortification. Whether the
        PCs are leading a brave and desperate defense of a lonely bastion
        against an overwhelming army of darkness, or overseeing the fight to
        overthrow an evil ruler and cast down his mighty fortress, a fight along
        the battlements can fire the imagination of a jaded player who has grown
        bored with one-on-one hacking.</p><p>While historical sieges often
        depended more on disease and starvation for victory than anything else,
        the thrill for players is likely to come more from bombardment and
        assault with an array of siege engines, and countering the massive
        engines of their enemies with their own.</p><h1>New Rules</h1><p>The
        following new options for siege engines both supplement and expand upon
        the base rules. If the rules ever appear to be in conflict, use the
        rules
        below.</p><p>@Compendium[pf-content.pf-rules.1r4vHoZMGtSTTqJL]{2.11.4.1.
        Siege Engine
        Rules}</p><p>@Compendium[pf-content.pf-rules.fRkRfI16CX5G78Oy]{2.11.4.2.
        Siege Weapon
        Description}</p><p>@Compendium[pf-content.pf-rules.IMe9LQrT7kkBr8ew]{2.11.4.3.
        Structure Hardness and Hit
        Points}</p><p>@Compendium[pf-content.pf-rules.Rft1LIY5C8XOK3Kr]{2.11.4.4.
        Siege Engine Details}</p><h1>Basic Rules</h1><p>The basic rules for
        siege engines from the Core Rulebook are found
        below.</p><p>@Source[PZO1110;pages=434]</p><p>Siege engines are large
        weapons, temporary structures, or pieces of equipment traditionally used
        in besieging castles or fortresses.</p><p>Siege engines are treated as
        difficult devices if someone tries to disable them using Disable Device.
        This takes 2d4 rounds and requires a DC 20 Disable Device check. Siege
        engines are typically made out of wood and have an AC of 3 (–5 Dex, –2
        size), a Hardness of 5, and 80 hit points. Siege engines made up of a
        different material might have different values. Some siege engines are
        armored as well. Treat the siege engine as a Huge creature to determine
        the cost of such armor. Siege engines can be crafted as masterwork and
        enchanted as magic weapons, adding bonuses on attack rolls to the checks
        made to hit with the siege engine. A masterwork siege engine costs 300
        gp more than the listed price. Enchanting a siege engine costs twice the
        normal amount. For example, a +1 flaming heavy catapult, armored with
        full plate, would have an AC of 11 and would cost 23,100 gp (800 gp base
        + 6,000 gp for the armor + 300 gp masterwork + 16,000 gp for the
        enhancements).</p><h2>Catapult, Heavy</h2><p>A heavy catapult is a
        massive engine capable of throwing rocks or heavy objects with great
        force. Because the catapult throws its payload in a high arc, it can hit
        squares out of its line of sight. To fire a heavy catapult, the crew
        chief makes a special check against DC 15 using only his base attack
        bonus, Intelligence modifier, range increment penalty, and the
        appropriate modifiers from the lower section of Table 13–8. If the check
        succeeds, the catapult stone hits the square the catapult was aimed at,
        dealing the indicated damage to any object or character in the square.
        Characters who succeed on a DC 15 Reflex save take half damage. Once a
        catapult stone hits a square, subsequent shots hit the same square
        unless the catapult is reaimed or the wind changes direction or
        speed.</p><p>If a catapult stone misses, roll 1d8 to determine where it
        lands. This determines the misdirection of the throw, with 1 being back
        toward the catapult and 2 through 8 counting clockwise around the target
        square. Finally, count 1d4 squares away from the target square for every
        range increment of the attack.</p><p>Loading a catapult requires a
        series of full-round actions. It takes a DC 15 Strength check to winch
        the throwing arm down; most catapults have wheels to allow up to two
        crew members to use the aid another action, assisting the main winch
        operator. A DC 15 Profession (siege engineer) check latches the arm into
        place, and then another DC 15 Profession (siege engineer) check loads
        the catapult ammunition. It takes four fullround actions to reaim a
        heavy catapult (multiple crew members can perform these full-round
        actions in the same round, so it would take a crew of four only 1 round
        to reaim the catapult).</p><p>A heavy catapult takes up a space 15 feet
        across.</p><h2>Catapult, Light</h2><p>This is a smaller, lighter version
        of the heavy catapult. It functions as the heavy catapult, except that
        it takes a DC 10 Strength check to winch the arm into place, and only
        two full-round actions are required to reaim the catapult.</p><p>A light
        catapult takes up a space 10 feet across.</p><h2>Ballista</h2><p>A
        ballista is essentially a Huge heavy crossbow fixed in place. Its size
        makes it hard for most creatures to aim it. Thus, a Medium creature
        takes a –4 penalty on attack rolls when using a ballista, and a Small
        creature takes a –6 penalty. It takes a creature smaller than Large two
        full-round actions to reload the ballista after firing.</p><p>A ballista
        takes up a space 5 feet across.</p><h2>Ram</h2><p>This heavy pole is
        sometimes suspended from a movable scaffold that allows the crew to
        swing it back and forth against objects. As a full-round action, the
        character closest to the front of the ram makes an attack roll against
        the AC of the construction, applying the –4 penalty for lack of
        proficiency. It’s not possible to be proficient with this device. In
        addition to the damage given on Table 13–8, up to nine other characters
        holding the ram can add their Strength modifiers to the ram’s damage, if
        they devote an attack action to doing so. It takes at least one Huge or
        larger creature, two Large creatures, four Medium creatures, or eight
        Small creatures to swing a ram.</p><p>A ram is typically 30 feet long.
        In a battle, the creatures wielding the ram stand in two adjacent
        columns of equal length, with the ram between them.</p><h2>Siege
        Tower</h2><p>This device is a massive wooden tower on wheels or rollers
        that can be rolled up against a wall to allow attackers to scale the
        tower and thus get to the top of the wall with cover. The wooden walls
        are usually 1 foot thick.</p><p>A typical siege tower takes up a space
        15 feet across. The creatures inside push it at a base land speed of 10
        feet (and a siege tower can’t run). The eight creatures pushing on the
        ground floor have total cover, and those on higher floors get improved
        cover and can fire through arrow slits.</p><h2>Table 13-8: Seige
        Engines</h2><p>200 ft. (100 ft. minimum)150 ft. (100 ft. minimum)120
        ft.——</p><table><tbody><tr><td><p>Item</p></td><td><p>Cost</p></td><td><p>Damage</p></td><td><p>Critical</p></td><td><p>Range
        Increment</p></td><td><p>Typical Crew</p></td></tr><tr><td><p>Catapult,
        heavy</p></td><td><p>800
        gp</p></td><td><p>6d6</p></td><td><p>—</p></td><td></td><td><p>4</p></td></tr><tr><td><p>Catapult,
        light</p></td><td><p>550
        gp</p></td><td><p>4d6</p></td><td><p>—</p></td><td></td><td><p>2</p></td></tr><tr><td><p>Ballista</p></td><td><p>500
        gp</p></td><td><p>3d8</p></td><td><p>19-20</p></td><td></td><td><p>1</p></td></tr><tr><td><p>Ram</p></td><td><p>1,000
        gp</p></td><td><p>3d6*</p></td><td><p>—</p></td><td></td><td><p>10</p></td></tr><tr><td><p>Seige
        tower</p></td><td><p>2,000
        gp</p></td><td><p>—</p></td><td><p>—</p></td><td></td><td><p>20</p></td></tr></tbody></table><p>*
        See @Compendium[pf-content.pf-rules.Rft1LIY5C8XOK3Kr]{2.11.4.4. Siege
        Engine Details} for special rules.</p><h2>Catapult Attack
        Modifiers</h2><table><tbody><tr><td><p>Condition</p></td><td><p>Modifier</p></td></tr><tr><td><p>No
        line of sight to target
        square</p></td><td><p>-6</p></td></tr><tr><td><p>Successive shots (crew
        can see where most recent misses landed)</p></td><td><p>Cumulative +2
        per previous miss (maximum +10)</p></td></tr><tr><td><p>Successive shots
        (crew can’t see where most recent misses landed, but observer is
        providing feedback)</p></td><td><p>Cumulative +1 per previous miss
        (maximum +5)</p></td></tr></tbody></table>
