        /><p>@Source[PZO1110;pages=458]</p><p>To use a magic item, it must be
        activated, although sometimes activation simply means putting a ring on
        your f inger. Some items, once donned, function constantly. In most
        cases, though, using an item requires a standard action that does not
        provoke attacks of opportunity. By contrast, spell completion items are
        treated like spells in combat and do provoke attacks of
        opportunity.</p><p>Activating a magic item is a standard action unless
        the item description indicates otherwise. However, the casting time of a
        spell is the time required to activate the same power in an item,
        regardless of the type of magic item, unless the item description
        specifically states otherwise.</p><p>The four ways to activate magic
        items are described below.</p><h2>Spell Completion</h2><p>This is the
        activation method for scrolls. A scroll is a spell that is mostly
        finished. The preparation is done for the caster, so no preparation time
        is needed beforehand as with normal spellcasting. All that’s left to do
        is perform the finishing parts of the spellcasting (the final gestures,
        words, and so on). To use a spell completion item safely, a character
        must be of high enough level in the right class to cast the spell
        already. If he can’t already cast the spell, there’s a chance he’ll make
        a mistake. Activating a spell completion item is a standard action (or
        the spell’s casting time, whichever is longer) and provokes attacks of
        opportunity exactly as casting a spell does.</p><h2>Spell
        Trigger</h2><p>Spell trigger activation is similar to spell completion,
        but it’s even simpler. No gestures or spell finishing is needed, just a
        special knowledge of spellcasting that an appropriate character would
        know, and a single word that must be spoken. Spell trigger items can be
        used by anyone whose class can cast the corresponding spell. This is the
        case even for a character who can’t actually cast spells, such as a
        3rd-level paladin. The user must still determine what spell is stored in
        the item before she can activate it. Activating a spell trigger item is
        a standard action and does not provoke attacks of
        opportunity.</p><h2>Command Word</h2><p>If no activation method is
        suggested either in the magic item description or by the nature of the
        item, assume that a command word is needed to activate it. Command word
        activation means that a character speaks the word and the item
        activates. No other special knowledge is needed.</p><p>A command word
        can be a real word, but when this is the case, the holder of the item
        runs the risk of activating the item accidentally by speaking the word
        in normal conversation. More often, the command word is some seemingly
        nonsensical word, or a word or phrase from an ancient language no longer
        in common use. Activating a command word magic item is a standard action
        and does not provoke attacks of opportunity.</p><p>Sometimes the command
        word to activate an item is written right on the item. Occasionally, it
        might be hidden within a pattern or design engraved on, carved into, or
        built into the item, or the item might bear a clue to the command
        word.</p><p>The Knowledge (arcana) and Knowledge (history) skills might
        be useful in helping to identify command words or deciphering clues
        regarding them. A successful check against DC 30 is needed to come up
        with the word itself. If that check is failed, succeeding on a second
        check (DC 25) might provide some insight into a clue. The spells detect
        magic, identify, and analyze dweomer all reveal command words if the
        properties of the item are successfully identified.</p><h2>Use
        Activated</h2><p>This type of item simply has to be used in order to
        activate it. A character has to drink a potion, swing a sword, interpose
        a shield to def lect a blow in combat, look through a lens, sprinkle
        dust, wear a ring, or don a hat. Use activation is generally
        straightforward and self-explanatory.</p><p>Many use-activated items are
        objects that a character wears. Continually functioning items are
        practically always items that one wears. A few must simply be in the
        character’s possession (meaning on his person). However, some items made
        for wearing must still be activated. Although this activation sometimes
        requires a command word (see above), usually it means mentally willing
        the activation to happen. The description of an item states whether a
        command word is needed in such a case.</p><p>Unless stated otherwise,
        activating a use-activated magic item is either a standard action or not
        an action at all and does not provoke attacks of opportunity, unless the
        use involves performing an action that provokes an attack of opportunity
        in itself. If the use of the item takes time before a magical effect
        occurs, then use activation is a standard action. If the item’s
        activation is subsumed in its use and takes no extra time use,
        activation is not an action at all.</p><p>Use activation doesn’t mean
        that if you use an item, you automatically know what it can do. You must
        know (or at least guess) what the item can do and then use the item in
        order to activate it, unless the benef it of the item comes
        automatically, such as from drinking a potion or swinging a sword.</p>
