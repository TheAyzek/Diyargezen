        /><p>@Source[PZO1118;pages=177]</p><p>The following are some of the
        typical driving devices for vehicles, plus their usual Armor Class, hit
        points, and hardness. A broken driving device increases the driving
        check of the vehicle by 10. When a driving device is destroyed, a
        vehicle cannot be driven until the driving device is
        repaired.</p><table><tbody><tr><td><p>Reins</p></td><td><p>14</p></td><td><p>10</p></td><td><p>0</p></td></tr><tr><td><p>Rigging</p></td><td><p>9</p></td><td><p>5
        per square of sail</p></td><td><p>0</p></td></tr><tr><td><p>Steering
        Wheel</p></td><td><p>10</p></td><td><p>25</p></td><td><p>5</p></td></tr><tr><td><p>Throttle</p></td><td><p>12</p></td><td><p>15</p></td><td><p>5</p></td></tr><tr><td><p>Rudder</p></td><td><p>10</p></td><td><p>25</p></td><td><p>5</p></td></tr><tr><td><p>Magically
        Treated</p></td><td><p>—</p></td><td><p>x2</p></td><td><p>x2</p></td></tr></tbody></table>
