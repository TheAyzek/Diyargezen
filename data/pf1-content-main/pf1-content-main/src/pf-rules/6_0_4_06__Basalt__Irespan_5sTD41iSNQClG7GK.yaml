      content: >-
        <p>@Compendium[pf-content.pf-rules.4TX2Q1MaWt1B8298]{(Index)
        Items}</p><p>@Compendium[pf-content.pf-rules.j1KZwBRf9pU1Dg2C]{6.0.
        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p>@Source[PZO9248;pages=49]</p><p>The
        Irespan’s stones are infused with a unique variant of Thassilonian
        preservative magic. Scholars suspect that these features have grown in
        the stones of the bridge over the ages since Earthfall, and were not
        originally intended or even anticipated by the structure’s architects.
        Bridge stones harvested from underwater rubble or mined from offshore
        pilings are not only of great value to builders and sculptors, but also
        of particular interest to those seeking to create stone
        constructs.</p><h2>Physical Properties</h2><p>Irespan basalt is as hard
        as iron, while retaining its other stony features for carving and
        building. It has hardness 10 and typically fetches a price of about 5 sp
        per pound. However, since few buyers are interested in stones of less
        than 1,000 pounds, the Irespan basalt trade is relatively limited to
        specialists capable of harvesting and transporting such heavy
        blocks.</p><h2>Building Constructs</h2><p>When a construct’s materials
        consist entirely of Irespan stone, its Craft DC increases by +5, but the
        required Caster Level decreases by 1. In addition, stone constructs
        crafted from Irespan stone gain a +2 bonus to Strength and gain twice as
        many bonus hit points as normal from the construct type.</p>
