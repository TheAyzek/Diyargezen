        /><p>@Source[PZO1117;pages=103]</p><p>Alien, unemotional, and distant,
        aeons are difficult to deal with because of their strange form of
        communication, known as envisaging, in which they employ mental imagery
        and sounds instead of the symbolism of speech or writing to communicate
        their goals. Furthermore, aeons are often unyielding in their
        dichotomies, and are not swayed by argument or emotion toward any end. A
        spellcaster who binds an aeon had better hope his goals are in concert
        with those of the strange outsider, because that is the only way an aeon
        will offer its aid.</p><p>All aeons are immune to cold, poison, and
        critical hits, and have resistance to electricity and
        fire.</p><h2>Akhana (SR 23)</h2><p>Concerned with the duality of death
        and life, akhanas hunt for imbalances and rectify them with strange,
        seemingly random, efficiency. They do not justify their decisions or
        goals, which many summoners find intensely frustrating.</p><h2>Bythos
        (SR 27)</h2><p>Guardians of time and planar travel, bythos search for
        those who abuse time travel. They make deals with binders who have
        similar goals, and care nothing for the motivations of binders who do
        not share their concerns.</p><h2>Paracletus (SR 7)</h2><p>The most
        common aeon to interact with mortal spellcasters, paracletus actively
        search out spellcasters with strong emotion and logical capabilities.
        Some paracletus become familiars, experimenting upon their bonded
        casters with their emotion aura.</p><h2>Pleroma (SR 31)</h2><p>Many
        binders believe pleromas are too powerful to call and bind, and even if
        such a task is possible, trying to deal with such creatures of creation
        and destruction may be impossible. Of all the aeons, pleromas employ
        logic and methods that are least describable.</p><h2>Theletos (SR
        18)</h2><p>These guardians of freedom and fate often aid spellcasters in
        the pursuit of the former and the implementation of the latter, but like
        all aeons, their views on these subjects typically seem contradictory,
        and they are difficult to fully control or understand.</p>
