        /><p>@Source[PZO1110;pages=140]</p><p>Merchants commonly exchange trade
        goods without using currency. As a means of comparison, some trade goods
        are detailed on Table 6–3.</p><h2>Table 6-3: Trade
        Goods</h2><table><thead><tr><td>Cost</td><td>Item</td></tr></thead><tbody><tr><td>1
        cp</td><td>One pound of wheat</td></tr><tr><td>2 cp</td><td>One pound of
        flour, or one chicken</td></tr><tr><td>1 sp</td><td>One pound of
        iron</td></tr><tr><td>5 sp</td><td>One pound of tobacco or
        copper</td></tr><tr><td>1 gp</td><td>One pound of cinnamon, or one
        goat</td></tr><tr><td>2 gp</td><td>One pound of ginger or pepper, or one
        sheep</td></tr><tr><td>3 gp</td><td>One pig</td></tr><tr><td>4
        gp</td><td>One square yard of linen</td></tr><tr><td>5 gp</td><td>One
        pound of salt or silver</td></tr><tr><td>10 gp</td><td>One square yard
        of silk, or one cow</td></tr><tr><td>15 gp</td><td>One pound of saffron
        or cloves, or one ox</td></tr><tr><td>50 gp</td><td>One pound of
        gold</td></tr><tr><td>500 gp</td><td>One pound of
        platinum</td></tr></tbody></table>
