        /><p>@Source[PZO1110;pages=418]</p><p>If the builder of a trap wants to
        be able to move past the trap after it is created or placed, it’s a good
        idea to build in a bypass mechanism: something that temporarily disarms
        the trap. Bypass elements are typically used only with mechanical traps;
        spell traps usually have built-in allowances for the caster to bypass
        them.</p><h2>Lock</h2><p>A lock bypass requires a DC 30 Disable Device
        check to open.</p><h2>Hidden Switch</h2><p>A hidden switch requires a DC
        25 Perception check to locate.</p><h2>Hidden Lock</h2><p>A hidden lock
        combines the features above, requiring a DC 25 Perception check to
        locate and a DC 30 Disable Device check to open.</p>
