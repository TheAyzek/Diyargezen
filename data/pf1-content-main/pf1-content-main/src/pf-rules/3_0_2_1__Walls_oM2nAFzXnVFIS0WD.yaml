        Slimes, Molds, and Fungi}</li></ul><hr
        /><p>@Source[PZO1110;pages=410]</p><p>Masonry walls—stones piled on top
        of each other, usually but not always held in place with mortar—often
        divide dungeons into corridors and chambers. Dungeon walls can also be
        hewn from solid rock, leaving them with a rough, chiseled look. Still
        other dungeon walls can be the smooth, unblemished stone of a naturally
        occurring cave. Dungeon walls are difficult to break down or through,
        but they’re generally easy to climb.</p><h2>Masonry Walls</h2><p>The
        most common kind of dungeon wall, masonry walls are usually at least 1
        foot thick. Often, these ancient walls sport cracks and crevices, and
        sometimes dangerous slimes or small monsters live in these areas and
        wait for prey. Masonry walls stop all but the loudest noises. It takes a
        DC 20 Climb check to travel along a masonry wall.</p><h2>Superior
        Masonry Walls</h2><p>Sometimes masonry walls are better built (smoother,
        with tighter-fitting stones and less cracking), and occasionally these
        superior walls are covered with plaster or stucco. Covered walls often
        bear paintings, carved reliefs, or other decoration. Superior masonry
        walls are no more difficult to destroy than regular masonry walls but
        are more difficult to climb (DC 25).</p><h2>Reinforced Masonry
        Walls</h2><p>These are masonry walls with iron bars on one or both sides
        of the wall, or placed within the wall to strengthen it. The hardness of
        a reinforced wall remains the same, but its hit points are doubled and
        the Strength check DC to break through it is increased by
        10.</p><h2>Hewn Stone Walls</h2><p>Such walls usually result when a
        chamber or passage is tunneled out from solid rock. The rough surface of
        a hewn wall frequently provides minuscule ledges where fungus grows and
        fissures where vermin, bats, and subterranean snakes live. When such a
        wall has an “other side” (meaning it separates two chambers in the
        dungeon), the wall is usually at least 3 feet thick; anything thinner
        risks collapsing from the weight of all the stone overhead. It takes a
        DC 25 Climb check to climb a hewn stone wall.</p><p>Unworked Stone
        Walls</p><p>These surfaces are uneven and rarely flat. They are smooth
        to the touch but filled with tiny holes, hidden alcoves, and ledges at
        various heights. They’re also usually wet or at least damp, since it’s
        water that most frequently creates natural caves. When such a wall has
        an “other side,” the wall is usually at least 5 feet thick. It takes a
        DC 15 Climb check to move along an unworked stone wall.</p><h2>Iron
        Walls</h2><p>These walls are placed within dungeons around important
        places, such as vaults.</p><h2>Paper Walls</h2><p>Paper walls are placed
        as screens to block line of sight, but nothing more.</p><h2>Wooden
        Walls</h2><p>Wooden walls often exist as recent additions to older
        dungeons, used to create animal pens, storage bins, and temporary
        structures, or just to make a number of smaller rooms out of a larger
        one.</p><h2>Magically Treated Walls</h2><p>These walls are stronger than
        average, with a greater hardness, more hit points, and a higher break
        DC. Magic can usually double the hardness and hit points of a wall and
        add up to 20 to the break DC. A magically treated wall also gains a
        saving throw against spells that could affect it, with the save bonus
        equaling 2 + 1/2 the caster level of the magic reinforcing the wall.
        Creating a magic wall requires the Craft Wondrous Item feat and the
        expenditure of 1,500 gp for each 10-foot-by-10- foot wall
        section.</p><h2>Walls with Arrow Slits</h2><p>Walls with arrow slits can
        be made of any durable material but are most commonly masonry, hewn
        stone, or wood. Such a wall allows defenders to fire arrows or crossbow
        bolts at intruders from behind the safety of the wall. Archers behind
        arrow slits have improved cover that gives them a +8 bonus to Armor
        Class, a +4 bonus on Reflex saves, and the benefits of the improved
        evasion class feature.</p><h2>Table 13-1:
        Walls</h2><table><thead><tr><td>Wall Type</td><td>Typical
