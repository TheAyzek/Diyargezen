        /><p>@Source[PZO1110;pages=220]</p><p>Sorcerers and bards cast arcane
        spells, but they do not use spellbooks or prepare spells. Their class
        level limits the number of spells she can cast (see these class
        descriptions). Her high Charisma score might allow her to cast a few
        extra spells. A member of either class must have a Charisma score of at
        least 10 + the spell’s level to cast the spell.</p><h2>Daily Readying of
        Spells</h2><p>Each day, sorcerers and bards must focus their minds on
        the task of casting their spells. A sorcerer or bard needs 8 hours of
        rest ( just like a wizard), after which she spends 15 minutes
        concentrating. (A bard must sing, recite, or play an instrument of some
        kind while concentrating.) During this period, the sorcerer or bard
        readies her mind to cast her daily allotment of spells. Without such a
        period to refresh herself, the character does not regain the spell slots
        she used up the day before.</p><h2>Recent Casting Limit</h2><p>Any
        spells cast within the last 8 hours count against the sorcerer’s or
        bard’s daily limit.</p><h2>Adding Spells to a Sorcerer’s or Bard’s
        Repertoire</h2><p>A sorcerer or bard gains spells each time she attains
        a new level in her class and never gains spells any other way. When your
        sorcerer or bard gains a new level, consult Table 3–4 or Table 3–15 to
        learn how many spells from the appropriate spell list she now knows.
        With permission from the GM, sorcerers and bards can also select the
        spells they gain from new and unusual spells that they come across while
        adventuring.</p>
