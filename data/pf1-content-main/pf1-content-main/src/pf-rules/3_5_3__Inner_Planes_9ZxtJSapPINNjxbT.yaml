        /><p>@Source[PZO1110;pages=440]</p><p>The Inner Planes contain the
        building blocks of reality—it’s easiest to envision these planes as
        “containing” the Material Plane, but they do not overlap with the
        Material Plane as do the transitive planes. Each Inner Plane is made up
        of a single type of energy or element that overwhelms all others. The
        natives of a particular Inner Plane are made of the same energy or
        element as the plane itself.</p><p>Example Inner Planes include the
        following.</p><ul><li>@Compendium[pf-content.pf-rules.BtNqgktOkZENzN1c]{3.5.3.1.
        Elemental
        Planes}</li><li>@Compendium[pf-content.pf-rules.EQFsfwmMHxeX34rq]{3.5.3.2.
        Energy Planes}</li></ul>
