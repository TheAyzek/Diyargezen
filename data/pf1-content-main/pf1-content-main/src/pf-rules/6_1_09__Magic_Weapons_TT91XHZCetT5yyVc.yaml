        gp</td></tr><tr><td>—</td><td>—</td><td>—</td><td>+7<sup>2</sup></td><td>98,000
        gp</td></tr><tr><td>—</td><td>—</td><td>—</td><td>+8<sup>2</sup></td><td>128,000
        gp</td></tr><tr><td>—</td><td>—</td><td>—</td><td>+9<sup>2</sup></td><td>162,000
        gp</td></tr><tr><td>—</td><td>—</td><td>—</td><td>+10<sup>2</sup></td><td>200,000
        gp</td></tr><tr><td>86-90</td><td>63-68</td><td>50-63</td><td>Specifc
        weapon<sup>3</sup></td><td>—</td></tr><tr><td>92-100</td><td>69-100</td><td>64-100</td><td>Special
        ability and roll
        again<sup>4</sup></td><td>—</td></tr></tbody></table><p><br />1 For
        ammunition, this price is for 50 arrows, bolts, or bullets.<br />2 A
        weapon can’t have an enhancement bonus higher than +5. Use these lines
        to determine price when special abilities are added in.<br />3 See <a
        href="https://www.aonprd.com/MagicWeapons.aspx?Category=SpecificWeapon">here</a>.<br
        />4 See <a
        href="https://www.aonprd.com/MagicWeapons.aspx?Category=MeleeWeaponQuality">here
        for melee weapons</a> and <a
        href="https://www.aonprd.com/MagicWeapons.aspx?Category=RangedWeaponQuality">here
        for ranged weapons</a>.</p>
