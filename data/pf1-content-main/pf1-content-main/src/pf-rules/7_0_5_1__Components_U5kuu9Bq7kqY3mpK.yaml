        <p>@Compendium[pf-content.pf-rules.dS0UkKOINqI2iTDX]{(Index)
        Magic}</p><p>@Compendium[pf-content.pf-rules.VqmfepmRULVzQGwS]{7.0.
        Magic
        Basics}</p><ul><li><p>@Compendium[pf-content.pf-rules.dk6hyT5yIVDVTlU5]{7.0.5.
        Psychic
        Magic}</p><ul><li><strong>@Compendium[pf-content.pf-rules.U5kuu9Bq7kqY3mpK]{7.0.5.1.
        Components}</strong></li><li>@Compendium[pf-content.pf-rules.THcPcBnf09tYljUa]{7.0.5.2.
        Undercasting Spells}</li></ul></li></ul><hr
        /><p>@Source[PZO1132;pages=144]</p><p>Psychic magic originates from the
        distinctive qualities of the caster’s composite being, rather than
        through arcane formulae or rote supplication to divine entities.
        Therefore, psychic spells never have verbal or somatic components, and
        have only expensive material components. Psychic spells are purely
        mental actions, and they can be cast even while the caster is pinned or
        paralyzed. Focus components work the same way with psychic spells as
        they do with other spells.</p><p>When a spell calls for an expensive
        material component, a psychic spellcaster can instead use any item with
        both significant meaning and a value greater than or equal to the
        spell’s component cost. For example, if a spiritualist wanted to cast
        raise dead to bring her dead husband back from the grave, she could use
        her 5,000 gp wedding ring as the spell’s material
        component.</p><p>Instead of verbal and somatic components, all psychic
        spells have components related to the caster’s inner being. The two
        psychic components are called emotion components and thought components.
        If a spell’s components line lists a somatic component, that spell
        instead requires an emotion component when cast by psychic spellcasters,
        and if it has a verbal component, it instead requires a thought
        component when cast by psychic spellcasters. Psychic spells cast by
        non-psychic arcane and divine casters use any listed somatic and verbal
        components as normal.</p><h2>Emotion Components</h2><p>Emotion
        components represent a particular emotional state required to cast the
        spell. A psychic spellcaster marshals her desire in order to focus and
        release the spell’s energy. It is impossible to cast a spell with an
        emotion component while the spellcaster is under the inf luence of a
        non-harmless effect with the emotion or fear descriptors. (The emotion
        descriptor was originally introduced in Pathfinder RPG Ultimate Magic.)
        Even if the effect’s emotion matches the necessary emotion to cast the
        psychic spell, the spellcaster is not in control of her own desires and
        animal impulses, which is a necessary part of providing an emotion
        component.</p><h2>Thought Components</h2><p>Thought components represent
        mental constructs necessary for the spell’s function, such as picturing
        a wolf in vivid detail—down to the saliva dripping from its jaws—in
        order to cast beast shape to transform into a wolf. Thought components
        are so mentally demanding that they make interruptions and distractions
        extremely challenging. The DC for any concentration check for a spell
        with a thought component increases by 10. A psychic spellcaster casting
        a spell with a thought component can take a move action before beginning
        to cast the spell to center herself; she can then use the normal DC
        instead of the increased DC.</p><p>Just as spell-like abilities never
        require verbal, somatic, or material components, these abilities also
        don’t require thought or emotion components. A psychic spellcaster can
        replace verbal and somatic components with thought and emotion
        components only for the purposes of the spell components themselves, not
        for the purposes of any other rules elements that relate to verbal and
        somatic components. She can’t use Silent Spell to ignore the thought
        component of a spell, for example. The new feats Intuitive Spell and
        Logical Spell serve a similar function for these new
        components.</p><p>@Compendium[pf-content.pf-feats.wi6Oo8ZIpTfhIwOG]{Intuitive
        Spell}</p><p>@Compendium[pf-content.pf-feats.jFzlsdbPYzyLlEdD]{Logical
        Spell}</p>
