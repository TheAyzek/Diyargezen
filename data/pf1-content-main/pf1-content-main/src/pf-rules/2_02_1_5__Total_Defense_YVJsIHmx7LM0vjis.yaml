        /><p>@Source[PZO1110;pages=185]</p><p>You can defend yourself as a
        standard action. You get a +4 dodge bonus to your AC for 1 round. Your
        AC improves at the start of this action. You can’t combine total defense
        with fighting defensively or with the benefit of the Combat Expertise
        feat. You can’t make attacks of opportunity while using total
        defense.</p>
