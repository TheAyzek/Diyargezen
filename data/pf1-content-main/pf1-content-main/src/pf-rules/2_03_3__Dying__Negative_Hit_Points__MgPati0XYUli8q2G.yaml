        Nonlethal Damage}</li></ul><hr /><p>@Source[PZO1110;pages=189]</p><p>If
        your hit point total is negative, but not equal to or greater than your
        Constitution score, you’re
        @Compendium[pf1.conditions.BKxrsHSBNATa0e3D]{Dying}.</p><p>A dying
        character immediately falls unconscious and can take no actions.</p><p>A
        dying character loses 1 hit point every round. This continues until the
        character dies or becomes stable.</p>
