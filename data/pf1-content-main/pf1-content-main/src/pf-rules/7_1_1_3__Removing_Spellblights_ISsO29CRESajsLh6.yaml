        /><p>@Source[PZO1117;pages=94]</p><p>While the most severe symptoms of a
        spellblight may manifest only episodically, the condition is often
        tenacious and difficult to remove. Each spellblight lists conditions for
        its removal, and can also be removed as if it were a curse (with remove
        curse, break enchantment, and so on). The caster level check DC to
        remove a minor spellblights is 20; the DC to remove a major spellblight
        is 30.</p><p>The DC to remove the spellblight is reduced by 1 with each
        day that passes (minimum DC 10). Using anything other than a
        curse-removing spell to remove a spellblight imposes a –5 penalty on the
        caster level check. Any spellblight can be removed automatically,
        without a caster level check, with mage’s disjunction, miracle, or wish.
        When called to randomly determine a spellblight, roll on the appropriate
        table.</p><h2>Table 2-1: Random Minor
        Spellblights</h2><table><thead><tr><td>d10</td><td>Result</td></tr></thead><tbody><tr><td>1</td><td>Caster
        Blank</td></tr><tr><td>2</td><td>Caster
        Croak</td></tr><tr><td>3</td><td>Confounded
        Casting</td></tr><tr><td>4</td><td>Disassociation</td></tr><tr><td>5</td><td>Ebon
        Eyes</td></tr><tr><td>6</td><td>Eldritch
        Ague</td></tr><tr><td>7</td><td>Hemoculysis</td></tr><tr><td>8</td><td>Lassitude</td></tr><tr><td>9</td><td>Ritualistic
        Obsession</td></tr><tr><td>10</td><td>Spell
        Addiction</td></tr></tbody></table><h2>Table 2-2: Random Major
        Spellblights</h2><table><thead><tr><td>d10</td><td>Result</td></tr></thead><tbody><tr><td>1</td><td>Eldritch
        Cataracts</td></tr><tr><td>2</td><td>Nameless
        Dread</td></tr><tr><td>3</td><td>Negated</td></tr><tr><td>4</td><td>Obsessive
        Fixation</td></tr><tr><td>5</td><td>Phase
        Blight</td></tr><tr><td>6</td><td>Spell
        Burn</td></tr><tr><td>7</td><td>Spell
        Sap</td></tr><tr><td>8</td><td>Transference
        Block</td></tr><tr><td>9</td><td>Vertigo</td></tr><tr><td>10</td><td>Roll
        twice on the minor spellblight chart. The spellcaster is affected with
        both spellblights.</td></tr></tbody></table>
