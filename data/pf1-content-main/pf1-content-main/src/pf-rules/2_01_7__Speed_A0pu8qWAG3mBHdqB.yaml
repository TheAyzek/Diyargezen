        Speed}</strong></li><li>@Compendium[pf-content.pf-rules.ieNVOs9uKwbNXb6E]{2.01.8.
        Saving Throws}</li></ul><hr /><p>@Source[PZO1110;pages=180]</p><p>Your
        speed tells you how far you can move in a round and still do something,
        such as attack or cast a spell. Your speed depends mostly on your size
        and your armor. Dwarves, gnomes, and half lings have a speed of 20 feet
        (4 squares), or 15 feet (3 squares) when wearing medium or heavy armor
        (except for dwarves, who move 20 feet in any armor).</p><p>Humans,
        elves, half-elves, half-orcs, and most humanoid monsters have a speed of
        30 feet (6 squares), or 20 feet (4 squares) in medium or heavy
        armor.</p><p>If you use two move actions in a round (sometimes called a
        “double move” action), you can move up to double your speed. If you
        spend the entire round running, you can move up to quadruple your speed
        (or triple if you are in heavy armor).</p>
