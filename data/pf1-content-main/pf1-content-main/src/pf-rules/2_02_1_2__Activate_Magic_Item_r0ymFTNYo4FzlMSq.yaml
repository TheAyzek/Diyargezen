        /><p>@Source[PZO1110;pages=183]</p><p>Many magic items don’t need to be
        activated. Certain magic items, however, do need to be activated,
        especially potions, scrolls, wands, rods, and staves. Unless otherwise
        noted, activating a magic item is a standard action.</p><h2>Spell
        Completion Items</h2><p>Activating a spell completion item (see
        @Compendium[pf-content.pf-rules.N3qNOnemt2nuACdl]{6.1.02. Using Items})
        is the equivalent of casting a spell. It requires concentration and
        provokes attacks of opportunity. You lose the spell if your
        concentration is broken, and you can attempt to activate the item while
        on the defensive, as with casting a spell.</p><h2>Spell Trigger, Command
        Word, or Use-Activated Items</h2><p>Activating any of these kinds of
        items does not require concentration and does not provoke attacks of
        opportunity.</p>
