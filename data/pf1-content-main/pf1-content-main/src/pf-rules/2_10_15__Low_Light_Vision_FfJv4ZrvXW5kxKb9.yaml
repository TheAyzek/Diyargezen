        /><p>@Source[PZO1110;pages=565]</p><p>Characters with low-light vision
        have eyes that are so sensitive to light that they can see twice as far
        as normal in dim light. Low-light vision is color vision. A spellcaster
        with low-light vision can read a scroll as long as even the tiniest
        candle flame is next to him as a source of light. Characters with
        low-light vision can see outdoors on a moonlit night as well as they can
        during the day.</p>
