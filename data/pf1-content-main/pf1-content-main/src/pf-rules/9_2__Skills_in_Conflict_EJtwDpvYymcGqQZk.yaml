        Disguise}</p><p>@Compendium[pf-content.pf-rules.frhg7KrHN2tYhhkM]{9.2.4.
        Intimidate}</p><p>@Compendium[pf-content.pf-rules.NTIduFRh5A0p0hIu]{9.2.5.
