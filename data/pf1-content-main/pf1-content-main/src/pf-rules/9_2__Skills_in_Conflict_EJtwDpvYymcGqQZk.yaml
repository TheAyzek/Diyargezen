        /><p>@Source[PZO1134;pages=182]</p><p>When skills come into conflict
        with each other, it can lead to extremely complex interactions, often
        well beyond the scope of the short skill descriptions in the Pathfinder
        RPG Core Rulebook. The following section offers detailed advice on the
        most common skill clashes that involve difficult adjudications, as well
        as clarifications of skills where the Core Rulebook provides little
        guidance. The advice in this section is holistic, and GMs are encouraged
        to read each description in full to gain the best grasp of the nuances
        of each skill. Additionally, this section offers an optional variant
        system for opposed skill checks that reduces randomness and the
        potential for many
        rolls.</p><p>@Compendium[pf-content.pf-rules.biGV1a41yIiORN2A]{9.2.1.
        Bluff}</p><p>@Compendium[pf-content.pf-rules.sNy0QWGaxnccWVTz]{9.2.2.
