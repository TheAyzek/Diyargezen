    name: 6.1.16.1 Ioun Stones
    sort: 100000
    text:
      content: >-
        <p>@Source[PZO1123;pages=305] @Source[PZO1110;pages=520-521] <br />These
        crystalline stones always float in the air and must be within 3 feet of
        their owner to be of any use. When a character first acquires a stone,
        she must hold it and then release it, whereupon it takes up a circling
        orbit 1d3 feet from her head. Thereafter, a stone must be grasped or
        netted to separate it from its owner. The owner may voluntarily seize
        and stow a stone (to keep it safe while she is sleeping, for example),
        but she loses the benefits of the stone during that time. Ioun stones
        have AC 24, 10 hit points, and hardness 5. The powers of each stone vary
        depending on its color and shape.</p><p>Regeneration from the pearly
        white ioun stone works like a
        @UUID[Compendium.pf-content.pf-wondrous.Item.NfV9nfBofFLRZhTn]{ring of
        regeneration}. It only cures damage taken while the character is using
        the stone.</p><p>The pale lavender and lavender and-green stones work
        like a
        @UUID[Compendium.pf-content.pf-wondrous.Item.AyO8aGsG2nB4ECcN]{rod of
        absorption}, but absorbing a spell requires a readied action, and these
        stones cannot be used to empower spells.</p><p>Stored spells in the
        vibrant purple stone must be placed by a spellcaster but can be used by
        anyone (see
        @UUID[Compendium.pf-content.pf-wondrous.Item.MsAz3ZYa0hstss3e]{minor
        ring of spell storing}).</p><h3><strong>Implanting Ioun
        Stones</strong></h3><p>@Source[PZO9211;pages=45]</p><p>Not all the
        secrets of the ioun stones lie with the Azlanti. While the First Humans
        mastered the intrinsic powers of the stones, uncovering new attributes
        and binding them to devices, the Thassilonians explored the interaction
        of ioun stones and the mind and body, and in time devised a means of
        implanting an ioun stone within the flesh. This process, originally
        believed to be irreversible, protected the ioun stone from harm and
        theft while still providing its full powers to the owner.</p><p>Binding
        a stone to a single owner is a lengthy process. To begin the ritual, the
        owner meditates with but a single stone in orbit around him. The body
        must be cleansed by fasting for a period of at least 3 days. If the fast
        is broken or interrupted, the process must begin anew. At the end of the
        fast, the owner makes a DC 20 Charisma check; taking 10 is not permitted
        on this check. Success indicates the stone has bonded with the owner and
        may be implanted. Extending the fasting increases the chance of bonding
        with the stone, but the character may suffer the effects of starvation
        and thirst if he persists after several failures; the character gains a
        +1 circumstance bonus to the Charisma check for each full day past the
        third spent in fasting, to a maximum of +5. Failing the check means the
        owner must start over.</p><p>Once the owner establishes this bond with
        the stone, he can have it implanted in his body, which takes 1 hour.
        This requires a DC 25 Heal check (with a –5 penalty if the owner is the
        one performing the surgery) and a DC 25 Knowledge (arcana) check to
        succeed. Failure inflicts 1d6 points of Constitution damage and means
        the implantation process must start again. Success binds the stone on
        the surface of the owner’s skin in a location of his choice (usually the
        head, arm, or hand), where it becomes one with the owner’s flesh, deals
        him 1d2 points of Constitution damage (which he can heal naturally or
        with magic), and gives him the full benefits of the ioun stone. Once
        implanted, an ioun stone may not be sundered or targeted by effects and
        cannot be removed without the owner’s consent while he is alive (barring
        complete removal of the implanted body part).</p><p>Rumors exist of
        stranger, darker magics that allow spellcasters to channel spells
        through their implanted stones, or that cause the stones to shatter if
        the owner is killed, but those with any actual knowledge of these
        procedures are dead, hidden, or not talking.</p><h3><strong>Facts about
        Ioun Stones</strong></h3><p>@Source[PZO9211;pages=43]</p><p>Ioun stones
        only float when sent spinning around the head of an intelligent (Int 3+)
        creature; otherwise they are as inert as common stone. They have no
        effect on animals, mindless constructs, and other non-sentient
        creatures; comatose intelligent creatures and those with significant
        Intelligence damage or drain cannot use ioun stones. An ioun stone has
        no particular affinity for the living—intelligent undead and the rare
        intelligent construct can make full use of them.</p><p>Despite their
        ability to float, ioun stones cannot support more than their own weight.
        They cannot be used to anchor ropes or support creatures. An ioun stone
        must be able to orbit freely around a creature’s head (or placed in a
        specialized matrix like a wayfinder) for its power to be active.
        Creatures without heads usually cannot use ioun stones. The orbit of an
        ioun stone reflects the thoughts and emotions of its owner; particularly
        intense emotions have been known to reverse a stone’s orbit or even
        momentarily stop it in its path.</p><p>Ioun stones in orbit never
        collide with other stones or creatures by chance, and automatically
        change course to avoid any obstacles in their path. This in large part
        explains the difficulty of striking an ioun stone in battle. An ioun
        stone in orbit counts as an attended object, and benefits from any
        magical protections possessed by its
        owner.</p><h3><strong>Classification by
        Shape</strong></h3><p>@Source[PZO9211;pages=43]</p><p>The shape of an
        ioun stone can help classify it and thus its powers; the first step is
        recognizing what each of the shapes means. Cabochon and spherical stones
        are usually smooth and the others are usually
        faceted.</p><table><thead><tr><td><p
        style="text-align:center"><strong>Shape</strong></p></td><td><p
        style="text-align:center"><strong>Description</strong></p></td></tr></thead><tbody><tr><td
        colspan="2"><strong>From
        @Source[PZO9211;pages=43]</strong></td></tr><tr><td><p>Cabochon</p></td><td><p>A
        convex top with a flat bottom. Most are elliptical or
        tear-shaped.</p></td></tr><tr><td><p>Disk</p></td><td><p>A flat circle,
        typically convex on both sides but sometimes in a lens-like
        shape.</p></td></tr><tr><td><p>Ellipsoid</p></td><td><p>An elongated
        sphere, sometimes tapering at one end to a tear-like
        shape.</p></td></tr><tr><td><p>Nodule</p></td><td><p>Asymmetrical but
        generally rounded.</p></td></tr><tr><td><p>Pentacle</p></td><td><p>A
        type of disk, but with five sides rather than being round. The sides are
        usually straight rather than
        curved.</p></td></tr><tr><td><p>Prism</p></td><td><p>A long stone where
        the top and bottom ends have the same number of sides (such as a
        hexagram). The width and angle of each side is usually the same as all
        other sides.</p></td></tr><tr><td><p>Pyramid</p></td><td><p>A cone-like
        shape with a point at one end, a flat base, and long facets connecting
        the two. Typical pyramids have three or four-sided bases, but some have
        a dozen or more.</p></td></tr><tr><td><p>Rhomboid</p></td><td><p>A type
        of prism with sides of unequal widths or angles, giving it a flattened
        cross section.</p></td></tr><tr><td><p>Sphere</p></td><td><p>Essentially
        round in all
        dimensions.</p></td></tr><tr><td><p>Spindle</p></td><td><p>A kind of
        prism with 10 or more sides, giving it a nearly round cross
        section.</p></td></tr><tr><td><p>Trillian</p></td><td><p>A type of disk,
        but with three sides (either straight or curved outward) rather than
        being round.</p></td></tr><tr><td colspan="2"><strong>From
        @Source[PZO9268;pages=60]</strong></td></tr><tr><td><p>Thorny</p></td><td><p>A
        circular shape with dozens of needle-like points jutting
        out.</p></td></tr><tr><td colspan="2"><strong>From
        @Source[PZO9491;pages=15] @Source[PZO9545;pages=67]
        @Source[PZO9269;pages=29]</strong></td></tr><tr><td><p>Star</p></td><td><p>The
        crystal is perfectly cut in the shape of a five-pointed
        star.</p></td></tr><tr><td colspan="2"><strong>From
        @Source[PZO90125;pages=36]</strong></td></tr><tr><td><p>Briolette</p></td><td><p>Pear-shaped</p></td></tr><tr><td
        colspan="2"><strong>From
        @Source[PZO90138;pages=77]</strong></td></tr><tr><td><p>Wedge</p></td><td><p>Larger
        than most Ioun Stones</p></td></tr></tbody></table><h3><strong>Inferior
        Ioun Stones</strong></h3><p>@Source[PZO9211;pages=46]</p><p>There are
        very few reports of ioun stones that have negative side effects; even
        those created by incompetent item-crafters merely create inferior
        specimens—still valuable to poor adventurers who cannot afford the
        normal variety. They fall into one of the following
        categories.</p><p><strong>Cracked:</strong> These stones bear an obvious
        crack, whether as a result of the crafting process, because the raw
        stone was already cracked, or because the stone has been damaged (for
        example, if it gains the broken quality). A cracked stone’s power is
        usually the same as an undamaged stone, but
        weaker.</p><p><strong>Flawed</strong>: These stones have a flaw other
        than a crack, such as irregular faceting or impurities in the crystal. A
        flawed stone’s power is usually similar to and weaker than a normal ioun
        stone, but sometimes it has side effects or slightly different effects
        than its normal counterpart.</p><p><strong>Scorched:</strong> These
        stones are depleted somehow, but not so much as to render them
        completely burned out and powerless; some achieve this state from
        damaging exposure to extreme heat or electricity. A scorched stone’s
        power functions erratically (typically a 50% chance per day for
        constant-effect items, or 50% chance per use for use-activated items)
        but is essentially the same as an intact stone of the same type. For
        example, a scorched pearly white spindle ioun stone might give the
        wearer a 50% chance per 10 minutes to regenerate 1 hit
        point.</p><p><strong>Cursed Stones:</strong> When a magic item creation
        skill check to create an ioun stone fails by 5 or more but less than 15,
        there is a 50% chance the result is a cracked stone and a 50% chance the
        result is a flawed stone. If the check fails by 15 or more, the stone is
        actually cursed; roll on
        @UUID[Compendium.pf-content.pf-rules.JournalEntry.WmWtP6DcnV60KOdF.JournalEntryPage.PBCgMfPmgYwIH6yE#table-15-27:-common-item-curses]{Table
        15–27} to determine the effects of the stone’s
        curse.</p><p><strong>Resonant Powers:</strong> Only 25% of cracked or
        flawed ioun stones have resonant powers (see Wayfinders and Ioun Stones
        on page 51) compared to the 75% chance for typical ioun stones; only 10%
        of scorched ioun stones have resonant powers.</p><h3><strong>Wayfinders
        and Ioun
        Stones</strong></h3><p>@Source[PZO9211;pages=51-52]</p><p>Within each
        wayfinder is a fine lattice of wires that serve to channel the power of
        ioun stones, allowing the owner of a wayfinder to benefit from a stone’s
        power without the attendant risk of having a valuable item orbiting
        around her head. In addition, the magic worked into the wayfinder
        amplifies the power of the ioun stone, usually (about 75% of the time)
        unlocking new abilities in addition to the stone’s normal power.
        Unfortunately, the energy required is such that the magical properties
        of the wayfinder itself are diverted to power the ioun stone,
        temporarily negating the wayfinder’s normal abilities. The mechanism of
        using a wayfinder to boost the power of an ioun stone is usually called
        augmenting, channeling, enhancing, or resonating.</p><p>The resonant
        aura of a wayfinder interacting with an ioun stone can be detected and
        identified with detect magic (or similar spells) and the Spellcraft
        skill, just like any other magic item.</p><p>The auras of multiple
        augmenting wayfinders tend to interfere with each other; a person with
        one who tries to hold or carry a second usually finds that both sputter
        out in just a few seconds, but activate again once the second one is set
        aside. Some advanced, expensive wayfinders may hold more than one ioun
        stone at the same time and still function (though another wayfinder can
        interfere if brought too close).</p><p>To determine what effect a
        wayfinder has on an ioun stone, select one of the following
        methods.</p><p><strong>Method 1, The Static
        Assignment:</strong></p><p>All ioun stones of a particular color and
        shape react exactly the same way to all wayfinders. This is the easiest
        and fastest method, but lacks variety and allows the PCs to easily
        predict what a new stone or device will do when combined. For a listing
        of these combinations, see below. @Browse[items;tag=Ioun Stone]{Check
        out the existing Ioun Stones}</p><p><strong>Method 2, The Random
        Roll:</strong></p><p>Each combination of an ioun stone and a wayfinder
        requires a roll on a table to see what resonant power it gains. This
        methods allows for a lot of variety but requires bookkeeping to track
        each unique stone’s augmented power, and also makes it difficult for the
        PCs to predict what any particular combination may be. See the table on
        page 53.</p>
