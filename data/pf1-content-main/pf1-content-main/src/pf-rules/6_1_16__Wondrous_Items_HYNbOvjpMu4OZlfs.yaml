        /><p>@Source[PZO1110;pages=496]</p><p>This is a catch all category for
        anything that doesn’t fall into the other groups. Anyone can use a
        wondrous item (unless specified otherwise in the
        description).</p><h2>Physical
        Description</h2><p>Varies.</p><h2>Activation</h2><p>Usually
        use-activated or command word, but details vary from item to
        item.</p><h2>Special Qualities</h2><p>Roll d%. An 01 result indicates
        the wondrous item is intelligent, 02–31 indicates that something (a
        design, inscription, or the like) provides a clue to its function, and
        32–100 indicates no special qualities. Intelligent items have extra
        abilities and sometimes extraordinary powers and special purposes (see
        Intelligent Items later in this chapter).</p><p>Wondrous items with
        charges can never be intelligent.</p>
