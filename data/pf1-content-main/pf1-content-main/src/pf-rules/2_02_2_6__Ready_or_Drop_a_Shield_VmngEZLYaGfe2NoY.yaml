        /><p>@Source[PZO1110;pages=187]</p><p>Strapping a shield to your arm to
        gain its shield bonus to your AC, or unstrapping and dropping a shield
        so you can use your shield hand for another purpose, requires a move
        action. If you have a base attack bonus of +1 or higher, you can ready
        or drop a shield as a free action combined with a regular
        move.</p><p>Dropping a carried (but not worn) shield is a free
        action.</p>
