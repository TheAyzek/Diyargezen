        /><p>@Source[PZO1117;pages=94]</p><p>Spellblights are rare and unusual
        magical conditions that uniquely affect spellcasters, including
        creatures that use spell-like abilities. Spellblights are curses, some
        functioning continuously and others manifesting only when the aff licted
        creature attempts to cast a spell or use a spell-like ability. A
        creature that lacks the ability to cast spells or use spell-like
        abilities cannot usually be afflicted by a spellblight.</p><p>Unlike
        many magical effects, a spellblight usually persists in an antimagic
        field, though because they often affect spellcasting, their effect is
        typically lessened in such a
        field.</p><p>@Compendium[pf-content.pf-rules.OPK25NIEHqUYitgi]{7.1.1.1.
        Gaining
        Spellblights}</p><p>@Compendium[pf-content.pf-rules.F6b60bGMBy29g2ly]{7.1.1.2.
        Optional Ways to Acquire
        Spellblights}</p><p>@Compendium[pf-content.pf-rules.ISsO29CRESajsLh6]{7.1.1.3.
        Removing
        Spellblights}</p><p>@Compendium[pf-content.pf-rules.QG2hyxED2QNo2wrB]{7.1.1.4.
        Description of
        Spellblights}</p><ul><li>@Compendium[pf-content.pf-rules.34AhdoIJXSL7gMWo]{7.1.1.4.1.
