        /><p>@Source[PZO1114;pages=192]</p><p>The soaring mountain of Heaven
        towers high above the Outer Sphere. This ordered realm of honor and
        compassion is divided into seven layers. Heaven’s slopes are filled with
        planned, orderly cities and tidy, cultivated gardens and orchards.
        Though they began their existences as mortals, Heaven’s native archons
        see law and good as indivisible halves of the same exalted concept, and
        array themselves against the cosmic perversions of chaos and
        evil.</p><h2>Planar Traits</h2><p>Heaven has the following
        traits:</p><ul><li><strong>Divinely Morphic</strong>: Deities with
        domains in Heaven can alter the plane at will.</li><li><strong>Strongly
        Law-Aligned and Strongly Good-Aligned</strong></li><li><strong>Enhanced
        Magic</strong>: Spells and spell-like abilities with the lawful or good
        descriptor are enhanced.</li><li><strong>Impeded Magic</strong>: Spells
        and spell-like abilities with the chaotic or evil descriptor are
        impeded.</li></ul>
