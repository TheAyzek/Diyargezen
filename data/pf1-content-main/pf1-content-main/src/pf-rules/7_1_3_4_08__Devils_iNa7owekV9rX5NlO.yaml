        /><p>@Source[PZO1117;pages=107]</p><p>Devils regard both holy items and
        silver as deadly substances, and instinctively shy away from contact
        with such items. Even those for whom silver presents no danger avoid its
        touch whenever possible. Binders who want to deal with infernal
        outsiders as putative allies keep these substances at least 60 feet from
        the summoning circle; however, if they wish to threaten their infernal
        subjects, they keep them close at hand. The powdered silver used to
        create the magic circle is a warning and a trap, but it is not an overt
        threat—summoned devils recognize it as part of the procedure to call
        them to the Material Plane. Note that even silver candlesticks or bells
        can be used as weapons of opportunity, but the best defense, should the
        wizard choose to display force, is a weapon bonded with alchemical
        silver.</p><p>An even better defense against devils, however, is a holy
        weapon. As with demons, a holy weapon is strong enough to drive through
        any devil’s natural defenses, and the presence of such an item in the
        summoning chamber is an affront to more powerful or subtle
        devils.</p><p>Note that all devils are immune to fire and poison; the
        blasted landscapes of their home plane quickly destroy any who show
        vulnerabilities to these effects. All devils can withstand acid and cold
        as well, though to varying degrees, and few of them show any fear of
        suffering that damage. They have resistance to acid 10 and cold
        10.</p><p>Additionally, one can enhance summoning for specific kinds of
        devils by appealing to those devils’ specific natures.</p><h2>Accuser
        Devil</h2><p>Popular among conjurers and summoners as spies and
        infiltrators, accuser devils often forgo haggling on gifts for their
        services, as the information they gain is worth more than any gift of
        treasure the binder can offer.</p><h2>Barbed Devil (SR
        22)</h2><p>Extraordinarily jealous of their duties and even more so of
        their time, barbed devils may grudgingly accept offers of rare treasures
        and gems worth more than 2,000 gp, with the usual +2 Charisma bonus to
        summoning—but only when the task takes less than 24 hours to complete.
        If the service takes any longer, the binder takes a –2 Charisma
        penalty.</p><h2>Bearded Devil (SR 16)</h2><p>The best way to attract the
        eye of a bearded devil is to offer a restrained victim for its bloody
        use, so that it might painfully murder its target.</p><h2>Belier Devil
        (SR 28)</h2><p>These massive masterminds are rarely summoned to the
        Material Plane, but when they are, they often try to finagle their way
        out of such circumstances as quickly as possible.</p><h2>Bone Devil (SR
        20)</h2><p>These devils adore secrets and infernal lore, and those who
        provide hellish tomes or evidence of influential mortal vices gain a +2
        Charisma bonus on their summoning checks.</p><h2>Erinyes (SR
        19)</h2><p>As the spirits of corrupted angels, erinyes are bitter and
        rage against the heavens. To entice an erinyes, offer it a significant
        holy item for it to despoil, or the cleric of a good-aligned god to
        ravish and ruin.</p><h2>Handmaiden Devil (SR 25)</h2><p>Deals made with
        handmaiden devils are often extremely hard bargains. They typically ask
        for the unthinkable, such as the lives of innocent children—the younger
        the better.</p><h2>Horned Devil (SR 27)</h2><p>As the elite of Hell’s
        armies, horned devils value strength and daunting power; anyone who
        offers them an intimidating weapon enchanted to +2 or better gains the
        +2 Charisma bonus.</p><h2>Ice Devil (SR 24)</h2><p>As the schemers and
        planners of Hell’s devils, laboring in their personal machinations,
        gelugons are extraordinarily difficult to summon. However, casters
        willing to offer an exchange of services—one in which the caster is
        likely to see the short end of the deal—may earn a Charisma bonus. Those
        who renege on their bargains with gelugons often learn what it means to
        displease Hell.</p><h2>Immolation Devil (SR 30)</h2><p>These devils
        often ask for lands on the Material Plane as gifts. If such lands are
        granted, they use these places to launch attacks on neighbors, further
        expanding the territory of Hell.</p><h2>Imp</h2><p>Imps prefer small and
        bloody sacrifices that show the binder’s desire to do evil—for instance,
        a heart torn from a living dove grants a +2 Charisma modifier on the
        summoning check.</p><h2>Lemure</h2><p>Lemures prefer reminders of their
        former lives, and so the best offering is food or
        pornography.</p><h2>Pit Fiend (SR 31)</h2><p>Pit fiends, the greatest of
        all the nonnoble devils in Hell, are rarely tempted to answer a summons;
        when called, most of them come to see the stupidity or the arrogance
        that brought them to the Material Plane before snatching the wizard away
        for an eternity of torment. Only the greatest of promises, such as a
        noble offering the enslavement of an entire empire, a priest offering
        the destruction of holy relics, or an antipaladin pledging the delivery
        of a helpless and noteworthy angel for the pit fiend’s pleasure, might
        induce the pit fiend into service.</p>
