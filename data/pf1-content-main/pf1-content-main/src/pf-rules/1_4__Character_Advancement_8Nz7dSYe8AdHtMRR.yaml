      content: >-
        <p>@Compendium[pf-content.pf-rules.8scSEgBEtJZj0suf]{(Index) Basic
        Rules}</p><p><strong>@Compendium[pf-content.pf-rules.8Nz7dSYe8AdHtMRR]{1.4.
        Character
        Advancement}</strong></p><ul><li>@Compendium[pf-content.pf-rules.41Ie3KadQC9DGMyk]{1.4.1.
        Advancing Your
        Character}</li><li>@Compendium[pf-content.pf-rules.bBCgoC07LGfsk4GW]{1.4.2.
        Multiclassing}</li><li>@Compendium[pf-content.pf-rules.65d8pVRYrHZNPxEz]{1.4.3.
        Favored
        Class}</li><li>@Compendium[pf-content.pf-rules.tbAP08jcSWONo1KU]{1.4.4.
        Prestige Classes}</li></ul><hr /><p>@Source[PZO1110;pages=30]</p><p>As
        player characters overcome challenges, they gain experience points. As
        these points accumulate, PCs advance in level and power. The rate of
        this advancement depends on the type of game that your group wants to
        play. Some prefer a fast-paced game, where characters gain levels every
        few sessions, while others prefer a game where advancement occurs less
        frequently. In the end, it is up to your group to decide what rate fits
        you best. Characters advance in level according to Table
        3–1.</p><h2>Table 3-1: Character Advancement and Level-Dependent
        Bonuses</h2><table><thead><tr><td> </td><td>Experience Point
        Total</td><td> </td></tr><tr><td>Character
        Level</td><td>Slow</td><td>Medium</td><td>Fast</td><td>Feats</td><td>Ability
        Score</td></tr></thead><tbody><tr><td>1st</td><td>—</td><td>—</td><td>—</td><td>1st</td><td>—</td></tr><tr><td>2nd</td><td>3,000</td><td>2,000</td><td>1,300</td><td>—</td><td>—</td></tr><tr><td>3rd</td><td>7,500</td><td>5,000</td><td>3,300</td><td>2nd</td><td>—</td></tr><tr><td>4th</td><td>14,000</td><td>9,000</td><td>6,000</td><td>—</td><td>1st</td></tr><tr><td>5th</td><td>23,000</td><td>15,000</td><td>10,000</td><td>3rd</td><td>—</td></tr><tr><td>6th</td><td>35,000</td><td>23,000</td><td>15,000</td><td>—</td><td>—</td></tr><tr><td>7th</td><td>53,000</td><td>35,000</td><td>23,000</td><td>4th</td><td>—</td></tr><tr><td>8th</td><td>77,000</td><td>51,000</td><td>34,000</td><td>—</td><td>2nd</td></tr><tr><td>9th</td><td>115,000</td><td>75,000</td><td>50,000</td><td>5th</td><td>—</td></tr><tr><td>10th</td><td>160,000</td><td>105,000</td><td>71,000</td><td>—</td><td>—</td></tr><tr><td>11th</td><td>235,000</td><td>155,000</td><td>105,000</td><td>6th</td><td>—</td></tr><tr><td>12th</td><td>330,000</td><td>220,000</td><td>145,000</td><td>—</td><td>3rd</td></tr><tr><td>13th</td><td>475,000</td><td>315,000</td><td>210,000</td><td>7th</td><td>—</td></tr><tr><td>14th</td><td>665,000</td><td>445,000</td><td>295,000</td><td>—</td><td>—</td></tr><tr><td>15th</td><td>955,000</td><td>635,000</td><td>425,000</td><td>8th</td><td>—</td></tr><tr><td>16th</td><td>1,135,000</td><td>890,000</td><td>600,000</td><td>—</td><td>4th</td></tr><tr><td>17th</td><td>1,900,000</td><td>1,300,000</td><td>850,000</td><td>9th</td><td>—</td></tr><tr><td>18th</td><td>2,700,000</td><td>1,800,000</td><td>1,200,000</td><td>—</td><td>—</td></tr><tr><td>19th</td><td>3,850,000</td><td>2,550,000</td><td>1,700,000</td><td>10th</td><td>—</td></tr><tr><td>20th</td><td>5,350,000</td><td>3,600,000</td><td>2,400,000</td><td>—</td><td>5th</td></tr></tbody></table>
