        Terrain}</li><li><strong>@Compendium[pf-content.pf-rules.adrsWQRvBNEI4q1M]{2.02.3.4.
        Run}</strong></li><li>@Compendium[pf-content.pf-rules.sDdDsMio3YkKR36L]{2.02.3.5.
        Use Special
        Ability}</li><li>@Compendium[pf-content.pf-rules.A0PE1jTg1M6hXYax]{2.02.3.6.
        Withdraw}</li></ul><hr /><p>@Source[PZO1110;pages=188]</p><p>You can run
        as a full-round action. If you do, you do not also get a 5-foot step.
        When you run, you can move up to four times your speed in a straight
        line (or three times your speed if you’re in heavy armor). You lose any
        Dexterity bonus to AC unless you have the
        @Compendium[pf-content.pf-feats.ZAQGmcCZqF1MIbxU]{Run} feat.</p><p>You
        can run for a number of rounds equal to your Constitution score, but
        after that you must make a DC 10 Constitution check to continue running.
        You must check again each round in which you continue to run, and the DC
        of this check increases by 1 for each check you have made. When you fail
        this check, you must stop running. A character who has run to his limit
        must rest for 1 minute (10 rounds) before running again. During a rest
        period, a character can move no faster than a normal move
        action.</p><p>You can’t run across difficult terrain or if you can’t see
        where you’re going.</p><p>A run represents a speed of about 13 miles per
        hour for an unencumbered human.</p>
