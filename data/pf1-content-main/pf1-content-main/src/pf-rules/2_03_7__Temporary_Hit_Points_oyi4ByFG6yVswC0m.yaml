        /><p>@Source[PZO1110;pages=191]</p><p>Certain effects give a character
        temporary hit points. These hit points are in addition to the
        character’s current hit point total and any damage taken by the
        character is subtracted from these hit points first. Any damage in
        excess of a character’s temporary hit points is applied to his current
        hit points as normal. If the effect that grants the temporary hit points
        ends or is dispelled, any remaining temporary hit points go away. The
        damage they sustained is not transferred to the character’s current hit
        points.</p><p>When temporary hit points are lost, they cannot be
        restored as real hit points can be, even by magic.</p><h2>Increases in
        Constitution Score and Current Hit Points</h2><p>An increase in a
        character’s Constitution score, even a temporary one, can give her more
        hit points (an effective hit point increase), but these are not
        temporary hit points. They can be restored, and they are not lost first
        as temporary hit points are.</p>
