        /><p>@Source[PZO1110;pages=186]</p><p>The simplest move action is moving
        your speed. If you take this kind of move action during your turn, you
        can’t also take a 5-foot step.</p><p>Many nonstandard modes of movement
        are covered under this category, including climbing (up to onequarter of
        your speed) and swimming (up to one-quarter of your
        speed).</p><h2>Accelerated Climbing</h2><p>You can climb at half your
        speed as a move action by accepting a –5 penalty on your Climb
        check.</p><h2>Crawling</h2><p>You can crawl 5 feet as a move action.
        Crawling incurs attacks of opportunity from any attackers who threaten
        you at any point of your crawl. A crawling character is considered prone
        and must take a move action to stand up, provoking an attack of
        opportunity.</p>
