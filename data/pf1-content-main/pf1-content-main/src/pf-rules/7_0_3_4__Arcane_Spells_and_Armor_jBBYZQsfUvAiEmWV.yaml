        /><p>@Source[PZO1110;pages=83]</p><p>Armor restricts the complicated
        gestures required while casting any spell that has a somatic component.
        The armor and shield descriptions list the arcane spell failure chance
        for different armors and shields.</p><p>If a spell doesn’t have a
        somatic component, an arcane spellcaster can cast it with no arcane
        spell failure chance while wearing armor. Such spells can also be cast
        even if the caster’s hands are bound or he is grappling (although
        concentration checks still apply normally). The metamagic feat Still
        Spell allows a spellcaster to prepare or cast a spell without the
        somatic component at one spell level higher than normal. This also
        provides a way to cast a spell while wearing armor without risking
        arcane spell failure.</p>
