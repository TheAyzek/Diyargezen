        /><p>@Source[PZO1110;pages=532]</p><p>Creating a magic item with
        intelligence follows these simple guidelines. Intelligent items must
        have an alignment, mental ability scores, languages, senses, and at
        least one other special ability. These statistics and abilities can be
        improved during creation, increasing the item’s overall cost. Many of
        these abilities add to an item’s Ego score. Intelligent items with high
        Ego scores are difficult to control and can sometimes take control of
        their owner, making them dangerous to possess.</p><p>An intelligent
        magic item has a base price increase of 500 gp. When determining the
        total value of an intelligent item, add this value to the sum of the
        prices of all of its additional abilities gained through being
        intelligent, before adding them to the magic item’s base price.</p>
