        /><p>@Source[PZO1114;pages=191]</p><p>A vast land of untamed wilderness
        and wild passions, Elysium is the plane of benevolent chaos. Freedom and
        self-sufficiency abound here, personified in the azatas native to the
        plane. In Elysium, self less cooperation and fierce competition clash
        with the violence of a raging thunderstorm, but such conf licts never
        overshadow the lofty concepts of bravery, creativity, and good
        unhindered by rules or laws.</p><h2>Planar Traits</h2><p>Elysium has the
        following traits:</p><ul><li><strong>Divinely Morphic</strong>: Deities
        with domains in Elysium can alter the plane at
        will.</li><li><strong>Strongly Chaos-Aligned and Strongly
        Good-Aligned</strong></li><li><strong>Enhanced Magic</strong>: Spells
        and spell-like abilities with the chaotic or good descriptor are
        enhanced.</li><li><strong>Impeded Magic</strong>: Spells and spell-like
        abilities with the lawful or evil descriptor are impeded.</li></ul>
