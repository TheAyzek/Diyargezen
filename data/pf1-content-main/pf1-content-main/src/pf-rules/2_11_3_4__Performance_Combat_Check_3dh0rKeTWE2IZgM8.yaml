        /><p>@Source[PZO1118;pages=154]</p><p>Whenever a combatant has a chance
        to affect the crowd’s attitude, she makes a performance combat check.
        The check is a Charisma ability check modified by the base attack bonus
        of the character plus any ranks the character has in Perform (act),
        Perform (comedy), or Perform (dance), whichever is highest. Making a
        performance combat check is usually a swift action, triggered when a
        combatant performs a trigger action (see the Affecting the Crowd’s
        Attitude section).</p><table><tbody><tr><td><p>Base Attack
        Bonus</p></td><td><p>Bonus on Performance Combat
        Check</p></td></tr><tr><td><p>0</p></td><td><p>+0</p></td></tr><tr><td><p>1-5</p></td><td><p>+1</p></td></tr><tr><td><p>6-10</p></td><td><p>+2</p></td></tr><tr><td><p>11-15</p></td><td><p>+3</p></td></tr><tr><td><p>16+</p></td><td><p>+4</p></td></tr></tbody></table><table><tbody><tr><td><p>Highest
        Perform Rank</p></td><td><p>Bonus on Performance Combat
        Check</p></td></tr><tr><td><p>0</p></td><td><p>+0</p></td></tr><tr><td><p>1-5</p></td><td><p>+1</p></td></tr><tr><td><p>6-10</p></td><td><p>+2</p></td></tr><tr><td><p>11-15</p></td><td><p>+3</p></td></tr><tr><td><p>16+</p></td><td><p>+4</p></td></tr></tbody></table><p><br
        />Using a performance weapon grants a combatant a +2 bonus on
        performance combat checks. Some feats, spells, or other circumstances
        may grant a combatant a bonus on performance combat
        checks.</p><p>Succeeding at a performance combat check improves the
        attitude of the crowd by one step. Unlike skill checks, a roll of a
        natural 20 on a performance combat check always succeeds. Failing the
        check either leaves the attitude unchanged or, if the check fails by 5
        or more, causes the attitude of the crowd to decrease by one step. The
        DC of the check is determined by the crowd’s current attitude, with a
        number of adjustments to the DC granted by the circumstances of the
        performance combat. If the crowd’s current attitude is helpful, a
        successful check grants the favored side 1 victory point.</p>
