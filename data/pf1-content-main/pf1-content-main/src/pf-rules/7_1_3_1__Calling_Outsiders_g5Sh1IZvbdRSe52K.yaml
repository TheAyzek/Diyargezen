        /><p>@Source[PZO1117;pages=101]</p><p>The first step in calling
        extraplanar assistance is to determine the method of bringing the
        outsider to the Material Plane. If the caster is a cleric, the spell of
        choice is planar ally; wizard, sorcerers, and summoners rely primarily
        on planar binding (or summon monster, which controls without requiring
        binding). However, none of these necessarily bind the outsider to the
        caster’s needs, and a wise spellcaster augments the summoning with
        additional encouragement, usually in the form of gifts or bargains.</p>
