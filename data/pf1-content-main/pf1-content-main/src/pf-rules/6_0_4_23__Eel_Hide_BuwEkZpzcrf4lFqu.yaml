        /><p>@Source[PZO1123;pages=50]</p><p>This supple material offers as much
        protection as leather, but is more flexible and resistant to
        electricity. Leather, hide, or studded leather armor can be produced
        with eel hide. The armor check penalty of such armor is reduced by 1 (to
        a minimum of 0) and the maximum Dexterity bonus of the armor is
        increased by 1. Additionally, wearing eel hide grants the wearer
        electricity resistance 2. Armor crafted from eel hide is always
        considered masterwork, and the masterwork costs are included in the
        listed prices.</p><p>Eel hide has the same hit points and hardness as
        leather.</p><table><thead><tr><td>Type of Eel Hide Item</td><td>Item
        Price Modifier</td></tr></thead><tbody><tr><td>Light
        armor</td><td>+1,200 gp</td></tr><tr><td>Medium armor</td><td>+1,800
        gp</td></tr></tbody></table>
