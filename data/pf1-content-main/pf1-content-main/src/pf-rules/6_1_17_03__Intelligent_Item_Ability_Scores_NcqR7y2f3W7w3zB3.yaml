        /><p>@Source[PZO1110;pages=533]</p><p>Intelligent magic items possess
        all three mental ability scores: Intelligence, Wisdom, and Charisma.
        Each one of these ability scores begins at a value of 10, but can be
        increased to as high as 20. Table 15–22 shows the cost to increase one
        of the item’s ability scores. This cost must be paid for each ability
        score raised above 10. For example, an intelligent magic item with a 15
        Intelligence, 12 Wisdom, and 10 Charisma would cost at least 2,400 gp
        more than the base item (including the 500 gp for being an intelligent
        item).</p><h2>Table 15–22: Intelligent Item Ability
        Scores</h2><table><thead><tr><td>Score Base</td><td>Price
        Modifier</td><td>Ego
        Modifier</td></tr></thead><tbody><tr><td>10</td><td>—</td><td>—</td></tr><tr><td>11</td><td>+200
        gp</td><td>—</td></tr><tr><td>12</td><td>+500
        gp</td><td>+1</td></tr><tr><td>13</td><td>+700
        gp</td><td>+1</td></tr><tr><td>14</td><td>+1,000
        gp</td><td>+2</td></tr><tr><td>15</td><td>+1,400
        gp</td><td>+2</td></tr><tr><td>16</td><td>+2,000
        gp</td><td>+3</td></tr><tr><td>17</td><td>+2,800
