        /><p>@Source[PZO1110;pages=535]</p><p>A dedicated power operates only
        when an intelligent item is in pursuit of its special purpose. This
        determination is always made by the item. It should always be easy and
        straightforward to see how the ends justify the means. Unlike its other
        powers, an intelligent item can refuse to use its dedicated powers even
        if the owner is dominant (see Items Against Characters). The caster
        level for these effects is equal to the item’s caster level. Save DCs
        are based on the item’s highest mental ability score.</p><p>See Table
        15–26 for a list of dedicated powers.</p><h2>Table 15–26: Special
        Purpose Item Dedicated
        Powers</h2><table><thead><tr><td>d%</td><td>Dedicated Power</td><td>Base
        Price Modifier</td><td>Ego
        Modifier</td></tr></thead><tbody><tr><td>01–20</td><td>Item can detect
        any special purpose foes within 60 feet</td><td>+10,000
        gp</td><td>+1</td></tr><tr><td>21–35</td><td>Item can use a 4th-level
        spell at will</td><td>+56,000
        gp</td><td>+2</td></tr><tr><td>36–50</td><td>Wielder gets +2 luck bonus
        on attacks, saves, and checks</td><td>+80,000
        gp</td><td>+2</td></tr><tr><td>51–65</td><td>Item can use a 5th-level
        spell at will</td><td>+90,000
        gp</td><td>+2</td></tr><tr><td>66–80</td><td>Item can use a 6th-level
        spell at will</td><td>+132,000
        gp</td><td>+2</td></tr><tr><td>81–95</td><td>Item can use a 7th-level
        spell at will</td><td>+182,000
        gp</td><td>+2</td></tr><tr><td>96–100</td><td>Item can use true
        resurrection on wielder, once per month</td><td>+200,000
        gp</td><td>+2</td></tr></tbody></table>
