        /><p>@Source[PZO1117;pages=113]</p><p>Standard constructs can be
        modified to enhance their base abilities, alter their appearance or
        function, or perform a variety of tasks beyond the intentions of their
        basic designs. Performing a modification provides a construct's creator
        with a simple way to create a unique construct. A modification can only
        be performed while the construct is inanimate or
        nonfunctioning.</p><p>Performing modifications on one's own construct
        requires the Craft Construct feat, and the creator must pay any
        additional crafting requirements and/or costs associated with the
        modification. Completing a modification requires 1 day per 1,000 gp of
        the modification's base price (minimum 1 day).</p>
