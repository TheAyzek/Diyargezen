        /><p>Increasing an animal’s Intelligence to 3 or higher means it is
        smart enough to understand a language. However, unless an awaken spell
        is used, the animal doesn’t automatically and instantly learn a
        language, any more than a human child does. The animal must be taught a
        language, usually over the course of months, giving it the understanding
        of the meaning of words and sentences beyond its trained responses to
        commands like “attack” and “heel.”</p><p>Even if the animal is taught to
        understand a language, it probably lacks the anatomy to actually speak
        (unless awaken is used). For example, dogs, elephants, and even gorillas
        lack the proper physiology to speak humanoid languages, though they can
        use their limited “vocabulary” of sounds to articulate concepts,
        especially if working with a person who learns what the sounds
        mean.</p><p>An intelligent animal is smart enough to use tools, but
        might lack the ability to manipulate them. A crow could be able to use
        simple lockpicks, but a dog can’t. Even if the animal is physically
        capable of using a tool, it might still prefer its own natural body to
        manufactured items, especially when it comes to weapons. An intelligent
        gorilla could hold or wield a sword, but its inclination is to make slam
        attacks. No amount of training (including weapon proficiency feats) is
        going to make it fully comfortable attacking in any other
        way.</p><p>Even if an animal’s Intelligence increases to 3 or higher,
        you must still use the Handle Animal skill to direct the animal, as it
        is a smart animal rather than a low-intelligence person (using awaken is
        an exception—an awakened animal takes orders like a person). The GM
        should take the animal’s Intelligence into account when determining its
        response to commands or its behavior when it doesn’t have specific
        instructions. For example, an intelligent wolf companion can pick the
        weakest-looking target if directed to do so, and that same wolf trapped
        in a burning building might push open a door or window without being
        told.</p>
