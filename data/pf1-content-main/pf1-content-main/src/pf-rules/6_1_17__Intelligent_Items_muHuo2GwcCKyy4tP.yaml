        /><p>@Source[PZO1110;pages=532]</p><p>Magic items sometimes have
        intelligence of their own. Magically imbued with sentience, these items
        think and feel the same way characters do and should be treated as NPCs.
        Intelligent items have extra abilities and sometimes extraordinary
        powers and special purposes. Only permanent magic items (as opposed to
        single-use items or those with charges) can be intelligent. (This means
        that potions, scrolls, and wands, among other items, are never
        intelligent.) In general, less than 1% of magic items have
        intelligence.</p><p>Intelligent items can actually be considered
        creatures because they have Intelligence, Wisdom, and Charisma scores.
        Treat them as constructs. Intelligent items often have the ability to
        illuminate their surroundings at will (as magic weapons do); many cannot
        see otherwise.</p><p>Unlike most magic items, intelligent items can
        activate their own powers without waiting for a command word from their
        owner. Intelligent items act during their owner’s turn in the initiative
        order.</p>
