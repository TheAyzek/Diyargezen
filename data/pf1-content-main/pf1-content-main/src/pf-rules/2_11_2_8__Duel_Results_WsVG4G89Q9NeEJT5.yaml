        /><p>@Source[PZO1118;pages=152]</p><p>While duels can be treated as
        another form of combat, they are usually undertaken to resolve a dispute
        between colleagues or rivals and are not usually intended to end in
        death. As a result, duels are usually fought with a specific prize in
        mind.</p><p>Arcane academies are known for having duels to determine
        important faculty positions and as competitions between students for
        social standing and prizes. In some places, duels are so common that
        special areas are constructed specifically for duels. Such dueling yards
        are sometimes made with special enchantments that can be turned on for
        dueling competitions. Such fields typically convert all damage to
        nonlethal damage and prevent magic that instantly slays a foe or does
        permanent harm. That is not to say that accidents don’t happen, and more
        than one student has lost a limb or even her life while within such
        “safe” fields.</p><p>Fighters, paladins, cavaliers, and other characters
        that primarily rely on weapon attacks usually engage in duels to settle
        points of honor, but can also be rather particular in choosing their
        dueling space.</p><p>Regardless of the conditions, most duels are
        serious affairs, with each side putting pride, honor, treasure, and even
        their lives on the line to win the day. While villains might try to
        cheat the rules and exploit every advantage, nobler duelists see the
        competition as a chance to prove their superiority on the field of
        battle using only their skills and wits, rather than chance or superior
        numbers.</p>
