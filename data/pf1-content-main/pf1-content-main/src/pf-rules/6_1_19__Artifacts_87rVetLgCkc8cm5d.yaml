        /><p>@Source[PZO1110;pages=543]</p><p>Artifacts are extremely powerful.
        Rather than merely another form of magical equipment, they are the sorts
        of legendary relics that whole campaigns can be based on. Each could be
        the center of a whole set of adventures—a quest to recover it, a fight
        against an opponent wielding it, a mission to cause its destruction, and
        so on.</p><p>Unlike normal magic items, artifacts are not easily
        destroyed. Instead of construction information, each artifact includes
        one possible means by which it might be destroyed.</p><p>Artifacts can
        never be purchased, nor are they found as part of a random treasure
        hoard. When placing an artifact in your game, be sure to consider its
        impact and role. Remember that artifacts are fickle objects, and if they
        become too much of a nuisance, they can easily disappear or become lost
        once again.</p><p><em>See PF-Artifacts compendium for many Artifacts
        (incomplete).</em></p><h2>Minor
        Artifacts</h2><p>@Source[PZO1110;pages=543]</p><p>Minor artifacts are
        not necessarily unique items. Even so, they are magic items that no
        longer can be created, at least by common mortal means.</p><h2>Major
        Artifacts</h2><p>@Source[PZO1110;pages=547]</p><p>Major artifacts are
        unique items—only one of each such item exists. These are the most
        potent of magic items, capable of altering the balance of a campaign.
        Unlike all other magic items, major artifacts are not easily destroyed.
        Each should have only a single, specific means of destruction.</p>
