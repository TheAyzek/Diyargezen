        /><p>@Source[PZO1110;pages=217]</p><p>Spell resistance is a special
        defensive ability. If your spell is being resisted by a creature with
        spell resistance, you must make a caster level check (1d20 + caster
        level) at least equal to the creature’s spell resistance for the spell
        to affect that creature. The defender’s spell resistance is like an
        Armor Class against magical attacks. Include any adjustments to your
        caster level to this caster level check.</p><p>The Spell Resistance
        entry and the descriptive text of a spell description tell you whether
        spell resistance protects creatures from the spell. In many cases, spell
        resistance applies only when a resistant creature is targeted by the
        spell, not when a resistant creature encounters a spell that is already
        in place.</p><p>The terms “object” and “harmless” mean the same thing
        for spell resistance as they do for saving throws. A creature with spell
        resistance must voluntarily lower the resistance (a standard action) in
        order to be affected by such spells without forcing the caster to make a
        caster level check.</p>
