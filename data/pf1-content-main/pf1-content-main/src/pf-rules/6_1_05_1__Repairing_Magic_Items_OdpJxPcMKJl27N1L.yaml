        /><p>@Source[PZO1110;pages=459]</p><p>Repairing a magic item requires
        material components equal to half the cost to create the item, and
        requires half the time. The make whole spell can also repair a damaged
        (or even a destroyed) magic item—if the caster is high enough level.</p>
