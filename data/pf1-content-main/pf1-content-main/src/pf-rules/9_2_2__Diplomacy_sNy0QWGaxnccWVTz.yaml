        /><p>@Source[PZO1134;pages=184]</p><p><em>@UUID[Compendium.pf1.pf1e-rules.JournalEntry.x175kVqUfLGPt8tC.JournalEntryPage.uB9Fy36RUjibxqvt]{Diplomacy}</em></p><p>Due
        to its ability to convince people without using either deception or
        coercion—and risking their negative consequences—the Diplomacy skill is
        one of the most commonly used forms of persuasion in the Pathfinder RPG.
        However, it is also difficult to adjudicate in a variety of situations
        involving intrigue and combat.</p>
