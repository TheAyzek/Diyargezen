        /><p>@Source[PZO1117;pages=95]</p><p>The following section details
        spellblights, split up based on their severity and featuring
        descriptions of effects and special methods to end those effects. Note
        that some of the effects of spellblights can be somewhat beneficial.
        Crafty spellcasters can make the best of even the worst situations, and
        the beneficial effects of any spellblights represent this. If a
        spellblight calls for a concentration check based on the level of the
        effect, and the caster is using a spell-like ability that doesn’t have
        an effective level, use half the caster level of the spelllike ability
        instead.</p>
