        /><p>@Source[PZO1110;pages=153]</p><p>Armor and shields for unusually
        big creatures, unusually little creatures, and nonhumanoid creatures
        (such as horses) have different costs and weights from those given on
        Table 6–6. Refer to the appropriate line on Table 6–8 and apply the
        multipliers to cost and weight for the armor type in
        question.</p><h2>Table 6-8: Armor for Unusual
        Creatures</h2><table><thead><tr><td></td><td>Humanoid</td><td>Nonhumanoid</td></tr><tr><td>Size</td><td>Cost</td><td>Weight</td><td>Cost</td><td>Weight</td></tr></thead><tbody><tr><td>Tiny
        or
        smaller*</td><td>×1/2</td><td>×1/10</td><td>×1</td><td>×1/10</td></tr><tr><td>Small</td><td>×1</td><td>×1/2</td><td>×2</td><td>×1/2</td></tr><tr><td>Medium</td><td>×1</td><td>×1</td><td>×2</td><td>×1</td></tr><tr><td>Large</td><td>×2</td><td>×2</td><td>×4</td><td>×2</td></tr><tr><td>Huge</td><td>×4</td><td>×5</td><td>×8</td><td>×5</td></tr><tr><td>Gargantuan</td><td>×8</td><td>×8</td><td>×16</td><td>×8</td></tr><tr><td>Colossal</td><td>×16</td><td>×12</td><td>×32</td><td>×12</td></tr></tbody></table><p>*Divide
        armor bonus by 2.</p>
