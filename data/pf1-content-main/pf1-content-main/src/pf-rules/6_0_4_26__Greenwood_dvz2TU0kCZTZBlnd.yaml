        <p>@Compendium[pf-content.pf-rules.4TX2Q1MaWt1B8298]{(Index)
        Items}</p><p>@Compendium[pf-content.pf-rules.j1KZwBRf9pU1Dg2C]{6.0.
        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p><strong>PFS
        Legal</strong></p><p>@Source[PZO1123;pages=50]</p><p>The secret of
        greenwood lies in its harvesting. Each length is taken, with leaves
        still attached, from a tree animated by a treant and cut with care to
        avoid the death of the tree. A dryad then speaks to and shapes the wood,
        coaxing the living green of the leaves into the grain of the wood
        itself. The resulting wood remains alive as long as it is doused with at
        least one gallon of water (plus 1 gallon for every 10 pounds of the
        item’s weight) once per week and allowed to rest for an hour in contact
        with fertile soil. Any wooden or mostly wooden item (such as a bow or
        spear) made from greenwood is considered a masterwork item. Items not
        normally made of wood or only partially of wood (such as a battleaxe or
        a mace) either cannot be made from greenwood or do not gain any special
        benefit from being made of greenwood.</p><p>When damp and in contact
        with fertile soil, living greenwood heals damage to itself at a rate of
        1 hit point per hour, even repairing breaks and regrowing missing
        pieces. If the weapon has the broken condition, it is repaired during
        the first hour of contact with fertile soil. Greenwood items take only
        one-quarter damage from fire.</p><p>Greenwood can be altered or enhanced
        with wood-shaping magic such as ironwood, shape wood, and warp wood. The
        duration of any such effect on a greenwood item is doubled. To determine
        the price of a greenwood item, use the original weight but add 50 gp per
        pound to the price of a masterwork version of that item. Items made from
        darkwood cannot be made into greenwood.</p><p>Greenwood has the same hit
        points and hardness as wood.</p>
