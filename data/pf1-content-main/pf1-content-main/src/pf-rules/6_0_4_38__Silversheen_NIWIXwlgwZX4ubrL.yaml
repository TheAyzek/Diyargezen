        Special Materials}</li></ul><hr /><p><strong>PFS
        Legal</strong></p><p>@Source[PZO9406;pages=25]</p><p>Blades made of this
        special metal count as alchemical silver weapons and are immune to rust,
        including that of rust monsters, the rusting grasp spell, and so on.
        They are always masterwork weapons—most often scimitars or longswords;
        the listed price includes the cost of the masterwork bonus.</p><p>No
        aura (nonmagical property); CL —; Craft (alchemy) 5 ranks, Craft
        (weaponsmithing) 5 ranks; Price +750 gp.</p>
