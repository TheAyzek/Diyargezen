        /><p>@Source[PZO1110;pages=213]</p><p>A spell’s range indicates how far
        from you it can reach, as defined in the range entry of the spell
        description. A spell’s range is the maximum distance from you that the
        spell’s effect can occur, as well as the maximum distance at which you
        can designate the spell’s point of origin. If any portion of the spell’s
        area would extend beyond this range, that area is wasted. Standard
        ranges include the following.</p><h2>Personal</h2><p>The spell affects
        only you.</p><h2>Touch</h2><p>You must touch a creature or object to
        affect it. A touch spell that deals damage can score a critical hit just
        as a weapon can. A touch spell threatens a critical hit on a natural
        roll of 20 and deals double damage on a successful critical hit. Some
        touch spells allow you to touch multiple targets. You can touch up to 6
        willing targets as part of the casting, but all targets of the spell
        must be touched in the same round that you finish casting the spell. If
        the spell allows you to touch targets over multiple rounds, touching 6
        creatures is a fullround action.</p><h2>Close</h2><p>The spell reaches
        as far as 25 feet away from you. The maximum range increases by 5 feet
        for every two full caster levels.</p><h2>Medium</h2><p>The spell reaches
        as far as 100 feet + 10 feet per caster level.</p><h2>Long</h2><p>The
        spell reaches as far as 400 feet + 40 feet per caster
        level.</p><h2>Unlimited</h2><p>The spell reaches anywhere on the same
        plane of existence.</p><h2>Range Expressed in Feet</h2><p>Some spells
        have no standard range category, just a range expressed in feet.</p>
