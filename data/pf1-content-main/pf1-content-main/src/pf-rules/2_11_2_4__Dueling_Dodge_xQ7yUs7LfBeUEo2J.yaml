        Resolve}</li><li>@Compendium[pf-content.pf-rules.TKIElX2jdBUYb2Co]{2.11.2.7.
        Duels and Performance
        Combat}</li><li>@Compendium[pf-content.pf-rules.WsVG4G89Q9NeEJT5]{2.11.2.8.
        Duel Results}</li></ul><hr /><p>@Source[PZO1118;pages=151]</p><p>Each
        participant in a duel can take a special action called a dueling dodge.
        This special maneuver gives a duelist a temporary bonus to his AC and on
        Reflex saves, but leaves him vulnerable to other attacks until the start
        of his next turn.</p><p>Whenever a character participating in a duel is
        the target of a melee attack, a ranged attack, a supernatural ability,
        or a spell or spell-like ability from another participant of the duel,
        he can declare that he is making a dueling dodge as an immediate action.
        This grants him a +4 circumstance bonus to his AC and on any Reflex
        saving throws he must make as a result of the attack. This bonus only
        applies until the attack that triggered the immediate action is
        resolved. If the attacker can make more than one such attack, all
        subsequent attacks are resolved as normal. This immediate action must be
        declared before the attack is resolved. If the attack does not require
        an attack roll or a Reflex saving throw, the immediate action is still
        spent, but with no effect.</p><p>Once the attack is resolved, the
        creature that attempted a dueling dodge takes a –2 penalty to his AC and
        on all Reflex saving throws until the start of his next turn (even if
        the duel ends).</p>
