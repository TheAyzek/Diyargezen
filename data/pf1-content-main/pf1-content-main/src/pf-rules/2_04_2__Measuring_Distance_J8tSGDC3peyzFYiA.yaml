        /><p>@Source[PZO1110;pages=192]</p><p>As a general rule, distance is
        measured assuming that 1 square equals 5
        feet.</p><h2>Diagonals</h2><p>When measuring distance, the first
        diagonal counts as 1 square, the second counts as 2 squares, the third
        counts as 1, the fourth as 2, and so on. You can’t move diagonally past
        a corner (even by taking a 5-foot step). You can move diagonally past a
        creature, even an opponent.</p><p>You can also move diagonally past
        other impassable obstacles, such as pits.</p><h2>Closest
        Creature</h2><p>When it’s important to determine the closest square or
        creature to a location, if two squares or creatures are equally close,
        randomly determine which one counts as closest by rolling a die.</p>
