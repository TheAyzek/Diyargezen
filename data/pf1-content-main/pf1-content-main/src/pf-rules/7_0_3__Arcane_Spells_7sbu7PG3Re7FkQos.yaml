        /><p>@Source[PZO1110;pages=218]</p><p>Wizards, sorcerers, and bards cast
        arcane spells. Compared to divine spells, arcane spells are more likely
        to produce dramatic results.</p><h2>Spell Slots</h2><p>The various
        character class tables show how many spells of each level a character
        can cast per day. These openings for daily spells are called spell
        slots. A spellcaster always has the option to fill a higher-level spell
        slot with a lower-level spell. A spellcaster who lacks a high enough
        ability score to cast spells that would otherwise be his due still gets
        the slots but must fill them with spells of lower
        levels.</p><p>@Compendium[pf-content.pf-rules.BIHfeYxy4vvZ5mjt]{7.0.3.1.
        Preparing Wizard
        Spells}</p><p>@Compendium[pf-content.pf-rules.UBqamMQYN3ZGFyMh]{7.0.3.2.
