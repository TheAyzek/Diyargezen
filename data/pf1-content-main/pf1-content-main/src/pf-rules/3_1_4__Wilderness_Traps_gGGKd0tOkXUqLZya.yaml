        /><p>@Source[PZO1140;pages=172]</p><p>Skilled survivalists and trappers
        are adept at fashioning effective, if simple, traps from humble
        materials. A wilderness trap has an associated terrain wherein the raw
        materials for the trap are commonplace. Within these associated
        terrains, the base cost of each trap is calculated in sp rather than gp.
        Wilderness traps always have a CR of 5 or lower.</p><p>When in a trap’s
        associated terrain, instead of paying one-third the item’s price in raw
        materials, the trap maker can attempt a Survival check against the
        normal Craft DC of the trap + 2 × the trap’s CR. If successful, the trap
        maker finds the necessary materials in the wild after 1d4 hours of
        foraging + 1 hour per CR of the trap. She can then attempt a Craft
        (traps) check, also at the normal Craft DC + 2 × the trap’s CR, to build
        the trap, which takes another 1d4 hours + 1 hour per CR of the
        trap.</p><p>Traps built with such crude materials don’t last long
        without maintenance; they have a cumulative 20% chance to break for
        every day they go without being tightened and reset (which requires 10
        minutes of work but no additional skill checks).</p><p>At the GM’s
        discretion, other nonmagical mechanical traps may be considered to have
        associated terrains and use the wilderness trap construction
        rules.</p><p>@Compendium[pf-content.pf-traps-and-haunts.gOYTKgLSSriihzMn]{Breakaway
        Vine (CR
        1)}</p><p>@Compendium[pf-content.pf-traps-and-haunts.A3huBLtNg7XnZX6b]{Musk
