        /><p>@Source[PZO1110;pages=459]</p><p>Many magic items need to be donned
        by a character who wants to employ them or benefit from their abilities.
        It’s possible for a creature with a humanoid-shaped body to wear as many
        as 15 magic items at the same time. However, each of those items must be
        worn on (or over) a particular part of the body, known as a
        “slot.”</p><p>A humanoid-shaped body can be decked out in magic gear
        consisting of one item from each of the following groups, keyed to which
        slot on the body the item is worn.</p><ul><li><strong>Armor</strong>:
        suits of armor.</li><li><strong>Belts</strong>: belts and
        girdles.</li><li><strong>Body</strong>: robes and
        vestments.</li><li><strong>Chest</strong>: mantles, shirts, and
        vests.</li><li><strong>Eyes</strong>: eyes, glasses, and
        goggles.</li><li><strong>Feet</strong>: boots, shoes, and
        slippers.</li><li><strong>Hands</strong>: gauntlets and
        gloves.</li><li><strong>Head</strong>: circlets, crowns, hats, helms,
        and masks.</li><li><strong>Headband</strong>: headbands and
        phylacteries.</li><li><strong>Neck</strong>: amulets, brooches,
        medallions, necklaces, periapts, and scarabs.</li><li><strong>Ring (up
        to two)</strong>: rings.</li><li><strong>Shield</strong>:
        shields.</li><li><strong>Shoulders</strong>: capes and
        cloaks.</li><li><strong>Wrist</strong>: bracelets and
        bracers.</li></ul><p>Of course, a character may carry or possess as many
        items of the same type as he wishes. However, additional items beyond
        those in the slots listed above have no effect.</p><p>Some items can be
        worn or carried without taking up a slot on a character’s body. The
        description of an item indicates when an item has this property.</p>
