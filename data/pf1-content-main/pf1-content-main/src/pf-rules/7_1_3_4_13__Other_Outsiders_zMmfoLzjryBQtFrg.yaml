        /><p>@Source[PZO1117;pages=110]</p><p>While the groups above detail all
        the major types of outsiders, the Great Beyond is called great for a
        reason, and there are countless other outsiders that a potential binder
        can call. In theory, any outsider can be called and a binder can attempt
        to press that creature into service, though the proper strategy for
        doing so is contingent on the abilities, desires, and goals of the
        particular outsider.</p><p>There is one group of outsiders that it is
        more difficult to bind: the native outsider. A native outsider cannot be
        called and bound from the Material Plane. In order to call any outsider,
        it must be on a different plane from the binder. Native outsiders (or
        other outsiders currently manifesting on the Material Plane) can only be
        called and bound by spellcasters on a different plane.</p>
