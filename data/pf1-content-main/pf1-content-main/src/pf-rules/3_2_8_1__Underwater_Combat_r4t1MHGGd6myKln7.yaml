      content: >-
        <p>@Compendium[pf-content.pf-rules.XOJpjqmBzwE4R4n0]{(Index)
        Environment}</p><p>@Compendium[pf-content.pf-rules.CPUpraqn1jz9vhMh]{3.2.
        Wilderness}</p><ul><li><p>@Compendium[pf-content.pf-rules.xiRC5p84P3tFW9mo]{3.2.8.
        Aquatic
        Terrain}</p><ul><li><strong>@Compendium[pf-content.pf-rules.r4t1MHGGd6myKln7]{3.2.8.1.
        Underwater
        Combat}</strong></li><li>@Compendium[pf-content.pf-rules.AlMWpchX9rOkfomx]{3.2.8.2.
        Floods}</li></ul></li></ul><hr
        /><p>@Source[PZO1110;pages=432]</p><p>Land-based creatures can have
        considerable difficulty when fighting in water. Water affects a
        creature’s attack rolls, damage, and movement. In some cases a
        creature’s opponents might get a bonus on attacks. The effects are
        summarized on Table 13–7. They apply whenever a character is swimming,
        walking in chest-deep water, or walking along the bottom of a body of
        water.</p><h2>Ranged Attacks Underwater</h2><p>Thrown weapons are
        ineffective underwater, even when launched from land. Attacks with other
        ranged weapons take a –2 penalty on attack rolls for every 5 feet of
        water they pass through, in addition to the normal penalties for
        range.</p><h2>Attacks from Land</h2><p>Characters swimming, floating, or
        treading water on the surface, or wading in water at least chest deep,
        have improved cover (+8 bonus to AC, +4 bonus on Reflex saves) from
        opponents on land. Land-bound opponents who have freedom of movement
        effects ignore this cover when making melee attacks against targets in
        the water. A completely submerged creature has total cover against
        opponents on land unless those opponents have freedom of movement
        effects. Magical effects are unaffected except for those that require
        attack rolls (which are treated like any other effects) and fire
        effects.</p><h2>Fire</h2><p>Nonmagical fire (including alchemist’s fire)
        does not burn underwater. Spells or spell-like effects with the fire
        descriptor are ineffective underwater unless the caster makes a caster
        level check (DC 20 + spell level). If the check succeeds, the spell
        creates a bubble of steam instead of its usual fiery effect, but
        otherwise the spell works as described. A supernatural fire effect is
        ineffective underwater unless its description states otherwise. The
        surface of a body of water blocks line of effect for any fire spell. If
        the caster has made the caster level check to make the fire spell usable
        underwater, the surface still blocks the spell’s line of
        effect.</p><h2>Spellcasting Underwater</h2><p>Casting spells while
        submerged can be difficult for those who cannot breathe underwater. A
        creature that cannot breathe water must make a concentration check (DC
        15 + spell level) to cast a spell underwater (this is in addition to the
        caster level check to successfully cast a fire spell underwater).
        Creatures that can breathe water are unaffected and can cast spells
        normally. Some spells might function differently underwater, subject to
        GM discretion.</p><h2>Table 13-7: Combat Adjustments
        Underwater</h2><table><thead><tr><td> </td><td>Attack/Damage</td><td>
        </td></tr><tr><td> </td><td>Slashing or
        Bludgeoning</td><td>Piercing</td><td>Movement</td><td>Off
        Balance?<sup>1</sup></td></tr></thead><tbody><tr><td>Freedom of
        movement</td><td>normal/normal</td><td>normal/normal</td><td>normal</td><td>No</td></tr><tr><td>Has
        a swim
        speed</td><td>-2/half</td><td>normal</td><td>normal</td><td>No</td></tr><tr><td>Successful
        Swim check</td><td>-2/half<sup>2</sup></td><td>normal</td><td>quarter or
        half<sup>3</sup></td><td>No</td></tr><tr><td>Firm
        footing<sup>4</sup></td><td>-2/half<sup>2</sup></td><td>normal</td><td>half</td><td>No</td></tr><tr><td>None
        of the
        above</td><td>-2/half<sup>2</sup></td><td>-2/half</td><td>normal</td><td>Yes</td></tr></tbody></table><p><strong>1</strong>
        Creatures flailing about in the water (usually because they failed their
        @UUID[Compendium.pf1.pf1e-rules.JournalEntry.x175kVqUfLGPt8tC.JournalEntryPage.xhmDhOXuBbfVcD0Q]{Swim}
        checks) have a hard time fighting effectively. An off-balance creature
        loses its Dexterity bonus to Armor Class, and opponents gain a +2 bonus
        on attacks against it.</p><p><strong>2</strong> A creature without
        freedom of movement effects or a swim speed makes grapple checks
        underwater at a –2 penalty, but deals damage normally when
        grappling.</p><p><strong>3</strong> A successful Swim check lets a
        creature move one-quarter its speed as a move action or one-half its
        speed as a full-round action.</p><p><strong>4</strong> Creatures have
        firm footing when walking along the bottom, braced against a ship’s
        hull, or the like. A creature can only walk along the bottom if it wears
        or carries enough gear to weigh itself down: at least 16 pounds for
        Medium creatures, twice that for each size category larger than Medium,
        and half that for each size category smaller than Medium.</p>
