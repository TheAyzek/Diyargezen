        Scent}</li><li>@Compendium[pf-content.pf-rules.BGRuRu4kSA0KlT3S]{2.10.18.
        Spell Resistance}</li></ul><hr /><p>@Source[PZO1110;pages=554]</p><p>The
        following special abilities include rules commonly used by a number of
        creatures, spells, and traps.</p><h2>Extraordinary Abilities
        (Ex)</h2><p>Extraordinary abilities are nonmagical. They are, however,
        not something that just anyone can do or even learn to do without
        extensive training. Effects or areas that suppress or negate magic have
        no effect on extraordinary abilities.</p><h2>Spell-Like Abilities
        (Sp)</h2><p>Spell-like abilities, as the name implies, are magical
        abilities that are very much like spells. Spell-like abilities are
        subject to spell resistance and dispel magic. They do not function in
        areas where magic is suppressed or negated (such as an antimagic field).
        Spell-like abilities can be dispelled, but they cannot be counterspelled
        or used to counterspell.</p><h2>Supernatural Abilities
        (Su)</h2><p>Supernatural abilities are magical but not spell-like.
        Supernatural abilities are not subject to spell resistance and do not
        function in areas where magic is suppressed or negated (such as an
        antimagic field). A supernatural ability’s effect cannot be dispelled
        and is not subject to counterspells. See Table 16–1 for a summary of the
        types of special abilities.</p><h2>Table 16-1: Special Ability
        Types</h2><table><thead><tr><td>
        </td><td>Extraordinary</td><td>Spell-Like</td><td>Supernatural</td></tr></thead><tbody><tr><td>Dispel</td><td>No</td><td>Yes</td><td>No</td></tr><tr><td>Spell
        resistance</td><td>No</td><td>Yes</td><td>No</td></tr><tr><td>Antimagic
        field</td><td>No</td><td>Yes</td><td>Yes</td></tr><tr><td>Attack of
        opportunity</td><td>No</td><td>Yes</td><td>No</td></tr></tbody></table><p><strong>Dispel</strong>:
        Can dispel magic and similar spells dispel the effects of abilities of
        that type?</p><p><strong>Spell Resistance</strong>: Does spell
        resistance protect a creature from these
        abilities?</p><p><strong>Antimagic Field</strong>: Does an antimagic
        field or similar magic suppress the ability?</p><p><strong>Attack of
        Opportunity</strong>: Does using the ability provoke attacks of
        opportunity the way that casting a spell does?</p>
