    text:
      content: >-
        <p>@Compendium[pf-content.pf-rules.OiNttXSDW598DIEs]{(Index) Combat
        Rules}</p><p>@Compendium[pf-content.pf-rules.K9b3WAUD63Up5YM2]{2.08.
        Special Initiative
        Actions}</p><ul><li>@Compendium[pf-content.pf-rules.1A7nPEz6CxR5AD9Q]{2.08.1.
        Delay}</li><li>@Compendium[pf-content.pf-rules.Ym7e16lz11IvIRE9]{2.08.2.
        Ready}</li></ul><hr /><p>@Source[PZO1110;pages=203]</p><p>By choosing to
        delay, you take no action and then act normally on whatever initiative
        count you decide to act. When you delay, you voluntarily reduce your own
        initiative result for the rest of the combat. When your new, lower
        initiative count comes up later in the same round, you can act normally.
        You can specify this new initiative result or just wait until some time
        later in the round and act then, thus fixing your new initiative count
        at that point.</p><p>You never get back the time you spend waiting to
        see what’s going to happen. You also can’t interrupt anyone else’s
        action (as you can with a readied action).</p><h2>Initiative
        Consequences of Delaying</h2><p>Your initiative result becomes the count
        on which you took the delayed action. If you come to your next action
        and have not yet performed an action, you don’t get to take a delayed
        action (though you can delay again).</p><p>If you take a delayed action
        in the next round, before your regular turn comes up, your initiative
        count rises to that new point in the order of battle, and you do not get
        your regular action that round.</p>
