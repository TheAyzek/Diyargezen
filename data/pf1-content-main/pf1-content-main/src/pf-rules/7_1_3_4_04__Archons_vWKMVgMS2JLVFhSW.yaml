        /><p>@Source[PZO1117;pages=104]</p><p>As creatures of law and good,
        archons seek order, justice, and the protection of the weak against the
        depredations of the strong. They believe in transformation from within,
        whether through wholesale, systematic change of governance or personal
        epiphany.</p><p>All archons are immune to electricity and petrification
        attacks, and all have DR 10/evil. The magic circle used to summon them
        is made of powdered silver.</p><h2>Hound (SR 15)</h2><p>Disciplined
        soldiers and vigilant sentinels, hound archons are valiant defenders of
        all that is good and holy. They value movement and swift yet thoughtful
        action, and delight in crushing evil; therefore, the best sacrifices
        when summoning a hound archon are magical shields imbued with holy
        power, ensorcelled rings or boots that grant swift or unfettered
        movement, or weaponry of great power.</p><h2>Lantern</h2><p>The least of
        the archons, lantern archons are friendly, and their greatest ambition
        is to see the cause of good advanced. To gain their favor, one should
        engage in a week’s worth of charity or make a sincere offering worth 100
        gp to a good cause in the name of Heaven.</p><h2>Shield (SR
        21)</h2><p>Solid, stoic, and often defensive even in personality, shield
        archons are highly skeptical of those who attempt to bind them, but if
        they can work in the defense of the common good or opposed to the
        machinations of fiends, they commonly ask their binder to care for and
        protect a shrine or temple as a gift for their service.</p><h2>Star (SR
        30)</h2><p>Brilliant, wise, and constantly strategizing the protection
        of Heaven or the defeat of the forces of evil, star archons often chafe
        under the bindings of mortal spellcasters. Negotiations often devolve
        into the star archon blasting his binder for shortsightedness and
        wasting the archon’s time. Star archons demand outrageous gifts even
        when the cause is just. Only when the archon’s and the binder’s goals
        work in close concert are the gifts the archon demands nearly
        attainable.</p><h2>Trumpet (SR 25)</h2><p>Mighty warriors and
        messengers, trumpet archons are the leaders of Heaven’s strike forces
        and the heralds of gods. To gain their favor, one must prove worthy of
        their presence; rather than making offerings of things, trumpet archons
        ask for sacrifices of service and time, and any binder who offers an
        exchange of services—and intends to keep her word—gains a +2 Charisma
        bonus. Those who renege on their bonds see their fortunes begin to
        vanish, and take a –2 Charisma penalty when dealings with good
        extraplanar creatures until they set matters right.</p>
