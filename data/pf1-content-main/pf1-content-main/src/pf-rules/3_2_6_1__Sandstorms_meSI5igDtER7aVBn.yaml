      content: >-
        <p>@Compendium[pf-content.pf-rules.XOJpjqmBzwE4R4n0]{(Index)
        Environment}</p><p>@Compendium[pf-content.pf-rules.CPUpraqn1jz9vhMh]{3.2.
        Wilderness}</p><ul><li>@Compendium[pf-content.pf-rules.3YyU7Yg6wbShgOKM]{3.2.6.
        Desert Terrain}</li></ul><hr /><p>@Source[PZO1110;pages=431]</p><p>A
        sandstorm reduces visibility to 1d10 × 5 feet and provides a –4 penalty
        on Perception checks. A sandstorm deals 1d3 points of nonlethal damage
        per hour to any creatures caught in the open, and leaves a thin coating
        of sand in its wake. Driving sand creeps in through all but the most
        secure seals and seams, chafing skin and contaminating carried gear.</p>
