        /><p>@Source[PZO1118;pages=170]</p><p>A vehicle is a special movable
        object that requires two things to keep it moving—a driver and a method
        of propulsion. A driver is a creature with an Intelligence score of 3 or
        more who is physically able to use the vehicle’s driving mechanism. In
        other words, the creature needs to be the correct size and have the
        correct anatomy to use whatever tool is used to drive the vehicle.
        Sometimes a driving mechanism may have its own requirements for use. The
        driver uses that mechanism and her skill (or her Wisdom) to control the
        vehicle. Without a driver, a vehicle will not move or will continue
        moving in a straight line, depending on the vehicle’s state when it
        becomes driverless.</p><p>A creature must be the size of a vehicle or
        smaller in order to drive it.</p>
