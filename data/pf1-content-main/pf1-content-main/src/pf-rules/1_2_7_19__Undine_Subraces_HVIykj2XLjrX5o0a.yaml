      content: >-
        <h2> Mistsoul (Vapor
        Undine)</h2><p>@Source[PZO9492;pages=21]</p><p>Soothing and insightful,
        mistsoul undines move through the world with airy resilience and earnest
        action.</p><p><strong>Typical Alignment</strong> NG<br /><strong>Ability
        Modifiers</strong> +2 Con, +2 Wis, –2 Int<br /><strong>Alternate
        Spell-Like Ability</strong> Mistsouls gain <em>obscuring mist</em> as a
        spell-like ability.<br /><strong>Mist Affinity</strong> This racial
        trait functions as and can be replaced as the base undine’s water
        affinity, except it benefits sorcerers with the dreamspun bloodline and
        spellcasters with the Repose domain.</p><p>With gentle spirits and
        contemplative minds, mistsouls are drawn to the more mystic aspects of
        their element. Their ephemeral, vaporous natures can allow them to lull
        others into a dreamlike state, or facilitate a peaceful transition into
        the next life. They tend to seek out places where ideological and
        political struggles converge, and thus they are at home in communities
        like those of the common folk of Brevoy.</p><p>Physically, mistsouls
        have rounded features and graceful deliberation in their movement. They
        prefer soft, highquality garments of neutral or earth tones and simple
        jewelry chosen for significance rather than expense.</p><h2> Rimesoul
        (Frost Undine)</h2><p>@Source[PZO9492;pages=21]</p><p>Rimesoul undines
        are distant and imperious, aloof in their intellect and hesitant to
        change their ways.</p><p><strong>Typical Alignment</strong> LN<br
        /><strong>Ability Modifiers</strong> +2 Dex, +2 Int, –2 Cha<br
        /><strong>Alternate Spell-Like Ability</strong> Rimesouls gain <em>chill
        touch</em> as a spell-like ability.<br /><strong>Ice Affinity</strong>
        This racial trait functions as and can be replaced as the base undine’s
        water affinity, except it benefits sorcerers with the boreal bloodline
        and spellcasters with the Ice subdomain.</p><p>Like their ice-coated
        ancestors, rimesouls represent the solidification of change. They have
        precise, ordered minds that take well to individual pursuits. Rimesouls
        often choose to live in sparsely populated areas in Irrisen and Varisia.
        When they do live in cities, they prefer areas of disciplined culture
        such as Druma and Cheliax.</p><p>In appearance, rimesouls are frequently
        pale, sometimes with translucent or blue-tinged skin. Rimesouls usually
        dress in crisp, understated fashions that present an impression of
        austerity.</p>
