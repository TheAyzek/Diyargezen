        /><p>@Source[PZO1110;pages=441]</p><p>Two planes that are separate do
        not overlap or directly connect to each other. They are like planets in
        different orbits. The only way to get from one separate plane to the
        other is to go through a third plane, such as a Transitive
        Plane.</p><h2>Coterminous Planes</h2><p>Planes that touch at specific
        points are coterminous. Where they touch, a connection exists, and
        travelers can leave one reality behind and enter the
        other.</p><h2>Coexistent Planes</h2><p>If a link between two planes can
        be created at any point, the two planes are coexistent. These planes
        overlap each other completely. A coexistent plane can be reached from
        anywhere on the plane it overlaps. When moving on a coexistent plane, it
        is often possible to see into or interact with the plane with which it
        coexists.</p>
