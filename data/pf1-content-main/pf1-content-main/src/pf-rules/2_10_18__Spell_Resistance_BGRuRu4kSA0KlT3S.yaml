        /><p>@Source[PZO1110;pages=565]</p><p>Spell resistance is the
        extraordinary ability to avoid being affected by spells. Some spells
        also grant spell resistance.</p><p>To affect a creature that has spell
        resistance, a spellcaster must make a caster level check (1d20 + caster
        level) at least equal to the creature’s spell resistance. The defender’s
        spell resistance is like an Armor Class against magical attacks. If the
        caster fails the check, the spell doesn’t affect the creature. The
        possessor does not have to do anything special to use spell resistance.
        The creature need not even be aware of the threat for its spell
        resistance to operate.</p><p>Only spells and spell-like abilities are
        subject to spell resistance. Extraordinary and supernatural abilities
        (including enhancement bonuses on magic weapons) are not. A creature can
        have some abilities that are subject to spell resistance and some that
        are not. Even some spells ignore spell resistance; see When Spell
        Resistance Applies, below.</p><p>A creature can voluntarily lower its
        spell resistance. Doing so is a standard action that does not provoke an
        attack of opportunity. Once a creature lowers its resistance, it remains
        down until the creature’s next turn. At the beginning of the creature’s
        next turn, the creature’s spell resistance automatically returns unless
        the creature intentionally keeps it down (also a standard action that
        does not provoke an attack of opportunity).</p><p>A creature’s spell
        resistance never interferes with its own spells, items, or
        abilities.</p><p>A creature with spell resistance cannot impart this
        power to others by touching them or standing in their midst. Only the
        rarest of creatures and a few magic items have the ability to bestow
        spell resistance upon another.</p><p>Spell resistance does not stack,
        but rather
        overlaps.</p><p>@Compendium[pf-content.pf-rules.NCoOEMryEMMhBOzI]{2.10.18.1.
        When Spell Resistance
        Applies}</p><p>@Compendium[pf-content.pf-rules.kwXGX54IlZcswZMR]{2.10.18.2.
        Successful Spell Resistance}</p>
