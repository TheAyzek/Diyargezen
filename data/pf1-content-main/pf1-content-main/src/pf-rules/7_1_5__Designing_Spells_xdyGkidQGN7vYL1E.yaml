        /><p>@Source[PZO1117;pages=128]</p><p>Designing spells for the
        Pathfinder Roleplaying Game is a complex task that is part art, part
        science. This section describes what you need to think about when
        designing balanced, playable spells for your campaign.</p><p>Unlike
        magic items, spells have predefined power levels corresponding to the
        spell levels already in the game. When you design a spell, you have to
        take those power levels into account by comparing the new spell to
        existing spells in the Core Rulebook—a spell has to fall into the narrow
        range of power for one of the nine spell levels (plus cantrips or
        orisons). In contrast, prices for magic items are strongly granular, and
        are calculated to the gold piece based on precisely what features the
        item possesses. In other words, if you add more power to a magic item,
        you just increase its price to compensate, but if you add too much power
        to a spell, you have to make it a higher-level spell, which means you
        then have to compare it to a different set of example spells.</p>
