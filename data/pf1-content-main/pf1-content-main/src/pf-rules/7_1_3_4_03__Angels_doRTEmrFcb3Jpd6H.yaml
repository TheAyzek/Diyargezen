        /><p>@Source[PZO1117;pages=104]</p><p>All angels have numerous
        immunities and damage resistances, allowing them to travel across many
        planes of the multiverse without fear of damage. Interestingly, they can
        still take damage from poison, but they are strong enough to withstand
        most ill effects and punish those who would inflict such treacherous
        pain on them. They are exceptionally vulnerable to unholy weapons;
        solars are also vulnerable to epic-strength weapons and artifacts.
        Angels’ protective auras grant them protection against attacks made or
        effects created by evil creatures, as well as protecting those creatures
        around them. Any mortals who wish to deal with angels should be armed
        with humility and knowledge.</p><p>Angels are immune to acid, cold, and
        petrification effects. They also have resistance to electricity 10 and
        fire 10.</p><h2>Astral Deva (SR 25)</h2><p>Astral devas are the
        messengers of the gods of good—or, if one were to be cynical, the
        gossips of the heavens. The appropriate gift for an astral deva is
        knowledge of a place it cannot reach: a rival temple, the location of
        evil cultists, or some other evil that has a direct bearing on the
        Material Plane</p><h2>Cassisian</h2><p>The weakest sort of angels,
        cassisians serve as the messengers of more powerful angels, and
        frequently serve good spellcasters on the Material Plane as familiars.
        Formed from the souls of pious soldiers, they are often simply appeased
        with gifts that allow them to join the fray against evil
        creatures.</p><h2>Monadic Deva (SR 23)</h2><p>Watchers of the Ethereal
        Plane and the Elemental Planes, monadic devas usually serve those who
        summon them only in purposes that deal with their duties on those
        planes. Stubborn in their causes, they demand outrageous gifts of
        servitude toward their own lofty goals.</p><h2>Movanic Deva (SR
        21)</h2><p>Soldier angels who often patrol the Positive Energy Plane,
        Negative Energy Plane, and Material Plane, these devas battle undead and
        the strange creatures that hunt the hungry void. When summoned to the
        Material Plane, they serve as forthright soldiers for the cause of good,
        and are appeased with gifts that allow them greater power to hunt undead
        and sceaduinar.</p><h2>Planetar (SR 27)</h2><p>As the leaders of
        celestial armies, planetars seek knowledge and information regarding the
        plans of their infernal foes. Providing valuable data regarding the
        movement of evil forces, the locations of caches of evil weapons, or the
        locations of portals to the netherworld gives the binder a +2 Charisma
        bonus when dealing with planetars.</p><h2>Solar (SR 34)</h2><p>The
        greatest warriors of goodness, solars do not typically treat directly
        with mortals. To summon a solar and bargain with it, a wizard must
        destroy an item of great evil in the solar’s name, crush a powerful evil
        in the world, or offer an evil relic as part of the summoning.</p>
