        /><p>@Source[PZO1110]</p><p>A familiar is an animal chosen by a
        spellcaster to aid him in his study of magic. It retains the appearance,
        Hit Dice, base attack bonus, base save bonuses, skills, and feats of the
        normal animal it once was, but is now a magical beast for the purpose of
        effects that depend on its type. Only a normal, unmodified animal may
        become a familiar. An animal companion cannot also function as a
        familiar.</p><p>A familiar grants special abilities to its master, as
        given on the table below. These special abilities apply only when the
        master and familiar are within 1 mile of each other.</p><p>Levels of
        different classes that are entitled to familiars stack for the purpose
        of determining any familiar abilities that depend on the master's
        level.</p><p>If a familiar is dismissed, lost or dies, it can be
        replaced 1 week later through a specialized ritual that costs 200 gp per
        wizard level. The ritual takes 8 hours to complete.</p>
