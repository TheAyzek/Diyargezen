        Thirst}</li><li>@Compendium[pf-content.pf-rules.IzDTrpYeEht9VTOF]{3.6.09.
        Suffocation}</li><li>@Compendium[pf-content.pf-rules.dErmNWeOdWiEyQVB]{3.6.10.
        Water Dangers}</li></ul><hr /><p>@Source[PZO1110;pages=444]</p><p>Heat
        deals nonlethal damage that cannot be recovered from until the character
        gets cooled off (reaches shade, survives until nightfall, gets doused in
        water, is targeted by endure elements, and so forth). Once a character
        has taken an amount of nonlethal damage equal to her total hit points,
        any further damage from a hot environment is lethal damage.</p><p>A
        character in very hot conditions (above 90° F) must make a Fortitude
        saving throw each hour (DC 15, +1 for each previous check) or take 1d4
        points of nonlethal damage. Characters wearing heavy clothing or armor
        of any sort take a –4 penalty on their saves. A character with the
        Survival skill may receive a bonus on this saving throw and might be
        able to apply this bonus to other characters as well (see the skill
        description).</p><p>Characters reduced to unconsciousness begin taking
        lethal damage (1d4 points per hour).</p><p>In severe heat (above 110°
        F), a character must make a Fortitude save once every 10 minutes (DC 15,
        +1 for each previous check) or take 1d4 points of nonlethal damage.
        Characters wearing heavy clothing or armor of any sort take a –4 penalty
        on their saves. A character with the Survival skill may receive a bonus
        on this saving throw and might be able to apply this bonus to other
        characters as well (see the Survival skill in Chapter 4). Characters
        reduced to unconsciousness begin taking lethal damage (1d4 points per
        each 10-minute period).</p><p>A character who takes any nonlethal damage
        from heat exposure now suffers from heatstroke and is fatigued. These
        penalties end when the character recovers from the nonlethal damage she
        took from the heat.</p><p>Extreme heat (air temperature over 140° F,
        fire, boiling water, lava) deals lethal damage. Breathing air in these
        temperatures deals 1d6 points of fire damage per minute (no save). In
        addition, a character must make a Fortitude save every 5 minutes (DC 15,
        +1 per previous check) or take 1d4 points of nonlethal damage. Those
        wearing heavy clothing or any sort of armor take a –4 penalty on their
        saves.</p><p>Boiling water deals 1d6 points of scalding damage, unless
        the character is fully immersed, in which case it deals 10d6 points of
        damage per round of exposure.</p>
