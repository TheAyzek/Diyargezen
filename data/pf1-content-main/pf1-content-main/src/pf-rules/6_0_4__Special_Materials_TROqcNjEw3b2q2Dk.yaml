        /><p>@Source[PZO1123]</p><p>Weapons and armor can be crafted using
        materials that have innate special properties. If you make a suit of
        armor or a weapon out of more than one special material, you get the
        benefit of only the most prevalent material. However, you can build a
        double weapon with each head made of a different special
        material.</p><p>Each of the special materials described below has a
        definite game effect. Some creatures have damage reduction that makes
        them resistant to all but a special type of damage, such as that dealt
        by evil-aligned weapons or bludgeoning weapons. Others are vulnerable to
        weapons of a particular material. Characters may choose to carry several
        different types of weapons, depending upon the types of creatures they
        most commonly
        encounter.</p><ul><li>@Compendium[pf-content.pf-rules.TcSsRfAEa0XKLFf8]{6.0.4.01.
