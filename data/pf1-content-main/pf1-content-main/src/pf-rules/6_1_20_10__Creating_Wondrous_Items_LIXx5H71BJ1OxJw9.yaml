        /><p>@Source[PZO1110;pages=553]</p><p>To create a wondrous item, a
        character usually needs some sort of equipment or tools to work on the
        item. She also needs a supply of materials, the most obvious being the
        item itself or the pieces of the item to be assembled. The cost for the
        materials is subsumed in the cost for creating the item. Wondrous item
        costs are difficult to determine. Refer to Table 15–29 and use the item
        prices in the item descriptions as a guideline. Creating an item costs
        half the market value listed.</p><p>If spells are involved in the
        prerequisites for making the item, the creator must have prepared the
        spells to be cast (or must know the spells, in the case of a sorcerer or
        bard) but need not provide any material components or focuses the spells
        require. The act of working on the item triggers the prepared spells,
        making them unavailable for casting during each day of the item’s
        creation. (That is, those spell slots are expended from the caster’s
        currently prepared spells, just as if they had been
        cast.)</p><p>Creating some items may entail other prerequisites beyond
        or other than spellcasting. See the individual descriptions for
        details.</p><p>Crafting a wondrous item requires 1 day for each 1,000 gp
        of the base price.</p><h2>Item Creation Feat Required</h2><p>Craft
        Wondrous Item.</p><h2>Skill Used In Creation</h2><p>Spellcraft or an
        applicable Craft or Profession skill check.</p>
