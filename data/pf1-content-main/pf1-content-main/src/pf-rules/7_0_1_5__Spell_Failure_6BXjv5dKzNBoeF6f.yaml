        /><p>@Source[PZO1110;pages=208]</p><p>If you ever try to cast a spell in
        conditions where the characteristics of the spell cannot be made to
        conform, the casting fails and the spell is wasted.</p><p>Spells also
        fail if your concentration is broken and might fail if you’re wearing
        armor while casting a spell with somatic components.</p>
