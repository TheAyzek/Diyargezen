        /><p>@Source[PZO1110;pages=417]</p><p>The builder sets the Perception
        and Disable Device DCs for a mechanical trap. For a magic trap, the
        values depend on the highest-level spell used.</p><h2>Mechanical
        Trap</h2><p>The base DC for both Perception and Disable Device checks is
        20. Raising or lowering either of these DCs affects the CR (Table
        13–3).</p><h2>Magic Trap</h2><p>The DC for both Perception and Disable
        Device checks is equal to 25 + the spell level of the highestlevel spell
        used. Only characters with the trapfinding class feature can attempt a
        Disable Device check involving a magic trap.</p>
