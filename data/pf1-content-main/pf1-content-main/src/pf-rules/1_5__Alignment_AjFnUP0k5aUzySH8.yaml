    text:
      content: >-
        <p>@Compendium[pf-content.pf-rules.8scSEgBEtJZj0suf]{(Index) Basic
        Rules}</p><ul><li><strong>@Compendium[pf-content.pf-rules.AjFnUP0k5aUzySH8]{1.5.
        Alignment}</strong></li><li>@Compendium[pf-content.pf-rules.ojEKZZWsMZOo6US7]{1.5.1.
        The Nine
        Alignments}</li><li>@Compendium[pf-content.pf-rules.eLunMrqifsJQo9d8]{1.5.2.
        Changing Alignment}</li></ul><hr /><p>@Source[PZO1110;pages=166]</p><p>A
        creature’s general moral and personal attitudes are represented by its
        alignment: lawful good, neutral good, chaotic good, lawful neutral,
        neutral, chaotic neutral, lawful evil, neutral evil, or chaotic
        evil.</p><p>Alignment is a tool for developing your character’s
        identity—it is not a straitjacket for restricting your character. Each
        alignment represents a broad range of personality types or personal
        philosophies, so two characters of the same alignment can still be quite
        different from each other. In addition, few people are completely
        consistent.</p><p>All creatures have an alignment. Alignment determines
        the effectiveness of some spells and magic items.</p><p>Animals and
        other creatures incapable of moral action are neutral. Even deadly
        vipers and tigers that eat people are neutral because they lack the
        capacity for morally right or wrong behavior. Dogs may be obedient and
        cats free-spirited, but they do not have the moral capacity to be truly
        lawful or chaotic.</p><h2>Good Versus Evil</h2><p>Good characters and
        creatures protect innocent life. Evil characters and creatures debase or
        destroy innocent life, whether for fun or
        profit.</p><p><strong>Good</strong> implies altruism, respect for life,
        and a concern for the dignity of sentient beings. Good characters make
        personal sacrifices to help others.</p><p><strong>Evil</strong> implies
        hurting, oppressing, and killing others. Some evil creatures simply have
        no compassion for others and kill without qualms if doing so is
        convenient. Others actively pursue evil, killing for sport or out of
        duty to some evil deity or master.</p><p>People who are
        <strong>neutral</strong> with respect to good and evil have compunctions
        against killing the innocent, but may lack the commitment to make
        sacrifices to protect or help others.</p><h2>Law Versus
        Chaos</h2><p>Lawful characters tell the truth, keep their word, respect
        authority, honor tradition, and judge those who fall short of their
        duties. Chaotic characters follow their consciences, resent being told
        what to do, favor new ideas over tradition, and do what they promise if
        they feel like it.</p><p><strong>Law</strong> implies honor,
        trustworthiness, obedience to authority, and reliability. On the
        downside, lawfulness can include closed-mindedness, reactionary
        adherence to tradition, self-righteousness, and a lack of adaptability.
        Those who consciously promote lawfulness say that only lawful behavior
        creates a society in which people can depend on each other and make the
        right decisions in full confidence that others will act as they
        should.</p><p><strong>Chaos</strong> implies freedom, adaptability, and
        flexibility. On the downside, chaos can include recklessness, resentment
        toward legitimate authority, arbitrary actions, and irresponsibility.
        Those who promote chaotic behavior say that only unfettered personal
        freedom allows people to express themselves fully and lets society benef
        it from the potential that its individuals have within
        them.</p><p>Someone who is <strong>neutral</strong> with respect to law
        and chaos has some respect for authority and feels neither a compulsion
        to obey nor a compulsion to rebel. She is generally honest, but can be
        tempted into lying or deceiving others.</p><h2>Alignment
        Steps</h2><p>Occasionally the rules refer to “steps” when dealing with
        alignment. In this case, “steps” refers to the number of alignment
        shifts between the two alignments, as shown on the following diagram.
        Note that diagonal “steps” count as two steps. For example, a lawful
        neutral character is one step away from a lawful good alignment, and
        three steps away from a chaotic evil alignment. A cleric’s alignment
        must be within one step of the alignment of her
        deity.</p><p>@JournalEntry[TrN8uuKTVhHM8YWX]{1.5.1. The Nine
        Alignments}</p><table><thead><tr><td>
        </td><td>Lawful</td><td>Neutral</td><td>Chaotic</td></tr></thead><tbody><tr><td><strong>Good</strong></td><td>Lawful
        Good</td><td>Neutral Good</td><td>Chaotic
        Good</td></tr><tr><td><strong>Neutral</strong></td><td>Lawful
        Neutral</td><td>Neutral</td><td>Chaotic
        Neutral</td></tr><tr><td><strong>Evil</strong></td><td>Lawful
        Evil</td><td>Neutral Evil</td><td>Chaotic Evil</td></tr></tbody></table>
