        Points}</li><li>@Compendium[pf-content.pf-rules.Rft1LIY5C8XOK3Kr]{2.11.4.4.
        Siege Engine Details}</li></ul><hr /><h2>Special Siege Engine
        Ammunition</h2><p>@Source[PZO1118;pages=163]</p><p>The following kinds
        of ammunition can be used either in select types of indirect-fire siege
        engines, or with cannons. The ammunition description specifies which
        types of siege engines use the special ammunition. The costs and weights
        on Table 3–14 are for individual uses of special
        ammunition.</p><h2>Close Assault Siege
        Engines</h2><p>@Source[PZO1118;pages=165]</p><p>While most siege engines
        attack at range, some are used up close to directly undermine defenses,
        batter through them, or otherwise bypass them. Some close assault
        weapons are not even weapons at all, but instead provide means for
        assault forces to protect themselves or circumvent fortifications
        without destroying them.</p>
