        /><p>@Source[PZO1110;pages=423]</p><p>Designing new traps is a simple
        process. Start by deciding what type of trap you want to
        create.</p><h2>Mechanical Traps</h2><p>Simply select the elements you
        want the trap to have and add up the adjustments to the trap’s Challenge
        Rating that those elements require (see Table 13–3) to arrive at the
        trap’s final CR. From the CR you can derive the DC of the Craft (traps)
        checks a character must make to construct the trap (see
        @UUID[Compendium.pf-content.pf-rules.JournalEntry.47DJOElNsrdRkBxn]{3.1.3.5.
        Craft DCs for Mechanical Traps}).</p><h2>Table 13-3: CR Modifiers for
        Mechanical Traps</h2><table><thead><tr><td>Feature</td><td>CR
        Modifier</td></tr></thead><tbody><tr><td>Perception DC</td><td>
        </td></tr><tr><td>15 or
        lower</td><td>-1</td></tr><tr><td>16-20</td><td>—</td></tr><tr><td>21-25</td><td>+1</td></tr><tr><td>26-29</td><td>+2</td></tr><tr><td>30
        or higher</td><td>+3</td></tr><tr><td>Disable Device DC</td><td>
        </td></tr><tr><td>15 or
        lower</td><td>-1</td></tr><tr><td>16-20</td><td>—</td></tr><tr><td>21-25</td><td>+1</td></tr><tr><td>26-29</td><td>+2</td></tr><tr><td>30
        or higher</td><td>+3</td></tr><tr><td>Reflex Save DC (Pit or Other
        Save-Dependent Trap</td><td> </td></tr><tr><td>15 or
        lower</td><td>-1</td></tr><tr><td>16-20</td><td>—</td></tr><tr><td>21-25</td><td>+1</td></tr><tr><td>26-29</td><td>+2</td></tr><tr><td>30
        or higher</td><td>+3</td></tr><tr><td>Attack Bonus (Melee or Ranged
        Attack Trap)</td><td> </td></tr><tr><td>+0 or
        lower</td><td>-2</td></tr><tr><td>+1 to
        +5</td><td>-1</td></tr><tr><td>+6 to +10</td><td>—</td></tr><tr><td>+11
        to +15</td><td>+1</td></tr><tr><td>+16 to
        +20</td><td>+2</td></tr><tr><td>Touch
        attack</td><td>+1</td></tr><tr><td>Damage/Effect</td><td>
        </td></tr><tr><td>Average damage</td><td>+1 per 10 points of average
        damage</td></tr><tr><td>Miscellaneous Features</td><td>
        </td></tr><tr><td>Alchemical device</td><td>Level of spell
        mimicked</td></tr><tr><td>Automatic
        reset</td><td>+1</td></tr><tr><td>Liquid</td><td>+5</td></tr><tr><td>Multiple
        targets (non-damage)</td><td>+1</td></tr><tr><td>Never
        miss</td><td>+2</td></tr><tr><td>Proximity or visual
        trigger</td><td>+1</td></tr></tbody></table><table><thead><tr><td>Poison</td><td>CR
        of poison</td></tr></thead><tbody><tr><td>Black adder
        venom</td><td>+1</td></tr><tr><td>Black lotus
        extract</td><td>+8</td></tr><tr><td>Bloodroot</td><td>+1</td></tr><tr><td>Blue
        whinnis</td><td>+1</td></tr><tr><td>Burnt othur
        fumes</td><td>+6</td></tr><tr><td>Deathblade</td><td>+5</td></tr><tr><td>Dragon
        bile</td><td>+6</td></tr><tr><td>Giant wasp
        poison</td><td>+3</td></tr><tr><td>Greenblood
        oil</td><td>+1</td></tr><tr><td>Insanity
        mist</td><td>+4</td></tr><tr><td>Large scorpion
        venom</td><td>+3</td></tr><tr><td>Malyass root
        paste</td><td>+3</td></tr><tr><td>Medium spider
        venom</td><td>+2</td></tr><tr><td>Nitharit</td><td>+4</td></tr><tr><td>Purple
        worm poison</td><td>+4</td></tr><tr><td>Sassone leaf
        residue</td><td>+3</td></tr><tr><td>Shadow
        essence</td><td>+3</td></tr><tr><td>Small centipede
        poison</td><td>+1</td></tr><tr><td>Terinav
        root</td><td>+5</td></tr><tr><td>Ungol
        dust</td><td>+3</td></tr><tr><td>Wyvern
        poison</td><td>+5</td></tr></tbody></table><h2>Magic Traps</h2><p>As
        with mechanical traps, decide what elements you want and then determine
        the CR of the resulting trap (see Table 13–4). If a player character
        wants to design and construct a magic trap, he, or an ally, must have
        the Craft Wondrous Item feat. In addition, he must be able to cast the
        spell or spells that the trap requires—or he must be able to hire an NPC
        to cast the spells for him.</p><h2>Table 13-4: CR Modifiers for Magic
        Traps</h2><table><thead><tr><td>Feature</td><td>CR
        Modifier</td></tr></thead><tbody><tr><td>Highest-level spell
        effect</td><td>+Spell level</td></tr><tr><td>Damaging spell
        effect</td><td>+1 per 10 points of average
        damage</td></tr></tbody></table>
