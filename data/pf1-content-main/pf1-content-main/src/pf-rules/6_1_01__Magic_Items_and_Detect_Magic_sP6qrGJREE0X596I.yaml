        /><p>@Source[PZO1110;pages=458]</p><p>When detect magic identifies a
        magic item’s school of magic, this information refers to the school of
        the spell placed within the potion, scroll, or wand, or the prerequisite
        given for the item. The description of each item provides its aura
        strength and the school to which it belongs.</p><p>See
        @UUID[Compendium.pf1.pf1e-rules.JournalEntry.x175kVqUfLGPt8tC.JournalEntryPage.BWeqgXSZvUQl68vt]{Knowledge}
        and
        @UUID[Compendium.pf1.pf1e-rules.JournalEntry.x175kVqUfLGPt8tC.JournalEntryPage.VRD7jxiIAxKPt6EF]{Spellcraft}</p><p>If
        more than one spell is given as a prerequisite, use the highest-level
        spell. If no spells are included in the prerequisites, use the following
        default guidelines.</p><table><thead><tr><td>Item
        Nature</td><td>School</td></tr></thead><tbody><tr><td>Armors and
        protection items</td><td>Abjuration</td></tr><tr><td>Weapons or
        offensive items</td><td>Evocation</td></tr><tr><td>Bonus to ability
        score, skill check, etc.</td><td>Transmutation</td></tr></tbody></table>
