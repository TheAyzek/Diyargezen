        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p>@Source[PZO9434]</p><p>The
        choicest, most malleable skin from a dragon’s underbelly can be added to
        any weapon with a hilt or handle. Dragonskin grips may be added to an
        existing weapon, or incorporated into a new weapon during crafting. The
        skin provides extra grip, granting the wielder a +2 bonus to CMD against
        disarm attempts. Producing a dragonskin grip requires the Dragoncrafting
        feat and a successful DC 15 Craft (bows or weapons) check.</p>
