        /><p>@Source[PZO1110;pages=208]</p><p>Many special spell effects are
        handled according to the school of the spells in question. Certain other
        special spell features are found across spell
        schools.</p><h2>Attacks</h2><p>Some spell descriptions refer to
        attacking. All offensive combat actions, even those that don’t damage
        opponents, are considered attacks. Attempts to channel energy count as
        attacks if it would harm any creatures in the area. All spells that
        opponents resist with saving throws, that deal damage, or that otherwise
        harm or hamper subjects are attacks. Spells that summon monsters or
        other allies are not attacks because the spells themselves don’t harm
        anyone.</p><h2>Bonus Types</h2><p>Usually, a bonus has a type that
        indicates how the spell grants the bonus. The important aspect of bonus
        types is that two bonuses of the same type don’t generally stack. With
        the exception of dodge bonuses, most circumstance bonuses, and racial
        bonuses, only the better bonus of a given type works (see Combining
        Magical Effects). The same principle applies to penalties—a character
        taking two or more penalties of the same type applies only the worst
        one, although most penalties have no type and thus always stack. Bonuses
        without a type always stack, unless they are from the same
        source.</p><h2>Bringing Back the Dead</h2><p>Several spells have the
        power to restore slain characters to life.</p><p>When a living creature
        dies, its soul departs its body, leaves the Material Plane, travels
        through the Astral Plane, and goes to abide on the plane where the
        creature’s deity resides. If the creature did not worship a deity, its
        soul departs to the plane corresponding to its alignment. Bringing
        someone back from the dead involves magically retrieving his soul and
        returning it to his body. For more information on the planes, see
        Chapter 13.</p><h2>Negative Levels</h2><p>Any creature brought back to
        life usually gains one or more permanent negative levels (see Appendix
        1). These levels apply a penalty to most rolls until removed through
        spells such as restoration. If the character was 1st level at the time
        of death, he loses 2 points of Constitution instead of gaining a
        negative level.</p><h2>Preventing Revivification</h2><p>Enemies can take
        steps to make it more difficult for a character to be returned from the
        dead. Keeping the body prevents others from using raise dead or
        resurrection to restore the slain character to life. Casting trap the
        soul prevents any sort of revivification unless the soul is first
        released.</p><h2>Revivification against One’s Will</h2><p>A soul can’t
        be returned to life if it doesn’t wish to be. A soul knows the name,
        alignment, and patron deity (if any) of the character attempting to
        revive it and may refuse to return on that basis.</p>
