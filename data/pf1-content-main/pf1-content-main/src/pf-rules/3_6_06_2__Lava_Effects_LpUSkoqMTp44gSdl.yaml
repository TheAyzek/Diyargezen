        Lava Effects}</strong></li></ul></li></ul><hr
        /><p>@Source[PZO1110;pages=444]</p><p>Lava or magma deals 2d6 points of
        fire damage per round of exposure, except in the case of total immersion
        (such as when a character falls into the crater of an active volcano),
        which deals 20d6 points of fire damage per round.</p><p>Damage from lava
        continues for 1d3 rounds after exposure ceases, but this additional
        damage is only half of that dealt during actual contact (that is, 1d6 or
        10d6 points per round). Immunity or resistance to fire serves as an
        immunity or resistance to lava or magma. A creature immune or resistant
        to fire might still drown if completely immersed in lava (see
        Drowning).</p>
