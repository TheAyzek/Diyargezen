        /><p>@Source[PZO1110;pages=437]</p><p>If a city has main thoroughfares,
        they are lined with lanterns hanging at a height of 7 feet from building
        awnings. These lanterns are spaced 60 feet apart, so their illumination
        is all but continuous. Secondary streets and alleys are not lit; it is
        common for citizens to hire lantern-bearers when going out after
        dark.</p><p>Alleys can be dark places even in daylight, thanks to the
        shadows of the tall buildings that surround them. A dark alley in
        daylight is rarely dark enough to afford true concealment, but it can
        lend a +2 circumstance bonus on Stealth checks.</p>
