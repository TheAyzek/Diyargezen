        Standard
        Actions}</li><li>@Compendium[pf-content.pf-rules.m0W4ZfFwuk8VvtqJ]{2.02.2.
        Move
        Actions}</li><li>@Compendium[pf-content.pf-rules.q5bgNObausAXw2UA]{2.02.3.
        Full-Round
        Actions}</li><li>@Compendium[pf-content.pf-rules.cxuyKuA6aplz0W8K]{2.02.4.
        Free
        Actions}</li><li>@Compendium[pf-content.pf-rules.EwuWKrrT3zgSlesa]{2.02.5.
        Swift
        Actions}</li><li>@Compendium[pf-content.pf-rules.MXmX8k8motOf98dp]{2.02.6.
