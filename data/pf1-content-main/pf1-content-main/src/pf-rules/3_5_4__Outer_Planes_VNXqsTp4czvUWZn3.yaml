        /><p>@Source[PZO1110;pages=440]</p><p>Beyond the realm of the mortal
        world, beyond the building blocks of reality, lie the Outer Planes. Vast
        beyond imagining, it is to these realms that the souls of the dead
        travel, and it is upon these realms in which the gods themselves hold
        court.</p><p>Each of the Outer Planes has an alignment, representing a
        particular moral or ethical outlook, and the natives of each plane tend
        to behave in agreement with that plane’s alignment. The Outer Planes are
        also the final resting place of souls from the Material Plane, whether
        that final rest takes the form of calm introspection or eternal
        damnation. The denizens of the Outer Planes form the mythologies of
        civilization, comprising angels and demons, titans and devils, and
        countless other incarnations of possibility.</p><p>Each campaign world
        should have different Outer Planes to match its themes and needs, but
        classic Outer Planes include lawful good Heaven, the chaos and evil of
        the Abyss, the regimented lawful evil of Hell, and the capricious
        freedom and joys of chaotic good Elysium. Powerful spellcasters can
        contact the Outer Planes for advice or guidance with spells like commune
        and contact outer plane, or can conjure allies with spells like planar
        ally or summon monster.</p><p>The deities live on the Outer Planes, as
        do creatures such as celestials, fiends, and other outsiders. Each of
        the Outer Planes has an alignment representing a particular moral or
        ethical outlook, and the natives of each plane tend to behave in
        agreement with that plane’s alignment.</p><p>The Outer Planes are also
        the final resting place of souls from the Material Plane, whether that
        final rest takes the form of calm introspection or eternal
        damnation.</p><ul><li>@Compendium[pf-content.pf-rules.Vkaqhnw3JuB93M2b]{3.5.4.1.
