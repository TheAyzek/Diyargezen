        Combat}</li><li>@Compendium[pf-content.pf-rules.BA9GnqGPouWXISZm]{2.11.4.
        Siege Engines}</li></ul><hr /><p>@Source[PZO1118;pages=150]</p><p>There
        is no form of combat more civilized than the duel. Be it with steel or
        spells, duels are used to settle disputes in situations where a chaotic
        melee would be disruptive or even illegal. Although duels are often
        considered honorable, this does not necessarily make them any less
        deadly. Duels often permit combatants to engage in more even fights than
        the fracas of the battlefield, allowing the true skill, power, and wit
        of each to determine the
        victor.</p><ul><li>@Compendium[pf-content.pf-rules.WyaUkr4ph5FhEPwl]{2.11.2.1.
