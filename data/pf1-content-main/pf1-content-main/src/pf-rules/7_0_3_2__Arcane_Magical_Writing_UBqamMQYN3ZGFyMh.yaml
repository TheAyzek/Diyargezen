        /><p>@Source[PZO1110;pages=218]</p><p>To record an arcane spell in
        written form, a character uses complex notation that describes the
        magical forces involved in the spell. The writer uses the same system no
        matter what her native language or culture. However, each character uses
        the system in his own way. Another person’s magical writing remains
        incomprehensible to even the most powerful wizard until he takes time to
        study and decipher it.</p><p>To decipher an arcane magical writing (such
        as a single spell in another’s spellbook or on a scroll), a character
        must make a Spellcraft check (DC 20 + the spell’s level). If the skill
        check fails, the character cannot attempt to read that particular spell
        again until the next day. A read magic spell automatically deciphers
        magical writing without a skill check. If the person who created the
        magical writing is on hand to help the reader, success is also
        automatic.</p><p>Once a character deciphers a particular piece of
        magical writing, he does not need to decipher it again. Deciphering
        magical writing allows the reader to identify the spell and gives some
        idea of its effects (as explained in the spell description). If the
        magical writing is a scroll and the reader can cast arcane spells, he
        can attempt to use the scroll.</p>
