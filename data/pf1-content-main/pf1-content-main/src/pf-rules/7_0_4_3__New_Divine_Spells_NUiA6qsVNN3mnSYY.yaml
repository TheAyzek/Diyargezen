        /><p>@Source[PZO1110;pages=221]</p><p>Divine spellcasters gain new
        spells as follows.</p><h2>Spells Gained at a New Level</h2><p>Characters
        who can cast divine spells undertake a certain amount of study between
        adventures. Each time such a character receives a new level of divine
        spells, she learns all of the spells from that level
        automatically.</p><h2>Independent Research</h2><p>A divine spellcaster
        can also research a spell independently, much as an arcane spellcaster
        can. Only the creator of such a spell can prepare and cast it, unless
        she decides to share it with others.</p>
