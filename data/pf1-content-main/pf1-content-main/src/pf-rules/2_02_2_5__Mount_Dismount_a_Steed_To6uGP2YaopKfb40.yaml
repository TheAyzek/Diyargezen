        /><p>@Source[PZO1110;pages=187]</p><p>Mounting or dismounting a steed
        requires a move action.</p><h2>Fast Mount or Dismount</h2><p>You can
        mount or dismount as a free action with a DC 20 Ride check. If you fail
        the check, mounting or dismounting is a move action instead. You can’t
        attempt a fast mount or fast dismount unless you can perform the mount
        or dismount as a move action in the current round.</p>
