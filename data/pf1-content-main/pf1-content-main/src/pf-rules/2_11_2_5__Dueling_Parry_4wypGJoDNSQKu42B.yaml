        Duels and Performance
        Combat}</li><li>@Compendium[pf-content.pf-rules.WsVG4G89Q9NeEJT5]{2.11.2.8.
        Duel Results}</li></ul><hr /><p>@Source[PZO1118;pages=152]</p><p>Each
        participant in a duel can take a special action called a dueling parry.
        This special action allows the duelist to deflect a blow from a melee or
        ranged attack directed at her. A dueling parry cannot deflect spell or
        firearm ranged attacks.</p><p>Whenever a character participating in a
        duel is the target of a melee or ranged attack from another participant
        of the duel, she can declare that she is attempting to parry the attack
        as an immediate action. She must then make an attack roll with whatever
        weapon she is currently wielding, using her full base attack bonus but
        with a –5 penalty. If this attack roll is equal to or greater than the
        attack roll being made against her, she parries the attack and it is
        considered a miss. If the duelist attempting the parry is unarmed, she
        takes a further –2 on the attempt. If the duelist possesses the parry
        class feature, she can attempt this dueling parry once per round without
        spending an immediate action if she is using her parry class
        feature.</p><p>This dueling parry only applies to one attack. Other
        attacks made by the same attacker are resolved normally. If the attack
        is a hit and a critical threat, but would be parried by the duelist, it
        is still a hit, but no confirmation roll is made and damage is rolled
        normally.</p>
