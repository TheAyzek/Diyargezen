        Duels and Performance
        Combat}</strong></li><li>@Compendium[pf-content.pf-rules.WsVG4G89Q9NeEJT5]{2.11.2.8.
        Duel Results}</li></ul><hr /><p>@Source[PZO1118;pages=152]</p><p>If you
        are using the duel rules within a performance combat, successfully
        performing a dueling counter, dueling dodge, or dueling resolve all
        allow the combatant to make a performance combat check as a free action.
        Since the dueling counter, dueling dodge, and dueling resolve action are
        all immediate actions, and are usually not done on the character’s turn,
        this means that the combatant using one of these dueling actions must
        spend a victory point to make the performance combat check (not an
        action).</p>
