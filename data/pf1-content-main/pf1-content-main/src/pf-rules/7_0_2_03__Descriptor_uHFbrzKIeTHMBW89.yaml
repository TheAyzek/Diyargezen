        /><p>@Source[PZO1110;pages=212]</p><p>Appearing on the same line as the
        school and subschool, when applicable, is a descriptor that further
        categorizes the spell in some way. Some spells have more than one
        descriptor.</p><p>The descriptors are acid, air, chaotic, cold,
        darkness, death, earth, electricity, evil, fear, fire, force, good,
        language-dependent, lawful, light, mind-affecting, sonic, and
        water.</p><p>Most of these descriptors have no game effect by
        themselves, but they govern how the spell interacts with other spells,
        with special abilities, with unusual creatures, with alignment, and so
        on.</p><p>A language-dependent spell uses intelligible language as a
        medium for communication. If the target cannot understand or cannot hear
        what the caster of a language- dependant spell says, the spell
        fails.</p><p>A mind-affecting spell works only against creatures with an
        Intelligence score of 1 or higher.</p>
