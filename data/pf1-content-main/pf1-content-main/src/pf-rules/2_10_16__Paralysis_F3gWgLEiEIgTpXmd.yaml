        /><p>@Source[PZO1110;pages=565]</p><p>Some monsters and spells have the
        supernatural or spell-like ability to paralyze their victims,
        immobilizing them through magical means. Paralysis from poison is
        discussed in the
        @Compendium[pf-content.pf-rules.xpY9oe1ZnDpzXtEK]{2.10.03. Afflictions}
        section.</p><p>A paralyzed character cannot move, speak, or take any
        physical action. He is rooted to the spot, frozen and helpless. Not even
        friends can move his limbs. He may take purely mental actions, such as
        casting a spell with no components.</p><p>A winged creature flying in
        the air at the time that it becomes paralyzed cannot flap its wings and
        falls. A swimmer can’t swim and may drown.</p>
