        Air Vehicles}</li></ul><hr /><p>@Source[PZO1118;pages=170]</p><p>In the
        Pathfinder Roleplaying Game, low-level characters do most of their
        traveling on their own two feet. At higher levels, magical travel
        becomes a common occurrence, as does travel by horseback, atop animal
        companions, or via more exotic mounts. Every so often, travel may
        involve a vehicle of some sort—the wagons of a caravan, a windtossed
        galley, some fantastic form of aerial transport, or even a
        planes-hopping device. If you like your games with a dose of weird, such
        vehicles may be as strange as a crashed space vessel. Whatever the case,
        vehicles in the Pathfinder RPG are often treated as either mobile
        terrain or adventure sites in their own right.</p><p>Many of the iconic
        motifs that inspire roleplaying games touch on vehicular adventures,
        from the voyages of Jason and the Argonauts to pirate tales, from
        charioteers in blood-soaked arenas under a drone of cheers to those who
        would chase and tame dragons. History and fiction are full of
        interesting vehicles performing death-defying actions. The rules in this
        chapter allow you to run combats with vehicles in the Pathfinder RPG,
        rather than just treating them as objects or terrain.</p><p>The
        following rules attempt to strike a balance between verisimilitude and
        ease and speed of play during combat. In areas where those two balancing
        points are conflicted, ease of use should always prevail.</p>
