        /><p>@Source[PZO1123;pages=51]</p><p>Some trees suck up potent minerals
        through their roots the same way others draw water from the ground.
        Though these trees blunt saws and axes used to hew them and shrug off
        fire, they eventually succumb to time or the elements. When properly
        harvested, these fallen trees produce nuggets of a metal called living
        steel. This glossy green metal slowly repairs itself. An item made from
        living steel repairs damage to itself at a rate of 2 hit points per day,
        or 1 hit point per day if it has the broken condition. Items not
        primarily of metal are not meaningfully affected by being partially made
        of living steel.</p><p>Armor and shields made from living steel can
        damage metal weapons that strike them. Whenever the wielder of a metal
        weapon rolls a natural 1 on an attack roll against a creature wearing
        living steel armor or wielding a living steel shield, the item must make
        a DC 20 Fortitude save or gain the broken condition. If the weapon
        already has the broken condition, it is instead destroyed. Living steel
        cannot damage adamantine weapons in this way.</p><p>Living steel has 35
        hit points per inch of thickness and hardness
        15.</p><table><thead><tr><td>Type of Living Steel Item</td><td>Item
        Price Modifier</td></tr></thead><tbody><tr><td>Ammunition</td><td>+10 gp
        per item</td></tr><tr><td>Light armor</td><td>+500
        gp</td></tr><tr><td>Medium armor</td><td>+1,000
        gp</td></tr><tr><td>Heavy armor</td><td>+1,500
        gp</td></tr><tr><td>Weapon</td><td>+500
        gp</td></tr><tr><td>Shield</td><td>+100 gp</td></tr><tr><td>Other
        items</td><td>+250 gp/lb.</td></tr></tbody></table>
