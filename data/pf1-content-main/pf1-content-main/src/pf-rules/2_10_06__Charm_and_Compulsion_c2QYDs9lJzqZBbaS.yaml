        /><p>@Source[PZO1110;pages=561]</p><p>Many abilities and spells can
        cloud the minds of characters and monsters, leaving them unable to tell
        friend from foe—or worse yet, deceiving them into thinking that their
        former friends are now their worst enemies. Two general types of
        enchantments affect characters and creatures: charms and
        compulsions.</p><p>Charming another creature gives the charming
        character the ability to befriend and suggest courses of action to his
        minion, but the servitude is not absolute or mindless. Charms of this
        type include the various charm spells and some monster abilities.
        Essentially, a charmed character retains free will but makes choices
        according to a skewed view of the world.</p><ul><li>A charmed creature
        doesn’t gain any magical ability to understand his new friend’s
        language.</li><li>A charmed character retains his original alignment and
        allegiances, generally with the exception that he now regards the
        charming creature as a dear friend and will give great weight to his
        suggestions and directions.</li><li>A charmed character fights his
        former allies only if they threaten his new friend, and even then he
        uses the least lethal means at his disposal as long as these tactics
        show any possibility of success ( just as he would in a fight with an
        actual friend).</li><li>A charmed character is entitled to an opposed
        Charisma check against his master in order to resist instructions or
        commands that would make him do something he wouldn’t normally do even
        for a close friend. If he succeeds, he decides not to go along with that
        order but remains charmed.</li><li>A charmed character never obeys a
        command that is obviously suicidal or grievously harmful to
        him.</li><li>If the charming creature commands his minion to do
        something that the inf luenced character would be violently opposed to,
        the subject may attempt a new saving throw to break free of the inf
        luence altogether.</li><li>A charmed character who is openly attacked by
        the creature who charmed him or by that creature’s apparent allies is
        automatically freed of the spell or effect.</li></ul><p>Compulsion is a
        different matter altogether. A compulsion overrides the subject’s free
        will in some way or simply changes the way the subject’s mind works. A
        charm makes the subject a friend of the caster; a compulsion makes the
        subject obey the caster.</p><p>Regardless of whether a character is
        charmed or compelled, he does not volunteer information or tactics that
        his master doesn’t ask for.</p>
