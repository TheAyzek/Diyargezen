        <p>@Compendium[pf-content.pf-rules.XOJpjqmBzwE4R4n0]{(Index)
        Environment}</p><p><strong>@Compendium[pf-content.pf-rules.qx3PVEeLsKOdiESK]{3.3.
        Urban
        Adventures}</strong></p><ul><li>@Compendium[pf-content.pf-rules.NN6T3x9Bkkbypfsz]{3.3.1.
        Weapon and Spell
        Restrictions}</li><li>@Compendium[pf-content.pf-rules.a0xDSVGQRE2pVzkA]{3.3.2.
        Urban Features}</li></ul><hr /><p>@Source[PZO1110;pages=433]</p><p>At
        first glance, a city is much like a dungeon, made up of walls, doors,
        rooms, and corridors. Adventures that take place in cities have two
        salient differences from their dungeon counterparts, however. Characters
        have greater access to resources, and they must contend with law
        enforcement.</p><h2>Access to Resources</h2><p>Unlike in dungeons and
        the wilderness, characters can buy and sell gear quickly in a city. A
        large city or metropolis probably has high-level NPCs and experts in
        obscure fields of knowledge who can provide assistance and decipher
        clues. And when the PCs are battered and bruised, they can retreat to
        the comfort of a room at an inn.</p><p>The freedom to retreat and ready
        access to the marketplace means that the players have a greater degree
        of control over the pacing of an urban adventure.</p><h2>Law
        Enforcement</h2><p>The other key distinctions between adventuring in a
        city and delving into a dungeon is that a dungeon is, almost by
        definition, a lawless place where the only law is that of the jungle:
        kill or be killed. A city, on the other hand, is held together by a code
        of laws, many of which are explicitly designed to prevent the sort of
        killing and looting that adventurers engage in all the time.</p><p>Even
        so, most cities’ laws recognize monsters as a threat to the stability
        the city relies on, and prohibitions about murder rarely apply to
        monsters such as aberrations or evil outsiders. Most evil humanoids,
        however, are typically protected by the same laws that protect all the
        citizens of the city. Having an evil alignment is not a crime (except in
        some severely theocratic cities, perhaps, with the magical power to back
        up the law); only evil deeds are against the law.</p><p>Even when
        adventurers encounter an evildoer in the act of perpetrating some
        heinous evil upon the populace of the city, the law tends to frown on
        the sort of vigilante justice that leaves the evildoer dead or otherwise
        unable to testify at a trial.</p>
