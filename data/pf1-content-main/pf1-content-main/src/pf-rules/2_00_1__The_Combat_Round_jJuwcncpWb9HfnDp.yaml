      content: >-
        <p>@Compendium[pf-content.pf-rules.OiNttXSDW598DIEs]{(Index) Combat
        Rules}<strong><br
        /></strong></p><p>@Compendium[pf-content.pf-rules.3jMjiOrnwDUVwQC1]{2.00.
        How Combat
        Works}</p><ul><li><strong>@Compendium[pf-content.pf-rules.jJuwcncpWb9HfnDp]{2.00.1.
        The Combat
        Round}</strong></li><li>@Compendium[pf-content.pf-rules.vex8pJWcXVRYA44O]{2.00.2.
        Initiative}</li><li>@Compendium[pf-content.pf-rules.rtzCVah2jmfFInBL]{2.00.3.
        Surprise}</li></ul><hr /><p>@Source[PZO1110;pages=178]</p><p>Each round
        represents 6 seconds in the game world; there are 10 rounds in a minute
        of combat. A round normally allows each character involved in a combat
        situation to act.</p><p>Each round’s activity begins with the character
        with the highest initiative result and then proceeds in order. When a
        character’s turn comes up in the initiative sequence, that character
        performs his entire round’s worth of actions. (For exceptions, see
        Attacks of Opportunity and Special Initiative Actions.)</p><p>When the
        rules refer to a \"full round\", they usually mean a span of time from a
        particular initiative count in one round to the same initiative count in
        the next round. Effects that last a certain number of rounds end just
        before the same initiative count that they began on.</p>
