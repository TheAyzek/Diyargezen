        <p>@Compendium[pf-content.pf-rules.4TX2Q1MaWt1B8298]{(Index)
        Items}</p><p>@Compendium[pf-content.pf-rules.j1KZwBRf9pU1Dg2C]{6.0.
        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><p><strong>PFS
        Legal</strong></p><p>@Source[PZO92109;pages=43]</p><p>The navy-blue ore
        known as aszite is often used to reinforce buildings. While aszite
        cannot be properly worked into weapons, it can be added in the form of
        veinlike reinforcements to armor, where it absorbs and amplifies certain
        unique magical properties.</p><p>Adding aszite veins to armor increases
        the item’s weight by 10%. The added veins are capable of absorbing extra
        power from spells with the darkness descriptor. The wearer of
        aszite-veined armor gains a +2 circumstance bonus on Stealth checks when
        affected by a spell with the darkness descriptor.</p><p>In addition,
        spells with the darkness descriptor that last multiple rounds last 1
        round longer when affecting a creature with aszite-veined armor. If the
        spell affects an object (such as a darkness spell) then targeting a
        piece of aszite-veined armor instead increases the spell’s duration by
        50%.</p><p>Aszite has hardness 15 and has 20 hit points per inch of
        thickness.</p><table><thead><tr><td>Type of Aszite-Beined
        Item</td><td>Item Price Modifier</td></tr></thead><tbody><tr><td>Light
        armor</td><td>+750 gp</td></tr><tr><td>Medium armor</td><td>+750
        gp</td></tr><tr><td>Heavy armor</td><td>+1,000
        gp</td></tr></tbody></table>
