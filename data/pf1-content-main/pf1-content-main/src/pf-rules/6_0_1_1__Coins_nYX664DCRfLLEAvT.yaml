        /><p>@Source[PZO1110;pages=140]</p><p>The most common coin is the gold
        piece (gp). A gold piece is worth 10 silver pieces (sp). Each silver
        piece is worth 10 copper pieces (cp). In addition to copper, silver, and
        gold coins, there are also platinum pieces (pp), which are each worth 10
        gp.</p><p>The standard coin weighs about a third of an ounce (50 to the
        pound).</p><h2>Table 6-2: Coins</h2><table><thead><tr><td>Exchange
        Value</td><td>cp</td><td>sp</td><td>gp</td><td>pp</td></tr></thead><tbody><tr><td>Copper
        Piece
        (cp)</td><td>1</td><td>1/10</td><td>1/100</td><td>1/1,000</td></tr><tr><td>Silver
        Piece
        (sp)</td><td>10</td><td>1</td><td>1/10</td><td>1/100</td></tr><tr><td>Gold
        Piece
        (gp)</td><td>100</td><td>10</td><td>1</td><td>1/10</td></tr><tr><td>Platinum
        Piece
        (pp)</td><td>1,000</td><td>100</td><td>10</td><td>1</td></tr></tbody></table>
