        Spellcasters}</strong></li><li>@Compendium[pf-content.pf-rules.zOA9QmZKLKiZAsfW]{1.3.3.
        Carrying Capacity}</li></ul><hr /><p>@Source[PZO1110;pages=16]</p><p>The
        ability that governs bonus spells depends on what type of spellcaster
        your character is: Intelligence for wizards; Wisdom for clerics, druids,
        and rangers; and Charisma for bards, paladins, and sorcerers.</p><p>In
        addition to having a high ability score, a spellcaster must be of a high
        enough class level to be able to cast spells or use spell slots of a
        given spell level.</p><p>See the class descriptions for details.</p>
