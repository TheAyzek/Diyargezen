        /><p>@Source[PZO1110;pages=459]</p><p>Magic items produce spells or
        spell-like effects. For a saving throw against a spell or spell-like
        effect from a magic item, the DC is 10 + the level of the spell or
        effect + the ability modifier of the minimum ability score needed to
        cast that level of spell.</p><p>Staves are an exception to the rule.
        Treat the saving throw as if the wielder cast the spell, including
        caster level and all modifiers to save DCs.</p><p>Most item descriptions
        give saving throw DCs for various effects, particularly when the effect
        has no exact spell equivalent (making its level otherwise difficult to
        determine quickly).</p>
