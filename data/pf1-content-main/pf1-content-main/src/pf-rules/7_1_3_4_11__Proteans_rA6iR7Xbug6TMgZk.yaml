        /><p>@Source[PZO1117;pages=110]</p><p>Slithering creatures of pure
        chaos, proteans claim they were the masters of the multiverse before the
        first gods created the other planes from the pure chaos of the primeval
        beginnings. They seek to tear down the multiverse and restore it to its
        original chaotic form. Bound proteans seek to find a way to achieve this
        goal even when bargaining with those who dare summon and bind
        them.</p><p>Proteans are immune to acid and have resistance to
        electricity 10 and sonic 10. Their amorphous anatomy grants them
        immunity to polymorph effects and resistance to critical hits and sneak
        attack damage. They are protected by a continuous freedom of movement,
        as per the spell.</p><h2>Imentesh (SR 21)</h2><p>These heralds of chaos
        often heed the call of binders who wish to utilize the power of
        proteans. In conversation they are often talkative, seemingly helpful,
        and polite, but they are always plotting their escape in order to
        unleash as much chaos as possible.</p><h2>Keketar (SR 28)</h2><p>The
        most zealous of all the proteans, keketars see it as their sacred duty
        to return all existence to its true chaotic state. These creatures are
        extremely arrogant, and often seek to manipulate those foolish enough to
        bind them toward their own entropic purposes.</p><h2>Naunet (SR
        18)</h2><p>These bestial proteans are hard to control. Those who bind
        these dangerous bundles of rage and destruction are lucky if they can
        wield the naunets’ destructive power for their own purposes—at least for
        a short while.</p><p>Voidworm</p><p>To most other proteans, these tiny
        creatures aren’t true proteans at all, just pale reflections of protean
        powers manifesting in the twisting currents of Limbo. Mortal
        spellcasters sometimes call these creatures to serve as familiars.</p>
