        /><p>@Source[PZO1110;pages=192]</p><p>Your speed is determined by your
        race and your armor (see Table 8–3). Your speed while unarmored is your
        base land speed.</p><h2>Encumbrance</h2><p>A character encumbered by
        carrying treasure. a large amount of gear, or fallen comrades may move
        slower than normal
        @UUID[Compendium.pf-content.pf-rules.JournalEntry.zOA9QmZKLKiZAsfW]{1.3.3.
        Carrying Capacity}.</p><h2>Hampered Movement</h2><p>Difficult terrain,
        obstacles, or poor visibility can hamper movement.</p><h2>Movement in
        Combat</h2><p>Generally, you can move your speed in a round and still do
        something (take a move action and a standard action).</p><p><br />If you
        do nothing but move (that is, if you use both of your actions in a round
        to move your speed), you can move double your speed.</p><p>If you spend
        the entire round running, you can move quadruple your speed (or three
        times your speed in heavy armor). If you do something that requires a
        full round, you can only take a 5-foot step.</p><h2>Bonuses to
        Speed</h2><p>A barbarian has a +10-foot bonus to her speed (unless she’s
        wearing heavy armor). Experienced monks also have higher speed (unless
        they’re wearing armor of any sort). In addition, many spells and magic
        items can affect a character’s speed. Always apply any modifiers to a
        character’s speed before adjusting the character’s speed based on armor
        or encumbrance, and remember that multiple bonuses of the same type to a
        character’s speed don’t stack.</p><h2>Table 8-3: Tactical
        Speed</h2><table border="\"><tbody><tr><td><p>Race</p></td><td><p>No
        Armor or Light Armor</p></td><td><p>Medium or Heavy
        Armor</p></td></tr><tr><td><p>Human, elf, half-elf,
        half-orc</p></td><td><p>30 ft. (6 squares)</p></td><td><p>20 ft. (4
        squares)</p></td></tr><tr><td><p>Dwarf</p></td><td><p>20 ft. (4
        squares)</p></td><td><p>20 ft. (4
        squares)</p></td></tr><tr><td><p>Gnome, halfling</p></td><td><p>20 ft.
        (4 squares)</p></td><td><p>15 ft. (3
        squares)</p></td></tr></tbody></table>
