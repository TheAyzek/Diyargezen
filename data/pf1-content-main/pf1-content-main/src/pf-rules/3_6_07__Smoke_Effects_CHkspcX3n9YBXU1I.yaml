        Water Dangers}</li></ul><hr /><p>@Source[PZO1110;pages=444]</p><p>A
        character who breathes heavy smoke must make a Fortitude save each round
        (DC 15, +1 per previous check) or spend that round choking and coughing.
        A character who chokes for 2 consecutive rounds takes 1d6 points of
        nonlethal damage. Smoke obscures vision, giving concealment (20% miss
        chance) to characters within
        it.</p><p>@Compendium[pf-content.pf-buffs.suDHnshpVR3PXIRG]{Concealment}</p>
