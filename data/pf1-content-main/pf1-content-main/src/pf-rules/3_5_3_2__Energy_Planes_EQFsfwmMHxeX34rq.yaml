        /><p>@Source[PZO1110;pages=440]</p><p>Two energy planes exist—the
        Positive Energy Plane (from which the animating spark of life hails) and
        the Negative Energy Plane (from which the sinister taint of undeath
        hails). Energy from both planes infuses reality, the ebb and flow of
        this energy running through all creatures to bear them along the journey
        from birth to death. Clerics utilize power from these planes when they
        channel energy.</p>
