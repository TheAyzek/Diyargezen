        /><p>@Source[PZO1118;pages=135]</p><p>Guns are not strangers to fantasy.
        The earliest authors of fantasy and weird fiction often included guns in
        their stories. Heroes like Burroughs’s John Carter or Howard’s Solomon
        Kane carried pistols alongside their swords, and it’s hard to imagine a
        pirate ship without cannons blazing. These authors likely included guns
        because they are exciting, but also because the guns they chose were
        primitive ones— relatively unpredictable weapons, prone to misfire and
        malfunction. This made firearms excellent storytelling devices. Such
        weapons could cause hero or villain to falter or triumph, changing the
        action within the tale in a flash or a fizzle. Still, a firearm remains
        an ominous and terrible weapon in the hands of a skilled
        gunman.</p><p>This section presents an anachronistic collection of
        hand-held black powder weapons. Most of them are singleshot
        muzzle-loaders with highly inefficient triggering mechanisms—traditional
        sword and sorcery firearms. More advanced firearms are also presented
        for those brave enough to mix their fantasy with a technology much
        closer to that of the Old West than the slow and unstable weapons that
        gave musketeers their name. If you are interested in letting such
        weapons in your game, do so with the following warning: Advanced guns
        can substantially change the assumptions of your game world, in the same
        way that they changed the face of warfare in the real world. If you like
        your fantasy to be of the more traditional variety, stand clear. Or,
        better yet, run for cover.</p>
