        /><p>@Source[PZO1110;pages=423]</p><p>Once you know the Challenge Rating
        of a trap, determine the Craft (traps) DC by referring to the values and
        modifiers given on Table 13–6.</p><h2>Making the Checks</h2><p>To
        determine how much progress a character makes on building a trap each
        week, that character makes a Craft (traps) check. See the Craft skill
        description for details on Craft checks and the circumstances that can
        affect them.</p><h2>Table 13-6: Craft (Traps)
        DCs</h2><table><thead><tr><td>Trap CR</td><td>Base Craft (Traps)
        DC</td></tr></thead><tbody><tr><td>1-5</td><td>20</td></tr><tr><td>6-10</td><td>25</td></tr><tr><td>11-15</td><td>30</td></tr><tr><td>16+</td><td>35</td></tr><tr><td>
        </td><td> </td></tr><tr><td><strong>Additional
        Components</strong></td><td><strong>Modifier to Craft (Traps)
        DC</strong></td></tr><tr><td>Proximity
        trigger</td><td>+5</td></tr><tr><td>Automatic
        reset</td><td>+5</td></tr></tbody></table>
