        /><p>@Source[PZO1110;pages=423]</p><p>Building a magic device trap
        involves the expenditure of gp and requires the services of a
        spellcaster. Table 13–5 summarizes the cost information for magic device
        traps. If the trap uses more than one spell (for instance, a sound or
        visual trigger spell in addition to the main spell effect), the builder
        must pay for them all (except alarm, which is free unless it must be
        cast by an NPC).</p><p>The costs derived from Table 13–5 assume that the
        builder is casting the necessary spells himself (or perhaps some other
        PC is providing the spells for free). If an NPC spellcaster must be
        hired to cast them, those costs must be factored in as well (see Chapter
        6).</p><p>A magic device trap takes 1 day to construct per 500 gp of its
        cost.</p><h2>Table 13-5: Cost Modifiers for Magic Device
        Traps</h2><table><thead><tr><td>Feature</td><td>Cost
        Modifier</td></tr></thead><tbody><tr><td>Alarm spell used in
        trigger</td><td>—</td></tr><tr><td>One-Shot Trap</td><td>
        </td></tr><tr><td> Each spell used</td><td>+50 gp × caster level × spell
        level</td></tr><tr><td> Material components</td><td>+ material component
        costs</td></tr><tr><td>Automatic Reset Trap</td><td>
        </td></tr><tr><td> Each spell used</td><td>+500 gp × caster level ×
        spell level</td></tr><tr><td> Material components</td><td>+material
        component costs × 100</td></tr></tbody></table>
