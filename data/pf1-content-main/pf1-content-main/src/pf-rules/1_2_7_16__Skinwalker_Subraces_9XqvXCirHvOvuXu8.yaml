    text:
      content: >-
        <h2> Werebat-Kin (Bloodmarked)</h2><p>@Source[PZO9280;pages=248],
        @Source[PZO9439;pages=8]</p><p>These skinwalkers are usually communal
        and defer readily to their superiors. They prefer dwelling in areas of
        dense foliage, such as jungles or forests. They often have little trust
        for those not in their immediate clan.</p><p><strong>Ability
        Modifiers</strong> +2 Intelligence, –2 Wisdom (+2 Dexterity while
        shapechanged)<br /><strong>Alternate Skill Modifiers</strong> Fly,
        Perception at night<br /><strong>Alternate Spell-Like Ability</strong>
        <em>obscuring mist</em> 1/day<br /><strong>Bestial
        Features</strong></p><ul><li><strong>Bite attack that deals 1d6 points
        of damage</strong></li><li><strong>+4 racial bonus on Perception
        checks</strong></li><li><strong>Scent to a range of 30
        feet</strong></li><li><strong>Treat falling damage as if the distance
        fallen were 20 feet less than it actually
        is</strong></li></ul><h2>Werebear-Kin
        (Coldborn)<h2><p>@Source[PZO9280;pages=248]</p><p><strong>Ability
        Modifiers</strong> +2 Constitution, –2 Charisma (+2 Wisdom while
        shapechanged)<br /><strong>Alternate Skill Modifiers</strong> Climb,
        wild empathy<br /><strong>Alternate Spell-Like Ability</strong> <em>calm
        animals</em> 1/day<br /><strong>Bestial
        Features</strong></p><ul><li><strong>Bite attack that deals 1d6 points
        of damage</strong></li><li><strong>2 claw attacks that each deal 1d4
        points of damage</strong></li><li><strong>Climb speed of 20
        feet</strong></li><li><strong>Scent to a range of 30
        feet</strong></li></ul><h2>Wereboar-Kin
        (Ragebred)<h2><p>@Source[PZO9280;pages=248]</p><p>These skinwalkers are
        known for their fiery tempers and stubborn streaks, features that have
        earned them respect in remote corners of Garund, Cheliax, and Varisia as
        freedom fighters.</p><p><strong>Ability Modifiers</strong> +2 Strength,
        –2 Charisma (+2 Constitution while shapechanged)<br /><strong>Alternate
        Skill Modifiers</strong> Handle Animal, Perception<br
        /><strong>Alternate Spell-Like Ability</strong> <em>speak with
        animals</em> (pigs and boars only) 3/day<br /><strong>Bestial
        Features</strong></p><ul><li><strong>+10 foot racial bonus to base
        speed</strong></li><li><strong>Gore attack that deals 1d6 points of
        damage</strong></li><li><strong>2 hoof attacks that each deal 1d4 points
        of damage</strong></li><li><strong>Scent to a range of 30
        feet</strong></li></ul><h2>Werecrocodile-Kin
        (Scaleheart)<h2><p>@Source[PZO9280;pages=249]</p><p>Found most often in
        areas such as the Shackles and the Sodden lands, these skinwalkers are
        often brutish and cruel.</p><p><strong>Ability Modifiers</strong> +2
        Constitution, –2 Wisdom (+2 Strength while shapechanged)<br
        /><strong>Alternate Skill Modifiers</strong> Stealth, wild empathy<br
        /><strong>Alternate Spell-Like Ability</strong> <em>scare</em> 1/day<br
        /><strong>Bestial Features</strong></p><ul><li><strong>Bite attack that
        deals 1d6 points of damage</strong></li><li><strong>Darkvision to a
        range of 60 feet</strong></li><li><strong>Swim speed of 30
        feet</strong></li><li><strong>Ferocity</strong></li></ul><h2>Wereraptor-Kin
        (Aerieborn)<h2><p><strong>@Source[PZO90115;pages=89]</strong></p><p><strong>Ancestry</strong>
        wereraptor<br /><strong>Typical Alignment</strong> LN<br
        /><strong>Ability Modifiers</strong> +2 Wis, –2 Cha (+2 Dex while
        shapechanged)<br /><strong>Alternate Skill Modifiers</strong>
        Perception, Sense Motive<br /><strong>Alternate Spell-Like
        Ability</strong> <em>feather fall</em> 1/day<br /><strong>Bestial
        Features</strong></p><ul><li><strong>Bite attack that deals 1d6 points
        of damage</strong></li><li><strong>2 talon attacks that each deal 1d4
        points of damage</strong></li><li><strong>+4 racial bonus on Perception
        checks</strong></li><li><strong>Increase fly speeds from other sources
        by 10 feet</strong></li></ul><h2>Wererat-Kin
        (Nightskulk)<h2><p>@Source[PZO9280;pages=249]</p><p>These creatures, who
        are among the more common of the skinwalkers, prefer to dwell in urban
        areas.</p><p><strong>Ability Modifiers</strong> +2 Intelligence, –2
        Strength (+2 Dexterity while shapechanged)<br /><strong>Alternate Skill
        Modifiers</strong> Handle Animal, Stealth in urban environments<br
        /><strong>Alternate Spell-Like Ability</strong> <em>speak with
        animals</em> (rodents only) 3/day<br /><strong>Bestial
        Features</strong></p><ul><li><strong>Bite attack that deals 1d6 points
        of damage</strong></li><li><strong>Climb speed of 30
        feet</strong></li><li><strong>Distraction (except with only one chosen
        natural attack per round, and sickens instead of
        nauseates).</strong></li><li><strong>Scent to a range of 30
        feet</strong></li></ul><h2>Wereshark-Kin
        (Seascarred)<h2><p>@Source[PZO9280;pages=249]</p><p><strong>These
        unusual skinwalkers tend to be strong-willed and brisk in their patterns
        of speech. They often serve aboard pirate ships, where their traits are
        well appreciated.</strong></p><p><strong>Ability Modifiers</strong> +2
        Wisdom, –2 Intelligence (+2 Constitution while shapechanged)<br
        /><strong>Alternate Skill Modifiers</strong> Perception, Swim<br
        /><strong>Alternate Spell-Like Ability</strong> <em>charm animal</em>
        (aquatic animals only) 3/day<br /><strong>Bestial
        Features</strong></p><ul><li><strong>Breathe water as well as
        air</strong></li><li><strong>Bite attack that deals 1d6 points of
        damage</strong></li><li><strong>Ferocity</strong></li><li><strong>Swim
        speed of 30 feet</strong></li></ul><h2>Weretiger-Kin
        (Fanglord)<h2><p>@Source[PZO9280;pages=249]</p><p>More common in Vudra
        than the Inner Sea region, these skinwalkers are notorious for their
        fickle attitudes.</p><p><strong>Ability Modifiers</strong> +2 Dexterity,
        –2 Wisdom (+2 Charisma while shapechanged)<br /><strong>Alternate Skill
        Modifiers</strong> Acrobatics, Perception<br /><strong>Alternate
        Spell-Like Ability</strong> <em>jump</em> 1/day<br /><strong>Bestial
        Features</strong></p><ul><li><strong>Bite attack that deals 1d6 points
        of damage</strong></li><li><strong>2 claw attacks that each deal 1d4
        points of damage</strong></li><li><strong>+10-foot racial bonus to base
        speed</strong></li><li><strong>See in
        darkness</strong></li></ul><h2>Werewolf-Kin
        (Witchwolf)<h2><p>@Source[PZO9280;pages=249]</p><p>Perhaps the most
        prevalent breed of skinwalker, witchwolves prefer dwelling with others
        of their kind.</p><p><strong>Ability Modifiers</strong> +2 Constitution,
        –2 Intelligence (+2 Wisdom while shapechanged)<br /><strong>Alternate
        Skill Modifiers</strong> Perception, wild empathy<br /><strong>Alternate
        Spell-Like Ability</strong> <em>magic fang</em> 1/day<br
        /><strong>Bestial Features</strong></p><ul><li><strong>Bite attack that
        deals 1d6 points of damage</strong></li><li><strong>2 claw attacks that
        each deal 1d4 points of damage</strong></li><li><strong>Darkvision 60
        feet</strong></li><li><strong>+2 racial bonus on all saving
        throws</strong></li></ul>
