        /><p>@Source[PZO1110;pages=553]</p><p>To create a magic wand, a
        character needs a small supply of materials, the most obvious being a
        baton or the pieces of the wand to be assembled. The cost for the
        materials is subsumed in the cost for creating the wand: 375 gp × the
        level of the spell × the level of the caster. Wands are always fully
        charged (50 charges) when created.</p><p>The creator must have prepared
        the spell to be stored (or must know the spell, in the case of a
        sorcerer or bard) and must provide any focuses the spell requires. Fifty
        of each needed material component are required (one for each charge).
        Material components are consumed when work begins, but focuses are not.
        A focus used in creating a wand can be reused. The act of working on the
        wand triggers the prepared spell, making it unavailable for casting
        during each day devoted to the wand’s creation. (That is, that spell
        slot is expended from the caster’s currently prepared spells, just as if
        it had been cast.)</p><p>Crafting a wand requires 1 day per each 1,000
        gp of the base price.</p><h2>Item Creation Feat Required</h2><p>Craft
        Wand.</p><h2>Skill Used in Creation</h2><p>Spellcraft, Craft ( jewelry),
        Craft (sculptures), or Profession (woodcutter).</p><h2>Wand Base Costs
        (By Crafter's Class)</h2><table><thead><tr><td>Spell
        Level</td><td>Cleric, Druid,
        Wizard</td><td>Sorcerer</td><td>Bard</td><td>Paladin,
        Ranger*</td></tr></thead><tbody><tr><td>0</td><td>375 gp</td><td>375
        gp</td><td>375 gp</td><td>—</td></tr><tr><td>1st</td><td>750
        gp</td><td>750 gp</td><td>750 gp</td><td>750
        gp</td></tr><tr><td>2nd</td><td>4,500 gp</td><td>6,000 gp</td><td>6,000
        gp</td><td>6,000 gp</td></tr><tr><td>3rd</td><td>11,250
        gp</td><td>13,500 gp</td><td>15,750 gp</td><td>15,750
        gp</td></tr><tr><td>4th</td><td>21,000 gp</td><td>24,000
        gp</td><td>30,000 gp</td><td>30,000 gp</td></tr></tbody></table><p>*
        Caster level is equal to class level –3.<br />Prices assume that the
        wand was made at the minimum caster level. The cost to create a wand is
        half the base price</p>
