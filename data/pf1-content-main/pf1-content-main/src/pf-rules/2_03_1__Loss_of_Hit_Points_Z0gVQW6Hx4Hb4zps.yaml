        Recovery}</li><li>@Compendium[pf-content.pf-rules.JWPzEMuF9fPOLqCF]{2.03.6.
        Healing}</li><li>@Compendium[pf-content.pf-rules.oyi4ByFG6yVswC0m]{2.03.7.
        Temporary Hit
        Points}</li><li>@Compendium[pf-content.pf-rules.Hzi8GbT19bP7mdSP]{2.03.8.
        Nonlethal Damage}</li></ul><hr /><p>@Source[PZO1110;pages=189]</p><p>The
        most common way that your character gets hurt is to take lethal damage
        and lose hit points.</p><h2>What Hit Points Represent</h2><p>Hit points
        mean two things in the game world: the ability to take physical
        punishment and keep going, and the ability to turn a serious blow into a
        less serious one.</p><h2>Effects of Hit Point Damage</h2><p>Damage
        doesn’t slow you down until your current hit points reach 0 or lower. At
        0 hit points, you’re
        @Compendium[pf1.conditions.zW6gVKSaVFTrd9PY]{Disabled}.</p><p>If your
        hit point total is negative, but not equal to or greater than your
        Constitution score, you are
        @Compendium[pf1.conditions.bj36eCfZGJG5AGTQ]{Unconscious} and
        @Compendium[pf1.conditions.BKxrsHSBNATa0e3D]{Dying}.</p><p>When your
        negative hit point total is equal to your Constitution, you’re
        @Compendium[pf1.conditions.khxmbfoDQ3LD0de5]{Dead}.</p><h2>Massive
        Damage (Optional Rule)</h2><p>If you ever sustain a single attack that
        deals an amount of damage equal to half your total hit points (minimum
        50 points of damage) or more and it doesn’t kill you outright, you must
        make a DC 15 Fortitude save. If this saving throw fails, you die
        regardless of your current hit points. If you take half your total hit
        points or more in damage from multiple attacks, no one of which dealt
        more than half your total hit points (minimum 50), the massive damage
        rule does not apply.</p>
