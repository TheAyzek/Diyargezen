        /><p>@Source[PZO1114;pages=193]</p><p>Nirvana is an unbiased paradise
        existing between the two extremes of Elysium and Heaven. Its stunning
        mountains, rolling hills, and deep forests all match a visitor’s
        expectations of a pastoral paradise, but Nirvana also contains mysteries
        that lead to enlightenment. Nirvana is a sanctuary and a place of
        respite for all who seek redemption or illumination. Nirvana’s native
        agathions have willingly postponed their own transcendence to guard
        Nirvana’s enigmas, while celestial beings fight the forces of evil
        across the planes.</p><h2>Planar Traits</h2><p>Nirvana has the following
        traits:</p><ul><li><strong>Divinely Morphic</strong>: Deities with
        domains in Nirvana can alter the plane at will.</li><li><strong>Strongly
        Good-Aligned</strong></li><li><strong>Enhanced Magic</strong>: Spells
        and spell-like abilities with the good descriptor are
        enhanced.</li><li><strong>Impeded Magic</strong>: Spells and spell-like
        abilities with the evil descriptor are impeded.</li></ul>
