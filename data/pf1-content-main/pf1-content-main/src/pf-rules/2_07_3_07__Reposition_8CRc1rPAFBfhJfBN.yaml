        Steal}</li><li>@Compendium[pf-content.pf-rules.bEwb7yQOidiPzb5v]{2.07.3.09.
        Sunder}</li><li>@Compendium[pf-content.pf-rules.QBZtZChctrkE8ksB]{2.07.3.10.
        Trip}</li></ul><hr /><p>@Source[PZO1115;pages=322]</p><p>You can attempt
        to reposition a foe to a different location as a standard action. You
        can only reposition an opponent that is no more than one size category
        larger than you. A reposition attempts to force a foe to move to a
        different position in relation to your location without doing any harm.
        If you do not have the Improved Reposition feat or a similar ability,
        attempting to reposition a foe provokes an attack of opportunity from
        the target of your maneuver. You cannot use this maneuver to move a foe
        into a space that is intrinsically dangerous, such as a pit or wall of
        fire.</p><p>If your attack is successful, you may move your target 5
        feet to a new location. For every 5 by which your attack exceeds your
        opponent’s CMD, you can move the target an additional 5 feet. The target
        must remain within your reach at all times during this movement, except
        for the final 5 feet of movement, which can be to a space adjacent to
        your reach.</p><p>An enemy being moved by a reposition does not provoke
        an attack of opportunity because of the movement unless you possess the
        Greater Reposition feat. You cannot move a creature into a square that
        is occupied by a solid object or obstacle.</p>
