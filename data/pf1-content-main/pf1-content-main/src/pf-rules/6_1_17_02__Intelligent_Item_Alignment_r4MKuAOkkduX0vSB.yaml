        /><p>@Source[PZO1110;pages=533]</p><p>Any item with intelligence has an
        alignment (see Table 15– 21). Note that intelligent weapons already have
        alignments, either stated or by implication. If you’re generating a
        random intelligent weapon, that weapon’s alignment must fit with any
        alignment-oriented special abilities it has.</p><p>Any character whose
        alignment does not correspond to that of the item (except as noted by
        the asterisks on the table) gains one negative level if he or she so
        much as picks up the item. Although this negative level never results in
        actual level loss, it remains as long as the item is in hand and cannot
        be overcome in any way (including by restoration spells). This negative
        level is cumulative with any other penalties the item might place on
        inappropriate wielders. Items with Ego scores (see below) of 20 to 29
        bestow two negative levels. Items with Ego scores of 30 or higher bestow
        three negative levels.</p><h2>Table 15–21: Intelligent Item
        Alignment</h2><table><thead><tr><td>d%</td><td>Alignment of
        Item</td></tr></thead><tbody><tr><td>01–10</td><td>Chaotic
        good</td></tr><tr><td>11–20</td><td>Chaotic
        neutral*</td></tr><tr><td>21–35</td><td>Chaotic
        evil</td></tr><tr><td>36–45</td><td>Neutral
        evil*</td></tr><tr><td>46–55</td><td>Lawful
        evil</td></tr><tr><td>56–70</td><td>Lawful
        good</td></tr><tr><td>71–80</td><td>Lawful
        neutral*</td></tr><tr><td>81–90</td><td>Neutral
        good*</td></tr><tr><td>91–100</td><td>Neutral</td></tr></tbody></table><p>*
        The item can also be used by any character whose alignment corresponds
        to the non-neutral portion of the item’s alignment.</p>
