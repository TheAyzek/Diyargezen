        /><p>@Source[PZO1110;pages=193]</p><p>You can move through an unoccupied
        square without difficulty in most circumstances. Difficult terrain and a
        number of spell effects might hamper your movement through open
        spaces.</p><h2>Friend</h2><p>You can move through a square occupied by a
        friendly character, unless you are charging. When you move through a
        square occupied by a friendly character, that character doesn’t provide
        you with cover (see page 195).</p><h2>Opponent</h2><p>You can’t move
        through a square occupied by an opponent unless the opponent is
        helpless. You can move through a square occupied by a helpless opponent
        without penalty. Some creatures, particularly very large ones, may
        present an obstacle even when helpless. In such cases, each square you
        move through counts as 2 squares.</p><h2>Ending Your Movement</h2><p>You
        can’t end your movement in the same square as another creature unless it
        is helpless.</p><h2>Overrun</h2><p>During your movement, you can attempt
        to move through a square occupied by an opponent (see page
        201).</p><h2>Tumbling</h2><p>A trained character can attempt to use
        Acrobatics to move through a square occupied by an opponent (see the
        Acrobatics skill).</p><h2>Very Small Creature</h2><p>A Fine, Diminutive,
        or Tiny creature can move into or through an occupied square. The
        creature provokes attacks of opportunity when doing so.</p><h2>Square
        Occupied by Creature Three Sizes Larger or Smaller</h2><p>Any creature
        can move through a square occupied by a creature three size categories
        larger than itself.</p><p>A big creature can move through a square
        occupied by a creature three size categories smaller than it is.
        Creatures moving through squares occupied by other creatures provoke
        attacks of opportunity from those creatures.</p><h2>Designated
        Exceptions</h2><p>Some creatures break the above rules. A creature that
        completely fills the squares it occupies cannot be moved past, even with
        the Acrobatics skill or similar special abilities.</p>
