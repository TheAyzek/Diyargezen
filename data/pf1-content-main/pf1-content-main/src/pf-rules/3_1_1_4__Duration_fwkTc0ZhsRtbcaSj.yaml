        /><p>@Source[PZO1110;pages=417]</p><p>Unless otherwise stated, most
        traps have a duration of instantaneous; once triggered, they have their
        effect and then stop functioning. Some traps have a duration measured in
        rounds. Such traps continue to have their listed effect each round at
        the top of the initiative order (or whenever they were activated, if
        they were triggered during combat).</p>
