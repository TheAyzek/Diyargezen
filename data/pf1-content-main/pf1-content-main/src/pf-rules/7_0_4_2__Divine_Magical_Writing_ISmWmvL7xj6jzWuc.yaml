        /><p>@Source[PZO1110;pages=221]</p><p>Divine spells can be written and
        deciphered like arcane spells (see Arcane Magical Writings). A
        Spellcraft check can decipher divine magical writing and identify it.
        Only characters who have the spell (in its divine form) on their class
        spell list can cast a divine spell from a scroll.</p>
