        /><p>@Source[PZO1110;pages=201]</p><p>Feinting is a standard action. To
        feint, make a Bluff skill check. The DC of this check is equal to 10 +
        your opponent’s base attack bonus + your opponent’s Wisdom modifier. If
        your opponent is trained in Sense Motive, the DC is instead equal to 10
        + your opponent’s Sense Motive bonus, if higher. If successful, the next
        melee attack you make against the target does not allow him to use his
        Dexterity bonus to AC (if any). This attack must be made on or before
        your next turn.</p><p>When feinting against a nonhumanoid you take a –4
        penalty. Against a creature of animal Intelligence (1 or 2), you take a
        –8 penalty. Against a creature lacking an Intelligence score, it’s
        impossible.</p><p>Feinting in combat does not provoke attacks of
        opportunity.</p><h2>Feinting as a Move Action</h2><p>With the Improved
        Feint feat, you can attempt a feint as a move action.</p>
