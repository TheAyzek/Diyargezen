        /><p>@Source[PZO1110;pages=221]</p><p>A number of classes and creatures
        gain the use of special abilities, many of which function like
        spells.</p><p><em>See PF-Universal Monster Rules for Special
        Abilities</em></p><h2>Spell-Like Abilities</h2><p>Usually, a spell-like
        ability works just like the spell of that name. A spell-like ability has
        no verbal, somatic, or material component, nor does it require a focus.
        The user activates it mentally. Armor never affects a spell-like
        ability’s use, even if the ability resembles an arcane spell with a
        somatic component.</p><p>A spell-like ability has a casting time of 1
        standard action unless noted otherwise in the ability or spell
        description. In all other ways, a spell-like ability functions just like
        a spell.</p><p>Spell-like abilities are subject to spell resistance and
        dispel magic. They do not function in areas where magic is suppressed or
        negated. Spell-like abilities cannot be used to counterspell, nor can
        they be counterspelled.</p><p>If a character class grants a spell-like
        ability that is not based on an actual spell, the ability’s effective
        spell level is equal to the highest-level class spell the character can
        cast, and is cast at the class level the ability is
        gained.</p><h2>Supernatural Abilities</h2><p>These can’t be disrupted in
        combat and generally don’t provoke attacks of opportunity. They aren’t
        subject to spell resistance, counterspells, or dispel magic, and don’t
        function in antimagic areas.</p><h2>Extraordinary Abilities</h2><p>These
        abilities cannot be disrupted in combat, as spells can, and they
        generally do not provoke attacks of opportunity. Effects or areas that
        negate or disrupt magic have no effect on extraordinary abilities. They
        are not subject to dispelling, and they function normally in an
        antimagic field. Indeed, extraordinary abilities do not qualify as
        magical, though they may break the laws of physics.</p><h2>Natural
        Abilities</h2><p>This category includes abilities a creature has because
        of its physical nature. Natural abilities are those not otherwise
        designated as extraordinary, supernatural, or spell-like.</p>
