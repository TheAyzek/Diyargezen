        /><p>@Source[PZO1117;pages=100]</p><p>While duels can be treated as
        another form of combat, they are usually done to resolve a dispute
        between colleagues or rivals and are not usually intended to end in
        death. As a result, duels are usually fought with a specific prize in
        mind. Arcane academies are known for having duels to assign important
        faculty positions and as competitions between students for valuable
        prizes. In some places, magical duels of this kind are so common that
        special areas are constructed specifically for duels. Such dueling yards
        are sometimes made with special magic that can be activated for dueling
        competitions, converting all damage to nonlethal damage and preventing
        or reversing magic that instantly slays a foe or does permanent harm.
        That is not to say that accidents don’t happen, and more than one
        student has lost a limb or even her life while on such “safe”
        fields.</p><p>Regardless of the conditions, most duels are serious
        affairs, with each side putting pride, honor, treasure, and even their
        lives on the line to win the day. While villains might try to cheat the
        rules and exploit every advantage, the more noble duelist sees the
        competition as a chance to prove her superiority and skill on the field
        of battle, using only her magic and wits.</p>
