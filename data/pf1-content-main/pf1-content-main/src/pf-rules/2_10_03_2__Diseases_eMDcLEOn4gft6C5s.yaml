        Poison}</li></ul><hr /><p>@Source[PZO1110;pages=557]</p><p>From a
        widespread plague to the bite of a dire rat, disease is a serious threat
        to common folk and adventurers alike. Diseases rarely have a limited
        frequency, but most have a lengthy onset time. This onset time can also
        be variable. Most diseases can be cured by a number of consecutive
        saving throws or by spells such as remove
        disease.</p><p>@Compendium[pf-content.pf-rules.pACT8bxamz9CurLQ]{2.10.03.2.1.
