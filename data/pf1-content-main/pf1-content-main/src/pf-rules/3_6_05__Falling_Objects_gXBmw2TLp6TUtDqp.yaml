        Suffocation}</li><li>@Compendium[pf-content.pf-rules.dErmNWeOdWiEyQVB]{3.6.10.
        Water Dangers}</li></ul><hr /><p>@Source[PZO1110;pages=443]</p><p>Just
        as characters take damage when they fall more than 10 feet, so too do
        they take damage when they are hit by falling objects.</p><p>Objects
        that fall upon characters deal damage based on their size and the
        distance they have fallen. Table 13– 11 determines the amount of damage
        dealt by an object based on its size. Note that this assumes that the
        object is made of dense, heavy material, such as stone. Objects made of
        lighter materials might deal as little as half the listed damage,
        subject to GM discretion. For example, a Huge boulder that hits a
        character deals 6d6 points of damage, whereas a Huge wooden wagon might
        deal only 3d6 damage. In addition, if an object falls less than 30 feet,
        it deals half the listed damage. If an object falls more than 150 feet,
        it deals double the listed damage. Note that a falling object takes the
        same amount of damage as it deals.</p><p>Dropping an object on a
        creature requires a ranged touch attack. Such attacks generally have a
        range increment of 20 feet. If an object falls on a creature (instead of
        being thrown), that creature can make a DC 15 Reflex save to halve the
        damage if he is aware of the object. Falling objects that are part of a
        trap use the trap rules instead of these general
        guidelines.</p><h2>Table 13-11: Damage from Falling
        Objects</h2><table><tbody><tr><td><p>Object
        Size</p></td><td><p>Damage</p></td></tr><tr><td><p>Tiny or
        smaller</p></td><td><p>1d6</p></td></tr><tr><td><p>Small</p></td><td><p>2d6</p></td></tr><tr><td><p>Medium</p></td><td><p>3d6</p></td></tr><tr><td><p>Large</p></td><td><p>4d6</p></td></tr><tr><td><p>Huge</p></td><td><p>6d6</p></td></tr><tr><td><p>Gargantuan</p></td><td><p>8d6</p></td></tr><tr><td><p>Colossal</p></td><td><p>10d6</p></td></tr></tbody></table>
