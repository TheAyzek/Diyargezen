        /><p>@Source[PZO1117]</p><p>In addition to the normal choices of animal
        companions, a druid who is so inclined may select a vermin as her
        companion. Vermin companions follow the same rules as animal companions,
        advancing their Hit Dice and other abilities per the animal companion
        base statistics table. Vermin companions can be trained as if they were
        animals using the Handle Animal skill.</p><p><strong>Mindless</strong>:
        Vermin companions have no Intelligence score and possess the mindless
        trait. In spite of this, vermin companions may learn one trick, plus
        additional bonus tricks. If a vermin animal companion gains an ability
        score increase (at 4 Hit Dice, 8 Hit Dice, and so on), the druid can
        apply this increase to the companion's Intelligence, changing it from —
        to 1, at which point the companion loses the mindless quality and is
        able to know up to 3 tricks per point of Intelligence, plus the
        additional bonus tricks. Vermin companions have no skill points or feats
        as long as they have the mindless quality.</p><p><strong>Trip</strong>:
        Because many vermin have multiple limbs, they are very difficult to
        trip. As a result, a CMD entry has been included for each, indicating
        the bonus to CMD such vermin receive against trip attacks.</p><hr
