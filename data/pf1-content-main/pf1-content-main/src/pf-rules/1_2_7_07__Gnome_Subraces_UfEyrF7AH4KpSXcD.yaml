      content: >-
        <h2> Bleachlings</h2><p>@Source[PZO9491;pages=16]</p><p>While most
        gnomes who undergo the harrowing process of the Bleaching physically
        waste away from boredom, some gnomes do survive the process, emerging as
        humorless, monochrome versions of their former selves. Referred to as
        “bleachlings,” these gnomes are eerily serene and placid. In addition to
        the effects of the Bleaching itself, many bleachlings have the
        academician and eternal hope alternate racial traits, as well as the
        bleachling magic and nature affinity traits listed below.</p><h2> Dread
        Gnomes</h2><p>@Source[PZO1121;pages=33]</p><p>Moodier, less forgiving,
        and often crueler than other gnomes, dread gnomes trace their heritage
        to the darker, more bloodthirsty lines of fey. Though not all dread
        gnomes are evil, they all find humor in watching others suffer, and have
        little use for the bright colors and joyful pursuits of their more
        cheerful cousins. Dread gnomes have the fell magic and knack for poison
        alternate racial traits.</p><h2> First World
        Gnomes</h2><p>@Source[PZO9491;pages=16]</p><p>The gnomes of Golarion are
        immigrants from the First World, the primordial realm of the fey. While
        Golarion’s gnomes have had generations to adapt to the realities of the
        Material Plane, many gnomes remain in the First World to this day. In
        addition to the First World creature template (<em>Pathfinder Campaign
        Setting: First World, Realm of the Fey</em> 57), most First World gnomes
        have the bond to the land alternate racial trait, as well as the fey
        fortitude and fey magic traits listed below.</p><h2> Gear
        Gnomes</h2><p>@Source[PZO1121;pages=33]</p><p>Sometimes rather than a
        single gnome becoming obsessed with a project, whole families of gnomes
        undertake a project so massive it requires generations of artisans to
        complete. Such projects often involve complex clockwork devices (or
        entire clockwork buildings), and those born into families dedicated to
        lifetimes of work on them are known as gear gnomes. Gear gnomes have the
        academician and master tinker alternate racial traits.</p><h2> Lava
        Gnomes</h2><p>@Source[PZO1121;pages=33]</p><p>Fascinated by the power of
        magma and living in vast caverns beneath active volcanoes, lava gnomes
        are considered hot-tempered and dangerously unstable even by other
        gnomes. Lava gnomes have the darkvision and pyromaniac alternate racial
        traits.</p><h2> Segada Gnomes</h2><p>@Source[PZO9491;pages=16]</p><p>The
        city of Segada on the continent of Arcadia has a substantial gnomish
        population, which emigrated from the tall peaks of the Akrandida
        Mountains. Known for their creativity and love all forms of artistic
        expression, many of Segada’s gnomes make their living as entertainers.
        Even more so than other gnomes, Segada gnomes are fond of wearing bright
        colors, and often wear accessories that make noise as they move, such as
        bells, jangling bracelets, and flute-like reed pendants. Most Segada
        gnomes have the darkvision, gift of tongues, and magical linguist
        alternate racial traits, as well as the artistic and sound mimicry
        alternate racial traits described below.</p><h2> Traveler
        Gnomes</h2><p>@Source[PZO1121;pages=33]</p><p>These gnomes were born on
        the move, their families living on a ship or in a caravan wagon. These
        gnomes have the magical linguist and either the explorer or the gift of
        tongues alternate racial traits.</p>
