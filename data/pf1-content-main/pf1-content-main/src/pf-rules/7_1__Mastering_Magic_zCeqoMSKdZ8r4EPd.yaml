        /><p>@Source[PZO1117;pages=92]</p><p>Anyone can be a spellcaster. If you
        can crack open a book and knuckle down in your studies, you can probably
        become a passable wizard. If you can devote yourself in body and soul to
        a god—and why wouldn’t you, when there’s such a variety to choose
        from?—you may find yourself endowed with magical powers simply for
        having faith in your god’s (and your own) righteousness. Oracles are
        chosen without their consent, far-roving rangers pick up magical tricks
        and traps, druids channel the will of nature, sorcerers get their
        abilities as dubious presents from philandering ancestors, and bards
        find magical inspiration in performance and art. Magic is everywhere in
        the Pathf inder Roleplaying Game, and many of the movers and shakers in
        towns and cities of any significant size have a spell or two up their
        sleeves.</p><p>But those are just ordinary people who have access to
        magic. Basic hedge wizards may make a fine living crafting glowing
        swords, and a priest with the ability to heal broken bones is a must for
        any church that wants to win itself a congregation, but such everyday
        spellcasters are hardly the stuff of legend. Instead, those magic users
        who get remembered as heroes and legends—rather than simply magical
        craftsmen and merchants—take these same techniques and build upon them,
        seeking out ever-more-elusive knowledge and crafting new spells of
        magnificent power. It is with these esoteric practices that the greatest
        make names for themselves; these potent arts set the masters apart from
        mundane practitioners.</p>
