    text:
      content: >-
        <h2>Agathion-Blooded
        (Idyllkin)</h2><p>@Source[PZO9424;pages=21]</p><p>Idyllkin possess
        bestial aspects and calm dispositions, and often act as peaceful
        intermediaries between lawful and chaotic agents of
        good.</p><p><strong>Ancestry </strong>Agathion<br /><strong>Typical
        Alignment </strong>NG<br /><strong>Ability Modifiers </strong>+2 Con, +2
        Cha<br /><strong>Alternate Skill Modifiers </strong>Handle Animal,
        Survival<br /><strong>Alternate Spell-Like Ability </strong>Idyllkin
        gain <em>summon nature’s ally II </em>as a spell-like
        ability.</p><h2>Angel-Blooded
        (Angelkin)</h2><p>@Source[PZO9424;pages=21]</p><p>Angelkin are mortal
        paragons of exceptional beauty, and they serve as exemplars of good and
        light regardless of the myriad forms they may
        take.</p><p><strong>Ancestry </strong>Angel<br /><strong>Typical
        Alignment </strong>Any good<br /><strong>Ability Modifiers </strong>+2
        Str, +2 Cha<br /><strong>Alternate Skill Modifiers </strong>Heal,
        Knowledge (planes)<br /><strong>Alternate Spell-Like Ability
        </strong>Angelkin gain <em>alter self </em>as a spell-like
        ability.</p><h2>Archon-Blooded
        (Lawbringers)</h2><p>@Source[PZO9424;pages=22]</p><p>Lawbringers are
        champions of justice and of doling out punishment to the wicked, and
        often believe chaos is the cause of all mortal
        suffering.</p><p><strong>Ancestry </strong>Archon<br /><strong>Typical
        Alignment</strong> LG<br /><strong>Ability Modifiers</strong> +2 Con, +2
        Wis<br /><strong>Alternate Skill Modifiers</strong> Intimidate, Sense
        Motive<br /><strong>Alternate Spell-Like Ability</strong> Lawbringers
        gain <em>continual flame</em> as a spell-like
        ability.</p><h2>Azata-Blooded
        (Musetouched)</h2><p>@Source[PZO9424;pages=22]</p><p>The musetouched
        epitomize freedom and joy, and travel the world to liberate less
        fortunate individuals.</p><p><strong>Ancestry </strong>Azata<br
        /><strong>Typical Alignment </strong>CG<br /><strong>Ability Modifiers
        </strong>+2 Dex, +2 Cha<br /><strong>Alternate Skill Modifiers</strong>
        Diplomacy, Perform<br /><strong>Alternate Spell-Like Ability</strong>
        Musetouched gain <em>glitterdust </em>as a spell-like
        ability.</p><h2>Garuda-Blooded
        (Plumekith)</h2><p>@Source[PZO9424;pages=23]</p><p>Their shimmering
        avian features make plumekith instantly recognizable. Though they can
        act rashly, plumekith never shirk their duty after making a
        commitment.</p><p><strong>Ancestry </strong>Garuda<br /><strong>Typical
        Alignment</strong> CG<br /><strong>Ability Modifiers</strong> +2 Dex, +2
        Wis<br /><strong>Alternate Skill Modifiers</strong> Acrobatics, Fly<br
        /><strong>Alternate Spell-Like Ability</strong> Plumekith gain see
        <em>invisibility </em>as a spell-like ability.</p><h2>Peri-Blooded
        (Emberkin)</h2><p>@Source[PZO9424;pages=23]</p><p>Masters of fire magic,
        emberkin feel the dual pull of their peri forebear as well as that of a
        fallen angel further down their ancestry, and wrestle with their urges
        to do both good and evil.</p><p><strong>Ancestry </strong>Peri<br
        /><strong>Typical Alignment </strong>NG<br /><strong>Ability
        Modifiers</strong> +2 Int, +2 Cha<br /><strong>Alternate Skill
        Modifiers</strong> Knowledge (planes), Spellcraft<br /><strong>Alternate
        Spell-Like Ability</strong> Emberkin gain <em>pyrotechnics </em>as a
        spell-like ability.</p>
