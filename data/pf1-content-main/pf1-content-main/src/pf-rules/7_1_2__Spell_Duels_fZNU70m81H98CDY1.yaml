        /><p>@Source[PZO1117;pages=99]</p><p>Spellcasters are no strangers to
        battle, but there’s a difference between the chaos of a huge melee, with
        dozens of feral monsters seeking to tear the caster limb from limb, and
        a more civilized duel between rivals seeking to settle a dispute. Make
        no mistake, these duels can be just as deadly, but the rules surrounding
        them make for a different style of combat—one in which both combatants
        can attack and defend with ease, allowing the true skill and power of
        each to determine the
        victor.</p><p>@Compendium[pf-content.pf-rules.UToCl4LMgb7JrfSN]{7.1.2.1.
        Starting a
        Duel}</p><p>@Compendium[pf-content.pf-rules.C8a2AhDUmCu38ErH]{7.1.2.2.
