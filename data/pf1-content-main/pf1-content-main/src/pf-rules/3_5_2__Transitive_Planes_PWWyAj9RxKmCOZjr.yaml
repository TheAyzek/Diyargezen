        Layered
        Planes}</li><li>@Compendium[pf-content.pf-rules.5HeGmOWABLZ7bME7]{3.5.7.
        How Planes Interact}</li></ul><hr /><p>Transitive planes have one
        important common characteristic: they “overlap” with other planes, and
        as such can be used to travel between these overlapping realities. These
        planes have the strongest regular interaction with the Material Plane
        and are often accessed by using various spells. They have native
        inhabitants as well.</p><p>Example transitive planes include the
        following:</p><ul><li>@Compendium[pf-content.pf-rules.wIOKevEcdi1td8qE]{3.5.2.1.
        Astral
        Plane}</li><li>@Compendium[pf-content.pf-rules.DbV0r2IXhYsQM3yd]{3.5.2.2.
        Ethereal
        Plane}</li><li>@Compendium[pf-content.pf-rules.6Al8NK1Ns6hjr5AL]{3.5.2.3.
        Shadow Plane}</li></ul>
