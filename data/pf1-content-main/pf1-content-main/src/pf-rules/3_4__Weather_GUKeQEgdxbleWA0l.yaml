    text:
      content: >-
        <p>@Compendium[pf-content.pf-rules.XOJpjqmBzwE4R4n0]{(Index)
        Environment}</p><p><strong>@Compendium[pf-content.pf-rules.GUKeQEgdxbleWA0l]{3.4.
        Weather}</strong></p><ul><li>@Compendium[pf-content.pf-rules.pHXeVyYf1x4VAEHD]{3.4.1.
        Rain, Snow, Sleet, and
        Hail}</li><li>@Compendium[pf-content.pf-rules.CGWYylbSPcCdf6xq]{3.4.2.
        Storms}</li><li>@Compendium[pf-content.pf-rules.zbaKzSfM3Synw9Cd]{3.4.3.
        Fog}</li><li>@Compendium[pf-content.pf-rules.TGNihLM3XTYgf6MV]{3.4.4.
        Winds}</li></ul><hr /><p>@Source[PZO1110;pages=437]</p><p>Weather can
        play an important role in an adventure.</p><h2>Roll
        Tables</h2><p>@Compendium[pf-content.pf-tables.5pBOddtATtKDtPzE]{Random
        Weather}</p><p>@Compendium[pf-content.pf-tables.6WRlNx5FRj1sg477]{Types
        of Weather}</p><p>Table 13–9 below can be used as a simple local weather
        table. Terms on that table are defined as
        follows.</p><h2>Calm</h2><p>Wind speeds are light (0 to 10
        mph).</p><h2>Cold</h2><p>Between 0° and 40° Fahrenheit during the day,
        10 to 20 degrees colder at night.</p><h2>Cold Snap</h2><p>Lowers
        temperature by –10° F.</p><h2>Downpour</h2><p>Treat as rain (see
        Precipitation, below), but conceals as fog. Can create floods. A
        downpour lasts for 2d4 hours.</p><h2>Heat Wave</h2><p>Raises temperature
        by +10° F.</p><h2>Hot</h2><p>Between 85° and 110° Fahrenheit during the
        day, 10 to 20 degrees colder at night.</p><h2>Moderate</h2><p>Between
        40° and 60° Fahrenheit during the day, 10 to 20 degrees colder at
        night.</p><h2>Powerful Storm (Windstorm/Blizzard/Hurricane/
        Tornado)</h2><p>Wind speeds are over 50 mph (see Table 13–10). In
        addition, blizzards are accompanied by heavy snow (1d3 feet), and
        hurricanes are accompanied by downpours. Windstorms last for 1d6 hours.
        Blizzards last for 1d3 days. Hurricanes can last for up to a week, but
        their major impact on characters comes in a 24-to-48-hour period when
        the center of the storm moves through their area. Tornadoes are very
        short-lived (1d6 × 10 minutes), typically forming as part of a
        thunderstorm system.</p><h2>Precipitation</h2><p>Roll d% to determine
        whether the precipitation is fog (01–30), rain/snow (31–90), or
        sleet/hail (91–00). Snow and sleet occur only when the temperature is
        30° Fahrenheit or below. Most precipitation lasts for 2d4 hours. By
        contrast, hail lasts for only 1d20 minutes but usually accompanies 1d4
        hours of rain.</p><h2>Storm
        (Duststorm/Snowstorm/Thunderstorm)</h2><p>Wind speeds are severe (30 to
        50 mph) and visibility is cut by three-quarters. Storms last for 2d4–1
        hours. See Storms, below, for more details.</p><h2>Warm</h2><p>Between
        60° and 85° Fahrenheit during the day, 10 to 20 degrees colder at
        night.</p><h2>Windy</h2><p>Wind speeds are moderate to strong (10 to 30
        mph); see Table 13–10.</p><h2>Table 13-9: Random
        Weather</h2><table><thead><tr><td>d%</td><td>Weather</td><td>Cold
        Climate</td><td>Temperate
        Climate<sup>1</sup></td><td>Desert</td></tr></thead><tbody><tr><td>01-70</td><td>Normal
        weather</td><td>Cold, calm</td><td>Normal for
        season<sup>2</sup></td><td>Hot,
        calm</td></tr><tr><td>71-80</td><td>Abnormal weather</td><td>Heat wave
        (01-30) or cold snap (31-100)</td><td>Heat wave (01-50) or cold snap
        (51-100)</td><td>Hot, windy</td></tr><tr><td>81-90</td><td>Inclement
        weather</td><td>Precipitation (snow)</td><td>Precipitation (normal for
        season)</td><td>Hot,
        windy</td></tr><tr><td>91-99</td><td>Storm</td><td>Snowstorm</td><td>Thunderstorm,
        snowstorm</td><td>Duststorm</td></tr><tr><td>100</td><td>Powerful
        storm</td><td>Blizzard</td><td>Windstorm, blizzard, hurricane,
        tornado</td><td>Downpour</td></tr></tbody></table><p>1 Temperate
        includes forests, hills, marshes, mountains, plains, and warm aquatic
        environments.<br />2 Winter is cold, summer is warm, spring and autumn
        are temperate. Marsh regions are slightly warmer in
        winter.</p><p>@Compendium[pf-content.pf-tables.5pBOddtATtKDtPzE]{Rolltable:
        Random Weather}</p><h2>Table 13-10: Wind
        Effects</h2><table><thead><tr><td></td><td>Ranged
        Attacks</td><td></td></tr><tr><td>Wind Force</td><td>Wind
        Speed</td><td>Normal/Seige Weapons<sup>1</sup></td><td>Checked
        Size<sup>2</sup></td><td>Blown Away Size<sup>3</sup></td><td>Fly
        Penalty</td></tr></thead><tbody><tr><td>Light</td><td>0-10
        mph</td><td>—/—</td><td>—</td><td>—</td><td>—</td></tr><tr><td>Moderate</td><td>11-20
        mph</td><td>—/—</td><td>—</td><td>—</td><td>—</td></tr><tr><td>Strong</td><td>21-30
        mph</td><td>-2/—</td><td>Tiny</td><td>—</td><td>—2</td></tr><tr><td>Severe</td><td>31-50
        mph</td><td>-4/—</td><td>Small</td><td>Tiny</td><td>—4</td></tr><tr><td>Windstorm</td><td>51-74
        mph</td><td>—Impossible/—2</td><td>Medium</td><td>Small</td><td>—8</td></tr><tr><td>Hurricane</td><td>75-174
        mph</td><td>Impossible/—4</td><td>Large</td><td>Medium</td><td>—12</td></tr><tr><td>Tornado</td><td>175-300
        mph</td><td>Impossible/Impossible</td><td>Huge</td><td>Large</td><td>—16</td></tr></tbody></table><p>1
        The siege weapon category includes ballista and catapult attacks as well
        as boulders tossed by giants.<br />2 Checked Size: Creatures of this
        size or smaller are unable to move forward against the force of the wind
        unless they succeed on a DC 10 Strength check (if on the ground) or a DC
        20 Fly skill check if airborne.<br />3 Blown Away Size: Creatures on the
        ground are knocked prone and rolled 1d4 × 10 feet, taking 1d4 points of
        nonlethal damage per 10 feet, unless they make a DC 15 Strength check.
        Flying creatures are blown back 2d6 × 10 feet and take 2d6 points of
        nonlethal damage due to battering and buffeting, unless they succeed on
        a DC 25 Fly skill check.</p>
