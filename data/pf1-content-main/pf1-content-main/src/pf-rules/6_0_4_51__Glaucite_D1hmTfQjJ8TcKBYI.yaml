        /><p>@Source[PZO9085;pages=18]</p><p>When the phrase “Numerian Steel” is
        used, the speaker is usually, knowingly or not, referring to an
        iron/adamantine alloy called glaucite. This dark gray metal is the
        material of choice for hulls and starship superstructures, and is what
        constitutes the walls, floors, and ceilings of the strange ruins found
        throughout Numeria. Without more advanced technology, glaucite is
        extremely difficult to work with. Because the metal isn’t much better
        than steel for forging weapons or armor, and the process of extracting
        the adamantine from it is so expensive and time consuming that the
        resulting adamantine isn’t worth the effort, Numerian scavengers have,
        by and large, left the walls and floors of the structures buried in the
        region untouched. It’s simply easier to scavenge smaller objects or work
        with normal iron or steel in the long run.</p><p>Glaucite has 30 hit
        points per inch of thickness (the same as steel) and hardness 15. It is
        half again as heavy as steel, and the difficulty of working with the
        material triples the object’s total cost to create. As a result,
        glaucite armor and weapons are generally commissioned only by eccentrics
        and collectors and rarely see use in the field, given that steel weapons
        and armor work just as well and are less encumbering.</p>
