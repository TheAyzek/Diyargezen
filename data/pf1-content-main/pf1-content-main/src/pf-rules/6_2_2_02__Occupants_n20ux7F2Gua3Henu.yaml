        /><p>@Source[PZO1118;pages=171]</p><p>Drivers, riders, any crew, and
        creatures that serve as propulsion for a vehicle are all considered
        occupants. All occupants except for crew members and creatures used for
        propulsion can take actions and threaten areas as regular creatures.
        Crew members can take no actions nor threaten areas—their actions and
        concentration are all consumed by the act of providing propulsion or
        upkeep for the vehicle.</p>
