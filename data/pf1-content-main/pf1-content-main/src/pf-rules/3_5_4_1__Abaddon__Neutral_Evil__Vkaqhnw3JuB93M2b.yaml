        /><p>@Source[PZO1114;pages=191]</p><p>A realm of vast wastelands under a
        rotten sky, Abaddon is perpetually cloaked in a cloying black mist and
        the oppressive twilight of an endless solar eclipse. The poisoned River
        Styx has its source in Abaddon, before it meanders like a twisted
        serpent onto other planes. Abaddon may be the most hostile of the Outer
        Planes; it is the home of the daemons, fiends of pure evil untouched by
        the struggle between law and chaos, who personify oblivion and
        destruction. Daemons, which are ruled by four godlike archdaemons, are
        feared throughout the Great Beyond as devourers of souls.</p><h2>Planar
        Traits</h2><p>Abaddon has the following
        traits:</p><ul><li><strong>Divinely Morphic</strong>: Deities with
        domains in Abaddon can alter the plane at will.</li><li><strong>Strongly
        Evil-Aligned</strong></li><li><strong>Enhanced Magic</strong>: Spells
        and spell-like abilities with the evil descriptor are
        enhanced.</li><li><strong>Impeded Magic</strong>: Spells and spell-like
        abilities with the good descriptor are impeded.</li></ul>
