        /><p>@Source[PZO1110;pages=415]</p><p>Stone walls, iron walls, and iron
        doors are usually thick enough to block most detect spells, such as
        detect thoughts. Wooden walls, wooden doors, and stone doors are usually
        not thick enough to do so. A secret stone door built into a wall and as
        thick as the wall itself (at least 1 foot) does block most detect
        spells.</p>
