        /><p>@Source[PZO1117;pages=110]</p><p>Only the most insane or desperate
        spellcasters dare to call and bind a qlippoth. The qlippoth’s
        unpredictable nature, horrific appearance, and hatred for all mortal
        life make them some of the most dangerous outsiders to summon. They were
        once rulers of the Abyss, but were overthrown when the souls of mortal
        sinners arrived and transformed into the first demons. While qlippoth
        may bargain with mortal spellcasters, they don’t feel bound to follow
        such agreements, and often blatantly disregard the orders of their
        binders, no matter the consequences.</p><p>Qlippoth are immune to cold,
        mind-affecting effects, and poison. They have resistance to acid 10,
        electricity 10, and fire 10. All but the least have an aura of fear and
        madness.</p><h2>Augnagar</h2><p>Stupid and ravenous, these cannibalistic
        qlippoth rarely bargain with their binders, but can be threatened into
        what passes for qlippoth service.</p><h2>Chernobue (SR 23)</h2><p>These
        flopping and writhing things are only concerned with spreading their
        vile poison. They do not bargain with
        binders.</p><h2>Cythnigot</h2><p>The most common type of qlippoth found
        on the Material Plane, cythnigots are called by some chaotic evil
        spellcasters to act as familiars; a cythnigot latches on to a Tiny
        animal familiar the spellcaster already has.</p><h2>Iathavos (SR
        31)</h2><p>The powerful and singular iathavos never answers the call of
        a binder, even an epic one.</p><h2>Nyogoth</h2><p>These hungry, abyssal
        bottom feeders heed the calls of spellcasters, but typically only to
        find new things to eat in far-off places. Though not stupid, nyogoths
        are hard to reason with, and only respond when offered new and
        interesting things to eat.</p><h2>Shoggti</h2><p>Next to cythnigots,
        shoggti are the most common qlippoth found on the Material Plane. These
        masters of mind manipulation are always on the hunt for living slaves
        for their inexplicable plans. A shoggti quickly heeds the call of a
        binder, hoping to eventually turn her into its newest
        thrall.</p><h2>Thulgant (SR 25 vs. lawful spells and
        creatures)</h2><p>These powerful qlippoth are too arrogant and
        self-important to answer the call of a spellcaster wishing to bind
        them.</p>
