        /><p>@Source[PZO1118;pages=176]</p><p>Squares of propulsion devices have
        their own statistics, separate from the vehicle’s. Use the following
        rules to determine those statistics.</p><h2>Alchemical
        Engine</h2><p>Harvesting the power of steam or some other alchemical
        reaction, these engines are typically reinforced and difficult to
        destroy. They can be disabled, and are considered either difficult or
        extreme devices based on the complexity of the
        device.</p><h2>Creature</h2><p>A creature used as propulsion uses its
        own statistics. During movement and the effects of any combat maneuver,
        pulling creatures’ spaces are considered vehicle spaces to determine the
        effects of vehicle maneuvers. Creatures pulling a vehicle can be
        arranged in teams. This means two creatures of the same type and same
        size can occupy the same space to pull a
        vehicle.</p><h2>Dirigible</h2><p>Lighter-than-air alchemical gases can
        be harnessed to give a vehicle flight. Dirigibles are often easier to
        destroy than the vehicle they convey. Dirigibles have 5 hit points per
        square and no hardness. They take double the normal damage from acid,
        electricity, and fire attacks (multiply the damage roll by
        2).</p><h2>Magic Item</h2><p>Like a creature, a magic item uses its own
        item statistics.</p><h2>Sails</h2><p>Used on magically or alchemically
        powered airships and on any fast-moving water vehicle, sails are often
        weaker than the vessels they propel, though they are relatively easy to
        repair. Taking out the sails is a good way to capture a vessel. Sails
        have 5 hit points per square and no hardness. They take double the
        normal damage from acid and fire attacks (multiply the damage roll by
        2). While the sails have rigging, such rigging manipulated by the crew,
        and as such are not considered driving
        devices.</p><table><thead><tr><td>Material</td><td>Hit Points per
        Square</td><td>Hardness</td></tr></thead><tbody><tr><td>Sails</td><td>5</td><td>0</td></tr><tr><td>Dirigible</td><td>5</td><td>0</td></tr><tr><td>Alchemical
        Engine</td><td>20</td><td>8</td></tr><tr><td>Magically
        Treated</td><td>x2</td><td>x2</td></tr></tbody></table>
