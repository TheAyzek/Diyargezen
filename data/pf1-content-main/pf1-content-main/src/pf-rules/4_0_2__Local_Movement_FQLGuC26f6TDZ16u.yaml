        /><p>@Source[PZO1110;pages=170]</p><p>Characters exploring an area use
        local movement, measured in feet per minute.</p><h2>Walk</h2><p>A
        character can walk without a problem on the local
        scale.</p><h2>Hustle</h2><p>A character can hustle without a problem on
        the local scale. See
        @Compendium[pf-content.pf-rules.jLbdG9bbb1MReAgk]{4.0.3. Overland
        Movement}, below, for movement measured in miles per
        hour.</p><h2>Run</h2><p>A character can run for a number of rounds equal
        to his Constitution score on the local scale without needing to rest.
        See Chapter 8 for rules covering extended periods of running.</p>
