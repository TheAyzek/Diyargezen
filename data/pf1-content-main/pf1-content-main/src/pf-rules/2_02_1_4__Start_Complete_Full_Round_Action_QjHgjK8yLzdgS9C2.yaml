        /><p>@Source[PZO1110;pages=185]</p><p>The “start full-round action”
        standard action lets you start undertaking a full-round action, which
        you can complete in the following round by using another standard
        action. You can’t use this action to start or complete a full attack,
        charge, run, or withdraw.</p>
