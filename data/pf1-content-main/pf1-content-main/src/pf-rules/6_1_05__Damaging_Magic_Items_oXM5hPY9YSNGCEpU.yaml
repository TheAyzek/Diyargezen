        /><p>@Source[PZO1110;pages=459]</p><p>A magic item doesn’t need to make
        a saving throw unless it is unattended, it is specifically targeted by
        the effect, or its wielder rolls a natural 1 on his save. Magic items
        should always get a saving throw against spells that might deal damage
        to them—even against attacks from which a nonmagical item would normally
        get no chance to save. Magic items use the same saving throw bonus for
        all saves, no matter what the type (Fortitude, Ref lex, or Will). A
        magic item’s saving throw bonus equals 2 + 1/2 its caster level (rounded
        down). The only exceptions to this are intelligent magic items, which
        make Will saves based on their own Wisdom scores.</p><p>Magic items,
        unless otherwise noted, take damage as nonmagical items of the same
        sort. A damaged magic item continues to function, but if it is
        destroyed, all its magical power is lost. Magic items that take damage
        in excess of half their total hit points, but not more than their total
        hit points, gain the broken condition, and might not function properly
        (see the Appendix).</p>
