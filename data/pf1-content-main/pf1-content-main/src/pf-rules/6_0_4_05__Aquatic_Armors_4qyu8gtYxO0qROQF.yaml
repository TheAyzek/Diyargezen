        Equipment}</p><ul><li>@Compendium[pf-content.pf-rules.TROqcNjEw3b2q2Dk]{6.0.4.
        Special Materials}</li></ul><hr /><h2>Coral</h2><p>Armor made of coral
        is grown, not made. Special corals are shaped and molded while growing,
        and then harvested and hardened to be worn as armor. Coral armor often
        has a bizarre organic look to it.</p><h2>Clamshell</h2><p>Clamshell
        armor is made by connecting together various sized shells harvested from
        giant clams.</p><h2>Chitim</h2><p>Chitin armor is constructed from the
        exoskeletons of giant aquatic vermin, such as giant crabs and lobsters.
        It is full-body armor.</p><h2>Table: Aquatic Armors</h2><table><caption>
