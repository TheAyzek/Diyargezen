        /><p>@Source[PZO1132;pages=144]</p><p>Wizards study ancient tomes to
        unlock arcane secrets of the universe, and clerics pray to distant
        deities to grant them divine power. Yet there is a third, more esoteric
        kind of magic, connected to every creature’s composite being, from the
        conscious mind to the deepest desire, from the life force to the spirit,
        from the very soul to the cosmic self. This third type of magic is
        psychic magic.</p><p>A psychic spell largely functions like any other
        spell. It’s another type of magic, similar to arcane or divine magic—in
        fact, those who use psychic magic are easily mistaken for practitioners
        of arcane and divine traditions. Metamagic feats and any other rules
        that alter or trigger from spells can usually be used with psychic
        spells (though see the Components section below for a few exceptions).
        Psychic spellcasters aren’t affected by effects that target only arcane
        or divine spellcasters, nor can they use arcane or divine scrolls or
        other items or feats that state they can be utilized by only arcane or
        divine
        spellcasters.</p><p>@Compendium[pf-content.pf-rules.U5kuu9Bq7kqY3mpK]{7.0.5.1.
        Components}</p><p>@Compendium[pf-content.pf-rules.THcPcBnf09tYljUa]{7.0.5.2.
        Undercasting Spells}</p>
