        Dungeon Terrain}</li></ul><hr /><p>@Source[PZO1110;pages=410]</p><p>Of
        all the strange places that an adventurer might explore, none is
        deadlier than the dungeon. These labyrinths, full of deadly traps,
        hungry monsters, and priceless treasure, test every skill a character
        possesses. These rules can apply to dungeons of any type, from the wreck
        of a sunken ship to a vast cave complex.</p>
