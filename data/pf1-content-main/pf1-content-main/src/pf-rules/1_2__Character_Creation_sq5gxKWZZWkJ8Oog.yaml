        <p>@Compendium[pf-content.pf-rules.8scSEgBEtJZj0suf]{(Index) Basic
        Rules}</p><p><strong>@Compendium[pf-content.pf-rules.sq5gxKWZZWkJ8Oog]{1.2.
        Character
        Creation}</strong></p><ul><li>@Compendium[pf-content.pf-rules.ggxCDkKRReD30GRu]{1.2.1.
        Age}</li><li>@Compendium[pf-content.pf-rules.OmOuMEqk5sfibVKc]{1.2.2.
        Height and
        Weight}</li><li>@Compendium[pf-content.pf-rules.Lm4Q5P8i3nRq7IGV]{1.2.3.
        Racial
        Traits}</li><li>@Compendium[pf-content.pf-rules.m1GtHZZE31d7Acst]{1.2.4.
        Archetypes}</li><li>@Compendium[pf-content.pf-rules.uRhhh0PMyi4cRl4l]{1.2.5.
        Character
        Backgrounds}</li><li>@Compendium[pf-content.pf-rules.xyNJJF0hJUqtvcUk]{1.2.6.
        Traits}</li><li>@Compendium[pf-content.pf-rules.CgVqFS1fjMtDuoH0]{1.2.7.
        Subraces}</li></ul><hr /><p>@Source[PZO1110;pages=14]</p><p>From the sly
        rogue to the stalwart paladin, the Pathfinder RPG allows you to make the
        character you want to play. When generating a character, start with your
        character’s concept. Do you want a character who goes toe-to-toe with
        terrible monsters, matching sword and shield against claws and fangs? Or
        do you want a mystical seer who draws his powers from the great beyond
        to further his own ends? Nearly anything is possible.</p><p>Once you
        have a general concept worked out, use the following steps to bring your
        idea to life, recording the resulting information and statistics on your
        Pathfinder RPG character sheet, which can be found at the back of this
        book and photocopied for your convenience.</p><h2>Step 1— Determine
        Ability Scores</h2><p>Start by generating your character’s ability
        scores. These six scores determine your character’s most basic
        attributes and are used to decide a wide variety of details and
        statistics. Some class selections require you to have better than
        average scores for some of your abilities.</p><h2>Step 2—Pick Your
        Race</h2><p>Next, pick your character’s race, noting any modifiers to
        your ability scores and any other racial traits (see Chapter 2). There
        are seven basic races to choose from, although your GM might have others
        to add to the list. Each race lists the languages your character
        automatically knows, as well as a number of bonus languages. A character
        knows a number of additional bonus languages equal to his or her
        Intelligence modifier.</p><h2>Step 3—Pick Your Class</h2><p>A
        character’s class represents a profession, such as fighter or wizard. If
        this is a new character, he starts at 1st level in his chosen class. As
        he gains experience points (XP) for defeating monsters, he goes up in
        level, granting him new powers and abilities.</p><h2>Step 4—Pick Skills
        and Select Feats</h2><p>Determine the number of skill ranks possessed by
        your character, based on his class and Intelligence modifier (and any
        other bonuses, such as the bonus received by humans). Then spend these
        ranks on skills, but remember that you cannot have more ranks than your
        level in any one skill (for a starting character, this is usually one).
        After skills, determine how many feats your character receives, based on
        his class and level, and select them from those presented in Chapter
        5.</p><h2>Step 5—Buy Equipment</h2><p>Each new character begins the game
        with an amount of gold, based on his class, that can be spent on a wide
        range of equipment and gear, from chainmail armor to leather backpacks.
        This gear helps your character survive while adventuring. Generally
        speaking, you cannot use this starting money to buy magic items without
        the consent of your GM.</p><h2>Step 6—Finishing Details</h2><p>Finally,
        you need to determine all of a character’s details, including his
        starting hit points (hp), Armor Class (AC), saving throws, initiative
        modifier, and attack values. All of these numbers are determined by the
        decisions made in previous steps.</p><p>A level 1 character begins with
        maximum hit points for its Hit Die roll. Aside from these, you need to
        decide on your character’s name, alignment, and physical appearance. It
        is best to jot down a few personality traits as well, to help you play
        the character during the game. Additional rules (like age and alignment)
        are described in Chapter 7.</p>
