        /><p>@Source[PZO1110;pages=193]</p><p>From tangled plants to broken
        stone, there are a number of terrain features that can affect your
        movement.</p><h2>Difficult Terrain</h2><p>Difficult terrain, such as
        heavy undergrowth, broken ground, or steep stairs, hampers movement.
        Each square of difficult terrain counts as 2 squares of movement. Each
        diagonal move into a difficult terrain square counts as 3 squares. You
        can’t run or charge across difficult terrain.</p><p>If you occupy
        squares with different kinds of terrain, you can move only as fast as
        the most difficult terrain you occupy will allow.</p><p>Flying and
        incorporeal creatures are not hampered by difficult
        terrain.</p><h2>Obstacles</h2><p>Like difficult terrain, obstacles can
        hamper movement. If an obstacle hampers movement but doesn’t completely
        block it, each obstructed square or obstacle between squares counts as 2
        squares of movement. You must pay this cost to cross the obstacle, in
        addition to the cost to move into the square on the other side. If you
        don’t have sufficient movement to cross the obstacle and move into the
        square on the other side, you can’t cross it. Some obstacles may also
        require a skill check to cross.</p><p>On the other hand, some obstacles
        block movement entirely. A character can’t move through a blocking
        obstacle.</p><p>Flying and incorporeal creatures are able to avoid most
        obstacles.</p><h2>Squeezing</h2><p>In some cases, you may have to
        squeeze into or through an area that isn’t as wide as the space you take
        up. You can squeeze through or into a space that is at least half as
        wide as your normal space. Each move into or through a narrow space
        counts as if it were 2 squares, and while squeezed in a narrow space,
        you take a –4 penalty on attack rolls and a –4 penalty to AC.</p><p>When
        a Large creature (which normally takes up 4 squares) squeezes into a
        space that’s 1 square wide, the creature’s miniature figure occupies 2
        squares, centered on the line between the 2 squares. For a bigger
        creature, center the creature likewise in the area it squeezes
        into.</p><p>A creature can squeeze past a creature while moving but it
        can’t end its movement in an occupied square.</p><p>To squeeze through
        or into a space less than half your space’s width, you must use the
        Escape Artist skill. You can’t attack while using Escape Artist to
        squeeze through or into a narrow space, you take a –4 penalty to AC, and
        you lose any Dexterity bonus to
        AC.</p><p>@Compendium[pf-content.pf-buffs.XDuJwn4sGLcklc9P]{Debuff:
        Squeezing (&lt; ½
