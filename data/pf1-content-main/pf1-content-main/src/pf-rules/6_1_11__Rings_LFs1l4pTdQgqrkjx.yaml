        /><p>@Source[PZO1110;pages=478]</p><p>Rings bestow magical powers upon
        their wearers. Only a rare few have charges—most magic rings are
        permanent and potent magic items. Anyone can use a ring.</p><p>A
        character can only effectively wear two magic rings. A third magic ring
        doesn’t work if the wearer is already wearing two magic
        rings.</p><h2>Physical Description</h2><p>Rings have no appreciable
        weight. Although exceptions exist that are crafted from glass or bone,
        the vast majority of rings are forged from metal—usually precious metals
        such as gold, silver, and platinum. A ring has AC 13, 2 hit points,
        hardness 10, and a break DC of 25.</p><h2>Activation</h2><p>A ring’s
        ability is usually activated by a spoken command word (a standard action
        that does not provoke attacks of opportunity) or its effects work
        continually. Some rings have unusual activations, as mentioned in the
        ring’s specific description.</p><h2>Special Qualities</h2><p>Roll d%. A
        result of 01 indicates the ring is intelligent, 02–31 indicates that
        something (a design, inscription, or the like) provides a clue to its
        function, and 32–100 indicates no special qualities. Intelligent items
        have extra abilities and sometimes extraordinary powers and special
        purposes (see page 532). Rings with charges can never be
        intelligent.</p>
