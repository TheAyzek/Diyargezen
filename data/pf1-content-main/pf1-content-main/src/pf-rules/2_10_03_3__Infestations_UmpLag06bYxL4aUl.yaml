        Infestations}</strong></li><li>@Compendium[pf-content.pf-rules.kEWYsWvNyhPgjbC6]{2.10.03.4.
        Poison}</li></ul><hr /><p>@Source[PZO1114;pages=245]</p><p>Parasites
        such as ear seekers or rot grubs cause infestations, a type of
        affliction similar to diseases. Infestations can only be cured through
        specific means; no matter how many saving throws are made, the
        infestation continues to afflict the target. While a remove disease
        spell (or similar effect) instantly halts an infestation, immunity to
        disease offers no protection, as the infestation itself is caused by
        parasites.</p>
