        Creation}</p><ul><li>@Compendium[pf-content.pf-rules.ggxCDkKRReD30GRu]{1.2.1.
        Age}</li><li>@Compendium[pf-content.pf-rules.OmOuMEqk5sfibVKc]{1.2.2.
        Height and
        Weight}</li><li>@Compendium[pf-content.pf-rules.Lm4Q5P8i3nRq7IGV]{1.2.3.
        Racial
        Traits}</li><li><strong>@Compendium[pf-content.pf-rules.m1GtHZZE31d7Acst]{1.2.4.
        Archetypes}</strong></li><li>@Compendium[pf-content.pf-rules.uRhhh0PMyi4cRl4l]{1.2.5.
        Character
        Backgrounds}</li><li>@Compendium[pf-content.pf-rules.xyNJJF0hJUqtvcUk]{1.2.6.
        Traits}</li><li>@Compendium[pf-content.pf-rules.CgVqFS1fjMtDuoH0]{1.2.7.
        Subraces}</li></ul><hr /><p>@Source[PZO1115;pages=72]</p><p>From the
        noble paladin to the skillful rogue, each core class in the Pathfinder
        Roleplaying Game draws upon a central archetype. Yet, beyond that basic
        concept exists the potential for innumerable interpretations, details,
        and refinements. The fighter class, for example, might easily be
        sculpted into a dead-eye archer, a fleet-footed duelist, a stealthy
        jungle hunter, or countless other types of martial masters, all refined
        by a player’s choice of details, class options, and specific rules. Yet
        some archetypes prove pervasive and exciting enough to see use in play
        time and time again. To help players interested in creating iconic
        fantasy characters, the following pages explore new rules, options, and
        alternate class features for each core class.</p><p>So while most druids
        wander the woods, some track through the vast desert, reveling in what
        the wastes have to offer. Such optional features represent a unique view
        of what a class deliberately designed to capture a specific character
        archetype might become. While the types of options presented for each
        core class differ, each subsystem is customized to best serve that
        class, emulate the abilities and talents of classic fantasy archetypes,
        and expand players’ freedom to design exactly the characters they
        desire.</p><h2>Alternate Class Features</h2><p>Most of the options
        presented on the following pages include a host of alternate class
        features. When a character selects a class, he must choose to use the
        standard class features found in the Core Rulebook or those listed in
        one of the archetypes presented here. Each alternate class feature
        replaces a specific class feature from its parent class. For example,
        the elemental fist class feature of the monk of the four winds replaces
        the stunning fist class feature of the monk. When an archetype includes
        multiple class features, a character must take all of them—often
        blocking the character from ever gaining certain familiar class
        features, but replacing them with equally powerful options.</p><p>All of
        the other class features found in the core class and not mentioned among
        the alternate class features remain unchanged and are acquired normally
        when the character reaches the appropriate level (unless noted
        otherwise). A character who takes an alternate class feature does not
        count as having the class feature that was replaced when meeting any
        requirements or prerequisites.</p><p>A character can take more than one
        archetype and garner additional alternate class features, but none of
        the alternate class features can replace or alter the same class feature
        from the core class as another alternate class feature. For example, a
        paladin could not be both a hospitaler and an undead scourge since they
        both modify the smite evil class feature and both replace the aura of
        justice class feature. A paladin could, however, be both an undead
        scourge and a warrior of the holy light, since none of their new class
        features replace the same core class feature.</p><h2>Adapting Existing
        Characters</h2><p>Players with existing characters should talk with
        their GM about whether on not these alternate class features are
        available in her game, and if so, whether they can recreate their
        characters to adopt them. As alternate class features are designed to be
        balanced when compared to those in the core class, players who revise
        their characters shouldn’t be gaining any special advantage over other
        party members.</p><p>As long as the GM is comfortable with retroactively
        adjusting character specifics, there should be no disruption to future
        adventures. Typically, the best time for a player to adopt alternate
        class features and significantly revise his character is when leveling
        up between adventures, though he should always check with the GM before
        doing so, as she may wish to work significant changes to a character
        into the campaign.</p><p>While the GM might want to make concessions for
        players who didn’t have these alternate class features available to them
        when creating their characters, PCs should be one of the most constant
        elements of a campaign. Constantly changing and recreating characters
        can prove problematic to a campaign. While the GM should be willing to
        adapt and may allow players who grow bored with their characters to
        redefine them, alternate class abilities shouldn’t feel like exploitable
        options allowing PCs to build and rebuild their characters in whatever
        ways seem most advantageous at a given moment.</p><p>Allowing players to
        remake characters in light of newly adopted rules may be desirable on
        occasion, but GMs shouldn’t feel like they’re being unfair or breaking
        any rule by not allowing players to rebuild characters or by disallowing
        certain options. While the GM should always strive to help players run
        the characters they want, ultimately she knows what’s best for the
        campaign.</p>
