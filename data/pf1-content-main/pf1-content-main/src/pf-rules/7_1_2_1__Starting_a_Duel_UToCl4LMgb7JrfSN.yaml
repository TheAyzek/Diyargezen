        /><p>@Source[PZO1117;pages=99]</p><p>A spell duel is a form of combat,
        but unlike ordinary combat, the participants must all agree to willingly
        enter the duel and abide by its rules. If either side breaks the rules,
        it is considered the loser of the duel, regardless of any other outcome,
        and if its members continue aggressive action, the fight returns to the
        standard rules for combat.</p><p>The rules for a duel between
        spellcasters are usually very simple, but can be changed and altered by
        the participants, so long as both sides agree. Such discussions
        typically happen before the duel, allowing both sides to properly
        prepare, but as with all elements of a duel, this is not always the
        case. Most duels utilize the following simple rules.</p><p>Each
        participant must fight alone and can receive no help from outside
        sources, with the exception of familiars or other bonded
        creatures.</p><p>Each participant must fight with magic. The use of
        melee or ranged weapons is forbidden, with the exception of bonded
        objects and weapons that can cast spells, such as staves.</p><p>The use
        of summoned or otherwise conjured creatures is forbidden, unless the
        duel expects such creatures to combat one another at the behest of the
        participants (rather than directly attacking the dueling opponent). This
        sort of creature duel is common among druids, summoners, and
        conjurers.</p><p>The duel lasts until one of the casters has been
        knocked unconscious or otherwise prevented from continuing. Spells such
        as hold person do not end duels, but flesh to stone certainly does,
        assuming the target fails her saving throw. Some duels go to the death
        and are only ended when one duelist or team is a smoking pile of
        ash.</p>
