    value: >-
      <p>This +1 whip is made from a single, continuous strip of tanned humanoid
      skin and smells of musk and anise. Anyone struck by Lissala's caress is
      overwhelmed with remorse for having disappointed those they serve
      (Fortitude DC 15 negates). The sensation is so powerful that the target is
      sickened for 1d6 minutes. Additional failed saves increase the effect's
      duration but not its severity.</p><p><strong>Base Item</strong>: 
