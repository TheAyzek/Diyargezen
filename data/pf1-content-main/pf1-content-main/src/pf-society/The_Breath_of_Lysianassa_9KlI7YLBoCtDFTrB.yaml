name: The Breath of Lysianassa
system:
  artifact: true
  aura:
    custom: true
    school: conjuration and transmutation
  cl: 18
  description:
    value: >-
      <p>This decanter can pour limitless quantities of water, much like a
      decanter of endless water except that its geyser function deals 5d4 points
      of damage per round (10d4 to a creature with the fire subtype). A creature
      that touches The Breath of Lysianassa gains the benefits of water
      breathing for 8 hours. Its bearer also gains fire resistance 30.  While
      holding the decanter in one hand, the wielder can command the decanter to
      exude a refreshing mist in a 30-foot-radius cloud centered on the wielder
      that moves wherever the wielder does. Creatures in the area gain fire
      resistance 10, which increases to fire resistance 30 against the
      fire-dominant planar trait. Creatures with the aquatic or water subtype in
      the area gain fast healing 5. This mist does not obscure sight, and it
      lasts until dismissed by the wielder or until the decanter is no longer
      held.  For each Water Affinity boon the decanter's wielder has, he can use
      the artifact to cast quench (CL 18th) once per day.</p>
