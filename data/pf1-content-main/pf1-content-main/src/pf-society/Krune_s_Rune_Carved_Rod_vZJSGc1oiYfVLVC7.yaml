  cl: 18
  description:
    value: >-
      <p>Krune's rune-carved rod is an evenly cut two-foot shaft of weathered
      dark gray stone inscribed with hundreds of runes that constantly shift,
      morph, crawl about its surface while held. The rod functions as a greater
      metamagic rod with two exceptions. First, the rod is not limited to a
      single metamagic effect; it can apply the following metamagic feats:
      Empower Spell, Enlarge Spell, Extend Spell, Maximize Spell, Silent Spell,
      Still Spell, and Widen Spell. When the wielder casts a spell, he my apply
      up to three additional metamagic effects as it is cast. Second, the rod
      has 10 charges that are renewed every 24 hours. Adding a metamagic effect
      to a spell uses up a number of charges equal to the number of spell levels
      increased by the metamagic feat.</p>
