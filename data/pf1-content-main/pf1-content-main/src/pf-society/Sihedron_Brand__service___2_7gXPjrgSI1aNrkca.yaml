name: Sihedron Brand (service) +2
system:
  aura:
    custom: true
    school: conjuration [evil]
  cl: 6
  description:
    value: >-
      <p>This dark image of the Sihedron surrounded by arcane runes seems to
      move, like water trapped beneath two panes of glass. When gained, the
      brand melds with the largest existing tattoo on your body (or the one with
      the highest caster level if you have other magical tattoos), otherwise it
      moves every 1d4 days to a randomly determined location elsewhere on your
      body.  A character marked with the lesser version of this arcane tattoo
      receives a +2 profane bonus on attack and damage rolls against creatures
      brought to the Material Plane via a conjuration (summoning) effect, and
      gains a +2 profane bonus to AC against attacks from such creatures. Lesser
      versions of this mark exist, which grant +1 profane bonuses on attack and
      damage rolls and to AC against summoned creatures
      instead.</p><h3>Requirements</h3><p>Inscribe Magic Tattoo, summon monster
      I</p>
