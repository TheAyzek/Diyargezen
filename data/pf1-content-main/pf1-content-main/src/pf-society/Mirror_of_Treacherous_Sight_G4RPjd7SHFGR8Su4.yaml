  description:
    value: >-
      <p>This polished obsidian oval is set in a silver standing frame that's
      inlaid with lapis lazuli crescent moons and magical incantations in a
      delicate Kelish script.  The mirror functions as a crystal ball. In
      addition, a creature who looks into the mirror and sees its own reflection
      is targeted by a bestow curse effect (DC 16 Will negates), imposing a -4
      penalty on attack rolls, saving throws, skill checks, and ability checks.
      Wearing a mask, veil, or exceptional disguise (Disguise DC 25) allows a
      creature to use the mirror without triggering this
      effect.</p><h3>Requirements</h3><p>Craft Wondrous Item, bestow curse,
      scrying</p>
