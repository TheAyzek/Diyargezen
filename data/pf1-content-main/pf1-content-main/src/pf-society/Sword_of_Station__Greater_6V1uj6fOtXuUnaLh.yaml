  description:
    unidentified: <p>This is an ornate sword and belt combination.</p>
    value: >-
      <h3>Effect</h3><p>This ornate sword and belt impart uncanny confidence and
      insight while worn, granting a +2 competence bonus on Sense Motive checks.
      Three times per day, the wearer may draw the sword and deliver a
      single-word command, as per the spell. Lesser versions of swords of
      station exist that allow the wearer to cast command only once per day, and
      that lack the confidence-boosting enhancements. For greater swords of
      station, the competence bonus on Sense Motive checks increases to +5. A
      sword of station is blunted and poorly balanced, intended as a showpiece
      rather than a weapon. If used in combat, treat it as an improvised
      club.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.2p6fzj5t03oivndd]{command},
      @UUID[Compendium.pf1.spells.Item.eu4u4mr1naoiqohz]{remove fear}, creator
      must have 2 ranks in the Sense Motive skill </em><strong>Cost</strong>
      2,060 gp</p>
