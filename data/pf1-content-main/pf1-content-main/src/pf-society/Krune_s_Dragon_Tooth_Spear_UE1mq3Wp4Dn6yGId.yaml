  description:
    value: >-
      <p>Soon after the founding of Thassilon, the ancient emperor Xin crafted
      the Alara'quin, seven icons symbolizing the runelords' mastery of rune
      magic and dominance over their respective domains. Krune's +3 dancing
      longspear is one of these ancient weapons. Krune's dragon-tooth spear has
      insightful patience granted to it by its imperial creator. Meant to embody
      all that is right and virtuous about inaction, the weapon is primarily
      concerned with providing for the comforts of its rightful wielder. It
      eagerly lashes out at those who would attack the faithful of Lissala,
      seeing her divine art of writing as the ideal form of communication due to
      its slower, more thoughtful expression. The longspear loyally communicates
      with Krune, but only when its services are needed. It persistently
      harangues other wielders, pointing out their foibles and critiquing their
      rash action as carelessly spontaneous.</p>
