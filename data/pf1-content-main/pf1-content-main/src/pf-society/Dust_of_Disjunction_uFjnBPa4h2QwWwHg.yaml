name: Dust of Disjunction
system:
  aura:
    custom: true
    school: abjuration and evocation
  cl: 10
  description:
    value: >-
      <p>This fine powder looks like crushed diamonds. A single handful of this
      substance can be thrown in a 15-foot cone, at which point it attempts to
      absorb and neutralize any magic it comes in contact with. The magical
      properties of each unattended magic item in the area are suppressed for
      1d4 rounds as if targeted by dispel magic spell (caster level 10th). Each
      creature in the area is affected as if by a targeted dispel magic, though
      the user cannot specify a spell effect to dispel; if a target has no
      spells affecting it, the dust instead attempts to suppress the abilities
      of one magic item carried by the target, selected at random following the
      rules for items surviving a saving throw (Pathfinder RPG Core Rulebook
      217). The dust does not affect other ongoing magical effects.  Dust of
      disjunction h as a curious effect o n golems, which also demonstrate
      anti-magical properties. A golem exposed to this dust must succeed at a DC
      17 Fortitude save or be staggered for 1 minute. At the end of its turn, a
      staggered golem may attempt a new saving throw to end the staggered
      effect.</p><h3>Requirements</h3><p>Craft Wondrous Item, dispel magic,
      shatter</p>
