name: Sihedron Brand (endurance)
system:
  aura:
    custom: true
    school: abjuration and transmutation [evil]
  cl: 3
  description:
    value: >-
      <p>This dark image of the Sihedron rune appears to writhe beneath the
      surface of the skin on which it is inscribed, as though a worm were
      crawling under the skin.  A character marked with this arcane tattoo
      receives a +2 profane bonus on Fortitude saves. Once per day, the
      character may activate the tattoo to receive a number of temporary hit
      points equal to twice her character level. If the PCs displays the arcane
      tattoo, she gains a +4 circumstance bonus on Bluff and Diplomacy checks
      against worshippers of Lissala.</p><h3>Requirements</h3><p>Inscribe Magic
      Tattoo, bear's endurance, resistance, creator must be a cleric of
      Lissala</p>
