name: Chalice of Undeath
system:
  artifact: true
  aura:
    school: nec
  cl: 20
  description:
    value: >-
      <p>This chalice is carved out of a large animal bone and is engraved with
      symbols of life and death. If the chalice is filled with liquid, you can
      drink from the it and gain the effects of an undead anatomy I spell
      (Ultimate Magic), which lasts for 20 minutes. If you first perform a
      magical ritual (which takes 1 hour and requires 1,000 gp in reagents), the
      effect is permanent until dispelled or reversed. A creature can reverse
      the transformation by drinking from the chalice again.</p>
