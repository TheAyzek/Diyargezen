  description:
    value: >-
      <p>Acrimony veils are rare ancient magic devices created by Alaznist, the
      Runelord of Wrath. They are normally composed of several types of
      interconnected metal and human bones, each etched with complex designs.
      The device covers the wearer's entire face (forehead, cheeks, and jaw),
      but provides no benefit to AC. This mask functions as a lesser empower
      metamagic rod, but only affecting spells of the evocation school.
      Additionally, the wearer of an acrimony veil may cast rage on himself once
      per day.</p><h3>Requirements</h3><p>Craft Wondrous Item, Empower Spell,
      rage</p>
