name: Pugwampi Braid, Lesser
system:
  aura:
    school: nec
  cl: 3
  description:
    value: >-
      <p>Bad luck lingers in this greasy braid of dried pugwampi hide. As an
      immediate action, the braid's bearer can unravel the braid (which destroys
      it), to force a target within 5 feet to roll twice and take the lower
      result the next time it makes a d20 roll. This is a mind-affecting effect
      that does not work on humanoids with the gnoll subtype, animals, or
      gremlins. A creature under the effect of a luck bonus is immune to this
      effect.</p><h3>Requirements</h3><p>Craft Wondrous Item, ill omen or
      pugwampi's grace (Pathfinder Campaign Setting: Inner Sea Magic 59)</p>
