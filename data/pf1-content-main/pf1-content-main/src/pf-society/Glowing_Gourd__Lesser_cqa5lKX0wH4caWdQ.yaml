    value: >-
      <p>This gourd has been hollowed out and carved with the symbol of a
      good-aligned deity. It sheds light as a candle. If the gourd is smashed
      onto the ground, the 20-foot-radius area around the crushed gourd is
      affected as if by a consecrate spell for 10 hours, and all non-evil
      creatures in the area gain the benefits of remove fear for 5 rounds. This
      magic item is often crafted from a pumpkin, though other types of gourds,
      or even large turnips, can be used.</p><h3>Requirements</h3><p>Craft
      Wondrous Item, consecrate, remove fear, creator must be good-aligned</p>
