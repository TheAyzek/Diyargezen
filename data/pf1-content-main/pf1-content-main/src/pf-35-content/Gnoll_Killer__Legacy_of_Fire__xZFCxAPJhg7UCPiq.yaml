name: Gnoll Killer (Legacy of Fire)
system:
  contextNotes:
    - target: spellEffect
      text: +[[1]] Trait bonus to save DCs for damaging spells against gnolls.
    - target: attack
      text: >-
        +[[1]] Trait bonus on attack rolls and weapon damage rolls made against
        gnolls., If you are a ranger and you select humanoid (gnoll) as a
        favored enemy this bonus increases to +[[2]]
    - target: attack
      text: >-
        If you are a barbarian and you’re fighting gnolls, your rage lasts 1
