  description:
    value: >-
      <p><em>You grew up in rural Katapesh, in a region where gnoll activity was
      a fact of life. You killed your first gnoll at a young age when a group of
      gnoll slavers attacked your village, home, or caravan, and your hatred of
      gnolls has only grown since then. Something in your past fueled your
      hatred of gnolls even further - perhaps your family was slaughtered by
      gnolls, or maybe you even served a few harrowing weeks as a prisoner of a
      gnoll tribe before a miraculous escape. When you heard that Garavel was
      looking for brave men and women to aid in retaking the village of
      Kelmarane from a tribe of gnolls in the service of the notorious Carrion
      King, you knew you had to be part of the group, and signed up
      immediately.</em></p><p><strong>Benefits</strong>: You gain a +1 trait
      bonus on attack rolls and weapon damage rolls made against
      gnolls.</p><p>If you are a barbarian and you’re fighting gnolls, your rage
      lasts 1 round longer than normal.</p><p>If you’re a ranger and you select
      humanoid (gnoll) as a favored enemy, your trait bonus on attack rolls and
      weapon damage rolls against gnolls increases to +2.</p><p>If you’re a
      spellcaster, you gain a +1 trait bonus to spell save DCs for damaging
      spells against gnolls.</p>
