name: Galley Slave
system:
  description:
    value: >-
      <p><em>Your experience as a galley slave has given you some unique insight
      into the world of sailing and
      piracy.</em></p><p><strong>Prerequisites</strong>: Profession (sailor) 2
      ranks, current or former galley slave.</p><p><strong>Benefits</strong>:
      You get a +2 circumstance bonus on Profession (sailor) and Use Rope checks
      made while aboard a ship with oars and rowers. When fighting on a ship,
      your first hit each battle gets a +2 damage bonus.</p>
