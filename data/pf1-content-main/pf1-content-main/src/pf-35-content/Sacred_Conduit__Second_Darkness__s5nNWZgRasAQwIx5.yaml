name: Sacred Conduit (Second Darkness)
system:
  description:
    value: >-
      <p><em>Your birth was particularly painful and difficult for your mother,
      who needed potent divine magic to ensure you survived; your mother may or
      may not have survived. In any event, the magic infused you from an early
      age, and you now channel divine energy with greater ease than
      most.</em></p><p><strong>Benefits</strong>: Whenever you channel divine
      energy to turn or rebuke undead, you gain a +2 trait bonus on the
      Turn/Rebuke Undead check.</p><hr /><p><strong>Special Note</strong>: This
      is the 3.5 Ruleset version of this trait. To view the updated version for
      the Pathfinder rules click the link
      below:</p><p>@UUID[Compendium.pf-content.pf-traits.Item.gQ9RoYriwgWKTIjz]{Sacred
      Conduit}</p>
