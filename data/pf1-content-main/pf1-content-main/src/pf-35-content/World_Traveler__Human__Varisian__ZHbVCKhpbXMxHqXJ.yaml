    value: >-
      <p><em>Your family has taken the love of travel to an extreme, roaming the
      world extensively. You've seen dozens of cultures and have learned to
      appreciate the diversity of what the world has to
      offer.</em></p><p><strong>Requirements</strong>: Varisina Human
      Ethnicity</p><p><strong>Benefits</strong>: Select one of the following
      skills: Diplomacy, Knowledge (local), or Sense Motive. You gain a +1 trait
      bonus to that skill, and it is always a class skill for you.</p>
