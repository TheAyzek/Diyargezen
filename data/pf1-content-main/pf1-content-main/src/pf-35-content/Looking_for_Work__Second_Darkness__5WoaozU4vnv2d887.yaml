      formula: '1'
      type: trait
  description:
    instructions: >-
      <p>Select Bluff, Craft (any), Diplomacy, Intimidate, Perform (any),
      Profession (gambler), or Spot when you take this trait.</p><p>If you
      select any Craft, Perform or Profession Skill, update the Skills tab of
      your Actor to add the chosen skill.</p><p>Update the Class skills section
      of the Details tab of this trait to reflect your choice.</p><p>Update the
      target of the change on the Changes tab of this trait to reflect your
      choice.</p><p><strong>Special Note</strong>:: Spot and Listen from the 3.5
      Ruleset were combined into Perception in the Pathfinder ruleset.</p>
    value: >-
      <p><em>Although out of work, you aren’t particularly keen on the prospect
      of gambling away your last remaining coins simply for a chance at riches.
      That said, if the Gold Goblin’s fortunes reverse after this big gambling
      tournament, you’re relatively certain its owner, Saul Vancaskerkin, will
      be needing to hire on some new staff members. You’ve secured payment for
      the tournament, and intend on attending mostly to check the place out, to
      decide if it’s a place you’d want to work at (as a bouncer, bartender,
      croupier, server, entertainer, spotter, or cook), and hopefully get a
      chance to catch Saul’s eye and make an impression. You’ve long worked at
      honing your skills, and are quite accomplished and certain that you have
      something to offer.</em></p><p><strong>Benefits</strong>: Pick one of the
      following skills: Bluff, Craft (any), Diplomacy, Intimidate, Perform
      (any), Profession (gambler), or Spot. You gain a +1 trait bonus in that
      skill, and that skill is always considered a class skill for you.</p>
