      <p><em>Your parents were scholars of history, whether genealogists of your
      own family tree, sages on the subject of ancient empires, or simply
      hobbyists with a deep and abiding love for the
      past.</em></p><p><strong>Requirements</strong>: Garundi Human
      Heritage</p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Knowledge (history) checks and bardic knowledge checks, and Knowledge
      (history) is always a class skill for you.</p><p><strong>Special
      Note</strong>: Bardic Knowledge bonus has not been included as this
      ability works differently in the 3.5 and Pathfinder rulesets.</p>
