  description:
    instructions: >-
      <p>Select Knowledge (geography) or Knowledge (dungeoneering) when you take
      this trait.</p><p>Update the Class skills section of the Details tab of
      this trait to reflect your choice.</p><hr /><p><strong>Special
      Note</strong>: This is the 3.5 Ruleset version of this trait. To view the
      updated version for the Pathfinder rules click the link
      below:</p><p>@UUID[Compendium.pf-content.pf-traits.Item.kNEL5ID2NpI4dsHa]{Scholar
      of Ruins (Human)}</p>
    value: >-
      <p><em>From the moment you could walk and talk, the ruins of Taldor
      fascinated you. You joined every expedition you could find, volunteered as
      a porter for the Pathfinder Society, and sometimes just set out on your
      own to explore as many of the Taldan ruins as you could. Because of this,
      you have special insight into the geography of Taldor as well as expertise
      at exploring lost places.</em></p><p><strong>Requirements</strong>: Taldan
      Human ethnicity</p><p><strong>Benefits</strong>: You gain a +1 trait bonus
      to Knowledge (geography) and Knowledge (dungeoneering) checks. One of
      these skills (your choice) is always a class skill for you.</p>
