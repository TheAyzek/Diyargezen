name: Lost in the Crowd
system:
  description:
    value: >-
      <em>You are used to dealing with the teeming masses in the markets, and
      are capable of disappearing into them at a moment's
      notice.</em></p><p><strong>Benefits</strong><br/>You gain a +2
      circumstance bonus to Hide checks in urban areas; this bonus increases to
      +4 in crowds. You gain a +1 dodge bonus to AC when threatened by 2 or more
      enemies.
