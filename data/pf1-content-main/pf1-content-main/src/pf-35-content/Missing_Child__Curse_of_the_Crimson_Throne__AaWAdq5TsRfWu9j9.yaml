name: Missing Child (Curse of the Crimson Throne)
system:
  changes:
    - _id: R4Gmoqab
      formula: '1'
      type: trait
  description:
    instructions: >-
      <ol><li><p>Select <strong>Missing Sibling </strong>or <strong>Missing Son
      or Daughter </strong>when you take this trait.</p></li><li><p>If you
      select <strong>Missing Sibling</strong>:&nbsp;Update the Class skills
      section of the Details tab of this trait to reflect Gather Information*
      and Sense Motive. then Delete the untargeted Change on the changes
      tab</p></li><li><p>If you select <strong>Missing Son or Daughter</strong>:
      Update the target of the untargeted change on the changes tab of this
      trait to reflect Saving Throws&gt;Will</p></li></ol><hr
      /><p><strong>Special Notes</strong>: *Gather Information from the 3.5
      Ruleset were combined into Diplomacy in the Pathfinder ruleset.</p><p>This
      is the 3.5 Ruleset version of this trait. To view the updated version for
      the Pathfinder rules click the link
      below:</p><p>@UUID[Compendium.pf-content.pf-traits.Item.17mo4Jjxp01HsKnN]{Missing
      Child (Curse of the Crimson Throne)}</p>
    value: >-
      <p><em>You suspect that a child you know has been abducted by Gaedren.
      Whatever the relationship, you’ve heard rumors about Gaedren's “Little
      Lamms,” and of how the old man uses children as pickpockets and agents for
      his crimes. You’ve even heard rumors that the child you’re looking for has
      been spotted in the marketplaces in the company of known cutpurses and
      pickpockets. Although the Korvosan Guard has been understanding of your
      plight, yet it has its hands full with “more important” matters these
      days, it seems, and has not yet been able to learn anything more about
      Gaedren. No one else is interested in bringing Gaedren down and rescuing
      his victims— that task falls to you. Yet where could the old scoundrel be
      hiding?</em></p><p><strong>Benefits</strong>: Choose one of the following
      benefits:</p><p><strong>Missing Sibling</strong>: The missing child is a
      brother or sister. Although everyone else has given up hope, you believe
      your sibling still lives out there. Your constant search for the missing
      sibling has developed into great skill at rumor mongering and finding
      information from others. Gather Information and Sense Motive are always
      class skills for you.</p><p><strong>Missing Son or Daughter</strong>: The
      missing child is your own son or daughter, a niece or nephew, or the son
      or daughter of your superior or employer and one you had been charged with
      protecting. The child was abducted during a trip to the market or some
      other daily event. Long hours spent searching for rumors and your stubborn
      will to continue grant you a +1 bonus on Will saves.</p>
