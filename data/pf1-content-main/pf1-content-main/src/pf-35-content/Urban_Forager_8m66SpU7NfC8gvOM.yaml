name: Urban Forager
system:
  description:
    value: >-
      <p><em>You are skilled at keeping yourself and others safe in the alleys,
      sewers, and underbellies of
      cities.</em></p><p><strong>Prerequisites</strong>: Knowledge (local) 4
      ranks, Survival 4 ranks, Track.</p><p><strong>Benefits</strong>: You may
      use the Survival skill to forage and track in urban locations using the
      table below.</p><table class="inner" style="width:
      96.0373%;"><tbody><tr><td style="width:
      16.0145%;"><strong>DC</strong></td><td style="width:
      82.7719%;"><strong>Task</strong></td></tr><tr><td style="width:
      16.0145%;">10</td><td style="width: 82.7719%;">Get along in an urban
      setting, and easily find enough food and supplies to survive for 24 hours.
      You can provide food and water for one other person for every 2 points by
      which your check result exceeds 10.</td></tr><tr><td style="width:
      16.0145%;">15</td><td style="width: 82.7719%;">Gain a +2 bonus on all
      Constitution checks made to resist starvation or thirst. You may grant the
      same bonus to one other character for every 1 point by which your Survival
      check exceeds 15.</td></tr><tr><td style="width: 16.0145%;">15</td><td
      style="width: 82.7719%;">Gain a +2 bonus on all Survival checks made to
      track on firm or hard ground.</td></tr></tbody></table>
  tags:
    - General
    - '3.5'
type: feat
