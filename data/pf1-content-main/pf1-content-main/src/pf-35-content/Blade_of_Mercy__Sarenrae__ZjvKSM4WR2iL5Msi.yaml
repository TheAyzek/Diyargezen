name: Blade of Mercy (Sarenrae)
system:
  contextNotes:
    - target: attack
      text: >-
        +[[1]] Trait bonus to any nonlethal damage you inflict with a slashing
        weapon.  You do not take the normal -[[4]] penalty on your attack roll
        when striking to inflict nonlethal damage with any slashing weapon.
  description:
    value: >-
      <p><em>You know that within the heart of even the most hateful and cruel
      living creature exists a sliver of shame and hope for redemption. You have
      trained long on martial techniques to use bladed weapons not to kill, but
      to subdue.</em></p><p><strong>Requirements</strong>:
      Sarenrae</p><p><strong>Benefits</strong>: When striking to inflict
      nonlethal damage with any slashing weapon, you do not take the normal -4
      penalty on your attack roll, and gain a +1 trait bonus to any nonlethal
      damage you inflict with a slashing weapon.</p>
