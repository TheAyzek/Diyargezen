name: Scouting for Fiends (Second Darkness)
system:
  contextNotes:
    - target: attack
      text: >-
        +[[1]] Trait bonus on all attack rolls made against foes you know to be
        evil outsiders.
  description:
    value: >-
      <p><em>You belong to an organization (most likely a religion) that has
      definite views on the menace posed by the lower planes. The willfulness
      with which the city of Korvosa (they even allow a temple of Asmodeus to
      operate in broad daylight!) tolerates infernal influences is, to you and
      your organization, the greatest symbol of what’s wrong with civilization
      today. And now, in Riddleport, there’s news that a gambling tournament is
      using devils and Hell as an idle decoration. It’s likely that this is just
      an example of poor taste, but there’s a chance that something sinister may
      be lurking beneath the goings-on at the Gold Goblin.</em></p><p><em>You
      have been contacted by your organization (or may have decided on your own)
      to travel to Riddleport (if you don’t already live there) and attend this
      tournament under the guise of a patron. Keep an eye on things there, even
      after the tournament is over; if you can, get a job working for the owner.
      Demons and devils can be subtle, and it could take weeks or even months to
      find proof of their involvement.</em></p><p><strong>Benefits</strong>:
      Your near-obsessive hatred of all things fiendish grants you a +1 trait
      bonus on all attack rolls made against foes you know to be evil
      outsiders.</p>
