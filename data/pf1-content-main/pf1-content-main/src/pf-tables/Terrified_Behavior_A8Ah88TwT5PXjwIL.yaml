description: >-
  <p><strong>Stage of Fear: Terrified</strong></p><p>This functions as panicked,
  but you do not treat any other character as an ally and thus must attempt
  saving throws against spells that allow them, even if the spells are
  beneficial. If unable to flee, you cower in fear. In addition, once you have
  fled from fear, you do not act as normal. Instead, each round you roll on the
  following table to determine your course of action.</p>
