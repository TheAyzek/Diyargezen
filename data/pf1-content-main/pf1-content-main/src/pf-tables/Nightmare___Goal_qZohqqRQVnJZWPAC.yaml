  coreVersion: '12.331'
description: >-
  <p>Each nightmare dreamscape has a particular action that can be completed to
  allow the dreamer to escape the nightmare. This goal may or may not be
  immediately obvious. If the dreamer is unable to complete the goal in a
  reasonable period of time (as determined by the GM), the nightmare is
  considered to have bested the dreamer. The dreamer suffers no ill effects when
  defeated by a naturally occurring nightmare; however, there might be penalties
  if the dreamer fails to achieve a supernatural nightmare’s goal. The GM can
  choose a goal or determine one randomly using the table below.</p>
