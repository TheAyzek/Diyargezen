    img: icons/svg/d20-black.svg
    range:
      - 81
      - 100
    text: >-
      <strong>Take a Test</strong>: The nightmare ends once the dreamer
      completes a test. The nature of the test varies: a cleric might have to
      endure a test of faith, while a fighter might have to perform difficult
      combat drills. The GM chooses three to five skill checks or ability checks
      to represent different aspects of the test, of which the character must
      succeed at a minimum of half, or devises a series of more complicated
      encounters, if she desires.
    type: text
