_stats:
  coreVersion: '12.331'
description: >-
  <p>@Source[PZO9211;pages=52]</p><p>Method 2, The Random Roll: Each combination
  of an ioun stone and a wayfinder requires a roll on a table to see what
  resonant power it gains. This method allows for a lot of variety but requires
  bookkeeping to track each unique stone’s augmented power, and also makes it
  difficult for the PCs to predict what any particular combination may be. See
  the table on page 53.</p><p>@Source[PZO9211;pages=53]</p><p>Resonant Powers
  (Method 2)</p><p>The resonant powers of the most common forms of ioun stones
  are listed below. If the power is a feat, the bearer gains that feat as a
  bonus feat even if he does not meet its prerequisites.</p>
