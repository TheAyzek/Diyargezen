name: Skull of Ydersius
system:
  artifact: true
  aura:
    custom: true
    school: all
  cl: 30
  description:
    value: >-
      <p>More than just a powerful artifact, the Skull of Ydersius is the actual
      skull of a deity, the vessel through which the much-diminished god of
      serpents perceives and influences existence. Ydersius's clerics still
      receive spells from their prayers, granted by the skull regardless of its
      location or ownership. There is no way a mortal can block this effect.
      Possession of the skull grants several abilities.  Blessing of Scales: All
      reptilian creatures (including worshipers of Ydersius, sorcerers with the
      serpentine or draconic bloodline, and druids wild-shaped into reptilian
      forms) within 160 feet of the Skull of Ydersius gain spell resistance 25
      and fast healing 10.  Unholy Aura: The skull treats the 80-foot-radius
      area around it as though an unhallow spell had been cast with the Skull of
      Ydersius as the point of origin. This effect carries with it two linked
      spells that affect only worshipers of Ydersius (death ward and freedom of
      movement), and two linked spells that affect all non-worshipers of
      Ydersius (bane and dimensional anchor).  Voice of the Serpent: Once per
      day, a creature that touches the skull may cast commune to speak with
      Ydersius. A non-worshiper of Ydersius who uses this power must make a
      successful DC 25 Will save each time the power is used to avoid succumbing
      to a feeblemind spell.  Any good-aligned creature that carries the Skull
      of Ydersius, even via an extradimensional space such as a portable hole,
      gains three negative levels. These negative levels remain as long as the
      skull is carried and disappear when the skull is released. These negative
      levels never result in actual level loss, but they cannot be overcome in
      any way (including restoration spells) while the skull is carried. A
      creature that suffers from these negative levels has a 50% spell failure
      chance on all divine spellcasting attempts.</p>
