  description:
    value: >-
      <p>Belimarius's weapon of choice is known as her Invidious Halberd-see the
      inside front cover for this potent weapon's history and personality. This
      weapon is an intelligent +2 dispelling burst keen spell-storing mithral
      halberd. When Belimarius's Invidious Halberd strikes a creature capable of
      casting arcane spells, the creature struck must succeed at a DC 17 Will
      save or the halberd drains one spell of 3rd level or less, storing that
      spell in its spell-storing ability (or if the drained spell is dispel
      magic, in its dispelling burst ability). The halberd picks which spell is
      stored, but otherwise this ability functions as if the creature struck had
      used the weapon's spell-storing ability to store a spell of the halberd's
      choice, losing that preparation of the spell (or a spell slot associated
      with it) in the process. It cannot use this ability if it already has a
      spell stored. On a critical hit against an arcane spellcaster,
      Belimarius's Invidious Halberd also casts feeblemind (DC 17) on the
      creature struck after it drains a spell.<p><strong>Base Item</strong>:
      dispelling burst keen spell-storing mithral halberd</p>
