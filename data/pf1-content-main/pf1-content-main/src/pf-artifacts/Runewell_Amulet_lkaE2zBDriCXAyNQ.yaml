name: Runewell Amulet
system:
  artifact: true
  aura:
    school: trs
  cl: 20
  description:
    value: >-
      <p>This amulet of gold and red crystal grants the wearer a +5 enhancement
      bonus to her natural armor. In addition, the wearer becomes attuned to
      both the runewell of greed and the soul lens that controls it-allowing t
      he wearer to benefit from the fragmentary souls gathered and absorbed by
      the runewell. As long as the runewell functions, the wearer does not age
      and has no need for food or water. In addition, she can fly at a speed of
      60 feet with perfect maneuverability and gains fast healing 10. If the
      runewell amulet is removed, the wearer loses all of these abilities. While
      this does mean the wearer begins aging normally and must eat and drink,
      she does not suffer any ill effect from the years that passed or the meals
      she missed while she wore the amulet.</p>
