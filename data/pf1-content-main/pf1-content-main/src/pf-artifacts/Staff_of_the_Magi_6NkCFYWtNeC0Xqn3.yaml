name: Staff of the Magi
system:
  artifact: true
  aura:
    custom: true
    school: all schools
  cl: 20
  description:
    value: >-
      <p>A long wooden staff, shod in iron and inscribed with sigils and runes
      of all types, this potent artifact contains many spell powers and other
      functions. Unlike a normal staff, a staff of the magi holds 50 charges and
      cannot be recharged normally. Some of its powers use charges, while others
      don't. A staff of the magi does not lose its powers if it runs out of
      charges.  The following powers do not use charges: • Detect magic •
      Enlarge person (Fortitude DC 15 negates)  • Hold portal • Light • Mage
      armor • Mage hand The following powers drain 1 charge per usage: • Dispel
      magic • Fireball (10d6 damage, Reflex DC 17 half)  • Ice storm •
      Invisibility • Knock • Lightning bolt (10d6 damage, Reflex DC 17 half)  •
      Passwall • Pyrotechnics (Will or Fortitude DC 16 negates)  • Wall of fire
      • Web These powers drain 2 charges per usage: • Monster summoning IX •
      Plane shift (Will DC 21 negates)  • Telekinesis (400 lbs. maximum weight;
      Will DC 19 negates)  A staff of the magi gives the wielder spell
      resistance 23. If this is willingly lowered, however, the staff can also
      be used to absorb arcane spell energy directed at its wielder, as a rod of
      absorption does. Unlike the rod, this staff converts spell levels into
      charges rather than retaining them as spell energy usable by a
      spellcaster. If the staff absorbs enough spell levels to exceed its limit
      of 50 charges, it explodes as if a retributive strike had been performed
      (see below). The wielder has no idea how many spell levels are cast at
      her, for the staff does not communicate this knowledge as a rod of
      absorption does. (Thus, absorbing spells can be risky..</p>
