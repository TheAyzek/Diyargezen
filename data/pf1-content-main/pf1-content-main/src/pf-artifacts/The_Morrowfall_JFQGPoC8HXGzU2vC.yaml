  description:
    value: >-
      <p>The Morrowfall is one-half of the Aohl, an artifact gifted to the
      ancient Jaytirian Society following a sacred truce between their two
      feuding gods of millennia past. is the remaining manifestation of the
      power of Easivra, a potent sun god now all but forgotten (it's a DC 30
      Knowledge [religion] check to learn Easivra's name, but any good-aligned
      creature that touches the Morrowfall immediately knows the name and how to
      use the artifact's powers). constantly emits daylight, as per the spell.
      In addition, by presenting it strongly and uttering Easivra's name (a
      standard action), the Morrowfall can be used to cast the following spells.
      At Will-detect undead, disrupt undead, daze monster (DC 13)
      3/day-blindness (DC 13), daylight, searing light 1/day-sunbeam (DC 20),
      sunburst (DC 22.</p>
