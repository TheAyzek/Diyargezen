name: Asheia, Sword of Lust
system:
  artifact: true
  aura:
    school: enc
  baseTypes:
    - Longsword
  cl: 16
  description:
    value: >-
      <p>This beautiful blade is a +5 flaming longsword. While bearing the
      weapon, the wielder is immune to all enchantment effects. Any creature
      that casts an enchantment spell upon Asheia's wielder is led to believe
      its spell or effect worked as normal and that the sword's bearer is under
      its control, allowing the wielder to deceive his opponent if he so chooses
      (and doesn't give his enemy a reason to believe its magic failed).
      Whenever Asheia strikes an opponent, the target must succeed at a DC 20
      Will save or fall under the effects of a charm monster spell. Only one
      creature can be charmed in this way at a time. If another creature becomes
      charmed by the sword, the first is freed from this effect. If the sword
      instead scores a critical hit, the target must succeed at a DC 25 Will
      save or be affected by a dominate monster spell.</p><p><strong>Base
      Item</strong>: +5 flaming longsword</p>
