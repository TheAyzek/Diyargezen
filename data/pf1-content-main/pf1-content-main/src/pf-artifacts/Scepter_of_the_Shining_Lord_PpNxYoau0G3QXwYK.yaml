name: Scepter of the Shining Lord
system:
  artifact: true
  aura:
    custom: true
    school: abjuration and enchantment
  baseTypes:
    - Light Mace
  cl: 20
  description:
    value: >-
      <p>Fashioned from a single piece of black jade, this 3-foot-long scepter
      has a T-shaped handle carved to resemble the head of a horned crocodile.
      The scepter's other end curls and forms an eyehook, to which is tied a
      leather strap. Strung along this strap are four small, copper bells. Each
      bell signifies a single concept related to rulership: authority,
      banishment, dominion, and imprisonment.  An individual seeking to wield
      the scepter must first bond with the artifact by permanently offering it
      one use of her mythic power. Thereafter, the owner must always keep one
      use of power unspent to maintain the bond. If the owner expends all her
      mythic power, the bond breaks and the individual can no longer access any
      of the scepter's power until she reestablishes her bond of ownership. 
      Once bonded, the scepter can be wielded as a +6 brilliant energy light
      mace that grants a +4 enhancement bonus to its bonded owner's Charisma
      score. In addition, the owner can expend one use of mythic power and ring
      the scepter's bells to produce the following effects: • The wielder can
      ring the bell of authority to cast command targeting any non-mythic
      creature.  • The wielder can ring the bell of banishment to cast dismissal
      upon any non-mythic outsider with a CR at least 3 less than the wielder's
      total class level plus her tier.  • The wielder can ring the bell of
      dominion to cast sanctuary on any non-mythic creature.  • The wielder can
      ring the bell of imprisonment to cast forcecage on any non-mythic creature
      with a CR at least 3 less than the wielder's total class level plus her
      tier.  The caster level for all four effects is equal to the owner's total
      character level plus her tier. When she rings a bell, she can also expend
      an additional use of mythic power to increase the DC of the spell-like
      ability's saving throw by 10.  Lastly, the owner can use the scepter to
      appoint a mythic agent to be a protector and advocate of the owner's
      people. When she does so, she bestows 1d4 uses of mythic power upon that
      creature that last for 1 month if the creature is mythic, or until they
      are spent if the creature is non-mythic. If the agent is mythic, these
      points increase the agent's maximum number of mythic uses for the month.
      If the champion is non-mythic, as long as that agent retains at least one
      use of mythic power, it gains the hard to kill and surge base mythic
      abilities (see page 12).</p><p><strong>Base Item</strong>: brilliant
      energy light mace</p>
