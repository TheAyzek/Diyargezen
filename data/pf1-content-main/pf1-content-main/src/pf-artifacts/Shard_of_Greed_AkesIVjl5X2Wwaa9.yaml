  description:
    value: >-
      <p>The is made of black adamantine. As long as the is carried, its owner
      can use haste as a spell-like ability once per day, gains a +2 insight
      bonus on saves versus transmutation spells, and gains a +1 insight bonus
      on attack rolls. Curse: The owner becomes greedy, and is sickened whenever
      she is not wearing at least 500 gp per Hit Die in nonmagical jewelry and
      fine clothing. Each time the owner sells a belonging or gives one away,
      she must succeed at a DC 20 Will save or take 1d4 points of Wisdom
      damage.</p>
