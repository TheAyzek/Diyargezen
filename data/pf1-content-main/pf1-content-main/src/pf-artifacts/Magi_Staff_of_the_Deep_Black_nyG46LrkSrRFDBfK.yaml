  description:
    value: >-
      <p>This crystalline blue-white staff fell from the sky during a dazzling
      display of falling stars. Sages believe it was once part of an enormous
      piece of ice drifting between worlds since the dawn of time, only coming
      to the world on a quirk of chance. Though as hard as crystal, the staff
      feels like wet ice, is cold to the touch, and gives the impression of
      great age. It slowly sinks in fresh or salt water (unlike true ice, which
      floats), and while it creates a cocoon of ice around itself when
      submerged, it is only after several hours that this coating is thick
      enough to cause the staff to bob to the surface. The staff's powers (and
      the equivalent staff of the magi powers they replace) are: • ray of frost
      (detect magic, 0 charges) • reduce person (enlarge person, 0 charges) •
      cone of cold ( fireball, 1 charge) • freezing ray (knock, functions as
      scorching ray but deals cold damage, 1 charge) • water breathing
      (lightning bolt, 1 charge) • fly (passwall, 1 charge) • wall of ice (wall
      of fire, 1 charge) • teleport (passwall, 2 charges) • time stop (monster
      summoning IX, 2 charges) The staff otherwise has the normal powers and
      abilities of a staff of the magi. If it is broken in a retributive strike,
      the bearer has a 25% chance to be held in stasis somewhere (as
      imprisonment, no saving throw), a 25% chance to be transported to a random
      plane, and a 50% chance to be utterly destroyed.</p><p><strong>Base
      Item</strong>: quarterstaff</p>
