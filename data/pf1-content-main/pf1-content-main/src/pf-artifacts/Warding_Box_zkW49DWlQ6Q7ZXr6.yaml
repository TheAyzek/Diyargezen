name: Warding Box
system:
  artifact: true
  aura:
    school: abj
  cl: 20
  description:
    value: >-
      <p>A warding box is a powerful magical container built to obscure and
      confound any attempt to locate objects kept inside. The box can hold one
      object no larger than 8 inches by 8 inches by 3 inches (or up to 25
      pounds) in each of its three compartments at any one time. The box's lid
      and additional compartments are sealed, but the box can be opened or
      closed as a full-round action. While the lid is closed, the warding box
      and all objects inside it are protected from all divination spells. In
      this state, no divination spell save for those employed by the gods can
      detect the warding box or its contents.</p>
