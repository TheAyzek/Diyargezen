  description:
    value: >-
      <p>The Shield of Xin-Undoros is a +5 heavy steel shield that makes its
      bearer unnaturally strong and resilient like a rune giant, granting a +6
      enhancement bonus to Constitution and Strength as long as the shield is
      readied. As a standard action, the bearer can increase his size by up to
      two size categories, to a maximum of Gargantuan. For each size category
      increased, the bearer gains a +2 size bonus to Constitution and Strength
      and takes a -2 penalty to Dexterity. The bearer can shrink back to his
      normal size with another standard action; the effect also ends if he loses
      the shield.  When readied, the Shield of Xin-Undoros also grants the
      bearer spell resistance 31. The bearer can ready an action to attempt to
      reflect a spell; if a spellcaster fails her caster level check to overcome
      the spell resistance granted by the shield, the shield's bearer can
      reflect the spell back at its caster as per spell turning.<p><strong>Base
      Item</strong>: heavy steel shield</p>
