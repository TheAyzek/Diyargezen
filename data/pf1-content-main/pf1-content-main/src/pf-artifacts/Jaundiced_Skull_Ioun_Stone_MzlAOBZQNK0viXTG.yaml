    unidentified: <p>This yellow stone resembles a humanoid skull.</p>
    value: >-
      <h3>Background Details</h3><p>Auberon’s phylactery is a unique ioun stone
      he created on his path to lichdom. While the stone is powerful in its own
      right, Auberon treasures it more than anything, as it is the vessel for
      his soul. Ochymua stole the jaundiced skull ioun stone from Auberon while
      in the Omen Dominion (see Pathfinder Adventure Path #125: Tower of the
      Drowned Dead), and has kept it on his person as an indicator should the
      lich be slain, though he refrains from using it. The veiled master intends
      to imprison the lich as soon as his body begins rejuvenating, unaware of
      the stone’s complete powers.</p><h3>Effect</h3><p>In addition to serving
      as a vessel for Auberon's soul, the jaundiced skull ioun stone is a potent
      artifact with two protections against detection. First, when active, the
      ioun stone is invisible as it orbits the bearer's head. Secondly, the
      jaundiced skull ioun stone is immune to divination effects.</p><p> If a
      lich activates this ioun stone, it can use its paralyzing touch as a
      ranged touch attack to a distance of @Distance[60;dual]. In addition, if
      the lich whose soul is stored within the jaundiced skull ioun stone is
      slain and someone else takes possession of the artifact, the rate at which
      the lich rejuvenates is accelerated, as the ioun stone begins sapping the
      life force from its current bearer. The stone's bearer quickly rots,
      taking 1 point of Constitution drain initially and every hour thereafter
      while it is activated unless the bearer succeeds at a DC 25 Fortitude
      save. The creature bearing the ioun stone receives a new saving throw each
      time it would be subjected to Constitution drain. As long as the ioun
      stone has dealt at least 1 point of Constitution drain, the deterioration
      assists in the reformation of the lich's body, reducing the time required
      for rejuvenation to 1d10 hours instead of the normal 1d10
      days.</p><h3>Destruction</h3><p>The jaundiced skull ioun stone can be
      destroyed only after the destruction of the lich whose soul it holds and
      before the lich has rejuvenated. During this time, the ioun stone must be
      subjected to a consecrate spell and then be smashed to pieces. The
      jaundiced skull ioun stone has AC 26, 50 hit points, and hardness 10.</p>
