    value: >-
      <h3>Background Details</h3><p>Whether they were invented by the Azlanti or
      merely discovered by them, ioun stones were an important part of Azlanti
      society-and by extension, of Thassilonian society. Many of Thassilon's
      rulers- particularly runelords like Karzoug-took to the art of embedding
      these stones in their flesh. An ioun stone implanted in this manner cannot
      be sundered or stolen. Further rules on implanting ioun stones can be
      found in Pathfinder Campaign Setting: Seekers of Secrets. Thassilonian
      wizards perfected and enhanced many forms of ioun stones, such as the four
      unusually powerful stones listed below. These stones are minor artifacts,
      and methods of their creation have been lost since Thassilon's
      fall.</p><h3>Effect</h3><p>An amber spindle grants a +1 resistance bonus
      on all saving throws (the bonuses from possessing multiple amber spindles
      stack, up to a maximum of +5).</p><h3>Destruction</h3><p>No details
      provided.</p>
