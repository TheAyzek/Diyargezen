    unidentified: <p>A purple stone in the shape of a crescent.</p>
    value: >-
      <h3>Background Details</h3><p>An experimental endeavor, the amethyst
      crescent ioun stone was one of several unique innovations attempted by the
      Spindle Solution. The gem harnessed raw positive energy and powerful
      transmutation powers to quickly repair damage to living creatures and
      constructs alike. While successful, the gem proved incredibly costly to
      produce and was not feasible for mass production. Rather than risk the gem
      falling into the hands of enemies, the Spindle Solution’s leader,
      Jazradan, hid the stone within a specially constructed
      wyrwood.</p><h3>Effect</h3><p>An amethyst crescent grants fast healing 2
      to its wearer as well a +4 circumstance bonus on saving throws against
      negative energy and death effects.</p><h3>Destruction</h3><p>This unique
      ioun stone is infused with powerful positive energy. In order to destroy
      it, the stone must be cast into the Negative Energy Plane, where it can be
      shattered after floating through the entropy for at least 1 week.</p>
