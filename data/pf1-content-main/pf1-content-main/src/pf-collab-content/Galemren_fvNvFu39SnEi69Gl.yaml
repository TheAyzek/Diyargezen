  description:
    value: >-
      <h2>Standard Racial Traits</h2><ul><li><strong>+2 Str, +2 Dex, -2
      Cha</strong>: Galemren are gifted with great agility and might, but are
      somewhat abrasive.</li><li><strong>Medium</strong>: Galemren are Medium
      creatures and have no bonuses or penalties due to their
      size.</li><li><strong>Normal Speed</strong>: Galemren have a base speed of
      30 feet.</li><li><strong>Languages</strong>: Galemren begin play speaking
      Common and Elven. Galemren with high Intelligence scores can choose from
      the following: Celestial, Draconic, Gnoll, Gnome, Goblin, Ore, and
      Sylvan.</li></ul><h3>Defense Racial Traits</h3><ul><li><strong>Elven
      Immunities</strong>: Galemren are immune to magic sleep effects and gain a
      +2 racial bonus to saving throws against enchantment spells and
      effects.</li></ul><h3>Feat and Skill Racial
      Traits</h3><ul><li><strong>Children of Powisienne</strong>: Galemren
      select two skills from the following list: Handle Animal, Knowledge
      (geography), Knowledge (nature), Stealth, and Survival. Galemren receive a
      +2 racial bonus on checks with the chosen skills.</li><li><strong>Keen
      Senses</strong>: Galemren receive a +2 racial bonus on Perception
      checks.</li></ul><h3>Senses Racial Traits</h3><ul><li><strong>Low-Light
      Vision</strong>: Galemren can see twice as far as humans in conditions of
      dim light.</li></ul><h3>Offensive Racial Traits</h3><ul><li><strong>Weapon
      Familiarity</strong>: Galemren are proficient with longbows (including
      composite longbows), longswords, longspears, rapiers, shortbows (including
      composite shortbows), shortspears, spears, and throwing axes, and they
      treat any weapon with the word "elven" in its name as a martial
      weapon.</li></ul>
