    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      +2 bonus to One Ability Score, Bonus Feat</p><hr /><p>Some humans use
      alchemical or scientific enhancements to push their bodies beyond the
      limits of nature. However, doing so comes at a significant price. A human
      with this trait gains a +3 racial bonus to Constitution, Dexterity, or
      Strength. However, the character’s biology is now more susceptible to
      chemicals, causing her to take a –2 penalty on Fortitude saving throws
      against poison.</p>
