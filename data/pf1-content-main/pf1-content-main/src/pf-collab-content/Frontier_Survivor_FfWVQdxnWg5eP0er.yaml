  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Skilled</p><hr /><p>Many humans raised on the Frontier live in the shadow
      of fallen wonders and steel ruins. While few can hope to recreate the
      marvels of ages past, many have become adept at salvaging what they can
      and repurposing it in basic, life-prolonging ways. Humans with this trait
      gain the @UUID[Compendium.pf1.feats.Item.1foaZv9wfqZVrZ90]{Technologist}
      feat, which grants them understanding of technological subjects
      (Pathfinder Campaign Setting: Technology Guide 7). Additionally, they gain
      a +2 racial bonus on Survival checks in the ruins of cities.</p>
