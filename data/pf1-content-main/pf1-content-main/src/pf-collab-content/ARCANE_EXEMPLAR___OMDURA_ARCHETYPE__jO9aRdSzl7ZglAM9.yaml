name: ARCANE EXEMPLAR ( OMDURA ARCHETYPE)
system:
  description:
    value: >-
      <p>In some cases, especially with regards to gods of magic, an omdura
      learns to manipulate magical forces and arcane secrets to aid her god.
      These omduras do not receive spells from their god, but instead gain
      arcane insight from their god that allows them to manipulate arcane
      energies.</p><ul><li><p>Arcane Insight: An arcane exemplar casts arcane
      spells drawn from the magus spell list, as a magus of her level. She uses
      her Charisma score and modifier in place of her Intelligence score and
      modifier for the purposes oflearning spells, casting spells, determining
      spell DCs and bonus spells, and any other effects related to spellcasting.
      An arcane exemplar must study a spellbook each day to prepare her spells,
      as a magus. She begins play with a spellbook containing all a-level magus
      spells plus three ist-level magus spells ofher choice. The arcane exemplar
      also selects a number of additional ist-level magus spells equal to her
      Charisma modifier to add to her spellbook. At each new arcane exemplar
      level, she adds two new magus spells of any spell level or levels that she
      can cast (based on her new arcane exemplar level) to her spellbook. At any
      time, an arcane exemplar can also add spells found in other spellbooks to
      her own (see Arcane Spells; Pathfinder RPG Core Rulebook 218). This alters
      spells and orisons.</p></li><li><p>Spellstrike (Su): At 2nd level, an
      arcane exemplar gains the magus's spellstrike class feature. This replaces
      divine touch.</p></li><li><p>Divine Arcana (Ex): At 3rd level, an arcane
      exemplar gains one magus arcana. She gains an additional magus arcana at
      6th level and every 3 levels thereafter. The arcane exemplar treats her
      omdura level as her magus level for the purpose of meeting prerequisites
      of a magus arcana. If a magus arcana requires the arcane exemplar to
      expend points from the magus arcane pool, the arcane exemplar can expend
      either minutes of her invocation ability or prepared spells in place of
      the required points. If she expends minutes ofher invocation ability, each
      minute expended in this way counts as i point expended from the magus
      arcane pool. If she expends prepared spells, the number of points expended
      from the magus arcane pool is equal to the level of the expended prepared
      spell. This replaces divine infusion.</p></li><li><p>Spell Recall (Su): At
      5th level, an arcane exemplar can recall a spell she has already cast.
      Once per day as a swift action, she can recall any single magus spell that
      she has already prepared and cast that day. The spell she recalls must be
      at least i level below the highest spell level the arcane exemplar can
      cast. At 17th level, she can recall any spell, regardless of its level.
      She can use this ability one additional time per day at nth level and at
      17th level. In addition, she can expend minutes of her invocation ability
      to recall a spell as a swift action. She must expend a number of minutes
      equal to the level of spell she is attempting to recall when recalling a
      spell in this way. This replaces divine weapon.</p></li></ul>
