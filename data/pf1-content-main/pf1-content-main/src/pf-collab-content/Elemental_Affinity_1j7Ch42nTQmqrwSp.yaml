    value: >-
      <p><strong>Race</strong>: Esufey</p><hr /><p>An esufey is tied to a
      specific element and corresponding energy type. At 1st level, an esufey
      selects air (electricity), earth (acid), fire (fire), or water (cold).
      Once this choice is made, it cannot be changed. An esufey gains resistance
      5 to its selected element's corresponding energy type. In addition, when
      an esufey dies, it cannot be resurrected by any means and its specific
      element's power is weakened in Asunda.</p>
