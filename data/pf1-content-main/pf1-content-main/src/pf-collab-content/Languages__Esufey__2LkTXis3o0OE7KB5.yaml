    value: >-
      <p><strong>Race</strong>: Esufey</p><hr /><p>Esufey begin play speaking
      Common, Elven and one additional language. They also understand Draconic,
      but they cannot speak the language. Esufey with high Intelligence scores
      can choose from the following bonus languages: Draconic, Dwarven, Goblin,
      and Orc. In addition, esufey with wings have a unique language that only
      they can understand-a soft language that sounds somewhat like crickets
      chirping.</p>
