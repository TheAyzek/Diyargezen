  description:
    value: >-
      <h2>Standard Racial Traits</h2><ul><li><strong>+2 Str, +2 Con, -2
      Int</strong>: Grachukk are powerful and resilient, but not so
      bright.</li><li><strong>Medium</strong>: Grachukk are Medium creatures and
      have no bonuses or penalties due to their size.</li><li><strong>Normal
      Speed</strong>: Grachukk have a base speed of 30
      feet.</li><li><strong>Languages</strong>: Grachukk begin play speaking
      Common and Orc. Grachukk with high Intelligence scores can choose from the
      following: Abyssal, Draconic, Giant, Gnoll, and Goblin.</li></ul><h3>Feat
      and Skill Racial Traits</h3><ul><li><strong>Blessed by Shnuk</strong>:
      Grachukk select one hated foe: dwarves, elves, esufey, humans, or ores.
      Grachukk gain a +2 bonus on Bluff, Knowledge, Perception, Sense Motive,
      and Survival checks against creatures of the selected
      type.</li><li><strong>Grachukk Intimidation</strong>: Grachukk receive a
      +2 racial bonus on Intimidate checks. This bonus increases to +4 against
      non-grachukk orcs.</li></ul><h3>Senses Racial
      Traits</h3><ul><li><strong>Darkvision</strong>: Grachukk can see in the
      dark up to 60 feet.</li><li><strong>Heightened Senses</strong>: Grachukk
      gain scent and a +2 racial bonus on Perception
      checks.</li></ul><h3>Offensive Racial Traits</h3><ul><li><strong>Ore
      Ferocity</strong>: Once per day, when a grachukk is brought below 0 hit
      points but not killed, he can fight on for 1 more round as if disabled. At
      the end of his next turn, unless brought to above 0 hit points, he
      immediately falls unconscious and begins dying.</li><li><strong>Weapon
      Familiarity</strong>: Grachukk are proficient with greataxes and
      falchions, and they treat any weapon with the word "Orc" in its name as a
      martial weapon.</li></ul>
