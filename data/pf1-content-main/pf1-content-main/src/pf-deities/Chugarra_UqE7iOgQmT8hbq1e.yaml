        <h1>Chugarra</h1><h2>The Guru of Butchers</h2>@Source[PZO1139;pages=110]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Chugarra">Chugarra</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Asura Ranas<br /><strong>Areas of
        Concern</strong> Blood, butchers, leather<br /><strong>Domains</strong>
        Death, Evil, Law, War<br /><strong>Subdomains</strong> Blood, Fear,
        Murder, Undead<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong>
        Handaxe</p><h3>Obedience</h3><p>Either butcher an animal or work on the
        crafting of a leather garment. Gain immunity to bleed
        effects.</p><h2>Boons - Asura Ranas</h2>@Source[PZO1139;pages=110]<br
        />Over time, the mightiest of the asuras complete enough cycles of
        reincarnation and build upon the atrocities committed over multiple
        lives to incarnate into the most powerful of their kind: the asura
        ranas.<p> Asura ranas are lawful evil demigods that range in power from
        CR 26 to CR 30. Each asura rana detailed below is given an obedience,
        but the boons they grant are less complex than those granted by
        archdevils, manifesting as spell-like abilities usable once per day
        each.</p><p><strong>1</strong>: <em>blood biography</em><br
        /><strong>2</strong>: <em>finger of death</em><br /><strong>3</strong>: 
        <em>quickened slough</em></p>
