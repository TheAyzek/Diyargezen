      content: >-
        <h1>Rovagug</h1><h2>The Rough Beast</h2>@Source[PZO9267;pages=124] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Rovagug">Rovagug</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Core Deities<br /><strong>Areas of
        Concern</strong> Destruction, disaster, wrath<br
        /><strong>Domains</strong> Chaos, Destruction, Evil, War, Weather<br
        /><strong>Subdomains</strong> Blood, Cannibalism, Catastrophe,
        Corruption, Demodand (Chaos), Demodand (Evil), Demon (Chaos), Demon
        (Evil), Hatred, Lightning*, Protean, Rage, Storms<br /><em>* Requires
        the <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Greataxe<br /><strong>Symbol</strong> Fanged spider<br
        /><strong>Sacred Animal(s)</strong> Scorpion<br /><strong>Sacred
        Color(s)</strong> Brown, red</p><h3>Obedience</h3><p>Smash an assortment
        of items worth at least 10 gp, preferably something fragile,
        aesthetically beautiful, or with significance to a good-aligned deity
        (particularly Sarenrae). The more devout servants of Rovagug seek out
        and hoard particularly expensive, artistic, or rare items, such as fine
        bottles of wine or delicate curios, to smash during their obedience.
        Roll in the shards of the destroyed items, howling and shouting praises
        and curses invoking the Rough Beast, until the shards draw blood and
        your lungs ache. Gain a +4 bonus on attack and damage rolls against
        objects.</p><h3>Divine Gift</h3><p>@Source[PZO1141;pages=79] <br
        /><em>Nethys Note: See here for details on how to gain a Divine
        Gift</em><br />The recipient gains the ability to bring destruction by
        casting one of the following spells as a spell-like ability (CL 20th):
        <em>implosion, <em>meteor swarm</em>, <em>storm of vengeance</em>, or
        <em>tsunami</em>.</em></p><h3>On Golarion</h3><p><em><strong>Centers of
        Worship</strong> Belkzen, Darklands, Katapesh, Realm of the Mammoth
        Lords, Osirion, Qadira<br /><strong>Nationality</strong>
        monster</em></p><h2>Boons - Deific Obedience</h2><h3>
        Evangelist</h3><p>@Source[PZO9267;pages=124]<br /><strong>1: Agent of
        the Beast (Sp)</strong> <em>protection from good</em> 3/day, <em>align
        weapon (evil only) 2/day, or <em>magic circle against good </em>
        1/day<br /><strong>2: Destructive Spell (Su)</strong> By calling on the
        rage of the Rough Beast, you gain the ability to deal terrific damage
        with your spells. You can use this ability when casting a spell that
        deals hit point damage and has a casting time of 1 standard action or
        less. You can choose to cast the spell as a full-round action to gain a
        +4 bonus to its save DC. In addition, you treat all 1s rolled on your
        damage dice for the spell as 2s instead.<br /><strong>3: The Destroyer's
        Gifts (Su)</strong> You feel the touch of an alien presence at the
        corner of your mind, as if something hungry and hateful had taken root
        and now holds a measure of dominion over your thoughts. You gain an
        extra spell slot of the highest spell level you can cast. If you prepare
        spells, you can prepare one spell in this spell slot every day from the
        Chaos or Destruction domain spell lists. You may choose any spell from
        the lists even if you are an arcane spellcaster, and you can change this
        spell selection every time you prepare spells. If you are a spontaneous
        spellcaster, you can cast one spell from either of the domain spell
        lists as if it was on your known spells list. You can cast this spell
        only once per day, though you can choose a different spell to cast each
        time you regain your spells for the
        day.</em></p><h3>Exalted</h3><p>@Source[PZO9267;pages=124]<br
        /><strong>1: Destructive Force (Sp)</strong> <em>break<sup>APG</sup>
        3/day, <em>bull's strength</em> 2/day, or <em>shatter</em> 1/day<br
        /><strong>2: Bestow Destructive Smite (Su)</strong> You can bestow the
        Destruction domain's destructive smite granted power upon an ally. As a
        standard action, you can spend one use of your destructive smite to
        grant its power to any ally within 30 feet, channeling into him the
        erratic force of Rovagug's rage. Your ally must make the destructive
        smite within 1 round of being granted the power or its use is wasted.
        Your ally uses your level to calculate the power of the destructive
        smite. If you don't have access to the Destruction domain, you instead
        gain access to the destructive smite granted power but only for your
        personal use, as normal.<br /><strong>3: Apocalyptic Ally (Sp)</strong>
        Once per day as a standard action, you can tear a violent breach between
        your location and the Outer Rifts-the deepest, foulest pits of the
        Abyss-and summon forth a pair of nyogoth qlippoth (<em>Pathfinder RPG
        Bestiary 2</em> 224). You gain telepathy with the creatures to a range
        of 100 feet, and they follow your commands perfectly for 1 minute for
        every Hit Die you possess before vanishing back into the Abyss. The
        qlippoth don't follow commands that would cause them to act in overtly
        good or lawful ways. Such commands not only earn terrifying roars from
        the creatures, but could cause the nyogoths to attack you if the command
        is particularly
        egregious.</em></p><h3>Sentinel</h3><p>@Source[PZO9267;pages=124]<br
        /><strong>1: Inexorable Death (Sp)</strong> <em>doom</em> 3/day,
        <em>death knell</em> 2/day, or <em>inflict serious wounds</em> 1/day<br
        /><strong>2: Wicked Claws (Ex)</strong> Your fingernails grow into
        thick, jagged talons, unevenly matched and vaguely resembling the spurs
        of a giant insect or the fangs of some unspeakable beast. You gain a
        pair of claw attacks. These are primary natural attacks that deal 1d8
        points of slashing damage if you're Medium or 1d6 points of damage if
        you're Small.<br /><strong>3: Disintegrating Blow (Sp)</strong> Once per
        day, you can channel a glimpse of Rovagug's hatred through your weapon,
        recreating the effects of <em>disintegrate</em>. You must declare your
        use of this ability before you roll your attack. On a hit, the target is
        affected as if targeted by <em>disintegrate </em>cast by a wizard of a
        level equal to your Hit Dice (maximum CL 20th). If your attack misses,
        the <em>disintegrate </em>effect is wasted.</em></p><h2>Antipaladin
        Code</h2><em>The antipaladins of Rovagug seek their master's Great
        Awakening, and bend all their efforts toward the eventual decay of the
        prison that holds their god. Their code is simple, brutal, and direct,
        and its tenets include the following adages. <ul><li>All things must be
        destroyed, but the tools of destruction will be destroyed
        last.</li><li>The beautiful die first. Their loss wreaks havoc in the
        hearts of those who love.</li><li>All is vanity before the tide of
        destruction.</li><li>The world is a lie. The only truth is oblivion,
        born of storm and horror.</li><li>Torture is needless delay. I give the
        gift of a quick death.</li><li>I will die standing.</li></ul><h2>Divine
        Fighting Technique</h2><h3>Rovagug's
        Thunder</h3><p>@Source[PZO9472;pages=30] <br />Most copies of <em>Ravage
        and Ruin</em>, the divine fighting manual of the Rough Beast Rovagug,
        are scrawled in blood upon flensed skins by orc priests-and indeed the
        vile techniques described within originated from the Hold of Belkzen not
        long after the orcs first seized that land as their own. Reviled across
        the Inner Sea, <em>Ravage and Ruin</em> sees additional use among savage
        Ulfen clans who have fallen to the Rough Beast's urges to become
        corrupt, lunatic cannibals who relish despoiling beauty in Rovagug's
        name.</p><p><strong>Initial Benefit</strong>: Whenever you succeed at a
        dirty trick<sup>APG</sup> combat maneuver check against an opponent, you
        deal an amount of nonlethal damage equal to 1d6 + your Charisma
        modifier. In addition, whenever your dirty trick combat maneuver check
        beats an opponent's CMD by 5 or more, you can forgo increasing the
        duration of your condition by 1 or more rounds to instead impose a -2
        penalty on all of that opponent's Charisma-based checks. This penalty
        doesn't stack with itself, and it lasts for a number of minutes equal to
        your Charisma modifier (minimum of 1 minute) or until the target
        receives any form of magical healing.</p><p><strong>Advanced
        Prerequisites</strong>: Power Attack, Divine Fighting Technique, base
        attack bonus +10.</p><p><strong>Optional Replacement</strong>: A chaotic
        evil barbarian of at least 10th level who worships Rovagug can replace a
        rage power with the following advanced benefit without meeting its
        prerequisites.</p><p><strong>Advanced Benefit</strong>: Anytime you use
        Power Attack with a great axe or a natural attack, you ignore an amount
        of the target's hardness or damage reduction equal to the penalty Power
        Attack imparts to your attack roll. This benefit stacks with Penetrating
        Strike and Greater Penetrating Strike.</p><h2>For Followers of
        Rovagug</h2><h3>Archetypes</h3><p>Blight Druid (Druid), Breaker
        (Barbarian), Iconoclast (Inquisitor), Rough Rampager (Antipaladin),
        Two-Handed Fighter (Fighter), Wild Rager
        (Barbarian)</p><h3>Feats</h3><p>Breaker of Barriers, Gory Finish,
        Merciless Rush, Oath of the Unbound, Squash Flat, Sundering Strike,
        Warrior Priest</p><h3>Magic Items - Altars</h3><p>Altar of
        Rovagug</p><h3>Magic Items - Armor</h3><p>Fangtide Scale
        Mail</p><h3>Magic Items - Weapons</h3><p>Rusting Teeth of the Rough
        Beast</p><h3>Magic Items - Wondrous Items</h3><p>Broken Chain of the
        Beast, Choker of the Rough Beast, Gauntlet of Rust, Maul of the
        Titans</p><h3>Monsters</h3><p>Tarrasque (Herald),
        Thognorok</p><h3>Spells</h3><p>Break, Brittle Portal, Deadly Juggernaut,
        Destruction, Face of the Devourer, Rage, Rovagug's Fury, Spawn
        Calling</p><h3>Traits</h3><p>Bestial Wrath, Destructive Blows, Fury,
        Hatred of the Gods, Sacred Smasher, Wrecking Wrath</p><h2>Unique Spell
        Rules</h2>@Source[PZO9267;pages=131]<p><em></em><br
        /><h3>Adept</h3></p><p><em>Baleful Polymorph</em> can be prepared as a
        4th-level spell</p><h3>Antipaladin</h3><p><em>Baleful Polymorph</em> can
        be prepared as a 4th-level
        spell</p><h3>Cleric/Warpriest</h3><p><em>Baleful Polymorph</em> can be
        prepared as a 4th-level spell</p><h3>Druid</h3><p><em>Baleful
        Polymorph</em> can be prepared as a 4th-level
        spell</p><h3>Inquisitor</h3><p><em>Baleful Polymorph</em> can be
        prepared as a 4th-level spell</p><h2>Unique Summon
        Rules</h2>@Source[PZO9023;pages=65]<br /><strong>Summon Monster
        III</strong>: Choker - CE (extraplanar)<br /><strong>Summon Monster
        V</strong>: Fiendish Grick - NE<br /><strong>Summon Monster V</strong>:
        Gibbering Mouther - CE (extraplanar)<br /><strong>Summon Monster
        VII</strong>: Emkrah - CE
