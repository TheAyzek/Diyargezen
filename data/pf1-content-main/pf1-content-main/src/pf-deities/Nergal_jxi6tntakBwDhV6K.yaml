        <h1>Nergal</h1><h2>The Slow Death</h2>@Source[PZO9267;pages=326] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Nergal">Nergal</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Atrocity, pestilence, war<br /><strong>Domains</strong>
        Death, Evil, Law, War<br /><strong>Subdomains</strong> Blood, Devil
        (Evil), Devil (Law), Murder, Venom<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Spiked
        chain<br /><strong>Symbol</strong> Sun rising over battlefield<br
        /><strong>Sacred Animal(s)</strong> Jackal<br /><strong>Sacred
        Color(s)</strong> Black, tan</p><h3>Obedience</h3><p>Mix volatile
        chemicals together, smash them at your feet, and pray. Gain a +4 profane
        bonus on saving throws against disease and poisons.</p><h2>Boons -
        Infernal Dukes</h2>@Source[PZO1139;pages=118]<br />The Lords of Hell,
        the Dukes of Perdition, and the Princes of Damnation are all names for
        the infamous nobility of the Pit- the elite caste of devilkind known as
        the infernal dukes.<p> All infernal dukes are lawful evil and range in
        power from CR 26 to CR 27. The boons they grant are less complex than
        those granted by archdevils, manifesting as spell-like abilities usable
        once per day each.</p><p><strong>1</strong>: <em>haste</em><br
        /><strong>2</strong>: <em>epidemic</em><br /><strong>3</strong>:
        <em>transmute blood to acid</em></p><h2>For Followers of
        Nergal</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
