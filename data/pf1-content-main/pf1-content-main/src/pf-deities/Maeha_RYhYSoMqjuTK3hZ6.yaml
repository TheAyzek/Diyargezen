        <h1>Maeha</h1><h2>The Father of False
        Words</h2>@Source[PZO1139;pages=110] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Maeha">Maeha</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Asura Ranas<br /><strong>Areas of
        Concern</strong> Abduction, isolation, propaganda<br
        /><strong>Domains</strong> Darkness, Evil, Law, Void<br
        /><strong>Subdomains</strong> Isolation, Loss, Night, Stars<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Net</p><h3>Obedience</h3><p>Don the
        guise of a nonevil priest, and spend 1 hour proselytizing and
        distributing poisoned food to the poor. Gain a +4 profane bonus on
        saving throws against spells with the chaotic or good
        descriptors.</p><h2>Boons - Asura
        Ranas</h2>@Source[PZO1139;pages=110]<br />Over time, the mightiest of
        the asuras complete enough cycles of reincarnation and build upon the
        atrocities committed over multiple lives to incarnate into the most
        powerful of their kind: the asura ranas.<p> Asura ranas are lawful evil
        demigods that range in power from CR 26 to CR 30. Each asura rana
        detailed below is given an obedience, but the boons they grant are less
        complex than those granted by archdevils, manifesting as spell-like
        abilities usable once per day each.</p><p><strong>1</strong>: 
        <em>deeper darkness<br /><strong>2</strong>: <em>plane shift</em><br
        /><strong>3</strong>: <em>imprisonment</em></p>
