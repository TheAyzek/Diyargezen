    text:
      content: >-
        <h1>Desna</h1><h2>Song of the Spheres</h2>@Source[PZO9267;pages=44] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Desna">Desna</a><h3>Details</h3><p><strong>Alignment</strong>
        CG<br /><strong>Pantheon</strong> Core Deities<br /><strong>Other
        Pantheons</strong> Deities of Tian Xia, Elven Deities, Gnomish Deities,
        Halfling Deities, Sandpoint Pantheon<br /><strong>Areas of
        Concern</strong> Dreams, luck, stars, travelers<br
        /><strong>Domains</strong> Chaos, Good, Liberation, Luck, Travel<br
        /><strong>Subdomains</strong> Azata (Chaos), Azata (Good), Curse,
        Exploration, Fate, Freedom, Revolution<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Starknife<br /><strong>Symbol</strong> Butterfly<br
        /><strong>Sacred Animal(s)</strong> Butterfly<br /><strong>Sacred
        Color(s)</strong> Blue, white</p><h3>Obedience</h3><p>Dance in a random
        pattern beneath the light of the stars, trusting in the guidance of
        destiny. If no stars are currently visible, softly sing or chant all of
        the names of stars that you know as you perform your dance. Let your
        mind expand and turn your thoughts away from where your feet might land,
        allowing your steps to fall where chance wills. When the dance feels
        complete, cease dancing. Ponder the steps you took and the position in
        which you stopped, and consider what portents these subtle clues might
        hold for the future. Gain a +1 luck bonus on initiative checks and a +4
        sacred bonus on Perception checks made to determine whether you are
        aware of opponents just before a surprise round.</p><h3>Divine
        Gift</h3><p>@Source[PZO1141;pages=75] <br /><em>Nethys Note: See here
        for details on how to gain a Divine Gift</em><br />The character gains
        20 luck points that can be spent at any time as a free action to
        increase the rolled result of a single d20 roll on a one-to-one basis.
        This ability can be used as many times as the character wishes as long
        as she retains luck points to spend, but only once per roll. These luck
        points can be spent after the result of the roll is determined, but must
        be spent immediately or the opportunity to adjust the luck of that roll
        is lost.</p><h3>On Golarion</h3><p><strong>Centers of Worship</strong>
        Kyonin, Lands of the Linnorm Kings, Nidal, Numeria, River Kingdoms,
        Ustalav, Varisia<br /><strong>Nationality</strong> Varisian</p><h2>Boons
        - Deific Obedience</h2><h3>
        Evangelist</h3><p>@Source[PZO9267;pages=44]<br /><strong>1: Traveler's
        Tricks (Sp)</strong> <em>longstrider</em> 3/day, <em>darkvision</em>
        2/day, or <em>phantom steed</em> 1/day<br /><strong>2: Starlit Caster
        (Su)</strong> Over time you have learned to focus your magical power to
        better damage agents of evil. You add your Charisma bonus on your
        concentration checks, as well as on your caster level checks to overcome
        spell resistance. In addition, when you stand in starlight and cast a
        spell that deals hit point damage, you can have it deal an extra 2d6
        points of damage. This bonus damage is untyped, and manifests as a
        glowing aura of starlight around the spell's original effect.<br
        /><strong>3: Starry Eyes (Su)</strong> You gain darkvision with a range
        of 60 feet. If you already have darkvision with a range of 60 feet or
        greater, the range of your darkvision instead increases by 10 feet. This
        extension applies only to natural, permanent darkvision, not to
        darkvision that is granted by spells or other effects. In addition,
        while you stand in starlight the range of your spells (other than spells
        with the range of 'personal' or 'touch') increases as though your caster
        level were 1 level
        higher.</em></p><h3>Exalted</h3><p>@Source[PZO9267;pages=44]<br
        /><strong>1: Slumberer (Sp)</strong> <em>sleep</em> 3/day, <em>silence
        </em> 2/day, or <em>deep slumber</em> 1/day<br /><strong>2: Splendorous
        Ally (Sp)</strong> Once per day as a standard action, you can summon a
        lillend azata. You gain telepathy with the lillend to a range of 100
        feet. The lillend follows your commands perfectly for 1 minute for every
        Hit Die you possess before vanishing back to its home on Elysium. The
        lillend doesn't follow any commands that would cause it to take evil or
        overly lawful actions, and the creature could even attack you if the
        command is particularly egregious.<br /><strong>3: Blast of Motes
        (Su)</strong> Whenever you channel positive energy to heal living
        creatures, a shower of starry motes cascades over all of the living
        creatures in the area of effect. These motes do not impede vision or
        stealth attempts, nor do they reveal invisible creatures, but they
        infuse the targets with divine luck. Targets of this ability reduce any
        miss chance they face by 10%. In addition, when targets of this ability
        roll damage dice, they may treat all 1s as 2s. The motes and their
        effects last for 1 round + 1 round for every 4 Hit Dice you have
        (maximum 6 rounds). If you don't have the ability to channel positive
        energy, you gain the ability to do so once per day as a cleric of a
        level equal to your Hit Dice (maximum 20), but only to heal living
        creatures. Whenever you use this ability, the beneficiaries are showered
        with starry motes, with the effects described
        above.</em></p><h3>Sentinel</h3><p>@Source[PZO9267;pages=44]<br
        /><strong>1: Fighting Chance (Sp)</strong> <em>entropic shield</em>
        3/day, <em>blur</em> 2/day, or <em>displacement</em> 1/day<br
        /><strong>2: See through Dreams (Su)</strong> Desna's blessing allows
        you to see through half-real and fantastical images. You gain a +1 luck
        bonus on saving throws made against illusion spells and effects and
        against dream-based magic (such as <em>nightmare</em>). This bonus
        increases by 1 for every 4 Hit Dice you possess (maximum +6).<br
        /><strong>3: Shooting Star (Ex)</strong> You can throw your deity's
        star-shaped favored weapon with great speed and ease. Three times per
        day, you can make a single ranged attack with a starknife as a swift
        action. To throw a starknife as a swift action, you must have it in
        hand, have sufficient actions available to draw the starknife, or have
        the Quick Draw feat or a similar ability.</em></p><h2>Divine Fighting
        Technique</h2><h3>Desna's Shooting
        Star</h3><p><em>@Source[PZO9472;pages=28] </em><br />Among the divine
        fighting manuals of the Inner Sea, few are as ancient as <em>Clamor of
        the Spheres</em>, a collection of fighting techniques favored by Desna's
        faithful. True to its name, the manual focuses on interpreting the chaos
        and sounds of combat, but nevertheless provides insightful and downright
        brilliant methods of defense with Desna's favored weapon, using
        techniques that treat a fight with a starknife more as a beautiful dance
        than a battle.</em></p><p><em><strong>Optional Replacement</strong>: A
        chaotic good bard of at least 2nd level who worships Desna can replace a
        versatile performance with the following initial
        benefit.</em></p><p><em><strong>Initial Benefit</strong>: You can add
        your Charisma bonus to attack rolls and damage rolls when wielding a
        starknife. If you do so, you don't modify attack rolls and damage rolls
        with your starknife with your Strength modifier, your Dexterity modifier
        (if you have Weapon Finesse), or any other ability score (if you have an
        ability that allows you to modify attack rolls and damage rolls with
        that ability score).</em></p><p><em><strong>Advanced
        Prerequisites</strong>: Dex 17; Divine Fighting Technique; Point-Blank
        Shot; Rapid Shot; base attack bonus +11 or Sleight of Hand 11
        ranks.</em></p><p><em><strong>Optional Replacement</strong>: A chaotic
        good bard of at least 10th level who worships Desna can replace a
        versatile performance with the following advanced benefit without
        meeting its prerequisites.</em></p><p><em><strong>Advanced
        Benefit</strong>: You can impart a powerful spin to a thrown starknife
        so that multiple blades strike the target rather than just a single
        blade of the four, dealing extra damage with the other blades. As a
        full-round action, you can make a single attack with a thrown starknife,
        rolling 1d4 to determine how many effective strikes you gain with the
        attack (if you roll a 1, then only one blade strikes). If the attack
        hits, all of the effective strikes damage the target. Apply
        precision-based damage (such as sneak attack damage) and critical hit
        damage only once for this attack. The damage bonus from your appropriate
        ability score modifier applies to each strike, as do other damage
        bonuses, such as a bard's inspire competence bonus. Damage reduction and
        resistances apply separately to each strike.</em></p><h2>For Followers
        of Desna</h2><h3>Archetypes</h3><p><em>Guide (Ranger), Stargazer
        (Oracle), World Walker (Druid)</em></p><h3>Feats</h3><p><em>Butterfly's
        Sting, Cosmic Gate, Guided Star, Improved Stellar Wanderer, Lady Luck's
        Guidance, Stellar Wanderer, Trailblazing Channel</em></p><h3>Magic Items
        - Altars</h3><p><em>Altar of Desna</em></p><h3>Magic Items -
        Armor</h3><p><em>Starsong Mail</em></p><h3>Magic Items -
        Rings</h3><p><em>Ring of Stairs and Stars</em></p><h3>Magic Items -
        Staves</h3><p><em>Staff of Slumber</em></p><h3>Magic Items -
        Weapons</h3><p><em>Shooting Starknife</em></p><h3>Magic Items - Wondrous
        Items</h3><p><em>Cloak of the Night Sky, Desna's Coin, Dream Candle,
        Dreamwing Cape, Necklace of Netted Stars, Robe of Stars, Starfaring
        Robes, Stone of Good Luck
        (Luckstone)</em></p><h3>Monsters</h3><p><em>Night Monarch (Herald),
        Thyrlien</em></p><h3>Prestige Classes</h3><p><em>Sphere Singer,
        Spherewalker</em></p><h3>Spells</h3><p><em>Beacon of Luck, Dream, Dream
        Feast, Find the Path, Guiding Star, Haze of Dreams, Traveling Dream,
        Wandering Star Motes</em></p><h3>Traits</h3><p><em>Faithful Artist,
        Follower of the Stars, Good Dreams, Starchild, Stoic Optimism,
        Thrill-Seeker</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9267;pages=51]<em></em><br
        /><h3>Cleric/Warpriest</h3><p><em>Dream</em> can be prepared as a
        5th-level spell</p><h3>Druid</h3><p><em>Dream can be prepared as a
        5th-level spell<br /></em></p><h3>Ranger</h3><p><em>Dream</em> can be
        prepared as a 4th-level spell</em></p><h2>Unique Summon
        Rules</h2>@Source[PZO9002;pages=72]<br /><strong>Summon Monster
        II</strong>: Lyrakien - CG<br /><strong>Summon Monster III</strong>:
        Star Monarch - CG [stats as a giant eagle]<br /><strong>Summon Monster
        VII</strong>: Young Brass Dragon - CG
        (extraplanar)<p>@Source[PZO9458;pages=30]<br /><strong>Summon Monster
        II</strong>: Pseudodragon - CG</p>
