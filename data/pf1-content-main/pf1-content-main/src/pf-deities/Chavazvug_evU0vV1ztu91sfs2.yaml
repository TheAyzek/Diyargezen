      content: >-
        <h1>Chavazvug</h1><h2>The Crawling
        Inferno</h2>@Source[PZO9267;pages=328] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Chavazvug">Chavazvug</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Qlippoth Lords<br /><strong>Areas of
        Concern</strong> Fiery consumption, monstrous recursion<br
        /><strong>Domains</strong> Chaos, Evil, Fire, Repose<br
        /><strong>Subdomains</strong> Ash, Entropy, Smoke, Souls<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Heavy flail<br
        /><strong>Symbol</strong> Burning tentacled rune<br /><strong>Sacred
        Animal(s)</strong> None<br /><strong>Sacred Color(s)</strong>
        Orange</p><h3>Obedience</h3><p>Torture a living creature with red-hot
        brands or small fires, and meditate on the cries of pain and scent of
        scorched flesh. Gain a +4 profane bonus on saving throws against
        fire-based effects.</p><h2>Boons - Qlippoth
        Lords</h2>@Source[PZO1139;pages=128]<br />Qlippoth lords are always
        chaotic evil and range in power from CR 21 to CR 25. It's quite likely
        that more powerful creatures akin to demigods in stature may still exist
        in the deepest parts of the Abyss, but such qlippoth demigods remain
        theoretical for now, and they do not maintain active cults on mortal
        worlds. The boons qlippoth lords grant are less complex than those
        granted by fiendish demigods, manifesting as spell-like abilities usable
        twice per day each.<p><strong>1</strong>: <em>scorching ray</em><br
        /><strong>2</strong>: <em>pyrotechnic eruption</em><br
        /><strong>3</strong>: <em>contagious flame</em></p>
