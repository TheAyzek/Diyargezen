        <h1>Osolmyr</h1><h2>The One True Dream</h2>@Source[PZO9267;pages=318]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Osolmyr">Osolmyr</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Flagellation, repression, self denial<br
        /><strong>Domains</strong> Evil, Glory, Healing, Madness<br
        /><strong>Subdomains</strong> Daemon, Heroism, Insanity, Resurrection<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Flail<br /><strong>Symbol</strong>
        Bloody scourge<br /><strong>Sacred Animal(s)</strong> Albion peacock<br
        /><strong>Sacred Color(s)</strong> Pink,
        white</p><h3>Obedience</h3><p>Publicly self-flagellate without
        acknowledging others' reactions. Gain a +4 profane bonus on saving
        throws against effects that damage, drain, or penalize ability
        scores.</p><h2>Boons - Daemon
        Harbingers</h2><p>@Source[PZO1139;pages=114]</p><p>Abaddon's unique
        daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>inflict moderate wounds</em><br
        /><strong>2</strong>: <em>modify memory</em><br /><strong>3</strong>:
        <em>harm</em></p>
