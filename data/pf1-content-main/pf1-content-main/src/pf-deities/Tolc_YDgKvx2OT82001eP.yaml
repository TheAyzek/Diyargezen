        <h1> Tolc</h1><h2>Snow-Strider</h2>@Source[PZO9267;pages=324] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Tolc">Tolc</a><h3>Details</h3><p><strong>Alignment</strong>
        CG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Cold, frozen wilds, survival<br
        /><strong>Domains</strong> Chaos, Good, Travel, Water<br
        /><strong>Subdomains</strong> Azata (Chaos), Azata (Good), Exploration,
        Ice, Storms<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Javelin<br
        /><strong>Symbol</strong> Antlers and ice javelin<br /><strong>Sacred
        Animal(s)</strong> Caribou<br /><strong>Sacred Color(s)</strong> Icy
        blue, ivory</p><h3>Obedience</h3><p>Kneel naked outdoors at night while
        dipping your hands in two bowls of tepid water. Slowly raise your hands
        above your head and hold them there until the water from both bowls has
        evaporated. Gain a +4 sacred bonus on saves against cold
        effects.</p><h2>Boons - Celestial Obedience</h2><h3>Mystery
        Cultist</h3><p>@Source[PZO9255;pages=26]<br /><strong>1: Frozen Magic
        (Sp)</strong> <em>mount (caribou only) 3/day, <em>chill metal </em>
        2/day, or <em>protection from energy</em> 1/day<br /><strong>2: Icy
        Shards (Su)</strong> Three times per day, you can breathe a 15-foot cone
        of ice particles. The cone deals 1d6 points of damage per HD you possess
        (maximum 15d6). Half this damage is cold damage, while the other half is
        slashing damage. A Reflex save (DC 10 + 1/2 your HD) halves damage taken
        from this attack.<br /><strong>3: Glacial Dark (Sp)</strong> You can
        cast <em>polar midnight</em><sup>UM</sup> once per day.</em></p><h2>For
        Followers of Tolc</h2><h3>Feats</h3><p><em>Heroic
        Interposition</em></p><h3>Traits</h3><p><em>Empyreal Focus</em></p>
