      content: >-
        <h1>Furcas</h1><h2>Knight of the Laurels</h2>@Source[PZO9267;pages=326]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Furcas">Furcas</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Duty, flames, herbalism<br /><strong>Domains</strong>
        Evil, Fire, Law, Plant<br /><strong>Subdomains</strong> Ash, Devil
        (Evil), Devil (Law), Growth, Slavery<br /><em>* Requires the <u>Acolyte
        of Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong>
        Trident<br /><strong>Symbol</strong> Flaming pitchfork<br
        /><strong>Sacred Animal(s)</strong> Snake<br /><strong>Sacred
        Color(s)</strong> Red, yellow</p><h3>Obedience</h3><p>Mix any herbal
        salve or concoction; apply or drink half of it yourself, and burn the
        other half. Gain a +4 profane bonus on saving throws against
        poison.</p><h2>Boons - Infernal Dukes</h2>@Source[PZO1139;pages=116]<br
        />The Lords of Hell, the Dukes of Perdition, and the Princes of
        Damnation are all names for the infamous nobility of the Pit- the elite
        caste of devilkind known as the infernal dukes.<p> All infernal dukes
        are lawful evil and range in power from CR 26 to CR 27. The boons they
        grant are less complex than those granted by archdevils, manifesting as
        spell-like abilities usable once per day each.</p><p><strong>1</strong>:
        <em>fireball</em><br /><strong>2</strong>: <em>animate plants</em><br
        /><strong>3</strong>: <em>fiery body</em></p><h2>For Followers of
        Furcas</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
