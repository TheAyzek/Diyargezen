      content: >-
        <h1> Andoletta</h1><h2>Grandmother Crow</h2>@Source[PZO9267;pages=322]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Andoletta">Andoletta</a><h3>Details</h3><p><strong>Alignment</strong>
        LG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Consolation, respect, security<br
        /><strong>Domains</strong> Good, Knowledge, Law, Protection<br
        /><strong>Subdomains</strong> Archon (Good), Archon (Law), Defense,
        Education (Knowledge), Memory, Purity<br /><em>* Requires the <u>Acolyte
        of Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong>
        Quarterstaff<br /><strong>Symbol</strong> Hand with willow staff<br
        /><strong>Sacred Animal(s)</strong> Crow<br /><strong>Sacred
        Color(s)</strong> Black, green</p><h3>Obedience</h3><p>Recite the
        <em>Obeisance of Glorious Preservation </em>from memory while weaving a
        small basket from willow branches and filling the basket with food,
        money, or other sources of comfort to give to the poor at your next
        opportunity. Gain a +4 sacred bonus on saving throws against spells that
        deal non-energy hit point damage.</p><h2>Boons - Celestial
        Obedience</h2><h3>Mystery Cultist</h3><p>@Source[PZO9255;pages=6]<br
        /><strong>1: Comfort of Faith (Sp)</strong> <em>sanctuary</em> 3/day,
        <em>align weapon </em>(law or good only) 2/day, or <em>magic circle
        against chaos/evil </em>1/day<br /><strong>2: Demanding Presence
        (Sp)</strong> You can cast silenced <em>dictum </em>once per day.<br
        /><strong>3: Divine Gaze (Su)</strong> Your eyes become the golden eyes
        of a crow. You gain darkvision out to a range of 60 feet (or, if you
        already have darkvision, extend your current range by 60 feet). Once per
        day as a standard action, you can shower yourself and any allies within
        30 feet with divine light from your eyes, granting each affected target
        a +4 sacred bonus to AC, a +4 resistance bonus on all saving throws, and
        SR 25 for 1 round per HD you possess.</em></p><h2>Paladin
        Code</h2><em>Andoletta's paladins serve courts and other authorities.
        They seek to protect innocence and dispel foolishness. Their tenets
        include the following affirmations.<ul><li> Children must be nurtured
        lest their innocence become callousness or ignorance. I will never be
        cold or negligent to a child.</li><li> Virtue relies upon wisdom, and
        wisdom relies upon true awareness. I will never leave a falsehood
        unchallenged.</li><li> I will be firm with the ignorant, but not cruel.
        Ignorance can be corrected.</li><li> I will respect my elders' knowledge
        and wisdom, but won't abide the spreading of complacency or
        ignorance.</li></ul> <h2>For Followers of
        Andoletta</h2><h3>Feats</h3><p>Heroic
        Interposition</p><h3>Traits</h3><p>Andoletta's Consolation, Empyreal
        Focus, Enemy of Delusion</p>
