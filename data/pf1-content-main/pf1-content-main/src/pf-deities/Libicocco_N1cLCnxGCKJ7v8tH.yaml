      content: >-
        <h1>Libicocco</h1><h2>Prideful Lady of the
        Winds</h2>@Source[PZO9267;pages=328] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Libicocco">Libicocco</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Malebranche<br /><strong>Areas of
        Concern</strong> Rage, violence, wind<br /><strong>Domains</strong> Air,
        Destruction, Evil, Law<br /><strong>Subdomains</strong> Catastrophe,
        Devil (Evil), Devil (Law), Rage, Wind<br /><em>* Requires the <u>Acolyte
        of Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong>
        Scimitar<br /><strong>Symbol</strong> Windstorm and clouds<br
        /><strong>Sacred Animal(s)</strong> Falcon<br /><strong>Sacred
        Color(s)</strong> Blue, white</p><h3>Obedience</h3><p>Smash any work of
        art and scatter its pieces into four opposing corners. Gain a +4 profane
        bonus on saving throws against transmutation effects.</p><h2>Boons -
        Malebranche</h2>@Source[PZO1139;pages=123]<p>Malebranche are horned
        devils transformed so as to conquer a mortal world in Hell's name. Many
        malebranche exist in Hell's ranks, and the 12 detailed below are merely
        the best known.</p><p> Malebranche occupy a tier of power just below
        infernal dukes. All malebranche are lawful evil and range in power from
        CR 21 to CR 25. The boons they grant are less complex than those granted
        by archdevils, manifesting as spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>gust of wind</em><br
        /><strong>2</strong>: <em>shout</em><br /><strong>3</strong>: <em>enemy
        hammer</em></p><h2>For Followers of
        Libicocco</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
