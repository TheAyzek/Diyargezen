      content: >-
        <h1>Yhidothrus</h1><h2>The Ravager Worm</h2>@Source[PZO9267;pages=320]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Yhidothrus">Yhidothrus</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Age, time, worms<br /><strong>Domains</strong> Chaos,
        Death, Evil, Repose<br /><strong>Subdomains</strong> Ancestors, Demon
        (Chaos), Demon (Evil), Entropy, Murder<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Spiked chain<br /><strong>Symbol</strong> Worm-filled
        hourglass<br /><strong>Sacred Animal(s)</strong> Worm<br
        /><strong>Sacred Color(s)</strong> Black, pale
        yellow</p><h3>Obedience</h3><p>Meditate in a closed coffin partially
        filled with worm-infested soil or leech-infested mud. During the
        obedience, you must swallow or inhale at least a dozen living worms or
        leeches. Gain a +4 profane bonus against effects that cause slowness or
        magical aging, or anything that damages, drains, or penalizes ability
        scores.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=28]<br
        /><strong>1: Blessing of the Worm (Sp)</strong> <em>ray of enfeeblement
         </em> 3/day, <em>gentle repose</em> 2/day, or <em>slow</em> 1/day<br
        /><strong>2: Curse of Brittle Bones (Sp)</strong> Once per day, you can
        use a powerful <em>bestow curse</em>, heightened to a 7th-level spell.
        This special curse causes the creature cursed to suddenly grow to
        venerable age. This curse imparts a -6 penalty to Strength, Dexterity,
        and Constitution, but does not grant any bonus to Intelligence, Wisdom,
        or Charisma. This ability is the equivalent of a 7th-level spell.<br
        /><strong>3: Conqueror Worm (Sp)</strong> You can use <em>summon monster
        IX</em> once per day, but only to summon one advanced fiendish purple
        worm.</em></p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=104]<br
        /><strong>1: Consumption of the Worm (Sp)</strong> <em>corrosive
        touch</em> 3/day, <em>acid arrow</em> 2/day, or <em>vampiric touch</em>
        1/day<br /><strong>2: Nightmare Below (Ex and Su)</strong> You can crawl
        beneath the surface of the earth like a worm and then burst forth to
        horrify foes. You gain a burrow speed of 30 feet, which can be used only
        in mud, sand, soil, or other soft substances (not solid stone). You gain
        a +10 bonus on Stealth checks while burrowing. Once per hour, if you
        take a standard action to emerge from burrowing with a roar and spray of
        soil, each creature within 30 feet of your emergence that was not aware
        of your presence must succeed at a Will save (DC = 10 + half your Hit
        Dice + your Charisma modifier) or be shaken and stunned for 1 round and
        shaken for 2d4 rounds thereafter. The burrowing ability is an
        extraordinary ability, but the latter part of the ability is a
        supernatural, mind-affecting fear effect.<br /><strong>3: The Very Worm
        That Gnaws (Su)</strong> As a result of your practice of sleeping in
        parasite-infested mud or soil to fulfill your obedience to Yhidothrus,
        your flesh has become riddled with an unholy infection. Yet far from
        being a troublesome condition, these worms are a welcome addition to
        your life, and as you gain this final boon, your body is devoured from
        the inside out by a mass of wriggling leeches, maggots, worms, and other
        horrid vermin, which are thereafter bound together into a cohesive whole
        by your foul will. When you attain this boon, you become a worm that
        walks. When your emergence (see above) causes creatures to become
        shaken, those creatures are also sickened for 1
        minute.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=104]<br
        /><strong>1: Blessing of the Worm (Sp)</strong> <em>ray of
        enfeeblement</em> 3/day, <em>gentle repose</em> 2/day, or <em>slow</em>
        1/day<br /><strong>2: Curse of Brittle Bones (Sp)</strong> Once per day,
        you can cast a powerful <em>bestow curse</em>, heightened to a 7th-level
        spell, as a spell-like ability. This special curse causes the target
        creature to suddenly advance to venerable age. This curse imposes a -6
        penalty to the target's Strength, Dexterity, and Constitution scores,
        but its Intelligence, Wisdom, or Charisma scores do not increase. These
        penalties do not stack with any existing penalties a creature might
        already have as the result of advanced age.<br /><strong>3: Call of the
        Worm (Sp)</strong> By placing a hand upon the ground and whispering a
        series of blasphemies to the Ravager Worm, you can call up from below an
        immense and destructive manifestation of your fiendish lord. You can
        cast <em>summon monster IX</em> once per day as a spell-like ability to
        summon one advanced fiendish purple
        worm.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=104]<br
        /><strong>1: Hasten the End (Sp)</strong> <em>expeditious retreat 
         </em> 3/day, <em>silence</em> 2/day, or <em>sands of time</em> 1/day<br
        /><strong>2: Specter of Time (Su)</strong> As a swift action when you
        confirm a critical hit with a weapon against a living foe, instead of
        dealing the additional damage from the critical hit, you can instead
        deal normal damage and force the target to attempt a Fortitude save (DC
        = 10 + half your Hit Dice + your Charisma modifier). On a failed save,
        the target painfully advances in years to the next age category. This
        aging can never have beneficial effects (such as if used against a true
        dragon). The target gains the penalties associated with the new age
        category to its Strength, Dexterity, and Constitution scores, but its
        Intelligence, Wisdom, or Charisma scores do not increase. This advanced
        age effect lasts for 24 hours before it fades and the affected creature
        returns to its normal age. A venerable creature (including one whose age
        has been magically accelerated via this ability to venerable, but not
        one whose age is temporarily advanced from other effects, such as per
        <em>sands of time</em>) that fails its saving throw against the aging
        effects of this ability is instantly slain, as if via old age (though
        the body instantly reverts to its original age appearance upon death). A
        creature slain by this effect can only be restored to life via
        <em>miracle, <em>reincarnate</em>, <em>true resurrection, or
        <em>wish</em>. This is a curse effect.<br /><strong>3: End Time
        (Sp)</strong> You can call upon the Ravager Worm to temporarily consume
        time itself in an area surrounding you. You can cast <em>time stop</em>
        once per day as a spell-like ability. When you use this ability, those
        in the area of effect are subjected to a powerful vision-that the world
        they are in becomes wrapped in the endless coils of the Ravager Worm.
        The affected creatures never glimpse Yhidothrus's head, and know only
        for the brief instant of eternity they spend in your time stop area that
        the world around them is fully wrapped in the coils of something more
        foul than they even imagined.</em></p><h2>For Followers of
        Yhidothrus</h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic
        Items - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Traits</h3><p><em>Demonic Persuasion</em></p>
