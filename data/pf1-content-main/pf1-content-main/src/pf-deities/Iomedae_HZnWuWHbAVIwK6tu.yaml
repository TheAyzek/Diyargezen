      content: >-
        <h1>Iomedae</h1><h2>The Inheritor</h2>@Source[PZO9267;pages=76] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Iomedae">Iomedae</a><h3>Details</h3><p><strong>Alignment</strong>
        LG<br /><strong>Pantheon</strong> Core Deities<br /><strong>Other
        Pantheons</strong> Ascended Pantheon, Halfling Deities, Order of the God
        Claw Pantheon<br /><strong>Areas of Concern</strong> Honor, justice,
        rulership, valor<br /><strong>Domains</strong> Glory, Good, Law, Sun,
        War<br /><strong>Subdomains</strong> Archon (Good), Archon (Law),
        Chivalry, Day, Duels, Heroism, Honor, Hubris (Glory)*, Light,
        Redemption, Revelation, Soverignty, Tactics<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Longsword<br /><strong>Symbol</strong> Sword and sun<br
        /><strong>Sacred Animal(s)</strong> Lion<br /><strong>Sacred
        Color(s)</strong> Red, white</p><h3>Obedience</h3><p>Hold your primary
        weapon in front of you and hang a holy symbol of Iomedae from it. Kneel
        while focusing on the holy symbol, pray for guidance and protection from
        the Inheritor, and swear to follow her teachings. Gain a +4 sacred bonus
        on Diplomacy and Knowledge (nobility) checks.</p><h3>Divine
        Gift</h3><p>@Source[PZO1141;pages=77] <em></em><br /><em>Nethys Note:
        See here for details on how to gain a Divine Gift<br />By spending 10
        minutes in prayer to Iomedae (this may take place during daily
        preparation of spells), a character can activate a <em>holy aura or
        <em>shield of law</em> effect on himself (CL 20th) that lasts for the
        next 12 hours.</em></p><h3>On Golarion</h3><p><em><strong>Centers of
        Worship</strong> Absalom, Andoran, Cheliax, Galt, Lastwall, Mendev,
        Molthune, Nirmathas, Sargava<br /><strong>Nationality</strong>
        Chelaxian</em></p><h2>Boons - Deific Obedience</h2><h3>
        Evangelist</h3><p>@Source[PZO9267;pages=76]<br /><strong>1: Courageous
        (Sp)</strong> <em>remove fear</em> 3/day, <em>blessing of courage and
        life</em><sup>APG</sup> 2/day, or <em>heroism</em> 1/day<br /><strong>2:
        Demon-Feared Caster (Ex)</strong> You are used to fighting the forces of
        evil. You gain a sacred bonus equal to 1 + 1 for every 4 Hit Dice you
        possess (maximum +6) on caster level checks to overcome the spell
        resistance of outsiders with the chaotic or evil subtypes. These bonuses
        stack against outsiders who are both chaotic and evil (maximum +12) . If
        you don't have the ability to cast spells, you instead gain the ability
        to use <em>protection from chaos/evil </em>as a spell-like ability three
        times per day.<br /><strong>3: Wrath of the Inheritor (Su)</strong>
        Three times per day, you can call upon Iomedae during the casting of a
        spell to increase its potency. When you use this ability, you can cast
        any spell that deals hit point damage and has a casting time of 1
        standard action as a full-round action instead. Doing so changes half
        the damage dealt to divine power, similar to a <em>flame strike
        </em>spell. For example, a wizard 5/evangelist 9 casts a <em>lightning
        bolt </em>as a full-round action. The spell deals 10d6 points of damage,
        half of which is electricity damage and the other half of which is
        divine energy and not subject to electricity resistance. If you can't
        cast spells that deal hit point damage, you instead gain the ability to
        imbue your weapon with holy power. Three times per day as a free action,
        you can grant your weapon the <em>holy</em> weapon special ability for 1
        minute.</em></p><h3>Exalted</h3><p>@Source[PZO9267;pages=76]<br
        /><strong>1: Glorious Servant (Sp)</strong> <em>shield of faith </em>
        3/day, <em>enthrall</em> 2/day, or <em>searing light</em> 1/day<br
        /><strong>2: Righteous Strike (Sp)</strong> Once per day, you can
        channel the effects of <em>holy smite </em>through your weapon. You must
        declare your use of this ability before you roll your attack. On a hit,
        the target is affected as if targeted with <em>holy smite</em>.<br
        /><strong>3: Just Ally (Sp)</strong> Once per day as a standard action,
        you can summon a shield archon (<em>Pathfinder RPG Bestiary</em> 2
        </em>31). The shield archon follows your commands perfectly for 1 minute
        for every Hit Die you possess before vanishing back to its home in
        Heaven. The shield archon doesn't follow commands that would violate its
        alignment, however, and particularly egregious commands could cause it
        to attack you.</em></p><h3>Sentinel</h3><p>@Source[PZO9267;pages=76]<br
        /><strong>1: Knight of Valor (Sp)</strong> <em>bless weapon</em> 3/day,
        <em>bull's strength </em>2/day, or <em>magic vestment</em> 1/day<br
        /><strong>2: Valorous Smite (Su)</strong> If you have the smite evil
        class feature, you gain an extra use of that ability per day. You add
        the levels of sentinel to your paladin levels when calculating the extra
        damage dealt by your smite. If you successfully deal damage with your
        smite, your target must succeed at a Will saving throw (with a DC equal
        to 10 + your Charisma modifier + 1/2 your Hit Dice) or be stunned for 1
        round plus 1 round for every 4 Hit Dice you possess (maximum 6 rounds).
        Once a target saves against this stunning effect, it is immune to the
        stunning effect from your holy smite for 24 hours.</em></p><p><em>If you
        don't have the smite evil class feature, instead you can, as a free
        action, single out an outsider with the evil subtype or an evil-aligned
        dragon you plan to vanquish. Against this target, you gain a +2 sacred
        bonus on attack rolls and a sacred bonus equal to your sentinel level on
        damage rolls. The bonuses remain until the target is dead or you use
        this ability again, whichever comes first. If you choose a target that
        is not one of the listed creature types, the ability is wasted. You can
        use this ability a number of times per day equal to your Charisma bonus
        (minimum once per day).<br /><strong>3: Banishing Strike (Sp)</strong>
        Once per day, you can channel the effects of <em>banishment </em>through
        your weapon, though you don't need to cast (or even know) the spell. You
        must declare your use of this ability before you roll your attack. On a
        hit, the target is affected by a <em>banishment </em>effect. If you
        openly wear a holy symbol of Iomedae, you gain a +1 bonus on your caster
        level check to overcome the target's spell resistance (if any) and the
        saving throw DC increases by 2.</em></p><h2>Paladin Code</h2><em>The
        paladins of Iomedae are just and strong, crusaders who live for the joy
        of righteous battle. Their mission is to right wrongs and eliminate evil
        at its root. They serve as examples to others, and their code demands
        they protect the weak and innocent by eliminating sources of oppression,
        rather than merely the symptoms. They may back down or withdraw from a
        fight if they are overmatched, but if their lives will buy time for
        others to escape, they must give them. Their tenets include the
        following affirmations. <ul><li>I will learn the weight of my sword.
        Without my heart to guide it, it is worthless-my strength is not in my
        sword, but in my heart. If I lose my sword, I have lost a tool. If I
        betray my heart, I have died.</li><li>I will have faith in the
        Inheritor. I will channel her strength through my body. I will shine in
        her legion, and I will not tarnish her glory through base
        actions.</li><li>I am the first into battle, and the last to leave
        it.</li><li>I will not be taken prisoner by my free will. I will not
        surrender those under my command.</li><li>I will never abandon a
        companion, though I will honor sacrifice freely given.</li><li>I will
        guard the honor of my fellows, both in thought and deed, and I will have
        faith in them.</li><li>When in doubt, I may force my enemies to
        surrender, but I am responsible for their lives.</li><li>I will never
        refuse a challenge from an equal. I will give honor to worthy enemies,
        and contempt to the rest. </li><li>I will suffer death before
        dishonor.</li><li>I will be temperate in my actions and moderate in my
        behavior. I will strive to emulate Iomedae's
        perfection.</li></ul><h2>Divine Fighting Technique</h2><h3>Iomedae's
        Inspiring Sword</h3><p>@Source[PZO9463;pages=11] <br />Iomedae
        demonstrates how to turn a longsword into a shining beacon of
        hope.</p><p><strong>Optional Replacement</strong>: A paladin who
        worships Iomedae can replace a mercy with this initial benefit, even if
        she doesn't meets its prerequisites.</p><p><strong>Initial
        Benefit</strong>: While wielding a longsword, you can perform an
        impressive display of prowess as a full-round action. All allies within
        30 feet who can see your display gain a +2 sacred bonus on attack rolls,
        saving throws, and skill checks for 1 round + 1 round per 5 points of
        base attack bonus you have.</p><p><strong>Advanced
        Prerequisites</strong>: Dazzling Display, Weapon Focus (longsword), base
        attack bonus +10.</p><p><strong>Optional Replacement</strong>: A paladin
        of at least 9th level who worships Iomedae can replace a mercy with the
        following advanced benefit, even if she doesn't meet the benefit's
        prerequisites.</p><p><strong>Advanced Benefit</strong>: As a standard
        action or at the end of a charge, you can make an attack against a foe
        with a longsword. If you succeed, you grant all allies who can see your
        attack a +2 sacred bonus on attack rolls, saving throws, and skill
        checks for 1 minute.</p><h2>For Followers of
        Iomedae</h2><h3>Archetypes</h3><p>Battle Scout (Ranger), Crusader
        (Cleric), Iomedaen Enforcer (Paladin), Shining Knight (Paladin),
        Standard Bearer (Cavalier)</p><h3>Feats</h3><p>Disciple of the Sword,
        Hands of Valor, Protective Channel, Strike True</p><h3>Magic Items -
        Altars</h3><p>Altar of Iomedae</p><h3>Magic Items - Armor</h3><p>Icon of
        Order, Inheritor's Breastplate, War Commander's Field Plate</p><h3>Magic
        Items - Rings</h3><p>Knight-Inheritor's Ring</p><h3>Magic Items -
        Weapons</h3><p>Crusader's Longsword, Inheritor's Light, Iomedae's
        Needle</p><h3>Magic Items - Wondrous Items</h3><p>Knight's Pennon
        (Battle), Cloak of the Crusader, Lord's Banner (Crusades), Glorious
        Tabard (Greater), Knight's Pennon (Honor), Inheritor's Gauntlet,
        Glorious Tabard (Lesser), Medal of the Hero's Heart, Knight's Pennon
        (Parley), Lord's Banner (Swiftness), Lord's Banner (Terror), Lord's
        Banner (Victory)</p><h3>Monsters</h3><p>Hand of the Inheritor (Herald),
        Iophanite</p><h3>Prestige Classes</h3><p>Heritor Knight, Inheritor's
        Crusader, Knight of Ozem</p><h3>Spells</h3><p>Bestow Grace of the
        Champion, Burst of Glory, Inheritor's Smite, Light Prison, Litany of
        Righteousness, Spear of Purity, Weapons Against
        Evil</p><h3>Traits</h3><p>A Shining Beacon, Divine Warrior, Inheritor's
        Immunity, Purity of Faith, Regal Presence, Searing Beacon</p><h2>Unique
        Spell Rules</h2>@Source[PZO9267;pages=83]<p><em></em><br
        /><h3>Cleric/Warpriest</h3></p><p><em>Holy Sword</em> can be prepared as
        a 8th-level spell<br /><em>Good Hope can be prepared as a</em> 4th-level
        spell<br /><em>Mark of Justice</em> can be prepared as a 4th-level
        spell<br /></em></p><h3>Inquisitor</h3><p><em>Holy Sword can be prepared
        as a 6th-level spell<br /></em></p><h3>Paladin</h3><p><em>Good Hope can
        be prepared as a 3rd-level spell<br /><em>Mark of Justice</em> can be
        prepared as a 3rd-level spell</em></p><h2>Unique Summon
        Rules</h2>@Source[PZO9026;pages=71]<br /><strong>Summon Monster
        IV</strong>: Celestial Lion - LG<br /><strong>Summon Monster
        VI</strong>: Celestial Griffon - NG<br /><strong>Summon Nature's Ally
        VI</strong>: Celestial Griffon - NG
