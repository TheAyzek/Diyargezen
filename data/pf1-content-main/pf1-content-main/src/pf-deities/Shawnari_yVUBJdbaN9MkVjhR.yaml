        <h1>Shawnari</h1><h2>The One Out of Place</h2>@Source[PZO1139;pages=132]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Shawnari">Shawnari</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Sahkil Tormentors<br /><strong>Areas
        of Concern</strong> Isolation, loneliness, lost time<br
        /><strong>Domains</strong> Darkness, Evil, Knowledge, Void<br
        /><strong>Subdomains</strong> Fear, Isolation, Loss, Memory<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Sap</p><h3>Obedience</h3><p>Pray alone
        for an hour in a hidden place. Gain a +4 profane bonus on Stealth
        checks.</p><h2>Boons - Sahkil
        Tormentors</h2>@Source[PZO1139;pages=133]<br />Sahkil tormentors hold
        dominion over mortal fears and suffering. All are chaotic evil and range
        in power from CR 21 to CR 25. Their boons are less complex than those of
        other demigods, manifesting as spell-like abilities usable twice per day
        each.<p><strong>1</strong>: <em>invisibility</em><br
        /><strong>2</strong>: <em>modify memory</em><br /><strong>3</strong>:
        <em>repulsion</em></p>
