      content: >-
        <h1>Norgorber</h1><h2>The Reaper of
        Reputation</h2>@Source[PZO9267;pages=108] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Norgorber">Norgorber</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Core Deities<br /><strong>Other
        Pantheons</strong> Ascended Pantheon, Halfling Deities, Taldan
        Pantheon<br /><strong>Areas of Concern</strong> Greed, murder, poison,
        secrets<br /><strong>Domains</strong> Charm, Death, Evil, Knowledge,
        Trickery<br /><strong>Subdomains</strong> Alchemy (Artifice)*,
        Captivation*, Daemon, Deception, Espionage (Knowledge), Espionage
        (Trickery), Greed, Memory, Murder, Shadow (Death), Thievery, Thought<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Short sword<br
        /><strong>Symbol</strong> One-eyed mask<br /><strong>Sacred
        Animal(s)</strong> Spider<br /><strong>Sacred Color(s)</strong> Black,
        gray</p><h3>Obedience</h3><p>While moving through a crowd of people (at
        least six individuals), whisper a prayer to Norgorber so quietly that no
        one hears you. If you suspect a member of the crowd heard you, you must
        follow that individual and prick her with a poisoned needle or other
        sharp implement. If you can't locate a suitable crowd, dig a hole at
        least 6 inches deep in the ground, whisper your prayers into the hole,
        and bury the sound. At the end of your obedience, dip a needle in poison
        and leave it on a road, jutting from a windowsill, or anywhere else a
        passerby might inadvertently prick herself. Gain a +3 profane bonus on
        Bluff checks and on Diplomacy checks to gather
        information.</p><h3>Divine Gift</h3><p>@Source[PZO1141;pages=78] <br
        /><em>Nethys Note: See here for details on how to gain a Divine
        Gift</em><br />Norgorber grants a permanent +1 untyped bonus to
        Dexterity.</p><h3>On Golarion</h3><p><strong>Centers of Worship</strong>
        Absalom, Galt, Nex, Osirion, River Kingdoms, The Shackles, Taldor,
        Varisia<br /><strong>Nationality</strong> Taldan</p><h2>Boons - Deific
        Obedience</h2><h3> Evangelist</h3><p>@Source[PZO9267;pages=108]<br
        /><strong>1: Secrets and Lies (Sp)</strong> <em>comprehend languages
        </em> 3/day, <em>detect thoughts</em> 2/day, or
        <em>clairaudience/clairvoyance </em>1/day<br /><strong>2: Noxious Bomb
        (Ex)</strong> As a full-round action, you can combine a vial of poison
        with a thrown alchemist bomb. The bomb deals normal direct hit and
        splash damage, plus the target of the direct hit must save successfully
        or suffer the effects of the poison. Only contact and injury poisons can
        be used this way. Creatures hit by the bomb's splash damage are
        unaffected by the poison. If you don't have the bomb class feature, this
        boon instead functions the same as poison expertise, the second divine
        boon for sentinels of Norgorber.<br /><strong>3: Secret Self
        (Sp)</strong> Once per day, you can use <em>greater invisibility </em>on
        yourself as a spell-like ability. When you use this spell-like ability,
        you gain certain gifts from Norgorber in addition to the spell effects.
        You gain a +4 profane bonus on Perception checks while invisible. You
        gain a +2 profane bonus on attack rolls made with thrown weapons, ranged
        weapons, and short swords while invisible as well. These bonuses apply
        only when you're using this spell-like ability, not when you're affected
        by any other spell or effect that grants <em>greater invisibility</em>.
        In addition, the invisibility effect lasts for 1 minute/level instead of
        the normal 1
        round/level.</em></p><h3>Exalted</h3><p>@Source[PZO9267;pages=108]<br
        /><strong>1: Poison Tongue (Sp)</strong> <em>command</em> 3/day,
        <em>distressing tone</em><sup>UM</sup> 2/day, or <em>suggestion </em>
        1/day<br /><strong>2: Masterful Poisoner (Ex)</strong> You know the best
        techniques for storing and applying poisons. Your knowledge of the
        proper methods of handling and applying poisons grants them additional
        potency. The saving throw DC of any poison you use increases by 2. This
        effect applies only to poisons you administer directly, including
        applying the poison to a weapon you use. Giving the weapon to another
        person reduces the poison's efficacy back to normal, as the weapon's new
        owner does not have your skill at storing and using the poisoned
        item.<br /><strong>3: Virulent Ally (Sp)</strong> Once per day as a
        standard action, you can summon a piscodaemon (<em>Pathfinder RPG
        Bestiary 2</em> 72) to serve you. The piscodaemon follows your commands
        perfectly for 1 minute for every Hit Die you possess before vanishing
        back to its home in Abaddon. The piscodaemon doesn't follow commands
        that would cause it to act in altruistically good ways, and could attack
        you if a command is particularly
        egregious.</em></p><h3>Sentinel</h3><p>@Source[PZO9267;pages=108]<br
        /><strong>1: Virulence (Sp)</strong> <em>poisoned egg</em> 3/day,
        <em>delay poison</em> 2/day, <em>poison</em> 1/day<br /><strong>2:
        Poison Expertise (Ex)</strong> Long practice has taught you how to
        deftly apply poison during combat. You can apply poison to a weapon or a
        single piece of ammunition as a move action. You never risk exposing
        yourself to the effects of the poison when applying it to the weapon,
        nor do you run the risk of poisoning yourself if you roll a natural 1 on
        an attack roll with a poisoned weapon.<br /><strong>3: Death Strike
        (Ex)</strong> Once per day, you can make a death strike with a melee
        weapon. You must declare your use of this ability before you roll your
        attack. You gain a +4 bonus on your attack roll and deal an extra 1d6
        points of damage for every 4 Hit Dice you possess (maximum 5d6). If your
        death strike reduces the target to negative hit points but doesn't kill
        it outright, the target immediately drops to a negative hit point total
        equal to its Constitution score - 1 (one point away from
        death).</em></p><h2>Antipaladin Code</h2><em>Antipaladins who serve
        Norgorber are secretive and cunning. They prefer to strike from the
        shadows, even when the odds are already in their favor. They rely on
        traps, tricks, ambushes, and poison to weaken their foes. Their code
        reflects a cold and honest assessment of the human condition, and its
        tenets include the following adages. <ul><li>Innocence is ignorance, and
        ignorance is weakness. I will seek to shed my own ignorance, and
        encourage ignorance in my enemies.</li><li>I do not take credit, nor do
        I accept blame. I work always in the shadows.</li><li>A fair fight is
        not worth fighting. I will take every advantage I can. No tool is
        beneath me.</li><li>Cold eyes, cold heart. My enemies can expect no
        mercy from me.</li><li>Everyone is expendable, and I will sacrifice them
        all as necessary.</li><li>Each life I take shapes the future to my
        lord's desires.</li></ul><h2>Divine Fighting
        Technique</h2><h3>Norgorber's Silent
        Shiv</h3><p>@Source[PZO9472;pages=30] <br />Entombed within a volume
        known as <em>The Reaper's Hand</em>, the divine fighting techniques of
        Norgorber are among the most elusive in the Inner Sea region, but are
        theorized to cover the techniques that acolytes of Father Skinsaw use to
        move and strike unseen. Copies of this manual are rare, and those who
        spill its secrets to anyone unworthy often meet a swift and bloody end
        at the hands of the faith's inquisitors.</p><p><strong>Optional
        Replacement</strong>: A neutral evil rogue of at least 2nd level who
        worships Norgorber can replace a rogue talent with the following initial
        benefit.</p><p><strong>Initial Benefit</strong>: Whenever you attack an
        opponent that is completely unaware of your presence (such as when you
        are using the Stealth skill or invisible), your attack deals damage as
        if you were one size category larger. This benefit applies only to the
        first attack that you make against the target, and only with attacks
        made with light or one-handed weapons intended for creatures of your
        size (including thrown attacks).</p><p><strong>Advanced
        Prerequisites</strong>: Divine Fighting Technique, Stealth 10
        ranks.</p><p><strong>Optional Replacement</strong>: A neutral evil rogue
        of at least 10th level who worships Norgorber can replace an advanced
        rogue talent with the following advanced benefit without meeting its
        prerequisites.</p><p><strong>Advanced Benefit</strong>: At the start of
        each round, choose one opponent that you can see and attempt a Stealth
        check as a swift action. If the result of your check exceeds the
        target's CMD, treat the target as if it were completely unaware of your
        presence for the purpose of the initial benefit of this divine fighting
        technique. If you beat the target's CMD by 5 or more, you also treat it
        as being completely unaware of your presence for the purposes of all
        class features and feats you have.</p><h2>For Followers of
        Norgorber</h2><h3>Archetypes</h3><p>Infiltrator (Inquisitor), Poisoner
        (Rogue), Vivisectionist (Alchemist)</p><h3>Feats</h3><p>Poisoner's
        Channel, Reject Poison, Shadow Dodge</p><h3>Magic Items -
        Altars</h3><p>Altar of Norgorber</p><h3>Magic Items -
        Armor</h3><p>Blackfingers Apron, Gray Master's Leathers</p><h3>Magic
        Items - Weapons</h3><p>Assassin's Dagger, Black Alibi</p><h3>Magic Items
        - Wondrous Items</h3><p>Anaphexis Robe, Book of Written Whispers, Dust
        of Disappearance, Flask of the Reaper, Hat of Disguise, Poison Gum,
        Skinsaw Mask</p><h3>Monsters</h3><p>Karumzek, The Stabbing Beast
        (Herald)</p><h3>Spells</h3><p>False Alibi, Lose the Trail, Modify
        Memory, Night of Blades, Poisoned Egg</p><h3>Traits</h3><p>Poisonous
        Slayer, Practiced Deception, Secret Knowledge, Shadow Whispers,
        Venom-Drenched</p><h2>Unique Spell
        Rules</h2>@Source[PZO9267;pages=115]<p><h3>Antipaladin</h3></p><p><em>Clairaudience/Clairvoyance</em>
        can be prepared as a 2nd-level spell [Gray Master worshippers
        only]</p><h3>Cleric/Warpriest</h3><p><em>Pernicious Poison</em> can be
        prepared as a 2nd-level spell [Blackfingers worshippers only]<br
        /><em>Nondetection can be prepared as a</em> 3rd-level spell [Reaper of
        Reputation worshippers only]<br /><em>Circle of Death</em> can be
        prepared as a 6th-level spell [Father Skinsaw worshippers only]<br
        /><em>Clairaudience/Clairvoyance</em> can be prepared as a 3rd-level
        spell [Gray Master worshippers only]<br /></em></p><h2>Unique Summon
        Rules</h2>@Source[PZO9059;pages=75]<br /><strong>Summon Monster
        III</strong>: Human Natural Wererat Rogue 2 (extraplanar)<br
        /><strong>Summon Monster IV</strong>: Choker (extraplanar)<br
        /><strong>Summon Monster V</strong>: Shadow Mastiff
