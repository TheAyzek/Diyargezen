        <h1>Braismois</h1><h2>The Toxic Quill</h2>@Source[PZO9267;pages=318] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Braismois">Braismois</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Broken deals, fine print, unfair bargains<br
        /><strong>Domains</strong> Evil, Knowledge, Rune, Trickery<br
        /><strong>Subdomains</strong> Daemon, Deception, Language, Memory<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Light mace<br
        /><strong>Symbol</strong> Poison-dripping quill<br /><strong>Sacred
        Animal(s)</strong> Weasel<br /><strong>Sacred Color(s)</strong> Black,
        green</p><h3>Obedience</h3><p>Craft a one-sided contract. Gain a +4
        profane bonus on saving throws against mind-affecting
        effects.</p><h2>Boons - Daemon
        Harbingers</h2><p>@Source[PZO1139;pages=112]</p><p>Abaddon's unique
        daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>detect thoughts</em><br
        /><strong>2</strong>: <em>charm monster</em><br /><strong>3</strong>:
        <em>geas/quest</em></p>
