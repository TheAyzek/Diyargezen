      content: >-
        <h1>Quindiovatos</h1><h2>The Vicious
        Guest</h2>@Source[PZO9267;pages=326] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Quindiovatos">Quindiovatos</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Exploration, gems, legends<br
        /><strong>Domains</strong> Glory, Earth, Evil, Law<br
        /><strong>Subdomains</strong> Devil (Evil), Devil (Law), Exploration,
        Honor, Metal<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Rapier<br
        /><strong>Symbol</strong> Handful of bloody gems<br /><strong>Sacred
        Animal(s)</strong> Cuckoo<br /><strong>Sacred Color(s)</strong> Green,
        red</p><h3>Obedience</h3><p>Find a small stretch of land, claim it as
        your own for the day, and sprinkle bloody gems over its expanse. Gain a
        +4 profane bonus on saving throws against compulsion
        effects.</p><h2>Boons - Infernal Dukes</h2>@Source[PZO1139;pages=118]<br
        />The Lords of Hell, the Dukes of Perdition, and the Princes of
        Damnation are all names for the infamous nobility of the Pit- the elite
        caste of devilkind known as the infernal dukes.<p> All infernal dukes
        are lawful evil and range in power from CR 26 to CR 27. The boons they
        grant are less complex than those granted by archdevils, manifesting as
        spell-like abilities usable once per day each.</p><p><strong>1</strong>:
        <em>tongues</em><br /><strong>2</strong>: <em>wind walk</em><br
        /><strong>3</strong>: <em>freedom</em></p><h2>For Followers of
        Quindiovatos</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
