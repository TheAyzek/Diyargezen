        <h1>Xiquiripat</h1><h2>The Flying Scab</h2>@Source[PZO1139;pages=132]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Xiquiripat">Xiquiripat</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Sahkil Tormentors<br /><strong>Areas
        of Concern</strong> Evisceration, fatal falls, genocide<br
        /><strong>Domains</strong> Air, Destruction, Evil, War<br
        /><strong>Subdomains</strong> Blood, Fear, Rage, Wind<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong>
        Terbutje</p><h3>Obedience</h3><p>Savagely eviscerate a creature smaller
        than yourself or throw such a creature from a deadly height. Gain a +1
        profane bonus on damage rolls.</p><h2>Boons - Sahkil
        Tormentors</h2>@Source[PZO1139;pages=133]<br />Sahkil tormentors hold
        dominion over mortal fears and suffering. All are chaotic evil and range
        in power from CR 21 to CR 25. Their boons are less complex than those of
        other demigods, manifesting as spell-like abilities usable twice per day
        each.<p><strong>1</strong>: <em>create pit</em><br /><strong>2</strong>:
        <em>greater oneiric horror</em><br /><strong>3</strong>: <em>blade
        barrier</em></p>
