      content: >-
        <h1>Pharasma</h1><h2>Lady of Graves</h2>@Source[PZO9267;pages=116] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Pharasma">Pharasma</a><h3>Details</h3><p><strong>Alignment</strong>
        N<br /><strong>Pantheon</strong> Core Deities<br /><strong>Other
        Pantheons</strong> Deities of Tian Xia<br /><strong>Areas of
        Concern</strong> Birth, death, fate, prophecy<br
        /><strong>Domains</strong> Death, Healing, Knowledge, Repose, Water<br
        /><strong>Subdomains</strong> Ancestors, Flowing, Ice, Memory,
        Psychopomp (Death), Psychopomp (Repose), Resurrection, Souls, Thought<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Dagger<br /><strong>Symbol</strong>
        Spiraling comet<br /><strong>Sacred Animal(s)</strong> Whippoorwill<br
        /><strong>Sacred Color(s)</strong> Blue,
        white</p><h3>Obedience</h3><p>Collect small bones whenever it is
        convenient and respectful to do so. When it comes time to perform your
        obedience, lay out the bones in a spiral. At one end of the spiral lay a
        slip of parchment on which you have written the name of someone newly
        born. At the other end of the spiral, lay a slip of parchment on which
        you have written the name of someone newly deceased. Chant hymns from
        <em>The Bones Land in a Spiral</em> while proceeding solemnly around the
        spiral, trailing a black scarf on the ground behind you. Gain a +2
        profane or sacred bonus on attack rolls made with daggers. The type of
        bonus depends on your alignment-if you're neither good nor evil, you
        must choose either sacred or profane the first time you perform your
        obedience, and this choice can't be changed.</p><h3>Divine
        Gift</h3><p>@Source[PZO1141;pages=79] <br /><em>Nethys Note: See here
        for details on how to gain a Divine Gift</em><br />The recipient is not
        affected by the next effect, damage, or other event that would otherwise
        kill him.</p><h3>On Golarion</h3><p><strong>Centers of Worship</strong>
        Brevoy, Nex, Osirion, The Shackles, Thuvia, Ustalav, Varisia<br
        /><strong>Nationality</strong> Garundi</p><h2>Boons - Deific
        Obedience</h2><h3>
        Evangelist</h3><p>@Source[PZO9267;pages=116]<em></em><br /><strong>1:
        Preserver (Sp)</strong> <em>sanctuary</em> 3/day, <em>gentle repose</em>
        2/day, or <em>speak with dead</em> 1/day<br /><strong>2: Decomposition
        (Su)</strong> You can ensure the final rest of a creature. As a standard
        action, you can touch a corpse and cause it to dissolve into black ash.
        A corpse dissolved this way cannot be raised as an undead creature by
        any means short of a <em>miracle or <em>wish</em>. The black ash left
        behind can, however, be used as the 'corpse' for spells that return the
        dead to true life-such as <em>raise dead</em>-as long as the entire
        collection of ash is kept together.<br /><strong>3: The Veil Is Drawn
        Aside (Su)</strong> You gain the Extra Revelation feat, choosing a
        revelation from either your chosen mystery or the Bones mystery. If you
        don't have the revelation class feature, you instead gain a +4 sacred or
        profane bonus on saving throws against necromancy spells and death
        effects.</em></p><h3>Exalted</h3><p>@Source[PZO9267;pages=116]<br
        /><strong>1: Quietude (Sp)</strong> <em>forced quiet</em><sup>UM</sup>
        3/day, <em>silence</em> 2/day, or <em>hold person</em> 1/day<br
        /><strong>2: Strike the Unrestful (Su)</strong> As a free action, you
        can grant the <em>ghost touch </em>weapon special ability to a weapon
        that you hold. If that weapon is not magical, it is considered magical
        while under the effect of this ability. This ability affects only
        weapons held in your hand; if you drop the weapon or give it away, the
        effect ends on that weapon. You can affect a weapon in this way a number
        of rounds each day equal to 1 + 1 for every 4 Hit Dice you possess
        (maximum 6 rounds). These rounds don't need to be consecutive.<br
        /><strong>3: Ally from the Tomb (Sp)</strong> Once per day as a standard
        action, you can summon a pair of vanth psychopomps (<em>Pathfinder RPG
        Bestiary</em> 4</em> 221) and gain telepathy with them to a range of 100
        feet. The vanths follow your commands perfectly for 1 minute for every
        Hit Die you possess before vanishing back to their home in the Boneyard.
        The vanths don't follow commands that would cause them to aid or permit
        the existence of undead, and they could attack you if the command is
        particularly
        egregious.</em></p><h3>Sentinel</h3><p>@Source[PZO9267;pages=116]<br
        /><strong>1: Undead Slayer (Sp)</strong> <em>hide from undead</em>
        3/day, <em>defending bone</em> 2/day, or <em>halt undead</em> 1/day<br
        /><strong>2: Disrupting Strike (Su)</strong> Three times per day, you
        can channel disruptive energy through your weapon against an undead
        creature. You must declare your use of this ability before you roll your
        attack. If your attack hits an undead creature, you deal an extra 1d6
        points of damage plus 1d6 points of damage for every 4 Hit Dice you
        possess (maximum 6d6). If your attack misses or your target was not an
        undead creature, the use of the ability is wasted.<br /><strong>3:
        Tethered to the Material (Ex)</strong> You cling ferociously to life-you
        will go to Pharasma's realm when she calls you and no sooner. Once per
        day, you can send yourself into a determined state that lasts for 1
        minute. While in this determined state, you can fall to a number of
        negative hit points equal to 10 + your Constitution score before you
        die. If you drop to negative hit points while in this determined state,
        you can continue to act normally, and do not bleed each round due to
        taking actions. If your determined state ends while you still have a
        number of negative hit points equal to or greater than your Constitution
        score, you die instantly. If your determined state ends while you still
        have negative hit points, but the number of negative hit points is not
        equal to or greater than your Constitution score, you fall unconscious
        and gain the dying condition as normal.</em></p><h2>For Followers of
        Pharasma</h2><h3>Archetypes</h3><p><em>Exorcist (Inquisitor), Fated
        Guide (Spiritualist), Seer (Oracle), Stoic Caregiver
        (Cleric)</em></p><h3>Feats</h3><p><em>Eerie Sense, Fateful Channel,
        Messenger of Fate</em></p><h3>Magic Items - Altars</h3><p><em>Altar of
        Pharasma</em></p><h3>Magic Items - Armor</h3><p><em>Gravewatcher
        Chainmail</em></p><h3>Magic Items - Rings</h3><p><em>Ghost Battling
        Ring, Ring of the Faithful Dead</em></p><h3>Magic Items -
        Sets</h3><p><em>Pharasma's Command</em></p><h3>Magic Items -
        Weapons</h3><p><em>Fate Blade, Lady's Spiral,
        Nightpiercer</em></p><h3>Magic Items - Wondrous Items</h3><p><em>Crystal
        Ball (Detect Thoughts), Fate's Shears, Icon of the Midwife, Lady's
        Mercy, Crystal Ball (Normal), Crystal Ball (See Invisibility), Stone of
        Tomb Warding, Crystal Ball (Telepathy), Crystal Ball (True
        Seeing)</em></p><h3>Monsters</h3><p><em>Ahmuuth, Steward of the Skein
        (Herald)</em></p><h3>Prestige Classes</h3><p><em>Mortal
        Usher</em></p><h3>Spells</h3><p><em>Defending Bone, Early Judgment,
        Funereal Weapon, Necrostasis, Preserve, Smite Abomination, Spiral
        Ascent, Spiral Descent</em></p><h3>Traits</h3><p><em>Corpse Hunter,
        Spirit Guide, Stabilizing Touch, Undead Slayer
        (Pharasma)</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9267;pages=123]<em></em><br
        /><h3>Adept</h3><p><em>Augury</em> can be prepared as a 2nd-level
        spell<br /><em>Death Knell can be prepared as a</em> 2nd-level spell<br
        /><em>Speak with Dead</em> can be prepared as a 3rd-level spell<br
        /></em></p><h3>Bard</h3><p><em>Augury can be prepared as a</em>
        2nd-level spell<br /><em>Death Knell</em> can be prepared as a 2nd-level
        spell<br /><em>Speak with Dead can be prepared as a</em> 3rd-level
        spell<br /></em></p><h3>Cleric/Warpriest</h3><p><em>False Life</em> can
        be prepared as a 2nd-level spell<br /><em>Clairaudience/Clairvoyance can
        be prepared as a 3rd-level spell<br /><em>Moment of Prescience</em> can
        be prepared as a 8th-level spell<br
        /></em></p><h3>Inquisitor</h3><p><em>Augury can be prepared as a
        2nd-level spell<br /><em>False Life</em> can be prepared as a 2nd-level
        spell<br /><em>Clairaudience/Clairvoyance can be prepared as a 3rd-level
        spell<br /><em>Moment of Prescience</em> can be prepared as a 6th-level
        spell<br /></em></p><h3>Oracle</h3><p><em>False Life can be prepared as
        a 2nd-level spell<br /><em>Clairaudience/Clairvoyance</em> can be
        prepared as a 3rd-level spell<br /><em>Moment of Prescience can be
        prepared as a 8th-level spell<br
        /></em></p><h3>Ranger</h3><p><em>Augury</em> can be prepared as a
        2nd-level spell<br /><em>Death Knell can be prepared as a</em> 2nd-level
        spell<br /><em>Speak with Dead</em> can be prepared as a 3rd-level
        spell<br /></em></p><h3>Sorcerer</h3><p><em>Augury can be prepared as a
        2nd-level spell<br /><em>Death Knell</em> can be prepared as a 2nd-level
        spell<br /><em>Speak with Dead can be prepared as a</em> 3rd-level
        spell<br /></em></p><h3>Wizard</h3><p><em>Augury</em> can be prepared as
        a 2nd-level spell<br /><em>Death Knell can be prepared as a</em>
        2nd-level spell<br /><em>Speak with Dead</em> can be prepared as a
        3rd-level spell</em></p><h2>Unique Summon
        Rules</h2>@Source[PZO9044;pages=69]<br /><strong>Summon Monster
        III</strong>: Nosoi<br /><strong>Summon Monster VI</strong>: Vanth<br
        /><strong>Summon Monster I</strong>: Whippoorwill (uses eagle
        statistics)<br /><strong>Summon Nature's Ally I</strong>: Whippoorwill
        (uses eagle statistics)<br /><h2>Other
        Rules</h2>@Source[PZO9267;pages=123]<br />Since Pharasma despises
        undead, Pharasmin clerics with the Death domain replace the <em>animate
        dead domain spell with <em>speak with dead</em>, replace <em>create
        undead </em>with <em>antilife shell, and replace <em>create greater
        undead with <em>symbol of death. Clerics with the Souls subdomain
        (<em>Advanced Player's Guide </em>96) replace the <em>animate dead
        domain spell with <em>speak with dead</em>.
      format: 1
