      content: >-
        <h1>Mrtyu</h1><h2>Death's Consort</h2>@Source[PZO92114;pages=12] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Mrtyu">Mrtyu</a><h3>Details</h3><p><strong>Alignment</strong>
        N<br /><strong>Pantheon</strong> Psychopomp Usher<br /><strong>Areas of
        Concern</strong> Poetry, trauma, and war<br /><strong>Domains</strong>
        Charm, Death, Repose, War<br /><strong>Subdomains</strong> N/A<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Greatsword<br
        /><strong>Symbol</strong> A circle with five curved lines extending from
        it</p><h3>Obedience</h3><p>Hear confessions of the dying or spend at
        least 1 hour burying the dead after a battle. If there are no dying or
        dead people in the area, spend the hour uttering prayers for the last
        dead person you encountered. Gain a +4 insight bonus on saving throws
        against spells that affect multiple creatures.</p><h2>Boons - Monitor
        Obedience</h2><h3>None</h3><p>@Source[PZO92114;pages=12]<br /><strong>1:
        Ruled by Passion (Sp)</strong> <em>remove fear</em> 3/day, <em>aid</em>
        2/day, or <em>detect desires</em> 1/day<br /><strong>2: Death's Lover
        (Ex)</strong> You gain Diplomacy and Sense Motive as class skills, and
        you gain a bonus on checks using these skills equal to half your Hit
        Dice.<br /><strong>3: Hands of Death (Su)</strong> Once per day, you can
        call upon a whirling mass of daggers and swords that functions as a
        <em>blade barrier</em>. This effect lasts only 1 round per Hit Die, but
        you can direct it to move up to 30 feet or reshape itself from a wall to
        circle once each round as a move action.</em></p><h2>For Followers of
        Mrtyu</h2><h3>Prestige Classes</h3><p><em>Mortal Usher</em></p>
