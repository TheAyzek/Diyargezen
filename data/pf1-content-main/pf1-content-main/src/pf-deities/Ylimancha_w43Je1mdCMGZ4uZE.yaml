      content: >-
        <h1> Ylimancha</h1><h2>Harborwing</h2>@Source[PZO9267;pages=324] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Ylimancha">Ylimancha</a><h3>Details</h3><p><strong>Alignment</strong>
        NG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Coastal waters, fisherfolk, flying creatures<br
        /><strong>Domains</strong> Air, Animal, Good, Water<br
        /><strong>Subdomains</strong> Agathion, Feather, Oceans, Wind<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Longbow<br /><strong>Symbol</strong>
        Golden seagull<br /><strong>Sacred Animal(s)</strong> Seagull<br
        /><strong>Sacred Color(s)</strong> Blue,
        gold</p><h3>Obedience</h3><p>Wrap yourself in a robe of feathers and
        immerse yourself in saltwater, holding your breath for as long as
        possible. Climb out of the water, kneel down, and pray until the robe
        dries. Gain a +4 sacred bonus on saving throws against effects with the
        water descriptor and effects from flying creatures.</p><h2>Boons -
        Celestial Obedience</h2><h3>Mystery
        Cultist</h3><p>@Source[PZO9255;pages=28]<br /><strong>1: Winged Blessing
        (Sp)</strong> <em>feather fall</em> 3/day, <em>levitate</em> 2/day, or
        <em>water breathing</em> 1/day<br /><strong>2: Aspect of the Wind
        (Su)</strong> Avian wings sprout from your back, granting you a fly
        speed of 30 feet with average maneuverability.<br /><strong>3: Body of
        Water (Su)</strong> Your body becomes permanently fluid and malleable,
        making you immune to critical hits and sneak attacks. In addition, you
        can move through an area as small as one-quarter your space without
        squeezing or one-eighth your space when squeezing.</em></p><h2>For
        Followers of Ylimancha</h2><h3>Feats</h3><p><em>Heroic
        Interposition</em></p><h3>Magic Items - Wondrous
        Items</h3><p><em>Harborwing Cloak</em></p><h3>Traits</h3><p><em>Empyreal
        Focus</em></p>
