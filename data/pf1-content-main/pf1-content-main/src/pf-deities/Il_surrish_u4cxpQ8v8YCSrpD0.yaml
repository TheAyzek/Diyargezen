        <h1>Il'surrish</h1><h2>The Wanderer</h2>@Source[PZO92114;pages=8] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Il'surrish">Il'surrish</a><h3>Details</h3><p><strong>Alignment</strong>
        CN<br /><strong>Pantheon</strong> Protean Lord<br /><strong>Areas of
        Concern</strong> Formlessness, loss of control, and potential<br
        /><strong>Domains</strong> Animal, Artifice, Chaos, Plant<br
        /><strong>Subdomains</strong> N/A<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Unarmed
        strike<br /><strong>Symbol</strong> Cerulean sphere dotted with
        stars</p><h3>Obedience</h3><p>Immerse yourself in flowing water, leaving
        only your mouth or nose above the surface, and whisper prayers as the
        current whisks you away, praying until you wash ashore. Gain a +4 sacred
        bonus to CMD and on saving throws against effects that impede
        movement.</p><h2>Boons - Monitor
        Obedience</h2><h3>None</h3><p>@Source[PZO92114;pages=8]<br /><strong>1:
        Wanderer's Grace (Sp)</strong> <em>true strike</em> 3/day, <em>daze
        monster</em> 2/day, or <em>gaseous form</em> 1/day<br /><strong>2:
        Wanderer's Bane (Su)</strong> Once per day, you can cause a creature
        within 30 feet of you to become paralyzed for 1d4+2 rounds. A target
        that succeeds at a Will save (DC = 10 + half your HD + your Charisma
        modifier) is instead dazed for 1 round.<br /><strong>3: Formlessness
        (Su)</strong> Once per day for a number of rounds equal to your Hit
        Dice, you and your equipment take on a fluid consistency, glowing with
        an inner cerulean light. You gain DR 20/slashing, and your reach
        increases by 10 feet. In addition, you gain the compression universal
        monster ability and a fly speed of 60 feet (perfect). Finally, for the
        duration of the effect, you also gain the benefits of a <em>cloak of
        chaos</em>.</em></p>
