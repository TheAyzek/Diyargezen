        <h1>Mneoc</h1><h2>Grandfather Scab</h2>@Source[PZO9267;pages=318] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Mneoc">Mneoc</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Aging pains, organ failure, senility<br
        /><strong>Domains</strong> Death, Evil, Liberation, Rune<br
        /><strong>Subdomains</strong> Daemon, Fear, Isolation, Undead<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Dagger<br /><strong>Symbol</strong>
        Cracked mirror<br /><strong>Sacred Animal(s)</strong> Vulture<br
        /><strong>Sacred Color(s)</strong> Gray,
        white</p><h3>Obedience</h3><p>Trick an elderly creature into believing
        it has forgotten something. Gain a +4 profane bonus on saving throws
        against disease and effects related to memory.</p><h2>Boons - Daemon
        Harbingers</h2><p>@Source[PZO1139;pages=114]</p><p>Abaddon's unique
        daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>false life</em><br
        /><strong>2</strong>: <em>modify memory</em><br /><strong>3</strong>:
        <em>age resistance</em></p>
