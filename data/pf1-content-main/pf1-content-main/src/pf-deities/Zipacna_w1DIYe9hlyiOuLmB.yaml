        <h1>Zipacna</h1><h2>The Mountain Below</h2>@Source[PZO1139;pages=132]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Zipacna">Zipacna</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Sahkil Tormentors<br /><strong>Areas
        of Concern</strong> Avoiding responsibility, shifting earth, violence<br
        /><strong>Domains</strong> Earth, Evil, Fire, Strength<br
        /><strong>Subdomains</strong> Ash, Corruption, Fear, Ferocity<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong>
        Tepoztopilli</p><h3>Obedience</h3><p>In a completely dark space,
        meditate on how you can shirk your duties to focus on your wants, or how
        you can intimidate another person to do something for you. Gain a +4
        profane bonus on Intimidate checks.</p><h2>Boons - Sahkil
        Tormentors</h2>@Source[PZO1139;pages=133]<br />Sahkil tormentors hold
        dominion over mortal fears and suffering. All are chaotic evil and range
        in power from CR 21 to CR 25. Their boons are less complex than those of
        other demigods, manifesting as spell-like abilities usable twice per day
        each.<p><strong>1</strong>: <em>bull's
        strength</em></p><p><strong>2</strong>: <em>confusion</em><br
        /><strong>3</strong>: <em>move earth</em></p>
