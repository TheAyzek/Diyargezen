        <h1>Nocticula</h1><h2>Our Lady in Shadow</h2>@Source[PZO9267;pages=320]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Nocticula">Nocticula</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Assassins, darkness, lust<br /><strong>Domains</strong>
        Chaos, Charm, Darkness, Evil<br /><strong>Subdomains</strong> Demon
        (Chaos), Demon (Evil), Loss, Lust, Night, Shadow (Darkness)<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Hand crossbow<br
        /><strong>Symbol</strong> Thorny pointed crown<br /><strong>Sacred
        Animal(s)</strong> Bat<br /><strong>Sacred Color(s)</strong> Black,
        pink</p><h3>Obedience</h3><p>Ingest a dose of psychedelic plants or
        fungi and engage in any number of sexual acts (either alone or with
        others), during which at least a pint of blood must be shed. Gain a +4
        profane bonus on saves against blindness and charm effects.</p><h2>Boons
        - Demonic Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=21]<br
        /><strong>1: The Lady's Charms (Sp)</strong> <em>charm person</em>
        3/day, <em>darkness</em> 2/day, or <em>suggestion</em> 1/day<br
        /><strong>2: Instant Blindness (Sp)</strong> Three times per day, you
        can cast quickened <em>blindness/deafness</em>.<br /><strong>3: Dominate
        Thrall (Sp)</strong> Once per day, you may cast <em>dominate
        monster</em>. You may only have one creature dominated at a time via
        this effect, but the effects are permanent until you dominate a new
        target, at which point the previous target is released from domination
        but is stunned for 1d4 rounds.</em></p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=82]<br
        /><strong>1: Kiss of the Succubus (Sp)</strong> <em>unnatural lust </em>
        3/day, <em>detect thoughts</em> 2/day, or <em>vampiric touch</em>
        1/day<br /><strong>2: Tempting Flesh (Su)</strong> You can shape your
        flesh into seductive forms. You gain the change shape universal monster
        ability, usable once per day as a standard action, allowing you to take
        the shape of any Small or Medium humanoid. Your natural form becomes
        beautiful and sexually appealing, and you gain horns, a pointed tail,
        and small wings. While in your natural form, you gain a tiefling's
        darkvision and fiendish resistance racial traits as well as the
        prehensile tail and vestigial wings alternate racial traits. If you're
        already a tiefling, you gain a +2 bonus to Charisma instead of these
        additional tiefling traits. In any form, you gain a +4 bonus on Bluff
        checks to deceive or lie.<br /><strong>3: Deadly Caress (Su)</strong>
        Like with a succubus, romantic or sexual contact with you can be deadly.
        When you engage in an act of passion (such as a kiss) with another
        creature, you bestow one negative level upon that creature. You must
        grapple an unwilling creature to use this ability on them. Such an act
        of passion also has the effect of a <em>suggestion</em> spell asking the
        victim to accept another act of passion. The DC of this suggestion, as
        well as the DC to remove any negative levels bestowed this way, is equal
        to 10 + half your Hit Dice + your Charisma modifier. You can initially
        activate this ability only once per day, but once you do so to target a
        specific creature, you can affect that creature with this ability at
        will.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=82]<br
        /><strong>1: The Lady's Charms (Sp)</strong> <em>charm person</em>
        3/day, <em>darkness</em> 2/day, or <em>suggestion</em> 1/day<br
        /><strong>2: Instant Blindness (Sp)</strong> Three times per day, you
        can cast quickened <em>blindness/deafness as a spell-like
        ability.</em><br /><strong>3: Dominate Thrall (Sp)</strong> Once per
        day, you can cast <em>dominate monster</em> as a spell-like ability. You
        can have only one creature dominated at a time via this effect, but the
        effects are permanent until you dominate a new target, at which point
        the previous target is released from domination but is stunned for 1d4
        rounds.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=82]<br
        /><strong>1: Murder Walks Unseen (Sp)</strong> <em>vanish</em> 3/day,
        <em>invisibility</em> 2/day, or <em>twilight knife</em> 1/day<br
        /><strong>2: Right behind You (Ex)</strong> You gain sneak attack +2d6;
        this stacks with sneak attack dice from other sources. Whenever you make
        a sneak attack against a creature that is aware of your presence and
        considers you an ally, your sneak attack dice are increased to d10s;
        this applies to both sneak attack dice gained through this boon and
        those from other sources.<br /><strong>3: Death Is But a Word
        (Sp)</strong> Your devotion to Nocticula is rewarded with a single
        whisper from her lips to your ear alone, revealing one of the countless
        words Our Lady in Shadow knows to cause death. Each of her worshipers
        receives a unique word. When you learn it, you can use the word to cast
        <em>power word kill</em> as a spell-like ability once per
        day.</em></p><h2>For Followers of
        Nocticula</h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic
        Items - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Traits</h3><p><em>Demonic Persuasion</em></p>
