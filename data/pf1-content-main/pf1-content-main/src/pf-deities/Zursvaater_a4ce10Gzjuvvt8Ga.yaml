      content: >-
        <h1> Zursvaater</h1><h2>Prince of Steel</h2>@Source[PZO9095;pages=66]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Zursvaater">Zursvaater</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Giant Deities<br /><strong>Areas of
        Concern</strong> Conquest, slavery, weapons<br
        /><strong>Domains</strong> Evil, Fire, Law, Trickery, War<br
        /><strong>Subdomains</strong> Ash, Blood, Slavery, Tyranny<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Greatsword<br
        /><strong>Symbol</strong> Helm with huge fangs<br /><strong>Sacred
        Animal(s)</strong> Saber-toothed tiger<br /><strong>Sacred
        Color(s)</strong> Black, orange</p><h3>Obedience</h3><p>Immerse yourself
        in lava or a roaring flame for one hour. During the first half hour,
        recite passages from the <em>Law of the Shield</em> and meditate upon
        how your god's will guides your actions. Divide the remainder of the
        hour between recounting the orders and obligations that your superiors
        have given you, and planning the orders you will give your subordinates
        on the following day. You gain a +4 profane bonus on saving throws
        against spells and effects with the cold descriptor.</p><h2>Boons -
        Deific Obedience</h2><h3>
        Evangelist</h3><p>@Source[PZO9095;pages=67]<em></em><br /><strong>1:
        Slave-Taker's Tools (Sp)</strong> <em>command</em> 3/day, <em>stoke the
        inner fire</em> 2/day, or <em>chain of perdition</em><sup>UC</sup>
        1/day<br /><strong>2: Sense Slaves (Ex)</strong> You gain the scent
        ability, but only with respect to humanoids. You gain a +2 favored enemy
        bonus against humanoids, which stacks with any favored enemy bonus you
        already possess against humanoids.<br /><strong>3: Searing Strike
        (Su)</strong> Once per day, you can channel the Prince of Steel's power
        through your weapon as a free action. You must declare your use of this
        ability before you make an attack roll. On a hit, the weapon creates a
        burst of fire. Your target takes 5d6 points of fire damage and catches
        on fire unless it succeeds at a Reflex save (DC 10 + 1/2 your HD + your
        Charisma modifier). If the target catches on fire, it takes an
        additional 2d6 points of fire damage each round until it succeeds at a
        Reflex save at the original DC. All fire damage from searing strike
        ignores fire resistance, but not fire
        immunity.</em></p><h3>Exalted</h3><p>@Source[PZO9095;pages=67]<br
        /><strong>1: Tyrant's Weapons (Sp)</strong> <em>bane</em> 3/day,
        <em>dread bolt</em><sup>UM</sup> 2/day, or <em>protection from
        energy</em> 1/day<br /><strong>2: Fiery Fangs (Su)</strong> Two fangs
        made of fire emerge from your mouth. Twice per day as part of casting a
        spell or using a spell-like ability, you may remove one of these fangs
        and use it to augment that spell or spell-like ability; this counts as
        adding a somatic component to the casting. This augmentation acts as
        your choice of one of the following metamagic feats: Bouncing
        Spell<sup>APG</sup>, Elemental Spell<sup>APG</sup> (fire only), Enlarge
        Spell, Extend Spell, or Silent Spell. The fangs are insubstantial, and
        cannot be used to make a bite attack.<br /><strong>3: Burning Bladestorm
        (Sp)</strong> You can create a whirling curtain of blades of fire and
        steel. This ability acts like a <em>blade barrier cast by a cleric but
        also sends out waves of heat like a <em>wall of fire. Fire giants may
        pass through the blades without taking any damage. Humanoid creatures
        killed by this ability rise as uncontrolled burning
        skeletons.</em></p><h3>Sentinel</h3><p>@Source[PZO9095;pages=67]<br
        /><strong>1: Might Makes Right (Sp)</strong> <em>protection from good
         </em> 3/day, <em>weapon of awe</em><sup>APG</sup> 2/day, or <em>deadly
        juggernaut</em><sup>UC</sup> 1/day<br /><strong>2: Knight of Arms
        (Ex)</strong> You may treat any weapon as if you were proficient in it
        and had the Weapon Focus feat for that weapon. If you already have
        Weapon Focus for that weapon, your critical hits with that weapon cause
        the target to bleed as if you had the Bleeding Critical feat; half this
        bleed damage is fire damage.<br /><strong>3: Pyroclastic Champion
        (Su)</strong> Zursvaater infuses you with more of his essence. As a free
        action, you can surround your body in an aura of fire that ignites any
        combustible object you touch, and provides you with cold resistance 20.
        Any time you deal fire damage with a natural or manufactured weapon
        (including magic weapons), double the amount of fire damage that you
        would normally deal. This damage increase doesn't apply to fire damage
        from spells or spell-like abilities.</em></p><h2>For Followers of
        Zursvaater</h2><h3>Magic Items - Altars</h3><p><em>Altar of
        Zursvaater</em></p><h3>Spells</h3><p><em>Stoke the Inner
        Fire</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9095;pages=66]</em><br
        /><h3>Cleric/Warpriest</h3><p><em>Burning Gaze can be prepared as a
        2nd-level spell<br /><em>Wall of Lava</em> can be prepared as a
        8th-level spell<br /></em></p><h3>Inquisitor</h3><p><em>Burning
        Gaze</em> can be prepared as a 2nd-level spell</em></p><h2>Unique Summon
        Rules</h2>@Source[PZO9095;pages=67]<br /><strong>Summon Monster
        I</strong>: Burning Human Skeleton (extraplanar)<br /><strong>Summon
        Monster III</strong>: Thoqqua<br /><strong>Summon Monster VI</strong>:
        Burning Fire Giant Skeleton (extraplanar)
