        <h1>Chadali</h1><h2>The Serendipitous
        Path</h2>@Source[PZO9267;pages=322] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Chadali">Chadali</a><h3>Details</h3><p><strong>Alignment</strong>
        CG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Fate, safety, serendipity<br /><strong>Domains</strong>
        Chaos, Good, Luck, Protection<br /><strong>Subdomains</strong> Azata
        (Chaos), Azata (Good), Defense, Fate, Purity<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Net<br /><strong>Symbol</strong> Symmetrical water
        lily<br /><strong>Sacred Animal(s)</strong> Gecko<br /><strong>Sacred
        Color(s)</strong> Orange, yellow</p><h3>Obedience</h3><p>Deliberately
        lose yourself in a strange place. If there is nowhere for you to lose
        yourself, blindfold yourself and wander boldly for 200 steps. Gain a +4
        sacred bonus to AC against attacks of opportunity provoked by casting
        spells or using spell-like abilities.</p><h2>Boons - Celestial
        Obedience</h2><h3>Mystery Cultist</h3><p>@Source[PZO9255;pages=10]<br
        /><strong>1: Confident Step (Sp)</strong> <em>pass without trace</em>
        3/day, <em>aid</em> 2/day, or <em>protection from energy</em> 1/day<br
        /><strong>2: Serendipitous Reaction (Su)</strong> Three times per day,
        you can knock aside a ranged attack that would have otherwise hit you,
        as if you had the Deflect Arrows feat. You need not be aware of the
        attack to use this ability. If you already have Deflect Arrows, you may
        use this feat an unlimited number of times per day, and can use it even
        if you are unaware of an attack.<br /><strong>3: Quickstep (Su)</strong>
        Once per day, when you would be reduced to 0 or fewer hit points for any
        reason, you can choose to ignore up to 10 points of damage from the
        attack or effect that so damaged you, possibly putting you back above 0
        hit points.</em></p><h2>For Followers of
        Chadali</h2><h3>Feats</h3><p><em>Heroic
        Interposition</em></p><h3>Traits</h3><p><em>Empyreal Focus</em></p>
