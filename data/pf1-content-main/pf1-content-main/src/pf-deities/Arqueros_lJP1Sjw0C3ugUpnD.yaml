      content: >-
        <h1>Arqueros</h1><h2>The Golden Bulwark</h2>@Source[PZO9267;pages=322]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Arqueros">Arqueros</a><h3>Details</h3><p><strong>Alignment</strong>
        LG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Bodyguards, protection, watchfulness<br
        /><strong>Domains</strong> Good, Law, Protection, War<br
        /><strong>Subdomains</strong> Archon (Good), Archon (Law), Cooperation,
        Defense, Fortifications, Tactics<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong>
        Longspear<br /><strong>Symbol</strong> Gauntlet and briars<br
        /><strong>Sacred Animal(s)</strong> Golden eagle<br /><strong>Sacred
        Color(s)</strong> Gold, purple</p><h3>Obedience</h3><p>Pray while
        holding a heavy shield over your head for an hour. Gain a +4 sacred
        bonus on Strength checks and Strength-based skill checks.</p><h2>Boons -
        Celestial Obedience</h2><h3>Mystery
        Cultist</h3><p>@Source[PZO9255;pages=6]<br /><strong>1: Divine Defense
        (Sp)</strong> <em>shield of faith</em> 3/day, <em>shield other</em>
        2/day, or <em>magic vestment</em> 1/day<br /><strong>2: Greaves of Gold
        (Su)</strong> You gain a +10 sacred bonus to your CMD when an opponent
        attempts to bull rush you. You may always attempt attacks of opportunity
        when a creature attempts to bull rush you, even if your opponent has the
        Improved Bull Rush feat or a similar ability. In addition, you may
        attempt an attack of opportunity whenever a charging opponent enters a
        space you threaten.<br /><strong>3: Living Aurum (Sp)</strong> You can
        cast <em>iron body </em>once per day. Instead of iron, though, your body
        is transformed into living gold. In addition, you gain SR equal to 11 +
        your HD against spells cast by evil creatures while under the effect of
        this spell-like ability.</em></p><h2>Paladin Code</h2><em>The paladins
        of Arqueros are defense-oriented generals and bodyguards of virtuous
        public figures and honorable clients. Their tenets include the following
        affirmations.<ul><li> I will never abandon an innocent in need of
        protection.</li><li> The role of guardian is a sacred one. I will never
        neglect</li><li> my duties when I agree to guard or protect others, even
        if they seem unworthy of my protection.</li><li> A guardian is only as
        effective as his weapons and armor. I will maintain mine in peak
        condition at all times, repairing and cleaning them as consistently as
        possible without neglecting my charge.</li></ul> <h2>For Followers of
        Arqueros</h2><h3>Feats</h3><p>Heroic
        Interposition</p><h3>Traits</h3><p>Empyreal Focus, Eye of Arqueros,
        Living Bulwark</p>
