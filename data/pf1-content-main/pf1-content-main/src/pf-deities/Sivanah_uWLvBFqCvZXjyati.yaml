      content: >-
        <h1>Sivanah</h1><h2>The Seventh Veil</h2>@Source[PZO9290;pages=83] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Sivanah">Sivanah</a><h3>Details</h3><p><strong>Alignment</strong>
        N<br /><strong>Pantheon</strong> Other Deities<br /><strong>Other
        Pantheons</strong> Gnomish Deities<br /><strong>Areas of
        Concern</strong> Illusions, mystery, reflections<br
        /><strong>Domains</strong> Knowledge, Madness, Magic, Rune, Trickery<br
        /><strong>Subdomains</strong> Aeon, Deception, Innuendo, Insanity,
        Memory, Protean, Rites*, Thought, Truth*, Wards<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Bladed scarf<br /><strong>Symbol</strong> Veils tied in
        a circle<br /><strong>Sacred Animal(s)</strong> Coyote<br
        /><strong>Sacred Color(s)</strong> Gray</p><h3>Obedience</h3><p>Carry an
        ordinary scarf or veil and walk through a settlement, making sure you
        are seen and exchange pleasantries with at least one person. After you
        reach the settlement's edge, place the scarf or veil over your face so
        you aren't easily recognizable, and again speak with anyone you
        encountered before. If your true identity is recognized, you must deny
        it, providing a false name if necessary. Even if anyone you met sees
        through your ruse, you gain a +2 sacred or profane bonus on Disguise
        checks. The type of bonus depends on your alignment-if you're neither
        good nor evil, you must choose either sacred or profane the first time
        you perform your obedience, and this choice can't be changed.</p><h3>On
        Golarion</h3><p><strong>Centers of Worship</strong> Absalom, Nex, Nidal,
        Numeria, Razmiran<br /><strong>Nationality</strong> unknown</p><h2>Boons
        - Deific Obedience</h2><h3>
        Evangelist</h3><p>@Source[PZO9290;pages=83]<br /><strong>1: Masks and
        Veils (Sp)</strong> <em>blurred movement<sup>ACG</sup> 3/day,
        <em>invisibility</em> 2/day, or <em>major image</em> 1/day<br
        /><strong>2: Illusion Expert (Su)</strong> Your enemies have a harder
        time fooling you with illusions. You gain a +4 sacred or profane bonus
        (of the same type as that provided by your obedience) on Will saves to
        disbelieve illusions. If you successfully disbelieve an illusion and
        communicate this fact to others, such viewers gain a +6 bonus (of the
        same type as above) on their saving throws to disbelieve the
        illusion.<br /><strong>3: Protection of the Veiled Goddess (Sp)</strong>
        You are skilled at misdirecting your opponents while preparing to do
        them harm. Once per day as a standard action, you can cast mislead. The
        spell's <em>greater invisibility</em> effect lasts a number of rounds
        equal to your Hit
        Dice.</em></p><h3>Exalted</h3><p>@Source[PZO9290;pages=83]<br
        /><strong>1: Nothing is What It Seems (Sp)</strong> <em>color spray</em>
        3/day, <em>misdirection</em> 2/day, or <em>hide
        campsite</em><sup>APG</sup> 1/day<br /><strong>2: Shared Mask
        (Sp)</strong> As a standard action, you can alter your own appearance
        and that of up to four willing creatures within a 30-foot radius as per
        <em>disguise self</em>. All the creatures disguised appear to be of a
        single race or creature type; creatures in the group that could not be
        disguised as that creature type (such as an animal companion in a group
        of humanoids) cannot be affected by this ability. This effect lasts 10
        minutes per Hit Die you possess.<br /><strong>3: The Protecting Veil
        (Su)</strong> You can shield an area, and those within it, from both
        mundane and magical observation. As a full-round action, you can
        meditate to veil an area with an illusion extending in a 30-foot radius
        around you. During this round, you can't take any other actions,
        including free or swift actions. The illusion appears as a general
        concept you envision and can't be changed once in place. The illusion
        affects only visual observation and scrying; it doesn't create or
        disguise smells, sounds, or tactile properties. You may maintain the
        illusion for up to 1 hour, but if you leave the square you were
        occupying when you initiated it, the illusion is dispelled. The DC to
        disbelieve the illusion is equal to 10 + your Hit Dice + your Charisma
        modifier.</em></p><h3>Sentinel</h3><p>@Source[PZO9290;pages=83]<br
        /><strong>1: Hard to Pin Down (Sp)</strong> <em>disguise
        weapon</em><sup>ACG</sup> 3/day, <em>blur</em> 2/day, or
        <em>displacement</em> 1/day<br /><strong>2: Killer Illusion
        (Sp)</strong> You can channel illusions through your weapon to terrify
        and even slay your enemies. Once per day, as a free action when you hit
        with a melee attack, you can cause images of a creature the target most
        fears to erupt from your weapon right before its eyes. Resolve this
        effect before rolling damage for the attack; this functions as
        <em>phantasmal killer</em>, and the target can attempt a Will saving
        throw (DC = 14 + your Charisma modifier) to recognize the image as
        unreal. On a failed save, the phantasm touches the target, which must
        then succeed at a Fortitude saving throw (against the same DC) or die
        from fear. Even if the target succeeds at its Fortitude saving throw, it
        takes 3d6 points of damage as well as the damage from the successful
        melee attack. Unlike <em>phantasmal killer, this effect cannot be turned
        upon you if the subject possesses telepathy or is wearing a <em>helm of
        telepathy.<br /><strong>3: Illusive Revenge (Sp)</strong> You have
        learned how to use illusions to torment your enemies even long after
        battle is over. Once per day, you can cast <em>phantasmal revenge
        (<em>Pathfinder RPG Advanced Player's Guide</em> 235) as a spell-like
        ability upon a recently slain creature, which rises as a ghastly image
        to seek out its killer. This illusive ghost is always veiled, even if it
        never was so in life. After the target attempts its Will saving throw
        (DC = 17 + your Charisma modifier), regardless of whether the attempt
        was successful, the ghost tears off its veil to reveal an image of the
        killer's own face.</em></p><h2>For Followers of
        Sivanah</h2><h3>Feats</h3><p><em>Believable Veils</em></p><h3>Magic
        Items - Armor</h3><p><em>Veiled Chain</em></p><h3>Magic Items - Wondrous
        Items</h3><p><em>Veil of Veils</em></p><h3>Traits</h3><p><em>Strip the
        Veils, Veils upon Veils</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9290;pages=86]<em></em><br
        /><h3>Cleric/Warpriest</h3><p><em>Ghost Sound</em> can be prepared as a
        0-level spell<br /><em>Silent Image can be prepared as a</em> 1st-level
        spell<br /><em>Hypnotic Pattern</em> can be prepared as a 2nd-level
        spell<br /><em>Veil</em> can be prepared as a 6th-level spell</em></p>
