      content: >-
        <h1>Magdh</h1><h2>The Three</h2>@Source[PZO9298;pages=28] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Magdh">Magdh</a><h3>Details</h3><p><strong>Alignment</strong>
        LN<br /><strong>Pantheon</strong> Eldest<br /><strong>Areas of
        Concern</strong> Complexity, fate, triplets<br
        /><strong>Domains</strong> Knowledge, Law, Luck, Rune<br
        /><strong>Subdomains</strong> Curse, Fate, Thought, Wards<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Scythe<br /><strong>Symbol</strong>
        Green three-pointed knot<br /><strong>Sacred Animal(s)</strong>
        Multi-headed animals<br /><strong>Sacred Color(s)</strong> Blue,
        green</p><h3>Obedience</h3><p>Paint two dots above each ear to represent
        Magdh's three sets of eyes. Cast leaves, bones, or coins into a bowl of
        clear water, and attempt to divine meaning from the way they land. You
        gain a +4 bonus on Intelligence-based skill checks.</p><h2>Boons - Fey
        Obedience</h2><h3>Feysworn</h3><p>@Source[PZO9298;pages=28]<br
        /><strong>1: Secret Knowledge (Sp)</strong> <em>identify</em> 3/day,
        <em>augury</em> 2/day, or <em>clairaudience/clairvoyance</em> 1/day<br
        /><strong>2: Sight Beyond Time (Su)</strong> You constantly see a few
        moments down your own line of fate, and thus are never surprised or
        flat-footed. In addition, you gain a +2 insight bonus to AC and on
        Reflex saves.<br /><strong>3: Baleful Revelation (Sp)</strong> You can
        cast <em>prediction of failure<sup>UM</sup></em> once per
        day.</em></p><h2>For Followers of
        Magdh</h2><h3>Archetypes</h3><p><em>Nornkith
        (Monk)</em></p><h3>Feats</h3><p><em>Fey Friend</em></p><h3>Magic Items -
        Rods</h3><p><em>Rod of the Thriceborn (normal)</em></p><h3>Magic Items -
        Wondrous Items</h3><p><em>Charm of the Thriceborn, Ribbon of the
        Three</em></p><h3>Spells</h3><p><em>Threefold Face, Threefold Form,
        Threefold Sight</em></p><h3>Traits</h3><p><em>Shaper of
        Reality</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9480;pages=25]</em><br
        /><h3>Cleric/Warpriest</h3><p><em>Threefold Aspect can be prepared as a
        4th-level spell<br /><em>Threefold Face</em> can be prepared as a
        3rd-level spell<br /><em>Threefold Sight can be prepared as a</em>
        3rd-level spell<br /><em>Moment of Prescience</em> can be prepared as a
        8th-level spell</em></p>
