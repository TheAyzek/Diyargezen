        <h1>Gaap</h1><h2>Rai of the Water Devils</h2>@Source[PZO9267;pages=326]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Gaap">Gaap</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Divination, illusion, water<br
        /><strong>Domains</strong> Evil, Law, Rune, Water<br
        /><strong>Subdomains</strong> Devil (Evil), Devil (Law), Oceans, Rivers,
        Wards<br /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Shortspear<br
        /><strong>Symbol</strong> Three circling sharks<br /><strong>Sacred
        Animal(s)</strong> Shark<br /><strong>Sacred Color(s)</strong> Gray,
        white</p><h3>Obedience</h3><p>Drown a living creature in any amount of
        fetid water. Gain a +4 profane bonus on saving throws against
        divinations.</p><h2>Boons - Infernal
        Dukes</h2>@Source[PZO1139;pages=116]<br />The Lords of Hell, the Dukes
        of Perdition, and the Princes of Damnation are all names for the
        infamous nobility of the Pit- the elite caste of devilkind known as the
        infernal dukes.<p> All infernal dukes are lawful evil and range in power
        from CR 26 to CR 27. The boons they grant are less complex than those
        granted by archdevils, manifesting as spell-like abilities usable once
        per day each.</p><p><strong>1</strong>: <em>water breathing</em><br
        /><strong>2</strong>: <em>circle of clarity</em><br
        /><strong>3</strong>: <em>weird</em></p><h2>For Followers of
        Gaap</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
