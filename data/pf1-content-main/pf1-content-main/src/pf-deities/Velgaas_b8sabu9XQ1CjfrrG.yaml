        <h1>Velgaas</h1><h2>Minds in the Dark</h2>@Source[PZO1139;pages=132] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Velgaas">Velgaas</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Sahkil Tormentors<br /><strong>Areas
        of Concern</strong> Emotional manipulation, emptiness, ignorance<br
        /><strong>Domains</strong> Charm, Evil, Knowledge, Void<br
        /><strong>Subdomains</strong> Corruption, Fear, Memory, Thought<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Spiked
        chain</p><h3>Obedience</h3><p>Convince someone to perform a humiliating
        act. Gain a +4 profane bonus on Bluff checks.</p><h2>Boons - Sahkil
        Tormentors</h2>@Source[PZO1139;pages=133]<br />Sahkil tormentors hold
        dominion over mortal fears and suffering. All are chaotic evil and range
        in power from CR 21 to CR 25. Their boons are less complex than those of
        other demigods, manifesting as spell-like abilities usable twice per day
        each.<p><strong>1</strong>: <em>detect thoughts</em><br
        /><strong>2</strong>: <em>mindwipe</em><br /><strong>3</strong>:
        <em>mass suggestion</em></p>
