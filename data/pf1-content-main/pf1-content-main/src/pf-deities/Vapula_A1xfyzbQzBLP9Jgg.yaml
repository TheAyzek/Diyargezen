        <h1>Vapula</h1><h2>Keeper of the Pyrite
        Vault</h2>@Source[PZO9267;pages=326] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Vapula">Vapula</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Discovery, hubris, scholarship<br
        /><strong>Domains</strong> Evil, Knowledge, Law, Liberation<br
        /><strong>Subdomains</strong> Devil (Evil), Devil (Law), Language,
        Memory, Thought<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Quarterstaff<br
        /><strong>Symbol</strong> Rearing griffon<br /><strong>Sacred
        Animal(s)</strong> Lion<br /><strong>Sacred Color(s)</strong> White,
        yellow</p><h3>Obedience</h3><p>Carve Vapula's symbol onto six coins of
        different mintings. Gain a +4 profane bonus on Appraise
        checks.</p><h2>Boons - Infernal Dukes</h2>@Source[PZO1139;pages=119]<br
        />The Lords of Hell, the Dukes of Perdition, and the Princes of
        Damnation are all names for the infamous nobility of the Pit- the elite
        caste of devilkind known as the infernal dukes.<p> All infernal dukes
        are lawful evil and range in power from CR 26 to CR 27. The boons they
        grant are less complex than those granted by archdevils, manifesting as
        spell-like abilities usable once per day each.</p><p><strong>1</strong>:
        <em>arcane sight</em><br /><strong>2</strong>: <em>plane shift</em><br
        /><strong>3</strong>: <em>foresight</em></p><h2>For Followers of
        Vapula</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
