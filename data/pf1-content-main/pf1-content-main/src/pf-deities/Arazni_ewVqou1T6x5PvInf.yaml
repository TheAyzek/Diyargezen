      content: >-
        <h1>Arazni</h1><h2>The Harlot Queen</h2>@Source[PZO9267;pages=316] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Arazni">Arazni</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Other Deities<br /><strong>Areas of
        Concern</strong> Command of undeath, lichdom<br
        /><strong>Domains</strong> Evil, Nobility, Protection<br
        /><strong>Subdomains</strong> Defense, Leadership<br /><em>* Requires
        the <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Rapier<br /><strong>Symbol</strong> Rapier and lotus<br
        /><strong>Sacred Animal(s)</strong> Scarab beetle<br /><strong>Sacred
        Color(s)</strong> Gray, red</p><h3>Obedience</h3><p>Spend an hour
        reliving or imagining terrible things that happened to you. This process
        is mentally strenuous, dealing 1d6 points of nonlethal damage. You
        cannot allow anyone else to know of your struggles: speaking of them,
        showing distress while considering them, or even asking for assistance
        in healing the nonlethal damage negates the benefits of this obedience.
        When you fail a saving throw against a creature's spell or spell-like
        ability, you gain a +4 profane bonus on saving throws against any of
        that creature's abilities for 1 minute.</p><h2>Boons - Deific
        Obedience</h2><h3> Evangelist</h3><p>@Source[PZO90140;pages=71]<br
        /><strong>1: Hidden Resolve (Sp)</strong> <em>disguise self</em> 3/day,
        <em>obscure object</em> 2/day, or <em>bestow curse</em> 1/day<br
        /><strong>2: Unheralded Retribution (Su)</strong> You punish those foes
        who would use the arcane arts to infringe upon your autonomy and
        well-being. Whenever you succeed at a saving throw against a spell or
        spell-like ability cast or used by a creature, that creature becomes
        flat-footed against your attacks until the end of your next turn. In
        addition, your attacks against that creature while it is flat-footed
        deal 1 additional point of bleed damage; this bleed damage stacks with
        itself.<br /><strong>3: Sovereign Constancy (Su)</strong> Much like
        Arazni herself, you prize the sanctuary of your own thoughts, and you
        have built defenses and protections lest others try to take away or
        taint this refuge. Once per day as an immediate action whenever you are
        affected by a mind-affecting effect, you can use <em>break
        enchantment</em> on yourself as a spell-like ability, with a caster
        level equal to your Hit
        Dice.</em></p><h3>Exalted</h3><p>@Source[PZO90140;pages=71]<br
        /><strong>1: Unyielding (Sp)</strong> <em>remove fear</em> 3/day,
        <em>false life</em> 2/day, or <em>nondetection</em> 1/day<br
        /><strong>2: Strength in Bloodshed (Su)</strong> The Red Crusader knew
        well the value of fighting alongside allies-and the price to be paid
        when those allies fail. Rather than relying upon the assistance of
        fickle and fallible mortals, you can bring forth a construct gathered
        from the blood spilled by Arazni and her followers. Once per day as a
        standard action, you can summon a blood golem to aid you. You gain
        telepathy with the golem to a range of 100 feet. The golem follows your
        commands perfectly for a number of minutes equal to your number of Hit
        Dice before vanishing back to its home.<br /><strong>3: Shield of Scars
        (Sp)</strong> When you heal yourself with a <em>cure or <em>inflict</em>
        spell (as appropriate depending upon your physiology), scars form over
        your body. You gain a profane bonus to Armor Class equal to the spell's
        level for 1
        minute.</em></p><h3>Sentinel</h3><p>@Source[PZO90140;pages=71]<br
        /><strong>1: Red Queen's Rapier (Sp)</strong> <em>divine favor</em>
        3/day, <em>blood armor</em> 2/day, or <em>rage</em> 1/day<br
        /><strong>2: Subliminal Intransigence (Su)</strong> Through ceaseless
        conditioning, you have constructed insurmountable mental defenses that
        deny others the ability to sway your thoughts, whether for good or for
        ill. You gain immunity to charm and compulsion effects and a +4 bonus on
        saving throws against fear effects.<br /><strong>3: Fallen Crusader's
        Retaliation (Su)</strong> The Red Queen's life is a painful example of
        the danger of falling prey to the arcane arts, and you have learned from
        this lesson. Ever wary of those who wield magic in battle, you hone your
        reflexes to strike when least expected. Creatures you threaten that fail
        their checks to cast spells defensively provoke attacks of opportunity
        from you.</em></p><h2>For Followers of Arazni</h2><h3>Magic Items -
        Weapons</h3><p><em>Red Crusader's
        Quill</em></p><h3>Spells</h3><p><em>Bloodstone Mirror, Litany of the Red
        Crusader, Unspoken Name</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO90140;pages=72]</em><br
        /><h3>Antipaladin</h3><p><em>Blood Armor can be prepared as a</em>
        2nd-level spell<br /><em>Detect Scrying</em> can be prepared as a
        3rd-level spell<br /></em></p><h3>Cleric/Warpriest</h3><p><em>Anticipate
        Peril can be prepared as a 1st-level spell<br /><em>Detect Scrying</em>
        can be prepared as a 4th-level spell<br /><em>Mind Blank</em> can be
        prepared as a 8th-level spell<br /></em></p><h2>Unique Summon
        Rules</h2>@Source[PZO90140;pages=73]<br /><strong>Summon Monster
        III</strong>: Augur Kyton<br /><strong>Summon Monster VI</strong>:
        Fiendish Giant Scarab<br /><strong>Summon Monster VIII</strong>:
        Interlocutor Kyton
