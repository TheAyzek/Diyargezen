      content: >-
        <h1>Ragadahn</h1><h2>The Water Lord</h2>@Source[PZO9298;pages=32] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Ragadahn">Ragadahn</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Eldest<br /><strong>Areas of
        Concern</strong> Linnorms, oceans, spirals<br /><strong>Domains</strong>
        Chaos, Evil, Scalykind, Water<br /><strong>Subdomains</strong>
        Ancestors, Dragon, Oceans, Venom<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Whip<br
        /><strong>Symbol</strong> Blue ouroboros<br /><strong>Sacred
        Animal(s)</strong> Sea snake<br /><strong>Sacred Color(s)</strong>
        Blue</p><h3>Obedience</h3><p>Use the tooth of an aquatic animal to
        scratch a spiral into your skin, while letting a drop of your blood
        diffuse into a body of water or fall into a bowl of clear water. You
        gain a +4 sacred bonus on saving throws against the spells, spell-like
        abilities, and supernatural abilities of creatures with the aquatic or
        water subtype.</p><h2>Boons - Fey
        Obedience</h2><h3>Feysworn</h3><p>@Source[PZO9298;pages=32]<br
        /><strong>1: Water Mastery (Sp)</strong> <em>marid's
        mastery<sup>ARG</sup> 3/day, <em>aboleth's lung<sup>ARG</sup> 2/day, or
        <em>hydraulic torrent<sup>APG</sup></em> 1/day<br /><strong>2: At Home
        in Water (Sp)</strong> You gain a swim speed of 30 feet. If you already
        have a swim speed, increase it by 10 feet.<br /><strong>3: Wear the Sea
        (Sp)</strong> You can cast <em>seamantle<sup>APG</sup></em> once per
        day.</em></p><h2>For Followers of
        Ragadahn</h2><h3>Archetypes</h3><p><em>Deepwater Rager (Barbarian),
        Serpent Herald (Skald)</em></p><h3>Feats</h3><p><em>Fey
        Friend</em></p><h3>Traits</h3><p><em>Shaper of
        Reality</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9470;pages=31]</em><br
        /><h3>Cleric/Warpriest</h3><p><em>Tail Strike</em> can be prepared as a
        4th-level spell</p><h3>Inquisitor</h3><p><em>Tail Strike</em> can be
        prepared as a 4th-level spell</p><h3>Oracle</h3><p><em>Tail Strike</em>
        can be prepared as a 4th-level spell</p>
