      content: >-
        <h1>Nocticula (Redeemed)</h1><h2>The Redeemer
        Queen</h2>@Source[PZO90144;pages=78] <br /><strong>Pathfinder
        Wiki</strong> <a href="http://www.pathfinderwiki.com/wiki/Nocticula
        (Redeemed)">Nocticula
        (Redeemed)</a><h3>Details</h3><p><strong>Alignment</strong> CN<br
        /><strong>Pantheon</strong> Other Deities<br /><strong>Areas of
        Concern</strong> Artists, exiles, midnight<br /><strong>Domains</strong>
        Artifice, Chaos, Darkness, Travel, Void<br /><strong>Subdomains</strong>
        Exploration, Isolation, Moon, Night, Revelry<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> dagger<br /><strong>Symbol</strong> moon with a pair of
        smirking lips and a seven-pointed crown<br /><strong>Sacred
        Animal(s)</strong> bat<br /><strong>Sacred Color(s)</strong> blue,
        white</p><h3>Obedience</h3><p>Spend an hour in a secluded location while
        crafting a work of art. If your hour of work begins at, ends at, or
        includes the stroke of midnight, then the subject of your art is up to
        you. Otherwise, your art must include the concept of midnight in some
        way. When you aren't adjacent to an ally, gain a +1 morale bonus to your
        AC and on all saving throws.</p><h3>On Golarion</h3><p><strong>Centers
        of Worship</strong> New Thassilon, Varisia<br
        /><strong>Nationality</strong> risen demon lord</p><h2>Boons - Deific
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO90144;pages=78]<br
        /><strong>1: Avoid Society (Sp)</strong> <em>vanish</em> 3/day,
        <em>invisibility</em> 2/day, or <em>nondetection</em> 1/day<br
        /><strong>2: Seed of Redemption (Sp)</strong> Once per day, you can make
        a special touch attack against an outsider. On a hit, the outsider
        becomes staggered for 1 round as it suddenly becomes aware of the fact
        that it need not follow the ethos and morals of its kind- that it can
        choose options other than the traditions of its ilk. The outsider must
        also succeed at a Will saving throw (DC = 10 + 1/2 your Hit Dice + your
        Charisma modifier) or become favorably disposed toward you, as if
        affected by <em>charm monster</em>; in this case the stagger effect
        persists for 1d4+1 rounds, even if the charm effect is dispelled or
        negated. Given time, you may be able to convert the outsider from its
        ways and help it find a new path beyond its alignment, although the GM
        should adjudicate the time and potential success of such an endeavor.
        This effect is the equivalent of a 7th-level mind-affecting spell.<br
        /><strong>3: False Demise (Su)</strong> Once per day, when you are
        reduced to negative hit points by damage, you are instead reduced to 1
        hit point and affected by a <em>mislead</em> spell (caster level equals
        your character level). The illusory double created by the spell appears
        to be your dead
        body.</em></p><h3>Exalted</h3><p>@Source[PZO90144;pages=78]<br
        /><strong>1: Artist's Flourish (Sp)</strong> <em>crafter's fortune 3/
        day, <em>wood shape</em> 2/day, or <em>major image</em> 1/day<br
        /><strong>2: Swift Creation (Sp)</strong> Once per day as a standard
        action, you can conjure an object into existence in your vicinity.
        Objects created in this fashion are always artistic in appearance-
        otherwise this spell-like ability functions as <em>major
        creation</em>.<br /><strong>3: Summon Sculpture (Sp)</strong> Once per
        day, you can summon a construct to do your bidding. This functions as
        <em>summon monster IX</em>, but you can only choose to summon one iron
        golem, 1d3 stone golems, or 1d4+1 glass
        golems.</em></p><h3>Sentinel</h3><p>@Source[PZO90144;pages=78]<br
        /><strong>1: Midnight's Grace (Sp)</strong> <em>true strike</em> 3/day,
        <em>cat's grace 2/day, or <em>keen edge</em> 1/day<br /><strong>2:
        Sinuous Daggerplay (Ex)</strong> You grow a sinuous tail (if you already
        have a tail, you grow a second one). This tail is prehensile and capable
        of manipulating and holding small objects, but cannot perform fine
        manual work as if it were a hand, with the exception of wielding a
        dagger. When you make a full attack, you can make an additional attack
        with this tail-wielded dagger. When you do so, you resolve this attack
        as a primary attack, add your Dexterity modifier to any damage dealt (in
        addition to any modifiers you might have from Strength), and have a
        reach that is 5 feet greater than your base reach. Wielding a dagger
        with your tail in this way does not count as two-weapon fighting for the
        purposes of determining penalties to attacks made with weapons wielded
        in your hands. In any round during which you don't make a full attack
        but you wield a dagger with this tail, it makes a single attack against
        an adjacent enemy of your choice-if it hits, it deals no damage but
        distracts the foe enough so that you gain a +2 circumstance bonus to
        your Armor Class against that target. You cannot attack with this
        tail-wielded dagger in any other way, including as a thrown weapon.<br
        /><strong>3: Midnight Rejuvenation (Su)</strong> Every night at
        midnight, you gain the benefits of a <em>heal spell and a <em>greater
        restoration</em> spell (both resolve at a caster level equal to your
        character level).</em></p>
