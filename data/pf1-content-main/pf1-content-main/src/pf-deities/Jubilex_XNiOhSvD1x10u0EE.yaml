      content: >-
        <h1>Jubilex</h1><h2>The Faceless Lord</h2>@Source[PZO9267;pages=320] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Jubilex">Jubilex</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Ooze, poison, sloth<br /><strong>Domains</strong>
        Chaos, Destruction, Evil, Water<br /><strong>Subdomains</strong>
        Catastrophe, Demon (Chaos), Demon (Evil), Flotsam, Rage<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Heavy mace<br
        /><strong>Symbol</strong> Melting red eye<br /><strong>Sacred
        Animal(s)</strong> None<br /><strong>Sacred Color(s)</strong> Green,
        red</p><h3>Obedience</h3><p>Submerge a small, severed piece of a human
        body in a vial of acid and chant praise to Jubilex as the flesh
        dissolves. Gain a +4 profane bonus on all saving throws against
        poison.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=18]<br
        /><strong>1: Sign of the Faceless Lord (Sp)</strong> <em>grease</em>
        3/day, <em>delay poison</em> 2/day, or <em>slow</em> 1/day<br
        /><strong>2: Poisonous Touch (Sp)</strong> Up to 3 times per day, you
        may use <em>poison </em>as a spell-like ability. If you make an attack
        with a melee weapon, you may activate this ability as a swift action as
        part of your attack, targeting the foe struck with the effect. This
        ability is the equivalent of a 7th-level spell.<br /><strong>3: Call
        Forth the Spawn (Sp)</strong> Thrice per day you may use <em>destruction
        </em>as a spell-like ability. The body of a creature slain by this
        ability immediately transforms into an ochre jelly under your mental
        control. Ochre jellies created by this ability melt away into noxious
        residue after 1 hour. This ability is the equivalent of a 9th-level
        spell.</em></p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=60]<br
        /><strong>1: Spreading Slime (Sp)</strong> <em>corrosive touch </em>
        3/day, <em>web</em> 2/day, or <em>stinking cloud</em> 1/day<br
        /><strong>2: Deliquescent Blessing (Su and Sp)</strong> The blessing of
        the Faceless Lord grants you a measure of kinship to jellies, oozes, and
        slimes. Unintelligent oozes never attack you, and intelligent oozes have
        an initial starting attitude of friendly toward you. You gain ooze
        empathy-this works like a druid's wild empathy (using your character
        level as your druid level), except only with oozes. You can use this
        ability to influence intelligent oozes as though using the Diplomacy
        skill. In addition, once per day, you can transform a creature's body
        into an ooze; this acts as per <em>baleful polymorph</em>, except that
        the target is transformed into an ooze. A creature of 3 Hit Dice or
        fewer becomes a gray ooze, one with 4-9 Hit Dice becomes a gelatinous
        cube or ochre jelly (chosen randomly), and a creature of 10 or more Hit
        Dice becomes a black pudding. The target's gear does not transform with
        it; any such items fall under or within the ooze's body, which may cause
        them to take damage or to be destroyed. If the ooze has the split
        ability, splitting the ooze creates one ooze that retains the creature's
        original identity (for the purpose of memories or restoring the
        creature) and one normal, mindless ooze.<br /><strong>3: Faceless Form
        (Ex)</strong> Your form twists into a reflection of Jubilex's own
        shapeless appearance-your flesh becomes translucent emerald slime, your
        skin takes on a nauseating glistening sheen, and ogling crimson eyes
        sprout across your body. You gain the amorphous, all-around vision, and
        compression universal monster abilities. Your body still retains enough
        rigidity that you can speak, wield objects and weapons, and wear items
        like armor. In addition, if you have a hand free and not covered by a
        glove, you can make a touch attack as a standard action; on a hit, the
        touched creature takes 4d6 points of acid
        damage.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=60]<br
        /><strong>1: Sign of the Faceless Lord (Sp)</strong> <em>grease</em>
        3/day, <em>delay poison</em> 2/day, or <em>slow</em> 1/day<br
        /><strong>2: Poisonous Touch (Sp)</strong> Just as the Faceless Lord's
        touch carries within it all manner of virulent toxins, so can you cause
        your flesh to exude deadly poison. Up to three times per day, you can
        cast <em>poison</em> as a spell-like ability. If you make an attack with
        a melee weapon, you can activate this ability as a swift action as part
        of your attack, targeting the foe struck.<br /><strong>3: Call Forth the
        Spawn (Sp)</strong> Three times per day, you can cast
        <em>destruction</em> as a spell-like ability. The body of a creature
        slain by this ability immediately transforms into an ochre jelly under
        your mental control. Ochre jellies created by this ability melt away
        into noxious residue after 1
        hour.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=60]<br
        /><strong>1: Toxification (Sp)</strong> <em>ray of sickening </em>
        3/day, <em>pernicious poison</em> 2/day, or <em>eruptive pustules</em>
        1/day<br /><strong>2: Abyssal Humors (Ex and Su)</strong> The sickness
        of the Undersump has infused your flesh, and you spread its horror with
        every crushing blow. You gain immunity to poison. Three times per day,
        as a swift action, you can exude a poison worth up to 50 gp per
        character level you have. This poison remains potent for 1 hour before
        turning to gritty dust. You can apply this poison to a weapon you wield
        as part of exuding it, deliver it as a contact poison with a touch,
        exhale it as an inhaled poison into an adjacent creature's face, or
        otherwise use this poison as you choose.<br /><strong>3: Roiling Mind
        (Su)</strong> Your mind becomes the churning blankness of a mindless
        ooze, thick with a psychic toxin that poisons those who reach inside.
        You gain immunity to mind-affecting effects.</em></p><h2>For Followers
        of Jubilex</h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic
        Items - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Traits</h3><p><em>Demonic Persuasion</em></p>
