        <h1>The Lantern King</h1><h2>The Laughing
        Lie</h2>@Source[PZO9298;pages=24] <br /><strong>Pathfinder Wiki</strong>
        <a href="http://www.pathfinderwiki.com/wiki/The Lantern King">The
        Lantern King</a><h3>Details</h3><p><strong>Alignment</strong> CN<br
        /><strong>Pantheon</strong> Eldest<br /><strong>Areas of
        Concern</strong> Laughter, mischief, transformation<br
        /><strong>Domains</strong> Charm, Chaos, Madness, Trickery<br
        /><strong>Subdomains</strong> Deception, Love, Lust, Thievery<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Dagger<br /><strong>Symbol</strong>
        Golden lantern containing colored lights<br /><strong>Sacred
        Animal(s)</strong> Firefly<br /><strong>Sacred Color(s)</strong> Black,
        gold</p><h3>Obedience</h3><p>Light a small lantern and tell it a joke or
        the story of a prank you played on someone-this must be a different joke
        or story each time. You gain a +4 sacred bonus on saving throws versus
        illusions.</p><h2>Boons - Fey
        Obedience</h2><h3>Feysworn</h3><p>@Source[PZO9298;pages=24]<br
        /><strong>1: Prankster's Touch</strong> <em>disguise self</em> 3/day,
        <em>hideous laughter</em> 2/day, or <em>suggestion</em> 1/day<br
        /><strong>2: Transform Others</strong> You can cast <em>polymorph any
        object once per day.<br /><strong>3: Anyone and Anything (Sp)</strong>
        You can cast <em>shapechange</em> once per day.</em></p><h2>For
        Followers of The Lantern King</h2><h3>Archetypes</h3><p><em>Fey
        Prankster (Bard)</em></p><h3>Feats</h3><p><em>Fey
        Friend</em></p><h3>Traits</h3><p><em>Shaper of Reality</em></p>
