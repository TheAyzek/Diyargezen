      content: >-
        <h1>Phlegyas</h1><h2>The Consoler of
        Atheists</h2>@Source[PZO92114;pages=16] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Phlegyas">Phlegyas</a><h3>Details</h3><p><strong>Alignment</strong>
        N<br /><strong>Pantheon</strong> Psychopomp Usher<br /><strong>Areas of
        Concern</strong> Atheists, legacies, and reincarnation<br
        /><strong>Domains</strong> Artifice, Earth, Knowledge, Repose<br
        /><strong>Subdomains</strong> N/A<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong>
        Longbow<br /><strong>Symbol</strong> Two circles overlapping
        vertically</p><h3>Obedience</h3><p>Spend an hour creating something from
        the dead. Most worshippers weave jewelry from the hair of the departed,
        but more macabre faithful may instead use bones, teeth, or flesh. Others
        may embalm or mummify the corpse. Gain a +2 insight bonus on saving
        throws against divine magic.</p><h2>Boons - Monitor
        Obedience</h2><h3>None</h3><p>@Source[PZO92114;pages=16]<br /><strong>1:
        Creator's Whispers (Sp)</strong> <em>crafter's fortune</em> 3/day,
        <em>object reading</em> 2/day, or <em>detect anxieties</em> 1/day<br
        /><strong>2: Evader of Consequence (Sp)</strong> You can cast
        <em>reincarnate or <em>mindwipe</em> once per day. You must select which
        when you perform the obedience for that day.<br /><strong>3: Though Only
        Breath (Ex)</strong> You gain deep insights into crafting a lasting
        legacy. Select a single Craft, Perform, or Profession skill. You gain a
        +10 insight bonus on checks to craft permanent materials, such as
        carving a statue, writing a play, or drafting meaningful legislation. A
        check result of 40 or higher indicates a piece that will remain in the
        public consciousness for generations to come. This bonus does not apply
        to skill checks to earn money.</em></p><h2>For Followers of
        Phlegyas</h2><h3>Prestige Classes</h3><p><em>Mortal Usher</em></p>
