        <h1>Shamira</h1><h2>Princess of the Porphyry
        City</h2>@Source[PZO9267;pages=328] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Shamira">Shamira</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Nascent Demon Lords<br /><strong>Areas
        of Concern</strong> Lost dreams, seduction of the pure<br
        /><strong>Domains</strong> Chaos, Charm, Evil, Nobility<br
        /><strong>Subdomains</strong> Demon (Chaos), Demon (Evil), Leadership,
        Love, Lust<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Longbow<br
        /><strong>Symbol</strong> Upside-down ankh<br /><strong>Sacred
        Animal(s)</strong> Cardinal<br /><strong>Sacred Color(s)</strong> Red,
        orange</p><h3>Obedience</h3><p>Engage in sexual acts (either alone or
        with a partner) in the presence of a sleeping intelligent creature
        without waking that creature. Gain a +4 profane bonus on saves against
        charm effects.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=39]<br
        /><strong>1: First Boon (Sp)</strong> <em>alter self</em> 1/day<br
        /><strong>2: Second Boon (Sp)</strong> <em>fire shield</em> 1/day<br
        /><strong>3: Third Boon (Sp)</strong> <em>mass suggestion</em>
        1/day</em></p><h2>Boons - Nascent Demon
        Lords</h2><em><p>@Source[PZO1139;pages=125]</p><p>With very few
        exceptions, a demon lord is never born fully formed. Instead, each must
        build power and resources during an extended period of transformation.
        Demons in this transitional stage are known as nascent demon
        lords.</p><p> At any one time, there exist hundreds-if not thousands- of
        nascent demon lords in the Abyss. Those who have been associated with
        the Inner Sea region are summarized here. All nascent demon lords are
        chaotic evil and range in power from CR 21 to CR 25. The boons they
        grant are less complex than those granted by demon lords, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>alter self</em><br
        /><strong>2</strong>: <em>fire shield</em><br /><strong>3</strong>:
        <em>mass suggestion</em></p>
