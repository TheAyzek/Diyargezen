        <h1> Socothbenoth</h1><h2>The Silken Sin</h2>@Source[PZO9267;pages=320]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Socothbenoth">Socothbenoth</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Perversion, pride, taboos<br /><strong>Domains</strong>
        Chaos, Charm, Evil, Travel<br /><strong>Subdomains</strong> Demon
        (Chaos), Demon (Evil), Exploration, Love, Lust<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Quarterstaff<br /><strong>Symbol</strong> Eyeless snake
        and staff<br /><strong>Sacred Animal(s)</strong> Snake<br
        /><strong>Sacred Color(s)</strong> Pink,
        red</p><h3>Obedience</h3><p>Achieve sexual release, either alone or with
        a partner, and then defile a page torn from the religious canon of a
        lawful good deity. Gain a +4 bonus on saves against enchantment
        effects.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=26]<br
        /><strong>1: Sins of the Flesh (Sp)</strong> <em>charm person</em>
        3/day, <em>eagle's splendor </em>2/ day, or <em>beast shape I</em>
        1/day<br /><strong>2: Compelling Voice (Su)</strong> Your mind-affecting
        effects become harder to resist. Increase the save DC of such effects
        created by you by +1, or by +2 when used against an intelligent creature
        that could be sexually attracted to you.<br /><strong>3: Truth in the
        Flesh (Sp)</strong> <em>Shapechange</em> 1/day.</em></p><h2><em>Boons -
        Fiendish
        Obedience</em></h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=94]<br
        /><strong>1: Deviant Urges (Sp)</strong> <em>command </em> 3/day,
        <em>unnatural lust</em> 2/day, or <em>reckless infatuation</em> 1/day<br
        /><strong>2: Lurid Persuasion (Su or Sp)</strong> When you create
        magical effects that manipulate the thoughts and minds of others, you
        invest your own debased passions and influences into that magic, so that
        it forces creatures to violate even their most deeply felt taboos.
        Mind-affecting spells you cast that would normally grant an additional
        saving throw or a bonus on saving throws for opposing the target's
        nature do not grant these bonuses or saves, as long as the intended
        course of action is lurid or perverse (such as causing a druid to lust
        after her animal companion, or a brother and sister to lust after one
        another). In addition, three times per day, you can cast quickened
        <em>unnatural lust</em> as a spell-like ability.<br /><strong>3:
        Perverse Reshaping (Sp)</strong> Your deeply felt prayers and obsessive
        devotion to the secrets Socothbenoth whispers to you when you sleep have
        granted you the ability to reshape matter and grant life where life
        should perhaps not exist. Three times per day, you can cast
        <em>polymorph any object</em> as a spell-like ability. Unlike with the
        spell, you are not limited to existing forms; you could turn the target
        into a three-headed nymph or a centaur-like creature made only of human
        body parts, for example (although this does not apply to inanimate
        forms, such as turning a human into a sculpture of soft clay or vice
        versa). You can also perform partial transformations, such as granting
        additional body parts, changing a creature's limbs into something else,
        or transforming only a creature's tongue into a tentacle. If the
        resulting form would be lethal, the target gains a +4 bonus on the save.
        Unlike for a normal <em>polymorph any object spell, changes you make
        this way can be undone only by a <em>wish</em> or <em>miracle</em> spell
        or by another use of this
        ability.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=94]<br
        /><strong>1: Sins of the Flesh (Sp)</strong> <em>charm person </em>
        3/day, <em>eagle's splendor 2/day, or <em>beast shape I</em> 1/day<br
        /><strong>2: Compelling Voice (Su)</strong> You have honed your voice
        into a weapon, and can speak in a smooth and seductive tone that slips
        into the minds of those who listen like the lightest brush of a lover's
        breath. As a result, your mind-affecting effects become harder to
        resist. Increase the save DC of such effects you create by 1, or by 2
        when used against an intelligent creature that is or could be sexually
        attracted to you.<br /><strong>3: Truth in the Flesh (Sp)</strong> The
        raptures of physical pleasure grow old when you throw taboo to the wind,
        and so you have honed your faith to emulate your sinful patron's
        fluidity of the flesh. You can cast <em>shapechange</em> once per day as
        a spell-like
        ability.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=94]<br
        /><strong>1: Before The Fall (Sp)</strong> <em>delusional pride </em>
        3/day, <em>mirror image</em> 2/day, or <em>heroism</em> 1/day<br
        /><strong>2: Violent Vice (Ex)</strong> Causing harm to others fills you
        with a euphoric pleasure that allows you to endure the harshest blows.
        Up to three times per day as you deal hit point damage to a creature,
        the rush of pleasure grants you temporary hit points equal to twice your
        Charisma modifier. These temporary hit points stack with multiple uses
        of this ability (but not with temporary hit points from other sources),
        and last for 1 minute or until depleted. As long as you are fully healed
        and have at least one of these temporary hit points, you gain a +4
        morale bonus on attack rolls and Will saving throws.<br /><strong>3:
        Sensuous Facade (Su)</strong> Your form has achieved the utmost
        perfection, granting you a measure of protection and filling you with a
        surge of prideful wrath whenever your beauty would be sullied by others'
        assaults. Your physical appearance becomes darkly beautiful and sexually
        appealing, granting you a +2 profane bonus to your Charisma score. As
        long as you do not have an armor bonus to your Armor Class, you gain a
        profane bonus to your AC and on Fortitude saving throws equal to your
        Charisma modifier. Whenever a creature deals damage to you with an
        attack, you gain a profane bonus equal to your Charisma modifier on your
        next weapon attack roll against that creature.</em></p><h2>For Followers
        of Socothbenoth</h2><h3>Feats</h3><p><em>Channel
        Discord</em></p><h3>Magic Items - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Traits</h3><p><em>Demonic Persuasion</em></p>
