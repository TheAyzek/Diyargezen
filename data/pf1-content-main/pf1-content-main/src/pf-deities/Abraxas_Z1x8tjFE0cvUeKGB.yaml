      content: >-
        <h1>Abraxas</h1><h2>Master of the Final
        Incantation</h2>@Source[PZO9267;pages=318] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Abraxas">Abraxas</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Forbidden lore, magic, snakes<br
        /><strong>Domains</strong> Chaos, Evil, Knowledge, Magic<br
        /><strong>Subdomains</strong> Arcane, Demon (Chaos), Demon (Evil),
        Education (Knowledge), Memory, Rites*, Thought<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Whip<br /><strong>Symbol</strong> Demonic face and
        snakes<br /><strong>Sacred Animal(s)</strong> Snake<br /><strong>Sacred
        Color(s)</strong> Green, orange</p><h3>Obedience</h3><p>Self-flagellate
        with a small whip or tree branch, punctuating each stroke with
        utterances of mystic words of power. Gain a +4 profane bonus on saves
        against charm effects and written magical effects.</p><h2>Boons -
        Demonic Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=9]<br
        /><strong>1: Secret Lore (Sp)</strong> <em>identify</em> 3/day,
        <em>augury </em> 2/day, or <em>illusory script</em> 1/day<br
        /><strong>2: Heretical Revelation (Su)</strong> Up to three times per
        day, you can whisper terrible secrets to an adjacent target as a
        standard action. The target can resist with a Will save (DC = 10 + 1/2
        your HD + your Charisma modifier). If the target fails its save, it is
        stunned for 1 round, then confused for 1d4 rounds, and then nauseated
        for 2d6 rounds. This is a mind-affecting effect.<br /><strong>3:
        Penultimate Incantation (Sp)</strong> Up to three times per day, you can
        affect a single creature within 60 feet with a targeted <em>greater
        dispel magic</em>. Each spell or effect dispelled inflicts fire damage
        to the target equal to the result of your caster level check made to
        dispel that effect. This ability is the equivalent of a 9th-level
        spell.</em></p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=10]<br
        /><strong>1: Warped Arcana (Sp)</strong> <em>magic aura</em> 3/day,
        <em>touch of idiocy</em> 2/day, or <em>dispel magic</em> 1/day<br
        /><strong>2: Poisoned Mysticism (Su)</strong> Your magic is imbued with
        the toxic lore of Abraxas. You add your Intelligence bonus on
        concentration checks and on caster level checks to penetrate spell
        resistance or dispel ongoing magical effects; if you already add your
        Intelligence modifier on such a check, add your Wisdom bonus instead. In
        addition, whenever you poison a creature via any method, whether from a
        spell such as <em>poison</em> or <em>prismatic spray, from an envenomed
        weapon, or any other means, the saving throw DC of the poison effect is
        increased by 2. Curing this poison effect requires one additional
        successful save, and caster level checks to cure this poison effect
        (such as that required for <em>neutralize poison</em>) take a -4
        penalty. You never risk accidentally poisoning yourself when you apply
        poison to a weapon. Finally, once per day, you can cast <em>poison</em>
        as a spell-like ability.<br /><strong>3: Invert Magic (Sp)</strong> The
        Master of the Final Incantation grants you the power to turn magic back
        on its source. You gain spell resistance equal to 11 + your Hit Dice; if
        you already have spell resistance as a result of a racial ability, it
        instead increases by 5. Whenever you would be affected by a spell, you
        can allow it to bypass your spell resistance, even when it's not your
        turn. Once per day, as an immediate action when a spell that targets
        only you fails to penetrate your spell resistance, you can reflect that
        spell back on the original caster, as if you were under the effect of
        <em>spell
        turning</em>.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=10]<br
        /><strong>1: Secret Lore (Sp)</strong> <em>identify </em> 3/day,
        <em>augury</em> 2/day, or <em>illusory script</em> 1/day<br /><strong>2:
        Heretical Revelation (Su)</strong> Three times per day as a standard
        action, you can whisper terrible secrets to an adjacent target. The
        target must succeed at a Will save (DC = 10 + half your Hit Dice + your
        Charisma modifier) or be stunned for 1 round, then confused for 1d4
        rounds, and then nauseated for 2d6 rounds. This is a mind-affecting
        effect.<br /><strong>3: Penultimate Incantation (Sp)</strong> Three
        times per day, you can affect a single creature within 60 feet with a
        targeted <em>greater dispel magic</em>. Each spell or effect so
        dispelled deals an amount of fire damage to the target equal to the
        result of your caster level check to dispel that
        effect.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=10]<br
        /><strong>1: Serpent Knight (Sp)</strong> <em>blade lash </em> 3/day,
        <em>extreme flexibility</em> 2/day, or <em>summon monster III (1
        fiendish constrictor snake or 1d4+1 fiendish vipers only) 1/day<br
        /><strong>2: Fanged Lash (Su)</strong> Any whip you wield grows
        serpentine scales, and the tip of the whip becomes a biting snake's
        head. Damage with your whip deals lethal damage, and you can damage
        creatures wearing armor. The whip deals an additional 1d6 points of
        damage on a hit, and once per minute as a swift action as you strike a
        foe with a whip, you can cause the whip to poison the target with black
        adder venom (<em>Pathfinder RPG Core Rulebook</em> 558). The saving
        throw DC of this venom is equal to 10 + half your Hit Dice + your
        Constitution modifier.<br /><strong>3: Tools of the Master (Su)</strong>
        You can imbue your weapons with echoes of those wielded by Abraxas
        himself. When you perform your obedience, choose a single whip and a
        single light or heavy shield you have to become imbued. An imbued shield
        gains the <em>animated</em> special ability. An imbued whip can siphon
        magical energy from spellcasting foes it strikes: up to three times per
        day as a swift action as you strike such a foe, you can attempt to drain
        magic. When you do so, the target must attempt a Will save (DC = 10 +
        half your Hit Dice + your Charisma modifier). If the target succeeds, it
        takes 1d4 points of ability damage to its Intelligence, Wisdom, or
        Charisma score (whichever is highest). If the target fails, the whip
        deals 1d6 points of ability drain to this ability score instead, and it
        absorbs one spell from the target. If the target is a spontaneous
        caster, one of its highest-level available spell slots is expended, and
        you regain a spell slot of an equal or lower level (your choice; if you
        don't have the ability to spontaneously cast spells, you receive no
        benefit from this). If the target is a prepared spellcaster, one of its
        highest-level spells (determined randomly) is lost as if cast, and that
        spell becomes stored in your whip (as per a <em>major ring of spell
        storing</em>). Your whip can store only one spell at a time in this way;
        if you drain another spell while your whip already contains one, the
        contained spell is replaced by the new spell you drain.</em></p><h2>For
        Followers of Abraxas</h2><h3>Feats</h3><p><em>Channel
        Discord</em></p><h3>Magic Items - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Traits</h3><p><em>Demonic Persuasion</em></p>
