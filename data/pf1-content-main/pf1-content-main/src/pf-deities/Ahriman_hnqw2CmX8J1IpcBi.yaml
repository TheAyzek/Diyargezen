        <h1>Ahriman</h1><h2>Lord of All Divs</h2>@Source[PZO9267;pages=316] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Ahriman">Ahriman</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Other Deities<br /><strong>Areas of
        Concern</strong> Destruction, div, nihilism<br
        /><strong>Domains</strong> Darkness, Death, Destruction, Evil<br
        /><strong>Subdomains</strong> Catastrophe, Fear, Loss, Rage<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Whip<br /><strong>Symbol</strong>
        Black and silver eclipse<br /><strong>Sacred Animal(s)</strong> Snake<br
        /><strong>Sacred Color(s)</strong> Black,
        silver</p><h3>Obedience</h3><p>While praying to Ahriman, destroy
        something of monetary or sentimental value to another person, preferably
        in front of someone who feels a strong emotional connection toward it.
        Alternatively, voluntarily take 1 point of Constitution damage while
        chanting praises to Ahriman and flagellating yourself with a barbed
        lash. After performing this obedience, your true alignment is masked
        from detection. Each time you perform this obedience, you select an
        alignment that you wish to detect as. Once chosen, this alignment can't
        be changed until you perform this obedience again or 24 hours pass. The
        masked alignment can trick items and magic that require a particular
        alignment. For example, a neutral evil follower can make her alignment
        appear to be lawful good, which would allow her to safely pass beyond a
        <em>glyph of warding</em> keyed to lawful good.</p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=12]<br
        /><strong>1: Ahriman's Word (Sp)</strong> <em>command </em> 3/day,
        <em>detect thoughts</em> 2/day, or <em>suggestion</em> 1/day<br
        /><strong>2: Unassailable Conviction (Su)</strong> You know existence is
        pointless and find little that can affect your outlook or sway your
        ultimate outcome in the bleak span of existence. Once per day when you
        fail a Will save, you can immediately roll again and use the second
        result as your actual saving throw result. If you succeed at this second
        save, you gain a +2 morale bonus on attack rolls and saving throws for 1
        hour.<br /><strong>3: Force the Lie (Su)</strong> Once per day, you can
        twist the intention of beneficial effects. As a standard action, you can
        create a wave of crackling black energy that fills a 30-foot-radius
        spread at any point within 90 feet of you. Creatures in this area other
        than yourself that are benefiting from a luck, morale, or sacred bonus
        instead treat that bonus as a penalty. You and other worshipers of
        Ahriman can see through this area of black energy with ease, but all
        other creatures treat the area as if it were under the effects of
        <em>obscuring mist</em>. The black energy persists for 1 round per Hit
        Die you have, and cannot be dissipated by wind effects. An affected
        creature can negate this adjustment to bonuses with a successful Will
        save (DC = 10 + half your Hit Dice + your Charisma modifier), but this
        does not negate the obscuring
        effect.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=12]<br
        /><strong>1: Hamper the Righteous (Sp)</strong> <em>protection from
        good</em> 3/day, <em>touch of idiocy</em> 2/day, or <em>bestow
        curse</em> 1/day<br /><strong>2: Pierce Obfuscation (Su)</strong> You
        can see the bleak truth despite means to hide your vision. You can see
        perfectly in darkness of any kind, including that created by <em>deeper
        darkness. Once per day, you can cast <em>true seeing as a spell-like
        ability.<br /><strong>3: Call for Ruin (Sp)</strong> You can conjure
        some of Ahriman's armies for your own purposes. Once per day as a
        standard action, you can summon 1d4+1 ghawwas, 1d3 shiras, or one sepid
        as if with <em>summon monster IX</em>, and you gain telepathy with them
        to a range of 100 feet. The divs summoned in this way follow your
        commands perfectly for 1 round per Hit Die you have before vanishing
        back to their home in Abaddon. The summoned divs don't follow commands
        that would cause them to perform overly good acts or save mortal lives
        other than your own, and they immediately vanish if your orders
        contradict these
        restrictions.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=12]<br
        /><strong>1: Break the Weak (Sp)</strong> <em>inflict light wounds </em>
        3/day, <em>death knell</em> 2/day, or <em>dispel magic</em> 1/day<br
        /><strong>2: Serpentine Lash (Su)</strong> Any whip you wield becomes an
        extension of your embodiment of evil, lashing out against all those who
        fail to prostrate themselves before you and oblivion. You gain Weapon
        Specialization (whip) and Whip Mastery as bonus feats, even if you do
        not meet the prerequisites. In addition, your whip takes on the illusory
        appearance of a serpent, and you gain a +2 profane bonus to combat
        maneuver checks to trip opponents. If you wield a whip with at least a
        +1 enhancement bonus, you can grant it the <em>dancing</em> weapon
        special ability for 6 rounds per day as a swift action. These rounds
        need not be consecutive.<br /><strong>3: Crush Opposition (Su)</strong>
        Three times per day, you can target one corporeal enemy within 60 feet
        and call out a castigating challenge that causes the creature to
        painfully collapse in on itself in a crackle of black energy. The target
        takes 10 points of damage per Hit Dice you have. Creatures targeted by
        this ability can attempt a Fortitude save (DC = 10 + half your Hit Dice
        + your Charisma modifier) to reduce the damage by half. A creature slain
        by this effect is completely destroyed, and all items it was carrying or
        wearing at the time fall to the ground and become cursed for a number of
        hours equal to your Hit Dice. The curse on these items causes nonevil
        creatures who carry one of the items to take a -1 penalty on saving
        throws against fear and insanity effects; the penalties for carrying
        multiple items stack.</em></p>
