      content: >-
        <h1>Ozranvial</h1><h2>Despair's Smile</h2>@Source[PZO1139;pages=132] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Ozranvial">Ozranvial</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Sahkil Tormentors<br /><strong>Areas
        of Concern</strong> Despair, restless spirits, sadism<br
        /><strong>Domains</strong> Destruction, Evil, Madness, Repose<br
        /><strong>Subdomains</strong> Fear, Nightmare, Souls, Torture<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Scorpion
        whip</p><h3>Obedience</h3><p>Torment or berate another sentient creature
        to instill a sense worthlessness. Gain a +4 profane bonus on Intimidate
        checks.</p><h2>Boons - Sahkil
        Tormentors</h2>@Source[PZO1139;pages=133]<br />Sahkil tormentors hold
        dominion over mortal fears and suffering. All are chaotic evil and range
        in power from CR 21 to CR 25. Their boons are less complex than those of
        other demigods, manifesting as spell-like abilities usable twice per day
        each.<p><strong>1</strong>: <em>death knell</em><br
        /><strong>2</strong>: <em>fear</em><br /><strong>3</strong>:
        <em>harm</em></p>
