      content: >-
        <h1>Slandrais</h1><h2>The Watcher in the
        Walls</h2>@Source[PZO9267;pages=318] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Slandrais">Slandrais</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Lechery, love potions, obsession<br
        /><strong>Domains</strong> Darkness, Evil, Knowledge, Magic<br
        /><strong>Subdomains</strong> Daemon, Loss, Lust, Thought<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Shortbow<br /><strong>Symbol</strong>
        Smoking pink potion<br /><strong>Sacred Animal(s)</strong> Goat<br
        /><strong>Sacred Color(s)</strong> Brown,
        pink</p><h3>Obedience</h3><p>Sleep on the grave or next to the corpse of
        someone you knew when the person was alive. Gain a +4 profane bonus on
        saving throws against charm effects.</p><h2>Boons - Daemon
        Harbingers</h2><p>@Source[PZO1139;pages=115]</p><p>Abaddon's unique
        daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>unnatural lust</em><br
        /><strong>2</strong>: <em>scrying</em><br /><strong>3</strong>:
        quickened <em>invisibility</em></p>
