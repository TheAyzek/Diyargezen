      content: >-
        <h1> Jezelda</h1><h2>Mistress of the Hungry
        Moon</h2>@Source[PZO9267;pages=320] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Jezelda">Jezelda</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Desolation, the moon, werewolves<br
        /><strong>Domains</strong> Animal, Chaos, Evil, Trickery<br
        /><strong>Subdomains</strong> Deception, Demon (Chaos), Demon (Evil),
        Fur, Moon<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Scimitar<br
        /><strong>Symbol</strong> Full moon above moor<br /><strong>Sacred
        Animal(s)</strong> Wolf<br /><strong>Sacred Color(s)</strong> Black,
        silver</p><h3>Obedience</h3><p>Under the night sky, offer prayers to the
        moon. On nights when there is no moon, you must supplement your prayers
        by sacrificing a living creature by tearing out its throat with your
        teeth and feeding on the still-warm body. Gain a +4 profane bonus on
        saving throws attempted when the moon is visible in the night
        sky.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=17]<br
        /><strong>1: Gift of the Moon (Sp)</strong> <em>charm animal</em> 3/day,
        <em>summon nature's ally II (1 fiendish wolf or 1d3 wolves only) 2/day,
        or <em>beast shape I</em> 1/day<br /><strong>2: Afflicted Lycanthrope
        (Su)</strong> You contract lycanthropy and become a werewolf (even if
        you normally couldn't gain that template). If you are already a
        werewolf, you become a true lycanthrope. If you are already a true
        lycanthrope, you gain a +2 bonus to Strength and Constitution.<br
        /><strong>3: True Lycanthrope (Su)</strong> You can use your
        lycanthropic change shape ability as a swift action. You become a true
        lycanthrope if you were an afflicted lycanthrope. If you are already a
        true lycanthrope, you gain another +2 bonus to Strength and
        Constitution.</em></p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=58]<br
        /><strong>1: Moonshadow (Sp)</strong> <em>keen senses </em> 3/day,
        <em>darkness</em> 2/day, or <em>rage</em> 1/day<br /><strong>2: Lunatic
        Potency (Su)</strong> The light of the moon fills your spells with
        maddening power and opens your heart to pure and primal rage. The DC of
        spells and spell-like abilities you cast under the light of the moon
        increase by 1, and you are healed of an amount of damage equal to the
        spell's level as the spell is cast. During nights of the full moon,
        spells with the fear or emotion descriptor have their save DCs increased
        by 2 and you are healed of an amount of damage equal to twice the
        spell's level when you cast such a spell.<br /><strong>3: Howl at the
        Moon (Su)</strong> You take on the aspect of the wolf- you become more
        rugged, your ears become elongated, and you sprout sharp fangs and fur.
        You gain a +2 profane bonus to your Strength, the scent ability, and a
        +4 bonus on trip combat maneuvers checks. You gain a bite natural attack
        that deals damage appropriate to your size (1d6 if you are Medium). As a
        swift action or whenever you hit with a bite attack, you can attempt
        combat maneuver to trip your foe; this trip attempt does not provoke
        attacks of
        opportunity.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=58]<br
        /><strong>1: Gift of the Moon (Sp)</strong> <em>charm animal</em> 3/day,
        <em>summon nature's ally II</em> (1 fiendish wolf or 1d3 wolves only)
        2/day, or <em>beast shape I</em> 1/day<br /><strong>2: Afflicted
        Lycanthrope (Su)</strong> You contract lycanthropy and become a werewolf
        (even if you couldn't normally gain that template). If you are already a
        werewolf, you become a true lycanthrope. If you are already a true
        lycanthrope, you gain a +2 bonus to your Strength and Constitution
        scores.<br /><strong>3: True Lycanthrope (Su)</strong> You can use your
        lycanthropic change shape ability as a swift action. You become a true
        lycanthrope if you were an afflicted lycanthrope. If you are already a
        true lycanthrope, you gain another +2 bonus to your Strength and
        Constitution
        scores.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=58]<br
        /><strong>1: Desolation of Flesh (Sp)</strong> <em>ray of enfeeblement
         </em> 3/day, <em>feast of ashes</em> 2/day, or <em>ray of exhaustion</em> 1/day<br
        /><strong>2: Beast Within (Su)</strong> You contract lycanthropy and
        become a werewolf (even if you couldn't normally gain that template). If
        you are already a werewolf, you become a true lycanthrope. If you are
        already a true lycanthrope, you gain a +2 bonus to your Dexterity score
        and a 10-foot increase to your base speed in your hybrid or animal
        form.<br /><strong>3: Lupine Champion (Su)</strong> You can use your
        lycanthropic change shape ability as a swift action. You become a true
        lycanthrope if you were an afflicted lycanthrope. If you are already a
        true lycanthrope, your natural armor bonus increases by 2 in your hybrid
        and animal form, or it increases by 6 when you're not wearing armor. In
        addition, you gain the pounce ability when in your hybrid form (whether
        you are a true lycanthrope or not), but only when you make attacks with
        natural weapons.</em></p><h2>For Followers of
        Jezelda</h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic Items
        - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Traits</h3><p><em>Demonic Persuasion</em></p>
