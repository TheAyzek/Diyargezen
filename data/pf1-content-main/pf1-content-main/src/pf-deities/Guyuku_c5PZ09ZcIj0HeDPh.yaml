        <h1>Guyuku</h1><h2>Sea Devil</h2>@Source[PZO1139;pages=126] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Guyuku">Guyuku</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Oni Daimyo<br /><strong>Areas of
        Concern</strong> Piracy, tea, tsunamis<br /><strong>Domains</strong>
        Chaos, Evil, Strength, Water<br /><strong>Subdomains</strong> Entropy,
        Fear, Ferocity, Oceans<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Nine-ring
        broadsword</p><h3>Obedience</h3><p>Perform a tea ceremony on the shore
        of an ocean or while blindfolded. Gain a +4 profane bonus on saving
        throws against water-based effects.</p><h2>Boons - Oni
        Daimyo</h2><p>@Source[PZO1139;pages=126]</p><p>The most powerful oni,
        the oni daimyo, hold their domains in isolated regions of the Material
        Plane. While they have transcended their lesser incarnations to become
        something close to demigods in stature, they do not flaunt their power
        and prefer to dwell in remote corners of the massive land of Tian
        Xia.</p><p> Oni daimyo are always evil in alignment but can be chaotic,
        lawful, or neutral. They range in power from CR 21 to CR 25. The boons
        they grant are less complex than those granted by fiendish demigods,
        manifesting as spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>slipstream</em><br
        /><strong>2</strong>: <em>control water</em><br /><strong>3</strong>:
        <em>heroes' feast</em></p>
