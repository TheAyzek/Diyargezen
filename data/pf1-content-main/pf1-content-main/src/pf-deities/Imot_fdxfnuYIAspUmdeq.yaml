      content: >-
        <h1>Imot</h1><h2>The Symbol of Doom</h2>@Source[PZO92114;pages=9] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Imot">Imot</a><h3>Details</h3><p><strong>Alignment</strong>
        N<br /><strong>Pantheon</strong> Psychopomp Usher<br /><strong>Areas of
        Concern</strong> Inevitably, mathematics, and portents<br
        /><strong>Domains</strong> Luck, Repose, Rune, Weather<br
        /><strong>Subdomains</strong> N/A<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Light
        shield<br /><strong>Symbol</strong> Three adjacent circles arranged
        above, bisected by, and below a horizontal
        line</p><h3>Obedience</h3><p>Spend an hour in a dark space barely large
        enough for you to fit and cast your thoughts out from your body. Gain a
        +4 insight bonus on Perception checks to spot portents and traps; this
        expanded insight also allows you to disable magic traps as if you had
        the rogue's trapfinding ability.</p><h2>Boons - Monitor
        Obedience</h2><h3>None</h3><p>@Source[PZO92114;pages=9]<br /><strong>1:
        The Coming Storm (Sp)</strong> <em>doom</em> 3/day, <em>scare</em>
        2/day, or <em>rain of frogs</em> 1/day<br /><strong>2: Insight into
        Disaster (Ex)</strong> You gain a bonus equal to your Wisdom modifier on
        initiative checks and Reflex saves.<br /><strong>3: Call Down the Wrath
        (Sp)</strong> You can cast extended <em>control weather</em> once per
        day.</em></p><h2>For Followers of Imot</h2><h3>Prestige
        Classes</h3><p><em>Mortal Usher</em></p>
