      content: >-
        <h1>Sarenrae</h1><h2>The Dawnflower</h2>@Source[PZO9267;pages=132] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Sarenrae">Sarenrae</a><h3>Details</h3><p><strong>Alignment</strong>
        NG<br /><strong>Pantheon</strong> Core Deities<br /><strong>Other
        Pantheons</strong> Halfling Deities, Sandpoint Pantheon<br
        /><strong>Areas of Concern</strong> Healing, honesty, redemption, the
        sun<br /><strong>Domains</strong> Fire, Glory, Good, Healing, Sun<br
        /><strong>Subdomains</strong> Agathion, Day, Heroism, Light, Medicine*,
        Redemption, Restoration, Resurrection, Revelation, Thirst*<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Scimitar<br /><strong>Symbol</strong>
        Angelic ankh<br /><strong>Sacred Animal(s)</strong> Dove<br
        /><strong>Sacred Color(s)</strong> Blue,
        gold</p><h3>Obedience</h3><p>The Dawnflower values the redemptive powers
        of compassion and patience, and extends them to all who might be capable
        of good. Offer to heal a stranger of his wounds, either by using the
        powers granted to you by Sarenrae or with a potion, scroll, or other
        item you possess. Tell the stranger it is by the will of Sarenrae that
        you share your healing gifts. You may also use your Heal skill to
        perform this act of healing service. If you can't find a stranger who
        will accept your offer, stand beneath the open sky during the daylight
        hours. Blindfold yourself with a red-and-gold scarf and try to locate
        the sun in the sky through the layers of fabric. Gain a +2 sacred bonus
        on Perception checks.</p><h3>Divine
        Gift</h3><p>@Source[PZO1141;pages=80] <em></em><br /><em>Nethys Note:
        See here for details on how to gain a Divine Gift<br />As the sun rises
        over the recipient's home world, he can perform a 10-minute prayer (this
        may be part of his daily ritual to prepare spells) to invoke the
        Dawnflower. For the next 24 hours, all healing effects the character
        generates heal the maximum amount of damage possible. In addition,
        during this time he can cast <em>breath of life and <em>heal</em> as
        spell-like abilities 3 times each (CL 20th).</em></p><h3>On
        Golarion</h3><p><em><strong>Centers of Worship</strong> Absalom,
        Katapesh, Osirion, Qadira, Taldor, Thuvia<br
        /><strong>Nationality</strong> Keleshite</em></p><h2>Boons - Deific
        Obedience</h2><h3> Evangelist</h3><p>@Source[PZO9267;pages=132]<br
        /><strong>1: Healing Spirit (Sp)</strong> <em>cure light wounds</em>
        3/day, <em>aid</em> 2/day, or <em>remove curse</em> 1/day<br
        /><strong>2: Fiery Spirit (Su)</strong> You have spent so much time in
        the sun, reveling in Sarenrae's power and meditating on her glory, that
        its fiery rays have soaked into your very soul. You gain fire resistance
        10.<br /><strong>3: Holy Brand of the Sun (Su)</strong> Your devotion to
        the Dawnflower allows you to wrap your weapon in her cleansing flames to
        better bring justice to her foes. For a number of rounds per day equal
        to 1 + 1 for every 4 Hit Dice you possess (maximum 6 rounds), you can
        cause flames to wreathe your weapon. Any weapon you hold while this
        ability is active becomes a <em>+1 flaming burst </em>weapon. (You can
        use this ability on a ranged weapon, but can't apply it directly to a
        piece of ammunition.) If you drop the weapon or give it away, the flame
        effect on that weapon immediately ends. If the weapon you hold has an
        enhancement bonus greater than +1, use the higher bonus. Activating or
        deactivating this ability is a free action, and the rounds in which you
        use the ability don't need to be
        consecutive.</em></p><h3>Exalted</h3><p>@Source[PZO9267;pages=132]<br
        /><strong>1: Brightness (Sp)</strong> <em>dancing
        lantern</em><sup>APG</sup> 3/day, <em>continual flame</em> 2/day, or
        <em>daylight</em> 1/day<br /><strong>2: Healing Sunburst (Su)</strong>
        You can transmute the sun's burning rays into brilliant, healing fire.
        You can add your exalted levels to any cleric levels you have to
        calculate the power of your channel energy ability. In addition, you can
        spend three of your daily uses of your channel energy ability to channel
        an especially powerful burst of healing that manifests as a bright burst
        of sunlight around you. Anyone healed by your channeled energy sunburst
        who is currently suffering from poison or a nonmagical disease can
        immediately attempt a new saving throw with a +2 sacred bonus to end the
        poison or disease effect.<br /><strong>3: Angelic Ally (Sp)</strong>
        Once per day as a standard action, you can summon a movanic deva
        (<em>Pathfinder RPG Bestiary</em> 2</em> 28) to aid you. You gain
        telepathy with the movanic deva to a range of 100 feet. The deva follows
        your commands perfectly for 1 minute for every Hit Die you possess
        before vanishing back to its home. The deva doesn't follow commands that
        would cause it to violate its alignment by committing evil acts, and it
        could even attack you if the command is particularly
        egregious.</em></p><h3>Sentinel</h3><p>@Source[PZO9267;pages=132]<br
        /><strong>1: Firebrand (Sp)</strong> <em>produce flame</em> 3/day,
        <em>fire breath</em><sup>APG</sup> 2/day, or <em>fireball</em> 1/day<br
        /><strong>2: Channel Efficiency (Su)</strong> You are a talented healer,
        and have honed your ability so that you can preserve your resources
        while you provide aid to the wounded. You can channel positive energy by
        consuming a single use of your lay on hands ability instead of two uses.
        If you don't have the lay on hands class feature (or if you have lay on
        hands but can't use it to channel positive energy), you instead gain a
        +4 sacred bonus on Heal checks.<br /><strong>3: Sunburst Strike
        (Sp)</strong> Once per day, you can channel the effects of <em>sunburst
        </em>through your weapon. You must declare your use of this ability
        before you roll your attack. On a hit, the target is affected as if you
        had cast <em>sunburst, as well as taking normal weapon damage. The
        <em>sunburst </em>effect you generate affects only the target you have
        struck, not an area of effect as it would normally. If you miss with
        your attack, the <em>sunburst </em>ability is
        wasted.</em></p><h2>Paladin Code</h2><em>The paladins of the Dawnflower
        are fierce warriors, like their goddess. They provide hope to the weak
        and support to the righteous. Their tenets include the following adages.
        <ul><li>I will protect my allies with my life. They are my light and my
        strength, as I am their light and their strength. We rise
        together.</li><li>I will seek out and destroy the spawn of the Rough
        Beast. If I cannot defeat them, I will give my life trying. If my life
        would be wasted in the attempt, I will find allies. If any fall because
        of my inaction, their deaths lie upon my soul, and I will atone for
        each.</li><li>I am fair to others. I expect nothing for myself but that
        which I need to survive.</li><li>The best battle is a battle I win. If I
        die, I can no longer fight. I will fight fairly when the fight is fair,
        and I will strike quickly and without mercy when it is not.</li><li>I
        will redeem the ignorant with my words and my actions. If they will not
        turn toward the light, I will redeem them by the sword.</li><li>I will
        not abide evil, and will combat it with steel when words are not enough.
        I do not flinch from my faith, and do not fear embarrassment. My soul
        cannot be bought for all the stars in the sky.</li><li>I will show the
        less fortunate the light of the Dawnflower. I will live my life as her
        mortal blade, shining with the light of truth.</li><li>Each day is
        another step toward perfection. I will not turn back into the
        dark.</li></ul><h2>Divine Fighting Technique</h2><h3>Sarenrae's
        Mercy</h3><p>@Source[PZO9472;pages=30] <br />Although the Dawnflower is
        the goddess of healing and redemption, she is not a goddess of peace,
        and her followers are taught that combat may be the only way to ensure
        the safety of those who look to the faith for protection. In such
        situations, the faithful of Sarenrae are expected to end combat swiftly
        and efficiently, to avoid drawing out the pain and agony of battle. When
        one can end a battle without resorting to killing, the opportunity for
        redemption of the defeated foe still remains. The pages of
        <em>Dawnflower's Mercies</em> teach methods by which those who serve
        Sarenrae as soldiers can vanquish enemies in combat without killing
        them, and encourage those who follow the teachings held within to offer
        those they take prisoner the chance to be welcomed into Sarenrae's
        arms.</p><p><strong>Initial Benefit</strong>: You take no penalty on
        attack rolls for using a scimitar to deal nonlethal damage. If your
        attack with the scimitar would normally deal additional damage (such as
        via sneak attack, the flaming weapon special ability, or the like), this
        additional damage can be nonlethal damage. You can also alter spells
        with the fire, good, or light descriptor and inflict spells so that the
        damage they deal is nonlethal damage instead. You can choose to apply
        this effect as the spell is cast.</p><p><strong>Advanced
        Prerequisites</strong>: Great Fortitude, Weapon Focus (scimitar), Heal
        10 ranks.</p><p><strong>Advanced Benefit</strong>: Once per round as you
        strike a foe with a weapon and deal nonlethal damage with that attack,
        you regain 1d6 hit points as the warmth of Sarenrae's approval and the
        conviction that you are doing the right thing to minimize suffering
        infuses your body and soul. If the attack that dealt nonlethal damage
        was from a scimitar, you instead regain 2d6 hit points. You can gain the
        benefit of this healing only once per round, regardless of how many
        successful attacks you make with the weapon.</p><h2>For Followers of
        Sarenrae</h2><h3>Archetypes</h3><p>Angelfire Apostle (Cleric),
        Dawnflower Dervish (Bard), Dervish Dancer (Bard), Merciful Healer
        (Cleric), Undead Scourge (Paladin)</p><h3>Feats</h3><p>Bestow Hope,
        Dawn's Blessing, Dervish Dance, Flame Blade Dervish, Glorious Blaze,
        Glorious Heat, Sacred Pyromania, Sun Striker</p><h3>Magic Items -
        Altars</h3><p>Altar of Sarenrae, Altar of the Dawnflower</p><h3>Magic
        Items - Armor</h3><p>Dawnflower Chain Vest</p><h3>Magic Items -
        Rings</h3><p>Glorious Flame Ring</p><h3>Magic Items -
        Weapons</h3><p>Dawnfire</p><h3>Magic Items - Wondrous
        Items</h3><p>Dawnflower Lantern, Dawnflower Sash, Dervish Sikke,
        Saliharion, Scabbard of the Lost Kiss, Sunlord's
        Feather</p><h3>Monsters</h3><p>Sunlord Thalachos (Herald),
        Yhohm</p><h3>Prestige Classes</h3><p>Dawnflower Anchorite, Dawnflower
        Dissident</p><h3>Spells</h3><p>Daybreak Arrow, Shield of the Dawnflower,
        Shield of the Dawnflower, Greater, Sign of the Dawnflower, Sun Metal,
        Unwelcome Halo</p><h3>Traits</h3><p>Ambassador, Blade of Mercy,
        Cleansing Light, Cleansing the Twisted, Dawn Renewal, Envoy of Healing,
        Flame of the Dawnflower, Illuminator, Light-Bringer, Strength of the
        Sun, Under Siege</p><h2>Unique Spell
        Rules</h2>@Source[PZO9267;pages=139]<p><h3>Cleric/Warpriest</h3></p><p><em>Sunbeam
        can be prepared as a</em> 7th-level spell<br /><em>Sunburst</em> can be
        prepared as a 8th-level spell<br /><em>Flame Blade can be prepared as
        a</em> 3rd-level spell<br
        /></em></p><h3>Inquisitor</h3><p><em>Sunbeam</em> can be prepared as a
        5th-level spell<br /><em>Sunburst can be prepared as a</em> 6th-level
        spell<br /><em>Sun Metal</em> can be prepared as a 1st-level spell<br
        /><em>Flame Blade can be prepared as a</em> 3rd-level spell<br
        /></em></p><h3>Paladin</h3><p><em>Sunbeam</em> can be prepared as a
        4th-level spell<br /><em>Flame Blade can be prepared as a</em> 2nd-level
        spell<br /></em></p><h3>Ranger</h3><p><em>Sunbeam</em> can be prepared
        as a 4th-level spell<br /><em>Daylight can be prepared as a</em>
        3rd-level spell<br /><em>Flame Blade</em> can be prepared as a 2nd-level
        spell<br /></em></p><h2>Unique Summon
        Rules</h2>@Source[PZO9020;pages=62]<br /><strong>Summon Monster
        VI</strong>: Janni - NG<br /><strong>Summon Monster VII</strong>: Djinni
        - NG<br /><strong>Summon Monster VIII</strong>: Efreeti - LG (redeemed)
        [does not have the <em>wish</em> spell-like ability]<br /><strong>Summon
        Nature's Ally VII</strong>: Djinni - NG<br /><strong>Summon Nature's
        Ally VIII</strong>: Efreeti - LG (redeemed) [does not have the
        <em>wish</em> spell-like ability]
