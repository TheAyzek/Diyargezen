        <h1>Naderi</h1><h2>The Lost Maiden</h2>@Source[PZO9290;pages=77] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Naderi">Naderi</a><h3>Details</h3><p><strong>Alignment</strong>
        N<br /><strong>Pantheon</strong> Other Deities<br /><strong>Areas of
        Concern</strong> Drowning, romantic tragedy, suicide<br
        /><strong>Domains</strong> Charm, Nobility, Repose, Water<br
        /><strong>Subdomains</strong> Love, Lust, Martyr, Souls<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Dagger<br /><strong>Symbol</strong>
        Ornate golden dagger<br /><strong>Sacred Animal(s)</strong> Swan<br
        /><strong>Sacred Color(s)</strong> Blue,
        red</p><h3>Obedience</h3><p>Collect two unblemished white rose blossoms,
        open to their fullest but without any wilted petals. Stand beside a
        river and cut the blossoms from the stems, then set them on the water to
        float downstream. Meditate upon the beautiful perfection of love and the
        imperfection of a life that would deny it to star-crossed lovers. You
        gain a +2 profane or sacred bonus on Charismabased skill checks. The
        type of bonus depends on your alignment-if you're neither good nor evil,
        you must choose either sacred or profane the first time you perform your
        obedience, and this choice can be changed.</p><h3>On
        Golarion</h3><p><strong>Centers of Worship</strong> Galt, Nidal, Taldor,
        Qadira, Ustalav<br /><strong>Nationality</strong> Taldan</p><h2>Boons -
        Deific Obedience</h2><h3> Evangelist</h3><p>@Source[PZO9290;pages=77]<br
        /><strong>1: Watery Souls (Sp)</strong> <em>wave
        shield</em><sup>ACG</sup> 3/day, <em>life pact<sup>ACG</sup> 2/day, or
        <em>water breathing</em> 1/day<br /><strong>2: Depths of the Maelstrom
        (Su)</strong> You do not fear death by water, for you are unafraid of
        your goddess's embrace, and you can capitalize on others' terror of the
        depths. Three times per day as an immediate action, when you step into
        any natural body of water, you can cause water within a 30-foot radius
        of where you stand to churn. You are unaffected by this churning. Any
        other creature wading or swimming in this water must attempt Swim checks
        as if the water were one category rougher; wading creatures must attempt
        DC 10 Swim checks, creatures swimming in calm water must make DC 15 Swim
        checks, creatures swimming in rough water must attempt DC 20 Swim
        checks, and creatures swimming in stormy water must attempt DC 25 Swim
        checks. If the water has a natural current, that current becomes fast
        moving. If the current was already fast moving, the DC of the Swim or
        Strength check to avoid going under increases to 15 + half your Hit
        Dice. This effect lasts for a number of rounds equal to your Hit Dice or
        until you leave the water, whichever is first.<br /><strong>3: Healing
        Waters (Su)</strong> You have learned that the waters can take life, but
        also that they can give it. Three times per day, you can hold a creature
        underwater for a number of rounds equal to half your Hit Dice. Each
        round, as long as the creature is submerged and holding its breath, it
        is healed of 1d8 + 5 points of damage. If the creature doesn't hold its
        breath, it doesn't receive healing that round. If you submerge a
        creature and heal it for fewer rounds than half your Hit Dice, it still
        counts as one use of this
        ability.</em></p><h3>Exalted</h3><p>@Source[PZO9290;pages=77]<br
        /><strong>1: No Rest for the Living (Sp)</strong> <em>heightened
        awareness</em><sup>ACG</sup> 3/day, <em>compassionate
        ally</em><sup>UM</sup> 2/day, or <em>lover's
        vengeance</em><sup>ISWG</sup> 1/day<br /><strong>2: Nothing Left to Lose
        (Su)</strong> The losses you have suffered have made you morose and
        perhaps even aloof, but also fearless in battle. Once per day as a
        standard action, you may call out the name of a loved one you have lost.
        All opponents within hearing distance must succeed at a Will saving
        throw (DC = 10 + 1/2 your Hit Dice + your Wisdom modifier) or become
        shaken for a number of rounds equal to your Hit Dice. If you cause at
        least one creature to become shaken in this way, you gain a +2 profane
        or sacred bonus (of the same type as that provided by your obedience) on
        saving throws against spells with the mind-affecting descriptor for a
        number of rounds equal to your Hit Dice.<br /><strong>3: Final Strike
        (Sp)</strong> You can call down your goddess's cleansing wrath upon your
        wretched enemies. Three times per day as a standard action, you can
        cause a great column of white light to pour from the heavens that acts
        as a fireball, except the damage is force damage. A successful Reflex
        saving throw (DC = 13 + your Wisdom modifier) halves this
        damage.</em></p><h3>Sentinel</h3><p>@Source[PZO9290;pages=77]<br
        /><strong>1: Frozen Despair (Sp)</strong> <em>icicle
        dagger</em><sup>UM</sup> 3/day, <em>castigate<sup>APG</sup> 2/day, or
        <em>howling agony</em><sup>UM</sup> 1/day<br /><strong>2: All Who Live
        Suffer Loss (Su)</strong> You channel the despair and grief you have
        suffered into a cloud of sadness that saps the will of those who oppose
        you. All foes within a 30-foot, cone-shaped burst are staggered for a
        number of rounds equal to your Hit Dice, and take a -1 penalty on attack
        rolls, saving throws, ability checks, skill checks, and weapon damage
        rolls. A successful Will saving throw (DC = 10 + 1/2 your Hit Dice +
        your Charisma modifier) negates this effect.<br /><strong>3: Mantle of
        Tragic Grace (Sp)</strong> You drape yourself in tragic glamor, and your
        longing for rest puts you beyond the reach of mortal harm for a
        lingering moment. As a standard action, you can activate this mantle,
        which acts as a <em>globe of invulnerability</em>. You may use this
        ability for a number of rounds each day equal to your Hit Dice. These
        rounds do not need to be consecutive, and you can dismiss this effect as
        a standard action that does not provoke attacks of
        opportunity.</em></p><h2>For Followers of Naderi</h2><h3>Magic Items -
        Wondrous Items</h3><p><em>Hero's Release
        Pendant</em></p><h3>Traits</h3><p><em>Empty Heart, Full
        Heart</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9290;pages=80]<em></em><br
        /><h3>Cleric/Warpriest</h3><p><em>Confusion, Lesser</em> can be prepared
        as a 1st-level spell<br /><em>Crushing Despair can be prepared as a
        3rd-level spell<br /><em>Suffocation</em> can be prepared as a 5th-level
        spell<br /></em></p><h3>Inquisitor</h3><p><em>Confusion, Lesser can be
        prepared as a 1st-level spell<br /><em>Crushing Despair</em> can be
        prepared as a 3rd-level spell<br /><em>Suffocation</em> can be prepared
        as a 5th-level spell</em></p>
