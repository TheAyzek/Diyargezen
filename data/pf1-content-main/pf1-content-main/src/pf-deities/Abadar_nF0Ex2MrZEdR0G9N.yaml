      content: >-
        <h1>Abadar</h1><h2>Master of the First
        Vault</h2>@Source[PZO9267;pages=12] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Abadar">Abadar</a><h3>Details</h3><p><strong>Alignment</strong>
        LN<br /><strong>Pantheon</strong> Core Deities<br /><strong>Other
        Pantheons</strong> Deities of Tian Xia, Halfling Deities, Order of the
        God Claw Pantheon, Sandpoint Pantheon, Taldan Pantheon<br
        /><strong>Areas of Concern</strong> Cities, laws, merchants, wealth<br
        /><strong>Domains</strong> Earth, Law, Nobility, Protection, Travel<br
        /><strong>Subdomains</strong> Aristocracy, Defense, Fortifications,
        Inevitable, Leadership, Legislation (Law), Martyr, Metal, Portal*,
        Trade<br /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Light crossbow<br
        /><strong>Symbol</strong> Golden key<br /><strong>Sacred
        Animal(s)</strong> Monkey<br /><strong>Sacred Color(s)</strong> Gold,
        silver</p><h3>Obedience</h3><p>Take a handful of mixed gems, coins, and
        keys. Include coins from three or more different currency systems (such
        as from three different kingdoms), as well as at least three different
        keys-one of which should be the key to a lockbox, vault, or other such
        storage item. Kneel before a scale and balance the items as perfectly as
        you can on it, removing and replacing items in order to create the most
        equitable balance of items. Randomize the items you select each time you
        perform this obedience, so as not to let your obedience become routine.
        Meditate on the teachings from <em>The Order of Numbers</em>. Gain a +4
        sacred or profane bonus on saving throws against spells and effects
        generated by creatures with a chaotic alignment. The type of bonus
        depends on your alignment-if you're neither good nor evil, you must
        choose either sacred or profane the first time you perform your
        obedience. Once made, this choice can't be changed.</p><h3>Divine
        Gift</h3><p>@Source[PZO1141;pages=74] <br /><em>Nethys Note: See here
        for details on how to gain a Divine Gift</em><br />The character gains
        the ability to cast <em>word of recall</em> as a spell-like ability (CL
        20th). This version of <em>word of recall</em> can transport the caster
        across planar boundaries, but it still doesn't function in areas that
        bar teleportation effects. When a character gains this gift, the GM
        designates as the spell's sanctuary a specific temple of Abadar located
        in a city of at least 1,000 inhabitants.</p><h3>On
        Golarion</h3><p><strong>Centers of Worship</strong> Absalom, Andoran,
        Brevoy, Cheliax, Katapesh, Mana Wastes, Molthune, Nex, Osirion, Sargava,
        Taldor, Varisia<br /><strong>Nationality</strong> Taldan</p><h2>Boons -
        Deific Obedience</h2><h3> Evangelist</h3><p>@Source[PZO9267;pages=12]<br
        /><strong>1: Diplomat (Sp)</strong> <em>comprehend languages</em> 3/day,
        <em>calm emotions</em> 2/day, or <em>glibness</em> 1/day<br /><strong>2:
        City Dweller (Ex)</strong> You never become lost in cities of more than
        5,000 inhabitants-upon entering a city, even for the first time, you can
        always retrace your steps and intuit where particular districts must be.
        Furthermore, you pick up local accents and vernacular instantly, giving
        you the cant of a citizen. You also gain a +4 sacred or profane bonus on
        Disguise and Knowledge (local) checks while in the bounds of a city.<br
        /><strong>3: Sneaky Bolt (Ex)</strong> Three times per day, you can
        snipe with a crossbow while hidden, and have little chance of revealing
        your location. You must declare your use of this ability before you roll
        your attack. You can use this ability only if your target is within 30
        feet of you and unaware of your presence or precise location. Once you
        roll your attack, immediately attempt a Stealth check for sniping
        without the normal -20
        penalty.</em></p><h3>Exalted</h3><p>@Source[PZO9267;pages=12]<br
        /><strong>1: Ordered Mien (Sp)</strong> <em>Abadar's truthtelling</em>
        3/day, <em>align weapon (lawful only)</em> 2/day, or <em>magic circle
        against chaos</em> 1/day<br /><strong>2: Diplomatic Immunity
        (Ex)</strong> While within the bounds of a city of more than 5,000
        inhabitants, you gain a +4 sacred or profane bonus on Bluff and
        Diplomacy checks. You also gain special status with the law. You're
        considered a person to be respected, and may obtain special treatment
        and assistance that ordinary citizens could not, such as information on
        political activity, criminal investigations, or threats against the
        city. Any bribes or fees that would normally be levied by the legal
        system are waived for you. City guards and officials with an initial
        starting attitude of unfriendly or hostile instead have an attitude of
        indifferent toward you. These benefits apply only when you identify
        yourself as an exalted of Abadar.<br /><strong>3: Scales of Balance
        (Su)</strong> Once per day as a full-round action, you can pool and
        redistribute your current hit points and those of all willing allies
        within 30 feet of you. Total your current hit points and those of your
        willing allies, and then decide how you wish to redistribute them among
        the same individuals. You cannot give an ally more hit points than her
        maximum, nor can you leave an ally with 0 hit
        points.</em></p><h3>Sentinel</h3><p>@Source[PZO9267;pages=12]<br
        /><strong>1: Lawful Bulwark (Sp)</strong> <em>shield of faith</em>
        3/day, <em>shield other</em> 2/day, or <em>archon's
        aura</em><sup>UM</sup> 1/day<br /><strong>2: Unflagging Ally
        (Sp)</strong> Once per day as a standard action, you can summon a
        zelekhut inevitable. You gain telepathic communication with the zelekhut
        to a range of 100 feet, and the zelekhut follows your commands perfectly
        for 1 minute for each Hit Die you possess before vanishing back to its
        home. The zelekhut doesn't obey any command that would violate its
        lawful alignment-such commands are met with grim refusal, and could even
        prompt the zelekhut to attack you if the command is egregious enough.<br
        /><strong>3: Dictum Blow (Su)</strong> Once per day, you can channel the
        effects of <em>dictum </em>through your weapon, though you don't need to
        cast (or even know) the spell. You must declare your use of this ability
        before rolling your attack. On a hit, the target is affected as if
        caught in the area of <em>dictum</em> as cast by a cleric of a level
        equal to your Hit Dice (maximum 20). If the target is lawful or its Hit
        Dice exceeds yours, it is unaffected. If your attack misses or the
        creature is unaffected, the <em>dictum</em> effect is
        wasted.</p><h2>Paladin Code</h2><em>Of all the neutral gods, only Abadar
        supports and promotes a holy order of paladins. As the god of
        civilization and order, Abadar recognizes the value of holy warriors in
        advancing society's aims. His paladins follow the standard paladin code
        of protecting the innocent, acting with honor and honesty, and
        respecting lawful authority. In addition, an Abadaran paladin upholds
        the following creed. <ul><li>I am a protector of the roadways and keep
        travelers from harm. No matter their destinations or goals, if they are
        peaceable and legitimate travelers who harm no others on the road, I
        will ensure that they pass safely.</li><li>Bandits are a plague. Under
        my will they come to justice. If they will not come willingly before the
        law, where they can protest for justice in the courts, they will come
        under the power of my sword.</li><li>Corruption in the courts is the
        greatest corruption of civilization. Without confidence in justice,
        citizens cannot believe in their countries, and civilization begins to
        disappear. I will root out corruption wherever I find it, and if a
        system is fundamentally flawed, I will work to aid citizens by reforming
        or replacing it.</li><li>I am an aid to the markets. I ensure equitable
        trade between merchants and citizens. Theft and deceit on either side
        are intolerable.</li><li>I make opportunities, and teach others to
        recognize them. When I aid others, I open the way for them, but will not
        carry them-they must take responsibility.</li></ul><h2>Divine Fighting
        Technique</h2><h3>Abadar's Crossbow</h3><p>@Source[PZO9463;pages=10] <br
        />Abadar teaches complex crossbow techniques.</p><p><strong>Initial
        Benefit</strong>: You can attempt a ranged steal<sup>APG</sup> combat
        maneuver check with a crossbow, using your Dexterity modifier in place
        of your Strength modifier to calculate your Combat Maneuver Bonus. If
        you succeed, the stolen item is knocked away by the bolt; if the bolt
        can pierce any part of the item and the item weighs 2 pounds or less,
        the bolt continues past the creature and carries the item up to one
        range increment away, pinning it to whatever surface it lands
        on.</p><p><strong>Advanced Prerequisites</strong>: Rapid Reload, base
        attack bonus +10.</p><p><strong>Advanced Benefit</strong>: When fighting
        a foe adjacent to a firm surface, you can attempt a ranged dirty
        trick<sup>APG</sup> combat maneuver check with a crossbow, using your
        Dexterity modifier in place of your Strength modifier to calculate your
        Combat Maneuver Bonus. If you succeed, your bolt pins the target's
        clothing (or feathers, hide, or the like) to the surface, preventing the
        target from leaving that space until it breaks free by destroying the
        bolt or removing it with a successful Strength check (DC = the result of
        your combat maneuver check to pin it).</p><h2>For Followers of
        Abadar</h2><h3>Archetypes</h3><p>Crossbowman (Fighter), Knight of Coins
        (Paladin), Urban Druid (Druid), Urban Ranger
        (Ranger)</p><h3>Feats</h3><p>Crossbow Mastery, Divine Dignity, Measured
        Response, Perfect Casting</p><h3>Magic Items - Altars</h3><p>Altar of
        Abadar</p><h3>Magic Items - Armor</h3><p>Golden Judge's
        Breastplate</p><h3>Magic Items - Rods</h3><p>Rod of Metal and Mineral
        Detection</p><h3>Magic Items - Weapons</h3><p>Fugitive Finder, Mace of
        Keys, Vaultbow</p><h3>Magic Items - Wondrous Items</h3><p>Elixir of
        Truth, Key Cloak, Key of the Second Vault, Lyre of Building, Meltdown
        Safe, Safecamp Wagon, Secure Paypack, Universal
        Lock</p><h3>Monsters</h3><p>Lawgiver (Herald), Orsheval</p><h3>Prestige
        Classes</h3><p>Balanced Scale of Abadar,
        Justicar</p><h3>Spells</h3><p>Abadar's Truthtelling, Blessing of the
        Watch, Dictum, Fairness, Order's Wrath, Soul Vault, True
        Appraisal</p><h3>Traits</h3><p>Eye for Quality, Eyes and Ears of the
        City, Honey-Tongued, Lover of the Law, Sense of Order, The City
        Protects</p><h2>Unique Spell
        Rules</h2>@Source[PZO9296;pages=33]<p><h3>All
        Classes</h3></p><p><em>Soul Vault</em> can be prepared as a 4th-level
        spell</p><h3>Cleric/Warpriest</h3><p><em>Word of Recall</em> can be
        prepared as a 5th-level spell [if their designated sanctuaries are the
        temples of their home cities]</p><h3>Paladin</h3><p><em>Word of
        Recall</em> can be prepared as a 4th-level spell [if their designated
        sanctuaries are the temples of their home cities]</p><h2>Unique Summon
        Rules</h2>@Source[PZO9008;pages=67]<br /><strong>Summon Monster
        II</strong>: Celestial Two-Headed Eagle - LN [this creature has two
        heads. It gains a +2 racial bonus on Listen, Spot, and Search checks,
        but does not gain an extra bite attack]<br /><strong>Summon Monster
        III</strong>: Celestial Hippogriff - LN<br /><strong>Summon Monster
        IV</strong>: Two-Headed Giant Eagle - LN [this creature has two heads.
        It gains a +2 racial bonus on Listen, Spot, and Search checks, but does
        not gain an extra bite attack]<br /><strong>Summon Monster V</strong>:
        Celestial Griffon - LN<br /><strong>Summon Monster IX</strong>: Kolyarut
        - LN
