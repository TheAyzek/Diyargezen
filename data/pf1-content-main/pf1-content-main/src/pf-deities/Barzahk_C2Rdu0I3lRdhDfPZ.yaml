      content: >-
        <h1>Barzahk</h1><h2>The Passage</h2>@Source[PZO92114;pages=6] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Barzahk">Barzahk</a><h3>Details</h3><p><strong>Alignment</strong>
        N<br /><strong>Pantheon</strong> Psychopomp Usher<br /><strong>Areas of
        Concern</strong> Compasses, travelers, and vigils<br
        /><strong>Domains</strong> Knowledge, Protection, Repose, Travel<br
        /><strong>Subdomains</strong> N/A<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Club<br
        /><strong>Symbol</strong> Two straight lines that converge vertically
        through a circle</p><h3>Obedience</h3><p>Walk a road for an hour and
        keep a constant eye out for signs of fallen travelers or roadside
        graves. Tend to any of either you find. Gain a +4 insight bonus on
        Survival and Knowledge (geography) checks to find locations and avoid
        becoming lost, as well as on saving throws against magic effects that
        would force you to become lost (such as the <em>maze</em>
        spell).</p><h2>Boons - Deific
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO90143;pages=79]<br
        /><strong>1: Know Who Passed (Sp)</strong> <em>alarm</em> 3/day,
        <em>perceive cues</em> 2/day, or <em>speak with dead</em> 1/day<br
        /><strong>2: Wings of the Wanderer (Su)</strong> As a standard action,
        you can assume the form of a giant raven as if using the spell <em>beast
        shape II</em>. While in this form, you gain the raven's scavenger
        extraordinary ability, a +2 insight bonus to AC, and a +3 insight bonus
        on Perception checks. You can retain this form for 1 hour per HD you
        have; this time does not need to be consecutive, but it must be used in
        1-hour increments. While in raven form, you can increase or decrease
        your size as a standard action, as if you had cast <em>reduce
        person</em> or <em>enlarge person</em> (self only); these spells have
        their normal duration, treating your Hit Dice as your caster level, but
        casting either consumes 1 hour of your daily shapeshifting allotment.<br
        /><strong>3: Terrain Dominance</strong> Your passage is rarely impeded
        by landscapes or weather. For every 5 HD you have, you gain one terrain
        dominance as if you were a horizon walker; you do not need to have the
        terrain mastery class feature to select a terrain dominance. If you do
        not have a favored terrain bonus from another source, treat your favored
        terrain bonus as +2 when dealing with creatures native to the terrains
        over which you have dominance; you do not otherwise gain the benefits of
        favored
        terrain.</em></p><h3>Exalted</h3><p>@Source[PZO90143;pages=79]<br
        /><strong>1: Prepared Traveler (Sp)</strong> <em>adjuring step</em>
        3/day, <em>animal messenger</em> 2/day, or <em>phantom steed</em>
        1/day<br /><strong>2: Seasoned Traveler (Ex)</strong> You no longer take
        nonlethal damage from moving at a hustle overland. You gain Endurance
        and Nimble Moves as bonus feats.<br /><strong>3: Into the Dead Roads
        (Su)</strong> Once per day as a full-round action, you can open a door
        to the Dead Roads and guide others with you to cross huge distances or
        travel the planes. This duplicates the effects of a <em>shadow walk or
        <em>plane shift</em> spell, with a caster level equal to twice your Hit
        Dice. In the case of a plane shift spell, the effect is not
        instantaneous, instead requiring 2d6 hours of travel by foot to arrive
        at a random point on the target
        plane.</em></p><h3>Sentinel</h3><p>@Source[PZO90143;pages=79]<br
        /><strong>1: Find the Lost (Sp)</strong> <em>tireless pursuit</em>
        3/day, <em>locate object</em> 2/day, or <em>follow aura</em> 1/day<br
        /><strong>2: Studied Hunter (Ex)</strong> You are adept at tracking,
        understanding, and assisting a specific kind of creature. Select a
        creature type from the ranger's list of favored enemies. You gain a +2
        bonus on Survival checks to track creatures of this type or subtype, and
        on Diplomacy, Heal, Knowledge, and Sense Motive checks regarding them.
        You also gain a +1 dodge bonus to AC against attacks from creatures of
        this type. For every 5 Hit Dice you have, you can select one additional
        type or subtype to apply these bonuses to, and at each such interval,
        the bonus gained regarding any one studied type or subtype increases by
        2 for skill checks and by 1 for AC.<br /><strong>3: Warden of the Ways
        (Su)</strong> You no longer need to drink, eat, or sleep to survive,
        though you must still rest with only light activity for at least 2 hours
        a day to renew your spells. While on a road, pathway, or tunnel, you
        gain DR 4/-; your GM has final approval over what qualifies as a road,
        pathway, or tunnel.</em></p><h2>Boons - Monitor
        Obedience</h2><h3>None</h3><p>@Source[PZO92114;pages=6]<br /><strong>1:
        Prepared Traveler (Sp)</strong> <em>adjuring step</em> 3/day, <em>animal
        messenger</em> 2/day, or <em>phantom steed</em> 1/day<br /><strong>2:
        Seasoned Traveler (Ex)</strong> You no longer take nonlethal damage from
        moving at a hustle overland. You gain Endurance and Nimble Moves as
        bonus feats.<br /><strong>3: Into the Dead Roads (Su)</strong> Once per
        day as a full-round action, you can open a door to the Dead Roads and
        guide others with you to cross huge distances or travel the planes. This
        duplicates the effects of a <em>shadow walk or <em>plane shift</em>
        spell, with a caster level equal to twice your Hit Dice. In the case of
        a <em>plane shift</em> spell, the effect is not instantaneous, instead
        requiring 2d6 hours of travel by foot to arrive at a random point on the
        target plane.</em></p><h2>For Followers of Barzahk</h2><h3>Prestige
        Classes</h3><p><em>Mortal Usher</em></p><h3>Spells</h3><p><em>Keyhole,
        Open the Dead Roads</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO90143;pages=78]</em><br
        /><h3>Cleric/Warpriest</h3><p><em>Tireless Pursuit can be prepared as a
        1st-level spell<br /><em>Teleport</em> can be prepared as a 5th-level
        spell<br /><em>Teleport Circle</em> can be prepared as a 9th-level
        spell<br /></em></p><h2>Unique Summon
        Rules</h2>@Source[PZO90143;pages=79]<br /><strong>Summon Monster
        III</strong>: Entropic Giant Raven<br /><strong>Summon Monster
        III</strong>: Nosoi<br /><strong>Summon Monster V</strong>: Catrina<br
        /><strong>Summon Monster VII</strong>: Shoki
