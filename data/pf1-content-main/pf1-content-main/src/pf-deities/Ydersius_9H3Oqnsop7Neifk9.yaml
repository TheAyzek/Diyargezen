      content: >-
        <h1>Ydersius</h1><h2>The Headless King</h2>@Source[PZO9267;pages=192]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Ydersius">Ydersius</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Other Deities<br /><strong>Other
        Pantheons</strong> Scalefolk Deities<br /><strong>Areas of
        Concern</strong> Serpentfolk, immortality, poison<br
        /><strong>Domains</strong> Chaos, Evil, Nobility, Scalykind, War<br
        /><strong>Subdomains</strong> Demon (Chaos), Demon (Evil), Hubris
        (Nobility)*, Leadership, Martyr, Saurian, Tactics<br /><em>* Requires
        the <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Dagger<br /><strong>Symbol</strong> Snake skull and
        ouroboros<br /><strong>Sacred Animal(s)</strong> Snake<br
        /><strong>Sacred Color(s)</strong> Green, red</p><h2>For Followers of
        Ydersius</h2><h3>Magic Items - Wondrous Items</h3><p>Belt of the Snake
        King</p><h3>Spells</h3><p>Constricting
        Coils</p><h3>Traits</h3><p>Serpentine Squeeze</p><h2>Unique Spell
        Rules</h2>@Source[PZO9042;pages=71]<p><h3>Cleric/Warpriest</h3></p><p><em>Accelerate
        Poison can be prepared as a 2nd-level spell<br /><em>Beast Shape I</em>
        can be prepared as a 3rd-level spell [only to take the form of a snake
        or serpent]<br /><em>Beast Shape II</em> can be prepared as a 4th-level
        spell [only to take the form of a snake or serpent]<br /><em>Beast Shape
        III</em> can be prepared as a 5th-level spell [only to take the form of
        a snake or serpent]<br /><em>Venomous Bolt</em> can be prepared as a
        4th-level spell [arrow or bolt appears to be a rigid viper that bites
        its target with poisoned fangs]<br
        /></em></p><h3>Druid</h3><p><em>Venomous Bolt</em> can be prepared as a
        4th-level spell [arrow or bolt appears to be a rigid viper that bites
        its target with poisoned fangs]<br /></em></p><h2>Unique Summon
        Rules</h2>@Source[PZO9042;pages=71]<br /><strong>Summon Monster
        II</strong>: Venomous Snake [this creature is summoned with the
        celestial template if you are good, or with the fiendish template if you
        are evil; you may choose either if you are neutral]<br /><strong>Summon
        Monster IV</strong>: Amphisbaena<br /><strong>Summon Monster V</strong>:
        Emperor Cobra [this creature is summoned with the celestial template if
        you are good, or with the fiendish template if you are evil; you may
        choose either if you are neutral]<br /><strong>Summon Monster
        VII</strong>: Giant Anaconda [this creature is summoned with the
        celestial template if you are good, or with the fiendish template if you
        are evil; you may choose either if you are neutral]
