      content: >-
        <h1>Eaqueo</h1><h2>The Finishing Knot</h2>@Source[PZO9267;pages=326] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Eaqueo">Eaqueo</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Depression, nooses, sad stories<br
        /><strong>Domains</strong> Evil, Law, Liberation, Madness<br
        /><strong>Subdomains</strong> Devil (Evil), Devil (Law), Freedom,
        Insanity, Nightmare<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Net<br
        /><strong>Symbol</strong> Black silk rope noose<br /><strong>Sacred
        Animal(s)</strong> Snake<br /><strong>Sacred Color(s)</strong> Black,
        blue</p><h3>Obedience</h3><p>Tie a noose and leave it around the neck of
        any dead creature. Gain a +4 profane bonus on saving throws against
        mind-affecting effects.</p><h2>Boons - Infernal
        Dukes</h2>@Source[PZO1139;pages=116]<br />The Lords of Hell, the Dukes
        of Perdition, and the Princes of Damnation are all names for the
        infamous nobility of the Pit- the elite caste of devilkind known as the
        infernal dukes.<p> All infernal dukes are lawful evil and range in power
        from CR 26 to CR 27. The boons they grant are less complex than those
        granted by archdevils, manifesting as spell-like abilities usable once
        per day each.</p><p><strong>1</strong>: <em>blood biography</em><br
        /><strong>2</strong>: <em>stone tell</em><br /><strong>3</strong>: 
        <em>mass suffocation</em></p><h2>For Followers of
        Eaqueo</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
