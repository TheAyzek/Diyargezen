      content: >-
        <h1>Irori</h1><h2>Master of Masters</h2>@Source[PZO9267;pages=84] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Irori">Irori</a><h3>Details</h3><p><strong>Alignment</strong>
        LN<br /><strong>Pantheon</strong> Core Deities<br /><strong>Other
        Pantheons</strong> Ascended Pantheon, Deities of Tian Xia, Order of the
        God Claw Pantheon, Vudrani Pantheon<br /><strong>Areas of
        Concern</strong> History, knowledge, self-perfection<br
        /><strong>Domains</strong> Healing, Knowledge, Law, Rune, Strength<br
        /><strong>Subdomains</strong> Competition, Education (Knowledge), Fist,
        Inevitable, Language, Medicine*, Memory, Resolve, Restoration,
        Self-Realization (Strength)*, Thought<br /><em>* Requires the <u>Acolyte
        of Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong>
        Unarmed strike<br /><strong>Symbol</strong> Blue hand<br
        /><strong>Sacred Animal(s)</strong> Snail<br /><strong>Sacred
        Color(s)</strong> Blue, white</p><h3>Obedience</h3><p>Over the course of
        1 hour, spend an equal amount of time practicing with a weapon or your
        unarmed strikes, reading any text that you have never read before, and
        braiding a length of hair while contemplating the mysteries of the
        multiverse. Hang the length of hair around your neck when your obedience
        is complete and wear it for the rest of the day. Gain a +4 sacred or
        profane bonus on all Knowledge checks. The type of bonus depends on your
        alignment-if you're neither good nor evil, you must choose either sacred
        or profane the first time you perform your obedience, and this choice
        can't be changed.</p><h3>Divine Gift</h3><p>@Source[PZO1141;pages=78]
        <br /><em>Nethys Note: See here for details on how to gain a Divine
        Gift</em><br />Irori grants a permanent +1 untyped bonus to
        Constitution.</p><h3>On Golarion</h3><p><strong>Centers of
        Worship</strong> Absalom, Jalmeray, Katapesh, Mana Wastes, Nex, Osirion,
        Qadira<br /><strong>Nationality</strong> Vudrani</p><h2>Boons - Deific
        Obedience</h2><h3>
        Evangelist</h3><p>@Source[PZO9267;pages=84]<em></em><br /><strong>1:
        Expansive Knowledge (Sp)</strong> <em>identify</em> 3/day, <em>fox's
        cunning </em>2/ day, or <em>secret page</em> 1/day<br /><strong>2:
        Inevitable Fist (Su)</strong> For a number of rounds per day equal to
        your Hit Dice, you can infuse your limbs with the power of pure law.
        Your unarmed strikes deal damage as if you were one size category
        larger, and gain the <em>axiomatic </em>weapon special ability.
        Activating or dismissing this ability is a free action, and the rounds
        don't need to be consecutive.<br /><strong>3: Runic Form (Sp and
        Su)</strong> Nine runic tattoos appear on your body, three for each of
        the three disciplines of Irori: mind, body, and spirit. As a standard
        action (unless otherwise noted) you can discharge the power stored in a
        tattoo. Once spent, a tattoo's power returns gradually over the course
        of 1 week. The tattoo powers are as follows:<em>Body Tattoos: Two
        contain <em>cure serious wounds</em>, which you can use as a spell-like
        ability. One contains <em>restoration, which you can use as a spell-like
        ability.</em></p><p><em>Mind Tattoos</em>: Two can each be discharged as
        a swift action to allow you to reroll a saving throw against an
        enchantment spell or effect. You must use this ability before you learn
        the result of your save, and you must take the second result, even if it
        is lower. The third can be discharged to grant you a +4 sacred bonus to
        Wisdom for 1 minute.</em></p><p><em>Spirit Tattoos</em>: Two allow you
        to assume an ethereal state for 1 minute as though using the spell
        <em>etherealness</em>. The third allows you to gain spell resistance
        equal to 10 + 1 for every Hit Dice you possess for 1
        minute.</em></p><h3>Exalted</h3><p>@Source[PZO9267;pages=84]<br
        /><strong>1: Cloud the Mind of the Unwary (Sp)</strong> <em>hypnotism
        </em> 3/day, <em>daze monster</em> 2/day, or <em>suggestion</em>
        1/day<br /><strong>2: Repair the Damaged Body (Su)</strong> Up to three
        times per day, when you can cast a conjuration (healing) spell with a
        range of touch, treat it as having a range of close instead.<br
        /><strong>3: Walk Above the Earth (Su)</strong> You hover several inches
        off the ground as if levitating. This doesn't affect your speed, and
        makes you immune to most kinds of difficult terrain, traps triggered by
        pressure, and potentially other effects. You can levitate over solid
        surfaces only, so you fall if you step off a cliff or over a liquid. You
        can, however, raise or lower yourself as <em>levitate</em>. If you make
        an attack while hovering, you are not subject to the attack and damage
        penalties listed in the <em>levitate </em>spell description. However, if
        you move yourself higher in the air using a move action, you become
        subject to the attack and damage penalties until you return to the
        ground.</em></p><h3>Sentinel</h3><p>@Source[PZO9267;pages=84]<br
        /><strong>1: Masterful Warrior (Sp)</strong> <em>true strike</em> 1/day,
        <em>false life</em> 2/day, or <em>haste</em> 3/day<br /><strong>2:
        Secrets of the Enemy (Ex)</strong> The knowledge you've gained over the
        years regarding different creatures lets you strike your foes with
        unerring insight. As a standard action, you can study your opponent
        during combat, a task which requires you to succeed at a Knowledge check
        related to the enemy's type (<em>Pathfinder RPG Core Rulebook</em> 99).
        The DC is equal to 10 + your opponent's Hit Dice. If you succeed at the
        check, you gain a +2 bonus on weapon attack and damage rolls against
        that enemy. If you fail at the Knowledge check, you may try again with
        another action, but all subsequent attempts to use this ability against
        the same enemy take a cumulative -2 penalty.<br /><strong>3: Perfection
        of Form (Ex)</strong> You develop your body to such a degree of physical
        perfection that you become almost untouchable by the ravages of toxins
        and disease. You gain a +4 sacred or profane bonus on saving throws
        against poison, magical and supernatural diseases, and spells and
        effects that cause ability damage, ability drain, or negative levels.
        You also become immune to nonmagical diseases.</em></p><h2>Divine
        Fighting Technique</h2><h3>Irori's Perfected
        Fist</h3><p><em>@Source[PZO9472;pages=29] </em><br />Practically
        synonymous with Irori and his faith, <em>The Woven Fist</em> is among
        the best known of all diving fighting manuals. Many learned monks were
        taught their first martial techniques using drills and regiments from
        this manual, which some claim was written by Irori's own hand before his
        ascension to divinity. Although most commonly found in temples to Irori
        and secluded monasteries, copies of <em>The Woven Fist</em> often make
        their way into less scrupulous hands because of their
        effectiveness.</em></p><p><em><strong>Optional Replacement</strong>: A
        lawful neutral brawler or monk can replace a bonus feat with the
        following initial benefit.</em></p><p><em><strong>Initial
        Benefit</strong>: You can take a -2 penalty on all attack rolls made
        with your unarmed strikes in order to deal the average amount of damage
        with each successful attack instead of rolling your weapon damage. For
        instance, if your unarmed strike would normally deal 1d4 points of
        weapon damage, you instead deal 2 points of weapon damage. Apply bonuses
        and modifiers to this result as if you had rolled your damage normally.
        You must choose to use this benefit before making an attack roll, and
        its effects last until your next turn. You do not average additional
        damage dice (such as those granted by a sneak attack) when using this
        ability.</em></p><p><em><strong>Advanced Prerequisites</strong>:
        Critical Focus; Divine Fighting Technique; Weapon Focus (unarmed
        strike); base attack bonus +10 or monk level
        10th.</em></p><p><em><strong>Optional Replacement</strong>: A lawful
        neutral brawler or monk of at least 10th level who worships Irori and
        has the Divine Fighting Technique feat can replace a bonus feat with the
        following advanced benefit without meeting its
        prerequisites.</em></p><p><em><strong>Advanced Benefit</strong>: You no
        longer take a -2 penalty on attack rolls with your unarmed strikes when
        you choose to deal the average amount of damage. If you critically hit a
        creature when using this ability, you automatically inflict maximum
        weapon damage for that critical hit (although you must still roll sneak
        attack dice or any other dicebased additional damage).</em></p><h2>For
        Followers of Irori</h2><h3>Archetypes</h3><p><em>Disciple of Wholeness
        (Monk), Disciple of Wholeness (Monk (Unchained)), Iroran Paladin
        (Paladin), Ki Mystic (Monk), Scrollmaster (Wizard), Unarmed Fighter
        (Fighter)</em></p><h3>Feats</h3><p><em>Improved Unarmed Strike, Ki
        Channel, Master of Knowledge, Scholar, Steady
        Engagement</em></p><h3>Magic Items - Altars</h3><p><em>Altar of
        Irori</em></p><h3>Magic Items - Armor</h3><p><em>Perfection
        Leather</em></p><h3>Magic Items - Rings</h3><p><em>Ring of Serene
        Contortions</em></p><h3>Magic Items - Sets</h3><p><em>Irori's
        Meditation</em></p><h3>Magic Items - Weapons</h3><p><em>Perfectionist
        Shavtoosh, Quarterstaff of Contemplation</em></p><h3>Magic Items -
        Wondrous Items</h3><p><em>Amulet of Mighty Fists (+1), Amulet of Mighty
        Fists (+2), Amulet of Mighty Fists (+3), Amulet of Mighty Fists (+4),
        Amulet of Mighty Fists (+5), Incense of Meditation, Monk's Robe,
        Purification Talisman, Robe of the Master of
        Masters</em></p><h3>Monsters</h3><p><em>Pavbagha, The Old Man
        (Herald)</em></p><h3>Prestige Classes</h3><p><em>Champion of
        Irori</em></p><h3>Spells</h3><p><em>Abstemiousness, Blood Crow Strike,
        Channel Vigor, Replenish Ki</em></p><h3>Traits</h3><p><em>Centered,
        Eternal Understanding, Seer of Reality, Sensing Imperfection, Wisdom in
        the Flesh</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9267;pages=91]</em><br
        /><h3>Cleric/Warpriest</h3><p><em>Astral Projection can be prepared as a
        8th-level spell<br /><em>Moment of Prescience can be prepared as a
        8th-level spell<br /><em>Transformation can be prepared as a</em>
        6th-level spell<br /><em>Haste</em> can be prepared as a 4th-level
        spell<br /><em>Legend Lore can be prepared as a</em> 6th-level spell<br
        /><em>Stone Fist</em> can be prepared as a 1st-level spell<br
        /></em></p><h3>Inquisitor</h3><p><em>Astral Projection can be prepared
        as a 6th-level spell<br /><em>Moment of Prescience</em> can be prepared
        as a 6th-level spell<br /><em>Transformation can be prepared as a
        5th-level spell<br /><em>Haste</em> can be prepared as a 4th-level
        spell<br /><em>Legend Lore can be prepared as a</em> 4th-level spell<br
        /><em>Stone Fist</em> can be prepared as a 1st-level
        spell</em></p><h2>Unique Summon Rules</h2>@Source[PZO9053;pages=73]<br
        /><strong>Summon Monster IV</strong>: Giant Mantis (extraplanar)<br
        /><strong>Summon Monster IV</strong>: Tiger<br /><h2>Other
        Rules</h2>@Source[PZO9053;pages=73]<br />Monks with access to the
        quivering palm ability may use it to render a target comatose for an
        extended period (lasting until the target receives a <em>heal,
        <em>restoration</em>, or <em>greater restoration</em> spell) rather than
        kill, chosen at the time the quivering palm is activated. Monks may use
        their wholeness of body ability on a willing creature as a standard
        action. The monk must touch the target, and the target becomes fatigued
        from this aid.
