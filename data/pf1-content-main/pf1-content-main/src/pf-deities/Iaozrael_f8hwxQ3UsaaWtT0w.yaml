      content: >-
        <h1>Iaozrael</h1><h2>The Untarnished
        Angel</h2>@Source[PZO9267;pages=326] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Iaozrael">Iaozrael</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Authority, hubris, liars<br /><strong>Domains</strong>
        Destruction, Evil, Law, Sun<br /><strong>Subdomains</strong> Day, Devil
        (Evil), Devil (Law), Light, Rage<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Scythe<br
        /><strong>Symbol</strong> Burning wings<br /><strong>Sacred
        Animal(s)</strong> Chicken<br /><strong>Sacred Color(s)</strong> Black,
        red</p><h3>Obedience</h3><p>Place a black stone over an open flame to
        heat it, all the while chanting war cries against all that is good. Gain
        a +4 profane bonus on saves against compulsions.</p><h2>Boons - Infernal
        Dukes</h2>@Source[PZO1139;pages=116]<br />The Lords of Hell, the Dukes
        of Perdition, and the Princes of Damnation are all names for the
        infamous nobility of the Pit- the elite caste of devilkind known as the
        infernal dukes.<p> All infernal dukes are lawful evil and range in power
        from CR 26 to CR 27. The boons they grant are less complex than those
        granted by archdevils, manifesting as spell-like abilities usable once
        per day each.</p><p><strong>1</strong>: <em>glibness</em><br
        /><strong>2</strong>: <em>blasphemy</em><br /><strong>3</strong>:
        <em>overwhelming presence</em></p><h2>For Followers of
        Iaozrael</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
