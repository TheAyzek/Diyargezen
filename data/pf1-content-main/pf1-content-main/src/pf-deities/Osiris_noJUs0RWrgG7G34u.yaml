        <h1>Osiris</h1><h2>Lord of the Living</h2>@Source[PZO9080;pages=65] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Osiris">Osiris</a><h3>Details</h3><p><strong>Alignment</strong>
        LG<br /><strong>Pantheon</strong> Deities of Ancient Osirion<br
        /><strong>Areas of Concern</strong> Afterlife, fertility, rebirth,
        resurrection<br /><strong>Domains</strong> Good, Healing, Law, Plant,
        Repose<br /><strong>Subdomains</strong> Ancestors, Archon (Good), Archon
        (Law), Growth, Restoration, Resurrection, Souls<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Flail<br /><strong>Symbol</strong> Crook and flail<br
        /><strong>Sacred Animal(s)</strong> Ram</p><h2>Paladin Code</h2>Paladins
        of Osiris aim to defend the sanctity of both life and death, balancing
        service to these causes with great patience. Their tenets include the
        following maxims. <ul><li>I will follow the word of the living pharaoh,
        or an equivalent ruler, so long as the pharaoh's actions do not cause
        unnecessary deaths. Malevolent individuals are unfit for the throne.
        </li><li>The dead are sacred beings. I will seek and punish any who
        attempt to defile or desecrate the dead, their possessions, or their
        burial sites. </li><li>Souls cursed to not reach the afterlife must be
        freed. I must use my will to break the shackles of undeath.
        </li><li>Life is equally sacred to death and I will defend it whenever
        possible. Only the gods and the will of a rightful pharaoh can stay my
        flail. </li><li>Children are precious, and I will help new and expecting
        parents when they are in need.</li></ul>
