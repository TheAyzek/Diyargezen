      content: >-
        <h1>Calcabrina</h1><h2>Mistress of
        Twilight</h2>@Source[PZO9267;pages=326] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Calcabrina">Calcabrina</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Malebranche<br /><strong>Areas of
        Concern</strong> Dreams, insanity, mystery<br /><strong>Domains</strong>
        Evil, Knowledge, Law, Madness<br /><strong>Subdomains</strong> Devil
        (Evil), Devil (Law), Insanity, Memory, Nightmare<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Kukri<br /><strong>Symbol</strong> Tower backlit by
        sunset<br /><strong>Sacred Animal(s)</strong> Moth<br /><strong>Sacred
        Color(s)</strong> Dark blue, orange</p><h3>Obedience</h3><p>Inscribe a
        heinous nightmare you have had, and leave the note in a public place for
        another to find. Gain a +4 profane bonus on saving throws against
        phantasms.</p><h2>Boons -
        Malebranche</h2>@Source[PZO1139;pages=122]<p>Malebranche are horned
        devils transformed so as to conquer a mortal world in Hell's name. Many
        malebranche exist in Hell's ranks, and the 12 detailed below are merely
        the best known.</p><p> Malebranche occupy a tier of power just below
        infernal dukes. All malebranche are lawful evil and range in power from
        CR 21 to CR 25. The boons they grant are less complex than those granted
        by archdevils, manifesting as spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>misdirection</em><br
        /><strong>2</strong>: <em>confusion</em><br /><strong>3</strong>: 
        <em>veil</em></p><h2>For Followers of
        Calcabrina</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
