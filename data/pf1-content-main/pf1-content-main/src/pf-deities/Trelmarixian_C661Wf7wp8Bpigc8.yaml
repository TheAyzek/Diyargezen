        <h1> Trelmarixian</h1><h2>The Black</h2>@Source[PZO9267;pages=326] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Trelmarixian">Trelmarixian</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Horsemen<br /><strong>Other
        Pantheons</strong> Kobold Deities<br /><strong>Areas of Concern</strong>
        Famine<br /><strong>Domains</strong> Earth, Evil, Madness, Weather<br
        /><strong>Subdomains</strong> Daemon, Decay, Insanity, Seasons<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Spiked gauntlet<br
        /><strong>Symbol</strong> Jackal skull and eclipse<br /><strong>Sacred
        Animal(s)</strong> Horse, jackal<br /><strong>Sacred Color(s)</strong>
        Black</p><h3>Obedience</h3><p>Abstain from eating or drinking until you
        experience the bitter pangs of hunger. Meditate in this state for just
        under an hour, and then gorge yourself upon any available substance
        regardless of its suitability as food, such as sand, ashes, or flesh.
        Gain a +4 profane bonus on saving throws against effects that cause
        exhaustion, fatigue, nausea, or sickness.</p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=98]<br
        /><strong>1: Jackal's Blessing (Sp)</strong> <em>memory lapse</em>
        3/day, <em>false life</em> 2/day, or <em>vampiric touch</em> 1/day<br
        /><strong>2: Unending Whispers (Sp)</strong> You can cast
        <em>insanity</em> once per day as a spell-like ability.<br /><strong>3:
        Kiss of the Lysogenic Prince (Su)</strong> You can make a touch attack
        to infect another creature with a fragment of your soul. The target can
        resist the attach with a successful Will save (DC = 10 + half your Hit
        Dice + your Charisma modifier). Otherwise, while you and the target are
        on the same plane, as a free action you can observe what your target
        perceives with its senses. Once per day as a standard action, you can
        directly control the target's actions for 1 round plus a number of
        additional rounds equal to your Charisma bonus. The affected creature
        retains no memory of your controlling influence or its actions while
        controlled. This is a curse effect. You can have only one target
        affected by your kiss at a time; if you target another creature, the
        first is no longer
        affected.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=98]<br
        /><strong>1: Jackal's Grace (Sp)</strong> <em>ray of enfeeblement </em>
        3/day, <em>feast of ashes</em> 2/day, or <em>cup of dust</em> 1/day<br
        /><strong>2: Unending Hunger (Su)</strong> Once per day as a standard
        action, you can consume any nonliving substance without ill effect. The
        size of the object consumed can be no larger than a creature of your own
        size category, but regardless of the size, consuming the object takes
        only 1 round. A body consumed in this way can be restored to life only
        via <em>miracle, <em>true resurrection</em>, or <em>wish</em>. Any
        object you consume can attempt a Fortitude save (DC = 10 + half your Hit
        Dice + your Constitution modifier) to avoid being destroyed.<br
        /><strong>3: Withering Invocation (Sp)</strong> Once per day, you can
        invoke Trelmarixian's unending hunger to cause a number of victims to
        consume themselves from the inside out. You can cast <em>implosion</em>
        once per day as a spell-like
        ability.</em></p><h3>Sentinel</h3><p><em>@Source[PZO1139;pages=98]<em></em><br
        /><strong>1: Famine's Crusader (Sp)</strong> <em>mount </em> 3/day,
        <em>wartrain mount</em> 2/day, or <em>phantom steed</em> 1/day<br
        /><strong>2: Consumptive Aura (Su)</strong> As a swift action, you can
        radiate an aura of hunger to a radius of 20 feet. Once you activate this
        ability, you can maintain it each round as a free action. You can use
        this ability for a number of rounds per day equal to your Hit Dice;
        these rounds need not be consecutive, but they must be used in 1-round
        increments. Each round a creature begins its turn within this aura, it
        must succeed at a Fortitude save (DC = 10 + half your Hit Dice + your
        Charisma modifier) or take 1d6 points of nonlethal damage and become
        fatigued from extreme hunger. Creatures that don't need to eat are
        immune to this effect. You are immune to this effect, and although you
        still feel hunger pangs, you no longer take damage nor are otherwise
        inconvenienced by the effects of starvation.<br /><strong>3: Eruptive
        Arrival (Sp)</strong> Once per day, you can teleport yourself into the
        flesh of any living creature that you can see (as per <em>greater
        teleport</em>), erupting out of its body in a shower of blood, bone, and
        viscera, arriving in an adjacent square, and dealing 5d6 damage to all
        creatures within 10 feet. The target itself takes 20d6 points damage.
        The target and creatures in the affected areas can attempt Fortitude
        saves (DC = 10 + half your Hit Dice + your Constitution bonus) to reduce
        the damage by half, but any creature that fails this saving throw is
        also nauseated for 1d4 rounds.</em></p><h2><em>For Followers of
        Trelmarixian</em></h2><h3>Archetypes</h3><p><em>Grim Apostle
        (Spiritualist)</em></p><h3>Feats</h3><p><em>Aura of
        Succumbing</em></p><h3>Magic Items - Wondrous Items</h3><p><em>Belt of
        Trelmarixian</em></p><h3>Traits</h3><p><em>Covenant of Abaddon</em></p>
