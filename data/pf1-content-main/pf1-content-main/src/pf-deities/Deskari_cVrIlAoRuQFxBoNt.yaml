      content: >-
        <h1>Deskari</h1><h2>Lord of the Locust
        Host</h2>@Source[PZO9267;pages=320] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Deskari">Deskari</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Chasms, infestations, locusts<br
        /><strong>Domains</strong> Chaos, Destruction, Evil, War<br
        /><strong>Subdomains</strong> Blood, Catastrophe, Demon (Chaos), Demon
        (Evil), Insect*, Tactics<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Scythe<br
        /><strong>Symbol</strong> Bloody locust wings<br /><strong>Sacred
        Animal(s)</strong> Locust<br /><strong>Sacred Color(s)</strong> Green,
        red</p><h3>Obedience</h3><p>Meditate while allowing insects or worms of
        any type to crawl upon your body-if no such vermin is available, you
        must instead lie facedown in a trench dug into soil and mouth prayers to
        Deskari into the dirt while scratching yourself with sharp bits of bone
        or wood. Gain a +4 profane bonus on all saving throws against disease
        and against effects caused by vermin.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=14]<br
        /><strong>1: Swarming Susurrus (Sp)</strong> <em>inflict light wounds
         </em> 3/day, <em>summon swarm</em> 2/day, or <em>summon monster III
        </em>(vermin only) 1/day<br /><strong>2: Swarm Walker (Su)</strong> You
        can walk through any swarm without fear of taking damage or suffering
        any ill effects- swarms recognize you as one of their own. As long as
        you stand within a swarm, you gain a +4 profane bonus on Initiative
        checks and on all saving throws.<br /><strong>3: Swarm Master
        (Sp)</strong> Quickened <em>insect plague</em> 1/day.</em></p><h2>Boons
        - Fiendish Obedience</h2><h3>Exalted</h3><p>@Source[PZO1139;pages=42]<br
        /><strong>1: Swarming Susurrus (Sp)</strong> <em>inflict light wounds
         </em> 3/day, <em>summon swarm</em> 2/day, or <em>summon monster III</em>
        (vermin only) 1/day<br /><strong>2: Swarm-Walker (Su)</strong> You can
        walk through any swarm without taking damage or suffering any ill
        effects-swarms recognize you as one of their own. As long as you stand
        within a swarm, you gain a +4 profane bonus on initiative checks and
        saving throws.<br /><strong>3: Swarm Master (Sp)</strong> You can cast
        quickened <em>insect plague</em> once per
        day.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=42]<br
        /><strong>1: Split the Earth (Sp)</strong> <em>stumble gap</em> 3/day,
        <em>create pit</em> 2/day, or <em>spiked pit</em> 1/day<br /><strong>2:
        Planar Wound (Su)</strong> You can cut through the fabric of reality,
        delivering foes to your master's embrace. Three times per day as a
        standard action, you can strike the ground with a scythe to open a
        fissure under your feet or the feet of an adjacent Medium or smaller
        creature (if you target yourself, the rift opens just enough to let
        you-and only you-through, regardless of your size). This fissure is a
        planar rift that sends the creature to the Rasping Rifts in the Abyss,
        as per <em>plane shift</em>, except the fissure can transport only one
        creature and closes instantly after doing so (or after being avoided).
        An unwilling target can attempt a Reflex save (DC = 10 + half your Hit
        Dice + your Charisma modifier) to evade the fissure and negate this
        effect. Flying and levitating creatures are immune to this effect, and a
        creature capable of flight that is standing on the ground can avoid this
        effect if it succeeds at a DC 20 Fly check (it can still attempt a
        Reflex save to avoid the spell if it fails this Fly check).<br
        /><strong>3: Welcome the Rasping Rifts (Sp)</strong> You can cast
        <em>rift of ruin</em> once per day as a spell-like ability. When the
        rift closes, each creature still present within the rift must attempt a
        Will save (against the spell's save DC). Creatures that succeed at this
        save are expelled violently (as normal for the spell), while those that
        fail are expelled violently into the Rasping Rifts in the Abyss. If you
        close the rift early to summon creatures, you summon one additional
        creature of the same type.</em></p><h2><em>For Followers of
        Deskari</em></h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic
        Items - Sets</h3><p><em>Dread Demonic Armor</em></p><h3>Magic Items -
        Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Spells</h3><p><em>Abyssal
        Vermin</em></p><h3>Traits</h3><p><em>Demonic
        Persuasion</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9078;pages=70]</em><br
        /><h3>Antipaladin</h3><p><em>Cape of Wasps</em> can be prepared as a
        4th-level spell<br /><em>Vermin Shape I</em> can be prepared as a
        4th-level spell</p><h3>Cleric/Warpriest</h3><p><em>Create Pit can be
        prepared as a 3rd-level spell<br /><em>Cape of Wasps</em> can be
        prepared as a 4th-level spell<br /><em>Vermin Shape I can be prepared as
        a 4th-level spell<br /><em>Vermin Shape II</em> can be prepared as a
        5th-level spell<br /><em>Acid Pit</em> can be prepared as a 6th-level
        spell</em></p><h2>Unique Summon Rules</h2>@Source[PZO9078;pages=70]<br
        /><strong>Summon Monster IV</strong>: Vermlek<br /><strong>Summon
        Monster V</strong>: Fiendish Giant Locust<br /><strong>Summon Monster
        VI</strong>: Fiendish Giant Mosquito
