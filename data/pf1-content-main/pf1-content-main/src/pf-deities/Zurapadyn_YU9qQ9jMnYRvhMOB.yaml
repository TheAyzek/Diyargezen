        <h1>Zurapadyn</h1><h2>Beast Who Waits in
        Smoke</h2>@Source[PZO1139;pages=110] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Zurapadyn">Zurapadyn</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Asura Ranas<br /><strong>Areas of
        Concern</strong> Fire, injustice, vendetts<br /><strong>Domains</strong>
        Destruction, Evil, Fire, Law<br /><strong>Subdomains</strong> Arson,
        Ash, Catastrophe, Rage<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong>
        Kukri</p><h3>Obedience</h3><p>Steal something of sentimental value, burn
        it, and place the ashes where the owner will find them. Gain a +4
        profane bonus on saving throws against fire effects.</p><h2>Boons -
        Asura Ranas</h2>@Source[PZO1139;pages=111]<br />Over time, the mightiest
        of the asuras complete enough cycles of reincarnation and build upon the
        atrocities committed over multiple lives to incarnate into the most
        powerful of their kind: the asura ranas.<p> Asura ranas are lawful evil
        demigods that range in power from CR 26 to CR 30. Each asura rana
        detailed below is given an obedience, but the boons they grant are less
        complex than those granted by archdevils, manifesting as spell-like
        abilities usable once per day each.</p><p><strong>1</strong>: 
        <em>fireball</em><br /><strong>2</strong>: <em>delayed blast
        fireball</em><br /><strong>3</strong>: <em>meteor swarm</em></p>
