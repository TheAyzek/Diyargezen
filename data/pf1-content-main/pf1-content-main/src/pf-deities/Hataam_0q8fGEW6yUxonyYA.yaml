        <h1>Hataam</h1><h2>The River Eater</h2>@Source[PZO1139;pages=132] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Hataam">Hataam</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Sahkil Tormentors<br /><strong>Areas
        of Concern</strong> Drought, drowning, stagnation<br
        /><strong>Domains</strong> Evil, Travel, Water, Weather<br
        /><strong>Subdomains</strong> Fear, Rivers, Seasons, Storms<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Net</p><h3>Obedience</h3><p>Dam a
        small stream or another source of flowing water. Gain a +4 profane bonus
        on Swim checks.</p><h2>Boons - Sahkil
        Tormentors</h2>@Source[PZO1139;pages=133]<br />Sahkil tormentors hold
        dominion over mortal fears and suffering. All are chaotic evil and range
        in power from CR 21 to CR 25. Their boons are less complex than those of
        other demigods, manifesting as spell-like abilities usable twice per day
        each.<strong>1</strong>: <em>river whip</em><br /><strong>2</strong>:
        <em>phantasmal asphyxiation;</em><br /><strong>3</strong>: <em>control
        water</em>
