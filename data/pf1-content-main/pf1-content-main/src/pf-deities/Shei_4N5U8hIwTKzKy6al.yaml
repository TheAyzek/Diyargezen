      content: >-
        <h1>Shei</h1><h2>The Ibis Matron</h2>@Source[PZO9267;pages=324] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Shei">Shei</a><h3>Details</h3><p><strong>Alignment</strong>
        NG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Age, life, self-actualization<br
        /><strong>Domains</strong> Community, Good, Healing, Liberation<br
        /><strong>Subdomains</strong> Agathion, Education (Community), Family,
        Freedom, Resurrection, Self-Realization (Liberation)*<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Sickle<br /><strong>Symbol</strong>
        Vine-wrapped sickle<br /><strong>Sacred Animal(s)</strong> Dragonfly<br
        /><strong>Sacred Color(s)</strong> Green,
        silver</p><h3>Obedience</h3><p>Lay a heavy rope across your shoulders
        and meditate on the strengths and weaknesses of your true self. Remove
        the rope and continue to meditate on the feeling of lightness that comes
        with the loss of an unnecessary burden. Gain a +4 sacred bonus on saving
        throws against effects that damage, drain, or penalize ability
        scores.</p><h2>Boons - Celestial Obedience</h2><h3>Mystery
        Cultist</h3><p>@Source[PZO9255;pages=23]<br /><strong>1: The Tender's
        Path (Sp)</strong> <em>remove fear</em> 3/day, <em>calm emotions</em>
        2/day, or <em>sands of time</em><sup>UM</sup> 1/day<br /><strong>2:
        Elder's Wisdom (Su)</strong> You immediately age into the next age
        category, though you take only the mental bonuses for the next age
        category and none of the physical penalties. If you are venerable when
        you receive this boon, gain a +2 sacred bonus to your Wisdom instead.<br
        /><strong>3: Liberation (Sp)</strong> You can cast <em>freedom </em>once
        per day.</em></p><h2>For Followers of
        Shei</h2><h3>Feats</h3><p><em>Heroic
        Interposition</em></p><h3>Traits</h3><p><em>Empyreal Focus</em></p>
