        <h1>Xhasnaphar</h1><h2>The Faceless Truth</h2>@Source[PZO9267;pages=326]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Xhasnaphar">Xhasnaphar</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Masks, ugliness, volition<br /><strong>Domains</strong>
        Evil, Law, Liberation, Protection<br /><strong>Subdomains</strong> Devil
        (Evil), Devil (Law), Fear, Freedom, Revolution<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Hand crossbow<br /><strong>Symbol</strong> Hideous
        leather mask<br /><strong>Sacred Animal(s)</strong> Sloth<br
        /><strong>Sacred Color(s)</strong> Brown,
        red</p><h3>Obedience</h3><p>Score an unblemished section of your own
        flesh with ugly and asymmetrical cuts. Gain a +4 profane bonus on saving
        throws against polymorph effects.</p><h2>Boons - Infernal
        Dukes</h2>@Source[PZO1139;pages=119]<br />The Lords of Hell, the Dukes
        of Perdition, and the Princes of Damnation are all names for the
        infamous nobility of the Pit- the elite caste of devilkind known as the
        infernal dukes.<p> All infernal dukes are lawful evil and range in power
        from CR 26 to CR 27. The boons they grant are less complex than those
        granted by archdevils, manifesting as spell-like abilities usable once
        per day each.</p><p><strong>1</strong>: <em>inflict serious
        wounds</em><br /><strong>2</strong>: <em>mass inflict serious
        wounds</em><br /><strong>3</strong>: <em>implosion</em></p><h2>For
        Followers of Xhasnaphar</h2><h3>Feats</h3><p><em>Hellish
        Shackles</em></p>
