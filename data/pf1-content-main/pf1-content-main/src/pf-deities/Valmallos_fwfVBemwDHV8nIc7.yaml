        <h1>Valmallos</h1><h2>The Answering Rite</h2>@Source[PZO92114;pages=19]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Valmallos">Valmallos</a><h3>Details</h3><p><strong>Alignment</strong>
        LN<br /><strong>Pantheon</strong> Primal Inevitable<br /><strong>Areas
        of Concern</strong> Ceremonies, magic, and preparation<br
        /><strong>Domains</strong> Law, Magic, Rune, Water<br
        /><strong>Subdomains</strong> N/A<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Kukri<br
        /><strong>Symbol</strong> Scroll twisting upon
        itself</p><h3>Obedience</h3><p>Spend 1 hour refining existing prayers,
        rituals, and spells by adding additional movements, verses, and
        diagrams. Gain a +4 sacred or profane bonus on skill checks to cast a
        ritual.</p><h2>Boons - Monitor
        Obedience</h2><h3>None</h3><p>@Source[PZO92114;pages=19]<br /><strong>1:
        Enduring Magic (Sp)</strong> <em>protection from chaos</em> 3/day,
        <em>false life</em> 2/day, or <em>arcane concordance</em> 1/day<br
        /><strong>2: Overwhelming Intricacy (Su)</strong> When you cast a spell
        or spell-like ability whose casting time is at least 10 minutes, you
        increase the DC of saving throws to resist that spell by 1. If the
        spell's casting time is at least 1 hour, you instead increase the DC by
        2.<br /><strong>3: Sophisticated Symbols (Sp)</strong> Once per day you
        can cast a symbol spell (e.g., <em>symbol of persuasion</em>) of 7th
        level or lower as a spell-like ability with a casting time of 1 hour and
        requiring no material components. Alternatively, you can use this
        ability once per day to eliminate any symbol spell's material component
        by increase its casting time to 1 hour and thereby. You can maintain
        only a single symbol spell created with this ability, and using this
        ability again causes the first symbol to dissipate.</em></p>
