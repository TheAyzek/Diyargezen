      content: >-
        <h1>Sifkesh</h1><h2>The Sacred Whore</h2>@Source[PZO9267;pages=320] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Sifkesh">Sifkesh</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Despair, heresy, suicide<br /><strong>Domains</strong>
        Chaos, Evil, Madness, Trickery<br /><strong>Subdomains</strong>
        Deception, Demon (Chaos), Demon (Evil), Loss, Nightmare<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> War razor<br /><strong>Symbol</strong>
        Slashed feminine hands<br /><strong>Sacred Animal(s)</strong> Asp<br
        /><strong>Sacred Color(s)</strong> Red,
        white</p><h3>Obedience</h3><p>Perform a ritualized suicide by first
        scribing a note lambasting your enemies and then pretending to kill
        yourself via strangulation or cutting. Gain a +4 profane bonus on saving
        throws against mind-affecting effects.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=25]<br
        /><strong>1: Heretic's Hiss (Sp)</strong> <em>command</em> 3/day,
        <em>whispering wind</em> 2/day, or <em>suggestion</em> 1/day<br
        /><strong>2: Heresy (Su)</strong> Once per day as a standard action, you
        can utter blasphemy or heresy against a single religion other than the
        worship of a demon lord. A worshiper of the targeted religion must be
        able to hear your utterance, or this ability fails. You gain SR equal to
        your HD + 11 against spells cast by worshipers of the religion you spoke
        out against-this SR lasts until you use this ability again to blaspheme
        a different religion (as long as you continue your daily obedience, this
        SR persists until you select a different religion).<br /><strong>3: Mass
        Suicide (Sp)</strong> You can cast <em>weird </em>once per day as a
        spell-like ability. Rather than assault the victims with images of fear,
        this ability assaults the targets with images and sensations of
        crippling sadness and despair. Those who succumb to the spell and die do
        so at their own hands. If no method of suicide is available for one who
        succumbs to this effect, the victim simply dies outright of sadness.
        This effect is equivalent to a 9th-level spell.</em></p><h2><em>Boons -
        Fiendish
        Obedience</em></h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=92]<br
        /><strong>1: Hymn of Sorrow (Sp)</strong> <em>ear-piercing scream </em>
        3/day, <em>hold person</em> 2/day, or <em>crushing despair</em> 1/day<br
        /><strong>2: Blasphemer's Piety (Ex)</strong> Your blasphemous soul
        adapts effortlessly to reflect the convictions of others. When you are
        targeted by an effect based on alignment or patron deity, you can choose
        to be treated as having the alignment and faith of the creature
        originating the effect (you don't need to know that creature's alignment
        or faith to make this choice). You can also be treated as having the
        faith of your target or targets when using a spell or effect dependent
        on patron deity. Making this choice does not require an action, or even
        awareness that you are being targeted (in which case the ability always
        functions as best benefits the character in that situation). In
        addition, you can select feats, traits, and other options dependent on
        worship of particular deities as though you were a worshiper of those
        deities. Once per week, you can choose to perform the obedience of any
        lawful or good deity with which you are familiar instead of Sifkesh's
        obedience. This still grants you your normal benefits from Sifkesh, not
        those from the other faith.<br /><strong>3: Baptism of Sin (Su)</strong>
        Your unholy magic infects the souls of mortal creatures, washing away
        their morality and drawing them into the Lady of Heresy's tender
        embrace. Whenever a creature fails a saving throw against one of your
        mind-affecting spells, that creature becomes filled with false but
        nevertheless convincing memories of having committed a horrific sin. A
        nonevil and nongood target must succeed at a Will save (DC = 10 + half
        your Hit Dice + your Charisma modifier) or become staggered for 1 round,
        while a good target must succeed at this Will save or become nauseated
        for 1 round. Once a creature successfully saves against this effect, it
        is immune to baptism of sin for 24 hours. This is a mind-affecting
        emotion effect.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=92]<br
        /><strong>1: Heretic's Hiss (Sp)</strong> <em>command</em> 3/day,
        <em>whispering wind</em> 2/day, or <em>suggestion</em> 1/day<br
        /><strong>2: Heresy (Su)</strong> You take great delight in worrying at
        weaknesses in the dogma of other religions. Once per day as a standard
        action, you can utter blasphemy or heresy against a single religion
        other than the worship of a demon lord. A worshiper of the targeted
        religion must be able to hear your utterance, or this ability fails. You
        gain spell resistance equal to your Hit Dice + 11 against spells cast by
        worshipers of the religion you spoke out against. This spell resistance
        lasts until you use this ability again to blaspheme a different religion
        or until you fail to perform your daily obedience.<br /><strong>3: Mass
        Suicide (Sp)</strong> Your influence can drive entire groups of people
        to acts of self-destruction. You can cast <em>weird</em> once per day as
        a spell-like ability. Rather than assaulting the victims with images of
        fear, this ability assaults the targets with images and sensations of
        crippling sadness and despair. Those who succumb to the spell and die do
        so at their own hands. If no method of suicide is available for one who
        falls prey to this effect, the victim simply dies outright of sadness.
        This is a mind-affecting emotion
        effect.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=92]<br
        /><strong>1: Wallow in Despair (Sp)</strong> <em>doom</em> 3/day,
        <em>miserable pity</em> 2/day, or <em>catatonia</em> 1/day<br
        /><strong>2: Welcome the End (Sp)</strong> With a cooing nihilistic
        whisper, you cause a creature to kill itself, making its body lose the
        drive to maintain life. You can cast <em>phantasmal killer</em> three
        times per day as a spell-like ability, but rather than this functioning
        as an illusion (phantasm), this is a mind-affecting enchantment
        (compulsion) effect. The victim must succeed at a Will save to resist
        the urge to end its life. On a failure, the victim must succeed at a
        Fortitude save or its body's life-sustaining autonomic processes
        irreparably and lethally shut down.<br /><strong>3: Broken Angel
        (Ex)</strong> Like that of your Abyssal mistress, your body has fallen
        to pieces. Your arms and legs do not directly attach to your body,
        instead floating near their original locations, while your torso sprouts
        angelic wings that keep it aloft. You gain a fly speed of 30 feet, with
        perfect maneuverability. Your limbs can disassociate briefly from the
        whole to attack distant targets at a moment's notice, extending your
        melee reach by 15 feet, and attacks against you suffer a miss chance of
        20% due to the gaps between your constantly shifting body parts. You are
        immune to effects that cause severed limbs or that arise from severed
        limbs (including the beheading effect of a <em>vorpal</em> sword) and
        also to bleed effects and bleed damage. You automatically stabilize when
        reduced to negative hit points.</em></p><h2><em>For Followers of
        Sifkesh</em></h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic
        Items - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Traits</h3><p><em>Demonic Persuasion</em></p>
