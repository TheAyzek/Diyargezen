        <h1>Rubicante</h1><h2>He Who Grows Red</h2>@Source[PZO9267;pages=328]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Rubicante">Rubicante</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Malebranche<br /><strong>Areas of
        Concern</strong> Fire, honor, nobility<br /><strong>Domains</strong>
        Evil, Fire, Glory, Law<br /><strong>Subdomains</strong> Ash, Devil
        (Evil), Devil (Law), Honor, Smoke<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong>
        Starknife<br /><strong>Symbol</strong> Burning throne<br
        /><strong>Sacred Animal(s)</strong> Mandril<br /><strong>Sacred
        Color(s)</strong> Gold, orange</p><h3>Obedience</h3><p>Stand on
        smoldering coals. Recount how the heat and flames harden your resolve
        and make you a stronger follower of your liege. Gain a +4 profane bonus
        on saving throws against fire effects.</p><h2>Boons -
        Malebranche</h2>@Source[PZO1139;pages=123]<p>Malebranche are horned
        devils transformed so as to conquer a mortal world in Hell's name. Many
        malebranche exist in Hell's ranks, and the 12 detailed below are merely
        the best known.</p><p> Malebranche occupy a tier of power just below
        infernal dukes. All malebranche are lawful evil and range in power from
        CR 21 to CR 25. The boons they grant are less complex than those granted
        by archdevils, manifesting as spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>flaming sphere</em><br
        /><strong>2</strong>: <em>wall of fire</em><br /><strong>3</strong>:
        <em>contagious flame</em></p><h2>For Followers of
        Rubicante</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
