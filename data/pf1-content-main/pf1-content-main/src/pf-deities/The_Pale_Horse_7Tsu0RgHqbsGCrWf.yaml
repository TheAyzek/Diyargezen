      content: >-
        <h1>The Pale Horse</h1><h2>The Lash and the
        Plough</h2>@Source[PZO92114;pages=15] <br /><strong>Pathfinder
        Wiki</strong> <a href="http://www.pathfinderwiki.com/wiki/The Pale
        Horse">The Pale Horse</a><h3>Details</h3><p><strong>Alignment</strong>
        N<br /><strong>Pantheon</strong> Psychopomp Usher<br /><strong>Areas of
        Concern</strong> Duty, revenge, and beasts of burden<br
        /><strong>Domains</strong> Death, Repose, Travel, Water<br
        /><strong>Subdomains</strong> N/A<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong>
        Trident<br /><strong>Symbol</strong> Horizontal line with a circle and
        three dots at one end</p><h3>Obedience</h3><p>Perform hard labor for at
        least 1 hour while focusing on your shortcomings and how to overcome
        them. Gain a +4 insight bonus on saves against death effects and effects
        that would cause you to become fatigued.</p><h2>Boons - Monitor
        Obedience</h2><h3>None</h3><p>@Source[PZO92114;pages=15]<br /><strong>1:
        Stalwart Rider (Sp)</strong> <em>lock gaze</em> 3/day, <em>align
        weapon</em> 2/ day, or <em>phantom steed</em> 1/day<br /><strong>2: The
        Will Endures (Ex)</strong> Your grim determination leaves you unusually
        resistant to injury. Each day, you gain a number of temporary hit points
        equal to your Wisdom modifier plus your total number of Hit Dice. These
        temporary hit points remain for 24 hours.<br /><strong>3: Peerless
        Defender (Sp)</strong> You can cast <em>transformation</em>
        3/day.</em></p><h2>For Followers of The Pale Horse</h2><h3>Prestige
        Classes</h3><p><em>Mortal Usher</em></p>
