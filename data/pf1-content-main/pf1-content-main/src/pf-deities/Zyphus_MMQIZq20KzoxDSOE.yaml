      content: >-
        <h1>Zyphus</h1><h2>The Grim Harvestman</h2>@Source[PZO9290;pages=89] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Zyphus">Zyphus</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Other Deities<br /><strong>Areas of
        Concern</strong> Accidental death, graveyards, tragedy<br
        /><strong>Domains</strong> Death, Destruction, Evil, Plant, War<br
        /><strong>Subdomains</strong> Blood, Catastrophe, Daemon, Decay, Murder,
        Thorns*, Undead<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Heavy pick<br
        /><strong>Symbol</strong> Pick axe made of bones<br /><strong>Sacred
        Animal(s)</strong> Vulture<br /><strong>Sacred Color(s)</strong> Ivory,
        red</p><h3>Obedience</h3><p>Spend an hour sitting on the grave of
        someone who suffered an accidental death. You must reflect on how chance
        has wronged you and vocally reject the influence of any gods associated
        with these wrongs. If no suitable grave exists, spend an hour telling
        strangers how their religious beliefs and hopes for a just afterlife are
        folly and of no consequence. Alternatively, you can write this screed
        and post it in a public place within a settlement. If you're away from
        civilization, you can instead spend an hour sabotaging a path, bridge,
        tool, or other device so that it's dangerous for the next person who
        uses it. You gain a +4 profane bonus on Craft (traps) or Disable Device
        checks, chosen when you complete the obedience.</p><h3>On
        Golarion</h3><p><strong>Centers of Worship</strong> Galt, Nidal, Qadira,
        Taldor, Ustalav, Varisia<br /><strong>Nationality</strong>
        Kelishite</p><h2>Boons - Deific Obedience</h2><h3>
        Evangelist</h3><p>@Source[PZO9290;pages=89]<br /><strong>1: Champion of
        Cruel Chance (Sp)</strong> <em>deathwatch</em> 3/day, <em>false
        life</em> 2/day, or <em>healing thief<sup>UC</sup> 1/day</em><br
        /><strong>2: Resiliency (Ex)</strong> Once per day, you can gain a
        number of temporary hit points equal to your Hit Dice, lasting for 1
        minute. Activating this ability is an immediate action that can be
        performed only when you would be brought below 0 hit points, and can be
        used to prevent you from dying. If you have the resiliency ability from
        another source, you can activate these abilities separately or as part
        of the same immediate action.<br /><strong>3: Tragic Minion
        (Su)</strong> By spending 1 minute praying over the corpse of a humanoid
        opponent or a humanoid who has died a tragic death, you can summon an
        allip (<em>Pathfinder RPG Bestiary</em> 3</em> 12) to serve you. Unlike
        a normal allip, this allip is of an alignment that matches yours, and
        has a number of hit points equal to half your total. It receives a +4
        bonus on Will saves to halve the damage from channeled positive energy,
        and it can't be turned or commanded. This allip serves as a companion to
        you and can communicate intelligibly with you despite its madness. You
        can dismiss it as a standard action. If the allip is destroyed or
        dismissed, you can't summon another for 7 days. This ability allows you
        to have only one allip companion at a
        time.</em></p><h3>Exalted</h3><p>@Source[PZO9290;pages=89]<br
        /><strong>1: Catalyst of Destruction (Sp)</strong>
        <em>break<sup>APG</sup> 3/day, <em>find traps</em> 2/day, or <em>spiked
        pit<sup>APG</sup> 1/day<br /><strong>2: Ever Vigilant (Su)</strong>
        Protected by Zyphus from a surprising death while you still have work to
        do for him, you're resistant to effects that attack your life force or
        would affect you before you have a chance to react. You are protected by
        <em>death ward</em>, except the immunity to energy drain ends after it
        has prevented a number of negative levels equal to your exalted level;
        this resets when you next perform your obedience. You gain a +2 profane
        bonus on saving throws against effects that occur before your first turn
        in combat.<br /><strong>3: Visitor from Abaddon (Sp)</strong> Once per
        day as a standard action, you can summon a pair of greater ceustodaemons
        (<em>Pathfinder RPG Bestiary</em> 2</em> 65) as if with summon monster
        II, and gain telepathy with them to a range of 100 feet. The
        ceustodaemons follow your commands perfectly for 1 round per Hit Die you
        possess before vanishing back to their home on Abaddon. The
        ceustodaemons don't follow commands that would cause them to perform
        overly good acts or save mortal lives other than your own, and they
        immediately vanish if your orders contradict these
        restrictions.</em></p><h3>Sentinel</h3><p>@Source[PZO9290;pages=89]<br
        /><strong>1: Walking Disaster (Sp)</strong> <em>bungle<sup>UM</sup>
        3/day, <em>spontaneous immolation<sup>UC</sup> 2/day, or <em>deadly
        juggernaut</em><sup>UC</sup> 1/day<br /><strong>2: Tragic Accident
        (Su)</strong> You have a deep understanding of the Grim Harvestman's
        lordship over accidental death, and can unleash these accidents on your
        enemies. Once per day as part of a successful attack, you can target
        your opponent with either <em>inflict critical wounds</em> or poison as
        a free action. The DC for this ability is equal to 10 + 1/2 your Hit
        Dice + your Charisma modifier. You don't have to declare the use of this
        ability until you know the attack is successful.<br /><strong>3:
        Unfairness of the World (Su)</strong> Once per day, you can channel all
        of your outrage through your weapon, afflicting your opponent with
        deadly negative energy. You must declare your use of this ability before
        you roll an attack. On a hit, the target gains a number of negative
        levels equal to 3 + 1/2 your Hit Dice unless it succeeds at a Fortitude
        saving throw (the DC for this ability is the same as your tragic
        accident DC). If you openly wear an unholy symbol of Zyphus, the saving
        throw DC to resist this effect increases by 2.</em></p><h2>Antipaladin
        Code</h2><em>The antipaladins of Zyphus are stealthy, and in emulation
        of their cruel patron deity, they're obsessed with sowing death at the
        most unexpected and shocking moments. Few appear openly on the field of
        battle except when they impersonate followers of Gorum to incite maximum
        collateral damage in a skirmish or war. Although all adhere to Zyphus's
        tenets, they vary in which parts of the code they emphasize. These
        tenets include the following adages. <ul><li>Happiness is ignorance. I
        will never hide the truth of anguish.</li><li>I am an agent of
        unpredictable death. I will announce my murderous intentions only to
        Zyphens and those I will immediately kill.</li><li>Mercy is pointless. I
        will not stay my hand when I can slay my enemies.</li><li>Prophecies are
        empty promises. I will pay no heed to fortune-telling.</li><li>Tragedy
        must spread. I will first hurt those whose pain will also hurt many
        others, whether because they are beloved or because they will wreak
        reckless vengeance.</li></ul><h2>For Followers of Zyphus</h2><h3>Magic
        Items - Armor</h3><p>Grim Gloom Mail</p><h3>Monsters</h3><p>Gravedragger
        (Herald)</p><h3>Spells</h3><p>Curse of Unexpected
        Death</p><h3>Traits</h3><p>Accident Resistant, Fatal
        Trapper</p><h2>Unique Spell
        Rules</h2>@Source[PZO9290;pages=92]<p><h3>Cleric/Warpriest</h3></em></p><p><em>Daze
        can be prepared as a</em> 0-level spell<br /><em>Mage Hand</em> can be
        prepared as a 0-level spell<br /><em>Bungle can be prepared as a</em>
        1st-level spell<br /><em>Spectral Hand can be prepared as a 2nd-level
        spell</em><br /></em></p><h2>Unique Summon
        Rules</h2>@Source[PZO9089;pages=75]<br /><strong>Summon Monster
        III</strong>: Cacodaemon<br /><strong>Summon Monster IV</strong>:
        Lacridaemon<br /><strong>Summon Monster V</strong>: Ceustodaemon
