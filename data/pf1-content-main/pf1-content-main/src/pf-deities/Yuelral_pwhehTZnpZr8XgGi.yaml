        <h1>Yuelral</h1><h2>The Wise</h2>@Source[PZO9267;pages=322] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Yuelral">Yuelral</a><h3>Details</h3><p><strong>Alignment</strong>
        NG<br /><strong>Pantheon</strong> Elven Deities<br /><strong>Areas of
        Concern</strong> Crystals, jewelers, magic<br /><strong>Domains</strong>
        Artifice, Earth, Good, Knowledge, Magic<br /><strong>Subdomains</strong>
        Arcane, Azata (Good), Caves, Construct, Divine, Memory<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Dagger<br /><strong>Symbol</strong>
        Three overlapping crystals<br /><strong>Sacred Animal(s)</strong>
        Panther<br /><strong>Sacred Color(s)</strong> Blue, green,
        red</p><h2>Paladin Code</h2>The paladins of Yuelral are protectors of
        elven magical knowledge and of natural and magical wonders such as the
        <em>aiudara</em>. Their tenets include the following
        affirmations.<ul><li> I will never defile the beauty of nature, nor cut
        a raw gemstone for aesthetic reasons.</li><li> I will remain vigilant
        for talent in craft and magic. When I notice it, I will encourage its
        good use.</li><li> I will respect the power of magic and never allow its
        misuse.</li><li> I will preserve the wisdom of the elves for the greater
        good before all other treasures.</li></ul><h2>For Followers of
        Yuelral</h2><h3>Traits</h3><p>Magic's Might</p>
