        <h1>Andak</h1><h2>The Dismembered</h2>@Source[PZO1139;pages=110] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Andak">Andak</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Asura Ranas<br /><strong>Areas of
        Concern</strong> Axes, dismemberment, torture<br
        /><strong>Domains</strong> Death, Destruction, Evil, Law<br
        /><strong>Subdomains</strong> Fear, Murder, Rage, Torture<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong>
        Battleaxe</p><h3>Obedience</h3><p>Ritualistically scrape painful
        scratches and welts along your limbs' joints. Gain DR
        2/slashing.</p><h2>Boons - Asura Ranas</h2>@Source[PZO1139;pages=110]<br
        />Over time, the mightiest of the asuras complete enough cycles of
        reincarnation and build upon the atrocities committed over multiple
        lives to incarnate into the most powerful of their kind: the asura
        ranas.<p> Asura ranas are lawful evil demigods that range in power from
        CR 26 to CR 30. Each asura rana detailed below is given an obedience,
        but the boons they grant are less complex than those granted by
        archdevils, manifesting as spell-like abilities usable once per day
        each.</p><p><strong>1</strong>: <em>keen edge</em><br
        /><strong>2</strong>: quickened <em>inflict serious wounds</em><br
        /><strong>3</strong>: <em>massacre</em></p>
