        <h1>Nataka</h1><h2>The Red King</h2>@Source[PZO1139;pages=126] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Nataka">Nataka</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Oni Daimyo<br /><strong>Areas of
        Concern</strong> Drought, forest fires, perfume<br
        /><strong>Domains</strong> Destruction, Evil, Fire, Weather<br
        /><strong>Subdomains</strong> Arson, Catastrophe, Seasons, Smoke<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong>
        Scimitar</p><h3>Obedience</h3><p>Meditate within a ring of fire while
        periodically casting incense into the flames. Gain a +4 profane bonus on
        saves against fire effects.</p><h2>Boons - Oni
        Daimyo</h2><p>@Source[PZO1139;pages=127]</p><p>The most powerful oni,
        the oni daimyo, hold their domains in isolated regions of the Material
        Plane. While they have transcended their lesser incarnations to become
        something close to demigods in stature, they do not flaunt their power
        and prefer to dwell in remote corners of the massive land of Tian
        Xia.</p><p> Oni daimyo are always evil in alignment but can be chaotic,
        lawful, or neutral. They range in power from CR 21 to CR 25. The boons
        they grant are less complex than those granted by fiendish demigods,
        manifesting as spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>flame blade</em><br
        /><strong>2</strong>: extended <em>cup of dust</em><br
        /><strong>3</strong>: maximized <em>fireball</em></p>
