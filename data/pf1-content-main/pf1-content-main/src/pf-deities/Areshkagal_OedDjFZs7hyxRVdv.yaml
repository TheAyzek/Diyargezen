      content: >-
        <h1>Areshkagal</h1><h2>The Faceless
        Sphinx</h2>@Source[PZO9267;pages=320] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Areshkagal">Areshkagal</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Greed, portals, riddles<br /><strong>Domains</strong>
        Air, Chaos, Evil, Trickery<br /><strong>Subdomains</strong> Deception,
        Demon (Chaos), Demon (Evil), Thievery, Wind<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Sickle<br /><strong>Symbol</strong> Faceless female
        pharaoh<br /><strong>Sacred Animal(s)</strong> Viper<br /><strong>Sacred
        Color(s)</strong> Blue, gold</p><h3>Obedience</h3><p>Inscribe several of
        the 23 riddles of the flesh (an interlocked series of conundrums, the
        answer to which no mortal has achieved) on your own flesh with a tiny
        bone knife carved from a child's rib. Gain a +4 profane bonus on Will
        saving throws against sonic and languagedependant effects.</p><h2>Boons
        - Demonic Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=12]<br
        /><strong>1: Sphinx's Secret (Sp)</strong> <em>hold portal</em> 3/day,
        <em>touch of idiocy</em> 2/day, or <em>shrink item</em> 1/day<br
        /><strong>2: Portal Jump (Sp)</strong> Once per day as a swift action,
        you can step through one doorway, arch, or window and emerge from
        another at any point within 500 feet. This is a teleportation effect
        similar to <em>dimension door</em>, but you do not become disoriented
        when you use this ability. This ability is the equivalent of a 7th-level
        spell.<br /><strong>3: Create Portal (Sp)</strong> Once per day, you may
        use <em>gate </em>as a spell-like ability, but only to create a gate as
        a mode of planar travel, not as a method of calling creatures. This
        ability is the equivalent of a 9th-level spell.</em></p><h2><em>Boons -
        Fiendish
        Obedience</em></h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=24]<br
        /><strong>1: Twisted Riddles (Sp)</strong> <em>fumbletongue</em> 3/day,
        <em>fox's cunning</em> 2/day, or <em>illusory script</em> 1/day<br
        /><strong>2: Maddening Enigma (Sp)</strong> Through your faith in the
        Faceless Sphinx, you are granted knowledge of three unsolvable riddles.
        Three times per day as a standard action, you can speak one of these
        riddles, though the riddles must be spoken in order. When spoken to a
        creature within 30 feet, the first unsolvable riddle you use in a day
        paralyzes the target as it searches for the answer; the creature must
        succeed at a Will save (DC = half your Hit Dice + your Charisma
        modifier) or be affected by <em>hold monster</em>. The second unsolvable
        riddle is filled with subliminal messages; up to one creature for every
        3 Hit Dice you have within 30 feet must succeed at a Will save (at the
        same DC as above) or be affected by a <em>suggestion</em> spell (with a
        suggestion of your choosing). The third unsolvable riddle uses such
        circuitous and warped logic that it shatters listeners' sanity; each
        creature within 60 feet must succeed at a Will save (using the same DC)
        or become <em>confused</em>. Worshipers of Areshkagal are immune to
        these effects.<br /><strong>3: Faceless Mystery (Su)</strong>
        Areshkagal's form is the most sacred of shapes, and as one of her
        favored minions, you can adopt a similar form as your own. You gain the
        change shape universal monster ability, allowing you to assume the form
        of a sphinx as per <em>beast shape IV</em>. In sphinx form, your face is
        eerily devoid of features (although they appear when you need them to
        eat, speak, make bite attacks, cast spells, and so on), and you gain
        blindsight to a range of 60 feet. You can activate this ability only
        once per day, but the new form lasts indefinitely. However, if you lose
        access to this boon by failing to perform your obedience, you cannot
        change forms or return to your true form until you perform the obedience
        again or the effect
        ends.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=24]<br
        /><strong>1: Sphinx's Secret (Sp)</strong> <em>hold portal</em> 3/day,
        <em>touch of idiocy</em> 2/day, or <em>shrink item</em> 1/day<br
        /><strong>2: Portal Jump (Sp)</strong> You understand that doorways and
        openings don't always have to lead to the same place. Once per day as a
        swift action, you can step through one doorway, arch, or window and
        emerge from another such portal at any point within 500 feet. This is a
        teleportation effect similar to <em>dimension door</em>, but you do not
        become disoriented when you use this ability.<br /><strong>3: Create
        Portal (Sp)</strong> Doorways have the potential to exist anywhere and
        everywhere-one simply needs to know where and how to look for them to
        find them. Once per day, you can use <em>gate</em> as a spell-like
        ability, but only as a mode of planar travel, not as a method of calling
        creatures.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=24]<br
        /><strong>1: Gilded Arms (Sp)</strong> <em>magic weapon</em> 3/day,
        <em>spiritual weapon</em> 2/day, or <em>magic vestment</em> 1/day<br
        /><strong>2: Auric Knight (Su)</strong> Your greed demands that you
        equip yourself with the purest form of wealth: gold. When you are
        wielding weapons or shields made purely of gold or wearing armor made
        purely of gold, that equipment is considered to have all the properties
        of adamantine instead of the properties of gold; weapons affected this
        way also count as both cold iron and silver for the purpose of bypassing
        damage reduction. While you wield a shield made purely of gold, any DR/-
        you gain from armor made purely of gold increases by 2. In addition, you
        gain a +2 bonus on attack and damage rolls with sickles made purely of
        gold.<br /><strong>3: Avatars of Avarice (Sp)</strong> You can conjure
        the paragons of greed from the Blood Clefts to serve you... for a price.
        Once per day as a standard action, you can throw gold (as coins, bars,
        or another form) to the ground, whereupon it vanishes to Areshkagal's
        realm. For every 500 gp's worth of gold thrown down this way, a fiendish
        young red dragon appears to serve you, up to a maximum of three dragons
        per day. These dragons follow your commands perfectly for 1 minute per
        level before vanishing back to the Abyss.</em></p><h2>For Followers of
        Areshkagal</h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic
        Items - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Traits</h3><p><em>Demonic Persuasion</em></p>
