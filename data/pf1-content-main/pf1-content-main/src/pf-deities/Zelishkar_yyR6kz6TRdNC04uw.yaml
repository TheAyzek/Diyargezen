        <h1>Zelishkar</h1><h2>The Bitter Flame</h2>@Source[PZO9267;pages=318]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Zelishkar">Zelishkar</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Arson, burning alive, cremation<br
        /><strong>Domains</strong> Animal, Evil, Fire, War<br
        /><strong>Subdomains</strong> Arson, Ash, Daemon, Tactics<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Ranseur<br /><strong>Symbol</strong>
        Crossed pikes over a pyre<br /><strong>Sacred Animal(s)</strong>
        Tiger<br /><strong>Sacred Color(s)</strong> Orange,
        red</p><h3>Obedience</h3><p>Burn a living creature of at least the size
        of a cat or infant atop a pyre. Gain a +4 profane bonus on saving throws
        against fire-based spells and effects.</p><h2>Boons - Daemon
        Harbingers</h2><p>@Source[PZO1139;pages=115]</p><p>Abaddon's unique
        daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>flaming sphere</em><br
        /><strong>2</strong>: <em>wall of fire</em><br /><strong>3</strong>:
        <em>contagious flame</em></p>
