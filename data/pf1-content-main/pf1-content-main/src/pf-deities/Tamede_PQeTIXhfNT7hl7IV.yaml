        <h1>Tamede</h1><h2>The Moldmother</h2>@Source[PZO9267;pages=318] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Tamede">Tamede</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Fungi, infected wounds, rot<br
        /><strong>Domains</strong> Destruction, Evil, Plant, War<br
        /><strong>Subdomains</strong> Blood, Daemon, Decay, Growth<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Sickle<br /><strong>Symbol</strong>
        Mushrooms on skull<br /><strong>Sacred Animal(s)</strong> Beetle<br
        /><strong>Sacred Color(s)</strong> Green,
        red</p><h3>Obedience</h3><p>Feed poisonous mushrooms to a victim, or
        consume them yourself. Gain a +4 profane bonus on saving throws against
        poison and disease.</p><h2>Boons - Daemon
        Harbingers</h2><p>@Source[PZO1139;pages=115]</p><p>Abaddon's unique
        daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>pox pustules</em><br
        /><strong>2</strong>: <em>contagion</em><br /><strong>3</strong>:
        <em>harm</em></p>
