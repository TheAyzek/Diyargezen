        <h1>Winlas</h1><h2>The Elder of Divinity</h2>@Source[PZO9267;pages=324]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Winlas">Winlas</a><h3>Details</h3><p><strong>Alignment</strong>
        LG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Ceremonies, religiousness, service<br
        /><strong>Domains</strong> Good, Knowledge, Law, Protection<br
        /><strong>Subdomains</strong> Archon (Good), Archon (Law), Defense,
        Legislation (Law), Loyalty, Purity<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Heavy
        mace<br /><strong>Symbol</strong> Censer and mace<br /><strong>Sacred
        Animal(s)</strong> Egret<br /><strong>Sacred Color(s)</strong> Green,
        silver</p><h3>Obedience</h3><p>Enact a complex ritual of standing,
        kneeling, and lying prone at different intervals combined with chanting
        and recitations from at least three different holy texts. Gain a +4
        sacred bonus on saving throws against language-dependent
        effects.</p><h2>Boons - Celestial Obedience</h2><h3>Mystery
        Cultist</h3><p>@Source[PZO9255;pages=28]<br /><strong>1: Sacrament
        (Sp)</strong> <em>sanctuary</em> 3/day, <em>consecrate</em> 2/day, or
        <em>prayer</em> 1/day<br /><strong>2: Liturgy (Su)</strong> Three times
        per day, you can ask for Winlas's favor whenever you are observing a
        religious ceremony within 300 feet. When you do this, you and up to one
        additional creature per 2 HD you possess assume the appearance of the
        congregation you are observing with perfect accuracy, and you all gain
        complete knowledge of the sacred rites being performed (granting you a
        +10 sacred bonus on Bluff checks to perform the rites). This ability is
        otherwise like a <em>seeming </em>spell, except you gain a +20 bonus on
        your Disguise check.<br /><strong>3: Ritual of True Faith (Sp)</strong>
        Once per day, you can cast either <em>symbol of death, <em>symbol of
        insanity</em>, <em>symbol of stunning, or <em>symbol of weakness</em>.
        Your casting time for this spell-like ability is reduced to 1
        minute.</em></p><h2>For Followers of
        Winlas</h2><h3>Feats</h3><p><em>Heroic
        Interposition</em></p><h3>Traits</h3><p><em>Empyreal Focus</em></p>
