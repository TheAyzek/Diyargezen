        <h1>Folca</h1><h2>The Gaunt Stranger</h2>@Source[PZO9267;pages=318] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Folca">Folca</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Abduction, strangers, sweets<br
        /><strong>Domains</strong> Charm, Evil, Travel, Trickery<br
        /><strong>Subdomains</strong> Daemon, Deception, Exploration, Lust<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Net<br /><strong>Symbol</strong>
        Skeletal handful of sweets<br /><strong>Sacred Animal(s)</strong> Black
        stork<br /><strong>Sacred Color(s)</strong> Black,
        blue</p><h3>Obedience</h3><p>Stalk a child and make him witness or
        endure a horrifically brutal event. Promise him that you will return,
        and then release him with that haunting thought. Gain a +2 profane bonus
        on Charisma-based skill checks.</p><h2>Boons - Daemon
        Harbingers</h2><p>@Source[PZO1139;pages=112]</p><p>Abaddon's unique
        daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>unnatural lust</em><br
        /><strong>2</strong>: <em>modify memory</em><br /><strong>3</strong>:
        <em>veil</em></p>
