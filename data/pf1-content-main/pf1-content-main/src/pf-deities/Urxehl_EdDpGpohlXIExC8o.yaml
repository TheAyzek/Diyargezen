    text:
      content: >-
        <h1> Urxehl</h1><h2>Trollfather</h2>@Source[PZO9267;pages=320] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Urxehl">Urxehl</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Natural disasters, storms, trolls<br
        /><strong>Domains</strong> Chaos, Evil, Fire, Weather<br
        /><strong>Subdomains</strong> Ash, Catastrophe, Demon (Chaos), Demon
        (Evil), Storms<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Greatclub<br
        /><strong>Symbol</strong> Storm cloud with lightning<br /><strong>Sacred
        Animal(s)</strong> Bear<br /><strong>Sacred Color(s)</strong> Brown,
        greed</p><h3>Obedience</h3><p>You must cavort naked atop a hill,
        rooftop, or mountaintop during a storm, or else ritualistically sever
        the fingers, toes, then arms and legs of a nonevil being, burning each
        severed fragment to ash before moving on to the next. Gain a +4 profane
        bonus on all saving throws against weather-related effects and
        spells.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=26]<br
        /><strong>1: Storm Breath (Sp)</strong> <em>obscuring mist</em> 3/day,
        <em>gust of wind</em> 2/day, or <em>call lightning</em> 1/day<br
        /><strong>2: Earthshaker (Sp)</strong> You can cast <em>earthquake
        </em>once per day, but this ability only affects a 40-foot-radius
        spread. This ability is the equivalent of a 7th-level spell.<br
        /><strong>3: Invoke the True Storm (Sp)</strong> You can cast <em>storm
        of vengeance </em>once per day.</em></p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=100]<br
        /><strong>1: Storm's Wrath (Sp)</strong> <em>shocking grasp</em> 3/day,
        <em>aggressive thundercloud</em> 2/day, or <em>lightning bolt</em>
        1/day<br /><strong>2: Tempest Hide (Ex)</strong> Urxehl rewards your
        devotion by transforming your skin into leathery rust-red hide (if you
        already have fur, hide, or scales on your body, the coloration merely
        changes). As a result of this transformation, you gain electricity
        resistance 30. If you are already immune to electricity (or if you gain
        immunity to electricity at a point after you gain this boon), you gain
        sonic resistance 30 instead. In either case, the gift allows you to
        enjoy the fury of the greatest of storms in relative safety.<br
        /><strong>3: Storm of Verakivhan (Su)</strong> You can unleash the power
        of the Trollfather with your voice, channeling the raw fury of his
        eternally tempest-tormented realm in a thunderous shout. With a mighty
        roar, you blast those around you with deadly storms of Abyssal energy.
        Twice per day as a standard action, you can exude waves of energy in a
        30-foot-radius burst centered on yourself. The blast does not harm
        natural vegetation or creatures in the area you wish to exclude from
        damage. Other creatures in the area take 1d8 points of acid, cold,
        electricity, or fire damage per character level you have (maximum 20d8)
        and are stunned for 1 round. You choose what type of energy damage this
        ability deals when you activate your storm (all targets take the same
        type of energy damage; you can't cause one target to take fire damage
        and another to take acid damage). A creature that succeeds at a
        Fortitude saving throw (DC = 10 + half your Hit Dice + your Charisma
        modifier) takes half damage and negates the stunned
        effect.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=100]<br
        /><strong>1: Storm Breath (Sp)</strong> <em>obscuring mist </em> 3/day,
        <em>gust of wind</em> 2/day, or <em>call lightning</em> 1/day<br
        /><strong>2: Earthshaker (Sp)</strong> You can cast <em>earthquake</em>
        once per day as a spell-like ability, but it affects only a
        40-foot-radius spread.<br /><strong>3: Invoke the True Storm
        (Sp)</strong> You can cast <em>storm of vengeance</em> as a spell-like
        ability once per
        day.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=100]<br
        /><strong>1: Master of Trolls (Sp)</strong> <em>enlarge person</em>
        3/day, <em>resist energy</em> (acid or fire only) 2/day, or
        <em>fireball</em> 1/day<br /><strong>2: Rip Flesh and Tear Limbs
        (Ex)</strong> Your limbs become rangy and your hands twist into ghastly
        claws. You gain two claw attacks, each dealing 1d6 points of damage for
        a Medium creature; in addition, you gain the rend ability, which
        requires two successful claw attacks and deals a number of points of
        damage equal to the damage die of one claw plus your Strength modifier.
        If you already have the rend ability, you deal double your existing rend
        damage when rending.<br /><strong>3: Trollfather's Chosen (Ex)</strong>
        Your flesh knits together with gruesome speed, healing wounds almost as
        soon as they are inflicted. You gain regeneration 5 (acid or fire). If
        you already have regeneration, increase the rate of healing granted by
        your regeneration by 10 instead.</em></p><h2>For Followers of
        Urxehl</h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic Items
        - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Traits</h3><p><em>Demonic Persuasion</em></p>
