      content: >-
        <h1>Vorasha</h1><h2>The Ophidian</h2>@Source[PZO9267;pages=318] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Vorasha">Vorasha</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Incurable afflictions, poison, toxicity<br
        /><strong>Domains</strong> Evil, Magic, Scalykind, Water<br
        /><strong>Subdomains</strong> Daemon, Decay, Fear, Venom<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Spiked chain<br
        /><strong>Symbol</strong> Ouroboros and jackal head<br /><strong>Sacred
        Animal(s)</strong> Viper<br /><strong>Sacred Color(s)</strong> Green,
        yellow</p><h3>Obedience</h3><p>Consume a diluted dose of poison. Gain a
        +4 profane bonus on saving throws against poison.</p><h2>Boons - Daemon
        Harbingers</h2><p>@Source[PZO1139;pages=115]</p><p>Abaddon's unique
        daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>delay poison</em><br
        /><strong>2</strong>: <em>poison</em><br /><strong>3</strong>:
        <em>extended cloudkill</em></p>
