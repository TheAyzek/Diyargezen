        <h1>Diceid</h1><h2>The Empty Dawn</h2>@Source[PZO9267;pages=318] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Diceid">Diceid</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Invasive species, extinction, natural disaster<br
        /><strong>Domains</strong> Animal, Evil, Plant, Weather<br
        /><strong>Subdomains</strong> Catastrophe, Daemon, Loss, Storms<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Scythe<br /><strong>Symbol</strong>
        Sun-bleached horse skull<br /><strong>Sacred Animal(s)</strong>
        Cockroach<br /><strong>Sacred Color(s)</strong> Brown,
        gray</p><h3>Obedience</h3><p>Meditate while pondering various natural
        disasters such as earthquakes, mudslides, and wildfires. Gain a +4
        profane bonus on saving throws related to natural
        disasters.</p><h2>Boons - Daemon
        Harbingers</h2><p>@Source[PZO1139;pages=112]</p><p>Abaddon's unique
        daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>summon swarm</em><br
        /><strong>2</strong>: <em>volcanic storm<br /><strong>3</strong>:
        <em>summon monster VI</em></p>
