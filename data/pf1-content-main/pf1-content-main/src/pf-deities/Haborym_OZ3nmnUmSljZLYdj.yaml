        <h1>Haborym</h1><h2>The Burning Hearth</h2>@Source[PZO9267;pages=326]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Haborym">Haborym</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Immolation, renewal, shackles<br
        /><strong>Domains</strong> Evil, Fire, Law, Protection<br
        /><strong>Subdomains</strong> Arson, Ash, Defense, Devil (Evil), Devil
        (Law)<br /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Longspear<br /><strong>Symbol</strong>
        Burning spider web<br /><strong>Sacred Animal(s)</strong> Spider<br
        /><strong>Sacred Color(s)</strong> Black,
        orange</p><h3>Obedience</h3><p>Burn a spiderweb while a living creature
        is entangled inside. Gain a +4 profane bonus on saving throws against
        effects that deal fire damage.</p><h2>Boons - Infernal
        Dukes</h2>@Source[PZO1139;pages=116]<br />The Lords of Hell, the Dukes
        of Perdition, and the Princes of Damnation are all names for the
        infamous nobility of the Pit- the elite caste of devilkind known as the
        infernal dukes.<p> All infernal dukes are lawful evil and range in power
        from CR 26 to CR 27. The boons they grant are less complex than those
        granted by archdevils, manifesting as spell-like abilities usable once
        per day each.</p><p><strong>1</strong>: <em>slow</em><br
        /><strong>2</strong>: <em>delayed blast fireball</em><br
        /><strong>3</strong>: <em>imprisonment</em></p><h2>For Followers of
        Haborym</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
