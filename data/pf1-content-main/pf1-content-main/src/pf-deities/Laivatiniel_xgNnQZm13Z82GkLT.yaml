      content: >-
        <h1>Laivatiniel</h1><h2>The Chains and the
        Cradle</h2>@Source[PZO9267;pages=318] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Laivatiniel">Laivatiniel</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Anxiety, coddling, unhealthy parental love<br
        /><strong>Domains</strong> Charm, Evil, Madness, Trickery<br
        /><strong>Subdomains</strong> Daemon, Deception, Insanity, Love<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Light crossbow<br
        /><strong>Symbol</strong> Rattle wrapped in chains<br /><strong>Sacred
        Animal(s)</strong> Bear<br /><strong>Sacred Color(s)</strong> Black,
        brown</p><h3>Obedience</h3><p>Spend an hour creating and then eating a
        detailed portrait of your mother or father. Gain a +4 profane bonus on
        saving throws against enchantment effects.</p><h2>Boons - Daemon
        Harbingers</h2><p>@Source[PZO1139;pages=114]</p><p>Abaddon's unique
        daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>unnatural lust</em><br
        /><strong>2</strong>: <em>fear</em><br /><strong>3</strong>:
        <em>unwilling shield</em></p>
