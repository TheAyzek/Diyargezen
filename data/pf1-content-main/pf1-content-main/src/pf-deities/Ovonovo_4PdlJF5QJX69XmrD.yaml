        <h1>Ovonovo</h1><h2>Gluttontide</h2>@Source[PZO9267;pages=328] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Ovonovo">Ovonovo</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Nascent Demon Lords<br /><strong>Areas
        of Concern</strong> Sharks, shipwrecks<br /><strong>Domains</strong>
        Animal, Chaos, Evil, Water<br /><strong>Subdomains</strong> Blood,
        Catastrophe, Demon (Chaos), Demon (Evil), Oceans<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Punching dagger<br /><strong>Symbol</strong> Ship eaten
        by shark<br /><strong>Sacred Animal(s)</strong> Shark<br
        /><strong>Sacred Color(s)</strong> Blue,
        red</p><h3>Obedience</h3><p>Allow a shark to bite you and then focus on
        the pain while floating in seawater. Gain a +4 profane bonus on saves
        against fear-based effects.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=39]<br
        /><strong>1: First Boon (Sp)</strong> <em>wood shape</em> 1/day<br
        /><strong>2: Second Boon (Sp)</strong> <em>summon monster IV </em>(1d3
        sharks only) 1/day<br /><strong>3: Third Boon (Sp)</strong> <em>beast
        shape IV (sharks only) 1/day</em></p><h2>Boons - Nascent Demon
        Lords</h2><em><p>@Source[PZO1139;pages=125]</p><p>With very few
        exceptions, a demon lord is never born fully formed. Instead, each must
        build power and resources during an extended period of transformation.
        Demons in this transitional stage are known as nascent demon
        lords.</p><p> At any one time, there exist hundreds-if not thousands- of
        nascent demon lords in the Abyss. Those who have been associated with
        the Inner Sea region are summarized here. All nascent demon lords are
        chaotic evil and range in power from CR 21 to CR 25. The boons they
        grant are less complex than those granted by demon lords, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>wood shape</em><br
        /><strong>2</strong>: <em>summon monster IV (1 fiendish great white
        shark or 1d3 fiendish sharks)<br /><strong>3</strong>: <em>beast shape
        IV</em> (sharks only)</em></p>
