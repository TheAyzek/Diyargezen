      content: >-
        <h1>Roqorolos</h1><h2>Prince of the
        Wracked</h2>@Source[PZO9267;pages=318] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Roqorolos">Roqorolos</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Castaways, fouled water, oceans<br
        /><strong>Domains</strong> Evil, Travel, Water, Weather<br
        /><strong>Subdomains</strong> Daemon, Isolation, Oceans, Storms<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Net<br /><strong>Symbol</strong>
        Sinking ship<br /><strong>Sacred Animal(s)</strong> Shark<br
        /><strong>Sacred Color(s)</strong> Blue,
        yellow</p><h3>Obedience</h3><p>Consume at least a pint of brackish
        water. Gain a +4 profane bonus on saving throws against waterbased
        effects and effects that cause suffocation or drowning.</p><h2>Boons -
        Daemon Harbingers</h2><p>@Source[PZO1139;pages=115]</p><p>Abaddon's
        unique daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>slipstream</em><br
        /><strong>2</strong>: <em>ride the waves</em><br /><strong>3</strong>:
        <em>fluid form</em></p>
