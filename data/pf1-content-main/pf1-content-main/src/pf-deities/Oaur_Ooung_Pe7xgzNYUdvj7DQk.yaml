        <h1>Oaur-Ooung</h1><h2>The Blistering
        Womb</h2>@Source[PZO9267;pages=328] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Oaur-Ooung">Oaur-Ooung</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Qlippoth Lords<br /><strong>Areas of
        Concern</strong> Tainted oceans, vile fecundity<br
        /><strong>Domains</strong> Chaos, Evil, Plant, Water<br
        /><strong>Subdomains</strong> Decay, Fear, Growth, Oceans<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Trident<br /><strong>Symbol</strong>
        Jellyfish shaped rune<br /><strong>Sacred Animal(s)</strong> None<br
        /><strong>Sacred Color(s)</strong> Blue</p><h3>Obedience</h3><p>Drink
        fouled water, and maintain yourself on the edge of regurgitation for an
        hour. Gain a +4 profane bonus on saving throws against poison
        effects.</p><h2>Boons - Qlippoth Lords</h2>@Source[PZO1139;pages=128]<br
        />Qlippoth lords are always chaotic evil and range in power from CR 21
        to CR 25. It's quite likely that more powerful creatures akin to
        demigods in stature may still exist in the deepest parts of the Abyss,
        but such qlippoth demigods remain theoretical for now, and they do not
        maintain active cults on mortal worlds. The boons qlippoth lords grant
        are less complex than those granted by fiendish demigods, manifesting as
        spell-like abilities usable twice per day each.<p><strong>1</strong>:
        <em>disfiguring touch</em><br /><strong>2</strong>: <em>poison</em><br
        /><strong>3</strong>: <em>greater contagion</em></p>
