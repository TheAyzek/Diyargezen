        <h1>Taraksun</h1><h2>The Awakener of
        Wrath</h2>@Source[PZO1139;pages=110] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Taraksun">Taraksun</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Asura Ranas<br /><strong>Areas of
        Concern</strong> Anger, dreams, shattering of bonds<br
        /><strong>Domains</strong> Evil, Law, Liberation, Madness<br
        /><strong>Subdomains</strong> Freedom, Insanity, Nightmare,
        Revolution<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong>
        Warhammer</p><h3>Obedience</h3><p>Bind yourself tightly with cords of
        woven hair and then lull yourself into anger-filled dreams for an hour.
        Gain a +4 profane bonus on saving throws against paralysis and sleep
        effects.</p><h2>Boons - Asura Ranas</h2>@Source[PZO1139;pages=111]<br
        />Over time, the mightiest of the asuras complete enough cycles of
        reincarnation and build upon the atrocities committed over multiple
        lives to incarnate into the most powerful of their kind: the asura
        ranas.<p> Asura ranas are lawful evil demigods that range in power from
        CR 26 to CR 30. Each asura rana detailed below is given an obedience,
        but the boons they grant are less complex than those granted by
        archdevils, manifesting as spell-like abilities usable once per day
        each.</p><p><strong>1</strong>: <em>deeper slumber</em><br
        /><strong>2</strong>: <em>night terrors</em><br /><strong>3</strong>: 
        <em>dream voyage</em></p>
