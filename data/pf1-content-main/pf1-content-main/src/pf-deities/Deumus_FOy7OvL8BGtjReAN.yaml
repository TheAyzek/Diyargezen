        <h1>Deumus</h1><h2>The Glutton of Graves</h2>@Source[PZO9267;pages=326]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Deumus">Deumus</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Apprehension, promises, terror<br
        /><strong>Domains</strong> Darkness, Death, Evil, Law<br
        /><strong>Subdomains</strong> Devil (Evil), Devil (Law), Murder, Night,
        Undead<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Halberd<br
        /><strong>Symbol</strong> Grave with 3 arms emerging<br /><strong>Sacred
        Animal(s)</strong> Maggot<br /><strong>Sacred Color(s)</strong> Gray,
        yellow</p><h3>Obedience</h3><p>Consume three maggots plucked from a
        grave. Gain a +4 profane bonus on saves against poison.</p><h2>Boons -
        Infernal Dukes</h2>@Source[PZO1139;pages=116]<br />The Lords of Hell,
        the Dukes of Perdition, and the Princes of Damnation are all names for
        the infamous nobility of the Pit- the elite caste of devilkind known as
        the infernal dukes.<p> All infernal dukes are lawful evil and range in
        power from CR 26 to CR 27. The boons they grant are less complex than
        those granted by archdevils, manifesting as spell-like abilities usable
        once per day each.</p><p><strong>1</strong>: <em>vision of Hell</em><br
        /><strong>2</strong>: <em>control undead</em><br /><strong>3</strong>:
        <em>soul bind</em></p><h2>For Followers of
        Deumus</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
