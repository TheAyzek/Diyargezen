      content: >-
        <h1>Korada</h1><h2>The Open Hand of
        Harmony</h2>@Source[PZO9267;pages=322] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Korada">Korada</a><h3>Details</h3><p><strong>Alignment</strong>
        NG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Foresight, forgiveness, peace<br
        /><strong>Domains</strong> Good, Healing, Magic, Protection<br
        /><strong>Subdomains</strong> Agathion, Defense, Divine, Medicine*,
        Restoration<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Unarmed strike<br
        /><strong>Symbol</strong> Lotus above two figures<br /><strong>Sacred
        Animal(s)</strong> Monkey<br /><strong>Sacred Color(s)</strong> Green,
        purple</p><h3>Obedience</h3><p>Exactly at dawn, sit cross-legged in a
        quiet place. Fill your mind with thoughts of those who have harmed you
        or your loved ones. Strive to find forgiveness in your heart. Maintain
        your pose for an hour, rising above any physical discomfort you
        experience. Gain a +4 sacred bonus on saves against effects with the
        chaotic or lawful descriptor.</p><h2>Boons - Celestial
        Obedience</h2><h3>Mystery Cultist</h3><p>@Source[PZO9255;pages=17]<br
        /><strong>1: Harmonic (Sp)</strong> <em>bless</em> 3/day, <em>augury
        </em> 2/day, or <em>mad monkeys<sup>UM</sup> 1/day</em><br /><strong>2:
        Steady Hand (Su)</strong> Three times per day as a swift action, you can
        choose to deal nonlethal damage with a weapon that normally deals lethal
        damage for 1 hour. When you use this ability, you do not take the normal
        -4 penalty on attack rolls for dealing nonlethal damage with a lethal
        weapon, and the damage die of your weapon increases by one step as long
        as you deal nonlethal damage with it.<br /><strong>3: Quietude
        (Su)</strong> You maintain an aura of utter peace. A continual
        <em>sanctuary </em>effect surrounds you, requiring enemies to succeed at
        a Will save (DC 11 + 1/2 your HD) to directly attack you. Extraplanar
        creatures that manage to attack you directly must succeed at an
        additional Will save (DC 14 + 1/2 your HD) or return to their plane of
        origin as though affected by a <em>dismissal </em>spell. If you attack
        another creature, the <em>sanctuary </em>effect temporarily subsides for
        1d4+1 rounds.</em></p><h2>For Followers of
        Korada</h2><h3>Feats</h3><p><em>Heroic
        Interposition</em></p><h3>Traits</h3><p><em>Empyreal Focus</em></p>
