      content: >-
        <h1>Lamashtu</h1><h2>Mother of Monsters</h2>@Source[PZO9267;pages=92]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Lamashtu">Lamashtu</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Core Deities<br /><strong>Other
        Pantheons</strong> Deities of Tian Xia, Demon Lords<br /><strong>Areas
        of Concern</strong> Madness, monsters, nightmares<br
        /><strong>Domains</strong> Chaos, Evil, Madness, Strength, Trickery<br
        /><strong>Subdomains</strong> Cannibalism, Corruption, Deception, Demon
        (Chaos), Demon (Evil), Ferocity, Insanity, Nightmare, Riot, Thievery,
        Truth*<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Falchion<br
        /><strong>Symbol</strong> Three-eyed jackal<br /><strong>Sacred
        Animal(s)</strong> Jackal<br /><strong>Sacred Color(s)</strong> Red,
        yellow</p><h3>Obedience</h3><p><strong>(Deific Obedience)</strong>
        Sacrifice an unwilling living creature in the name of the Mother of
        Monsters. Draw the process out to inspire the maximum terror and
        suffering in your victim. The death blow you deal should be savage and
        destructive-do not grant your sacrifice a clean death. Once the creature
        is dead, remove one of its bones and sharpen it to a point. Use the bone
        to cut yourself deeply enough to leave a scar. Leave the sacrificed
        creature's mutilated form in the open where scavengers may devour it or
        travelers may see it and know of Lamashtu's power. Gain a +1 natural
        armor bonus to your AC.</p><p><strong>(Demonic Obedience)</strong>
        Engage in a tryst with the sincere intention of being impregnated or
        impregnating your partner, or sacrifice a creature that has been alive
        for no more than a week. Gain a +4 profane bonus on saves against
        insanity, confusion, and polymorph effects.</p><h3>Divine
        Gift</h3><p>@Source[PZO1141;pages=78] <br /><em>Nethys Note: See here
        for details on how to gain a Divine Gift</em><br />The recipient can
        disgorge a servitor monster from her body as a full-round action. The
        monster views the character as its mother and follows her general
        commands, although it can't be directly controlled. The exact type of
        monster spawned is chosen by the GM, but is generally one whose CR is
        equal to the character's level (or in the case of an NPC, the
        character's own CR). The monster lives for 9 days, after which it dies
        in a spectacular shower of gore.</p><h3>On
        Golarion</h3><p><strong>Centers of Worship</strong> Belkzen, Irrisen,
        Katapesh, Nex, Osirion, River Kingdoms, Varisia, Worldwound<br
        /><strong>Nationality</strong> demon</p><h2>Boons - Deific
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO9267;pages=92]<br
        /><strong>1: Savage Summoner (Sp)</strong> <em>summon monster I</em>
        3/day, <em>summon swarm</em> 2/day, or <em>summon nature's ally III</em>
        1/day<br /><strong>2: Terrifying Eidolon (Su)</strong> Your eidolon
        gains the frightful presence evolution for free, if you wish. Whenever
        you gain a new level in the summoner class (or the evangelist prestige
        class, if your aligned class has the eidolon class feature) and you
        reassign your evolution points, you can choose to assign or remove the
        frightful presence evolution. Once your choice has been made, it can't
        be altered until the next time you gain an appropriate level. If you
        don't have the eidolon class feature, you can instead use <em>summon
        monster V</em> once per day as a spell-like ability.<br /><strong>3:
        Tainted Ally (Sp)</strong> Once per day as a standard action, you can
        summon a baregara (<em>Pathfinder RPG Bestiary</em> 3</em> 34). The
        baregara follows your commands perfectly for 1 minute for every Hit Die
        you possess before vanishing back to its home in the Abyss. The baregara
        doesn't follow commands that would cause it to act in lawful, good, or
        otherwise beneficial ways. Such commands not only earn a snarl of
        disgust from the creature, but could cause the baregara to attack you if
        the command is particularly
        egregious.</em></p><h3>Exalted</h3><p>@Source[PZO9267;pages=92]<br
        /><strong>1: Howling Terror (Sp)</strong> <em>cause fear</em> 3/day,
        <em>mad hallucination<sup>UM</sup> 2/day, or <em>fear</em> 1/day<br
        /><strong>2: Maddening Thoughts (Su)</strong> Your mind constantly
        swirls with dark whispers and disturbing thoughts. You gain a +4 profane
        bonus on saving throws against mind-affecting (compulsion) spells and
        effects and against divination spells and effects that attempt to read
        your thoughts. Anyone who targets you with such a spell or effect must
        succeed at a Will saving throw (with a DC equal to 10 + your Wisdom
        modifier + 1/2 your Hit Dice) or take 1d4 points of Wisdom damage.<br
        /><strong>3: Monstrous Transformation (Sp)</strong> Once per day, you
        can use <em>baleful polymorph</em>, except you change the target into a
        horribly mutated form of the chosen animal. The target takes a -4
        penalty on its saving throw to resist your spell (if the new form would
        prove fatal for the creature, it still gains a +4 bonus on its saving
        throw, effectively negating this penalty). In addition to the other
        effects of the spell, the subject is in constant pain from its twisted
        and disfigured form, and takes 1d6 points of nonlethal damage each
        round. This constant agony imposes a -2 penalty on all of the target's
        ability checks, skill checks, saving throws, attack rolls, and damage
        rolls.</em></p><h3>Sentinel</h3><p>@Source[PZO9267;pages=92]<br
        /><strong>1: Ferocious Battler (Sp)</strong> <em>stone
        fist</em><sup>APG</sup> 3/day, <em>bear's endurance 2/day, or
        <em>greater magic fang</em> 1/day<br /><strong>2: Bestial Jaws
        (Ex)</strong> Your jaw distends slightly and you grow prominent canines.
        You gain a bite attack that deals 1d4 points of damage if you're Medium
        or 1d3 points of damage if you're Small, plus half your Strength bonus.
        When part of a full attack, the bite attack is made at your full base
        attack bonus - 5. You can also make a bite attack as part of the action
        to maintain or break free from a grapple. This attack is resolved before
        the grapple check is attempted. If the bite attack hits, you gain a +2
        bonus on your grapple check and any other grapple check against the same
        creature this round.<br /><strong>3: Scarred Form (Su)</strong> An
        armorlike epidermis of thick scars covers you. You take a -2 penalty on
        Charisma checks and Charisma-based skill checks. You gain damage
        reduction 5/-. If you already had damage reduction with no method of
        bypass (such as from the barbarian's damage reduction class feature),
        you instead increase that damage reduction by 5.</em></p><h2>Boons -
        Demonic Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=6]<br
        /><strong>1: Lunatic's Gift (Sp)</strong> <em>lesser confusion</em>
        3/day, <em>touch of idiocy</em> 2/day, or <em>summon monster III</em>
        1/day<br /><strong>2: Teratoma (Ex)</strong> You gain a beneficial
        deformity. Generally, this deformity manifests as a tentacle, tail,
        claw, or bite that grants you a secondary natural attack dealing 1d6
        (1d4 for Small creatures) points of damage. You gain an additional
        ability depending on the attack chosen as well-this ability can be
        chosen from the following special attacks: bleed 3, grab, trip, or a
        5-foot increase to reach with the natural attack.<br /><strong>3: Third
        Eye (Su)</strong> A third eye opens in your forehead. This eye grants
        you darkvision to a range of 60 feet (if you already have darkvision, it
        extends the range of your darkvision by 60 feet) and a +4 profane bonus
        on Perception checks. Three times per day, you may use a gaze attack
        that lasts for 1 round; activating this gaze attack is a swift action.
        This gaze attack has a range of 30 feet, and drives those who fail to
        resist its effects with a Will save permanently insane, as per the spell
        <em>insanity </em>(save DC equals 10 + half your HD + your Charisma
        modifier).</em></p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=66]<br
        /><strong>1: Lunatic's Gift (Sp)</strong> <em>lesser confusion </em>
        3/day, <em>touch of idiocy</em> 2/ day, or <em>summon monster III</em>
        1/day<br /><strong>2: Teratoma (Ex)</strong> You gain a beneficial
        deformity. Generally, this deformity grants you a secondary natural
        bite, claw, tail, or tentacle attack dealing 1d6 points of damage (1d4
        if you are Small). You gain an additional ability with this extra
        attack, chosen from the following special features: bleed 3, grab, trip,
        or a 5-foot increase to reach with the natural attack.<br /><strong>3:
        Third Eye (Su)</strong> A third eye opens in your forehead. This eye
        grants you darkvision to a range of 60 feet (if you already have
        darkvision, it extends the range of your darkvision by 60 feet) and a +4
        profane bonus on Perception checks. Three times per day, as a swift
        action you can activate a gaze attack that lasts for 1 round. This gaze
        attack has a range of 30 feet, and it drives those who fail to resist
        its effects with a Will save permanently insane, as per the spell
        <em>insanity</em> (DC = 10 + half your Hit Dice + your Charisma
        modifier).</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=66]<br
        /><strong>1: Howling Terror (Sp)</strong> <em>cause fear </em> 3/day,
        <em>mad hallucination</em> 2/day, or <em>waters of Lamashtu</em>
        1/day<br /><strong>2: Maddening Thoughts (Su)</strong> Your mind
        constantly swirls with dark whispers and disturbing thoughts. You gain a
        +4 profane bonus on saving throws against mind-affecting (compulsion)
        spells and effects and against divination spells and effects that
        attempt to read your thoughts. Anyone who targets you with such a spell
        or effect must succeed at a Will saving throw (DC = 10 + half your Hit
        Dice + your Wisdom modifier) or take 1d4 points of Wisdom damage.<br
        /><strong>3: Monstrous Transformation (Sp)</strong> Once per day, you
        can cast <em>baleful polymorph</em> as a swift action, except you change
        the target into a horribly mutated form of the chosen animal. In
        addition to the other effects of the spell, the subject is in constant
        pain due to its twisted and disfigured form, and it takes a -2 penalty
        on ability checks, attack rolls, damage rolls, saving throws, and skill
        checks.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=66]<br
        /><strong>1: Ferocious Battler (Sp)</strong> <em>stone fist</em> 3/day,
        <em>bear's endurance</em> 2/day, or <em>greater magic fang</em> 1/day<br
        /><strong>2: Bestial Jaws (Ex)</strong> Your body has reacted to your
        faith in the Demon Queen, and as a result, your jaw distends slightly
        and you grow prominent canines. You gain a bite attack that deals 1d4
        points of damage if you're Medium or 1d3 points of damage if you're
        Small, plus half your Strength bonus. When part of a full attack, the
        bite attack is made at your full base attack bonus - 5. You can also
        make a bite attack as part of the action to maintain or break free from
        a grapple. This attack is resolved before the grapple check is
        attempted. If the bite attack hits, you gain a +2 bonus on your grapple
        check and any subsequent grapple checks against the same creature this
        round.<br /><strong>3: Scarred Form (Su)</strong> An armor-like
        epidermis of thick scars covers you. You take a -2 penalty on Charisma
        checks and Charisma-based skill checks. You gain damage reduction 5/-.
        If you already had damage reduction with no method of bypass (such as
        from the barbarian's damage reduction class feature), you instead
        increase that damage reduction by 5.</em></p><h2>Antipaladin
        Code</h2><em>The leaders of Lamashtu's children are proud of their
        deformities and rage against civilization. They seek to tear the
        blinders from the eyes of the world and show them the nightmare of
        nature, the writhing and endlessly fecund truth. Their code is one of
        bloodshed and howling madness. Its tenets include the following adages.
        <ul><li>All things are monstrous, and only the weak hide their marks. I
        show the world as it is.</li><li>I will bring the outcasts in from the
        cold and teach them the taste of victory.</li><li>I fill the wombs. I
        birth the children. I teach our enemies why they fear the
        night.</li><li>I bring madness to the cities, that in their blood and
        fear they may understand the chaos of the world.</li><li>I will spread
        the Mother's seed. If the blind cannot be taught to see, their children
        can.</li></ul><h2>Divine Fighting Technique</h2><h3>Lamashtu's
        Carving</h3><p>@Source[PZO9472;pages=29] <br />One of the grisliest
        divine fighting manuals is <em>Fecundity of Corpses</em>, a harrowing
        tome that depicts the fighting styles favored by the followers of
        Lamashtu, the Mother of Monsters. In addition to detailing many of the
        more gruesome rites favored by the Demon Queen, <em>Fecundity of
        Corpses</em> includes hundreds of techniques recorded in blood by
        cultists of Lamashtu from across the Inner Sea region. Though no
        standardized edition of this manual exists because of the cult's
        discordant hierarchy, each tome manages to perfectly capture similar
        techniques for sowing fear and blood in Lamashtu's
        name.</p><p><strong>Initial Benefit</strong>: As a standard action, you
        can make a single attack with a falchion or a kukri in order to deal
        bleed damage to the target. When you make this attack, you do not apply
        your ability modifier (normally Strength, but potentially other
        modifiers) to the hit point damage dealt by your attack-instead, add an
        amount of bleed damage equal to this modifier. The bleeding can be
        stopped by a successful DC 15 Heal check or any amount of magical
        healing. Bleed damage from this benefit doesn't stack with
        itself.<strong>Advanced Prerequisites</strong>: Str 13, Dazing
        Assault<sup>APG</sup>, Divine Fighting Technique, Power
        Attack.</p><p><strong>Advanced Benefit</strong>: Whenever you hit a
        bleeding creature with a melee attack using a falchion or a kukri, that
        creature must succeed at a Fortitude save (DC = 10 + your base attack
        bonus) or become staggered for 1 round. Multiple attacks do not cause
        this condition to stack, and a creature that successfully saves against
        this staggering effect is immune to this effect for 1 round.</p><h2>For
        Followers of Lamashtu</h2><h3>Archetypes</h3><p>Beast Rider (Cavalier),
        Beast-Bonded (Witch), Beastmorph (Alchemist), Evolutionist (Summoner),
        Savage Warrior (Fighter)</p><h3>Feats</h3><p>Destroy Identity, Fearsome
        Finish, Lamashtu's Mark, Nightmare Scars</p><h3>Magic Items -
        Altars</h3><p>Altar of Lamashtu</p><h3>Magic Items - Armor</h3><p>Pelt
        of the Demon Mother</p><h3>Magic Items - Weapons</h3><p>Bonespur Dagger,
        Fanged Falchion, Jackal's Blade, Redlust's Daughter</p><h3>Magic Items -
        Wondrous Items</h3><p>Demon Mother's Mask, Gutbite Belt, Mortuary
        Mask</p><h3>Monsters</h3><p>Swaithe, Yethazmari
        (Herald)</p><h3>Spells</h3><p>Anthropomorphic Animal, Blade of Dark
        Triumph, Demon Dream, Litany of Madness, Monstrous Extremities, Summon
        Barghest I, Summon Barghest II, Teratoid Caress, Vision of Lamashtu,
        Waters of Lamashtu</p><h3>Traits</h3><p>Deformed, Mother's Rage,
        Mother's Teeth, Opportune Slayer, Unhinged Mentality, Voice of
        Monsters</p><h2>Unique Spell
        Rules</h2>@Source[PZO9267;pages=99]<p><h3>Cleric/Warpriest</h3></p><p><em>Nightmare
        can be prepared as a 6th-level spell<br /><em>Baleful Polymorph</em> can
        be prepared as a 5th-level spell<br
        /></em></p><h3>Druid</h3><p><em>Baleful Polymorph</em> can be prepared
        as a 5th-level spell<br /></em></p><h2>Unique Summon
        Rules</h2>@Source[PZO9005;pages=71]<br /><strong>Summon Monster
        III</strong>: Fiendish Worg - CE<br /><strong>Summon Monster V</strong>:
        Barghest - CE (chaotic subtype instead of lawful)<br /><strong>Summon
        Monster VIII</strong>: Warped One - CE<br /><strong>Summon Monster
        VIII</strong>: Nightmare - NE<br /><h2>Other
        Rules</h2>@Source[PZO9267;pages=99]<em></em><br />Druids/Rangers can use
        <em>summon nature's ally</em> spells to summon fiendish animals from the
        same level summon monster list.
