    text:
      content: >-
        <h1>Kostchtchie</h1><h2>The Deathless
        Frost</h2>@Source[PZO9267;pages=320] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Kostchtchie">Kostchtchie</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Cold, giants, revenge<br /><strong>Domains</strong>
        Chaos, Evil, Strength, War<br /><strong>Subdomains</strong> Demon
        (Chaos), Demon (Evil), Ferocity, Ice, Tactics<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Warhammer<br /><strong>Symbol</strong> Icy rune-carved
        hammer<br /><strong>Sacred Animal(s)</strong> Polar bear<br
        /><strong>Sacred Color(s)</strong> Blue,
        white</p><h3>Obedience</h3><p>Spill the blood of a living creature onto
        snowcovered ground; the creature must remain alive during the entire
        obedience, and must die within a minute of the obedience's end. Gain a
        +4 bonus on all saving throws against cold.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=19]<br
        /><strong>1: Frozen Wrath (Sp)</strong> <em>chill touch</em> 3/day,
        <em>bull's strength 2/day, or <em>sleet storm</em> 1/day<br /><strong>2:
        Cold's Caress (Ex)</strong> Gain cold resistance 30. If you are immune
        to cold, you may instead gain fire resistance 30. You may change to fire
        resistance if you gain immunity to cold at a point after you gain this
        boon.<br /><strong>3: Wrath of Frost (Sp)</strong> You can cast
        <em>giant form I</em> once per day. Three times during this ability's
        duration, you can cast an empowered <em>cone of cold</em> as a
        spell-like ability. This ability is the equivalent of a 9th-level
        spell.</em></p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=64]<br
        /><strong>1: Frozen Vengeance (Sp)</strong> <em>frostbite </em> 3/day,
        <em>chill metal</em> 2/day, or <em>unadulterated loathing</em> 1/day<br
        /><strong>2: Deathless Vengeance (Sp)</strong> After you are slain, you
        will not rest until your killer is dragged shrieking into death with
        you. One round after your demise, your soul rises from your corpse and
        instantly seeks out your killer. This acts as per <em>phantasmal
        revenge</em>, except this is a necromancy effect with the death
        descriptor instead of the spell's normal school, subschool, and
        descriptors.<br /><strong>3: Eternal Vengeance (Sp)</strong> While
        Kostchtchie's centuries of labor have brought him no closer to
        discovering the legendary torc that holds his cloven soul, he has
        learned much about the manner in which his soul was captured, and he
        gifts you with a fragment of that knowledge. Once per day, when you are
        the target of an attack or spell that would either kill you or render
        you helpless, you can target your attacker with a <em>trap the soul</em>
        spell as an immediate action after you resolve the effects of the attack
        on yourself (even if you are dead when this effect occurs). Instead of a
        gemstone, you must be carrying a piece of jewelry (such as a bracelet,
        ring, or torc) of adequate value to contain the target's soul. (Value
        derived from magical properties counts for this purpose.) A single piece
        of jewelry can hold only one soul, but if you are restored to life, you
        can release a trapped individual as a standard action by holding the
        jewelry out before you, which causes the target to reappear prone in
        that square. A creature released this way is stunned for 1d4
        rounds.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=64]<br
        /><strong>1: Frozen Wrath (Sp)</strong> <em>chill touch</em> 3/day,
        <em>bull's strength</em> 2/day, or <em>sleet storm</em> 1/day<br
        /><strong>2: Cold's Caress (Ex)</strong> Your lord's realm is a
        perpetually frozen landscape, and in unholy anticipation of taking your
        rightful place in that land your body has begun to adapt and change. You
        gain cold resistance 30. If you are immune to cold, or gain immunity to
        cold at a point after you gain this boon, you instead gain fire
        resistance 30.<br /><strong>3: Wrath of Frost (Sp)</strong> Regardless
        of your true form, you see purity and power in the hulking shape of all
        giants. As a reward for your faith and devotion, you have gained the
        ability to cast <em>giant form I</em> as a spell-like ability once per
        day. Three times during this ability's duration, you can cast empowered
        <em>cone of cold</em> as a spell-like
        ability.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=64]<br
        /><strong>1: Giant's Might (Sp)</strong> <em>enlarge person </em> 3/day,
        <em>bear's endurance 2/day, or <em>force punch</em> 1/day<br
        /><strong>2: Twisted Grasp (Ex)</strong> Your arms become longer, nearly
        dragging the ground when you walk, and appear to be bloated with
        unnatural muscle. You gain a slam attack that deals damage as
        appropriate for a creature one size category larger than yourself (1d8
        for a Medium creature). If you already have one or more slam or claw
        attacks, those attacks deal damage as though you were one size category
        larger. This does not affect the size of manufactured weapons you can
        wield, but you gain a +2 bonus on damage rolls with manufactured melee
        weapons.<br /><strong>3: Titan Shape (Sp)</strong> Through the blessing
        of the Deathless Frost, you can swell to giant size and crush your
        enemies with your titanic might. You can cast extended <em>giant form
        II</em> once per day as a spell-like ability. While under this effect,
        your gear resizes to fit your giant form. You can use this ability to
        assume a Huge-sized form of a giant that normally isn't Huge, such as a
        frost giant.</em></p><h2>For Followers of
        Kostchtchie</h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic
        Items - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Spells</h3><p><em>Frosthammer</em></p><h3>Traits</h3><p><em>Demonic
        Persuasion</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9069;pages=66]</em><br
        /><h3>Antipaladin</h3></em><p><em>Hex Ward can be prepared as a
        1st-level spell<br /><em>Chill Metal</em> can be prepared as a 2nd-level
        spell<br /></em></p><h3>Cleric/Warpriest</h3><p><em>Hex Ward can be
        prepared as a 1st-level spell<br /><em>Chill Metal</em> can be prepared
        as a 2nd-level spell<br /><em>Litany of Vengeance can be prepared as a
        4th-level spell<br /></em></p><h3>Ranger</h3><p><em>Hex Ward</em> can be
        prepared as a 1st-level spell<br /><em>Chill Metal can be prepared as a
        2nd-level spell<br /><em>Litany of Vengeance</em> can be prepared as a
        4th-level spell<br /></em></p><h2>Unique Summon
        Rules</h2>@Source[PZO9069;pages=66]<br /><strong>Summon Monster
        III</strong>: Fiendish Ice Elemental (Small)<br /><strong>Summon Monster
        V</strong>: Fiendish Ice Elemental (Medium)<br /><strong>Summon Monster
        V</strong>: Half-Fiend Yeti<br /><strong>Summon Monster VI</strong>:
        Fiendish Ice Elemental (Large)<br /><strong>Summon Monster VII</strong>:
        Fiendish Ice Elemental (Huge)<br /><strong>Summon Monster VIII</strong>:
        Fiendish Ice Elemental (Greater)<br /><strong>Summon Monster
        IX</strong>: Fiendish Ice Elemental (Elder)
