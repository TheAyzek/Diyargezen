      content: >-
        <h1>Charon</h1><h2>The Boatman</h2>@Source[PZO9267;pages=326] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Charon">Charon</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Horsemen<br /><strong>Areas of
        Concern</strong> Death<br /><strong>Domains</strong> Death, Evil,
        Knowledge, Water<br /><strong>Subdomains</strong> Daemon, Ice, Memory,
        Undead<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Quarterstaff<br
        /><strong>Symbol</strong> Skull with coins on eyes<br /><strong>Sacred
        Animal(s)</strong> Horse, raven<br /><strong>Sacred Color(s)</strong>
        Pale green</p><h3>Obedience</h3><p>Meditate upon your infirmities and
        the slow, inevitable progression of physical and mental decay inherent
        to the ravages of time. Mimic this progression by immersing yourself or
        a victim in icy water until nearly unconscious, or by consuming alcohol
        or drugs that dull memory and mental faculties. Gain a +4 profane bonus
        on saving throws against necromancy and negative energy
        effects.</p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=36]<br
        /><strong>1: Death's Blessing (Sp)</strong> <em>memory lapse</em> 3/day,
        <em>catatonia </em> 2/day, or <em>create soul gem</em> 1/day<br
        /><strong>2: Soul Crush (Su)</strong> As a standard action, you can
        crush a soul gem (such as one you create via <em>create soul gem</em> or
        one created by a cacodaemon) to gain fast healing 15 for a number of
        rounds equal to your Hit Dice. This action condemns the crushed soul to
        Abaddon; resurrecting this victim requires a successful DC 28 caster
        level check.<br /><strong>3: Death's Clutches (Sp)</strong> You can use
        <em>soul bind</em> as a spell-like ability once per
        day.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=36]<br
        /><strong>1: Death's Grace (Sp)</strong> <em>ray of enfeeblement</em>
        3/day, <em>death knell</em> 2/day, or <em>sands of time</em> 1/day<br
        /><strong>2: Hunger of the Styx (Su)</strong> By channeling the
        memory-sapping ability of the River Styx, you can stun foes with a
        sudden but temporary loss of all memory. You can use this ability three
        times per day, activating it as a swift action when you strike a foe in
        combat with a melee weapon. The creature struck is stunned for 1 round
        and then staggered for an additional 1d4+1 rounds if it fails a Will
        save (DC = 10 + half your Hit Dice + your Charisma modifier). On a
        successful save, the creature is instead staggered for 1 round. This is
        a mind-affecting effect.<br /><strong>3: Grasp of the Styx (Sp)</strong>
        Once per day as a standard action, you can call upon the waters of the
        Styx to bubble up and manifest as an immense, skeletal talon of mud and
        black water. This effect duplicates the effects of <em>grasping
        hand</em>, except any creature that is grappled by the hand must also
        succeed at a Fortitude save against the spell or gain 1 negative
        level.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=36]<br
        /><strong>1: Death's Crusader (Sp)</strong> <em>mount</em> 3/day,
        <em>wartrain mount</em> 2/day, or <em>phantom steed</em> 1/day<br
        /><strong>2: On a Pale Horse (Su)</strong> You gain the ability to
        invoke the power of the Pale Horse. As a swift action, you cause a
        flickering image of the Pale Horse to appear in a 10-foot square
        adjacent to you. It then moves up to 120 feet as you mentally direct its
        movement (doing so is a move action that requires concentration). The
        image of the Pale Horse ignores difficult terrain and can walk over
        water or other surfaces that would normally not bear a creature's
        weight, but it cannot fly. Any creature whose space the image of the
        Pale Horse passes through must succeed at a Fortitude save or take a -6
        penalty to Strength, Dexterity, and Constitution, as if it had suddenly
        aged to become venerable. Creatures (like dragons) that normally gain
        benefits from aging do not gain any benefits, and they instead take the
        ability score penalties described above. These penalties do not stack
        with themselves or with existing penalties from aging. A creature can
        resist the effects of the Pale Horse with a successful Fortitude save
        (DC = 10 + half your Hit Dice + your Charisma modifier). A creature can
        be affected by the Pale Horse only once per round, regardless of how
        many times the Pale Horse moves through its space. This is an aging
        curse effect.<br /><strong>3: Death's Call (Sp)</strong> Once per day,
        you can call upon Charon's power to wither your enemies into dust. This
        ability functions as <em>wail of the banshee</em>, except it lacks a
        sonic component.</em></p><h2>For Followers of
        Charon</h2><h3>Archetypes</h3><p><em>Grim Apostle
        (Spiritualist)</em></p><h3>Feats</h3><p><em>Aura of
        Succumbing</em></p><h3>Magic Items - Wondrous Items</h3><p><em>Bridle of
        Charon</em></p><h3>Traits</h3><p><em>Covenant of Abaddon</em></p>
