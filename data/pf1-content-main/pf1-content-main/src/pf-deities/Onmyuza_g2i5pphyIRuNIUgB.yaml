      content: >-
        <h1>Onmyuza</h1><h2>Dancer in Flesh</h2>@Source[PZO1139;pages=126] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Onmyuza">Onmyuza</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Oni Daimyo<br /><strong>Areas of
        Concern</strong> Orgies, sake, tattoos<br /><strong>Domains</strong>
        Chaos, Charm, Evil, Rune<br /><strong>Subdomains</strong> Language,
        Lust, Revelry, Wards<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong>
        Kerambit</p><h3>Obedience</h3><p>Lightly trace the lines of your tattoos
        with the tip of a needle dipped in sake. Gain a +4 profane bonus on
        saving throws against effects that cause the confused, exhausted, or
        fatigued condition.</p><h2>Boons - Oni
        Daimyo</h2>@Source[PZO1139;pages=127]<p>The most powerful oni, the oni
        daimyo, hold their domains in isolated regions of the Material Plane.
        While they have transcended their lesser incarnations to become
        something close to demigods in stature, they do not flaunt their power
        and prefer to dwell in remote corners of the massive land of Tian
        Xia.</p><p> Oni daimyo are always evil in alignment but can be chaotic,
        lawful, or neutral. They range in power from CR 21 to CR 25. The boons
        they grant are less complex than those granted by fiendish demigods,
        manifesting as spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>unnatural lust</em><br
        /><strong>2</strong>: <em>spite</em><br /><strong>3</strong>: <em>mass
        suggestion</em></p>
