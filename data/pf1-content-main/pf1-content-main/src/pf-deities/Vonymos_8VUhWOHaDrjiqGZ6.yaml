      content: >-
        <h1>Vonymos</h1><h2>The Mourning Storm</h2>@Source[PZO92114;pages=20]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Vonymos">Vonymos</a><h3>Details</h3><p><strong>Alignment</strong>
        N<br /><strong>Pantheon</strong> Psychopomp Usher<br /><strong>Areas of
        Concern</strong> Catastrophes, last stands, and suicides<br
        /><strong>Domains</strong> Fire, Glory, Repose, Weather<br
        /><strong>Subdomains</strong> N/A<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Scythe<br
        /><strong>Symbol</strong> Hollow circle with three trailing lines
        curling clockwise from it</p><h3>Obedience</h3><p>Spend 1 hour observing
        and recording the weather or another force beyond mortal control, or
        inspire a mourner to pour her pain into creation or action. Gain a +4
        insight bonus on Craft or Perform checks.</p><h2>Boons - Monitor
        Obedience</h2><h3>None</h3><p>@Source[PZO92114;pages=20]<br /><strong>1:
        Cycle of Mourning (Sp)</strong> <em>decompose corpse</em> 3/day,
        <em>calm emotions</em> 2/day, or <em>rage</em> 1/day<br /><strong>2:
        Inspired Survivor (Ex)</strong> You gain a +4 insight bonus on checks to
        resist or survive the effects of harsh weather, earthquakes, and other
        environmental disasters.<br /><strong>3: Inspiration in Loss
        (Su)</strong> With a touch, you can dredge up powerful feelings of loss
        in other creatures. Three times per day as a standard action, you can
        touch an adjacent creature to cause it to become dazed by grief for 1
        round. An unwilling target can resist this effect with a successful Will
        saving throw (DC = 10 + half your Hit Dice + your Charisma modifier).
        The following round, the target gains one of the following as a bonus
        feat for a number of rounds equal to half your Hit Dice: Combat
        Reflexes, Deadly Aim, Great Fortitude, Iron Will, or Power Attack. A
        target does not need to meet the normal prerequisites for this bonus
        feat. A target who succeeds at the saving throw against the initial daze
        effect does not gain a bonus feat.</em></p><h2>For Followers of
        Vonymos</h2><h3>Prestige Classes</h3><p><em>Mortal Usher</em></p>
