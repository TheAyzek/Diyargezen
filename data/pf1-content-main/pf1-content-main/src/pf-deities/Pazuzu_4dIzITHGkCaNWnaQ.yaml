      content: >-
        <h1>Pazuzu</h1><h2>King of the Wind
        Demons</h2>@Source[PZO9267;pages=320] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Pazuzu">Pazuzu</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> The sky, temptation, winged creatures<br
        /><strong>Domains</strong> Air, Chaos, Evil, Trickery<br
        /><strong>Subdomains</strong> Cloud, Deception, Demon (Chaos), Demon
        (Evil), Wind<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Longsword<br
        /><strong>Symbol</strong> Himself, right hand raised<br /><strong>Sacred
        Animal(s)</strong> All flying animals<br /><strong>Sacred
        Color(s)</strong> Brown, red</p><h3>Obedience</h3><p>String up the
        intestines of a freshly killed creature somewhere that will attract the
        attention of hungry birds (such as the branches of a tree or the
        crenellations of a tower), then meditate on the offering. Gain a +4
        profane bonus on all saving throws against effects from flying creatures
        and compulsion effects.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=23]<br
        /><strong>1: Whispers on the Wind (Sp)</strong> <em>charm person</em>
        3/day, <em>enthrall</em> 2/ day, or <em>fly</em> 1/day<br /><strong>2:
        Possession (Sp)</strong> You can cast <em>magic jar </em>once per day as
        a spell-like ability. You can use a holy symbol of Pazuzu or a statue of
        Pazuzu as your receptacle-if you do so, you can determine the exact
        creature type and position of all potential life forces you're capable
        of possessing. This ability is the equivalent of a 7th-level spell.<br
        /><strong>3: True Temptation (Sp)</strong> If any creature speaks
        Pazuzu's name aloud three times with a single breath, and that creature
        is within 60 feet of you, you can cast quickened <em>charm monster
        </em>on that creature as an immediate action. You can use this power up
        to three times per day. Creatures with fly speeds take a -4 penalty on
        saves against this effect. If a creature that fails its save against
        this effect has <em>protection from evil </em>or a similar effect
        activated, that effect is immediately and automatically dispelled. You
        can use this ability against a creature that has not invoked Pazuzu's
        name, but if you do so, it functions as a normal (non-quickened)
        <em>charm monster spell that does not dispel <em>protection from evil
        </em>effects. This ability is the equivalent of a 9th-level
        spell.</em></p><h2>Boons - Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=86]<br
        /><strong>1: Pazuzu's Voice (Sp)</strong> <em>lesser confusion </em>
        3/day, <em>honeyed tongue</em> 2/day, or <em>suggestion</em> 1/day<br
        /><strong>2: Siren of the Skies (Ex)</strong> Your form becomes avian in
        aspect-your hair transforms into a mane of feathers, feathered wings
        sprout from your back, and your face takes on a birdlike profile with a
        hooked nose and chin. Your new wings grant you a fly speed equal to your
        base speed (good maneuverability). In addition, your voice becomes sweet
        and melodic, with an astonishing range. You gain a +4 bonus on Perform
        (oratory) and Perform (sing) checks, and the save DCs of
        language-dependent or sonic effects you create increase by 1. When you
        must attempt opposed Charisma checks against a charmed subject to
        convince it to do something it wouldn't ordinarily do, you can roll
        twice and take the result you prefer as your actual result.<br
        /><strong>3: Avian Mastery (Su)</strong> Any creature flying under its
        own power (flight from a source other than a spell, spell-like ability,
        or magic item) that attempts to attack you with a melee attack must
        attempt a Will save (DC = 10 + half your Hit Dice + your Charisma
        modifier). If the creature fails, it can't follow through with the
        attack, that part of its action is lost, and it can't directly attack
        you for the remainder of the round. Once a creature succeeds at this
        save, it is immune to this ability for 24
        hours.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=86]<br
        /><strong>1: Whispers on the Wind (Sp)</strong> <em>charm person</em>
        3/day, <em>enthrall</em> 2/day, or <em>fly</em> 1/day<br /><strong>2:
        Possession (Sp)</strong> You can cast <em>possession</em> three times
        per day as a spell-like ability.<br /><strong>3: True Temptation
        (Sp)</strong> If any creature speaks Pazuzu's name aloud three times
        with a single breath, and that creature is within 60 feet of you, you
        can cast <em>charm monster</em> on that creature as an immediate action.
        You can use this spell-like ability up to three times per day. Creatures
        with fly speeds take a -4 penalty on saving throws against this effect.
        If a creature that fails its save against this effect is under the
        benefits of <em>protection from evil</em> or a similar effect, that
        effect is immediately and automatically dispelled. You can use this
        ability against a creature that has not invoked Pazuzu's name, but if
        you do so, it functions as a normal (non-quickened) <em>charm monster
        spell that does not dispel <em>protection from evil</em>
        effects.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=86]<br
        /><strong>1: Master of Air (Sp)</strong> <em>feather fall</em> 3/day,
        <em>gust of wind</em> 2/day, or <em>wind wall</em> 1/day<br /><strong>2:
        The Wind, My Shield (Su)</strong> A cylinder of swirling wind constantly
        surrounds you, an effect you can dismiss or reactivate as a free action.
        While this effect is active, you gain a +4 deflection bonus to Armor
        Class, and all ranged attacks against you suffer a 50% miss chance.
        These supernatural winds can even deflect ranged touch spell effects
        (such as rays) and massive ranged weapons such as ballista bolts or
        thrown boulders. As a standard action, you can also direct these winds
        to assail a creature within 30 feet; this acts as a bull rush or trip
        attempt, using your Constitution modifier in place of your Strength
        modifier. You can maintain this wind shield for a number of rounds per
        day equal to your Hit Dice, but these rounds need not be consecutive.<br
        /><strong>3: Champion of Shibaxet (Sp)</strong> The King of the Wind
        Demons grants you mastery over the power of the winds. You can cast
        <em>winds of vengeance</em> as a spell-like ability once per
        day.</em></p><h2>For Followers of
        Pazuzu</h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic Items
        - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Traits</h3><p><em>Demonic Persuasion</em></p>
