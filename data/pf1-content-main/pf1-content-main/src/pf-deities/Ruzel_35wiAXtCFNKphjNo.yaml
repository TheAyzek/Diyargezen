        <h1>Ruzel</h1><h2>Sabletongue</h2>@Source[PZO9267;pages=326] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Ruzel">Ruzel</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Blasphemy, humor, undeath<br /><strong>Domains</strong>
        Death, Evil, Law, Trickery<br /><strong>Subdomains</strong> Devil
        (Evil), Devil (Law), Murder, Thievery, Undead<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Kukri<br /><strong>Symbol</strong> Laughing skull<br
        /><strong>Sacred Animal(s)</strong> Hyena<br /><strong>Sacred
        Color(s)</strong> Brown, ivory</p><h3>Obedience</h3><p>Mock the beliefs
        of your companions or of any creatures you have recently encountered.
        Gain a +4 profane bonus on saving throws against language-dependent
        effects.</p><h2>Boons - Infernal Dukes</h2>@Source[PZO1139;pages=118]<br
        />The Lords of Hell, the Dukes of Perdition, and the Princes of
        Damnation are all names for the infamous nobility of the Pit- the elite
        caste of devilkind known as the infernal dukes.<p> All infernal dukes
        are lawful evil and range in power from CR 26 to CR 27. The boons they
        grant are less complex than those granted by archdevils, manifesting as
        spell-like abilities usable once per day each.</p><p><strong>1</strong>:
        <em>glibness</em><br /><strong>2</strong>: <em>blasphemy</em><br
        /><strong>3</strong>: <em>power word kill</em></p><h2>For Followers of
        Ruzel</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
