      content: >-
        <h1>Minderhal</h1><h2>He Who Makes and
        Unmakes</h2>@Source[PZO9093;pages=70] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Minderhal">Minderhal</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Giant Deities<br /><strong>Areas of
        Concern</strong> Creation, justice, giants, strength<br
        /><strong>Domains</strong> Artifice, Earth, Evil, Law, Strength<br
        /><strong>Subdomains</strong> Construct, Devil (Evil), Devil (Law),
        Ferocity, Metal, Petrification*, Resolve, Toil<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Warhammer<br /><strong>Symbol</strong> Anvil on a cave
        floor in front of a triangular background with a moon, a planet, and a
        star, respectively, at the corners<br /><strong>Sacred
        Animal(s)</strong> Cave bear<br /><strong>Sacred Color(s)</strong>
        Brown, gray</p><h3>Obedience</h3><p>Spend an hour working a piece of
        stone into a tool, a vurra, a weapon, or a stone that is destined to be
        engraved as part of Minderhal's holy text using only your hands or a
        tool that uses only your own strength and skill (rather than something
        that requires another person such as a long saw or a machine such as a
        mill). Recite relevant passages from <em>One Hundred Sacred Stones</em>
        while you craft this object. Gain a +1 profane bonus on Strength checks
        and on attack rolls with thrown weapons.</p><h2>Boons - Deific
        Obedience</h2><h3> Evangelist</h3><p>@Source[PZO9093;pages=75]<br
        /><strong>1: Master of Earth (Sp)</strong> <em>expeditious
        excavation</em><sup>APG</sup> 3/day, <em>instrument of
        agony</em><sup>UC</sup> 2/day, or <em>burrow</em><sup>UM</sup> 1/day<br
        /><strong>2: Hands of Justice (Su)</strong> For a number of rounds per
        day equal to your Hit Dice, you can infuse your slams or a melee weapon
        you wield with the power of pure law. Your attacks with these weapons
        gain the <em>axiomatic</em> weapon special ability. Any attacks that
        would damage these weapons first have their damage reduced by 5 before
        you apply DR, hardness, or any resistances. Activating or dismissing
        this ability is a free action, and the rounds need not be consecutive.
        Any weapon affected by this ability returns to normal 1 round after it
        leaves your hands.<br /><strong>3: Maker's Gift (Su)</strong> Once per
        day as a full-round action, you can grant Minderhal's gift of power to a
        willing humanoid creature by touching it. The target gains a +2 profane
        bonus to Strength or a +4 profane bonus on Craft checks relating to
        stone. A creature can have no more than one Maker's gift from an
        evangelist at a time. As long as the gift persists, you can speak
        telepathically with the target across any distance (but this does not
        grant it the ability to reply). The Maker's gift is removed by
        <em>dispel evil or <em>dispel law</em>. You can remove the gift as a
        free action, dealing 1d4 points of Wisdom damage to the target as a
        result. The target cannot attempt a saving throw against this
        effect.</em></p><h3>Exalted</h3><p>@Source[PZO9093;pages=75]<br
        /><strong>1: Will of the Unmaker (Sp)</strong> <em>enlarge person</em>
        3/day, <em>weapon of awe</em><sup>APG</sup> 2/day, <em>marionette
        possession</em><sup>UM</sup> 1/day<br /><strong>2: Hands of Justice
        (Su)</strong> For a number of rounds per day equal to your Hit Dice, you
        can infuse your slams or a melee weapon you wield with the power of pure
        law. Your attacks with these weapons gain the <em>axiomatic</em> weapon
        special ability. Any attacks that would damage these weapons first have
        their damage reduced by 5 before you apply DR, hardness, or any
        resistances. Activating or dismissing this ability is a free action, and
        the rounds need not be consecutive. Any weapon affected by this ability
        returns to normal 1 round after it leaves your hands.<br /><strong>3:
        Rocky Flesh (Sp)</strong> You gain a profane bonus equal to your
        Charisma modifier on your Fortitude saving throws and to your natural
        armor bonus.</em></p><h3><em>compel hostility<sup>UC</sup> 3/day,
        <em>bull's strength 2/day, <em>haste</em> 1/day<br /><strong>2:
        Rewarding Smash (Su)</strong> Whenever you confirm a critical hit with a
        melee attack, you heal a number of hit points equal to your Hit Dice or
        the target's Hit Dice, whichever is less.<br /><strong>3: Avalanche of
        Might (Su)</strong> As a swift action, you can increase your physical
        might. You gain a +1 profane bonus on melee attack rolls, melee weapon
        damage rolls, Strength checks, and Strength-based skill checks, as well
        as DR 1/- until the end of your next turn. You can use this ability a
        number of rounds per day equal to your Hit Dice; these rounds need not
        be consecutive. If you use this ability on consecutive rounds, the
        duration resets; the bonuses from consecutive uses
        stack.</em></h3><h2>For Followers of Minderhal</h2><h3>Magic Items -
        Wondrous Items</h3><p><em>Vurra of the
        Maker</em></p><h3>Monsters</h3><p><em>Great Elder Iuu
        (Herald)</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9093;pages=74]</em><br
        /><h3>Cleric/Warpriest</h3></em><p><em>Repel Metal or Stone</em> can be
        prepared as a 8th-level spell<br /><em>Spike Growth can be prepared as a
        3rd-level spell<br /><em>Stone Tell</em> can be prepared as a 6th-level
        spell<br /><em>Gravel Vortex</em> can be prepared as a 4th-level
        spell</em></p><h2>Unique Summon Rules</h2>@Source[PZO9093;pages=75]<br
        /><strong>Summon Monster VII</strong>: Stone Giant (fiendish or
        resolute)
