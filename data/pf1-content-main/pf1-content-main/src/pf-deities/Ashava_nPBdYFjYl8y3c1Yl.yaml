    text:
      content: >-
        <h1>Ashava</h1><h2>True Spark</h2>@Source[PZO9267;pages=322] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Ashava">Ashava</a><h3>Details</h3><p><strong>Alignment</strong>
        CG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Dancers, lonely spirits, moonlight<br
        /><strong>Domains</strong> Chaos, Darkness, Good, Repose<br
        /><strong>Subdomains</strong> Ancestors, Azata (Chaos), Azata (Good),
        Moon, Revelry<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Bladed scarf<br
        /><strong>Symbol</strong> Dancing woman and moon<br /><strong>Sacred
        Animal(s)</strong> Wolf<br /><strong>Sacred Color(s)</strong> Midnight
        blue, silver</p><h3>Obedience</h3><p>Dance in an isolated place under
        the light of the moon. If no moonlight is available or if someone
        witnesses your dance, pray for the spirits of the lonely dead and then
        leave a lighted lantern in a dark area. Gain a +4 sacred bonus on saving
        throws against spells and effects cast by undead.</p><h2>Boons -
        Celestial Obedience</h2><h3>Mystery
        Cultist</h3><p>@Source[PZO9255;pages=8]<br /><strong>1: Lunar Dancer
        (Sp)</strong> <em>faerie fire</em> 3/day, <em>cat's grace </em>2/day, or
        <em>daylight</em> 1/day (visible effect is moonlight)<br /><strong>2:
        Moonlight (Sp)</strong> You can cast an enlarged <em>sunbeam </em>once
        per day. The visible effect is a beam of brilliant silver moonlight, but
        the spell's effects are unchanged.<br /><strong>3: Compelling Dance
        (Sp)</strong> You can cast <em>irresistible dance </em>once per day. If
        you cast this spell-like ability on a willing creature, the target is
        affected normally by the spell but also gains a +4 sacred bonus on
        Dexterity checks, Dexterity-based skill checks, and Reflex saves for 24
        hours after the effect's initial duration ends.</em></p><h2>Boons -
        Deific Obedience</h2><h3>
        Evangelist</h3><p>@Source[PZO90134;pages=73]<br /><strong>1: Celestial
        Guide (Sp)</strong> <em>bless</em> 3/day, <em>augury</em> 2/day, or
        <em>guiding star</em> 1/day<br /><strong>2: Touch of Freedom
        (Su)</strong> As a standard action, you can touch an ally to grant it
        the benefits of the <em>freedom of movement</em> spell until the
        beginning of your next turn. While under this effect, the target gains a
        +10-foot enhancement bonus to her base speed when taking the withdraw
        action and can, as an immediate action when she fails a saving throw
        against a charm or compulsion effect, reroll that saving throw. You can
        use this ability a number of times per day equal to 3 + your Wisdom
        modifier.<br /><strong>3: Navigator Wisp (Sp)</strong> Once per day, you
        can cast an extended <em>find the path</em> on yourself with a caster
        level equal to your character level. The effect of the spell manifests
        as a mote of light that is visible to only you. If the route would take
        you through dangerous territory (such as a river with a very strong
        current or a hidden pit of acid), the wisp glows yellow. If the route
        would take you past hidden creatures, the wisp flashes red, giving you a
        +10 circumstance bonus on Perception checks to notice
        them.</em></p><h3>Exalted</h3><p>@Source[PZO90134;pages=73]<br
        /><strong>1: Moonlight Caller (Sp)</strong> <em>faerie fire</em> 3/day,
        <em>glitterdust</em> 2/day, or <em>daylight</em> 1/day (visible effect
        is moonlight)<br /><strong>2: Lunar Frenzy (Sp)</strong> Three times per
        day, you can cast <em>moonstruck</em> with a caster level equal to your
        character level. You can choose to have the target affected by <em>haste
        rather than <em>confusion</em>; you make this choice each time you use
        this ability.<br /><strong>3: Moon's Blessing (Sp)</strong> Once per
        day, you can cast <em>divine vessel</em> with a caster level equal to
        your character level. You can choose only the celestial aspect, and you
        take on the form of a large, winged wolf made of glowing moonlight.
        Instead of 2 slam attacks, you gain a bite attack dealing 2d6 points of
        damage.</em></p><h3>Sentinel</h3><p>@Source[PZO90134;pages=73]<br
        /><strong>1: Gravekeeper (Sp)</strong> <em>hide from undead</em> 3/day,
        <em>calm spirit</em> 2/day, or <em>searing light</em> 1/day (the visible
        effect of the spell is a ray of moonlight)<br /><strong>2: Choreography
        of the Night (Su)</strong> When the night sky is visible to you, you
        gain +4 sacred bonus on initiative checks, a +2 sacred bonus on
        Acrobatics and Escape Artist checks, and a +1 dodge bonus to Armor Class
        and on Reflex saving throws. In addition, you can take 5-foot steps in
        difficult terrain. Finally, you gain uncanny dodge (as the rogue class
        feature). If you already have uncanny dodge, you gain improved uncanny
        dodge instead. If you already have improved uncanny dodge, the minimum
        rogue level required to flank you increases by 1 instead.<br
        /><strong>3: The Dance in All Things (Sp)</strong> Once per day, you can
        cast <em>animate objects</em> with a caster level equal to your
        character level. Objects you animate with this ability gain the benefits
        of a <em>haste</em> spell for as long as they are animated, and their
        natural attacks count as good and silver for the purpose of overcoming
        damage reduction.</em></p><h2>For Followers of
        Ashava</h2><h3>Feats</h3><p><em>Ghost Whisperer, Heroic
        Interposition</em></p><h3>Magic Items - Weapons</h3><p><em>Channeler's
        Scarf</em></p><h3>Prestige Classes</h3><p><em>Ashavic
        Dancer</em></p><h3>Spells</h3><p><em>Alluring Light, Moonrise
        Arrow</em></p><h3>Traits</h3><p><em>Empyreal Focus</em></p><h2>Unique
        Spell Rules</h2><em>@Source[PZO90134;pages=72]</em><br
        /><h3>Cleric/Warpriest</h3><p><em>Dancing Lights</em> can be prepared as
        a 0-level spell<br /><em>Flare Burst can be prepared as a</em> 1st-level
        spell<br /><em>Wandering Star Motes</em> can be prepared as a 4th-level
        spell<br /></em></p><h2>Unique Summon
        Rules</h2>@Source[PZO90134;pages=73]<br /><strong>Summon Monster
        IV</strong>: Celestial Pegesus<br /><strong>Summon Monster V</strong>:
        Lunar Naga
