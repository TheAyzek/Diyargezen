      content: >-
        <h1>Gyronna</h1><h2>The Angry Hag</h2>@Source[PZO9290;pages=53] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Gyronna">Gyronna</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Other Deities<br /><strong>Areas of
        Concern</strong> Extortion, hatred, spite<br /><strong>Domains</strong>
        Chaos, Destruction, Evil, Madness<br /><strong>Subdomains</strong>
        Corruption, Demon (Chaos), Demon (Evil), Hatred, Insanity, Nightmare,
        Rage<br /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Dagger<br /><strong>Symbol</strong>
        Bloodshot eye<br /><strong>Sacred Animal(s)</strong> Black cat<br
        /><strong>Sacred Color(s)</strong> Pink,
        white</p><h3>Obedience</h3><p>Spend at least 30 minutes working to make
        another sentient creature's life measurably worse or more miserable,
        whether by destroying its property, sabotaging its efforts, or
        afflicting it magically. Your victim must survive this encounter, but
        your actions can indirectly lead to its death, such as tainting a
        plague-ridden man's medicine or stealing the money a woman would use to
        pay back a loan. You must make your victim aware of your involvement,
        and always name some price or task your victim can perform to assuage
        your bitter heart and gain recompense for the damage you have inflicted,
        though this price does not need to be reasonable. You gain a +4 profane
        bonus on Intimidate checks.</p><h3>On Golarion</h3><p><strong>Centers of
        Worship</strong> River Kingdoms<br /><strong>Nationality</strong>
        Kellid</p><h2>Boons - Deific
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO9290;pages=53]<br
        /><strong>1: Dread Gifts (Sp)</strong> <em>fumbletongue<sup>UM</sup>
        3/day, <em>disfiguring touch<sup>UM</sup> 2/day, or <em>eruptive
        pustules</em><sup>UM</sup> 1/day<br /><strong>2: Rot Their Minds
        (Su)</strong> Your spewed curses and venomous retorts take on a
        malevolent timbre, and your enemies' minds bend before the potency of
        your ire. Once per day, you can cast <em>feeblemind, as per the spell,
        except <em>remove curse</em> can remove this effect, as can
        <em>heal</em>, <em>limited wish</em>, <em>miracle</em>, and
        <em>wish</em>. If the target fails its Will saving throw against this
        effect, it recognizes you as its afflictor. After this effect ends, if
        you are within 30 feet of the target, it is shaken for a number of
        rounds equal to your Hit Dice or until you move more than 30 feet away
        from it (whichever comes first). This is a curse effect.<br /><strong>3:
        Mother of Curses (Su)</strong> The rage within your heart shields you
        against harm and turns it back on others. You gain an amount of spell
        resistance equal to 11 + your Hit Dice, but only against necromancy and
        transmutation spells, as well as enchantment spells of the charm
        subschool. Once per day, when a spell fails to penetrate your spell
        resistance, you can reflect it back on its caster, as if using <em>spell
        turning</em>.</em></p><h3>Exalted</h3><p>@Source[PZO9290;pages=53]<br
        /><strong>1: Alone Among Many (Sp)</strong> <em>youthful
        appearance</em><sup>UM</sup> 3/day, <em>undetectable alignment</em>
        2/day, or <em>nondetection</em> 1/day<br /><strong>2: Come by Night
        (Ex)</strong> Night is when others are vulnerable and trusting, and few
        can pierce the darkness to see your handiwork. You gain darkvision 30
        feet and are immune to any magical <em>sleep effects (this functions
        identically to an elf's immunity to magical <em>sleep</em> effects).<br
        /><strong>3: Curdled Trust (Su)</strong> You can sow the seeds of
        distrust in a group and assign the blame for your actions to another.
        Once per day, upon committing an evil act or casting a spell in front of
        witnesses, as a free action you can enchant all onlookers to believe
        another person known to them committed that act. If you know a
        creature's full name, you can name it specifically as the culprit.
        Otherwise, each onlooker sees a random friend or family member
        committing your actions. Onlookers who succeed at a Will saving throw
        (DC = 10 + 1/2 your Hit Dice + your Wisdom modifier) are not fooled,
        though they might still be fooled by concealing clothing or mundane
        disguises you may be wearing. This is a mind-affecting enchantment
        effect.</em></p><h3>Sentinel</h3><p>@Source[PZO9290;pages=53]<br
        /><strong>1: Malice (Sp)</strong> <em>ray of sickening<sup>UM</sup>
        3/day, <em>blindness/deafness</em> 2/day, or <em>excruciating
        deformation</em><sup>UM</sup> 1/day<br /><strong>2: Cloak of Curses
        (Su)</strong> You surround yourself in a shroud of whispered secrets and
        spiteful swearing, distorting the world around you and repelling others
        with the bitterness in your heart. Once per day, you can activate your
        cloak of curses as a standard action, and maintain it for up to 1 minute
        per Hit Die you possess. While the cloak is active, creatures of the
        animal and vermin type will not approach within 5 feet of you and move
        away if you approach them. Attacks from all other creatures suffer a 20%
        miss chance. This miss chance increases to 30% if the attacking creature
        is lawful or good (this miss chance does not stack). Creatures that
        succeed at a Will saving throw (DC = 10 + 1/2 your Hit Dice + your
        Charisma modifier) are not affected by your cloak of curses.<br
        /><strong>3: Never Suffer Alone (Ex)</strong> Misery is a gift you have
        received far too much of, and you have learned to reflect it onto
        others. Three times per day, when an opponent successfully deals hit
        point damage to you, you can immediately make an attack of opportunity
        against the creature that damaged you, even if you could not normally
        make an attack of opportunity. You can attack normally with this attack
        of opportunity or target the triggering creature with one of the spells
        granted by the malice boon above (though doing so provokes an attack of
        opportunity if an opponent is in melee with you). You can use this
        ability only once per round.</em></p><h2><em>For Followers of
        Gyronna</em></h2><h3>Feats</h3><p><em>Channel Hate</em></p><h3>Magic
        Items - Wondrous Items</h3><p><em>Hag's
        Shabble</em></p><h3>Traits</h3><p><em>Vindictive Strike,
        Wronged</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9290;pages=56]<em></em><br
        /><h3>Cleric/Warpriest</h3><p><em>Eyebite</em> can be prepared as a
        6th-level spell</p>
