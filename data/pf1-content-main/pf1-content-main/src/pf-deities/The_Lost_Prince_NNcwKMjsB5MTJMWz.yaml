        <h1>The Lost Prince</h1><h2>The Melancholy
        Lord</h2>@Source[PZO9298;pages=26] <br /><strong>Pathfinder
        Wiki</strong> <a href="http://www.pathfinderwiki.com/wiki/The Lost
        Prince">The Lost Prince</a><h3>Details</h3><p><strong>Alignment</strong>
        N<br /><strong>Pantheon</strong> Eldest<br /><strong>Areas of
        Concern</strong> Forgotten things, sadness, solitude<br
        /><strong>Domains</strong> Knowledge, Madness, Nobility, Repose<br
        /><strong>Subdomains</strong> Ancestors, Insanity, Martyr, Memory<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Quarterstaff<br
        /><strong>Symbol</strong> Crumbling black stone tower<br
        /><strong>Sacred Animal(s)</strong> Raven<br /><strong>Sacred
        Color(s)</strong> Black, gray</p><h3>Obedience</h3><p>Write down a
        memory on a piece of paper and then burn it. This must be a memory
        you've never used for this purpose or told anyone about. You gain a +4
        sacred bonus to AC and CMD against attacks of opportunity provoked by
        moving out of a threatened space.</p><h2>Boons - Fey
        Obedience</h2><h3>Feysworn</h3><p>@Source[PZO9298;pages=26]<br
        /><strong>1: Knowledge of the Lost (Sp)</strong> <em>identify</em>
        3/day, <em>locate object</em> 2/day, or <em>crushing despair</em>
        1/day<br /><strong>2: Forgetfulness (Sp)</strong> Three times per day as
        a standard action, you can alter a creature's memories as per <em>modify
        memory</em>, except that doing so takes only a standard action
        regardless of how much time is edited. By expending two uses of this
        ability at once, you can modify up to 1 hour of the creature's memory;
        by expending all three uses at once, you can modify up to 1 day.<br
        /><strong>3: Absolute Solitude (Sp)</strong> Once per day, you can cast
        <em>imprisonment</em>.</em></p><h2>For Followers of The Lost
        Prince</h2><h3>Archetypes</h3><p><em>Hermit
        (Oracle)</em></p><h3>Feats</h3><p><em>Fey
        Friend</em></p><h3>Traits</h3><p><em>Shaper of Reality</em></p>
