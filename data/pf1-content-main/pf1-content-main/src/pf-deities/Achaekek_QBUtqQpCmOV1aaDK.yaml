      content: >-
        <h1>Achaekek</h1><h2>He Who Walks in Blood</h2>@Source[PZO9290;pages=5]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Achaekek">Achaekek</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Other Deities<br /><strong>Areas of
        Concern</strong> Assassinations, divine punishment, the red mantis<br
        /><strong>Domains</strong> Death, Evil, Law, Trickery, War<br
        /><strong>Subdomains</strong> Blood, Deception, Devil (Evil), Devil
        (Law), Insect*, Murder, Tactics, Thievery<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Sawtooth sabre<br /><strong>Symbol</strong> Crossed
        mantis claws<br /><strong>Sacred Animal(s)</strong> Crimson mantis<br
        /><strong>Sacred Color(s)</strong> Red</p><h3>Obedience</h3><p>Meditate
        in a private place before a trophy or broken religious symbol taken from
        a target you have been contracted to kill. This trophy must be anointed
        with a single drop of your blood, drawn from your flesh by a sawtooth
        sabre, and the trophy must be destroyed at the end of your meditation.
        If you have yet to complete a contract, have no appropriate trophies at
        hand, or seek to serve the Mantis God in other ways than as the god's
        assassin, you must instead offer your own vital fluid to He Who Walks in
        Blood by cutting yourself along the right arm with a sawtooth sabre.
        Such self-mutilation deals 1d6 points of damage to you, which cannot be
        healed during the hour of meditation without disrupting the obedience;
        after the meditation ends, the wounds can be healed by any means
        available. You gain a +2 profane bonus to confirm critical hits while
        wielding a sawtooth sabre. As long as you have a sawtooth sabre in each
        hand, you can use those blades to complete the somatic component of any
        spell you cast, and you treat sawtooth sabres as your divine focus for
        the casting of divine spells.</p><h3>On Golarion</h3><p><strong>Centers
        of Worship</strong> Ilizmagorti<br /><strong>Nationality</strong>
        monster</p><h2>Boons - Deific
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO9290;pages=5]<br
        /><strong>1: Blessing of the Mantis (Sp)</strong> <em>disguise self</em>
        3/day, <em>invisibility</em> 2/day, or <em>gaseous form</em> 1/day<br
        /><strong>2: Walk Unseen (Su)</strong> He Who Walks in Blood cloaks your
        steps, ensuring that you can move clandestinely during your hunts. You
        are constantly under the effects of a <em>pass without trace</em> spell,
        unless you wish to be followed. You also gain a +2 profane bonus on
        Stealth checks.<br /><strong>3: Second Face (Su)</strong> Your deadly
        equipment is sacred to you. As long as you carry a <em>mask of the
        mantis (<em>Pathfinder Campaign Setting: The Inner Sea World Guide 298)
        on your person (even if you do so by carrying it in an extradimensional
        space), you can instantly don it as a free action or as part of an
        attack of opportunity. While you wear a <em>mask of the mantis</em>, you
        can attempt to demoralize a creature within 30 feet using Intimidate as
        a swift action. You no longer need to expend charges from a <em>mask of
        the mantis</em> to gain the effect of <em>deathwatch</em>, although you
        must expend charges as normal to use the mask's other
        effects.</em></p><h3>Exalted</h3><p>@Source[PZO9290;pages=5]<br
        /><strong>1: Crimson Decree (Sp)</strong> <em>doom</em> 3/day, <em>death
        knell</em> 2/day, or <em>blood biography</em><sup>APG</sup> 1/day<br
        /><strong>2: Blood Scent (Sp)</strong> To your heightened olfactory
        senses, the acrid scent of blood is as pleasing and distinctive as the
        sweetest perfume. Three times per day, you can cast <em>blood scent
        (<em>Pathfinder RPG Advanced Race Guide</em> 143) on yourself as a
        spell-like ability. This ability does not grant the spell's bonus on
        attack and damage rolls, even if you are an orc or have a rage
        ability.<br /><strong>3: Focused Assassin (Su)</strong> Your combat
        skills are just as deadly when you have an assassination target as when
        you don't. When you perform your obedience for the day, if you are not
        contracted to kill a target, you can name a single target. You need not
        know the exact name of your target, but you must know a suitably
        detailed and correct description, such as 'the thieves' guild's second
        in command.' Against that target, you gain a +2 profane bonus on attack
        rolls and weapon damage rolls, and you deal an additional 2d6 points of
        damage. The save DCs of any spells you cast on the target increase by 2.
        If you are contracted to kill a target, these bonuses apply against that
        target; if you are contracted to kill multiple targets, you must choose
        one target against whom these bonuses apply when you perform your
        obedience.</em></p><h3>Sentinel</h3><p>@Source[PZO9290;pages=5]<br
        /><strong>1: Blood Must Flow (Sp)</strong> <em>lead
        blades</em><sup>APG</sup> 3/day, <em>spiritual weapon</em> 2/day, or
        <em>keen edge</em> 1/day<br /><strong>2: Bleeding Wounds (Ex)</strong>
        All wounds you inflict with a sawtooth sabre are bleeding wounds, and
        deal 1d4 points of bleed damage to the target. If you deal bleed damage
        via another source (such as the bleeding attack rogue talent or by using
        a <em>wounding sawtooth sabre), this ability does not deal additional
        bleed damage. You can also use <em>bleed</em> as a quickened spell-like
        ability three times per day.<br /><strong>3: Mantis Style Mastery
        (Ex)</strong> You take no penalties on attack rolls from two-weapon
        fighting when wielding two sawtooth sabres simultaneously, and you gain
        a +2 profane bonus on all damage rolls with sawtooth sabres. If you deal
        sneak attack damage with a sawtooth sabre, you deal 2 additional points
        of damage for each die rolled as part of your sneak attack damage. If
        you have levels in the Red Mantis assassin prestige class (<em>The Inner
        Sea World Guide</em> 282), the DC for the save against your prayer
        attack increases by 2.</em></p><h2>For Followers of
        Achaekek</h2><h3>Archetypes</h3><p><em>Crimson Chymist (Alchemist),
        Mantis Zealot (Warpriest)</em></p><h3>Feats</h3><p><em>Bloody
        Sabres</em></p><h3>Magic Items - Armor</h3><p><em>Red Stalker
        Armor</em></p><h3>Magic Items - Weapons</h3><p><em>Crimson Bluff, Fuming
        Blood Sabre</em></p><h3>Magic Items - Wondrous Items</h3><p><em>Eye of
        the Mantis, Mantis Embrace, Mask of the
        Mantis</em></p><h3>Monsters</h3><p><em>Kaicharek</em></p><h3>Prestige
        Classes</h3><p><em>Death Slayer, Red Mantis
        Assassin</em></p><h3>Traits</h3><p><em>Deep Wounding, Frightening
        Speed</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9267;pages=175]</em><br
        /><h3>Cleric/Warpriest</h3><p><em>Keen Senses can be prepared as a
        1st-level spell<br /><em>Negate Aroma can be prepared as a</em>
        1st-level spell<br /><em>Spider Climb can be prepared as a</em>
        2nd-level spell<br /></em></p><h3>Druid</h3><p><em>Murderous
        Command</em> can be prepared as a 1st-level
        spell</em></p><p><em>@Source[PZO9290;pages=7]</em><br
        /></em></p><h3>Cleric/Warpriest</h3><p><em>Keen Senses</em> can be
        prepared as a 1st-level spell<br /><em>Negate Aroma can be prepared as a
        1st-level spell<br /><em>Spider Climb</em> can be prepared as a
        2nd-level spell<br /></em></p><h3>Druid</h3><p><em>Murderous
        Command</em> can be prepared as a 1st-level spell</em></p>
