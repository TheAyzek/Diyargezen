        <h1>Atropos</h1><h2>The Last Sister</h2>@Source[PZO92114;pages=6] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Atropos">Atropos</a><h3>Details</h3><p><strong>Alignment</strong>
        N<br /><strong>Pantheon</strong> Psychopomp Usher<br /><strong>Areas of
        Concern</strong> Fate, sleep, and youth<br /><strong>Domains</strong>
        Darkness, Death, Luck, Repose<br /><strong>Subdomains</strong> N/A<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Dagger<br /><strong>Symbol</strong>
        Six overlapping lines arranged in a
        hexagon</p><h3>Obedience</h3><p>Assemble a careful list of each activity
        you will undertake in the day to come and keep a careful accounting of
        what you fail to accomplish and why. As part of this, select three
        different specific checks you expect to perform that day, such as 'a
        Perception check to find a hidden passage,' 'a Reflex save to dodge a
        fireball' or 'a Heal check to treat a disease.' Once during that day,
        you can gain a +4 insight bonus on one of these three specified
        checks.</p><h2>Boons - Monitor
        Obedience</h2><h3>None</h3><p>@Source[PZO92114;pages=6]<br /><strong>1:
        Fruitful Dreams (Sp)</strong> <em>sleep</em> 3/day, <em>augury</em>
        2/day, or <em>catatonia</em> 1/day<br /><strong>2: Childlike Grace
        (Su)</strong> Once per day as a full-round action, you can revert to a
        childlike form, which grants you fresh insight and new perspective. This
        functions as a reduce person spell with a range of personal and a
        duration of 1 hour per Hit Die. In this form, you gain a +2 insight
        bonus on Perception and Sense Motive checks and Will saving throws, but
        you take a -2 penalty on Intelligence-based skill checks and Fortitude
        saving throws.<br /><strong>3: Insight into Fate (Sp)</strong> You can
        cast <em>moment of prescience</em> 1/day.</em></p><h2>For Followers of
        Atropos</h2><h3>Prestige Classes</h3><p><em>Mortal Usher</em></p>
