      content: >-
        <h1>Ketephys</h1><h2>The Hunter</h2>@Source[PZO9267;pages=322] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Ketephys">Ketephys</a><h3>Details</h3><p><strong>Alignment</strong>
        CG<br /><strong>Pantheon</strong> Elven Deities<br /><strong>Areas of
        Concern</strong> Forestry, hunting, the moon<br
        /><strong>Domains</strong> Animal, Chaos, Good, Plant, Weather<br
        /><strong>Subdomains</strong> Azata (Chaos), Azata (Good), Feather, Fur,
        Growth, Moon, Seasons<br /><em>* Requires the <u>Acolyte of
        Apocrypha</u> trait.</em><br /><strong>Favored Weapon</strong> Bow<br
        /><strong>Symbol</strong> Hawk with moon and sun<br /><strong>Sacred
        Animal(s)</strong> Hawk<br /><strong>Sacred Color(s)</strong> Gold,
        silver</p><h3>Obedience</h3><p>Go into the woods sometime between dusk
        and dawn. Find a set of animal prints, and track the creature down. When
        you find the creature, do not kill it, but instead kneel down near it
        and thank it for being part of the forest. Leave an appropriate food
        offering for this creature, and go without waking it up if it is
        sleeping or frightening it if it is awake. If it accepts your offering,
        once you have left or it awakens, you gain a +2 sacred bonus on Handle
        Animal and wild empathy checks. You can also attempt Handle Animal
        checks untrained, even if the task would normally require that you be
        trained. If there are no woods nearby, you can track an animal through a
        different kind of natural terrain instead. If you cannot access natural
        terrain of any kind, you cannot perform this obedience.</p><h3>On
        Golarion</h3><p><strong>Centers of Worship</strong> Kyonin, Sovyrian<br
        /><strong>Nationality</strong> Elf</p><h2>Boons - Deific
        Obedience</h2><h3> Evangelist</h3><p>@Source[PZO92112;pages=35]<br
        /><strong>1: Woods-walker (Sp)</strong> <em>feather step</em> 3/day,
        <em>chameleon stride</em> 2/day, or <em>burst of speed</em> 1/day<br
        /><strong>2: Moonlight Vision (Ex)</strong> You hunt at night, during
        Ketephys's hour, and your experiences have heightened your perception in
        poor lighting conditions. You gain low-light vision. If you already have
        low-light vision, you instead gain darkvision with a range of 60 feet.
        You also gain a +4 sacred bonus on Perception checks at night.<br
        /><strong>3: Verdant Camouflage (Ex)</strong> You know how to disappear
        as well as the Hunter himself does. You can use the Stealth skill even
        when being observed, as per the ranger's hide in plain sight ability,
        and whenever you are moving at half speed or slower, you have
        concealment from enemies. You gain a +4 sacred bonus on Stealth checks
        while in the
        forest.</em></p><h3>Exalted</h3><p>@Source[PZO92112;pages=35]<br
        /><strong>1: Nature's Remedy (Sp)</strong> <em>goodberry</em> 3/day,
        <em>resist energy</em> 2/day, or <em>remove disease</em> 1/day<br
        /><strong>2: Beckon Creatures (Su)</strong> Your connection to the
        animals of the forest is deep, and they come running when they hear your
        call as quickly as they would come to help Ketephys. You gain wild
        empathy as per a druid of your character level. Once per day as a
        standard action, you can let out a cry and all animals within 200 feet
        immediately come to you as quickly as possible. They will not take
        unnecessarily dangerous risks to reach you, such as leaping over wide
        streams. This is a magical call, and animals respond even if unable to
        hear the call due to environmental conditions or deafness. For a number
        of minutes equal to your exalted level, you can communicate with these
        animals as if you had cast <em>speak with animals</em>. They are
        automatically friendly to you but are not obligated to do what you
        ask.<br /><strong>3: Heal Poison (Ex)</strong> You have studied the
        venoms and poisons of the natural world enough to avoid their effects
        and help your allies. You gain immunity to poison. As a standard action
        when an ally is poisoned, you can attempt a Heal check to study the
        poison. If the result of your check exceeds the DC of the poison by 5,
        you immediately neutralize the poison and reverse the instantaneous or
        permanent effects caused by the poison, such as ability damage. You do
        not heal hit point damage or ability damage or drain caused by any other
        effects, and you must attempt a separate check for each poison affecting
        your ally. You must be adjacent to your ally to use this ability. If you
        fail, you cannot use this ability for either that ally or that poison
        for 1
        week.</em></p><h3>Sentinel</h3><p><em>@Source[PZO92112;pages=35]<em></em><br
        /><strong>1: Nature's Offense (Sp)</strong> <em>entangle</em> 3/day,
        <em>gust of wind</em> 2/day, or <em>earth tremor</em> 1/day<br
        /><strong>2: Forest's Ward (Su)</strong> You are a sacred guardian of
        the forest, protecting the wilderness as Ketephys does, and the forest
        protects you in turn. Whenever you are in the forest, you gain a +2
        sacred bonus to AC. No matter what terrain you are in, creatures of the
        animal type must succeed at a Will save (DC = 10 + your Hit Dice) or be
        unable to attack you unless you harm them first.<br /><strong>3:
        Hunter's Shot (Ex)</strong> You have practiced Ketephys's art of archery
        for so long that you can ignore effects that would ruin shots for lesser
        archers-some say your aim is as good as that of the Hunter himself. You
        ignore cover or concealment from plants, though trees large enough to
        completely block your vision still provide total cover to the target.
        You also take no penalties on your ranged attacks due to the effects of
        wind, and you ignore any miss chance caused by mundane or magical winds.
        This ability functions no matter what terrain you are
        in.</em></p><h2>For Followers of
        Ketephys</h2><h3>Traits</h3><p><em>Favored Prey</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO92112;pages=37]</em><br
        /><h3>Cleric/Warpriest</h3><p><em>Arcane Mark</em> can be prepared as a
        0-level spell<br /><em>Charm Animal can be prepared as a</em> 1st-level
        spell<br /><em>Animal Aspect</em> can be prepared as a 2nd-level
        spell<br /><em>Hold Animals can be prepared as a</em> 2nd-level spell<br
        /><em>Aspect of the Stag</em> can be prepared as a 4th-level
        spell</em></p>
