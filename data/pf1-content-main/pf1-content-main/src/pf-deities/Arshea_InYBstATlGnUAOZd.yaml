        <h1>Arshea</h1><h2>Spirit of Abandon</h2>@Source[PZO9267;pages=322] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Arshea">Arshea</a><h3>Details</h3><p><strong>Alignment</strong>
        NG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Freedom, physical beauty, sexuality<br
        /><strong>Domains</strong> Charm, Good, Liberation, Strength<br
        /><strong>Subdomains</strong> Agathion, Freedom, Love, Lust,
        Self-Realization (Liberation)*, Self-Realization (Strength)*<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Flail<br /><strong>Symbol</strong>
        Figure with colorful sashes<br /><strong>Sacred Animal(s)</strong>
        Swan<br /><strong>Sacred Color(s)</strong> Purple,
        white</p><h3>Obedience</h3><p>Achieve sexual release by yourself or with
        one or more partners. Praise the most beautiful aspects of yourself and
        any partners aloud, and offer a prayer to Arshea while still naked. Gain
        a +4 sacred bonus on Charisma checks and Charisma-based skill checks
        when interacting with an intelligent creature who could be sexually
        attracted to you.</p><h2>Boons - Celestial Obedience</h2><h3>Mystery
        Cultist</h3><p>@Source[PZO9255;pages=7]<br /><strong>1: Arshea's Charmer
        (Sp)</strong> <em>disguise self</em> 3/day, <em>mirror image</em> 2/day,
        or <em>charm monster</em> 1/day<br /><strong>2: Flawless Form
        (Su)</strong> Gain an armor bonus equal to your Charisma modifier
        (minimum +1) whenever you wear revealing clothing and no armor.<br
        /><strong>3: Liberation (Sp)</strong> You can cast <em>freedom </em>once
        per day.</em></p><h2>For Followers of
        Arshea</h2><h3>Feats</h3><p><em>Heroic
        Interposition</em></p><h3>Traits</h3><p><em>Empyreal Focus</em></p>
