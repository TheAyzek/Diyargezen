        <h1>Gavidya</h1><h2>The Numberless</h2>@Source[PZO1139;pages=110] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Gavidya">Gavidya</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Asura Ranas<br /><strong>Areas of
        Concern</strong> Corruption, indoctrination, lies<br
        /><strong>Domains</strong> Community, Evil, Law, Trickery<br
        /><strong>Subdomains</strong> Deception, Family, Slavery, Thievery<br
        /><em>* Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Sap</p><h3>Obedience</h3><p>Count the
        bearings inside a sap, assigning each the name of someone you know and
        intend to indoctrinate or deceive. Gain a +4 profane bonus on Bluff
        checks to tell lies and on saving throws against divination
        effects.</p><h2>Boons - Asura Ranas</h2>@Source[PZO1139;pages=110]<br
        />Over time, the mightiest of the asuras complete enough cycles of
        reincarnation and build upon the atrocities committed over multiple
        lives to incarnate into the most powerful of their kind: the asura
        ranas.<p> Asura ranas are lawful evil demigods that range in power from
        CR 26 to CR 30. Each asura rana detailed below is given an obedience,
        but the boons they grant are less complex than those granted by
        archdevils, manifesting as spell-like abilities usable once per day
        each.</p><p><strong>1</strong>: <em>glibness</em><br
        /><strong>2</strong>: <em>create greater mindscape</em><br
        /><strong>3</strong>: <em>microcosm</em></p>
