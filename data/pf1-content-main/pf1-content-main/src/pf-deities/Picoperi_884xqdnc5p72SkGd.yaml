    text:
      content: >-
        <h1> Picoperi</h1><h2>Merrygleam</h2>@Source[PZO9267;pages=322] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Picoperi">Picoperi</a><h3>Details</h3><p><strong>Alignment</strong>
        CG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Jokes, pranks, surprises<br /><strong>Domains</strong>
        Chaos, Charm, Good, Trickery<br /><strong>Subdomains</strong> Azata
        (Chaos), Azata (Good), Deception, Revelry, Whimsy<br /><em>* Requires
        the <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Blowgun<br /><strong>Symbol</strong> Snake on a tree
        branch<br /><strong>Sacred Animal(s)</strong> Tree snake<br
        /><strong>Sacred Color(s)</strong> Brown,
        green</p><h3>Obedience</h3><p>Play a practical joke on an unsuspecting
        target. If no suitable targets are nearby, write down an original joke
        and leave it tucked in a place where someone may someday find it. Gain a
        +4 sacred bonus to AC during surprise rounds, regardless of whether or
        not you participate in the surprise round.</p><h2>Boons - Celestial
        Obedience</h2><h3>Mystery Cultist</h3><p>@Source[PZO9255;pages=20]<br
        /><strong>1: Prankster (Sp)</strong> <em>lesser confusion</em> 3/day,
        <em>invisibility</em> 2/day, or <em>suggestion</em> 1/day<br
        /><strong>2: Clever Ruse (Sp)</strong> You can cast enlarged <em>mislead
        </em>three times per day. This ability is the equivalent of a 7th-level
        spell.<br /><strong>3: Element of Surprise (Su)</strong> Whenever you
        roll initiative, any allies within 30 feet of you who are also rolling
        initiative can choose to use the result of your roll instead of theirs.
        Your allies still add their own modifiers to your roll to calculate
        their initiative order. Alternatively, you may choose to use another
        ally's roll instead of your own.</em></p><h2>For Followers of
        Picoperi</h2><h3>Feats</h3><p><em>Heroic
        Interposition</em></p><h3>Traits</h3><p><em>Empyreal Focus</em></p>
