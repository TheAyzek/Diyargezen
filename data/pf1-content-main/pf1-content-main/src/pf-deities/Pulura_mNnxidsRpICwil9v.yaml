        <h1>Pulura</h1><h2>The Shimmering Maiden</h2>@Source[PZO9267;pages=322]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Pulura">Pulura</a><h3>Details</h3><p><strong>Alignment</strong>
        CG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Constellations, homesickness, northern lights<br
        /><strong>Domains</strong> Air, Chaos, Good, Weather<br
        /><strong>Subdomains</strong> Azata (Chaos), Azata (Good), Cloud,
        Seasons, Stars<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Sling<br
        /><strong>Symbol</strong> Face in northern lights<br /><strong>Sacred
        Animal(s)</strong> Firefly<br /><strong>Sacred Color(s)</strong>
        Midnight blue</p><h3>Obedience</h3><p>Sit on the ground with your head
        tilted back to study the stars. Maintain the position for an hour and
        identify 12 constellations. If you cannot see the stars, draw the
        patterns of 12 constellations on a semi-permanent surface, such as a
        wall or hard floor. The light radius of any light source you hold or
        conjure increases by 10 feet.</p><h2>Boons - Celestial
        Obedience</h2><h3>Mystery Cultist</h3><p>@Source[PZO9255;pages=20]<br
        /><strong>1: Aurora (Sp)</strong> <em>color spray</em> 3/day,
        <em>continual flame</em> 2/day, or <em>guiding star</em><sup>APG</sup>
        1/day<br /><strong>2: Starshot (Su)</strong> Three times per day, you
        can transmute up to 1 sling bullet per HD into a bullet of starlight.
        These bullets function as <em>+2 brilliant energy bullets</em>. Bullets
        of starlight last for 1 minute and shed light in a 10-foot radius.<br
        /><strong>3: Otherworldly Traveler (Sp)</strong> You can cast
        <em>interplanetary teleport</em><sup>APG</sup> once per
        day.</em></p><h2>For Followers of Pulura</h2><h3>Feats</h3><p><em>Heroic
        Interposition</em></p><h3>Prestige
        Classes</h3><p><em>Stargazer</em></p><h3>Traits</h3><p><em>Empyreal
        Focus</em></p>
