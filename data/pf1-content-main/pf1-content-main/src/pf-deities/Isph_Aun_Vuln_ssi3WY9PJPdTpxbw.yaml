      content: >-
        <h1>Isph-Aun-Vuln</h1><h2>The Feaster
        Within</h2>@Source[PZO9267;pages=328] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Isph-Aun-Vuln">Isph-Aun-Vuln</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Qlippoth Lords<br /><strong>Areas of
        Concern</strong> Infestation of the flesh, poisonous wind<br
        /><strong>Domains</strong> Air, Chaos, Evil, Trickery<br
        /><strong>Subdomains</strong> Deception, Fear, Venom, Wind<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Longbow<br /><strong>Symbol</strong>
        Cloudy tentacled rune<br /><strong>Sacred Animal(s)</strong> None<br
        /><strong>Sacred Color(s)</strong> Gray</p><h3>Obedience</h3><p>Consume
        a handful of live parasites or infested flesh. Gain a +4 profane bonus
        on saving throws against disease and parasitic
        infestations.</p><h2>Boons - Qlippoth
        Lords</h2>@Source[PZO1139;pages=128]<br />Qlippoth lords are always
        chaotic evil and range in power from CR 21 to CR 25. It's quite likely
        that more powerful creatures akin to demigods in stature may still exist
        in the deepest parts of the Abyss, but such qlippoth demigods remain
        theoretical for now, and they do not maintain active cults on mortal
        worlds. The boons qlippoth lords grant are less complex than those
        granted by fiendish demigods, manifesting as spell-like abilities usable
        twice per day each.<p><strong>1</strong>: <em>summon swarm</em><br
        /><strong>2</strong>: <em>fleshworm infestation</em><br
        /><strong>3</strong>: <em>plague storm</em></p>
