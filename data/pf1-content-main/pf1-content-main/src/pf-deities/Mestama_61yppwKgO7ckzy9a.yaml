        <h1>Mestama</h1><h2>The Mother of Witches</h2>@Source[PZO9267;pages=320]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Mestama">Mestama</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Cruelty, deception, hags<br /><strong>Domains</strong>
        Chaos, Charm, Evil, Trickery<br /><strong>Subdomains</strong> Deception,
        Demon (Chaos), Demon (Evil), Lust, Thievery<br /><em>* Requires the
        <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Punching dagger<br /><strong>Symbol</strong> Eye on
        three sharp stones<br /><strong>Sacred Animal(s)</strong> Black widow<br
        /><strong>Sacred Color(s)</strong> Black,
        red</p><h3>Obedience</h3><p>Perform an act of cruelty upon a nonbeliever
        of Mestama after spending an hour observing the nonbeliever- preferably
        from a vantage unknown by the vicitm. This act must, at the very least,
        incite the victim to tears or anger. Gain a +4 profane bonus on saves
        against illusions.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=20]<br
        /><strong>1: Witch's Trick (Sp)</strong> <em>disguise self</em> 3/day,
        <em>misdirection</em> 2/day, or <em>bestow curse</em> 1/day<br
        /><strong>2: Elder's Grace (Ex)</strong> You immediately age into the
        next age category, taking all of the appropriate bonuses to mental
        ability scores without any of the penalties to physical ability scores.
        If you are venerable when you achieve the boon, you die and become a
        ghost. Any illusion effect you create gains a +2 profane bonus to the
        save DC.<br /><strong>3: Shriek of the Damned (Sp)</strong> Once per day
        you may use <em>wail of the banshee</em>.</em></p><h2><em>Boons -
        Fiendish
        Obedience</em></h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=76]<br
        /><strong>1: Deceiver (Sp)</strong> <em>silent image</em> 3/day,
        <em>invisibility</em> 2/day, or <em>glibness</em> 1/day<br /><strong>2:
        Covenant of Three (Su or Sp)</strong> You may not be a hag, but you can
        wield hags' power in conjunction with your sisters. You count as a hag
        for the purpose of forming a coven. You can be part of a coven only if
        it has no male members. If you are already a hag (or already count as
        one for the purpose of forming a coven), you can use <em>project
        image</em> once per day as a spell-like ability.<br /><strong>3: Black
        Magic (Su)</strong> The Mother of Witches imbues you with the darkest
        power of witchcraft. You gain a grand hex, chosen from any of those
        available to witches. This hex's DC is equal to 10 + half your level +
        your Intelligence, Wisdom, or Charisma modifier (whichever is highest);
        if you are a witch, you can use your hexes' DC instead. If you are not a
        witch or a hag, you can use this hex only once per
        day.</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=78]<br
        /><strong>1: Witch's Trick (Sp)</strong> <em>disguise self</em> 3/day,
        <em>misdirection</em> 2/day, or <em>bestow curse</em> 1/day<br
        /><strong>2: Elder's Grace (Ex)</strong> You immediately age to the next
        age category, gaining all of the appropriate bonuses to your mental
        ability scores without taking any penalties to your physical ability
        scores. If you are venerable when you achieve this boon, you die and
        become a ghost. Any illusion effect you create gains a +2 profane bonus
        to the save DC. This transformation into a ghost persists even if you
        fail to perform your obedience.<br /><strong>3: Shriek of the Damned
        (Sp)</strong> Once per day, you can cast <em>wail of the banshee</em> as
        a spell-like
        ability.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=78]<br
        /><strong>1: Tormentor's Invocation (Sp)</strong> <em>ill omen </em>
        3/day, <em>blindness/deafness 2/day, or <em>pain strike</em> 1/day<br
        /><strong>2: Widow's Cruelty (Ex or Su)</strong> Mestama grants you a
        form meant to beguile and slay, as well as the power to join a witch
        coven. You count as a hag for the purpose of forming a coven. In
        addition, your nails become razor sharp, granting you two natural claw
        attacks that deal damage appropriate to your size (1d4 for a Medium
        creature). If you already had claw attacks, those attacks deal damage as
        though you were one size larger instead. You become female (if you
        weren't already) and physically attractive; depending on how drastic the
        changes are, you may or may not still be recognizable as your former
        self. Hags do not become physically attractive in this way.<br
        /><strong>3: Maiming Strike (Su)</strong> With a single ripping claw,
        you destroy a creature's virility and wreck its physical and magical
        potency. Three times per day, you can make a single claw attack as a
        standard action. In addition to taking normal claw damage, the creature
        struck must succeed at a Fortitude save (DC = 10 + half your Hit Dice +
        your Strength or Dexterity modifier, whichever is higher) or become
        permanently mutilated in a physical and spiritual way. The victim takes
        a -6 penalty to its Strength, Dexterity, or Constitution score (chosen
        by you) and on caster level checks, concentration checks, and spell
        penetration checks. The victim can no longer sire or birth children.
        This is a curse effect.</em></p><h2>For Followers of
        Mestama</h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic Items
        - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Traits</h3><p><em>Demonic Persuasion</em></p>
