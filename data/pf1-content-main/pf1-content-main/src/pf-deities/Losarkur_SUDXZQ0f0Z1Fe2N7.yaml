      content: >-
        <h1>Losarkur</h1><h2>Beastlord of Avernus</h2>@Source[PZO9267;pages=326]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Losarkur">Losarkur</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Dominance, hounds, punishment<br
        /><strong>Domains</strong> Animal, Evil, Law, Nobility<br
        /><strong>Subdomains</strong> Devil (Evil), Devil (Law), Feather, Fur,
        Slavery<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Club<br
        /><strong>Symbol</strong> Cudgel and leash<br /><strong>Sacred
        Animal(s)</strong> Hound<br /><strong>Sacred Color(s)</strong> Brown,
        gray</p><h3>Obedience</h3><p>Hand-feed raw meat to a beast, and rub the
        ensuing blood around your eyes like kohl. Gain a +4 profane bonus on
        saving throws against fear effects.</p><h2>Boons - Infernal
        Dukes</h2>@Source[PZO1139;pages=118]<br />The Lords of Hell, the Dukes
        of Perdition, and the Princes of Damnation are all names for the
        infamous nobility of the Pit- the elite caste of devilkind known as the
        infernal dukes.<p> All infernal dukes are lawful evil and range in power
        from CR 26 to CR 27. The boons they grant are less complex than those
        granted by archdevils, manifesting as spell-like abilities usable once
        per day each.</p><p><strong>1</strong>: <em>beast shape I</em><br
        /><strong>2</strong>: <em>summon monster VII</em><br
        /><strong>3</strong>: <em>dominate monster</em></p><h2>For Followers of
        Losarkur</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
