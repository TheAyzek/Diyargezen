      content: >-
        <h1>Zepar</h1><h2>The Forever Sire</h2>@Source[PZO9267;pages=326] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Zepar">Zepar</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Abduction, rape, transformation<br
        /><strong>Domains</strong> Charm, Evil, Law, Trickery<br
        /><strong>Subdomains</strong> Devil (Evil), Devil (Law), Fear, Lust,
        Torture<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Bolas<br
        /><strong>Symbol</strong> Leering goat face<br /><strong>Sacred
        Animal(s)</strong> Goat<br /><strong>Sacred Color(s)</strong> Pink,
        white</p><h3>Obedience</h3><p>Carve the flesh of a deceased creature
        into pieces, then reassemble them into a new form. Gain a +4 profane
        bonus on saving throws against polymorph effects.</p><h2>Boons -
        Infernal Dukes</h2>@Source[PZO1139;pages=119]<br />The Lords of Hell,
        the Dukes of Perdition, and the Princes of Damnation are all names for
        the infamous nobility of the Pit- the elite caste of devilkind known as
        the infernal dukes.<p> All infernal dukes are lawful evil and range in
        power from CR 26 to CR 27. The boons they grant are less complex than
        those granted by archdevils, manifesting as spell-like abilities usable
        once per day each.</p><p><strong>1</strong>: extended <em>alter
        self</em><br /><strong>2</strong>: <em>phase door</em><br
        /><strong>3</strong>: <em>shapechange</em></p><h2>For Followers of
        Zepar</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
