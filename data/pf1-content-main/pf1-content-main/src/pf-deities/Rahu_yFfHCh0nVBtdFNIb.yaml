      content: >-
        <h1>Rahu</h1><h2>The Sun Eater</h2>@Source[PZO1139;pages=110] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Rahu">Rahu</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Asura Ranas<br /><strong>Areas of
        Concern</strong> Eclipses, Executions, Gluttony<br
        /><strong>Domains</strong> Darkness, Death, Evil, Law<br
        /><strong>Subdomains</strong> Fear, Loss, Murder, Night<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong>
        Morningstar</p><h3>Obedience</h3><p>Behead a serpent and offer its head
        to the rising sun. If no serpent is available, you must undertake a
        ritual that symbolizes severing your own head with a silver knife (this
        deals 1 point of damage). Gain a +4 profane bonus on saving throws
        against blindness and vision-based effects.</p><h2>Boons - Asura
        Ranas</h2>@Source[PZO1139;pages=111]<br />Over time, the mightiest of
        the asuras complete enough cycles of reincarnation and build upon the
        atrocities committed over multiple lives to incarnate into the most
        powerful of their kind: the asura ranas.<p> Asura ranas are lawful evil
        demigods that range in power from CR 26 to CR 30. Each asura rana
        detailed below is given an obedience, but the boons they grant are less
        complex than those granted by archdevils, manifesting as spell-like
        abilities usable once per day each.</p><p><strong>1</strong>: 
        <em>create food and water</em><br /><strong>2</strong>: <em>plundered
        power</em><br /><strong>3</strong>: <em>power word kill</em></p>
