        <h1> Sinashakti</h1><h2>Immaculate Joy</h2>@Source[PZO9267;pages=324]
        <br /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Sinashakti">Sinashakti</a><h3>Details</h3><p><strong>Alignment</strong>
        CG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Journeys, joy, messengers<br /><strong>Domains</strong>
        Chaos, Good, Luck, Travel<br /><strong>Subdomains</strong> Azata
        (Chaos), Azata (Good), Exploration, Fate, Friendship<br /><em>* Requires
        the <u>Acolyte of Apocrypha</u> trait.</em><br /><strong>Favored
        Weapon</strong> Shortbow<br /><strong>Symbol</strong> Emerald trumpet
        and road<br /><strong>Sacred Animal(s)</strong> Horse<br
        /><strong>Sacred Color(s)</strong> Green,
        yellow</p><h3>Obedience</h3><p>Sit cross-legged at dawn and light a
        candle before your face. Laugh uproariously until the force of your
        laughter blows out the candle. When you rise, step out with your right
        foot first. Gain a +4 sacred bonus on saving throws against spells and
        effects that would hinder your movement speed.</p><h2>Boons - Celestial
        Obedience</h2><h3>Mystery Cultist</h3><p>@Source[PZO9255;pages=24]<br
        /><strong>1: Joyful Step (Sp)</strong> <em>longstrider</em> 3/day,
        <em>forest friend<sup>UC</sup> 2/day, or <em>good hope</em> 1/day<br
        /><strong>2: Infectious Joy (Su)</strong> Your delightful demeanor is so
        contagious that enemies find it hard to resist your charms. The save DC
        of your mind-affecting effects increases by 1, or by 2 against
        intelligent foes of the same race as you.<br /><strong>3: Familiar
        Journey (Sp)</strong> You can cast <em>word of recall </em>once per day,
        except you may target up to six willing creatures within 30 feet to
        travel with you; these creatures need not be touching
        you.</em></p><h2>For Followers of
        Sinashakti</h2><h3>Feats</h3><p><em>Heroic
        Interposition</em></p><h3>Traits</h3><p><em>Empyreal Focus</em></p>
