    text:
      content: >-
        <h1> Hadregash</h1><h2>Greatest Supreme Chieftain
        Boss</h2>@Source[PZO90117;pages=77] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Hadregash">Hadregash</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Goblin Hero-Gods<br /><strong>Areas of
        Concern</strong> Goblin supremacy, slavery, territory<br
        /><strong>Domains</strong> Evil, Law, Strength, War<br
        /><strong>Subdomains</strong> Blood, Devil (Evil), Devil (Law),
        Ferocity, Slavery<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Flail<br
        /><strong>Symbol</strong> Chain and manacle<br /><strong>Sacred
        Animal(s)</strong> Cougar<br /><strong>Sacred Color(s)</strong> Green,
        red</p><h3>Obedience</h3><p>Spend 1 hour loudly proclaiming (or singing)
        the superiority of the various goblinoid races: the regimented
        militaristic mind of hobgoblins, the unbounded cruelty of goblins, and
        the sheer physical might of bugbears. You gain a +2 bonus on Intimidate
        checks to demoralize foes, and the DC of Intimidate checks to demoralize
        you increases by 2.</p><h2>Boons - Deific
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO90117;pages=77]<br
        /><strong>1: Goblins Scare! (Sp)</strong> <em>bane</em> 3/day,
        <em>castigate </em> 2/day, or <em>retribution</em> 1/day<br /><strong>2:
        Shut Up and Listen! (Su)</strong> Many hobgoblin commanders believe that
        Hadregash accompanies them onto the field of battle and whispers
        tactical advice in their ears. As a standard action, you can provide an
        adjacent ally with similar guidance with a soft-spoken word or two. Your
        ally gains a +2 circumstance bonus on attack and damage rolls for 1
        round; this bonus increases to +4 for dirty trick combat maneuver
        attempts. You can use this ability a number of times per day equal to
        your Charisma modifier.<br /><strong>3: My Blood Slithers! (Su)</strong>
        Hadregash has granted you the ability to replicate his creation of the
        goblin snake. Three times per day as a full-round action, you can deal 9
        points of damage to yourself with a piercing or slashing weapon or your
        teeth and turn the spilled blood into a swarm of diminutive, venomous
        goblin snakes. The swarm functions as an advanced centipede swarm and
        appears adjacent to you. You can direct the swarm as a move action. The
        swarm lasts for 9
        rounds.</em></p><h3>Exalted</h3><p>@Source[PZO90117;pages=77]<br
        /><strong>1: Goblins Rule! (Sp)</strong> <em>command</em> 3/day,
        <em>hold person</em> 2/day, or <em>dimensional anchor</em> 1/day<br
        /><strong>2: You No Move! (Sp)</strong> When hunting for slaves, you
        know how important it is to keep them from running away. Upon succeeding
        at a touch attack against a Small or Medium creature as a standard
        action, you can summon a pair of masterwork fetters to hobble that
        target's movement. These fetters function as masterwork manacles for the
        purposes of breaking and escaping them. The target creature is entangled
        and can move at only half its normal speed, and must succeed at a DC 15
        Acrobatics check to move more than its reduced speed in a round. If the
        target fails this check by 5 or more, it falls prone. The fetters
        disappear after 1 minute. You can use this ability a number of times per
        day equal to your Charisma modifier.<br /><strong>3: My Will is Best!
        (Ex)</strong> You are convinced of your own superiority and believe
        others should do what you say. Targets of your compulsion spells don't
        receive the +2 bonus on new saving throws attempted after being forced
        to act against their natures. In addition, you receive a +4 bonus on
        Charisma checks against targets of your charm spells to convince them to
        do things they wouldn't normally
        do.</em></p><h3>Sentinel</h3><p>@Source[PZO90117;pages=77]<br
        /><strong>1: Goblins Fight! (Sp)</strong> <em>thunderstomp</em> 3/day,
        <em>bull's strength</em> 2/day, or <em>rage</em> 1/day<br /><strong>2:
        Form of Wolf! (Sp)</strong> Like the barghest god you venerate, you can
        turn into a wolf. As a standard action, you take the form of a wolf as
        per <em>beast shape I</em>. You can remain in this shape a number of
        minutes per day equal to your Charisma modifier. These minutes don't
        need to be used consecutively but must be used in 1-minute increments.
        You can return to your normal form as a move action.<br /><strong>3: My
        Might is Mighty! (Ex)</strong> The Supreme Chieftain teaches that you
        should be prepared for anything in a fight. Three times per day as a
        move action, you can gain the benefits of a combat feat you don't have
        for the following minute. You must meet all the feat's prerequisites,
        and if you use this ability again before the duration expires, the new
        combat feat replaces the old one. If a combat feat has a daily use
        limitation (such as Stunning Fist), any uses of that combat feat while
        using this ability count toward that feat's daily limit, even through
        multiple uses of this ability.</em></p><h2>For Followers of
        Hadregash</h2><h3>Magic Items - Wondrous Items</h3><p><em>Great Barghest
        Hero Cloak</em></p><h3>Spells</h3><p><em>Barghest Feast, Hobbling Bomb
        Admixture</em></p><h3>Traits</h3><p><em>Strength of the
        Barghest</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO90117;pages=76]</em><br
        /><h3>Cleric/Warpriest</h3><p><em>Blood Armor</em> can be prepared as a
        2nd-level spell<br /><em>Lead Blades</em> can be prepared as a 3rd-level
        spell</p><h3>Inquisitor</h3><p><em>Blood Armor can be prepared as a
        2nd-level spell<br /><em>Lead Blades</em> can be prepared as a 3rd-level
        spell</em></p><h2>Unique Summon Rules</h2>@Source[PZO90117;pages=77]<br
        /><strong>Summon Monster II</strong>: Goblin Snake<br /><strong>Summon
        Monster V</strong>: Barghest<br /><strong>Summon Monster VI</strong>:
        Greater Barghest
