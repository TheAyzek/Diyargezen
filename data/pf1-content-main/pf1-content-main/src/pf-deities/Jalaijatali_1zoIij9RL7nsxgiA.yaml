      content: >-
        <h1> Jalaijatali</h1><h2>Rillsong</h2>@Source[PZO9267;pages=322] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Jalaijatali">Jalaijatali</a><h3>Details</h3><p><strong>Alignment</strong>
        CG<br /><strong>Pantheon</strong> Empyreal Lords<br /><strong>Areas of
        Concern</strong> Natural music, rapids, waterfalls<br
        /><strong>Domains</strong> Chaos, Good, Scalykind, Water<br
        /><strong>Subdomains</strong> Azata (Chaos), Azata (Good), Flotsam,
        Revelry, Rivers<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Whip<br
        /><strong>Symbol</strong> Water from wood pipe<br /><strong>Sacred
        Animal(s)</strong> Water lizard<br /><strong>Sacred Color(s)</strong>
        Blue, green</p><h3>Obedience</h3><p>Stand under a waterfall (or pour
        water over your head) while singing wordlessly, letting the sound of the
        moving water inspire you. Gain a +4 sacred bonus on saves against the
        spells, spell-like abilities, and supernatural abilities of creatures
        with the aquatic or water subtype.</p><h2>Boons - Celestial
        Obedience</h2><h3>Mystery Cultist</h3><p>@Source[PZO9255;pages=16]<br
        /><strong>1: Whitewater (Sp)</strong> <em>hydraulic push<sup>APG</sup>
        3/day, <em>slipstream</em><sup>APG</sup> 2/day, or <em>water breathing
        </em> 1/day<br /><strong>2: Sacred Scales (Ex)</strong> You grow a coat
        of iridescent scales that matches your skin tone. Your natural armor
        bonus to AC increases by +3.<br /><strong>3: Waterform (Su)</strong>
        Three times per day, you and a number of willing touched companions
        equal to 1/2 your HD may meld into a body of flowing water (such as a
        river or creek) and travel up or downstream at a rate of 50 miles per
        hour. This transformation takes 1 minute to complete. You can wind
        through natural obstructions with ease as long as the body of water is
        still flowing, but not through largely impermeable barriers such as
        artificial dams. This effect lasts for a number of hours equal to your
        HD, and you cannot otherwise act or defend yourself while traveling in
        this way.</em></p><h2>For Followers of
        Jalaijatali</h2><h3>Feats</h3><p><em>Heroic
        Interposition</em></p><h3>Traits</h3><p><em>Empyreal Focus</em></p>
