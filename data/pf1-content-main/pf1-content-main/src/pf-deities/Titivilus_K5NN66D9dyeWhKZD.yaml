      content: >-
        <h1>Titivilus</h1><h2>The Scrivening
        Count</h2>@Source[PZO9267;pages=326] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Titivilus">Titivilus</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Lies, propaganda, rhetoric<br
        /><strong>Domains</strong> Evil, Knowledge, Law, Trickery<br
        /><strong>Subdomains</strong> Deception, Devil (Evil), Devil (Law),
        Language, Memory<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Longsword<br
        /><strong>Symbol</strong> Devil hand writing<br /><strong>Sacred
        Animal(s)</strong> Viper<br /><strong>Sacred Color(s)</strong> Black,
        white</p><h3>Obedience</h3><p>Write propaganda that insidiously promotes
        Titivilus and his deeds. Gain a +4 profane bonus on saving throws
        against mind-affecting effects.</p><h2>Boons - Infernal
        Dukes</h2>@Source[PZO1139;pages=118]<br />The Lords of Hell, the Dukes
        of Perdition, and the Princes of Damnation are all names for the
        infamous nobility of the Pit- the elite caste of devilkind known as the
        infernal dukes.<p> All infernal dukes are lawful evil and range in power
        from CR 26 to CR 27. The boons they grant are less complex than those
        granted by archdevils, manifesting as spell-like abilities usable once
        per day each.</p><p><strong>1</strong>: <em>illusory script</em><br
        /><strong>2</strong>: <em>dictum</em><br /><strong>3</strong>: 
        <em>imprisonment</em></p><h2>For Followers of
        Titivilus</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
