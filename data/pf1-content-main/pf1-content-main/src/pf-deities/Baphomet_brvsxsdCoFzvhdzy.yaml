    text:
      content: >-
        <h1>Baphomet</h1><h2>Lord of the
        Minotaurs</h2>@Source[PZO9267;pages=320] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Baphomet">Baphomet</a><h3>Details</h3><p><strong>Alignment</strong>
        CE<br /><strong>Pantheon</strong> Demon Lords<br /><strong>Areas of
        Concern</strong> Beasts, labyrinths, minotaurs<br
        /><strong>Domains</strong> Animal, Chaos, Evil, Strength<br
        /><strong>Subdomains</strong> Demon (Chaos), Demon (Evil), Ferocity,
        Fur, Resolve<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Glaive<br
        /><strong>Symbol</strong> Brass minotaur head<br /><strong>Sacred
        Animal(s)</strong> Aurochs<br /><strong>Sacred Color(s)</strong> Gold,
        red</p><h3>Obedience</h3><p>Remain motionless for 55 minutes, and then
        spend the last 5 minutes speaking 50 observations regarding your
        surroundings into a hollowed-out bull's horn. Gain immunity to <em>maze
        </em>and a +4 profane bonus on saving throws against confusion and
        insanity effects.</p><h2>Boons - Demonic
        Obedience</h2><h3>Demoniac</h3><p>@Source[PZO9225;pages=12]<br
        /><strong>1: Conspirator's Whisper (Sp)</strong> <em>summon monster I
         </em> 3/day, <em>misdirection</em> 2/day, or <em>beast shape I</em> 1/day<br
        /><strong>2: Minotaur Form (Su)</strong> Once per day, you may change
        shape into a minotaur for 1 hour (<em>Pathfinder RPG Bestiary</em> 298).
        When you do so, you gain a +4 size bonus to Strength, but suffer a -2
        penalty to Charisma. If you are actually a minotaur, this ability
        instead allows you to assume a humanoid form at will (this change of
        form does not alter your ability scores).<br /><strong>3: Maze of
        Madness (Sp)</strong> Extended <em>maze</em> 1/day.</em></p><h2>Boons -
        Fiendish
        Obedience</h2><h3>Evangelist</h3><p>@Source[PZO1139;pages=30]<br
        /><strong>1: Walk among the Herd (Sp)</strong> <em>pass without
        trace</em> 3/day, undetectable alignment 2/day, or
        <em>clairaudience/clairvoyance</em> 1/day<br /><strong>2: Unquestioned
        Influence (Sp)</strong> As a reward for your devotion to him, Baphomet
        grants you the power to make pawns of the weak willed and spread your
        influence among the ignorant masses. Three times per day, you can cast
        <em>mass suggestion</em> as a spell-like ability.<br /><strong>3: Invoke
        Tempter (Sp)</strong> You can conjure an agent of the Abyss to spread
        demonic intrigues and tempt the foolish. Once per day as a standard
        action, you can conjure a glabrezu to your location. The glabrezu
        remains for 1 minute per Hit Die you have before returning to the Abyss.
        This is a calling effect, and the glabrezu is not under your control,
        although it generally aids you and follows your directives. This
        glabrezu is loath to employ its <em>wish</em> ability for your use,
        preferring instead to offer it to others as a bargaining chip on your
        behalf or to tempt foolish mortals. This ability always calls the same
        glabrezu; if the glabrezu conjured this way is slain, you cannot use
        this boon for 1 month (at which point you can call a new
        glabrezu).</em></p><h3>Exalted</h3><p>@Source[PZO1139;pages=30]<br
        /><strong>1: Conspirator's Whisper (Sp)</strong> <em>summon monster
        I</em> 3/day, misdirection 2/day, or <em>beast shape I</em> 1/day<br
        /><strong>2: Minotaur Form (Su)</strong> Once per day, you can change
        shape (as per the universal monster ability) into a minotaur for 1 hour.
        When you do so, you gain a +4 size bonus to Strength and take a -2
        penalty to Charisma. If you are already a minotaur, this ability instead
        allows you to assume a Small, Medium, or Large humanoid form at will
        (this change of form does not alter your ability scores). This is a
        polymorph effect.<br /><strong>3: Maze of Madness (Sp)</strong> You can
        cast <em>maze</em> with the benefits of the Extend Spell feat as a
        spell-like ability once per
        day.</em></p><h3>Sentinel</h3><p>@Source[PZO1139;pages=30]<br
        /><strong>1: Might of the Labyrinth (Sp)</strong> <em>enlarge person
          </em> 3/day, <em>bull's strength</em> 2/day, or
        <em>nondetection</em> 1/day<br /><strong>2: Devouring Beast
        (Ex)</strong> To aid in your profane crusade against the cult's many
        enemies, Baphomet sends one of the flesh-eating bulls of the Ivory
        Labyrinth to slaughter and feed at your side. You gain an aurochs animal
        companion as a druid of a level equal to your Hit Dice - 4, in addition
        to any animal companions you already have. This animal companion
        possesses the fiendish template and the extraplanar subtype, along with
        a bite attack that inflicts 1d6 points of damage. Any day on which you
        fail to perform your obedience, this beast vanishes back to the Ivory
        Labyrinth; if returned to the Abyss, whether by this or by other means,
        it returns to you when you next perform your obedience (along with any
        gear it was equipped with).<br /><strong>3: Invocation of the Gorgon
        (Su)</strong> You gain the change shape universal monster ability,
        allowing you to assume the form of an ivory-colored gorgon as per
        <em>beast shape IV</em>. Although you can activate this ability only
        once per day, the new form lasts indefinitely. If you lose access to
        this boon by failing to perform your obedience, you cannot change forms
        or return to your true form until you perform the obedience again or the
        effect is otherwise ended.</em></p><h2>For Followers of
        Baphomet</h2><h3>Feats</h3><p><em>Channel Discord</em></p><h3>Magic
        Items - Wondrous Items</h3><p><em>Dagon's
        Eye</em></p><h3>Spells</h3><p><em>Bleeding
        Strike</em></p><h3>Traits</h3><p><em>Demonic
        Persuasion</em></p><h2>Unique Spell
        Rules</h2><em>@Source[PZO9077;pages=70]</em><br
        /><h3>Antipaladin</h3><p><em>Monstrous Physique I</em> can be prepared
        as a 2nd-level spell<br /><em>Monstrous Physique II</em> can be prepared
        as a 3rd-level spell<br /><em>Monstrous Physique III</em> can be
        prepared as a 4th-level spell</p><h3>Cleric/Warpriest</h3><p><em>Maze
        can be prepared as a 8th-level spell<br /><em>Monstrous Physique I</em>
        can be prepared as a 3rd-level spell<br /><em>Monstrous Physique II can
        be prepared as a 4th-level spell<br /><em>Monstrous Physique III</em>
        can be prepared as a 5th-level spell<br /><em>Monstrous Physique IV can
        be prepared as a 6th-level spell<br
        /></em></p><h3>Ranger</h3><p><em>Monstrous Physique I</em> can be
        prepared as a 2nd-level spell<br /><em>Monstrous Physique II can be
        prepared as a 3rd-level spell<br /><em>Monstrous Physique III</em> can
        be prepared as a 4th-level spell<br /></em></p><h2>Unique Summon
        Rules</h2>@Source[PZO9077;pages=70]<br /><strong>Summon Monster
        V</strong>: Half-Fiend Minotaur<br /><strong>Summon Monster VI</strong>:
        Fiendish Chimera<br /><h2>Other Rules</h2>@Source[PZO9077;pages=70]<br
        />Witches of Baphomet may prepare <em>monstrous physique</em> spells at
        the same spell levels as the sorcerer/wizard versions.
