        <h1>Trudd</h1><h2>The Mighty</h2>@Source[PZO9267;pages=320] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Trudd">Trudd</a><h3>Details</h3><p><strong>Alignment</strong>
        NG<br /><strong>Pantheon</strong> Dwarven Deities<br /><strong>Areas of
        Concern</strong> Bravery, defense, strength<br
        /><strong>Domains</strong> Good, Nobility, Protection, Strength<br
        /><strong>Subdomains</strong> Agathion, Competition, Defense, Martyr,
        Resolve<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Warhammer<br
        /><strong>Symbol</strong> Rune-carved stone throne<br /><strong>Sacred
        Animal(s)</strong> Bear<br /><strong>Sacred Color(s)</strong> Brown,
        gray</p><h2>Paladin Code</h2>The paladins of Trudd are stalwart
        protectors of the dwarven people and their greatest treasures. The
        tenets of Trudd's paladins include the following affirmations.<ul><li>
        My strength is my sacred offering. I will maintain my body as I would a
        sacred relic and use it only for admirable pursuits.</li><li> To ensure
        the safety of those I protect, I will be among the first to charge and
        the last to retreat, save when such tactics would place those I protect
        at undue risk.</li><li> I will hold any defensive line if it will save
        innocents or the homes of my people.</li><li> Even the young can
        accomplish great things. I will never dismiss someone on account of
        youth.</li></ul> <h2>For Followers of
        Trudd</h2><h3>Monsters</h3><p>Chelonidal</p><h3>Spells</h3><p>Mighty
        Strength</p><h3>Traits</h3><p>Battlefield Caster, Guardian Smite, Mighty
        Protector, Steady Strength</p>
