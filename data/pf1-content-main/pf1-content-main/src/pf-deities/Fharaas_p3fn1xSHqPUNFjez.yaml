        <h1>Fharaas</h1><h2>The Seer in Skin</h2>@Source[PZO1139;pages=120] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Fharaas">Fharaas</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Kyton Demagogues<br /><strong>Areas of
        Concern</strong> Experience, murder, patterns<br
        /><strong>Domains</strong> Evil, Knowledge, Law, Repose<br
        /><strong>Subdomains</strong> Ancestors, Fear, Memory, Souls<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Battle
        axe</p><h3>Obedience</h3><p>Study the interior of a freshly severed
        limb. You are immune to bleed effects that deal 6 damage or
        less.</p><h2>Boons - Kyton Demagogues</h2>@Source[PZO1139;pages=120]<br
        />The principals of the kyton race number among the planes' most
        audacious explorers, artistes, and scientists. Constrained by neither
        morals nor taboos, kyton demagogues pursue perfection in myriad profane
        fields. Lost limbs and lives mean little to the kyton demagogue-only the
        next boundary to shatter and the promise of what could be. The kyton
        demagogues are legion, but nine of those best known to Golarion's cultic
        scholars are presented here.<p> Kyton demagogues are far less likely
        than other fiendish demigods to flaunt their power. All kyton demagogues
        are lawful evil and range in power from CR 26 to CR 30. The boons they
        grant are less complex than those granted by other fiendish demigods,
        manifesting as spell-like abilities each usable once per
        day.</p><p><strong>1</strong>: <em>keen edge</em><br
        /><strong>2</strong>: <em>vision</em><br /><strong>3</strong>: 
        <em>foresight</em></p>
