      content: >-
        <h1>Lorthact</h1><h2>The Unraveler</h2>@Source[PZO9267;pages=326] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Lorthact">Lorthact</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Exiles, scholars, theories<br
        /><strong>Domains</strong> Evil, Law, Magic, Trickery<br
        /><strong>Subdomains</strong> Arcane, Deception, Devil (Evil), Devil
        (Law), Thievery<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Quarterstaff<br
        /><strong>Symbol</strong> Staff wrapped in scrolls<br /><strong>Sacred
        Animal(s)</strong> Chameleon<br /><strong>Sacred Color(s)</strong> Blue,
        red</p><h3>Obedience</h3><p>Work on a never-ending compendium of
        promises of pain to your enemies. Gain a +4 profane bonus on Knowledge
        and Spellcraft checks.</p><h2>Boons - Infernal
        Dukes</h2>@Source[PZO1139;pages=118]<br />The Lords of Hell, the Dukes
        of Perdition, and the Princes of Damnation are all names for the
        infamous nobility of the Pit- the elite caste of devilkind known as the
        infernal dukes.<p> All infernal dukes are lawful evil and range in power
        from CR 26 to CR 27. The boons they grant are less complex than those
        granted by archdevils, manifesting as spell-like abilities usable once
        per day each.</p><p><strong>1</strong>: <em>secret page</em><br
        /><strong>2</strong>: <em>vision</em><br /><strong>3</strong>: 
        <em>astral projection</em></p><h2>For Followers of
        Lorthact</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
