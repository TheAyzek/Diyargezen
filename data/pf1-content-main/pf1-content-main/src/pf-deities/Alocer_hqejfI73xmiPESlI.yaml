    text:
      content: >-
        <h1>Alocer</h1><h2>The Pack Lord</h2>@Source[PZO9267;pages=326] <br
        /><strong>Pathfinder Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Alocer">Alocer</a><h3>Details</h3><p><strong>Alignment</strong>
        LE<br /><strong>Pantheon</strong> Infernal Dukes<br /><strong>Areas of
        Concern</strong> Beasts, hunters, tradition<br
        /><strong>Domains</strong> Animal, Evil, Law, Strength<br
        /><strong>Subdomains</strong> Devil (Evil), Devil (Law), Ferocity, Fur,
        Resolve<br /><em>* Requires the <u>Acolyte of Apocrypha</u>
        trait.</em><br /><strong>Favored Weapon</strong> Shortbow<br
        /><strong>Symbol</strong> Dragon-legged horse<br /><strong>Sacred
        Animal(s)</strong> Lion<br /><strong>Sacred Color(s)</strong> Black,
        red</p><h3>Obedience</h3><p>Lure or chase any quarry, then kill it and
        pray over the corpse. Gain a +4 profane bonus to AC against attack rolls
        made to confirm a critical hit against you.</p><h2>Boons - Infernal
        Dukes</h2>@Source[PZO1139;pages=116]<br />The Lords of Hell, the Dukes
        of Perdition, and the Princes of Damnation are all names for the
        infamous nobility of the Pit- the elite caste of devilkind known as the
        infernal dukes.<p> All infernal dukes are lawful evil and range in power
        from CR 26 to CR 27. The boons they grant are less complex than those
        granted by archdevils, manifesting as spell-like abilities usable once
        per day each.</p><p><strong>1</strong>: <em>snare</em><br
        /><strong>2</strong>: <em>true seeing</em><br /><strong>3</strong>:
        <em>summon nature's ally IX</em></p><h2>For Followers of
        Alocer</h2><h3>Feats</h3><p><em>Hellish Shackles</em></p>
