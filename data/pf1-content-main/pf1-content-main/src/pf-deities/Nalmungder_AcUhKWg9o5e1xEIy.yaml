        <h1>Nalmungder</h1><h2>He Who Waits Below the
        Stairs</h2>@Source[PZO9267;pages=318] <br /><strong>Pathfinder
        Wiki</strong> <a
        href="http://www.pathfinderwiki.com/wiki/Nalmungder">Nalmungder</a><h3>Details</h3><p><strong>Alignment</strong>
        NE<br /><strong>Pantheon</strong> Daemon Harbingers<br /><strong>Areas
        of Concern</strong> Basements, closets, delusions of safety<br
        /><strong>Domains</strong> Darkness, Earth, Evil, Trickery<br
        /><strong>Subdomains</strong> Caves, Daemon, Deception, Loss<br /><em>*
        Requires the <u>Acolyte of Apocrypha</u> trait.</em><br
        /><strong>Favored Weapon</strong> Sickle<br /><strong>Symbol</strong>
        Stairs down into darkness<br /><strong>Sacred Animal(s)</strong>
        Spider<br /><strong>Sacred Color(s)</strong> Black,
        brown</p><h3>Obedience</h3><p>Meditate in a basement or cellar
        (preferably one that does not belong to you). Gain a +4 profane bonus on
        all saving throws attempted while in complete darkness.</p><h2>Boons -
        Daemon Harbingers</h2><p>@Source[PZO1139;pages=114]</p><p>Abaddon's
        unique daemons take on a host of titles, customized to their methods and
        vanity. These harbingers enjoy sweeping influence among daemons as
        favored advisors, and they work to cultivate their own cults on Abaddon
        and beyond.</p><p> Daemon harbingers are neutral evil demigods that
        range in power from CR 21 to CR 25. The boons they grant are less
        complex than those granted by the Horsemen themselves, manifesting as
        spell-like abilities usable twice per day
        each.</p><p><strong>1</strong>: <em>darkness</em><br
        /><strong>2</strong>: <em>acid pit</em><br /><strong>3</strong>:
        <em>phobia</em></p>
