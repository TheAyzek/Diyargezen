name: Twisted Wish (CR 20)
prototypeToken:
  texture:
    src: icons/svg/mystery-man.svg
system:
  attributes:
    hp:
      max: 120
  details:
    alignment: LE
    area: up to a 100-ft. radius
    biography: {}
    cr:
      base: 20
    destruction: >-
      The sheer number of <em>wish</em> spells this haunt can bring to bear
      makes it nearly invincible. Only the direct intervention of a deity can
      destroy the twisted wish haunt.
    effect: >-
      The twisted wish haunt collects the wishes of those who come near it, and
      stores them until it decides to grant them at its leisure and in its own
      warped fashion. The haunt understands all languages, as per
      <em>tongues</em>, and does not need to manifest to hear every spoken wish
      and read every written wish within its radius. The haunt can manifest once
      per day to cast <em>wish</em> to grant any wish from its collection. It
      does not need to wait for a creature to enter its radius to manifest. The
      twisted wish is immune to the spells <em>heal</em> and <em>mass heal</em>.
      Unlike the effects of a typical haunt, the wishes this haunt grants do not
      count as fear effects. The haunt can fly at a speed of 10 feet even when
      it is not manifested, but it rarely chooses to do so unless its current
      region isn't providing enough victims, or it perceives someone as a
      potential threat.
    notes:
      value: >-
        <p><strong>Source</strong>: Horror Adventures pg.
        181</p><p><strong>Haunt Templates</strong>: belligerent free-roaming
        unyielding haunt</p> <h3>Description</h3><p>A twisted wish haunt can
        only arise in the most extraordinary circumstances, when a genie noble
        of considerable power dies with vengeance in its heart. It rests in
        places like wells or fountains where people go to make wishes, so it can
        use its powers frequently.</p>
    notice: >-
      Perception DC 35 (to notice a slight stutter in time originating from the
      center of its radius)
    reset: 1 day
    trigger: proximity
type: haunt
