name: Flayed Suicide (CR 18)
prototypeToken:
  texture:
    src: icons/svg/mystery-man.svg
system:
  attributes:
    hp:
      max: 243
  details:
    alignment: NE
    area: up to a 90-ft. radius
    biography: {}
    cl: 20
    cr:
      base: 18
    destruction: >-
      A flayed herald of a deity must be reunited with its skin and cured of its
      madness to give the haunt its final rest. If a character manages this
      feat, all flayed suicide haunts in existence on any plane are instantly
      destroyed.
    effect: >-
      Hundreds of razor-sharp knives appear and carve into the skin of those in
      the haunt's area. An affected creature can attempt a DC 25 Fortitude save
      to maintain the connection between its skin and its body. On a successful
      save, the creature takes 10d6 points of slashing damage. Creatures that
      fail this saving throw take 20d6 points of slashing damage as they are
      flayed alive. The skin of each flayed creature animates into a necromantic
      puppet that single-mindedly tries to kill its source. The skin carries all
      of the creature's equipment (and thus the creature loses access to this
      equipment), has access to all of its abilities, and shares its statistics,
      except its hit point total is equal to half the original creature's
      maximum hit points. If the skin uses one of the creature's limited-use
      abilities, it counts against the creature's total uses for the day. A
      flayed creature is permanently sickened, and is staggered from the pain
      unless it succeeds at a DC 25 Fortitude save at the beginning of its turn.
      Even if she defeats her necrotic skin, a flayed creature's skin never
      regrows naturally, and can only be restored with <em>regenerate</em>.
    notes:
      value: >-
        <p><strong>Source</strong>: Horror Adventures pg. 180</p>
        <p><strong>Haunt Templates</strong>: belligerent persistent
        unyielding</p> <h3>Description</h3><p>A flayed suicide haunt arises from
        the spirits of people tortured beyond insanity, until no remnants of
        their former essence remain. Only kytons are capable of the depths of
        depravity required to produce this powerful, disturbing vestige of
        suffering.</p>
    notice: >-
      Perception DC 20 (for affected characters to notice a prickling sensation
      in their skin)
    reset: 1 day
    trigger: proximity
type: haunt
