      max: 31
  details:
    alignment: 'N'
    area: 30-ft. radius
    biography: {}
    cl: 7
    cr:
      base: 7
    destruction: >-
      <em>Control weather</em> immediately destroys this haunt. When the spell
      is cast to destroy a drought's end, the spell has no other effect on the
      surrounding weather.
    effect: >-
      A fierce storm rages, bringing windstorm-strength winds and pouring rain.
      Each round for 6 rounds, a bolt of lightning strikes a random creature
      within the area, dealing 5d10 points of damage (Reflex DC 17 half). A
      worshiper of Gozreh who stays in the area of the resonance for its entire
      6-round duration gains the ability to cast each of the following spells
      once, with a caster level equal to her Hit Dice: <em>alter winds</em>,
      <em>resist energy</em> (electricity only), and <em>water breathing</em>.
      The ability to cast these spells persists until it is expended.
    notes:
      value: >-
        <p><strong>Source</strong>: Horror Realms pg. 62</p> <p><strong>Haunt
        Templates</strong>: persistent variant</p> <h3>Description</h3><p>The
        dualistic deity Gozreh, as ancient as the sky and the sea themselves,
        rarely interferes directly in mortal affairs. He is a gentle breeze and
        a fierce hurricane, speaking in the whisper of wind through rustling
        leaves and the ground-shaking rumble of thunder. When Gozreh answered
        the prayers of a coastal village shriveling under a drought, she
        unleashed a mighty thunderstorm over the entire region. A small portion
        of the storm still rages centuries later, granting boons to the faithful
        who prove themselves against its fury.<h3>Miraculous Resonances</h3>When
        deities interact with the world directly, their influence can persist in
        the form of miraculous resonances. These regions often become pilgrimage
        sites for the deity's worshipers.</p><p> The resonances sense the
        presence of their creator's influence and react differently to their
        creator's followers than to all others they encounter. Typically, they
        grant the faithful a benefit for 24 hours, though a single pilgrim can
        receive a manifestation's blessing only once. A miraculous resonance
        haunt has an alignment identical to the deity with which it resonates.
        These resonances typically manifest in areas where the associated
        deity's worship has traditionally been strong, but they can appear
        anywhere where such worship is particularly potent or where the deity
        has brushed against the Material Plane at some point in the
        past.</p><p>Miraculous resonances are vulnerable to forces connected to
        other deities, as well as spells that oppose their deity's nature.
        Spells with an alignment descriptor that does not match the haunt's
        alignment deal 1d6 points of damage per spell level (or the spell's
        damage against an aligned outsider, whichever is higher). While weapon
        attacks cannot normally harm miraculous resonances, these haunts take
        any extra damage that specifically affects creatures of their alignment,
        such as the 2d6 points of extra damage from a <em>holy</em> weapon or
        the extra damage from a paladin's smite evil. Such attacks target an AC
        of 5. Channeled energy can damage a resonance, so long as the creature
        channeling the energy has a patron deity of a different alignment than
        the haunt.</p>
    notice: Perception DC 0 (to hear a rumbling thunderstorm)
    reset: 1 day
    trigger: proximity
    weakness: chaotic, evil, good, or lawful effects
type: haunt
