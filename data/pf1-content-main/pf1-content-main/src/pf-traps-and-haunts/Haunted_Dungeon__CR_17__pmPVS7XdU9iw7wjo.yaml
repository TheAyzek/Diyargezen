name: Haunted Dungeon (CR 17)
prototypeToken:
  texture:
    src: icons/svg/mystery-man.svg
system:
  attributes:
    hp:
      max: 229
  details:
    alignment: CE
    area: entire structure, up to a 170-ft. radius
    biography: {}
    cl: 7
    cr:
      base: 17
    destruction: >-
      If the entire dungeon is simultaneously placed under the effects of
      <em>hallow</em>, the haunt is destroyed.
    effect: >-
      This dungeon directs its malevolence toward everyone inside of it. Its
      interior is under the effects of <em>guards and wards</em> at all times.
      If this ability is dispelled, the haunt recreates it when it resets the
      following day. Once per minute, the dungeon can gather a collection of
      furniture and other items to form an animated object. It can create one
      Colossal animated object; alternatively, it can create two Gargantuan
      animated objects, four Huge animated objects, and so on. It can control up
      to four times as many animated objects as it can create in a minute (for a
      total CR of 15). For the purposes of detecting creatures, the haunted
      dungeon and its animated objects have blindsight out to a range of the
      entire area of the haunt, even through walls.
    notes:
      value: >-
        <p><strong>Source</strong>: Horror Adventures pg. 180</p>
        <p><strong>Haunt Templates</strong>: belligerent elusive free-roaming
        increased area persistent tenacious</p>

        <h3>Description</h3><p>When enough haunts gather in a single dungeon,
        they can combine into a gestalt haunt that infuses the entire structure
        with a single, malevolent will. The haunt's source typically rests in
        the most difficult to find or obscure location within the structure, but
        it moves if it senses creatures approaching it.</p>
    notice: >-
      Perception DC 10 (to notice all of the dungeon's furniture and trapings
      approaching)
    reset: 1 day
    trigger: proximity
type: haunt
