    destruction: Destroying the witchfire also destroys the eternal pyre haunt.
    effect: >-
      A pillar of black and red flames manifests within the haunt's area each
      round. This pillar functions as per <em>flame strike</em> (Reflex DC 19
      negates), except its damage is half fire and half negative energy.
    notes:
      value: >-
        <p><strong>Source</strong>: Horror Adventures pg. 178</p>
        <p><strong>Haunt Templates</strong>: chained fast free-roaming
        persistent spiteful tenacious</p> <h3>Description</h3><p>An eternal pyre
        is formed from the spirits of people who were burned alive during an
        overzealous witch trial. It hates all living beings, but it has a strong
        bond of kinship with the witchfire who arose from the most powerful of
        those spirits. The witchfire often lurks within the haunt's area, as her
        witchflame intensifies the power of the pyre's strikes, which in turn
        heal her.</p>
    notice: Perception DC 20 (to hear the crackling of a fire)
