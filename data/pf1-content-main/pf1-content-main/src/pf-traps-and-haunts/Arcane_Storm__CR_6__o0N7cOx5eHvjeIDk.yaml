      max: 27
  details:
    alignment: tn
    area:
      size: 30
      type: circle
    aura:
      custom: false
      school: evo
    biography: {}
    cl: 5
    cr:
      base: 4
    destruction: >-
      The arcane storm is destroyed if a character successfully counterspells
      four of its bolts in a row.
    effect: >-
      Each round, the arcane storm fires a bolt of energy to hit as many
      creatures as possible in its area (Reflex DC 15 halves). This functions as
      per <em>lightning bolt</em>, except the energy type cycles between acid,
      cold, electricity, and fire. The storm is immune to the most recent type
      of energy damage it has dealt.
    notes:
      value: >-
        <p><strong>Source</strong>: Horror Adventures pg. 174</p>
        <p><strong>Haunt Templates</strong>: persistent variant</p>
        <p><strong>Benefit</strong> A character who fails the save against one
        of the arcane storm's bolts and does not reduce the damage in any way
        (such as energy resistance) can attempt a DC 16 Will save to harness a
        fraction of the storm's power. A character who harnesses the storm's
        power gains 5 charges. He can spend 1 charge as a free action to add 1d6
        points of damage of the same energy type as that of the channeled bolt
        to either an evocation spell that deals damage matching any of the
        storm's four energy types or to a natural attack or unarmed strike. A
        creature can gain charges from the arcane storm only once.</p>
        <h3>Description</h3><p>Each spell, no matter how weak, leaves its
        signature on the world for a short time, which spellcasters can perceive
        as a lingering magical aura. When dozens of powerful spells are hurled
        against each other over a small area, reality itself can form scars that
        affect all who come near them.</p><p> Magical scars have auras and count
        as ongoing spell effects for the purposes of <em>detect magic</em> and
        similar spells. A successful Spellcraft check to identify a scar reveals
        its effect and its weakness, and, if it succeeds by 10 or more, the
        scar's benefit. A creature can't attempt to activate a benefit it hasn't
        identified. Spells that automatically reveal the nature of magical
        effects, such as <em>greater arcane sight</em>, automatically reveal all
        of these properties. The destruction conditions for magical scars are
        more obscure, and require research or exploration to uncover.</p><p>The
        arcane storm haunt arose when a pair of evokers dueled to the death
        centuries ago. An echo of the duel still rages at the site of their
        battle, and the charred ground tells the bitter tale.</p>
    notice:
      dc: 20
      value: >-
        Perception or Spellcraft (to hear the sound of clashing energy or deduce
        the effect from the charred ground)
    reset: 1 day
    trigger: proximity
    weakness: energy damage (immune to positive energy)
  templates:
    - persistent
    - variant
type: haunt
