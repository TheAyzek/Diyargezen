name: Devouring Maws (CR 9)
prototypeToken:
  texture:
    src: icons/svg/mystery-man.svg
system:
  attributes:
    hp:
      max: 40
  details:
    alignment: CE
    area: 30-ft. radius
    biography: {}
    cl: 9
    cr:
      base: 9
    destruction: >-
      Living (though not necessarily sentient) creatures with a combined weight
      of at least 10,000 pounds must be left in the area to be devoured over the
      course of a single day.
    effect: >-
      A swarm of disembodied mouths fills the area. Each humanoid creature in
      the area must succeed at a DC 21 Fortitude save or be paralyzed, as per
      <em>mass hold person</em>. The maws swarm around paralyzed creatures,
      dealing them 4d6 points of damage per round. Elves are immune to the
      effects of this haunt.
    notes:
      value: >-
        <p><strong>Source</strong>: Horror Adventures pg. 177</p>
        <p><strong>Haunt Templates</strong>: persistent</p>
        <h3>Description</h3><p>A pack of ravenous ghouls descended upon a
        once-peaceful town, killing or transforming all of its denizens who were
        not fast enough to flee. The ghouls' unending hunger blended with the
        townsfolk's horrifying memories of death to produce the devouring maws
        haunt.</p>
    notice: Perception DC 20 (to hear teeth scraping againt bone)
    reset: 1 day
    trigger: proximity
type: haunt
