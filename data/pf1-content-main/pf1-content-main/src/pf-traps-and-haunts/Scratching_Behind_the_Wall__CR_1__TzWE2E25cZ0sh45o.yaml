      max: 1
  details:
    alignment: CE
    area: 5-ft.-by-10-ft. hallway
    biography: {}
    cl: 1
    cr:
      base: 0.5
    destruction: >-
      A character who finds the servant's body and removes her from behind the
      wall destroys the haunt forever.
    effect: >-
      The sound of claws scraping on the inside of the wall echoes throughout
      the hallway. Creatures within its area must succeed at a DC 11 Will save
      or be shaken for 1d4 rounds.
    notes:
      value: >-
        <p><strong>Source</strong>: Horror Adventures pg. 175</p>
        <h3>Description</h3><p>A lord with a terrible secret caught a servant
        snooping through his papers. He knocked the servant over the head and
        threw her into a disused dumbwaiter, which he jammed between floors. The
        servant awoke the following day, and her desperate attempts to escape
        infuse the walls that contained her.</p>
    notice: Perception DC 15 (to hear the faint scream behind the wall)
    reset: 1 day
    trigger: proximity
type: haunt
