          <p><strong>Trigger</strong>&nbsp;location;&nbsp;<strong>Duration</strong>&nbsp;1d4
          rounds;&nbsp;<strong>Reset</strong>&nbsp;automatic (1d6 rounds after
          trap stops)</p>

          <p>This trap is triggered when a character reaches the center of the
