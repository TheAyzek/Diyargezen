name: Demanding Dead (CR 3)
prototypeToken:
  texture:
    src: icons/svg/mystery-man.svg
system:
  attributes:
    hp:
      max: 13
  details:
    alignment: Varies
    area: 15-ft. radius
    biography: {}
    cl: 1
    cr:
      base: 3
    destruction: >-
      A demanding dead typically asks for rest for its mortal remains or the
      resolution of desires unfulfilled in life. Fulfilling the request
      dismisses the haunt.
    effect: >-
      Thishaunt seeks to influence the actions of the living, targeting a victim
      with a <em>suggestion</em> effect or a <em>heightened command</em> (save
      DC 14 for either). Depending on the haunt's alignment and goals, the
      suggested actions may be malicious (such as subtly putting its victims in
      harm's way or sowing antagonistic interactions) or benign (such as
      prompting mysterious automatic writings or unconscious utterances in hopes
      of communicating its ambitions to the world of the living).
    notes:
      value: >-
        <p><strong>Source</strong>: Occult Adventures pg.
        230</p><p><strong>Haunt Templates</strong>:persistent</p>
        <h3>Description</h3><p>Some haunts influence the thoughts and actions of
        those in the mortal realms to communicate their anger, desires, or
        goals, which can lead to instances of direct-voice channeling and
        automatic writing. While the demanding dead are sometimes malevolent,
        more often there is a method to their requests, which could potentially
        reveal shocking secrets or the key to putting them to rest forever.</p>
    notice: Perception DC 15 (to hear faint mutterings and feel a cool breeze)
    reset: 1 day
    trigger: proximity
    weakness: tricked by hide from undead
type: haunt
