    hp:
      max: 45
  details:
    alignment: 'N'
    area: 30-ft. radius
    biography: {}
    cl: 1
    cr:
      base: 10
    destruction: >-
      To destroy the haunt, two people, one each of the villagers' and raiders'
      ethnicity must reveal their true love for one another (typically by
      marrying) within the haunt's area.
    effect: >-
      As per <em>foster hatred</em>, except any creature that fails a DC 19 Will
      save becomes hostile toward members of the raiders' ethnic group.
    notes:
      value: >-
        <p><strong>Source</strong>: Horror Adventures pg. 174</p>
        <p><strong>Haunt Templates</strong>: persistent variant</p>
        <h3>Description</h3><p>Sometimes, the collective emotional energy of
        significant or traumatic events creates a lasting psychic impression,
        even in places not associated with death. These psychic haunts are
        mind-affecting emotion effects. A character who uses <em>analyze
        aura</em> or the read aura skill unlock on a psychic haunt's area
        automatically detects the haunt and receives cryptic clues about how to
        put it to rest.</p><p>Every psychic haunt focuses on a specific emotion,
        and when targeted by or within the area of effect of an emotion spell or
        effect that is not connected to the associated emotion, they take damage
        equal to three times the effect's spell level (each spell deals damage
        to the haunt once, regardless of its duration). <em>Calm emotions</em>
        damages psychic haunts regardless of their associated emotion, and an
        emotion effect without a spell level deals an amount of damage equal to
        the HD of the creature who created the effect. A character can calm a
        psychic haunt with a Diplomacy check (DC = 15 + the haunt's CR). If
        successful, the haunt takes 5 points of damage plus additional damage
        equal to the amount the character exceeded the DC.</p><p>The psychic
        echo below lies in the heart of an abandoned village. A group of raiders
        drove the villagers from their home by the sword, but an echo of the
        villagers' fury persists, stoking hatred against all members of the
        raiders' ethnic group.</p>
    notice: Sense Motive DC 25 (to sense an internal spark of anger)
    reset: 1 day
    trigger: proximity
    weakness: emotion effects and <em>calm emotions</em> (immune to positive energy)
type: haunt
