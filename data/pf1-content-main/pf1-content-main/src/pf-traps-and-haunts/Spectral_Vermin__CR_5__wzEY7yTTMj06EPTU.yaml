        vaporous</p> <h3>Description</h3><p>Overwhelming, unresolved guilt—or
        horrific death by thousands of tiny teeth—can lead to the manifestation
        of ghostly vermin swarms. The haunted area often displays signs of
        ancient rodent infestation.</p>
