    destruction: >-
      These spirits find rest only if those they could not save lead them to the
      afterlife.
    effect: >-
      The spectral forms of several people take faltering steps before falling
      to their knees and wailing with grief. All creatures in the area are
      exhausted (no save, as per <em>waves of exhaustion</em>) and are slowed
      for 13 minutes as per slow unless they succeed at a DC 16 Will saving
      throw.
    notes:
      value: >-
        <p><strong>Source</strong>: Horror Adventures pg. 176</p>
        <p><strong>Haunt Templates</strong>:
        chained</p><h3>Description</h3><p>The regret of those who arrived too
        late to spare others a terrible fate can manifest as a haunt. A belated
        arrival haunt often arises near another haunt or undead, representing
        the fate that these regretful spirits were not fast enough to stop. A
        belated arrival haunt is often chained to a ghost but a necrocraft is a
        truly horrifying alternative.</p>
    notice:
      dc: 20
      desc: ''
      value: Perception (to hear running footsteps)
    reset: 1 day
    trigger: proximity
    weakness: slow
  templates:
