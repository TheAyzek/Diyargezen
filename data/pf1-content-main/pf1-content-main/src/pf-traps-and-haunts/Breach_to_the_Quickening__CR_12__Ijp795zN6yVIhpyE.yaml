name: Breach to the Quickening (CR 12)
prototypeToken:
  texture:
    src: icons/svg/mystery-man.svg
system:
  attributes:
    hp:
      max: 54
  details:
    alignment: CN
    area: 30-ft. radius
    biography: {}
    cl: 2
    cr:
      base: 12
    destruction: >-
      Breaches to the Quickening spontaneously close or move on their own as
      unpredictably as they appear. A forbiddance or dimensional lock cast on
      the area of a breach prevents the breach from exerting influence on the
      Material Plane until it moves to a different location. A wish or miracle
      spell permanently closes a breach.
    effect: >-
      Colorful light and raw chaotic energy lash out in a dizzying display. All
      living creatures become the target of a random quickening effect (see
      table on Notes tab; DC 21 Fortitude saving throw negates). A creature that
      remains in the breach's area of effect must attempt an additional saving
      throw each round against a new random effect. For more info see Overcharge
      header in notes tab.
    notes:
      value: >-
        <p><strong>Source</strong>: Horror Realms pg. 60</p> <p><strong>Haunt
        Templates</strong>: persistent variant</p>
        <p><strong>Overcharge</strong>: Each affected target rolls twice on the
        quickening effect table if they fail to resist this haunt's effects.</p>
        <h3>Description</h3><p>The Quickening is the most chaotic portion of the
        First World, a region so unstable that most of the denizens of the First
        World give it a wide berth. Even a brief journey into the Quickening is
        enough to transform body and mind in unforeseeable ways. Connections
        between the Quickening and the Material Plane are rare and fleeting, but
        their effects persist.<h3 class="framing">Echoes of the First
        World</h3></p><p>The boundless and ever-shifting First World is home to
        fey and all manner of strange, otherworldly creatures caught in a
        constant flux of life-giving energies. Ancient beyond measure, the realm
        is a vibrant “first draft of reality,” according to legend. It shares
        its place in existence with the Material Plane, and in some places, the
        boundary between the two planes wears thin. The Material Plane's
        influence on the First World manifests as regions of stubborn stability
        that the First World's denizens regard with disgust. On the Material
        Plane, the fey realm's pull erodes the laws of time and space and
        transforms reality in its wake.</p><p>Unlike a typical haunt, an echo of
        the First World is healed by positive energy. In fact, when these
        manifestations interact with positive energy, they typically become
        stronger. When an echo of the First World is healed beyond its normal
        maximum hit points, any excess hit points persist for 1 minute as
        temporary hit points. As long as it has any temporary hit points, it
        gains the effects listed in the overcharge section of its stat
        block.</p><p>While positive energy is a boon for these unusual haunts,
        negative energy damages them as if they were living creatures. Damaging
        spells with the death descriptor also harm them. Echoes of the First
        World are almost always chaotic neutral.</p> <h3>Overcharge</h3><p>Each
        affected target rolls twice on the quickening effect table if they fail
        to resist this haunt's effects.<table
        class="inner"><tbody><tr><td><strong>d%</strong></td><td><strong>Effect</strong></td></tr><tr><td>1-25</td><td>The
        target transforms into a Tiny animal that is not native to the local
        region (as per baleful polymorph). As typical for <em>baleful
        polymorph</em>, a creature that fails the initial Fortitude saving throw
        must succeed at a secondary Will saving throw or lose significant mental
        abilities.</td></tr><tr><td>26-40</td><td>The target gains a random
        mutation from the mutant creature template, with the exception of
        radiation affinity. Roll 1d20 to select the
        mutation.</td></tr><tr><td>41-75</td><td>The target gains a random
        deformity from the mutant creature template. Roll 1d12 to select the
        specific deformity.</td></tr><tr><td>76-95</td><td>The First World
        lashes out at the target vindictively, bestowing the accursed corruption
        (<em>Pathfinder RPG Horror
        Adventures</em>).</td></tr><tr><td>96-99</td><td>The target gains a new
        form. This effect functions as per <em>reincarnate</em>, with a few
        exceptions. It takes full effect when the breach triggers, rather than
        taking 1 hour to activate. Additionally, it works only on living
        creatures, it does not impose any negative levels, and it does not cause
        a spellcaster to lose spells. Restoring the target to its original form
        requires a <em>miracle</em> or <em>wish</em>
        spell.</td></tr><tr><td>100</td><td>The target gains the fey creature
        template, and its alignment changes to chaotic neutral. Restoring the
        target's original form requires a <em>miracle</em> or <em>wish</em>
        spell.</td></tr></tbody></table></p>
    notice: >-
      Perception DC 20 (to notice nearby plant and animal life beginning to
      twist and deform)
    reset: 1d20 days
    trigger: proximity
    weakness: negative energy (immune to positive energy)
type: haunt
