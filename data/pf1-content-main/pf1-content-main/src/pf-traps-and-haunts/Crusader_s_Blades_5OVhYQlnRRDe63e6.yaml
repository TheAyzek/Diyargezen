    effect: >-
      There is a pressure plate located between a pair of statues. Stepping on
      this plate causes all of the statues to suddenly swing their swords
      downward, making attacks against anyone caught between them. Once the trap
      has been triggered, the swords remain in place, creating a barrier that is
      difficult to navigate, as creatures must climb over the angled swords.
      Treat the squares between the statues as difficult terrain. Additionally,
      anyone attempting to climb between the statues must make a DC 10
      Acrobatics or Escape Artist check to avoid taking 1d4 points of damage
      from the blades.
