name: Hunter's Eye
system:
  contextNotes:
    - target: skill.per
      text: +[[20]] vs invisible or Ethereal creatures.
    - target: attack
      text: >-
        Ignore concealment from fog or mist, and the Blur, Displacement and
        Invisibility spells.
  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.z5vqpdonvmb1fapd]{Hunter's
      Eye}</p><p>You gain the ability to perceive the target when it is
      invisible or ethereal as though using the see invisibility spell, and
      receive a +20 competence bonus on Perception checks to locate the
      target.</p><p>You ignore concealment provided by fog or mist,
      @UUID[Compendium.pf1.spells.Item.18kryvj2dfuymk9d]{blur},
      @UUID[Compendium.pf1.spells.Item.r190q9zxmei82lmv]{displacement},
      @UUID[Compendium.pf1.spells.Item.oylikodnyku2zewu]{invisibility}, and
      similar effects affecting the target, but not concealment provided by
      darkness. This spell provides no benefits to your allies and no benefits
      against creatures other than the target.</p>
  duration:
    units: minute
    value: '@item.level'
  level: 4
  subType: spell
type: buff
