_id: wgnn6S8tN2o5lYtM
_key: '!items!wgnn6S8tN2o5lYtM'
_stats:
  coreVersion: '12.331'
folder: agexB4nQIEpe1NP2
img: icons/magic/holy/angel-winged-humanoid-blue.webp
name: Angelic Aspect (Greater)
system:
  changes:
    - _id: 9svsXEF0
      formula: '60'
      target: flySpeed
      type: untyped
  contextNotes:
    - target: ac
      text: >-
        +[[2]] Deflection vs Evil creatures. Allies within 20 feet (6 meters)
        have +[[4]] Deflection vs Evil Enemies.

        Bodily contact prevented by Evil summoned creatures.
    - target: allSavingThrows
      text: >-
        +[[2]] Resistance vs Evil creatures. Allies within 20 feet (6 meters)
        have +[[4]] Resistance vs Evil Enemies.

        +[[4]] Racial vs poison.

        You and allies within 20 feet (6 meters) are immune to spells of 3rd
        level or lower.
    - target: will
      text: +[[2]] Morale vs existing Enchantment [charm] and [compulsion] effects.
    - target: attack
      text: >-
        Your natural attacks and any weapons you wield count as Good-aligned for
        the purposes of overcoming damage reduction.
  description:
    instructions: >-
      <p>Add 10 Fire and 10 Electricity resistance to Energy Resistance and
      10/evil to Damage Reduction in the Attributes tab. Add Acid and Cold to
      Damage Immunities and Petrification to Condition Immunities in the
      Attributes tab.</p>
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.ujykn701inq3hm2n]{Angelic Aspect,
      Greater}</p><p>You gain low-light vision; darkvision 60 feet; DR 10/evil;
      immunity to acid, cold, and petrification; resistance to electricity 10
      and fire 10; a +4 racial bonus on saves against poison; and protective
      aura and truespeech as supernatural abilities for the duration of the
      spell. Also, your wings give you a fly speed of 60 feet with good
      maneuverability.</p><p>Protective aura provides a +4 deflection bonus to
      AC and a +4 resistance bonus on saving throws against attacks made or
      effects created by evil creatures to anyone within 20 feet. Otherwise, it
      functions as a @UUID[Compendium.pf1.spells.Item.1i8b1v3dngkxj6jp]{magic
      circle against evil} and a
      @UUID[Compendium.pf1.spells.Item.exwa9xra4u82j0sx]{lesser globe of
      invulnerability}, both with a radius of 20 feet.</p><p>Truespeech allows
      you to speak with any creature that has a language, as though using the
      @UUID[Compendium.pf1.spells.Item.m1rmcpcaixcpz9ib]{tongues} spell.</p><hr>
  duration:
    end: turnStart
    units: minute
    value: '@item.level'
  level: 15
  scriptCalls:
    - _id: Jo9bgweZ8Szwtf3m
      category: toggle
      hidden: false
      img: icons/svg/dice-target.svg
      name: Toggle Senses and Flight
      type: script
      value: >-
        let flightType = state ? "good" :
        item.getItemDictionaryFlag("old_flight");

        if(!flightType) flightType = "average"


        if(state)
          await item.setItemDictionaryFlag("old_flight", actor.system.attributes.speed.fly.maneuverability)
        else
          await item.removeItemDictionaryFlag("old_flight")

        await actor.update({
          'system.traits.senses.ll.enabled': state,
          'system.traits.senses.dv': state ? 60 : 0,
          'system.attributes.speed.fly.maneuverability': flightType
        })
  subType: spell
type: buff
