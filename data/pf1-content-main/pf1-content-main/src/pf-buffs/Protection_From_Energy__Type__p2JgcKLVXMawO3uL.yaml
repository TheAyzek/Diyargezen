    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.1vh2ewwvzvxunoxk]{Protection From
      Energy}</p><p>This spell grants you temporary immunity to the type of
      energy specified when cast (acid, cold, electricity, fire, or sonic). When
      the spell absorbs 12 points per caster level of energy damage (to a
      maximum of 120 points at 10th level), it is discharged.</p><p>Protection
      from energy overlaps (and does not stack with)
      @UUID[Compendium.pf1.spells.Item.tkjnm3lw7ni82tag]{resist energy}. If a
      character is warded by protection from energy and resist energy, the
      protection spell absorbs damage until its power is exhausted.</p><hr>
