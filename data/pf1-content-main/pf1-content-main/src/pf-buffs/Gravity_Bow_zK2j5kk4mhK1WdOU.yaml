name: Gravity Bow
system:
  description:
    instructions: >-
      <p>Create a conditional modifier that increases <code>size</code> by
      <code>1</code> or create a secondary action with the following damage
      formula (assuming a medium creature and 1d8 damage
      dice)</p><ul><li><code>sizeRoll(1,8, @size + 1)</code></li></ul>
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.hqorwsybk8u2wrd7]{Gravity
      Bow}</p><p>Any arrow fired from a bow or crossbow you are carrying when
      the spell is cast deals damage as if one size larger than it actually is.
      For instance, an arrow fired from a Medium longbow normally deals 1d8
      points of damage, but it would instead deal 2d6 points of damage if fired
      from a gravity bow.</p><p>Only you can benefit from this spell. If anyone
      else uses your bow to make an attack the arrows deal damage as normal for
      their size.</p>
  duration:
    units: minute
    value: '@item.level'
  level: 1
  subType: spell
type: buff
