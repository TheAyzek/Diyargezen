  contextNotes:
    - target: attack
      text: Can't make AoOs vs opponents that have partial cover from you.
  description:
    value: >-
      <p>If a creature has cover, but more than half the creature is visible,
      its cover bonus is reduced to a +2 to AC and a +1 bonus on Reflex saving
      throws. This partial cover is subject to the GM‘s
      discretion.</p><hr><p><strong>Partial Cover and Attacks of
      Opportunity</strong></p><p>You can’t execute an attack of opportunity
      against an opponent with partial cover relative to
      you.</p><hr><div><p><strong>Partial Cover and Stealth
      Checks</strong></p><p>You can cannot use partial cover to make a Stealth
      check.</p></div>
  level: null
