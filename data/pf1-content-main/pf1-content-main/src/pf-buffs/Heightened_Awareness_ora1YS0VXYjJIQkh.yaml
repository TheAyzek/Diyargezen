  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.r8bhei88g6h26fp0]{Heightened
      Awareness}</p><p>You gain a +2 competence bonus on Perception checks and
      on all Knowledge checks that you are trained in.</p><p>If this spell is
