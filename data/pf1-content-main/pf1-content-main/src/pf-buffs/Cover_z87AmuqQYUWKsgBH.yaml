  description:
    value: >-
      <p>Cover grants you a +2 bonus on Reflex saves against attacks that
      originate or burst out from a point on the other side of the cover from
      you. Note that spread effects can extend around corners and thus negate
      this cover bonus.</p><hr><p><strong>Cover and Attacks of
      Opportunity</strong></p><p>You can’t execute an attack of opportunity
      against an opponent with cover relative to
      you.</p><hr><div><p><strong>Cover and Stealth Checks</strong></p><p>You
      can use cover to make a Stealth check. Without cover, you usually need
      concealment (see below) to make a Stealth check.</p><hr><p><strong>Big
      Creatures and Cover</strong></p><p>Any creature with a space larger than 5
      feet (1 square) determines cover against melee attacks slightly
      differently than smaller creatures do. Such a creature can choose any
      square that it occupies to determine if an opponent has cover against its
      melee attacks. Similarly, when making a melee attack against such a
      creature, you can pick any of the squares it occupies to determine if it
      has cover against you.</p></div>
  level: null
type: buff
