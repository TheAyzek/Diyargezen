  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.nfm6i9z9r3n2fku7]{Fire
      Shield}</p><p>Any creature striking you with its body or a handheld weapon
      deals normal damage, but at the same time the attacker takes 1d6 points of
      cold damage + 1 point per caster level (maximum +15). If the attacker has
      spell resistance, it applies to this effect. Creatures wielding melee
      weapons with reach are not subject to this damage if they attack
      you.</p><p>The flames are cool to the touch, and either blue or green. You
      take only half damage from fire-based attacks. If such an attack allows a
      Reflex save for half damage, you take no damage on a successful saving
      throw.</p>
