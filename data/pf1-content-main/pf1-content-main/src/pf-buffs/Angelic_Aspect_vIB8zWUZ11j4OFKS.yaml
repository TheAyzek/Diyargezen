  description:
    instructions: >-
      <p>Add 10 Acid and 10 Cold resistance to Energy Resistance and 5/evil to
      Damage Reduction in the Attributes tab.</p>
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.8jrtvmhydudy7fks]{Angelic
      Aspect}</p><p>You gain low-light vision, darkvision 60, resistance to acid
      10, resistance to cold 10, and DR 5/evil, and you sprout white feathered
      wings allowing you to fly at a speed of 30 feet with average
      maneuverability. In addition, your natural weapons and any weapons you
      wield are considered good-aligned for the purpose of overcoming damage
      reduction.</p><hr>
  duration:
    end: turnStart
    units: minute
    value: '@item.level'
  level: 9
  scriptCalls:
    - _id: jPwJyYrSvQ5D0FEx
      category: toggle
      hidden: false
      img: icons/svg/dice-target.svg
      name: Toggle Senses and Flight
      type: script
      value: >-
        let flightType = state ? "average" :
        item.getItemDictionaryFlag("old_flight");

        if(!flightType) flightType = "average"


        if(state)
          await item.setItemDictionaryFlag("old_flight", actor.system.attributes.speed.fly.maneuverability)
        else
          await item.removeItemDictionaryFlag("old_flight")

        await actor.update({
          'system.traits.senses.ll.enabled': state,
          'system.traits.senses.dv': state ? 60 : 0,
          'system.attributes.speed.fly.maneuverability': flightType
        })
  subType: spell
type: buff
