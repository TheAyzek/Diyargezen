name: Death Ward
system:
  contextNotes:
    - target: allSavingThrows
      text: >-
        +[[4]] Morale vs death spells and magical death effects, even if a save
        is not normally allowed.

        Immune to Energy Drain and negative energy effects (including channeled
        negative energy)
    - target: ac
      text: Ignore the penalties of negative levels, but they still remain on you.
  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.e0rlki4hwu76l5ya]{Death
      Ward}</p><p>You gain a +4 morale bonus on saves against all death spells
      and magical death effects. You are granted a save to negate such effects
      even if one is not normally allowed. You are immune to energy drain and
      any negative energy effects, including channeled negative
      energy.</p><p>This spell does not remove negative levels that you have
      already gained, but it does remove the penalties from negative levels for
      the duration of its effect.</p><p><em>Death ward</em> does not protect
      against other sorts of attacks, even if those attacks might be lethal.</p>
  duration:
    units: minute
    value: '@item.level'
  level: 7
  subType: spell
type: buff
