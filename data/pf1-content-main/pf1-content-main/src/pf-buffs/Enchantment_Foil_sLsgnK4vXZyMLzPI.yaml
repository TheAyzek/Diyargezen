img: systems/pf1/icons/skills/violet_17.jpg
name: Enchantment Foil
system:
  contextNotes:
    - target: allSavingThrows
      text: >-
        +[[4]] bonus vs Enchantment effects. If you successfully save against
        them, you identify the effects and can pretend to be under the effects.
    - target: skill.blf
      text: >-
        +[[20]] bonus if pretending to be affected by an enchantment you
        successfully saved against.
  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.gq7tigg3d1u4jyeo]{Enchantment
      Foil}</p><p>You gain a +4 bonus on saving throws against enchantment
      effects. If you succeed at a save against an enchantment effect, you
      identify the effect as if you had succeeded at a Spellcraft check to do
      so. Furthermore, you can choose to act as if you had failed your saving
      throw, gaining a +20 bonus on Bluff checks to convince others that you
      failed your save and are under the enchantment's effects. A creature that
      attempts to use magic to detect this ruse or to make you speak truthfully
      about it must succeed at a caster level check (DC 15 + your caster level)
      to do so.</p>
  duration:
    units: hour
    value: '@item.level'
  level: 7
  subType: spell
type: buff
