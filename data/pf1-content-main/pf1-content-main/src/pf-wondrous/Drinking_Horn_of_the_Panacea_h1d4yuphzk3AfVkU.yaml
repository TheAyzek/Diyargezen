name: Drinking Horn of the Panacea
system:
  aura:
    school: con
  cl: 7
  description:
    value: >-
      <p>This drinking horn is made from the highly polished tusk of some great
      beast. Etched around the rim are stylized waves and sea creatures. The
      horn typically appears empty, but once per day a creature holding it can
      command it to fill with a liquid that, when consumed, has the effect of
      one of four spells: cure serious wounds, lesser restoration, neutralize
      poison, or remove disease. Consuming a drink from the horn is a standard
      action that provokes attacks of opportunity. No matter the spell chosen,
      the drink in the horn has the appearance and honeyed fragrance of summer
      mead. If the liquid is not consumed within 1 minute or is spilled from the
      horn, its effects are
      wasted.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, cure serious wounds, lesser restoration, neutralize poison,
      remove disease</p>
