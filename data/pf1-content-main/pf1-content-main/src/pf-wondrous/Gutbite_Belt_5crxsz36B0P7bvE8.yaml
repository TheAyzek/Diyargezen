    value: >-
      <p>This heavy leather belt is reinforced with metal and detailed to
      resemble a gut wound that has sprouted teeth.</p><h3>Effect</h3><p>In
      addition to functioning as a belt of mighty constitution +2, the mouth on
      the belt animates whenever the wearer gains the grappled condition,
      damaging the wearer's opponent as if it were armor spikes (1d6 points of
      damage for a Medium wearer, 1d4 for Small). Similar to armor spikes, the
      mouth can be made into a magic weapon in its own right; it can also be
      temporarily enhanced with magic such as magic weapon. The wearer can use
      the mouth to eat meat, gaining nutrition from it as if he had eaten with
      his own mouth (the mouth refuses any food other than
      meat).</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.k9iu3d82hlo7coct]{animate objects},
      @UUID[Compendium.pf1.spells.Item.05i5rxwim12hwktu]{Bull's Strength},
      </em><strong>Cost</strong> 2,250 gp</p>
