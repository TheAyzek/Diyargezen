name: Ring of Arcane Signets
system:
  aura:
    school: uni
  cl: 8
  description:
    value: >-
      <p>The approximately 1-inch-diameter pentagon of emerald green crystal
      that dominates this otherwise plain silver ring forms itself into a
      specific rune, sigil, or similar identifying marker each time a person
      first puts it on. If the wearer expects this to occur, she can cause the
      crystal to adopt any shape she wishes. If the wearer does not expect this
      to occur, the crystal instead molds itself into an image that symbolizes
      the wearer or some dominant facet of her personality. Once the crystal
      assumes this initial form, it always takes that form whenever the same
      wearer puts on the ring. The wearer can, as a standard action, embed this
      image on any object (as if using arcane mark) simply by pressing the ring
      against it. The wearer may choose the color and other cosmetic features of
      the image each time she uses the ring. The brand is otherwise permanent
      unless removed by dispel magic, erase, or a more powerful
      spell.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, arcane mark</p>
  price: 1000
