    unidentified: >-
      <p>This stone has a rich green color, is rounded, and tapers to form a
      teardrop shape. It may have irregular facets or internal flaws.</p>
    value: >-
      <h3>Effect</h3><p>This stone grants the wearer 5 temporary hit points
      (stacking to 25 for multiple emerald ellipsoids of any kind), which are
      restored automatically at a specific time of day unique to each stone
      (typically sunrise or sunset). Each stone inflicts one negative level upon
      you (no known limit); these negative levels remain as long as the stone is
      in use, and disappear when it is no longer in use. These negative levels
      never result in actual level loss, but they cannot be overcome in any way
      while the stone is used.</p><h3>Resonance</h3><p><strong>Method 1, Fixed:
      </strong>5 additional temporary hit points.</p><p><strong>Method 2,
      Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, <em>false life</em>, creator must be 12th level
      <strong>Cost</strong> 5,000 gp</p><hr /><p><strong>Editor's note</strong>:
      the sourcebook indicates a moderate strength aura despite the item's
      Caster Level of 12</p>
