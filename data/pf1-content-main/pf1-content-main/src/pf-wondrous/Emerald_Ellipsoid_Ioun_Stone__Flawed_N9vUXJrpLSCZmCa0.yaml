    instructions: >-
      <p>You must manually add each negative level on your actor's Attributes
      tab.</p><p>If you have multiple stones which stack together, edit the
      changes tab of one to match the total allowed bonus.</p><p>Only 25% of
      cracked or flawed ioun stones grant resonant powers when placed in a
