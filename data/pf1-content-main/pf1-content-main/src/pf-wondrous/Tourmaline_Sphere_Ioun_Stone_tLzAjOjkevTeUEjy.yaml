    unidentified: >-
      <p>This spherical stone is usually black but may come in shades of green,
      blue or pink.</p>
    value: >-
      <h3>Effect</h3><p>This stone grants you a benefit only when you're dying.
      When determining the number of negative hit points you must accrue to die,
      treat your Constitution score as if it were 2 higher. This doesn't provide
      a bonus to Constitution, so it doesn't grant a bonus on checks made to
      stabilize but does provide you 2 additional rounds during which to attempt
      such checks. You can only benefit from one tourmaline sphere ioun stone at
      a time.</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>this
      stone grants a +1 bonus on Constitution checks to stabilize when
      dying.</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, <em>bear's endurance</em>, creator must be 12th level
      <strong>Cost</strong> 500 gp</p>
