    value: >-
      <p>A jar of this unguent is 3 inches in diameter and 1 inch deep, and
      contains 5 applications. Placed upon a poisoned wound or swallowed, the
      ointment detoxifies any poison (as neutralize poison with a +5 bonus on
      the check). Applied to a diseased area, it removes the disease (as remove
      disease with a +5 bonus on the check). Rubbed on a wound, the ointment
      cures 1d8+5 points of damage (as cure light
      wounds).</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
