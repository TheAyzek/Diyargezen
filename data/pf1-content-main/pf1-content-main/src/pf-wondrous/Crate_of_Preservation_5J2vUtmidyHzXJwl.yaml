  cl: 5
  description:
    value: >-
      <p>A crate of preservation stores and keeps fresh any perishable food and
      drink during transport. Cold items remain cold and hot items stay hot. The
      preservation effects function indefinitely, though foods already spoiled
      before being placed within the crate are not restored to health and vigor;
      they simply remain in their existing state of spoilage. The crate of
      preservation can hold up to 8 cubic feet of
      goods.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, endure elements, purify food and drink</p>
