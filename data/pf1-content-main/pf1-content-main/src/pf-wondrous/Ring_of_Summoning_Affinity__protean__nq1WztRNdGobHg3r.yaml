  description:
    value: >-
      <p>This ring is made from an opalescent material that is never the same
      color twice. If the wearer can cast summon monster spells, the wearer adds
      voidwormB2 to the 3rd-level list of monsters she can summon with those
      spells, adds naunetB2 to the 6th-level list, and adds imenteshB2 to the
      9th-level list. Also, once per day on command the wearer can use this ring
      to summon a voidworm, as if by the summon monster III
      spell.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, planar ally or planar binding, creator must be chaotic neutral</p>
