name: Amulet of the Spirits, Bones
system:
  aura:
    school: nec
  cl: 8
  description:
    value: >-
      <p>Each different type of amulet of the spirit grants its wearer powers
      from one type of shaman spirit bond, but makes her vulnerable to attacks
      and effects that target creatures with that spirit bond (such as a
      spirit-hunting weapon). If a creature that already has the associated
      mystery or spirit wears the amulet, that wearer does not gain the
      abilities listed below; instead, the effective level of her mystery or
      spirit powers increases by 2. This effect does not stack with other
      abilities that increase the effective level of mystery or spirit powers.  
      Bones: This amulet is a necklace made of petrified bones. Once per day as
      a swift action, the wearer can activate a bone ward, which causes a group
      of flying bones to encircle her, granting her a +2 deflection bonus to AC
      for 8 rounds. In addition, once per day as a swift action the wearer can
      target a creature within 30 feet, causing it to become frightened for 1
      round (Will DC 13 negates). Moderate necromancy; CL 8th; Craft Wondrous
      Item, entropic shield,
      scare.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item,  entropic shield, scare, creator must be a shaman with the
      appropriate spirit</p>
