name: Ring of Summoning Affinity (qlippoth)
system:
  aura:
    custom: true
    school: conjuration [chaos evil]
  cl: 5
  description:
    value: >-
      <p>This ring has an odd, disquieting texture that always reveals greater
      layers of complexity the more closely it is examined. If the wearer can
      cast summon monster spells, the wearer adds cythnigotB2 to the 3rd-level
      list of monsters he can summon with those spells, adds shoggtiB2 to the
      6th-level list, adds nyogothB2 to the 7th-level list, adds chernobueB2 to
      the 8th-level list, and adds augnagarB2 to the 9th-level list. Also, once
      per day on command the wearer can use this ring to summon a cythnigot, as
      if by the summon monster III
      spell.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, planar ally or planar binding, creator must be chaotic evil</p>
