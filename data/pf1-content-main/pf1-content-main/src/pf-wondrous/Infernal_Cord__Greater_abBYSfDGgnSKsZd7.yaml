name: Infernal Cord, Greater
system:
  aura:
    school: trs
  changes:
    - _id: PYFlrhDU
      formula: '4'
      target: con
      type: enh
  cl: 8
  contextNotes:
    - target: ac
      text: >-
        Whenever you are critically hit you gain fast healing 4 for 1 minute.
        This ability doesn't trigger if the critical hit deals only nonlethal
        damage. Damage caused by silver weapons, good-aligned weapons, or spells
        or effects with the good descriptor doesn't trigger the fast healing and
        suppresses the fast healing for 1 round if it's already active.
    - target: allSavingThrows
      text: >-
        You can be detected as though she were an evil cleric and this belt
        imparts 1 negative level to any nonevil creature that wears it until the
        belt is removed.
  description:
    unidentified: >-
      <p>This thick hide belt is scarred with impressions of fiendish visages,
      some of these show a scowl and some a smile.</p>
    value: >-
      <h3>Effect</h3><p>This item functions as an
      @UUID[Compendium.pf-content.pf-wondrous.Item.paMIrrYlzEvVPTB3]{infernal
      cord}, but it grants a +4 enhancement bonus to Constitution, and the fast
      healing effect increases to fast healing 4. Treat the Constitution bonus
      as a temporary ability bonus for the first 24 hours the belt is worn. The
      wearer can be detected as though she were an evil cleric, not just an evil
      creature.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.usdv1eqvibmxun6x]{bear's endurance},
      @UUID[Compendium.pf1.spells.Item.ny2qxht2aeesoi08]{greater infernal
      healing} </em><strong>Cost</strong> 15,500 gp</p>
