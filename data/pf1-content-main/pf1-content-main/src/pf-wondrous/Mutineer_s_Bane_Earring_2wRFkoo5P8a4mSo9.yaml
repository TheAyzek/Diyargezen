name: Mutineer's Bane Earring
system:
  aura:
    school: div
  cl: 7
  description:
    value: >-
      <p>This magic earring grows warm whenever a ship's crew begins muttering
      of mutiny, granting the wearer of a mutineer's bane earring a +5 bonus on
      all Sense Motive checks made while on a ship under such conditions of poor
      morale.  A mutineer's bane earring has additional effects if worn by a
      commodore or admiral. If worn by a commodore, that commodore's squadron
      gains a +3 bonus on morale checks in fleet battles. If worn by an admiral,
      all squadrons in the admiral's fleet gain a +1 bonus on morale checks in
      fleet battles.<h3>Requirements</h3><p>Craft Wondrous Item, detect
      thoughts</p>
