  description:
    value: >-
      <p>This smoked glass sphere contains a roiling, bone-white mist. The
      sphere counts as a thrown weapon with a range increment of 10 feet. It
      shatters on impact, releasing the contained vapors in a 10- foot cloud of
      mist, as per fog cloud, for 1 round. Any creature that enters the mist
      during this time must succeed at a DC 17 Fortitude save or contract a
      particularly fast-acting strain of bubonic plague with an immediate
      onset.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, contagion, fog cloud</p>
