name: One-Way Window
system:
  aura:
    school: div
  cl: 3
  description:
    value: >-
      <p>When not in use, this magical device appears to be a simple wooden
      picture frame about 3 inches by 5 inches in size. When set against a solid
      surface, it becomes a window, allowing the user to see through to the
      other side. No visible evidence of the window appears on the opposite side
      of the surface. No items, light, sound, spells, or spell effects can pass
      through the window, and divination magic that allows the user to penetrate
      illusions or spot hidden things (such as true seeing) doesn't function. If
      there is no ambient light in the area being viewed, it appears as complete
      darkness to the viewer. The window can penetrate up to 1 foot of wood, 6
      inches of stone, or 1 inch of metal, but even a thin layer of lead blocks
      the effect. If the surface to be looked through is too thick, the frame
      doesn't function. It can't be used to peer at mechanical structures behind
      thin veneers (such as the tumblers of a lock); it functions only when an
      open space lies beyond the barrier it is placed
      against.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, clairaudience/clairvoyance</p>
