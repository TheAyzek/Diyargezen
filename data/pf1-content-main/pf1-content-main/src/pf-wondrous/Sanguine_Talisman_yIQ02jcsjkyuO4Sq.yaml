name: Sanguine Talisman
system:
  aura:
    school: con
  cl: 13
  description:
    value: >-
      <p>In actuality a broad type of devil talisman, these blasphemous baubles
      offer diabolical protection and might summon any type of devil, from a
      lowly lemure to a potent greater devil. The power of a sanguine talisman
      hinges on the force of will of the devil bound within; this devil can
      grant the wearer advice, infernal protection, or an occasional ally.  All
      sanguine talismans grant the wearer a profane bonus to his Armor Class
      equal to 1 plus an additional 1 for every 5 Hit Dice the devil bound to
      the talisman has (maximum bonus of +5). In addition, the wearer of a
      sanguine talisman shares a telepathic bond with the bound devil for as
      long as he wears the magic item. A bound devil can sense its surroundings
      through the talisman and can advise its wearer as it pleases. The devil is
      under no compulsion to obey the wearer or speak the truth to him-though
      some devils might lie and tell the wearer they are doing so. Finally, once
      per day the talisman wearer can attempt an opposed Charisma check against
      the bound fiend to summon a physical manifestation of the devil. If the
      wearer succeeds at this opposed check, the devil is brought forth to serve
      the caster as per the spell summon monster for a number of rounds equal to
      the bound devil's CR. If the wearer fails this check, the devil refuses to
      be called forth and no other check to summon it can be attempted until the
      next day.  The price of a sanguine talisman varies depending on the might
      of the devil bound within, equaling the bound devil's CR x 13,500 gp.  For
      example, consider a sanguine talisman that binds a bearded devil. Wearing
      the talisman grants a +2 profane bonus to Armor Class and grants a
      telepathic bond with the devil bound within. Once per day, the wearer can
      attempt a Charisma check opposed by the devil's Charisma check (its
      Charisma modifier is +0) to summon it forth for 5 rounds, as per summon
      monster. The particular bearded devil bound within this sanguine talisman
      is known as Kalvaddas the Strangler. He is a blunt sadist with a love of
      hand-to-hand brawls and throttling elves. He knows much of liars and might
      use his Sense Motive skill to aid a master he
      favors.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item; gate, greater planar binding, lesser planar binding, or
      planar binding</p>
