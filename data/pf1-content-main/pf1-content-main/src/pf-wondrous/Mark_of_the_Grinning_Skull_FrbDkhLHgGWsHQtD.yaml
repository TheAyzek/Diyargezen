name: Mark of the Grinning Skull
system:
  aura:
    school: nec
  cl: 8
  description:
    value: >-
      <p>An ebony skull adorns this tarnished silver band. When the wearer
      successfully demoralizes a creature with an Intimidate check, the
      penalties for being shaken increase by 2 on checks and rolls involving the
      wearer. For example, attacks made against the wearer and saves against her
      spells would take a -4 penalty rather than a -2 penalty.  11th Level: Once
      per day, the wearer can attempt to frighten a creature with an Intimidate
      check instead of demoralizing it. She must declare she is doing so before
      attempting the Intimidate check. The penalty increase for checks and rolls
      involving the wearer also applies if the creature is frightened in this
      way.  14th Level: The wearer can attempt to demoralize opponents as a move
      action instead of as a standard action. If the wearer can already do so
      because of the intimidating glare barbarian power or a similar ability,
      she can instead demoralize opponents as a swift
      action.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, cause fear, doom</p>
