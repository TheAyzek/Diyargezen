  description:
    instructions: >-
      <p>Update the context note on the changes tab of this item to reflect the
      chosen check type. This check type is chosen when the stone is created.
      Delete those that do not apply.</p><p>Only 25% of cracked or flawed ioun
      stones grant resonant powers when placed in a wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
      about Ioun Stones}</p>
    unidentified: >-
      <p>A red and green stone with a convex top and a flat bottom. Most are
      elliptical or tear-shaped.  A crack mars its surface.</p><p></p>
    value: >-
      <h3>Effect</h3><p>This stone grants a +4 bonus on one type of check
      affected by the Endurance feat.</p><h3>Resonance</h3><p><strong>Method 1,
      Fixed: </strong>+5 bonus on Constitution checks made to
      stabilize.</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, <em>bull's strength, cat's grace</em>, creator must
      be 12th level <strong>Cost</strong> 5,000 gp</p><hr /><p><strong>Editor's
      note</strong>: The Item description in the sourcebook indicates an untyped
      bonus. A chart elsewhere in the same source indicates a competence
      bonus.</p>
