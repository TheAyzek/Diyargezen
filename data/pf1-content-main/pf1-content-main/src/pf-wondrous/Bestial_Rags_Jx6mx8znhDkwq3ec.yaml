name: Bestial Rags
system:
  aura:
    school: trs
  cl: 10
  description:
    instructions: >-
      <p>This Item is keyed to one of the 30 valid shifter aspects and that
      choice is made at the time of creation and doesn't change. You can add the
      chosen aspect as a supplement on the links tab of this item. Manually
      adjust value on the actor  or aspect to match the chosen aspect.</p>
    unidentified: >-
      <p>This is a tattered and ragged garment made of hide bearing crude
      pictograms.</p>
    value: >-
      <h3>Effect</h3><p>These tattered and ragged garments extend the duration
      of a shifter’s bestial transformations, allowing her to shift into her
      aspects’ minor forms for 5 additional minutes per day. Each set of bestial
      rags is also tied to a specific aspect, typically being made of the hide
      of that creature and embossed with crude pictograms of it, allowing a
      shifter to assume that aspect’s minor and major form, as appropriate for
      her level. If the shifter already has the ability to shift into that form,
      that aspect’s major form functions as if she were 2 levels
      higher.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.774kmgcb7ygviht0]{beast shape II}
      </em><strong>Cost</strong> 4,000 gp</p>
