  description:
    value: >-
      <p>This special ring comes in four varieties, all of them useful only to
      arcane spellcasters. The wearer's arcane spells per day are doubled for
      one specific spell level. A ring of wizardry I doubles 1st-level spells, a
      ring of wizardry II doubles 2nd-level spells, a ring of wizardry III
      doubles 3rd-level spells, and a ring of wizardry IV doubles 4th-level
      spells. Bonus spells from high ability scores or school specialization are
      not doubled.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Forge Ring, limited wish</p>
