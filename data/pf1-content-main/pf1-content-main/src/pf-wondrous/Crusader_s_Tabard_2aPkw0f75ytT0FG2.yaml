    value: >-
      <p>A crusader's tabard is a sturdy cloth vestment worn over armor and
      other clothing. It is normally decorated with the symbol or heraldic
      device of the owner, and may be trimmed with expensive and delicate
      materials (such as silk, fur, or cloth of gold).</p><h3>Effect</h3><p>Once
      per day, the wearer of the tabard may say its command word (often a family
      motto); thereafter, the wearer can spend a standard action (instead of a
      full-round action) to move up to his speed and make a single charge
      attack. This ability lasts until used or for 1 minute, whichever duration
      is shorter.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.s9amdo5398alb5p0]{haste}
      </em><strong>Cost</strong> 3,000 gp</p>
