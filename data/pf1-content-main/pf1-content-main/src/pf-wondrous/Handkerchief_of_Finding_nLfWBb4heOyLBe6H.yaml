  description:
    value: >-
      <p>The bearer of this elegant, perfumed handkerchief can attune the
      handkerchief to himself by keeping it in his possession for 1 week. Once
      the handkerchief is attuned to a bearer, the bearer can always sense in
      what direction the handkerchief is, as long as it is on the same plane. A
      bearer unaware of the handkerchief's power cannot attune to
      it.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, locate object</p>
