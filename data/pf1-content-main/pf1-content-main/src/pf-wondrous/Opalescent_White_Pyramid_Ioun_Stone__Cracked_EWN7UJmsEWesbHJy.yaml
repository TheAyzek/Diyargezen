  cl: 12
  description:
    instructions: >-
      <p>The keyed weapon type is chose at the time of the stone's creation.  if
      your actor has proficiency in martial weapons, you can update the Details
      tab of this item&gt;Granted Proficiencies&gt;Weapon Proficiencies to
      reflect the selected weapon type.</p><p>Only 75% of normal ioun stones
      grant resonant powers when placed in a wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
      about Ioun Stones}</p>
    unidentified: >-
      <p>A lustrous white stone with a cone-like shape with a point at one end,
      a flat base, and long facets connecting the two. Typical pyramids have
      three or four-sided bases, but some have a dozen or more. A crack mars its
      surface.</p>
    value: >-
      <h3>Effect</h3><p>The stone grants the wearer weapon familiarity with the
      keyed weapon (it is treated as a martial weapon for
      him).</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>Weapon
      Focus with the stone’s keyed weapon.</p><p><strong>Method 2,
      Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, <em>transformation</em> or proficiency in the
      appropriate weapon, creator must be 12th level <strong>Cost</strong> 750
      gp</p>
