  description:
    value: >-
      <p>This ring is made of intricately marked brass. If the wearer can cast
      summon monster spells, the wearer adds tripurasuraB3 to the 3rd-level list
      of monsters he can summon with those spells, adds adhukaitB3 to the
      6th-level list, adds upasundaB3 to the 7th-level list, and adds aghasuraB3
      to the 8th-level list. Also, once per day on command the wearer can use
      this ring to summon a tripurasura, as if by the summon monster III
      spell.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, planar ally or planar binding, creator must be lawful evil</p>
