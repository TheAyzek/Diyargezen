  description:
    value: >-
      <p>This reversible silken mask is flat white on one side and a swirling
      mass of colors above a black background on the other.  When worn with the
      white side out, it allows the wearer to use detect magic once per day.
      When worn with the black side out, it allows the wearer to use read magic
      once per day. If Nethys is your patron, you can use the black side of the
      mask to cast magic missile as a 3rd-level caster once per day. Likewise,
      you can use the white side of the mask to cast disguise self once per
      day.</p><h3>Requirements</h3><p>Craft Wondrous Item, detect magic,
      disguise self, magic missile, read magic</p>
