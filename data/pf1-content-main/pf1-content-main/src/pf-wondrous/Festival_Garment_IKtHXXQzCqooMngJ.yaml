  description:
    unidentified: <p>This garment appears to be suitable to be worn in a local festival.</p>
    value: >-
      <p>These magical sets of clothing can take many forms. In Segada, notable
      examples range from the ornate costumes of the Festival of Flowers to the
      flamboyant, birdlike costumes of the Waning Light Festival. When a wearer
      of a festival garment dances, he can get onlookers into a festive,
      celebratory mood.</p><h3>Effect</h3><p>A wearer of a festival garment can
      attempt a Perform (dance) check instead of a Diplomacy check to influence
      the attitude of a humanoid creature, but only if the creature’s initial
      attitude is unfriendly or better. In addition, if the wearer is at a
      festival or celebration, he gains a +5 competence bonus on Perform (dance)
      checks.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.tjog6bufg5b08lvq]{charm person}
      </em><strong>Cost</strong> 1,000 gp</p>
