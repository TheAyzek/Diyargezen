name: Toothpick of Pyrotechnics
system:
  aura:
    school: evo
  cl: 3
  description:
    value: >-
      <p>This wooden toothpick is useful for creating flashy diversions on stage
      or in a fight. Breaking the toothpick causes a blinding flash and a dark
      cloud of smoke to appear. Creatures other than the user within 20 feet
      must succeed at a DC 13 Fortitude save or be blinded for 1d4+1 rounds. The
      cloud of smoke spreads 20 feet in all directions, obscures all sight
      (including darkvision), and lasts for 3
      rounds.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, pyrotechnics</p>
