    unidentified: <p>A clear prism with 10 or more sides.</p>
    value: >-
      <h3>Effect</h3><p>Sustains creature without food or
      water.</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>The
      wearer can cast protection from
      @UUID[Compendium.pf1.spells.Item.md6ltvqh9paadsm4]{Chaos}/@UUID[Compendium.pf1.spells.Item.skgjjub1hng29nwo]{Evil}/@UUID[Compendium.pf1.spells.Item.71g6nmvy8qnodwyz]{Good}/@UUID[Compendium.pf1.spells.Item.ekhygw5fzfe52n35]{Law}
      on himself once per day (CL 12th). He can activate this ability as an
      immediate action, but doing so drains the ioun stone of its magic, turning
      it into a dull gray ioun stone.</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, creator must be 12th level <strong>Cost</strong>
      2,000 gp</p><hr /><p><strong>Editor's note</strong>: There is text
      conflict between Seeker of Secrets (SOS) and Adventurer's Guide (AG) for
      the method 1 resonance. AG text is above, SOS text is as follows:
      <em>Protection from possession and mental control (as protection from
      evil)</em>.</p>
