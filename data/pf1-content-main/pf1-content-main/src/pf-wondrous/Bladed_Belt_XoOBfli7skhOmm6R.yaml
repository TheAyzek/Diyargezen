      <p>Rather than being made of one continuous line of material, this belt
      consists of many bits of tanned leather joined together by thick metal
      studs.</p><h3>Effect</h3><p>On command, the belt's wearer can transform
      the belt into a single masterwork slashing and/or piercing melee weapon of
