  description:
    value: >-
      <p>This light, brightly-colored scarf makes the wearer seem larger than
      life. He gains a +5 competence bonus on Intimidate and Perform (dance)
      checks.  If the wearer rightfully owns a kapenia and wears it at the same
      time as the scarf, he can glimpse memories of the history traced by the
      Varisian people in their kapenias and folktales. He gains a +5 competence
      bonus on Knowledge (history) checks and can attempt any Knowledge
      (history) check
      untrained.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item; creator must have 5 ranks in Intimidate, Knowledge
      (history), and Perform (dance); creator must be a Varisian</p>
