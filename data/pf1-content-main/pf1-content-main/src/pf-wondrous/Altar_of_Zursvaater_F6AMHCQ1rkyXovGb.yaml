  description:
    value: >-
      <p>This huge brazier burns with a raging fire. Any creature (not just a
      worshiper of Zursvaater) can pray at the altar, though accepting the
      altar's blessing is both an evil and lawful act. Praying at the altar
      grants a +2 circumstance bonus on Craft checks and cold resistance 20 for
      24 hours. The cold resistance is suppressed if the target of the effect
      leaves the temple grounds, but resumes if the target
      returns.<h3>Requirements</h3><p>Craft Wondrous Item, guidance, magic
      circle against chaos, magic circle against good, resist energy, creator
      must worship Zursvaater</p>
