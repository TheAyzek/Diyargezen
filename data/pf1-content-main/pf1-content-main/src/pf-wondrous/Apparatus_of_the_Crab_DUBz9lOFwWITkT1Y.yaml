name: Apparatus of the Crab
system:
  aura:
    custom: true
    school: evocation and transmutation
  cl: 19
  description:
    value: >-
      <p>An apparatus of the crab is a metallic magical vehicle. When
      unoccupied, it appears to be a large, sealed iron barrel big enough to
      hold two Medium creatures. Close examination, and a DC 20 Perception
      check, reveals a secret catch that opens a hatch at one end. Anyone who
      crawls inside finds 10 (unlabeled) levers and seating for two Medium or
      Small occupants. These levers allow those inside to activate and control
      the apparatus's movements and actions.  LEVER (1d10) LEVER FUNCTION 1
      Extend/retract legs and tail 2 Uncover/cover forward porthole 3
      Uncover/cover side portholes 4 Extend/retract pincers and feelers 5 Snap
      pincers 6 Move forward/backward 7 Turn left/right 8 Open/close eyes with
      continual flame inside 9 Rise/sink in water 10 Open/close hatch  Operating
      a lever is a full-round action, and no lever may be operated more than
      once per round. However, since two characters can fit inside, the
      apparatus can move and attack in the same round. The device can function
      in water up to 900 feet deep. It holds enough air for a crew of two to
      survive 1d4+1 hours (twice as long for a single occupant).  When active,
      an apparatus of the crab has the following characteristics: hp 200;
      hardness 15; Speed 20 ft., swim 20 ft.; AC 20 (-1 size, +11 natural);
      Melee 2 pincers +12 (2d8); CMB +14; CMD
      24.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, animate objects, continual flame, creator must have 8 ranks
      in Knowledge (engineering)</p>
