name: Escape Ladder
system:
  aura:
    school: trs
  cl: 7
  description:
    value: >-
      <p>This 10-foot long rope ladder unrolls itself on command, extending
      upward into the air and magically holding itself in place. The ends of
      each rope have small loops for tying to another rope, a grappling hook, a
      piton, or similar fixtures. A second command word makes the ladder roll
      itself again, pulling itself toward whichever end the speaker is touching.
      Climbing the ladder is a DC 0 Climb check. The ladder can hold up to 300
      pounds if holding itself in the air, or 600 pounds if attached to a sturdy
      surface.   A third command word creates an extradimensional space at the
      top of the ladder that is identical to rope trick, except it only holds up
      to one Medium creature and has a very short duration. When a creature
      enters the extradimensional space, at the end of the creature's turn the
      space collapses and the creature is transported as though by dimension
      door 1d6 x 100 feet away in a random direction to a safe, ground-level
      location. The ladder remains behind and falls to the ground when this
      power is used. The third command word may be used once per
      day.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, animate rope, dimension door, rope trick</p>
