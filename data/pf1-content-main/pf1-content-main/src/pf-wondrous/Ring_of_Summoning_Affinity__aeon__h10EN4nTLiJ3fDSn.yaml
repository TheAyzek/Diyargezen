  description:
    value: >-
      <p>This ring is forged from black iron and shining silver. If the wearer
      can cast summon monster spells, he adds paracletusB2 to the 3rd-level list
      of monsters he can summon, adds theletosB2 to the 6th-level list, and adds
      akhanaB2 to the 9th-level list. Also, once per day the wearer can use this
      ring to summon a paracletus, as if by summon monster
      III.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge Ring,
      planar ally or planar binding, creator must be neutral with no other
      alignment components</p>
