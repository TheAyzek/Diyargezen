name: Amulet of the Spirits, Waves
system:
  aura:
    custom: true
    school: conjuration and illusion
  cl: 8
  description:
    value: >-
      <p>Each different type of amulet of the spirit grants its wearer powers
      from one type of shaman spirit bond, but makes her vulnerable to attacks
      and effects that target creatures with that spirit bond (such as a
      spirit-hunting weapon). If a creature that already has the associated
      mystery or spirit wears the amulet, that wearer does not gain the
      abilities listed below; instead, the effective level of her mystery or
      spirit powers increases by 2. This effect does not stack with other
      abilities that increase the effective level of mystery or spirit
      powers.    Waves: This amulet is a small conch hanging from a cord of
      woven seaweed. Once per day as a swift action, the wearer can activate a
      ward of mist, granting herself concealment as the blur spell. The mist
      dissipates after it causes two attacks to miss because of concealment or
      after 1 minute, whichever comes first. In addition, as a swift action once
      per day the wearer can cause one creature within 30 feet to become more
      susceptible to the sapping powers of cold for 1 minute. When a creature
      takes cold damage while under this effect, it is entangled for 1 round. If
      the creature takes cold damage while already entangled by this effect, the
      duration of the entangled condition increases by 1 round. Moderate
      illusion; CL 8th; Craft Wondrous Item, blur, chill
      touch.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, blur, chill touch, creator must be a shaman with the
      appropriate spirit</p>
