name: Talisman, Lesser Hamsa
system:
  aura:
    school: abj
  cl: 13
  description:
    value: >-
      <p>Each of these amulets is imbued with magic that allows it to protect
      its wearer against a very specific danger. A talisman triggers
      automatically as soon as the listed condition is fulfilled. Although
      talismans occupy the neck slot, up to three talismans can be worn on one
      cord or chain. Wearing multiple talismans in this way offers a greater
      variety of protection, but a wearer can benefit from only one talisman's
      effect at a time. If another talisman would be triggered while its wearer
      is under the effect of another talisman, that talisman is not triggered
      and can still be used later.  A lesser talisman carries only enough
      magical energy to protect its wearer once, after which it crumbles to
      dust.  Hamsa Talisman: A stern eye adorns the palm of this hand-shaped
      clay talisman. When the wearer fails a saving throw against a witch's hex,
      a spell or spell-like ability with the curse descriptor, or a hag's
      supernatural ability, he can attempt a second saving throw. If he succeeds
      at the second saving throw, the creature that targeted him must succeed at
      a saving throw using the same DC or suffer the effect. The talisman has no
      effect on spells and effects that don't allow a saving throw. Strong
      abjuration; CL 13th; remove curse, spell
      turning.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, remove curse, spell turning</p>
