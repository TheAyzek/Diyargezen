name: Witness Hunter's Ring
system:
  aura:
    school: div
  cl: 7
  description:
    value: >-
      <p>This ring's deep red stone hides the image of an eye within an eye or
      the symbol of a secret society, since many secret societies create these
      rings to protect their most important agents and leaders. By concentrating
      on the ring as a move action, the wearer learns whether he is being
      observed and whether it is by one or by more than one creature. Once per
      day, the wearer can use locate creature on command to target creatures
      that are currently observing him. In addition, the wearer can cast detect
      scrying once per day on
      command.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, detect scrying, locate creature</p>
