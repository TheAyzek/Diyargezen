  description:
    value: >-
      <p>This amulet is a small crystal at the end of a simple leather thong. It
      glows brightly from within, shedding light equivalent to that of a torch.
      Once per day, the amulet's bearer can clutch the object and call for help.
      Doing so immediately contacts the three closest Duskwardens and gives them
      intimate knowledge of the pendant's location, as per the locate object
      spell, out to a distance of a mile.<h3>Requirements</h3><p>Craft Wondrous
      Item, light, locate object</p>
