name: Gloves of Arcane Striking
system:
  aura:
    school: trs
  cl: 1
  description:
    value: >-
      <p>These soft leather gloves are decorated with even rows of mithral
      rivets. Only a spellcaster with the Arcane Strike feat can activate their
      abilities. These abilities are as follows.   • When the wearer uses the
      aid another action to improve an ally's attack roll, the ally adds the
      wearer's Arcane Strike damage bonus to its damage roll for that attack.  
      • When the wearer makes an attack using Arcane Strike and hits, enemies
      adjacent to the target take damage equal to the wearer's Arcane Strike
      damage bonus. This damage is of the same type as the weapon's damage
      (bludgeoning, piercing, and so on).   • When the wearer uses the aid
      another action to improve an ally's Armor Class, the ally also adds the
      wearer's Arcane Strike damage bonus to his AC against the
      opponent.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, Arcane Strike, magic weapon</p>
