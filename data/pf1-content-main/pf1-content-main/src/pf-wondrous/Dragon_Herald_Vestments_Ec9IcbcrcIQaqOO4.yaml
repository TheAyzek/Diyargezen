  aura:
    school: abj
  cl: 3
  description:
    instructions: >-
      <p>The decision regarding scale color, and type of energy reisted, is made
      at the time of crafting. You must update your actor with the related
      energy resistance manually. Kobolds may also have a second
      color/resistance type to match their scale color but only one applies at a
      given time.</p>
    unidentified: <p>This garment is is covered in scales.</p>
    value: >-
      <h3>Effect</h3><p>A set of dragon herald vestments is covered in scales of
      one of five different colors, and grants resist energy 5 of one type (as
      the resist energy spell) to the wearer: acid for black or green,
      electricity for blue, fire for red, or cold for white. If the wearer is a
      kobold with scales matching one of those five colors, she can speak a
      command word in Draconic to change the vestments' scales to the same color
      as her own, or back to the color chosen when the vestments were
      constructed. Altering the scales' color is a standard action that provokes
      attacks of
      opportunity.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.4hNO4OAWYF5vXphH]{Craft Magic Arms and
      Armor} , <em>@UUID[Compendium.pf1.spells.Item.tkjnm3lw7ni82tag]{resist
      energy} </em><strong>Cost</strong> 15,000 gp</p><p><strong>Editor's
      note</strong>: the source book indicates that the crafting feat required
      is but this appears to be in all other ways a wondrous item which would
      require @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous
      Item} instead.</p>
