name: Vest of Eldritch Preservation
system:
  aura:
    school: abj
  cl: 9
  description:
    value: >-
      <p>Woven of aranea silk, this vest grants potent protection against spells
      that would warp the wearer's mind or body. Its wearer gains a +2 bonus on
      saving throws against curses, enchantments, and transmutations.  11th
      Level: Once per day, the wearer can remove the shaken or sickened
      condition from himself or an ally with a touch. This is a standard action,
      or a swift action if he cures himself. In addition, the wearer can't be
      compelled to keep a cursed item. This doesn't prevent the cursed item's
      effects, but does allow the wearer to freely discard the item.  13th
      Level: Once per day as an immediate action, the wearer can use break
      enchantment against an effect that has just taken hold of him, even if the
      effect causes him to lose consciousness or control of his actions. Only a
      single effect can be targeted by this use of break enchantment. This
      protection can be recharged by casting break enchantment on the vest. 
      15th Level: The conditions the wearer can remove with a touch now also
      include cursed (as remove curse), dazed, and
      frightened.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, break enchantment</p>
