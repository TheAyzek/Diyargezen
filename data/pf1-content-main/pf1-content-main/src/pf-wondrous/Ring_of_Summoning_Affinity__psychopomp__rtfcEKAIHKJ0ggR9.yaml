name: Ring of Summoning Affinity (psychopomp)
system:
  aura:
    school: con
  cl: 5
  description:
    value: >-
      <p>This silver ring is marked with a skull emblem. If the wearer can cast
      summon monster spells, the wearer adds nosoiB4 to the 3rd-level list of
      monsters he can summon with those spells, adds catrinaB4 to the 4th-level
      list, adds vanthB4 to the 6th-level list, and adds morrignaB4 to the
      9th-level list. Also, once per day on command the wearer can use this ring
      to summon a nosoi, as if by the summon monster III
      spell.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, planar ally or planar binding, creator must be neutral with no other
      alignment components</p>
