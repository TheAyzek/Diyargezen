name: Bell of Returning Spirits
system:
  aura:
    school: con
  cl: 7
  description:
    value: >-
      <p>This ancient bronze hand bell has an ivory handle, and simple
      pictograms of animals are etched onto its exterior. Once per day on
      command, the user can ring the bell to summon his familiar to his side, as
      long as the familiar is within 100 feet of the user. This ability is the
      equivalent of a spell of a level equal to one-third the user's level. The
      familiar immediately appears in a space of the user's choice adjacent to
      him.  If the user's familiar is dead, this ability can be used summon its
      spirit back from beyond the grave. This functions as a raise dead spell,
      but can target only the user's familiar. The familiar doesn't need to be
      touched to accomplish this, though it must be within 100 feet. Any
      negative levels the familiar gains as a result of being raised are
      automatically removed at the rate of 1 per day, and any lost Constitution
      is automatically restored at the rate of 1 point per day. Once the bell
      has been used to raise a familiar, it transforms into inert clay and loses
      all of its magic
      abilities.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, raise dead, summon nature's ally</p>
