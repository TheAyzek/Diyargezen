  description:
    instructions: >-
      <p>Update the Details tab of this item&gt;Granted Proficiencies&gt;Weapon
      Proficiencies to reflect the selected weapon type.</p><p>Only 75% of
      normal ioun stones grant resonant powers when placed in a wayfinder.
