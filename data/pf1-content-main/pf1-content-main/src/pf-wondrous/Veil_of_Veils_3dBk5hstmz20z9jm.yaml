  description:
    value: >-
      <p>This fine silken veil can change color or alter its appearance to a
      highwayman's mask or similar cloth face covering. Once per day, the wearer
      can use disguise self, though the veil remains visible as some kind of
      garment on the wearer's head or face.  If Sivanah is the wearer's patron,
      once per day the wearer can use blur. In addition, the wearer gains a +2
      competence bonus on Bluff
      checks.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, blur, disguise self, creator must have 5  ranks in
      Bluff</p>
