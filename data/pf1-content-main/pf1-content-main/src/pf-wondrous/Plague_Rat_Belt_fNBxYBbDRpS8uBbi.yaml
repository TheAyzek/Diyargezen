    value: >-
      <h3>Effect</h3><p>This belt grants its wearer a +2 enhancement bonus to
      Constitution. Treat this as a temporary ability bonus for the first 24
      hours the belt is worn. Also, as an immediate action three times per day,
      the wearer can call upon the belt to reroll a saving throw made to resist
      a disease or poison. The wearer must use the second roll, even if it is
      worse.</p><h3>Construction</h3><p><strong>Requirements</strong>
