  description:
    value: >-
      <p>This small container features a stone base with a glass cover. The
      container can hold half a pound of flesh or similar organic matter,
      preserving it for up to 24 hours. On command, the container emanates the
      smell of the contained material out to a 100-foot radius. Additionally,
      the container lets out a cry every minute, imitating that of an injured
      member of the variety of the flesh within the container. This cry can be
      clearly heard up to 150 feet from the
      container.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, gentle repose, major image</p>
