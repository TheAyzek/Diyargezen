  description:
    instructions: >-
      <p>This stone is set to modify Strength. Any changes to the modified score
      must be done manually on the details tab of this item by editing the
      change target.</p><p>Only 25% of cracked or flawed ioun stones grant
      resonant powers when placed in a wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
      about Ioun Stones}</p>
    unidentified: >-
      <p>This is a reddish purple stone is in a regular shape with the top and
      bottom ends having the same number of sides (such as a hexagram). The
      width and angle of each side is usually equal.  It may have irregular
      facets or internal flaws.</p>
    value: >-
      <h3>Effect</h3><p>This stone functions as a normal
      @UUID[Compendium.pf-content.pf-wondrous.Item.i9yuzvI866Lckypd]{magenta
      prism ioun stone} that has 4 charges. Changing the ability score modified
      uses 1 charge, and the stone loses the ability to change when reduced to 0
      charges, though it still grants a bonus to the ability score to which it
      was last changed.</p><h3>Resonance</h3><p><strong>Method 1, Fixed:
      </strong>+1 bonus on one saving throw not modified by the ability score
      the stone is currently attuned to (chosen at the same time as the ability
      score).</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, <em>bear's endurance, bull's strength, cat's grace,
      eagle's splendor, fox's cunning, owl's wisdom</em>, creator must be 12th
      level <strong>Cost </strong>6,000 gp</p>
