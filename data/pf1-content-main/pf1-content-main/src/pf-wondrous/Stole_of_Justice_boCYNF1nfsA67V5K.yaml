name: Stole of Justice
system:
  aura:
    school: div
  cl: 5
  description:
    value: >-
      <p>This long stole of unrelenting black is marked on one end with golden
      scales and the other with the embroidered image of hooded justice. The
      wearer gains a +5 competence bonus on Sense Motive checks and can create a
      zone of truth for up to 5 minutes per day; these rounds need not be
      consecutive. When the wearer uses detect chaos, detect evil, detect good,
      or detect law, at the beginning of her next turn after casting she gains
      information as if she had concentrated for 3 full rounds. Finally, if the
      wearer is an inquisitor, when using her judgment she receives a bonus on
      Perception checks and her combat maneuver defense as if she were wielding
      a jurist weapon.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, zone of truth, creator must have 5 ranks of Sense
      Motive</p>
