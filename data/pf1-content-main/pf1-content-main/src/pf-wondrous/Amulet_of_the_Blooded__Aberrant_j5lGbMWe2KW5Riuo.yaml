name: Amulet of the Blooded, Aberrant
system:
  aura:
    school: ill
  cl: 9
  description:
    value: >-
      <p>Each different type of amulet of the blooded grants its wearer powers
      from one sorcerer bloodline, but makes him vulnerable to attacks and
      effects that target creatures with the appropriate bloodline (such as a
      blood-hunting weapon). If a creature that already has the associated
      bloodline wears the amulet, the wearer does not gain the abilities listed
      below; instead, the effective level of his bloodline powers increases by
      2. This effect does not stack with other abilities that increase the
      effective level of bloodline powers.   Aberrant: This chunk of pitch-black
      onyx is suspended on a chain of silver. Strange whorls and tentacle-like
      shapes are etched upon its surface. The wearer gains a 25% chance to
      negate any critical hit or sneak attack (as the light fortification armor
      special ability). When making a melee touch attack, the wearer's reach
      increases by 5 feet. Moderate illusion; CL 9th; Craft Wondrous Item, blur,
      enlarge person.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, blur, enlarge person, creator must be a sorcerer of
      the appropriate bloodline</p>
