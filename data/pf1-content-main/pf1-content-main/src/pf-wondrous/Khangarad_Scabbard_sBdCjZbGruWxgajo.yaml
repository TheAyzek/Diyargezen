    value: >-
      <p>This belt-and-scabbard set is decorated with golden depictions of
      garudas.</p><h3>Effect</h3><p>The scabbard automatically reshapes itself
      to fit the weapon that the wielder is currently using. If the wielder is
      not using a weapon that would fit into a scabbard, as a free action the
      wielder can command the khangarad scabbard to take the shape of any weapon
      with which she has proficiency.</p><p>Once per day as a standard action,
      the wielder can speak the scabbard’s command word to blast nearby
      creatures with gale-force winds. As part of activating the scabbard, the
      wielder can attempt a special trip combat maneuver check against all
      creatures within @Distance[10;dual] using her normal CMB; this does not
      provoke attacks of opportunity. Creatures whose CMD is lower than the
      result are tripped. The wielder is not knocked down if the trip attempt
      fails by 10 or
      more.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.cnuin981hdq7ryit]{gust of wind};</em>
      <strong>Cost</strong> 3,000 gp</p>
