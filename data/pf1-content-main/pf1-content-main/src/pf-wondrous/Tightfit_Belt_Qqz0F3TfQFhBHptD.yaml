      description: >-
        <p>As a free action, the wearer of this brown leather belt can compress
        himself to fit through tight spaces as though affected by a squeeze
        spell for up to 10 rounds per day. (can be combined with Reduce person
        power)</p><p><em>@UUID[Compendium.pf1.spells.Item.835n5zqjvh3dybwq]{squeeze}</em></p><p>The
        target becomes flexible regardless of its actual size and mass. It can
        move through areas at least half its size with no penalty for squeezing.
        It can move through a space at least one-quarter its width using the
        penalties for squeezing through a space at least half its
        width.</p><p>normal squeezing
        rules:</p><p>@UUID[Compendium.pf-content.pf-buffs.Item.Un3yEd7l1wt9VEF7]{Squeezing
        (½
        space)}</p><p>@UUID[Compendium.pf-content.pf-buffs.Item.XDuJwn4sGLcklc9P]{Squeezing
        (&lt; ½ space)}</p>
      duration:
