      description: >-
        <p>You can reduce your size by one step, as the reduce person spell, for
        1 round (can be combined with Squeeze
        power)</p><p>@UUID[Compendium.pf1.spells.Item.2y9e1l6zso9tdg0a]{Reduce
        Person}</p><p>This spell causes instant diminution of a humanoid
        creature, halving its height, length, and width and dividing its weight
        by 8. This decrease changes the creature's size category to the next
        smaller one. The target gains a +2 size bonus to Dexterity, a -2 size
        penalty to Strength (to a minimum of 1), and a +1 bonus on attack rolls
        and AC due to its reduced size.</p><p>A Small humanoid creature whose
        size decreases to Tiny has a space of 2-1/2 feet and a natural reach of
        0 feet (meaning that it must enter an opponent's square to attack). A
        Large humanoid creature whose size decreases to Medium has a space of 5
        feet and a natural reach of 5 feet. This spell doesn't change the
        target's speed.</p><p>All equipment worn or carried by a creature is
        similarly reduced by the spell.</p><p>Melee and projectile weapons deal
        less damage. Other magical properties are not affected by this spell.
        Any reduced item that leaves the reduced creature's possession
        (including a projectile or thrown weapon) instantly returns to its
        normal size. This means that thrown weapons deal their normal damage
        (projectiles deal damage based on the size of the weapon that fired
        them).</p><p>Multiple magical effects that reduce size do not stack.
        Reduce person counters and dispels enlarge person.</p><p>Reduce person
        can be made permanent with a permanency spell.</p>
      duration:
        units: round
        value: '1'
      name: Reduce person
      uses:
        self:
          maxFormula: '1'
