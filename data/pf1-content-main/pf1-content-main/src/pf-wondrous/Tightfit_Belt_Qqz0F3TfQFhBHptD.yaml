  description:
    unidentified: <p>This is a simple brown leather belt.</p>
    value: >-
      <h3>Effect</h3><p>As a free action, the wearer of this brown leather belt
      can compress himself to fit through tight spaces as though affected by a
      squeeze spell for up to 10 rounds per day. When using the belt's squeezing
      ability, the wearer gains a +5 circumstance bonus on Escape Artist checks.
      Once per day as a move action, the wearer can reduce his size by one step,
      as the <em>reduce person</em> spell, for 1 round. These effects can be
      used
      simultaneously.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.ik9u3eel5vfwrtb5]{grease},
