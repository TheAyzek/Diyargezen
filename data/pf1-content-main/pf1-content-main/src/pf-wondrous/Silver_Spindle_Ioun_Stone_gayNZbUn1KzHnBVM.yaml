    value: >-
      <h3>Effect</h3><p>This stone grants you the ability to use a 1st-level
      spell from the cleric, druid, or sorcerer/wizard spell list as a
      spell-like ability three times per day, using your character level as your
      caster level. The spell keyed to the ioun stone is selected by the stone's
      creator. In order for you to use this spell-like ability, you must have a
      Charisma score of 11 or higher. The save DCs of the chosen spell are
      Charisma-based, if any.</p><h3>Resonance</h3><p><strong>Method 1, Fixed:
      </strong>All spell-like abilities granted by race are treated as 1 caster
      level higher.</p><p><strong>Method 2, Variable:
      </strong>@UUID[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]{Ioun
      Stone Resonance Powers Method
      2}</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Wondrous
      Item, <em>imbue with spell ability</em>, creator must be 12th level
      <strong>Cost</strong> 12,000 gp</p>
