  description:
    instructions: >-
      <p>Regeneration from the pearly white ioun stone works like a
      @UUID[Compendium.pf-content.pf-wondrous.Item.NfV9nfBofFLRZhTn]{ring of
      regeneration}. It only cures damage taken while the character is using the
      stone.</p><p>Only 25% of cracked or flawed ioun stones grant resonant
      powers when placed in a wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
      about Ioun Stones}</p>
    unidentified: >-
      <p>This lustrous white stone is shaped in a prism with 10 or more sides,
      making it generally cylindrical.  A crack mars its surface.</p>
    value: >-
      <h3>Effect</h3><p>Regenerate 1 point of damage per
      hour.</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>+2 sacred
      bonus on saves against death effects and attacks that rely on negative
      energy.</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, creator must be 12th level <strong>Cost</strong>
      1,700 gp</p><hr /><p><strong>Editor's note</strong>: There is text
      conflict between Seeker of Secrets (SOS) and Adventurer's Guide (AG) for
      the method 1 resonance. AG text is above, SOS text is as follows: <em>+1
      sacred bonus on saves against attacks that rely on negative
      energy.</em></p>
