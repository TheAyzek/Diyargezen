  description:
    value: >-
      <p>This ring of bone fused with crystal comes in four varieties, all of
      them useful only to psychic spellcasters. The wearer's number of psychic
      spells per day is doubled for one specific spell level. A ring of
      mysticism I doubles 1st-level spells, a ring of mysticism II doubles
      2nd-level spells, a ring of mysticism III doubles 3rd-level spells, and a
      ring of mysticism IV doubles 4th-level spells. Bonus spells from high
      ability scores are not
      doubled.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, limited wish</p>
