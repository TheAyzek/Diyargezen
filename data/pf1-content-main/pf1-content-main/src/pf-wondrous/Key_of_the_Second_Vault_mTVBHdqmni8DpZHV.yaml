name: Key of the Second Vault
system:
  aura:
    custom: true
    school: transmutation and conjuration [lawful]
  cl: 5
  description:
    value: >-
      <p>This elaborate key on a fine gold chain always glints, even in the
      dimmest light.  The bearer can use it to lock (but not unlock) any
      nonmagical lock as if it were the proper key. Once per day, the bearer can
      turn the key clockwise once to activate a shield of faith upon herself
      (though if the wearer is chaotic it provides only a +1 deflection bonus). 
      If Abadar is the bearer's patron, the key counts as a holy symbol.  Once
      per day, the bearer can speak a command word and summon a two-headed eagle
      as if using summon monster II (the eagle's extra head does not grant it an
      extra attack). This eagle obeys the bearer's commands as if they shared a
      common language. While the key is worn as a pendant or held in hand, the
      bearer gains a +2 bonus on Appraise checks to assess an object's
      value.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, fox's cunning, shield of faith, summon monster II, creator
      must have 5 ranks in Appraise</p>
  price: 3000
