    value: >-
      <p>A favored item among the dervishes of Sarenrae, this skirt of
      overlapping, brightly colored silk is magically reinforced, granting you
      increased durability and mobility.</p><h3>Effect</h3><p>You gain a +2
      natural armor bonus to AC and a +2 competence bonus on Acrobatics and
      Perform (dance) checks.</p><p>Once per day, when an adjacent foe attempts
      to take a @Distance[5;dual] step away from you, you may make a
      @Distance[5;dual] step as an immediate action so long as you end up
      adjacent to that foe. If you take this step, you cannot take a
      @Distance[5;dual] step during your next turn. If you take an action to
      move during your next turn, subtract @Distance[5;dual] from your total
      movement.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.pysrx5kxfjvsjjsi]{expeditious
      retreat}, @UUID[Compendium.pf1.spells.Item.la7kuehewu85ybnt]{barkskin} or
      @UUID[Compendium.pf1.spells.Item.knyako6zopc1chrv]{stoneskin};
      </em><strong>Cost</strong> 6,500 gp</p>
