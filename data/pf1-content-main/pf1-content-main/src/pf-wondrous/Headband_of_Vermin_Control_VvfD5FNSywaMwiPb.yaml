name: Headband of Vermin Control
system:
  aura:
    school: trs
  cl: 5
  description:
    value: >-
      <p>The wearer of this black leather headband can spend 10 minutes attuning
      the headband to one touched vermin of Medium or larger size. Once the
      headband is attuned, any creature wearing it can attempt Handle Animal and
      Ride checks to influence or control that vermin as if it were an animal
      and had animal-level intelligence. The attunement lasts until the vermin
      dies, the headband is destroyed, or the headband is attuned to a different
      vermin.  Duergar-created items of this type are usually protected by a
      dust ward* spell.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, control vermin</p>
  price: 1000
