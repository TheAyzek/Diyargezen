name: Safecamp Wagon
system:
  aura:
    school: trs
  cl: 6
  description:
    value: >-
      <p>Abadar's church created the first safecamp wagons to protect valuable
      cargo as it traveled between cities.  When inactive, a safecamp wagon
      looks like an elaborately carved wooden toy wagon, 12 inches long, 6
      inches wide, and 6 inches tall. On command, the toy transforms in a single
      round into an open-topped wagon (Core Rulebook 163). A second command word
      creates a canvas top supported with a sturdy wooden frame over the wagon. 
      A third command word causes wooden panels to extend down and outward from
      the wagon, forming a stable wooden platform extending 5 feet in all
      directions from the wagon's base, suitable for walking, sitting, standing,
      or sleeping upon. A sliding wooden door in the back panel allows access to
      the space under the wagon. Speaking the command word again causes these
      panels to retract into the wagon. A fourth command word returns the wagon
      to its toy shape; any items on or in the wagon are carefully placed on the
      ground around the toy.  A safecamp wagon cannot transform if there isn't
      enough open space for it to occupy at full size. In any form, the wooden
      parts of this item have hardness 8, the canvas parts have hardness 2, and
      the entire object has fire resistance
      5.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Wondrous
      Item, fabricate, creator must have 2 ranks in the Craft (carpentry)
      skill</p>
