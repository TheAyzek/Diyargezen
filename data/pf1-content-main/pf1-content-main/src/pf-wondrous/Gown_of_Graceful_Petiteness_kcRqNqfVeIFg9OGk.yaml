name: Gown of Graceful Petiteness
system:
  description:
    unidentified: <p>This appears to be a fine dress delicately woven with leaves.</p>
    value: >-
      <p>These fine dresses are delicately woven with magically preserved and
      layered leaves. The dresses were originally commissioned for elven
      diplomats who often interacted with gnomes and other members of Small
      races, but their use has spread across Avistan.</p><h3>Effect</h3><p>A
      Medium humanoid who takes 1 interrupted minute to don a gown of graceful
      petitenes is, at the end of that time, immediately reduced to Small size.
      This acts as reduce person, except that it does not grant a size bonus to
      Dexterity or resize items on the wearer’s person other than the gown
      itself. Taking off the gown also requires 1 interrupted minute and returns
      the gown and its wearer to their original
      sizes.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.2y9e1l6zso9tdg0a]{reduce person},
      </em>creator must be an elf;  <strong>Cost</strong> 1,750 gp</p>
