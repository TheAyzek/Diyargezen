name: Guerrilla Bandanna
system:
  aura:
    custom: true
    school: enchantment and illusion
  cl: 10
  description:
    value: >-
      <p>Used by warband leaders in Nirmathas, a guerrilla bandanna is a plain
      brown and green bandanna that can be tied around the forehead. The wearer
      gains a +5 competence bonus on Stealth checks while traveling in forested
      terrain, and can extend this bonus to up to 10 allies while they remain
      within 100 feet of the wearer.  increases his favored enemy bonus on
      attack rolls by 1 for each of his favored enemies. If the ranger has the
      hunter's bond (companions) class feature, this increase also applies to
      the attack roll bonus his allies gain from that
      ability.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, instant enemy, invisibility</p>
