name: Dawnflower Sash
system:
  actions:
    - _id: 6hqtlxx1XbwGdCNq
      activation:
        type: immediate
        unchained:
          type: reaction
      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.68m9du7zw2di7ew6]{feather
        fall},</p><p></p><p>The affected creatures or objects fall slowly.
        Feather fall instantly changes the rate at which the targets fall to a
        mere 60 feet per round (equivalent to the end of a fall from a few
        feet), and the subjects take no damage upon landing while the spell is
        in effect. When the spell duration expires, a normal rate of falling
        resumes.</p><p>The spell affects one or more Medium or smaller creatures
        (including gear and carried objects up to each creature's maximum load)
        or objects, or the equivalent in larger creatures: a Large creature or
        object counts as two Medium creatures or objects, a Huge creature or
        object counts as four Medium creatures or objects, and so
        forth.</p><p>This spell has no special effect on ranged weapons unless
        they are falling quite a distance. If the spell is cast on a falling
        item, the object does half normal damage based on its weight, with no
        bonus for the height of the drop.</p><p>Feather fall works only upon
        free-falling objects. It does not affect a sword blow or a charging or
        flying creature.</p>
      duration:
        units: spec
        value: until landing or 1 round/level
      name: Feather fall
      range:
        units: close
      save:
        dc: '12'
        description: negates
        type: will
      target:
        value: >-
          Medium or smaller freefalling object or creature/level (5), no two of
          which may be more than 20 ft. apart
      uses:
        self:
          maxFormula: '1'
          per: day
          value: 1
    - _id: Lnp3cXWt9WoCa0sa
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.xoc3vhg3btmfjauq]{cure light
        wounds}</p><p>When laying your hand upon a living creature, you channel
        positive energy that cures 1d8 points of damage + 1 point per caster
        level (maximum +5). Since undead are powered by negative energy, this
        spell deals damage to them instead of curing their wounds. An undead
        creature can apply spell resistance, and can attempt a Will save to take
        half damage.</p>
      name: Cure Light Wounds (Sarenrae patron only)
      notes:
        effect:
          - Healing @Heal[1d8+5] vs living target
          - Damage @Damage[1d8+5] vs undead target
      range:
        units: touch
      uses:
        self:
          maxFormula: '1'
          per: day
          value: 1
    - _id: dQfHYIqGoBAwNtx7
      activation:
        type: swift
        unchained:
          type: action
      description: >-
        <p>the wearer can cause the clasp to shine as brightly as a torch or
        cease this illumination; the light is warm, feels like sunlight, and is
        bright enough to make sun-fearing creatures slightly uncomfortable but
        not so bright as to cause them harm.</p>
      name: Light (as a torch)
  aura:
