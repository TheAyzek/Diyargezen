  description:
    instructions: >-
      <p>This Item can be used in either the belt or head slot.  If you wish to
      use it in the head slot, edit the slot value on the details tab of this
      item.</p>
    unidentified: <p>This is a long strip of red fabric.</p>
    value: >-
      <p>This long strip of red Qadiran fabric is wrapped around the wearer's
      waist or head several times and held in place by an ankh-shaped clasp of
      red gold.</p><h3>Effect</h3><p>The wearer is protected as if by endure
      elements, but only in warm environments. If the wearer unwraps the sash to
      its full length and holds the clasp in her hand, she can use feather fall
      once per day, briefly leaving behind a trail of pleasant redgold light as
      bright as a torch that lasts for 1 round. If Sarenrae is the wearer's
      patron, the wearer can use the sash to cast cure light wounds once per day
      on command. The wearer can trigger this ability as an immediate action if
      reduced to -1 hit points or fewer, though thereafter the sash must be
      recharged by placing it in strong sunlight for 8 continuous hours. As a
      swift action, the wearer can cause the clasp to shine as brightly as a
      torch or cease this illumination; the light is warm, feels like sunlight,
      and is bright enough to make sun-fearing creatures slightly uncomfortable
      but not so bright as to cause them
      harm.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.xoc3vhg3btmfjauq]{cure light wounds},
      @UUID[Compendium.pf1.spells.Item.pau0ejk30fs1eebl]{endure elements},
      @UUID[Compendium.pf1.spells.Item.68m9du7zw2di7ew6]{feather fall},
      @UUID[Compendium.pf1.spells.Item.ip9onjfp6nf1vlv9]{light}
      </em><strong>Cost</strong> 1,250 gp</p>
