name: Weapon Tattoo
system:
  aura:
    school: con
  cl: 5
  description:
    value: >-
      <p>This tattoo can store one weapon, sized for the bearer of the tattoo.
      When no weapon is stored, the tattoo takes the form of an empty sword
      sheath. When a weapon is stored within the tattoo, it takes the form of
      the weapon so stored. Storing a weapon in the tattoo is a full-round
      action, but removing a weapon from the tattoo is only a swift action. This
      tattoo can only be put on one of the bearer's arms (preventing the other
      arm from receiving another tattoo), and the weapon automatically appears
      in the hand of the arm it is tattooed upon. If that hand is not free, the
      weapon cannot be summoned. If the bearer is tightly constrained in an area
      too small for the weapon to appear without damaging something, the weapon
      cannot be summoned. If the tattoo is destroyed while a weapon is in it,
      the weapon falls to the ground in a random space adjacent to the bearer of
      the tattoo.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Inscribe Magical Tattoo (Inner Sea Magic 16), disguise weapon</p>
