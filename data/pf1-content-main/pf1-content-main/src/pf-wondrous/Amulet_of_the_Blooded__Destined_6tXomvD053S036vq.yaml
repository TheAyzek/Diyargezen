name: Amulet of the Blooded, Destined
system:
  aura:
    school: enc
  cl: 7
  description:
    value: >-
      <p>Each different type of amulet of the blooded grants its wearer powers
      from one sorcerer bloodline, but makes him vulnerable to attacks and
      effects that target creatures with the appropriate bloodline (such as a
      blood-hunting weapon). If a creature that already has the associated
      bloodline wears the amulet, the wearer does not gain the abilities listed
      below; instead, the effective level of his bloodline powers increases by
      2. This effect does not stack with other abilities that increase the
      effective level of bloodline powers.    Destined: This chunk of uncut
      quartz hangs on a platinum chain. The wearer gains a +2 luck bonus on all
      saving throws and to AC during surprise rounds or any time he is otherwise
      unaware of an attack. Once per day, the wearer can reroll one attack roll,
      critical hit confirmation roll, or caster level check to overcome spell
      resistance. He must decide to use this ability after the first roll is
      made but before the result is revealed. He must take the second result,
      even if it's lower. Moderate enchantment; CL 7th; Craft Wondrous Item,
      aid.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, aid, creator must be a sorcerer of the appropriate
      bloodline</p>
