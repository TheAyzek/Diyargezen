  description:
    value: >-
      <p>This scarf is crafted from fine, almost transparent silk of a deep red
      hue. When worn about the head as a veil or the neck as a scarf, the dance
      of seven veils disguises the wearer in a different shape, as per disguise
      self. The wearer can cast levitate at will, gains a +4 competence bonus on
      Bluff and Diplomacy checks, and gains a +2 enhancement bonus to
      Intelligence and Charisma.<h3>Requirements</h3><p>Craft Wondrous Item,
      disguise self, eagle's splendor, fox's cunning, levitate, feather fall</p>
