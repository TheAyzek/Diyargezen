  description:
    value: >-
      <p>A single necrograft leg allows its host to travel overland for 1-1/2
      times longer than normal before needing to attempt Constitution checks to
      continue running or to avoid nonlethal damage from a forced march. A
      humanoid with two necrograft legs can travel overland twice as longer than
      normal before needing to attempt these same checks. In addition, each
      necrograft leg grants its host a +2 bonus to CMD against bull rush and
      overrun attempts and provides a 50% chance to ignore
      caltrops.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, animate dead, regenerate, creator must have 8 ranks in
      Heal</p>
