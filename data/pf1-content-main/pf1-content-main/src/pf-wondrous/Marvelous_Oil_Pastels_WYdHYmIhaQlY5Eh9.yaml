name: Marvelous Oil Pastels
system:
  aura:
    school: con
  cl: 15
  description:
    value: >-
      <p>These magical crayons are made by binding marvelous pigments to magical
      reagents, creating a more powerful but less realistic alternative.
      Marvelous oil pastels function as marvelous pigments, but the items they
      create never appear realistic and are clearly artificial and gaudy. In
      addition to drawing inanimate objects, marvelous oil pastels can also
      create animate, living creatures that are likewise clearly artificial. The
      pastels can draw into existence any creature that can be summoned via
      summon monster IV or summon nature's ally IV; summoned creatures do not
      obey you, and remain for 1d4 days or until doused with at least 5 gallons
      of water.  Every box of marvelous oil pastels contains seven
      crayons-black, blue, brown, green, grey, red, and yellow. Each crayon can
      render an item of up to 200 cubic feet or a creature with 1 Hit Die,
      allowing an entire box to create up to 1,400 cubic feet of inanimate
      objects or 7 HD worth of monsters.</p><h3>Requirements</h3><p>Craft
      Wondrous Item, major creation, summon monster IV</p>
