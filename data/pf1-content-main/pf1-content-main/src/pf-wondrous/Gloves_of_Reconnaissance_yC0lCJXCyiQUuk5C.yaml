  description:
    value: >-
      <p>Each of these fingerless worked leather gloves look as though they have
      seen heavy use, and often bear the stains or scent of grass or wet mud. On
      command, the wearer can use the gloves to see and hear though solid
      material no more than 5 feet thick by placing both hands on that material.
      The wearer can use the gloves once per day for up to 1 minute. The wearer
      must wear the gloves continuously for 24 hours before activating this
      ability.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, clairaudience/clairvoyance</p>
