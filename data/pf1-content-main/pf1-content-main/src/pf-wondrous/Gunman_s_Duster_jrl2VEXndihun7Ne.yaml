    instructions: >-
      <p>If you are not a gunslinger, or have an archetype that does not provide
      the gunslinger's dodge deed, you can use the supplemented deed only once
      per day.  If you do have grit, you must manually adjust your grit total by
      the +1 provided by the duster.</p>
    unidentified: <p>This is a long, loose-fitting, coat.</p>
    value: >-
      <h3>Effect</h3><p>This long, loose-fitting coat grants a +4 armor bonus to
      AC and a +2 luck bonus to the wearer's touch AC against firearm attacks.
      If the wearer is a gunslinger or has the Amateur Gunslinger feat, she
      begins each day with 1 additional grit point. This extra point does not
      increase her maximum grit total. When the wearer uses the gunslinger's
      dodge deed, the deed's dodge bonuses to AC increase by +1. If the wearer
      is not a gunslinger, she may use the gunslinger's dodge deed once per
      day.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      @UUID[Compendium.pf1.feats.Item.nxfb1Cxl628nYR3L]{Amateur Gunslinger} or
      creator must be a
      @UUID[Compendium.pf1.classes.Item.jOUMbWoFZHQlAMpJ]{gunslinger},<em>
      @UUID[Compendium.pf1.spells.Item.vhfj5bkt9hmgvh9p]{bullet shield}</em>
      <strong>Cost</strong> 18,000 gp</p>
