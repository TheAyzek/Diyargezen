  description:
    unidentified: <p>This belt is unremarkable.</p>
    value: >-
      <h3>Effect</h3><p>As long as this belt's wearer doesn't move more than
      @Distance[5;dual] during her turn, she ignores the penalties for being
      fatigued, shaken, or sickened until the end of her next turn or until she
      moves more than @Distance[5;dual], whichever occurs first. While she does
      not take any of the penalties of those conditions, she is considered to be
      under the effect of those conditions until they end or are
      removed.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em> @UUID[Compendium.pf1.spells.Item.fxz69pwpqt9b6uss]{lesser
      restoration}, @UUID[Compendium.pf1.spells.Item.eu4u4mr1naoiqohz]{remove
      fear}</em> <strong>Cost</strong> 6,000 gp</p>
