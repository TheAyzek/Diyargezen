      Dexterity.</p><h3>Resonance</h3><p><strong>Method 1, Fixed:
      </strong>Weapon Focus with the stone’s keyed weapon.</p><p><strong>Method
      2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, <em>transformation</em> or proficiency in the
      appropriate weapon, creator must be 12th level <strong>Cost</strong> 1,500
      gp</p>
