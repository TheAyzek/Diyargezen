  description:
    value: >-
      <p>This simple black cloth band focuses the wearer's ki, helping her use
      subtle misdirection against opponents in combat. The wearer gains a +2
      competence bonus on Bluff checks made to feint and combat maneuver checks
      made to reposition, and once per day she can attempt a feint or reposition
      maneuver as a swift action. The wearer also gains a +2 insight bonus on
      attack rolls on sneak attacks and can sneak attack creatures with
      concealment or total concealment, though miss chances apply
      normally.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, eagle's splendor, see invisibility</p>
