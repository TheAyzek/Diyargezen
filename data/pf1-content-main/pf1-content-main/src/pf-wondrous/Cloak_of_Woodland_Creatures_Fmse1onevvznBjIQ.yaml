name: Cloak of Woodland Creatures
system:
  aura:
    custom: true
    school: abjuration and conjuration
  cl: 5
  description:
    value: >-
      <p>This forest-green wool cloak is thick and warm. Its hem and the edge of
      its hood are embroidered with small figures of forest creatures (rabbits,
      squirrels, and the like) in white thread.  When worn, this cloak bestows a
      +1 resistance bonus on all saving throws. The wearer can remove the cloak
      at any time and lay it on the ground outdoors. This ends the resistance
      bonus but summons a number of animals from the cloak. The animals serve
      the character who summoned them for 10 minutes (or until slain or returned
      to the cloak's folds). A summoned creature can follow any of the commands
      described in the Handle Animal skill. Use the following tables to
      determine what animals can be called forth.  The cloak summons creatures
      only when laid down outdoors on naturally occurring ground (not, for
      example, on a wooden deck or stone pathway). The cloak can be used to
      summon animals up to three times per day.  d% Animal 01-30 1 owl 31-60 1d3
      rats 61-75 1 weasel 76-90 1d6 squirrels 91-100 1d4
      rabbit.<h3>Requirements</h3><p>Craft Wondrous Item, resistance, summon
      nature's ally I</p>
