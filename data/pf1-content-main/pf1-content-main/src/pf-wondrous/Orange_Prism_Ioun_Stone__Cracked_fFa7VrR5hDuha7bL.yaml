name: Orange Prism Ioun Stone, Cracked
system:
  aura:
    custom: true
    school: varied
  cl: 12
  description:
    instructions: >-
      <p>The granted 0-level spell should be selected at the time of the stone's
      creation and must be added manually to the possessor's actor.</p><p>Only
      25% of cracked or flawed ioun stones grant resonant powers when placed in
      a wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
      about Ioun Stones}</p>
    unidentified: >-
      <p>This is a long orange stone where the top and bottom ends have the same
      number of sides (such as a hexagram). The width and angle of each side is
      usually the same as all other sides.  A crack mars its surface.</p><p></p>
    value: >-
      <h3>Effect</h3><p>Wearer adds one cantrip or orison (determined when the
      stone is created) to his list of spells known or spells
      prepared.</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>Every
      time the bearer casts a spell, he rolls 1d4-2 and adds the result to his
      caster level.</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, creator must be 12th level <strong>Cost</strong> 500
      gp</p><hr /><p><strong>Editor's note</strong>: the original sourcebook,
      seekers of secrets, adds the sentence: "<em>If this modified caster level
      is too low to cast the spell, the spell fails and is lost.</em> " to the
      end of the Method 1 resonance text but it was removed for the more recent
      adventurer's guide.</p>
