      description: >-
        <p>tear off a piece of the item and use it as a substitute for spell
        components worth up to 50 gp. </p><p>Each piece torn from a diminishing
        sash (an action subsumed in the casting of a spell) provides components
        for one spell, and multiple pieces <strong>cannot</strong> be combined
