name: Reservoir Tattoo
system:
  aura:
    school: trs
  cl: 7
  description:
    value: >-
      <p>Once per day as a standard action, the bearer can transfer into the
      tattoo an ongoing single-target spell (of up to 3rd level). The spell must
      be one the bearer cast on itself. While stored in the tattoo, the spell's
      effects are suppressed, and the spell's duration is similarly suspended.
      As a standard action, the bearer can bring the spell back into effect on
      itself. Spells stored in reservoir tattoos are lost when the bearer next
      prepares spells.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Inscribe Magical Tattoo</p>
