name: Amulet of the Blooded, Draconic
system:
  aura:
    custom: true
    school: abjuration and evocation
  cl: 7
  description:
    value: >-
      <p>Each different type of amulet of the blooded grants its wearer powers
      from one sorcerer bloodline, but makes him vulnerable to attacks and
      effects that target creatures with the appropriate bloodline (such as a
      blood-hunting weapon). If a creature that already has the associated
      bloodline wears the amulet, the wearer does not gain the abilities listed
      below; instead, the effective level of his bloodline powers increases by
      2. This effect does not stack with other abilities that increase the
      effective level of bloodline powers.   Draconic: This amulet comes in a
      variety of minerals depending on its powers, as shown in the table below,
      and is formed into the shape of a dragon's scale. The wearer gains
      resistance 5 against the energy type shown in the table, as well as a +1
      natural armor bonus to AC. Once per day as a standard action, the wearer
      can produce a breath weapon. This breath weapon deals 4d6 points of damage
      of the energy type and shape listed (Reflex DC 13 half). Moderate
      abjuration and evocation; CL 9th; Craft Wondrous Item, fire breath, resist
      energy.  d% Material Energy Type Breath Shape 01-25 Malachite Acid 60-foot
      line 26-50 Azurite Electricity 60-foot line 51-75 Red Agate Fire 30-foot
      cone 76-100 Calcite Cold 30-foot
      con.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item,fire breath, resist energy, creator must be a sorcerer of
      the appropriate bloodline</p>
