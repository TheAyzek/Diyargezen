name: Snapleaf
system:
  aura:
    school: trs
  cl: 5
  description:
    value: >-
      <p>This crystalline carving looks like a hand-sized tree leaf. It is
      usually worn around the neck on a strap so it is within easy reach, but
      can be affixed to a belt or clothing just like a badge. While falling, the
      bearer can snap and destroy a snapleaf as an immediate action to gain the
      benefits of feather fall and invisibility. The duration of the two effects
      work independently; ending one early does not affect the other. The item
      cannot be activated to provide just one of these two effects; they are
      always activated
      simultaneously.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, feather fall, invisibility</p>
