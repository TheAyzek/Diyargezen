  description:
    instructions: >-
      <p>Only 75% of normal ioun stones grant resonant powers when placed in a
      wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
      about Ioun Stones}</p>
    unidentified: <p>This ioun stone resembles a small, pearl-white tetrahedron. </p>
    value: >-
      <h3>Effect</h3><p>This stone grants the
      @UUID[Compendium.pf-content.pf-special-qualities.Item.SAHNGAuHS1oaVMDf]{ghost
      touch} special ability to the user's unarmed strikes and to melee weapons
      she wields. The user can also focus her gaze as a standard action and gain
      the benefits of @UUID[Compendium.pf1.spells.Item.nokru6mxk9p3r513]{see
      invisibility} for 1 round. If the user is incorporeal, corporeal melee
      weapons she touches gain the ghost touch special ability, allowing her to
      pick up and use corporeal melee weapons as
      normal.</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>This
      stone grants the
      @UUID[Compendium.pf-content.pf-special-qualities.Item.uQPkhaeSuUqvhwKo]{ghost
      touch} special ability to normal or masterwork light armor the user has
      worn for at least 24 hours. This benefit lasts as long as the armor is in
      the user's possession.</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Requirements</h3><p>Craft
      Wondrous Item, creator must be 12th level <strong>Cost</strong> 24,000
      gp</p>
