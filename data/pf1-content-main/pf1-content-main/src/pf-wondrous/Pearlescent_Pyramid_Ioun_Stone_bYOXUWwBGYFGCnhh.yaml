name: Pearlescent Pyramid Ioun Stone
system:
  actions:
    - _id: 4niXifW9ekMjPqEJ
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>You can see any objects or beings that are invisible within your
        range of vision, as well as any that are ethereal, as if they were
        normally visible. Such creatures are visible to you as translucent
        shapes, allowing you easily to discern the difference between visible,
        invisible, and ethereal creatures.</p><p>The spell does not reveal the
        method used to obtain <em>invisibility</em>.</p><p>It does not reveal
        illusions or enable you to see through opaque objects. It does not
        reveal creatures who are simply hiding, concealed, or otherwise hard to
        see.</p><p>See <em>invisibility</em> can be made permanent with a
        <em>permanency</em> spell.</p>
      duration:
        units: round
        value: '1'
      name: See Invisibility
      range:
        units: personal
      target:
        value: you
