  description:
    instructions: >-
      <p>Only 25% of cracked or flawed ioun stones grant resonant powers when
      placed in a wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
      about Ioun Stones}</p>
    unidentified: >-
      <p>This purple and green stone is in the shape of an elongated sphere,
      sometimes tapering at one end to a tear-like shape.  A crack mars its
      surface.</p>
    value: >-
      <h3>Effect</h3><p>This stone absorbs spells of 2nd level or lower. After
      absorbing 10 spell levels, the stone burns out and turns dull
      gray.</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>If the
      bearer is holding the wayfinder, he can use the stone’s absorption ability
      as an immediate action instead of a readied action.</p><p><strong>Method
      2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, creator must be 12th level <strong>Cost</strong>
      5,000 gp</p><hr /><p><strong>Editor's note</strong>: Lavender-and-green
      stones work like a
      @UUID[Compendium.pf-content.pf-wondrous.Item.AyO8aGsG2nB4ECcN]{rod of
      absorption}, but absorbing a spell requires a readied action, and these
      stones cannot be used to empower spells.</p>
