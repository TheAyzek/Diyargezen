    value: >-
      <h3>Effect</h3><p>This stone functions as a normal
      @UUID[Compendium.pf-content.pf-wondrous.Item.kt4vegsgZAoW66CB]{pale orange
      rhomboid}, but only once, after which it burns out and turns dull
      gray.</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>A soul
      held within the stone can remain there indefinitely as long as the
      wayfinder remains on the soul's original body. If the wayfinder is removed
      from the body, the ioun stone's resonant power is suppressed until the
      wayfinder is replaced.</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, <em>magic jar</em>, creator must be 12th level
      <strong>Cost</strong> 6,000 gp</p>
