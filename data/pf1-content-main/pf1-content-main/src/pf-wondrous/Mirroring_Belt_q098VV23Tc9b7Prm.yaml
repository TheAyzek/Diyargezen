    value: >-
      <p>This broad belt is constructed of steel plates polished to a gleaming
      finish.</p><h3>Effect</h3><p>The belt grants its wearer a +2 enhancement
      bonus to Dexterity. Treat this as a temporary ability bonus for the first
      24 hours the belt is worn.</p><p>Three times per day, the wearer can use
      mirror image to bring forth illusory duplicates that persist for 6 minutes
      or until destroyed. These function as normal images from that spell,
      except any ranged attack (including ranged touch spells) that strikes and
      destroys an image rebounds onto the attacker, using the attacker's
      original result to determine whether the attack hits.</p><p>If the wearer
      expends one use of mythic power to activate the belt, the mirror images
      replenish when the wearer is hit. This functions as above, except each
      time an attack hits the wearer instead of an image, the belt creates a new
      image, up to the spell's limit of eight images. Unlike mirror image, the
      effect doesn't end when the images are gone. If there are no more images,
      the belt continues to create new images for the effect's full
      duration.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      Mythic Crafter,
      <em>@UUID[Compendium.pf1.spells.Item.ns8jbp0ilbvbvuif]{cat's grace},
      @UUID[Compendium.pf1.spells.Item.4jsss37x0pplib8f]{mirror image}</em>
      <strong>Cost</strong> 18,000 gp</p>
