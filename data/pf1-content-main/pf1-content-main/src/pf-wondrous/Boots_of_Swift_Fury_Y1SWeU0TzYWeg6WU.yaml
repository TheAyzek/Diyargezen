  description:
    value: >-
      <p>These boots of heavy, furred hide rise to the wearer's calf, and are
      held in place with rough hide straps secured by thick iron buckles. They
      increase the wearer's base land speed by 10 feet (considered an
      enhancement bonus). When the wearer is in a rage, the boots also grant him
      a +4 deflection bonus to AC against attacks of opportunity provoked by
      moving through or out of a threatened area or by casting a
      spell.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, expeditious retreat, rage</p>
