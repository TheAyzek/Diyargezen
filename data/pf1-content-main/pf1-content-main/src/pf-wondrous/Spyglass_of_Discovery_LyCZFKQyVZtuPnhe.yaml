  description:
    value: >-
      <p>This brass spyglass never dulls or tarnishes. Three times per day, the
      user can speak a command word while viewing a location with this elaborate
      brass spyglass to observe that spot as if through
      clairaudience/clairvoyance. The effect lasts for as long as the user
      continues to train the spyglass on the observed area.  If the user is a
      human, the effect's range is doubled and she can both see and hear at the
      selected point.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, Enlarge Spell, clairaudience/clairvoyance, creator
      must be a human</p>
