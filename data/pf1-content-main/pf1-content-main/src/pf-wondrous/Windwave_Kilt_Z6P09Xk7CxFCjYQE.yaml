    value: >-
      <p>This kilt is made of thick woven strips of sea-green and sky-blue cloth
      decorated with tiny pearls and bits of coral along the
      beltline.</p><h3>Effect</h3><p>The wearer gains a +3 competence bonus on
      Swim checks. When not worn, a windwave kilt floats on water like a dry
      log, automatically buoying upward any creature that weighs
      @Weight[100;dual]or less and aiding in flotation for heavier creatures. If
      Gozreh is the wearer's patron, once per day the wearer can use gaseous
      form. In this form, the wearer does not need to breathe and can enter
      water or other liquid, appearing as a mass of fine bubbles and gaining the
      ability to swim at a speed of @Distance[10;dual]. The wearer can also
      drink salt water as if it were fresh
      water.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.snj78r5rw96btfjn]{create water},
