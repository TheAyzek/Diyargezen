      @UUID[Compendium.pf1.spells.Item.plou8h168bfn5hq6]{levitate} or
      @UUID[Compendium.pf1.spells.Item.g2obld7y0lpyztes]{water walk},
      </em>creator must have 5 ranks in Swim <strong>Cost</strong> 3,500 gp</p>
