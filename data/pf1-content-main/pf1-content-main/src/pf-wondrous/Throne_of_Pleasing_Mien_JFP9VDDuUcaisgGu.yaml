  description:
    value: >-
      <p>This beautiful throne is delicately crafted from pale stone carved 
      with images of dancing nymphs and frolicking satyrs. A throne of pleasing
      mien imparts its continuous heroism effect to anyone seated upon it. A
      creature that bows or otherwise offers fealty to anyone sitting upon the
      throne (regardless of whether the person is a rightful ruler or not) gains
      a +2 circumstance bonus on Charisma-based skill checks and a +1 morale
      bonus on Will saving throws for 24 hours.</p><h3>Requirements</h3><p>Craft
      Wondrous Item, eagle's splendor, heroism, resistance</p>
