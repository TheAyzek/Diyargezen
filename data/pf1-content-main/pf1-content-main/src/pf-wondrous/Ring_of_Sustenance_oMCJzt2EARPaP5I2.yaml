name: Ring of Sustenance
system:
  aura:
    school: con
  cl: 5
  description:
    value: >-
      <p>This ring continually provides its wearer with life-sustaining
      nourishment. The ring also refreshes the body and mind; its wearer only
      needs to sleep 2 hours per day to gain the benefit of 8 hours of sleep.
      This allows a spellcaster that requires rest to prepare spells to do so
      after only 2 hours, but does not allow a spellcaster to prepare spells
      more than once per day. The ring must be worn for a full week before it
      begins to work. If it is removed, the owner must wear it for another week
      to reattune it to
      himself.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, create food and water</p>
