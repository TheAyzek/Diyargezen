name: Lord's Banner, Crusades
system:
  aura:
    custom: true
    school: various schools
  cl: 10
  description:
    value: >-
      <p>A lord's banner is a cloth flag or standard, typically at least 2 feet
      wide and 4 feet long (though some are up to twice that size), meant to be
      carried and displayed on a lance, polearm, frame, or staff. It has no
      effect when not mounted properly or when laying on the ground. It normally
      depicts the insignia or heraldic symbol of a particular noble. A lord's
      banner may be carried (on foot or mounted) or planted. In the latter case,
      the banner does not need a bearer, but if it is toppled or touched by an
      enemy, it loses its effectiveness until reclaimed and replanted by allies
      of its owner. Crusades: A noble-looking lord's banner of crusades emits a
      hallow effect in a 40-foot radius around it, so long as it is borne by one
      true to the religion of the person whose crest is on the banner (these
      sorts of banners usually have a holy symbol or other religious insignia
      worked into the design). The banner displays the faith's holy symbol along
      with the owner's crest. Constitution checks or suffering any nonlethal
      damage from doing so, allowing them to cover great distances while still
      arriving ready to do battle. This ability affects all allied creatures
      within 1 mile as long as they are able to see the banner at least once a
      day.</p><h3>Requirements</h3><p>Craft Wondrous Item, hallow</p>
