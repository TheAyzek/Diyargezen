  description:
    value: >-
      <p>This eye-catching rod is bedecked with glittering spangles. The wielder
      gains a +5 competence bonus on Bluff and Sleight of Hand checks, as well
      as on opposed Charisma checks to give commands to charmed creatures..   A
      rod of beguiling allows a bard's fascinate, suggestion, and mass
      suggestion bardic performance to take effect as if she were 5 levels
      higher, and grants a +5 bonus on a bard's Perform checks when using
      distraction.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Rod, hypnosis</p>
