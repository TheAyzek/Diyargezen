      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.6l904edkt8jv9jor]{neutralize
        poison},</p><p>You detoxify any sort of venom in <s>the creature or
        object touched</s> yourself.</p><p> If the target is a creature, you
        must make a caster level check (1d20 + caster level) against the DC of
        each poison affecting the target. Success means that the poison is
        neutralized. A cured creature suffers no additional effects from the
        poison, and any temporary effects are ended, but the spell does not
        reverse instantaneous effects, such as hit point damage, temporary
        ability damage, or effects that don't go away on their own.</p>
      duration:
        units: inst
      name: Neutralize Poison
      range:
        units: personal
