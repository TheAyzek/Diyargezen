  description:
    unidentified: <p>This belt is unremarkable.</p>
    value: >-
      <p>Due to the toxic nature of many environments found within the
      Darklands, this belt is designed to protect its wearer from exotic
      diseases, paralyzing attacks, and poisonous
      molds.</p><h3>Effect</h3><p>The wearer gains a +2 bonus on saving throws
      to resist disease, paralysis, and poison. This bonus increases to +4 on
      saving throws to resist such effects caused by molds or slimes.
      Additionally, the wearer can cast a single spell from the following list
      as a spell-like ability once per day: neutralize poison, remove disease,
      or remove paralysis. Activating this ability is a purely mental action
      that can be taken even while paralyzed or otherwise helpless. The chosen
      spell affects only the belt's
      wearer.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.6l904edkt8jv9jor]{neutralize poison},
      @UUID[Compendium.pf1.spells.Item.ocbjt6z7amc3yn8w]{remove disease},
      @UUID[Compendium.pf1.spells.Item.7xdn59ffjaqchhrz]{remove paralysis}
      </em><strong>Cost</strong> 10,000 gp</p>
