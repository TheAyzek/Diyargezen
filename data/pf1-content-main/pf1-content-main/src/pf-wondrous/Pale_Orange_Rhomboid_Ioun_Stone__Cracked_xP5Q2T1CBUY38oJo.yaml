    unidentified: >-
      <p>A orange stone prism with sides of unequal widths or angles, giving it
      a flattened cross section. A crack mars its surface.</p>
    value: >-
      <h3>Effect</h3><p>If you die while using this ioun stone, the stone can be
      used as an additional material component in any spell to return you to
      life, reducing the spell’s total material component cost by
      20%.</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>A soul held
      within the stone can remain there indefinitely as long as the wayfinder
      remains on the soul's original body. If the wayfinder is removed from the
      body, the ioun stone's resonant power is suppressed until the wayfinder is
      replaced.</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, <em>magic jar</em>, creator must be 12th level
      <strong>Cost</strong> 900 gp</p>
