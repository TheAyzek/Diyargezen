  description:
    value: >-
      <p>This lute is a masterwork instrument constructed of polished ebony,
      with mother of pearl embellishments and gold frets. It grants any creature
      playing it a +2 competence bonus on Perform (string instruments) checks as
      it gently telepathically whispers ways the creature can improve is current
      performance. It also grants those who can play the lute the following
      abilities.   • Three times per day on command, a creature with at least 6
      ranks in Perform (string instruments) can play a chord on the lute of
      discord to employ the murderous command spell (Ultimate Magic).   • Three
      times per day on command, a creature with at least 6 ranks in Perform
      (string instruments) can play a chord on the lute of discord to use the
      distracting cacophony spell (3rd level) (Ultimate Magic).   • Once per day
      on command, a creature with at least 6 ranks in Perform (string
      instruments) can play a chord to use the echolocation spell (Ultimate
      Magic) (4th level
      caster.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, distracting cacophony ( Ultimate Magic), echolocation
      (Ultimate Magic), murderous command (Ultimate Magic)</p>
