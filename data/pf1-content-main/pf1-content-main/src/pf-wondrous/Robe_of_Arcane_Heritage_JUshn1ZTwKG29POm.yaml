    instructions: <p>Changes to bloodline powers must be made manually on your actor.</p>
    unidentified: <p>These dark purple robes are decorated with gold stitching.</p>
    value: >-
      <p>These elegant, dark purple robes are usually decorated with gold
      stitching suggesting a particular sorcerer bloodline, though some might
      indicate a family tree.</p><h3>Effect</h3><p>When a sorcerer dons a robe
      of arcane heritage, the stitching pulls itself apart and reweaves to match
      her particular sorcerer bloodline. The wearer treats her sorcerer level as
      4 higher than normal for the purpose of determining what bloodline powers
      she can use and their
      effects.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.byn5q46du0ck592a]{speak with dead},
      </em>creator must be a sorcerer <strong>Cost</strong> 8,000 gp</p>
