name: Horn of Battle Clarity
system:
  aura:
    school: enc
  cl: 5
  description:
    value: >-
      <p>The call of this hollowed-out animal horn rallies nearby creatures to
      battle. When the horn is blown, all creatures within 60 feet who have not
      yet acted in combat are no longer considered flat-footed. The horn has no
      effect on other conditions or abilities that treat a creature as
      flat-footed.  A barbarian who sounds a horn of battle clarity may spend 2
      rounds of rage to act as if she had the superstition rage power for the
      remainder of that
      battle.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, rage</p>
