  description:
    unidentified: <p>This belt is unremarkable.</p>
    value: >-
      <h3>Effect</h3><p>This belt functions as a
      @UUID[Compendium.pf-content.pf-wondrous.Item.2qgbeSMSh10q0XC3]{serpent
      belt}, except it grants the wearer a +2 enhancement bonus to Strength and
      Dexterity. Treat this as a temporary ability bonus for the first 24 hours
      the belt is worn. When the wearer animates the belt as a venomous or
      constrictor snake, she may speak a second command word to give the snake
      the advanced, celestial, entropic (Bestiary 2), fiendish, or resolute
      (Bestiary 2) simple template. Adding a planar template changes the snake's
      alignment to that of the corresponding
      planes.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      beast form I,
      <em>@UUID[Compendium.pf1.spells.Item.05i5rxwim12hwktu]{bull's strength},
      @UUID[Compendium.pf1.spells.Item.ns8jbp0ilbvbvuif]{cat's grace},
      @UUID[Compendium.pf1.spells.Item.6l904edkt8jv9jor]{neutralize poison},
      @UUID[Compendium.pf1.spells.Item.26vm5jhjkxpq1xm3]{summon monster II} or
      @UUID[Compendium.pf1.spells.Item.9fdte3s6lnanf9rg]{summon nature's ally
      II} </em><strong>Cost</strong> 10,000 gp</p><p><strong>Editor's
      note</strong>: the sourcebook indicates that "beast form I" is a crafting
      requirement, but no spell with that name exists,
      @UUID[Compendium.pf1.spells.Item.tjdfluulncmqacc3]{Beast Shape I} is the
      likely intended requirement.</p>
