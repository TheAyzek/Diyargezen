name: Serpent Belt, Greater
system:
  actions:
    - _id: RPknKw9Ydku1TGSt
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>once per day on command, the belt can be animated as a venomous snake
        or constrictor snake (Bestiary 255) that obeys the animator's spoken
        commands for up to an hour. If the animated snake is slain or moves 100
        feet away from the animator, the snake reverts into belt form. a second
        command word can be used to give the snake the advanced, celestial,
        entropic (Bestiary 2), fiendish, or resolute (Bestiary 2) simple
        template. Adding a planar template changes the snake's alignment to that
        of the corresponding planes.</p><p></p><p>Source Pathfinder RPG Bestiary
        pg. 255</p><table><tbody><tr><td><p>Constrictor Snake CR
        2</p></td><td><p>Venomous Snake CR 1</p></td></tr><tr><td><p>XP
        600</p><p>N Medium animal</p><p>Init +3; Senses scent; Perception
        +12</p><p>Defense</p><p>AC 15, touch 13, flat-footed 12 (+3 Dex, +2
        natural)</p><p>hp 19 (3d8+6)</p><p>Fort +4, Ref +6, Will
        +2</p><p>Offense</p><p>Speed 20 ft., climb 20 ft., swim 20
        ft.</p><p>Melee bite +5 (1d4+4 plus grab)</p><p>Special Attacks
        constrict (1d4+4)</p><p>Statistics</p><p>Str 17, Dex 17, Con 12, Int 1,
        Wis 12, Cha 2</p><p>Base Atk +2; CMB +5 (+9 grapple); CMD 18 (can’t be
        tripped)</p><p>Feats Skill Focus (Perception), Toughness</p><p>Skills
        Acrobatics +15, Climb +11, Perception +12, Stealth +11, Swim +11; Racial
        Modifiers +4 Perception, +4 Stealth, +8 Acrobatics</p></td><td><p>XP
        400</p><p>N Medium animal</p><p>Init +5; Senses low-light vision, scent;
        Perception +9</p><p>Defense</p><p>AC 14, touch 11, flat-footed 13 (+1
        Dex, +3 natural)</p><p>hp 13 (2d8+4)</p><p>Fort +5, Ref +4, Will
        +1</p><p>Offense</p><p>Speed 20 ft., climb 20 ft., swim 20
        ft.</p><p>Melee bite +2 (1d4–1 plus poison)</p><p>Statistics</p><p>Str
        8, Dex 13, Con 14, Int 1, Wis 13, Cha 2</p><p>Base Atk +1; CMB +0; CMD
        11 (can’t be tripped)</p><p>Feats Improved Initiative, Weapon
        Finesse</p><p>Skills Acrobatics +9, Climb +9, Perception +9, Stealth +9,
        Swim +9; Racial Modifiers +4 Perception, +4 Stealth, +8
        Acrobatics</p></td></tr></tbody></table><p></p><table><tbody><tr><td
        data-colwidth="183"><p>advanced</p></td><td><p>Creatures with the
        advanced template are fiercer and more powerful than their ordinary
        cousins.</p><p>Quick Rules: +2 on all rolls (including damage rolls) and
        special ability DCs; +4 to AC and CMD; +2 hp/HD.</p><p>Rebuild Rules: AC
        increase natural armor by +2; Ability Scores +4 to all ability scores
        (except Int scores of 2 or less).</p></td></tr><tr><td
        data-colwidth="183"><p>celestial</p></td><td><p>Celestial creatures
        dwell in the higher planes, but can be summoned using spells such as
        summon monster and planar ally. A celestial creature’s CR increases by
        +1 only if the base creature has 5 or more HD. A celestial creature’s
        quick and rebuild rules are the same.</p><p>Rebuild Rules: Senses gains
        darkvision 60 ft.; Defensive Abilities gains DR and energy resistance as
        noted on the table; SR gains SR equal to new CR +5; Special Attacks
        smite evil 1/day as a swift action (adds Cha bonus to attack rolls and
        damage bonus equal to HD against evil foes; smite persists until target
        is dead or the celestial creature rests).</p><p>Resist Acid, Cold, and
        Electricity 5; DR -; SR 5</p></td></tr><tr><td
        data-colwidth="183"><p>entropic</p></td><td><p>Creatures with the
        entropic template live in planes where chaos is paramount. They can be
        summoned using spells such as summon monster and planar ally. An
        entropic creature’s CR increases by +1 only if the base creature has 5
        or more HD. An entropic creature’s quick and rebuild rules are the
        same.</p><p>Rebuild Rules: Senses gains darkvision 60 ft.; Defensive
        Abilities gains DR and energy resistance as noted on the table; SR gains
        SR equal to new CR +5; Special Attacks smite law 1/day as a swift action
        (adds Cha bonus to attack rolls and damage bonus equal to HD against
        lawful foes; smite persists until the target is dead or the entropic
        creature rests).</p><p>Resist Acid and Fire 5; DR -; SR
        5</p></td></tr><tr><td
        data-colwidth="183"><p>fiendish</p></td><td><p>Creatures with the
        fiendish template live in the Lower Planes, such as the Abyss and Hell,
        but can be summoned using spells such as summon monster and planar ally.
        A fiendish creature’s CR increases by +1 only if the base creature has 5
        or more HD. A fiendish creature’s quick and rebuild rules are the
        same.</p><p>Rebuild Rules: Senses gains darkvision 60 ft.; Defensive
        Abilities gains DR and energy resistance as noted on the table; SR gains
        SR equal to new CR +5; Special Attacks smite good 1/day as a swift
        action (adds Cha bonus to attack rolls and damage bonus equal to HD
        against good foes; smite persists until target is dead or the fiendish
        creature rests).</p><p>Resist Cold and Fire 5; DR -; SR
        5</p></td></tr><tr><td
        data-colwidth="183"><p>resolute</p></td><td><p>Creatures with the
        resolute template live in planes where law is paramount. They can be
        summoned using spells such as summon monster and planar ally. A resolute
        creature’s CR increases by +1 only if the base creature has 5 or more
        HD. A resolute creature’s quick and rebuild rules are the
        same.</p><p>Rebuild Rules: Senses gains darkvision 60 ft.; Defensive
        Abilities gains DR and energy resistance as noted on the table; SR gains
        SR equal to new CR +5; Special Attacks smite chaos 1/day as a swift
        action (adds Cha bonus to attack rolls and damage bonus equal to HD
        against chaotic foes; smite persists until target is dead or the
        resolute creature rests).</p><p>Resist Acid, Cold, and Fire 5; DR -; SR
        5</p></td></tr></tbody></table><p></p>
