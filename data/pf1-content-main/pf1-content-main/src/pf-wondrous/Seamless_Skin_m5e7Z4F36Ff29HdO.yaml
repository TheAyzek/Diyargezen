name: Seamless Skin
system:
  aura:
    school: nec
  cl: 14
  description:
    value: >-
      <p>This skin has been removed from a specific humanoid creature and
      magically preserved. Any creature no more than one size category different
      from the skinned creature can don the skin with 1 minute of effort,
      whereupon the wearer gains the physical appearance and size the skinned
      creature had while alive, and its abilities as defined in the spell alter
      self, but not its immunities, weapon proficiencies, weaknesses, or spell
      resistance. Otherwise, this effect functions like recorporeal
      incarnation.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, recorporeal incarnation (see page 61)</p>
