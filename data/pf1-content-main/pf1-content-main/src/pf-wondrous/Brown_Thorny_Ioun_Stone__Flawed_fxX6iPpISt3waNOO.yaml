    unidentified: >-
      <p>A brown spherical stone with needle-like points jutting out from all
      sides. It may have irregular facets or internal flaws.</p>
    value: >-
      <h3>Effect</h3><p>The flawed version of a thorny ioun stone of any type
      functions as the normal version, but the wearer also takes a -2 penalty to
      CMD against the corresponding type of combat maneuver check.</p><p>+2
      competence bonus on trip attempts. -2 penalty to CMD against trip
      maneuvers.</p><h3>Resonance</h3><p><strong>Method 1, Fixed:
      </strong>Grants the bearer the benefit of either the Acrobatic or the
      Athletic feat. The feat varies by individual ioun stone, and each is
      equally likely (50% chance).</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, creator must be 12th level <strong>Cost</strong>
      3,450 gp</p>
