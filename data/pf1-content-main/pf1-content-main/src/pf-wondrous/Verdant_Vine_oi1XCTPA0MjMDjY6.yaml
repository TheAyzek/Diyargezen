name: Verdant Vine
system:
  aura:
    school: con
  cl: 5
  description:
    value: >-
      <p>Consisting of a vine with five green berries, a verdant vine is worn
      tied around the wrist. Once per day on command, the wearer can pinch a
      berry off the vine, and throw it up to 30 feet away, like a splash weapon.
      Viciously thorny vines erupt in a 20-foot radius from the point of impact,
      even if the berry misses its target. Creatures within the area must
      succeed at a DC 16 Reflex saving throw or become entangled, as the spell
      entangle, as the vines coil around the creature's legs. The vines persist,
      but at the start of the affected creature's turn, it gains a new saving
      throw against the effect. If the affected creature fails the saving throw,
      it also takes 1d4 points of damage.   A DC 20 Strength check, made as a
      standard action, allows an affected creature to break free and end the
      effect. Failing the check causes the vines to constrict, dealing 1d4
      points of damage.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, entangle, plant growth</p>
  price: 6000
  slot: wrists
