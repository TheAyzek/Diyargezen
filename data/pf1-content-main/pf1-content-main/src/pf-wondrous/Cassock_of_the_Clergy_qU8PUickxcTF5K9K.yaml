  description:
    instructions: >-
      <p>If you can cast orisons, you may add 1 to your total number per day by
      modifying your actor's spells tab. </p>
    unidentified: <p>This appears to be a garment typical of those worn by clergy.</p>
    value: >-
      <p>The cut and color of this solemn vestment varies from religion to
      religion, but its properties are the same.</p><h3>Effect</h3><p>The wearer
      may command the cassock of the clergy to display the holy symbol of her
      deity or hide this symbol. At the most basic level, the garment functions
      as a divine focus. Additionally, the wearer gains a +3 competence bonus on
      Charisma-based checks to influence creatures that match her alignment or
      that of her patron deity. Also, the wearer may use bless and sanctuary (DC
      11) each once per day, and may prepare one additional orison each day. If
      the wearer is a spontaneous divine caster, once per day she may spend 1
      hour in prayer to gain an orison of her choice as a spell known for the
      next 24 hours.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.wa0zb2pncesmm9lz]{bless},
      @UUID[Compendium.pf1.spells.Item.yk5bgi6j9kbtigof]{sanctuary},
      </em>creator must be a divine spellcaster <strong>Cost</strong> 2,300
      gp</p>
