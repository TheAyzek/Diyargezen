name: Amulet of the Blooded, Infernal
system:
  aura:
    school: abj
  cl: 9
  description:
    value: >-
      <p>Each different type of amulet of the blooded grants its wearer powers
      from one sorcerer bloodline, but makes him vulnerable to attacks and
      effects that target creatures with the appropriate bloodline (such as a
      blood-hunting weapon). If a creature that already has the associated
      bloodline wears the amulet, the wearer does not gain the abilities listed
      below; instead, the effective level of his bloodline powers increases by
      2. This effect does not stack with other abilities that increase the
      effective level of bloodline powers.   Infernal: This chunk of black
      marble hangs from a chain of brass. The wearer gains fire resistance 5 and
      a +2 bonus on saving throws against poison. Three times per day the wearer
      can make a melee touch attack to cause a creature to become shaken for 4
      rounds. Multiple touches do not stack, but do add to the duration.
      Moderate abjuration; CL 9th; Craft Wondrous Item, chill touch, resist
      energy.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, chill touch, resist energy, creator must be a sorcerer of
      the appropriate bloodline</p>
