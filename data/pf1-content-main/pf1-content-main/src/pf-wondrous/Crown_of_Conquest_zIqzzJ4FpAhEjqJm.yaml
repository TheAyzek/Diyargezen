  description:
    value: >-
      <p>This crown of steel and gold projects an aura of menacing power. The
      wearer gains a +4 competence bonus on Intimidate checks, and whenever he
      confirms a critical hit the crown creates a prayer effect centered on the
      crown's wearer (caster level 5th).   If the wearer of the crown has the
      Leadership feat, he gains a +1 bonus to his Leadership score and any
      follower or cohort of the wearer gains a +1 bonus on attack rolls and
      saving throws against fear effects while within line of sight of the
      wearer.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, bless, eagle's splendor, prayer</p>
