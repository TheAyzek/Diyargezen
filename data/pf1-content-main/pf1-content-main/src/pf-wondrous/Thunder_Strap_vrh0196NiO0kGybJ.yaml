name: Thunder Strap
system:
  aura:
    school: trs
  cl: 9
  description:
    value: >-
      <p>This sturdy leather strap seems worn and weathered, but is as strong as
      steel. When wrapped around the grip of a melee weapon for 24 hours, the
      strap's magic becomes active. Once per day, the wielder of a melee weapon
      so wrapped can hold the weapon aloft for 1 minute to change local weather
      conditions to create a thunderstorm. This acts as control weather, except
      only thunderstorms can be created. Additionally, the wielder can cast call
      lightning storm once per day. If used outside, this spell is cast as if
      the local conditions are stormy.</p><h3>Requirements</h3><p>Craft Wondrous
      Item, call lightning storm, control weather</p>
