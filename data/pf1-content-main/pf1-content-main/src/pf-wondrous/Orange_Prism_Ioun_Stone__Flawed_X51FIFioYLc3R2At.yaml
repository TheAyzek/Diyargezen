  description:
    instructions: >-
      <p>Update the untargeted change on the changes tab of this item to the
      corresponding ability.  </p><p>Only 25% of cracked or flawed ioun stones
      grant resonant powers when placed in a wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
      about Ioun Stones}</p>
    unidentified: >-
      <p>This is a long orange stone where the top and bottom ends have the same
      number of sides (such as a hexagram). The width and angle of each side is
      usually the same as all other sides.  It may have irregular facets or
      internal flaws.</p><p></p>
    value: >-
      <h3>Effect</h3><p>This stone grants a +1 caster level and a -2 penalty to
      the wearer’s primary casting ability score (Wisdom for clerics,
      Intelligence for wizards, and so
      on).</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>Every time
      the bearer casts a spell, he rolls 1d4-2 and adds the result (as well as
      the +1 caster level granted by the normal power of the ioun stone) to his
      caster level.</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, creator must be 12th level <strong>Cost</strong>
      12,500 gp</p>
