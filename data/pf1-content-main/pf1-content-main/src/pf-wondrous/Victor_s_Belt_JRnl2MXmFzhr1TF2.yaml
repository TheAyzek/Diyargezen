    value: >-
      <p>This thick leather belt is adorned with several oversized iron plates
      and disks depicting images of orc gladiators in
      battle.</p><h3>Effect</h3><p>The wearer of a victor's belt gains a +2
      morale bonus on all combat maneuver checks and to Combat Maneuver Defense.
      </p><p>In addition, the wearer can enter a rage (as the rage spell) as a
      standard action once per day. Whenever the wearer takes an amount of
      damage equal to at least half his current hit points in a single round,
      there is a 50% chance that the belt activates its rage ability
      automatically as an immediate action, provided the power has not already
      been activated that day and the wearer is not already raging. Regardless
      of how the rage is activated, it lasts for 5
      rounds.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.05i5rxwim12hwktu]{bull's strength},
      @UUID[Compendium.pf1.spells.Item.8u1xa5javcxc6szk]{rage}
      </em><strong>Cost</strong> 2,500 gp</p>
