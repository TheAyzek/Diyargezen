  description:
    value: >-
      <p>This ring is forged from electrum and inlaid with runes. If the wearer
      can cast summon monster spells, the wearer adds silvansheeB2 to the
      3rd-level list of monsters she can summon with those spells, adds
      vulpinalB2 to the 5th-level list, adds avoralB2 to the 7th-level list, and
      adds leonalB2 to the 8th-level list. Also, once per day on command the
      wearer can use this ring to summon a silvanshee, as if by the summon
      monster III
      spell.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, planar ally or planar binding, creator must be neutral good</p>
