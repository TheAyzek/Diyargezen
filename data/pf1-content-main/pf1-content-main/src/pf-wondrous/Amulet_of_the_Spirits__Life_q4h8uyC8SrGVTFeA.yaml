name: Amulet of the Spirits, Life
system:
  aura:
    custom: true
    school: conjuration and necromancy
  cl: 10
  description:
    value: >-
      <p>Each different type of amulet of the spirit grants its wearer powers
      from one type of shaman spirit bond, but makes her vulnerable to attacks
      and effects that target creatures with that spirit bond (such as a
      spirit-hunting weapon). If a creature that already has the associated
      mystery or spirit wears the amulet, that wearer does not gain the
      abilities listed below; instead, the effective level of her mystery or
      spirit powers increases by 2. This effect does not stack with other
      abilities that increase the effective level of mystery or spirit
      powers.     Life: This amulet is formed from a petrified robin's egg
      strung on a simple thong of woven hair. The wearer becomes more receptive
      to healing magic, regaining an additional 1d6 hit points from any cure
      spell cast upon her. In addition, once per day as a standard action, the
      wearer can cut off any single creature within 30 feet from all forms of
      magical healing and effects that remove conditions. A DC 13 Will saving
      throw negates this effect, which otherwise lasts for 1 minute. Moderate
      conjuration and necromancy; CL 10th; Craft Wondrous Item, cure light
      wounds, inflict moderate
      wounds.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, cure light wounds, inflict moderate wounds, creator must be
      a shaman with the appropriate spirit</p>
