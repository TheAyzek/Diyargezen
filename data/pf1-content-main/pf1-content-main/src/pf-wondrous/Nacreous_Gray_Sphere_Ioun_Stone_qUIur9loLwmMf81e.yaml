    unidentified: <p>This spherical stone is a lustrous gray color.</p>
    value: >-
      <h3>Effect</h3><p>This stone protects you from ability score penalties
      from aging and you cannot be magically aged. Any penalties you have
      already incurred remain in place. Bonuses still accrue, and you still die
      of old age when your time is up. If you lose the stone or its abilities
      are negated in some way, all age and penalties apply
      immediately.</p><h3>Resonance</h3><p><strong>Method 1, Fixed:
      </strong>Miss chance against incorporeal creatures decreases to
      25%.</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, <em>bear's endurance</em>, creator must be 12th level
      <strong>Cost</strong> 5,000 gp</p><hr /><p><strong>Editor's note</strong>:
      the sourcebook indicates a moderate strength aura despite the item's
      Caster Level of 12</p>
