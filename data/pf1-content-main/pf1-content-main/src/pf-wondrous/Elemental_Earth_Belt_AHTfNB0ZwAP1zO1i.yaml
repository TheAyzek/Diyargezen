    value: >-
      <p>This belt is constructed of flat pieces of slate connected with strong
      leather straps.</p><h3>Effect</h3><p>This belt grants its wearer a +4
      enhancement bonus to Constitution, and the wearer is immune to effects
      that would push, pull, or forcefully move the wearer. This offers no
      protection from teleportation effects. Furthermore, once per day on
      command, the wearer can take the form of a Large earth elemental, and
      though subject to the elemental body III spell. Treat the enhancement
      bonus to Constitution as a temporary ability bonus for the first 24 hours
      the belt is worn.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.usdv1eqvibmxun6x]{bear's endurance},
