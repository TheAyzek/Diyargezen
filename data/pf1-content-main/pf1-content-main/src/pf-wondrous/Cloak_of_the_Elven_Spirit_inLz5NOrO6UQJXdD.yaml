name: Cloak of the Elven Spirit
system:
  aura:
    school: trs
  cl: 12
  description:
    value: >-
      <p>When this plain gray cloak is worn with the hood drawn up around the
      head, the wearer gains a +5 competence bonus on Stealth checks. If the
      wearer spends at least 1 minute concentrating on blending the cloak's
      colors to match her surroundings, she can attempt Stealth checks without
      cover or concealment until she makes an attack or moves more than half her
      base speed on her turn. Once she breaks this effect, she must spend
      another minute to reactivate it.  14th Level: The cloak grants its wearer
      the camouflage ranger ability in forested areas.  18th Level: At will,
      when the wearer envelops herself in the cloak as a standard action, she
      can become invisible as invisibility.  20th Level: If the wearer also
      wears the boots of the elven spirit (see page 170), she can focus the
      cloak's invisibility effect. As a free action, she can choose to make it
      so her attacks do not end the invisibility effect for 1 round. She can use
      this ability for 10 rounds per day, but the rounds need not be
      consecutive.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, blend, greater invisibility, invisibility, creator
      must be an elf</p>
