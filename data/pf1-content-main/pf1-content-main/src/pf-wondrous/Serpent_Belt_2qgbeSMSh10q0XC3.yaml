    unidentified: <p>This belt is unremarkable.</p>
    value: >-
      <h3>Effect</h3><p>This belt's wearer gains a +4 bonus on saves against
      poisons and a +2 bonus on Escape Artist checks. In addition, once per day
      on command, the belt can be animated as a venomous snake or constrictor
      snake (Bestiary 255) that obeys the animator's spoken commands for up to
      an hour. If the animated snake is slain or moves @Distance[100;dual] away
      from the animator, the snake reverts into belt
      form.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>beast form I,
      @UUID[Compendium.pf1.spells.Item.6l904edkt8jv9jor]{neutralize poison},
      @UUID[Compendium.pf1.spells.Item.9fdte3s6lnanf9rg]{summon nature's ally
      II} </em><strong>Cost</strong> 4,500 gp</p><p><strong>Editor's
      note</strong>: the sourcebook indicates that "beast form I" is a crafting
      requirement, but no spell with that name exists,
      @UUID[Compendium.pf1.spells.Item.tjdfluulncmqacc3]{Beast Shape I} is the
      likely intended requirement.</p>
