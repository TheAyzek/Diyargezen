name: Canopic Stone
system:
  aura:
    school: con
  cl: 12
  description:
    value: >-
      <p>A spellcaster must prepare a canopic stone, a talisman that typically
      takes the form of a ceramic totem or amulet bound in silver. Upon creating
      this object, the bearer can summon a vilkacis once per day. The stone
      grants no control over the vilkacis, but the creature will not attack or
      attempt to possess the stone's bearer. Upon being summoned, the vilkacis
      turns its attention to the nearest creature other than the summoner,
      attempting to possess the creature's body and go on a murderous rampage.
      Using a canopic stone to summon a vilkacis is considered an evil act. 
      Although many vilkacis are purposefully created and employed by evil
      spellcasters, some manifest spontaneously. These beings wander and rampage
      as they please, but still are bound to a talisman similar to a canopic
      stone. This spontaneously created artifact can be utilized by those who
      discover it and discern its importance in the same way as can a canopic
      stone created specifically to summon and control a vilkacis, and typically
      takes the form of the dead werewolf 's skull, the silver weapon that
      killed the werewolf, or a talisman it bore in
      life.<h3>Requirements</h3><p>Craft Wondrous Item, create undead, rage</p>
