name: Eidolon Anchoring Harness
system:
  aura:
    school: abj
  cl: 7
  description:
    unidentified: <p>Studs line the straps of this ornate leather harness. </p>
    value: >-
      <p>Loadstone studs line the straps of this ornate leather
      harness.</p><h3>Effect</h3><p>When worn by an eidolon, the bindings act as
      a dimensional safety harness, anchoring the outsider to its current plane.
      Any time the eidolon would be forced to return to its home plane (such as
      when it's reduced to negative hit points equal to its Constitution score
      or when its master is rendered unconscious), it can expend one use of its
      summoner's summon monster spell-like ability as a free action to remain on
      the Material Plane for 1 round. The summoner does not need to be conscious
      for the eidolon to use this ability, but he must be within
      @Distance[100;dual]. If the summoner is conscious, he can refuse to allow
      this expenditure (which means the eidolon is forced back to its home
      plane).</p><p>If the condition that would have sent the eidolon back to
      its home plane is still in effect after 1 round has passed, the eidolon
      may expend another use of its master's summon monster spell-like ability;
      otherwise it immediately returns to its home
      plane.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.0vmz2klcfvkc3h0v]{dimensional
      anchor}</em> <strong>Cost</strong> 3,000 gp</p>
