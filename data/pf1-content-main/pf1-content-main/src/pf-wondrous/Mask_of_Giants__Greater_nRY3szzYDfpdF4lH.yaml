name: Mask of Giants, Greater
system:
  aura:
    school: trs
  cl: 13
  description:
    value: >-
      <p>A greater mask of giants has all the powers of a lesser mask of giants,
      plus it grants additional abilities in giant form. If the form has any of
      the following abilities, the wearer gains the listed ability: rend (2d6
      damage), regeneration 5 (acid or fire), rock catching, rock throwing
      (range 60 feet, 2d6 damage). If the chosen giant form has immunity or
      resistance to any energy type, the wearer gains resistance 20 to that
      energy type when in giant form. If the giant form has vulnerability to an
      energy type, the wearer gains that vulnerability when in giant form.   In
      giant form, the wearer gains a +6 size bonus to Strength, a -2 penalty to
      Dexterity, a +4 size bonus to Constitution, and a +4 natural armor
      bonus.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, giant form I</p>
