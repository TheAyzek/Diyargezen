  description:
    unidentified: >-
      <p>This is a sleeveless white tabard, suitable to be worn over armor or
      other clothing, a symbol is prominent on the garment.</p>
    value: >-
      <p>This sleeveless white tabard, worn over armor or other clothing,
      prominently bears the symbol of the Glorious Reclamation and can be used
      as a divine focus by members of the Glorious Reclamation who are followers
      of Iomedae. A greater glorious tabard bears the symbol of the Glorious
      Reclamation in gold.</p><h3>Effect</h3><p>It has all the powers of a
      @UUID[Compendium.pf-content.pf-wondrous.Item.DiKBuwjJ6XXzhUbb]{lesser
      glorious tabard} but can be used twice per day. In addition, whenever a
      greater glorious tabard is activated, all longswords within
      @Distance[20;dual] shed light as per a torch and ignore the DR of evil
      creatures (except DR/epic) for 3 rounds. When a greater glorious tabard is
      used as a divine focus to cast a spell, the wearer does not need any
      material components that cost more than 5 gp. A glorious tabard functions
      only for wearers who are both members of the Glorious Reclamation and
      followers of
      Iomedae.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.cvym88lup9fa8sl5]{veil of heaven},
      @UUID[Compendium.pf1.spells.Item.9n0hrflrshpxv4ns]{weapons against evil},
      </em>creator must be member of Glorious Reclamation and follower of
      Iomedae <strong>Cost</strong> 1,625 gp</p>
