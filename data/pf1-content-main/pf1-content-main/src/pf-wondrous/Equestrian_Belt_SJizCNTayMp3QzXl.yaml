    value: >-
      <p>This belt is worked with images of horses stampeding across a barren,
      windswept plain.</p><h3>Effect</h3><p>The belt's wearer automatically
      succeeds at any check to guide with the knees, stay in the saddle, fight
      with a combat-trained mount, control a mount in battle, or make a fast
      mount or dismount, as long as the belt's wearer is wearing medium, light,
      or no armor. Furthermore, the belt grants a +4 competence bonus on all
      other Ride checks, including ones made while the wearer is in heavy
      armor.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.ns8jbp0ilbvbvuif]{cat's grace}</em>
      <strong>Cost</strong> 1,600 gp</p>
