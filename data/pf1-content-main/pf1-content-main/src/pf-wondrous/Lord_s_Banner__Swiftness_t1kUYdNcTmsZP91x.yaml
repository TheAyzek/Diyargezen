name: Lord's Banner, Swiftness
system:
  aura:
    custom: true
    school: various schools
  cl: 10
  description:
    value: >-
      <p>A lord's banner is a cloth flag or standard, typically at least 2 feet
      wide and 4 feet long (though some are up to twice that size), meant to be
      carried and displayed on a lance, polearm, frame, or staff. It has no
      effect when not mounted properly or when laying on the ground. It normally
      depicts the insignia or heraldic symbol of a particular noble. A lord's
      banner may be carried (on foot or mounted) or planted. In the latter case,
      the banner does not need a bearer, but if it is toppled or touched by an
      enemy, it loses its effectiveness until reclaimed and replanted by allies
      of its owner. Swiftness: A group or army traveling under a lord's banner
      of swiftness can make a forced march without needing Constitution checks
      or suffering any nonlethal damage from doing so, allowing them to cover
      great distances while still arriving ready to do battle. This ability
      affects all allied creatures within 1 mile as long as they are able to see
      the banner at least once a day.</p><h3>Requirements</h3><p>Craft Wondrous
      Item, freedom of movement</p>
