  description:
    unidentified: >-
      <p>This dark leather belt seems to have a piece of a cracked gem in its
      plain brass buckle.</p>
    value: >-
      <p>Often created by those who venerate Trelmarixian, the Horseman of
      Famine, this dark leather belt has a piece of a cracked soul gem in its
      plain brass buckle.</p><h3>Effect</h3><p>The wearer of a belt of
      Trelmarixian doesn't need to eat and is immune to the effects of
      starvation, though she begins to take on an emaciated appearance after
      several days. Three times per day, the wearer can touch a creature
      (requiring a successful touch melee attack) to affect it with incredibly
      painful pangs of hunger. If the target fails a DC 15 Fortitude save, it
      takes 2d6 points of nonlethal damage and is fatigued. Creatures that don't
      need to eat or are immune to nonlethal damage are immune to this
      ability.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.qn947hen3wrelxhz]{create food and
      water}, @UUID[Compendium.pf1.spells.Item.t1w2zq5fx7mislq8]{touch of
      fatigue}; </em><strong>Cost</strong> 2,000 gp</p>
  effectNotes:
    - >-
      Creatures that don't need to eat or are immune to nonlethal damage are
