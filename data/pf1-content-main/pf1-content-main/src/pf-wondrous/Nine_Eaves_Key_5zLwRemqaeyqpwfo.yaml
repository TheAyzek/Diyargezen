name: Nine-Eaves Key
system:
  aura:
    school: trs
  cl: 3
  description:
    value: >-
      <p>This small iron key has the number 9 and a right triangle engraved upon
      it. While the Nine-Eaves key is held, the bearer can use open/close at
      will, but only to open, not to close. Once per day as a standard action,
      the bearer can touch the Nine-Eaves key to a magic item. For the following
      24 hours, all Use Magic Device skill checks to use or activate the touched
      magic item gain a +4 insight bonus.<h3>Requirements</h3><p>Craft Wondrous
      Item, identify, open/close</p>
