name: Spiritualist Rings
system:
  aura:
    school: nec
  cl: 12
  description:
    value: >-
      <p>These four garish and gaudy rings must be worn on one hand, though they
      take up only a single ring slot. They grant the wearer the ability to
      commune with and affect the dead in the following ways.   • The wearer can
      use speak with dead, as the spell, three times per day. It takes 10
      minutes to use this ability.   • The wearer can use spectral hand, as the
      spell, three times per day.   • The wearer's weapons gain the ghost touch
      weapon special ability while the wearer is wielding the weapons.   • The
      wearer gains a +4 sacred or profane bonus on saving throws against
      positive and negative energy effects. The bonus depends on the wearer's
      alignment-good-aligned wearers gain a sacred bonus, whereas evil-aligned
      wearers gain a profane bonus. Neutral-aligned wearers pick either a sacred
      or profane bonus when the ring is first put on, which cannot be changed
      later .</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, speak with dead, spectral hand, plane shift</p>
