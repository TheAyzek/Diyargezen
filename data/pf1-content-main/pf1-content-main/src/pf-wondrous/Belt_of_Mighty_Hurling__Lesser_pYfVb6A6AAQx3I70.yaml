  description:
    instructions: >-
      <p>You must edit each thrown weapon attack on your actor to add the range
      modifier and to alter the attack ability to strength.</p>
    unidentified: >-
      <p>This thick leather belt is buckled with a bright bronze clasp in the
      shape of a fist.</p>
    value: >-
      <h3>Effect</h3><p>When worn, it grants its wearer a +2 enhancement bonus
      to Strength and allows him to apply his Strength modifier as a bonus on
      attack rolls instead of his Dexterity modifier when making ranged attacks
      with thrown weapons. Also, the range increment of any weapon thrown by the
      wearer gains a +10-foot bonus. Treat this Strength bonus as a temporary
      ability bonus for the first 24 hours the belt is
      worn.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
