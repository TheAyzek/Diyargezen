  description:
    instructions: >-
      <p>This stone is set to modify Strength. Any changes to the modified score
      must be done manually on the details tab of this item by editing the
      change target.</p><p>Only 75% of normal ioun stones grant resonant powers
      when placed in a wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
      about Ioun Stones}</p>
    unidentified: >-
      <p>This is a reddish purple stone is in a regular shape with the top and
      bottom ends having the same number of sides (such as a hexagram). The
      width and angle of each side is usually equal.</p>
    value: >-
      <h3>Effect</h3><p>This stone grants you a +2 enhancement bonus to any one
      ability score of your choosing. The selected ability score can be changed
      only once per day at a time unique to each stone (typically sunrise or
      sunset). A stone attuned to a specific ability score maintains that
      attunement until changed at the specified time of day, regardless of how
      long it has remained unused or how many times it changes
      hands.</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>+1 bonus
      on one saving throw not modified by the ability score the stone is
      currently attuned to (chosen at the same time as the ability
      score).</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, <em>bear's endurance, bull's strength, cat's grace,
      eagle's splendor, fox's cunning, owl's wisdom</em>, creator must be 12th
      level <strong>Cost </strong>8,000 gp</p>
