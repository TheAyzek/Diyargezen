name: Ring of Natural Attunement (drake)
system:
  aura:
    school: con
  cl: 7
  description:
    value: >-
      <p>This coiling band is made of jade carved into the shape of a sea drake.
      If the wearer can cast summon nature's ally spells, the wearer adds forest
      drakeB2 and shadow drakeB4 to the 4th-level list of monsters he can summon
      with those spells, adds flame drakeB2 to the 5th-level list, adds frost
      drakeB2 to the 6th-level list, and adds desert drakeB3 to the 9th-level
      list. Also, once per day on command the wearer can use this ring to summon
      a shadow drake, as if by the summon nature's ally IV
      spell.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, greater magic fang, summon nature's ally IV</p>
