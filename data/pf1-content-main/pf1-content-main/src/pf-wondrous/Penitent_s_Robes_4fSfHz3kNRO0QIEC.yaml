name: Penitent's Robes
system:
  aura:
    custom: true
    school: varied
  cl: 16
  description:
    value: >-
      <p>This humble, threadbare robe grants a +1 resistance bonus on all saving
      throws. A mythic wearer can unlock additional powers by upholding vows.
      The wearer selects up to five vows, but no more than she has mythic tiers.
      For each vow taken, the wearer must expend one use of mythic power. This
      use can't be regained as long as the vow is kept and the wearer retains
      the robe. After 24 hours adhering to one or more vows, the wearer gains
      additional benefits from the robe.  • 1 vow: +2 resistance bonus on all
      saving throws, +1 competence bonus on all skill checks • 2 vows: +3
      resistance bonus on all saving throws, +4 armor bonus to AC • 3 vows: +4
      resistance bonus on all saving throws, +2 competence bonus on all skill
      checks • 4 vows: +5 resistance bonus on all saving throws, +6 armor bonus
      to AC • 5 vows: +8 armor bonus to AC, and all save DCs for the wearer's
      spells increase by 1  The wearer receives the bonuses from lower levels as
      well. For example, with 3 vows, the wearer receives a +4 resistance bonus
      on saving throws, a +2 competence bonus on all skill checks, and a +4
      armor bonus to AC. The armor bonus provided by the robe can be further
      improved by magic vestment and similar spells.  The wearer can select from
      the following vows.  • Abstain from consuming meat and touching dead
      creatures.  • Abstain from consuming liquor, drugs, and similar
      substances, including any magic item that takes effect through eating or
      drinking.  • Carry nothing made of metal.  • Refrain from dealing lethal
      damage.  • Refrain from speaking.  • Refrain from touching others,
      including touching them with or through clothing.  • Speak and write only
      the truth.  If a vow is broken, the robe's benefits immediately drop to
      those granted by the number of vows still kept. Broken vows can be
      regained only by way of an atonement
      spell.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, Mythic Crafter, magic vestment, prayer, resistance</p>
