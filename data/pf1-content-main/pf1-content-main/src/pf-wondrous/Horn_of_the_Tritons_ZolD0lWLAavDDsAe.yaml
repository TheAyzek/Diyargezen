name: Horn of the Tritons
system:
  aura:
    school: con
  cl: 9
  description:
    value: >-
      <p>This device is a large, intricately inscribed and decorated conch shell
      that can be blown once per day (except by a triton, who can sound it three
      times per day). Blowing the horn activates any one of the following
      functions: • Calm rough waters in a 1-mile radius. Alternatively, this
      functions as a dismissal spell against a targeted water elemental (DC 19
      negates).  • Summon 1d4+1 sharks or 1d3 advanced sharks as if using summon
      nature's ally V.  • Create a fear effect (DC 16 negates) in a 500-foot
      radius that only affects creatures with the aquatic or amphibious subtype
      which have Intelligence scores of 1 or 2.  Any sounding of a horn of the
      tritons can be heard by all tritons within a 3-mile
      radius.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, control water, dismissal, fear, summon nature's ally V,
      creator must be a triton</p>
