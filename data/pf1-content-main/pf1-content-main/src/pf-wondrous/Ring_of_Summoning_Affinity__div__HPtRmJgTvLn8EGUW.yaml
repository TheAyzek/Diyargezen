    school: conjuration [chaos evil]
  cl: 5
  description:
    value: >-
      <p>This ring is shaped to resemble a snake consuming its own tail. If the
      wearer can cast summon monster spells, the wearer adds doruB3 to the
      3rd-level list of monsters he can summon with those spells, adds aghashB3
      to the 4th-level list, adds pairakaB3 to the 6th-level list, adds
      ghawwasB3 to the 7th-level list, adds shiraB3 to the 8th-level list, and
      adds sepidB3 to the 9th-level list. Also, once per day on command the
      wearer can use this ring to summon a doru, as if by the summon monster III
      spell.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge
      Ring, planar ally or planar binding, creator must be chaotic evil</p>
