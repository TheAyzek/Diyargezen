    unidentified: >-
      <p>This tattered and yellowed belt appears to be made up of dozens of
      interwoven linen wraps bound together by a simple stone buckle at the
      front.</p>
    value: >-
      <p>Tattered and yellowed, this belt is made up of dozens of interwoven
      linen wraps bound together by a simple stone buckle at the front. Crafted
      from mummifies' wrappings, these belts are commonly used by explorers in
      the vast deserts of what was once Ancient
      Osirion.</p><h3>Effect</h3><p>While worn, the belt grants a +4 resistance
      bonus on saving throws against disease, including supernatural diseases
      such as mummy rot. A canopic wrap also causes strange internal shifts in
      key organs, moving them randomly within the body. Because of this odd
      effect, the wearer gains the benefits of the
      @UUID[Compendium.pf-content.pf-special-qualities.Item.ESa4zBfizx2LWPGx]{light
      fortification} armor special ability. This effect also plays havoc on
      trained healers, however, increasing the DC of any Heal check used on the
      wearer by 5.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.usdv1eqvibmxun6x]{bear's endurance},
      @UUID[Compendium.pf1.spells.Item.ny2qxht2aeesoi08]{greater infernal
      healing} </em><strong>Cost</strong> 5,250 gp</p>
