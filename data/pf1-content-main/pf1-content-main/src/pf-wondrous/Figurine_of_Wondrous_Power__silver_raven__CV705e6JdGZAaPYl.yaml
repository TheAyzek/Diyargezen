name: Figurine of Wondrous Power (silver raven)
system:
  aura:
    custom: true
    school: enchantment and transmutation
  cl: 6
  description:
    value: >-
      <p>Each of the several kinds of figurines of wondrous power appears to be
      a miniature statuette of a creature an inch or so high (with one
      exception). When the figurine is tossed down and the correct command word
      spoken, it becomes a living creature of normal size (except when noted
      otherwise below). The creature obeys and serves its owner. Unless stated
      otherwise, the creature understands Common but does not speak. If a
      figurine of wondrous power is broken or destroyed in its statuette form,
      it is forever ruined. All magic is lost, its power departed. If slain in
      animal form, the figurine simply reverts to a statuette that can be used
      again at a later time. Silver Raven: This silver figurine turns into a
      raven on command (but it retains its metallic consistency, which gives it
      hardness 10). Another command sends it off into the air, bearing a message
      just like a creature affected by an animal messenger spell. If not
      commanded to carry a message, the raven obeys the commands of its owner,
      although it has no special powers or telepathic abilities. It can maintain
      its nonfigurine status for only 24 hours per week, but the duration need
      not be continuous.</p><h3>Requirements</h3><p>Craft Wondrous Item, animal
      messenger, animate objects</p>
