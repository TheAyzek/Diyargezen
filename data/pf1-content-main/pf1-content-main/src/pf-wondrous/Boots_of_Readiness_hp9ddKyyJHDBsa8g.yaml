  description:
    value: >-
      <p>These tight-fitting, black leather boots make their wearer more
      prepared before she acts in battle. When the wearer has not yet acted at
      the beginning of a fight, the boots provide a +2 luck bonus on saving
      throws and 12 temporary hit points. Both effects fade when the wearer's
      first turn arrives, even if she delays.  11th Level: The wearer of these
      boots can't be caught flat-footed.  13th Level: Before the wearer has
      taken her first turn in combat, she can move up to her speed as an
      immediate action without provoking attacks of opportunity. She can no
      longer use this ability once her first turn arrives, even if she
      delays.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, haste, moment of prescience</p>
