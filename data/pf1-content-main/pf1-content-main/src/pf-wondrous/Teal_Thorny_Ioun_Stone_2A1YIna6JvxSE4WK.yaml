    value: >-
      <h3>Effect</h3><p>Used by warriors of ancient Azlant, these strangely
      shaped ioun stones are popular with combat-savvy members of the Pathfinder
      Society. These variant ioun stones resemble a thorny sphere-each possesses
      a circular shape with dozens of needle-like points jutting out. Each type
      of stone is a different color and grants its wearer a +2 competence bonus
      on checks for a specific combat maneuver. All varieties of thorny ioun
      stone have the same price and cost.</p><p>+2 competence bonus on disarm
      attempts.</p><h3>Resonance</h3><p><strong>Method 1, Fixed</strong>: Grants
      the bearer the benefit of either the Acrobatic or the Athletic feat. The
      feat varies by individual ioun stone, and each is equally likely (50%
      chance).</p><p><strong>Method 2, Variable</strong>:
      @UUID[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]{Ioun
      Stone Resonance Powers Method
      2}</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Wondrous
      Item, creator must be 12th level <strong>Cost</strong> 4,000 gp</p>
