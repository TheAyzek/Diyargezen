name: Necrograft Arm
system:
  aura:
    custom: true
    school: necromancy and transmutation
  cl: 13
  description:
    value: >-
      <p>An arm of undead flesh allows its host to lift up to 1-1/2 times his
      maximum load over his head. A humanoid with two necrograft arms can lift
      up to twice his maximum load over his head. Each necrograft arm also
      provides its host with a natural slam attack (replacing any natural
      attacks that limb may have once had) that deals 1d4 points of bludgeoning
      damage (1d3 for Small creatures) as a secondary attack. If a host attacks
      with only slam attacks in a round, the slams are instead considered
      primary attacks. A necrograft arm is clumsy, imposing a cumulative -2
      circumstance penalty on all Craft, Disable Device, and Sleight of Hand
      checks per limb replaced, as well as on relevant Perform checks (such as
      for stringed instruments and wind
      instruments).</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, animate dead, regenerate, creator must have 8 ranks
      in Heal</p>
