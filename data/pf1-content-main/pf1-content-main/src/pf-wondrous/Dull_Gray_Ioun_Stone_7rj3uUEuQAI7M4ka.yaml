    unidentified: <p>A dull gray stone that may be in any shape.</p>
    value: >-
      <h3>Effect</h3><p>These are ioun stones that have been burned out or
      otherwise rendered all but powerless. They retain the ability to float and
      orbit, and are useful as the target of spells such as continual flame,
      daylight, and silence, allowing you to keep your hands free. They may be
      any shape (cabochon, disk, ellipsoid, and so
      on).</p><h3>Resonance</h3><p><strong>Method 1, Fixed</strong>: Read magic
      1/day for 10 minutes.</p><p><strong>Method 2, Variable</strong>:
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, creator must be 12th level <strong>Cost </strong>12
      gp, 5 sp</p><hr /><p><strong>Editor's note</strong>: the sourcebook,
      seekers of secrets, indicates a faint strength aura despite the item's
      Caster Level of 12</p>
