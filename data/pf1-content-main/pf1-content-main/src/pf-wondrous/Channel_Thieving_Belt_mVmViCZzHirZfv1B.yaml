    unidentified: <p>This wide black leather belt is inlaid with spiraling copper runes.</p>
    value: >-
      <p>This wide black leather belt is inlaid with spiraling copper
      runes.</p><h3>Effect</h3><p>If the wearer is a living creature, she heals
      each time she is within the area of a burst of channeled positive energy
      used to deal damage to undead creatures. If the wearer is an undead
      creature, it heals each time it is within the area of a burst of channeled
      negative energy used to deal damage to living creatures. The wearer
      regains 1 hit point for each 1d6 points of energy channeled. The belt has
      no effect if its wearer is the one channeling
      energy.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.xoc3vhg3btmfjauq]{cure light wounds},
      @UUID[Compendium.pf1.spells.Item.qooag8g9dxck4lik]{inflict light wounds}
      </em><strong>Cost</strong> 1,000 gp</p>
