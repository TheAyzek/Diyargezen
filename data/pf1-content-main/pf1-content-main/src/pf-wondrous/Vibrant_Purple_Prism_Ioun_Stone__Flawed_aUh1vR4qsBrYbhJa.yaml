name: Vibrant Purple Prism Ioun Stone, Flawed
system:
  aura:
    custom: true
    school: varied
  cl: 12
  description:
    instructions: >-
      <p>Stored spells in the vibrant purple stone must be placed by a
      spellcaster but can be used by anyone (see
      @UUID[Compendium.pf-content.pf-wondrous.Item.MsAz3ZYa0hstss3e]).</p><p>Only
      25% of cracked or flawed ioun stones grant resonant powers when placed in
      a wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
      about Ioun Stones}</p>
    unidentified: >-
      <p>A long purple stone where the top and bottom ends have the same number
      of sides (such as a hexagram). The width and angle of each side is usually
      the same as all other sides.  It may have irregular facets or internal
      flaws.</p>
    value: >-
      <h3>Effect</h3><p>This stone stores three levels of spells, as a
      @UUID[Compendium.pf-content.pf-wondrous.Item.MsAz3ZYa0hstss3e]{ring of
      spell storing}, except casting spells out of the stone requires at least a
      full-round action.</p><p></p><h3>Resonance</h3><p><strong>Method 1,
      Fixed:</strong> As a standard action, the bearer can expend a stored spell
      to refresh a cast spell of the same level as if using a pearl of power.
      The bearer can refresh up to 3 spell levels per day using this
      ability.</p><p><strong>Method 2, Variable:</strong>
      @Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, creator must be 12th level <strong>Cost</strong>
      18,000 gp</p>
