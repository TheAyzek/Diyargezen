  description:
    instructions: >-
      <p>Update the context note on the changes tab of this item to reflect the
      chosen check type. This check type is chosen when the stone is created.
      Delete those that do not apply.</p><p>Only 25% of cracked or flawed ioun
      stones grant resonant powers when placed in a wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
