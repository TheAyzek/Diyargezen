name: Amulet of the Blooded, Elemental
system:
  aura:
    school: evo
  cl: 9
  description:
    value: >-
      <p>Each different type of amulet of the blooded grants its wearer powers
      from one sorcerer bloodline, but makes him vulnerable to attacks and
      effects that target creatures with the appropriate bloodline (such as a
      blood-hunting weapon). If a creature that already has the associated
      bloodline wears the amulet, the wearer does not gain the abilities listed
      below; instead, the effective level of his bloodline powers increases by
      2. This effect does not stack with other abilities that increase the
      effective level of bloodline powers.    Elemental: This amulet comes in a
      variety of minerals depending on its powers, as shown in the table below.
      The wearer gains resistance 5 against the energy type shown in the table.
      Once per day as a standard action, the wearer can unleash a blast of
      elemental power. This 20-foot-radius burst deals 4d6 points of damage
      (Reflex DC 14 half) of the energy type listed. Creatures that fail their
      saves gain vulnerability to the energy type until the end of the wearer's
      next turn. Moderate evocation; CL 9th; Craft Wondrous Item, elemental
      aura, resist energy.  d% Material Energy Type 01-25 Anhydrite Electricity
      26-50 Hematite Acid 51-75 Beryl Fire 76-100 Forsterite
      Col.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item,elemental aura, resist energy, creator must be a sorcerer of
      the appropriate bloodline</p>
