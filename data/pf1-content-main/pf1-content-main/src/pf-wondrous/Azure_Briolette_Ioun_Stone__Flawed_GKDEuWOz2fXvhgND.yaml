name: Azure Briolette Ioun Stone, Flawed
system:
  aura:
    custom: true
    school: enchantment and necromancy
  cl: 12
  contextNotes:
    - target: spellEffect
      text: >-
        Whenever a creature fails a saving throw against a mind-affecting spell
        cast by you, you gain a number of temporary hit points equal to the
        targeted creature's Charisma bonus (minimum 0, maximum your Charisma
        bonus) which last until the start of your next turn. These temporary hit
        points do not stack and you can't gain temporary hit points from a
        creature that voluntarily fails its saving throw against your spells.
  description:
    instructions: >-
      <p>Only 25% of cracked or flawed ioun stones grant resonant powers when
      placed in a wayfinder.
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.HYNbOvjpMu4OZlfs.JournalEntryPage.pTSudwbTyH0lmjPU]{Rules
      about Ioun Stones}</p>
    unidentified: >-
      <p>This pear-shaped ioun stone sparkles in a brilliant blue color. It may
      have irregular facets or internal flaws.</p>
    value: >-
      <h3>Effect</h3><p>This stone functions as
      @UUID[Compendium.pf-content.pf-wondrous.Item.KaNvjYxKclX48Tzg]{normal},
      but the number of temporary hit points gained from the azure briolette
      ioun stone cannot exceed the user’s Charisma bonus (minimum
      0).</p><h3>Resonance</h3><p><strong>Method 1, Fixed: </strong>This stone
      allows the user to pick up on psychic resonance from corpses. So long as
      the user has carried the ioun stone continuously for at least 24 hours,
      the first three corpses touched by the user each day babble residual
      psychic impressions into the bearer's mind. This functions as the
      @UUID[Compendium.pf1.spells.Item.z3ysa1xxmzgj14sd]{grave words} spell,
      except that only the user can hear the corpse speak.</p><p><strong>Method
      2, Variable:
      </strong>@Draw[Compendium.pf-content.pf-tables.RollTable.PTr7AMWWOFwEcd98]</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Wondrous Item, creator must be 12th level <strong>Cost</strong>
      7,000 gp</p>
