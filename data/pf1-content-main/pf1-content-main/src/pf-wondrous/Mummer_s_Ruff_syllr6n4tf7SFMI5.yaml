  description:
    value: >-
      <p>Usually fashioned from brightly colored silk, a mummer's ruff is a
      favored accoutrement of performers and con artists alike. The wearer of a
      mummer's ruff gains a +10 bonus on Bluff skill checks when attempting to
      imitate another's voice. In addition, once per day, the wearer of the
      mummer's ruff can throw his voice as if using ventriloquism for up to 5
      minutes.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, sculpt sound, ventriloquism</p>
