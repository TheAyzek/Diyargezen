  description:
    unidentified: <p>This large brass belt has three panels depicting scenes of battle.</p>
    value: >-
      <p>Once per day on command, the wearer can summon the spirit of a hero of
      one of the depicted battles. This spirit acts as a
      @UUID[Compendium.pf1.spells.Item.0lrux8tmaml5fkw6]{spiritual ally}, though
      unlike the force created by that spell, the summoned hero is not entirely
      mindless. Whether or not the summoned hero is active, it attempts to guide
      its wearer to victory via telepathic warning and advice, granting its user
      a +1 insight bonus on all saving
      throws.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.21bxbzdaawjrnvyo]{divine favor},
      @UUID[Compendium.pf1.spells.Item.0lrux8tmaml5fkw6]{spiritual ally}</em>
      <strong>Cost</strong> 10,500 gp</p>
  effectNotes:
