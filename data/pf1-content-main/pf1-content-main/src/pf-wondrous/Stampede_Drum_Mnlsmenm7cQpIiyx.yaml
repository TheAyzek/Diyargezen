name: Stampede Drum
system:
  aura:
    school: enc
  cl: 3
  description:
    value: >-
      <p>This masterwork drum is made from mammoth hide. A Kellid with ranks in
      Perform (percussion) can cause the drum to activate in one of two modes:
      rousing or quelling. Activation requires a successful DC 15 Perform
      (percussion) check. The two modes have the following effects.  Quelling:
      Animals and humanoids that can hear the drum from within 30 feet are
      subject to calm emotions (DC 13)  for as long as they remain in the area
      and the drummer continues to succeed at a DC 15 Perform (percussion) check
      each round.  Rousing: Animals and humanoids that can hear the stampede
      drum from within 30 feet are subject to rage (DC 13) for as long as they
      remain in the area and the drummer continues to succeed at a DC 15 Perform
      (percussion) check each
      round.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, calm emotions, rage, creator must be a Kellid</p>
