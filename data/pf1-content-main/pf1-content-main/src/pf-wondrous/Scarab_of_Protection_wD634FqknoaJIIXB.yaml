  description:
    value: >-
      <p>This device appears to be a jade medallion in the shape of a beetle. If
      it is held for 1 round, an inscription appears on its surface letting the
      holder know that it is a protective device.   The scarab's possessor gains
      spell resistance 20. The scarab can also absorb energy-draining attacks,
      death effects, and negative energy effects. Upon absorbing 12 such
      attacks, the scarab turns to powder and is
      destroyed.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
