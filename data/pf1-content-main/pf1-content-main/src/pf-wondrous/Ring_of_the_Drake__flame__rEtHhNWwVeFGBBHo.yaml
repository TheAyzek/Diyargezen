name: Ring of the Drake (flame)
system:
  aura:
    school: abj
  cl: 9
  description:
    value: >-
      <p>Carved from a red stone in the shape of a dragon with glowing wings,
      this ring grants its wearer fire resistance 5. The ring has a sulfuric
      smell that lingers when it protects its wearer.  11th Level: The ring
      grants fire resistance 10.  14th Level: The ring grants fire resistance
      20.   17th Level: The ring grants fire resistance 30. The wearer increases
      her land speed by 5 feet. Once per day, the ring's wearer can make a
      primary bite attack as a swift action. If she does not already possess a
      bite attack, her teeth elongate into draconic fangs as part of the swift
      action, granting a bite attack that deals 1d6 points of damage for a
      Medium wearer (1d4 for a Small wearer).  20th Level: The ring's wearer can
      transform into a flame drake once per day. This functions as transforming
      into a red dragon via form of the dragon II, except that the wearer's fire
      breath weapon damages a 20-foot-radius spread within 180 feet of
      her.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge Ring,
      form of the dragon II, haste, resist energy</p>
