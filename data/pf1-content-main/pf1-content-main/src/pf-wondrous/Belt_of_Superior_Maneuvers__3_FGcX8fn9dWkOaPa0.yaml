    unidentified: <p>This is a thin, black, canvas belt.</p>
    value: >-
      <p>This thin, black canvas belt is typically tied loosely about the waist
      to secure a robe, a kimono, or a martial artist's
      dobok.</p><h3>Effect</h3><p>Three times per day as a free action, the
      wearer can select a combat maneuver and for 1 round receive an enhancement
      bonus of +3 on combat maneuver checks for this combat maneuver and a +3
      bonus to CMD when defending against this maneuver. Additionally, when worn
      by a brawler, the belt grants one additional use of her martial
      flexibility class feature each
      day.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      @UUID[Compendium.pf1.spells.Item.21bxbzdaawjrnvyo]{divine favor},
      creator's caster level must be at least triple the belt's bonus (9)
      <strong>Cost</strong> 9,000 gp</p>
