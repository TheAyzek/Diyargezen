    value: >-
      <p>This golden amulet is used by religious sects as a way to help the
      faithful capture fugitives or defend themselves without doing undue harm
      to potential converts. While the wearer is using her divine powers of
      retribution (such as a cleric's smite, an inquisitor's smiting judgment,
