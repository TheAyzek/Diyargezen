        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.kyo0kwhw2jhuztju]{Summon Monster
        I}</p><p>This spell summons an extraplanar creature (typically an
        outsider, elemental, or magical beast native to another plane). It
        appears where you designate and acts immediately, on your turn. It
        attacks your opponents to the best of its ability. If you can
        communicate with the creature, you can direct it not to attack, to
        attack particular enemies, or to perform other actions. The spell
        conjures one of the creatures from the 1st Level list on Table 10-1. You
        choose which kind of creature to summon, and you can choose a different
        one each time you cast the spell.</p><p>A summoned monster cannot summon
        or otherwise conjure another creature, nor can it use any teleportation
        or planar travel abilities. Creatures cannot be summoned into an
        environment that cannot support them. Creatures summoned using this
        spell cannot use spells or spell-like abilities that duplicate spells
        with expensive material components (such as wish).</p><p>When you use a
        summoning spell to summon a creature with an alignment or elemental
        subtype, it is a spell of that type. Creatures on Table 10-1 marked with
        an "*" are summoned with the celestial template, if you are good, and
        the fiendish template, if you are evil. If you are neutral, you may
        choose which template to apply to the creature. Creatures marked with an
        "*" always have an alignment that matches yours, regardless of their
        usual alignment.</p><p>Summoning these creatures makes the summoning
        spell's type match your alignment.</p><p></p><p>Table 10–1: Summon
        Monster</p><p>Dire
        rat*</p><p>Dog*</p><p>Dolphin*</p><p>Eagle*</p><p>Fire
        beetle*</p><p>Frog, poison*</p><p>Pony (horse)*</p><p>Viper
        (snake)*</p><p>* This creature is summoned with the fiendish
        template</p>
      duration:
