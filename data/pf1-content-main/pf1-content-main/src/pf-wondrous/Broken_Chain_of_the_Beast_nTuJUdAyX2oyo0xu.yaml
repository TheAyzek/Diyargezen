  description:
    unidentified: >-
      <p>This 8-foot length of corroded, broken, chain is threaded with a
      leather strap to hold it together.</p>
    value: >-
      <p>This 8-foot length of corroded, broken chain is threaded with a leather
      strap to hold it together; it is worn like a belt and must be tied in
      place, as it lacks a buckle.</p><h3>Effect</h3><p>Once per day, the wearer
      can call upon its power to summon an evil creature from the summon monster
      I list; the creature attacks the wearer's enemies if any are present, but
      it is not under the wearer's control and attacks the wearer or the
      wearer's allies if there are no more enemies to kill. If Rovagug is the
      wearer's patron, the wearer can gain the benefits of a rage spell once per
      day by speaking the god's name. If the wearer is ever bound, shackled, or
      otherwise rendered helpless while still conscious, this rage ability
      automatically activates if the wearer hasn't already used it that
      day.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.8u1xa5javcxc6szk]{rage},
      @UUID[Compendium.pf1.spells.Item.kyo0kwhw2jhuztju]{summon monster I},
      </em><strong>Cost</strong> 2,250 gp</p>
