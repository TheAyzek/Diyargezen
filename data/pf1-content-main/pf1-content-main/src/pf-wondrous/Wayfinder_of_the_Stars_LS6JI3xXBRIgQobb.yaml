name: Wayfinder of the Stars
system:
  aura:
    custom: true
    school: conjuration and divination
  cl: 17
  description:
    value: >-
      <p>About half again the size of a standard wayfinder, a wayfinder of the
      stars features an extra outer ring around the normal directional compass
      in the center. Embedded into this outer ring are 13 semi-precious stones,
      each representing one major celestial body of Golarion's solar system. At
      will, the owner can speak the item's command word to cause the wayfinder's
      compass needle to stop pointing north and instead indicate the direction
      of the nearest active interplanetary portal within 500 miles. If no such
      portal is within range, the compass needle hangs listlessly. A second
      command word causes the wayfinder of the stars to once again function as a
      basic wayfinder.  Once per day, the owner can touch one of the
      semi-precious stones on the wayfinder of the stars to teleport her and any
      willing creatures touching her to a safe location on the indicated planet,
      as interplanetary teleport.</p><h3>Requirements</h3><p>Craft Wondrous
      Item, interplanetary teleport, light, locate object</p>
