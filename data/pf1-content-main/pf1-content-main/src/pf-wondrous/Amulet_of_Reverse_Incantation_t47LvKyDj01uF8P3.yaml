name: Amulet of Reverse Incantation
system:
  aura:
    school: abj
  cl: 8
  description:
    value: >-
      <p>An ivory cameo depicting two elderly, bearded wizards with identical
      faces hangs on this amulet's delicate silver chain. Three times per day,
      when casting a spell with a verbal component, the wearer of an amulet of
      reverse incantation can recite the spell's words backward as a free action
      in order to invert the spell's effect, as described below.  • If the
      wearer casts a spell that can counter or dispel another specific spell,
      she can activate the amulet to convert the spell being cast into the spell
      it specifically counters. For example, haste would become slow, or reduce
      person would become enlarge person.  • If the wearer casts a spell that
      detects or affects creatures of a certain alignment, the spell instead
      affects creatures of the opposite alignment. For example, chaos hammer
      would damage and blind chaotic creatures and outsiders instead of lawful
      ones.  • If the wearer casts a cure or inflict spell, she can activate the
      amulet to convert the spell being cast into the other type of the same
      spell level, such as converting cure moderate wounds into inflict moderate
      wounds.  Alignment restrictions still apply for casters who can't cast
      spells with certain alignment
      descriptors.</p><h3>Requirements</h3><p>Craft Wondrous Item, dispel magic,
      tongues</p>
