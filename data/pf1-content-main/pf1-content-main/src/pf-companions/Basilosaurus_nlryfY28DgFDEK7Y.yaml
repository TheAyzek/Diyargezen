  - _id: TFzFH1MxWUVaRdyR
    _key: '!actors.items!nlryfY28DgFDEK7Y.TFzFH1MxWUVaRdyR'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/inventory/fish.jpg
    name: Bonus Tricks
    system:
      associations:
        classes:
          - Animal Companion
      class: animalCompanion
      description:
        value: >-
          <p><strong>Tricks selected</strong>:
          &nbsp;</p><ol><li>&nbsp;</li></ol><hr /><p>Bonus Tricks Granted:
          [[(floor(@class.level / 3) + 1)]]</p><p>The value given in this column
          is the total number of &ldquo;bonus&rdquo; tricks that the animal
          knows in addition to any that the druid might choose to teach it (see
          the Handle Animal skill for more details on how to teach an animal
          tricks). These bonus tricks don't require any training time or Handle
          Animal checks, and they don't count against the normal limit of tricks
          known by the animal. The druid selects these bonus tricks, and once
          selected, they can't be changed.&nbsp;</p>
      subType: classFeat
    type: feat
  - _id: RvTaM1xSsiKXtezU
    _key: '!actors.items!nlryfY28DgFDEK7Y.RvTaM1xSsiKXtezU'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/feats/quick-draw.jpg
    name: Link
    system:
      abilityType: ex
      associations:
        classes:
          - Animal Companion
      class: animalCompanion
      contextNotes:
        - target: skill.han
          text: >-
            +[[4]] Circumstance bonus when using Wild Empathy or Handle Animal
            on animal companion. (Not factored in)
      description:
        value: >-
          <p>A druid can handle her animal companion as a free action, or push
          it as a move action, even if she doesn't have any ranks in the Handle
          Animal skill. The druid gains a +4 circumstance bonus on all wild
          empathy checks and Handle Animal checks made regarding an animal
          companion.&nbsp;</p>
      subType: classFeat
    type: feat
  - _id: yPB5519e7BjDF0Xx
    _key: '!actors.items!nlryfY28DgFDEK7Y.yPB5519e7BjDF0Xx'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/blue_34.jpg
    name: Natural Armor Bonus
    system:
      associations:
        classes:
          - Animal Companion
      changes:
        - _id: 22vrjim6
          formula: floor(@class.level / 3) * 2
          target: nac
          type: untyped
      class: animalCompanion
      description:
        value: >-
          <p>The number noted here is an improvement to the animal companion's
          existing natural armor bonus.</p>
      subType: classFeat
    type: feat
  - _id: oBX5oUzGZyAqK0J2
    _key: '!actors.items!nlryfY28DgFDEK7Y.oBX5oUzGZyAqK0J2'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/feats/improved-counterspell.jpg
    name: Share Spells
    system:
      abilityType: ex
      associations:
        classes:
          - Animal Companion
      class: animalCompanion
      description:
        value: >-
          <p>The druid may cast a spell with a target of &ldquo;You&rdquo; on
          her animal companion (as a spell with a range of touch) instead of on
          herself. A druid may cast spells on her animal companion even if the
          spells normally do not affect creatures of the companion's type
          (animal). Spells cast in this way must come from a class that grants
          an animal companion. This ability does not allow the animal to share
          abilities that are not spells, even if they function like
          spells.&nbsp;</p>
      subType: classFeat
    type: feat
  - _id: Y06T50v9VTqIC7hY
    _key: '!actors.items!nlryfY28DgFDEK7Y.Y06T50v9VTqIC7hY'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/feats/athletic.jpg
