  description:
    value: >-
      <p><strong>School</strong> transmutation; <strong>Level</strong>
      9</p><p><strong>Casting Time</strong> 90
      minutes</p><p><strong>Components</strong> V, S, M (water mixed with
      diamond dust worth 5,000 gp; several freshly slain humanoids), F (a gem
      worth at least 20,000 gp containing the soul of an appropriately sinful
      creature), SC (at least 6, up to 20)</p><p><strong>Skill Checks</strong>
      Knowledge (arcana) DC 35, 3 successes; Knowledge (planes) DC 35, 2
      successes; Knowledge (religion) DC 35, 2 successes; Spellcraft DC 35, 2
      successes</p><p><strong>Range</strong>
      medium</p><p><strong>Effect</strong> 2 sinspawn per
      caster</p><p><strong>Duration</strong> instantaneous</p><p><strong>Saving
      Throw</strong> none; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> The primary caster takes 1 permanent
      negative level.</p><p><strong>Failure</strong> All casters take 2d4 points
      of Constitution drain as their flesh is siphoned into the pool; this flesh
      is transformed into a number of uncontrolled and violent fleshdregs equal
      to the number of casters.</p><h3>Effect</h3><p>The ritual requires the
      casters to fill a pool with the required water and diamond dust, then
      restrain a number of Medium humanoid bodies in the pool. The total number
      of bodies must equal the number of sinspawn to be created (two Small
      humanoids count as one Medium humanoid, and one Large or larger humanoid
      counts as four Medium ones), and the bodies can have been dead for no more
      than 8 hours. At least seven casters, which must include the primary
      caster, stand at equidistant points around the pool to invest the pool
      with the sinfulness of the gem-bound creature's soul. Upon successful
      completion of the ritual, the gem dissolves, the bodies melt into slurry,
      and a number of sinspawn associated with the sin that corresponds most
      closely with the soul of the creature bound within the gem (envy, greed,
      gluttony, lust, pride, sloth, or wrath) form out of the churning mass.
      Sinspawn created in this way are free willed but are initially well
      disposed toward the primary caster.</p>
