  description:
    value: >-
      <p><strong>School</strong> transmutation; Level 7</p><p><strong>Casting
      Time</strong> 70 minutes</p><p><strong>Components</strong> V, S, M
      (mixture of wine, outsider's blood, and cedar ash worth 5,000 gp total), F
      (primary caster must be menstruating), SC (up to 12)</p><p><strong>Skill
      Checks</strong> Diplomacy or Intimidate DC 31, 2 successes; Knowledge
      (arcana) DC 31, 2 successes; Knowledge (history) DC 31, 3
      successes</p><p><strong>Range</strong> touch</p><p><strong>Target</strong>
      up to 10 willing creatures/character level of the primary caster, all of
      whom must be present for the ritual</p><p><strong>Duration</strong> 14
      hours</p><p><strong>Saving Throw</strong> Will (harmless); SR
      yes</p><p><strong>Backlash</strong> The primary caster takes 2d6 points of
      damage and becomes host to a restless “god” spirit (see
      text).</p><p><strong>Failure</strong> A random creature conjurable via
      summon monster XI appears and attacks all participants for 9 minutes. At
      the GM's discretion, the conjured creature can have the advanced template,
      be accompanied by additional creatures, or both.</p><h3>Effect</h3><p>The
      rituals of lost Sarkoris summoned and put to use many of their myriad
      “gods,” including conjuring powerful spirits into a clan's soldiers to
      invest them with bravery and divine grace in an upcoming battle. In this
      ritual, after an hour of chanting, calling down a spirit, and begging and
      forcing its service, the primary caster moves among those to be invested
      with the spirit's power, anointing the participants' foreheads with blood.
      The ritual infuses each anointed warrior with inhuman passion and courage,
      granting a +2 morale bonus on attack rolls, saving throws, and skill
      checks, as well as a +4 morale bonus on saves against fear effects, but
      also renders them vulnerable to spells that forbid outsiders or deal
      additional damage against creatures of the outsider type (such as magic
      circle against chaos and chaos hammer). A target of this spell does not
      become an outsider; it simply gains a temporary vulnerability to these
      effects.</p><p>To maintain this spell's magic, the primary caster must
      host the “god” invoked within her body for the duration of the spell. The
      outsider scuttles beneath her flesh, causing intense pain and distraction;
      each round, she has a 50% chance of being dazed by the pain. When the
      spell's duration expires, the primary caster can eject her parasitic “god”
      back to its home plane with a successful Will saving throw. On a failed
      save, the spirit remains and continues to inflict debilitating pain until
      banished via break enchantment, dismissal, limited wish, miracle, remove
      curse, or wish. Banishing the spirit early immediately ends the ritual's
      effect.</p>
