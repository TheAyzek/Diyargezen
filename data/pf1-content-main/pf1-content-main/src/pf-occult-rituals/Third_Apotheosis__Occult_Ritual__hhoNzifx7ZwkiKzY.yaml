  description:
    value: >-
      <p><strong>School</strong> transmutation [evil]; <strong>Level</strong>
      6</p><p><strong>Casting Time</strong> 6
      hours</p><p><strong>Components</strong> V, S, M (exotic incense worth
      2,000 gp; prior completion of special quest); SC (up to
      8)</p><p><strong>Skill Checks</strong> Intimidate DC 28, 3 successes;
      Knowledge (planes or religion) DC 28, 3
      successes</p><p><strong>Range</strong>
      personal</p><p><strong>Target</strong>
      caster</p><p><strong>Duration</strong> instantaneous</p><p><strong>Saving
      Throw</strong> none; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> The primary and secondary casters take
      4d6 points of damage and become exhausted.</p><p><strong>Failure</strong>
      The primary and secondary casters are reduced to –1
      hp.</p><h3>Effect</h3><p>At some point after the primary caster contacts
      her fiendish patron (typically after she succeeds at the second ritual,
      but sometimes before), the fiend sends the primary caster a vision of a
      task she must complete (such as freeing a bound evil outsider from a
      Material Plane prison or assassinating a powerful cleric of a good-aligned
      religion). This task is typically one of significance to the fiend, and in
      many cases it is one that the primary caster has no hope of completing
      until she grows more powerful. There is no time limit for how long the
      primary caster has to complete this task, but she must perform weekly
      devotions to her fiendish patron in the intervening time in the form of
      regular worship and continued atrocities in the fiend's name. Additional
      burned offerings to the demon, assaults on innocents, and betrayals of
      allies are popular choices. Once the assigned task is completed, the
      primary caster can perform the third apotheosis. Unlike the first and
      second rituals, the third apotheosis allows for the use of secondary
      casters, yet it carries a much greater risk for failure. If the primary
      caster succeeds, she permanently gains the half-fiend template and becomes
      eligible to undertake the fourth apotheosis.</p>
  flags:
