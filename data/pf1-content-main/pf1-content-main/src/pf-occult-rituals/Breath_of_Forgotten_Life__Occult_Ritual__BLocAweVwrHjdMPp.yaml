  description:
    value: >-
      <p><strong>School</strong> divination [mind-affecting];
      <strong>Level</strong> 6</p><p><strong>Casting Time</strong> 60
      minutes</p><p><strong>Components</strong> V, S, M (a token of a past
      life), F (an elegant mirror), SC (up to 8)</p><p><strong>Skill
      Checks</strong> Knowledge (history) DC 30, 2 successes; Knowledge (nature)
      DC 30, 2 successes; Spellcraft DC 30, 2
      successes</p><p><strong>Range</strong> primary
      caster</p><p><strong>Duration</strong> 1 hour/character level of the
      primary caster</p><p><strong>Saving Throw</strong> none;
      <strong>SR</strong> no</p><p><strong>Backlash</strong> The primary caster
      takes 4d6 points of damage and becomes
      exhausted.</p><p><strong>Failure</strong> A shade of one of the primary
      caster's past lives manifests and attacks the casters. This shade
      functions as an animus shade (<em>Pathfinder RPG Bestiary 6</em> 10) of
      the primary caster.</p><h3>Effect</h3><p>The primary caster channels the
      experiences of her previous lives into a vessel of her current life,
      gaining meaningful insight from her forgotten past. The breath of
      forgotten life ritual must be cast within a location of great significance
      to the primary caster, such as her childhood home or marriage shrine. The
      primary caster meditates on her current life by focusing on the mirror and
      recalling her past deeds in reverse chronological order, while any
      secondary casters act out the scenes she describes. After the casting
      time, the primary caster's reflection in the mirror changes to an image of
      one of her past forms. This image describes its own deeds, which are
      relevant to the primary caster's immediate future and grant her a +2
      insight bonus to her Armor Class and on initiative checks for the ritual's
      duration. The primary caster also gains the ability to cast <em>legend
      lore</em> as a spell-like ability once within the following week.</p>
