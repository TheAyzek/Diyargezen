  description:
    value: >-
      <p><strong>School</strong> abjuration; <strong>Level</strong>
      5</p><p><strong>Casting Time</strong> 10 minutes per 10-ft.-cube affected
      by the ritual (minimum of 50 minutes)</p><p><strong>Components</strong> V,
      S, M (materials worth 500 gp per 10-ft.-cube of the ritual's area), SC (up
      to 8)</p><p><strong>Skill Checks</strong> Knowledge (planes or religion)
      DC 35, 2 successes; Spellcraft DC 35, 3
      successes</p><p><strong>Range</strong> lose</p><p><strong>Area</strong>
      one 10-ft. cube/2 character levels of the primary caster
      (S)</p><p><strong>Duration</strong> 24 hours</p><p><strong>Saving
      Throw</strong> none; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> All casters become fatigued for twice
      the ritual's casting time.</p><p><strong>Failure</strong> All casters take
      a –4 penalty on saving throws against effects used by creatures that the
      earthbound ward was intended to affect for 24
      hours.</p><h3>Effect</h3><p>The primary caster marks an enclosed space
      upon the ground with a material that is anathema to a specific type of
      creature that the caster wishes to keep at bay; typically, this ritual is
      used against specific outsider subtypes and undead creatures. Typical
      materials (and a list of creatures affected by those materials) include
      cold iron powder (daemons, demons, and fey), mithral or silver powder
      (devils and lycanthropes), oil mixed with sulfur (agathions, angels,
      archons, and azatas), and salt (undead and outsiders with the incorporeal
      subtype). At the GM's decision, additional materials may be available for
      use against other creatures. The area to be affected must be enclosed,
      with no gaps in the material's outline.</p><p>If the ritual is successful,
      creatures to whom the used material is anathema cannot enter or exit the
      warded area, much as if the area were under the effects of an outward
      facing magic circle effect against those creatures. Those creatures cannot
      cross the area's boundaries or exit it by any means, including via
      extradimensional travel (<em>astral projection</em>, <em>blink</em>,
      <em>dimension door</em>, <em>etherealness</em>, <em>gate</em>, <em>plane
      shift</em>, <em>shadow walk</em>, <em>teleport</em>, <em>wind walk</em>,
      or similar means), and they cannot reach across the area's boundaries with
      melee attacks (even those with greater than 5 feet of reach). Incorporeal
      creatures cannot enter or pass through solid objects into or out of a
      warded area. An affected creature can make physical ranged attacks at
      targets within the earthbound ward, but the ward blocks line of effect
      (but not line of sight) for spells. Flight allows a creature to pass over
      earthbound wards, but it cannot approach closer than 10 feet off the
      ground within the area outlined by the ward. A flying creature that falls
      or otherwise attempts to land in the area is instead shunted to the
      closest available area just outside of the earthbound ward's area of
      effect and is knocked prone.</p><p>If the markings used to create an
      earthbound ward are disturbed or defaced, the effects of the ritual
      immediately cease. Physical efforts (such as scratching, erasing, or
      otherwise breaking or damaging the materials), spells, spell-like
      abilities, and supernatural abilities used by a creature for whom the
      material is anathema cannot target the markings. Such creatures can damage
      the markings as a consequence of those abilities, so long as the markings
      aren't directly targeted. For example, such a creature can use
      <em>earthquake</em> to disturb an earthbound ward set against it because
      the spell targets an area, not the markings itself. The ritual's magic
      prevents minor effects from disrupting the wards, although severe or
      stronger winds can do so.</p>
