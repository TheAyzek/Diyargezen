      caster</p><p><strong>Effect</strong> NUL</p><p><strong>Duration</strong>
      instantaneous</p><p><strong>Saving Throw</strong> none;
      <strong>SR</strong> no</p><p><strong>Backlash</strong> The caster is
      reduced to -1 hp</p><p><strong>Failure</strong> The caster is immediately
      slain.</p><h3>Effect</h3><p>After sacrificing 18 lives (traditionally,
      these lives are those of unwilling druids who would have tried to stand
      against the blasphemy the caster is attempting), the caster sacrifices
      himself and immediately rises from death as a siabrae.</p>
