    value: >-
      <p><strong>School</strong> necromancy [evil]; <strong>Level</strong>
      9</p><p><strong>Casting Time</strong> 9 hours (only during the new
      moon)</p><p><strong>Components</strong> V, S, F (ring of standing stones
