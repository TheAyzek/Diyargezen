  description:
    value: >-
      <p><strong>School</strong> conjuration (creation); <strong>Level</strong>
      6</p><p><strong>Casting Time</strong> 60
      minutes</p><p><strong>Components</strong> V, S, M (incenses burned in a
      bowl filled with grave earth, a bottle of wormwood wine for each caster),
      F (an ornate silver and mithral key worth 5,000 gp), SC (up to the
      Intelligence modifier of the primary caster)</p><p><strong>Skill
      Checks</strong> Knowledge (arcana) DC 32, 3 successes; Knowledge (planes)
      DC 32, 3 successes</p><p><strong>Range</strong>
      touch</p><p><strong>Duration</strong> instantaneous; see
      text</p><p><strong>Saving Throw</strong> none; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> The primary caster takes 2d6 points of
      damage and becomes exhausted.</p><p><strong>Failure</strong> An animate
      dream appears at the site of the ritual and attacks the casters. At the
      GM's discretion, the animate dream may have the advanced template, be
      accompanied by fellow animate dreams, or both.</p><h3>Effect</h3><p>This
      ritual must be cast at night on the Material Plane. The casters drink the
      wormwood wine and begin chanting the incantation as the incense burns. The
      casters mix the ashes with the grave earth and use the mixture to draw a
      threshold with a keyhole. They then insert the key into this door as the
      incantation is completed. Success indicates the casters pass through the
      portal and enter a random location on the Dimension of Dreams.</p><p>If
      the casters wish to return to the Material Plane from the Dimension of
      Dreams, each must succeed at a DC 35 concentration check to do so. This is
      a full-round action that doesn't provoke attacks of opportunity. The DC of
      this check is reduced by 1 for every 2d6 points of damage the traveler
      willingly takes from psychic and physical trauma as part of the full-round
      action (this damage can't be reduced in any way). If successful, the
      caster is transported back to the site of the ritual's casting of the
      Material Plane. The casters can try again if they fail their concentration
      checks. A caster can use her character level + her Charisma modifier as
      her bonus on the concentration check if she isn't a spellcaster or if that
      value is higher than her usual concentration bonus.</p>
  flags:
