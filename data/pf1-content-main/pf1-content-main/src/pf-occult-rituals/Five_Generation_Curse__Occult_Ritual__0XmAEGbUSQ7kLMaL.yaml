  description:
    value: >-
      <p><strong>School</strong> necromancy [curse, evil];
      <strong>Level</strong> 7</p><p><strong>Casting Time</strong> 7
      hours</p><p><strong>Components</strong> V, S, M (a sample of the victim's
      hair or blood), F (a ruby worth at least 5,000 gp), SC (up to
      4)</p><p><strong>Skill Checks</strong> Knowledge (arcana or history) DC
      33, 2 successes; Knowledge (nobility or religion) DC 33, 2 successes;
      Spellcraft DC 33, 2 successes </p><p><strong>Range</strong> touch; see
      text</p><p><strong>Target</strong> see
      text</p><p><strong>Duration</strong> permanent</p><p><strong>Saving
      Throw</strong> Will negates (see text); <strong>SR</strong>
      yes</p><p><strong>Backlash</strong> All casters become exhausted and gain
      1 temporary negative level. </p><p><strong>Failure</strong> All creatures
      that would have been targeted by the ritual gain the benefits of <em>spell
      resistance</em> (CL = primary caster's Hit Dice) against the primary and
      secondary casters of the ritual until the next full
      moon.</p><h3>Effect</h3><p>This ritual inflicts a terrible curse upon an
      entire family line. The casters use a sample of the victim's hair or blood
      to infuse a ruby with dark magic and a shred of their target's soul. If
      successful, the ritual functions as <em>bestow curse</em>, affecting the
      primary target, as well as the primary target's siblings, children,
      grandchildren, parents, and grandparents, no matter their location. Each
      target can resist the curse with a successful Will saving throw; success
      means the negative effects of the curse do not affect that individual,
      though they may still pass the curse on to their descendants. Children
      born into the curse manifest its effects and attempt their saving throws
      upon reaching maturity.</p><p>By increasing the skill check DCs by 2, the
      ritual can be modified to instead affect the primary target and the
      primary target's children, grandchildren, and two additional generations
      of descendants beyond. When cast, the ritual must specify a single
      condition any member of the family can fulfill to destroy the curse- this
      condition must be possible, however unlikely, though victims of the curse
      do not automatically know what condition or actions might destroy the
      magic. The curse remains empowered by the gem originally used as the
      ritual focus. Should the focusing gem be destroyed, the curse ends
      immediately. As such, most covens take great care in hiding and defending
      the focusing gems of their victims. An individual can be freed from the
      five-generations curse with a <em>break enchantment</em> or <em>remove
      curse</em> spell cast by a spellcaster whose caster level is higher than
      the primary ritual caster's Hit Dice, and the curse can be removed from an
      entire line with a <em>miracle</em> or <em>wish</em> spell.</p>
