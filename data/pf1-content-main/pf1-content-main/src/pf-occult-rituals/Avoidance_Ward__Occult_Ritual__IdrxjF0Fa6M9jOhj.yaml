  description:
    value: >-
      <p><strong>School</strong> enchantment (compulsion);
      <strong>Level</strong> 4</p><p><strong>Casting Time</strong> 40
      minutes</p><p><strong>Components</strong> V, M (a piece of rowan wood
      charcoal), F (a small silver mirror worth 50 gp)</p><p><strong>Skill
      Checks</strong> Knowledge (dungeoneering) DC 30, 3 successes; Spellcraft
      DC 30, 1 success</p><p><strong>Range</strong>
      touch</p><p><strong>Target</strong> one dungeon
      door</p><p><strong>Duration</strong> 8 hours</p><p><strong>Saving
      Throw</strong> Will negates (harmless, object); <strong>SR</strong> yes
      (harmless, object)</p><p><strong>Backlash</strong> The caster takes 4d6
      points of damage.</p><p><strong>Failure</strong> The target door swings
      open and cannot be closed by the caster by any means short of a
      <em>limited wish</em> for 24 hours.</p><h3>Effect</h3><p>The caster begins
      by placing a mirror on one side of the door and writing occult symbols on
      the other side of the door that conform to one type or subtype of creature
      on the ranger's favored enemy list. Upon completion of the ritual,
      creatures of the chosen type or subtype cannot open, touch, or even
      magically manipulate the door by any means (with no save or spell
      resistance applicable). A dungeon door can have only one avoidance ward at
      a time.</p>
  flags:
