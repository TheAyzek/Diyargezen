  description:
    value: >-
      <p><strong>School</strong> transmutation; <strong>Level</strong>
      9</p><p><strong>Casting Time</strong> 9
      hours</p><p><strong>Components</strong> V, S, M (incense ground from First
      World plants), SC (up to 8)</p><p><strong>Skill Checks</strong> Knowledge
      (nature) DC 35, 1 success; Knowledge (planes) DC 35, 1 success; Perception
      DC 35, 3 successes; Spellcraft DC 35, 1 success; Sleight of Hand DC 35, 3
      successes</p><p><strong>Range</strong> touch</p><p><strong>Target</strong>
      one <em>witchgate</em></p><p><strong>Duration</strong>
      instantaneous</p><p><strong>Saving Throw</strong> none;
      <strong>SR</strong> no</p><p><strong>Backlash</strong> All casters take 1
      permanent negative level.</p><p><strong>Failure</strong> All casters
      suffer a curse or spell effect determined by the specific
      <em>witchgate</em> (if not specified, use <em>finger of death</em>, using
      the ritual's spell DC and caster level). Secondary casters can attempt a
      saving throw (primary casters automatically fail their saving
      throws).</p><h3>Effect</h3><p>The primary caster burns the incense in a
      perimeter around the <em>witchgate</em> to soothe the site, then peels
      back the dimensional fabric, finds the knotted ley lines, delicately
      unwinds them, steadies their energies, and closes the rift. If the ritual
      is successful, the ley lines return to normal, forcing the
      <em>witchgate</em> that tangled them to collapse. All casters
      automatically become attuned to the unraveled ley lines, gaining a +5
      bonus on skill checks to cast occult rituals until they leave a 1-mile
      radius of the destroyed <em>witchgate</em>.</p>
