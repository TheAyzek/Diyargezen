  description:
    value: >-
      <p><strong>School</strong> conjuration (calling); <strong>Level</strong>
      6</p><p><strong>Casting Time</strong> 60
      minutes</p><p><strong>Components</strong> V, S, M (a diamond-tipped stone
      chisel worth at least 500 gp), SC (up to 4)</p><p><strong>Skill
      Checks</strong> Knowledge (arcana) DC 29, 3 successes; Knowledge
      (geography) DC 29, 3 successes</p><p><strong>Range</strong>
      touch</p><p><strong>Target</strong> one inactive
      <em>aiudara</em></p><p><strong>Duration</strong> instantaneous; see
      text</p><p><strong>Saving Throw</strong> none; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> The primary caster is
      exhausted.</p><p><strong>Failure</strong> The portal creates a temporary
      one-way link with a random location, immediately delivering a hostile
      creature as though via <em>summon monster VI</em>. At the GM's discretion,
      the creature may be accompanied by 1d3 creatures of the same kind from the
      5th-level <em>summon monster</em> list, or 1d4+1 creatures of the same
      type from a lower-level list.</p><h3>Effect</h3><p>By repairing damaged
      magical runes and realigning the energies based on the gate's planetary
      position, the caster reactivates a dormant <em>aiudara</em>. A reactivated
      gate automatically reconnects with its linked twin, acting as a two-way
      <em>gate</em> (as per the spell) between the locations. The caster knows
      the gate's password-which might be anything from an Elven phrase to a
      song's refrain to a spell-from the research required to learn this ritual.
      All other creatures who use this gate must also know the password to
      access the gate's magic after it has been
      reactivated.</p><h2>Aiudara</h2><p>Created using ancient elven knowledge,
      the <em>aiudara</em> network is a system of gates placed throughout the
      solar system. Also known as "elf gates"-a term elves consider vulgar-these
      portals come in two distinct models: linked gates and hubs. Linked
      gateways connect two <em>aiudara</em> together, while hubs allow a single
      location access to multiple sites.</p><p>The art of crafting new
      <em>aiudara</em> remains lost to Golarion's elves, but occult rituals for
      activating most existing linked gates persist. Rules for this ritual are
      presented below. Rules also exist for activating hub gates, although these
      <em>aiudara</em> are rare. The ritual for reconnecting a hub gate to all
      its affiliated gates is modified from the ritual below as follows:
      <strong>Level</strong> 7; <strong>Casting Time</strong> 70 minutes;
      <strong>Components</strong> add F (a rare gem worth at least 5,000 gp);
      <strong>Skill Checks</strong> add 1 Knowledge (history) success;
      <strong>Failure</strong> same effect, except the hostile creature comes
      from the <em>summon monster VII</em> list (and potential additional
      creatures come from the 6th-level list or lower-level lists).</p><p>Known
      rituals to activate <em>aiudara</em> can be found within the libraries of
      Kyonin and the Mordant Spire, while the writings of the Ekujae and
      Snowcaster elves detail similar procedures for maintaining gateways in
      their respective territories.</p>
