  description:
    value: >-
      <p><strong>School</strong> divination; <strong>Level</strong>
      4</p><p><strong>Casting Time</strong> 40
      minutes</p><p><strong>Components</strong> V, S, M (an eyedropper filled
      with water from the Elemental Plane of Water), SC (at least 2, up to
      6)</p><p><strong>Skill Checks</strong> Heal DC 32, 1 success; Knowledge
      (arcana) DC 32, 1 success; Perception DC 32, 2
      successes</p><p><strong>Range</strong> long</p><p><strong>Target</strong>
      one living humanoid of the same size as the primary
      caster</p><p><strong>Duration</strong> 10 minutes/character level of the
      primary caster; see text</p><p><strong>Saving Throw</strong> Will negates
      (harmless); <strong>SR</strong> no</p><p><strong>Backlash</strong> The
      primary caster's movement speeds are all reduced by 15 feet, to a minimum
      of 5 feet, for the next 24 hours.</p><p><strong>Failure</strong> The
      target and primary caster have their vision permanently reversed, so the
      primary caster sees only what the target sees and vice versa. This effect
      can be removed only by <em>greater restoration</em>, <em>limited
      wish</em>, <em>miracle</em>, or <em>wish</em>.</p><h3>Effect</h3><p>The
      primary caster carefully applies specially prepared water to the target's
      eyes. Following this application, one or more secondary casters paint the
      primary caster's closed eyes, creating lifelike eyes overtop of the closed
      eyelids.</p><p>When the primary caster's eyes are closed, she sees through
      the eyes of the target. This vision only works while the target is within
      range of the primary caster, and only if the ritual is successful. While
      seeing through the target's eyes, the primary caster is susceptible to
      gaze attacks, patterns, and other sight-based and visual attacks as if she
      were the target.</p>
  flags:
