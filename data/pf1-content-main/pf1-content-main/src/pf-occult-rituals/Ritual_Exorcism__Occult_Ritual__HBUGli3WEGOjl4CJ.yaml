  description:
    value: >-
      <p><strong>School</strong> abjuration; <strong>Level</strong>
      4</p><p><strong>Casting Time</strong> 40
      minutes</p><p><strong>Components</strong> V, S, M (vial of holy water), F
      (silver holy symbol), SC (up to 12)</p><p><strong>Skill Checks</strong>
      Knowledge (religion) DC 28, 2 successes; Spellcraft DC 28, 2
      successes</p><p><strong>Range</strong> close</p><p><strong>Target</strong>
      one helpless possessed creature or a restrained possessed
      object</p><p><strong>Duration</strong> instantaneous</p><p><strong>Saving
      Throw</strong> Will negates; <strong>SR</strong>
      yes</p><p><strong>Backlash</strong> All casters become
      exhausted.</p><p><strong>Failure</strong> All casters gain 1 temporary
      negative level (DC = 16 + primary caster's Charisma bonus to remove after
      the first day), and the primary caster takes 4d6 points of
      damage.</p><h3>Effect</h3><p>You force the life force of a possessing
      creature to leave its host. Upon the completion of this ritual, the
      possessing creature attempts a Will saving throw. If it fails the save,
      the possessor is expelled, as if the duration of the spell or effect it
      used to possess the target had expired. If the possessing creature
      succeeds at the save, it continues to stay within the host creature or
      object, though the ritual can be attempted anew as long as the possessed
      creature is helpless or the object restrained.</p>
