  description:
    value: >-
      <p><strong>School</strong> divination (scrying); <strong>Level</strong>
      8</p><p><strong>Casting Time</strong> 80
      minutes</p><p><strong>Components</strong> V, S, M (a pool of water), F (a
      silver mirror worth 5,000 gp), SC (up to 8)</p><p><strong>Skill
      Checks</strong> Knowledge (arcana) DC 28, 3 successes; Knowledge (planes)
      DC 28, 2 successes; Spellcraft DC 28, 3
      successes</p><p><strong>Range</strong> primary
      caster</p><p><strong>Duration</strong> 1 minute/level of the primary
      caster (D)</p><p><strong>Saving Throw</strong> none; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> The primary caster takes 2d6 points of
      damage and becomes exhausted.</p><p><strong>Failure</strong> All casters
      gain a temporary negative level (DC = 16 + the primary caster's Charisma
      bonus to remove the negative level after the first day), and the primary
      caster takes a –4 penalty to resist all scrying effects for 1
      week.</p><h3>Effect</h3><p>The ritual allows the primary caster to observe
      an area at any distance, as per , except that the sensor created for this
      scrying effect is an enormous visible image of the primary caster in the
      air above the area (even if the area viewed is indoors or underground)
      that cannot be dispelled. This image can take any form that the primary
      caster desires, such as an exact replica or a shape formed from shadows or
      clouds, but the image is always recognizable as the primary caster. The
      primary caster can speak to any creatures in the area with a loud voice
      that emanates from the image. The following spells function reliably
      through the sensor: <em>detect chaos</em>, <em>detect evil</em>,
      <em>detect good</em>, <em>detect law</em>, <em>detect magic</em>,
      <em>detect thoughts</em>, <em>message</em>, <em>read magic</em>,
      <em>tongues</em>, and <em>true seeing</em>. Any other spell requires a
      successful concentration check to function through the image (DC = 20 +
      double the level of the spell); on a failure, the spell is lost.</p>
  flags:
