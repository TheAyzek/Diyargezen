  description:
    value: >-
      <p><strong>School</strong> abjuration [variable; see text];
      <strong>Level</strong> 4</p><p><strong>Casting Time</strong> 40
      minutes</p><p><strong>Components</strong> V, S, M (powdered silver), F (a
      stylus made of mithral and diamond worth 5,000 gp), SC (up to
      8)</p><p><strong>Skill Checks</strong> Knowledge (planes) DC 30, 2
      successes; Knowledge (religion) DC 30, 1 success; Linguistics DC 30, 1
      success</p><p><strong>Range</strong> 10 ft.</p><p><strong>Effect</strong>
      a 20-foot-raidus magic circle</p><p><strong>Duration</strong> 1
      day/character level of the primary caster</p><p><strong>Saving
      Throw</strong> Will negates (harmless); <strong>SR</strong> no, see
      text</p><p><strong>Backlash</strong> The primary caster takes 2d6 points
      of damage.</p><p><strong>Failure</strong> The casters believe their work
      was successful, though when they attempt to use the circle, nothing
      occurs.</p><h3>Effect</h3><p>This ritual requires the casters to create a
      large magic circle outlined with the silver powder and shaped with the
      focus stylus. The circle must be painstakingly molded to attune it to the
      alignment targeted (chaos, evil, good, or law), which is chosen during the
      time of creation. The ritual gains the descriptor of the alignment
      selected. Once the circle is complete, it becomes invisible to all but the
      casters of the ritual or to creatures with <em>see invisibility</em>,
      <em>true seeing</em>, or some other method of seeing invisible
      objects.</p><p>Once the circle is complete, it can be used to trap an
      outsider whose subtype matches the chosen alignment, as if it were an
      inward-focused magic circle spell of the appropriate type (thus, an
      ensnaring circle attuned to evil acts like an inward-focused <em>magic
      circle against evil</em>). For an outsider to be trapped in this manner,
      the entire space of the outsider must be within the circle, at which point
      the primary caster can activate the circle as an immediate action. The
      primary caster must be within 100 feet of the circle and be able to see it
      and the outsider he wishes to trap in order to activate the circle. It is
      possible to trap multiple outsiders of the appropriate subtype in the
      circle if more than one are in the circle when it is activated. However,
      if any such outsider is not completely within the circle, it is not caught
      within the circle's confines and is free to disrupt the circle as
      described in the <em>magic circle against evil</em> spell
      description.</p><p>As with a magic circle, the trapped outsider cannot
      cross the circle's boundaries or reach over or beyond the boundaries, nor
      can it disrupt the circle either directly or indirectly, though it can
      make ranged attacks beyond the circle's boundaries. If the outsider has
      spell resistance, it can test the trap once per day. If the primary caster
      fails to overcome the outsider's spell resistance, the circle is disrupted
      and the outsider is freed from the circle's restraints. An outsider
      capable of any form of dimensional travel can simply leave the circle
      using such an ability.</p><p>Unlike with a magic circle, you cannot create
      a special diagram when creating the circle to make the ensnaring circle
      more secure.</p>
