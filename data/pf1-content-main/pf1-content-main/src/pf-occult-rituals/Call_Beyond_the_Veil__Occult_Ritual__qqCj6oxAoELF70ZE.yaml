  description:
    value: >-
      <p><strong>School</strong> conjuration (calling); <strong>Level</strong>
      6</p><p><strong>Casting Time</strong> 60
      minutes</p><p><strong>Components</strong> V, S, F (either an object once
      possessed by the spirit or entity called, or the name of the spirit or
      entity called), SC (up to 8)</p><p><strong>Skill Checks</strong> Diplomacy
      DC 31, 2 successes; Knowledge (religion) DC 33, 3 successes; Knowledge
      (planes) DC 33, 1 success</p><p><strong>Range</strong> primary
      caster</p><p><strong>Effect</strong> call on the spirit of a single
      deceased creature or a psychic entity</p><p><strong>Duration</strong>
      concentration of the primary caster</p><p><strong>Saving Throw</strong>
      Will negates; <strong>SR</strong> no</p><p><strong>Backlash</strong> All
      casters become exhausted and gain 1 temporary negative level (DC = 16 +
      primary caster's Charisma bonus to remove after the first
      day).</p><p><strong>Failure</strong> All casters gain 1 permanent negative
      level and are exhausted until that negative level is
      removed.</p><h3>Effect</h3><p>The primary caster attempts to compel the
      spirit of a specific individual or a psychic entity to manifest from its
      final rest or extraplanar location. Unwilling spirits or entities can
      resist the summons by succeeding at a Will save. If a spirit or entity
      succeeds at the saving throw, it doesn't manifest, but the ritual is still
      considered a success. Spirits or entities that fail or forgo this save are
      summoned into the primary caster's body, where they speak by way of the
      caster's voice, which takes on an otherworldly timbre. Though the spirit
      or entity speaks through the primary caster, it has no further control of
      that caster's mind or body, and can't use any spells, spell-like
      abilities, or even purely mental supernatural abilities it may have. It
      must leave the primary caster when that caster ends his concentration.
      While the spirit is speaking through the primary caster, the secondary
      casters can ask it questions at a maximum rate of 1 question per round
      (regardless of the number of secondary casters). The spirit or entity
      speaks in a language it knows or knew while it was alive, and can refuse
      to answer questions or attempt to deceive its questioners and the primary
      caster using Bluff. It is not otherwise beholden to the ritual
      casters.</p>
