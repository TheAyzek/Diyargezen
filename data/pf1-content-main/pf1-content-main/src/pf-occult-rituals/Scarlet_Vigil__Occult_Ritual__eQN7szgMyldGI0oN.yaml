  description:
    value: >-
      <p><strong>School</strong> necromancy; <strong>Level</strong>
      7</p><p><strong>Casting Time</strong> 7
      hours</p><p><strong>Components</strong> V, S, M (a giant mantis claw), SC
      (at least 2, up to 4)</p><p><strong>Skill Checks</strong> Heal DC 30, 2
      successes; Knowledge (religion) DC 30, 3 successes; Perception DC 30, 2
      successes</p><p><strong>Range</strong> close</p><p><strong>Target</strong>
      one corpse and secondary casters; see text</p><p><strong>Duration</strong>
      instantaneous; see text</p><p><strong>Saving Throw</strong> none;
      <strong>SR</strong> no</p><p><strong>Backlash</strong> All secondary
      casters take 2d6 points of damage.</p><p><strong>Failure</strong> The
      primary caster is stunned for 1d6 rounds (no save). The targeted corpse is
      immediately revived, as if via the spell
      <em>resurrection</em>.</p><h3>Effect</h3><p>This ritual requires the
      intact corpse of a target slain by the primary caster, who must possess at
      least 5 levels in the Red Mantis assassin prestige class. Each of the
      secondary casters must possess exactly 1 level in the Red Mantis assassin
      prestige class. During the ritual, the primary caster reveals meticulous
      details about the victim's demise to the secondary casters, describing in
      anatomical detail the damage done to the individual and pointing out
      visual cues on the corpse, all while connecting the methods of execution
      to the teachings of the mantis god Achaekek, patron of the assassin order.
      During the ritual, the secondary casters must use a giant mantis claw to
      draw blood from themselves in a place where the corpse was damaged; in the
      case of poisons and similar effects, the location can be symbolic. If the
      corpse took damage in many different locations, the secondary casters must
      draw blood from themselves in the place where the victim sustained the
      most damage.</p><p>If the ritual is successful, the secondary casters gain
      an intrinsic link to the deceased individual; from that moment on, the
      secondary casters know if the assassinated creature is returned to life,
      as per the Red Mantis assassin resurrection sense class ability. An
      assassinated body used in a failed scarlet vigil occult ritual cannot
      subsequently be used in another such ritual. Since failing to correctly
      perform this ritual unravels the primary caster's assassination and puts
      all casters at risk, high-level Red Mantis members choose their secondary
      casters carefully, sometimes watching them for months to determine whether
      they are worthy of participating, as well as seeking guidance from senior
      leadership and Achaekek concerning which novices are the best choices.</p>
  flags:
