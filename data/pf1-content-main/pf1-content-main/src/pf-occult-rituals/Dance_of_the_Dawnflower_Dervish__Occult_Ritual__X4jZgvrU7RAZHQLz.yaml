  description:
    value: >-
      <p><strong>School</strong> transmutation; <strong>Level</strong>
      8</p><p><strong>Casting Time</strong> 80
      minutes</p><p><strong>Components</strong> V, M (a flask of blessed
      sunflower seed oil worth 100 gp for each caster and a <em>potion of cat's
      grace</em>), F (a masterwork scimitar made from rose gold worth 5,000 gp),
      SC (at least 1, up to the Charisma modifier of the primary
      caster)</p><p><strong>Skill Checks</strong> Acrobatics DC 30, 3 successes;
      Knowledge (religion) DC 30, 2 successes; Perform (dance) DC 30, 3
      successes</p><p><strong>Range</strong> touch</p><p><strong>Target</strong>
      primary and secondary casters</p><p><strong>Duration</strong> 1 day
      (D)</p><p><strong>Saving Throw</strong> Will negates (harmless);
      <strong>SR</strong> yes (harmless)</p><p><strong>Backlash</strong> The
      primary caster takes 2d6 points of damage and all casters are
      exhausted.</p><p><strong>Failure</strong> All casters cannot be targeted
      by any beneficial spells from the conjuration (healing) school (such as
      <em>cure light wounds</em>) and cannot touch a scimitar for 1 year (this
      is a curse effect, and can be removed with <em>remove curse</em> or
      similar effects).</p><h3>Effect</h3><p>This ritual must be cast at dawn
      beneath the open sky on the Material Plane. The ritual must be performed
      at a site of Sarenite worship (such as a dervish house, shrine, or temple
      of Sarenrae) that has hosted active worship services for at least 52
      consecutive weeks. The primary caster holds aloft the rose-gold scimitar,
      and the secondary casters stand around him and begin spinning in place.
      The primary caster recites 23 verses from Sarenrae's holy text, The
      <em>Birth of Light and Truth</em>, taking a sip from the <em>potion of
      cat's grace</em> between each stanza. After the last verse is completed,
      the secondary casters whirl around the primary caster, each anointing the
      rose-gold scimitar with blessed sunflower seed oil. Upon the successful
      completion of the ritual, all the casters are filled with the spirits of
      dervish heroes, becoming faster, stronger, tougher, and more skilled in
      combat. Each caster gains a +4 enhancement bonus to Strength, Dexterity,
      and Constitution; a +2 dodge bonus to AC; and a +2 sacred bonus on all
      saving throws. The caster's base attack bonus is equal his character level
      (which may give the caster multiple attacks). If the caster's base attack
      bonus is already equal to his character level, he gains one additional
      attack at his highest base attack bonus when making a full-attack action.
      In addition, any scimitar wielded by a caster is treated as if it has the
      keen weapon special ability. In exchange, each caster temporarily loses
      his ability to cast spells, save for those from the conjuration (healing)
      school.</p><p>Finally, once during the duration of the ritual, each caster
      can activate a whirling dance on the battlefield as a standard action.
      While dancing, the caster gains the effects of a <em>displacement</em>
      spell and can use the Spring Attack and Whirlwind Attack feats as if he
      possessed them without meeting their prerequisites. This dance is a
      supernatural effect and lasts a number of rounds equal to the primary
      caster's character level.</p><p>Each caster of the ritual can individually
      choose to dismiss the ritual's effects for himself.</p>
  flags:
