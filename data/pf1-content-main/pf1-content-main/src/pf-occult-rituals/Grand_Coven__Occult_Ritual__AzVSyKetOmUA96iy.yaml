  description:
    value: >-
      <p><strong>School</strong> enchantment; <strong>Level</strong>
      5</p><p><strong>Casting Time</strong> 50
      minutes</p><p><strong>Components</strong> V, S, M (elderberry wine and
      secret herbs worth 100 gp per caster), SC (up to 12; see
      text)</p><p><strong>Skill Checks</strong> Knowledge (nature) DC 28, 2
      successes; Perform (sing or dance) DC 28, 2 successes; Spellcraft DC 28, 1
      success</p><p><strong>Range</strong> touch</p><p><strong>Target</strong>
      one willing creature</p><p><strong>Duration</strong>
      instantaneous</p><p><strong>Saving Throw</strong> Will negates (harmless);
      <strong>SR</strong> yes (harmless)</p><p><strong>Backlash</strong> The
      subject and all casters are fatigued for 24
      hours.</p><p><strong>Failure</strong> The subject and all casters are
      sickened until the next full moon.</p><h3>Effect</h3><p>This ritual allows
      an established coven to induct a new member, allowing the coven to
      increase in size beyond the usual limit of three members. The newcomer
      must be a creature that could normally join a coven, such as a hag or a
      witch with the coven hex. Under the shadow of the new moon, the entire
      coven and the prospective member must prepare a bowl of rich red wine as
      they dance and chant, with each member adding handfuls of rare and
      expensive herbs. At midnight, the coven consumes the wine together. If the
      ritual is a success, the newcomer becomes a full member of the coven; see
      the details of forming a coven under the monster entry for a green hag.
      Every additional coven member above four increases the ritual skill check
      DCs by 2. No coven can be larger than 13 members.</p><p>Any three coven
      members can participate together to cast coven spells, as normal. Each
      additional coven member participating in a coven spell beyond the minimum
      requirement for a given spell increases the effective caster level of that
      spell by 1, to a maximum of CL 20th. Every two coven members participating
      in a coven spell beyond the minimum requirement also increase the saving
      throw DC by 1. When a coven reaches seven members, it gains the following
      new spells, which require all seven participants acting in concert to
      cast: <em>create undead</em>, <em>dominate person</em> (DC 18),
      <em>epidemic</em> (DC 19), <em>fairy ring retreat</em>, <em>major
      curse</em> (DC 18), <em>magic jar</em> (DC 18), and <em>prying eyes</em>.
      When a coven reaches 13 members, it gains the following new spells, which
      require 13 participants acting in concert to cast: <em>create greater
      undead</em>, <em>cursed earth</em> (DC 22), <em>dominate monster</em> (DC
      22), <em>greater prying eyes</em>, and <em>wail of the banshee</em> (DC
      22).</p>
