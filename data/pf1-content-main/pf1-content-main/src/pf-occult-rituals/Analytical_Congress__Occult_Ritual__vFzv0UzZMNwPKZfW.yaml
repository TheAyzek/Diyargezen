  description:
    value: >-
      <p><strong>School</strong> transmutation; <strong>Level</strong>
      4</p><p><strong>Casting Time</strong> 40
      minutes</p><p><strong>Components</strong> V, S, M (a spool of copper wire
      and incense worth 500 gp), SC (at least 2, up to 8)</p><p><strong>Skill
      Checks</strong> Diplomacy DC 31, 1 success; Perception DC 31, 2 successes;
      Sense Motive DC 31, 1 success</p><p><strong>Range</strong>
      touch</p><p><strong>Target</strong> primary and secondary
      casters</p><p><strong>Duration</strong> 1 day (D)</p><p><strong>Saving
      Throw</strong> Will negates (harmless); <strong>SR</strong> yes
      (harmless)</p><p><strong>Backlash</strong> The primary caster and all
      secondary casters take 1 point of Dexterity and Strength
      damage.</p><p><strong>Failure</strong> The primary caster takes 2d6 points
      of Intelligence damage and Wisdom damage; all secondary casters take 1d6
      points of Intelligence damage and of Wisdom
      damage.</p><h3>Effect</h3><p>Through a process of reaching mutual
      understanding and agreeing on a shared goal, the casters of this ritual
      are joined in the pursuit of knowledge. Each secondary caster holds on to
      a section of long copper wire, while the primary caster questions them.
      Only when assured of the purity of joint purpose among all casters does
      the primary caster permit the other casters to let go of the wire,
      successfully completing the ritual. Failure by the primary caster to
      conduct this purpose-driven interrogation, or by the secondary casters to
      withstand it, can lead to severe mental trauma for all
      involved.</p><p>While devoting the remainder of the day to research and
      study, each caster can choose one of the following bonuses after the
      ritual's completion. </p><ul><li>Decrease the time necessary to attempt an
      untrained Knowledge check by using a library (as per the Knowledge skill)
      to 1 hour. </li><li>Gain a +5 insight bonus on all Knowledge checks of one
      type for the remainder of the day. </li><li>While using a library or
      similar research resource, replace a required Knowledge check with a
      Perception check at a –5 penalty. </li><li>Reroll any one Knowledge check
      attempted over the course of the day.</li></ul>  flags:
