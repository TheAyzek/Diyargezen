  description:
    value: >-
      <p><strong>School</strong> abjuration; <strong>Level</strong>
      4</p><p><strong>Casting Time</strong> 40
      minutes</p><p><strong>Components</strong> V, M (a clear glass marble), F
      (an iron key)</p><p><strong>Skill Checks</strong> Knowledge (arcana) DC
      30, 2 successes; Spellcraft DC 30, 1 success; Use Magic Device DC 30, 1
      success</p><p><strong>Range</strong> touch</p><p><strong>Target</strong>
      one object no larger than 1 cubic foot in
      size</p><p><strong>Duration</strong> 1 month</p><p><strong>Saving
      Throw</strong> Will negates (harmless, object); <strong>SR</strong> yes
      (harmless, object)</p><p><strong>Backlash</strong> yes (harmless,
      object)</p><p><strong>Failure</strong> The caster can't touch or use the
      target object for 24 hours.</p><h3>Effect</h3><p>The caster begins by
      rolling the marble around the target object, tracing complex occult
      patterns. The caster then touches the iron key to the target object four
      times. The caster repeats the process of rolling the marble and touching
      the key to the target object three more times, though with each iteration,
      the marble becomes harder and harder to move, as if it were being pushed
      through thickening cement. Upon successful completion of the ritual, the
      marble disappears, and a small, invisible sphere of force surrounds the
      target object. Any creature holding the iron key used as the focus can
      pick up and move the target object. Any other creature attempting to touch
      the target object meets a solid, immovable surface similar to a <em>wall
      of force</em>. The protective sphere dissipates after 1 month, but it ends
      immediately if a creature holding the iron key taps it to the object four
      times in quick succession.</p>
  flags:
