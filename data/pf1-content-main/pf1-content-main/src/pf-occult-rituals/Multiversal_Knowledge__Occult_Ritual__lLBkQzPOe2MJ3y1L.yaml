  description:
    value: >-
      <p><strong>School</strong> divination; <strong>Level</strong>
      4</p><p><strong>Casting Time</strong> 40
      minutes</p><p><strong>Components</strong> V, S, M (a spool of silver
      wire), F (a compendium, encyclopedia, or similar book related to knowledge
      worth at least 5,000 gp), SC (up to 5)</p><p><strong>Skill Checks</strong>
      Linguistics DC 30, 2 successes; Knowledge (planes) DC 30, 2
      successes</p><p><strong>Range</strong> primary
      caster</p><p><strong>Duration</strong> 10 minutes/character level of
      primary caster</p><p><strong>Saving Throw</strong> no; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> All casters take 2d6 points of
      damage.</p><p><strong>Failure</strong> All casters gain a temporary
      negative level (DC = 14 + primary caster's Intelligence bonus to remove
      after the first day), and the primary caster is confused for 24
      hours.</p><h3>Effect</h3><p>The ritual allows the primary caster to tap
      into the multiversal connection shared by all aeons. The primary caster
      weaves complicated occult patterns around herself with the silver wire; if
      secondary casters are involved in the ritual, they stand around the
      primary caster and the primary caster wraps the silver wire around their
      outstretched limbs to form these patterns. If successfully performed, the
      primary caster can utilize the envisaging ability as though she were an
      aeon to communicate with other creatures, can attempt Knowledge checks
      untrained, and gains an enhancement bonus on Knowledge checks equal to
      half her character level or twice the number of secondary casters,
      whichever is greater. Although the primary caster can communicate with
      aeons themselves across vast gulfs of distance and even planar boundaries,
      they are unlikely to respond except to profess amusement or mild
      annoyance.</p>
