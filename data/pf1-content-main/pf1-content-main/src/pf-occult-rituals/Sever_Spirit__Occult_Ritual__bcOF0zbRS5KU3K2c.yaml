  description:
    value: >-
      <p><strong>School</strong> abjuration [curse, evil];
      <strong>Level</strong> 6</p><p><strong>Casting Time</strong> 60
      minutes</p><p><strong>Components</strong> V, S, M (salt mixed with the
      cremated remains of a family member or former friend), F (a set of 43 holy
      symbols belonging to at least 10 different deities), SC (up to
      8)</p><p><strong>Skill Checks</strong> Intimidate DC 34, 2 successes;
      Knowledge (local) DC 34, 3 successes; Sense Motive DC 34, 1
      success</p><p><strong>Range</strong> close</p><p><strong>Target</strong>
      one animal companion, eidolon, kami ward, or phantom (see
      text)</p><p><strong>Duration</strong> permanent</p><p><strong>Saving
      Throw</strong> Will negates, see text; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> All casters take 3d6 points of damage
      and are sickened for 1 hour.</p><p><strong>Failure</strong> The primary
      caster requires twice as much food and water as a normal creature of its
      species for 1 year (this is a curse effect, and it can be removed with
      <em>remove curse</em> and similar effects).</p><h3>Effect</h3><p>By
      reciting false litanies associated with the various deities represented
      among the holy symbol foci, the primary caster shakes the unseen spiritual
      pillars of the mortal world. This ritual has no visible effect to mortal
      eyes, but it creates a powerful rending cut in the world of spirits. By
      successfully completing this ritual, the caster can achieve one of two
      goals: severing a kami from its ward, or untethering a bound
      companion.</p><p><strong>Sever Kami Ward</strong>: Successfully completing
      the ritual forces the ward's kami to attempt a Will save (use the kami's
      Will save in the case of targeting its ward). On a failed save, the kami
      loses its connection with its ward. This functions as if the kami's ward
      were destroyed: the kami cannot merge with its ward, it loses its fast
      healing, and it is permanently sickened. Many kami suffering from this
      cruel fate transform into malicious oni.</p><p><strong>Untether
      Companion</strong>: Successfully completing the ritual forces the creature
      whose animal or spiritual companion, such as an eidolon or phantom, was
      targeted to attempt a Will save. Failing this save causes the creature to
      lose its bond with the targeted animal companion or spirit. An animal
      companion severed in this manner retains its abilities and statistics, but
      it gains an intense loathing for its former master. In the case of
      eidolons or phantoms, the severed companion gains the unfettered eidolon
      template or becomes an unfettered phantom with the appropriate Hit Dice.
      For creatures with animal companions, this functions as if the creature's
      companion had been slain, allowing the target to gain a new companion. For
      creatures with bonded spirits (such as spiritualists), the means of
      gaining a new companion are left to the GM's discretion.</p>
  flags:
