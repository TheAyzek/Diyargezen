  description:
    value: >-
      <p><strong>School</strong> transmutation; <strong>Level</strong>
      5</p><p><strong>Casting Time</strong> 5
      hours</p><p><strong>Components</strong> V, S, M (musky incense worth 500
      gp), F (crown made of claws and fangs), SC (up to 8)</p><p><strong>Skill
      Checks</strong> Bluff DC 33, 1 check; Knowledge (nature) DC 33, 1 check;
      Handle Animal DC 33, 1 check; Intimidate DC 33, 1 check; Survival DC 33, 1
      check</p><p><strong>Range</strong> touch</p><p><strong>Area</strong>
      1-mile radius/character level of the primary
      caster</p><p><strong>Duration</strong> instantaneous</p><p><strong>Saving
      Throw</strong> Fortitude negates; <strong>SR</strong>
      yes</p><p><strong>Backlash</strong> All casters suffer 1 temporary
      negative level and become exhausted.</p><p><strong>Failure</strong> The
      primary caster gains the mind and body of a Tiny animal, as if she failed
      both saves against <em>baleful polymorph</em>.</p><h3>Effect</h3><p>The
      primary caster lights a bonfire surrounded with incense, steps into the
      fire, places the crown upon his brow, and lets forth a primal howl.
      Ghostly images of beasts swirl through the air as the casters join in a
      spectral hunt. As the ritual progresses, all humanoids in the ritual's
      area of effect, including the casters, regress in appearance to resemble
      their primal animalistic ancestors. Initially, these features have no
      mechanical effects, and they disappear if the ritual fails. If the ritual
      succeeds, the casters and those who succeed at a Fortitude save return to
      normal, while all other humanoids regress further. They gain a +4 size
      bonus to Strength, a +4 natural armor bonus to AC, and a bite attack (if
      they already had one, it counts as if they were one size larger). If their
      Intelligence is greater than 2, it becomes 2, and they can't cast spells,
      use other special abilities that require Intelligence, speak, and wield
      manufactured weapons. The only skill checks they can attempt are
      Acrobatics, Climb, Fly, Perception, Stealth, and Swim. The effects on a
      creature can be removed with <em>break enchantment</em>, <em>limited
      wish</em>, <em>miracle</em>, <em>remove curse</em>, or <em>wish</em>.
      Removing the penalties also removes the benefits.</p>
  flags:
