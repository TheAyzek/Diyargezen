  description:
    value: >-
      <p><strong>School</strong> transmutation [evil]; <strong>Level</strong>
      5</p><p><strong>Casting Time</strong> 5
      hours</p><p><strong>Components</strong> V, S, M (exotic incense worth 500
      gp, burned offering of a family member)</p><p><strong>Skill
      Checks</strong> Intimidate DC 23, 3 successes; Knowledge (planes or
      religion) DC 23, 2 successes</p><p><strong>Range</strong>
      personal</p><p><strong>Target</strong>
      caster</p><p><strong>Duration</strong> instantaneous</p><p><strong>Saving
      Throw</strong> none; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> The caster takes 4d6 points of damage
      and is exhausted.</p><p><strong>Failure</strong> The caster is rendered
      unconscious for 2d4 hours.</p><h3>Effect</h3><p>Preparation for the second
      apotheosis requires many more months of debased acts and vile plots, but
      at some point during this second year, the caster must contact her chosen
      fiendish patron, via either <em>commune</em> or <em>contact other
      plane</em>. A trusted minion or ally can cast this spell on the caster's
      behalf; it's common for a spellcaster to gain a cacodaemon, im, or quasit
      familiar so that it can use its <em>commune</em> spell-like ability for
      this purpose. Once contact is made, the patron must be told of the
      caster's desire to become a fiend; during this time, the <em>commune</em>
      or <em>contact other plane</em> spell cannot be used to ask any other
      questions. At any point thereafter but before a year has passed, the
      caster must offer a significant sacrifice to her fiendish patron as a
      burned offering in a temple consecrated to the fiend. This offering can be
      either living or dead, but the burned offering must be of someone who is
      related to the caster by blood or family (such as a spouse or an adopted
      parent or child) and the caster and the offering must once have shared a
      positive emotional connection such as love or pride. If this ritual fails,
      the caster can try again, although the number of attempts she can make is
      limited in that each new attempt requires a burned offering of a different
      relative. Once the second apotheosis is successful, part of the caster's
      body transforms into something fiendish as proof of her patron's favor.
      Use the various fleshcraft grafts to model these partial transformations;
      the specific transformation granted is up to the GM, but typical results
      include <em>claw gauntlet</em> or <em>wings of darkness</em>. Once the
      caster successfully completes the second apotheosis, she becomes eligible
      to undertake the third apotheosis.</p>
  flags:
