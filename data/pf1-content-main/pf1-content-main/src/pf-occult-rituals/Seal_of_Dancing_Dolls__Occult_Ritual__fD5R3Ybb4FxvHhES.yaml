  description:
    value: >-
      <p><strong>School</strong> conjuration; Level 6</p><p><strong>Casting
      Time</strong> 6 hours</p><p><strong>Components</strong> V, S, M (a bronze
      seal embellished with acacia and quartz lacquer worth 500 gp), SC (up to
      4)</p><p><strong>Skill Checks</strong> Knowledge (arcane) DC 33, 3
      successes; Knowledge (planes) DC 33, 3
      successes</p><p><strong>Range</strong>
      touch</p><p><strong>Duration</strong> 1 year</p><p><strong>Saving
      Throw</strong> Will negates; SR yes</p><p><strong>Backlash</strong> All
      casters take a temporary negative level.</p><p><strong>Failure</strong>
      The outsider to be bound is released and
      attacks.</p><h3>Effect</h3><p>Designed to create a Jistkan construct that
      is considered in many ways a precursor to early golems, this ritual uses
      hours of laborious calculations, recitation, and focus to bind an
      elemental outsider (a creature with the elemental subtype or a genie) into
      an inscribed bronze seal, harnessing the outsider's vibrant life force to
      animate an object. The seal must already be affixed to the object to be
      animated (usually a mannequin or statue), and the outsider must be
      available within the ritual area and contained (via binding, a magic
      circle, or similar magic). Upon successful completion of the ritual, the
      outsider is bound to loyal service within the seal for a year and a day,
      losing access to most of its powers and memories and treating the object
      to which the seal is affixed as its new body. Such animated servitors were
      most often used as guardians or bodyguards, but also sometimes served as
      assassins.</p><p>This seal can be used as is to create an animated object
      or combined with the Craft Construct feat; the seal replaces any spell
      requirements in a construct's creation, but not the time investment or
      material cost. Because the ritual suppresses much of the outsider's power
      and free will, the outsider to be bound must have twice the Hit Dice of
      the construct to be created. After 1 year, the construct becomes inert,
      but it can be reanimated by performing the ritual again at no additional
      cost beyond preparing a new seal.</p><p></p>
