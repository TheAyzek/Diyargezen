  description:
    value: >-
      <p><strong>School</strong> evocation; <strong>Level</strong>
      9</p><p><strong>Casting Time</strong> 1
      day</p><p><strong>Components</strong> V, S, M (<em>lavender and green ioun
      stone</em> split into 6 shards), F (an onyx throne worth at least 40,000
      gp), SC (6)</p><p><strong>Skill Checks</strong> Knowledge (arcana) DC 47,
      4 successes; Knowledge (geography) DC 47, 2 successes; Knowledge (nature)
      47, 1 success; Spellcraft DC 47, 2 successes</p><p><strong>Range</strong>
      10 miles/character level of the primary caster</p><p><strong>Area</strong>
      1 mile radius/character level of primary
      caster</p><p><strong>Duration</strong> instantaneous; see
      text</p><p><strong>Saving Throw</strong> none ; <strong>SR</strong>
      none</p><p><strong>Backlash</strong> The primary caster gains 2 permanent
      negative levels, and all secondary casters are permanently blinded and
      deafened. None of these effects can be removed by any means unless the
      ritual is reversed.</p><p><strong>Failure</strong> The primary caster and
      all secondary casters are immediately transported to different locations
      on the Negative Energy Plane or Shadow Plane (50% for either plane, roll
      separately for each caster). The secondary casters remain catatonic for 1
      hour upon arriving.</p><h3>Effect</h3><p>The primary caster sits upon the
      onyx throne, invoking ancient rites blaspheming against the light of the
      sun. The secondary casters offer up prayers to the gods of darkness. In
      turn, each of the secondary casters consumes one of the ioun stone shards,
      which induces a state of catatonia for 1 hour. Throughout the ritual's
      casting, a localized partial solar eclipse marks the location of the
      throne with an obvious pillar of darkness from above, easily noticed by
      creatures throughout the ritual's area.</p><p>If the ritual is successful,
      the area is draped in a curtain of eternal darkness, removing sunlight
      from the area. Illumination in the area can never be brighter than dim
      light, and only a <em>miracle</em> or <em>wish</em> can even temporarily
      alleviate this restriction (though direct intervention of a deity can end
      the ritual's effect). Any light beyond dim light that would touch the area
      is instead transported into the <em>ioun stone</em> shards consumed by the
      secondary casters, making the secondary casters' entire bodies glow. Any
      object with a light spell having its light thus dimmed by the ritual
      counts as a part of the secondary casters' bodies for the purpose of a
      connection for spells like <em>scrying</em>. Collecting these ioun stone
      shards then piecing them back together while within the affected area ends
      the effects of this ritual.</p>
  flags:
    dictionary:
      summary: The light level in the area cannot be raised above dim light
