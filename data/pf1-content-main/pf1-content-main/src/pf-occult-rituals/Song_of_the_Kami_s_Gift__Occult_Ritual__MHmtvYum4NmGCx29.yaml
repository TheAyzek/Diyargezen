  description:
    value: >-
      <p><strong>School</strong> conjuration (summoning); <strong>Level</strong>
      5</p><p><strong>Casting Time</strong> 50
      minutes</p><p><strong>Components</strong> V, S, M (an offering of food,
      artwork, or clothing valued at 100 gp), F (a handcrafted shrine worth 500
      gp), SC (up to 20)</p><p><strong>Skill Checks</strong> Knowledge (nature)
      DC 32, 3 successes; Knowledge (planes) DC 32, 2
      successes</p><p><strong>Range</strong> 100
      ft.</p><p><strong>Effect</strong> one summoned kami
      manifestation</p><p><strong>Duration</strong> 1 day
      (D)</p><p><strong>Saving Throw</strong> none; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> The primary caster takes 2d6 points of
      damage and becomes exhausted. The secondary casters become
      fatigued.</p><p><strong>Failure</strong> A zuishin appears and attacks all
      of the casters until the zuishin or the casters are destroyed. Afterward,
      all kami completely ignore the casters for 1 year and will not answer to
      any ritual in which any of those casters are
      involved.</p><h3>Effect</h3><p>The primary caster appeals to a local kami
      to ask for assistance in battle. The casters must assemble a shrine within
      100 feet of the kami's ward. Once the ritual begins, the casters each
      utter a unique prayer to the kami, complete with devotionals and
      explanations about why the kami's help is needed. If the casting is
      successful, the kami manifests (as per <em>summon monster V</em>) and
      fights alongside the casters. This kami uses the statistics for a kodama
      and refuses to move farther than 1 mile from its ward.</p>
