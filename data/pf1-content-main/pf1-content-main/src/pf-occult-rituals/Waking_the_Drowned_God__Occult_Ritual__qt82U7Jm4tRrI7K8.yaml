  description:
    value: >-
      <p><strong>School</strong> conjuration (calling); <strong>Level</strong>
      9</p><p><strong>Casting Time</strong> 9
      hours</p><p><strong>Components</strong> V, S, F (a piece of Tychilarius's
      body), SC (at least 4, up to 12)</p><p><strong>Skill Checks</strong>
      Knowledge (arcana) DC 35, 2 successes; Knowledge (dungeoneering) DC 35, 2
      successes; Knowledge (planes) DC 35, 5
      successes</p><p><strong>Range</strong> close</p><p><strong>Target</strong>
      one helpless or willing creature with at least 11
      HD</p><p><strong>Duration</strong> instantaneous; see
      text</p><p><strong>Saving Throw</strong> none; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> The primary caster and all secondary
      casters each take 1d4 points of Intelligence
      damage.</p><p><strong>Failure</strong> The primary caster is immediately
      pulled into the Dark Tapestry and killed. No means can locate the primary
      caster's remains or return her to life.</p><h3>Effect</h3><p>The primary
      caster begins the ritual by placing the focus in a pool of water that
      measures at least 30 feet long, 30 feet wide, and 50 feet deep. After this
      is done, the secondary casters surround the pool and perform ceremonial
      chants and wild supplications to the Drowned God, while the primary caster
      whispers the horrifying truths of Tychilarius into the target's ear. The
      unspeakable horror and veracity of the whispers create a stronger bond
      between the target and the Drowned God. The ritual casters then place the
      target inside the pool.</p><p>If the ritual succeeds, the vast and alien
      mind of Tychilarius overwhelms the target. The Drowned God immediately and
      hideously transforms the target's body and irrevocably destroys it,
      replacing the gory remains with the writhing form of Tychilarius, now
      freed from its prison and unleashed to wreak the destruction it craved so
      hungrily, and for so long, in its unknown prison. The target is
      annihilated and can be restored to life only with a <em>miracle</em> or
      <em>wish</em> spell.</p>
