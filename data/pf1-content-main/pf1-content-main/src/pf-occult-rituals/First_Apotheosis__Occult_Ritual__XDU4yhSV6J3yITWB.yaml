  description:
    value: >-
      <p><strong>School</strong> transmutation [evil]; <strong>Level</strong>
      4</p><p><strong>Casting Time</strong> 4
      hours</p><p><strong>Components</strong> V, S, M (exotic incense worth 500
      gp)</p><p><strong>Skill Checks</strong> Intimidate DC 18, 2 successes;
      Knowledge (planes or religion) DC 18, 2
      successes</p><p><strong>Range</strong>
      personal</p><p><strong>Target</strong>
      caster</p><p><strong>Duration</strong> instantaneous</p><p><strong>Saving
      Throw</strong> none; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> The caster takes 4d6 points of damage
      and is exhausted.</p><p><strong>Failure</strong> The caster is rendered
      unconscious for 2d4 hours and must wait 1 year before attempting the first
      apotheosis again.</p><h3>Effect</h3><p>The first ritual is the simplest
      and requires nothing more than for the caster's alignment to become lawful
      evil, neutral evil, or chaotic evil (depending on the type of fiend the
      user wishes to transform into). To prepare for this ritual, the caster
      must undertake acts of a vile and destructive nature over the course of a
      year. The caster consigns her soul to Abaddon, the Abyss, or Hell even if
      she never finishes the subsequent rituals. The caster must select a
      powerful fiend at this point to serve as a demonic patron. The acts the
      caster must undertake can vary, but they should be of a nature that
      represents and honors the areas of interest of her chosen demonic
      patron-these acts are intended to attract the patron's attention, after
      all. Even casters who begin the transformation ritual with an evil
      alignment must undergo this stage of the ritual, if only to select a
      fiendish patron.</p><p>On the day precisely 1 year after she began these
      evil acts, she must perform the 4-hour first apotheosis ritual to properly
      devote her previous year in the name of her chosen patron. Once she
      successfully completes the first apotheosis, she becomes eligible to
      undertake the second apotheosis.</p>
