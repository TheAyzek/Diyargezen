  description:
    value: >-
      <p><strong>School</strong> abjuration; <strong>Level</strong>
      4</p><p><strong>Casting Time</strong> 4
      hours</p><p><strong>Components</strong> V, S, F (a cold iron and silver
      lantern worth 5,000 gp), SC (up to 12)</p><p><strong>Skill Checks</strong>
      Knowledge (arcana) DC 29, 2 successes; Survival DC 29, 2
      successes</p><p><strong>Range</strong> touch</p><p><strong>Target</strong>
      one ship or vessel (up to one 10-ft. square/character level of the primary
      caster)</p><p><strong>Duration</strong> 1 year</p><p><strong>Saving
      Throw</strong> none; <strong>SR</strong>
      yes</p><p><strong>Backlash</strong> The primary caster takes 2d6 points of
      fire damage, and all casters become
      exhausted.</p><p><strong>Failure</strong> All casters become chilled and
      cannot warm themselves for 24 hours (treat as exposure to cold weather,
      regardless of outside conditions).</p><h3>Effect</h3><p>A closely guarded
      practice among the Linnorm Kings, this ritual descended from far more
      ancient traditions practiced by the Erutaki to survive at the Crown of the
      World. After hours of singing, woodcarving, and fire-building, the primary
      caster throws an iron lantern into a raging bonfire, then plucks it from
      the flames with a bare hand. The ritual imbues the lantern with an
      inextinguishable yellow flame for a single year. When hung from the prow
      or mast of a ship, the lantern projects a protective bubble in which the
      temperature never falls below 50° F, rain and snow never fall heavier than
      a light shower, winds never blow faster than strong, and the light never
      darkens beyond dim (though outside conditions created by extreme weather,
      such as ice flows or large waves, may still threaten the ship and crew).
      Anyone resting inside this space dries easily, and preserved food and
      water do not naturally spoil.</p><p>So long as the lantern hangs from a
      ship, its flame always flickers toward the east, granting a +2
      circumstance bonus on Survival checks to avoid becoming lost.</p>
