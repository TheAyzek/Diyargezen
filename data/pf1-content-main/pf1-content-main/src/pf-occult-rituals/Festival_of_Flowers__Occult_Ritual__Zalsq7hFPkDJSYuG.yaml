  description:
    value: >-
      <p><strong>School</strong> divination; <strong>Level</strong>
      4</p><p><strong>Casting Time</strong> 12
      hours</p><p><strong>Components</strong> V, S, M (100 lbs. of flowers per
      caster, a feast consisting of 1,000 gp worth of food and drink), F (set of
      7 silver cups worth a total of 1,500 gp), SC (7)</p><p><strong>Skill
      Checks</strong> Knowledge (nature) DC 30, 1 success; Perform (dance) DC
      30, 1 success; Perform (sing) DC 30, 2
      successes</p><p><strong>Range</strong> touch</p><p><strong>Target</strong>
      primary caster and secondary casters</p><p><strong>Duration</strong> 3
      months or until discharged</p><p><strong>Saving Throw</strong> Will
      negates (harmless); <strong>SR</strong> no</p><p><strong>Backlash</strong>
      The next time the casters attempt a check, they must roll twice and take
      the worse result.</p><p><strong>Failure</strong> All casters receive a –1
      luck penalty on saving throws for 1 year.</p><h3>Effect</h3><p>The ritual
      takes place from sunrise to sunset, and involves the performance of dozens
      of traditional songs and dances. At the completion of the ritual, the
      Seven Petals drink a special brew made from herbs and fungus from seven
      silver cups.</p><p>The primary and secondary casters gain a +1 luck bonus
      on all saving throws for 3 months following the ritual. At any point
      during this time, a caster can roll twice for a single saving throw and
      take the higher result, but once this reroll is used, the luck bonus
      ends.</p>
