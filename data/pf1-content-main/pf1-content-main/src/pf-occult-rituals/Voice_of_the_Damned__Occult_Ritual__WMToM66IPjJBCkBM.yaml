  description:
    value: >-
      <p><strong>School</strong> necromancy; <strong>Level</strong>
      4</p><p><strong>Casting Time</strong> 30
      minutes</p><p><strong>Components</strong> V, S, M (a blade worth 150 gp
      and a parchment), SC (up to the Intelligence modifier of the primary
      caster)</p><p><strong>Skill Checks</strong> Diplomacy DC 31, 2 successes;
      Intimidate DC 31, 2 successes</p><p><strong>Range</strong>
      close</p><p><strong>Target</strong> one neutralized
      haunt</p><p><strong>Duration</strong> 1 minute/level</p><p><strong>Saving
      Throw</strong> Will negates; <strong>SR</strong>
      no</p><p><strong>Backlash</strong> All casters take 1d6 points of
      Constitution damage.</p><p><strong>Failure</strong> All casters take 1d6
      points of Constitution drain.</p><h3>Effect</h3><p>The caster rouses the
      lingering consciousness of a neutralized haunt. Upon the ritual's
      completion, a spirit resembling the entity that empowered the haunt
      manifests before the caster and scrawls a message of 25 words or less onto
      the provided parchment, using the caster's blood. This message provides a
      cryptic clue regarding how to permanently destroy the haunt, acting much
      like the information granted by a <em>divination</em> spell, except that
      there is no chance that the information will be incorrect because the
      haunt hopes to end its suffering.</p>
