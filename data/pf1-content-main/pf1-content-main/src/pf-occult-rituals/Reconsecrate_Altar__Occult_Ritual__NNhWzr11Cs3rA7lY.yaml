  description:
    value: >-
      <p><strong>School</strong> evocation [chaotic, evil, good, or lawful; see
      text]; <strong>Level</strong> 5</p><p><strong>Casting Time</strong> 50
      minutes</p><p><strong>Components</strong> V, S, M (holy or unholy water),
      F (a holy symbol of the altar's deity worth at least 300 gp), SC (up to
      4)</p><p><strong>Skill Checks</strong> Knowledge (planes) DC 27, 2
      successes; Knowledge (religion) DC 27, 3
      successes</p><p><strong>Range</strong> touch</p><p><strong>Target</strong>
      broken alter</p><p><strong>Duration</strong>
      instantaneous</p><p><strong>Saving Throw</strong> none;
      <strong>SR</strong> no</p><p><strong>Backlash</strong> The primary caster
      is exhausted.</p><p><strong>Failure</strong> For a period of 1 month, none
      of the casters can be targeted by divine magic that draws its power from
      the deity previously tied to the altar. (This is a curse effect, and can
      be removed with <em>remove curse</em> and similar
      effects.)</p><h3>Effect</h3><p>This ritual works only on inoperative
      divine altars, rendered powerless through damage or other ways, and must
      be performed on a holy day of the deity to which the altar is dedicated.
      In order to repair a broken altar, the primary caster and all secondary
      casters must be worshipers of that same deity. The exact process of
      revitalizing altars varies by religion, but such rituals require a dose of
      holy or unholy water when dealing with good- or evil-aligned deities, as
      well as a masterfully wrought holy symbol regardless of the deity's
      alignment. By speaking numerous prayers and conducting the required
      religious ceremonies, the primary caster can restore the altar to its
      previous function, effectively restoring its capabilities as a magical
      item.</p><p>A reconsecrate altar ritual has the chaotic, evil, good, or
      lawful descriptors depending on the alignment of the altar's deity. For
      instance, a reconsecrate altar ritual performed to restore the altar of a
      lawful good deity has the lawful and good descriptors. A ritual tied to a
      nonlawful, nonchaotic neutral deity has no descriptor.</p>
