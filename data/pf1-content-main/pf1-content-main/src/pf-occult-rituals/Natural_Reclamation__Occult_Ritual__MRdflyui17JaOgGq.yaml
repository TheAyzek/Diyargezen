  description:
    value: >-
      <p><strong>School</strong> conjuration; <strong>Level</strong>
      5</p><p><strong>Casting Time</strong> 50
      minutes</p><p><strong>Components</strong> V, S, M (a small model of the
      settlement worth 500 gp and the sacrifice of one sentient creature that
      lives in the ritual's area), F (magically treated ivy), SC (up to
      8)</p><p><strong>Skill Checks</strong> Knowledge (nature) DC 29, 2
      successes; Spellcraft DC 29, 1 success; Survival DC 29, 2
      successes</p><p><strong>Range</strong> touch</p><p><strong>Area</strong>
      1,000-ft. radius/character level of the primary
      caster</p><p><strong>Duration</strong> 1 hour/character level of the
      primary caster</p><p><strong>Saving Throw</strong> Fortitude negates
      (object); <strong>SR</strong> no</p><p><strong>Backlash</strong> All
      casters take 4d6 points of damage.</p><p><strong>Failure</strong> All
      nonmagical plants within a 100-foot radius of the primary caster wither
      and die, and casters suffer <em>horrid wilting</em> (no save), using the
      character level of the primary caster as the caster
      level.</p><h3>Effect</h3><p>This ritual can be cast only during the vernal
      equinox. The primary caster binds the person to be sacrificed in magically
      treated ivy and then places the settlement model on top of the person's
      body. Next, the primary caster slits the sacrifice's throat with a knife
      and then smears the blood all over the ivy. As the casters chant, the ivy
      grows and destroys the model of the settlement. If the ritual succeeds,
      tendrils of the ivy lash out at all of the casters before diving into the
      ground and reemerging throughout the ritual's area of effect. Vines and
      other plants appropriate to the region grow over all buildings and
      structures in the area, dealing damage to them at a rate of 3 hit points
      every 10 minutes, ignoring their hardness. A typical wooden building can
      withstand 100 points of damage before being wrecked, while a typical stone
      building can withstand 150 points of damage before its complete
      destruction. The plants do not deal damage to creatures directly, though
      creatures that remain in a building may be injured if it collapses.
      Heavily fortified stone structures, such as castles and city walls, are
      sturdy enough to withstand this ritual. Any magical building or room
      receives a Fortitude save to repel the plants.</p>
