  description:
    value: >-
      <p><strong>School</strong> necromancy; <strong>Level</strong>
      7</p><p><strong>Casting Time</strong> 70
      minutes</p><p><strong>Components</strong> V, S, M (special paints and a
      small, salted pastry), F (silver bell worth 500 gp), SC (up to
      18)</p><p><strong>Skill Checks</strong> Knowledge (arcana) DC 31, 3
      successes; Knowledge (religion) DC 31, 3 successes, Linguistics DC 31, 1
      success</p><p><strong>Range</strong> touch</p><p><strong>Target</strong>
      one haunt within 60 ft.</p><p><strong>Duration</strong> 1 hour and 10
      rounds (D); see text</p><p><strong>Saving Throw</strong> Will negates;
      <strong>SR</strong> yes</p><p><strong>Backlash</strong> The primary caster
      is exhausted.</p><p><strong>Failure</strong> The casters take 1 permanent
      negative level and a –4 penalty on all skill and ability checks for as
      long as the negative level persists.</p><h3>Effect</h3><p>This ritual must
      be performed within 60 feet of a haunt. The primary caster rings the
      silver bell using an object associated with the haunt's origin or source
      of power. Once this is done, the primary caster draws an intricate circle
      adorned with occult symbols around a plate bearing the small, salted
      pastry.</p><p>If the incantation is successful, the haunt's spirit enters
      into the pastry (making the haunt inert for the duration of the ritual)
      and one of the casters must eat the pastry before the next hour or the
      ritual ends. Failure to do so allows the haunt to go free and increases
      any DCs of the haunt's effects by 4 and grants a +4 bonus on attack rolls
      made by the haunt for 24 hours. Once a caster eats the pastry, the spirit
      of the haunt speaks through the individual who ate the pastry, and is
      required to truthfully answer 10 questions (1 question per round) before
      departing, though since the haunt is an emotional echo, the answers may be
      brief, cryptic, or repetitive, as with <em>speak with dead</em>. Once the
      10 questions are answered or the spell is dismissed, the haunt can
      manifest as normal.</p>
  flags:
    dictionary:
      summary: Temporarily subdue a haunt and interrogate it.
