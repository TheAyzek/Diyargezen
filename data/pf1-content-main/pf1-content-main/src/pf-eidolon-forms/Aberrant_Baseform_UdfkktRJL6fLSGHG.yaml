    img: systems/pf1/icons/misc/hazard-sign.svg
    name: Requires Manual Setup
    system:
      description:
        value: >-
          <p><strong>Skills</strong></p><p>At first level, select 4 additional
          class skills (if the eidolon has a fly speed, it gains Fly for free)
          through editting the Class.</p><p><strong>Evolution
          Points</strong></p><p>If you are using an Unchained Summoner, use
          @Compendium[pf-content.pf-eidolon-evolutions.B2McodEGU4IGjGqi]{Evolution
          Pool (Unchained)}.</p><p>If you are using a Chained Summoner, use
          @Compendium[pf-content.pf-eidolon-evolutions.gQahVj8GpA8Yvguq]{Evolution
          Pool (Chained)} for tracking evolution points.</p>
    type: feat
  - _id: FgQYCIWGFDlI6BAK
    _key: '!actors.items!UdfkktRJL6fLSGHG.FgQYCIWGFDlI6BAK'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/feats/improved-counterspell.jpg
    name: Share Spells
    system:
      abilityType: ex
      associations:
        classes:
          - Eidolon
      class: eidolon
      description:
        value: >-
          <p>The summoner may cast a spell with a target of &ldquo;you&rdquo; on
          his eidolon (as a spell with a range of touch) instead of on himself.
          A summoner may cast spells on his eidolon even if the spells normally
          do not affect creatures of the eidolon's type (outsider).</p><p>Spells
          cast in this way must come from the summoner spell list. </p><p>This
          ability does not allow the eidolon to share abilities that are not
          spells, even if they function like spells.</p>
      subType: classFeat
      tags:
        - Eidolon
    type: feat
  - _id: qkCkZg7fOAlhmjzR
    _key: '!actors.items!UdfkktRJL6fLSGHG.qkCkZg7fOAlhmjzR'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/feats/athletic.jpg
    name: STR/DEX Bonus
    system:
      associations:
        classes:
          - Eidolon
      changes:
        - _id: 2167egmx
          formula: floor((@class.level + 1) / 2.54)
          target: str
          type: untyped
        - _id: 9eu6k92k
          formula: floor((@class.level + 1) / 2.54)
          target: dex
          type: untyped
      class: eidolon
      description:
        value: >-
          <p>Add this modifier to the eidolon's Strength and Dexterity scores,
          as determined by its base form.</p><p>Some options available through
          the eidolon's evolution pool might modify these scores.</p><p
          ><strong>Str/Dex Bonus</strong>: [[ floor((@class.level + 3) * 2 / 5)
          - 1 ]]</p>
      subType: classFeat
      tags:
        - Eidolon
    type: feat
  - _id: AMAf5DZT4BHHgEgg
    _key: '!actors.items!UdfkktRJL6fLSGHG.AMAf5DZT4BHHgEgg'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/blood_11.jpg
    name: Base Attack Bonus
    system:
      associations:
        classes:
          - Eidolon
      class: eidolon
      description:
        value: >-
          <p><strong>Current BAB</strong>: [[(round((@class.level - 1) * .75) +
          1)]]</p><p>This is the eidolon's base attack bonus. An eidolon's base
          attack bonus is equal to its Hit Dice. Eidolons do not gain additional
          attacks using their natural weapons for a high base attack bonus.</p>
      subType: classFeat
      tags:
        - Eidolon
    type: feat
  - _id: sS3IyrMbc0CvyOo5
    _key: '!actors.items!UdfkktRJL6fLSGHG.sS3IyrMbc0CvyOo5'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/feats/greater-shield-focus.jpg
    name: Eidolon Saves
    system:
      associations:
        classes:
          - Eidolon
      class: eidolon
      description:
        value: >-
          <p>These are the eidolon's base saving throw bonuses. An eidolon
          possesses two good saving throws and one bad saving throw, determined
          by the creature's base form.</p><p><strong>Good Saves</strong>: 
          [[ifelse(gt(@class.level, 14), 8, ifelse(gt(@class.level, 9), 6,
          ifelse(gt(@class.level, 4), 4, ifelse(gt(@class.level, 1), 3,
          2))))]]</p><p><strong>Bad Save</strong>: [[(floor((@class.level + 1) /
          4))]]</p><p>&nbsp;</p>
      subType: classFeat
      tags:
        - Eidolon
    type: feat
