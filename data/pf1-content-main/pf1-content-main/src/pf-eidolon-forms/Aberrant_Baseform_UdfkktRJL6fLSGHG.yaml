  - _id: ojLjWIHXte1CGx5t
    _key: '!actors.items!UdfkktRJL6fLSGHG.ojLjWIHXte1CGx5t'
    _stats:
      compendiumSource: Compendium.pf1.class-abilities.Item.fmRXYuupqjHgFBCB
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/blue_26.jpg
    name: Tentacle Mass (UC) (Base)
    system:
      abilityType: ex
      associations:
        classes:
          - Eidolon (Unchained)
      class: eidolon
      description:
        value: >-
          <p><strong>Requirements</strong>: Aberrant subtype.</p>

          <p>The eidolon grows a thick mass of tentacles that can be used as a
          primary natural weapon. The tentacles deal 1d8 points of damage if the
          eidolon is Medium. Eidolons with the grab evolution that is linked to
          a tentacle mass can use that ability to grapple foes of up to the
          eidolon’s size, and they can also use this evolution in place of the
          serpentine base form to qualify for the constrict evolution.</p>
      subType: misc
    type: feat
  - _id: OU5dQ9MnAaLGG2O3
    _key: '!actors.items!UdfkktRJL6fLSGHG.OU5dQ9MnAaLGG2O3'
    _stats:
      compendiumSource: Compendium.pf1.class-abilities.Item.3gcGbx4ymWgh4vGS
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/blue_26.jpg
    name: Grab [Tentacle Mass] (UC) (Base)
    system:
      abilityType: ex
      associations:
        classes:
          - Eidolon (Unchained)
      class: eidolon
      description:
        value: >-
          <p>The eidolon becomes adept at grappling foes, gaining the grab
          ability. Select one of the following attacks: bite, claw, pincers,
          slam, tail slap, or tentacle. Whenever the eidolon makes a successful
          attack of the selected type, it can attempt a free combat maneuver
          check. If successful, the eidolon grapples the target.</p>

          <p>This ability works only on creatures at least one size category
          smaller than the eidolon.</p>

          <p>Eidolons with this evolution gain a +4 bonus on combat maneuver
          checks to grapple.</p>
      subType: misc
    type: feat
