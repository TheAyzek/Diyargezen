          name: Use
      class: eidolon
      description:
        value: >-
          <p>An eidolon's maw is full of razor-sharp teeth, giving it a bite
          attack. This attack is a primary attack. The bite deals 1d6 points of
          damage (1d8 if Large, 2d6 if Huge).</p><p>If the eidolon already has a
          bite attack, this evolution allows it to deal 1-1/2 times its Strength
          modifier on damage rolls made with its
          bite.</p><p><strong>Usage</strong></p><p>Add
          @Compendium[pf-content.pf-eidolon-evolutions.YB38Da80HxcuK3wE]{Bite
          (Attack)} to eidolon sheet</p>
      subType: misc
      tags:
        - Eidolon Evolution
    type: feat
  - _id: gNCFN7Ek9GScX5bn
    _key: '!actors.items!UdfkktRJL6fLSGHG.gNCFN7Ek9GScX5bn'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/biological/shell-ridged-blue.webp
    name: Improved Natural Armor (Base)
    system:
      abilityType: ex
      changes:
        - _id: x08fhzuw
          formula: '2'
          target: nac
          type: untyped
      class: eidolon
      description:
        value: >-
          <p>An eidolon's hide grows thick fur, rigid scales, or bony plates,
          giving it a +2 bonus to its natural armor. This evolution can be taken
          once for every five levels the summoner
          possesses.</p><p><strong>Usage</strong></p><p>Increase the +2 if taken
          more than once.</p>
      subType: misc
      tags:
        - Eidolon Evolution
    type: feat
  - _id: ix6OujInTLvRXz7D
    _key: '!actors.items!UdfkktRJL6fLSGHG.ix6OujInTLvRXz7D'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/water_02.jpg
    name: Gills (Base)
    system:
      abilityType: ex
      class: eidolon
      description:
        value: <p>An eidolon has gills and can breathe underwater indefinitely.</p>
      subType: misc
      tags:
        - Eidolon Evolution
    type: feat
  - _id: 0qmyfQpoRhGvSTGd
    _key: '!actors.items!UdfkktRJL6fLSGHG.0qmyfQpoRhGvSTGd'
    _stats:
      coreVersion: '12.331'
    img: icons/environment/creatures/fish-smooth-orange-red.webp
    name: Swim (Base)
    system:
      abilityType: ex
      changes:
        - _id: ubu2ioce
          formula: '@attributes.speed.land.base'
          target: swimSpeed
          type: untyped
      class: eidolon
      description:
        value: >-
          <p>An eidolon gains webbed hands, feet, or powerful flippers, giving
          it a swim speed equal to its base speed.</p><p>This evolution does not
          give the eidolon the ability to breathe underwater.</p><p>This
          evolution can be selected more than once. Each additional time it is
          selected, increase the eidolon's swim speed by 20
          feet.</p><p><strong>Usage</strong></p><p>If base speed isn't Land,
          repalce in Changes.</p>
      subType: misc
      tags:
        - Eidolon Evolution
    type: feat
  - _id: Vb8kRAiAm67p5bMF
    _key: '!actors.items!UdfkktRJL6fLSGHG.Vb8kRAiAm67p5bMF'
