          style="width:15.606%;height:16px">—</td></tr></tbody></table><p>Class
          Level: This is the character's summoner
          level.</p><p><strong>HD</strong>: This is the total number of 10-sided
          (d10) Hit Dice the eidolon possesses, each of which gains a
          Constitution modifier, as normal.</p><p><strong>BAB</strong>: This is
          the eidolon's base attack bonus. An eidolon's base attack bonus is
          equal to its Hit Dice. Eidolons do not gain additional attacks using
          their natural weapons for a high base attack
          bonus.</p><p><strong>Good/Bad Saves</strong>: These are the eidolon's
          base saving throw bonuses. An eidolon possesses two good saving throws
          and one bad saving throw, determined by the creature's base
          form.</p><p><strong>Skills</strong>: This lists the eidolon's total
          skill ranks. An eidolon can assign skill ranks to any skill, but it
          must possess the appropriate appendages to use some skills. Eidolons
          with Intelligence scores above the base value modify these totals as
          normal (an eidolon receives a number of skill ranks equal to 6 + its
          Intelligence modifier per HD).</p><p>An eidolon cannot have more ranks
          in a skill than it has Hit Dice. Eidolon skill ranks are set once
          chosen, even if the creature changes when the summoner gains a new
          level.</p><p><strong>Feats</strong>: This is the total number of feats
          possessed by an eidolon. Eidolons can select any feat that they
          qualify for, but they must possess the appropriate appendages to use
          some feats. Eidolon feats are set once chosen, even if the creature
          changes when the summoner gains a new level. If, due to changes, the
          eidolon no longer qualifies for a feat, the feat has no effect until
          the eidolon once again qualifies for the feat.</p><p><strong>Armor
          Bonus</strong>: The number noted here is the eidolon's base total
          armor bonus. This bonus may be split between an armor bonus and a
          natural armor bonus, as decided by the summoner. This number is
          modified by the eidolon's base form and some options available through
          its evolution pool. An eidolon cannot wear armor of any kind, as the
          armor interferes with the summoner's connection to the
          eidolon.</p><p><strong>Str/Dex Bonus</strong>: Add this modifier to
          the eidolon's Strength and Dexterity scores, as determined by its base
          form. Some options available through the eidolon's evolution pool
          might modify these scores.</p><p><strong>Evolution Pool</strong>: The
          value given in this column is the total number of points in the
          eidolon's evolution pool. Points from this pool can be spent on a wide
          variety of modifications and upgrades that add new abilities, attacks,
          and powers to the eidolon. Whenever the summoner gains a level, the
          number in this pool increases and the summoner can spend these points
          to change the abilities of the eidolon. These choices are not set. The
          summoner can change them whenever he gains a level (and through the
          transmogrify spell).</p><p><strong>Max. Attacks</strong>: This
          indicates the maximum number of natural attacks that the eidolon is
          allowed to possess at the given level. If the eidolon is at its
          maximum, it cannot take evolutions that grant additional natural
          attacks. This does not include attacks made with
          weapons.</p><p><strong>Special</strong>: This includes a number of
          abilities gained by all eidolons as they increase in power. Each of
          these bonuses is described below.</p><p><strong>Darkvision</strong>
          (Ex): The eidolon has darkvision out to a range of 60
          feet.</p><p><strong>Link (Ex)</strong>: A summoner and his eidolon
          share a mental link allows for communication across any distance (as
          long as they are on the same plane). This communication is a free
          action, allowing the summoner to give orders to his eidolon at any
          time. In addition, magic items interfere with the summoner's
          connection to his eidolon. As a result, the summoner and his eidolon
          share magic item slots. For example, if the summoner is wearing a
          ring, his eidolon can wear no more than one ring. In case of a
          conflict, the items worn by the summoner remain active, and those used
          by the eidolon become dormant. The eidolon must possess the
          appropriate appendages to utilize a magic item.</p><p><strong>Share
          Spells (Ex)</strong>: The summoner may cast a spell with a target of
          “you” on his eidolon (as a spell with a range of touch) instead of on
          himself. A summoner may cast spells on his eidolon even if the spells
          normally do not affect creatures of the eidolon's type (outsider).
          Spells cast in this way must come from the summoner spell list. This
          ability does not allow the eidolon to share abilities that are not
          spells, even if they function like spells.</p><p><strong>Evasion
          (Ex)</strong>: If an eidolon is subjected to an attack that normally
          allows a Reflex save for half damage, it takes no damage if it makes a
          successful saving throw.</p><p><strong>Ability Score Increase
          (Ex)</strong>: The eidolon adds +1 to one of its ability
          scores.</p><p><strong>Devotion (Ex)</strong>: An eidolon gains a +4
          morale bonus on Will saves against enchantment spells and
          effects.</p><p><strong>Multiattack</strong>: An eidolon gains
          Multiattack as a bonus feat if it has 3 or more natural attacks and
          does not already have that feat. If it does not have the requisite 3
          or more natural attacks (or it is reduced to less than 3 attacks), the
          eidolon instead gains a second attack with one of its natural weapons,
          albeit at a –5 penalty. If the eidolon later gains 3 or more natural
          attacks, it loses this additional attack and instead gains
          Multiattack.</p><p><strong>Improved Evasion (Ex)</strong>: When
          subjected to an attack that allows a Reflex saving throw for half
          damage, an eidolon takes no damage if it makes a successful saving
          throw and only half damage if the saving throw fails.</p>
