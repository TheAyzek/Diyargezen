      subType: classFeat
      tags:
        - Eidolon
    type: feat
  - _id: Fd8fOn3nzgVKZ4D5
    _key: '!actors.items!cKGVxfkYbGHsWhsq.Fd8fOn3nzgVKZ4D5'
    _stats:
      compendiumSource: Compendium.pf-content.pf-eidolon-evolutions.Item.Gl5sWXBXpYD14pXl
      coreVersion: '12.331'
    img: systems/pf1/icons/feats/greater-shield-focus.jpg
    name: Eidolon Saves
    system:
      associations:
        classes:
          - Eidolon
      class: eidolon
      description:
        value: >-
          <p>These are the eidolon's base saving throw bonuses. An eidolon
          possesses two good saving throws and one bad saving throw, determined
          by the creature's base form.</p><p><strong>Good Saves</strong>:
          [[ifelse(gt(@class.level, 14), 8, ifelse(gt(@class.level, 9), 6,
          ifelse(gt(@class.level, 4), 4, ifelse(gt(@class.level, 1), 3,
          2))))]]</p><p><strong>Bad Save</strong>: [[(floor((@class.level + 1) /
          4))]]</p><p>&nbsp;</p>
      subType: classFeat
      tags:
        - Eidolon
    type: feat
  - _id: BPT0niOlGpUVuTsu
    _key: '!actors.items!cKGVxfkYbGHsWhsq.BPT0niOlGpUVuTsu'
    _stats:
      compendiumSource: >-
        Compendium.pf-content.pf-eidolon-forms.Actor.lJfEdxOW6zeoUiLu.Item.c2RAb8PVEy1xf4wb
      coreVersion: '12.331'
    img: systems/pf1/icons/feats/intimidating-prowess.jpg
    name: Evolution Pool (Unchained)
    system:
      abilityType: ex
      actions:
        - _id: yeoc0f8nm43cjhbg
          activation:
            type: passive
            unchained:
              type: passive
          img: systems/pf1/icons/feats/intimidating-prowess.jpg
          name: Use
          tag: evolutionPoolUnchained
          uses:
            autoDeductChargesCost: '0'
      associations:
        classes:
          - Eidolon
      class: eidolon
      description:
        value: >-
          <p><strong>Current Pool</strong>: [[floor((@class.level - 1) * 0.75) +
          1 + (ifelse(gte((((@class.level - 1) * 75) - floor(((@class.level - 1)
          * 75) / 100) * 100), 50), 1, 0))]]</p><p>The value given in this
          column is the total number of points in the eidolon's evolution pool.
          Points from this pool can be spent on a wide variety of modifications
          and upgrades that add new abilities, attacks, and powers to the
          eidolon.</p><p>Whenever the summoner gains a level, the number in this
          pool increases and the summoner can spend these points to change the
          abilities of the eidolon. These choices are not set.</p><p>The
          summoner can change them whenever he gains a level (and through the
          transmogrify spell).</p><p><strong>Usage</strong></p><p>Subtract from
          the total when adding evolutions.</p>
      subType: classFeat
      tags:
        - Eidolon
      uses:
        autoDeductChargesCost: '0'
        maxFormula: >-
          floor((@class.level - 1) * 0.75) + 1 + (ifelse(gte((((@class.level -
          1) * 75) - floor(((@class.level - 1) * 75) / 100) * 100), 50), 1, 0))
        per: charges
        value: 0
    type: feat
  - _id: X4u38vIZ7fk6R6QP
    _key: '!actors.items!cKGVxfkYbGHsWhsq.X4u38vIZ7fk6R6QP'
    _stats:
      compendiumSource: >-
        Compendium.pf-content.pf-eidolon-forms.Actor.lJfEdxOW6zeoUiLu.Item.1WpsW6X3YK2qTDwd
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_23.jpg
    name: Claws (Base)
    system:
      abilityType: ex
      class: eidolon
      description:
        value: >-
          <p>An eidolon has a pair of vicious claws at the end of its limbs,
          giving it two claw attacks. These attacks are primary attacks. The
          claws deal 1d4 points of damage (1d6 if Large, 1d8 if
          Huge).</p><p><strong>Requirements</strong></p><p>The eidolon must have
          the limbs evolution to take this evolution. This evolution can only be
          applied to the limbs (legs) evolution once This evolution can be
          selected more than once, but the eidolon must possess an equal number
          of the limbs evolution.</p><p><strong>Usage</strong></p><p>Add
          @Compendium[pf-content.pf-eidolon-evolutions.CQPv0buKURuMtyLE]{Claws
          (Attack)} to the eidolon.&nbsp;</p>
      subType: misc
      tags:
        - Eidolon Evolution
    type: feat
  - _id: zP99cBAG0HMXndjn
    _key: '!actors.items!cKGVxfkYbGHsWhsq.zP99cBAG0HMXndjn'
    _stats:
      compendiumSource: >-
        Compendium.pf-content.pf-eidolon-forms.Actor.lJfEdxOW6zeoUiLu.Item.wsMcDof8cxpeMj1b
      coreVersion: '12.331'
    img: icons/commodities/biological/wing-bird-white.webp
    name: Flight (Base)
    system:
      abilityType: ex
      changes:
        - _id: kg08gxOA
          formula: '@attributes.speed.land.base'
          target: flySpeed
          type: untyped
      class: eidolon
      description:
        value: >-
          <p>An eidolon grows large wings, like those of a bat, bird, insect, or
          dragon, gaining the ability to fly. The eidolon gains a fly speed
          equal to its base speed.</p><p>The eidolon's maneuverability depends
          on it size. Medium or smaller eidolons have good maneuverability.
          Large eidolons have average maneuverability, while Huge eidolons have
          poor maneuverability.</p><p>For 2 additional evolution points, the
          eidolon flies by means of magic. It loses its wings, but its
          maneuverability increases to perfect. Flying via magic means makes
          this a supernatural ability. The eidolon's fly speed can be increased
          by spending additional evolution points, gaining a 20-foot increase to
          fly speed for each additional point
          spent.</p><p><strong>Requirements</strong></p><p>The summoner must be
          at least 5th level before selecting this evolution.</p>
      subType: misc
      tags:
        - Eidolon Evolution
    type: feat
  - _id: ItUZhTzkbiJc7CrV
    _key: '!actors.items!cKGVxfkYbGHsWhsq.ItUZhTzkbiJc7CrV'
    _stats:
      compendiumSource: >-
        Compendium.pf-content.pf-eidolon-forms.Actor.lJfEdxOW6zeoUiLu.Item.5UUMpxxvG8EyuXqa
      coreVersion: '12.331'
    img: icons/commodities/biological/hand-gnarled-green.webp
    name: Limbs (Legs)
    system:
      abilityType: ex
      class: eidolon
      description:
        value: >-
          <p>An eidolon grows an additional pair of limbs. These limbs can take
          one of two forms.</p><ul><li>They can be made into legs, complete with
          feet. Each pair of legs increases the eidolon's base speed by 10
          feet.</li><li>Alternatively, they can be made into arms, complete with
          hands.</li></ul><p>The eidolon does not gain any additional natural
          attacks for an additional pair of arms, but it can take other
          evolutions that add additional attacks (such as claws or a slam). Arms
          that have hands can be used to wield weapons, if the eidolon is
          proficient.</p><p>This evolution can be selected more than once.</p>
      subType: misc
      tags:
        - Eidolon Evolution
    type: feat
