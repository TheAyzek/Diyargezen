_stats:
  coreVersion: '12.331'
description: >-
  <p>A dedicated power operates only when an intelligent item is in pursuit of
  its special purpose. This determination is always made by the item. Unlike its
  other powers, an intelligent item can refuse to use its dedicated powers even
  if the owner is dominant. The caster level for these effects is equal to the
  item’s caster level.</p><p>Save DCs are based on the item’s highest mental
  ability score.</p>
