  - _id: 1i038DnKaUNGcgeR
    _key: '!actors.items!e6kN1rNIhFaZykRh.1i038DnKaUNGcgeR'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/framing-brown.webp
    name: Acrobat's pillar
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Melee Tactics Toolbox pg.
          20</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          training contraption consists of a stout, 7-foot-tall wooden pillar
          with spring-powered woodand- brass arms jutting sideways at different
          heights. When the springs are wound, the arms wave erratically through
          the area within 10 feet of the pillar. The arms don't swing with
          sufficient force to cause damage, but you can practice your acrobatic
          technique by moving up to and around the pillar while the arms are in
          motion, attempting to avoid being tagged. The mechanism operates for
          10 minutes before winding down. The entire contraption can be
          dismantled and stowed in a chest the size of a large foot locker for
          transport.</p><p>Using the pillar to hone your acrobatic techniques
          requires 1 hour of practice and a DC 20 Acrobatics check. If you
          succeed at the check, you gain a +2 circumstance bonus on Acrobatics
          checks to avoid attacks of opportunity provoked by moving out of or
          through an opponent's threatened area. This bonus lasts for 24 hours
          or until you fail an Acrobatics check.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 40
    type: loot
  - _id: ntynWqfcIUbex3VC
    _key: '!actors.items!e6kN1rNIhFaZykRh.ntynWqfcIUbex3VC'
    _stats:
      coreVersion: '12.331'
    img: icons/weapons/ammunition/shot-round-silver.webp
    name: Alchemical sling bullet
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Monster Codex pg.
          117</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Used
          by hobgoblin alchemists to equip their comrades, these spherical glass
          vials can each be filled with 1 dose of an alchemical splash weapon,
          allowing them to be used as ammunition for a sling. On a hit, an
          alchemical sling bullet shatters, affecting the target with the
          alchemical solution within. This deals only the splash weapon's damage
          (if any), not the damage a sling bullet would normally deal. This
          attack resolves against the target's normal AC (rather than touch AC)
          as with a standard sling bullet, and uses the sling's range. An
          alchemical sling bullet does not deal splash damage to squares
          adjacent to the target. If an attack roll with an alchemical sling
          bullet misses, the bullet and its alchemical contents are destroyed,
          and do not risk detonating in another square.</p><p> Filling an
          alchemical sling bullet is a standard action that provokes attacks of
          opportunity, and you must succeed at a DC 15 Craft (alchemy) or
          Sleight of Hand check to avoid spilling the alchemical item on
          yourself. On a failed check, the splash weapon explodes in your square
          as though you were targeted by the item (including any splash effects
          on adjacent squares).
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 5
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: ufCeq2mwM1Wa1v3T
    _key: '!actors.items!e6kN1rNIhFaZykRh.ufCeq2mwM1Wa1v3T'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/alembic-glass-ball-blue.webp
    name: Altar, Portable
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Demon Hunter's Handbook pg. 18</em>,
          <em>Adventurer's Armory pg. 19</em>, <em>Ultimate Equipment pg.
          77</p><p><strong>Category</strong> Tools</p><h2>Description</h2>A
          portable altar is typically made of wood and is ornately carved and
          decorated with the iconography of a specific religion. The top of the
          altar lifts up, and items such as candles, incense, and oil can be
          stored within. These altars are modest, but give traveling priests a
          center from which to say their daily prayers, perform minor rituals,
          or preach to an assembled crowd.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 250
      subType: gear
      weight:
        value: 40
    type: loot
  - _id: 4sWoVId4US9o5s4U
    _key: '!actors.items!e6kN1rNIhFaZykRh.4sWoVId4US9o5s4U'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/alembic-glass-ball-blue.webp
    name: Altar, Portable (masterwork)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Demon Hunter's Handbook pg.
          18</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>Consecrated to one of Golarion's many
          deities, this intricately etched case contains numerous candles,
          stands, scented herbs, dishes, silks, small cups, containers, and
          similar ceremonial tools all bearing colors and iconography sacred to
          the associated deity. The sturdy container features a padded interior
          with numerous straps and compartments so that the items within aren't
          damaged in transport. The altar's surface prominently features a
          deity's holy symbol, and it's sturdy enough that it can support up to
          300 pounds of weight, enough to serve as a makeshift pulpit.</p><p>
          Among the items found within the altar are the tools and materials
          necessary to perform not just ceremonies, but also jobs and
          professions the related deity deems sacred, as well as holy texts
          written to inspire greatness in the deity's followers. The user can
          expend some of the materials within the altar to gain a +2
          circumstance bonus on the next Craft check of the specified type (see
          below).</p><p>In addition, after spending 1 hour praying and reading
          the holy scriptures within the altar, the user gains a +2 circumstance
          bonus on a single skill check. Which deity this altar is dedicated to
          determines the skill to which this bonus applies (see below). The user
          must attempt this skill check within an hour of praying and reading
          the altar's scriptures or lose the bonus-the mantras and inspiration
          provided by the texts having drifted from her mind. This hour of
          prayer and scripture reading can be integrated with the time a cleric
          uses to prepare her spells. Regardless, using the masterwork portable
          altar in this manner expends the altar's materials in the same way
          that using the normal altar to bolster a Craft check does.</p><p>A
          masterwork portable altar can be used multiple times, but after 20
          uses, it must be restocked with 50 gp worth of sanctified
          materials-preferably purchased from a temple of the associated deity.
          The altar grants no bonuses on skill checks if used while its
          materials are depleted, though it can still be employed as a normal
          portable altar.</p><p><table
          class="inner"><tr><td><strong>Deity</strong></td><td><strong>Favored
          Craft</strong></td><td><strong>Aided Skill</strong></td><tr>
          <tr><td>Abadar</td><td>Craft (jewelry)</td><td>Appraise</td><tr>
          <tr><td>Asmodeus</td><td>Craft
          (calligraphy)</td><td>Diplomacy</td><tr>
          <tr><td>Calistria</td><td>Craft (traps)</td><td>Bluff</td><tr>
          <tr><td>Cayden Cailean</td><td>Craft (leather)</td><td>Ride</td><tr>
          <tr><td>Desna</td><td>Craft (clothing)</td><td>Perception</td><tr>
          <tr><td>Erastil</td><td>Craft (bows)</td><td>Survival</td><tr>
          <tr><td>Gorum</td><td>Craft (armor)</td><td>Intimidate</td><tr>
          <tr><td>Gozreh</td><td>Craft (ships)</td><td>Handle Animal</td><tr>
          <tr><td>Iomedae</td><td>Craft (armor)</td><td>Diplomacy</td><tr>
          <tr><td>Irori</td><td>Craft (books)</td><td>Acrobatics</td><tr>
          <tr><td>Lamashtu</td><td>Craft (traps)</td><td>Intimidate</td><tr>
          <tr><td>Nethys</td><td>Craft (books)</td><td>Spellcraft</td><tr>
          <tr><td>Norgorber</td><td>Craft (alchemy)</td><td>Stealth</td><tr>
          <tr><td>Pharasma</td><td>Craft (pottery)</td><td>Perception</td><tr>
          <tr><td>Rovagug</td><td>Craft (weapons)</td><td>Intimidate</td><tr>
          <tr><td>Sarenrae</td><td>Craft (weapons)</td><td>Heal</td><tr>
          <tr><td>Shelyn</td><td>Craft (any art)</td><td>Perform (any)</td><tr>
          <tr><td>Torag</td><td>Craft (stonemasonry)</td><td>Climb</td><tr>
          <tr><td>Urgathoa</td><td>Craft (alchemy)</td><td>Disguise</td><tr>
          <tr><td>Zon-Kuthon</td><td>Craft
          (locks)</td><td>Stealth</td><tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></tr></table>
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 400
      subType: gear
      weight:
        value: 40
    type: loot
  - _id: b8smiWXeJX9IjYCC
    _key: '!actors.items!e6kN1rNIhFaZykRh.b8smiWXeJX9IjYCC'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/orb-tassle-blue-yellow.webp
    name: Anchoring balloon
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the Stars pg.
          19</p><p><strong>Category</strong> Tools</p><h2>Description</h2>An
          anchoring balloon is a single-use alchemical device designed to
          provide a standing platform on a gaseous planet. When a cord is pulled
          as a standard action, an alchemical reaction fills the balloon with
          hydrogen gas almost instantly. Twenty-foot-long ropes attach the
          balloon to a lightweight, collapsible 10-foot-square steel basket with
          5-foot-high sides. The inflated balloon is a Gargantuan object.
          Although it moves with the wind horizontally, the basket maintains its
          initial altitude to within a few feet so long as its load is less than
          2,000 pounds (divided by the planet's gravity multiplier). Beyond that
          weight limit, the balloon may sink or the basket may break (at the
          GM's discretion). The balloon remains inflated for 24 hours before its
          seals fail.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 300
      subType: gear
      weight:
        value: 25
    type: loot
  - _id: dWjfeUXPmet8aYyT
    _key: '!actors.items!e6kN1rNIhFaZykRh.dWjfeUXPmet8aYyT'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/smithing/anvil.webp
    name: Anvil
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Adventurer's Armory pg. 19</em>, <em>Advanced Player's Guide pg.
          184</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong> 10-100
          lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>While anvil sizes vary depending on the
          type of smithing for which they are used, all anvils have the same
          basic shape and construction. Blacksmith anvils are much heavier and
          larger (100 pounds) than farrier anvils (50 pounds), which in turn are
          much bigger than silver- or goldsmith anvils (10 pounds). Many
          metalworking tasks are impossible without the proper anvil.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 5
      subType: gear
    type: loot
  - _id: 4KkwleumKNLJXU3C
    _key: '!actors.items!e6kN1rNIhFaZykRh.4KkwleumKNLJXU3C'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-backed-wood-tan.webp
    name: Arcane family workbook
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          27</p><p><strong>Category</strong> Tools</p><h2>Description</h2>The
          elven predilection for becoming wizards and the social benefits that
          elven wizards enjoy often encourages families to dedicate themselves
          to wizardly studies for multiple generations. Older elven wizards take
          note of their own insights into the secrets of arcane magic and
          compile these thoughts with the ideas of earlier generations to form
          family workbooks. When used as a reference (an action that typically
          takes 1d4 full rounds of searching the text), an arcane family
          workbook grants a +2 circumstance bonus on a Spellcraft checks. This
          bonus increases to +4 if 1d4 hours are spent referencing the book.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 300
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: W8wGn157dmGSz9V6
    _key: '!actors.items!e6kN1rNIhFaZykRh.W8wGn157dmGSz9V6'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/metal/clasp-steel-green.webp
    name: Armor truss
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Melee Tactics Toolbox pg.
          20</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          collection of flexible strips of wood, durable shims, and thin cords
          allows you to prop open the buckles, padding, and plates of armor for
          easy entry. If you take at least 15 minutes preparing an empty suit of
          armor with an armor truss, you are considered to have help in putting
          on the armor and can don the armor in the time it usually takes to don
          the armor hastily without worsening armor check penalties or
          decreasing armor bonuses.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 30
      subType: gear
      weight:
        value: 10
    type: loot
  - _id: JOinjGqJUITgWT0a
    _key: '!actors.items!e6kN1rNIhFaZykRh.JOinjGqJUITgWT0a'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Authoritative vestments
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          24</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Any</p><h2>Description</h2>Typically
          worn by senior members of a faith, these cumbersome but splendidly
          ornate garments create an aura of dignity and gravitas that few dare
          to challenge. When activated, the garments make you seem more
          impressive and worthy of respect to all viewers within 60 feet of you;
          you may make a single Diplomacy check to change the attitudes of these
          viewers as a swift action. You can only use this ability on a
          particular viewer once per day (additional attempts have no effect,
          though you can still persuade viewers normally without the help of the
          focus).
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 450
      subType: gear
      weight:
        value: 15
    type: loot
  - _id: cfeKkvx5YF5xzEtp
    _key: '!actors.items!e6kN1rNIhFaZykRh.cfeKkvx5YF5xzEtp'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/wood-pole.webp
    name: Balancing pole
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Advanced Player's Guide pg. 184</em>, <em>Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 8 sp; <strong>Weight</strong> 12
          lbs.</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          flexible pole can be anywhere from 15 to 30 feet in length. When used
          properly, it helps you keep your balance when crossing narrow
          walkways. Using a balancing pole grants you a +1 circumstance bonus on
          Acrobatics checks made to traverse a narrow surface.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 0.8
      subType: gear
      weight:
        value: 12
    type: loot
  - _id: xosXOAWqZ6UzNe5z
    _key: '!actors.items!e6kN1rNIhFaZykRh.xosXOAWqZ6UzNe5z'
    _stats:
      coreVersion: '12.331'
    img: icons/environment/traps/trap-jaw-green.webp
    name: Barbed troll claws
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Advanced Player's Guide pg. 184</em>, <em>Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 2 gp; <strong>Weight</strong> 10
          lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>Although intended for trapping large
          animals, bear traps work as well for trapping humanoids or monsters.
          The hinged jaws of the trap are attached to a chain, which in turn is
          secured to a spike driven into the ground to ensure that the victim
          cannot simply crawl away. Prying open the jaws or pulling the spike
          from the ground requires a DC 20 Strength check.</p><p> <h2>Bear Trap
          - CR 1</h2> <strong>Type </strong>mechanical; <strong>Perception
          </strong>DC 15; <strong>Disable Device </strong>DC 20 <h2>Effects</h2>
          <strong>Trigger </strong>location; <strong>Reset
          </strong>manual</p><p> <strong>Effect </strong>Atk +10 melee (2d6+3);
          sharp jaws spring shut around the creature's ankle and halve the
          creature's base speed (or hold the creature immobile if the trap is
          attached to a solid object); the creature can escape with a DC 20
          Disable Device check, DC 22 Escape Artist check, or DC 26 Strength
          check.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 2
      subType: gear
      weight:
        value: 10
    type: loot
  - _id: 9s6pO1DO9YwCRWJ3
    _key: '!actors.items!e6kN1rNIhFaZykRh.9s6pO1DO9YwCRWJ3'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/instruments/bell-brass.webp
    name: Bear Trap (offset)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Martial Arts Handbook pg.
          30</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          form-fitting garment is strung all around with dozens of small bells.
          You can practice your sneaking technique by donning a belled catsuit
          and then attempting to move without letting any of the bells ring. Old
          thieves sometimes call a belled catsuit a Billy-Jacket. Training with
          a belled catsuit requires 1 hour of practice and a DC 25 Stealth
          check. If you succeed at the check, you gain a +2 circumstance bonus
          on Stealth checks to hide. This bonus lasts for 24 hours or until you
          fail a Stealth check.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 30
      subType: gear
      weight:
        value: 12
    type: loot
  - _id: cCpGFrprmk8heJW7
    _key: '!actors.items!e6kN1rNIhFaZykRh.cCpGFrprmk8heJW7'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/smithing/crucible.webp
    name: Bellows
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Advanced Player's Guide pg. 184</em>, <em>Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong> 3
          lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>Bellows are useful for starting fires,
          providing a +1 circumstance bonus on Survival checks to start or
          maintain fires.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 1
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: tMqZSYid1tWrJB0v
    _key: '!actors.items!e6kN1rNIhFaZykRh.tMqZSYid1tWrJB0v'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/instruments/chimes-wood-white.webp
    name: Billy Ten-Bells
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Martial Arts Handbook pg.
          30</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>Bearing a marked resemblance to an
          anthropomorphic wind chime, this complicated arrangement of strings,
          sticks, and bells is hung from a ceiling or branch and has a purse or
          money-pouch deep inside. The trick is to silently steal a coin from
          Billy Ten-Bells, as the slightest movement will set the bells ringing.
          Veteran thieves sometimes decorate Billy with scraps of stolen
          clothing for good luck. Training with Billy Ten-Bells requires 1 hour
          of practice and a DC 20 Sleight of Hand check. If you succeed at the
          check, you gain a +2 circumstance bonus on Sleight of Hand checks to
          pick pockets. This bonus lasts for 24 hours or until you fail a
          Sleight of Hand check.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 6
    type: loot
  - _id: J0YSGBAi34oM5lMj
    _key: '!actors.items!e6kN1rNIhFaZykRh.J0YSGBAi34oM5lMj'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/treasure/statue-carved-figurehead.webp
    name: Blackwood figurehead
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Merchant's Manifest pg.
          9</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Carved
          in the likeness of a sea creature or another form desired by the one
          commissioning it, this item grants its ship's crew a +2 morale bonus
          on Profession (sailor) checks while on board.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 650
      subType: gear
      weight:
        value: 25
    type: loot
  - _id: 8j9UrjCfXMEzRP1K
    _key: '!actors.items!e6kN1rNIhFaZykRh.8j9UrjCfXMEzRP1K'
    _stats:
      coreVersion: '12.331'
    img: icons/weapons/daggers/dagger-jagged-handguard-black.webp
    name: Boline
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          16</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>Bolines are hook-shaped knives commonly
          used by herbalists and spellcasters to harvest ingredients for their
          craft. A boline's blade is typically 5 inches long, and is too small
          and irregular to use as a weapon. You can use a boline to finely slice
          the herbs in a healer's kit, so you can treat deadly wounds with only
          a single use from a healer's kit rather than two uses.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 10
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: eqI8msYf1MCt1SO3
    _key: '!actors.items!e6kN1rNIhFaZykRh.eqI8msYf1MCt1SO3'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/fishing/net-gold.webp
    name: Bombchucker
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Monster Codex pg.
          117</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          curved wicker basket is worn like a glove over one hand. The basket
          extends approximately 2 feet in a steady curve, allowing you to launch
          a thrown splash weapon at incredible speeds and over long distances.
          Using a bombchucker increases the range increment of any thrown splash
          weapon by 10 feet. Loading a bombchucker requires a free hand, as the
          hand wielding the bombchucker can't be used for any other purpose. A
          bombchucker doesn't get in the way of preparing and throwing a bomb
          created with the bomb class feature.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 12
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: XtNDq139SDaKr0Jn
    _key: '!actors.items!e6kN1rNIhFaZykRh.XtNDq139SDaKr0Jn'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Branding iron
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Faiths of Balance pg.
          24</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Irori</p><h2>Description</h2>When
          activated, this small masterwork metal gong remains charged with power
          for 8 hours. When the gong is struck softly, it emits a clear and
          pleasing tone that instantly focuses the striker's thoughts and mental
          energy. If the creature striking the gong has a <em>ki</em> pool and
          worships Irori, she regains 1 <em>ki</em> point. This use expends the
          power within the gong.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 100
      subType: gear
      weight:
        value: 5
    type: loot
  - _id: nY43aWjy6QsIbxoS
    _key: '!actors.items!e6kN1rNIhFaZykRh.nY43aWjy6QsIbxoS'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-orange.webp
    name: Celestial censer
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          87</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          blessed thurible holds up to 10 pieces of incense, and burns at a rate
          of 1 stick per hour. If a smokestick is added to the incense in the
          censer while it burns, creatures with the evil subtype are dazzled for
          as long as they remain within the area of the resulting smoke.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: EB6RsYkpss72dAlW
    _key: '!actors.items!e6kN1rNIhFaZykRh.EB6RsYkpss72dAlW'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/lights/lantern-iron-yellow.webp
    name: Celestial lamp
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          87</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          polished lantern contains a <em>continual flame </em>and sheds light
          as a common lamp. If its font of consecrated crystal and metalwork is
          filled with holy water, the lamp's light is sanctified for 24 hours,
          adding a +1 bonus to the save DC of channeled positive energy or
          energy channeled to harm evil outsiders within a 30-foot radius.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 300
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: XPovR0ywPOOsy6kI
    _key: '!actors.items!e6kN1rNIhFaZykRh.XPovR0ywPOOsy6kI'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Chains of contrition
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          24</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Any</p><h2>Description</h2>Each
          carefully forged link of these masterwork manacles (with a good lock)
          contains a parable or other quotes excerpted from sacred texts.
          Activating the focus increases its Disable Device, Escape Artist, and
          break DCs by 5; its hardness increases by 2 and its hit points by 4.
          This effect lasts 24 hours or until the creature frees itself or is
          released.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 200
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: payRe3DB7lYtXJdK
    _key: '!actors.items!e6kN1rNIhFaZykRh.payRe3DB7lYtXJdK'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/wrist/bracer-shadow.webp
    name: Cheat sheath
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          203</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          ornate leather sheath is covered in tables of magical notation and
          arcane formulae, as well as common spell triggers and reagents.
          Referring to these handy bits of notation grants you a +2 circumstance
          bonus on Spellcraft checks made to learn a spell from a spellbook or
          scroll, prepare a spell from a borrowed spellbook, identify the
          properties of a magic item using detect magic, or decipher a scroll.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 100
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: YQDpJjZVGNPBtX42
    _key: '!actors.items!e6kN1rNIhFaZykRh.YQDpJjZVGNPBtX42'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-backed-silver-red.webp
    name: Compact spellbook
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          27</p><p><strong>Category</strong> Tools</p><h2>Description</h2>The
          need to be able to record and travel with dozens or even hundreds of
          spells often forces elven wizards to seek lighter spellbooks. Compact
          spellbooks hold only 70 pages of spells, but they weigh significantly
          less than an ordinary spellbook.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: l3foMRFg1KRjTRBr
    _key: '!actors.items!e6kN1rNIhFaZykRh.l3foMRFg1KRjTRBr'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/tech/motor-rotating.webp
    name: Compressed air
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the Stars pg.
          19</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Longer
          lasting than an air bladder (<em>Ultimate Equipment</em> 58), a jar of
          compressed air comes with a breathing apparatus that can be strapped
          over the mouth with a leather cord and provides enough air for a
          Medium character to breathe normally for 10 minutes (20 minutes for a
          Small character).
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 10
    type: loot
  - _id: 4GTA0dy09iRZ2kLm
    _key: '!actors.items!e6kN1rNIhFaZykRh.4GTA0dy09iRZ2kLm'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Consecrated weapon
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          24</p><p><strong>Price</strong> +150 gp; <strong>Weight</strong> 2
          lbs.</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong>
          Any</p><h2>Description</h2>Consecrated weapons may be of any
          type-swords, axes, masterwork, mithral, and even magical-and function
          appropriately. When activated, the cleric charges the weapon with
          positive or negative energy (as appropriate) so it deals extra damage
          when it hits a target. This functions like the Channel Smite feat,
          except the additional damage is equal to half the cleric's channel
          energy damage (the target makes a Will save as normal, based on the
          cleric's channel energy DC). The weapon remains charged with this
          energy until it successfully strikes a creature or 24 hours pass,
          whichever comes first. Creatures other than the cleric are able to use
          the charged weapon and this ability.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 150
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: rOE4jX9ICjebnSH3
    _key: '!actors.items!e6kN1rNIhFaZykRh.rOE4jX9ICjebnSH3'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/instruments/bell-brass.webp
    name: Convocation bells
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Disciple's Doctrine pg.
          28</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          set of simple brass bells is held in a wheeled stand that allows bell
          ringers to easily move the ensemble. The bells are carefully
          constructed and ordered to enable ringers to perform the melodies of
          songs or hymns of a particular religion.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 100
      subType: gear
      weight:
        value: 10
    type: loot
  - _id: M8ET6j63uWvSOUNn
    _key: '!actors.items!e6kN1rNIhFaZykRh.M8ET6j63uWvSOUNn'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/documents/document-tree-brown.webp
    name: Cosmogram
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the Stars pg.
          26</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          eldritch chart describes part of the unfathomably vast shape of the
          physical universe and the subtler motions of the stars. A cosmogram
          grants a +1 circumstance bonus on Knowledge (geography) checks
          relating to stars and on Survival checks to navigate the void of space
          between star systems. A cosmogram can be consulted while using an
          orrery (see below) as a focus for augury. Doing so increases the
          chance of a successful reading by 2%.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 200
      subType: gear
      weight:
        value: 0.5
    type: loot
  - _id: 1tzoHGUAXTDvj9S8
    _key: '!actors.items!e6kN1rNIhFaZykRh.1tzoHGUAXTDvj9S8'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/instruments/harp-lap-brown.webp
    name: Darkwood Mwagni harp
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Merchant's Manifest pg.
          20</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>Musicians in the Mwangi Expanse make
          frequent use of carved harps strung with strings made from natural
          materials. These harps often feature ornately detailed soundboards and
          necks shaped like creatures that inhabit the region. Harps crafted
          from darkwood are very light compared to similar instruments, yet they
          retain the resonance and tonal quality demanded by the pickiest of
          musicians. A darkwood Mwangi harp is a masterwork musical instrument
          (<em>Pathfinder RPG Ultimate Equipment</em> 78) that grants you a +2
          circumstance bonus on Perform checks when using it.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 130
      subType: gear
      weight:
        value: 1.5
    type: loot
  - _id: FpMq6gXRTUHcEMwp
    _key: '!actors.items!e6kN1rNIhFaZykRh.FpMq6gXRTUHcEMwp'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/treasure/trinket-totem-bone-green.webp
    name: Decoy trigger (decoy pressure switch)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          16</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          large wood-and-canvas fan is 2 feet wide and ideal for quickly
          dispersing smoke or other harmful gases. While waving a dissipating
          fan, you gain a +2 circumstance bonus on Fortitude saving throws to
          avoid taking nonlethal damage from heat exposure and to avoid the
          effects of smoke inhalation. You can use a dissipating fan to clear
          nonmagical smoke, fog, or similar vapors from your square or an
          adjacent square as a full-round action-although dense smoke or fog in
          the surrounding area eventually refills the space (how long this takes
          depends on the source and the size of the area, at the GM's
          discretion). When folded and closed, a dissipating fan is the size of
          a thick walking stick. Some dissipating fans are decorated with paint
          or elaborate embroidery, and have a higher price to reflect their
          adornment.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 150
      subType: gear
      weight:
        value: 6
    type: loot
  - _id: 9x7gcpTCpP1AQZak
    _key: '!actors.items!e6kN1rNIhFaZykRh.9x7gcpTCpP1AQZak'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/mask-plague-grey.webp
    name: Doctor's mask
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg. 19</em>,
          <em>Pathfinder #8: Seven Days to the Grave pg. 61</em>, <em>Curse of
          the Crimson Throne Player's Guide pg.
          12</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          protective mask gives you a +1 circumstance bonus on Fortitude saves
          made against airborne toxins and scent-based effects. In Korvosa, it
          is a minor crime to wear a doctor's mask in public if you are not a
          healer or physician.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: rszrOp1EXm5O2CH5
    _key: '!actors.items!e6kN1rNIhFaZykRh.rszrOp1EXm5O2CH5'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-layered-white.webp
    name: Doctor's outfit
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg. 19</em>,
          <em>Pathfinder #8: Seven Days to the Grave pg.
          61</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Any
          creature wearing this outfit gains a +2 circumstance bonus on
          Fortitude saves made to resist contact diseases.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 150
      subType: gear
      weight:
        value: 6
    type: loot
  - _id: 9hVFJaopbzqKGldm
    _key: '!actors.items!e6kN1rNIhFaZykRh.9hVFJaopbzqKGldm'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Driftwood icon
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Faiths of Balance pg.
          25</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Gozreh</p><h2>Description</h2>This
          is a hand-carved icon of a human figure. When the icon is activated
          and a flower is placed in the niche, the icon grants the bearer a +1
          luck bonus to Armor Class for 1 hour, but only against ranged attacks.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 25
      subType: gear
    type: loot
  - _id: ZSRExx0XG8tInhyk
    _key: '!actors.items!e6kN1rNIhFaZykRh.ZSRExx0XG8tInhyk'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/helm-bucket-grey.webp
    name: Drowner's helm
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          14</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          metal helmet sports an open top and a tightly sealed collar that
          closes securely around the neck. Water is poured into the open top,
          filling the helmet and forcing you to hold your breath. A safety lever
          allows you to release the water at any time. Training with the
          drowner's helm requires 1 hour of practice and a DC 15 Constitution
          check. If you succeed at the check, you treat your Constitution score
          as 5 higher when determining how long you can hold your breath. This
          bonus lasts for 24 hours.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 35
      subType: gear
      weight:
        value: 10
    type: loot
  - _id: DXCCFgNqNdnhP6JG
    _key: '!actors.items!e6kN1rNIhFaZykRh.DXCCFgNqNdnhP6JG'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/spectacles-glasses.webp
    name: Eyeglasses
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Also
          known as spectacles, eyeglasses compensate for poor vision or magnify
          small details.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 5
      subType: gear
    type: loot
  - _id: tOWvkQFYZWlGnDDu
    _key: '!actors.items!e6kN1rNIhFaZykRh.tOWvkQFYZWlGnDDu'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/treasure/doll-voodoo.webp
    name: Fetish, tribal
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Goblins of Golarion pg.
          12</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Tribal
          fetishes vary from tribe to tribe, but are generally small, carved
          wooden or stone religious symbols, luck tokens, or curious naturally
          occurring objects specially carved to resemble something of
          significance (such as an acorn with a wolf fangs, a dried mushroom
          with skull-shaped blotches, or a stone with a lizard carved on it). A
          goblin divine spellcaster can use a tribal fetish as a divine focus
          for spellcasting.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 5
      subType: gear
    type: loot
  - _id: 3x1MjeSZhv9ktpy6
    _key: '!actors.items!e6kN1rNIhFaZykRh.3x1MjeSZhv9ktpy6'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-orange.webp
    name: Fire carrier
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Goblins of Golarion pg.
          12</p><p><strong>Price</strong> 1 sp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Tools</p><h2>Description</h2>A
          fire carrier is a conical device made of thickly insulated leather and
          wood designed to carry a live coal under a layer of ash. A fire
          carrier can keep a coal red hot for 24 hours and allows anyone to
          light a fire in normal conditions without having to resort to Survival
          checks, alchemical devices, or magic.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 0.1
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: Eggt9jmdq51mrD2p
    _key: '!actors.items!e6kN1rNIhFaZykRh.Eggt9jmdq51mrD2p'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/fishing/bobber-round-green.webp
    name: Flotation device
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong> 2
          lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>Usually composed of an inflated animal
          bladder sealed with pitch, a held flotation device adds a +1
          circumstance bonus on Swim checks.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 1
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: Xrgww7iGh57nGAxh
    _key: '!actors.items!e6kN1rNIhFaZykRh.Xrgww7iGh57nGAxh'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-worn-red.webp
    name: Footprint book
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Advanced Player's Guide pg. 184</p><p><strong>Price</strong> 50
          gp; <strong>Weight</strong> 3 lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>This 50-page tome contains accurate
          drawings of common animal, humanoid, and monster tracks, as well as
          notes on stride length, tread depth, and similarly useful information.
          The book gives you a +2 circumstance bonus to identify a creature by
          its tracks, though the use of shoes makes identifying many humanoids
          difficult or impossible. Though the book can't help you identify
          unique individuals, it can help you tell an ogre's footprint from a
          troll's footprint, or an elf's track from an orc's. Books sold in
          different areas may have different footprints, depending on what
          creatures are common to that location.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: dVNuto6WdIsQCerB
    _key: '!actors.items!e6kN1rNIhFaZykRh.dVNuto6WdIsQCerB'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/smithing/crucible.webp
    name: Footprint cast
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          204</p><p><strong>Price</strong> 2 gp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          quick-drying cast is perfect for preserving a set of footprints in
          order to examine them later. By spending 1 minute setting the cast and
          waiting for it to dry, you can copy footprints, allowing others to
          examine them without traveling to the scene, and preventing the DC of
          the Survival check to analyze them from increasing because of time or
          weather.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 2
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: cendBD6hUwBUvDS0
    _key: '!actors.items!e6kN1rNIhFaZykRh.cendBD6hUwBUvDS0'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/vials-blue-pink.webp
    name: Forecast station
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Wild pg.
          9</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          wooden box contains a simple anemometer and three tubes filled with
          alchemical fluids that expand and contract with changes in air
          temperature, humidity, and pressure. A forecast station grants a +5
          bonus on Survival checks to predict weather.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 150
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: o7L8UTpQ8zuhBn3x
    _key: '!actors.items!e6kN1rNIhFaZykRh.o7L8UTpQ8zuhBn3x'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-symbol-potion-blue.webp
    name: Formula book
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          77</p><p><strong>Category</strong> Tools</p><h2>Description</h2>A
          formula book has 100 pages of parchment, and each alchemical extract
          formula takes up one page per extract level. A newly purchased formula
          book contains no extract formulas. An alchemist character begins play
          with a formula book containing the extract formulae he knows
          (<em>Advanced Player's Guide </em>32). This is the alchemist
          equivalent of a spellbook for wizards (a spellbook and a formula book
          are essentially the same item).
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 15
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: vnCYXriy17xbz2iz
    _key: '!actors.items!e6kN1rNIhFaZykRh.vnCYXriy17xbz2iz'
    _stats:
      coreVersion: '12.331'
    img: icons/environment/traps/cage-wooden-yellow.webp
    name: Fortune-teller's deck
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ranged Tactics Toolbox pg.
          20</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong> 2
          lbs.</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          tough wickerwork cylinder is typically 3 feet tall and 2 feet wide. It
          has no top or bottom, and can be filled with about 10 cubic feet of
          earth, stone, or other heavy materials while standing upright to
          provide substantial cover. Filling a gabion with earth using a shovel
          generally requires 4 minutes of work for a Medium character or 8
          minutes of work for a Small character. One gabion provides cover for a
          Small character and might provide partial cover for a Medium
          character, at the GM's discretion. Two gabions together can provide
          cover to a Medium character, although if they aren't stacked atop each
          other, they can form only a low obstacle depending on the character's
          height.</p><p>Gabions can be made of different materials, but the type
          described here is one of the most common
          varieties.</p><p><strong>Craft (traps) DC</strong> 10
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 1
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: RFJBXyVSNRkjUBFF
    _key: '!actors.items!e6kN1rNIhFaZykRh.RFJBXyVSNRkjUBFF'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Grappler's grease
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          204</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong> 1/2
          lb.</p><p><strong>Category</strong> Tools</p><h2>Description</h2>When
          applied to your body, this pale grease made from animal fat makes you
          more difficult to grapple. While covered in the grease, you gain a +4
          bonus to CMD against grapple combat maneuvers. Applying the grease
          takes 1 minute, and once applied, its effects last for 10 minutes. You
          can't be wearing armor to gain the benefit of grappler's grease.
          Grappler's grease is usually sold in small clay jars that hold five
          applications.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 5
      subType: gear
      weight:
        value: 0.5
    type: loot
  - _id: qsuiKhIDovnqMFQI
    _key: '!actors.items!e6kN1rNIhFaZykRh.qsuiKhIDovnqMFQI'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Hallowed chalice
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          24</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Any</p><h2>Description</h2>Before it
          is used, this elegant drinking vessel must be filled with water, wine,
          or another ceremonial liquid appropriate to the faith. Activating the
          chalice charges the liquid with channeled energy; any member of the
          faith who drinks the entire contents of the chalice (as if drinking a
          potion) recovers hit points or takes damage as if the cleric had used
          her channel energy on him (including all feats and abilities that
          affect the DC and damage). The liquid in the chalice remains charged
          until consumed, spilled, or 24 hours pass; some chalices include a
          cover to prevent spillage.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 200
      subType: gear
    type: loot
  - _id: ICbKHyMq0RfzSIlY
    _key: '!actors.items!e6kN1rNIhFaZykRh.ICbKHyMq0RfzSIlY'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/metal/clasp-steel.webp
    name: Halteres
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Martial Arts Handbook pg.
          30</p><p><strong>Price</strong> 8 gp; <strong>Weight</strong> 24
          lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>These paired stone or metal weights look
          like a pair of curved stones with handles. An athlete can take one
          weight in each hand and swing them back and forth before jumping,
          using the momentum to gain greater distance when taking off. Training
          with halteres requires 1 hour of practice and a DC 16 Acrobatics
          check. If you succeed at the check, you gain a +2 circumstance bonus
          on Acrobatics checks to make long jumps. This bonus lasts for 24 hours
          or until you fail an Acrobatics check.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 8
      subType: gear
      weight:
        value: 24
    type: loot
  - _id: ZM6dUOISjFMnxK75
    _key: '!actors.items!e6kN1rNIhFaZykRh.ZM6dUOISjFMnxK75'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/mortar-empty-grey.webp
    name: Hand rotary quern
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          204</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          pair of small grindstones allows a user to grind a number of
          substances into a fine powder. The amount of powder the quern produces
          varies depending on the substance, but you can grind 8 pounds of flour
          in an hour.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 10
      subType: gear
      weight:
        value: 20
    type: loot
  - _id: meFSZQC8jbLGQc7T
    _key: '!actors.items!e6kN1rNIhFaZykRh.meFSZQC8jbLGQc7T'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/leather/leather-buckle-clip-steel.webp
    name: Handle harness
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Melee Tactics Toolbox pg.
          20</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          wood-and-leather harness fits over clothing or armor and provides
          small handles and footrests across your back and along the sides of
          your legs and arms. While wearing a handle harness, you automatically
          succeed at checks to aid an adjacent ally of your size or smaller with
          Climb or Ride checks, or Acrobatics checks to balance on narrow
          surfaces or uneven ground. A handle harness's ungainly construction
          gives you a -2 penalty on Escape Artist checks.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 25
      subType: gear
      weight:
        value: 10
    type: loot
  - _id: 9DtylEBnDVVAP0Ck
    _key: '!actors.items!e6kN1rNIhFaZykRh.9DtylEBnDVVAP0Ck'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/leather/leather-patch-brown.webp
    name: Hanging board
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          14</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          wooden board bears a number of narrow, thin holes large enough to hold
          by the fingertips. The board mounts to a wall, allowing climbers to
          practice their technique and improve their grip by hanging from the
          board. Using a hanging board to improve your grip requires 1 hour of
          practice and a DC 18 Climb check. If you succeed at the check, you
          gain a +10 circumstance bonus on Climb checks to catch yourself while
          falling and a +5 bonus to catch a falling character while climbing.
          This bonus lasts for 24 hours.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 75
      subType: gear
      weight:
        value: 7
    type: loot
  - _id: eqD4AF0IzxPZl3bE
    _key: '!actors.items!e6kN1rNIhFaZykRh.eqD4AF0IzxPZl3bE'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/holly-buds-red.webp
    name: Heratic's fork
    system:
      description:
        value: >-
          <p><strong>Source</strong>: PRPG Core Rulebook pg.
          158</p><p><strong>Price</strong> 0 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Druids
          commonly use these plants as divine focuses when casting spells.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      subType: gear
    type: loot
  - _id: cGiWndUrPgdGP6J3
    _key: '!actors.items!e6kN1rNIhFaZykRh.cGiWndUrPgdGP6J3'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/lens-blue.webp
    name: Hunter's sight
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          204</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          complicated lens fits over one eye and takes up the eyes slot when in
          use. When using it in conjunction with a ranged weapon, you reduce any
          range penalty on your attacks by 2. Objects within 100 feet become
          difficult to see, however, and you take a -2 penalty on Perception
          checks based on sight while wearing the hunter's sight.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 100
      subType: gear
    type: loot
  - _id: 3N54DisgcZXXGHjb
    _key: '!actors.items!e6kN1rNIhFaZykRh.3N54DisgcZXXGHjb'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Instrument of the divine
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          25</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Any</p><h2>Description</h2>This
          masterwork musical instrument may be of any type (lyre, harp, drum,
          and so on). As a focus, it transforms faith into powerful music. Once
          activated, a member of the cleric's faith can draw upon the power in
          the instrument to add a sacred (if positive energy) or profane (if
          negative energy) bonus on his next Perform check; this bonus is equal
          to the number of dice of the cleric's channel energy ability. The
          bonus persists for the entirety of the performance.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 200
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: rwtqqEvDlrSpnAUa
    _key: '!actors.items!e6kN1rNIhFaZykRh.rwtqqEvDlrSpnAUa'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Iron eye
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Faiths of Balance pg.
          25</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Gorum</p><h2>Description</h2>This
          simple iron amulet is in the shape of an eye within a helm. It must be
          worn in plain sight to have any effect. When activated, an iron eye
          allows its wielder to expend its power to gain a sacred (if activated
          with positive energy) or profane (if activated with negative energy)
          bonus on her next Intimidate check. This bonus is equal to the number
          of dice of the activating cleric's channel energy ability. The amulet
          remains charged until its magic is used or 1 hour passes.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 50
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: m5uaOdewIVKhYA1C
    _key: '!actors.items!e6kN1rNIhFaZykRh.m5uaOdewIVKhYA1C'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Iron maiden
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Faiths of Balance pg.
          25</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Abadar</p><h2>Description</h2>This
          set of small gold-plated scales is inscribed with words from Abadar's
          holy text. When activated, its presence aids in negotiations, making
          attempts to change the attitude of another person by one step a swift
          action instead of requiring 1 minute. The user must touch the scales
          and speak to the intended target as part of the skill check. The item
          remains activated for 1 hour, or until it has been used to influence a
          number of creatures equal to 1/2 the effective cleric level of the
          person who activated it.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 50
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: KDyE4pZ1u1wDCIPE
    _key: '!actors.items!e6kN1rNIhFaZykRh.KDyE4pZ1u1wDCIPE'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Alchemy crafting
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Blood of the Moon pg.
          30</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          leather pouch contains dyes, odorous balsams, colorchanging eye drops,
          reversible collars, and a host of other tools to disguise one animal
          as another. The kit grants a +4 circumstance bonus on Disguise checks
          to disguise an animal as another specific animal of the same species,
          and a +2 circumstance bonus on Disguise checks to disguise an animal
          as an animal of a different species. An animal disguise kit is
          exhausted after 10 uses.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 100
      subType: gear
      weight:
        value: 8
    type: loot
  - _id: ru5SaYZ7NVFkOSdD
    _key: '!actors.items!e6kN1rNIhFaZykRh.ru5SaYZ7NVFkOSdD'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Antidote
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          77</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          small box contains a wide variety of remedies and treatments against
          not only specific poisons but also their most common methods of
          delivery, including such things as purgatives to eliminate ingested
          toxins. It grants a +3 circumstance bonus on Heal checks made to treat
          poison. An antidote kit is exhausted after 10 uses.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 100
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: khroLB6JuE9h13OL
    _key: '!actors.items!e6kN1rNIhFaZykRh.khroLB6JuE9h13OL'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Climber's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>, <em>PRPG
          Core Rulebook pg. 158</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>These crampons, pitons, ropes, and other
          tools give you a +2 circumstance bonus on Climb checks.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 80
      subType: gear
      weight:
        value: 5
    type: loot
  - _id: 7XeIG7akVGBt3M4z
    _key: '!actors.items!e6kN1rNIhFaZykRh.7XeIG7akVGBt3M4z'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Disguise
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>, <em>PRPG
          Core Rulebook pg. 158</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>This kit contains tools like makeup and
          fake facial hair, and provides a +2 circumstance bonus on Disguise
          checks. A disguise kit is exhausted after 10 uses.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 8
    type: loot
  - _id: F03yMDYEIRmFYYnK
    _key: '!actors.items!e6kN1rNIhFaZykRh.F03yMDYEIRmFYYnK'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Dragoncrafting
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          77</p><p><strong>Category</strong> Tools</p><h2>Description</h2>These
          inks, pens, papers, templates for certificates, and tools for
          modifying or copying official seals facilitates the creation of
          counterfeit documents. It grants a +2 circumstance bonus on Linguistic
          checks made for the purpose of making forgeries.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 200
      subType: gear
      weight:
        value: 6
    type: loot
  - _id: NB60tqkqgydII5TS
    _key: '!actors.items!e6kN1rNIhFaZykRh.NB60tqkqgydII5TS'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Half-orc disguise
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          56</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          specifically designed kit was put together by half-orcs to help them
          appear more human. It includes skin cream to disguise green-gray skin
          color and other items designed to conceal or draw attention away from
          typical half-orc physical characteristics. Using this kit on a
          half-orc grants a +3 bonus on Disguise checks to appear human. Used on
          an orc, it only grants a +1 bonus on these checks. A half-orc disguise
          kit is exhausted after 10 uses.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 75
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: fn6PXtWtAHEK2T2b
    _key: '!actors.items!e6kN1rNIhFaZykRh.fn6PXtWtAHEK2T2b'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Healer's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>, <em>PRPG
          Core Rulebook pg. 158</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>This collection of bandages and herbs
          provides a +2 circumstance bonus on Heal checks. A healer's kit is
          exhausted after 10 uses.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: SvRAjKHujDmp4qrM
    _key: '!actors.items!e6kN1rNIhFaZykRh.SvRAjKHujDmp4qrM'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Juggler's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>This kit includes multiple sets of
          well-balanced objects, such as balls, clubs, knives, rings, and
          torches. It provides a +1 bonus on Perform (act or comedy) checks and
          checks involving juggling.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 15
      subType: gear
      weight:
        value: 10
    type: loot
  - _id: wYDxqeWyOfb5tMor
    _key: '!actors.items!e6kN1rNIhFaZykRh.wYDxqeWyOfb5tMor'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Leeching
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Advanced Player's Guide pg. 184</p><p><strong>Price</strong> 5 gp;
          <strong>Weight</strong> 5 lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>This sturdy ceramic jar has a heavy lid
          with a few tiny holes to let air in. It is normally half-filled with
          water and contains four adult leeches, each about 6 inches long. A
          leeching kit grants you a +2 circumstance bonus on Heal checks to
          treat poison. Used for medicinal bloodletting, a leech can survive for
          6 months between feedings.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 5
      subType: gear
      weight:
        value: 5
    type: loot
  - _id: 4ALScMcasxk4eD6S
    _key: '!actors.items!e6kN1rNIhFaZykRh.4ALScMcasxk4eD6S'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Mending
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          77</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          kit is used by midwives to care for pregnant women and to deliver
          babies. Each kit contains herbs to treat common conditions during
          pregnancy, salves for aches and distended skin, swaddling cloths, a
          small but sharp knife for cutting an umbilical cord, powder for
          cleaning the newborn, bandages, a needle, and thread. Using the kit
          gives you a +4 circumstance bonus on Heal checks when dealing with
          humanoid pregnancy or birth. You may use it for other kinds pregnant
          or birthing creatures (such as animals or monstrous humanoids), but it
          only gives a +2 bonus on such Heal checks. A midwife's kit is
          exhausted after 10 uses.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 10
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: yNfArsO8sw3YbZs0
    _key: '!actors.items!e6kN1rNIhFaZykRh.yNfArsO8sw3YbZs0'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Statue disguise
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Streets pg.
          13</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          disguise kit includes metallic or stone-colored makeup and cloth that
          you can apply to appear to be a statue; it grants a +2 bonus only on
          Disguise checks to resemble metal, stone, or similar materials. You
          take a -5 penalty on Disguise checks when impersonating an inanimate
          object. A viewer can attempt a single Perception check opposed by your
          Disguise check upon viewing you, and an additional check each time a
          creature interacts with you. This kit is exhausted after 10 uses.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 8
    type: loot
  - _id: VMZp5HNW0cQoR0JV
    _key: '!actors.items!e6kN1rNIhFaZykRh.VMZp5HNW0cQoR0JV'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Symptom
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Advanced Player's Guide pg. 185</p><p><strong>Price</strong> 25
          gp; <strong>Weight</strong> 5 lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>This small wooden box has many tiny
          compartments filled with items useful if you want to feign a sickness,
          as well as a handy reference book outlining common indicators for some
          of the more feared virulent diseases. The kit includes such things as
          false pustules, pills that cause the person chewing them to foam at
          the mouth, and herbal concoctions designed to induce fevers or
          vomiting. Using a symptom kit grants you a +5 circumstances bonus on
          Disguise checks made for the purpose of simulating illness. A symptom
          kit is exhausted after 10 uses.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 25
      subType: gear
      weight:
        value: 5
    type: loot
  - _id: M4uAQK5QQOwaFYZL
    _key: '!actors.items!e6kN1rNIhFaZykRh.M4uAQK5QQOwaFYZL'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Veterinarian's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          77</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          item is the equivalent of a healer's kit, except its materials are
          especially suitable for treating common animals (cats, dogs, goats,
          oxen, sheep, and so on). It provides a +3 circumstance bonus on Heal
          checks to treat animals, but only a +1 circumstance bonus on Heal
          checks on other creatures. A veterinarian's kit is exhausted after 10
          uses.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 25
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: IhaOFiehHA5M9ONr
    _key: '!actors.items!e6kN1rNIhFaZykRh.IhaOFiehHA5M9ONr'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/vials-blue-pink.webp
    name: Lab, Alchemist's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>, <em>PRPG
          Core Rulebook pg. 158</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>This lab is used for making alchemical
          items, and provides a +2 circumstance bonus on Craft (alchemy) checks.
          It has no bearing on the costs related to the Craft (alchemy) skill.
          Without this lab, a character with the Craft (alchemy) skill is
          assumed to have enough tools to use the skill but not enough to get
          the +2 bonus that the lab provides.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 200
      subType: gear
      weight:
        value: 40
    type: loot
  - _id: cibdSnVNeUybNcmz
    _key: '!actors.items!e6kN1rNIhFaZykRh.cibdSnVNeUybNcmz'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/vials-blue-pink.webp
    name: Lab, Alchemist's (portable)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Adventurer's Armory pg. 19</em>, <em>Advanced Player's Guide pg.
          184</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          compact version of a fullsized alchemist's lab provides a +1
          circumstance bonus on Craft (alchemy) checks.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 75
      subType: gear
      weight:
        value: 20
    type: loot
  - _id: W6lyXoY9s4p81jit
    _key: '!actors.items!e6kN1rNIhFaZykRh.W6lyXoY9s4p81jit'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/vials-blue-pink.webp
    name: Lab, Artificer's (portable)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          27</p><p><strong>Category</strong> Tools</p><h2>Description</h2>The
          portable artificer's lab contains everything needed to create magic
          items, though many of the tools and implements are of only the most
          basic type. This lab allows the artificer to spend 4 hours crafting
          each night while out adventuring, and net 3 hours' worth of work
          (instead of 2). However, because the tools are all designed to fulfill
          multiple functions and the portable lab lacks the space and quiet that
          provide ideal circumstances for creating magic items, the skill check
          to complete a magic item that had any of its work done using a
          portable lab takes a -5 penalty.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 300
      subType: gear
      weight:
        value: 40
    type: loot
  - _id: G2pwNrUUj0m5mQ6r
    _key: '!actors.items!e6kN1rNIhFaZykRh.G2pwNrUUj0m5mQ6r'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/tech/transmission.webp
    name: Leg stabilizers (pair)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the Stars pg.
          19</p><p><strong>Category</strong> Tools</p><h2>Description</h2>These
          devices strap onto a character's legs in order to allow for easier
          movement in low- or high-gravity environments. A character wearing leg
          stabilizers can move and attempt Acrobatics checks in gravity between
          ×1 and ×3 as if in gravity ×1. A character wearing them in gravity
          stronger than ×1/3 but weaker than ×1 gains a +10-foot circumstance
          bonus to his land speed. This device has no effect on other actions.
          Attaching or removing leg stabilizers is a full-round action.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 1000
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: EBmyitmxIomBfZbI
    _key: '!actors.items!e6kN1rNIhFaZykRh.EBmyitmxIomBfZbI'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Linguist's codex
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          25</p><p><strong>Price</strong> +50 gp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Any</p><h2>Description</h2>This
          sturdy lock may be of any quality; the cost of making it a channel
          focus is in addition to the normal lock cost. When activated, the
          lock's Disable Device DC and the break DC for whatever it is locking
          (such as a door or chest) increase by 5; the lock gains +2 hardness
          and +4 hit points. The lock retains these bonuses for 24 hours or
          until it is forced open (including picking the lock).
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 50
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: qRZzunayTh3ypHts
    _key: '!actors.items!e6kN1rNIhFaZykRh.qRZzunayTh3ypHts'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/tech/metal-claws.webp
    name: Marlinspike
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          204</p><p><strong>Price</strong> 8 sp; <strong>Weight</strong> 1/2
          lb.</p><p><strong>Category</strong> Tools</p><h2>Description</h2>These
          polished metal spikes can aid you in performing a variety of rope
          work, including tying and untying knots, untangling things, splicing
          rope, or tensioning ropes. A typical spike is somewhere between 6
          inches to a foot in length, has a slender and almost needle-like
          taper, and is blunted at both ends. Smaller spikes are worn on
          lanyards while a larger spike is kept in a sheath. A marlinspike
          grants you a +2 circumstance bonus on Skill checks involving the use
          of a rope.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 0.8
      subType: gear
      weight:
        value: 0.5
    type: loot
  - _id: U7SHh1G4b0f1dBi4
    _key: '!actors.items!e6kN1rNIhFaZykRh.U7SHh1G4b0f1dBi4'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/biological/tongue-violet.webp
    name: Masterwork flippers
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Aquatic Adventures pg.
          56</p><p><strong>Category</strong> Tools</p><h2>Description</h2>These
          sleek and aquadynamic flippers grant their wearer a +2 circumstance
          bonus on Swim checks to perform complex maneuvers underwater or swim
          through rough waters. This bonus doesn't stack with racial bonuses on
          Swim checks from having a swim speed.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: 9XSEGePalaRvD5sr
    _key: '!actors.items!e6kN1rNIhFaZykRh.9XSEGePalaRvD5sr'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/smithing/hammer-sledge-steel-grey.webp
    name: Masterwork tool
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>, <em>PRPG
          Core Rulebook pg. 158</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>This tool is perfect for its intended
          job. It grants a +2 circumstance bonus on a related skill check (if
          any). The bonuses provided by multiple masterwork items do not
          stack.</p><p> Several common items already count as masterwork tools
          for particular skills. These are the alchemist's lab, climber's kit,
          disguise kit, healer's kit, masterwork musical instrument, and
          masterwork thieves' tools. Therefore, there is no masterwork climber's
          kit, masterwork healer's kit, and so on-those items are already the
          best available for general checks with the relevant skill.</p><p>Some
          skills have no appropriate tool or masterwork tool- no nonmagical item
          exists that grants a bonus for all uses of that skill. For example,
          just because a certain perfume is favored by local nobles (granting a
          +2 circumstance bonus on Diplomacy checks to influence them) doesn't
          mean that perfume has the same effect on a member of the thieves'
          guild, a foreign berserker, or a medusa. Likewise, just because a fake
          beard woven by dwarves out of the beards of famous dwarves may grant a
          +2 circumstance bonus on Use Magic Device checks to emulate the
          dwarven race doesn't mean the beard has any effect on using that skill
          to activate elven items or paladin items, or to decipher a written
          spell.</p><p>Individual GMs may want to allow masterwork tools for
          other skills at the listed cost. The circumstance bonus for such a
          tool should never be more than +2. The tool should either have a
          limited number of uses (such as the disguise and healer's kits) or
          only apply to certain aspects of the skill (such as the balancing
          pole's bonus on Acrobatics checks to traverse a narrow surface or the
          magnifying glass's bonus on Appraise checks for detailed items).
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: VslTEZuaF85Qmx09
    _key: '!actors.items!e6kN1rNIhFaZykRh.VslTEZuaF85Qmx09'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Meditation crystal
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          25</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Any</p><h2>Description</h2>Though
          this focus is usually a hand-sized crystal, the exact form (such as a
          wooden idol, an iron disk, and so on) may vary for some religions. A
          monk or paladin of the cleric's faith may concentrate upon an
          activated meditation crystal, taking no actions for 1 minute, and
          regain 1 ki point or one use of lay on hands. Once activated, the
          crystal retains its energy until a monk or paladin uses it for this
          purpose or 24 hours pass.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 100
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: GfzkUid3WslZvV2x
    _key: '!actors.items!e6kN1rNIhFaZykRh.GfzkUid3WslZvV2x'
    _stats:
      coreVersion: '12.331'
    img: icons/weapons/clubs/club-baton-studded.webp
    name: Meels
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Martial Arts Handbook pg.
          31</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Also
          called Vudrani clubs, meels are heavily weighted clubs used to train
          one's strength. They range in size from only a few pounds to specially
          crafted lead or stone meels which weigh as much as a human. This set
          contains three wooden meels of more common dimensions. Athletes
          practice with meels by taking a club in each hand and swinging them in
          a rhythmic fashion around the body. Training with a set of meels
          requires 1 hour of practice and a DC 10 Strength check. If you succeed
          at the check, you gain a +2 circumstance bonus on Strength checks and
          treat your Strength score as 1 higher for the purpose of determining
          your carrying capacity. This bonus lasts for 24 hours.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 10
      subType: gear
      weight:
        value: 30
    type: loot
  - _id: rj8vGXnqK5cQG9y8
    _key: '!actors.items!e6kN1rNIhFaZykRh.rj8vGXnqK5cQG9y8'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/hand/scale-balances-merchant-brown.webp
    name: Merchant's scale
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>, <em>PRPG
          Core Rulebook pg. 158</p><p><strong>Price</strong> 2 gp;
          <strong>Weight</strong> 1 lb.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>A merchant's scale is a simple lever on a
          fulcrum, from which two trays hang. It grants a +2 circumstance bonus
          on Appraise checks involving items that are valued by weight,
          including anything made of precious metals.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 2
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: H8LAYEIpqDkmr9vS
    _key: '!actors.items!e6kN1rNIhFaZykRh.H8LAYEIpqDkmr9vS'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/inventory/piggybank.jpg
    name: Monster dummy
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Monster Hunter's Handbook pg.
          26</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          is a straw-stuffed wire frame of a monstrous creature, wrapped in
          burlap and coated in the musk of that particular creature. When using
          the Handle Animal skill to teach the attack trick, having a monster
          dummy present allows the trainer to add whatever creature type the
          dummy represents to the list of creatures the animal will attack. The
          dummy also provides a +2 bonus on Handle Animal checks to teach
          animals to attack all kinds of creatures.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 10
      subType: gear
      weight:
        value: 40
    type: loot
  - _id: BDk9yjXcuFwkHCq5
    _key: '!actors.items!e6kN1rNIhFaZykRh.BDk9yjXcuFwkHCq5'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/leather/leather-buckle-steel-tan.webp
    name: Musical instrument
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          244</p><p><strong>Category</strong> Tools</p><h2>Description</h2>A
          nature climbing harness is a series of buckles, straps, and trusses
          that can be worn over clothing or light armor. As a standard action,
          you can secure yourself in place on a vertical surface so that both
          your hands are free. You can remain in this position without needing
          to attempt additional Climb checks, and you don't lose your Dexterity
          bonus to your AC as long as you remain anchored. As long as you are
          anchored in this way, you cannot move, but you gain a +5 circumstance
          bonus on Climb checks to avoid falling whenever you take damage. You
          can release yourself to start moving again as a move action.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 60
      subType: gear
      weight:
        value: 4
    type: loot
  - _id: 7ARQKhvRQkIYcLE0
    _key: '!actors.items!e6kN1rNIhFaZykRh.7ARQKhvRQkIYcLE0'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-open-red.webp
    name: Obsession log
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          37</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Gnomes
          use these small books to record information about their obsessions.
          When a gnome consults her obsession log (taking 1 minute), she gains a
          +2 circumstance bonus on the next Craft or Profession check she makes,
          as long as that skill was the one chosen for her obsessive racial
          trait.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 25
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: Srw7l80sqWNuTmXm
    _key: '!actors.items!e6kN1rNIhFaZykRh.Srw7l80sqWNuTmXm'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-face-black.webp
    name: Occult reference material
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Occult Adventures pg.
          249</p><p><strong>Category</strong> Tools</p><h2>Description</h2>These
          books come in all manner of shapes and sizes, from hardbound,
          illustrated manuscripts to collections of journals, notes, and scrolls
          from multiple authors. When used as a reference (an action that
          typically requires 1d4 minutes of searching the text), occult
          reference material grants a +2 circumstance bonus on Knowledge checks
          related to the occult topic covered by that manual. Some common topics
          for occult reference materials include astral projection, auras,
          dreams, ley lines, medium spirits, and rituals. Occult reference
          materials devoted to general subjects-such as spirits as a
          whole-provide an overview but don't give enough detail to grant a
          skill bonus.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 80
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: eyM4gDqmItoYTLII
    _key: '!actors.items!e6kN1rNIhFaZykRh.eyM4gDqmItoYTLII'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-face-black.webp
    name: Occultist's implement
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Occult Adventures pg.
          249</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          bauble, bit of clothing, or relic has some minor historical
          significance. Though not especially valuable, it's useful to an
          occultist, who can use it as an implement. Any such item is
          nonmagical, even if it appears to be a rod or wand. Implements that
          already have a mundane version with a price higher than 10 gp (such as
          armor, shields, weapons, and harrow decks) use their normal item
          entries instead of this catchall.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 10
      subType: gear
      weight:
        value: 0.5
    type: loot
  - _id: NArL2sYjIsuPbXKR
    _key: '!actors.items!e6kN1rNIhFaZykRh.NArL2sYjIsuPbXKR'
    _stats:
      coreVersion: '12.331'
    img: icons/weapons/maces/mace-spiked-skull.webp
    name: Orrery
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          6</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Pain
          wheels are used by orc marauders to blight the lands of their foes and
          despoil the earth for generations to come. When you whirl this cruel
          weapon above your head as a standard action, it scatters salt in a
          5-foot radius centered on your space. Creatures in the affected area
          (including you) that have fewer than their maximum number of hit
          points must succeed at a DC 11 Fortitude save or be sickened by pain
          for 1d6 rounds. Creatures affected by bleed effects take a -5 penalty
          on their saves. A successful DC 11 Heal check ends the sickened
          condition, as does the application of any effect that heals hit point
          damage. A pain wheel must be loaded with a pound of salt (a move
          action) before it can be used. You can also load a dose of itching
          powder (<em>Pathfinder RPG Ultimate Equipment </em>108) or another
          alchemical powder normally used as a splash weapons into a pain wheel;
          when a pain wheel is used this way, the affected area (including your
          square) is treated as the splash radius for the purpose of determining
          the powder's effects, and there is no way to deal a direct hit with
          the powder.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 0.5
    type: loot
  - _id: hyTuMD5QlZGpT2Ba
    _key: '!actors.items!e6kN1rNIhFaZykRh.hyTuMD5QlZGpT2Ba'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/boots-collared-rounded-brown.webp
    name: Palm paws
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Blood of the Moon pg.
          30</p><p><strong>Category</strong> Tools</p><h2>Description</h2>These
          pouchlike boots come in sets of four, and can be placed on an animal's
          paws and fastened with a drawstring. The soles are sewn with treated
          leather shaped like human footprints that allow the wearer to leave
          human tracks. A successful DC 20 Survival or Knowledge (nature) check
          allows an individual to recognize the tracks as fake but gives no clue
          as to the identity of the real perpetrator.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 80
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: 5bQnzDnngwYTNuAm
    _key: '!actors.items!e6kN1rNIhFaZykRh.5bQnzDnngwYTNuAm'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-thick-orange.webp
    name: Parasol
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Goblins of Golarion pg.
          12</p><p><strong>Price</strong> 1 sp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Maybe
          it's the wide heads, but more likely it's the lack of common sense
          that causes goblins to so often get stuck in narrow spaces. In such
          cases, a dose of pig grease is really helpful. An application of pig
          grease applied to the body grants a +2 circumstance bonus on all
          Escape Artist checks for 1 hour.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 0.1
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: A1ybFozbqiZrsxTa
    _key: '!actors.items!e6kN1rNIhFaZykRh.A1ybFozbqiZrsxTa'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-symbol-lightning-silver-blue.webp
    name: Pnakotic record
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder #112: The Whisper Out of Time
          pg. 73</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>These strange books are fashioned from a
          metallic alloy, the crafting of which is known only to yithians and a
          very few others. Supposedly taken from the same collection as the
          fabled <em>Pnakotic Manuscripts</em> and traded throughout the
          multiverse, these books are collections of notes recorded by visitors
          to the yithians' cities. Each book is written in multiple languages
          and provides a vast array of information on a specifc topic, but the
          information it contains is often oddly specifc and lacks context. A
          single Pnakotic record focuses on a single subject within the confnes
          of a single Knowledge skill, such as a presentation on the nature of
          deep one religious practices in worshiping Cthulhu (Knowledge
          [religion]), the mechanics of a shoggoth's biology (Knowledge
          [dungeoneering]), or the methods of creating portals between worlds
          (Knowledge [arcana]). By studying a Pnakotic record for 8 hours, a
          reader can attempt a single Knowledge check of the appropriate type
          when researching the book's corresponding subject to gain a +10
          circumstance bonus on the check.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 2000
      subType: gear
      weight:
        value: 10
    type: loot
  - _id: WIpiFjjdPvnrydCI
    _key: '!actors.items!e6kN1rNIhFaZykRh.WIpiFjjdPvnrydCI'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/tech/metal-insert.webp
    name: Poison belcher
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          6</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Loading
          this long bronze tube with a dose of ingested poison and 10 gp worth
          of gold dust is a standard action. When you blow on a poison belcher
          like a blowgun, it sprays the poison out the other end. The poison
          belcher is a simple weapon that strikes as a ranged touch attack with
          a range increment of 10 feet and a maximum range of 30 feet. If hit,
          the target must save against the poison as if it had been ingested.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 0.5
    type: loot
  - _id: E6o9rMAWoD7RFVzc
    _key: '!actors.items!e6kN1rNIhFaZykRh.E6o9rMAWoD7RFVzc'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/neck/amulet-round-faceted-green.webp
    name: Poison sponge
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          29</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          heart-shaped locket is attached to a thin metal chain made of looped
          strands of gold or silver. Inside the locket is a small, spring-loaded
          vial that can hold a single dose of powdered poison. Loading the
          locket with poison carries the same risks as applying poison to a
          weapon. When the locket is opened, the vial is shattered by a ball
          bearing, releasing the powder into the air and treating the poison's
          type as if it were inhaled. The airborne poison affects all creatures
          within 10 feet of the locket.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 75
      subType: gear
    type: loot
  - _id: u9eb92u690D0nJUC
    _key: '!actors.items!e6kN1rNIhFaZykRh.u9eb92u690D0nJUC'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/ink-quill-pink.webp
    name: Poisoned quill
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          29</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          long pen is made from a delicate feather and has a thin and unusually
          long nib. The quill is typically white in color, though variations
          that are crimson, onyx, or some combination of these colors also
          exist. A hidden compartment inside the nib allows the quill to hold a
          single dose of poison that is dispensable with a small squeeze.
          Additionally, this provides a +2 circumstance bonus on Sleight of Hand
          checks to conceal poisons inside the quill. If this quill is used with
          vector ink, it increases the DC of a poison mixed with the ink by 1.
          This quill can be used as a small shiv to deal 1d3 points of damage
          and deliver its contained poison. However, because of the fragility of
          the nib, using the quill in this way destroys it.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 30
      subType: gear
    type: loot
  - _id: YTyn99EGjrEVCXW4
    _key: '!actors.items!e6kN1rNIhFaZykRh.YTyn99EGjrEVCXW4'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/kitchenware/goblet-jeweled-green-brown.webp
    name: Poisoner's goblet
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          29</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          is an elegantly styled, gem-encrusted drinking chalice made of smooth
          jade, obsidian, or a burnished fine metal. The chalice has a hidden
          compartment in the stem that allows for the insertion of a single vial
          of poison. The user doesn't risk poisoning himself when inserting the
          vial. Inside the compartment is a needle that siphons the poison from
          the vial and injects it into the bowl of the goblet. A hidden button
          (DC 20 Perception to locate) on the side of the stem begins the
          transfer of poison into the bowl. The transfer process takes 1 minute
          to complete, after which the hidden poison is emptied into the goblet.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 100
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: T63ybvpVw1g3pmeR
    _key: '!actors.items!e6kN1rNIhFaZykRh.T63ybvpVw1g3pmeR'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-symbol-leaf-green.webp
    name: Portrait book
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Advanced Player's Guide pg. 185</p><p><strong>Price</strong> 10
          gp; <strong>Weight</strong> 3 lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>This 100-page book contains face drawings
          of male and female dwarves, elves, gnomes, half-elves, half-orcs,
          halflings, and humans. By selecting an appropriate drawing and adding
          hair, a beard, or other small features such as moles or scars, even a
          poor artist can quickly create a reasonable likeness of a specific
          person-for example, an inquisitor making wanted posters of a
          half-elven witch.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 10
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: i5UxRTU5BPGkX2Lz
    _key: '!actors.items!e6kN1rNIhFaZykRh.i5UxRTU5BPGkX2Lz'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/shirt-simple-white.webp
    name: Powder ball (empty)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          14</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          straitjacket (<em>Pathfinder RPG Occult Adventures</em> 250) is
          designed for use by a single person. The leather straps and arm
          restraints are accessible in such a way as to be tightened by the
          wearer. Restraining or releasing oneself through these mechanisms
          requires 1 minute of work. Once restrained, the wearer can attempt to
          escape from the straitjacket as normal (that is, without using the
          built-in releases). Using a practice straitjacket to train for escape
          requires 1 hour of practice and a DC 20 Escape Artist check. If you
          succeed at the check, you gain a +2 circumstance bonus on Escape
          Artist checks to escape from bindings, a grapple, a net, rope, or
          similar restraints. This bonus lasts for 24 hours.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 100
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: dTvDSfnvVjmRiON1
    _key: '!actors.items!e6kN1rNIhFaZykRh.dTvDSfnvVjmRiON1'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/documents/document-official-capital.webp
    name: Printing press (1-page)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Tools</p><h2>Description</h2>A
          hand-cranked press uses a plate on which all of the text on a page is
          carved in reverse. Changing the plate is a simple process, but
          creating a new one is expensive and laborintensive. The press prints
          one page at a time, at a rate of about five pages per minute. A
          stationer then needs to cut and trim the pages and bind the book.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 250
      subType: gear
      weight:
        value: 150
    type: loot
  - _id: 4en4NM4AWC4g09H7
    _key: '!actors.items!e6kN1rNIhFaZykRh.4en4NM4AWC4g09H7'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-tooled-gold-brown.webp
    name: Prognostication manual
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Occult Adventures pg.
          250</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          small but thick booklet contains information on a specific form of
          folk divination, such as cartomancy, cheiromancy, crystallomancy, or
          horoscopy. Using such a book while reading a creature's fortune
          reduces the time needed to read that fortune by 2 minutes. When used
          as part of a Sense Motive check for the prognostication occult skill
          unlock, this book grants a +2 circumstance bonus. If the
          fortunetelling method requires a particular item, such as a deck of
          cards for cartomancy or animal bones for osteomancy, that item
          provides a +2 circumstance bonus that doesn't stack with the bonus
          provided by the prognostication manual.</p><p> A prognostication
          manual is useful primarily for cheiromancy (palm reading), horoscopy,
          and other methods that don't require special equipment.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 30
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: gLvZMDxOvO3aFIx5
    _key: '!actors.items!e6kN1rNIhFaZykRh.gLvZMDxOvO3aFIx5'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/hand/glove-ringed-cloth-brown.webp
    name: Psychometrist's gloves
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Occult Adventures pg.
          250</p><p><strong>Category</strong> Tools</p><h2>Description</h2>These
          layered lambskin gloves are specially designed and psychically attuned
          to increase the tactile sensitivity of the wearer's hands. To provide
          any benefit, the gloves must be worn for 8 uninterrupted hours. All
          Dexterity skill checks requiring the use of the hands take a -2
          penalty as long as the gloves remain on. After this 8-hour period, the
          user can remove the gloves to gain a +2 circumstance bonus on Appraise
          checks for the psychometry occult skill unlock. This benefit fades
          after 1 hour.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 10
      subType: gear
      weight:
        value: 5
    type: loot
  - _id: mNA6J9BZu2K5n5qg
    _key: '!actors.items!e6kN1rNIhFaZykRh.mNA6J9BZu2K5n5qg'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/framing-brown.webp
    name: Quintain
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Martial Arts Handbook pg.
          31</p><p><strong>Category</strong> Tools</p><h2>Description</h2>At its
          simplest, a quintain is a swiveling pole with a pair of arms, although
          permanent quintains are more elaborate and often look like armored
          mannequins. One arm holds a wooden board shaped like a shield. The
          other arm has a padded flail attached. In a routine originally used to
          train knights, a user rides past a quintain and tries to hit the board
          with a weapon, and then get out of the way before the quintain swings
          around to strike him with its flail in retaliation. Training with a
          quintain requires 1 hour of practice and a DC 15 Ride check. If you
          succeed at the check, you gain a +2 circumstance bonus on Ride checks
          to stay in the saddle, guide with your knees, and control a
          combat-trained mount. This bonus lasts for 24 hours or until you fail
          a Ride check.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 40
      subType: gear
      weight:
        value: 30
    type: loot
  - _id: tEjZC04dhNfcyE3w
    _key: '!actors.items!e6kN1rNIhFaZykRh.tEjZC04dhNfcyE3w'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/metal/fragments-steel-ring.webp
    name: Rack
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Disciple's Doctrine pg.
          28</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          simple disk, usually carved from stone or fashioned from metal, is
          engraved with a portion of a specific religious rite or ritual. A
          single disk details only part of a ritual, requiring multiple
          followers to bring their disks together to obtain a complete set of
          instructions.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 20
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: BK0u70V0vAKBO50r
    _key: '!actors.items!e6kN1rNIhFaZykRh.BK0u70V0vAKBO50r'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/leather/leather-scraps-yellow.webp
    name: Roar cord
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          66</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          thin length of rope has many oddly shaped bits of hollow metal fixed
          along its length. As a standard action, a creature can swing a roar
          cord over its head to generate a variety of eerie noises. For the next
          round, any creature within 60 feet of the roar cord takes a -2 penalty
          on Perception checks that rely on sound and a -1 penalty on saving
          throws against fear effects. The roar cord can be used as a bardic
          instrument (string instrument) that grants the bard a +2 bonus on
          Perform checks when using the countersong bardic performance.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 15
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: xmX4RBYzor0jIhPk
    _key: '!actors.items!e6kN1rNIhFaZykRh.xmX4RBYzor0jIhPk'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/tech/wheel-wooden.webp
    name: Roperunner
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          205</p><p><strong>Category</strong> Tools</p><h2>Description</h2>You
          can place this metal contraption onto a taut section of a rope
          connecting a high point to a lower one, allowing you to slide down the
          length of the rope with ease. Using a roperunner requires only one
          hand, leaving the other hand free during the descent. Attaching the
          roperunner to a rope is a move action. Beginning the descent is a
          swift action. You slide down the rope at a rate of 60 feet per round.
          This requires no action on your part, but you must move along the
          length of the rope in the downward direction. Retrieving the
          roperunner once you have come to a stop at the end of the rope is a
          move action. You can let go of the roperunner as a free action.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: OUdSOElOo8bO8CKZ
    _key: '!actors.items!e6kN1rNIhFaZykRh.OUdSOElOo8bO8CKZ'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/liquid-orange.webp
    name: Rust repellent
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Cohorts and Companions pg.
          17</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          waxy paste preserves metal objects against rust. One application coats
          a Medium or smaller metal object or creature and lasts 24 hours,
          granting it a +2 circumstance bonus on saving throws against rusting
          effects and reduces amount of damage dealt by rusting attacks by 5. A
          jar of rust repellent contains 5 applications.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 25
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: m6NmSRRd020VWBvP
    _key: '!actors.items!e6kN1rNIhFaZykRh.m6NmSRRd020VWBvP'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/tech/wheel.webp
    name: Samsaran life wheel
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          199</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          handheld wooden spool spins freely within a boxlike housing. Inscribed
          upon the exterior of the spool are dozens of samsaran prayers along
          with names or symbols associated with a samsaran's past lives.
          Samsarans believe that spinning the wheel during meditation
          strengthens the spiritual connections between their former lives. If a
          samsaran meditates with her wheel for at least 10 minutes about a
          Knowledge (history) question relating to her own history or the
          histories of her past lives, she gains a +1 insight bonus on the
          check.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 25
      subType: gear
      weight:
        value: 0.5
    type: loot
  - _id: kbmOAgh1jtPdVg5D
    _key: '!actors.items!e6kN1rNIhFaZykRh.kbmOAgh1jtPdVg5D'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Sanctified rings (pair)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          25</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Any</p><h2>Description</h2>A single
          tiny religious symbol adorns each ring in this matched pair. If two
          people each wear one of the rings and clasp hands, a cleric may
          activate both rings with one use of channel energy. If the person
          wearing one of these rings dies or removes it, the other ring
          instantly cracks; the wearer of the broken ring knows if it cracked
          because the other wearer died or the ring was removed.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 5
      subType: gear
    type: loot
  - _id: haTc4xjjatQetKPZ
    _key: '!actors.items!e6kN1rNIhFaZykRh.haTc4xjjatQetKPZ'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Sanctified shield
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          25</p><p><strong>Price</strong> +100 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Any</p><h2>Description</h2>A
          sanctified shield may be any type of shield (including bucklers, tower
          shields, and even magical shields). When activated, a sacred shield
          adds a +1 sacred (if positive energy) or profane (if negative energy)
          bonus to the wearer's Armor Class. This bonus lasts for 24 hours or
          until the wearer is struck in combat, whichever comes first. Creatures
          other than the cleric are able to use the charged shield and this
          ability.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 100
      subType: gear
    type: loot
  - _id: AX0oQQxfw24LJPNR
    _key: '!actors.items!e6kN1rNIhFaZykRh.AX0oQQxfw24LJPNR'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/coat-collared-studded-red.webp
    name: Sentry mannequin (masterwork)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ranged Tactics Toolbox pg.
          21</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          sentry mannequin<sup>UE</sup> is designed to seem more lifelike than
          its common counterpart. After 5 minutes of assembly and coverage with
          the included loose hood and baggy clothing, this wire frame looks like
          a vigilant humanoid figure. It has pivoted joints with counterweights
          that move it in ways reminiscent of an alert guard every few rounds
          for 8 hours after it's set up. Creatures more than 30 feet from the
          mannequin must succeed at a DC 15 Perception check to realize it's not
          someone standing watch.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 80
      subType: gear
      weight:
        value: 35
    type: loot
  - _id: p8Z3LVaGyQsfhASn
    _key: '!actors.items!e6kN1rNIhFaZykRh.p8Z3LVaGyQsfhASn'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/pen-steel-grey-brown.webp
    name: Shadow stencil set
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          211</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          set of 10 elaborate metal stencils are used in shadow puppetry to cast
          shadows of highly stylized figures and objects. If used to aid in the
          creation of any type of shadow spell or effect (including shadow
          puppet bardic performances), a wayang adds a +1 competence bonus to
          her saving throw DC. Using a shadow stencil requires one hand.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 30
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: FpA1nCbO5jB9NY87
    _key: '!actors.items!e6kN1rNIhFaZykRh.FpA1nCbO5jB9NY87'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/wrist/bracer-shadow.webp
    name: Shears (adamantine)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          205</p><p><strong>Category</strong> Tools</p><h2>Description</h2>When
          worn inside voluminous sleeves, this leather holster allows you to
          draw a concealed hand crossbow or coat pistol<sup>UE</sup> as a move
          action. The weapon sits on sliders and is drawn directly into the
          hand. Unlike a wrist sheath, a sleeve holster is bulky enough that it
          is obvious on close inspection, though under a loose enough garment it
          might not provoke a reactive Perception check. An individual sleeve
          holster fits for either a hand crossbow or a coat pistol, but not
          both.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 100
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: dAWOxEJTmkkBSFXS
    _key: '!actors.items!e6kN1rNIhFaZykRh.dAWOxEJTmkkBSFXS'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/boxes/crate-wooden-brown.webp
    name: Solarium, Portable
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Occult Adventures pg.
          249</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          long, wooden case contains a complicated framework of brass armatures,
          balance weights, a foldable mat, and purplehued lenses of various
          shapes and sizes. When assembled, the case becomes a small bed over
          which looms a complicated, slowly revolving array of lenses that
          filter sunlight onto the mat below. Only usable on bright, sunny days,
          the solarium has enough room for one Medium or two Small creatures to
          recline beneath its lens array and bask in the healing rays of the
          filtered natural light. The solarium can be used in conjunction with
          the long-term care use of the Heal skill. Subjects who bask in the
          filtered light for an 8-hour rest period recover 1 additional hit
          point per level or 1 additional ability score point if their
          caregivers succeed at the required Heal check.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 800
      subType: gear
      weight:
        value: 35
    type: loot
  - _id: GBoSkCI9W7bkixFU
    _key: '!actors.items!e6kN1rNIhFaZykRh.GBoSkCI9W7bkixFU'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/instruments/megaphone.webp
    name: Speaking trumpet
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ranged Tactics Toolbox pg.
          21</p><p><strong>Price</strong> 6 gp; <strong>Weight</strong> 2
          lbs.</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          large animal horn is hollowed out to amplify sounds that enter through
          the narrow end. The DC of Perception checks to hear a speaker using a
          speaking trumpet is reduced by 5.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 6
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: u2J6veLO5c7aZwvt
    _key: '!actors.items!e6kN1rNIhFaZykRh.u2J6veLO5c7aZwvt'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/bags/coinpouch-simple-leather-silver-brown.webp
    name: Spell component pouch
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>, <em>PRPG
          Core Rulebook pg. 158</p><p><strong>Price</strong> 5 gp;
          <strong>Weight</strong> 2 lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>A spellcaster with a spell component
          pouch is assumed to have all the material components and focuses
          needed for spellcasting, except for components that have a specific
          cost, divine focuses, and focuses that wouldn't fit in a pouch. Most
          spell component pouches are waterproof and can be strung onto a belt
          or bandolier.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 5
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: jDNUrOCG3leymfBe
    _key: '!actors.items!e6kN1rNIhFaZykRh.jDNUrOCG3leymfBe'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-embossed-jewel-gold-purple.webp
    name: Spellbook
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>, <em>PRPG
          Core Rulebook pg. 158</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>A spellbook has 100 pages of parchment,
          and each spell takes up one page per spell level (one page each for
          0-level spells). A newly purchased spellbook contains no spells. A
          wizard character begins play with a spellbook containing the spells he
          knows (<em>Core Rulebook </em>79).
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 15
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: UDYgkPnHLDoVoNzx
    _key: '!actors.items!e6kN1rNIhFaZykRh.UDYgkPnHLDoVoNzx'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Spiked focus ward
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          25</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Any</p><h2>Description</h2>This holy
          symbol has a small nail or spike somewhere along its length, allowing
          it to be hammered it into a wall, tree, floor, or any hard surface.
          Once fixed in place and activated, it stores channeled energy until it
          is touched by a creature of at least Small size or 24 hours pass. If
          touched, the focus releases the stored power as if you used channel
          energy, though it only heals or deals half the normal damage
          (including all feats and abilities that affect the DC and damage).
          Good clerics use these items to provide healing in large battles where
          a cleric may not be nearby; evil clerics often use them as traps.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 100
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: 1ryolrg7OkzF8XnT
    _key: '!actors.items!e6kN1rNIhFaZykRh.1ryolrg7OkzF8XnT'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/documents/document-symbol-circle-brown.webp
    name: Star charts
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          46</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Many
          half-elves live in large cities or communities where they find it
          difficult to commune with nature. While some go on long sojourns to
          the wilderness, others spend their evenings on high, lonely rooftops,
          gazing at the stars. These lonely souls use star charts to track the
          movement of the stars and other celestial bodies. Anyone referencing
          one of these charts on a clear night can attempt a DC 20 Knowledge
          (geography) check to determine her approximate location and the month.
          In addition, these charts grant a +2 circumstance bonus on Survival
          checks made to avoid getting lost at night with a clear sky.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 200
      subType: gear
      weight:
        value: 0.5
    type: loot
  - _id: hEjgo9MmlW5EerBi
    _key: '!actors.items!e6kN1rNIhFaZykRh.hEjgo9MmlW5EerBi'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Stinging whip
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Faiths of Balance pg.
          25</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong>
          Calistria</p><h2>Description</h2>This whip is made from braids of
          metallic wire. When it is activated, the wielder can expend the power
          within it to gain a sacred (if activated with positive energy) or
          profane (if activated with negative energy) bonus on her next disarm
          or trip combat maneuver with the whip. This bonus is equal to the
          number of dice of the activating cleric's channel energy ability. The
          whip remains charged until its magic is used or 1 hour has passed.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 50
      subType: gear
      weight:
        value: 5
    type: loot
  - _id: udJrL2QaiLbzePho
    _key: '!actors.items!e6kN1rNIhFaZykRh.udJrL2QaiLbzePho'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/fishing/net-gold.webp
    name: Stretcher
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong> 1 gp;
          <strong>Weight</strong> 10 lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>A stretcher allows two people to share
          the burden of carrying one heavy object. You can also use it to drag a
          load you couldn't carry on your own. A stretcher holds up to 300
          pounds.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 1
      subType: gear
      weight:
        value: 10
    type: loot
  - _id: jukyrpVsDWB1Lfi5
    _key: '!actors.items!e6kN1rNIhFaZykRh.jukyrpVsDWB1Lfi5'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/vial-orange.webp
    name: Sugar glass bottle
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          206</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          bottle looks like it's made of glass, but is more fragile and doesn't
          cause damage when it strikes a creature or object. Highly prized by
          theater performers, sugar glass bottles grant a +2 circumstance bonus
          on Bluff and Perform checks involving the creation of seemingly
          realistic fights.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 1
      subType: gear
    type: loot
  - _id: GHv1Q0Ypq4WCBwQ8
    _key: '!actors.items!e6kN1rNIhFaZykRh.GHv1Q0Ypq4WCBwQ8'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Sundered mask
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Faiths of Balance pg.
          25</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Nethys</p><h2>Description</h2>This
          mask is a representation of Nethys's own. Activating the mask charges
          it with healing power. If a member of Nethys' faith wears the mask
          when it is activated, the first time the wearer takes damage, the mask
          releases the stored energy into the wearer, healing a number of hit
          points equal to the number of dice of the activating cleric's channel
          energy ability. The mask heals its wearer regardless of the type of
          channeled energy used and whether the target is living or undead. This
          healing does not prevent the wearer from dying because of hit point
          damage, and is mainly used to provide instant healing when a cleric is
          occupied or can only channel a harmful kind of energy. The mask
          remains charged until it heals someone or 24 hours pass.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 250
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: sKOtV7Gj2KlSxd0f
    _key: '!actors.items!e6kN1rNIhFaZykRh.sKOtV7Gj2KlSxd0f'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/blocks-cut-brown.webp
    name: Surefoot training blocks
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Melee Tactics Toolbox pg.
          21</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          collection of eight heavy wooden or metal cones, cylinders, and
          spheres fills an ordinary backpack. None of the shapes is precisely
          regular, and when stacked atop each other, they teeter precariously
          and easily topple. Acrobats practice by stacking these blocks in
          unstable configurations and attempting to balance while standing upon
          them.</p><p>Using surefoot training blocks to improve your balance
          requires 1 hour of practice and a DC 15 Acrobatics check. If you
          succeed at the check, you gain a +2 circumstance bonus on Climb checks
          and on Acrobatics checks to balance on narrow surfaces or uneven
          ground. This bonus lasts for 24 hours or until you fail a Climb or
          Acrobatics check.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 25
    type: loot
  - _id: 6YPl39TRqbGrZc3m
    _key: '!actors.items!e6kN1rNIhFaZykRh.6YPl39TRqbGrZc3m'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/leather/leather-bolt-tan.webp
    name: Sweat lodge, Portable
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Occult Adventures pg.
          250</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          large leather wrap contains a foldable wooden framework that sits on
          stilts, pliable slats of birch bark, additional leather rolls, and
          consecrated stones. When assembled, the resulting hut is a small dome,
          suitable as a tent shelter and large enough to fit two crouching
          Medium humanoids or four Small humanoids. When the stones are heated
          and water is poured over them to create a thick steam, the hut becomes
          a sweat lodge for healing ceremonies, and provides a +2 circumstance
          bonus on Heal checks for the faith healing occult skill unlock.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 25
      subType: gear
      weight:
        value: 25
    type: loot
  - _id: OtssYlpfFF621PYY
    _key: '!actors.items!e6kN1rNIhFaZykRh.OtssYlpfFF621PYY'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/inventory/fish.jpg
    name: Swim fins
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 1 sp; <strong>Weight</strong> 5
          lbs.</p><p><strong>Category</strong> Tools</p><h2>Description</h2>Swim
          fins add 10 feet to your swimming speed but reduce your base speed to
          5 feet. Donning or doffing swim fins requires 5 rounds.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 0.1
      subType: gear
      weight:
        value: 5
    type: loot
  - _id: 4CFOv6hGCVPB9b7o
    _key: '!actors.items!e6kN1rNIhFaZykRh.4CFOv6hGCVPB9b7o'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Teaching staff
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          25</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Any</p><h2>Description</h2>Carved
          from heartwood and bearing ornate symbols along its length, this staff
          is used to reveal critical or uplifting information to other members
          of the faith, usually during a sermon. When activated, all creatures
          of the cleric's religion gain a sacred (if positive energy) or profane
          (if negative energy) bonus on Knowledge (religion) checks for 1
          minute; this bonus is equal to the number of dice of the cleric's
          channel energy ability.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 75
      subType: gear
      weight:
        value: 5
    type: loot
  - _id: 31dCOiUEDqrQMno7
    _key: '!actors.items!e6kN1rNIhFaZykRh.31dCOiUEDqrQMno7'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/glass-orb.webp
    name: Telescope (x10)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          16</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          small glass enclosure is 1 foot wide, 1 foot tall, and reinforced with
          a wooden or metal frame. Tiny air holes in the lid allow living
          creatures inside the portable terrarium to breathe, and the interior
          can be outfitted with a variety of substrates and other materials the
          creatures might require. A portable terrarium is usually fitted with
          straps so it can be tied to a pack. Diminutive and smaller creatures,
          such as some familiars, can be safely carried within a portable
          terrarium and have total cover while inside it. Healers and botanists
          often store living plants in these containers; a successful DC 12
          Knowledge (nature) check is required to transplant a plant into a
          portable terrarium, and most plants can live in a portable terrarium
          indefinitely so long as they are properly tended.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 100
      subType: gear
      weight:
        value: 4
    type: loot
  - _id: qboix2FOITBWeaJM
    _key: '!actors.items!e6kN1rNIhFaZykRh.qboix2FOITBWeaJM'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-worn-brown-grey.webp
    name: The Prophecies of Kalistrade
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          is the most frequently published book in Druma. It details the
          extremely strict dietary, sexual, and clothing restrictions followers
          must observe as part of their religion.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 75
      subType: gear
      weight:
        value: 10
    type: loot
  - _id: Fi7qy2VWBXVgvyAj
    _key: '!actors.items!e6kN1rNIhFaZykRh.Fi7qy2VWBXVgvyAj'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/tech/watch.webp
    name: Thermometer
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          foot-long tube has marks for the freezing temperature of seawater, a
          moderate spring day in Absalom, and the boiling temperature of melted
          ice. Temperatures much below the freezing point or above the boiling
          point break the device.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 25
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: xpjKdwsgR2EPdSRw
    _key: '!actors.items!e6kN1rNIhFaZykRh.xpjKdwsgR2EPdSRw'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/inventory/lock.jpg
    name: Thief trainer
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          14</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          small box is covered with varying gears, locks, panels, and other
          mechanisms. Thieves practice their mechanical skills by attempting to
          undo or unlock the various mechanisms to reach the box's center. The
          mechanisms shift and rearrange, allowing for a multitude of
          combinations to keep the box from opening. Once unlocked, the box
          resets itself and provides a reordered set of mechanisms, starting the
          process over. Using a thief trainer to improve your skills requires 1
          hour and a DC 25 Disable Device check. If you succeed at the check,
          you reduce the time required to complete a Disable Device check by 2
          rounds (minimum 1 round). This bonus lasts for 24 hours.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 200
      subType: gear
      weight:
        value: 4
    type: loot
  - _id: l0KX11Ll67KTdkYY
    _key: '!actors.items!e6kN1rNIhFaZykRh.l0KX11Ll67KTdkYY'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/inventory/lockpick.jpg
    name: Thieves' ring
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeoneer's Handbook pg.
          25</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          slightly oversized ring conceals a few lockpicks and other tools
          coiled inside its band. These discreet tools, made of a metal alloy
          that springs straight once the tool is removed from the band, are
          sufficient to attempt Disable Device checks without penalty, and long
          enough to pick locks on manacles fastened around the wearer's hands
          (once she slips off the ring). The wearer gains a +2 circumstance
          bonus on Sleight of Hand checks made to conceal the ring's nature from
          anyone searching her.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 300
      subType: gear
    type: loot
  - _id: sUHTzxab6fWGSeMv
    _key: '!actors.items!e6kN1rNIhFaZykRh.sUHTzxab6fWGSeMv'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/goggles-leather-grey.webp
    name: Thieves' tool extenders
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeoneer's Handbook pg.
          25</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          expertly crafted helmet has several small arms that hold magnifying
          lenses near the wearer's face. They're kept in place by locking hinges
          and crude gyroscopes that compensate for normal head movements. While
          the lenses are properly aligned, the wearer gains a +2 circumstance
          bonus on Appraise and Craft checks involving items that are small or
          highly detailed and on sight-based Perception checks when she uses an
          action to inspect something within 5 feet. However, the arms become
          misaligned if the wearer falls prone or is grappled, or if the helmet
          is damaged (hardness 5, 2 hit points). If the arms are misaligned,
          they lose their usefulness until readjusted (a full-round action that
          provokes attacks of opportunity).
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 200
      subType: gear
      weight:
        value: 4
    type: loot
  - _id: rejgTcRx9z0Penbb
    _key: '!actors.items!e6kN1rNIhFaZykRh.rejgTcRx9z0Penbb'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-worn-purple.webp
    name: Tome of epics
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          206</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          hefty book is bound in oilskin and decorated with scenes of glorious
          combat between ancient heroes and ferocious monsters. It contains
          several tales of valor, defeat, and victory, all with brightly colored
          illustrations. After consulting the book for 1 hour, for the next 24
          hours you gain a +2 circumstance bonus on Perform (oratory) and
          Perform (sing) checks and a +2 circumstance bonus on Knowledge
          (nobility) checks pertaining to heroic lineages.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 50
      subType: gear
      weight:
        value: 3
    type: loot
  - _id: vtTsiNzjMmhNjvHm
    _key: '!actors.items!e6kN1rNIhFaZykRh.vtTsiNzjMmhNjvHm'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/hand/needle-grey.webp
    name: Tools, Artisan's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Pathfinder #8: Seven Days to the Grave pg. 61</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>When used in conjunction with a healer's
          kit, surgeon's tools raise the kit's bonus to a +3 circumstance bonus
          on Heal checks to treat wounds or deadly wounds.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 20
      subType: gear
      weight:
        value: 5
    type: loot
  - _id: MHjrT1OzvmDAinlP
    _key: '!actors.items!e6kN1rNIhFaZykRh.MHjrT1OzvmDAinlP'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/hand/glove-tooled-leather-green.webp
    name: Tools, Thieves'
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Goblins of Golarion pg.
          12</p><p><strong>Price</strong> 1 sp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Tools</p><h2>Description</h2>A
          tossglove is a hefty leather and metal glove made for holding and
          throwing an insect, snake, or other tiny creature that would otherwise
          bite the goblin. Those who don't use a tossglove when attempting to
          sling such creatures provoke an attack of opportunity from the animal
          they attempt to throw or stash. The glove has overlapping plates that
          cover the goblin's arm up to the elbow. It's a full-round action to
          put on or take off a tossglove, and while it's worn, that hand can't
          be used to perform acts of fine manipulation (such as making a Disable
          Device check or firing an arrow). The gloved hand can still wield a
          melee weapon.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 0.1
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: E1mOUaVyiYAMNiAX
    _key: '!actors.items!e6kN1rNIhFaZykRh.E1mOUaVyiYAMNiAX'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/tech/watch.webp
    name: Toxic censer
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the Stars pg.
          19</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          bulky, key-wound, pocket-sized clock has three faces, each with its
          own hour hand. Each face can be wound and calibrated separately to
          account for up to three different time zones (for local use) or even
          different day lengths (for interstellar use). It is accurate to within
          half an hour per day and must be wound daily.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 1000
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: CKZZ4ZKuktjMGtZB
    _key: '!actors.items!e6kN1rNIhFaZykRh.CKZZ4ZKuktjMGtZB'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-open-brown.webp
    name: Traveling formula book
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          77</p><p><strong>Category</strong> Tools</p><h2>Description</h2>This
          is the alchemist equivalent of a traveling spellbook for wizards (a
          traveling formula book and a traveling spellbook are essentially the
          same item).
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 10
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: FIUGn3UH8IhwuS7e
    _key: '!actors.items!e6kN1rNIhFaZykRh.FIUGn3UH8IhwuS7e'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/books/book-embossed-clasp-gold-brown.webp
    name: Traveling spellbook
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 77</em>,
          <em>Advanced Player's Guide pg. 185</em>, <em>Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Tools</p><h2>Description</h2>A
          traveling spellbook is less cumbersome than a normal one, but holds
          fewer spells. It has 50 pages. Some wizards prefer to travel with a
          smaller spellbook, omitting specialized spells that are rarely used on
          adventures. Others hide a traveling spellbook containing their most
          important spells, just in case.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 10
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: lA0yde0Z7AVyMoqc
    _key: '!actors.items!e6kN1rNIhFaZykRh.lA0yde0Z7AVyMoqc'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/boots-collared-leather-blue.webp
    name: Trephine
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 8 sp; <strong>Weight</strong> 2
          lbs.</p><p><strong>Category</strong>
          Tools</p><h2>Description</h2>Consisting of a small wooden frame with
          inward-pointing barbed spikes, this trap is placed in a shallow pit
          just deep enough for a Medium-sized character's lower leg. When
          someone steps in the square, the boot catches and holds her leg. The
          target takes damage if she tries to move or if a Disable Device
          attempt to free her fails by 5 or more.</p><p><strong>Trespasser 's
          Boot - CR 1/2</strong></p><p><strong>Type</strong> mechanical;
          <strong>Perception</strong> DC 20; <strong>Disable Device</strong> DC
          20</p><p><strong>Trigger</strong> location; <strong>Reset</strong>
          manual</p><p><strong>Effect</strong> pit spikes (Atk +10 melee, 2d4);
          spikes hold the target in place; the trap can be escaped with a DC 20
          Disable Device check, DC 20 Escape Artist check, or DC 24 Strength
          check
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 0.8
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: G6MP9nXvl4LrTBLa
    _key: '!actors.items!e6kN1rNIhFaZykRh.G6MP9nXvl4LrTBLa'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/goggles-leather-blue.webp
    name: Tribal standard
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeoneer's Handbook pg.
          25</p><p><strong>Category</strong> Tools</p><h2>Description</h2>A
          vigil cap is built like a tinker's cap, but with shades and wideview
          mirrors instead of magnifying lenses. The helmet's arms can be
          adjusted (as a full-round action that provokes attacks of opportunity)
          into one of the following modes at a given time:</p><p>
          <strong>All-Around Perspective</strong>: When properly angled, the
          mirrors grant the wearer a better view of his surroundings and
          attacking foes. In this mode, the helmet grants a +2 circumstance
          bonus on reactive sight-based Perception checks.</p><p>
          <strong>Indirect Observation</strong>: Intended to protect against
          gaze attacks, this mode combines shades positioned to block forward
          vision with mirrors angled to let the wearer see around him. Any time
          he would normally have to attempt a saving throw against a gaze
          attack, there is a 75% chance he doesn't need to attempt the save.
          Because of the wearer's obscured vision, however, all foes gain
          partial concealment (10% miss chance) against him.</p><p>
          <strong>Shades</strong>: With the mirrors tucked aside, the shades
          provide a +2 circumstance bonus on saving throws against effects that
          blind or dazzle.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 400
      subType: gear
      weight:
        value: 4
    type: loot
  - _id: ZqdwD7nnllGUSc8v
    _key: '!actors.items!e6kN1rNIhFaZykRh.ZqdwD7nnllGUSc8v'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/wood-pole.webp
    name: Wand of misery
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder #8: Seven Days to the Grave pg.
          61</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Tools</p><h2><img
          src="modules/pf-content/assets/ThreeFiveSymbol.gif" title="3.5
          Material"/>Description</h2>This simply carved but sturdy 3-footlong
          wooden cane is used to scrutinize plague victims. The wand permits the
          plague doctor to determine a patient's condition, diagnosing his
          maladies through his reactions to various pokes and prods, often
          opening infected sores and wounds for inspection. These tools have the
          same statistics as clubs.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 5
      subType: gear
      weight:
        value: 1
    type: loot
  - _id: e2zx5n3ptRrbBTdB
    _key: '!actors.items!e6kN1rNIhFaZykRh.e2zx5n3ptRrbBTdB'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/wood-pole.webp
    name: Waster
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Melee Tactics Toolbox pg.
          21</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong>
          varies</p><p><strong>Category</strong> Tools</p><h2>Description</h2>A
          waster is a heavily weighted wooden practice weapon, used as a way to
          build endurance and expertise with a specific weapon. All wasters are
          designed to emulate a specific melee weapon (such as a kukri waster or
          a greatsword waster), and weigh twice as much as the weapons they
          emulate.</p><p>Using a waster to hone your combat techniques requires
          1 hour of practice and a DC 15 combat maneuver check. If you succeed
          at the check, you gain a +2 circumstance bonus to your CMD against
          combat maneuvers targeting weapons you wield that match the waster
          your practiced with. This bonus lasts for 24 hours.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 1
      subType: gear
    type: loot
  - _id: OTddc95fOpDEeoH2
    _key: '!actors.items!e6kN1rNIhFaZykRh.OTddc95fOpDEeoH2'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/metal/fragments-steel-barbed.webp
    name: Wing hooks
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          13</p><p><strong>Category</strong> Tools</p><h2>Description</h2>These
          wooden braces hook on to a gathlain's wings to help in clinging to
          ivy, tree limbs, or other surfaces with significant handholds. Many
          wing hooks are decorated with intricate carvings. A gathlain wearing
          wing hooks can cling to a surface with a Climb DC of 10 or lower
          without effort, and can safely sleep there. The wing hooks leave the
          gathlain's arms free while attempting Climb checks on such surfaces.
      equipped: false
      flags:
        dictionary:
          Category: Tools
      price: 150
      subType: gear
      weight:
        value: 2
    type: loot
  - _id: xSJmyEJzsiL7SIzQ
    _key: '!actors.items!e6kN1rNIhFaZykRh.xSJmyEJzsiL7SIzQ'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Winged fetish
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Faiths of Balance pg.
          25</p><p><strong>Category</strong> Channel
          Foci</p><p><strong>Deity</strong> Pharasma</p><h2>Description</h2>This
          amulet is made of a dulled dagger wrapped with feathers. When
          activated, it protects the wearer against undead creatures. The first
          time the wearer is subject to an attack from an undead creature that
          requires a saving throw (such as disease, paralysis, or energy drain),
          the amulet gives the wearer a sacred (if activated with positive
          energy) or profane (if activated with negative energy) bonus on her
          saving throw against that attack. This bonus is equal to the number of
          dice of the activating cleric's channel energy ability. The amulet
          remains charged until its magic is used or 1 hour has passed.
      equipped: false
      flags:
        dictionary:
          Category: Channel Foci
      price: 50
      subType: gear
    type: loot
