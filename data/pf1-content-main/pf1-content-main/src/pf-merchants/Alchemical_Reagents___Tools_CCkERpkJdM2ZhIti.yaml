items:
  - _id: mwxMSsQhfxXSdtUe
    _key: '!actors.items!CCkERpkJdM2ZhIti.mwxMSsQhfxXSdtUe'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/gems/pearl-turquoise.webp
    name: Aboleth Mucus Extract
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          235</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>The effects of this gray-green pill last
          for 5 minutes after consumption. During this time, when making a full
          attack, you can accept alchemical burn to make your second attack at
          your full base attack bonus instead of the attack bonus for your
          second attack. An accuracy lozenge gives no benefit on attacks beyond
          the second, nor does it provide a second attack if you don't already
          have one.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 330
      subType: misc
    type: consumable
  - _id: YJhZnibDq46opNPV
    _key: '!actors.items!CCkERpkJdM2ZhIti.YJhZnibDq46opNPV'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/documents/parchment-plain-tan.webp
    name: Adhesive Strip
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          245</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong> 1/2
          lb.</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This 3-foot-long strip of extremely thin
          hide can be cut into different lengths. When moistened and applied
          across surfaces or between objects, it creates a bond requiring a DC
          15 Strength check to pull apart. Once applied, an adhesive strip takes
          1 minute to set. If applied to an item with the broken condition, it
          suppresses the effects of that broken condition for as long as the
          item remains repaired by the strip-though the item does not regain hit
          points and is still broken. The uses for an adhesive strip are many;
          it can be used to bind prisoners, mend clothing, patch holes, and so
          on.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 5
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: O3voQCdm2nEPJtcm
    _key: '!actors.items!CCkERpkJdM2ZhIti.O3voQCdm2nEPJtcm'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-liquid-white.webp
    name: Age Ointment
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          235</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This white, waxy ointment allows you to
          appear older or younger, and is useful for both people who need
          disguises and the vain. When mixed with an equal amount of sealing
          wax, it forms a gray paste that discolors and relaxes your skin,
          reducing the penalty on Disguise checks to appear older than you are
          by 2. When mixed with an equal amount of soap, it forms a rosy paste
          that clarifies and tightens your skin, reducing the penalty on
          Disguise checks to appear younger than you are by 2. An application of
          age ointment lasts for 1d4+1 days. Age ointment can be used once, and
          the price includes the required amounts of sealing wax and
          soap.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 80
      subType: misc
    type: consumable
  - _id: wFfmeqF2q9jv6UEO
    _key: '!actors.items!CCkERpkJdM2ZhIti.wFfmeqF2q9jv6UEO'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-yellow.webp
    name: Alchemical Candle Wax
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong> 2
          lbs.</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>You mix this fine gray powder with water
          and a cubic foot of sand or gravel to form a durable stone-like
          material. Until it cures, it has the consistency of thick mud, and you
          must hold it in place (typically with a frame of earth or wood) if you
          want it to harden in a specific shape. It takes 1d10+10 minutes for
          the cement to partially cure, gaining hardness 2 and 5 hit points per
          inch of thickness. After 1d6 hours the cement is fully cured and as
          hard as true stone.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 5
      subType: misc
      weight:
        value: 2
    type: consumable
  - _id: Z6WRuEF7MhmVSZhc
    _key: '!actors.items!CCkERpkJdM2ZhIti.Z6WRuEF7MhmVSZhc'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/liquid-droplet-blue.webp
    name: Alchemical Cleaner
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Villain Codex pg.
          44</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This caustic alchemical solution
          dissolves blood, hair, and small pieces of flesh. Distributing it over
          a 5-foot square takes one full-round action and increases the DC of
          Perception checks to find such materials by 20. (A creature that fails
          the Perception check to find such materials by 5 or less realizes the
          area has been unnaturally cleared of them.) This applies only to the
          original Perception DC, not a substituted skill check like those from
          the cleaner<sup>ACG</sup> or traceless<sup>UI</sup> archetypes. One
          pot of alchemical cleaner contains enough liquid to cover nine 5-foot
          squares. A pot of alchemical cleaner can be thrown as a splash weapon
          and functions as an alkali flask (<em>Advanced Player's Guide</em>
          184) when thrown. Crafting alchemical cleaner requires a successful DC
          25 Craft (alchemy) check.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 300
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: Tu4gS8ehlHN0fNhx
    _key: '!actors.items!CCkERpkJdM2ZhIti.Tu4gS8ehlHN0fNhx'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-pink-yellow-green.webp
    name: Alchemical Dye Kit
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This kit provides a variety of creamy
          liquids in glass jars, and allows you to temporarily change the color
          of your hair or skin to match that of a creature of any humanoid race.
          This includes exotic and unusual hues, such as gnome hair colors. If
          used as part of a Disguise check, this kit reduces the time required
          to create the disguise by 1d6 minutes (to a minimum of a full-round
          action), and halves the penalty to disguise yourself as a different
          race whenever such recoloration is necessary. Each use of the kit
          changes either hair or skin color. If you need to change both your
          hair color and your skin color, you must spend two uses of the kit to
          gain the benefit. Each dye takes 1 minute to apply (thus requiring 2
          minutes to change both hair and skin color). Once applied, the colors
          are waterproof, and can't be rubbed or burned away. An application of
          dye fades after 1d4+1 days unless removed earlier by magical means.
          Applying a new application of alchemical dye immediately covers and
          replaces a previous application. An alchemical dye kit is exhausted
          after 10 uses.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC
          20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 160
      subType: misc
      weight:
        value: 6
    type: consumable
  - _id: jxf4j3E0kZGiJfl7
    _key: '!actors.items!CCkERpkJdM2ZhIti.jxf4j3E0kZGiJfl7'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Alchemical Glue
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This glue is stored as two flasks of
          syrupy liquid. When mixed together and allowed to cure, they form a
          strong bond. The glue is sufficient to coat 1 square foot of surface,
          or (because of waste, spills, and inaccurate mixing) up to 20 smaller
          applications of approximately 2 square inches each. The glue is tacky
          after 1 minute and fully cured after 1 hour. Pulling apart a large
          glued surface (at least 1 square foot) requires a DC 20 Strength check
          for tacky glue or DC 25 for cured glue. Pulling apart a small glued
          surface (anything less than 1 square foot) is a DC 15 Strength check
          for tacky glue or DC 20 for cured
          glue.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 20
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: oWbW8WHjqo2UCvdN
    _key: '!actors.items!CCkERpkJdM2ZhIti.oWbW8WHjqo2UCvdN'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Alchemical Glue Accelerant
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This tiny dropper contains a liquid that
          speeds up the cure time of alchemical glue. Applying the accelerant is
          a standard action. Accelerated glue is tacky after 1 round and fully
          cured in 1 minute. The dropper contains 20 doses; each dose is
          sufficient to cure one small application of alchemical glue. The
          entire dropper must be used to cure a full square foot of
          glue.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
    type: consumable
  - _id: cwkBrW5i2OCUXLb8
    _key: '!actors.items!CCkERpkJdM2ZhIti.cwkBrW5i2OCUXLb8'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/liquid-droplet-blue.webp
    name: Alchemical Pheromones (Aggression)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          246</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When applied to your hands, this clear,
          sticky substance made from alchemically prepared pine sap provides a
          +2 alchemical bonus to your CMD against disarm attempts, on combat
          maneuver checks to grapple, and on Climb checks; it also functions
          underwater. Applying the resin is a standard action, and it wears off
          1 hour after being applied.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
    type: consumable
  - _id: ztqDymgKe30Veqm6
    _key: '!actors.items!CCkERpkJdM2ZhIti.ztqDymgKe30Veqm6'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-purple.webp
    name: Alchemical Solvent
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 103</em>,
          <em>Advanced Player's Guide pg. 183</em>, <em>Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This bubbling purple gel eats through
          adhesives. Each vial can cover a single 5-foot square. It destroys
          most normal adhesives (such as tar, tree sap, or glue) in a single
          round but takes 1d4+1 rounds to deal with more powerful adhesives
          (alchemical glue, tanglefoot bags, spider webbing, and so on). It has
          no affect on fully magical adhesives, such as <em>sovereign
          glue</em>.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 20
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: C9ojCdvQ8nFrGb6l
    _key: '!actors.items!CCkERpkJdM2ZhIti.C9ojCdvQ8nFrGb6l'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-grey.webp
    name: Alkali Salt
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeon Denizens Revisited pg.
          19</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>These tiny granules can be dissolved in
          water, creating a slimy material used to coat metallic items such as
          weapons or armor. Such a coating neutralizes the metaleating acid of
          black puddings and gray oozes, protecting the item from 1d3 contacts
          with an ooze's acidic touch.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 30
      subType: misc
    type: consumable
  - _id: bTPylHYyS0ADEa0o
    _key: '!actors.items!CCkERpkJdM2ZhIti.bTPylHYyS0ADEa0o'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Alluring Philter
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          22</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This simple, rosy liquid smells of
          fresh flowers and perfume. For 1 hour after drinking this tincture,
          you gain a +2 alchemical bonus on Diplomacy checks, and if you fail a
          Diplomacy check to shift a creature's attitude by 5 or more, the
          creature's attitude toward you doesn't worsen. The increased pheromone
          production makes it difficult to think, causing you take a -2 penalty
          on Intelligence-based skill checks for the same duration.
          Additionally, creatures with the scent ability can detect you from
          twice as far away for the same
          duration.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Tincture
      price: 150
    type: consumable
  - _id: XUj0BfwR9vr7oR7x
    _key: '!actors.items!CCkERpkJdM2ZhIti.XUj0BfwR9vr7oR7x'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-8.jpg
    name: Amp
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          19</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This liquid intensifier can be added to a
          drug as a move action no more than 1 round before the drug is taken.
          Amp increases all numeric effects of a drug by 50%, including any
          bonuses, penalties, and ability damage inflicted by the drug. Using
          amp with a drug increases the save DC to avoid becoming addicted to
          that drug by 2 for 1d4 days; this increase stacks. If a drug combined
          with amp is not consumed within 1 round, the amp spoils and the drug
          becomes tainted, as if cut with bunk.<h2>Alchemical
          Recipe</h2><strong>Recipe</strong> (6 quicksilver + 10
          realgar)/distillation; <strong>Craft</strong>
          20</p><p><strong>Time</strong> 10 minutes; <strong>Tools</strong>
          retort; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 30
      subType: drug
    type: consumable
  - _id: DcvzQVHzybPDFvET
    _key: '!actors.items!CCkERpkJdM2ZhIti.DcvzQVHzybPDFvET'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/daisies-pink.webp
    name: Angel Quill Arrowhead
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          152</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 18; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> temperate or warm
          deserts</p><p><strong>Preparation</strong> A dose of angelstep can be
          used raw or processed into a pigment that can be worn on the skin.
          Processing a dose of the pigment takes 4 hours and requires a
          successful DC 15 Craft (alchemy) check. Angelstep pigment costs twice
          as much as the raw fungus.</p><p><strong>Use</strong> As part of an
          attempt to stabilize a dying creature, a dose of raw angelstep can be
          rubbed on the creature to grant a +4 bonus on the Heal check to
          stabilize the creature. A dose of angelstep pigment applied to the
          skin of a Medium or smaller creature helps to protect that creature
          against death for 2d4 hours. The next time the wearer of angelstep
          pigment drops to negative hit points, it gains a +4 alchemical bonus
          on its next 1d6 Constitution checks to stabilize. The pigment loses
          its effect once all these checks are attempted or once the victim is
          stabilized.</p><h2>Description</h2>This iridescent white shelf fungus
          is said to have first grown from the footsteps of an angel, though
          some claim it instead comes from the footsteps of a djinni.
      flags:
        dictionary:
          Category: Herbs
      price: 25
      subType: misc
    type: consumable
  - _id: GV1O7Pl5ir87Chi9
    _key: '!actors.items!CCkERpkJdM2ZhIti.GV1O7Pl5ir87Chi9'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-teal.webp
    name: Angry Jack
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dirty Tactics Toolbox pg.
          20</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>Named after a common children's toy,
          this metal box, typically no larger than 1 cubic foot in volume,
          possesses a secret compartment large enough to store one flask or
          vial. When loaded with a splash weapon or a vial of poison (contact or
          inhaled poisons only) and armed as a full-round action, an angry jack
          attacks the next creature to open the box, using its spring-loaded
          interior to launch that item at the target as a ranged touch attack
          (attack bonus +0). A creature struck by a contact poison in this way
          is exposed to the poison as normal, but a creature is automatically
          exposed to a loaded inhalation poison with no attack roll needed.
          Identifying an angry jack requires a successful a DC 20 Perception
          check. A character who is trained in the Disable Device skill can
          spend 10 minutes disguising an armed angry jack, allowing her to roll
          a Disable Device check and use the result as the Perception DC for
          others to detect the true nature of the angry jack. The user can't
          take 10 or 20 on the Disable Device check.
      flags:
        dictionary:
          Category: Black Market
      price: 25
      subType: misc
      weight:
        value: 2
    type: consumable
  - _id: FIMF3scafqet0nGt
    _key: '!actors.items!CCkERpkJdM2ZhIti.FIMF3scafqet0nGt'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Animal Glue
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          56</p><p><strong>Price</strong> 5 sp; <strong>Weight</strong> 1/2
          lb.</p><p><strong>Category</strong> Adventuring
          Gear</p><h2>Description</h2>This simple glue is created by extensively
          boiling animal skin, bones, hooves, horn, and tendons until they turn
          into a ochre syrup that cools when it hardens. Before you use animal
          glue, you must heat it until it liquefies. You normally apply it with
          a brush and hold the pieces together for a minute, at which point it
          is cooled and hardened. The glue is sufficient to coat 1 square foot
          of surface, or (because of waste and spills) up to 40 smaller
          applications of approximately 2 square inches each. Pulling apart a
          large glued surface (at least 1 square foot) requires a DC 15 Strength
          check. Pulling apart a small glued surface (anything less than 1
          square foot) requires a DC 10 Strength check. Animal glue slowly
          dissolves in water, reducing the Strength DC needed to break it by 1
          per 10 minutes. It softens if heated, even with steam, reducing the
          Strength DC needed to break it by 1 per minute.
      flags:
        dictionary:
          Category: Adventuring Gear
      price: 0.5
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: 4LIeHOVF8a9FLZhf
    _key: '!actors.items!CCkERpkJdM2ZhIti.4LIeHOVF8a9FLZhf'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-blue.webp
    name: Anointing Oil
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          87</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This sacred oil, infused with aromatic
          spices and distilled holy water, may be applied to a creature while
          casting a harmless divine spell with a range of touch, increasing the
          casting time to a full-round action but also increasing the caster's
          effective caster level by +1 for that
          spell.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      weight:
        value: 1
    type: consumable
  - _id: Z3aX3OkliveyAuya
    _key: '!actors.items!CCkERpkJdM2ZhIti.Z3aX3OkliveyAuya'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-yellow.webp
    name: Antiemetic Snuff
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          206</p><p><strong>Category</strong> Alchemical
          Remedies</p><h2>Description</h2>This snuff can be used to shake off
          the effects of nausea. If you take it before being exposed to an
          effect that would give you the nauseated condition and allows a saving
          throw, you attempt two saving throws against the effect and take the
          higher result. A single dose provides this benefit for 1
          hour.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Remedies
      price: 50
      subType: misc
    type: consumable
  - _id: G8N1mwQkUadt5VXT
    _key: '!actors.items!CCkERpkJdM2ZhIti.G8N1mwQkUadt5VXT'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Armor Ointment
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This thick lubricant makes the joints of
          armor move more freely. Applying the ointment takes 1 minute and
          reduces your armor's armor check penalty by 1 (to a minimum of -1) for
          8 hours.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 30
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: 5iSsGVUsYXrna5VG
    _key: '!actors.items!CCkERpkJdM2ZhIti.5iSsGVUsYXrna5VG'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Artistic Ale
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          22</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>Favored by performers of all kinds,
          this tincture is a blend of alchemically enhanced herbs and spices
          mixed into a pint of ale. For 6 hours after drinking this tincture,
          you gain a +2 alchemical bonus on Bluff and Perform checks, and you
          treat your level as 1 higher for the purpose of determining the
          effects of a bardic performance or a raging song. The potent drink
          causes you take a -2 penalty on Acrobatics, Intimidate, Knowledge,
          Sense Motive, and Spellcraft checks for the same
          duration.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Tincture
      price: 300
    type: consumable
  - _id: 9TgLAUjD2vibkZyE
    _key: '!actors.items!CCkERpkJdM2ZhIti.9TgLAUjD2vibkZyE'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/buds-red.webp
    name: Barbarian Chew
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Varisia, Birthplace of Legends pg.
          15</em>, <em>Curse of the Crimson Throne Player's Guide pg. 12</em>,
          <em>Rise of the Runelords Player's Guide pg. 11</em>, <em>Adventurer's
          Armory pg. 19</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>The Shoanti of the Cinderlands combine
          lime, crimson galtroot leaves, and some say horse blood to create this
          invigorating chew. Aside from staining the teeth a bloody shade,
          barbarian chew causes the user to feel stronger, but also angrier. One
          use of barbarian chew grants a barbarian +1 additional round of rage.
          This additional round is used first when a barbarian begins raging. If
          a barbarian does not rage within 1 hour of using the chew, this
          additional round of rage is lost. This benefit can be gained only once
          per day; consuming multiple doses in a 24-hour period has no
          additional effects. Barbarian chew can be created with a successful DC
          20 Craft (alchemy) check.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: byaeU9r3XuEFHqSH
    _key: '!actors.items!CCkERpkJdM2ZhIti.byaeU9r3XuEFHqSH'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-powder-red.webp
    name: Beast Lure
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This light brown oil works similar to
          Kaava musk (see below) but attracts one specific kind of creature
          (dogs, giant bees, and so on).<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 30
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: 61mFFBALK3xsaJL7
    _key: '!actors.items!CCkERpkJdM2ZhIti.61mFFBALK3xsaJL7'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/mortar-powder-green.webp
    name: Beast-Scent
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg. 24</em>,
          <em>Seekers of Secrets pg. 42</p><p><strong>Category</strong>
          Alchemical Tools</p><h2>Description</h2>This mixture of scent-gland
          extracts and aromatic herbs serves as both attractor and olfactory
          camouflage. It masks the natural scent of a creature with a pungent
          musk that is alluring to animals. Beast-scent provides a +2
          circumstance bonus on Handle Animal and wild empathy checks and a -5
          penalty on attempts to track the wearer by his original scent. If the
          tracking creature is following the smell of beast-scent itself,
          Survival checks to track gain a +10 circumstance bonus
          instead.</p><p>A single vial of beast-scent masks the scent of one
          Medium creature or two smaller creatures; larger creatures require
          proportionally more to gain the benefits. Beast-scent becomes inert
          after 1 hour of exposure to air. Applying a vial is a full-round
          action that provokes attacks of
          opportunity.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC
          25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 75
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: OtAFRMRMT0hnAEfz
    _key: '!actors.items!CCkERpkJdM2ZhIti.OtAFRMRMT0hnAEfz'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/lily-grey-orange.webp
    name: Black Amaranth
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          152</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 18; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> temperate or warm forests or
          plains</p><p><strong>Preparation</strong> The amaranth's flowers and
          stalks must be carefully ground into paste. This requires a successful
          DC 12 Craft (alchemy) check and 1 hour of
          work.</p><p><strong>Use</strong> A dose of black amaranth paste can be
          applied to a dead body to slow decay. One dose used on a Tiny or
          smaller creature delays the onset of decay for 3 days (as per gentle
          repose). Two doses are needed for Small creatures, 3 for Medium
          creatures, 6 for Large creatures, 12 for Huge creatures, 24 for
          Gargantuan creatures, and 48 for Colossal creatures. Each dose applied
          requires a full-round action that provokes attacks of
          opportunity.</p><h2>Description</h2>Black amaranth grows in small
          clusters from the remains of the dead.
      flags:
        dictionary:
          Category: Herbs
      price: 100
      subType: misc
    type: consumable
  - _id: QWSltbC5kMOGnTUc
    _key: '!actors.items!CCkERpkJdM2ZhIti.QWSltbC5kMOGnTUc'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-7.jpg
    name: Black Fester (Vial)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          56</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This black paste is often applied on orc
          weapons before going on raids to stymie an enemy's healing magic. Like
          a poison, black fester stays on a weapon until the first time it
          strikes an opponent. It remains in the target's body for 1 hour. A
          creature exposed to black fester resists magical healing; a creature
          trying to magically heal the target must make a DC 10 caster level
          check to restore any hit points to the
          target.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 30
    type: consumable
  - _id: 1Jbq30XABPQuOFU1
    _key: '!actors.items!CCkERpkJdM2ZhIti.1Jbq30XABPQuOFU1'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/liquid-blue.webp
    name: Blackfingers Paste
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Rival Guide pg.
          53</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Developed by followers of Norgorber, this
          inky paste aids unskilled poison-users. When smeared on the fingers, a
          dose of blackfingers paste prevents accidental poisoning while
          applying poison to a weapon, as if the user possessed the poison use
          ability. A single dose of blackfingers paste lasts for 1d6 hours, but
          the black stains the stuff creates on the user's fingers lasts for
          days. A single dose of this alchemical item costs 50 gp.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
    type: consumable
  - _id: c29z9yHzWLtR7Qja
    _key: '!actors.items!CCkERpkJdM2ZhIti.c29z9yHzWLtR7Qja'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/powder-black.webp
    name: Blackfire Clay
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This pliant black clay is always
          pleasantly warm to the touch. Working blackfire clay in your hands for
          a full round causes the clay to grow much warmer, granting you a +4
          alchemical bonus on saving throws made to resist cold weather. You can
          combine five blocks of clay over the course of a minute to produce a
          source of warmth equivalent to a small campfire, allowing you to heat
          a campsite and cook food.</p><p>Blackfire clay only produces heat,
          never light, smoke, or odor. The clay emits warmth for 1 hour before
          hardening into an unusable lump. A newly created brick of blackfire
          clay is composed of 10 blocks.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 20
      subType: misc
      weight:
        value: 10
    type: consumable
  - _id: f83TTI2ra3ofsi9L
    _key: '!actors.items!CCkERpkJdM2ZhIti.f83TTI2ra3ofsi9L'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Blasting Jelly
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Darklands pg.
          30</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This volatile gray paste sticks to solid
          surfaces and creates a concentrated blast when exposed to fire, making
          it a valuable excavation tool. You can apply 1 dose of blasting jelly
          to a 5-foot square as a standard action. The paste can be ignited with
          another standard action by striking it from an adjacent square with a
          metal weapon or object. When thus ignited or otherwise exposed to
          fire, the jelly explodes, dealing 2d6 points of fire damage to
          creatures and unattended objects within the treated square. If the
          ignited square is adjacent to another square containing blasting
          jelly, that square ignites as well. Blasting jelly deals full damage
          to objects made of stone or softer material. Blasting jelly decays
          relatively quickly when exposed to air, becoming inert after 4 hours
          if not ignited.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 45
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: jzb7PAh1HsnuIAs7
    _key: '!actors.items!CCkERpkJdM2ZhIti.jzb7PAh1HsnuIAs7'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-3.jpg
    name: Blight Tonic
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          153</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Blight tonic increases the potency of a
          creature's disease attack transmitted by physical contact, such as a
          dire rat's filth fever. The next time a creature must save against the
          drinker's disease save DC, the DC for the initial infection increases
          by +2. The tonic lasts for 10 minutes or until the next time a
          creature must save against the drinker's disease DC, whichever comes
          first.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 150
      weight:
        value: 1
    type: consumable
  - _id: X6ROHpoKHOsngIPA
    _key: '!actors.items!CCkERpkJdM2ZhIti.X6ROHpoKHOsngIPA'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-red.jpg
    name: Blightburn Paste
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Blood of the Sea pg.
          18</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When you release this vial of alchemical
          particles into the water as a standard action, the particles
          immediately neutralize the scent of exposed blood within 20 feet,
          rendering the blood undetectable by scent (to a hunting shark, for
          example). Blood neutralizer has no effect on any blood that enters the
          area after the particles have been used. Blood neutralizer can be
          crafted with a successful DC 25 Craft (alchemy) skill
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: i1oAWRoL8HufPT88
    _key: '!actors.items!CCkERpkJdM2ZhIti.i1oAWRoL8HufPT88'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-red.jpg
    name: Bloodblock
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 103</em>,
          <em>Adventurer's Armory pg. 19</em>, <em>Advanced Player's Guide pg.
          184</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This gooey, pinkish substance helps treat
          wounds. Using a dose gives you a +5 alchemical bonus on Heal checks
          for providing first aid, treating wounds made by caltrops or similar
          objects, or treating deadly wounds. A dose of bloodblock ends a bleed
          effect as if you had made a DC 15 Heal check. When treating deadly
          wounds, using a dose of bloodblock counts as one use of a healer's kit
          (and grants the +5 bonus stated
          above).<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
    type: consumable
  - _id: myW7W6tVd0mT7ffT
    _key: '!actors.items!CCkERpkJdM2ZhIti.myW7W6tVd0mT7ffT'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/survival/rope-wrapped-brown.webp
    name: Bloodvine Rope
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          207</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This 50-foot length of tough, lightweight
          rope is made from alchemically treated bloodvine, a rare
          scarlet-colored vine that grows only in warm jungle environments.
          Though prized by climbers for its durability, bloodvine can also be
          used to bind creatures. Bloodvine rope has a hardness of 5 and 10 hit
          points, and can be broken with a DC 30 Strength check. A creature
          bound by bloodvine rope can escape with a DC 35 Escape Artist check or
          a DC 30 Strength check.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 30
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 200
      subType: misc
      weight:
        value: 5
    type: consumable
  - _id: lnJnwbPKXCaK7y7i
    _key: '!actors.items!CCkERpkJdM2ZhIti.lnJnwbPKXCaK7y7i'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/flower-grey-orange.webp
    name: Bloody Mandrake
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          153</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 20; <strong>Yield</strong> 1d4
          doses</p><p><strong>Terrain</strong> any plains or
          swamps</p><p><strong>Preparation</strong> A bloody mandrake must be
          pulped so that its sticky red sap can be gathered, skimmed, and then
          refined into an even stickier paste; this process requires a
          successful DC 15 Craft (alchemy) check and 1d4 hours of work per
          yield.</p><p><strong>Use</strong> One dose of bloody mandrake paste
          smeared on the lips (this is a free action) during spellcasting can be
          used as an additional material component when casting spells that
          remove afflictions and conditions or that provide a morale bonus.
          Doing so grants a +1 bonus to the spell's effective caster
          level.</p><h2>Description</h2>Bloody mandrakes grow from the corpses
          of intelligent creatures who had supernatural powers in life. This
          plant's unsettlingly humanoid-shaped tuber-like roots increase
          fertility and vitality.
      flags:
        dictionary:
          Category: Herbs
      price: 15
      subType: misc
    type: consumable
  - _id: lE5DG0EhEqcXvbkb
    _key: '!actors.items!CCkERpkJdM2ZhIti.lE5DG0EhEqcXvbkb'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-gold.webp
    name: Bodybalm
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When this pungent yellow powder is boiled
          in water and given to a creature to drink, it provides the attending
          healer a +5 alchemical bonus on Heal checks for providing long-term
          care, treating poison, and treating
          disease.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
    type: consumable
  - _id: sEBIyDUiyArinos4
    _key: '!actors.items!CCkERpkJdM2ZhIti.sEBIyDUiyArinos4'
    _stats:
      coreVersion: '12.331'
    img: icons/weapons/guns/gun-worn-steel.webp
    name: Bomb Launcher
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          117</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>These odd looking, egg-shaped
          contraptions have cleverly placed fins that improve bombs' accuracy.
          Goblin alchemists use these special containers to make their bombs
          more accurate when thrown long distances. Using a bomb launcher when
          throwing a bomb increases the bomb's range increment to 30 feet (or
          increases the range increment of a bomb with the rocket bomb discovery
          to 70 feet). Bomb launchers are destroyed when
          used.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 10
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: G1JtV7kWJYlK0ygW
    _key: '!actors.items!CCkERpkJdM2ZhIti.G1JtV7kWJYlK0ygW'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Bone Paste
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeoneer's Handbook pg.
          26</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Typically stored in an airtight leather
          wineskin cured with rare preservative unguents, bone paste is a
          powerful alchemical sealant with special deteriorative properties.
          When squeezed out of its container and exposed to air, bone paste
          quickly hardens, so in order to apply it to a surface or object one
          must typically squeeze the paste directly onto the material to be
          affected. Once applied, bone paste cements itself to the object in
          just seconds, and hardens into a flaky cast. If applied to any
          unattended organic material or surface (such as wood, paper, hide, or
          rope), after 1 hour, bone paste undergoes another alchemical reaction
          and begins to eat away at the material, dealing 1d4 points of damage
          each round for 1d6+1 rounds, eating away first at the part of the
          object to which it was applied and spreading briefly to other parts of
          the object before dissipating and leaving a small amount of residual
          dust. Bone paste ignores an organic object's hardness, and does not
          deal damage to inorganic objects or surfaces (such as metal, stone, or
          ceramic). One pouch of bone paste is enough to cover 1 square foot of
          surface, or (because of waste and spills) up to 20 smaller
          applications of approximately 2 square inches
          each.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 75
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: Uy7lE2zT1rJPE1z2
    _key: '!actors.items!CCkERpkJdM2ZhIti.Uy7lE2zT1rJPE1z2'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/rosaecia-red.webp
    name: Bone Reed
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          153</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 24; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> any
          swamps</p><p><strong>Preparation</strong> A bone reed must be pressed
          and dried. This process requires a successful DC 10 Craft (alchemy)
          check and takes 8 hours to complete.</p><p><strong>Use</strong> A
          creature that sleeps for at least 8 hours in 1 day with a bone reed
          bound to one of its arms or legs heals double the normal ability
          damage and hit point damage (or triple with full bed rest). A bone
          reed loses its effectiveness after use. Binding a bone reed to a limb
          requires 1 minute of work.</p><h2>Description</h2>This aquatic grass
          resembles translucent white horsetail.
      flags:
        dictionary:
          Category: Herbs
      price: 75
      subType: misc
    type: consumable
  - _id: CcrvQuqzSO5eP22E
    _key: '!actors.items!CCkERpkJdM2ZhIti.CcrvQuqzSO5eP22E'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/mortar-liquid-pink.webp
    name: Boniface Paint
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Guide pg. 44</em>,
          <em>Pathfinder #106: For Queen and Empire pg.
          75</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This thick whitewash is laced with exotic
          oils, and it dries to a lovely finish run through with subtle swirls.
          Difficult to notice, these patterns help obscure seams and details in
          whatever the paint coats; the Perception DC to find a secret door or
          hidden compartment on a surface covered in boniface paint increases by
          5. One bucket of boniface paint covers up to a 10-foot-by-10-foot
          area, and its concealing effects last for 1 year. Crafting a bucket of
          boniface paint requires a successful DC 20 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 15
      subType: misc
      weight:
        value: 5
    type: consumable
  - _id: bHR00Yb34WruzCd3
    _key: '!actors.items!CCkERpkJdM2ZhIti.bHR00Yb34WruzCd3'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/hair-tuft-brown-gold.webp
    name: Bore Brush
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the Wastes pg.
          14</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This spiraled metal rod has alchemically
          treated bristles that can be used in the barrel of an early or
          advanced firearm to liquefy grime and bullet fouling while leaving a
          thin protective film in the bore. Using this brush is a standard
          action, and the protective film grants a 5-foot alchemical bonus to
          the firearm's first range increment and a +1 alchemical bonus on
          attack rolls. These effects last for 1 hour or until the firearm is
          fired. A newly crafted bore brush contains 5 applications. Crafting a
          bore brush requires a successful DC 15 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 75
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: 7PtOMcDqGsWeBF75
    _key: '!actors.items!CCkERpkJdM2ZhIti.7PtOMcDqGsWeBF75'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-8.jpg
    name: Bottled Musk
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Monster Hunter's Handbook pg.
          26</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This glass vial contains alchemically
          preserved musk from a single variety of creature. Sniffing bottled
          musk provides a +4 circumstance bonus on Survival checks to track
          creatures of the same variety by scent. Additionally, bottled musk can
          be used as an additional spell component for the following spells to
          modify the spell's effects.</p><p><em>Detect undead</em>: Functions as
          written, but detects creatures of the musk's associated creature
          type.</p><p><em>Locate creature</em>: Detects the same variety of
          creature as the musk (for example, using bison musk detects only
          bison, not all herd animals or animals), and provides a +2 bonus on
          caster level checks to overcome <em>nondetection</em>.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: 0n2BobaIgGbAmIrY
    _key: '!actors.items!CCkERpkJdM2ZhIti.0n2BobaIgGbAmIrY'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/magic-yellow.jpg
    name: Bottled Sunlight
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Undead Slayer's Handbook pg.
          13</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>As a standard action, this ornate
          rectangular jar can be vigorously shaken to cause its contents to mix
          and activate. Once shaken, the contents of the jar shed light as a
          sunrod for 6 hours. A jar of activated bottled sunlight can be thrown
          as a splash weapon with a range increment of 10 feet. Upon striking a
          solid object, the bottled sunlight creates a 30-foot-radius burst of
          natural sunlight that persists for 1 round, after which all light from
          the jar fades. Throwing an inactive jar of bottled sunlight destroys
          the item, leaving only a smoldering pile of ashes where it struck.
          Crafting this item requires a successful DC 30 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 30
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 200
      subType: weapon
      weight:
        value: 2
    type: consumable
  - _id: upxodEVTtlSOGt0A
    _key: '!actors.items!CCkERpkJdM2ZhIti.upxodEVTtlSOGt0A'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Brawler's Brew
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          22</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This tincture is made of thick syrup
          dissolved in potent alcohol. For 1 hour after drinking this tincture,
          you gain DR 1/slashing or piercing and can ignore pain effects. This
          numbing of your body causes you to take a -2 penalty on Fortitude
          saving throws for the same duration.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Tincture
      price: 150
    type: consumable
  - _id: pSRC0prgI1DJenXR
    _key: '!actors.items!CCkERpkJdM2ZhIti.pSRC0prgI1DJenXR'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-8.jpg
    name: Bunk
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          19</p><p><strong>Price</strong> 5 cp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Bunk is a slang term for fillers used to
          dilute drugs that are proffered as pure-grade narcotics. A drug mixed
          with bunk is less potent; its effects last 1d6 x 10 minutes for each
          hour they would normally last. The presence of bunk can be detected
          with a successful Craft (alchemy) check (DC equal to the drug
          manufacturer's Craft [alchemy] check - 10).</p><p>The duration and
          intensity of the drug's harmful aftereffects and ability damage are
          not reduced, as the additives in bunk are often toxic or dangerous in
          their own right. When a creature takes a dose of a drug containing
          bunk, the creature must attempt a Fortitude save (DC 10 + 1d10).
          Failure causes the creature to become sickened for 1d4 hours and take
          1d2 points of ability damage to a random ability score.<h2>Alchemical
          Recipe</h2><strong>Recipe</strong> (1 salt + 1 urea)/filtration;
          <strong>Craft</strong> 15</p><p><strong>Time</strong> 10 minutes;
          <strong>Tools</strong> filter; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 0.05
      subType: drug
    type: consumable
  - _id: ttuKDadw9EX9vr8I
    _key: '!actors.items!CCkERpkJdM2ZhIti.ttuKDadw9EX9vr8I'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/orb-tassle-blue-yellow.webp
    name: Buoyant Balloon
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This fist-sized alchemically treated
          animal bladder is tightly sealed around a small wooden grip. By giving
          the handle a sharp twist you break a tiny glass ampoule just inside
          the bladder, filling the bag with buoyant gas and causing it to swell
          into a 3-foot-diameter sphere. Inflating the balloon is a move action.
          Once filled, the balloon floats upward at a speed of 60 feet per
          round. The balloon can lift up to 20 pounds of weight as it rises,
          though carrying more than 10 pounds reduces its speed to 30 feet per
          round. Multiple balloons attached to a single object add their
          carrying capacities together when determining how much weight they can
          lift. If a balloon is not held or bound in place in some manner, it
          continues to rise until it reaches a height of 600 feet, or until 10
          minutes have passed, after which it pops or deflates and is
          destroyed.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 10
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: VLEhAxUjI3lQ3ZnA
    _key: '!actors.items!CCkERpkJdM2ZhIti.VLEhAxUjI3lQ3ZnA'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/burner-steel-grey.webp
    name: Burner
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the Sands pg.
          28</p><p><strong>Price</strong> 3 gp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>A burner is a metal or ceramic cylinder,
          open at the top and perforated with air holes along the sides, often
          with sliding vents to open or close these apertures as the fire inside
          requires. A burner is used to burn fuel pellets at night without
          giving off light that would reveal the user's position to unfriendly
          eyes in the wide, empty desert lands. In places where charcoal is a
          popular fuel, burners are made of heavier-gauge metal. Lit coals can
          be banked with ashes and kept hot, either for later ignition or simply
          so the burner can serve as an improvised radiant heater.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 3
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: VwSQ7TFNZAA42q6h
    _key: '!actors.items!CCkERpkJdM2ZhIti.VwSQ7TFNZAA42q6h'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/buds-red-green.webp
    name: Camouflage Lichen
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          147</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Though oreads with obviously stony
          features are rare, almost all oreads have an essentially earthen
          quality to their skin that makes it perfect for cultivating plant
          life. Where other races would be appalled at the thought of plants
          taking root in their flesh, oreads see it as a natural and healthy
          extension of their elemental nature. For this reason, oread herbalists
          developed several strains of moss and lichen specifically adapted to
          grow on their bodies. Camouflage lichen is the most common variety of
          these oread plants. It takes 1 minute to apply a paste of camouflage
          lichen spores to the skin, and an additional 24 hours for the fungus
          to sprout. After this time, the oread is covered in a thin green layer
          of living plant matter, granting her a +4 bonus on Stealth checks made
          in green forest and jungle environments. Red-orange and white
          varieties exist, providing bonuses in appropriately colored
          environments (red-orange among autumn leaves or in red deserts, white
          in snow, and so on). Camouflage lichen has a short lifespan; it
          withers and dies 3 days after being applied, crumbling away into
          harmless powder. This item only works on oreads and other creatures
          with rocklike bodies.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
    type: consumable
  - _id: oCAy4winUnOyKtAO
    _key: '!actors.items!CCkERpkJdM2ZhIti.oCAy4winUnOyKtAO'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/lights/torch-brown.webp
    name: Candlerod
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Similar to but weaker than a sunrod, this
          stick glows like a candle when struck and lasts for 12
          hours.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 1
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: ypQQtvmTTwKUltGW
    _key: '!actors.items!CCkERpkJdM2ZhIti.ypQQtvmTTwKUltGW'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-blue.webp
    name: Caphorite Dust
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeoneer's Handbook pg.
          26</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This bottle of viscous blue oil
          sublimates slightly when exposed to air. When poured over water, the
          oil pools on the surface and takes 1 round to spread out from the
          point of origin in a 20-foot radius. At the end of this round, the
          cardice oil flash-freezes the surface of the water, creating an ice
          sheet over the affected area (<em>Pathfinder RPG Core Rulebook
          </em>430). Any 5-foot square of this ice can support up to 200 pounds
          of weight. Weight in excess of this amount causes the entire sheet to
          crack and quickly break up. This ice sheet becomes unstable and breaks
          up on its own after 1 hour, or 20 minutes in a hot climate. Any
          creature whose bare skin comes in contact with cardice oil takes 1d6
          points of nonlethal damage each round because of the chemical's
          volatile nature, but the oil is ineffective as a splash
          weapon.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      weight:
        value: 1
    type: consumable
  - _id: uJcK9BgADZOhPDdb
    _key: '!actors.items!CCkERpkJdM2ZhIti.uJcK9BgADZOhPDdb'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-mixing.webp
    name: Casting Plaster
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 103</em>,
          <em>Advanced Player's Guide pg. 184</p><p><strong>Price</strong> 5 sp;
          <strong>Weight</strong> 5 lbs.</p><p><strong>Category</strong>
          Alchemical Tools</p><h2>Description</h2>This white, dry powder mixes
          with water to form a paste, which hardens over the course of an hour
          to create a solid material. It can be used to make casts of footprints
          or carvings, fill in gaps or cracks in walls, or (if applied over a
          cloth wrapping) create a cast for a broken bone. Hardened plaster has
          hardness 1 and 5 hit points per inch of thickness. A 5-pound clay pot
          of plaster can cover about 5 square feet of flat space to a depth of 1
          inch, five Medium forearm or lower-leg casts, two Medium full-arm or
          full-leg casts, or twice as many casts for a Small
          creature.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 0.5
      subType: misc
      weight:
        value: 5
    type: consumable
  - _id: 3uLOyGeEdAJd2FGd
    _key: '!actors.items!CCkERpkJdM2ZhIti.3uLOyGeEdAJd2FGd'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-liquid-white.webp
    name: Chemical Ward
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This sticky light blue paste grows
          pleasantly cool to the touch whenever it is exposed to light.
          Spreading a dose on your face and hands takes a full-round action and
          grants you a +2 alchemical bonus on saves to resist hot weather. In
          areas of bright light this bonus increases to +4, while in areas of
          dim light or darkness it is negated. A dose of chill cream lasts for 1
          hour after being applied. A newly crafted bottle of chill cream holds
          5 doses.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 15
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: qRcHn7sliIf8Nqa3
    _key: '!actors.items!CCkERpkJdM2ZhIti.qRcHn7sliIf8Nqa3'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/gems/gem-cluster-blue-white.webp
    name: Clatterstone
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Darklands pg.
          30</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Comprising several chunks of magnetized
          ore connected by twine, a clatterstone creates an intense racket when
          it strikes a solid surface. The combination of magnetic disturbances,
          noise, and vibrations interferes with blindsight. A creature using
          blindsight perceives a detonated clatterstone as a Medium target until
          it attempts to interact with the perceived 'creature' or identifies it
          with some other sense, such as darkvision. You can throw a
          clatterstone as a ranged attack with a range increment of 20 feet, and
          it remains active for 1d4+1 rounds before becoming inert.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 30
      subType: misc
      weight:
        value: 2
    type: consumable
  - _id: XvOPz26v7iA9WNYq
    _key: '!actors.items!CCkERpkJdM2ZhIti.XvOPz26v7iA9WNYq'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/tech/sensor-yellow.webp
    name: Clockwork Prowler
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder Society Field Guide pg.
          48</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This 2-foot-tall wooden clockwork
          automaton is shaped roughly like a short-backed, wheeled chair. When
          wound up with the folding handle at its side, the clockwork prowler
          trundles forward at a speed of 15 feet per round for up to 2 minutes.
          A clockwork prowler cannot move through difficult terrain. Each round
          of vigorous winding powers 2 rounds of movement. If its brake is not
          released immediately after winding, the prowler loses 1 round of
          movement for every 2 rounds it sits idle. The clockwork prowler can
          carry up to 20 pounds of weight at full speed, or up to 50 pounds at a
          speed of 10 feet. Higher weights prevent the prowler from moving. A
          clockwork prowler has hardness 5 and 90 hit points, and when in motion
          has AC 12 (a motionless clockwork prowler has AC 5).
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 500
      subType: misc
      weight:
        value: 25
    type: consumable
  - _id: 8axXjpCNsoKzVtri
    _key: '!actors.items!CCkERpkJdM2ZhIti.8axXjpCNsoKzVtri'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/tech/sensor-yellow.webp
    name: Clockwork Prowler (Advanced)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder Society Field Guide pg.
          48</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>A more advanced version of the clockwork
          prowler, this device is more metal than wood. It moves at a speed of
          20 feet and can be programmed with up to four right-angle turns. Each
          turn requires 1 round to program along with a DC 15 Disable Device
          check. If this check is failed, roll d% each time the prowler attempts
          to turn. On a result of 1-10, it fails to turn. On a result of 11-20,
          it instead turns on the next round. An advanced clockwork prowler can
          carry up to 60 pounds of weight at full speed, or up to 120 pounds at
          a speed of 10 feet. It has hardness 10, 150 hit points, and when in
          motion has AC 15 (a motionless advanced clockwork prowler has AC 8).
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 1500
      subType: misc
      weight:
        value: 30
    type: consumable
  - _id: xLHbOE2UhmciMQhT
    _key: '!actors.items!CCkERpkJdM2ZhIti.xLHbOE2UhmciMQhT'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/lily-grey-orange.webp
    name: Cloud Puff
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          153</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 18; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> any
          mountains</p><p><strong>Preparation</strong> After soaking in salt
          water for 1 hour, a cloud puff must be dried in a delicate process
          that requires it to be turned three times per hour for 4 hours. This
          requires a successful DC 12 Craft (alchemy)
          check.</p><p><strong>Use</strong> By crushing a dried cloud puff and
          inhaling the spores, a creature becomes light-headed and its mind
          grows resistant to outside influences. For the next hour, the creature
          gains a +2 alchemical bonus on saving throws against mind-affecting
          effects but takes a -2 penalty on Wisdom-based skill
          checks.</p><h2>Description</h2>The spores of this odorous pale-gray
          fungus cause a euphoric light-headedness.
      flags:
        dictionary:
          Category: Herbs
      price: 100
      subType: misc
    type: consumable
  - _id: dMnN4gPf6cALLUsR
    _key: '!actors.items!CCkERpkJdM2ZhIti.dMnN4gPf6cALLUsR'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-pink.webp
    name: Cooking Powder
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Guide pg. 44</em>,
          <em>Pathfinder #106: For Queen and Empire pg.
          75</p><p><strong>Price</strong> 2 gp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>By boiling certain seeds with handfuls of
          rust, halfling alchemists create these red flakes, which smolder
          slowly when touched by a spark or flame. If sprinkled over food and
          lit, a handful of cooking powder can cook meat or vegetables in 20
          minutes without light or significant heat, though it lends a metallic
          flavor to any foods. If held to a living creature's flesh, smoldering
          cooking powder deals 1 point of fire damage per minute for 20 minutes.
          One jar of cooking powder is enough to cook up to 5 pounds of food in
          1-pound increments. Crafting a jar of cooking powder requires a
          successful DC 15 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 2
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: CH926xkRknxLJQ82
    _key: '!actors.items!CCkERpkJdM2ZhIti.CH926xkRknxLJQ82'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/stone/ore-chunk-orange-red.webp
    name: Coral Boulder
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeoneer's Handbook pg.
          26</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This sponge-sized brick is actually a
          desiccated chunk of living coral. When exposed to at least 1 gallon of
          water, it expands into a full-sized boulder within 1 minute. A fully
          expanded coral boulder is an irregular sphere 3 feet in diameter. An
          expanded boulder has a hardness of 7, has 55 hit points, and weighs 8
          pounds. The water in a coral boulder slowly evaporates if it's left in
          a dry environment, and the boulder shrinks back to its original size
          in about a week. If dropped in water, a coral boulder sinks straight
          down, and is not moved by tides or flowing
          water.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
    type: consumable
  - _id: rui9Ajf5lxSyOYjU
    _key: '!actors.items!CCkERpkJdM2ZhIti.rui9Ajf5lxSyOYjU'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/magic-yellow.jpg
    name: Crucible
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          25</p><p><strong>Category</strong>
          Concoctions</p><h2>Description</h2>This sugary blue drink, often cut
          with mint to reduce the cloying sweetness, brightens your demeanor and
          sweetens your voice, granting a +2 alchemical bonus on Diplomacy
          checks. It renders you naive and perilously trusting, however,
          imparting a -4 penalty on your Sense Motive checks.
      flags:
        dictionary:
          Category: Concoctions
      price: 50
    type: consumable
  - _id: LnE09dzLde8am6M6
    _key: '!actors.items!CCkERpkJdM2ZhIti.LnE09dzLde8am6M6'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/lights/lantern-bullseye-signal-copper.webp
    name: Dahak's Fire
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          111</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This lantern does not burn oil, but
          instead burns shadowcloy (see below). When shadowcloy is used as its
          fuel, this lantern creates a strange, hazy darkness that decreases the
          light level for 30 feet around it by one step . Unlike when shadowcloy
          is thrown at a single target, this haze does not decrease natural
          darkness to supernatural darkness. One flask of shadowcloy fuels a
          darklight lantern for 1 minute.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 20
      subType: misc
      weight:
        value: 3
    type: consumable
  - _id: Z6kNcMWW0Bp1tviC
    _key: '!actors.items!CCkERpkJdM2ZhIti.Z6kNcMWW0Bp1tviC'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/magic-yellow.jpg
    name: Darting-Eye Concoction
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          26</p><p><strong>Category</strong>
          Concoctions</p><h2>Description</h2>This effervescent concoction
          improves your sensory reaction time, providing a +2 alchemical bonus
          on Perception checks. However, the mental hyperactivity it creates
          imparts a -1 penalty on your Will saving throws.
      flags:
        dictionary:
          Category: Concoctions
      price: 50
    type: consumable
  - _id: iUvGFUOyCKcLWDpo
    _key: '!actors.items!CCkERpkJdM2ZhIti.iUvGFUOyCKcLWDpo'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-empty.jpg
    name: Dead Air Vial
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Blood of the Elements pg.
          19</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Within this corked vial is a tiny sample
          of what is known as 'dead air.' Heavy, still, and of unknown origin,
          pockets of dead air becalm airships and smother crews in remote parts
          of the Plane of Air. When you open a dead air vial, invisible dead air
          fills a 20-foot-radius area centered on you. The affected area becomes
          devoid of breathable air. Creatures that breathe air must hold their
          breath or suffocate in an area of dead air, though sound, fire, and
          other effects that rely on a stable atmosphere are unaffected.
          Undisturbed, the dead air dissipates in 1 minute. A moderate wind (11+
          mph) disperses the dead air in 4 rounds; a strong wind (21+ mph)
          disperses the dead air in 1 round. This item can be crafted with a
          successful DC 25 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 200
    type: consumable
  - _id: 2zGmUhZKh3nOjDDa
    _key: '!actors.items!CCkERpkJdM2ZhIti.2zGmUhZKh3nOjDDa'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-blue.jpg
    name: Deep Breath
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Darklands pg.
          30</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Darklands explorers who frequently run
          afoul of troglodytes, pockets of natural gas, and toxic fumes from
          magma flows use this dense flask to ease their breathing. You can open
          the flask as a standard action or throw it as a splash weapon. When
          opened or broken, the flask releases a burst of cleansing, breathable
          air in a 10-foot-radius burst, providing a +4 alchemical bonus on
          saving throws against gases, inhaled poisons, or other breathable
          hazards. The cloud of fresh air lasts for 1d4 rounds. If you hit a
          creature that has the stench ability with a thrown flask of deep
          breath, the DC of its stench is reduced by 4 for the duration of the
          cloud.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: 6B2RvcvWfEAHqe3k
    _key: '!actors.items!CCkERpkJdM2ZhIti.6B2RvcvWfEAHqe3k'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Defoliant
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This milky fluid can be mixed with water
          to quickly kill light and medium vegetation. One flask of defoliant
          kills light brush and small trees in 50 5-foot squares. Light
          vegetation (anything but trees) dies within 1 hour and can be cleared
          at a rate of 10 minutes per 5-foot square (representing uprooting dead
          plants and breaking stumps into gravel-sized pieces), leaving barren
          ground. Medium vegetation (anything but massive trees) dies in 2 hours
          and can be cleared at a rate of 1 hour per 5-foot square. Massive
          trees can usually survive a single dose of defoliant, and using
          defoliant doesn't make clearing them any easier. Defoliant can be used
          as a splash weapon against plant creatures. A direct hit with the
          undiluted fluid deals 1d6 hit points of damage, 1 point of Strength
          damage, and 1 point of Constitution damage (Fortitude DC 20 negates
          the Strength and Constitution damage); plant creatures within 5 feet
          of the target take 1 hit point of
          damage.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 30
    type: consumable
  - _id: u2oxOfR4QrgMVq2t
    _key: '!actors.items!CCkERpkJdM2ZhIti.u2oxOfR4QrgMVq2t'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-4.jpg
    name: Deodorizing Agent (Vial)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Animal Archive pg.
          13</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Coating a creature in a vial of this
          milky, odorless substance takes 1 minute and renders it scentless for
          1d3 hours. Creatures that rely on scent for locating creatures do not
          gain the benefit of this ability against a creature affected by a dose
          of deodorizing agent.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 30
    type: consumable
  - _id: I6G2Va0qxJ0ty4k8
    _key: '!actors.items!CCkERpkJdM2ZhIti.I6G2Va0qxJ0ty4k8'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Desna's Star
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          22</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This dark green liquid has a pungent
          odor. For 1 hour after you drink this tincture, your muscles
          instinctively react to danger and you gain a +2 dodge bonus to AC.
          Your involuntary muscle movement causes you to take a -2 penalty on
          attack rolls for the same duration.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Tincture
      price: 300
    type: consumable
  - _id: A28ZUiFerBJ8z8Ne
    _key: '!actors.items!CCkERpkJdM2ZhIti.A28ZUiFerBJ8z8Ne'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/clover-red.webp
    name: Draconic Perfume
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          153</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 18; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> any forests or
          mountains</p><p><strong>Preparation</strong> The petals of a dragon
          rose must be delicately removed from the stem and then soaked in a
          mixture brewed from the flower stalk's sap for 2 hours; this requires
          a successful DC 15 Craft (alchemy) check.</p><p><strong>Use</strong> A
          dose of prepared dragon rose petals crushed in the hand and then
          smeared on a weapon (this is a standard action) infuses the weapon
          with a magic aura. For 1 hour, the weapon can bypass DR/magic,
          although it doesn't gain any bonus on attack or damage
          rolls.</p><h2>Description</h2>The vivid and thorny dragon rose is
          admired for its hardiness but is difficult to cultivate.
      flags:
        dictionary:
          Category: Herbs
      price: 25
      subType: misc
    type: consumable
  - _id: JCb8ElfLvGAQQevr
    _key: '!actors.items!CCkERpkJdM2ZhIti.JCb8ElfLvGAQQevr'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/dandelion-pod-blue.webp
    name: Dragon's Blood
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          153</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 30; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> anywhere the boundaries between
          the Material Plane and the Dimension of Dreams grow
          thin</p><p><strong>Preparation</strong> The fibrous outer layer of the
          lichen must be gently scrubbed away, exposing the soft interior, which
          must then be allowed to dry after being sprinkled with various
          alchemical powders. This requires a successful DC 25 Craft (alchemy)
          check and 8 hours of work.</p><p><strong>Use</strong> A creature that
          sleeps for at least 8 hours with a dose of dream lichen in contact
          with its body has vivid dreams in which it endures and recovers from a
          supernatural affliction. Upon waking, the creature can attempt a new
          saving throw against a single curse or mind-affecting effect from
          which it is currently suffering. Alternatively, the user automatically
          succeeds at a saving throw to remove a temporary negative
          level.</p><h2>Description</h2>This multicolored, shimmering lichen
          grows in places where powerful magical creatures have slept and
          dreamt.
      flags:
        dictionary:
          Category: Herbs
      price: 2000
      subType: misc
    type: consumable
  - _id: vv3ZvwEiGI0lKHKA
    _key: '!actors.items!CCkERpkJdM2ZhIti.vv3ZvwEiGI0lKHKA'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-liquid-white.webp
    name: Drought Powder
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Darklands pg.
          30</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This unique, salty alchemical powder is
          crafted in Darklands communities where fresh water is either scarce or
          guarded by dangerous predators. Consuming 1 dose allows you to go
          without water for 3 days instead of 1, in growing discomfort but
          without any negative effects. After this time, you must attempt a
          Constitution check once every 6 hours instead of once per hour to
          avoid taking nonlethal damage. One dose of drought powder functions
          for 1 week, after which penalties for thirst accrue at their normal
          pace (<em>Pathfinder RPG Core Rulebook 444</em>).
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 5
      subType: misc
    type: consumable
  - _id: 3wu9fnVadwU1jwPN
    _key: '!actors.items!CCkERpkJdM2ZhIti.3wu9fnVadwU1jwPN'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-8.jpg
    name: Duskeye
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Wild pg.
          9</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This liquid makes the eyes more receptive
          to light for 4 hours. The user gains low-light vision, but also
          suffers from light sensitivity for the duration. Crafting duskeye
          requires a successful DC 16 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 16
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
    type: consumable
  - _id: bWIhGXc6lyt7EtuV
    _key: '!actors.items!CCkERpkJdM2ZhIti.bWIhGXc6lyt7EtuV'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-liquid-white.webp
    name: Ectoplasmic Tracer
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Undead Slayer's Handbook pg.
          13</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This small canister has a hand pump,
          allowing it to forcefully eject the semi-ethereal green concoction
          held within. Spraying a creature with ectoplasmic tracer is a ranged
          touch attack with a range increment of 10 feet. A single canister
          holds enough ectoplasmic tracer to coat one Medium or smaller
          incorporeal creature. When coated with ectoplasmic tracer, an
          incorporeal creature leaves behind a trail of vibrant mucus that
          allows it to be tracked by mundane means. Calculate the Survival DC to
          track an incorporeal creature covered in ectoplasmic tracer as though
          you were following tracks left on soft ground. Once discharged,
          ectoplasmic tracer dissolves after 1d4 days. Ectoplasmic tracer has no
          effect when sprayed on a corporeal creature. Crafting this item
          requires a successful DC 20 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
      weight:
        value: 7
    type: consumable
  - _id: 02KGiGVzsXvyriG6
    _key: '!actors.items!CCkERpkJdM2ZhIti.02KGiGVzsXvyriG6'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/survival/rope-wrapped-tan.webp
    name: Efreeti Cord
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Originally discovered by dwarven
          alchemists working with adamantine dust, efreeti cord is a viscid
          length of string approximately 18 inches long and blue-gray in color.
          It can be purchased in greater lengths by multiplying the price for
          every 18 inches or fraction thereof. Flexible and sticky, a length of
          efreeti cord can be carefully shaped into almost any pattern, draped
          upon an object, or wrapped around a fixture, and will stay in place
          until activated. Once activated (using an efreeti switch; see below),
          efreeti cord rapidly heats up, and after 1 round becomes a white-hot
          cord of fire. In the first round, the cord deals 3d6 points of fire
          damage to an object. This damage ignores any hardness less than 10,
          and is not halved for an object. The cord continues to burn for 2
          additional rounds, dealing 2d6 points of fire damage the first
          additional round and 1d6 points the
          second.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 10
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
    type: consumable
  - _id: PcqzfcO2GpHTwzzO
    _key: '!actors.items!CCkERpkJdM2ZhIti.PcqzfcO2GpHTwzzO'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/feather-red-.webp
    name: Efreeti Switch
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>An efreeti switch is the activation
          device for efreeti cord; it measures approximately 6 inches in length
          and is made of a supple, red-brown alchemical compound. It is not
          consumed when activating a length of cord, and it can be used with any
          length of efreeti cord. It's possible to key lengths of efreeti cord
          to a specific switch; however, this doubles the price of both the
          efreeti cord and the switch.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 10
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
    type: consumable
  - _id: Bmld50cjzDANIci1
    _key: '!actors.items!CCkERpkJdM2ZhIti.Bmld50cjzDANIci1'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-red.jpg
    name: Elemental Breath
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          159</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This vial at first seems to be empty, but
          when it's opened, a rush of wind issues forth from within. When
          elemental breath is inhaled (as drinking a potion) by an air-breathing
          creature, that creature does not need to breath air for 10 rounds. A
          vial of elemental breath must be inhaled on the round it was opened to
          gain this effect. If it is not, the item is wasted.
          <h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 80
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: 4n3gLdBOSndIks8h
    _key: '!actors.items!CCkERpkJdM2ZhIti.4n3gLdBOSndIks8h'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-liquid-red.webp
    name: Elemental Proofing
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dragonslayer's Handbook pg.
          26</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This alchemical gel comes in a large vial
          with a brush built into the stopper. It's used to coat the surface of
          objects, protecting them from a specific type of energy damage. Though
          elemental proofing is not harmful to the objects it coats, it acts as
          a contact poison to living creatures. Touching elemental proofing
          directly causes 1d4 points of damage and 1d4 rounds of sickness (a DC
          14 Fortitude save negates the latter effect). Creatures immune to
          poison are likewise immune to the effects of contacting elemental
          proofing but gain no benefits from its application. When applied to
          weapons or armor, elemental proofing confers resistances to the coated
          object, but none to the wearer.</p><p>Each vial of elemental proofing
          contains enough gel to coat one Large object, or two Medium or smaller
          objects. Once the applied gel dries, it absorbs 10 points of the
          specified type of elemental damage each round. Elemental proofing
          wears off after 24 hours, and multiple applications of the gel do not
          stack. There are four different types of elemental proofing: acid
          proofing provides acid resistance 10, flame proofing provides fire
          resistance 10, frost proofing provides cold resistance 10, and
          lightning proofing provides electricity resistance 10.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: Of4GRqe9pUVF0tQO
    _key: '!actors.items!CCkERpkJdM2ZhIti.Of4GRqe9pUVF0tQO'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/vial-orange.webp
    name: Embalming Fluid
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This fluid is used to preserve corpses,
          whether for later dissection, taxidermy, necromancy, or magic such as
          raise dead. Embalming fluid is technically a poison, and using it
          makes a corpse unpalatable to most animals and vermin, though
          corpse-eating undead don't mind the taste. Treating a corpse with
          embalming fluid takes 1 hour and a successful DC 25 Heal check. The
          embalmed corpse decays at half the normal rate (each day dead counts
          as half a day for the purpose of <em>raise
          dead</em>).<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      weight:
        value: 10
    type: consumable
  - _id: gHiJ0dB2YpgwyiW8
    _key: '!actors.items!CCkERpkJdM2ZhIti.gHiJ0dB2YpgwyiW8'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Exemplar Weapon Salve
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          22</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This tincture contains powdered plant
          roots and comes in cold-weather and hot-weather varieties. For 6 hours
          after drinking the tincture, you gain a +5 alchemical bonus on
          Fortitude saving throws to resist the effects of the chosen
          temperature. The tincture interferes with blood flow, causing you to
          take a -2 penalty on all other Fortitude saving throws for the same
          duration.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Tincture
      price: 150
    type: consumable
  - _id: siT30JQ8awDtSF1U
    _key: '!actors.items!CCkERpkJdM2ZhIti.siT30JQ8awDtSF1U'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/cornflower-blue.webp
    name: Fairy Cap
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          153</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 20; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> anywhere near ley
          lines</p><p><strong>Preparation</strong> A fairy cap must be gently
          simmered (not boiled) in a mixture of water and other natural
          ingredients for 1 hour; this requires a successful DC 20 Craft
          (alchemy) check. At the end of this preparation time, the yellow
          spots' color changes to bright orange or dark brown-there's a 50%
          chance of either development.</p><p><strong>Use</strong> When eaten
          without proper preparation, a fairy cap is mildly poisonous
          (<em>save</em> Fort DC 13, <em>onset</em> 1 minute, <em>frequency</em>
          1/minute for 6 minutes, <em>effect</em> nauseated for 1 minute,
          <em>cure</em> 1 save), but when properly prepared, it takes on a
          notunpleasant tangy flavor. The final color of a properly prepared
          fairy cap's spots determines its effect when consumed. A cap with
          orange spots causes a Large or smaller creature to grow one size
          category, while one with brown spots causes the eater to shrink one
          size category. These effects function as per <em>enlarge person</em>
          or <em>reduce person</em>, except they can affect any Large or smaller
          living creature; the effects persist for 10 minutes in either case.
          Whether or not it is prepared, a fairy cap is quite chewy, and eating
          it is a full-round action.</p><h2>Description</h2>This toadstool's
          pale-gray cap is stippled with yellow spots. Its presence often
          indicates ley lines or fey bowers nearby.
      flags:
        dictionary:
          Category: Herbs
      price: 250
      subType: misc
    type: consumable
  - _id: eJw1EkL5DDD8NsU6
    _key: '!actors.items!CCkERpkJdM2ZhIti.eJw1EkL5DDD8NsU6'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-blue.webp
    name: False Ectoplasm
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Haunted Heroes Handbook pg.
          11</p><p><strong>Price</strong> 2 gp; <strong>Weight</strong> 2
          lbs.</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>Once exposed to air, this greenish
          alchemical sludge quickly takes on a faint glow. This glow provides
          dim illumination in the area immediately surrounding the fist-sized
          lump of false ectoplasm. This glow-in-the-dark effect lasts for 1 hour
          before the substance begins to decompose into a brownish goo. A
          successful DC 20 Sleight of Hand check allows a user to open a vial of
          false ectoplasm and deposit it on an adjacent surface as a move
          action; a successful opposed Perception check is enough to notice this
          trickery.
      flags:
        dictionary:
          Category: Black Market
      price: 2
      subType: misc
      weight:
        value: 2
    type: consumable
  - _id: P2OPWxAmxvpENWej
    _key: '!actors.items!CCkERpkJdM2ZhIti.P2OPWxAmxvpENWej'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/material-cotton-white.webp
    name: Falsehood Fizz
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When imbibed, this cloudy, pink liquid
          grants you 1d4 uses of alchemical inspiration that can be used only on
          Bluff checks to lie or to deliver secret messages. Additionally, you
          can spend two uses of alchemical inspiration to gain inspiration on a
          saving throw against truth-detecting or truth-forcing magic (such as
          <em>discern lies</em> or <em>zone of truth</em>).</p><p>The benefits
          of falsehood fizz last for 1 hour. During this time, you must roll
          Sense Motive checks twice and take the worse
          result.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 190
    type: consumable
  - _id: 4drcMpNIS0ofCIw4
    _key: '!actors.items!CCkERpkJdM2ZhIti.4drcMpNIS0ofCIw4'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/magic-yellow.jpg
    name: Fear-Killer Concoction
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          27</p><p><strong>Category</strong>
          Concoctions</p><h2>Description</h2>A favorite of Ustalavic alchemists,
          this pale sludge hampers your fear response, granting a +2 alchemical
          bonus on your saves against fear effects. The concoction's necrotic
          components dull healing, however, causing you to regain 2 fewer hit
          points from healing effects (to a minimum of 1 point of healing per
          effect).
      flags:
        dictionary:
          Category: Concoctions
      price: 50
    type: consumable
  - _id: jTzGVrQYZQGNWNo8
    _key: '!actors.items!CCkERpkJdM2ZhIti.jTzGVrQYZQGNWNo8'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-liquid-white.webp
    name: Fellowship Film
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>By eating this thin sheet of glossy
          gelatin, you gain 1d4 uses of alchemical inspiration that can be used
          only on Diplomacy checks. The benefits of fellowship film last for 1
          hour, during which you must roll all Intimidate checks twice and take
          the worse result.<h2>Construction</h2><strong>Craft (Alchemy)</strong>
          DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 190
      subType: misc
    type: consumable
  - _id: ZWXha5NDa4FJdW2M
    _key: '!actors.items!CCkERpkJdM2ZhIti.ZWXha5NDa4FJdW2M'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-green.jpg
    name: Fervor Juice
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Monster Codex pg.
          117</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This foul-tasting alchemical concoction
          grants those that imbibe it ferocity for a short period of time. This
          functions as the universal monster rule of the same name, and lasts
          for 1 hour from the time you ingest the solution. Crafting this item
          requires a successful DC 20 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
    type: consumable
  - _id: ILlcMG95xFj8bnGW
    _key: '!actors.items!CCkERpkJdM2ZhIti.ILlcMG95xFj8bnGW'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/cloth/cloth-bolt-tan.webp
    name: Fiendgore Unguent
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          172</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When this unguent-prepared with vile
          alchemical reagents and the gore of fiends-is applied to a wounded
          tiefling or evil outsider (not currently at maximum hit points), it
          momentarily transforms the essence of the target into something even
          more fearsome and demonic. While under the effects of a fiendgore
          unguent, a tiefling or an evil outsider gains a +2 circumstance bonus
          on Intimidate checks and a +1 circumstance bonus to the DC of all
          spells with the fear descriptor that they cast. Applying the unguent
          is a delicate process, requiring a full-round action, and can only be
          properly applied to a willing or helpless creature. If applied to a
          creature other than a tiefling or an evil outsider, it sickens the
          creature instead. The unguent's effects (either beneficial or harmful)
          last for 1 minute.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 75
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: eRKPzUXRaB8aHN0j
    _key: '!actors.items!CCkERpkJdM2ZhIti.eRKPzUXRaB8aHN0j'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-red.jpg
    name: Filter
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          129</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This rich yellow ink reacts with a
          creature's body heat to create a flickering, flamelike glow. It takes
          10 minutes to apply fire ink, and 1 dose covers an approximately
          hand-sized area. Once applied, the ink glows as a candle for 24 hours.
          Four or more doses applied to the same part of the body glow as a
          torch for 24 hours. The alchemical reaction of the ink to the target's
          skin and body heat is painful and irritating, giving the target the
          sickened condition while the glow lasts. A DC 15 Heal check can
          temporarily soothe these sensations, negating the sickened condition
          for 1 hour. Creatures immune or resistant to fire are immune to this
          sickening effect. Ifrits are especially known for their fondness for
          fire ink, and ifrit fire-dancers often decorate their skin with
          flaming designs before performing. A concentrated version of the ink
          costs 10 times as much and can be used to make permanently glowing
          tattoos.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 1
      subType: misc
    type: consumable
  - _id: B4LvdKrRJ0F7EAvb
    _key: '!actors.items!CCkERpkJdM2ZhIti.B4LvdKrRJ0F7EAvb'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-black.webp
    name: Firearm Oil
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the Wastes pg.
          14</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This clear, viscous oil comes in a squat
          bottle with a dropper that dispenses one drop of oil at a time. When
          applied to an early or advanced firearm, it seeps into the weapon's
          inner workings and protects the gun from powder residue and everyday
          wear and tear. Applying firearm oil takes 1 minute; once applied, it
          reduces the misfire value of the firearm by 1 for 1 hour or until the
          firearm is discharged. Firearm oil can't reduce a firearm's misfire
          value to lower than 1. A single bottle contains enough oil for 20
          applications on one-handed firearms (or 10 applications on two-handed
          firearms). Crafting firearm oil requires a successful DC 15 Craft
          (alchemy) check.<h2>Construction</h2><strong>Craft (Alchemy)</strong>
          DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 260
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: vWTIcxbjSbTfcIMJ
    _key: '!actors.items!CCkERpkJdM2ZhIti.vWTIcxbjSbTfcIMJ'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-red.jpg
    name: Fireskin Elixir
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Blood of the Elements pg.
          27</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This elixir turns its imbiber fiery red,
          making it easier to pass as an efreeti. Unscrupulous efreet can sell
          fireskin elixir to guests who have been barred from citizen-only
          districts and must rely on disguises. Fireskin is highly addictive.
          Many once-savvy merchants have fallen into destitution as they
          scrambled to maintain efreet favor and secure a steady supply of the
          drug. This item can be crafted with a successful DC 20 Craft (alchemy)
          check.<h2>Fireskin</h2><strong>Type </strong>ingested;
          <strong>Addiction </strong>major, <strong>Fortitude </strong>DC
          20</p><p> <strong>Price </strong>100 gp</p><p> <strong>Effect
          </strong>1 day; +10 alchemical bonus on Disguise checks to appear as
          an efreeti, -1 penalty on all saves</p><p> <strong>Damage </strong>1d2
          Wis damage<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: drug
    type: consumable
  - _id: afHD8Fon8OXp66b0
    _key: '!actors.items!CCkERpkJdM2ZhIti.afHD8Fon8OXp66b0'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/plant-sprout-seed-green.webp
    name: Flash Seeds
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>These alchemical beads function as sentry
          seeds, but are also filled with an alchemical gas that explodes on
          contact with the air. This explosion is louder and flashier than the
          pop of normal sentry seeds (Perception DC 0). Creatures within 5 feet
          of the beads when they break must succeed at a DC 11 Fortitude save or
          be blinded for 1 round.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 35
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: 3fjqHEPzT7dAdfP5
    _key: '!actors.items!CCkERpkJdM2ZhIti.3fjqHEPzT7dAdfP5'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-teal.webp
    name: Foaming Powder
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When you add this 1-pound bag of green
          powder to a gallon of water, the two combine to form 50 cubic feet of
          thick green foam. Unless contained, in 1 round the foam fills a
          5-foot-square to a depth of 2 feet. When multiple pounds of powder are
          used, the foam expands at a rate of one 5-foot square per round.
          Ground covered with the foam is treated as difficult terrain, but is
          otherwise harmless. After 1 hour, the foam hardens to form a buoyant
          material roughly the density of honeycomb. The cured foam is easy to
          cut, with hardness 0 and 5 hit points per foot of thickness. The cured
          foam breaks down over a few days, and even faster if exposed to water.
          Casting <em>transmute mud to rock </em>on uncured foam converts it
          into a soft, pumice-like stone (hardness 2, 5 hit points per inch of
          thickness).<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 10
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: bkJB1cMIdu0Og3nB
    _key: '!actors.items!CCkERpkJdM2ZhIti.bkJB1cMIdu0Og3nB'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-green.webp
    name: Focus Chew
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Darklands pg.
          30</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When chewed, this spongy gum releases
          mild stimulants that heighten your focus. Derros use focus chew in an
          effort to improve their experiments, though spellcasters from other
          Darklands cultures have adopted their recipe for use in research. For
          up to 1 hour while chewing focus chew, you gain a +2 alchemical bonus
          on concentration checks and a +1 alchemical bonus on
          Intelligence-based skill checks.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 40
      subType: misc
    type: consumable
  - _id: FB5kknPoZBtxApAb
    _key: '!actors.items!CCkERpkJdM2ZhIti.FB5kknPoZBtxApAb'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-thick-orange.webp
    name: Fool's Glow
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder #106: For Queen and Empire pg.
          75</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>A greasy paste of beeswax, pyrite, and
          various monster fluids, fool's glow reacts with light to confuse
          magical senses. For 12 hours after being smeared over an object or
          creature (a process requiring 1 minute), the fool's glow detects as
          faintly magical if examined with a <em>detect magic</em> or <em>arcane
          sight</em> spell, though no school or specific spell can be
          identified. With a successful DC 21 Craft (alchemy) or Spellcraft
          check, a character identifies the coating for what it is. A single jar
          of fool's glow can coat one Medium, two Small, or four Tiny or smaller
          objects. Crafting a jar of fool's glow requires a successful DC 20
          Craft (alchemy) check.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 45
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: erLuR2E8pgCiLg77
    _key: '!actors.items!CCkERpkJdM2ZhIti.erLuR2E8pgCiLg77'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-pink-yellow-green.webp
    name: Frightful War Paint
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          7</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This bone-white paste makes your face
          appear skeletal and emotionless, like a visage of death itself. When
          you apply frightful war paint to yourself (or to a willing adjacent
          creature) as a full-round action, attempt a Disguise or Charisma
          check. Living creatures within 30 feet of the wearer must succeed at a
          Will save (DC equal to the result of your Disguise or Charisma check,
          maximum DC 20) or become shaken for 1d4 rounds. Blind creatures and
          creatures out of line of sight are unaffected. A creature that
          succeeds at its check becomes immune to this frightful war paint for
          24 hours. Frightful war paint can be worn indefinitely, but it
          contains quicksilver and realgar, which have deleterious mental
          effects. If you wear frightful war paint for more than 1 minute per
          day (whether as a single use of it or as multiple uses over several
          periods of time), you take 1 point of Constitution damage, plus 1
          point of Wisdom damage for every minute you wear the paint that day
          after the first.<h2>Alchemical Recipe</h2><strong>Recipe</strong> (40
          dew of lunary + 40 quicksilver + 50 realgar)/earth;
          <strong>Craft</strong> 30</p><p><strong>Time</strong> 10 minutes;
          <strong>Tools</strong> -; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 300
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: mqlNWkDGFfKGEKtZ
    _key: '!actors.items!CCkERpkJdM2ZhIti.mqlNWkDGFfKGEKtZ'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/lily-white.webp
    name: Fuel Pellet (10)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the Sands pg.
          28</p><p><strong>Price</strong> 3 sp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Small nuggets of compressed fibers,
          resins, and dung, fuel pellets give off very little smoke when burned.
          Each pellet burns for 10 minutes, providing enough heat to boil water,
          and can be lit as a move action.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 15" <p><strong>Source</strong>: Adventurer's
          Armory pg. 19</p><p><strong>Price</strong> 1 sp;
          <strong>Weight</strong> -</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>These pungent white cloves serve as food
          and medicine and play a role in many traditional cleansing rituals. It
          is well established that vampires cannot abide the presence of garlic.
      flags:
        dictionary:
          Category: Black Market
      price: 0.1
      subType: misc
    type: consumable
  - _id: IRuMaaQMZH0uvC32
    _key: '!actors.items!CCkERpkJdM2ZhIti.IRuMaaQMZH0uvC32'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/gems/pearls-white.webp
    name: Garlic Tablets
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Undead Slayer's Handbook pg.
          9</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>These small gray-white tablets are made
          of dehydrated and condensed garlic bulbs. One hour after you eat a
          garlic tablet, you begin to stink as the essence of the tablet seeps
          out of your pores. This state lasts for 4 hours. Subsequent doses of
          garlic tablets reset this duration. During this time, you can keep a
          vampire at bay (<em>Pathfinder RPG Bestiary</em> 270) as a free action
          without need of a holy symbol or mirror. The vampire must succeed at a
          DC 25 Will save to overcome its natural revulsion to garlic; failure
          means it must stay at least 5 feet away from you and cannot touch you
          or make melee attacks against you. However, unlike while keeping a
          vampire at bay with a mirror or holy symbol, once the vampire succeeds
          at its save against the garlic tablets, it's no longer affected by
          that creature's odor and may act normally without need of further
          saving throws.</p><p>Garlic tablets are valuable aids to vampire
          hunters, but while benefiting from the tablets' strong odor, you take
          a -2 penalty on all Charisma checks and Charisma-based skill checks
          for the duration of the effect. The listed price is for three
          tablets.Crafting garlic tablets requires a successful DC 20 Craft
          (alchemy) check.<h2>Construction</h2><strong>Craft (Alchemy)</strong>
          DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 20
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: eFAFLM2QcTpfJ8Vm
    _key: '!actors.items!CCkERpkJdM2ZhIti.eFAFLM2QcTpfJ8Vm'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/goggles-leather-blue.webp
    name: Gloom Sight Goggles
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          111</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>These nonmagical goggles are set with a
          piece of alchemically treated, black, obsidianlike stone found in the
          mountainous regions of the Shadow Plane. Gloom sight goggles interact
          with the unique eyes of fetchlings in such a way that when the goggles
          are worn over both eyes, they expand the range of a fetchling's
          darkvision to 90 feet, but the fetchling also gains the light
          sensitivity weakness. Other races cannot see through the lenses of
          these goggles, and they have no affect on fetchlings whose eyes have
          been modified by the Gloom Sight feat. Though they are alchemical
          rather than magical in nature, these goggles take up the magic item
          eye slot.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 200
      subType: misc
    type: consumable
  - _id: WErwj1bRKsQvla7n
    _key: '!actors.items!CCkERpkJdM2ZhIti.WErwj1bRKsQvla7n'
    _stats:
      coreVersion: '12.331'
    img: icons/weapons/staves/staff-simple.webp
    name: Gloomstick
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          24</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This variant sunrod was developed by
          fetchling alchemists. When twisted as a standard action, a gloomstick
          begins drawing in light from the surrounding area, reducing the light
          level by one step (to a minimum of dim light) in a 20-foot radius. A
          gloomstick remains active for 1 minute before crumbling to
          dust.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: Zdg6bd7U9D9fv3nT
    _key: '!actors.items!CCkERpkJdM2ZhIti.Zdg6bd7U9D9fv3nT'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-blue.webp
    name: Glowing Ink
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 103</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong> 5 gp;
          <strong>Weight</strong> -</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Often extracted from phosphorescent
          insects, tiny marine plants, or subterranean fungi, glowing ink emits
          a faint but steady light (typically red or green) that allows you to
          read it in normal darkness-this includes darkness created by spells
          like <em>darkness</em>, but not the supernatural darkness created by
          <em>deeper darkness</em>. If there is glowing ink on an object, you
          have a +2 bonus on Perception checks to locate it. Mixing glowing ink
          with marker dye makes the dye glow in the dark until it
          fades.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 5
      subType: misc
    type: consumable
  - _id: OdQi4lnImHxVKUWz
    _key: '!actors.items!CCkERpkJdM2ZhIti.OdQi4lnImHxVKUWz'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/lily-grey-orange.webp
    name: Goblinvine
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg. 154</em>,
          <em>Heroes of the Wild pg. 10</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 16; <strong>Yield</strong> 1
          dose (1 lb.)</p><p><strong>Terrain</strong> any forests, mountains,
          plains, or swamps</p><p><strong>Preparation</strong> Properly
          preparing a dose of goblinvine requires a successful DC 20 Sleight of
          Hand check and 1 minute of work to weave and roll the vines into a
          compact, fist-sized ball so the hairy side of the leaves faces inward.
          On a failure by 5 or more, the leaves become torn and ruined. If
          gloves or gauntlets aren't worn, the preparer is automatically exposed
          to the goblinvine's effects. If the preparation check's result is a
          natural 1, the preparer is exposed to those effects regardless of any
          hand protection worn. The goblin vine must then be stored in an area
          of bright light for at least 1 hour for the inner surface of the
          leaves to properly 'sweat' and build up enough irritating oil to
          function as a thrown weapon.</p><p><strong>Use</strong> Once woven
          into a tight ball of vines and left to sweat, a ball of goblinvine
          leaves can be used as an improvised thrown weapon as a ranged touch
          attack. On a hit, a target must succeed at a DC 10 Fortitude save or
          develop a distracting, itchy rash that imposes a -2 penalty on ability
          checks, attack rolls, saving throws, and skill checks. This effect
          persists for 10 minutes or until the rash is tended with a successful
          DC 12 Heal check attempted as a full-round action. This is a poison
          effect, but creatures with the goblinoid subtype are immune to the
          effect. Innovative characters (including many goblins) have developed
          other uses for goblinvine, including as snares and ropes to make those
          bound or entangled itchy as well, but since goblinvine is relatively
          fragile, it makes for a very poor substitute for
          rope.</p><h2>Description</h2>The leaves of this invasive creeper are
          wide and covered with tiny hairlike filaments.
      flags:
        dictionary:
          Category: Herbs
      price: 30
      subType: misc
    type: consumable
  - _id: 8OufTYs6D1E0DcVI
    _key: '!actors.items!CCkERpkJdM2ZhIti.8OufTYs6D1E0DcVI'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/plant-pot.webp
    name: Golden Maple Leaves
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          46</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>These potent additives can only be culled
          from a rare maple tree known to grow exclusively in urban areas. These
          small, elaborately twisting trees are extremely slow to grow and
          mature-the leaves reach maturity only once every 3 years-and they are
          almost always grown and cultivated by half-elves. Additionally,
          half-elves are keenly aware of the effort put into the leaves' growth
          and normally only sell the products of their labors to others of their
          kind. When the golden maple's delicate, five-pointed leaves finally
          take on their namesake's color, they can be cut, dried, and then
          ground into a fine powder, a process that requires a DC 15 Knowledge
          (nature) or Profession (herbalist) check. When used in conjunction
          with the Craft (alchemy) skill to create special substances and items
          like alchemical grease or tanglefoot bags, golden maple leaves reduce
          the Craft DC by 5 and add +1 to the DC of any save required by the
          alchemical item. A single dose of golden maple leaf powder is
          sufficient to augment the crafting of three alchemical items.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: xUWTHs5vO1SU1E5f
    _key: '!actors.items!CCkERpkJdM2ZhIti.xUWTHs5vO1SU1E5f'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-9.jpg
    name: Gravelly Tonic
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          207</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This tonic is sludgy, and its scent
          resembles the tang of iron shavings. Drinking gravelly tonic causes
          your voice to deepen and become more grating for 1 hour, granting you
          a +5 alchemical bonus on Intimidate
          checks.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
    type: consumable
  - _id: qZgSzN9oPJNlmvJd
    _key: '!actors.items!CCkERpkJdM2ZhIti.qZgSzN9oPJNlmvJd'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/survival/rope-wrapped-red.webp
    name: Gum Rope
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Giant Hunter's Handbook pg.
          25</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This small tacky blue pellet is
          deceptively dense. When the pellet is broken, an alchemical reaction
          causes it to grow suddenly into a 30-foot-long spongy rope as strong
          as a normal hemp rope. It dissolves 8 hours
          thereafter.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 30
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: z0lKZmcnCzPtPhZb
    _key: '!actors.items!CCkERpkJdM2ZhIti.z0lKZmcnCzPtPhZb'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/magic-yellow.jpg
    name: Harpy Musk
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Varisia, Birthplace of Legends pg.
          15</em>, <em>Rise of the Runelords Player's Guide pg. 11</em>,
          <em>Mythical Monsters Revisited pg. 24</p><p><strong>Price</strong> 20
          gp; <strong>Weight</strong> 1 lb.</p><p><strong>Category</strong>
          Alchemical Tools</p><h2>Description</h2>For all their cowardice and
          cruelty, goblins have a keen sense of what can kill them, and harpies
          number among goblins' most feared predators. Using this knowledge to
          their advantage, Varisian alchemists have devised ways to recreate or
          distill the musk of harpies into a potent concoction. If smeared on a
          surface or used as a thrown weapon, harpy musk fills a 30-foot area
          for 10 minutes before dispersing. Any goblin who enters the area must
          succeed at a DC 14 Will save or be shaken for 1 minute. Harpy musk
          affect only goblins-bugbears and hobgoblins are unaffected. Harpy musk
          can be created with a successful DC 20 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 20
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: MmlTNT8vhoyoo3oG
    _key: '!actors.items!CCkERpkJdM2ZhIti.MmlTNT8vhoyoo3oG'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/holly-buds-red.webp
    name: Hobgoblin War Draught
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 0 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>The bright red berries of the holly tree
          have many uses as decorations and ritual objects. Druids harvest holly
          berries with specially prepared tools and during sacred times of the
          year.
      flags:
        dictionary:
          Category: Black Market
      subType: misc
    type: consumable
  - _id: r34cSAu4gh1g3BMK
    _key: '!actors.items!CCkERpkJdM2ZhIti.r34cSAu4gh1g3BMK'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Homunculus Clay
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          15</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This thick clay mixture comes in a jar
          stamped with a silhouette of whatever creature can be created using
          its contents. By adding a drop of blood to a scoop of homunculus clay,
          you can create a temporary homunculus that hardens and becomes fully
          animate in just 1 round. The character whose blood is used is treated
          as the homunculus's master. After 1 hour, a clay homunculus withers
          and dies, rapidly decaying into a viscous slime. The listed price is
          for a jar containing 3 doses of homunculus clay.<h2>Alchemical
          Recipe</h2><strong>Recipe</strong> (450 darkwood + 350 dew of lunary +
          400 myrrh)/fermentation; <strong>Craft</strong>
          30</p><p><strong>Time</strong> 1 day; <strong>Tools</strong> heat
          source; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 2250
      subType: misc
      weight:
        value: 5
    type: consumable
  - _id: 8yJbANg6Qv0rW6x2
    _key: '!actors.items!CCkERpkJdM2ZhIti.8yJbANg6Qv0rW6x2'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-red.jpg
    name: Hound's Blood (Vial)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          36</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>If you apply the thick, red paste known
          as hound's blood to your nostrils or upper lip, it greatly enhances
          your sense of smell. For most creatures, this grants a +2 alchemical
          bonus on Perception checks for 1 hour. For gnomes, it briefly grants a
          super-heightened sense of smell, granting the scent ability for 5
          minutes, before the potency is reduced to a +2 alchemical bonus on
          Perception checks for an additional 1
          hour.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 110
      subType: misc
    type: consumable
  - _id: 4WlVp9om1VC2Hiuc
    _key: '!actors.items!CCkERpkJdM2ZhIti.4WlVp9om1VC2Hiuc'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-grey.webp
    name: Houndbane Dust
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder #106: For Queen and Empire pg.
          75</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>A blend of finely ground plaster, burning
          spices, and insect secretions, houndbane dust deters tracking animals.
          A single pouch can be spread over a 5-foot area as a standard action.
          For 24 hours thereafter, any creature with the scent ability that
          enters that square takes 1d2 points of damage and loses its sense of
          smell for 24 hours. Creatures that succeed at a DC 15 Fortitude saving
          throw take no damage and lose their sense of smell for only 3d6
          minutes. Crafting a pouch of houndbane dust requires a successful DC
          25 Craft (alchemy) check.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 75
      subType: misc
      weight:
        value: 3
    type: consumable
  - _id: aDWiARWtawayR4d3
    _key: '!actors.items!CCkERpkJdM2ZhIti.aDWiARWtawayR4d3'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-red.jpg
    name: Ifrit's Blood
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          129</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Ifrit alchemists claim to make this thick
          red oil from their own blood-hence the morbid name-but this claim is
          almost certainly false. Ifrit's blood ignites upon contact with air,
          but burns slowly and is unsuitable for use as a splash weapon. A
          creature can apply a flask of ifrit's blood to a weapon as a standard
          action, wreathing the weapon in vibrant red flames for 1 minute. The
          oil deals 1 point of fire damage on each successful attack with the
          weapon and deals 1 point of fire damage to the weapon itself,
          bypassing the weapon's hardness if any part of it is made of wood. If
          the oil is applied to a creature's natural weapons or unarmed strikes,
          the creature takes 1 point of fire damage each round (though its fire
          immunity or resistance still
          applies).<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: TSt8uH8jUepvfIJ4
    _key: '!actors.items!CCkERpkJdM2ZhIti.TSt8uH8jUepvfIJ4'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Impact Foam
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This milky white liquid bubbles into a
          1-foot-thick semisolid sheet of foam when splashed across the ground.
          You can spend a minute to apply a flask of impact foam to a
          10-foot-radius area, or you can throw the flask as a splash weapon.
          The foam does not interfere with movement, but reacts strongly to
          sudden force. A creature that falls onto a sheet of impact foam
          ignores the first 1d6 points of falling damage and converts the second
          1d6 points of falling damage into nonlethal damage. A sheet of impact
          foam dissolves after 10 minutes or when exposed to at least a gallon
          of water.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: BE89RhEao5rQUSZz
    _key: '!actors.items!CCkERpkJdM2ZhIti.BE89RhEao5rQUSZz'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-pink-yellow-green.webp
    name: Imposing War Paint
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          7</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This gritty red paste makes you appear as
          if you were covered in dried blood. When you apply imposing war paint
          as a full-round action, you gain a +4 alchemical bonus on Intimidate
          checks and the duration of any fear effects you create increases by
          50% as long as you wear the war paint. Unfortunately, imposing war
          paint is made with realgar, which is toxic to living creatures. If you
          wear imposing war paint for more than 1 minute per day, you take 1
          point of Constitution damage, plus 1 point of Constitution damage for
          every minute you wear the paint that day after the
          first.<h2>Alchemical Recipe</h2><strong>Recipe</strong> (12 dew of
          lunary + 10 realgar)/earth; <strong>Craft</strong>
          25</p><p><strong>Time</strong> 10 minutes; <strong>Tools</strong> -;
          <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 70
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: j9bvasqVdvwFCQmu
    _key: '!actors.items!CCkERpkJdM2ZhIti.j9bvasqVdvwFCQmu'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-orange.webp
    name: Incense
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Occult Adventures pg.
          249</p><p><strong>Price</strong> 7 sp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Adventuring
          Gear</p><h2>Description</h2>This aromatic resin is imbued with
          fragrant oils and formed into sticks, cones, or balls. It's often
          burned in religious ceremonies or during meditation. A piece of
          incense burns for 1 hour.
      flags:
        dictionary:
          Category: Adventuring Gear
      price: 0.7
      subType: misc
    type: consumable
  - _id: LIaLPwj7P6ioJP60
    _key: '!actors.items!CCkERpkJdM2ZhIti.LIaLPwj7P6ioJP60'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-orange.webp
    name: Incense (10 Sticks)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          87</p><p><strong>Category</strong> Adventuring
          Gear</p><h2>Description</h2>This aromatic resin, imbued with fragrant
          oils, is often formed into sticks, cones, or balls and burned in
          ceremonies or during meditation. A piece of incense burns for 1 hour.
      flags:
        dictionary:
          Category: Adventuring Gear
      price: 10
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: pNYj08xUnTZbyXUD
    _key: '!actors.items!CCkERpkJdM2ZhIti.pNYj08xUnTZbyXUD'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/ink-quill-red.webp
    name: Incense Of Divinity
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 57</em>, <em>PRPG
          Core Rulebook pg. 158</p><p><strong>Price</strong> 8 gp;
          <strong>Weight</strong> -</p><p><strong>Category</strong> Adventuring
          Gear</p><h2>Description</h2>This vial contains 1 ounce of ink. Ink in
          colors other than black costs twice as much.
      flags:
        dictionary:
          Category: Adventuring Gear
      price: 8
      subType: misc
    type: consumable
  - _id: 0lL4o7rhKqnAABcm
    _key: '!actors.items!CCkERpkJdM2ZhIti.0lL4o7rhKqnAABcm'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/ink-quill-pink.webp
    name: Ink Of Stolen Secrets
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Antihero's Handbook pg.
          28</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This alchemically concocted black ink can
          be attuned to a standard sheet of parchment. Anything inscribed using
          the ink (anywhere on the same plane of existence) appears on the
          attuned parchment in a sparkling blue script that lasts 1 hour. There
          is enough ink in one vial to fill one sheet of parchment. The ink
          cannot duplicate any written magical effects, such as a <em>symbol of
          death</em> (as per the spell of the same name). Crafting a vial of ink
          of stolen secrets requires a successful DC 15 Craft (alchemy) check.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: lRTse61J3S36g9PZ
    _key: '!actors.items!CCkERpkJdM2ZhIti.lRTse61J3S36g9PZ'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/ink-quill-pink.webp
    name: Ink, Bioluminescent
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Blood of the Sea pg.
          18</p><p><strong>Category</strong> Adventuring
          Gear</p><h2>Description</h2>Extracted from bioluminescent jellyfish,
          plankton, and other marine organisms that glow in the ocean's depths,
          this ink is refined in a process that makes the ink stable and long
          lasting. This colorful ink glows gently like a candle, so it is easier
          to discern any writing at a distance, especially in the dark. The
          ink's glow lasts for about 1 year, after which time the writing
          remains colorful but no longer glows. Bioluminescent ink is typically
          stored in a waterproof bladder.
      flags:
        dictionary:
          Category: Adventuring Gear
      price: 32
      subType: misc
    type: consumable
  - _id: 9QZPyGVS0pe0Sb1q
    _key: '!actors.items!CCkERpkJdM2ZhIti.9QZPyGVS0pe0Sb1q'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/ink-quill-red.webp
    name: Ink, Ghost
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg. 24</em>,
          <em>Seekers of Secrets pg. 43</p><p><strong>Category</strong>
          Alchemical Tools</p><h2>Description</h2>Pale blue when wet, ghost ink
          dries to near-transparency 1 minute after application. Ghost ink is
          used to subtly mark trails and locations. The pigment glows red under
          the light shed by fire beetle glands and sunrods; otherwise, a
          successful DC 25 Perception check is required to notice a mark in
          ghost ink. One vial of ghost ink is sufficient for writing a page's
          worth of characters.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
    type: consumable
  - _id: NqXPssuAhBcCEnF7
    _key: '!actors.items!CCkERpkJdM2ZhIti.NqXPssuAhBcCEnF7'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/ink-quill-red.webp
    name: Ink, Invisible (Average)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          207</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This alchemically infused ink ensures
          secret messages destroy themselves after being read. If light strikes
          the ink after it has dried, chemicals cause it to spontaneously
          combust within about a minute. The combustion is small-not significant
          enough to ignite anything but paper. Ink used on other materials such
          as stone or wood simply vanishes, leaving no trace of the writing. A
          vial of this ink holds enough to write 10 brief messages of no more
          than 50 words each.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 40
      subType: misc
    type: consumable
  - _id: BXyfi8BZ9lcb2tUo
    _key: '!actors.items!CCkERpkJdM2ZhIti.BXyfi8BZ9lcb2tUo'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/ink-quill-red.webp
    name: Ink, Spirit-Vision
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          28</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Originally developed by kami-revering
          priests to write prayer scrolls, this pale ink is now often used by
          ninjas to mark locations or leave messages. Once spirit-vision ink
          dries, it becomes completely invisible. To invisible creatures,
          however, writing in spirit-vision ink shimmers with a rich azure
          hue.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 30
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
    type: consumable
  - _id: lQseUYcR57vRwrP2
    _key: '!actors.items!CCkERpkJdM2ZhIti.lQseUYcR57vRwrP2'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/ink-quill-red.webp
    name: Ink, Vector
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          9</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This specialized ink can be mixed with a
          contact poison to make the poison last longer on paper. Once applied
          to a sheet of paper, the ink remains slightly tacky and keeps the
          poison effective for up to 1 week. Any creature that touches the
          writing (such as while opening a closed book or unraveling a scroll)
          must save against the contact poison. Once a creature has come in
          contact with the vector ink, the ink is expended. A single vial of
          vector ink is enough to write a single page of text on standard-sized
          parchment.<h2>Alchemical Recipe</h2><strong>Recipe</strong> (7 dew of
          lunary + 7 gold + 6 urea)/digestion; <strong>Craft</strong>
          20</p><p><strong>Time</strong> 1 day; <strong>Tools</strong> heat
          source; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 60
      subType: misc
    type: consumable
  - _id: rgw3E0MBLS2vI5Cf
    _key: '!actors.items!CCkERpkJdM2ZhIti.rgw3E0MBLS2vI5Cf'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/plant-sprout-seed-brown-green.webp
    name: Instant Fertilizer
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          11</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This ruby-red earth can be sprinkled over
          a 5-foot patch of ground as a standard action that provokes attacks of
          opportunity. Noncreature plants and fungi in the area grow with
          alarming speed, and the ground becomes weedy, difficult terrain for
          non-plant creatures. Any non-plant creature in the square must succeed
          at a DC 15 Reflex save or it becomes entangled by the surging plants.
          Any plant creature in the affected square is healed of 1d6 points of
          damage.<h2>Alchemical Recipe</h2><strong>Recipe</strong> (15 magnesium
          + 20 phosphorus + 10 salt)/calcination; <strong>Craft</strong>
          20</p><p><strong>Time</strong> 1 hour; <strong>Tools</strong>
          crucible; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 20
      subType: misc
      weight:
        value: 4
    type: consumable
  - _id: nZABRElrHZoj42Oy
    _key: '!actors.items!CCkERpkJdM2ZhIti.nZABRElrHZoj42Oy'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-blue.jpg
    name: Intuition Serum
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>By drinking this clear, fizzy liquid, you
          gain 1d4 uses of alchemical inspiration that can be used only on Sense
          Motive checks. The benefits of intuition serum last for 1 hour; during
          this time, you must roll all Bluff checks twice and take the worse
          result.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 190
      subType: misc
    type: consumable
  - _id: P1g2pfIvUW3HHdIz
    _key: '!actors.items!CCkERpkJdM2ZhIti.P1g2pfIvUW3HHdIz'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/liquid-green.webp
    name: Kaava Musk
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Sargava, the Lost Colony pg. 24</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Category</strong>
          Alchemical Tools</p><h2>Description</h2>This emerald-colored adhesive
          is made from animal glands, urine, and other powerful scents that are
          difficult to wash off. A target splashed with it smells like weak prey
          to predators. Creatures with the scent ability can detect a marked
          creature at five times the normal range, note its direction as a free
          action, pinpoint it when it is within 25 feet, and track it by scent
          with a +5 bonus on their Survival checks. Immersion in water within 1
          round of exposure washes the musk off; otherwise the effect decreases
          by 1 range increment per day (four times normal range after 1 day,
          three times normal range after 2 days, and so on) until the creature
          is again at normal scent levels. One dose of Kaava musk costs 40 gp
          and weighs 1/2 lb.; the Craft (alchemy) DC to create Kaava musk is 20.
          For more information on Kaava musk, see page
          31.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 40
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: 42EugeXT4NiBYMnH
    _key: '!actors.items!CCkERpkJdM2ZhIti.42EugeXT4NiBYMnH'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Brewer's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          13</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>A brewer's kit includes a mash tun, as
          well as copper kettles and piping for boiling and cooling before
          casking it and allowing it to ferment. It also includes a variety of
          dried hops and spices for flavoring.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: other
      weight:
        value: 50
    type: consumable
  - _id: JIEJc8TH0Aj1Nn0x
    _key: '!actors.items!CCkERpkJdM2ZhIti.JIEJc8TH0Aj1Nn0x'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/chest/chest-simple-box-red.webp
    name: Kit, Brewer's Masterwork
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          13</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This exceptionally crafted kit provides
          extra spices, a wider variety of herbs, and higher quality tools than
          a normal brewer's kit. A masterwork brewer's kit grants a +2
          circumstance bonus on Craft (alchemy) checks to produce alcoholic
          beverages.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 75
      subType: other
      weight:
        value: 50
    type: consumable
  - _id: hlkjv6NJ8tHbMmgZ
    _key: '!actors.items!CCkERpkJdM2ZhIti.hlkjv6NJ8tHbMmgZ'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Leaper's Libation
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          22</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This bubbly drink has a zesty scent
          and invigorates the muscles. For 1 hour after drinking this tincture,
          you gain a +4 alchemical bonus on Acrobatics checks to jump
          horizontally, you are always treated as having a running start for the
          purpose of these checks, and your jump distance can exceed your base
          speed. Due to your exaggerated movement, you take a -2 penalty on
          attack rolls and cannot take 5-foot steps for the same
          duration.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Tincture
      price: 200
    type: consumable
  - _id: 8wzwl8h0Y664yzWB
    _key: '!actors.items!CCkERpkJdM2ZhIti.8wzwl8h0Y664yzWB'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/daisies-pink.webp
    name: Leechwort
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg. 154</em>,
          <em>Heroes of the Wild pg. 10</p><p><strong>Price</strong> 3 gp;
          <strong>Weight</strong> -</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 16; <strong>Yield</strong> 1d4
          doses</p><p><strong>Terrain</strong> warm forests or
          swamps</p><p><strong>Preparation</strong> Properly preparing leechwort
          for use is a timeconsuming process that takes 1 week, as fibers of the
          shrub must be dried and ground until they achieve a fine, powdery
          texture. A single herbalist can prepare up to a dozen doses
          simultaneously in this manner. At the end of the week, a successful DC
          15 Craft (alchemy) check results in all of the doses being ready for
          use; failure indicates that all the doses have
          spoiled.</p><p><strong>Use</strong> When a dose of prepared leechwort
          is used in conjunction with a Heal check to stabilize a dying
          creature, provide longterm care, treat wounds from caltrops (or
          similar effects), or treat deadly wounds, it grants a +1 alchemical
          bonus on the Heal check. This increases to a +2 alchemical bonus on
          Heal checks to staunch bleeding.</p><h2>Description</h2>When dried and
          ground into a powder, the mottled red-andgray bark of this shrub is a
          boon to healers.
      flags:
        dictionary:
          Category: Herbs
      price: 3
      subType: misc
    type: consumable
  - _id: ywNf4WuEdfatMNpU
    _key: '!actors.items!CCkERpkJdM2ZhIti.ywNf4WuEdfatMNpU'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/lights/lantern-iron-yellow.webp
    name: Light Detector
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 103</em>,
          <em>Advanced Player's Guide pg. 184</p><p><strong>Price</strong> 1 gp;
          <strong>Weight</strong> -</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This hand-sized metal plate is covered
          with a thin layer of light-sensitive transparent paste. If exposed to
          light, the paste darkens and becomes opaque, depending on the amount
          of light. Bright light causes it to fully darken in 1 round, normal
          light in 3 rounds, and dim light in 10 rounds. It is mainly used by
          creatures with darkvision to determine whether creatures carrying
          light have recently passed through an area. The plate is sold wrapped
          in a thick black cloth to prevent accidental light exposure from
          ruining the plate.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 10
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 1
      subType: misc
    type: consumable
  - _id: g8k9JfkRw79meCFU
    _key: '!actors.items!CCkERpkJdM2ZhIti.g8k9JfkRw79meCFU'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Light Of Axtarr
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Elemental Master's Handbook pg.
          31</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Originally brewed from waters adjacent to
          one of the Plane of Water's subaquatic suns, a vial of light of Axtarr
          glows like a candle until expended. A vial of light of Axtarr that is
          emptied underwater as a move action forms a small orb that sheds light
          like a sunrod for 1d6 hours, after which the item is expended. Such an
          underwater orb remains suspended in place, not sinking, floating, or
          drifting away unless moved by a creature. Above water, shaking a vial
          of light of Axtarr as a move action also makes it shed light like a
          sunrod for 1d6 hours, after which it is expended. Any area of normal
          light created by light of Axtarr protects creatures within it from
          cold temperatures as per <em>endure elements</em>. Alternatively, a
          spellcaster holding an unused vial of light of Axtarr can expend it as
          a free action to automatically succeed at a caster level check to cast
          a fire spell underwater. (Fire spells successfully cast underwater
          produce steam that still deals fire damage; for more details, see page
          46 of <em>Pathfinder Campaign Setting: Aquatic Adventures</em>.) This
          alternative use does not cause the light of Axtarr to produce light.
          Crafting this item requires a successful DC 30 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 30
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 180
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: 9H0hj9gioAXSlWWi
    _key: '!actors.items!CCkERpkJdM2ZhIti.9H0hj9gioAXSlWWi'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-liquid-white.webp
    name: Light-Killer's Grease
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          246</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This lotion is made from soothing herbs
          and oils. When rubbed on your skin, liniment relieves pain, allowing
          you to ignore the effects of 2 points of ability damage caused by a
          single disease you have. The benefits of the liniment last for 30
          minutes, and it does not cure, prevent, or otherwise protect you from
          the effects of diseases. You cannot benefit from the effects of
          liniment more than once in a 24-hour period.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 15
      subType: misc
    type: consumable
  - _id: qYXzyYfR5N9K0jPA
    _key: '!actors.items!CCkERpkJdM2ZhIti.qYXzyYfR5N9K0jPA'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Liquid Courage
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          22</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This crimson liquid roils when held.
          For 1 hour after drinking this tincture, you gain immunity to effects
          that would cause you to become shaken; you are still susceptible to
          becoming frightened or panicked. The drink clouds your judgment,
          imposing a -2 penalty on Wisdom-based skill checks for the same
          duration.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Tincture
      price: 175
    type: consumable
  - _id: t357DArO8BlO0saX
    _key: '!actors.items!CCkERpkJdM2ZhIti.t357DArO8BlO0saX'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Liquid Traction
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          207</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This glass bottle is filled with sticky
          goo prized by sailors for the additional traction it grants on ship
          decks. When applied to the soles of footwear and allowed to dry for 1
          hour, liquid traction grants a +2 alchemical bonus on Acrobatics
          checks to keep your balance and a +2 bonus to CMD against bull rush.
          Liquid traction has no effect when it comes into contact with very
          slick or unnaturally slick surfaces such as ice or
          <em>grease</em>.<h2>Construction</h2><strong>Craft (Alchemy)</strong>
          DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: sh1JM4hJNsJB0bRs
    _key: '!actors.items!CCkERpkJdM2ZhIti.sh1JM4hJNsJB0bRs'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/documents/parchment-plain-tan.webp
    name: Litmus Strip
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeoneer's Handbook pg.
          26</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This white paper strip treated with dyes
          extracted from common lichen is used to quickly test the composition
          of any wate-rbased solution. The user dips the end of the strip in the
          liquid and waits 1 round for the chemical reaction to change the color
          of the strip. If the strip turns purple, then the water contains
          poisonous toxins and must be purified before consumption. The darker
          purple the strip turns, the more toxic the substance. If the strip
          remains white, the solution is poison-free. Though it's not useful for
          testing oils, slimes, or gases, a strip can be invaluable in
          determining whether a water source or beverage is
          tainted.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 15
      subType: misc
    type: consumable
  - _id: ODMayQjTErjJ5dME
    _key: '!actors.items!CCkERpkJdM2ZhIti.ODMayQjTErjJ5dME'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/lotus-purple.webp
    name: Love-In-Idleness
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          154</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 20; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> any
          forests</p><p><strong>Preparation</strong> A dose of this flower's
          nectar must be extracted and stored in an alchemically prepared vial
          with a successful DC 14 Craft (alchemy) check and 1 hour's worth of
          work.</p><p><strong>Use</strong> As a full-round action, a dose of
          love-in-idleness nectar can be drizzled into the ears of a helpless or
          willing animal or humanoid. This causes the subject to become much
          more susceptible to the power of suggestion and mind-affecting
          effects, taking a -2 penalty on Sense Motive checks and a -1 penalty
          on saving throws against mind-affecting effects for the next 2d4
          hours. This is a poison effect.</p><h2>Description</h2>The deep-red
          flower has rich nectar with a honey-like scent.
      flags:
        dictionary:
          Category: Herbs
      price: 150
      subType: misc
    type: consumable
  - _id: edZzDGFt6OQCpr5f
    _key: '!actors.items!CCkERpkJdM2ZhIti.edZzDGFt6OQCpr5f'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Loyalty Transfusion
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          15</p><p><strong>Category</strong> Alchemical
          Remedies</p><h2>Description</h2>This serum transfers a homunculus's
          loyalty from one master to another. In order for this to work, the
          homunculus's current master and its master-to-be must each place a
          drop of their blood into the serum. When an appropriate homunculus
          drinks this concoction, it thereafter treats the master-to-be as its
          master. The change in ownership also causes the homunculus's alignment
          to change to match that of its new owner.<h2>Alchemical
          Recipe</h2><strong>Recipe</strong> (200 quicksilver + 150 realgar +
          200 spirit of wine)/distillation; <strong>Craft</strong>
          30</p><p><strong>Time</strong> 1 day; <strong>Tools</strong> retort;
          <strong>Type</strong> alchemical remedy
      flags:
        dictionary:
          Category: Alchemical Remedies
      price: 625
      subType: misc
    type: consumable
  - _id: IOlJ2jrR9W41SJ6b
    _key: '!actors.items!CCkERpkJdM2ZhIti.IOlJ2jrR9W41SJ6b'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/gems/pearl-brown.webp
    name: Lozenge Of The Songbird
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          207</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This honey-coated candy is made of
          soothing reagents. If eaten, it takes 1 round to begin working, then
          grants a +2 alchemical bonus on all Perform (sing) checks for 1
          hour.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
    type: consumable
  - _id: sDdugFCmIODwff0c
    _key: '!actors.items!CCkERpkJdM2ZhIti.sDdugFCmIODwff0c'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Mage's Assistant
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          22</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This navy blue liquid is riddled with
          colorful flecks of minerals. For 1 hour after drinking this tincture,
          you gain a +5 alchemical bonus on concentration checks. The increased
          focus imposes a -2 penalty on Perception and Sense Motive checks for
          the same duration.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Tincture
      price: 150
    type: consumable
  - _id: X0TkXWAhorBXGMFR
    _key: '!actors.items!CCkERpkJdM2ZhIti.X0TkXWAhorBXGMFR'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/documents/paper-plain-white.webp
    name: Magnetized Paper
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Occult Adventures pg.
          252</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>These specially charged pieces of
          parchment come in small packages containing seven sheets. Psychically
          attuned to the specific magnetic fluids a living creature needs to
          part the ethereal veil, these sheets add a 5% bonus to the chance of
          creating meaningful writing for the automatic writing occult skill
          unlock. This use consumes one sheet of the paper, and only one sheet
          can be used per attempt.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 11
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: fwyr9JpJ3VvdXQ7M
    _key: '!actors.items!CCkERpkJdM2ZhIti.fwyr9JpJ3VvdXQ7M'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-pink-yellow-green.webp
    name: Marker Dye
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 103</em>,
          <em>Adventurer's Armory pg. 19</em>, <em>Pathfinder Campaign Setting
          pg. 213</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This dye (available in several colors)
          creates an obvious stain wherever it is splashed. Washing has no
          effect for the first 72 hours (though magic can erase it), but it
          fades completely after 2 weeks. You can throw it as a splash
          weapon.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 15
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: FJiUfxvs6jAsYMgG
    _key: '!actors.items!CCkERpkJdM2ZhIti.FJiUfxvs6jAsYMgG'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Masking Scent (Animal)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>You can use this smelly, silvery paste to
          temporarily repair metal objects. It is sold in a sealed flask and
          reacts with air, turning solid in 1d6+4 minutes. You must make an
          appropriate DC 20 Craft check to repair a metal item with the broken
          condition; success means the object loses the broken condition but
          gains the fragile condition (see page 22). Increase the DC by +5 if
          the broken object is a magic item or by +5 if it is a firearm (add
          both modifiers if the item is a magical firearm). If the check fails,
          the mending paste is consumed but you may try again with another flask
          or conventional repair methods.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: PR0OegFHQ0PPzgkP
    _key: '!actors.items!CCkERpkJdM2ZhIti.PR0OegFHQ0PPzgkP'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/bouquet-pink.webp
    name: Merfolk's Comb
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          154</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 25; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> any
          underwater</p><p><strong>Preparation</strong> A single dose of
          merfolk's comb must be allowed to dry over a period of 7 days while
          being rubbed with alchemical oils once daily to prevent the herb from
          losing its properties during the process. This requires seven separate
          successful DC 14 Craft (alchemy) checks, one every 24 hours during
          this week. If even one of those checks is a failure, the dose of
          merfolk's comb is ruined.</p><p><strong>Use</strong> Anyone who eats a
          dose of merfolk's comb gains the ability to breathe water as well as
          air for 8 hours.</p><h2>Description</h2>This vibrant yellow and
          pale-green variety of seaweed has wide fronds with lines of narrow
          fringe along the upper edge.
      flags:
        dictionary:
          Category: Herbs
      price: 750
      subType: misc
    type: consumable
  - _id: 1zRYAGbRDw5fYcf0
    _key: '!actors.items!CCkERpkJdM2ZhIti.1zRYAGbRDw5fYcf0'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/daisies-pink.webp
    name: Mimameith
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          154</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 25; <strong>Yield</strong> 1d4
          doses (5 lbs. per dose)</p><p><strong>Terrain</strong> any forests or
          mountains</p><p><strong>Preparation</strong> A living mimameith tree
          has hardness 7 (rather than the typical hardness 5 for most wooden
          objects) and fire resistance 5. When a mimameith tree is burned but
          lives, its bark regrows over time with pale gray scarring-such bark
          bears special properties. Once harvested, this bark can be processed
          alchemically. Doing so requires a 5-pound dose of the bark to be
          soaked in water for 8 hours and then boiled off to a thin layer of
          tacky paste with a successful DC 20 Craft (alchemy)
          check.</p><p><strong>Use</strong> When a dose of the pasty residue
          from mimameith bark is applied to a creature's skin as a standard
          action, the subject gains damage reduction 2/bludgeoning, fire
          resistance 5, and immunity to bleed effects for 1
          hour.</p><h2>Description</h2>The bark of this wide-trunked but
          relatively squat tree is resistant to cutting and fire.
      flags:
        dictionary:
          Category: Herbs
      price: 600
      subType: misc
    type: consumable
  - _id: 0ZGLcfXbRgks9XQw
    _key: '!actors.items!CCkERpkJdM2ZhIti.0ZGLcfXbRgks9XQw'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-thick-green.webp
    name: Mimic Fibers
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          11</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>These alchemically prepared fungal spores
          are suspended in a thick green ichor. They grow in patterns that match
          any plant or fungal material they touch, even dead wood, causing any
          cuts or breaks in the matter to mend as if it had never been damaged.
          When applied as a full-round action, mimic fibers heal 1d10+10 points
          of damage to one object made of wood, paper, earth, or other living or
          onceliving material. Even a destroyed item can be repaired (treat as
          if at 0 hit points) as long as the item is in no more than two pieces
          and is held together at the break as the spores are
          applied.<h2>Alchemical Recipe</h2><strong>Recipe</strong> (6 magnesium
          + 6 cytillesh spores)/filtration; <strong>Craft</strong>
          20</p><p><strong>Time</strong> 10 minutes; <strong>Tools</strong>
          filter; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 30
      subType: misc
    type: consumable
  - _id: aPc3judrv22pSvpH
    _key: '!actors.items!CCkERpkJdM2ZhIti.aPc3judrv22pSvpH'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/kitchenware/goblet-worn-engraved-gold.webp
    name: Minkaian Ceremonial Tea
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          28</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This tea is extremely rare and expensive,
          requiring several years to grow and prepare. A geisha bard
          (<em>Pathfinder RPG Ultimate Magic</em> 27) who uses this tea as part
          of her tea ceremony to inspire courage increases the bonuses granted
          by 1. A lotus geisha bard (<em>Pathfinder Player Companion: Dragon
          Empires Primer</em> 22) who drinks this tea increases the bonus
          granted by her enrapturing performance ability by 1; this effect lasts
          for 24 hours.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC
          35
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 900
      subType: misc
    type: consumable
  - _id: 9TXHhDWbr7nkYvTy
    _key: '!actors.items!CCkERpkJdM2ZhIti.9TXHhDWbr7nkYvTy'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Mirage Mixture
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          22</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This fizzy drink causes a tingling in
          the optic nerves. For 1 hour after drinking this tincture, you gain a
          +2 alchemical bonus on Perception checks and Will saving throws to
          disbelieve illusions. You take a -2 penalty on Will saves against
          other mind-affecting effects for the same
          duration.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Tincture
      price: 300
    type: consumable
  - _id: yDQOGdflrTcw3iap
    _key: '!actors.items!CCkERpkJdM2ZhIti.yDQOGdflrTcw3iap'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-blue.webp
    name: Mistletoe
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> -; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>This golden-colored parasitic plant
          grows on many different sorts of trees. Druids harvest mistletoe with
          specially prepared tools and during sacred times of the year.
      flags:
        dictionary:
          Category: Black Market
      subType: misc
    type: consumable
  - _id: RTKViOey8G9PP49R
    _key: '!actors.items!CCkERpkJdM2ZhIti.RTKViOey8G9PP49R'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-thick-orange.webp
    name: Mithralbane Sap
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dirty Tactics Toolbox pg.
          21</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This black alchemical concoction reacts
          when it comes into contact with metal, rapidly expanding into a
          sticky, inflexible substance that temporarily renders armor more
          difficult to use. When the sap is smeared onto metal armor or thrown
          at a creature wearing metal armor (as a ranged touch attack with a
          range increment of 10 feet), that armor is considered one category
          heavier for the purposes of movement (heavy armor is still treated as
          heavy). This increase does not apply to proficiency in wearing the
          armor. Additionally, the arcane spell failure chance of armor affected
          by mithralbane sap increases by 10%, its maximum Dexterity bonus
          decreases by 2 (to a minimum of 0), and its armor check penalty
          increases by 3. These effects last for 1 minute, after which the
          grease hardens and crumbles away. Armor that's not primarily made of
          metal and metal items such as weapons and shields are not meaningfully
          affected by mithralbane sap. Crafting this item requires a successful
          DC 25 Craft (alchemy) check.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: AI03vgCOLDmtzAbT
    _key: '!actors.items!CCkERpkJdM2ZhIti.AI03vgCOLDmtzAbT'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/buds-black.webp
    name: Moly
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          155</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 25; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> any forests or
          plains</p><p><strong>Preparation</strong> This flowering herb must be
          picked whole and boiled with water until the entire amount is reduced
          by half. The resulting mixture is then strained and poured into a
          shallow pan to evaporate. The resulting crust is scraped off as a
          powder.</p><p><strong>Use</strong> Anyone wearing or carrying fresh
          moly gains a +4 resistance bonus on saving throws against spells and
          spell-like abilities. Moly remains fresh in this way for only 12
          hours, regardless of magical attempts to preserve it. When processed
          into a powder with a successful DC 25 Craft (alchemy) check, moly can
          be sprinkled on a creature, object, or area (a standard action) to end
          a spell as if with <em>dispel magic</em> (caster level
          6th).</p><h2>Description</h2>Moly is a plant with flowers white as
          pure milk and roots black as night.
      flags:
        dictionary:
          Category: Herbs
      price: 1200
      subType: misc
    type: consumable
  - _id: n3dEGWqMuEVW0oIR
    _key: '!actors.items!CCkERpkJdM2ZhIti.n3dEGWqMuEVW0oIR'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-liquid-white.webp
    name: Monochrome Camouflage
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Darklands pg.
          30</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This slimy gray unguent distorts
          wavelengths of light beyond of the normal visual spectrum, causing you
          to appear blurry to creatures using darkvision. Applying the
          camouflage takes 1 minute and provides a +4 alchemical bonus on
          Stealth checks against creatures relying on darkvision to see. One
          dose of monochrome camouflage lasts for 1 hour.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 40
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: vRxCMNHqKcn0Hlhd
    _key: '!actors.items!CCkERpkJdM2ZhIti.vRxCMNHqKcn0Hlhd'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/biological/organ-intestines-red.webp
    name: Monster Bait
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Monster Hunter's Handbook pg.
          26</p><p><strong>Category</strong> Adventuring
          Gear</p><h2>Description</h2>This morsel of food contains special
          spices that make it particularly enticing to a certain creature type.
          A creature whose type matches the bait's must attempt a DC 12 Will
          save every minute it remains within 30 feet of the bait; if it fails,
          it takes a -2 penalty on Wisdom-based skill checks while within the
          area and for 1d4 minutes afterward. The creature can end this penalty
          by consuming the bait as a standard action. Additionally, monster bait
          can be used as an additional spell component for the following spells
          to modify the spell's effects.</p><p><em>Beguiling
          gift<sup>APG</sup></em>: Increase the save DC by 2 against targets of
          the bait's associated creature type</p><p><em>Charm monster</em>:
          Increase the save DC by 1 against targets of the bait's associated
          creature type.</p><p><em>Daze monster</em>: Increase the maximum HD of
          the spell by 3 if the target's type matches the bait's associated
          creature type.
      flags:
        dictionary:
          Category: Adventuring Gear
      price: 60
      subType: misc
    type: consumable
  - _id: 8fiQIWAQJu81S5WO
    _key: '!actors.items!CCkERpkJdM2ZhIti.8fiQIWAQJu81S5WO'
    _stats:
      coreVersion: '12.331'
    img: icons/weapons/staves/staff-simple.webp
    name: Moonrod
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          37</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This 1-foot-long, silver-tipped tin rod
          glows dimly when struck as a standard action. It sheds dim light in a
          30-foot radius. However, the light given off by a moonrod is
          particularly easily to perceive for creatures with low-light vision.
          For such creatures, a moonrod increases the light level by one step
          (to a maximum of normal) for a 60-foot radius. It glows for 6 hours,
          after which the silver tip is burned out and
          worthless.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 10
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: MsZ25RcKOHySsp5t
    _key: '!actors.items!CCkERpkJdM2ZhIti.MsZ25RcKOHySsp5t'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-blue.jpg
    name: Necrobane Formaldehyde
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Undead Slayer's Handbook pg.
          11</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This form of the common embalming agent
          comes in a glass beaker with a thick rubber stopper, and is employed
          in regions such as Ustalav, where alchemy is prized as a viable
          defense against the depredations of necromancers. When introduced into
          a dead body, necrobane formaldehyde slows the process of decay,
          keeping the corpse from stinking and rotting for 1d6 days after death.
          Treating a body with necrobane formaldehyde takes 1 hour and requires
          a successful DC 25 Heal check. A corpse injected with necrobane
          formaldehyde is more difficult to resurrect as an undead creature for
          1d6 days after injection. Anyone attempting to seed unlife in a corpse
          treated in this substance must succeed at a DC 14 caster level check
          to complete the process or the spell fails and its components are
          wasted. This is also the case for creatures that ingest necrobane
          formaldehyde and subsequently die before the effect's duration has
          expired.</p><p>If an undead creature ingests necrobane formaldehyde
          (perhaps by eating part of an embalmed corpse), the undead creature
          becomes fatigued for 2d6 rounds.</p><p>When ingested by a living
          creature, necrobane formaldehyde nauseates the imbiber for 1d6 rounds
          and deals 1d4 points of Constitution damage. A successful DC 14
          Fortitude save reduces the nauseated effect to sickened and halves the
          Constitution damage (minimum 1). This is a poison effect, though the
          pungent aroma and unmistakably toxic taste of necrobane formaldehyde
          makes it difficult to use as a surreptitious weapon.</p><p>Crafting
          necrobane formaldehyde requires a successful DC 23 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 23
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 60
      subType: misc
      weight:
        value: 3
    type: consumable
  - _id: KhXeRYDyge9kAX7E
    _key: '!actors.items!CCkERpkJdM2ZhIti.KhXeRYDyge9kAX7E'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-grey.webp
    name: Necrosalt
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Undead Slayer's Handbook pg.
          15</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>The powder in this minute glass vial is
          made of caustic soda treated with consecrated ashes, and is harmless
          to living flesh but dangerous to the deceased. Necrosalt can be thrown
          as a splash weapon with a range increment of 5 feet. On a successful
          ranged touch attack, 1 dose of necrosalt deals 1d4 points of damage to
          a struck corporeal undead creature. For 3 rounds afterward, it deals
          an additional 1d4 points of damage to its victim at the beginning of
          the victim's turn. Intelligent undead creatures can brush necrosalt
          off their bodies and end its effect as a move action. Crafting this
          item requires a successful DC 30 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 30
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 150
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: 9V6YMES4eQR5vsGf
    _key: '!actors.items!CCkERpkJdM2ZhIti.9V6YMES4eQR5vsGf'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/flower-green.webp
    name: Nepenthe
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          155</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 20; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> warm forests or
          swamps</p><p><strong>Preparation</strong> A dose of pollen must be
          mixed with alchemical reagents with a successful DC 16 Craft (alchemy)
          check and then left to sit for 1 hour before it can be
          used.</p><p><strong>Use</strong> A dose of nepenthe pollen must be
          inhaled as a standard action, whereupon the potent vapors act upon
          unpleasant or unknown thoughts and memories. This grants the creature
          a new saving throw to immediately end a single mind-affecting effect
          currently affecting the creature (effects that allow no saving throw
          cannot be removed in this way). An unwilling creature can be dosed
          with the pollen as a touch attack that provokes an attack of
          opportunity. A creature can be affected by a dose of nepenthe only
          once in a single 24-hour period. This is a poison
          effect.</p><h2>Description</h2>This foot-tall blue-green pitcher plant
          produces a pollen that smells faintly of mint and lures insects and
          even small vertebrates toward its dangerous mouth.
      flags:
        dictionary:
          Category: Herbs
      price: 400
      subType: misc
    type: consumable
  - _id: 2AbyoCuP8r9iOEeA
    _key: '!actors.items!CCkERpkJdM2ZhIti.2AbyoCuP8r9iOEeA'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-1.jpg
    name: Nethys's Dagger
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Once you imbibe this metallic-tasting
          liquid, its effects last for 1 hour. During this time, you can accept
          alchemical burn to increase your sneak attack damage by 1d6 points or
          your hidden strike damage by 1d4 or 1d8 points (as appropriate) for 1
          round. If you don't possess the sneak attack or hidden strike
          abilities, imbibing this tonic has no
          effect.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 200
    type: consumable
  - _id: 4CPpd62NrwkBohTa
    _key: '!actors.items!CCkERpkJdM2ZhIti.4CPpd62NrwkBohTa'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/lotus-purple.webp
    name: Nightsage
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg. 155</em>,
          <em>Heroes of the Wild pg. 10</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 14; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> any
          jungles</p><p><strong>Preparation</strong> A dose of nightsage must be
          sprinkled with holy water periodically over an 8-hour drying process
          in natural sunlight; this process requires a successful DC 12 Craft
          (alchemy) check and one flask of holy
          water.</p><p><strong>Use</strong> When dried nightsage is lit on fire
          (a standard action), it produces a thin but pleasant-smelling smoke
          almost like that produced by a stick of incense. A dose of nightsage
          burns for 10 minutes and can be extinguished and reignited for
          multiple uses (but it is always used in 1 minute increments,
          regardless of the actual time spent burning).</p><p>While nightsage
          burns, each corporeal undead creature within a 5-foot radius gains a
          +2 profane bonus on saving throws against positive energy effects
          (including channel energy effects). Necromancers are fond of supplying
          their undead minions with small thuribles containing a burning stick
          of nightsage that can be worn while carrying out their commands. A
          moderate or stronger wind extinguishes a burning stick of
          nightsage.</p><h2>Description</h2>The fragrant purple blossoms of this
          night-blooming wildflower are so deep in hue that they appear almost
          black.
      flags:
        dictionary:
          Category: Herbs
      price: 100
      subType: misc
    type: consumable
  - _id: wWcv8lSstcpSpzAK
    _key: '!actors.items!CCkERpkJdM2ZhIti.wWcv8lSstcpSpzAK'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/material-cotton-white.webp
    name: Nimble Nectar
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 103</em>,
          <em>Advanced Player's Guide pg. 184</p><p><strong>Price</strong> 10
          gp; <strong>Weight</strong> 1 lb.</p><p><strong>Category</strong>
          Alchemical Tools</p><h2>Description</h2>This reagent is often stored
          in the form of small, salty pellets in a dry container, though it can
          also be mixed with a flask of water and carried that way. Nushadir
          neutralizes acid; a vial of pellets or a flask of nushadir-water is
          enough to render a cubic foot of acid safe to touch in 1 minute,
          though this is usually too slow to prevent damage from a thrown vial
          of acid or the contents of a large monster's gullet. Nushadir vapors
          are slightly irritating to the eyes, nose, and mouth, causing nausea
          for 1d4 rounds after close exposure (Fortitude DC 10
          negates).<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 10
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: kxLjd7hvZ5wBHVMq
    _key: '!actors.items!CCkERpkJdM2ZhIti.kxLjd7hvZ5wBHVMq'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/log-rough-petrified-white.webp
    name: Odor Stalk
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Monster Hunter's Handbook pg.
          27</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>These alchemically treated incense sticks
          contain pheromones that certain creatures find repellent. Each odor
          stalk is created to irritate a specific creature type. After burning
          for 1 round, an odor stalk fills a 10-foot square with a clear gas
          that causes any living creature of the prescribed type to become
          nauseated for 1 round, then sickened for as long as it remains in the
          area. On a successful DC 12 Fortitude save, the creature negates the
          nauseated condition but not the sickened condition. This is a poison
          effect. The cloud lasts for 10 minutes, but can be dispersed like
          <em>obscuring mist</em>. Additionally, odor stalks can be used as an
          additional spell component for the following spells to modify the
          spell's effects.</p><p><em>Ghoul touch</em>: The stench only affects
          creatures of the odor stalk's associated creature
          type.</p><p><em>Repel vermin</em>: The spell functions as written, but
          applies to the odor stalk's associated creature type instead of to
          vermin. The Will save DC is always 12 when using this
          component.</p><p><em>Stinking cloud</em>: The Fortitude save DC
          increases by 1 for creatures of the odor stalk's prescribed type, but
          decreases by 1 for all other creature types.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 70
      subType: misc
      weight:
        value: 0.1
    type: consumable
  - _id: 1zoMmoiEYjmdt7TW
    _key: '!actors.items!CCkERpkJdM2ZhIti.1zoMmoiEYjmdt7TW'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-black.webp
    name: Oil
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 57</em>, <em>PRPG
          Core Rulebook pg. 158</p><p><strong>Price</strong> 1 sp;
          <strong>Weight</strong> 1 lb.</p><p><strong>Category</strong>
          Adventuring Gear</p><h2>Description</h2>A 1-pint flask of oil burns
          for 6 hours in a lantern or lamp. You can also use a flask of oil as a
          splash weapon. Use the rules for alchemist's fire, except that it
          takes a fullround action to prepare a flask with a fuse. Once it is
          thrown, there is a 50% chance of the flask igniting
          successfully.</p><p>You can pour a pint of oil on the ground to cover
          an area 5 feet square, provided that the surface is smooth. If lit,
          the oil burns for 2 rounds and deals 1d3 points of fire damage to each
          creature in the area.
      flags:
        dictionary:
          Category: Adventuring Gear
      price: 0.1
      weight:
        value: 1
    type: consumable
  - _id: rVvPWayX7aijbVjB
    _key: '!actors.items!CCkERpkJdM2ZhIti.rVvPWayX7aijbVjB'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-black.webp
    name: Oil Of The Masters
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          207</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This gold-tinted oil smells of wood
          shavings. When you apply it to the strings of a stringed instrument or
          the body of a woodwind, it improves the quality of the instrument's
          sound. For 1 hour, anyone playing the instrument gains a +2 alchemical
          bonus on the appropriate Perform
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: QgFLpiwA4bEXNw3Z
    _key: '!actors.items!CCkERpkJdM2ZhIti.QgFLpiwA4bEXNw3Z'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-thick-orange.webp
    name: Ooze Attractant
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Darklands pg.
          31</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Drow alchemists of House Tracinoa
          developed this mixture to function as a lure for mindless oozes. You
          can throw a flask of ooze attractant as a splash weapon. On a direct
          hit, each mindless ooze within 60 feet must succeed at a DC 12 Will
          save or be compelled to approach the target for the next 1d4+1 rounds.
          On a miss, an ooze still attempts a Will save, but on a failure it
          instead approaches the square in which the flask landed. Once an ooze
          moves adjacent to the targeted creature or into the targeted square,
          it resumes its normal behavior. An ooze can be affected by ooze
          attractant only once in a 24-hour period.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: N09uZ2o8QRdBxrsX
    _key: '!actors.items!CCkERpkJdM2ZhIti.N09uZ2o8QRdBxrsX'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Ooze Grease
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeon Denizens Revisited pg.
          19</p><p><strong>Category</strong> Alchemical Tools</p><h2><img
          src="modules/pf-content/assets/ThreeFiveSymbol.gif" title="3.5
          Material"/>Description</h2>This alchemical concoction can be spread
          over a Medium or Small creature's body as a full-round action. It
          provides a +5 alchemical bonus on Escape Artist checks, grapple checks
          to avoid a grapple, and Reflex saves to avoid an ooze's improved grab
          or engulf abilities, but gives a -5 penalty to disarm checks, grapple
          checks to start or maintain a grapple or pin, and other checks that
          may be hindered by a loose grip (such as Climb). One application lasts
          for up to 1 hour and can be removed with soap and
          water.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: HE9lRdAFwTx2OrJY
    _key: '!actors.items!CCkERpkJdM2ZhIti.HE9lRdAFwTx2OrJY'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/gems/gem-fragments-turquoise.webp
    name: Oozing Vat (Gargantuan)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          208</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Similar to sunrods, these small white
          pebbles are alchemically treated so that they shed a soft light once
          activated by striking them together. The glow is faint-just barely
          enough to illuminate the stone. Though not bright enough to serve as
          an effective light source, they can be placed in patterns to create
          messages or laid out in a path, marking it for others to
          follow.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: dxM1o9Lil0LHZQVA
    _key: '!actors.items!CCkERpkJdM2ZhIti.dxM1o9Lil0LHZQVA'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Perfume/Cologne
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeoneer's Handbook pg.
          27</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This sealed vial contains 1 ounce of
          milky white gel. Once the vial's seal is broken, the liquid reacts
          with the surrounding air and begins to rapidly heat up, glowing like a
          candle for 1 hour. After that hour, the oxidization of the chemical
          agent is complete, and the gel dissolves in a white-hot flash, dealing
          3d6 points of fire damage to anything directly in contact with it. A
          single dose of phosphorescent gel can coat 6 square inches of a
          surface. Multiple doses of phosphorescent gel can be used to coat
          larger surfaces, but the amount of damage dealt does not stack. The
          conflagration occurs in an instant, and the fire generated doesn't
          spread, though it can be used to ignite a larger explosive such as a
          fuse grenade or pot of oil.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 45
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: r2lCczowisekyVY3
    _key: '!actors.items!CCkERpkJdM2ZhIti.r2lCczowisekyVY3'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/gems/gem-rough-cushion-orange-red.webp
    name: Planar Alchemical Catalyst
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Blood of the Elements pg.
          21</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This vibrant, variegated gemstone is
          found naturally on the Elemental Plane of Earth but can also be
          artificially reproduced, albeit with a fair amount of difficulty. The
          catalyst is highly sought for its remarkable ability to enhance and
          alter alchemical tools and weapons.</p><p>As a move action, you can
          apply the catalyst to one of the following items to enhance or alter
          the alchemical item's effects (items marked with an asterisk ['*'] are
          detailed in <em>Pathfinder RPG Ultimate Equipment</em>). If the item
          is not used within 3 rounds, the benefit of the enhanced alchemical
          item is lost and the item reverts to normal. Once applied to an item,
          a planar alchemical catalyst is expended.</p><p><em>Alchemist's
          Fire</em>: The type of energy damage changes to acid, cold, or
          electricity (user's choice).</p><p><em>Flash Powder</em>*: The DC of
          the Fortitude save increases to 15, and targets are dazzled for 1d4+1
          rounds whether or not they succeed at their saving
          throw.</p><p><em>Holy Water</em>: The splash area becomes difficult
          terrain for undead and evil outsiders, and undead or evil outsiders
          that end their turn in the affected area take 2 points of damage. Both
          of these effects last 3 rounds.</p><p><em>Impact Foam</em>*: The foam
          does not dissolve when exposed to acid or water, and instead becomes a
          pliable-yet-rigid platform that can be dragged onto water and used as
          a makeshift raft for up to 5 Medium creatures. The 10-minute duration
          still applies.</p><p><em>Liquid Blade</em>*: The blade deals 2 points
          of bleed damage on a hit (this does not stack with bleed damage from
          other sources).</p><p><em>Liquid Ice</em>*: In addition to its normal
          effects, the liquid ice acts as a smokestick, except it emits dense
          white fog rather than smoke.</p><p><em>Shard Gel</em>*: The shard gel
          remains embedded in the target on a direct hit, continuing to deal 1d3
          points of damage each round after until the gel dissolves (5 rounds)
          or the target takes a full round action to remove
          it.</p><p><em>Tanglefoot Bag</em>: The DC of the Reflex saving throw
          increases to 17, the penalty on attack rolls is -3, and the tanglefoot
          bag can affect targets up to size category
          Huge.</p><p><em>Thunderstone</em>: In addition to being deafened,
          targets that fail their Fortitude saves are staggered for 1 round.
          Affected targets are deafened for 1d4 rounds whether or not they
          succeed at their saving throw.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 200
      subType: misc
      weight:
        value: 2
    type: consumable
  - _id: 7izunyqOneTIELw1
    _key: '!actors.items!CCkERpkJdM2ZhIti.7izunyqOneTIELw1'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/ink-quill-red.webp
    name: Poison Diffuser
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          9</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This compound comes in a tiny eyedropper.
          When you combine a dose of poison diffuser with a dose of contact or
          ingested poison, the poison becomes a gas, slowly diffusing into the
          surrounding air. The poison is treated as an inhaled poison for 3
          rounds, after which the poison and the poison diffuser are both
          expended and become inert. Any creature that passes within 5 feet of a
          diffused poison while it is active must save against the vaporous
          toxin.</p><p>If you are using spontaneous alchemy, adding urea to the
          alchemical recipe delays a poison diffuser's activation time. For
          every 20 doses of urea (worth a total of 10 gp) incorporated into the
          alchemical creation process, the time from which the diffuser is added
          to the poison to the time the poison begins spreading into the air
          increases by 1 round.<h2>Alchemical Recipe</h2><strong>Recipe</strong>
          (100 brimstone + 180 salt + 180 spirit of wine)/fermentation;
          <strong>Craft</strong> 25</p><p><strong>Time</strong> 1 day;
          <strong>Tools</strong> heat source; <strong>Type</strong> alchemical
          tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 200
      subType: misc
    type: consumable
  - _id: qIs8EMr5hpZFniNa
    _key: '!actors.items!CCkERpkJdM2ZhIti.qIs8EMr5hpZFniNa'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/mortar-liquid-pink.webp
    name: Poison Lip Paint
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          233</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Adventuring
          Gear</p><h2>Description</h2>Poison lip paint is a favorite among
          courtiers who practice the arts of deception and intrigue. It allows
          the wearer to deliver a dose of contact or ingested poison by means of
          a kiss. This kiss can be to the hand, cheek, or other exposed skin to
          deliver a contact poison, but must be on the mouth for an ingested
          poison. A kiss delivers the full dose of the poison, and that
          application of poison lip paint then becomes nonpoisonous. To use
          poison lip paint without being exposed to the poison, the wearer must
          first apply a protective layer of base material. When using an
          ingested poison, the wearer can instead consume an antidote prior to
          application. (When the user applies a contact poison, preemptively
          consuming an antidote results in the wearer's skin harmlessly
          absorbing the poison, as does immunity to poison.) A kit contains
          enough base material and lip paint for 10 doses. The poisons must be
          purchased separately and mixed into the lip paint.
      flags:
        dictionary:
          Category: Adventuring Gear
      price: 5
      subType: misc
    type: consumable
  - _id: UEZid1VNoaYW5D44
    _key: '!actors.items!CCkERpkJdM2ZhIti.UEZid1VNoaYW5D44'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/scribal/pen-steel-grey-brown.webp
    name: Poison Sealant
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          209</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This henna-like paste creates a dark
          brown tattoo on the hands or feet that fades over the next 2d6 days.
          The tattoo temporarily boosts the strength of a vishkanya's natural
          poison, increasing the DC of the next weapon envenomed with the
          vishkanya's blood or saliva by +2 (once used, the tattoo is merely
          decorative and does not affect the creature's poison). A typical
          tattoo consists of intricate whorls and spiritual symbols on the hands
          or feet.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
    type: consumable
  - _id: xruuul78ByuRWlP7
    _key: '!actors.items!CCkERpkJdM2ZhIti.xruuul78ByuRWlP7'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/biological/suckers-green.webp
    name: Potion Sponge
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          177</p><p><strong>Price</strong> 2 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This egg-sized sponge is covered in a
          layer of waterproof edible wax, designed to absorb 1 dose of a potion.
          Chewing a potion sponge and swallowing its liquid contents is a
          full-round action. A creature of at least Large size can swallow the
          sponge in its entirely; other creatures must spit out the sponge once
          it's depleted (a free action). Unlike a potion that is drunk from a
          vial, a potion sponge can be used underwater. A potion can be poured
          from a vial into a sponge potion (or squeezed from a sponge into a
          vial) as a full-round action. The potion sponge is immune to attacks
          that specifically target crystal, glass, ceramic, or porcelain, such
          as <em>shatter</em>. It otherwise works like a potion vial.
          <h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 2
      subType: misc
    type: consumable
  - _id: gQV8lZctGRXwrFzU
    _key: '!actors.items!CCkERpkJdM2ZhIti.gQV8lZctGRXwrFzU'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/powder-grey.webp
    name: Powder
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 57</em>,
          <em>Adventurer's Armory pg. 19</em>, <em>Pathfinder Society Field
          Guide pg. 48</em>, <em>Advanced Player's Guide pg.
          183</p><p><strong>Price</strong> 1 cp; <strong>Weight</strong> 1/2
          lb.</p><p><strong>Category</strong> Adventuring
          Gear</p><h2>Description</h2>Powdered chalk, flour, and similar
          materials are popular with adventurers for their utility in
          pinpointing invisible creatures. Throwing a bag of powder into a
          square is an attack against AC 5, and momentarily reveals whether an
          invisible creature is there. A much more effective method is to spread
          powder on a surface (which takes 1 full round) and look for
          footprints.
      flags:
        dictionary:
          Category: Adventuring Gear
      price: 0.01
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: 5c7Eph4TeOqXyu4l
    _key: '!actors.items!CCkERpkJdM2ZhIti.5c7Eph4TeOqXyu4l'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/gems/pearl-natural.webp
    name: Pressure Pill
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Aquatic Adventures pg.
          56</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When you swallow this marble-shaped
          alchemical pill as a full-round action, it instantly adjusts your body
          to the surrounding water pressure, though you take 3 points of
          nonlethal damage for every 100 feet of adjustment necessary (see
          Pressure on page 48).
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 75
      subType: misc
    type: consumable
  - _id: AY7tISUkQpdxm6vv
    _key: '!actors.items!CCkERpkJdM2ZhIti.AY7tISUkQpdxm6vv'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Prowler's Palliative
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          23</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This pitch-black liquid slows your
          heart rate, putting you in an almost trance-like state. For 1 hour
          after drinking this tincture, you gain a +2 alchemical bonus on
          Stealth checks, you can use Stealth while moving at full speed without
          penalty, and the DCs for Intimidate checks to demoralize you is 2
          higher. The tincture's sedative nature causes you to take a -4 penalty
          on Strength-based skill checks and a -2 penalty on damage rolls for
          the same duration.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Tincture
      price: 300
    type: consumable
  - _id: fR1sn49L7h0S5LCI
    _key: '!actors.items!CCkERpkJdM2ZhIti.fR1sn49L7h0S5LCI'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/vials-blue-pink.webp
    name: Purity Test
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          18</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>This set of special disposable reagents
          can be used in conjunction with an alchemist's lab to detect whether a
          drug has been cut with inferior-grade material or filler, granting a
          +5 competence bonus on Craft (alchemy) checks to detect such
          chicanery.
      flags:
        dictionary:
          Category: Black Market
      price: 10
      subType: drug
      weight:
        value: 2
    type: consumable
  - _id: mPqN5ZDHtDExduL5
    _key: '!actors.items!CCkERpkJdM2ZhIti.mPqN5ZDHtDExduL5'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/magic-yellow.jpg
    name: Quick-Step Concoction
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          27</p><p><strong>Category</strong>
          Concoctions</p><h2>Description</h2>This minty fluid quickens your feet
          and improves your balance, granting a +2 alchemical bonus on
          Acrobatics checks and to your CMD against trip attempts. However, you
          become easily distracted and take a -2 penalty on Perception checks.
      flags:
        dictionary:
          Category: Concoctions
      price: 75
    type: consumable
  - _id: XhwMvpy4sB93WGk8
    _key: '!actors.items!CCkERpkJdM2ZhIti.XhwMvpy4sB93WGk8'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-green.jpg
    name: Rake's Friend
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>You can accept alchemical burn when you
          imbibe this draught to gain 1 grit point or 1 panache point. The
          effects of rake's friend last for 1 hour; if not spent within 1 hour,
          this point is lost. Rake's friend has no effect if you don't have the
          ability to use grit or panache.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 120
    type: consumable
  - _id: 6GUKXenxBrKKRHFn
    _key: '!actors.items!CCkERpkJdM2ZhIti.6GUKXenxBrKKRHFn'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/documents/paper-plain-white.webp
    name: Reagent Paper
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          208</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This slip of paper can aid in the
          identifying of liquids. Its color changes in accordance to basic
          traits such as acidity, salinity, or magic. This confers a +2
          alchemical bonus on any Craft (alchemy) or Spellcraft check made to
          identify potions or other liquids.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 1
      subType: misc
    type: consumable
  - _id: ydNWTk7gS6sld3Sq
    _key: '!actors.items!CCkERpkJdM2ZhIti.ydNWTk7gS6sld3Sq'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-thick-green.webp
    name: Reanimating Fluid
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Horror Adventures pg.
          213</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This viscous, translucent green fluid is
          typically stored in a large syringe. When injected into a mostly
          intact corpse of a Medium or smaller creature that has been dead for
          no more than 1 day (time spent under effects like <em>gentle
          repose</em> don't count against this time), the fluid gives the corpse
          a rudimentary semblance of life, reactivating its nerves and muscle
          tissue. This causes the corpse to reanimate and shamble around
          erratically for 1 minute. The result is not an undead creature, nor is
          it a construct. The reanimated corpse remains utterly lifeless and is
          driven only by muscular spasms that cause it shuffle 20 feet in a
          random direction each round, gasping and blinking eerily as it goes.
          When the corpse hits a solid barrier or is attacked, it stops moving.
          On its next turn, roll 1d8 to determine where it goes next. On a 1, it
          continues forward in the same direction it had been previously moving
          (or runs up against the same barrier). On a 2, it turns 45* clockwise
          and heads in that direction; on a 3, it turns 90* clockwise and heads
          in that direction; and so on. The corpse can't attack, doesn't defend
          itself, and-as an object-has AC 10 and 12 hit points. Crafting a
          syringe of reanimating fluid requires a successful DC 25 Craft
          (alchemy) check.<h2>Construction</h2><strong>Craft (Alchemy)</strong>
          DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
    type: consumable
  - _id: aTXhfB4LzVJbs1av
    _key: '!actors.items!CCkERpkJdM2ZhIti.aTXhfB4LzVJbs1av'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/lights/torch-brown.webp
    name: Red Flame Torch
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          246</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This otherwise normal-looking torch is
          encrusted with lithium salts and burns with a dark red flame. It sheds
          only dim light in a 10-foot radius, and the light it casts is
          undetectable outside this radius by normal vision, darkvision, or
          lowlight vision. This torch burns for 1 hour.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 20
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: 9cX69s1xUtIypGFs
    _key: '!actors.items!CCkERpkJdM2ZhIti.9cX69s1xUtIypGFs'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-powder-purple.webp
    name: Retort
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Monster Codex pg.
          177</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When applied to the nose as a standard
          action, this alchemical paste traps airborne particles and sharpens
          your olfactory receptors, heightening your sense of smell. You gain
          the scent ability, except you can detect creatures and odors at only
          half the distance. If you already have the scent ability, rhinarium
          paste increases the range at which you can detect creatures by 50%.
          Rhinarium paste's effects lasts for 1 hour. Crafting this item
          requires a successful DC 20 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 75
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: 4PTku49ChNv3MYE2
    _key: '!actors.items!CCkERpkJdM2ZhIti.4PTku49ChNv3MYE2'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/kitchenware/vase-012.webp
    name: Rockshard Canister
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Melee Tactics Toolbox pg.
          21</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Two separate compartments make up this
          black glass canister the size of a helmet. The large lower compartment
          contains hundreds of jagged shards of obsidian. The upper airtight
          chamber contains a sticky resin that hardens immediately upon contact
          with air. When you strike the canister with a bludgeoning melee weapon
          as a standard action, both compartments shatter, causing the obsidian
          shards to adhere to the weapon. The weapon deals piercing damage
          rather than bludgeoning damage for 10 minutes, at which point the
          resin dries and the shards fall off, or until you roll a natural 1 on
          an attack roll, which causes the shards to break off prematurely. If
          the weapon is made of a special material, the special properties of
          its material are suppressed while the obsidian shards adhere to the
          weapon.</p><p> If you use a rockshard canister to coat an unarmed
          strike or natural weapon, you take 2d6 points of piercing damage when
          shattering the canister to apply the shards. For unarmed attacks, this
          can be avoided by carefully applying thick leather or rope straps to
          your hands and feet, which requires 5 minutes of work, prior to
          smashing the canister.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
      weight:
        value: 25
    type: consumable
  - _id: 2fkfpq4PVpcfzbER
    _key: '!actors.items!CCkERpkJdM2ZhIti.2fkfpq4PVpcfzbER'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-teal.webp
    name: Rusting Powder
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This flaky brown powder derived from rust
          monster fluids causes iron and similar metals to corrode and fall
          apart. If you apply a dose of rusting powder to a metal lock or trap
          as part of using the Disable Device skill, you gain a +5 alchemical
          bonus to open the lock or disable the trap, but there is a 75% chance
          that the mechanism is destroyed and cannot be used afterward. If the
          check fails, the mechanism is destroyed. A destroyed lock cannot be
          unlocked (but still counts as locked for the purpose opening the
          locked object). A destroyed trap mechanism immediately triggers the
          trap. If you fail the DC by 5 or more, the powder also lands on an
          object in your square (including possibly your armor or weapon),
          dealing 5 hit points of damage to the object.</p><p>Rusting powder is
          sold in a paper tube; you apply it by tearing the ends off the tube
          and blowing the flakes into the target device. Rusting powder does not
          affect gold, silver, copper, bronze, brass, or mithral, but easily
          affects iron, steel, and adamantine.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 30
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 60
      subType: misc
    type: consumable
  - _id: gPMv2BLdyVobAFCy
    _key: '!actors.items!CCkERpkJdM2ZhIti.gPMv2BLdyVobAFCy'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-blue.jpg
    name: Scent Blocker
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Wild pg.
          9</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This alchemical oil takes 1 minute to
          apply and completely masks your odor for 6 hours. Creatures can't use
          the scent ability to track you, detect your presence, or pinpoint your
          location. A single dose of scent blocker covers a Medium or smaller
          creature. For each size category larger than Medium a creature is,
          double the number of doses (and application time) required. Crafting
          scent blocker requires a successful DC 23 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 23
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 80
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: rE03mYCEEGckUjjc
    _key: '!actors.items!CCkERpkJdM2ZhIti.rE03mYCEEGckUjjc'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-blue.jpg
    name: Scent Cloak
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 103</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Category</strong>
          Alchemical Tools</p><h2>Description</h2>This collection of coarsely
          ground spices, seeds, musk, and alchemical reagents are meant to be
          rubbed into your skin and clothes in order to override your scent,
          increasing the DC of tracking you by scent by +10 for 24 hours.
          Because you still have a smell, creatures with scent can still detect
          and pinpoint you if you are cloaked; they just can't identify your
          smell as something unique. Washing for 1 full round removes the scent
          cloak.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 20
      subType: misc
      weight:
        value: 2
    type: consumable
  - _id: ozPFwj1WnUG72lXr
    _key: '!actors.items!CCkERpkJdM2ZhIti.ozPFwj1WnUG72lXr'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-orange.webp
    name: Scentbane Incense
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          37</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Scentbane incense is a form of smokestick
          that also blocks most scents. As long as the smoke lasts, creatures
          with the scent special ability must make Perception checks, opposed by
          the Stealth checks of any creatures within the smoke, to use scent to
          locate creatures within the smoke. If a creature remains in scentbane
          incense for 5 rounds or more, the smoke clings to it for 1 round after
          it leaves, making it similarly difficult to find by scent during that
          time.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 80
      subType: misc
    type: consumable
  - _id: k9lFBUdrwnPeDRNK
    _key: '!actors.items!CCkERpkJdM2ZhIti.k9lFBUdrwnPeDRNK'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/blooms-purple.webp
    name: Seeing Slime
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          155</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 19; <strong>Yield</strong> 1
          dose</p><p><strong>Terrain</strong> any
          underground</p><p><strong>Preparation</strong> After collecting this
          rare slime mold from where it naturally occurs in the lightless
          depths, the herbalist must combine the slime with mineral salts and
          store it in an airtight container such as a bottle or
          jar.</p><p><strong>Use</strong> The slime causes mild skin rashes, but
          it grants darkvision out to a range of 30 feet for 24 hours if applied
          to the eyes (a full-round action that provokes attacks of
          opportunity). If the subject already had darkvision, the darkvision's
          range increases by 30 feet. Frequent use of this herb causes permanent
          purple blotches on the skin around the user's
          eyes.</p><h2>Description</h2>This violet slime mold is found only in
          rock formations containing nodules of agate.
      flags:
        dictionary:
          Category: Herbs
      price: 160
      subType: misc
    type: consumable
  - _id: GftfKMr8pL5EKHFC
    _key: '!actors.items!CCkERpkJdM2ZhIti.GftfKMr8pL5EKHFC'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/survival/rope-wrapped-loops-grey.webp
    name: Serpent Line
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the Sands pg.
          28</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This 30-foot length of rope is braided
          with musk-cured strips of snakeskin from a variety of desert serpents,
          and is typically laid out in a 5-foot-radius circle around the edge of
          a tent or around a sleeping creature. When it's laid out in this way,
          common snakes crawling across the desert floor often mistake the
          serpent line for another snake and shy away from crossing it. Ordinary
          venomous snakes approaching a serpent line must succeed at a DC 10
          Will save or turn away from it, though if they notice potential prey
          within the serpent line, they may continue to lurk nearby. At the GM's
          discretion, an exceptionally aggressive or hungry snake may gain a +2
          circumstance bonus on its saving throw. Snakes that are magically
          controlled ignore a serpent line.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 12
      subType: misc
      weight:
        value: 5
    type: consumable
  - _id: bxUB9SQKbf85oH9v
    _key: '!actors.items!CCkERpkJdM2ZhIti.bxUB9SQKbf85oH9v'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-white.webp
    name: Shaman's Paint
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeoneer's Handbook pg.
          27</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Created by suspending the spores of a
          shrieker mushroom in a thick mixture of wheat paste and vermiculite,
          this thick sludge comes in a soundproof, stone container. Shrieking
          paste creates an obnoxious piercing noise when exposed to even minute
          amounts of movement or light. This makes applying the paste a very
          noisy endeavor at best. However, once the paste is applied and left
          alone for several rounds, it once again becomes silent. Thereafter,
          any light source or movement within 10 feet of the paste causes it to
          shriek for 1d3 rounds. A single container contains enough shrieking
          paste to coat 1 square foot of a surface. If left undisturbed for
          several weeks in a dank, lightless setting, shrieking paste might
          eventually grow into a colony of shrieker mushrooms (<em>Core Rulebook
          </em>416).<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 35
      subType: misc
      weight:
        value: 2
    type: consumable
  - _id: QPGTez7iCp53T5jQ
    _key: '!actors.items!CCkERpkJdM2ZhIti.QPGTez7iCp53T5jQ'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-teal.webp
    name: Silence Dust
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          15</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This ashen powder can be thrown as a
          splash weapon, muffling all sound within a 15-foot-radius sphere
          centered on the point of impact. Perception checks to notice sound
          emanating from or passing through the cloud take a -10 penalty.
          Alternatively, applying a dose of silence dust to your feet as a
          standard action grants you a +5 circumstance bonus on Stealth checks
          to avoid being heard while walking. The dust is effective for 1 minute
          before it disperses.<h2>Alchemical Recipe</h2><strong>Recipe</strong>
          (12 dew of lunary + 40 myrrh)/calcination; <strong>Craft</strong>
          20</p><p><strong>Time</strong> 1 hour; <strong>Tools</strong>
          crucible; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 60
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: RvZGOZx3IBswHBcO
    _key: '!actors.items!CCkERpkJdM2ZhIti.RvZGOZx3IBswHBcO'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-1.jpg
    name: Silver Drops
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Blood of the Moon pg.
          30</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>A creature with DR/silver can swallow
          these bitter-tasting capsules of a concentrated alchemical silver to
          convert their damage reduction to DR/- for 2d4 rounds. When this
          effect ends, the creature is nauseated for 1 round. A creature can
          only benefit from silver drops once per 24 hours. Crafting this item
          requires a successful DC 30 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 30
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 180
      subType: misc
    type: consumable
  - _id: fwVUvQ20G8Qh2i05
    _key: '!actors.items!CCkERpkJdM2ZhIti.fwVUvQ20G8Qh2i05'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-blue.jpg
    name: Singer's Solution
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When you imbibe this draught, you can
          accept alchemical burn to gain an additional 4 rounds of bardic
          performance or raging song for the day. The effects of singer's
          solution last for 1 hour; if not spent within 1 hour, these additional
          rounds are lost. Singer's solution has no effect if you don't have the
          bardic performance or raging song class
          features.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 120
    type: consumable
  - _id: m0Fk5zUieabMwQBu
    _key: '!actors.items!CCkERpkJdM2ZhIti.m0Fk5zUieabMwQBu'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/magic-yellow.jpg
    name: Slow-Heart Concoction
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          27</p><p><strong>Category</strong>
          Concoctions</p><h2>Description</h2>This inky concoction slows the flow
          of blood, reducing any bleed damage you would suffer by 2 and causing
          you to automatically stabilize when dying. The concoction dulls your
          response speed, however, imparting a -1 penalty on your Reflex saving
          throws.
      flags:
        dictionary:
          Category: Concoctions
      price: 50
    type: consumable
  - _id: IPxlcLCppjdj8Sbg
    _key: '!actors.items!CCkERpkJdM2ZhIti.IPxlcLCppjdj8Sbg'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/material-cotton-white.webp
    name: Smoke Bomb
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 103</em>,
          <em>Advanced Player's Guide pg. 184</em>, <em>Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This small clay sphere contains two
          alchemical substances separated by a thin barrier. When you break the
          sphere, the substances mingle and fill a 5-foot square with a cloud of
          foul but harmless yellow smoke. The smoke pellet acts as a smokestick,
          except the smoke only lasts for 1 round before dispersing. You may
          throw a smoke pellet as a ranged touch attack with a range increment
          of 10 feet.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
    type: consumable
  - _id: ZWRscjWqqz5gdkLo
    _key: '!actors.items!CCkERpkJdM2ZhIti.ZWRscjWqqz5gdkLo'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-orange.webp
    name: Smoke Signal
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the Sands pg.
          28</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This alchemically fused powder ball
          creates a plume of brightly colored smoke when lit. While the smoke is
          not thick enough to significantly impair vision, it is clearly visible
          up to 1d6 miles away under average conditions, and may be visible at
          greater distances in ideal conditions. Many desert clans use
          particular signature colors of smoke to indicate their allegiance, or
          use smoke signals with specific colors or in a pattern of sequential
          colors to convey coded messages.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 5
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: KJFHBZhEfH0gKpni
    _key: '!actors.items!CCkERpkJdM2ZhIti.KJFHBZhEfH0gKpni'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-orange.webp
    name: Smokestick
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg. 30</em>, <em>PRPG Core
          Rulebook pg. 158</em>, <em>Ultimate Equipment pg.
          103</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This alchemically treated wooden stick
          instantly creates thick, opaque smoke when burned. The smoke fills a
          10-foot cube (treat the effect as a<em> fog cloud </em>spell, except
          that a moderate or stronger wind dissipates the smoke in 1 round). The
          stick is consumed after 1 round, and the smoke dissipates naturally
          after 1 minute.<h2>Alchemical Recipe</h2><strong>Recipe</strong> (4
          darkwood + 5 saltpeter)/calcination; <strong>Craft</strong>
          20</p><p><strong>Time</strong> 1 hour; <strong>Tools</strong>
          crucible; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 20
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: v2MnGyBuG2qRFCBy
    _key: '!actors.items!CCkERpkJdM2ZhIti.v2MnGyBuG2qRFCBy'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-green.jpg
    name: Snake Oil
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Occult Adventures pg.
          252</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This mildly toxic liniment numbs flesh
          and can soothe injuries. Though the tincture is actually poisonous, an
          imbiber who avoids becoming poisoned recovers from minor injuries. <h2
          class="title">Snake Oil</h2> <strong>Type</strong> poison (contact);
          <strong>Save</strong> Fortitude DC 12</p><p> <strong>Onset</strong> 1
          round; <strong>Frequency</strong> 1/minute for 5 minutes</p><p>
          <strong>Effect</strong> On a failed save, snake oil deals 1 point of
          nonlethal damage. However, on a successful save, the toxin heals 1d6
          points of nonlethal damage; <strong>Cure</strong> 1
          save<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 20
    type: consumable
  - _id: x3p0kb3IL87N8baY
    _key: '!actors.items!CCkERpkJdM2ZhIti.x3p0kb3IL87N8baY'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/magic-yellow.jpg
    name: Snake-Tongue Concoction
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          27</p><p><strong>Category</strong>
          Concoctions</p><h2>Description</h2>This lime-green goo turns your
          saliva venomous. Once during the concoction's duration, as a swift
          action, you can lick or spit on a held weapon to apply a dose of black
          adder venom to the weapon. If you are a vishkanya<sup>ARG</sup>, you
          instead apply the poison granted by your toxic racial trait; this does
          not count against that trait's uses per day. The concoction weakens
          your physical defenses, imparting a -1 penalty on your Fortitude
          saving throws.
      flags:
        dictionary:
          Category: Concoctions
      price: 50
    type: consumable
  - _id: AVYT2NIo3hx2PFr2
    _key: '!actors.items!CCkERpkJdM2ZhIti.AVYT2NIo3hx2PFr2'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Sorcerer's Spirits
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          23</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This silvery liquid amplifies magical
          energies. For 1 hour after drinking this tincture, treat your caster
          level as 2 higher for the purpose of determining spells' durations and
          ranges. The liquid unsettles the stomach, imposing a -1 penalty on
          Fortitude and Reflex saves for the same duration. Whenever you fail a
          Fortitude or Reflex save while under these effects, you must succeed
          at a DC 20 Fortitude saving throw or become nauseated for 1
          round.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 30
      flags:
        dictionary:
          Category: Tincture
      price: 300
    type: consumable
  - _id: 6UrR3aNwjfWCN17B
    _key: '!actors.items!CCkERpkJdM2ZhIti.6UrR3aNwjfWCN17B'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-orange.webp
    name: Sparkle Smoke
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Guide pg. 45</em>,
          <em>Pathfinder #106: For Queen and Empire pg.
          75</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When inhaled, this incense causes
          creatures to see dazzling auras around light sources, drawing their
          attention to such illumination as the moon or stars and away from
          other nearby creatures. Any creature inhaling sparkle smoke that fails
          a DC 15 Fortitude saving throw takes a -4 penalty on Perception checks
          to notice creatures smaller than itself in areas of at least dim light
          for 1 hour. Crafting a dose of sparkle smoke requires a successful DC
          15 Craft (alchemy) check.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: 1QE9f7F73hpoodKu
    _key: '!actors.items!CCkERpkJdM2ZhIti.1QE9f7F73hpoodKu'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-thick-orange.webp
    name: Speech Resin
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Chewing this gummy substance grants you
          1d4 uses of alchemical inspiration that can be used only on
          Charismabased skill checks. This benefit lasts for 1 hour, during
          which you must roll all Wisdom-based skill checks twice and take the
          worse result.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC
          25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 410
      subType: misc
    type: consumable
  - _id: 8WyfQx93gSJdGOts
    _key: '!actors.items!CCkERpkJdM2ZhIti.8WyfQx93gSJdGOts'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/magic-yellow.jpg
    name: Sphere-Song Concoction
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          27</p><p><strong>Category</strong>
          Concoctions</p><h2>Description</h2>This syrupy concoction fills you
          with a dreamy, peaceful feeling, providing a +1 alchemical bonus on
          Will saving throws. However, the dreaminess slows your reactions to
          danger, imparting a -2 penalty on initiative checks.
      flags:
        dictionary:
          Category: Concoctions
      price: 50
    type: consumable
  - _id: osPBnJTeqDvUQoMe
    _key: '!actors.items!CCkERpkJdM2ZhIti.osPBnJTeqDvUQoMe'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-1.jpg
    name: Spider Sac
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          9</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This fiber is composed of tiny strands of
          razor-sharp glass laced with alchemical elements. Anyone who touches
          it finds her skin irritated by countless tiny abrasions. Though it
          causes only minor discomfort, it opens the skin enough for poison to
          seep through, allowing injury poisons to be delivered to the affected
          creature as if they were contact poisons. The abrasions last for 1
          hour or until cleaned and treated with a successful DC 10 Heal check
          (a full-round action). Poisoners sometimes place spirit of glass in a
          target's wardrobe or amid her personal effects along with a rag soaked
          in poison. Spirit of glass is often mistaken for lint or loose cloth,
          though it and the abrasions it causes can be identified with a
          successful DC 15 Craft (alchemy) check or DC 17 Heal check. Spirit of
          glass can be used only once before it is expended.<h2>Alchemical
          Recipe</h2><strong>Recipe</strong> (2 cold iron + 7 darkwood + 5
          gold)/calcination; <strong>Craft</strong>
          25</p><p><strong>Time</strong> 1 hour; <strong>Tools</strong>
          crucible; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 35
      subType: misc
    type: consumable
  - _id: zw6urgDiHPbvTXHz
    _key: '!actors.items!CCkERpkJdM2ZhIti.zw6urgDiHPbvTXHz'
    _stats:
      coreVersion: '12.331'
    img: icons/weapons/staves/staff-skull-brown.webp
    name: Spiritbane Spike
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Undead Slayer's Handbook pg.
          13</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When you slash this alchemically treated
          iron spike against your flesh-a move action that deals 1d6 points of
          damage- the spike extends and becomes a short sword with the <em>ghost
          touch </em>weapon special ability. The spike reverts to its old form
          after 10 minutes, corroded and useless. Should a spiritbane spike
          rematerialize within a corporeal body, it is shunted to the nearest
          empty space without effect. Crafting this item requires a successful
          DC 25 Craft (alchemy) check.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 300
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: j2U2OrP1EoETj3It
    _key: '!actors.items!CCkERpkJdM2ZhIti.j2U2OrP1EoETj3It'
    _stats:
      coreVersion: '12.331'
    img: icons/containers/bags/sack-simple-leather-brown.webp
    name: Stagnant Fog Sack
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Blood of the Elements pg.
          19</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Gathered within this tightly woven,
          alchemically treated canvas sack is a sample of the pervasive fetid
          fog that looms near the border of the Plane of Air and the Plane of
          Water. When opened, the fog billows out in a 30-foot-radius area.
          Sight is extremely limited in an area of stagnant fog. A creature
          within 15 feet has concealment (20% miss chance), while creatures
          farther away have total concealment (50% miss chance, and the attacker
          can't use sight to locate the target). In addition, creatures that end
          their turn within the cloud must succeed at a DC 14 Fortitude save or
          become sickened for 1 round. Stagnant fog dissipates naturally after 1
          minute. A moderate wind (11+ mph) disperses the stagnant fog in 1
          round. This item can be crafted with a successful DC 20 Craft
          (alchemy) check.<h2>Construction</h2><strong>Craft (Alchemy)</strong>
          DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 80
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: iLcBTd5bj7jvwuOT
    _key: '!actors.items!CCkERpkJdM2ZhIti.iLcBTd5bj7jvwuOT'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-black.webp
    name: Stalker's Oil
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          29</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This is a clear, viscous liquid that is
          typically kept in a frosted glass vial with an unassuming label and
          cork. The oil is used to reduce the sound armor and weapons make while
          moving. Applying this oil to a single piece of equipment takes 1
          minute and grants the wearer a +2 circumstance bonus on Stealth checks
          for 30 minutes. A vial of this oil is enough to coat one Medium piece
          of equipment, while a Large piece of equipment requires 4 vials. Two
          pieces of Small equipment can be covered with a single vial of oil.
          Exposure to or submersion in large amounts of water, such as swimming,
          immediately ends the effect of the oil.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 50
      subType: misc
    type: consumable
  - _id: h6lZH5L0u5QorXJp
    _key: '!actors.items!CCkERpkJdM2ZhIti.h6lZH5L0u5QorXJp'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Starlight Juice
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          23</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This clear liquid glows with pale
          light. For 4 hours after drinking this tincture, you emit light as a
          torch. You are constantly dazzled during this time. If any effect
          would cause you to become dazzled during this time, you are instead
          blinded. While under the effect of this tincture, you can intensify
          your glow as a swift action to that of bright light, as per daylight,
          for 1 round. After activating the bright light effect, you emit only
          dim light with a range of 10 feet for the remainder of the tincture's
          duration.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 30
      flags:
        dictionary:
          Category: Tincture
      price: 300
    type: consumable
  - _id: 4EAtxDTbtVs0QUiL
    _key: '!actors.items!CCkERpkJdM2ZhIti.4EAtxDTbtVs0QUiL'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/metal/mail-chain-steel.webp
    name: Static Wool
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Monster Hunter's Handbook pg.
          27</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Alchemical compounds in this square of
          jagged, metallic fibers store and transfer electricity into clothing
          when rubbed against the fabric for 1 minute. When you are grappled
          within the next 10 minutes while wearing this electrically charged
          clothing, as well as light armor or no armor, the electricity
          discharges. This deals 1 point of nonlethal electricity damage to the
          grappling creature, and if it takes damage from the effect, it must
          succeed at a DC 20 combat maneuver check to grapple or immediately
          release you. The DC increases to 22 against a creature with the grab
          ability. A single square of static wool can be used five times before
          expending its alchemical compounds.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: c1xgdcj6bu3LCLD5
    _key: '!actors.items!CCkERpkJdM2ZhIti.c1xgdcj6bu3LCLD5'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/gems/powder-raw-white.webp
    name: Stonechipper Salve
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          147</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This gritty, gray ointment weakens rocky
          materials. When applied to an object made of stone, it reduces the
          object's hardness by 3 for 10 minutes. As a standard action, a
          creature can apply the paste to affect one 5-foot-square or a Medium
          or smaller creature. The paste only affects hardness, not damage
          reduction or similar defenses.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 150
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: MuheckNTs0aYEQ6g
    _key: '!actors.items!CCkERpkJdM2ZhIti.MuheckNTs0aYEQ6g'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Stout Solution
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          23</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This highly viscous liquid resembles
          tree sap and is difficult to swallow. For 2 hours after drinking this
          tincture, you gain a +2 alchemical bonus to your CMD and you can
          perform combat maneuvers as if you were one size category larger. Your
          skeleton's increased density causes you to be treated as if you were
          carrying a medium load, or a heavy load if you were already encumbered
          by a medium load, for the same
          duration.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Tincture
      price: 100
    type: consumable
  - _id: XCF5ydcFaWJnEiAt
    _key: '!actors.items!CCkERpkJdM2ZhIti.XCF5ydcFaWJnEiAt'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-orange.webp
    name: Sun Cinder
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Demon Hunter's Handbook pg.
          19</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>Sun cinder is a fine powder that glows
          faintly when exposed to light. One bag of this alchemically created
          talc contains 5 uses. When opened, it shines like a candle. If
          sprinkled on a torch or similar flame, 1 dose of sun cinder increases
          the light level of the area that flame illuminates by one additional
          step, up to bright light. This increased illumination lasts for 1
          minute. Multiple doses of sun cinder can be used to further increase
          the light shed by the same source. A single dose of sun cinder does
          not affect flames larger than a torch. Sun cinder doesn't affect a
          light source's ability to penetrate magical darkness. Crafting 5 doses
          of sun cinder requires a successful DC 20 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: HL6eIAv8kuP0gnYu
    _key: '!actors.items!CCkERpkJdM2ZhIti.HL6eIAv8kuP0gnYu'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/biological/pustules-red.webp
    name: Sunderblock
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Melee Tactics Toolbox pg.
          21</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This lumpy, lardlike, alchemical
          substance is designed to protect armor and weapons from dents and
          cracks that commonly develop in close-combat equipment. When liberally
          applied to armor or weapons, the material provides a greasy surface
          that blunts impacts, causes blades to slide aside, and strengthens the
          gear it is applied to. A single container holds enough sunderblock to
          coat a single weapon or suit of armor as a full-round action. The
          effects aren't pronounced enough to increase the Armor Class bonus of
          a suit of armor, but the hardness of armors and weapons coated with
          sunderblock increases by 5. This bonus lasts for 12 hours, at which
          point the greasy substance dries and flakes away.
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 35
      subType: misc
      weight:
        value: 2
    type: consumable
  - _id: kZ7MjpYv0I3thY5B
    _key: '!actors.items!CCkERpkJdM2ZhIti.kZ7MjpYv0I3thY5B'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/lights/torch-brown.webp
    name: Sunrod
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg. 30</em>, <em>PRPG Core
          Rulebook pg. 158</em>, <em>Ultimate Equipment pg.
          103</p><p><strong>Price</strong> 2 gp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This 1-foot-long, gold-tipped iron rod
          glows brightly when struck (a standard action). It sheds normal light
          in a 30-foot radius and increases the light level by one step for an
          additional 30 feet beyond that area (darkness becomes dim light and
          dim light becomes normal light). A sunrod does not increase the light
          level in normal light or bright light. It glows for 6 hours, after
          which the gold tip is burned out and worthless.<h2>Alchemical
          Recipe</h2><strong>Recipe</strong> (2 magnesium + 2
          phosphorus)/ceration; <strong>Craft</strong>
          25</p><p><strong>Time</strong> 10 minutes; <strong>Tools</strong>
          crucible; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 2
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: R7w9IXoiikM6k74w
    _key: '!actors.items!CCkERpkJdM2ZhIti.R7w9IXoiikM6k74w'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-red.webp
    name: Sunsoil
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          24</p><p><strong>Category</strong> Alchemical
          Remedies</p><h2>Description</h2>When ingested, this thick red
          gelatinous substance seeks out and surgically eliminates invasive
          threats to the body. Consuming surgical jelly immediately ends any
          infestations (such as rot grubs; <em>Pathfinder RPG GameMastery
          Guide</em> 245), implanted eggs (such as those implanted by xills), or
          other non-disease effects that can be cured by <em>remove
          disease</em>, so long as such a cure does not require a caster level
          check. Consuming a pot of surgical jelly is a full-round
          action.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Remedies
      price: 300
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: Exe7PvrJb13NaSmk
    _key: '!actors.items!CCkERpkJdM2ZhIti.Exe7PvrJb13NaSmk'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-4.jpg
    name: Swift Hands Tonic
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Intrigue pg.
          236</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When imbibed, this bitter, rust-colored
          concoction grants you 1d4 uses of alchemical inspiration that can be
          used only on Disable Device checks and Sleight of Hand checks. These
          benefits last for 1 hour; during this time, you must roll all
          Acrobatics checks and Escape Artist checks twice and take the worse
          result.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 250
    type: consumable
  - _id: j6iUg62ozotaBAE9
    _key: '!actors.items!CCkERpkJdM2ZhIti.j6iUg62ozotaBAE9'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-7.jpg
    name: Synthetic Mumia
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Undead Slayer's Handbook pg.
          9</p><p><strong>Category</strong> Alchemical
          Remedies</p><h2>Description</h2>A laboratory-created version of the
          expensive and infamous Osirian drug mumia (<em>Pathfinder Campaign
          Setting: Lost Kingdoms</em> 21), synthetic mumia is a mixture of
          honey, embalming fluids, and various animal organs. The murky liquid
          comes enclosed in small packets made of intestine. Mumia and synthetic
          mumia may be taken interchangeably to stave off the effects of
          addiction to either substance, and is thus used by some mumia junkies
          hoping to quit their addiction. Crafting synthetic mumia requires a
          successful DC 14 Craft (Alchemy) check. <h2 class="title">Synthetic
          Mumia</h2> <strong>Type </strong>ingested or injury; <strong>Addiction
          </strong>moderate, Fortitude DC 14</p><p> <strong>Price </strong>150
          gp</p><p> <strong>Effects </strong>1 hour; +2 alchemical bonus on
          saving throws against spells and effects with the curse or disease
          descriptor, fatigue</p><p> <strong>Damage </strong>1d2 Wis
          damage<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 14
      flags:
        dictionary:
          Category: Alchemical Remedies
      price: 150
      subType: drug
    type: consumable
  - _id: PRlOOvE2F0KsAjaa
    _key: '!actors.items!CCkERpkJdM2ZhIti.PRlOOvE2F0KsAjaa'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Thinker's Tipple
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          23</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>This orange liquid invigorates the
          mind. For 1 hour after drinking this tincture, you gain a +2
          alchemical bonus on Knowledge checks and can attempt untrained
          Knowledge checks if the DC is 15 or lower. This saps your energy,
          imposing a -4 penalty on Fortitude saving throws for the same
          duration.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Tincture
      price: 300
    type: consumable
  - _id: 3dHQcNwg0FemLKap
    _key: '!actors.items!CCkERpkJdM2ZhIti.3dHQcNwg0FemLKap'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/cauldron-empty-black.webp
    name: Thunder Kettle
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Blood of the Elements pg.
          19</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This intricate glass and metal jug
          vibrates gently, and contains a light cloud of white vapor and
          crackling blue electricity. Djinn of the Plane of Air use thunder
          kettles to capture the essence of air and lightning elementals within
          planar super storms. When uncorked as a standard action, a thunder
          kettle releases a rumbling cacophony of thunder in a 10-foot-radius
          burst. Creatures in the area must succeed at a DC 16 Fortitude save or
          take 1d6 points of sonic damage and become staggered for 1 round. A
          successful save halves the damage and negates the staggered condition.
          This item can be crafted with a successful DC 25 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 275
      subType: misc
      weight:
        value: 3
    type: consumable
  - _id: cfYgNFCTDnv7Ips3
    _key: '!actors.items!CCkERpkJdM2ZhIti.cfYgNFCTDnv7Ips3'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-yellow.webp
    name: Tiller's Gum
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Guide pg. 45</em>,
          <em>Pathfinder #106: For Queen and Empire pg.
          75</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This gum has alchemical properties that
          allow it to soak up magical energy and release it when the gum is
          chewed. As a standard action, a stick of tiller's gum can be imbued
          with a spell of up to 3rd level with a casting time of less than 1
          minute and that targets one or more creatures, as if the gum were the
          target of the spell. The gum holds the spell's charge for 1 hour,
          during which time a creature capable of casting the stored spell can
          chew the gum as a standard action to gain the spell's effects,
          expending the stored spell and destroying the gum. The stored spell
          uses the original caster's level to determine its effects. If the
          spell-imbued gum isn't used before an hour passes, it is ruined.
          Crafting a stick of tiller's gum requires a successful DC 20 Craft
          (alchemy) check. <h2>Construction</h2><strong>Craft (Alchemy)</strong>
          DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
    type: consumable
  - _id: zkaowPMV6VgTHthk
    _key: '!actors.items!CCkERpkJdM2ZhIti.zkaowPMV6VgTHthk'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/plant-branch-brown-green.webp
    name: Tindertwig
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg. 30</em>, <em>Ultimate
          Equipment pg. 103</em>, <em>PRPG Core Rulebook pg.
          158</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>The alchemical substance on the end of
          this small, wooden stick ignites when struck against a rough surface
          (a move action). Creating a flame with a tindertwig is much faster
          than creating a flame with tinder and a flint and steel or magnifying
          glass. Lighting a torch with a tindertwig is a standard action rather
          than a full-round action, and lighting any other fire with one is at
          least a standard action. A tindertwig burns for 1d2 rounds and sheds
          light as a candle. Tindertwigs are waterproof, but must be dried
          before you can strike them.<h2>Alchemical
          Recipe</h2><strong>Recipe</strong> (2 brimstone + 1
          phosphorus)/ceration; <strong>Craft</strong>
          25</p><p><strong>Time</strong> 10 minutes; <strong>Tools</strong>
          crucible; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 1
      subType: misc
    type: consumable
  - _id: GuPvhHZW8e38VpXw
    _key: '!actors.items!CCkERpkJdM2ZhIti.GuPvhHZW8e38VpXw'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/unique-10.jpg
    name: Titan's Tonic
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Potions and Poisons pg.
          23</p><p><strong>Category</strong>
          Tincture</p><h2>Description</h2>Gravel floats in this umber liquid.
          For 1 hour after drinking this tincture, you gain a +1 alchemical
          bonus to natural armor and a +2 alchemical bonus on Strength checks
          and Strength-based skill checks. The tonic swells your musculature,
          decreasing your movement speed by 5 feet, to a minimum of 5 feet, and
          causing you to take a -4 penalty on Reflex saving throws for the same
          duration.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Tincture
      price: 200
    type: consumable
  - _id: F6MWFcMWsmshgTWA
    _key: '!actors.items!CCkERpkJdM2ZhIti.F6MWFcMWsmshgTWA'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-grey.webp
    name: Tobacco
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong> 2
          lbs.</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>These crushed and shredded leaves range
          in color from peppery red to black; users can either smoke or chew
          them. Tobacco users experience a certain level of calm and are more
          easily able to shrug off hunger pangs. Tobacco is addictive (Fort DC
          10 to resist), and long-term users suffer Constitution damage.
      flags:
        dictionary:
          Category: Black Market
      price: 1
      subType: drug
      weight:
        value: 2
    type: consumable
  - _id: t6ThHxtxCyXYhtbi
    _key: '!actors.items!CCkERpkJdM2ZhIti.t6ThHxtxCyXYhtbi'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/powder-grey.webp
    name: Tracker's Snuff
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          208</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When inhaled, this finely ground,
          alchemically treated tobacco greatly enhances your senses, especially
          your sense of smell. It grants the scent ability and a +2 alchemical
          bonus on Perception checks for 1 hour. However, once the effect wears
          off your body is wracked with terrible pain as your joints begin to
          stiffen and seize, dealing 1d2 points of Dexterity damage to
          you.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 30
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 200
      subType: misc
    type: consumable
  - _id: jRvUfdOawr2lejfI
    _key: '!actors.items!CCkERpkJdM2ZhIti.jRvUfdOawr2lejfI'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-yellow.webp
    name: Tracking Powder
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          208</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>When you scatter this very fine pale blue
          powder on the ground, it reveals the tracks of any creatures or
          individuals that have passed through the area within the last 48
          hours. The powder also grants you a +10 alchemical bonus on Survival
          checks to follow tracks or, if you aren't trained in Survival, instead
          allows you to track creatures whose prints are revealed by the powder
          for up to 1 mile using Perception instead of Survival. A single
          application can cover an area of up to 60 square feet. Tracking powder
          is sold in small leather pouches that hold 10 applications
          each.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 30
      subType: misc
    type: consumable
  - _id: vKbZZx5vTYsFrpmt
    _key: '!actors.items!CCkERpkJdM2ZhIti.vKbZZx5vTYsFrpmt'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/vials-blue-pink.webp
    name: Trailscent Kit
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          93</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This small box of specially prepared
          catfolk pheromones and alchemical reagents can be used to leave a
          small group of subtle but long-lasting scents that only catfolk can
          smell and decipher. Given a minute, a catfolk can create a scent
          mixture and apply it to a solid object, such as a tree, a wall, or
          even a smaller item such as a weapon or potion vial. When the catfolk
          does this, it leaves one of the following scent impressions: danger,
          food, shelter, or possession. The possession impression is always
          keyed to the specific catfolk using the kit, and signifies that she
          owns the territory or item. Other races can attempt to use this kit to
          create the danger, food, or shelter impression, but doing so requires
          a successful DC 20 Craft (alchemy) check. A catfolk can detect a
          particular scent applied with a trailscent kit from 30 feet away. If
          the scent is upwind, the range at which a catfolk can detect the scent
          increases to 60 feet; if it is downwind, the range drops to 15 feet. A
          catfolk with the scent racial quality doubles those distances. A scent
          impression lasts for 1 year or until it is washed away. Each kit has
          10 uses.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 10
      subType: misc
      weight:
        value: 5
    type: consumable
  - _id: Hf7lKfkVnVkisTVF
    _key: '!actors.items!CCkERpkJdM2ZhIti.Hf7lKfkVnVkisTVF'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-blue.jpg
    name: Tunnel Creeper
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          11</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This fist-sized cluster of aggressive
          fungus grows rapidly when placed against a solid surface and exposed
          to water, and can quietly bore a 5-foot-tall, 10-foot-deep tunnel in a
          straight line. The tunnel is supported by sturdy fungal tubes. A
          tunnel creeper cannot eat through metal or any material denser than
          common stone. A tunnel creeper takes 10 minutes to carve a tunnel
          through stone, or 5 minutes to carve through wood, after which the
          fungus withers and falls to the ground.<h2>Alchemical
          Recipe</h2><strong>Recipe</strong> (100 brimstone + 90 magnesium + 35
          cytillesh spores)/fermentation; <strong>Craft</strong>
          25</p><p><strong>Time</strong> 1 day; <strong>Tools</strong> heat
          source; <strong>Type</strong> alchemical tool
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 280
      subType: misc
      weight:
        value: 1
    type: consumable
  - _id: PZ0UoxmOD60pZDYv
    _key: '!actors.items!CCkERpkJdM2ZhIti.PZ0UoxmOD60pZDYv'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-green.jpg
    name: Unstable Accelerant
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Legacy of the First World pg.
          7</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This sealed copper tube contains a packet
          of alchemical fertilizer and several sprouted seedlings from the First
          World. Once shaken and opened as a standard action, the tube exudes a
          multitude of vines that spill into an adjacent square for 3 rounds.
          Left alone, these vines create an area of difficult terrain in the
          square, but a creature holding the tube can shape the vines as they
          emerge into a crude tool, piece of furniture, or other object of wood
          or rope weighing 20 pounds or less with a successful DC 10 Craft
          (baskets or carpentry) check. The vine construct lasts for 10 minutes
          before crumbling to pieces. Crafting this item requires a successful
          DC 25 Craft (alchemy) check.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 40
      subType: misc
    type: consumable
  - _id: iWTJNbctCao6VvLW
    _key: '!actors.items!CCkERpkJdM2ZhIti.iWTJNbctCao6VvLW'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-green.jpg
    name: Vomit Capsule
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          208</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>These small capsules consist of a
          concentrated mix of nauseainducing herbs. To use a capsule, you bite
          down and ingest its contents, which almost immediately cause you to
          projectile vomit. The vomiting lasts 1 full round, during which you
          can take no other actions. The following round you recover fully, and
          suffer no other ill effects. These capsules are most often used by
          rogues working in teams to create distractions and spectacles in order
          to draw people's attention away from their activities, as well as by
          those interested in faking illness, such as pugilists trying to throw
          fights or criminals seeking to create chaos during an
          arrest.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 12
      subType: misc
    type: consumable
  - _id: QOSotkkiObDOVJV6
    _key: '!actors.items!CCkERpkJdM2ZhIti.QOSotkkiObDOVJV6'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-grey.webp
    name: Warding Ash
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Undead Slayer's Handbook pg.
          15</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This flaky compound of blessed ashes is
          steeped in juniper berries, giving it a warm, chestnut color.
          Unintelligent undead instinctively recoil upon touching warding ash.
          If an unintelligent undead creature moves into a space covered in
          warding ash, it must immediately end its movement in that space
          (Reflex DC 14 negates). A singe dose of warding ash is enough to cover
          a 5-foot-square space. Applying warding ash is a move action that
          provokes attacks of opportunity. The warding ash becomes inert 1
          minute after being laid, or after the ash is disturbed in any way
          (such as being stepped on by a creature). Crafting this item requires
          a successful DC 25 Craft (alchemy)
          check.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: glW8Tpy3hoCF58PS
    _key: '!actors.items!CCkERpkJdM2ZhIti.glW8Tpy3hoCF58PS'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/slime-thick-orange.webp
    name: Waspguts
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Inner Sea Intrigue pg.
          50</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This golden, oily alchemical reagent can
          be applied to any surface or delivered as a touch attack (the wielder
          exposes herself unless she uses a glove and disposes of it afterward).
          A creature or object marked with waspguts attracts angry insects.
          Vermin within 30 feet attack the target over other available
          creatures. Wasps are affected at a range of up to 1 mile; in most
          environments where wasps live, the target is stung by at least one
          wild wasp per hour. The effect lasts 8 hours or until washed or
          scraped off (a full-round action). Waspguts can also be thrown as a
          splash weapon. A direct hit deals no damage, but exposes the target to
          the waspguts' effects. Crafting waspguts requires a successful DC 20
          Craft (alchemy) check.<h2>Construction</h2><strong>Craft
          (Alchemy)</strong> DC 20
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
      weight:
        value: 2
    type: consumable
  - _id: 3WPpyfzTpk3lf9mm
    _key: '!actors.items!CCkERpkJdM2ZhIti.3WPpyfzTpk3lf9mm'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/biological/suckers-green.webp
    name: Water Purification Sponge
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 103</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Category</strong>
          Alchemical Tools</p><h2>Description</h2>This fist-sized blue sponge
          absorbs up to 1 pint of water; squeezing the water out of the sponge
          filters and purifies it, making it safe for drinking, washing, and
          similar activities. Filling and emptying the sponge is a full-round
          action. The filtration is enough to remove mundane impurities and
          common diseases, but does nothing to protect against poisons, magic,
          and other exotic threats. Each sponge can cleanse 25 pints of water
          before deteriorating and becoming
          useless.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 15
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 25
      subType: other
      weight:
        value: 1
    type: consumable
  - _id: AYhrceXPaGJUMt7k
    _key: '!actors.items!CCkERpkJdM2ZhIti.AYhrceXPaGJUMt7k'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-pink-yellow-green.webp
    name: Weapon Blanch (Adamantine)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder Society Field Guide pg.
          48</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This gritty alchemical powder is made
          from exotic minerals mixed with an infusion crafted from the
          ectoplasmic remains of destroyed incorporeal undead. When rubbed onto
          a weapon that is then placed over a hot flame for a full round, ghost
          salt melts and forms a temporary coating on the weapon. The blanching
          gives the weapon the ability to do full damage to incorporeal
          creatures, even if the weapon itself is nonmagical. An application of
          ghost salt remains effective until the weapon makes a successful
          attack. Each dose of weapon blanch can coat one weapon or up to 10
          pieces of ammunition. Only one kind of weapon blanch can be on a
          weapon at one time (see the <em>Advanced Player's Guide </em>for other
          forms of weapon blanch).
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 200
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: cmYZFuHEJyLxoAUr
    _key: '!actors.items!CCkERpkJdM2ZhIti.cmYZFuHEJyLxoAUr'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/magic-yellow.jpg
    name: Weapon Blanch (Silver)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          27</p><p><strong>Category</strong>
          Concoctions</p><h2>Description</h2>This coppery-tasting substance
          causes your adrenaline production to spike, granting you a +2
          alchemical bonus on melee damage rolls with natural and manufactured
          weapons. The concoction weakens your self-preservation urges and
          imparts a -2 penalty to your AC.
      flags:
        dictionary:
          Category: Concoctions
      price: 100
    type: consumable
  - _id: As1DbWfb9fTmdq9Q
    _key: '!actors.items!CCkERpkJdM2ZhIti.As1DbWfb9fTmdq9Q'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/dandelion-pod-blue.webp
    name: Winterbite
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg. 155</em>,
          <em>Heroes of the Wild pg. 10</p><p><strong>Category</strong>
          Herbs</p><p><strong>Gather</strong> DC 11; <strong>Yield</strong> 1d4
          doses</p><p><strong>Terrain</strong> any
          cold</p><p><strong>Preparation</strong> A dose of winterbite must be
          dried near an open flame in which certain alchemically treated sawdust
          and wood chips are burned. This requires a successful DC 12 Craft
          (alchemy) check and 1 hour.</p><p><strong>Use</strong> When held under
          the nose and crushed (which takes a standard action), a dose of
          prepared winterbite releases a pungent, sweet odor that clears the
          sinuses and sharpens the senses. For the next hour, the user of a dose
          of prepared winterbite gains a +2 alchemical bonus on scent-based
          Perception checks.</p><h2>Description</h2>The white-veined leaves of
          this minty sprig carry a pleasant and soothing scent.
      flags:
        dictionary:
          Category: Herbs
      price: 20
      subType: misc
    type: consumable
  - _id: VOppj3aupRylmsiq
    _key: '!actors.items!CCkERpkJdM2ZhIti.VOppj3aupRylmsiq'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/flower-green.webp
    name: Woad Painting (Kit)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 5 sp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>The root of this tall plant with blue
          flowers is toxic (see the page 560 of the <em>Pathfinder RPG Core
          Rulebook</em>), but herbalists use it in low doses to reduce pain and
          regulate the heart. Folklore says it can help a victim of lycanthropy
          throw off the curse.
      flags:
        dictionary:
          Category: Black Market
      price: 0.5
      subType: poison
    type: consumable
