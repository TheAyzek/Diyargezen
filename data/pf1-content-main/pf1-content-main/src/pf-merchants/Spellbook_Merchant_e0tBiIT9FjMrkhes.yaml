          <em>locate object</em>, <em>misdirection</em>, <em>perfect
          placement</em></p><p> 1st-<em>expeditious retreat</em>, <em>memory
          lapse</em><sup>APG</sup>, <em>moment of greatness</em>, <em>obscure
          object</em>, <em>undetectable alignment</em>,
          <em>vanish</em><h2>Ritual</h2><strong>Brain Wash (Su)</strong> You
