    img: icons/tools/laboratory/bowl-liquid-pink-yellow-green.webp
    name: Acid
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 103</em>,
          <em>Advanced Player's Guide pg. 184</p><p><strong>Price</strong> 100
          gp (adamantine), 20 gp (cold iron), 5 gp (silver);
          <strong>Weight</strong> 1/2 lb. (adamantine), 1/2 lb. (cold iron), 1/2
          lb. (silver)</p><h2>Description</h2>These silver, alchemical powders
          have a gritty consistency, appearing at first glance to be simple
          metal shavings. When poured on a weapon and placed over a hot flame
          for a full round, however, they melt and form a temporary coating on
          the weapon. The blanching gives the weapon the ability to bypass one
          kind of material-based damage reduction, such as adamantine, cold
          iron, or silver. The blanching remains effective until you make a
          successful attack with the weapon. Each dose of blanching can coat one
          weapon or up to 10 pieces of ammunition. Only one kind of weapon
          blanch can be on a weapon at one time, though a weapon made of one
          special material (such as adamantine) can have a different material
          blanch (such as silver), and counts as both materials for the first
          successful hit.<h2>Construction</h2><strong>Craft (Alchemy)</strong>
          DC 25
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 100
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: JIZD8t7nzs5mJE2w
    _key: '!actors.items!SMqwdnasdUiwonSl.JIZD8t7nzs5mJE2w'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/bowl-liquid-pink-yellow-green.webp
    name: Weapon Blanch (Cold Iron)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder Society Field Guide pg.
          48</p><p><strong>Category</strong> Alchemical
          Tools</p><h2>Description</h2>This gritty alchemical powder is made
          from exotic minerals mixed with an infusion crafted from the
          ectoplasmic remains of destroyed incorporeal undead. When rubbed onto
          a weapon that is then placed over a hot flame for a full round, ghost
          salt melts and forms a temporary coating on the weapon. The blanching
          gives the weapon the ability to do full damage to incorporeal
          creatures, even if the weapon itself is nonmagical. An application of
          ghost salt remains effective until the weapon makes a successful
          attack. Each dose of weapon blanch can coat one weapon or up to 10
          pieces of ammunition. Only one kind of weapon blanch can be on a
          weapon at one time (see the <em>Advanced Player's Guide </em>for other
          forms of weapon blanch).
      flags:
        dictionary:
          Category: Alchemical Tools
      price: 200
      subType: misc
      weight:
        value: 0.5
    type: consumable
  - _id: k5QaXN1Ogr182HeN
    _key: '!actors.items!SMqwdnasdUiwonSl.k5QaXN1Ogr182HeN'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/potions/minor-blue.jpg
    name: Weapon Blanch (Silver)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Inner Sea Intrigue pg.
          50</p><p><strong>Price</strong> varies; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Alchemical
          Remedies</p><h2>Description</h2>Generally stored in a glass vial, an
          antidote is formulated to counteract a specific poison chosen at the
          time of the antidote's creation. Drinking the antidote grants a +10
          alchemical bonus on saving throws against that poison for 4 hours. If
          the imbiber succeeds at a saving throw with this bonus, she is
          automatically cured even if she would not normally be cured by
          successful saving throws or the number required to cure her has not
          been met yet. However, the antidote has no effect against other
          poisons. An antidote's price is half that of the poison it
          counteracts. An antidote has no effect against a magical poison. The
          Craft (alchemy) DC to create an antidote is equal to the save DC of
          the poison.
      flags:
        dictionary:
          Category: Alchemical Remedies
    type: consumable
  - _id: Xp6TAZCho5sN6i3n
