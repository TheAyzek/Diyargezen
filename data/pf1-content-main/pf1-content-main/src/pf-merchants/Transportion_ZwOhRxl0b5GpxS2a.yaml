        value: >-
          <p><strong>Source</strong>: PRPG Core Rulebook pg.
          159</p><p><strong>Price</strong> -; <strong>Price of Passage (per
          mile)</strong> 3 cp</p><p><strong>Category</strong> Transport,
          Land</p><h2>Description</h2>The price given is for a ride in a coach
          that transports people (and light cargo) between towns. For a ride in
          a cab that transports passengers within a city, 1 copper piece usually
          takes you anywhere you need to go.
