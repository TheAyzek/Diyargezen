    img: icons/sundries/books/book-rounded-red.webp
    name: Pathfinder Chronicles - Volume 44
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder Society Primer pg.
          27</p><p><strong>Category</strong> Pathfinder
          Chronicles</p><h2>Description</h2>Published in 4707 ar, this volume is
          notable for the detailed account by Koriah Azmeren of her exploration
          of the Darklands. Her confirmation that the legendary drow were in
          fact real drove the elves of Kyonin-who had maintained the secret of
          the drow's existence for millennia-to attempt to bribe the Decemvirate
          into recalling and altering the book. The Society didn't relent,
          however, making the existence of dark elves a widely accepted fact
          within only a few years' time. Other reports in this volume include a
          brief essay by current venturecaptain Sheila Heidmarch regarding
          ancient relics of the old empire of Thassilon. <h2>Skill Bonuses</h2>
          <ul><li>Identify drow and their customs, weaknesses, and tactics
          (Knowledge [local] +2) </li><li>Learn about Thassilonian artifacts
          (Knowledge [history] +2) </li><li>Navigate the tunnels of the
          Darklands and identify Darklands natives (Knowledge [dungeoneering] +2
          and Knowledge [geography] +2)</li></ul>
      equipped: false
      flags:
        dictionary:
          Category: Pathfinder Chronicles
      price: 200
      subType: tradeGoods
    type: loot
