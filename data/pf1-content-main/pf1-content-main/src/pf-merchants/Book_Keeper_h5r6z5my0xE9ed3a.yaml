    name: Pathfinder Chronicles - Volume 27
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder Society Primer pg.
          27</p><p><strong>Category</strong> Pathfinder
          Chronicles</p><h2>Description</h2>This volume made quite a stir upon
          its release because it includes a good hundred pages of collected
          notes by famed Pathfinder Durvin Gest-who had disappeared over a
          century earlier. Many of these scraps recount only partial tales of
          danger and battle with little context, though one surprisingly
          complete chapter describes Gest's journey to the Crown of the World
          and his discoveries there. The portion of the book not consisting of
          Gest's notes features a treatise on negating the effects of magical
          traps by contemporary Mistress of Scrolls Andirissa Belathax.
          <h2>Skill Bonuses</h2> <ul><li>Navigate and follow tracks in arctic
          environments (Survival +2) </li><li>Notice and disable magic traps
          with surprising alacrity (Disable Device +2 and Perception
          +2)</li></ul>
      equipped: false
      flags:
        dictionary:
          Category: Pathfinder Chronicles
      price: 150
      subType: tradeGoods
    type: loot
  - _id: bgjvinNgcJzpQZfj
    _key: '!actors.items!h5r6z5my0xE9ed3a.bgjvinNgcJzpQZfj'
