    name: A Thread of Silver
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder Society Primer pg.
          27</p><p><strong>Category</strong> Pathfinder
          Chronicles</p><h2>Description</h2>This volume, when originally
          published, contained a trove of misinformation on dragons, penned by
          Pathfinder Dalania Pontius. After these errors precipitated numerous
          deaths and countless injuries among Pathfinders confronting dragons of
          all types, the Decemvirate investigated Pontius's sources (namely the
          brass dragon who had provided her with much of the false info) and
          found them suspect. The volume was eventually corrected, though some
          unaltered copies could still remain in obscure collections. <h2>Skill
          Bonuses</h2> <ul><li>Better understand the nature and ways of dragons
          (Knowledge [arcana] +2) </li><li>Distinguish between true statements
          and exaggeration regarding esoteric topics (Sense Motive +2)</li></ul>
      equipped: false
      flags:
        dictionary:
          Category: Pathfinder Chronicles
      price: 100
      subType: tradeGoods
    type: loot
