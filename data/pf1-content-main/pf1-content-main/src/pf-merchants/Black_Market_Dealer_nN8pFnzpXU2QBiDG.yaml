img: icons/equipment/head/hood-cloth-brown.webp
items:
  - _id: MSxT6IHDBuCzaiV5
    _key: '!actors.items!nN8pFnzpXU2QBiDG.MSxT6IHDBuCzaiV5'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/misc/pipe-wooden-01.webp
    name: Bamboo palace
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          18</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>The bowl of this glass water pipe can be
          loaded with any inhalable drug, alchemical powder, or alchemical
          liquid. You must set down a hookah in a free space (a move action) and
          fill the water jar with half a gallon of water (another move action)
          before the hookah can be used. You can consume the contents of an
          adjacent hookah by sucking on one of the pipe's four hoses as a move
          action. Up to 5 doses of a single substance can be loaded in the
          hookah at a time, and up to four adjacent creatures can use the hookah
          during the same round. Reloading a hookah is a standard action,
          regardless of the number of doses so reloaded.</p><p>Substances not
          intended for bodily consumption can cause harmful or even fatal
          effects (GM's discretion) if loaded into a hookah and inhaled, and
          often destroy the hookah in the process.
      equipped: false
      flags:
        dictionary:
          Category: Black Market
      price: 400
      subType: tradeGoods
      weight:
        value: 10
    type: loot
  - _id: Vq5wCb8Rud7SKYb8
    _key: '!actors.items!nN8pFnzpXU2QBiDG.Vq5wCb8Rud7SKYb8'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/misc/pipe-wooden-01.webp
    name: Hookah, Premium
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          18</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>A premium hookah is similar to a
          standard hookah, except it sports enough hoses for up to eight
          adjacent creatures to use, and the bowl has three separate
          compartments, each of which can store a different type of inhalable
          drug, alchemical powder, or alchemical liquid. Each compartment can
          hold up to 3 doses of an inhalable substance (so a premium hookah can
          hold up to 9 doses total). Consuming these contents is still a move
          action. You can reload a single compartment as a move action, or you
          can reload all three compartments as a full-round action.
      equipped: false
      flags:
        dictionary:
          Category: Black Market
      price: 1000
      subType: tradeGoods
      weight:
        value: 15
    type: loot
  - _id: jrU2g3WUpFkf66Xj
    _key: '!actors.items!nN8pFnzpXU2QBiDG.jrU2g3WUpFkf66Xj'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/misc/pipe-wooden-01.webp
    name: Hookah, Traveler's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          18</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>This portable hookah can be worn as a
          backpack, obviating the need to set the hookah down before filling it
          with water. Up to four creatures (including the wearer and any
          adjacent creatures) can use a traveler's hookah during the same round.
          While wearing a traveler's hookah, you can stopper the hookah's bowl
          valve as an immediate action to prevent unwanted individuals from
          using it until the valve is reopened as a free action. If you are
          knocked unconscious or otherwise fall prone while wearing a traveler's
          hookah, you must succeed at a DC 13 Reflex save or the hookah is
          smashed during the fall. A traveler's hookah can hold up to 5 doses of
          a single substance, and has four hoses.
      equipped: false
      flags:
        dictionary:
          Category: Black Market
      price: 1500
      subType: tradeGoods
      weight:
        value: 4
    type: loot
  - _id: dR7G1VNwVI1mmlkk
    _key: '!actors.items!nN8pFnzpXU2QBiDG.dR7G1VNwVI1mmlkk'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/instruments/chimes-wood-brown.webp
    name: Leng ruby
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Haunted Heroes Handbook pg.
          11</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>This large mobile keyboard instrument
          resembles a strange chair with several brass tubes jutting from its
          back and small wheels on the feet for ease of transportation. A pump
          organ can seat a single Medium creature, which can operate the
          keyboard and pedals to create haunting melodies out of the brass
          pipework along the organ's back frame. All pump organs function as
          masterwork instruments for Perform (keyboard instruments) checks. With
          10 minutes of work and a successful DC 15 Perform (keyboard
          instruments) check, a user can manipulate the pump organ's controls to
          create a 1-minue long performance that does not require an
          operator-the pump organ can be set to activate after a preset duration
          via a timer (up to 24 hours) or to begin when a remote trigger is
          activated. The trigger can be connected to the pump organ via a set of
          pulleys and twine normally stored in a compartment under the organ's
          seat cushion with a successful DC 15 Disable Device check. The remote
          trigger can be placed up to 60 feet from the pump organ.
      equipped: false
      flags:
        dictionary:
          Category: Black Market
      price: 2000
      subType: tradeGoods
      weight:
        value: 100
    type: loot
  - _id: B9GVIkXprs1yG2Jq
    _key: '!actors.items!nN8pFnzpXU2QBiDG.B9GVIkXprs1yG2Jq'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-blue.webp
    name: Quieting needles
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>This treated wafer dissolves into a
          chalky paste when placed under the tongue and then gives the imbiber a
          jolt of restless energy. It eliminates the effects of fatigue for the
          next 8 hours; when the drug's effect ends, the user is exhausted.
          Allnight makes its users jittery and unable to focus; they suffer a -2
          penalty on all skill checks until its effects wear off.
      equipped: false
      flags:
        dictionary:
          Category: Black Market
      price: 75
    type: loot
  - _id: jdUTnfQjY3Qc9IyW
    _key: '!actors.items!nN8pFnzpXU2QBiDG.jdUTnfQjY3Qc9IyW'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-teal.webp
    name: Angry Jack
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dirty Tactics Toolbox pg.
          20</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>Named after a common children's toy,
          this metal box, typically no larger than 1 cubic foot in volume,
          possesses a secret compartment large enough to store one flask or
          vial. When loaded with a splash weapon or a vial of poison (contact or
          inhaled poisons only) and armed as a full-round action, an angry jack
          attacks the next creature to open the box, using its spring-loaded
          interior to launch that item at the target as a ranged touch attack
          (attack bonus +0). A creature struck by a contact poison in this way
          is exposed to the poison as normal, but a creature is automatically
          exposed to a loaded inhalation poison with no attack roll needed.
          Identifying an angry jack requires a successful a DC 20 Perception
          check. A character who is trained in the Disable Device skill can
          spend 10 minutes disguising an armed angry jack, allowing her to roll
          a Disable Device check and use the result as the Perception DC for
          others to detect the true nature of the angry jack. The user can't
          take 10 or 20 on the Disable Device check.
      flags:
        dictionary:
          Category: Black Market
      price: 25
      subType: misc
      weight:
        value: 2
    type: consumable
  - _id: ZGAhK0eHspIbA0ZR
    _key: '!actors.items!nN8pFnzpXU2QBiDG.ZGAhK0eHspIbA0ZR'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-grey.webp
    name: Bachelor Snuff
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>If inhaled through the nose, this
          sootysmelling golden powder renders humanoid males temporarily sterile
          without otherwise affecting their performance. A dose typically lasts
          1-3 days. Long-term users of bachelor snuff tend to develop a slight,
          but still noticeable, gilded tinge to their teeth and nails.
      flags:
        dictionary:
          Category: Black Market
      price: 1
      subType: drug
    type: consumable
  - _id: 1UyoG26mE8KlgChK
    _key: '!actors.items!nN8pFnzpXU2QBiDG.1UyoG26mE8KlgChK'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/clover-pink.webp
    name: Belladonna
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 2 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>Also known as deadly nightshade, this
          plant, with its distinctive greenish-purple leaves and dull black
          berries, has served as a cosmetic and medicine for longer than memory
          despite its toxicity. It can also induce vivid but usually unpleasant
          hallucinations, particularly ones dealing with flight. Herbalists and
          others trained to use it safely believe it has numerous applications,
          including pain relief.
      flags:
        dictionary:
          Category: Black Market
      price: 2
      subType: poison
    type: consumable
  - _id: Rz0y53ZgWJZjs725
    _key: '!actors.items!nN8pFnzpXU2QBiDG.Rz0y53ZgWJZjs725'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/neck/amulet-round-gold-green-blue.webp
    name: Burglar's Torc
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dirty Tactics Toolbox pg.
          20</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>Appearing as a heavy, elaborate
          neckpiece while worn, a burglar's torc can be removed and disassembled
          into its component parts in 4 minutes (or in 1 minute if the user is
          trained in the Disable Device skill). When dismantled, a burglar's
          torc contains parts that function as a set of mithral masterwork
          thieves' tools, 10 feet of silk rope, and a mithral grappling hook.
          Reassembling the torc takes 8 minutes (or 4 minutes if the user is
          trained in the Disable Device skill). An observer must succeed at a DC
          30 Perception check to recognize an assembled burglar's torc for what
          it is; if the observer handles the torc, the DC for this check
          decreases to 15.
      flags:
        dictionary:
          Category: Black Market
      price: 2102
      subType: misc
      weight:
        value: 5
    type: consumable
  - _id: Ku0SUAdDJGILqZPe
    _key: '!actors.items!nN8pFnzpXU2QBiDG.Ku0SUAdDJGILqZPe'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-liquid-white.webp
    name: Clear Ear
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>This green gel is poured into the user's
          ear and takes effect 2 hours later, enhancing senses and memory but
          increasing irritability. For 6 hours, the user gains a +2 alchemical
          bonus on Perception and Knowledge checks and a -2 penalty on all
          Charisma-based checks.
      flags:
        dictionary:
          Category: Black Market
      price: 15
      subType: drug
    type: consumable
  - _id: s4mDbp3lXihrc3ze
    _key: '!actors.items!nN8pFnzpXU2QBiDG.s4mDbp3lXihrc3ze'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-blue.webp
    name: False Ectoplasm
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Haunted Heroes Handbook pg.
          11</p><p><strong>Price</strong> 2 gp; <strong>Weight</strong> 2
          lbs.</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>Once exposed to air, this greenish
          alchemical sludge quickly takes on a faint glow. This glow provides
          dim illumination in the area immediately surrounding the fist-sized
          lump of false ectoplasm. This glow-in-the-dark effect lasts for 1 hour
          before the substance begins to decompose into a brownish goo. A
          successful DC 20 Sleight of Hand check allows a user to open a vial of
          false ectoplasm and deposit it on an adjacent surface as a move
          action; a successful opposed Perception check is enough to notice this
          trickery.
      flags:
        dictionary:
          Category: Black Market
      price: 2
      subType: misc
      weight:
        value: 2
    type: consumable
  - _id: 2F1T8ufFD6yEpNF8
    _key: '!actors.items!nN8pFnzpXU2QBiDG.2F1T8ufFD6yEpNF8'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/lily-bloom.webp
    name: Flayleaf
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>These narrow, rust-colored leaves
          produce a mildly hallucinogenic smoke that also serves as powerful
          sedative. Users are immune to pain for 4 hours after smoking flayleaf,
          but during this time they take a -5 penalty on saves against
          mind-altering effects.
      flags:
        dictionary:
          Category: Black Market
      price: 20
      subType: drug
    type: consumable
  - _id: 8Dciqjljo759Rzl5
    _key: '!actors.items!nN8pFnzpXU2QBiDG.8Dciqjljo759Rzl5'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/lily-white.webp
    name: Garlic
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 1 sp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>These pungent white cloves serve as food
          and medicine and play a role in many traditional cleansing rituals. It
          is well established that vampires cannot abide the presence of garlic.
      flags:
        dictionary:
          Category: Black Market
      price: 0.1
      subType: misc
    type: consumable
  - _id: YJjtteYusOh6PLRi
    _key: '!actors.items!nN8pFnzpXU2QBiDG.YJjtteYusOh6PLRi'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-grey.webp
    name: Heathensnuff
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Cities of Golarion pg.
          42</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>Others lacking the will to harden
          themselves appropriately turn to alchemical methods to endure. This
          purplish paste is made from sea urchin toxins and numbs the user's
          ability to sense pain. Illegal in Nidal, the drug is used mostly by
          those attempting to emulate true belief in Zon-Kuthon or who
          anticipate great pain. A dose gives the user the Endure Pain feat for
          1 hour, though it also has debilitating side effects and leaves
          telltale reddish-purple stains around the nostrils for up to one day,
          easily identified by those familiar with the symptoms. Followers of
          the Midnight Lord believe using heathensnuff is a sure sign that an
          individual lacks faith.</p><p>Anyone who takes the drug must make a DC
          10 saving throw or become addicted. A snuff addict can stave off
          withdrawal for 5 days by taking a dose; failure means he must save or
          take 1d4 Dex and 1d4 Wis damage. This save DC increases by +5 for
          every 5 days since the last time the addict had a dose. If the addict
          makes two of these saves in a row, he is no longer addicted.
          <em>Remove disease</em> can cure an addict if the caster's caster
          level check succeeds against a DC equal to the addict's current
          withdrawal DC. <em>Greater restoration</em> or heal cures the
          addiction without requiring a roll.</p><p><strong>Type</strong>
          poison, ingested; <strong>Save</strong> Fortitude DC
          13</p><p><strong>Frequency</strong> 1/hour for 4
          hours</p><p><strong>Initial Effect</strong> Endure Pain feat for 1
          hour (see above);</p><p><strong>Secondary Effect</strong> 1 Con
          damage; <strong>Cure</strong> 1 save</p><p><strong>Cost</strong> 10 gp
      flags:
        dictionary:
          Category: Black Market
      price: 10
      subType: drug
    type: consumable
  - _id: H8aZPQnLH6f4AhVD
    _key: '!actors.items!nN8pFnzpXU2QBiDG.H8aZPQnLH6f4AhVD'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/holly-buds-red.webp
    name: Holly
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 0 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>The bright red berries of the holly tree
          have many uses as decorations and ritual objects. Druids harvest holly
          berries with specially prepared tools and during sacred times of the
          year.
      flags:
        dictionary:
          Category: Black Market
      subType: misc
    type: consumable
  - _id: XRDeLEkzj1whqvV1
    _key: '!actors.items!nN8pFnzpXU2QBiDG.XRDeLEkzj1whqvV1'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-grey.webp
    name: Mindburn Incense
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Haunted Heroes Handbook pg.
          11</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>The scent of this light brown incense
          carries a distinct tang of peppermint oil. Once the incense is lit in
          a censer or appropriate container, its smoke permeates a
          20-foot-by-20-foot area to a height of 10 feet. Living creatures
          within the area that breathe the incense fumes for more than 1 minute
          gain a +1 morale bonus on saves against pain effects, while taking a
          -1 penalty on saves against mind-affecting effects. This effect lasts
          for as long as the creature remains within the area of the incense,
          and for an additional minute after leaving. The incense burns for 1
          hour before dissipating, unless dispersed before then by wind.
      flags:
        dictionary:
          Category: Black Market
      price: 50
      subType: drug
    type: consumable
  - _id: LOuGjvsFe5pLDXLW
    _key: '!actors.items!nN8pFnzpXU2QBiDG.LOuGjvsFe5pLDXLW'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-blue.webp
    name: Mistletoe
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> -; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>This golden-colored parasitic plant
          grows on many different sorts of trees. Druids harvest mistletoe with
          specially prepared tools and during sacred times of the year.
      flags:
        dictionary:
          Category: Black Market
      subType: misc
    type: consumable
  - _id: FsimY5N343rdyhgo
    _key: '!actors.items!nN8pFnzpXU2QBiDG.FsimY5N343rdyhgo'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/flowers/lotus-violet.webp
    name: Night Tea
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 1 sp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>This frothy tea made from the
          bone-white, triangular leaves of the night tea plant renders a
          humanoid female sterile if drunk every day. In high doses, it may be
          able to end a pregnancy.
      flags:
        dictionary:
          Category: Black Market
      price: 0.1
      subType: misc
    type: consumable
  - _id: qHuUNam5VzPpeepZ
    _key: '!actors.items!nN8pFnzpXU2QBiDG.qHuUNam5VzPpeepZ'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-teal.webp
    name: Pesh
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>The milk of this vibrantly green cactus,
          when mixed with resins and other ingredients, congeals into sticky,
          black chunks with an exceedingly sour taste. Though pesh comes in
          several different varieties, refined pesh is both the most potent and
          expensive type. Taking refined pesh gives a person 15 temporary hit
          points for 1 hour, a +2 morale bonus on saves versus fear effects for
          1 day, and a -4 penalty to Dexterity and Wisdom for 1 day. Pesh is
          addictive (Fortitude DC 10 to resist), and long-term users suffer
          Dexterity and Wisdom damage. <h2>False Pesh</h2> <em>Dark Markets - A
          Guide to Katapesh pg. 14</em></p><p> False pesh looks much the same as
          real pesh, but the genuine plant is a spined cactus that grows in
          desert areas, while the imposter is a sticky, more bulbous plant that
          requires extra moisture to flourish. A character can make a DC 15
          Knowledge (nature) check to tell the real plant from the
          fake.</p><p>Imitation raw pesh formed from the false pesh plant is
          much harder to differentiate from the real drug. Both appear as milky
          white, cheese-like blocks; the false pesh has a milder odor and a
          stickier gloss to its surface, but the differences are minor. A DC 25
          Alchemy check discerns true raw pesh from false.</p><p>Anyone
          ingesting false raw pesh must make a DC 25 Fortitude save or become
          nauseated for 10 minutes. After 1 minute they must make another DC 25
          Fortitude save or suffer the secondary effect of 1d4 points of
          Constitution damage. For refined false pesh, the save DC is 30 and the
          secondary effect is 1d6 points of Constitution damage. The Alchemy
          check to distinguish it from true refined pesh is DC 30.
      flags:
        dictionary:
          Category: Black Market
      price: 20
      subType: drug
    type: consumable
  - _id: ubiTaQ3wVJ2pscfV
    _key: '!actors.items!nN8pFnzpXU2QBiDG.ubiTaQ3wVJ2pscfV'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/laboratory/vials-blue-pink.webp
    name: Purity Test
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Alchemy Manual pg.
          18</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>This set of special disposable reagents
          can be used in conjunction with an alchemist's lab to detect whether a
          drug has been cut with inferior-grade material or filler, granting a
          +5 competence bonus on Craft (alchemy) checks to detect such
          chicanery.
      flags:
        dictionary:
          Category: Black Market
      price: 10
      subType: drug
      weight:
        value: 2
    type: consumable
  - _id: xV5dy1RZTBP71VMm
    _key: '!actors.items!nN8pFnzpXU2QBiDG.xV5dy1RZTBP71VMm'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-grey.webp
    name: Tobacco
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong> 2
          lbs.</p><p><strong>Category</strong> Black
          Market</p><h2>Description</h2>These crushed and shredded leaves range
          in color from peppery red to black; users can either smoke or chew
          them. Tobacco users experience a certain level of calm and are more
          easily able to shrug off hunger pangs. Tobacco is addictive (Fort DC
          10 to resist), and long-term users suffer Constitution damage.
      flags:
        dictionary:
          Category: Black Market
      price: 1
      subType: drug
      weight:
        value: 2
    type: consumable
  - _id: REe8ERftKYV3MVfi
