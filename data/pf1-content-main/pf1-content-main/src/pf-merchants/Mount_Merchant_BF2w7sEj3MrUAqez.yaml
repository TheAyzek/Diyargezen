    img: icons/commodities/bones/hooves-cloven-brown.webp
    name: Horse (Pony)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          81</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>Due to their incredible endurance,
          these Large animals are the preferred mounts of desert-dwelling
          people. They tend to be ill-tempered beasts. More information on
          camels can be found in <em>Bestiary 2</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 150
      weight:
        value: 1500
    type: loot
  - _id: kCWDiSZeJxoGzxKP
    _key: '!actors.items!BF2w7sEj3MrUAqez.kCWDiSZeJxoGzxKP'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/bones/hooves-cloven-brown.webp
    name: Chameleon, Giant
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          81</p><p><strong>Price</strong> 8 gp; <strong>Weight</strong> 600-800
          lbs.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>Donkeys and mules are stolid in the
          face of danger, hardy, surefooted, and capable of carrying heavy loads
          over vast distances. Unlike a horse, a donkey or mule is willing
          (though not eager) to enter dungeons and other strange or threatening
          places. Donkeys and mules have the same statistics as ponies (see the
          <em>Bestiary</em>).
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 8
    type: loot
  - _id: fMKBZ2oD1OEfB0wa
    _key: '!actors.items!BF2w7sEj3MrUAqez.fMKBZ2oD1OEfB0wa'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/feather-orange.webp
    name: Elephant
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          81</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These deadly but majestic fliers
          are the favored aerial cavalry of many kingdoms. While griffons can be
          trained, some good deities consider doing so akin to enacting slavery,
          insisting that a griffon must come to its rider on its own free will.
          The price listed is for a trained griffon; free will is bought with
          different currency (determined by the GM). More information on
          griffons can be found in the <em>Bestiary</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 8000
      weight:
        value: 500
    type: loot
  - _id: 5B1wECF4f7JQ3ypF
    _key: '!actors.items!BF2w7sEj3MrUAqez.5B1wECF4f7JQ3ypF'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/feather-yellow.webp
    name: Hippocampus
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          81</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>Less intelligent and easier to
          train than griffons, hippogriffs make reliable winged mounts. More
          information about hippogriffs can be found in <em>Bestiary 2</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 5000
      weight:
        value: 500
    type: loot
