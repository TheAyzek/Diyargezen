    img: icons/commodities/bones/horn-antler-tan.webp
    name: Reindeer
    system:
      description:
        value: >-
          <p><strong>Source</strong>: People of the North pg.
          28</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These sturdy and majestic caribou
          roam the northern tundra in great herds, and provide fur, meat, and
          other useful products to both Erutaki and Varki herders and hunters.
          Irrisen's Jadwiga, Snowcaster elves, and eccentric Linnorm Kings use
          domesticated reindeer to pull sleighs. Reindeer use the same
          statistics as elk (see <em>Bestiary 3</em>, page 147).
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 75
      weight:
        value: 450
    type: loot
