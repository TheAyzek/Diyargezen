  - _id: eSJQOLXoD2tVRz34
    _key: '!actors.items!BF2w7sEj3MrUAqez.eSJQOLXoD2tVRz34'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/red_23.jpg
    name: Pack Animal (Musk Ox)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Pathfinder #51: The Hungry Storm pg.
          67</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These husky, shaggy beasts are
          sometimes domesticated as pack animals in the Crown of the World.
          Their statistics are identical to aurochs (<em>Pathfinder RPG Bestiary
          </em>174), but they are immune to cold weather effects (though not
          severe cold and extreme cold effects). Domesticated musk oxen have the
          docile special quality (see horse; <em>Bestiary </em>177), and treat
          their gore attack as a secondary natural weapon. In the polar rim
          mountains of Tian Xia, yaks are used as pack animals and have
          identical statistics.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 24
    type: loot
  - _id: 9Ic0IQz0ocDh31NC
    _key: '!actors.items!BF2w7sEj3MrUAqez.9Ic0IQz0ocDh31NC'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/bones/hooves-cloven-brown.webp
    name: Pack Animal (Donkey/Mule)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg. 19</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Price</strong>  8 gp Pack animal
          (donkey/mule),  15 gp Pack animal (ox),  24 gp Pack animal (yak);
          <strong>Weight</strong> 600 lbs. Pack animal (donkey/mule), 1 ton Pack
          animal (ox), 2 tons Pack animal (yak)</p><h2>Description</h2>Working
          animals are universal, but the animal type varies according to local
          availability. Elephants carry goods in much of the Mwangi Expanse.
          Yaks pull loads in mountainous regions. In many other parts of the
          Inner Sea, donkeys, mules, and oxen pull carts or plows. The donkey
          market in Katapesh is particularly brisk.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 8
      weight:
        value: 600
    type: loot
