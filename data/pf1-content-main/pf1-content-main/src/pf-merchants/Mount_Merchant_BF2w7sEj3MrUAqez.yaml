    name: Mastodon
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          81</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These cousins to elephants are
          larger and more powerfully built. There is a nearly hairless version
          that dwells in southern climates and a woolly variety adapted to cold.
          More temperamental than elephants, they are used primarily as mounts.
          For more information, see the <em>Bestiary</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 2000
