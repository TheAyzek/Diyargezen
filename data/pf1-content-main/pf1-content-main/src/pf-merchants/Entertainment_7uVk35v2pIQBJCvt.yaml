  - _id: cjFbc7lWStMCbbFv
    _key: '!actors.items!7uVk35v2pIQBJCvt.cjFbc7lWStMCbbFv'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/gaming/chess-knight-white.webp
    name: Imperial conquest
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          29</p><p><strong>Category</strong>
          Entertainment</p><h2>Description</h2>This strategy game, best played
          with an elaborate ebony board and intricate ivory pieces, follows
          deceptively simple rules with great strategic depth. While the game
          can be played with less expensive sets, only a suitably intricate and
          well-crafted game set can generate the state of mind necessary to gain
          the tactical benefits of the game. Imperial conquest is a great
          intellectual pursuit across the breadth of the Padishah Empire, but
          the game has only recently begun to spread through the Inner Sea
          region.</p><p> Up to four people can play a game of imperial conquest,
          which generally takes 1-2 hours (4d20+20 minutes). At the end of an
          uninterrupted game, each player attempts a DC 20 Intelligence check,
          with success granting tactical insights. For the next 8 hours, any
          character who succeeded at the Intelligence check gains a +1 bonus to
          AC against attacks of opportunity; when two players who succeeded at
          the Intelligence check flank the same enemy during this time, the
          bonus on attack rolls from flanking increases by 1.
      equipped: false
      flags:
        dictionary:
          Category: Entertainment
      price: 250
      subType: tradeGoods
      weight:
        value: 4
    type: loot
