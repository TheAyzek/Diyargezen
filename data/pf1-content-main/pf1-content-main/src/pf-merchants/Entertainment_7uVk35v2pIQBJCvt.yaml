  - _id: SNIYXmtaNFqUYUhY
    _key: '!actors.items!7uVk35v2pIQBJCvt.SNIYXmtaNFqUYUhY'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/gaming/playing-cards-black.webp
    name: Harrow deck
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 57</em>, <em>Curse
          of the Crimson Throne Player's Guide pg. 12</em>, <em>Pathfinder
