    img: icons/sundries/gaming/dice-runed-brown.webp
    name: Book of puzzles
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          202</p><p><strong>Category</strong>
          Entertainment</p><h2>Description</h2>Each book contains 10 puzzles
          made to test the mind and stir the intellect. Solving a single puzzle
          requires at least an hour and a successful DC 10 Intelligence check,
          though every 5 points by which you exceed the check reduces the amount
          of time you need to solve the puzzle by 10 minutes (to a minimum of 10
          minutes to solve an individual puzzle). Once you solve a puzzle, for
          the next 24 hours you can choose to roll twice on a single Disable
          Device, Knowledge, or Sense Motive skill check and take the higher
          result. Once all the puzzles are solved, the book is useless, though
          you can purchase another puzzle book with different puzzles.
      equipped: false
