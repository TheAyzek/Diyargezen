          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong> 1 gp-1,000
          gp; <strong>Weight</strong> 1 lb.-5
          lbs.</p><p><strong>Category</strong>
          Entertainment</p><h2>Description</h2>This box features moving parts,
          secret panels, or unusual codes and locking mechanisms. Depending on
          the box, a Disable Device, Knowledge (engineering), Linguistics, or
