  - _id: EmK9262Mstmf6ycz
    _key: '!actors.items!vV2rZh2Lhn22bK7t.EmK9262Mstmf6ycz'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/documents/document-bound-white.webp
    name: Service, Messenger
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 99</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Price</strong> 2 cp per mile;
          <strong>Weight</strong> -</p><p><strong>Category</strong>
          Lodging/Services</p><h2>Description</h2>A messenger carries a written
          or verbal message to its intended target. Verbal messages must be
          short enough for the messenger to memorize (typically about 25 words).
          A few messengers have exceptional memories and charge 5 sp to relay a
          verbal message of up to 300 words. Most messengers are only willing to
          travel to locations within the current city or outlying areas. You can
          pay a messenger the return fee if you want her to wait for the message
          recipient to reply, just in case the recipient is too miserly or poor
          to pay for a return message. Depending on the location and the overall
          wealth in a settlement, a messenger may be a runner or ride a horse.
          If you can find someone already traveling to a place, she may only
          charge you half as much to carry your message.
      equipped: false
      flags:
        dictionary:
          Category: Lodging/Services
      price: 0.02
      subType: tradeGoods
    type: loot
  - _id: s1enG7MiKT1I0Inq
    _key: '!actors.items!vV2rZh2Lhn22bK7t.s1enG7MiKT1I0Inq'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/cloth/cloth-roll-gold-green.webp
    name: Service, Nurse
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          99</p><p><strong>Price</strong> 7 sp; <strong>Weight</strong>
          -</p><p><strong>Category</strong>
          Lodging/Services</p><h2>Description</h2>A nurse is a person familiar
          with healing and medicine. A typical nurse is a 1st-level expert with
          1 rank in Heal and the Skill Focus (Heal) feat. An experienced nurse
          is 3rd or 4th level, has additional ranks in Heal, and is paid two to
          three times as much; however, these nurses are in high demand and are
          normally employed full-time by wealthy merchants or nobles to look
          after children and elderly family members. A nurse generally knows a
          little bit about what local magical healing can do and where to find
          it. The listed price is per day.
      equipped: false
      flags:
        dictionary:
          Category: Lodging/Services
      price: 0.7
      subType: tradeGoods
    type: loot
  - _id: DE60Zt5YMvaI9gba
    _key: '!actors.items!vV2rZh2Lhn22bK7t.DE60Zt5YMvaI9gba'
    _stats:
      coreVersion: '12.331'
    img: icons/tools/navigation/map-chart-tan.webp
    name: Service, Scribe (map)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          99</p><p><strong>Price</strong> 10 gp (map), 1 gp (text);
          <strong>Weight</strong> - (map), - (text)</p><h2>Description</h2>A
          scribe is a literate person with clear handwriting who can take
          dictation or transcribe text documents. You must provide ink and
          writing materials, though the scribe can acquire these for you at half
          price. Scribes cannot copy magical writing. A scribe who can
          accurately copy a map is rare and demands a higher wage. The listed
          price is per day.
      equipped: false
      flags:
        dictionary:
          Category: Lodging/Services
      price: 10
      subType: tradeGoods
    type: loot
