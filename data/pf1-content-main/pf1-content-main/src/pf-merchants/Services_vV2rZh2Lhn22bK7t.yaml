    name: Service, Lawyer (competent)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          99</p><p><strong>Price</strong> 3 gp (competent),
           10 gp
          (experienced), 5 sp (novice); <strong>Weight</strong> - (competent), -
          (experienced), - (novice)</p><h2>Description</h2>A lawyer is a person
          who knows and practices law. A lawyer writes and interprets contracts,
          represents clients or the government in civil and criminal trials,
          gives legal advice, or presides over cases as a judge. An experienced
          lawyer with a successful history can charge higher fees than a novice
          or competent but unremarkable one. The listed price is per day.
      equipped: false
      flags:
        dictionary:
