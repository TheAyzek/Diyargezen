      subType: tradeGoods
    type: loot
  - _id: H2L566SJHUmlNxyY
    _key: '!actors.items!vV2rZh2Lhn22bK7t.H2L566SJHUmlNxyY'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/blood_04.jpg
    name: Service, Doctor
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          99</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong>
          Lodging/Services</p><h2>Description</h2>A doctor is a person skilled
          in nonmagical healing and medicine. A typical doctor is a 3rd-level
          expert with 3 ranks in Heal, the Skill Focus (Heal) feat, and ranks in
          other valuable skills such as Knowledge (nature) and Knowledge
          (religion). An experienced doctor is up to 5th level, has additional
          ranks in appropriate skills, and is paid five to 10 times as much;
          however, these doctors are in high demand and are usually employed
          full-time by royalty. A doctor generally knows a little bit about what
          local magical healing can do and where to find it. The listed price is
          per day.
      equipped: false
      flags:
        dictionary:
          Category: Lodging/Services
      price: 1
      subType: tradeGoods
    type: loot
  - _id: bkH2XhxKFUbhvc4q
    _key: '!actors.items!vV2rZh2Lhn22bK7t.bkH2XhxKFUbhvc4q'
    _stats:
      coreVersion: '12.331'
    img: icons/environment/people/commoner.webp
    name: Service, Footman
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          99</p><p><strong>Price</strong> 5 sp; <strong>Weight</strong>
          -</p><p><strong>Category</strong>
          Lodging/Services</p><h2>Description</h2>A footman is a house servant
          in good physical shape, who is dressed in his employer's livery and
          capable of running ahead of his employer to make arrangements at a
          destination (such as an inn or a noble's mansion). This is a position
          of lesser rank than a valet, and is often a status symbol for the
          employer, with taller or better-looking employees earning higher wages
          as footmen. A skilled and personable footman can hope to eventually
          become a valet. The listed price is per day.
      equipped: false
      flags:
        dictionary:
          Category: Lodging/Services
      price: 0.5
      subType: tradeGoods
    type: loot
  - _id: FVxGOB1ipzb8S8qb
    _key: '!actors.items!vV2rZh2Lhn22bK7t.FVxGOB1ipzb8S8qb'
