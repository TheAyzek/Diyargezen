  - _id: 3bxfNQcqIHHeBwQ6
    _key: '!actors.items!vV2rZh2Lhn22bK7t.3bxfNQcqIHHeBwQ6'
    _stats:
      coreVersion: '12.331'
    img: icons/environment/settlement/city-gate.webp
    name: Service, Road or gate toll
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 99</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Price</strong> 1 cp;
          <strong>Weight</strong> -</p><p><strong>Category</strong>
          Lodging/Services</p><h2>Description</h2>Cities and towns often use
          gate tolls to generate additional income, to favor local sellers over
          visiting merchants, to discourage heavy traffic in congested areas, or
          to recoup the cost of constructing and maintaining the road or gate.
          Bridge tolls are also popular, as most travelers have no easy way to
          circumvent them.
      equipped: false
      flags:
        dictionary:
          Category: Lodging/Services
      price: 0.01
      subType: tradeGoods
    type: loot
  - _id: V8hyN4tsHnNsuSxI
    _key: '!actors.items!vV2rZh2Lhn22bK7t.V8hyN4tsHnNsuSxI'
    _stats:
      coreVersion: '12.331'
    img: icons/environment/people/cleric-orange.webp
    name: Service, Spellcasting
    system:
      description:
        value: >-
          <h1>Description</h2>The indicated amount is how much it costs to get a
          spellcaster to cast a spell for you. This price assumes that you can
          go to the spellcaster and have the spell cast at her convenience
          (generally at least 24 hours later, so that the spellcaster has time
          to prepare the spell in question, though you may be lucky enough to
          find someone who has it prepared that day or a spontaneous caster who
          knows it). If you want to bring the spellcaster somewhere to cast a
          spell (for example, to cast <em>dispel magic </em>on a magical seal in
          a dungeon) you need to negotiate with her; the default answer to such
          requests is typically no, since most people don't actually like to go
          on unexpected life-threatening adventures.</p><p>The price given is
          for any spell that does not require a costly material component. If
          the spell includes a material component, add the cost of that
          component to the cost of the spell. If the spell has a focus component
          (other than a divine focus), add 1/10 the cost of that focus to the
          cost of the spell.</p><p>If a spell has dangerous consequences (such
          as <em>contact other plane</em>, which has a risk of decreasing the
          caster's Intelligence and Charisma), the spellcaster will certainly
          require proof that you can and will pay for dealing with any such
          consequences (that is, assuming that the spellcaster even agrees to
          cast such a spell, which isn't certain). If these additional costs put
          the total spellcasting price above 3,000 gp, the spell is not
          generally available.</p><p>In the case of spells that transport the
          caster and characters over a distance, you will likely have to pay for
          two castings of the spell (one for the caster to take you there and
          one for the caster to return), even if you aren't returning with the
          caster.</p><p>Not every town or village has a spellcaster of
          sufficient level to cast any spell. In general, you must travel to a
          small town (or larger settlement) to be reasonably assured of finding
          a spellcaster capable of casting 1st-level spells, a large town for
          2nd-level spells, a small city for 3rd- or 4thlevel spells, a large
          city for 5th- or 6th-level spells, and a metropolis for 7th- or
          8th-level spells. Even a metropolis isn't guaranteed to have a local
          spellcaster able to cast 9th-level spells.
      equipped: false
      flags:
        dictionary:
          Category: Lodging/Services
      subType: tradeGoods
    type: loot
  - _id: dmvRvlO4CbqsxgbR
    _key: '!actors.items!vV2rZh2Lhn22bK7t.dmvRvlO4CbqsxgbR'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/shirt-collared-grey.webp
    name: Service, Valet
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          99</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong>
          Lodging/Services</p><h2>Description</h2>This title includes valets,
          butlers, lady's maids, ladies-inwaiting, secretaries, stewards,
          concierges, majordomos, manservants, bodyservants, and other skilled,
          trusted servants and employees who work closely with an employer or
          run a household or business, sometimes without direct supervision. The
          listed price is per day.
      equipped: false
      flags:
        dictionary:
          Category: Lodging/Services
      price: 1
      subType: tradeGoods
    type: loot
