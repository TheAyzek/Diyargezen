  - _id: j4J7Ze0vXmKRu7Oj
    _key: '!actors.items!vV2rZh2Lhn22bK7t.j4J7Ze0vXmKRu7Oj'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/feats/persuasive.jpg
    name: Service, Companion
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          99</p><p><strong>Price</strong> 5 cp-10 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong>
          Lodging/Services</p><h2>Description</h2>Whether a brazen strumpet,
          gigolo, saucy tart, escort, or expensive doxy, this person is
          available for an adventurer who needs intimacy. An hour's diversion
          typically costs a few silver pieces plus the price of a room.
      equipped: false
