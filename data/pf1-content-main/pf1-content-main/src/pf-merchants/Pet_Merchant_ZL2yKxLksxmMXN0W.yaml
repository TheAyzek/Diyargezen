          <p><strong>Source</strong>: Animal Archive pg.
          15</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2><em>Description from "Other
          Animals" section of Animal Archive, page 15.</em></p><p>The following
          reared animals don't fit into one of the aforementioned categories,
          but can still be purchased by sellers who have access to them. Some
          may be purchased already combat-trained at the GM's discretion, and
          typically cost an amount equal to 1-1/2 × the price of the standard
          animal.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 135
    type: loot
  - _id: wY752xHfvXpjIh2p
    _key: '!actors.items!ZL2yKxLksxmMXN0W.wY752xHfvXpjIh2p'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/biological/wing-lizard-green.webp
    name: Pseudodragon
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 80</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>Found primarily in temperate
          forests, pseudodragons are intelligent enough that some consider their
          sale slavery. A handful of pseudodragons offer themselves for hire to
          adventurers, typically for half their listed price per week of work.
          For more information, see the <em>Bestiary</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 200
      weight:
        value: 7
    type: loot
  - _id: PlvcoOWtubaxK14y
    _key: '!actors.items!ZL2yKxLksxmMXN0W.PlvcoOWtubaxK14y'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/misc/pet-collar-blue.webp
    name: Rabbit
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          80</p><p><strong>Price</strong> 2 gp; <strong>Weight</strong> 3
          lbs.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>Rabbits are often raised or hunted
          for their meat and skins, though some people keep the skittish mammals
          as pets. Though they are often confused with hares, rabbits are
          distinctly different in that they make their homes in burrows beneath
          the ground, and they are usually smaller than hares. Rabbits have the
          same statistics as rats (see the <em>Bestiary</em>).
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 2
      weight:
        value: 3
    type: loot
  - _id: pQR7oRGvQzbWNT2s
    _key: '!actors.items!ZL2yKxLksxmMXN0W.pQR7oRGvQzbWNT2s'
    _stats:
      coreVersion: '12.331'
    img: icons/sundries/misc/pet-collar-blue.webp
    name: Raccoon
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          80</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong> 7
          lbs.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These nocturnal hunter-scavengers
          are found primarily in forested terrains, and are noted for their
          domino mask-like visages, highly dextrous forepaws (which they rely on
          for their hyper-sensitive sense of touch), and the strangely
          anthropomorphic tendency to 'wash' their food in water before eating
          it. Raccoons are sometimes kept as pets and used by some spellcasters
          as familiars. More information on raccoons can be found in
          <em>Bestiary 3</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 5
      weight:
        value: 7
    type: loot
  - _id: SQN6Qnm243VgZwTU
    _key: '!actors.items!ZL2yKxLksxmMXN0W.SQN6Qnm243VgZwTU'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/races/ratfolk.png
    name: Ram
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 80</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong> 5 gp;
          <strong>Weight</strong> 50 lbs.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These Small animals are vicious
          scavengers in the wild. However, dire rats raised in captivity can be
          trained as loyal pets and protectors. Pet dire rats do not have filth
          fever. More information on dire rats can be found in the
          <em>Bestiary</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 5
      weight:
        value: 50
    type: loot
  - _id: eYm24hmdOaAxQLvm
    _key: '!actors.items!ZL2yKxLksxmMXN0W.eYm24hmdOaAxQLvm'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/races/ratfolk.png
    name: Rat, Riding
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 80</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong> 1 gp;
          <strong>Weight</strong> 50 lbs</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These Tiny capybara-like white
          rodents are native to temperate swamps and coasts. They are common
          pets and livestock in some lands. More information on donkey rats can
          be found in <em>Ultimate Magic</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 1
      weight:
        value: 50
    type: loot
  - _id: 4P9mCQfqiyQBtoU0
    _key: '!actors.items!ZL2yKxLksxmMXN0W.4P9mCQfqiyQBtoU0'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/feather-black-blue.webp
    name: Raven
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 80</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong> 2 gp;
          <strong>Weight</strong> 3 lbs.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These Tiny birds are known for
          their intelligence, and even play games with each other in the wild.
          They eat insects and can be found in surprisingly varied habitats.
          More information on ravens can be found in the <em>Bestiary</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 2
      weight:
        value: 3
    type: loot
  - _id: nHxr7fpS5ehaTHLe
    _key: '!actors.items!ZL2yKxLksxmMXN0W.nHxr7fpS5ehaTHLe'
    _stats:
      coreVersion: '12.331'
    img: icons/environment/creatures/bug-beetle-gold-green.webp
    name: Roc
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          205</p><p><strong>Price</strong> 3 gp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>This glass jar contains a colony of
          carnivorous scavenger beetles. The beetles must be fed at least a
          quarter pound of meat per day or they die. When released on a dead
          organism, they break it down and devour its flesh in 1d4 days, leaving
          only bones. Scavenger beetles eat only dead flesh, and can't harm
          living creatures. Once released, the beetles can't be returned to the
          jar.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 3
      weight:
        value: 1
    type: loot
  - _id: qTeVofVqN7SsWhAu
    _key: '!actors.items!ZL2yKxLksxmMXN0W.qTeVofVqN7SsWhAu'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/biological/stinger-insect-grey.webp
    name: Scorpion, Greensting
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          80</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>Typically found in forested areas,
          these Tiny scorpions sport pincers too small to be dangerous to
          anything larger than an insect, but they still possess a poisonous
          stinger. Sometimes they are kept as pets or serve as familiars.
          Greensting scorpions employed as familiars have an Intelligence score
          and lose the mindless trait. More information on greensting scorpions
          can be found in <em>Ultimate Magic</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 15
      weight:
        value: 0.55
    type: loot
  - _id: OLlBhHng362YEmZN
    _key: '!actors.items!ZL2yKxLksxmMXN0W.OLlBhHng362YEmZN'
    _stats:
      coreVersion: '12.331'
    img: modules/pf-content/icons/spell780.png
    name: Sea Krait
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Animal Archive pg.
          15</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2><em>Description from "Aquatic
          Animals" section of Animal Archive, page 14.</em></p><p>Many of the
          following aquatic animals can be bought at seaside markets or from
          fisherfolk merchants out at sea. Pirates often make use of sharks,
          eels, and other nasty sea denizens when interrogating captured
          prisoners, searching for underwater traps, or retrieving sunken
          treasure. Some of the larger or rarer creatures, such as whales, are
          obviously much more difficult to find on the open market, and may only
          be available in seedy underground bazaars. Most aquatic animals can be
          trained as normal, though they are rarely sold already trained.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 5
    type: loot
