    _stats:
      coreVersion: '12.331'
    img: icons/commodities/bones/hooves-cloven-brown.webp
    name: Donkey/Mule
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          81</p><p><strong>Price</strong> 8 gp; <strong>Weight</strong> 600-800
          lbs.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>Donkeys and mules are stolid in the
          face of danger, hardy, surefooted, and capable of carrying heavy loads
          over vast distances. Unlike a horse, a donkey or mule is willing
          (though not eager) to enter dungeons and other strange or threatening
          places. Donkeys and mules have the same statistics as ponies (see the
          <em>Bestiary</em>).
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 8
    type: loot
