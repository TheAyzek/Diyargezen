    name: Shark, Dire
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          81</p><p><strong>Price</strong> 2-20 gp; <strong>Weight</strong> 150
          lbs.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These livestock animals are kept
          for their fur, meat, and hide, and can be found in virtually any
          civilized settlement. They are especially prized in colder environs,
          where their wool and hide can be used to make durable and highly
          insulated clothing. Sheep have the same statistics as goats (see
