    name: Falcon
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 81</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>This Tiny, long-winged hawk is a
          popular hunting bird among many aristocracies. Falcons are technically
          a subset of hawks but are considered more 'noble' in many cultures.
          Ownership of these birds is denied to commoners in many nations with
          hierarchical monarchies.
