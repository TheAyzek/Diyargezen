    img: icons/environment/creatures/frog-spotted-green.webp
    name: Toad (Vision)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These animals are found in areas of
          the Mwangi Expanse. They have a psychoactive skin venom which acts as
          a mild hallucinogen if the toad's skin is licked,-though breeding
          programs for these creatures outside of Mwangi produce venomless
          offspring.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 10
      weight:
        value: 0.25
    type: loot
  - _id: kDavSZEqteZe4Txg
    _key: '!actors.items!ZL2yKxLksxmMXN0W.kDavSZEqteZe4Txg'
    _stats:
      coreVersion: '12.331'
    img: icons/environment/creatures/frog-spotted-green.webp
    name: Toad, Giant
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Animal Archive pg.
          15</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2><em>Description from "Aquatic
          Animals" section of Animal Archive, page 14.</em></p><p>Many of the
          following aquatic animals can be bought at seaside markets or from
          fisherfolk merchants out at sea. Pirates often make use of sharks,
          eels, and other nasty sea denizens when interrogating captured
          prisoners, searching for underwater traps, or retrieving sunken
          treasure. Some of the larger or rarer creatures, such as whales, are
          obviously much more difficult to find on the open market, and may only
          be available in seedy underground bazaars. Most aquatic animals can be
          trained as normal, though they are rarely sold already trained.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 150
    type: loot
  - _id: rsGxb8z5lt0P39Hr
    _key: '!actors.items!ZL2yKxLksxmMXN0W.rsGxb8z5lt0P39Hr'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/bones/beak-orange-green.webp
    name: Toucan
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Animal Archive pg.
          15</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2><em>Description from "Other
          Animals" section of Animal Archive, page 15.</em></p><p>The following
          reared animals don't fit into one of the aforementioned categories,
          but can still be purchased by sellers who have access to them. Some
          may be purchased already combat-trained at the GM's discretion, and
          typically cost an amount equal to 1-1/2 × the price of the standard
          animal.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 40
    type: loot
  - _id: QjET5PcDVeGYMygH
    _key: '!actors.items!ZL2yKxLksxmMXN0W.QjET5PcDVeGYMygH'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/inventory/amber.jpg
    name: Traveling bee hive
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          206</p><p><strong>Category</strong> Animal
          Gear</p><h2>Description</h2>These straw baskets provide a portable
          home for bees. They are dome shaped, with a hole in the top that a
          smaller woven basket covers as a cap. This hole allows for the
          harvesting of small amounts of honey without destroying the entire
          hive. Believing that certain bees provide for a superior crop yield,
          some farmers pay beekeepers to travel to their farms with the
          bees.</p><p> Destroying a traveling bee hive causes the bees to swarm,
          creating a 5-foot-radius cloud. A creature is blinded and for as long
          as it remains in the cloud, and must succeed at a DC 12 Fortitude
          saving throw or become sickened for 1 minute. The sickened condition
          is a poison effect.
      equipped: false
      flags:
        dictionary:
          Category: Animal Gear
      price: 10
      subType: gear
      weight:
        value: 10
    type: loot
  - _id: CUXCRnDAat8FDfwK
    _key: '!actors.items!ZL2yKxLksxmMXN0W.CUXCRnDAat8FDfwK'
    _stats:
      coreVersion: '12.331'
    img: modules/pf-content/icons/spell222.png
    name: Turtle
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          80</p><p><strong>Price</strong> 3 gp; <strong>Weight</strong> 4
          lbs.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These reptiles have bony shells
          that they can retreat into. They are sometimes kept as pets and used
          as familiars, and in some places their flesh is eaten or used as an
          ingredient in medicines. More information on turtles can be found in
          <em>Ultimate Magic</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 3
      weight:
        value: 4
    type: loot
