          <strong>Weight</strong> 1 lb.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These Diminutive rodents are
          nocturnal fliers that eat insects and fruit. They rely primarily on
          sound to navigate rather than sight. They are absent only in desert
          and arctic regions. Some cultures keep bat houses near towns and
          villages to control insect problems. More information on bats can be
          found in the <em>Bestiary</em>.
