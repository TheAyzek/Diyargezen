          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong> 2 cp;
          <strong>Weight</strong> 7 oz.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>This Diminutive amphibian is
          primarily kept as a familiar by spellcasters. Toads live in most
          temperate and warm environments, and eat insects. More information on
          toads can be found in <em>Bestiary</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 0.02
      weight:
        value: 0.35
    type: loot
  - _id: 7ELycSiyeRNpq5NK
    _key: '!actors.items!ZL2yKxLksxmMXN0W.7ELycSiyeRNpq5NK'
    _stats:
