    name: Vulture, Giant
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 80</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong> 2 gp;
          <strong>Weight</strong> 8 oz.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These Tiny animals eat smaller
          animals and can be found in nearly any environment. They are clever
          and curious, traits that are magnified when they are kept as
          familiars. Many varieties of weasel exude a strong musky odor. This
          description also applies to similar animals, such as ferrets, minks,
          polecats, and stoats. More information on weasels can be found in the
          <em>Bestiary</em>.
