          80</p><p><strong>Price</strong> 8 gp; <strong>Weight</strong> 12
          lbs.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These quick and wily carnivores can
          be difficult to train, but often make excellent familiars. Many
          humanoid communities see these canines as a menace to their farming
          fowl, and some use dogs to track them during recreational hunts. More
