  - _id: 33cr9BYGUPkIRxFK
    _key: '!actors.items!ZL2yKxLksxmMXN0W.33cr9BYGUPkIRxFK'
    _stats:
      coreVersion: '12.331'
    img: icons/environment/creatures/bug-centipede-brown.webp
    name: Centipede, House
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          80</p><p><strong>Price</strong> 1 cp; <strong>Weight</strong> 3
          oz.</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These creatures come in many forms,
          from the lighter-colored 20-legged variety to the darker 300-legged
          variety. Typically, these arthropods are what pass for pets in the
          slums, but the young and eccentric often search for the best specimens
          to serve as familiars. Centipedes employed as familiars have an
          Intelligence score and lose the mindless trait. More information on
          house centipedes can be found in <em>Ultimate Magic</em>.
      equipped: false
      flags:
        dictionary:
          Category: Mounts/Pets
      price: 0.01
      weight:
        value: 0.15
    type: loot
