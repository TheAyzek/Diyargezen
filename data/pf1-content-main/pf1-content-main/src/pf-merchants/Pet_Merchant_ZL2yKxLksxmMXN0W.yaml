    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          81</p><p><strong>Category</strong>
          Mounts/Pets</p><h2>Description</h2>These shaggy-haired relatives to
          cows are more at home in mountainous terrain where they are frequently
          used as pack animals and to pull plows. Yaks have the same statistics
          as bison (see the <em>Bestiary</em>).
      equipped: false
