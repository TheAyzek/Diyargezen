_stats:
  coreVersion: '12.343'
flags:
  core:
    sheetClass: PF1.ActorSheetPFNPCLoot
img: icons/commodities/cloth/cloth-rolls-rgb.webp
items:
  - _id: 2MRYeLRKdyMfdDWi
    _key: '!actors.items!If2hjs4hEuT4fmUq.2MRYeLRKdyMfdDWi'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/back/cloak-layered-green-yellow.webp
    name: Billow cape
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          65</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This silk cape is constructed of many
          carefully arranged overlapping layers that are loosely stitched
          together. When exposed to a sudden influx of air, like that caused by
          falling, the cloak unfolds like a crude parachute. When falling, a
          creature wearing a billow cape is treated as if he had deliberately
          jumped from the height. When worn in areas of strong wind or greater,
          a billow cape hampers movement. In such wind conditions, the wearer
          treats all terrain as difficult terrain and takes a -4 penalty on Fly
          checks. Because of the strange and somewhat fragile construction of
          this cape, only Small or smaller billow capes function properly.
          Larger billow capes take all the penalties resulting from high winds,
          but grant none of the benefits when the wearer falls.
      price: 100
      slot: shoulders
      subType: clothing
      weight:
        value: 4
    type: equipment
  - _id: S9puNubYN7Z9TKcU
    _key: '!actors.items!If2hjs4hEuT4fmUq.S9puNubYN7Z9TKcU'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/boots-leather-banded-furred.webp
    name: Bogwalking sandals
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Merchant's Manifest pg.
          9</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These sandals have blackwood soles and
          leather straps that wrap around the wearer's feet. The sandals are
          waterproof and are thus popular among individuals who tread the harsh
          locales of the swamps and wastelands beyond Cassomir proper-especially
          those who are in such environments for long periods of time without
          access to the comforts of a skilled cobbler. The sandals' design also
          allows the wearer to move through shallow bogs normally and to treat
          deep bogs as if they were shallow bogs (<em>Pathfinder RPG Core
          Rulebook</em> 427). The sandals do not affect the penalty on
          Acrobatics checks while in bogs, and creatures wearing the sandals
          cannot gain cover from deep bogs.
      price: 250
      slot: feet
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: LwlFrBiXvhBU8wFb
    _key: '!actors.items!If2hjs4hEuT4fmUq.LwlFrBiXvhBU8wFb'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/neck/amulet-geometric-gold-green.webp
    name: Brooch
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  Varies; <strong>Weight</strong> 
          -</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>This
          is a small ornament used to hold an element of clothing, such as a
          cloak or cape, in place. Many organizations provide special brooches
          as a symbol of membership or to honor a special achievement.
      slot: neck
      subType: clothing
    type: equipment
  - _id: BjtpKliOOPnA8vzo
    _key: '!actors.items!If2hjs4hEuT4fmUq.BjtpKliOOPnA8vzo'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/hood-cloth-pink-red.webp
    name: Caul
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  10-100 gp; <strong>Weight</strong> 
          -</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>This
          ornate hairnet, fashioned from silk, cloth of gold, and jewels, is
          most commonly worn by royal or aristocratic women.
      price: 10
      slot: head
      subType: clothing
    type: equipment
  - _id: LbbKYS65XbLJFlUZ
    _key: '!actors.items!If2hjs4hEuT4fmUq.LbbKYS65XbLJFlUZ'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/waist/belt-ring-steel.webp
    name: Chain belt
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          177</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>While undines dress sparingly, they
          often wear 10-foot-long belts of fine linked chain about their waists.
          The belts contain hinged links to which the wearer can affix various
          objects such as tools, small weapons, and other valuables, including
          links of silver and platinum, or small hammered plates of gold set
          with gems. If worn properly, the belt can hold up to 30 pounds of
          small items. A swimming undine can unwrap the belt as swift action if
          she needs to remove it to decrease her weight load.
      price: 15
      slot: belt
      subType: clothing
    type: equipment
  - _id: ptnpg9OVC4QEawHS
    _key: '!actors.items!If2hjs4hEuT4fmUq.ptnpg9OVC4QEawHS'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/leg/pants-green-fabric-pants.webp
    name: Chausses
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          20</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong> 3
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These padded woolen leggings are
          quilted to provide extra warmth and protection. They are frequently
          worn under mail or plate armor.
      price: 1
      subType: clothing
      weight:
        value: 3
    type: equipment
  - _id: VsEjnNNj01a9R5ix
    _key: '!actors.items!If2hjs4hEuT4fmUq.VsEjnNNj01a9R5ix'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/boots-leather-engraved-brown.webp
    name: Cleats
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Adventurer's Armory pg. 19</em>, <em>Advanced Player's Guide pg.
          185</em>, <em>Pathfinder #51: The Hungry Storm pg.
          67</p><p><strong>Price</strong>  5 gp; <strong>Weight</strong>  2
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Cleats reduce the penalty for walking
          over slick surfaces by 50%. For example, walking across ice normally
          costs 2 squares of movement (1 square plus a 1 square penalty) for
          every square of movement, but with cleats it costs only 1.5 squares
          for every square. Cleats cause damage to any type of finished
          flooring. They may supplement another outfit.
      price: 5
      slot: feet
      subType: clothing
      weight:
        value: 2
    type: equipment
  - _id: 8QI2waS8tJbWCLQc
    _key: '!actors.items!If2hjs4hEuT4fmUq.8QI2waS8tJbWCLQc'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-layered-white.webp
    name: Cleric's vestments
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Price</strong>  5 gp;
          <strong>Weight</strong>  6 lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These ceremonial clothes are worn when
          performing priestly functions within a church or temple, and aren't
          well suited to adventuring. A cleric's vestments typically include a
          cassock, stole, and surplice. The colors usually correspond to the
          deity worshiped, and while some priests may choose elaborate
          embroidery with ecclesiastical themes, others find merit in humble
          simplicity.
      price: 5
      slot: chest
      subType: clothing
      weight:
        value: 6
    type: equipment
  - _id: QdkLdgTHoOPH7Les
    _key: '!actors.items!If2hjs4hEuT4fmUq.QdkLdgTHoOPH7Les'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/vest-cloth-tattered-orange.webp
    name: Cork vest
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Class Guide pg.
          203</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This fabric vest contains pockets full
          of cork, providing the wearer additional buoyancy. Originally worn by
          fishers and sailors, it protects against drowning. While wearing a
          cork vest, you take a -2 penalty on Dexterity and Swim checks, but
          instead of going underwater after failing the check by 5 or more, you
          go underwater only if you fail by 10 or more. Additionally, you gain a
          +4 bonus on Swim checks to avoid damage from fatigue. The cork vest
          can be worn under armor.
      price: 25
      slot: chest
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: 68EaMXPeQMIpQvuV
    _key: '!actors.items!If2hjs4hEuT4fmUq.68EaMXPeQMIpQvuV'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-layered-red.webp
    name: Corset
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          20</p><p><strong>Price</strong> 1 sp-200 gp; <strong>Weight</strong> 3
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Sewn-in boning and laces allow this
          bodice to adjust your waist size in a way considered alluring by some
          cultures. The restrictive nature of this garment makes it a poor
          choice for combat or other athletic exertions, but you can easily
          conceal a thin knife in the corset's boning. The price varies greatly
          depending on the corset's quality; the cheapest corsets are made of
          simple cloth and cost mere silver pieces, while the most expensive
          feature silk brocade and are decorated with pearls or other costly
          adornments.
      price: 0.1
      slot: chest
      subType: clothing
      weight:
        value: 3
    type: equipment
  - _id: YLyzqImzXwuvZrtN
    _key: '!actors.items!If2hjs4hEuT4fmUq.YLyzqImzXwuvZrtN'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/finger/ring-band-engraved-lines-gold.webp
    name: Covenant rings
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Merchant's Manifest pg.
          21</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These silver rings are always sold in
          uniquely crafted pairs- usually one made in a Varisian style and one
          in an old Korvosan style. Originally made to celebrate the uniting of
          the Korvosan dissidents and Varisian locals at the city's outset, they
          are now commonly sought by young lovers, very close friends, and other
          intimate pairs. When two emotionally intimate creatures each wear one
          of the rings in a set, both wearers gain a +1 bonus on saving throws
          against fear effects. This bonus ends if the creatures' emotional bond
          is severed (at the GM's discretion), one of the creatures removes a
          ring and returns it to the other creature, or a bonded creature is no
          longer wearing the ring (or is no longer alive or on the same plane).
      price: 100
      slot: fingers
      subType: clothing
    type: equipment
  - _id: x7YvLSVDgwZNGJkq
    _key: '!actors.items!If2hjs4hEuT4fmUq.x7YvLSVDgwZNGJkq'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/shoes-pointed-blue.webp
    name: Cushion inserts
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          243</p><p><strong>Price</strong> 5 sp; <strong>Weight</strong>
          -</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These rubber boot or shoe inserts
          cushion your feet and improve your gait, granting you a +1
          circumstance bonus on Constitution checks to continue running and to
          avoid nonlethal damage from a forced march.
      price: 0.5
      slot: feet
      subType: clothing
    type: equipment
  - _id: zI5XrOUSdNQjnBVb
    _key: '!actors.items!If2hjs4hEuT4fmUq.zI5XrOUSdNQjnBVb'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/vest-leather-pink.webp
    name: Dancer's garb
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          29</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This combination of loose-fitting
          sashes, veils, and ornamentation accentuates a dancer's form and
          movements. Dancer's garb provides a +2 circumstance bonus on Perform
          (dance) checks, similar to that provided by masterwork instruments for
          other Perform skills, but does not grant this benefit when worn with
          armor or other concealing clothing.
      price: 100
      slot: body
      subType: clothing
      weight:
        value: 5
    type: equipment
  - _id: NCFI0M0W7JmmJSRM
    _key: '!actors.items!If2hjs4hEuT4fmUq.NCFI0M0W7JmmJSRM'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/vest-leather-pink.webp
    name: Dancer's garb, silver
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          29</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>In
          addition to granting the same bonus on Perform (dance) checks as
          regular dancer's garb, silver dancer's garb is considered a silver
          instrument for silver balladeer bards (<em>Pathfinder RPG Occult
          Adventures</em> 115). Silver dancer's garb can be made of sunsilver
          (see below); sunsilver dancer's garb costs an additional 3,000 gp and
          grants the same benefits as armor made of sunsilver. As with the bonus
          on Perform (dance) checks, this benefit functions only when no other
          armor or concealing clothing is worn.
      price: 200
      slot: body
      subType: clothing
      weight:
        value: 5
    type: equipment
  - _id: UCIOVSl96FM6TUVb
    _key: '!actors.items!If2hjs4hEuT4fmUq.UCIOVSl96FM6TUVb'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/cloth/ribbon-bolt-blue.webp
    name: Decorative trim
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  1 sp-50 gp; <strong>Weight</strong> 
          -</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>This
          decorative set of collars, cuffs, and trim pieces attaches to
          otherwise plain clothes. Frequent travelers, such as merchants or
          entertainers, use trim to blend in with the local styles without
          buying a new wardrobe. A traveling noble keeps extra sets for use by
          temporary staff and loaned guards.
      price: 1
      subType: clothing
    type: equipment
  - _id: tVcmWkrZYs4muA7E
    _key: '!actors.items!If2hjs4hEuT4fmUq.tVcmWkrZYs4muA7E'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/breastplate-layered-steel.webp
    name: Diving suit
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This one-piece suit of clothing
          reduces one's drag in the water, making swimming easier. It provides a
          +1 circumstance bonus on Swim checks. The suit only grants this bonus
          if it is the outermost garment, and has no effect if worn over bulky
          clothes or armor or with cumbersome gear (such as a backpack, large
          weapons, and so on). Damage to the suit (such as from several rounds
          of combat against slashing and piercing attacks) negates the suit's
          bonus until it is repaired.
      price: 10
      slot: body
      subType: clothing
      weight:
        value: 2
    type: equipment
  - _id: 23cuEFdYF0crVtlw
    _key: '!actors.items!If2hjs4hEuT4fmUq.23cuEFdYF0crVtlw'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/wood-pole.webp
    name: Elven Prosthetics
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes from the Fringe pg.
          22</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>The
          canny half-elf sometimes needs a little something extra to look like a
          full elf. Ear extensions make somewhat elongated half-elf ears look
          like sharp elf ears, and colored lenses make a half-elf's human-like
          eyes look like elven eyes. These accessories give a half-elf a +6
          circumstance bonus on Disguise checks to resemble an elf and can be
          used only by a half-elf.
      price: 250
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: G1pZQO0744UHHlXv
    _key: '!actors.items!If2hjs4hEuT4fmUq.G1pZQO0744UHHlXv'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/neck/amulet-round-blue-grey.webp
    name: Emissary's sash
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Rise of the Runelords Player's Guide pg.
          11</p><p><strong>Price</strong> 20+ gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Favored by rogues in statuesque
          Magnimar, these adornments hide tiny secret compartments. False
          jewelry grants a +8 bonus on Sleight of Hand checks to hide a tiny
          object on your person (does not stack with the bonus for hiding very
          small objects) and negates the +4 bonuses searchers receive when
          frisking you. False jewelry costs 20 gp in addition to the value of
          the ornament being fitted with the secret compartment.
      price: 20
      subType: clothing
    type: equipment
  - _id: fVmeXsdbpWApPgrI
    _key: '!actors.items!If2hjs4hEuT4fmUq.fVmeXsdbpWApPgrI'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/neck/collar-rough-stone-cubes.webp
    name: Fashionable accessories
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Streets pg.
          13</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These accessories allow a courtier's,
          entertainer's, or noble's outfit to match the height of style in a
          particular city for 2d4 months. You gain a +2 circumstance bonus on
          Diplomacy checks to make requests of denizens of that city while
          wearing the accessories and an appropriate outfit. The bonus also
          applies on Bluff and Disguise checks to convince others that you hail
          from that city.
      price: 20
      subType: clothing
      weight:
        value: 5
    type: equipment
  - _id: ZHsi5nQfImH5GdkL
    _key: '!actors.items!If2hjs4hEuT4fmUq.ZHsi5nQfImH5GdkL'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/back/cloak-collared-teal.webp
    name: Filter scarf
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          243</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>Made
          of heavy material, this scarf filters out dust, sand, smoke, and other
          airborne contaminants. When worn over your nose and mouth, this scarf
          grants you a +1 resistance bonus on saving throws against inhaled
          poisons and other airborne effects that require breathing.
      price: 5
      slot: neck
      subType: clothing
    type: equipment
  - _id: En08vU1iGT8E3dM4
    _key: '!actors.items!If2hjs4hEuT4fmUq.En08vU1iGT8E3dM4'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/boots-collared-red.webp
    name: Fire-resistant boots
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These heavy leather boots contain a
          layer of brick dust that protects your feet from heat. You gain fire
          resistance 2 against fire attacks directed at or under your feet, such
          as walking across hot coals. Repeat or prolonged exposure to fire
          damage eventually burns the outer leather of the boots, ruining them
          (typically after about 1d10+20 rounds of exposure).
      price: 20
      slot: feet
      subType: clothing
      weight:
        value: 2
    type: equipment
  - _id: ADMaMYt6dlkEhJ2J
    _key: '!actors.items!If2hjs4hEuT4fmUq.ADMaMYt6dlkEhJ2J'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/shoulder/shoulderpad-fur-white.webp
    name: Furs
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Pathfinder #51: The Hungry Storm pg. 67</em>, <em>Advanced
          Player's Guide pg. 185</em>, <em>Adventurer's Armory pg.
          19</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>The
          most basic of cold-weather gear, animal furs serve to keep their
          wearers warm. Wearing enough fur to cover the body provides a +2 bonus
          on Fortitude saves to resist cold weather. This does not stack with
          any bonuses gained from the Survival skill. Furs may supplement
          another outfit.
      price: 12
      slot: body
      subType: clothing
      weight:
        value: 5
    type: equipment
  - _id: 3ka9UFjj7A9RmivH
    _key: '!actors.items!If2hjs4hEuT4fmUq.3ka9UFjj7A9RmivH'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-layered-blue.webp
    name: Gambeson
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          20</p><p><strong>Price</strong> 1 gp; <strong>Weight</strong> 4
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This padded cloth jacket is often worn
          alone or with mail or plate armor and is favored by hunters, guards,
          and soldiers. A gambeson fitted with leather loops to more easily
          attach armor is called an arming doublet. Although sufficient to
          protect you against casual scrapes, it is not as thick as padded
          armor.
      price: 1
      slot: chest
      subType: clothing
      weight:
        value: 4
    type: equipment
  - _id: vxSR3kBcmxiUmBot
    _key: '!actors.items!If2hjs4hEuT4fmUq.vxSR3kBcmxiUmBot'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/hand/glove-ring-leather-green.webp
    name: Gecko gloves
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Giant Hunter's Handbook pg.
          25</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>The
          palms and fingers of these leather gloves are covered in small
          hairlike bristles, resembling those found on the feet of geckos, that
          aid you when climbing. Gecko gloves grant you a +1 circumstance bonus
          on Climb checks. They also enable you to climb with only one hand;
          doing so imposes a -5 penalty on your Climb checks.
      price: 300
      slot: hands
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: 2VOb1U2Y6qvP0cNk
    _key: '!actors.items!If2hjs4hEuT4fmUq.2VOb1U2Y6qvP0cNk'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/hat-belted-simple-brown.webp
    name: Hat
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Adventurer's Armory pg. 19</em>, <em>Pirates of the Inner Sea pg.
          21</p><p><strong>Price</strong>  1 sp-50 gp; <strong>Weight</strong> 
          1/2 lb.-2 lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Hats of various styles appear in all
          cultures. Ranging from the turban to the tricorne to the furred cap, a
          hat can be a simple covering for the head. Particular hats are
          sometimes mandatory for social or religious sects. A utilitarian hat
          such as a tricorne typically costs 2 sp.
      slot: head
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: w9mzF9WPv9dDwI0L
    _key: '!actors.items!If2hjs4hEuT4fmUq.w9mzF9WPv9dDwI0L'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/hood-ringed-leather-red.webp
    name: Headscarf
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          20</p><p><strong>Price</strong> 1 sp-10 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Often worn for privacy, religious or
          cultural reasons, or protection from the elements, full scarves
          designed to be wrapped around the head are common accessories
          throughout Golarion. Headscarves of bright colors or ornate embroidery
          can fetch a substantially higher price.
      slot: head
      subType: clothing
    type: equipment
  - _id: 3Y0BaC7O36zD9I4f
    _key: '!actors.items!If2hjs4hEuT4fmUq.3Y0BaC7O36zD9I4f'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/hand/glove-cuffed-studded-red.webp
    name: Heated gloves
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Merchant's Manifest pg.
          13</p><p><strong>Price</strong> 2 gp; <strong>Weight</strong> 1
          lb.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These thick, fur-lined gloves have
          several internal pockets containing segmented packets of alchemical
          reagents that produce heat for 4 hours when broken and mixed. The
          wearer can massage the gloves to activate these heat packets as a
          full-round action. While the heat packets last, the wearer ignores the
          Strength and Dexterity penalties from the fatigued condition when
          performing Climb, Disable Device, and Sleight of Hand checks.
          Replacement heat packets cost 1 gp, and the heat packets in the gloves
          can be replaced with 1 minute of uninterrupted work.
      price: 2
      slot: hands
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: aPqrbEIBDmcJ2pIe
    _key: '!actors.items!If2hjs4hEuT4fmUq.aPqrbEIBDmcJ2pIe'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/hat-cocked-feather-green.webp
    name: Hennin
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  10-100gp; <strong>Weight</strong>  1
          lb.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This high conical headpiece ends in a
          tip that usually has a piece of silk or similar diaphanous material
          dangling from it. Women of noble birth sometimes wear a hennin to
          formal or social occasions as a signal of their eligibility, and give
          the silk part of the headpiece as a token to suitors they favor.
      slot: head
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: GOTvLolwJNM8bCHH
    _key: '!actors.items!If2hjs4hEuT4fmUq.GOTvLolwJNM8bCHH'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/shoes-rounded-brown.webp
    name: Hollow-heeled boot
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Streets pg.
          13</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This boot contains a hollow that
          grants a +4 bonus on Sleight of Hand checks to conceal items within
          the boot while wearing it. The hollow can hold up to 8 cubic inches.
          Putting on or removing the boot is a standard action, as is retrieving
          or storing an item from the hollow when the boot is in hand. Adding an
          item to or removing one from the boot while it is worn is a full-round
          action.
      price: 10
      slot: feet
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: HE9j1e80AHQgupaN
    _key: '!actors.items!If2hjs4hEuT4fmUq.HE9j1e80AHQgupaN'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/boots-plate-grey.webp
    name: Ice skates
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  1 gp; <strong>Weight</strong>  2
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Each of these calf-high boots bears a
          vertical blade on the bottom, allowing you to travel swiftly on ice.
          Wearing ice skates allows you to move on ice at normal speed with a
          successful DC 5 Acrobatics check (including running and charging), but
          your movement is reduced to half speed on all other terrain. Donning
          or removing an ice skate is a full-round action. Skating with only one
          is possible, but the DC of the Acrobatics check rises to 15.
      price: 1
      slot: feet
      subType: clothing
      weight:
        value: 2
    type: equipment
  - _id: L1QdV7e0zvw4d2QU
    _key: '!actors.items!If2hjs4hEuT4fmUq.L1QdV7e0zvw4d2QU'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/cloth/cloth-green-folded.webp
    name: Inside pocket
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          243</p><p><strong>Price</strong> 4 gp; <strong>Weight</strong>
          -</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>This
          is an extra pocket sewn on the inside of a piece of clothing. You gain
          a +2 circumstance bonus on Sleight of Hand checks to conceal an item
          in an inside pocket. Detecting the compartment requires a successful
          DC 15 Perception check at minimum (DC 20 if empty), even if you aren't
          trained in Sleight of Hand.</p><p>The inside pocket is 1 inch deep.
          Different styles open from the top or from the side, and some have
          button flaps to secure the contents.
      price: 4
      subType: clothing
    type: equipment
  - _id: meHQcPw1XyD0i8vg
    _key: '!actors.items!If2hjs4hEuT4fmUq.meHQcPw1XyD0i8vg'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/neck/amulet-round-gold-blue.webp
    name: Jewelry
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong>  Varies;
          <strong>Weight</strong>  Varies</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>The price of jewelry varies wildly by
          its quality. Many cultures, particularly nomads, consciously use
          jewelry as a form of portable wealth, most notably with belts and
          bangles made from coins. A commoner's ornaments may only be worth a
          few copper pieces, an artisan's a few silver pieces, and a merchant's
          a few gold pieces, while nobles rarely wear jewelry worth less than
          100 gp.
      subType: clothing
    type: equipment
  - _id: gTRFuVSMhKhhQjME
    _key: '!actors.items!If2hjs4hEuT4fmUq.gTRFuVSMhKhhQjME'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/leg/skirt-cloth-red.webp
    name: Kilt
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  2 sp; <strong>Weight</strong>  1
          lb.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This heavy pleated skirt is usually
          worn by men. Most have a specific design or pattern that represents
          allegiance to a particular clan or other social group.
      price: 0.2
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: iu2yDIf9PCsp0T6y
    _key: '!actors.items!If2hjs4hEuT4fmUq.iu2yDIf9PCsp0T6y'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/boots-armored-studded-steel.webp
    name: Litchina
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Giant Hunter's Handbook pg.
          25</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>The
          soles of these tough boots include lodestones that have been augmented
          through alchemical processes to be very strong. While climbing a rope,
          you can pinch the rope between the boots to prevent yourself from
          falling; you can release the boots' grip by carefully twisting them
          apart. The boots also stick to steel, iron, and other magnetizable
          surfaces.</p><p>You gain a +4 circumstance bonus on your Climb checks
          while using the boots' magnetism to help you climb a rope or magnetic
          surface. While standing on a magnetic surface, the boots grant you a
          +4 circumstance bonus on Strength checks and Fortitude saving throws
          to avoid being blown away by winds. Leaving a square when you the
          boots are attached to a magnetic surface requires an additional 5 feet
          of movement, as your overland speed is effectively reduced in exchange
          for the boots' assistance in climbing.
      price: 60
      slot: feet
      subType: clothing
      weight:
        value: 4
    type: equipment
  - _id: 5twqSSgmUmIVYKKE
    _key: '!actors.items!If2hjs4hEuT4fmUq.5twqSSgmUmIVYKKE'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/hand/glove-belted-leather-blue.webp
    name: Long gloves
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the High Court pg.
          28</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These full-length gloves of layered
          silk are popular among Kalistocrats and others who disdain physical
          contact. The wearer gains a +4 circumstance bonus on saving throws
          against contact poisons on objects he touches.
      price: 15
      slot: hands
      subType: clothing
    type: equipment
  - _id: r988AKKwrmS81NAj
    _key: '!actors.items!If2hjs4hEuT4fmUq.r988AKKwrmS81NAj'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/mask-carved-wood-pink.webp
    name: Lover's breath
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong>  1 sp-50
          gp; <strong>Weight</strong>  1 lb.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>The gala events of decadent nobles are
          where one might see the most outlandish and stylish of masks, but
          simpler masks might be found wherever local customs permit. They range
          from small bits of fabric that cover only a portion of the face to
          elaborate constructions that cover the entire face or head.
      slot: mask
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: nm2hjFux5UayrSnU
    _key: '!actors.items!If2hjs4hEuT4fmUq.nm2hjFux5UayrSnU'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/mask-carved-gargoyle-grey.webp
    name: Mask, Battle
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  5-10 gp; <strong>Weight</strong>  1
          lb.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This articulated mask resembles a
          specific type of humanoid monster, such as a bugbear, goblin, orc, or
          hobgoblin. The mouth opens and closes when you move your jaw and its
          skin is actually carefully-painted cloth. Though such masks are
          usually intended for theater performances where an actor plays the
          role of a monster, adventurers have been known to use them to help
          blend in with monsters of the appropriate type. The mask negates the
          -2 Disguise DC for disguising yourself as a different race, but only
          at a distance of at least 20 feet or when you have concealment; closer
          than this distance or in clearer circumstances, the mask is obviously
          a false representation. It only covers your face and is normally worn
          with a wig or helmet to disguise or cover the rest of your head. Each
          mask is most suitable for a wearer of a particular size, though some
          size and monster combinations are less believable than others (a Small
          creature in an orc mask may be able to pass as an orc child, but a
          Medium creature in a goblin mask at best looks like a deformed
          hobgoblin).
      slot: mask
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: 3l3h1ijq4sd2Zfx2
    _key: '!actors.items!If2hjs4hEuT4fmUq.3l3h1ijq4sd2Zfx2'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/mask-carved-bird-grey-pink.webp
    name: Mask, Signifier
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Guide pg.
          97</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>The
          menacing, eyeless masks of the Hellknight signifers were first created
          by members of the Order of the Gate, and are semitransparent when
          viewed from the inside. This alchemical treating of the material
          obscures the face of the wearer as a full helm does but allows the
          wearer to see as if through a smoky pane of glass. When wearing a
          signifer mask, the wearer is always treated as averting her gaze when
          dealing with gaze attacks, and she gains a +8 circumstance bonus on
          saving throws against vision-based effects. However, the obscuring
          nature of the mask means that the wearer also takes a -4 penalty on
          vision-based Perception checks while wearing the mask, and all
          opponents are treated as having concealment (20% miss chance).</p><p>A
          character with the Hellknight signifer prestige class can see through
          the mask as normal, but she can also adjust her mask as a standard
          action to function as detailed above. Signifer masks are often
          magically enhanced, becoming variants of items that take up the head
          item slot. Additionally, when a character takes levels in the
          Hellknight signifer prestige class, this mask grants the benefits and
          capabilities of the signifer mask class feature (see page 93).
      price: 75
      slot: mask
      subType: clothing
      weight:
        value: 2
    type: equipment
  - _id: CwuxdVKIZqaDZNXT
    _key: '!actors.items!If2hjs4hEuT4fmUq.CwuxdVKIZqaDZNXT'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/hand/glove-reticulated-steel.webp
    name: Metal glove
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dungeoneer's Handbook pg.
          24</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This thick iron gauntlet is more an
          encasing than a piece of armor. It has only a few moving joints, and
          the position of its fingers and wrist must be adjusted and locked into
          place before the wielder can properly slip it over her arm. When
          wearing a metal glove, it is impossible to manipulate one's digits
          (meaning the wearer cannot hold anything in that hand), but that hand
          and forearm are completely protected from injury, making it easy to
          reach into a trapped hole or a deadly animal's cage. Any trap or
          creature attempting to damage an arm wearing a metal glove must break
          through the glove before reaching the wearer. Heavy objects that would
          normally crush the wearer's hand rest harmlessly on the glove instead,
          likely trapping the item but allowing her to pull her hand out as
          normal. A metal glove has hardness 10 and 15 hit points, and can
          withstand 2,000 pounds of pressure before crumpling. It does not
          protect the wearer from injury to other parts of her body.
      price: 120
      slot: hands
      subType: clothing
      weight:
        value: 10
    type: equipment
  - _id: aw2SS2Msh9UbTrVm
    _key: '!actors.items!If2hjs4hEuT4fmUq.aw2SS2Msh9UbTrVm'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/collar-steel.webp
    name: Neck guard
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          99</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Made from hardened leather reinforced
          with a band of metal, this collar protects the wearer against vampire
          bites when worn around the throat. It provides a +1 armor bonus to AC
          against vampire bites or similar attacks that specifically target the
          wearer's throat. Unlike most armor bonuses, the neck guard's +1 bonus
          stacks with the armor bonus of light or medium armor, but it provides
          no additional bonus when worn with heavy armor.
      price: 10
      slot: neck
      subType: clothing
    type: equipment
  - _id: eDxfqdK0CWRTixS0
    _key: '!actors.items!If2hjs4hEuT4fmUq.eDxfqdK0CWRTixS0'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/coat-collared-red-gold.webp
    name: Ostentatious garment
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the High Court pg.
          28</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This term covers items not listed
          elsewhere, such as elaborate wigs, silk-lined cloaks, and ruffled
          blouses. While such garments usually offers no benefit beyond fashion,
          a silksworn occultist must wear several such garments of suitable
          quality to access her magic.
      price: 10
      slot: body
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: 8wthSaX9yMiLcpTm
    _key: '!actors.items!If2hjs4hEuT4fmUq.8wthSaX9yMiLcpTm'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-collared-blue.webp
    name: Outfit, Artisan's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Price</strong>  1 gp;
          <strong>Weight</strong>  4 lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Artisan's clothing is well made from
          simple but durable cloth, appropriate for those who must work in
          various specialized and often manual trades, such as baking,
          carpentry, and other middleclass professions. This outfit includes a
          shirt with buttons, a skirt or pants with a drawstring, shoes, and
          perhaps a cap or hat. It may also include a belt or a leather or cloth
          apron for carrying tools.
      price: 1
      slot: body
      subType: clothing
      weight:
        value: 4
    type: equipment
  - _id: 8ahhPo1ZMxrn9sMY
    _key: '!actors.items!If2hjs4hEuT4fmUq.8ahhPo1ZMxrn9sMY'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/shirt-simple-grey.webp
    name: Outfit, Burglar's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          20</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong> 5
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This outfit consists of fitted pants,
          a shirt, a hooded reversible cloak, soft leather boots, and a face
          mask, all in dark or neutral colors. The outfit's few buttons and
          rivets are wrapped in dull, dark cloth to avoid jingling or reflecting
          light. A number of loops and shallow pockets are also worked into the
          outfit, providing ample spaces for stashing small tools or weapons.
      price: 5
      slot: body
      subType: clothing
      weight:
        value: 5
    type: equipment
  - _id: g4E2pxx94DIvEcGx
    _key: '!actors.items!If2hjs4hEuT4fmUq.g4E2pxx94DIvEcGx'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/shirt-collared-brown.webp
    name: Outfit, Cold-weather
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Pathfinder #51: The Hungry Storm pg. 67</em>, <em>PRPG Core
          Rulebook pg. 159</p><p><strong>Price</strong>  8 gp;
          <strong>Weight</strong>  7 lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This outfit is designed for
          mountaineering or hunting and traveling in icy climates. It includes a
          coat of wool or thick animal fur, a linen shirt, a wool cap, a heavy
          cloak, a heavy skirt or pants, and waterproof leather boots. In some
          regions, the outfit may be composed primarily of fur and animal pelts.
          This outfit grants a +5 circumstance bonus on Fortitude saving throws
          against exposure to cold weather.
      price: 8
      slot: body
      subType: clothing
      weight:
        value: 7
    type: equipment
  - _id: 2eVjj3OgiBz8iUbY
    _key: '!actors.items!If2hjs4hEuT4fmUq.2eVjj3OgiBz8iUbY'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-layered-purple.webp
    name: Outfit, Courtesan's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          20</p><p><strong>Price</strong> 8 gp; <strong>Weight</strong> 4
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This outfit includes fine silk or
          satin garments tailored to complement your figure. In addition, the
          outfit contains a loose shawl or robe with several discreet pockets
          for items such as perfume, massage oils, or even a small dagger.
      price: 8
      slot: body
      subType: clothing
      weight:
        value: 4
    type: equipment
  - _id: 8cBNQrL6yG84D64c
    _key: '!actors.items!If2hjs4hEuT4fmUq.8cBNQrL6yG84D64c'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-layered-purple.webp
    name: Outfit, Courtier's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This outfit includes tailored clothes
          in whatever fashion happens to be current in noble courts of that
          region. Anyone trying to influence nobles or courtiers while wearing
          street dress will have a hard time of it (-2 penalty on Charisma-based
          skill checks to influence such individuals). If you wear this outfit
          without jewelry (costing an additional 50 gp), you look like an
          out-of-place commoner.
      price: 30
      slot: body
      subType: clothing
      weight:
        value: 6
    type: equipment
  - _id: cyQSUfp4L4x8WGwk
    _key: '!actors.items!If2hjs4hEuT4fmUq.cyQSUfp4L4x8WGwk'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/vest-leather-brown-gold.webp
    name: Outfit, Dilettante's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          36</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These clothes are favored by gnome
          inventors and wanderers, and consist of sturdy boots, a pair of stout
          linen pants or skirt, a cloth shirt, leather gloves, a hat and cloak,
          and numerous belts, straps, and accessories (such as scarves, a vest,
          bits of rope or twine, and bandoleers). These items are generally
          mismatched, each having been selected as "superior" from some other
          set of clothing, and are rife with pockets and small hidey-holes. It
          the wearer a +2 circumstance bonus on Sleight of Hand checks made to
          conceal a small object on her body.
      price: 20
      slot: body
      subType: clothing
      weight:
        value: 8
    type: equipment
  - _id: OSK08bynmUEHJ9z1
    _key: '!actors.items!If2hjs4hEuT4fmUq.OSK08bynmUEHJ9z1'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/coat-collared-red-gold.webp
    name: Outfit, Entertainer's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Price</strong>  3 gp;
          <strong>Weight</strong>  4 lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This set of flashy-perhaps even gaudy-
          clothes is meant for entertaining. Entertainer's outfits come in a
          wide range of styles, from scandalous to flattering to absurd. While
          the outfit looks whimsical, its practical design does nothing to
          inhibit your ability to tumble, dance, walk a tightrope, or run (if
          the audience turns ugly).
      price: 3
      slot: body
      subType: clothing
      weight:
        value: 4
    type: equipment
  - _id: NOMFU4A0uiaKtfsq
    _key: '!actors.items!If2hjs4hEuT4fmUq.NOMFU4A0uiaKtfsq'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/breastplate-scale-grey.webp
    name: Outfit, Executioner's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          20</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong> 8
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Typically worn by jailers or
          executioners, this outfit includes a black woolen shirt, a tunic,
          pants, a belt, sturdy boots, a balaclava or hood, and a great cloak.
          This outfit is generally too intimidating and macabre to be worn in
          polite company. Some executioner's outfits prominently bear the symbol
          of the government or lawenforcing institution the wearer serves, while
          others are left ragged and stained to appear all the more threatening.
      price: 5
      slot: body
      subType: clothing
      weight:
        value: 8
    type: equipment
  - _id: EHJKOzGgrbctAK3e
    _key: '!actors.items!If2hjs4hEuT4fmUq.EHJKOzGgrbctAK3e'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/breastplate-layered-leather-studded-brown.webp
    name: Outfit, Explorer's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This set of clothes is for someone who
          never knows what to expect. It includes sturdy boots, leather breeches
          or a skirt, a belt, a shirt (perhaps with a vest or jacket), gloves,
          and a cloak. Rather than a leather skirt, a leather overtunic may be
          worn over a cloth skirt. The clothes have plenty of pockets
          (especially the cloak). The outfit also includes any extra accessories
          you might need, such as a scarf or a wide-brimmed hat.
      price: 10
      slot: body
      subType: clothing
      weight:
        value: 8
    type: equipment
  - _id: nHpbNI1Ng5xT0uvJ
    _key: '!actors.items!If2hjs4hEuT4fmUq.nHpbNI1Ng5xT0uvJ'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/breastplate-rivited-red.webp
    name: Outfit, Flame-retardant
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          243</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Constructed to resist the effects of
          hot environments (such as forest fires and areas of volcanic
          activity), this set of overlapping, heavy leather clothing includes a
          pair of fire-resistant boots. The outfit grants fire resistance 1, but
          exposure to fire damage ruins the outfit after 20 rounds.
      price: 50
      slot: body
      subType: clothing
      weight:
        value: 10
    type: equipment
  - _id: 7xAacLeVjkAEYsQ1
    _key: '!actors.items!If2hjs4hEuT4fmUq.7xAacLeVjkAEYsQ1'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/vest-leather-pink.webp
    name: Outfit, Hot weather
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Adventurer's Armory pg. 19</em>, <em>Advanced Player's Guide pg.
          185</p><p><strong>Price</strong>  8 gp; <strong>Weight</strong>  4
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Covering your body from head to foot
          in light, airy cloth keeps you cooler than baring your skin to the
          sun. This outfit typically consists of a loose linen robe and either a
          turban or loose head covering and veil. The outfit provides a +2 bonus
          on Fortitude saves to resist warm or hot weather. This does not stack
          with any bonuses gained from the Survival skill.
      price: 8
      slot: body
      subType: clothing
      weight:
        value: 4
    type: equipment
  - _id: csb9q7C3B8DDm5dM
    _key: '!actors.items!If2hjs4hEuT4fmUq.csb9q7C3B8DDm5dM'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/hand/glove-tooled-leather-brown.webp
    name: Outfit, Monk's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Price</strong>  5 gp;
          <strong>Weight</strong>  2 lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This simple outfit includes sandals,
          loose breeches, and a loose shirt, and is bound together with sashes.
          The outfit is designed to give you maximum mobility, and it's made of
          high-quality fabric. You can conceal small weapons in pockets hidden
          in the folds, and the sashes are strong enough to serve as short
          ropes.
      price: 5
      slot: body
      subType: clothing
      weight:
        value: 2
    type: equipment
  - _id: a2qa6AbCbY57N0MV
    _key: '!actors.items!If2hjs4hEuT4fmUq.a2qa6AbCbY57N0MV'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-layered-red.webp
    name: Outfit, Noble's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These clothes are designed
          specifically to be expensive and gaudy, letting everyone know exactly
          how expensive they are. Precious metals and gems are worked into the
          clothing, along with elaborate embroidery, and some outfits may
          contain impractical concessions to high fashion. A would-be noble also
          needs a signet ring and jewelry (worth at least 100 gp) to accessorize
          this outfit.
      price: 75
      slot: body
      subType: clothing
      weight:
        value: 10
    type: equipment
  - _id: xJDSPyEu1kXf1U1Z
    _key: '!actors.items!If2hjs4hEuT4fmUq.xJDSPyEu1kXf1U1Z'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/shirt-collared-brown.webp
    name: Outfit, Peasant's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Price</strong>  1 sp;
          <strong>Weight</strong>  2 lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These clothes are of poor quality, the
          fabric little more than sack cloth, often patched and mended many
          times over. A peasant's outfit consists of a loose shirt and baggy
          breeches, or a loose shirt and skirt or overdress. Cloth wrappings are
          used for shoes, causing significantly more wear on the feet.
      price: 0.1
      slot: body
      subType: clothing
      weight:
        value: 2
    type: equipment
  - _id: YdxXogKW6HNRluzT
    _key: '!actors.items!If2hjs4hEuT4fmUq.YdxXogKW6HNRluzT'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/shirt-simple-grey.webp
    name: Outfit, Pickpocket's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong>  5 gp;
          <strong>Weight</strong>  3 lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Outfitted with concealed pockets, this
          clothing gives you a +2 bonus when hiding small objects on your
          person.
      price: 5
      slot: body
      subType: clothing
      weight:
        value: 3
    type: equipment
  - _id: gE8N4r92f2N0KgFh
    _key: '!actors.items!If2hjs4hEuT4fmUq.gE8N4r92f2N0KgFh'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-layered-red.webp
    name: Outfit, Royal
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Royal clothes are ostentatious, with
          gems, gold, silk, and fur in abundance. A royal outfit is rarely
          designed for regular wear or inclement weather-or even for donning
          unaided-as it's presumed that anyone who might be wearing it has
          plenty of servants to take care of his or her every need. This outfit
          includes only the clothing, not a royal scepter, crown, ring, or other
          regal accoutrements.
      price: 200
      slot: body
      subType: clothing
      weight:
        value: 15
    type: equipment
  - _id: LcTfi58W13yCGpjF
    _key: '!actors.items!If2hjs4hEuT4fmUq.LcTfi58W13yCGpjF'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-collared-blue.webp
    name: Outfit, Scholar's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Price</strong>  5 gp;
          <strong>Weight</strong>  6 lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Perfect for a scholar, this outfit
          includes a robe, a belt, a cap, soft shoes, and possibly a cloak.
      price: 5
      slot: body
      subType: clothing
      weight:
        value: 6
    type: equipment
  - _id: Q7nFD5ciuzYlTIMS
    _key: '!actors.items!If2hjs4hEuT4fmUq.Q7nFD5ciuzYlTIMS'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/breastplate-layered-leather-studded.webp
    name: Outfit, Squire's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          20</p><p><strong>Price</strong> 5 gp; <strong>Weight</strong> 8
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This outfit includes heavy woolen
          pants, a tunic, leather boots, a belt, sturdy gloves, a cap, and a
          heavy tabard bearing the colors or sigil of a noble house or
          organization. Many organizations provide new squires this outfit for
          free, with the expectation they wear it during their duties.
      price: 5
      slot: body
      subType: clothing
      weight:
        value: 8
    type: equipment
  - _id: ijvm9peEiEN5vhAt
    _key: '!actors.items!If2hjs4hEuT4fmUq.ijvm9peEiEN5vhAt'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/hood-simple-leather-brown.webp
    name: Outfit, Traveler's
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Price</strong>  1 gp;
          <strong>Weight</strong>  5 lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This set of clothes consists of boots,
          a wool skirt or breeches, a sturdy belt, a shirt (perhaps with a vest
          or jacket), and an ample cloak with a hood.
      price: 1
      slot: body
      subType: clothing
      weight:
        value: 5
    type: equipment
  - _id: 7ilQWGz1D6rkyBa8
    _key: '!actors.items!If2hjs4hEuT4fmUq.7ilQWGz1D6rkyBa8'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/back/cloak-layered-red-orange.webp
    name: Patchwork cloak
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  5 gp; <strong>Weight</strong>  1/2
          lb.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These cloaks are popular among
          traveling bards, and each patchwork cloak is unique. The patches
          represent where the traveler has been, and often the performer uses
          them to recall specific stories from his repertoire. When a bard
          retires or dies, he often bequeaths his cloak to a young entertainer
          he mentored or admired.
      price: 5
      slot: shoulders
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: W1xkRiYsQsFZkB1l
    _key: '!actors.items!If2hjs4hEuT4fmUq.W1xkRiYsQsFZkB1l'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/back/cloak-hooeded-blue.webp
    name: Pirate clothes
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  5 sp; <strong>Weight</strong>  2
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This circle of water-resistant fabric
          (typically wool or leather) has a hooded opening in the center, making
          it easy to slip it on or off and protecting your entire body from rain
          or snow.
      price: 0.5
      slot: shoulders
      subType: clothing
      weight:
        value: 2
    type: equipment
  - _id: EHCTvF6Y3GLO0Zh2
    _key: '!actors.items!If2hjs4hEuT4fmUq.EHCTvF6Y3GLO0Zh2'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/back/cloak-collared-orange.webp
    name: Reversible cloak
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  2 sp-100 gp; <strong>Weight</strong> 
          1 lb.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This cloak has an outer layer of
          fabric and an inner layer of a different color. They are worn for the
          sake of fashion, in theater performances, or to aid a quick appearance
          change as part of a disguise. The price varies depending on the
          cloak's quality, with the low end being a simple linen cloak and the
          high end being made of silk or decorated with fur trim.
      slot: shoulders
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: GzuDTXT6CZxPpvNj
    _key: '!actors.items!If2hjs4hEuT4fmUq.GzuDTXT6CZxPpvNj'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/back/cloak-collared-blue-iron.webp
    name: Scarf
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Adventurer's Armory pg. 19</em>, <em>Varisia, Birthplace of
          Legends pg. 15</p><p><strong>Price</strong>  1 sp-5 gp;
          <strong>Weight</strong>  1/2 lb.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Entertainers often employ seductive
          garb and entrancing props in their performances. Scarves of colorful
          cloth or transparent silk, often embroidered with elaborate scenes or
          motifs, are favorite accessories.
      slot: neck
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: jYAimWdq1BHFVVIr
    _key: '!actors.items!If2hjs4hEuT4fmUq.jYAimWdq1BHFVVIr'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-layered-blue.webp
    name: Scarf (pocketed)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          28</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This close-fitting bodysuit of soft,
          dark fabric is favored by ninja and assassins. When worn, it grants a
          +2 circumstance bonus on Stealth checks. Wearing armor with a base
          armor bonus higher than +1 negates this bonus, as does additional
          heavy clothing or equipment worn under the shinobi shozoku (at the
          GM's discretion).
      price: 50
      slot: chest
      subType: clothing
      weight:
        value: 2
    type: equipment
  - _id: cg9YLc5yCK8gWr9W
    _key: '!actors.items!If2hjs4hEuT4fmUq.cg9YLc5yCK8gWr9W'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-layered-purple.webp
    name: Silk kimono
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          28</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This exquisite silken garment is
          vitally important formal wear for certain social roles in many Tian
          cultures, including Minkai. Properly donning a kimono requires
          assistance and a successful DC 15 Knowledge (nobility) check. When
          dealing with Minkaians or others familiar with the cultural
          significance of this garment, a properly worn kimono grants a +2
          circumstance bonus on Diplomacy checks, as well as on Disguise checks
          made to appear as a geisha, noble, or other high standing member of
          Minkai society.
      price: 200
      slot: chest
      subType: clothing
      weight:
        value: 5
    type: equipment
  - _id: 5Ocz3XWhcboV9vAh
    _key: '!actors.items!If2hjs4hEuT4fmUq.5Ocz3XWhcboV9vAh'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/shoes-rounded-pink.webp
    name: Skates
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  5 gp; <strong>Weight</strong>  20
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Each ski is a flat piece of wood about
          5-6 feet long for a Medium wearer, curled up slightly at the front
          end, with lengthwise grooves along the underside and a wooden or metal
          bracket with laces on top for holding the wearer's boot in place.
          Wearing skis allows you to move on snow and ice at normal speed, but
          your movement is reduced to 5 feet on all other terrain. You normally
          use a pair of spiked poles to help you move and maintain balance while
          skiing, but javelins, shortspears, or even trimmed-down saplings will
          do if nothing else more suitable is available. Donning or removing a
          ski is a full-round action, though the laces can be cut as a move
          action (which requires repairing or replacing the laces if you want to
          use the skis again).
      price: 5
      slot: feet
      subType: clothing
      weight:
        value: 20
    type: equipment
  - _id: KWpDajkzscI3e9Xp
    _key: '!actors.items!If2hjs4hEuT4fmUq.KWpDajkzscI3e9Xp'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/boots-leather-simple-furred.webp
    name: Snow goggles
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Pathfinder #51: The Hungry Storm pg. 67</em>, <em>Adventurer's
          Armory pg. 19</em>, <em>Advanced Player's Guide pg.
          185</p><p><strong>Price</strong>  5 gp; <strong>Weight</strong>  4
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These high-tension nets of rope or
          sinew in wooden frames are lashed to the feet to spread your weight
          across the snow, making you much less likely to break through the
          crust and rendering walking much easier. Snowshoes reduce the penalty
          for walking through heavy snow by 50%; for example, if moving through
          snow normally costs you 2 squares of movement (1 square plus a 1
          square penalty) per square traveled, snowshoes reduce this cost to 1.5
          squares per square traveled. Snowshoes may supplement another outfit.
      price: 5
      slot: feet
      subType: clothing
      weight:
        value: 4
    type: equipment
  - _id: 1a4mEHpAZtr0MEvY
    _key: '!actors.items!If2hjs4hEuT4fmUq.1a4mEHpAZtr0MEvY'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/boots-leather-furred.webp
    name: Softpaw boots
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          93</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These soft and subtle boots are
          constructed of silk and specially cured leather. They are specially
          designed for catfolk feet. They work with the feline structure of the
          race's feet to soften footfalls and to reduce the imprints of their
          tracks. While wearing softpaw boots, a catfolk gains a +1 circumstance
          bonus on Stealth checks. Furthermore, the DC to notice or follow the
          tracks of a catfolk wearing softpaw boots increases by +2.
      price: 25
      slot: feet
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: oS751xO0z9AW5wQ4
    _key: '!actors.items!If2hjs4hEuT4fmUq.oS751xO0z9AW5wQ4'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/breastplate-layered-leather-studded-brown.webp
    name: Sparring gear
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          20</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This array of thick, heavily lined
          pads, including a quilted helmet, rigid shin guards, and a wraparound
          rib guard, protects you during hand-to-hand training. Sparring gear
          cannot be worn with armor, but grants DR 2/- against nonlethal damage.
          Fighting schools often customize their sparring gear to feature
          prestigious colors or symbols.
      price: 35
      slot: body
      subType: clothing
      weight:
        value: 15
    type: equipment
  - _id: y6FVP0yEDUE1bAiO
    _key: '!actors.items!If2hjs4hEuT4fmUq.y6FVP0yEDUE1bAiO'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/wrist/bracer-shadow.webp
    name: Speed sheath
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          244</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This sheath is designed to be strapped
          around your forearm, but it is too bulky to be hidden under a long
          sleeve. It can hold one forearm-length item, such as a dagger, dart,
          potion, scroll containing a single spell, or wand. As a swift action,
          you can bend your wrist to cause the sheathed item to drop into your
          hand (provoking attacks of opportunity as normal for retrieving an
          item). Placing an item in the sheath is a full-round action that
          provokes attacks of opportunity. You can wear only one wrist sheath
          per arm that you have.
      price: 10
      slot: wrists
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: 8FFQMgk5c2nkyktu
    _key: '!actors.items!If2hjs4hEuT4fmUq.8FFQMgk5c2nkyktu'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/robe-layered-purple.webp
    name: Spiritual leader's vestments
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Disciple's Doctrine pg.
          28</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These fine garments come in assorted
          vibrant colors and are used in the most important religious or
          spiritual ceremonies. The vestments typically include a robe or cloak
          embroidered with a religion's holy symbol, as well as a number of
          extravagant accessories, such as fine jewelry, long sashes, tall hats,
          and other appropriate attire.
      price: 100
      slot: chest
      subType: clothing
      weight:
        value: 8
    type: equipment
  - _id: X2WIA58AiW5HddqC
    _key: '!actors.items!If2hjs4hEuT4fmUq.X2WIA58AiW5HddqC'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/breastplate-scale-leather.webp
    name: Sponge suit
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Blood of the Sea pg.
          19</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Outwardly, this suit of clothing
          appears to be an ordinary traveler's outfit, albeit cut from
          thicker-thannormal cloth. The suit's inner lining is made of dozens of
          thin, flexible sponges. When soaked with water, these sponges can be
          worn against the skin to maintain the wearer's moisture while
          traveling out of the water.</p><p>It takes 10 minutes to fully
          saturate the suit, which increases its weight from 2 pounds to 10
          pounds.</p><p>When worn, a sponge suit doubles the amount of time a
          water-dependent creature can spend on dry land before it begins to
          take damage or suffer other negative effects. When the sponges dry,
          wearers must submerge themselves in water or resaturate the suit, or
          else they suffer the consequences of being on dry land.
      price: 30
      slot: body
      subType: clothing
      weight:
        value: 2
    type: equipment
  - _id: bDiOK9TsOFzzefby
    _key: '!actors.items!If2hjs4hEuT4fmUq.bDiOK9TsOFzzefby'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/boots-collared-red.webp
    name: Stiletto boots
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory 2 pg.
          20</p><p><strong>Category</strong> Clothing</p><h2>Description</h2>The
          most ostentatious and impractical of footwear, the tall heel attached
          to these boots adds several inches to your height. This type of boot
          is popular among Chelish nobles, though the trend has recently caught
          on among some members of Taldan courts. You can use the heel of a
          stiletto boot as an improvised weapon, dealing damage as a punching
          dagger
      price: 10
      slot: feet
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: iGHb0jWFBGWREC2N
    _key: '!actors.items!If2hjs4hEuT4fmUq.iGHb0jWFBGWREC2N'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/materials/bowl-powder-blue.webp
    name: Straitjacket
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Guide pg.
          15</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Made from ground antimony, this sooty
          cosmetic is used to line the eyes. It grants the wearer a +2
          circumstance bonus on saves against light-based effects that would
          dazzle or blind him for 8 hours. A container of kohl holds 10
          applications.
      price: 10
      subType: clothing
    type: equipment
  - _id: AB30Fb0m41fL6PPQ
    _key: '!actors.items!If2hjs4hEuT4fmUq.AB30Fb0m41fL6PPQ'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/back/cloak-plain-white.webp
    name: Tabard
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          89</p><p><strong>Price</strong>  5 gp; <strong>Weight</strong>  1
          lb.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Often worn over armor, this outer
          garment is usually sleeveless and open at the sides. The broad front
          provides a canvas for insignias and coats of arms, making a wearer's
          membership in an order readily apparent.
      price: 5
      slot: chest
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: 0q7vneFcw9AdaT77
    _key: '!actors.items!If2hjs4hEuT4fmUq.0q7vneFcw9AdaT77'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/cloth/cloth-patterned-pink.webp
    name: Tear-away clothing
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong>  +5 gp;
          <strong>Weight</strong>  -</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Sneaks and thieves know the value of a
          good disguise. The ability to remove that disguise in a hurry, thus
          revealing the next layer of disguise, is nearly as valuable. Tear-away
          clothing is generally loose fitting and allows another layer of
          clothing to be worn underneath. The seams on this clothing are
          designed to break easily, making it a simple matter (a standard
          action) to remove these items and walk away with none the wiser. Any
          outfit can be crafted as tear-away clothing for an additional price.
      price: 5
      subType: clothing
    type: equipment
  - _id: dwHVkM45NfYVcLov
    _key: '!actors.items!If2hjs4hEuT4fmUq.dwHVkM45NfYVcLov'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/shoes-simple-leaf-green.webp
    name: Track-obscuring soles
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the Wild pg.
          9</p><p><strong>Price</strong> 8 gp; <strong>Weight</strong> 1/2
          lb.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These boot attachments consist of wide
          wooden frames, leather straps, and thin leather soles with no
          distinguishing marks or texture. They distribute your weight over a
          larger area and obscure the shape of your footprints. The DC to track
          you increases by 2, but you also take a -2 penalty on Acrobatics and
          Stealth checks.
      price: 8
      slot: feet
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: vpuEWrd40B8S8PnD
    _key: '!actors.items!If2hjs4hEuT4fmUq.vpuEWrd40B8S8PnD'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/hood-ringed-leather-red.webp
    name: Veil
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Heroes of the High Court pg. 28</em>,
          <em>People of the Sands pg. 29</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Whether made of sheer gauze or thicker
          material, a veil is useful for hiding one's facial expressions. While
          worn, a veil grants a +2 circumstance bonus on Bluff checks; however,
          the wearer treats all other creatures as having concealment. The
          wearer has a 50% chance to avoid gaze attacks, as if averting his
          eyes.
      price: 40
      subType: clothing
    type: equipment
  - _id: FLBM3xdo0JJZAmVp
    _key: '!actors.items!If2hjs4hEuT4fmUq.FLBM3xdo0JJZAmVp'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/vest-leather-brown.webp
    name: Vest
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Adventurer's Armory pg.
          19</p><p><strong>Price</strong> 1 sp-50 gp; <strong>Weight</strong>
          1/2 lb.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Much like hats, vests appear in almost
          all cultures. Though the basic design remains the same, they vary
          wildly in cut, color, and function. The difference between the court
          vests of Taldor and the dancing vests of Varisia is quite striking.
      slot: chest
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: IgQNy6mFm8eml652
    _key: '!actors.items!If2hjs4hEuT4fmUq.IgQNy6mFm8eml652'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/feet/shoes-rounded-leather-blue.webp
    name: Wading boots
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Wilderness pg.
          245</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>These waterproof boots are felt lined
          and have a thin layer of metal around the soles. The top of each boot
          ends just before the knee, with a cord for tying the top shut over
          clothing or exposed skin. These boots assist in prolonged hikes
          through deep mud or shallow pools, granting the wearer a +1
          circumstance bonus on Profession (fisher) checks while fishing in
          shallow water.
      price: 50
      slot: feet
      subType: clothing
      weight:
        value: 2
    type: equipment
  - _id: BgXof08FfpdPqlFF
    _key: '!actors.items!If2hjs4hEuT4fmUq.BgXof08FfpdPqlFF'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/chest/coat-leather-blue.webp
    name: Wet suit
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Aquatic Adventures pg.
          57</p><p><strong>Price</strong> 8 gp; <strong>Weight</strong> 4
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This relatively aquadynamic wet suit
          is designed for surface-dwellers exploring the deeps, with waterproof
          pockets to help keep important items dry.
      price: 8
      slot: body
      subType: clothing
      weight:
        value: 4
    type: equipment
  - _id: iRNQ8ph7giLVgtfw
    _key: '!actors.items!If2hjs4hEuT4fmUq.iRNQ8ph7giLVgtfw'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/head/crown-feather-brown.webp
    name: Wig
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 89</em>,
          <em>Adventurer's Armory pg. 19</p><p><strong>Price</strong>  5 gp-500
          gp; <strong>Weight</strong>  1/2 lb.-4
          lbs.</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>False hair comes in many forms, from
          the severe coif of a judge to the towering confection adorning a noble
          to the simple curls worn by a housewife whose hair is thinning. Wigs
          can be found for sale in any major city and can be special-ordered in
          most towns. As they are usually made of hair, the available colors are
          likely limited by the locally predominant hair color, but others can
          be obtained by applying dye.
      slot: head
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: XwgxbMgbmLwTQmrX
    _key: '!actors.items!If2hjs4hEuT4fmUq.XwgxbMgbmLwTQmrX'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/back/cloak-layered-white.webp
    name: Wing cloak
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Advanced Race Guide pg.
          159</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>This strange piece of equipment only
          works for sylphs and similar creatures, whose light, airy bodies can
          be borne upon the winds. Looking like a fine silk traveler's cloak, a
          wing cloak is secretly reinforced with a series of wooden struts that,
          when locked into place, stretch the cloak's fabric into a rudimentary
          wing. Arranging the struts into a wing or reversing the change is a
          move action. When the cloak is shaped into a wing, the wearer can make
          a DC 15 Fly check to fall safely from any height without taking
          falling damage, as if using <em>feather fall</em>. When falling, the
          wearer may make an additional DC 15 Fly check to glide, moving 5 feet
          laterally for every 20 feet she falls. Readying and using a wing cloak
          requires two hands and provokes an attack of opportunity. A wing cloak
          has hardness 0 and 5 hit points. If the wing cloak is broken, the Fly
          DCs to use it increase by +10.
      price: 1200
      slot: shoulders
      subType: clothing
      weight:
        value: 1
    type: equipment
  - _id: zYaW0C4UKKx6y8YR
    _key: '!actors.items!If2hjs4hEuT4fmUq.zYaW0C4UKKx6y8YR'
    _stats:
      coreVersion: '12.331'
    img: icons/equipment/hand/glove-tooled-leather-brown.webp
    name: Wrangler's gloves
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Monster Hunter's Handbook pg.
          27</p><p><strong>Category</strong>
          Clothing</p><h2>Description</h2>Fine plates of articulated steel
          reinforce these elbow-length leather gloves, which are designed to
          allow animal handlers and animal hunters alike to confront beasts with
          natural defenses like spines and quills. While wearing the gloves, you
          gain DR 2/magic against attacks of opportunity provoked when you
          attempt a combat maneuver check to grapple a creature. You also gain
          this damage reduction and a +1 circumstance bonus on Reflex saves
          against defensive abilities that deal damage when you strike a
          creature with a nonreach weapon, unarmed strike, or natural attack.
          The thick gloves restrict your movement, imposing a -2 penalty on
          precision-based skill checks that involve your hands (such as using
          Disable Device to pick a lock)
      price: 20
      slot: hands
      subType: clothing
      weight:
        value: 6
    type: equipment
name: Tailor
