    img: icons/tools/nautical/steering-wheel.webp
    name: Vehicle, Warship
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg. 87</em>, <em>PRPG
          Core Rulebook pg. 159</p><p><strong>Price</strong> 25,000 gp;
          <strong>Price of Passage (per mile)</strong> 2
          sp</p><p><strong>Category</strong> Transport,
          Sea</p><h2>Description</h2>This 100-foot-long ship has a single mast,
          although oars can also propel it. It has a crew of 60 to 80 rowers.
          This ship can carry 160 soldiers, but not for long distances, since
          there isn't room for supplies to support that many people. A warship
          cannot make sea voyages and sticks to the coast. It is not used for
          cargo. It moves about 2-1/2 miles per hour when being rowed or under
          sail.
      equipped: false
      flags:
        dictionary:
          Category: Transport, Sea
      price: 25000
    type: loot
  - _id: RFGtxH1LQpqZcpjB
    _key: '!actors.items!fdJw1p5t3BBDipZW.RFGtxH1LQpqZcpjB'
    _stats:
      coreVersion: '12.331'
    img: icons/environment/settlement/watchtower-stone.webp
    name: Vehicle, Wind platform
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Dragonslayer's Handbook pg.
          27</p><p><strong>Category</strong> Transport,
          Air</p><h2>Description</h2>A rare and dangerous marvel from the
          strange nation of Alkenstar, this light, airborne device is held aloft
          by a huge buoyant balloon which is attached by chains to an open-air
          wicker basket.</p><p>A wind platform is socalled because it remains at
          the mercy of the winds, as it has no propulsion system of its own and
          can therefor not be used as much more than an airborne watchtower or
          platform for the deployment of siege engines.</p><p> The basket of a
          wind platform can hold as many as six Medium creatures and two Large
          direct-fire siege engines, or any combination of smaller creatures and
          siege engines occupying the same space. The platform cannot withstand
          a carried weight of more than 3,000 lbs.</p><p>A wind platform has AC
          4, harness 5, and 250 hp, and takes double damage from acid and fire
          attacks. When reduced to half its total hit points (125 hp) the
          platform begins to descend at a rate of 20 ft. per round. When reduced
          to one-quarter its total hit points (62 hp), the rate of descent
          increases to 60 ft. per round. When destroyed, all creatures and items
          on the wind platform simply fall as normal.
      equipped: false
      flags:
        dictionary:
          Category: Transport, Air
      price: 5000
      weight:
        value: 1600
    type: loot
name: Vehicles
