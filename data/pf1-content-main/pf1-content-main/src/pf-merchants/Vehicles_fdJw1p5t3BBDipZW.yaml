items:
  - _id: mgzusfz2wOmDqDJR
    _key: '!actors.items!fdJw1p5t3BBDipZW.mgzusfz2wOmDqDJR'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/wood-wheel-brown.webp
    name: Vehicle, Caravan master's wagon
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Villain Codex pg.
          116</p><p><strong>Price</strong> 1,000 gp; <strong>Price of Passage
          (per mile)</strong> -</p><p><strong>Category</strong> Transport,
          Land</p><h2>Description</h2>The caravan master's wagon is similar in
          most respects to a high-quality heavy smuggler's wagon (see below),
          but it additionally allows for a hidden <em>portable hole</em> (price
          not included above) secreted within in it. The <em>portable hole</em>
          rests upon the surface of the wagon bed, with a second layer of wooden
          planks laid atop it and fastened into place with nuts and bolts so
          they appear to be a normal part of the wagon. Thus the <em>portable
          hole</em> sits between the layers of wood like a thin cut of meat
          between two slices of bread. Those who know about the <em>portable
          hole</em> can fill it with illicit goods and then fasten the second
          layer of decking in place and load normal cargo atop it. The wagon
          weighs no more than it should. This setup allows for the transport of
          live cargo (rendered suitably silent or unconscious, if necessary), as
          the planks atop the opening of the portable hole are spaced just far
          enough apart to allow in breathable air, if the smugglers leave the
          hole open and attached. Unless someone knows what to look for, a
          successful DC 30 Perception check is necessary to discover the hidden
          second layer.
      equipped: false
      flags:
        dictionary:
          Category: Transport, Land
      price: 1000
    type: loot
  - _id: n6LI2kDeSHZMO54r
    _key: '!actors.items!fdJw1p5t3BBDipZW.n6LI2kDeSHZMO54r'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/wood-wheel-brown.webp
    name: Vehicle, Carriage
    system:
      description:
        value: >-
          <p><strong>Source</strong>: PRPG Core Rulebook pg.
          159</p><p><strong>Price</strong> 20 gp; <strong>Price of Passage (per
          mile)</strong> -</p><p><strong>Category</strong> Transport,
          Land</p><h2>Description</h2>This is a wagon on runners for snow and
          ice travel. In general, two horses (or other beasts of burden) draw
          it. A sled comes with the harness needed to pull it.
      equipped: false
      flags:
        dictionary:
          Category: Transport, Land
      price: 20
    type: loot
  - _id: ufbJnGbPeZqiiKBQ
    _key: '!actors.items!fdJw1p5t3BBDipZW.ufbJnGbPeZqiiKBQ'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/wood-wheel-brown.webp
    name: Vehicle, Sleigh
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Villain Codex pg.
          116</p><p><strong>Price</strong> varies; <strong>Price of Passage (per
          mile)</strong> varies</p><p><strong>Category</strong> Transport,
          Land</p><h2>Description</h2>A smuggler's wagon functions in most
          respects exactly like an ordinary wagon (<em>Pathfinder RPG Ultimate
          Equipment</em> 87), except it contains hidden compartments that allow
          for cargo to be transported in secret. The price of a smuggler's wagon
          depends on two factors-the size or type of the original wagon, and the
          skill with which the hidden compartments have been constructed. The
          table below details the prices of such a vehicle (the numbers in
          parentheses indicate the DC for a Perception check to successfully
          locate the hidden compartments during a search of the wagon).</p><p>
          <table class="inner"> <tr><td colspace="4"><strong>Concealment
          Quality</strong></td></tr>
          <tr><td><strong>Size</strong></td><td><strong>Low
          (15)</strong></td><td><strong>Med. (20)</strong></td><td><strong>High
          (25)</strong></td></tr> <tr><td>Light</td><td>75 gp</td><td>100
          gp</td><td>150 gp</td></tr> <tr><td>Medium</td><td>115 gp</td><td>150
          gp</td><td>225 gp</td></tr> <tr><td>Heavy</td><td>150 gp</td><td>200
          gp</td><td>300 gp</td></tr></table> </p><p> Compartments can be
          located throughout the wagon, in such places as a hollowed-out axle,
          beneath the seats, between panels on the floor decking, and so forth.
          The total amount of weight the wagon and its draft animals can
          accommodate remains the same as the original variety of wagon.
      equipped: false
      flags:
        dictionary:
          Category: Transport, Land
    type: loot
  - _id: TkVBipF8bKHil7Gy
    _key: '!actors.items!fdJw1p5t3BBDipZW.TkVBipF8bKHil7Gy'
    _stats:
      coreVersion: '12.331'
    img: icons/commodities/wood/wood-wheel-brown.webp
    name: Vehicle, Wagon (heavy)
    system:
      description:
        value: >-
          <p><strong>Source</strong>: Ultimate Equipment pg.
          87</p><p><strong>Price</strong> 100 gp (heavy), 50 gp (light), 75 gp
          (medium); <strong>Weight</strong> 3 cp (heavy), 2 cp (light), 2 cp
          (medium)</p><h2>Description</h2>This four-wheeled open vehicle is used
          for transporting heavy loads. It includes the harness needed to pull
          it. There are three common varieties of wagon.</p><p><em>Light
          Wagon</em>: Wagons of this type are most commonly employed by farmers
          and craftsmen transporting their goods short distances or by venders
          in and around cities. A light wagon carries up to 1,000 pounds of
          cargo and requires two Medium creatures or one Large creature to pull
          it.</p><p><em>Medium Wagon</em>: Wagons of this type are typically
          employed for heavy duty work, often in agricultural, mining, or
          construction settings. A medium wagon can carry up to 2,000 pounds of
          cargo and requires four Medium or two Large creatures to pull
          it.</p><p><em>Heavy Wagon</em>: Wagons of this type are large,
          fourwheeled vehicles primarily used in caravans to transport goods
          over long stretches of territory. A heavy wagon carries up to 4,000
          pounds of cargo, and is pulled by either eight Medium creatures or
          four Large creatures.
      equipped: false
      flags:
        dictionary:
          Category: Transport, Land
      price: 100
    type: loot
