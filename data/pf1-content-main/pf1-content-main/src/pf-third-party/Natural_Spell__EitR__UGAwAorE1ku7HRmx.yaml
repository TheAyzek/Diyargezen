name: Natural Spell (EitR)
system:
  description:
    value: >-
      <p><em>You can cast spells even while transformed.</em></p><p>Wis 13,
      change shape or wild shape class feature.</p><p><strong>Benefits</strong>:
      You can complete the verbal and somatic components of spells while using
      change shape or wild shape. You substitute various noises and gestures for
      the normal verbal and somatic components of a spell.</p><p>You can also
      use any material components or focuses you possess, even if such items are
      melded within your current form. This feat does not permit the use of
      magic items while you are in a form that could not ordinarily use them,
      and you do not gain the ability to speak while using change shape or wild
      shape.</p>
  sources:
