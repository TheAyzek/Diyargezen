name: Weapon Proficiency (EitR)
system:
  description:
    value: >-
      <p><em>Choose&nbsp; one&nbsp; weapon&nbsp; group&nbsp; listed&nbsp;
      under&nbsp; the&nbsp; fighter&rsquo;s&nbsp; Weapon&nbsp; Training&nbsp;
      class&nbsp; feature.&nbsp; You&nbsp; understand&nbsp; how&nbsp; to&nbsp;
      use all weapons from that group.</em></p><p><strong>Benefits</strong>:
      You&nbsp; make&nbsp; attack&nbsp; rolls&nbsp; with&nbsp; weapons&nbsp;
      from&nbsp; the selected group normally (without the non-proficient
      penalty).</p><p><strong>Normal</strong>: When&nbsp; using&nbsp; a&nbsp;
      weapon&nbsp; with&nbsp; which&nbsp; you&nbsp; are&nbsp; not proficient,
      you take a &ndash;4 penalty on attack
      rolls.</p><p><strong>Special</strong>: You&nbsp; can&nbsp; gain&nbsp;
      Weapon&nbsp; Proficiency&nbsp; multiple&nbsp; times.&nbsp; Each&nbsp;
      time&nbsp; you&nbsp; take&nbsp; the&nbsp; feat,&nbsp; it&nbsp;
      applies&nbsp; to&nbsp; a&nbsp; new&nbsp; weapon group.</p>
