name: Deflect Arrows (EitR)
system:
  description:
    value: >-
      <p><em>You can knock arrows and other projectiles off course, preventing
      them from hitting you.</em></p><p>Dex 13, Unarmed Combatant or Shield
      Focus.</p><p><strong>Benefits</strong>: Once per round when you would
      normally be hit with an attack from a ranged weapon, you may deflect it so
      that you take no damage from it. You must be aware of the attack and not
      flat-footed. Attempting to deflect a ranged attack doesn&rsquo;t count as
      an action. Unusually massive ranged weapons (such as boulders or ballista
      bolts) and ranged attacks generated by natural attacks or spell effects
      can&rsquo;t be deflected.</p><p>You must have at least one hand free and
      holding nothing (Unarmed Combatant) or a shield in one of your hands
      (Shield Focus) to use this feat.</p>
