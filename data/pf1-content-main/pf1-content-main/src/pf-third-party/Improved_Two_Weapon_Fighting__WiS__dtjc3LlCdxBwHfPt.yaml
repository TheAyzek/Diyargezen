name: Improved Two-Weapon Fighting (WiS)
system:
  description:
    value: >-
      <p><em>You are skilled at fighting with two weapons.</em></p><p>Dex 17,
      Two-Weapon Fighting, base attack bonus
      +6.</p><p><strong>Benefits</strong>: In addition to the standard single
      extra attack you get with an off-hand weapon, you get a second attack with
      it, albeit at a &ndash;5 penalty.</p><p>Once your BAB reaches +11, you
      also gain a third attack with your off-hand weapon, albeit at a -10
      penalty.</p><p><strong>Normal</strong>: Without this feat, you can only
      get a single extra attack with an off-hand weapon.</p>
