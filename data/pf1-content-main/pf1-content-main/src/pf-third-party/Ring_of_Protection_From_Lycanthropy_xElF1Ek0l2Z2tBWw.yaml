name: Ring of Protection From Lycanthropy
system:
  aura:
    school: abj
  cl: 10
  description:
    value: >-
      <p>The delicate silver ring holds 3 moonstones (1,500 gp value as jewelry
      alone). In addition to its monetary value, the ring grants the wearer
      immunity to all forms of lycanthropy. Should the ring be placed on the
      finger of an afflicted lycanthrope, the target is allowed an immediate DC
      25 Will save to throw off the effects of the curse. The ring cannot remove
      lycanthropy from a natural lycanthrope.</p><h3>Requirements</h3><p>Craft
      Wondrous Item, remove curse</p>
