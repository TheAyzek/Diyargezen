  description:
    value: >-
      <p><em>You are trained in using your agility in melee combat, as opposed
      to brute strength.</em></p><p><strong>Benefits</strong>: With a light
      weapon made for a creature of your size category, you may use your
      Dexterity modifier instead of your Strength modifier on attack rolls. If
      you carry a shield, its armor check penalty applies to your attack
      rolls.</p><p><strong>Special</strong>: Natural weapons are considered
      light weapons.</p>
