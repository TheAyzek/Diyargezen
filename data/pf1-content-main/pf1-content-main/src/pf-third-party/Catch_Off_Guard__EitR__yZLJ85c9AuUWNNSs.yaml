name: Catch Off-Guard (EitR)
system:
  contextNotes:
    - target: rangedWeapon
      text: +1 circumstance bonus to attack with splash weapons
  description:
    value: >-
      <p><em>Foes are surprised by your skilled use of unorthodox and improvised
      weapons.</em></p><p><strong>Benefits</strong>: You do not suffer any
      penalties for using an improvised weapon. Unarmed opponents are flatfooted
      against any attacks you make with an improvised weapon. You receive a +1
      circumstance bonus on attack rolls made with thrown splash
      weapons.</p><p><strong>Normal</strong>: You take a &ndash;4 penalty on
      attack rolls made with an improvised weapon.</p>
