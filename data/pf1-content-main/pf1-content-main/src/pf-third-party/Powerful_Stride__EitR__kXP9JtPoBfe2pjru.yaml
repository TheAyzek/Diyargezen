  description:
    value: >-
      <p><em>Your movements on the battlefield are swift and
      steady.</em></p><p>Str 15, Dex 13, Nimble
      Moves</p><p><strong>Benefit</strong>: Once per day, you can take a 10-foot
      step in place of a 5-foot step. This movement must be made in a straight
      line.</p><p><strong>Special</strong>: If you have the Step Up feat, you
      may still take a 5-foot step during your next turn after benefiting from
      its effects. In addition, any movement you make using&nbsp; Step&nbsp;
      Up&nbsp; does&nbsp; not&nbsp; subtract&nbsp; any&nbsp; distance&nbsp;
      from&nbsp; your movement during your next turn.</p>
