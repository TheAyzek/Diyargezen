  contextNotes:
    - target: cmb
      text: >-
        With or without this feat, when you are using a finesse weapon, you may
        use your Dexterity bonus in place of your Strength bonus when attempting
        a disarm, sunder, or trip maneuver.


        This feat allows you to add your Dexterity bonus in place of your
        Strength bonus when attempting a bull rush, grapple, hamstring, or
        overrun maneuver.
  description:
    value: >-
      <p><em>You've learned to use your quickness in place of brute force when
      performing combat maneuvers.</em></p><p><strong>Benefits</strong>: You add
      your Dexterity bonus to your base attack bonus and size bonus when
      determining your Combat Maneuver Bonus (see Combat) instead of your
      Strength bonus.</p><p><strong>Normal</strong>: You add your Strength bonus
      to your base attack bonus and size bonus when determining your Combat
      Maneuver Bonus.</p><p><strong>Special</strong>: With or without this feat,
      when you are using a finesse weapon, you may use your Dexterity bonus in
      place of your Strength bonus when attempting a disarm, sunder, or trip
      maneuver.</p><p>This feat allows you to add your Dexterity bonus in place
      of your Strength bonus when attempting a bull rush, grapple, hamstring, or
      overrun maneuver.</p>
