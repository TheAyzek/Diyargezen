  description:
    value: >-
      <p>These small, specialized tokens are crafted of a material similar in
      texture to bone, but much stronger and more durable (hardness 10; resist
      10 [all energy types]; hp 100). The tokens are 2 in. wide by 3 in. tall,
      and 1/2 in. thick, and have a glowing rune on one side (a permanent arcane
      mark). They can be worn around the neck like a necklace, but not take up
      the neck slot for other items.  The wardtokens' sole purpose is to open
      the door at Area 14C-2 in Rappan Athuk. They are useless
      elsewhere.</p><h3>Requirements</h3><p>Craft Wondrous Item, arcane mark</p>
