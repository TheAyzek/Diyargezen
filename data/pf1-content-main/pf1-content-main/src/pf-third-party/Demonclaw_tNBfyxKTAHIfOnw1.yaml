  description:
    value: >-
      <p>Demonclaw is a +3 anarchic lawful outsider bane thundering greatsword.
      Demonclaw is a CN intelligent weapon with Int 11, Wis 12, Cha 16, Ego 21;
      can communicate by speech and telepathy; knows the languages Abyssal and
      Common. Demonclaw is a proud chaotic weapon, and as such either selects or
      rejects a bearer based on their alignment (it only accepts a chaotic
      bearer). The sword appears as a greatsword made of rune encrusted superior
      quality metal, with a hilt made from the hand of a demon, withered and
      dried from age. It has the primary powers of granting the wielder a spell
      turning ability vs. lawful outsiders only; grants the bearer use of the
      Improved Initiative feat; allows the bearer to rage as a barbarian of
      equivalent level (no rage powers gained), and has the extraordinary power
      of true seeing (at will). Its special purpose is to slay lawful outsiders,
      and each successful hit on a lawful outsider reduces the creature's
      natural AC by 1 point permanently. The only drawback to wielding Demonclaw
      is that once grasped, it bonds to the left hand of the bearer and cannot
      be removed by any means short of a limited wish, wish, or miracle. It also
      compels (DC 21 Will save to avoid) the bearer to attack immediately any
      lawful outsider he encounters.</p><p><strong>Base Item</strong>: anarchic
      lawful outsider bane thundering
      greatsword</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, blindness/deafness, chaos hammer, protection from
      law, true seeing</p>
