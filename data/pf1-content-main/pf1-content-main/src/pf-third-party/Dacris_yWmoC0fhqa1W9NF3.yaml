  description:
    value: >-
      <p>Dacris is a +2 unholy dark energy scythe. It functions like a brilliant
      energy weapon, bypassing nonliving matter, but it has a blade of smoking,
      inky darkness instead. Dacris is also imbued with two special blessings by
      Orcus: first, once per day when its owner calls it, it teleports to his
      hand, no matter where it is; second, it grants the wielder the ability to
      use word of recall once per day. The use of word of recall may be preset
      to activate if a specific circumstance occurs, such as death or permanent
      incapacitation, similar to the contingency spell. Hesperix currently has
      it set to transport him to the altar at Area 10C-3 should he be slain or
      incapacitated.</p><p><strong>Base Item</strong>: +2 unholy dark energy
      scythe</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, circle of death, limited wish, unholy blight</p>
