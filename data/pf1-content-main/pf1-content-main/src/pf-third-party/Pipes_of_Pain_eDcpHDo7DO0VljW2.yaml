name: Pipes of Pain
system:
  aura:
    custom: true
    school: enchantment and evocation
  cl: 6
  description:
    value: >-
      <p>These appear to be like any other standard set of pipes with nothing to
      reveal their true nature. When played by someone who succeeds on a DC 15
      Perform (wind instruments) check, the pipes create a wondrous melody. All
      within 30 ft. must make a DC 14 Will save or be fascinated by the sound.
      (This is a mind-affecting sonic compulsion.) As soon as the piping stops,
      all those affected are stricken by intense pain at even the slightest
      noise. Unless a character is in a totally silent area, she takes 1d4
      points of damage per round for 2d4 rounds. During this time, damage from
      sonic attacks is doubled. Thereafter, the least noise causes an affected
      character to become shaken (except when she is in a totally silent area).
      This hypersensitivity is a curse and therefore hard to remove (see the
      bestow curse spell).</p><h3>Requirements</h3><p>Craft Wondrous Item,
      creator must have the bardic music class feature, sound burst</p>
