  description:
    value: >-
      <p>This plain-looking steel band bypasses the shielding on Level 14C of
      Rappan Athuk, allowing the wearer to teleport normally and use any planar
      traveling abilities. The ring does not grant the ability to teleport or
      summon aid by itself.  There is a more powerful version of the ring, the
      greater warden ring, which controls the lesser rings.  The greater warden
      ring can suspend the powers of any warden ring as long as the wearer of
      the greater warden ring desires, as a move-equivalent action that does not
      provoke attacks of opportunity. The greater warden ring is a singular
      item; it is a minor artifact.</p><h3>Requirements</h3><p>Forge Ring,
      limited wish</p>
