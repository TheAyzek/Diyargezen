  description:
    value: >-
      <p><em>Your training and reflexes allow you to react swiftly to avoid an
      opponents' attacks.</em></p><p>Dex 13.</p><p><strong>Benefits</strong>:
      You gain a +1 dodge bonus to your AC. This bonus&nbsp; increases&nbsp;
      to&nbsp; +5&nbsp; against&nbsp; attacks&nbsp; of&nbsp; opportunity&nbsp;
      caused&nbsp; when&nbsp; you&nbsp; move&nbsp; out&nbsp; of&nbsp; or&nbsp;
      within&nbsp; a&nbsp; threatened&nbsp; tile. A condition that makes you
      lose your Dex bonus to AC also makes you lose the benefits of this
      feat.</p>
