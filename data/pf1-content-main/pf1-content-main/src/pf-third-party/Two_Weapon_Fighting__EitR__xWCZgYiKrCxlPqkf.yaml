name: Two-Weapon Fighting (EitR)
system:
  description:
    value: >-
      <p><em>You can fight with a weapon wielded in each of your hands. You can
      make one extra attack each round with the secondary weapon.</em></p><p>Dex
      15.</p><p><strong>Benefits</strong>: Your penalties on attack rolls for
      fighting with two weapons are reduced. The penalty for your primary hand
      lessens by 2 and the one for your off hand lessens by 6. See table
      below:</p><table><tbody><tr><td><strong>Circumstances</strong></td><td><strong>Primary
      Hand</strong></td><td><strong>Off Hand</strong></td></tr><tr><td>Normal
      penalties</td><td>-6</td><td>-10</td></tr><tr><td>Off-hand weapon is a
      finesse weapon</td><td>-4</td><td>-8</td></tr><tr><td>Two-Weapon Fighting
      feat</td><td>-4</td><td>-4</td></tr><tr><td>Off-hand weapon is a finesse
      weapon and Two-Weapon Fighting
      feat</td><td>-2</td><td>-2</td></tr></tbody></table><p><strong>Normal</strong>:
      f you wield a second weapon in your off hand, you can get one extra attack
      per round with that weapon. When fighting in this way you suffer a -6
      penalty with your regular attack or attacks with your primary hand and a
      -10 penalty to the attack with your off hand. If your off-hand weapon is a
      finesse weapon, the penalties are reduced by 2 each. An unarmed strike is
      always considered a finesse weapon.</p>
