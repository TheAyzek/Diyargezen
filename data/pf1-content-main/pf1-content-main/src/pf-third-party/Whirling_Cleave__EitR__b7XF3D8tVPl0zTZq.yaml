  description:
    value: >-
      <p><em>You become a whirlwind of steel on the battlefield.</em></p><p>Str
      13, Cleave, Great Cleave, base bonus +6.</p><p><strong>Benefits</strong>:
      You&nbsp; can&nbsp; take&nbsp; a&nbsp; single&nbsp; 5-foot&nbsp;
      step&nbsp; during&nbsp; a&nbsp; Cleave or Great Cleave, as long as it
      brings you within reach&nbsp; of&nbsp; another&nbsp; foe&nbsp; of&nbsp;
      which&nbsp; you&nbsp; are&nbsp; able&nbsp; to&nbsp; make&nbsp; an&nbsp;
      additional attack against. This 5-foot step is a free action and does not
      subtract from your normal movement for the round.</p>
