name: Horn of Flies
system:
  aura:
    school: con
  cl: 12
  description:
    value: >-
      <p>Made of wrought brass, this object is sacred to the worshippers of The
      Lord of Flies. The pitted, corroded and singed surface of the horn is
      covered by ornaments depicting swarming flies.  When blown by a
      non-believer, the horn casts bane (the wielder chooses a target within 60
      ft., DC 17 Will save negates) and summons a swarm of flies, 1/day.  A
      follower of The Lord of Flies may draw forth swarms 7/day and cast
      desecrate, 3/day. A good or neutral character in possession of the horn
      risks spiritual taint, and must roll a DC 14 Will save every week or move
      one step towards lawful evil alignment. Even on a touch, the horn leaves
      an indelible blackness on the member or lips touching it-only remove curse
      or the equivalent can remove it.  If the horn is attacked (a futile effort
      trying to harm it-hardness 20 and 70 hp), it sounds on its own and summons
      1d4 swarms (Pathfinder Roleplaying Game Bestiary, Wasp Swarm, with the
      following changes: remove Melee and Special Attack
      poison).</p><h3>Requirements</h3><p>Craft Wondrous Item, bane, insect
      plague, unhallow, follower of the Lord of Flies</p>
