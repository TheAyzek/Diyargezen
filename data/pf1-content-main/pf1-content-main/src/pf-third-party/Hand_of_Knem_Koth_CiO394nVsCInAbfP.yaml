name: Hand of Knem Koth
system:
  artifact: true
  aura:
    school: con
  cl: 16
  description:
    value: >-
      <p>This was the left hand of the ancient deity Knem Koth, the Dark
      Harbinger, God of the Evernight, revered by some evil humans during the
      Age of Kings and a primary deity of the shadow giants. Knem Koth was
      betrayed by the Phoromycean deities, Kringa the Temptress and the
      enigmatic blind god known only as The Master. They tricked Knem Koth into
      becoming stuck in the Lair of Lacrymundus and then murdered him with the
      help of that eldritch dragon. They dismembered him and scattered his
      pieces across the multiverse, though his malevolent will seems to have
      been retained in them as many are still potent artifacts. Ironically,
      though Kringa and The Master have long since disappeared from the divine
      realms and been forgotten, the shadow giants have diligently searched for
      more than 10,000 years for all of the pieces of their lost deity in order
      to one day reassemble and resurrect this wicked force of darkness.  The
      hand has various powers of chaos and evil. It appears as a coal-black,
      six-fingered hand of Large size. The stump of the hand is encased in a
      platinum cuff that is in turn affixed to a platinum chain. When someone
      bears the Hand, they gain the following powers: At will-dimensional anchor
      (see below), gate mastery (see below)  3/day-hold person  1/day-hold
      monster Modified dimensional anchor: Anyone attempting to gate, teleport,
      dimension door or use some other means of magical conveyance within 200
      feet of the bearer of the Hand of Knem Koth must make a DC 20 Will save or
      be unable to depart the presence of the bearer without his permission. 
      Gate Mastery: The bearer can inscribe the mark of Knem Koth upon any
      permanent magical gate, which allows the bearer to control who passes
      between the planes that the gate connects. The mark remains until
      dispelled by the bearer of the hand or until a new owner takes possession
      of the hand.  The Hand of Knem Koth is fully evil and takes possession of
      weak souls, who are required to make a DC 25 Will save to avoid its evil
      effects each time a power is used. Creatures possessed by the Hand of Knem
      Koth are geased to quest for the other pieces of the dead god and stop at
      nothing to accomplish this quest.</p>
