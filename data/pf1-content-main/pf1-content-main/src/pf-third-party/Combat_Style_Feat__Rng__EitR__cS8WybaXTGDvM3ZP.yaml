  description:
    value: >-
      <p>At 2nd level, a ranger must select one of two combat styles to pursue:
      archery or two-weapon combat. The ranger’s expertise manifests in the form
      of bonus feats at 2nd, 6th, 10th, 14th, and 18th level. He can choose
      feats from his selected combat style, even if he does not have the normal
      prerequisites.</p><p>If the ranger selects archery, he can choose from the
      following list whenever he gains a combat style feat:
      @Compendium[pf1.feats.HMCAM3Zyo77kG8Yg]{Far Shot},
      @Compendium[pf-content.pf-third-party.dJLezPVKdernFGg5]{Point-Blank Shot
      (EitR)}, @Compendium[pf-content.pf-third-party.ORVdmYMl5KV5Ixjy]{Precise
      Shot (EitR)},
      @Compendium[pf-content.pf-third-party.aBTKJ5CC7MOsK7Wp]{Rapid Reload
      (EitR)}, and @Compendium[pf1.feats.NABgOSBRECIREaha]{Rapid Shot}. At 6th
      level, he adds @Compendium[pf1.feats.h1vqUG9Kh3f7oKWK]{Improved Precise
      Shot}, @Compendium[pf1.feats.w23dO02t0poRrno0]{Manyshot},
      @Compendium[pf-content.pf-feats.3jOyHy00LpOvKz3O]{Parting Shot}, and
      @Compendium[pf-content.pf-feats.3oyuOhVcwraqOu9p]{Point-Blank Master} to
      the list. At 10th level, he adds
      @Compendium[pf1.feats.ztV5oURW9cFsLdXT]{Pinpoint Targeting} and
      @Compendium[pf1.feats.ymtj17MI4MdwB0v2]{Shot on the Run} to the
      list.</p><p>If the ranger selects two-weapon combat, he can choose from
      the following list whenever he gains a combat style feat:
      @Compendium[pf1.feats.VK8TgwfjeomMwGjd]{Double Slice},
      @Compendium[pf1.feats.qYv70Ch9RQfi1LQQ]{Improved Shield Bash},
      @Compendium[pf1.feats.WKIVfdosc5SqYzmP]{Quick Draw},
      @Compendium[pf-content.pf-third-party.fgDYyLCLOfin167x]{Shield Focus
      (EitR)}, and
      @Compendium[pf-content.pf-third-party.xWCZgYiKrCxlPqkf]{Two-Weapon
      Fighting (EitR)}. At 6th level, he adds
      @Compendium[pf-content.pf-third-party.VfA6M8HxQMTOjzR0]{Greater Two-Weapon
      Fighting (EitR)},
      @Compendium[pf-content.pf-third-party.fgDYyLCLOfin167x]{Shield Focus
      (EitR)}, and @Compendium[pf1.feats.YDqp3yrAsuXh103W]{Two-Weapon Defense}
      to the list. At 10th level, he adds
      @Compendium[pf1.feats.GEo7nDHxddLxi66j]{Shield Slam} and
      @Compendium[pf1.feats.tGDNVHHZnNFPPgiY]{Two-Weapon Rend} to the
      list.</p><p>The benefits of the ranger’s chosen style feats apply only
      when he wears light, medium, or no armor. He loses all benefits of his
      combat style feats when wearing heavy armor. Once a ranger selects a
      combat style, it cannot be changed.</p>
  subType: classFeat
type: feat
