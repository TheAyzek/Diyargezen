    value: >-
      <p><em>You are skilled at quick, sly
      maneuvers.</em></p><p><strong>Prerequisties</strong>: Int
      13</p><p><strong>Benefits</strong>: You do not provoke an attack of
      opportunity when performing a trip, disarm, dirty trick, feint,
      reposition, or steal combat maneuver. In addition, you receive a +2 bonus
      on checks with these combat maneuvers. Now a prerequisite for the relevant
      greater combat maneuver feats.</p><p>In addition, you may feint in combat
      as a move action, rather than a standard action.</p>
