name: The Zombiestone of Karsh
system:
  artifact: true
  aura:
    school: nec
  cl: 20
  description:
    value: >-
      <p>This 2 ft. square stone of eerily glowing purple material seems to
      waver in shape and form, and at times even seems to bleed a black ichor.
      No carvings or markings are present on the stone, except some faint chisel
      marks on the exposed top. The stone radiates chaos, evil and magic of the
      greatest power.  The stone has several necromantic powers.  • bestow curse
      (effects all living creatures in a 60 ft.  radius, as a doom spell, no
      save, continuous) • contagion (40 ft. radius, continuous, DC 20 Fortitude
      save avoids for 5 rounds each save) • unhallow (100 ft. radius, all undead
      immune to channeled energy; 100 ft. to 800 ft. undead gain channel
      resistance +4, continuous) • Bolster undead (100 ft. radius, DR 15/-; 300
      ft. radius, DR 15/slashing and DR 10/-; 700 ft. radius, DR 10/ slashing
      and DR 5/-; continuous) • antimagic field (continuous, all magic except
      artifact or deity level powers) • Rise to Undeath (any creature slain on
      this level immediately rises as a zombie within 1d3 rounds [except in
      Areas 13C-9 and 13C-10], see Level 13C Continuous Effects, above). The
      possessor of the stone cannot control the newly risen zombies.  • Overcome
      by Evil (alignment shifts to chaotic evil, DC 25 Will save avoids, new
      check 1/ hour) if exposed to the stone for more than 1 hour (within 100
      ft.) • Wisdom drain (DC 20 Will save negates 1 point of Wisdom drain per
      hour within 100 ft. of the stone.</p>
