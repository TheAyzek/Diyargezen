  description:
    value: >-
      <p><em>You are skilled at fighting while unarmed.</em></p><p>Dex
      13.</p><p><strong>Benefits</strong>: You&nbsp; are&nbsp; considered&nbsp;
      to&nbsp; be&nbsp; armed&nbsp; even&nbsp; when&nbsp; unarmed&nbsp; -&nbsp;
      you&nbsp; do&nbsp; not&nbsp; provoke&nbsp; attacks&nbsp; of&nbsp;
      opportunity&nbsp; when&nbsp; you&nbsp; attack&nbsp; foes&nbsp; while&nbsp;
      unarmed.&nbsp; Your&nbsp; unarmed&nbsp; strikes&nbsp; now&nbsp; deal&nbsp;
      1d6&nbsp; damage&nbsp; if&nbsp; you&nbsp; are&nbsp; medium&nbsp;
      sized&nbsp; or 1d4 damage if you are small sized, and you can deal lethal
      or nonlethal damage, at your choice.</p><p>You&nbsp; do&nbsp; not&nbsp;
      provoke&nbsp; an&nbsp; attack&nbsp; of&nbsp; opportunity&nbsp; when&nbsp;
      performing&nbsp; a&nbsp; grapple&nbsp; combat&nbsp; maneuver.&nbsp;
      In&nbsp; addition,&nbsp; you receive a +2 bonus on checks made to grapple
      a foe. You also receive a +2 bonus to your Combat Maneuver Defense
      whenever an opponent tries to grapple you.</p><p><strong>Normal</strong>:
      Without&nbsp; &nbsp;this&nbsp; &nbsp;feat,&nbsp; &nbsp;you&nbsp;
      &nbsp;are&nbsp; &nbsp;considered&nbsp; &nbsp;unarmed&nbsp; when&nbsp;
      attacking&nbsp; with&nbsp; an&nbsp; unarmed&nbsp; strike,&nbsp; and&nbsp;
      you can deal only nonlethal damage with such an attack. You provoke an
      attack of opportunity when performing a grapple combat maneuver.</p>
