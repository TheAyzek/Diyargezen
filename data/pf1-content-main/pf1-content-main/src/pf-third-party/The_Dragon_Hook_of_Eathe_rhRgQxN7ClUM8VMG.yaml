name: The Dragon Hook of Eathe
system:
  aura:
    school: trs
  cl: 6
  description:
    value: >-
      <p>This magical +1 grappling hook has a 50 ft. golden rope attached. It
      can be used as a weapon (10 ft. reach), dealing 1d6+1 damage if swung on a
      rope as an attack. It can also be used to trip an opponent if thrown.
      Should an opponent be tripped, the hooks close tight around the creature
      hit (like a claw). The hook itself is shaped like a dragon's head with
      spines forming the hooks. If used for climbing, it aids climbing by
      pulling the climber up its 50 ft. of rope (+15 to all Climb checks). If
      used for descent, two quick pulls (perhaps an accident the first time),
      causes the dragon hook to release its grip and fall, allowing its owner to
      retrieve it.</p><p><strong>Base Item</strong>: grappling
      hook</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Wondrous Item, animate objects, animate rope</p>
