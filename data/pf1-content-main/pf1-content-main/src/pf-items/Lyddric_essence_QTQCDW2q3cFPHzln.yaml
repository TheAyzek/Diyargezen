  description:
    value: >-
      <p><strong>Category</strong> Alchemical Weapons</p><p>This enzyme is
      derived from a parasitic fungus that breaks down most organic tissue, and
      is especially destructive to plants and other fungi. A flask of lyddric
      essence can be used like a flask of acid, dealing normal acid damage to
      creatures not of the plant type. However, plant creatures, plants, and
      fungi targeted with lyddric essence take 2d6 points of acid damage on a
      direct hit, or 2 points of acid splash damage if within 5 feet of where it
      hits.</p><h2>Alchemical Recipe</h2><p><strong>Recipe</strong> (15
      brimstone + 3 cytillesh spores)/distillation; <strong>Craft</strong>
      20</p><p><strong>Time</strong> 1 day; <strong>Tools</strong> retort;
      <strong>Type</strong> alchemical weapon</p>
