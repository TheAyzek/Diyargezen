name: Bear trap
system:
  description:
    value: >-
      <p>Although intended for trapping large animals, bear traps work as well
      for trapping humanoids or monsters. The hinged jaws of the trap are
      attached to a chain, which in turn is secured to a spike driven into the
      ground to ensure that the victim cannot simply crawl away. Prying open the
      jaws or pulling the spike from the ground requires a DC 20 Strength
      check.</p><h2>Bear Trap - CR 1</h2><p><strong>Type </strong>mechanical;
      <strong>Perception </strong>DC 15; <strong>Disable Device </strong>DC 20
      </p><h2>Effects</h2> <strong>Trigger </strong>location; <strong>Reset
      </strong>manual</p><p> <strong>Effect </strong>Atk +10 melee (2d6+3);
      sharp jaws spring shut around the creature's ankle and halve the
      creature's base speed (or hold the creature immobile if the trap is
      attached to a solid object); the creature can escape with a DC 20 Disable
      Device check, DC 22 Escape Artist check, or DC 26 Strength check.
