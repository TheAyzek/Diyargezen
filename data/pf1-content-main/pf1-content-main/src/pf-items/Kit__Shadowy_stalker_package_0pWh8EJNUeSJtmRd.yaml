name: Kit, Shadowy stalker package
system:
  description:
    value: >-
      <p>Skulking through a city or a dungeon, the shadowy stalker is equipped
      to strike quickly and fade away. This equipment package is appropriate for
      stealthy characters such as rangers, rogues, and slayers, and for some
      bards and investigators. If the PC can cast spells, add a spell component
      pouch.</p><p><strong>Armor</strong>: Masterwork leather
      armor.</p><p><strong>Weapons</strong>: Daggers (3), masterwork sickle,
      sap.</p><p><strong>Combat Gear</strong>: Alchemist's fire (3), smokesticks
      (2), sunrods (2).</p><p><strong>Other Gear</strong>: Bedroll, belt pouch,
      caltrops, candles (5), chalk (5 pieces), disguise kit, flint and steel,
      glass cutter, masterwork backpack, masterwork thieves' tools, mess kit,
      sack, silk rope (50 ft.), <em>sleeves of many garments</em>, trail rations
      (5 days), waterskin, 1 gp.</p><p><strong>Total Weight</strong>: 63 lbs.
      (33-1/4 lbs. for a Small character).</p>
