    value: >-
      <p>This fine, 10-foot-long tripwire is attached to a loud bell and comes
      with pitons to fix the trap in place. The trap can be set across doorways,
      hallways, or narrow passes or between trees or rocks. Arming the trap
      properly takes 5 minutes; it can be set up in as little as 1 minute, but
      doing so reduces the DC to notice and disarm the trap by 5. The trap has
      the following statistics.</p><h2>Bell Tripwire
      Trap</h2><p><strong>Type</strong> mechanical; <strong>Perception</strong>
      DC 20; <strong>Disable Device</strong> DC 20 </p><h2>Effects</h2>
      <strong>Trigger</strong> touch; <strong>Reset</strong> manual</p><p>
      <strong>Effect</strong> bell rings (Perception DC 0 to hear);
      <strong>Craft (traps) DC</strong> 15
