  description:
    value: >-
      <p><strong>Type</strong> inhaled; <strong>Save</strong> Fortitude DC
      15</p><p><strong>Frequency</strong> 1/minute for 6
      minutes</p><p><strong>Effect</strong> 1d3 Int, see
      text</p><p><strong>Cure</strong> 1 save</p><p>Created by the Whispering
      Way to simultaneously protect and bind newcomers and servants who have
      handled dangerous writings, scholarblight has long since become a
      preferred poison for those who target arcane spellcasters for
      assassination. Scholarblight causes headaches and impairs a victim’s
      ability to form or recall memories through mild confusion and dysphoria.
      More drastically, victims who fail a saving throw against scholarblight
      lose their ability to read or write for 24 hours, as letters and symbols
      seem to twist, move, and reorient themselves. This prevents victims from
      using scrolls and spellbooks, but also protects an afflicted creature from
      any effect dependent on reading text, such as <em>explosive
      runes</em>.</p>
