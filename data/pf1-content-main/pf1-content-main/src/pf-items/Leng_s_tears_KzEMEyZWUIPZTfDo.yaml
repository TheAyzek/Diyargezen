  description:
    value: >-
      <p><strong>Type</strong> contact; <strong>Save</strong> Fortitude DC
      18</p><p><strong>Onset</strong> 1 round; <strong>Frequency</strong> 1/10
      minutes for 1 hour</p><p><strong>Effect</strong> 1d2 Wisdom damage and
      paralyzed for 10 minutes</p><p><strong>Cure</strong> 1 save</p><p>Made
      from the distilled tears and sweat of denizens of Leng (<em>Pathfinder RPG
      Bestiary 2</em> 82), this substance causes hallucinations and temporary
      paralysis. A creature that fails its initial saving throw is paralyzed and
      experiences terrifying hallucinations of wandering through an icy,
      windswept waste. The creature’s paralysis ends if it is cured or once the
      poison runs its course, though memories of the vivid hallucinations may
      haunt it for some time.</p>
