name: Kit, Questing knight package
system:
  description:
    value: >-
      <p>If not descended from nobility, the questing knight certainly looks
      like he fits the part. This equipment package is useful for cavaliers,
      fighters, and paladins. If the PC can cast spells, add a spell component
      pouch and a holy symbol (if required). If the PC gains a mount from a
      class feature, remove the horse from the list below and replace the lance
      with a masterwork lance.</p><p><strong>Armor</strong>: Half-plate, heavy
      wooden shield.</p><p><strong>Weapons</strong>: Javelins (4), lance,
      longsword.</p><p><strong>Combat Gear</strong>: Sunrods
      (2).</p><p><strong>Other Gear</strong>: Backpack, banner, bedroll, belt
      pouch, flask, flint and steel, mess kit, pole (10 ft.), sack, shovel,
      signet ring, silk rope (50 ft.), trail rations (5 days), waterskin,
      whetstone, 8 gp. Mount: Heavy horse (combat trained) with bit and bridle,
      military saddle, and saddlebags.</p><p><strong>Total Weight</strong>:
      127-1/2 lbs. (73-3/4 lbs. for a Small character).</p>
