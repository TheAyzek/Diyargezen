    value: >-
      <p><strong>Price</strong> 50 gp (trapped disguise kit), 40 gp (trapped
      scroll case); <strong>Weight</strong> 8 lbs. (trapped disguise kit), 1 lb.
      (trapped scroll case)</p><p>Kobold artisans are constantly looking for new
      ways to increase the effectiveness of their traps, all while decreasing
      their setup time. To fit these two needs, kobold inventors have created a
      series of small and easy-to-use trapped items. These replica items have
      traps built into them, and can be armed in a standard action. They're
      self-contained, single-use, and as easily transportable as the items they
      mimic.</p><h2>Trapped Disguise Kit</h2><p><strong>Type
      </strong>mechanical; <strong>Perception </strong>DC 25; <strong>Disable
      Device</strong> DC 25 </p><h2>Effects</h2> <strong>Trigger </strong>touch;
      <strong>Reset </strong>repair</p><p> <strong>Effect </strong>scent mark;
      never miss; onset delay (1 round)
       This appears to be a normal disguise kit, except that
      if any of the makeup or false facial hair is applied, the victim is marked
      with a strong scent. This scent mark decreases the DC of tracking the
      victim by scent by 4. The mark can be washed off with vigorous scrubbing,
      but otherwise fades on its own over several days. </p><p> <h2>Trapped
      Scroll Case</h2> Type mechanical; Perception DC 20; Disable Device DC 20
      <h2>Effects</h2> <strong>Trigger </strong>touch; <strong>Reset
      </strong>none</p><p> <strong>Effect </strong>poison gas (Ungol dust)
       This seemingly innocuous scroll case contains a glass
      pellet filled with gaseous poison. This pellet breaks when the case is
      opened, filling a 5-foot square with toxic gas. This poisonous cloud
      disperses after 1 round.
