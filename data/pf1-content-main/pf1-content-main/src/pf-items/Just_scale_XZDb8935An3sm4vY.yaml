      Abadar</p><p>This set of small gold-plated scales is inscribed with words
      from Abadar's holy text. When activated, its presence aids in
      negotiations, making attempts to change the attitude of another person by
      one step a swift action instead of requiring 1 minute. The user must touch
      the scales and speak to the intended target as part of the skill check.
