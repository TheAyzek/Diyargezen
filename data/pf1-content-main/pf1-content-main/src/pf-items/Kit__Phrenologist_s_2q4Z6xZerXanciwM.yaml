name: Kit, Phrenologist's
system:
  description:
    value: >-
      <p>This leather doctor's bag contains all the accoutrements a phrenologist
      needs to measure skulls. This kit contains several metal skull calipers of
      various sizes, a labeled chalkware bust of a humanoid head, and numbered
      charts of skulls of various species. The kit provides a +2 circumstance
      bonus on Knowledge (arcana) checks for the phrenology occult skill
      unlock.</p>
