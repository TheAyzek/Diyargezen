  description:
    value: >-
      <p><strong>Category</strong> Alchemical Weapons</p><p>When lit, this
      footlong wooden tube begins to shake and emit a handful of white sparks,
      shedding light as a torch. One round later it takes flight, moving at a
      speed of 90 feet for 1d6 rounds before loudly exploding in a burst of
      light and sound, dealing 2d6 points of fire damage in a 10-foot-radius
      burst (Reflex DC 15 halves). Anyone who takes damage from the explosion is
      either blinded or deafened (50% chance of either) for 1 round. Crafting
      this item is a DC 25 Craft (alchemy)
      check.</p><h2>Construction</h2><p><strong>Craft (Alchemy)</strong> DC
      25</p>
