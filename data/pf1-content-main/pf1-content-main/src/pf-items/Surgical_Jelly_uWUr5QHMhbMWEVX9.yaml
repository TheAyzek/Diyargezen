name: Surgical Jelly
system:
  description:
    value: >-
      <p>When ingested, this thick red gelatinous substance seeks out and
      surgically eliminates invasive threats to the body. Consuming surgical
      jelly immediately ends any infestations (such as rot grubs; <em>Pathfinder
      RPG GameMastery Guide</em> 245), implanted eggs (such as those implanted
      by xills), or other non-disease effects that can be cured by <em>remove
      disease</em>, so long as such a cure does not require a caster level
      check. Consuming a pot of surgical jelly is a full-round
      action.</p><h2>Construction</h2><p><strong>Craft (Alchemy)</strong> DC
      25</p>
