name: Book lariat
system:
  description:
    value: >-
      <p>This braided metal cord comes with a clasp that affixes to the lock of
      a standard spellbook. The other end of the cord attaches to a belt or belt
      loop. The cord is 10 feet long and retractable. If you drop your spellbook
      while it's attached to the lariat, you can recover the spellbook as a
      standard action. While attached to you, the book can never be farther than
      10 feet from you. Unclasping the book requires a move action, or the cord
      can be cut to free the book (hardness 5, hp 10).</p>
