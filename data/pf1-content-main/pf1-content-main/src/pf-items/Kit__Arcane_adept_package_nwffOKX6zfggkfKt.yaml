name: Kit, Arcane adept package
system:
  description:
    value: >-
      <p>The arcane adept has collected useful magical gear to ensure her
      success on her adventures, and she prides herself on having just the right
      tool for the job. This equipment package is appropriate for an arcanist,
      sorcerer, witch, or wizard. Some bards and summoners might also find it
      attractive. This equipment package can also work for a magus if the
      1st-level scrolls and wand are replaced with a masterwork melee
      weapon.</p><p><strong>Weapons</strong>: Light crossbow with 10 bolts,
      quarterstaff.</p><p><strong>Combat Gear</strong>: Acid (2), <em>scrolls of
      comprehend languages</em> (2), <em>scroll of detect secret doors, scroll
      of glitterdust, scrolls of identify (2), scroll of mount, scroll of rope
      trick, thunderstone, wand of mage armor (16
      charges).</em></p><p><strong>Other Gear</strong>: Backpack, bedroll, belt
      pouch, candles (5), chalk (5 pieces), flint and steel, ink, inkpen, ioun
      torch, journal, magnifying glass, mess kit, scroll box, silk rope (50
      ft.), spell component pouch, trail rations (5 days), waterskin, 3
      gp.</p><p><strong>Total Weight</strong>: 45 lbs. (28-3/4 lbs. for a Small
      character).</p>
