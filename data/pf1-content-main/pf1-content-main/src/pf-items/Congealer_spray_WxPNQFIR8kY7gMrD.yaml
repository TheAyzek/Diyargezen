  description:
    value: >-
      <p><strong>Category</strong> Alchemical Weapons</p><p>This volatile liquid
      is usually dispensed from a spray atomizer, which disperses the liquid in
      a 15-foot cone. Congealer spray causes the surface of an ooze creature to
      stiffen into a leathery material. Ooze and plant creatures in the affected
      area become staggered for 1d4 rounds (Fortitude DC 15 negates). If an
      affected creature has the split defensive ability (<em>Bestiary 2</em>
      302), it cannot benefit from that ability until the effects of the
      congealer spray wear off, regardless of whether the creature succeeded at
      its saving throw.</p><h2>Alchemical Recipe</h2><p><strong>Recipe</strong>
      (4 realgar + 5 salt + 5 urea)/distillation; <strong>Craft</strong>
      20</p><p><strong>Time</strong> 10 minutes; <strong>Tools</strong> retort;
      <strong>Type</strong> alchemical weapon</p>
