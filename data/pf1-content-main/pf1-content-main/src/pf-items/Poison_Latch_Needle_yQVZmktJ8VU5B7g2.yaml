name: Poison Latch Needle
system:
  description:
    value: >-
      <p>This delicate needle is attached to fine springs and a small reservoir
      that contracts on itself when the trap is disturbed or grabbed, turning a
      minor prick into a painful injection. This trap is normally hidden under
      door latches, drawer handles, and other small openings where it can
      deliver any injury poison, destroying itself in the process. A roll of
      natural 1 on the skill check to install the trap exposes its installer to
      the poison. A poison latch needle cannot be reused.</p><p>This can be
      crafted with a DC 20 Craft (traps) check. </p><h2>Poison Latch Needle
      Trap</h2><p><strong>Type</strong> mechanical; <strong>Perception</strong>
      DC 20; <strong>Disable Device</strong> DC 20 </p><h2>Effects</h2>
      <strong>Trigger</strong> touch; <strong>Reset</strong> none</p><p>
      <strong>Effect</strong> Atk +5 melee (1 damage plus poison)
