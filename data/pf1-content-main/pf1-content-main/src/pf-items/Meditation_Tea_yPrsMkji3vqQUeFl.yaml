name: Meditation Tea
system:
  description:
    value: >-
      <p>Drinking this cloudy tea has a soothing effect that clarifies your
      thoughts. For 10 minutes after drinking the tea, you gain a +2 alchemical
      bonus against mind-affecting effects. If you drink meditation tea while
      suffering from a mind-affecting affect, you may immediately roll another
      saving throw (with the +2 bonus) against the effect; you may gain this
      particular benefit only once per
      day.</p><h2>Construction</h2><p><strong>Craft (Alchemy)</strong> DC 20</p>
