name: Bear Trap (sawtooth)
system:
  description:
    value: >-
      <p><strong>Price</strong> 3 gp Bear trap (offset), 1,800 gp Bear trap
      (sawtooth); <strong>Weight</strong> 10 lbs. Bear trap (offset), 20 lbs.
      Bear trap (sawtooth)</p><p>An offset bear trap is a specialized variety of
      a bear trap<sup></sup> constructed with offset jaws coated in resin. It
      inflicts less damage on captured creatures but holds them more securely,
      and is therefore primarily used by trappers or bounty hunters who do not
      want to risk killing their prey. Offset bear traps are almost always
      secured to the ground by a heavy spike and chain so the captured creature
      can't wander far.</p><p>A sawtooth bear trap has vicious jaws and tighter
      springs. Used primarily against humanoids or monsters rather than animals,
      sawtooth bear traps are often painted in camouflaged colors to blend in
      with the trap site. Most include locking plates over the spring mechanisms
      to prevent tampering by intelligent victims.</p><h2>Offset Bear Trap - CR
      1/2</h2><p><strong>type</strong> mechanical; <strong>Perception</strong>
      DC 15; <strong>Disable Device</strong> DC 20
      </p><h2>Effects</h2><strong>Trigger</strong> location;
      <strong>Reset</strong> manual</p><p><strong>Effect</strong> Atk +10 melee
      (1d6+2); jaws spring shut around the creature's ankle and hold the
      creature immobile; the creature can escape with a DC 20 Disable Device
      check, DC 24 Escape Artist check, or DC 28 Strength check. <h2>Sawtooth
      Bear Trap - CR 5</h2><strong>type</strong> mechanical;
      <strong>Perception</strong> DC 25; <strong>Disable Device</strong> DC 25
      <h2>Effects</h2><strong>Trigger</strong> location; <strong>Reset</strong>
      manual</p><p><strong>Effect</strong> Atk +15 melee (3d6+9); serrated jaws
      spring shut around the creature's ankle and halve the creature's base
      speed (or hold the creature immobile if the trap is attached to a solid
      object); the creature can escape with a DC 25 Disable Device check, DC 28
      Escape Artist check, or DC 32 Strength check.
