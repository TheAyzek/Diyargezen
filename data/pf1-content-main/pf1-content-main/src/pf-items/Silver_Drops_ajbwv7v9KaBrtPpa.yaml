    value: >-
      <p><strong>Category</strong> Alchemical Tools</p><p>A creature with
      DR/silver can swallow these bitter-tasting capsules of a concentrated
      alchemical silver to convert their damage reduction to DR/- for 2d4
      rounds. When this effect ends, the creature is nauseated for 1 round. A
      creature can only benefit from silver drops once per 24 hours. Crafting
      this item requires a successful DC 30 Craft (alchemy)
      check.</p><h2>Construction</h2><p><strong>Craft (Alchemy)</strong> DC
      30</p>
