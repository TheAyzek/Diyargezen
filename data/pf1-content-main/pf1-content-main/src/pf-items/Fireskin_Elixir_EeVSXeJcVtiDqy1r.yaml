name: Fireskin Elixir
system:
  description:
    value: >-
      <p><strong>Category</strong> Alchemical Tools</p><p>This elixir turns its
      imbiber fiery red, making it easier to pass as an efreeti. Unscrupulous
      efreet can sell fireskin elixir to guests who have been barred from
      citizen-only districts and must rely on disguises. Fireskin is highly
      addictive. Many once-savvy merchants have fallen into destitution as they
      scrambled to maintain efreet favor and secure a steady supply of the drug.
      This item can be crafted with a successful DC 20 Craft (alchemy)
      check.</p><h2>Fireskin</h2><p><strong>Type </strong>ingested;
      <strong>Addiction </strong>major, <strong>Fortitude </strong>DC 20<br
      /><strong>Price </strong>100 gp</p><p> <strong>Effect </strong>1 day; +10
      alchemical bonus on Disguise checks to appear as an efreeti, -1 penalty on
      all saves</p><p> <strong>Damage </strong>1d2 Wis
      damage</p><h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 20
