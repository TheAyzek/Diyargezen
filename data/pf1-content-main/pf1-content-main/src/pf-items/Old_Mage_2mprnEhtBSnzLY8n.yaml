      of calculating the DC of saving throws to resist addiction to the drug.
      Neither the Charisma damage nor the nonlethal damage can be healed until
      the user takes a full 8 hours of rest.</p><p><strong>Damage </strong>see
      Effects</p><p>In higher circles of Avistani nobility, some petty nobles
      pretend to be mighty wizards. Typically created in and smuggled north from
      Sargava, old-mage offers a temporary taste of eldritch power at an
      exorbitant cost—both financial and physical.</p>
