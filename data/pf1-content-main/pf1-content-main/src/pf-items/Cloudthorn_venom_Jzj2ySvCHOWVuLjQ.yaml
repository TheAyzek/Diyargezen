        effect:
          - >-
            <strong>Primary Effect</strong>: [[1d3]] Str and Dex damage. In
            addition, the creature is unable to feel pain for [[1]] hour,
            rendering it immune to pain effects. A creature attacking the
            poisoned creature can attempt a Sleight of Hand check opposed by the
            poisoned creature’s Perception check in order to attempt to deliver
            the attack without the target being aware of it, as the creature
            feels no pain from the attack. If a PC is rendered numb in this way,
            the GM should secretly track all damage dealt to the character until
            the numbing effect ends.
