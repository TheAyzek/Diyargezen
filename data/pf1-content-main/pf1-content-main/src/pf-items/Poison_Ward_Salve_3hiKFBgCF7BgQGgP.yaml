name: Poison Ward Salve
system:
  description:
    value: >-
      <p>This herbal salve can be applied directly to the skin to prevent the
      effects of contact poisons. If a creature touches a contact poison, but
      you apply the salve within 1 round of contact, the victim rolls the save
      twice and uses the higher result.</p><h2>Construction</h2><p><strong>Craft
      (Alchemy)</strong> DC 15</p>
