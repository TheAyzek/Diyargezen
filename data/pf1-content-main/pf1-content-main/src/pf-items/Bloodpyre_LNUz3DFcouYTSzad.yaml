  description:
    value: >-
      <p><strong>Type</strong> contact; <strong>Save</strong> Fortitude DC
      14</p><p><strong>Frequency</strong> 1/round for 6
      rounds</p><p><strong>Effect</strong> 1 Cha, Int, and Wis, 2d6 fire, see
      text</p><p><strong>Cure</strong> 1 save</p><p>This orange liquid burns
      regardless of temperature, which its drow creators claim is a side-effect
      of its Abyssal inspiration. The staggering pain inflicted by bloodpyre’s
      slow burn inhibits victims’ mental faculties but provides fiendish
      strength, so some drow houses enhance their warriors with bloodpyre
      despite the pain and damage it causes. Each round a victim fails her
      saving throw against bloodpyre’s effects, she gains a cumulative +1
      alchemical bonus to her Strength, to a maximum of +6 after six failed
      saves. In addition to ability score damage, the victim also takes 2d6
      points of fire damage each time she fails the saving throw against the
      poison.</p>
