  description:
    value: >-
      <p><strong>Category</strong> Alchemical Weapons</p><p>A stormstone
      functions like a thunderstone, but deals 1d6 points of sonic damage in
      addition to deafening creatures; a successful DC 15 Fortitude save halves
      the damage and reduces the deafness to 1 round rather than negating
      it.</p><p> <strong>Mythic</strong>: If you expend one use of mythic power
      while throwing a stormstone, the item deals an amount of electricity
      damage equal to your mythic tier to all affected creatures, regardless of
      whether they succeed at their save. Creatures that fail their saving
      throws against a mythic stormstone become staggered for 1 round in
      addition to the other effects. The stormstone ignores non-mythic
      resistances, non-mythic immunity to electricity or sonic damage, and
      non-mythic silencing effects.</p><h2>Alchemical
      Recipe</h2><p><strong>Recipe</strong> (15 black powder + 85
      phosphorus)/digestion; <strong>Craft</strong>
      30</p><p><strong>Time</strong> 1 hour; <strong>Tools</strong> crucible;
      <strong>Type</strong> alchemical weapon</p>
