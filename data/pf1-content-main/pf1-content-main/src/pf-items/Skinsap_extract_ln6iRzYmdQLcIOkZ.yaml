      rounds</p><p><strong>Initial Effect</strong> staggered and confused (see
      above); <strong>Secondary Effect</strong> 1d2 Dexterity
      damage</p><p><strong>Cure</strong> 1 save</p><p>Harvested by some Mwangi
      tribes from the skin of colorful tree frogs, this potent poison is often
      used to coat arrows, darts, and other weapons. A creature that fails its
      save is distracted by persistent auditory hallucinations of dripping water
      and susurrous voices, gaining the staggered condition until it is cured or
      the poison has run its course. A creature that fails two consecutive
      saving throws against this effect is also confused until cured or the
      poison has run its course; this confusion is a mind-affecting effect.</p>
