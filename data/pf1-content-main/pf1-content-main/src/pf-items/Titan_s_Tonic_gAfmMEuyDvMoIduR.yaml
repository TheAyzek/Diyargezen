name: Titan's Tonic
system:
  description:
    value: >-
      <p><strong>Category</strong> Tincture</p><p>Gravel floats in this umber
      liquid. For 1 hour after drinking this tincture, you gain a +1 alchemical
      bonus to natural armor and a +2 alchemical bonus on Strength checks and
      Strength-based skill checks. The tonic swells your musculature, decreasing
      your movement speed by 5 feet, to a minimum of 5 feet, and causing you to
      take a -4 penalty on Reflex saving throws for the same
      duration.</p><h2>Construction</h2><p><strong>Craft (Alchemy)</strong> DC
      25</p>
