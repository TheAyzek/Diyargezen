      enhancement bonus to Strength and Constitution; these effects vanish if a
      creature’s Intelligence score rises above 3.</p><p>Lethe water loses its
      magical potency 24 hours after being removed from the hot springs, but
      remains mildly poisonous thanks to its mineral content (treat as
      bloodroot, but ingested rather than injury; <em>Pathfinder RPG Core
      Rulebook</em> 558).</p>
