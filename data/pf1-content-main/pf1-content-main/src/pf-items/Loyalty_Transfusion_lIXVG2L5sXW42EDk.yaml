name: Loyalty Transfusion
system:
  description:
    value: >-
      <p>This serum transfers a homunculus's loyalty from one master to another.
      In order for this to work, the homunculus's current master and its
      master-to-be must each place a drop of their blood into the serum. When an
      appropriate homunculus drinks this concoction, it thereafter treats the
      master-to-be as its master. The change in ownership also causes the
      homunculus's alignment to change to match that of its new
      owner.</p><h2>Alchemical Recipe</h2><p><strong>Recipe</strong> (200
      quicksilver + 150 realgar + 200 spirit of wine)/distillation;
      <strong>Craft</strong> 30<br /><strong>Time</strong> 1 day;
      <strong>Tools</strong> retort; <strong>Type</strong> alchemical remedy</p>
  price: 625
