  description:
    value: >-
      <p><strong>Price</strong>  60 gp (Pepper), 40 gp (Smog);
      <strong>Weight</strong> - (Pepper), - (Smog)</p><p>Like standard smoke
      pellets (<em>Ultimate Equipment </em>105), these specialty pellets fill a
      single 5-foot square with opaque smoke for 1 round when broken. They can
      also be thrown as a ranged touch attack with a range increment of 10 feet.
      However, unlike standard smoke pellets, these pellets produce smoke that
      confers additional effects.</p><p><em>Pepper Pellet</em>: The smoke from a
      pepper pellet is an ocular and respiratory irritant, and creatures that
      are hit by a pepper pellet or pass through the smoke must succeed at a DC
      12 Fortitude save or be sickened for 1 round.</p><p><em>Smog Pellet</em>:
      The smoke from a smog pellet is oily, and creatures that are hit by a smog
      pellet or pass through the smoke are covered in thick residue. This
      residue makes invisible creatures visible for 1d4
      rounds.</p><h2>Construction</h2><p><strong>Craft (Alchemy)</strong> DC
      25</p>
