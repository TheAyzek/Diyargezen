  description:
    value: >-
      <p><strong>Type</strong> ingested; <strong>Save</strong> Fortitude DC
      15</p><p><strong>Onset</strong> 1d4 hours; <strong>Frequency</strong>
      1/hour for 8 hours</p><p><strong>Effect</strong> 1d2 Str and Wis damage.
      Additionally, as long as a creature is afflicted with nymph’s lure, its
      sweat exudes powerful pheromones that might attract wild creatures. The
      DCs of Perception and Survival checks to locate or track the creature
      using scent are reduced by 10. Additionally, when rolling to determine
      whether the afflicted creature has a random encounter, roll twice and if
      either roll would result in a random encounter, one
      occurs.</p><p><strong>Cure</strong> 1 save</p><p>Created from the
      concentrated pulp of the sweet-tasting pulapaya fruit (a large,
      bright-red, ovular delicacy with a hard rind and watery interior), nymph’s
      lure is used for a variety of hunting purposes in remote tropical regions.
      It is used in a rite of passage in certain hunter-gatherer societies,
      where young men and women are given a dose of the poison and sent into the
      wild to hunt game and prove their worth, but it is also used as a
      punishment in some places, with the condemned being given several doses of
      the poison and then forced into the wild without any weapons or
      equipment.</p>
