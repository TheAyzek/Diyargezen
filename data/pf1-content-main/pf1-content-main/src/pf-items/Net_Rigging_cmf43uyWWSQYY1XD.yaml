name: Net Rigging
system:
  description:
    value: >-
      <p>This large bundle of ropes, pulleys, netting, and latches can be
      assembled to form two different traps: one to drop a net from above, and
      another to snag trespassers from below and hoist them into the air. Either
      configuration requires an overhead structure such as a ceiling, a
      crossbeam, or a sturdy tree branch to support the trap's mechanisms and
      counterweights. Net rigging has an effective Strength score of 19 for the
      purpose of determining how much weight it can lift.</p><p>This can be
      crafted with a DC 25 Craft (traps) check.</p><h2>Falling Net
      Trap</h2><p><strong>Type</strong> mechanical; <strong>Perception</strong>
      DC 10; <strong>Disable Device</strong> DC 15 </p><h2>Effects</h2>
      <strong>Trigger</strong> touch; <strong>Reset</strong> manual</p><p>
      <strong>Effect</strong> net (entangled and tethered by 10-ft. rope);
      Reflex DC 15 avoids; multiple targets (all targets in a 10-ft.-square
      area) <h2>Hoisting Net Trap</h2> <strong>Type</strong> mechanical;
      <strong>Perception</strong> DC 10; <strong>Disable Device</strong> DC 15
      <h2>Effects</h2> <strong>Trigger</strong> touch; <strong>Reset</strong>
      manual</p><p> <strong>Effect</strong> net (entangled and lifted 10 ft.
      into the air); Reflex DC 15 avoids; multiple targets (all targets in a
      10-ft.-square area)
