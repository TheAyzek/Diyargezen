name: Instant Fertilizer
system:
  description:
    value: >-
      <p><strong>Category</strong> Alchemical Tools</p><p>This ruby-red earth
      can be sprinkled over a 5-foot patch of ground as a standard action that
      provokes attacks of opportunity. Noncreature plants and fungi in the area
      grow with alarming speed, and the ground becomes weedy, difficult terrain
      for non-plant creatures. Any non-plant creature in the square must succeed
      at a DC 15 Reflex save or it becomes entangled by the surging plants. Any
      plant creature in the affected square is healed of 1d6 points of
      damage.</p><h2>Alchemical Recipe</h2><p><strong>Recipe</strong> (15
      magnesium + 20 phosphorus + 10 salt)/calcination; <strong>Craft</strong>
      20</p><p><strong>Time</strong> 1 hour; <strong>Tools</strong> crucible;
      <strong>Type</strong> alchemical tool</p>
