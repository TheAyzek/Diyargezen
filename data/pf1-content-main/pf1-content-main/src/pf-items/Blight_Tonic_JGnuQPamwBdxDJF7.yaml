name: Blight Tonic
system:
  description:
    value: >-
      <p><strong>Category</strong> Alchemical Tools</p><p>Blight tonic increases
      the potency of a creature's disease attack transmitted by physical
      contact, such as a dire rat's filth fever. The next time a creature must
      save against the drinker's disease save DC, the DC for the initial
      infection increases by +2. The tonic lasts for 10 minutes or until the
      next time a creature must save against the drinker's disease DC, whichever
      comes first.</p><h2>Construction</h2><p><strong>Craft (Alchemy)</strong>
      DC 20</p>
