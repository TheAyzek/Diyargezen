name: Stink Ink (Arcane)
system:
  description:
    value: >-
      <p><strong>Price</strong> special; <strong>Weight</strong> 1 lb.<br
      /><strong>Category</strong> Alchemical Remedies</p><p>Most common among
      ratfolk alchemists, arcane stink ink is used to inscribe formulae or
      spells into formula books and spellbooks. Like normal stink ink, the
      arcane version can only be read by creatures with the scent ability
      (although <em>read magic </em>works normally on spells and arcane formulae
      inscribed with stink ink). Using arcane stink ink to inscribe a spell or
      formula into a book costs +10% of the normal amount .</p>
