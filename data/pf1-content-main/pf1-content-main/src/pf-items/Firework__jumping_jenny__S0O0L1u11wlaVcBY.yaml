  description:
    value: >-
      <p><strong>Category</strong> Alchemical Weapons</p><p>This small, round
      paper packet is filled with a sparkling propellant and pierced with
      several irregular holes, which causes it to dance and spin as the firework
      burns. One round after you light a jumping jenny, it fills its square with
      sparks, dealing 1 point of fire damage to creatures in that square and
      dazzling them for 1d2 rounds (Reflex DC 12 negates). Each round for 1d4
      rounds after detonation, the jumping jenny moves into a random adjacent
      square.</p><h2>Alchemical Recipe</h2><p><strong>Recipe</strong> (1 black
      powder + 5 magnesium + 1 saltpeter)/calcination; <strong>Craft</strong>
      16</p><p><strong>Time</strong> 10 minutes; <strong>Tools</strong>
      crucible; <strong>Type</strong> alchemical weapon</p>
