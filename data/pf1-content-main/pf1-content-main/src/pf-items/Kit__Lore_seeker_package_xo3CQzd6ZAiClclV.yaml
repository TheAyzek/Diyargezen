name: Kit, Lore seeker package
system:
  description:
    value: >-
      <p>The lore seeker has the equipment necessary to delve into ancient ruins
      searching for lost knowledge. As this equipment package contains little by
      way of armor or weapons, it is most appropriate for alchemists, bards,
      monks, sorcerers, and wizards. If the PC can cast spells, add a spell
      component pouch and a holy symbol (if
      required).</p><p><strong>Weapons</strong>: Light crossbow with 10 bolts,
      quarterstaff, silver dagger.</p><p><strong>Combat Gear</strong>:
      Alchemist's fire (3), antitoxin, <em>oil of erase, potions of cure light
      wounds (2), potion of protection from evil, tanglefoot bag,
      thunderstone.</em></p><p><em><strong>Other Gear</strong>: Backpack,
      bedroll, belt pouch, candles (5), chalk (5 pieces), compass, crowbar,
      everburning torch, flint and steel, grappling hook, ink, inkpens (2),
      journals (2), magnifying glass, mapmaker's kit, mess kit, sack, signal
      whistle, silk rope (50 ft.), trail rations (5 days), traveler's any-tool,
      waterskin, 8 gp.</em></p><p><em><strong>Total Weight</strong>: 44 lbs.
      (27-3/4 lbs. for a Small character).</em></p>
