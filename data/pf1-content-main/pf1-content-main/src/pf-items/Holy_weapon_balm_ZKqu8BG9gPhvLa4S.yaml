  description:
    value: >-
      <p><strong>Category</strong> Alchemical Weapons</p><p>This violet balm
      comes in a small ceramic pot. When applied to a weapon as a standard
      action, it forms a transparent coating. Weapons coated in this balm deal
      an additional 2d4 points of damage to undead or evil outsiders. A creature
      affected by the balm must succeed at a DC 10 Reflex save or take an
      additional 1d4 points of damage the following round. Any nonmagical weapon
      coated with the balm affects incorporeal undead or evil outsiders as if it
      were a magic weapon. Any magic weapon coated with the balm affects
      incorporeal undead or evil outsiders as if the weapon had the ghost touch
      special ability. The balm remains effective until you make a successful
      attack with the weapon or until 1 minute has passed, whichever is sooner.
      Each dose of balm can coat one weapon or 10 pieces of
      ammunition.</p><h2>Construction</h2><p><strong>Craft (Alchemy)</strong> DC
      20</p>
