name: Fuel Pellet (10)
system:
  description:
    value: >-
      <p><strong>Category</strong> Alchemical Tools</p><p>Small nuggets of
      compressed fibers, resins, and dung, fuel pellets give off very little
      smoke when burned. Each pellet burns for 10 minutes, providing enough heat
      to boil water, and can be lit as a move
      action.</p><h2>Construction</h2><p><strong>Craft (Alchemy)</strong> DC 15"
      </p><p><strong>Source</strong>: Animal Archive pg.
      13</p><p><strong>Category</strong> Alchemical Remedies</p>Anointing a
      creature's eyes with a dose of fury drops causes it to immediately fly
      into a rage for 1d6 rounds, granting it a +2 alchemical bonus to Strength
      and Constitution, a +1 alchemical bonus on Will saves, and a -2 penalty to
      AC. The effect is otherwise identical to a barbarian's rage, and creatures
      are fatigued at the end of the rage. Only creatures with an Intelligence
      score of 1 or 2 can be affected by fury
      drops.<h2>Construction</h2><strong>Craft (Alchemy)</strong> DC 25
