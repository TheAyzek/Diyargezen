name: Undine Weaponshaft
system:
  description:
    value: >-
      <p><strong>Price</strong> +300 gp; <strong>Weight</strong> -<br
      /><strong>Category</strong> Adventuring Gear</p><p>Undines incorporate a
      unique design when crafting shafted weapons such as quarterstaves, spears,
      and tridents. Instead of a solid shaft, the weapon is built around a pipe
      of wood or metal, with the butt end sealed and the front end left open. As
      a full-round action, an undine can make a single melee attack with the
      weapon and use her <em>hydraulic push </em>spell-like ability against the
      target of that melee attack. The weapon otherwise functions like a
      standard weapon of its type, and can be made of special materials (such as
      mithral or adamantine) and masterwork quality.</p>
