name: Falsehood Fizz
system:
  description:
    value: >-
      <p><strong>Category</strong> Alchemical Tools</p><p>When imbibed, this
      cloudy, pink liquid grants you 1d4 uses of alchemical inspiration that can
      be used only on Bluff checks to lie or to deliver secret messages.
      Additionally, you can spend two uses of alchemical inspiration to gain
      inspiration on a saving throw against truth-detecting or truth-forcing
      magic (such as <em>discern lies</em> or <em>zone of truth</em>).</p><p>The
      benefits of falsehood fizz last for 1 hour. During this time, you must
      roll Sense Motive checks twice and take the worse
      result.</p><h2>Construction</h2><p><strong>Craft (Alchemy)</strong> DC
      15</p>
