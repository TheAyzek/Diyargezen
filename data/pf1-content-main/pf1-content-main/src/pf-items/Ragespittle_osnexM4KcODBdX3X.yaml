  description:
    value: >-
      <p><strong>Type</strong> contact; <strong>Save</strong> Fortitude DC
      17</p><p><strong>Onset</strong> 1 minute; <strong>Frequency</strong>
      1/minute for 6 minutes</p><p><strong>Effect</strong> 1d2 Dex, see
      text</p><p><strong>Cure</strong> 2 saves</p><p>Imported from Casmaron, the
      substance also known as Rovagug’s spittle is employed by cults of the
      Rough Beast. The toxin is used to foment unrest by causing muscle tremors
      and aggression. Any creature that fails a Fortitude save against
      ragespittle is subjected to an uncontrollable rage. A rage-afflicted
      victim must succeed at a DC 17 Will save each round or attack the nearest
      creature, whether friend or foe. Effects that suppress confusion or
      emotional conditions suppress ragespittle’s rage effect for their
      duration, but not the poison’s ability damage. Effects that end confusion
      or emotional conditions suppress the urge for only 1d10 rounds while the
      poison remains in the victim’s system.</p>
