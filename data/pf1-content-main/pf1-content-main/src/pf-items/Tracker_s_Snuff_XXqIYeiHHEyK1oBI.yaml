name: Tracker's Snuff
system:
  description:
    value: >-
      <p><strong>Category</strong> Alchemical Tools</p><p>When inhaled, this
      finely ground, alchemically treated tobacco greatly enhances your senses,
      especially your sense of smell. It grants the scent ability and a +2
      alchemical bonus on Perception checks for 1 hour. However, once the effect
      wears off your body is wracked with terrible pain as your joints begin to
      stiffen and seize, dealing 1d2 points of Dexterity damage to
      you.</p><h2>Construction</h2><p><strong>Craft (Alchemy)</strong> DC 30</p>
