  description:
    value: >-
      <p><strong>Type</strong> inhaled; <strong>Save</strong> Fortitude DC
      16</p><p><strong>Onset</strong> 1d4 hours; <strong>Frequency</strong>
      1/day for 6 days</p><p><strong>Effect</strong> 1 Dex and Wis damage. As
      long as a creature has any ability damage from crone’s curse, the creature
      takes a –4 penalty on saving throws to resist the effects of extreme
      temperatures. Additionally, the creature gains vulnerability to cold and
      fire damage during this time, taking half again as much (+50%) damage from
      these forms of damage.</p><p><strong>Cure</strong> 2 consecutive
      saves</p><p>A blackish pollen produced by the night witch (a pale,
      vine-growing flower that blooms in the light of the moon and is hearty
      enough to survive very rugged and difficult environments), crone’s curse
      disorients those who inhale it and interferes with the body’s ability to
      regulate temperature. Merely walking through a field of night witch
      flowers is often sufficient enough to kick up a cloud of the nearly
      invisible black particles, which are a mere nuisance in temperate climates
      but can prove fatal to those exposed to them in deserts and tundra.</p>
