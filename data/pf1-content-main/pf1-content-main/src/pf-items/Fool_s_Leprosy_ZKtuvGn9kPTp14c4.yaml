  description:
    value: >-
      <p><strong>Type</strong> ingested; <strong>Save</strong> Fortitude DC
      20</p><p><strong>Onset</strong> 1 day; <strong>Frequency</strong> 1/day
      for 6 days</p><p><strong>Effect</strong> 1d2 Cha damage and 1d2 Con
      drain</p><p><strong>Cure</strong> 3 consecutive saves</p><p>This cunning
      supernatural venom was originally engineered by Red Mantis alchemists.
      Fool’s leprosy is a slow-acting but ultimately fatal ingested toxin that,
      once it takes hold in its victim’s system, closely mimics the effects of a
      fast-moving form of leprosy. An attempt to divine its nature via
      <em>detect poison</em> fails unless the caster succeeds at a DC 25 caster
      level check, and use of a spell like <em>diagnose disease</em> always
      misidentifies the venom as a disease unless the caster succeeds at a DC 25
      caster level check. In either event, the GM should roll for these caster
      level checks in secret. <em>Neutralize poison</em> and <em>slow
      poison</em> function normally on a person suffering from fool’s leprosy,
      but spells like <em>remove disease</em> do not, as the condition is a
      poison effect, not a disease effect. <em>Heal</em> can cure the effects of
      fool’s leprosy but does nothing to educate the caster about the nature of
      the effect it removes. As long as the truth about fool’s leprosy remains
      hidden, a successful DC 35 Heal check is required to recognize that
      someone suffering from its effects is affected by poison, not a
      disease.</p>
