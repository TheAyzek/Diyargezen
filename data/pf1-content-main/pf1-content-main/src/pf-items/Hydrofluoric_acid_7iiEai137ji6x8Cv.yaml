  description:
    value: >-
      <p><strong>Type</strong> contact; <strong>Save</strong> Fortitude DC
      20</p><p><strong>Onset</strong> 1 minute; <strong>Frequency</strong>
      1/round for 6 rounds</p><p><strong>Effect</strong> 1d2 Str drain, 1d2 Con,
      and 2d6 acid</p><p><strong>Cure</strong> 2 consecutive saves</p><p>The
      wise alchemist takes careful precautions whenever handling hydrofluoric
      acid. This corrosive substance0an occasional byproduct of volcanic gases
      that is used for industrial purposes0dissolves bones and causes tissue
      damage when even a small amount contacts the skin. The acid dissolves the
      body of any victim who dies from hydrofluoric acid poisoning unless the
      acid is neutralized within 1 minute with a successful DC 20 Heal or Craft
      (alchemy) check. Hydrofluoric acid must be stored in a magically
      reinforced container, as it dissolves mundane glass and corrodes metal
      over time.</p>
