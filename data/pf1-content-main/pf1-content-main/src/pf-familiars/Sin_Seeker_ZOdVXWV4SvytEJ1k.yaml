  details:
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Sin Seeker CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder #73: The Worldwound Incursion pg. 88<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> blindsight 50 ft., low-light vision, scent; Perception +9; \r\n            <strong>Aura</strong>  honesty (10 ft., DC 13)\r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 12 (+2 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 16 (3 HD; 3d10)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 5, <strong>Will</strong> 3\r\n            \r\n            \r\n            <strong>Immune</strong> gaze attacks, visual effects and illusions, attacks that rely on sight; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 50 ft. (average)<br/>\r\n                <strong>Melee</strong> bite +3 (1d3-2)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 7, <strong>Dex</strong> 15, <strong>Con</strong> 10, <strong>Int</strong> 12, <strong>Wis</strong> 15, <strong>Cha</strong> 8<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +3; <strong>CMD</strong> 11<br/>\r\n            <strong>Feats</strong> Alertness, Skill Focus (Sense Motive)<br/>\r\n            <strong>Skills</strong> Fly +10, Perception +9, Sense Motive +10, Survival +5<br/>\r\n            <strong>Languages</strong> Common, telepathy 30 ft.<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any urban<br/>\r\n                <strong>Organization</strong>: solitary<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Aura of Honesty (su): Sin seekers radiate an aura of honesty out to 10 feet. All creatures in the area take a -2 penalty on Bluff, Sleight of Hand, and Escape Artist checks. Creatures that succeed at a DC 13 Will save resist the effects of this aura, though they must attempt a new saving throw each time they use one of the listed skills in the area. This is a mind-affecting effect and the save DC is Wisdom-based.\n\nDetect Alignment (sp): At will, a sin seeker can use detect chaos, detect evil, detect good, or detect law. Only one of these can be active at any given time.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Believed to have been bred centuries ago by zealous priests and inquisitors, sin seekers are living creatures with a supernatural ability to detect the scent of varying degrees of morality. Originally small forest swine known for their acute senses of smell, these unfortunate creatures were subjected to a magical mutation similar in practice to fleshwarping. The priests&#x27; goal was to use these new creations to sniff out the supporters of rival faiths, identifying them by their hidden sins.\n\nIn the centuries following their initial creation, various sects throughout Golarion maintained small sin seeker breeding programs. Many of these were aimed at culling impious members from the ranks of the clergy, though many evil sects used sin seekers as torture and interrogation aids. Today, small populations of sin seekers still survive in monasteries throughout Golarion, and adventurers of all alignments continue to keep them as familiars. Sin seekers are usually about 12 to 18 inches long, with a 2-foot wingspan. They weigh between 3 and 5 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Sin Seeker CR 2\nSource Pathfinder #73: The Worldwound Incursion pg. 88\nXP 600\nN Tiny magical beast\nInit +2; Senses blindsight 50 ft., low-light vision, scent; Perception +9\nAura honesty (10 ft., DC 13)\nDefense\nAC 14, touch 14, flat-footed 12 (+2 Dex, +2 size)\nhp 16 (3d10)\nFort +3, Ref +5, Will +3\nImmune gaze attacks, visual effects and illusions, attacks that rely on sight\nOffense\nSpeed 20 ft., fly 50 ft. (average)\nMelee bite +3 (1d3-2)\nSpace 2-1/2 ft., Reach 0 ft.\nSpell-Like Abilities (CL 3rd; concentration +5; save DCs are Wisdom-based)\nConstant-detect alignment\nAt will-comprehend languages\n3/day-confessAPG (DC 14), zone of truth (DC 14)\n1/day-follow auraAPG, seek thoughtsAPG (DC 15)\nStatistics\nStr 7, Dex 15, Con 10, Int 12, Wis 15, Cha 8\nBase Atk +3; CMB +3; CMD 11\nFeats Alertness, Skill Focus (Sense Motive)\nSkills Fly +10, Perception +9, Sense Motive +10, Survival +5\nLanguages Common; telepathy 30 ft.\nEcology\nEnvironment any urban\nOrganization solitary\nTreasure none\nSpecial Abilities\nAura of Honesty (Su) Sin seekers radiate an aura of honesty out to 10 feet. All creatures in the area take a -2 penalty on Bluff, Sleight of Hand, and Escape Artist checks. Creatures that succeed at a DC 13 Will save resist the effects of this aura, though they must attempt a new saving throw each time they use one of the listed skills in the area. This is a mind-affecting effect and the save DC is Wisdom-based.\n\nDetect Alignment (Sp) At will, a sin seeker can use detect chaos, detect evil, detect good, or detect law. Only one of these can be active at any given time.\nDescription\nBelieved to have been bred centuries ago by zealous priests and inquisitors, sin seekers are living creatures with a supernatural ability to detect the scent of varying degrees of morality. Originally small forest swine known for their acute senses of smell, these unfortunate creatures were subjected to a magical mutation similar in practice to fleshwarping. The priests' goal was to use these new creations to sniff out the supporters of rival faiths, identifying them by their hidden sins.\n\nIn the centuries following their initial creation, various sects throughout Golarion maintained small sin seeker breeding programs. Many of these were aimed at culling impious members from the ranks of the clergy, though many evil sects used sin seekers as torture and interrogation aids. Today, small populations of sin seekers still survive in monasteries throughout Golarion, and adventurers of all alignments continue to keep them as familiars. Sin seekers are usually about 12 to 18 inches long, with a 2-foot wingspan. They weigh between 3 and 5 pounds.</pre>\n        </div>\n    "
