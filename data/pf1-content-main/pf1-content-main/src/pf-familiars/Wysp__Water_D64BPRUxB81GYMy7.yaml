      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Water Wysp CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 5 pg. 283<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Outsider (Elemental, Water) <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +7; \r\n            <strong>Aura</strong>  resonance (30 ft.)\r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 13, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 12 (+1 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 22 (3 HD; 3d10+6)<br/>\r\n            <strong>Fort</strong> 5, <strong>Ref</strong> 4, <strong>Will</strong> 2\r\n            \r\n            \r\n            <strong>Immune</strong> elemental traits; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 90 ft.<br/>\r\n                <strong>Melee</strong> 2 tendrils +9 (1d3+3)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 13, <strong>Dex</strong> 12, <strong>Con</strong> 14, <strong>Int</strong> 10, <strong>Wis</strong> 13, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +2; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Power Attack, Weapon Focus (tendril)<br/>\r\n            <strong>Skills</strong> Bluff +7, Heal +6, Knowledge (planes) +5, Perception +7, Sense Motive +7, Stealth +14, Swim +15<br/>\r\n            <strong>Languages</strong> Aquan<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n                \r\n                \r\n                \r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Drench (ex): A water wysp&#x27;s touch puts out Large or smaller nonmagical flames. The creature can dispel magical fire it touches as per dispel magic (caster level &#x3D; the wysp&#x27;s HD).\n\nThere: is no description for this monster.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n        \r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Water Wysp CR 2\nSource Bestiary 5 pg. 283\nXP 600\nN Tiny outsider (elemental, water)\nInit +1; Senses darkvision 60 ft.; Perception +7\nAura resonance (30 ft.)\nDefense\nAC 13, touch 13, flat-footed 12 (+1 Dex, +2 size)\nhp 22 (3d10+6)\nFort +5, Ref +4, Will +2\nImmune elemental traits\nOffense\nSpeed 30 ft., swim 90 ft.\nMelee 2 tendrils +9 (1d3+3)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks drench\nStatistics\nStr 13, Dex 12, Con 14, Int 10, Wis 13, Cha 13\nBase Atk +3; CMB +2; CMD 13 (can't be tripped)\nFeats Power Attack, Weapon Focus (tendril)\nSkills Bluff +7, Heal +6, Knowledge (planes) +5, Perception +7, Sense Motive +7, Stealth +14, Swim +15\nLanguages Aquan\nSQ living battery, servitor\nSpecial Abilities\nDrench (Ex) A water wysp's touch puts out Large or smaller nonmagical flames. The creature can dispel magical fire it touches as per dispel magic (caster level = the wysp's HD).\n\nThere is no description for this monster.</pre>\n        </div>\n    "
