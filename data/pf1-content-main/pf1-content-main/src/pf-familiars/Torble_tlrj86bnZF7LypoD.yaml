  - _id: La7bqQqbFaP6zYgx
    _key: '!actors.items!tlrj86bnZF7LypoD.La7bqQqbFaP6zYgx'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/light_01.jpg
    name: 'Sense: Blindsight'
    system:
      abilityType: ex
      description:
        value: >-
          Using nonvisual senses such as acute smell or hearing, members of this
          race notice things they cannot see.</p><p>Members of this race usually
          do not need to make Perception checks to pinpoint the location of a
          creature within 30 feet, provided they have line of effect to that
          creature.</p><p>A creature that members of this race cannot see still
          has total concealment against individuals with blindsense, and members
          of this race still have the normal miss chance when attacking
          creatures that have concealment.</p><p>Visibility still affects the
          movement of members of this race. Members of this race are still
          denied their Dexterity bonus to AC against attacks from creatures they
          cannot see.
      subType: racial
    type: feat
  - _id: 86ajXzPxegPs864e
    _key: '!actors.items!tlrj86bnZF7LypoD.86ajXzPxegPs864e'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/shadow_12.jpg
    name: 'Sense: Darkvision 30ft.'
    system:
      abilityType: ex
      description:
        value: >-
          Darkvision is the extraordinary ability to see with no light source at
          all, out to a range specified for the creature. Darkvision is
          black-and-white only (colors cannot be discerned). It does not allow
          characters to see anything that they could not see otherwise—invisible
          objects are still invisible, and illusions are still visible as what
          they seem to be. Likewise, darkvision subjects a creature to gaze
          attacks normally. The presence of light does not spoil darkvision.
      subType: racial
    type: feat
