  - _id: LMrCL6m9WruQXQnQ
    _key: '!actors.items!tlrj86bnZF7LypoD.LMrCL6m9WruQXQnQ'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Ooze-vermin Hybrid
    system:
      abilityType: ex
      description:
        value: >-
          Torbles react to ooze-affecting effects as if they were oozes and
          vermin-affecting effects as if they were vermin, whichever is least
          advantageous for the torble or more advantageous for the originator of
          the effect.
      subType: classFeat
    type: feat
  - _id: UaillEJXkqD6OAkl
    _key: '!actors.items!tlrj86bnZF7LypoD.UaillEJXkqD6OAkl'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Primitive Sight
    system:
      abilityType: ex
      description:
        value: >-
          Though it has blindsight and can operate without vision, a torble's
          simple eyes give it poor sight (mainly light and color) with an
          effective range of 30 feet. Because they can see, they are subject to
          attacks that affect sighted creatures (such as gaze attacks), but as
          they can still rely on their blindsight, they cannot be dazzled or
          blinded by sight-based attacks.
      subType: classFeat
    type: feat
  - _id: VCHzLCOdz7P9EITz
    _key: '!actors.items!tlrj86bnZF7LypoD.VCHzLCOdz7P9EITz'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Telepathic Sensitivity
    system:
      abilityType: ex
      description:
        value: >-
          Torbles are receptive to the thoughtenergy of telepathic minds. A
          creature with the telepathy special ability can use a swift action to
          mentally command one torble per point of Charisma bonus for one round,
          twice that many by using a move action, or four times that many by
          using a standard action. The creature's control of the vermin is
          limited to simple commands ('attack,' 'defend,' 'stop,' and so forth);
          orders to attack a certain creature when it appears or guard against a
          particular occurrence are too complex for the vermin to understand.
          Torbles that leave the range of the creature's telepathy immediately
          revert to their standard behavior.
      subType: classFeat
    type: feat
