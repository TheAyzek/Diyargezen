  - _id: JBP2hhFup7p4l9yM
    _key: '!actors.items!CNff7B7KCrxlhNuJ.JBP2hhFup7p4l9yM'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Aura Of Shadow
    system:
      abilityType: su
      description:
        value: >-
          A typhilipede can create a region of twisting, shadowy darkness within
          a 10-foot radius around it. Creatures in the area, including the
          typhilipede, have concealment against attackers that don't have
          lowlight vision or darkvision. The typhilipede can suppress or
          reactivate this aura at will as a swift action. This is a darkness
          effect.
      subType: classFeat
    type: feat
  - _id: MY3EfQJpj9GdVxyw
    _key: '!actors.items!CNff7B7KCrxlhNuJ.MY3EfQJpj9GdVxyw'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Lumivore
    system:
      abilityType: ex
      description:
        value: >-
          A typhilipede can consume light through a process of energy
          absorption. As a standard action, a typhilipede can snuff out all
          mundane light sources in a 15-foot radius around it (magical light
          sources are not affected). Torches, lamps, campfires, and similar
          light sources are immediately extinguished (and don't produce smoke or
          other normal effects of being snuffed out). For each mundane light
          source it consumes in this way, a typhilipede gains 1 temporary hit
          point, to a maximum of 10 temporary hit points. These temporary hit
          points last for 1 hour. The typhilipede loses these temporary hit
          points first when damaged.
      subType: classFeat
    type: feat
  - _id: MkvSeCW0cb4voHox
