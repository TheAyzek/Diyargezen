  details:
    alignment: le
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Typhilipede CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder #103: The Hellfire Compact pg. 88<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            LE \r\n            Tiny \r\n            Outsider (Evil, Extraplanar, Lawful) <br/>\r\n            <strong>Init</strong> 6;\r\n            <strong>Senses</strong> darkvision 120 ft., see in darkness; Perception +7; \r\n            <strong>Aura</strong>  shadow (10 ft.)\r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 12 (+2 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 5, <strong>Will</strong> 2;  Immune fire, poison\r\n            \r\n            \r\n            <strong>Immune</strong> fire, poison; \r\n            \r\n            \r\n            \r\n            <br/><strong>Weaknesses</strong> \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft. (poor)<br/>\r\n                <strong>Melee</strong> bite +7 (1d3+1 plus poison)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 12, <strong>Dex</strong> 15, <strong>Con</strong> 12, <strong>Int</strong> 5, <strong>Wis</strong> 13, <strong>Cha</strong> 8<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +3; <strong>CMD</strong> 14<br/>\r\n            <strong>Feats</strong> Improved Initiative, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Fly +8, Perception +7, Stealth +16<br/>\r\n            <strong>Languages</strong> Infernal (can&#x27;t speak)<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any underground (Hell)<br/>\r\n                <strong>Organization</strong>: solitary, mass (2-9), or colony (10-30)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Aura of Shadow (su): A typhilipede can create a region of twisting, shadowy darkness within a 10-foot radius around it. Creatures in the area, including the typhilipede, have concealment against attackers that don&#x27;t have lowlight vision or darkvision. The typhilipede can suppress or reactivate this aura at will as a swift action. This is a darkness effect.\n\nLumivore (ex): A typhilipede can consume light through a process of energy absorption. As a standard action, a typhilipede can snuff out all mundane light sources in a 15-foot radius around it (magical light sources are not affected). Torches, lamps, campfires, and similar light sources are immediately extinguished (and don&#x27;t produce smoke or other normal effects of being snuffed out). For each mundane light source it consumes in this way, a typhilipede gains 1 temporary hit point, to a maximum of 10 temporary hit points. These temporary hit points last for 1 hour. The typhilipede loses these temporary hit points first when damaged.\n\nPoison (ex): Bite-injury; save Fort DC 12; frequency 1/round for 6 rounds; effect 1d4 Con; cure 2 consecutive saves.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Not all the creatures of Hell are devils. Descended from vermin that came to be trapped in Hell, typhilipedes embody the corruptive might and terrible hungers that brood in the dark. Usually encountered as wriggling, clacking masses of insectoid legs and flapping wings, these creatures strike fear in the weaker souls that trespass within the Pit. Typhilipedes possess night-black, segmented bodies with dozens of scraping, skittering legs. Two pairs of batlike wings sprout from between body segments closer to the creature&#x27;s head, which bears two pairs of eyes and oversized mandibles glistening with sickly ichor.\n\nA typhilipede typically measures 2 to 3 feet in length and rises no more than 8 inches from the ground, though its 3-foot wingspan can lift it off the ground with only minor difficulty. A single typhilipede weighs about 10 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Typhilipede CR 2\nSource Pathfinder #103: The Hellfire Compact pg. 88\nXP 600\nLE Tiny outsider (evil, extraplanar, lawful)\nInit +6; Senses darkvision 120 ft., see in darkness; Perception +7\nAura shadow (10 ft.)\nDefense\nAC 14, touch 14, flat-footed 12 (+2 Dex, +2 size)\nhp 19 (3d10+3)\nFort +4, Ref +5, Will +2; Immune fire, poison\nWeaknesses light blindness\nOffense\nSpeed 30 ft., fly 30 ft. (poor)\nMelee bite +7 (1d3+1 plus poison)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks poison\nStatistics\nStr 12, Dex 15, Con 12, Int 5, Wis 13, Cha 8\nBase Atk +3; CMB +3; CMD 14 (18 vs. trip)\nFeats Improved Initiative, Weapon Finesse\nSkills Fly +8, Perception +7, Stealth +16\nLanguages Infernal (can't speak)\nSQ lumivore\nEcology\nEnvironment any underground (Hell)\nOrganization solitary, mass (2-9), or colony (10-30)\nTreasure none\nSpecial Abilities\nAura of Shadow (Su) A typhilipede can create a region of twisting, shadowy darkness within a 10-foot radius around it. Creatures in the area, including the typhilipede, have concealment against attackers that don't have lowlight vision or darkvision. The typhilipede can suppress or reactivate this aura at will as a swift action. This is a darkness effect.\n\nLumivore (Ex) A typhilipede can consume light through a process of energy absorption. As a standard action, a typhilipede can snuff out all mundane light sources in a 15-foot radius around it (magical light sources are not affected). Torches, lamps, campfires, and similar light sources are immediately extinguished (and don't produce smoke or other normal effects of being snuffed out). For each mundane light source it consumes in this way, a typhilipede gains 1 temporary hit point, to a maximum of 10 temporary hit points. These temporary hit points last for 1 hour. The typhilipede loses these temporary hit points first when damaged.\n\nPoison (Ex) Bite-injury; save Fort DC 12; frequency 1/round for 6 rounds; effect 1d4 Con; cure 2 consecutive saves.\nDescription\nNot all the creatures of Hell are devils. Descended from vermin that came to be trapped in Hell, typhilipedes embody the corruptive might and terrible hungers that brood in the dark. Usually encountered as wriggling, clacking masses of insectoid legs and flapping wings, these creatures strike fear in the weaker souls that trespass within the Pit. Typhilipedes possess night-black, segmented bodies with dozens of scraping, skittering legs. Two pairs of batlike wings sprout from between body segments closer to the creature's head, which bears two pairs of eyes and oversized mandibles glistening with sickly ichor.\n\nA typhilipede typically measures 2 to 3 feet in length and rises no more than 8 inches from the ground, though its 3-foot wingspan can lift it off the ground with only minor difficulty. A single typhilipede weighs about 10 pounds.</pre>\n        </div>\n    "
