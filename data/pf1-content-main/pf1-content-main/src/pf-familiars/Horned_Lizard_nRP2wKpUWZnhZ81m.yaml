  details:
    cr:
      base: 0.1625
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Horned Lizard CR 1/6 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 197<br/>\r\n            <strong>XP 65</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Diminutive \r\n            Animal <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> low-light vision, scent; Perception +0; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 15 (+1 Dex, +1 natural, +4 size)<br/>\r\n            <strong>Hit Points</strong> 3 (1 HD; 1d8-1)<br/>\r\n            <strong>Fort</strong> 1, <strong>Ref</strong> 3, <strong>Will</strong> 0\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> bite -1 (1d2-5)<br/>\r\n                <strong>Ranged</strong> blood squirt +5 touch (special)<br/>\r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 1, <strong>Dex</strong> 12, <strong>Con</strong> 8, <strong>Int</strong> 1, <strong>Wis</strong> 10, <strong>Cha</strong> 3<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-3; <strong>CMD</strong> 2<br/>\r\n            <strong>Feats</strong> Run<br/>\r\n            <strong>Skills</strong> Stealth +17<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm desert<br/>\r\n                <strong>Organization</strong>: solitary, pair, or flock (3-12)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Blood Squirt: Once per day as a standard action that doesn&#x27;t provoke attacks of opportunity, a horned lizard can squirt a 5-foot-long stream of blood from the corners of its eyes. The animal&#x27;s blood contains noxious chemicals, and a creature hit by the blood must succeed at a DC 9 Fortitude save or be sickened for 1d4 rounds. The save DC is Constitution-based.\n\nCamouflage: While in desert terrain, a horned lizard can use the Stealth skill to hide even if the terrain doesn&#x27;t grant cover or concealment.\n\nPuff Up: When taking the total defense action, a horned lizard puffs up its body, appearing larger and more horned and gaining an additional +4 bonus to CMD against grapple attempts.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Despite their sluggish, toad-like appearance, these creatures are reptiles with dry, spiny skin adapted to prevent water loss in their native desert environment. They are typically found sunning themselves on rocks during all but the hottest parts of the day, retreating beneath the shade of ridges or rocks when the sun is directly overhead. Their main method of defense is to avoid detection, but when their desert coloration fails to fool predators, they attempt to flee or use their other defensive methods, such as their unique ability to rupture blood vessels in their eyes so they can spray noxious blood at approaching predators. Due to their fierce defensive displays, horned lizards are often thought to be overly aggressive, though people who keep them as pets or familiars know that they can be affectionate creatures.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Horned Lizard CR 1/6\nSource Ultimate Wilderness pg. 197\nXP 65\nN Diminutive animal\nInit +1; Senses low-light vision, scent; Perception +0\nDefense\nAC 16, touch 15, flat-footed 15 (+1 Dex, +1 natural, +4 size)\nhp 3 (1d8-1)\nFort +1, Ref +3, Will +0\nOffense\nSpeed 20 ft.\nMelee bite -1 (1d2-5)\nRanged blood squirt +5 touch (special)\nSpace 1 ft., Reach 0 ft.\nStatistics\nStr 1, Dex 12, Con 8, Int 1, Wis 10, Cha 3\nBase Atk +0; CMB -3; CMD 2 (6 vs. trip)\nFeats Run\nSkills Stealth +17\nSQ camouflage, puff up\nEcology\nEnvironment warm desert\nOrganization solitary, pair, or flock (3-12)\nTreasure none\nSpecial Abilities\nBlood Squirt Once per day as a standard action that doesn't provoke attacks of opportunity, a horned lizard can squirt a 5-foot-long stream of blood from the corners of its eyes. The animal's blood contains noxious chemicals, and a creature hit by the blood must succeed at a DC 9 Fortitude save or be sickened for 1d4 rounds. The save DC is Constitution-based.\n\nCamouflage While in desert terrain, a horned lizard can use the Stealth skill to hide even if the terrain doesn't grant cover or concealment.\n\nPuff Up When taking the total defense action, a horned lizard puffs up its body, appearing larger and more horned and gaining an additional +4 bonus to CMD against grapple attempts.\nDescription\nDespite their sluggish, toad-like appearance, these creatures are reptiles with dry, spiny skin adapted to prevent water loss in their native desert environment. They are typically found sunning themselves on rocks during all but the hottest parts of the day, retreating beneath the shade of ridges or rocks when the sun is directly overhead. Their main method of defense is to avoid detection, but when their desert coloration fails to fool predators, they attempt to flee or use their other defensive methods, such as their unique ability to rupture blood vessels in their eyes so they can spray noxious blood at approaching predators. Due to their fierce defensive displays, horned lizards are often thought to be overly aggressive, though people who keep them as pets or familiars know that they can be affectionate creatures.</pre>\n        </div>\n    "
