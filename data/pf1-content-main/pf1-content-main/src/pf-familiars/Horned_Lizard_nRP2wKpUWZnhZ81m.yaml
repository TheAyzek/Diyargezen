      description:
        value: >-
          Once per day as a standard action that doesn't provoke attacks of
          opportunity, a horned lizard can squirt a 5-foot-long stream of blood
          from the corners of its eyes. The animal's blood contains noxious
          chemicals, and a creature hit by the blood must succeed at a DC 9
