    img: systems/pf1/icons/feats/run.jpg
    name: Run
    system:
      description:
        value: |2-

                          <em>You are swift of foot.</em></p><p>
                          <p><strong>Benefits</strong></p><p>When running, you move five times your normal speed (if wearing medium, light, or no armor and carrying no more than a medium load) or four times your speed (if wearing heavy armor or carrying a heavy load). If you make a jump after a running start (see the Acrobatics skill description), you gain a +4 bonus on your Acrobatics check. While running, you retain your Dexterity bonus to your Armor Class.</p>
                      <br /><p><strong>Normal</strong></p><p>You move four times your speed while running (if wearing medium, light, or no armor and carrying no more than a medium load) or three times your speed (if wearing heavy armor or carrying a heavy load), and you lose your Dexterity bonus to AC.</p>
      tags:
        - General
        - Movement
    type: feat
