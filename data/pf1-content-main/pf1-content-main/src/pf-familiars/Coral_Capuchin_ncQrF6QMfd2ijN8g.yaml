  - _id: QaeRm2PZKvwmfRzf
    _key: '!actors.items!ncQrF6QMfd2ijN8g.QaeRm2PZKvwmfRzf'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Cursed Bite
    system:
      abilityType: su
      description:
        value: >-
          A coral capuchin's bite bestows some of the creature's benefits and
          weaknesses upon the victim unless the victim succeeds at a DC 12
          Constitution check. The curse delivered by this bite persists for 1d6
          hours, and cannot affect the same creature more than once in a 24-hour
          period. Affected creatures can hold their breath for double the normal
          amount of time, but begin drying out when exposed to air. Victims take
          1d6 points of damage for every 10 minutes they are out of water,
          though spending a full-round action to bathe the victim in any sort of
          water halts this damage. The save DC is Constitution-based. Moisture
      subType: classFeat
    type: feat
  - _id: G3CDMhl5Xz36JBt4
    _key: '!actors.items!ncQrF6QMfd2ijN8g.G3CDMhl5Xz36JBt4'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Dependency
    system:
      abilityType: ex
      description:
        value: >-
          A coral capuchin can breathe both air and water and survive
          indefinitely on land, but the creature must regularly be either
          submerged in water or thoroughly wetted down, or else it dries out. A
          coral capuchin can remain out of water for a number of hours of equal
          to its Constitution score before it suffers any negative effects.
          After this time, the creature takes 1d6 points of damage for every
          hour it remains dry. Bathing the creature in water of any sort resets
          this time frame.
      subType: classFeat
    type: feat
