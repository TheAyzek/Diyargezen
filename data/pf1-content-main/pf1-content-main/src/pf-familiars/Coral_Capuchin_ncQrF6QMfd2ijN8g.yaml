  details:
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Coral Capuchin CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 6 pg. 66, Pathfinder #58: Island of Empty Eyes pg. 82<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Magical Beast (Aquatic) <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> darkvision 60 f t., low-light vision; Perception +1; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 12 (+3 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 13 (2 HD; 2d10+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 6, <strong>Will</strong> 1\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            <br/><strong>Weaknesses</strong> \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 40 ft. (good)<br/>\r\n                <strong>Melee</strong> bite +7 (1d3-2 plus cursed bite)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 17, <strong>Con</strong> 12, <strong>Int</strong> 6, <strong>Wis</strong> 13, <strong>Cha</strong> 7<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +3; <strong>CMD</strong> 11<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Climb +6, Fly +11, Sleight of Hand +8, Stealth +15 (+19 in coral reefs), Swim +6, Racial Modifiers +4 Sleight of Hand, +4 Stealth in coral reefs<br/>\r\n            <strong>Languages</strong> Common (generally knows only a dozen or so words)<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm coasts or oceans<br/>\r\n                <strong>Organization</strong>: solitary, pair, or tribe (3-24 plus one matriarch)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Cursed Bite (su): A coral capuchin&#x27;s bite bestows some of the creature&#x27;s benefits and weaknesses upon the victim unless the victim succeeds at a DC 12 Constitution check. The curse delivered by this bite persists for 1d6 hours, and cannot affect the same creature more than once in a 24-hour period. Affected creatures can hold their breath for double the normal amount of time, but begin drying out when exposed to air. Victims take 1d6 points of damage for every 10 minutes they are out of water, though spending a full-round action to bathe the victim in any sort of water halts this damage. The save DC is Constitution-based. Moisture\n\nDependency (ex): A coral capuchin can breathe both air and water and survive indefinitely on land, but the creature must regularly be either submerged in water or thoroughly wetted down, or else it dries out. A coral capuchin can remain out of water for a number of hours of equal to its Constitution score before it suffers any negative effects. After this time, the creature takes 1d6 points of damage for every hour it remains dry. Bathing the creature in water of any sort resets this time frame.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Coral capuchins live in tropical coastal areas, generally in small familial groups of fewer than 30 adults led by an older matriarch (see below). Wholly unafraid of most humanoid species, coral capuchins are often befriended by sailors and fishers willing to put up with the creatures&#x27; incurable curiosity and penchant for petty larceny. They can be trained to fish for their allies and are particularly sought after by those who make their living bringing up treasures from the ocean floor. Their voracious, omnivorous appetites also make them popular on long ocean voyages, as they are happy to reduce ships&#x27; endemic rat populations. Perhaps because of this, many sailors see them as good-luck mascots, although they are most popular with pirates, smugglers, and other seafaring folk who more willingly accept their thieving nature.\n\nDespite their mercurial temperaments and propensity for theft, coral capuchins are prized by wizards because of the creatures&#x27; exceptional mobility and their strange cursed bite. Spellcasters of 3rd level or higher with an alignment within one step of neutral can gain a coral capuchin as a familiar by taking the Improved Familiar feat.\n\nAn adult coral capuchin is typically 1-1/2 feet in length with a 1-foot-long tail, a 4-foot wingspan, and a weight of 25 pounds\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Coral Capuchin CR 1\nSource Bestiary 6 pg. 66, Pathfinder #58: Island of Empty Eyes pg. 82\nXP 400\nN Tiny magical beast (aquatic)\nInit +3; Senses darkvision 60 f t., low-light vision; Perception +1\nDefense\nAC 15, touch 15, flat-footed 12 (+3 Dex, +2 size)\nhp 13 (2d10+2)\nFort +4, Ref +6, Will +1\nWeaknesses moisture dependency\nOffense\nSpeed 30 ft., climb 30 ft., fly 40 ft. (good), swim 30 ft.\nMelee bite +7 (1d3-2 plus cursed bite)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks cursed bite\nStatistics\nStr 6, Dex 17, Con 12, Int 6, Wis 13, Cha 7\nBase Atk +2; CMB +3; CMD 11\nFeats Weapon Finesse\nSkills Climb +6, Fly +11, Sleight of Hand +8, Stealth +15 (+19 in coral reefs), Swim +6; Racial Modifiers +4 Sleight of Hand, +4 Stealth in coral reefs\nLanguages Common (generally knows only a dozen or so words)\nSQ amphibious\nEcology\nEnvironment warm coasts or oceans\nOrganization solitary, pair, or tribe (3-24 plus one matriarch)\nTreasure none\nSpecial Abilities\nCursed Bite (Su) A coral capuchin's bite bestows some of the creature's benefits and weaknesses upon the victim unless the victim succeeds at a DC 12 Constitution check. The curse delivered by this bite persists for 1d6 hours, and cannot affect the same creature more than once in a 24-hour period. Affected creatures can hold their breath for double the normal amount of time, but begin drying out when exposed to air. Victims take 1d6 points of damage for every 10 minutes they are out of water, though spending a full-round action to bathe the victim in any sort of water halts this damage. The save DC is Constitution-based. Moisture\nDependency (Ex) A coral capuchin can breathe both air and water and survive indefinitely on land, but the creature must regularly be either submerged in water or thoroughly wetted down, or else it dries out. A coral capuchin can remain out of water for a number of hours of equal to its Constitution score before it suffers any negative effects. After this time, the creature takes 1d6 points of damage for every hour it remains dry. Bathing the creature in water of any sort resets this time frame.\nDescription\nCoral capuchins live in tropical coastal areas, generally in small familial groups of fewer than 30 adults led by an older matriarch (see below). Wholly unafraid of most humanoid species, coral capuchins are often befriended by sailors and fishers willing to put up with the creatures' incurable curiosity and penchant for petty larceny. They can be trained to fish for their allies and are particularly sought after by those who make their living bringing up treasures from the ocean floor. Their voracious, omnivorous appetites also make them popular on long ocean voyages, as they are happy to reduce ships' endemic rat populations. Perhaps because of this, many sailors see them as good-luck mascots, although they are most popular with pirates, smugglers, and other seafaring folk who more willingly accept their thieving nature.\n\nDespite their mercurial temperaments and propensity for theft, coral capuchins are prized by wizards because of the creatures' exceptional mobility and their strange cursed bite. Spellcasters of 3rd level or higher with an alignment within one step of neutral can gain a coral capuchin as a familiar by taking the Improved Familiar feat.\n\nAn adult coral capuchin is typically 1-1/2 feet in length with a 1-foot-long tail, a 4-foot wingspan, and a weight of 25 pounds</pre>\n        </div>\n    "
