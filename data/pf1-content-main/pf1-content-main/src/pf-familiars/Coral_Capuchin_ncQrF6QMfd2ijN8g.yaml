      description:
        value: >-
          <p>Magical beasts are similar to animals but can have&nbsp;<a
          href="https://www.d20pfsrd.com/basics-ability-scores/ability-scores#TOC-Intelligence-Int-">Intelligence</a>&nbsp;scores
          higher than 2 (in which case the magical beast knows at least one
          language, but can’t necessarily speak). Magical beasts usually have
          supernatural or extraordinary abilities, but are sometimes merely
          bizarre in appearance or habits.</p><h2>Features</h2><p>A magical
          beast has the following features.</p><ul><li>d10 Hit Die.</li><li>Base
          attack bonus equal to total Hit Dice (fast
          progression).</li><li>Good&nbsp;<a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Fortitude"
          rel="nofollow">Fortitude</a>&nbsp;and&nbsp;<a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Reflex"
          rel="nofollow">Reflex</a>&nbsp;saves.</li><li>Skill points equal to 2
          + Int modifier (minimum 1) per Hit Die. The following are class skills
          for magical beasts: <a
          href="https://www.d20pfsrd.com/skills/acrobatics"
          rel="nofollow">Acrobatics</a>, <a
          href="https://www.d20pfsrd.com/skills/climb" rel="nofollow">Climb</a>,
          <a href="https://www.d20pfsrd.com/skills/fly" rel="nofollow">Fly</a>,
          <a href="https://www.d20pfsrd.com/skills/perception"
          rel="nofollow">Perception</a>, <a
          href="https://www.d20pfsrd.com/skills/stealth"
          rel="nofollow">Stealth</a>, <a
          href="https://www.d20pfsrd.com/skills/swim"
          rel="nofollow">Swim</a>.</li></ul><h2>Traits</h2><p>A magical beast
          possesses the following traits (unless otherwise noted in a creature’s
          entry).</p><ul><li><a
          href="https://www.d20pfsrd.com/gamemastering/special-abilities#TOC-Darkvision">Darkvision</a>&nbsp;60
          feet.</li><li><a
          href="https://www.d20pfsrd.com/gamemastering/special-abilities#TOC-Low-Light-Vision">Low-light
          vision</a>.</li><li>Proficient with its natural weapons
          only.</li><li>Proficient with no armor.</li><li>Magical beasts
          breathe, eat, and sleep.</li></ul>
      hd: 10
      hp: 11
      level: 2
      savingThrows:
        fort:
          value: high
