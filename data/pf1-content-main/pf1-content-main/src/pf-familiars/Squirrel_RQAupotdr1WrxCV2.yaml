    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Squirrel CR 1/8 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 207, Animal Archive pg. 31<br/>\r\n            <strong>XP 50</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Diminutive \r\n            Animal <br/>\r\n            <strong>Init</strong> 4;\r\n            <strong>Senses</strong> low-light vision; Perception +1; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 18, <strong>Touch</strong> 18, <strong>Flat-Footed</strong> 14 (+4 Dex, +4 size)<br/>\r\n            <strong>Hit Points</strong> 3 (1 HD; 1d8-1)<br/>\r\n            <strong>Fort</strong> 1, <strong>Ref</strong> 6, <strong>Will</strong> 1\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> bite +8 (1d2-4)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 2, <strong>Dex</strong> 19, <strong>Con</strong> 9, <strong>Int</strong> 2, <strong>Wis</strong> 12, <strong>Cha</strong> 9<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +0; <strong>CMD</strong> 6<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Acrobatics +8, Climb +12<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate forests<br/>\r\n                <strong>Organization</strong>: solitary, pair, or scurry (3-8)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Squirrels are surprisingly wily creatures. When they know they are being watched, they pretend to bury nuts, but instead sneak them into their mouths and take them away to hide elsewhere when no one is watching. They eat most things, occasionally even preying on small snakes and birds.\n\nThe average squirrel is roughly 1-1/2 feet long and weighs 1 pound.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Squirrel CR 1/8\nSource Ultimate Wilderness pg. 207, Animal Archive pg. 31\nXP 50\nN Diminutive animal\nInit +4; Senses low-light vision; Perception +1\nDefense\nAC 18, touch 18, flat-footed 14 (+4 Dex, +4 size)\nhp 3 (1d8-1)\nFort +1, Ref +6, Will +1\nOffense\nSpeed 20 ft., climb 20 ft.\nMelee bite +8 (1d2-4)\nSpace 1 ft., Reach 0 ft.\nStatistics\nStr 2, Dex 19, Con 9, Int 2, Wis 12, Cha 9\nBase Atk +0; CMB +0; CMD 6 (10 vs. trip)\nFeats Weapon Finesse\nSkills Acrobatics +8, Climb +12\nEcology\nEnvironment temperate forests\nOrganization solitary, pair, or scurry (3-8)\nTreasure none\nDescription\nSquirrels are surprisingly wily creatures. When they know they are being watched, they pretend to bury nuts, but instead sneak them into their mouths and take them away to hide elsewhere when no one is watching. They eat most things, occasionally even preying on small snakes and birds.\n\nThe average squirrel is roughly 1-1/2 feet long and weighs 1 pound.</pre>\n        </div>\n    "
