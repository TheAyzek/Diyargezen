  - _id: yRZW2WD5z0qS5dxc
    _key: '!actors.items!9LdCM92EVUZvIBcJ.yRZW2WD5z0qS5dxc'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Brain Drain
    system:
      abilityType: su
      description:
        value: >-
          When a brain mole maintains a grapple against a creature to which it
          is attached, it automatically deals an amount of damage equal to its
          bite damage. Whenever a brain mole successfully deals damage to a
          creature to which it is attached, it drains some of that creature's
          mental energy. If the creature is a spellcaster, the spellcaster loses
          a single spell he has prepared, or a single unused spell slot if he is
          a spontaneous spellcaster. The creature chooses which spell or spell
          slot is lost, but can't lose a 0-level spell in this way. If the
          creature is not a spellcaster or has no prepared spells or unused
          spell slots of 1st-level or higher, this ability instead deals 1 point
          of Intelligence, Wisdom, and Charisma damage. Either way, the brain
          mole gains 1 point each of psychic energy each time it uses this
          ability as long as it drains at least one spell or deals at least 1
          point of ability damage.
      subType: classFeat
    type: feat
  - _id: OytykTxYMW5xYQbX
    _key: '!actors.items!9LdCM92EVUZvIBcJ.OytykTxYMW5xYQbX'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Second Sight
    system:
      abilityType: su
      description:
        value: >-
          Brain moles can sense the presence of creatures whose minds have been
          opened to the world of magic. Brain moles can notice and locate any
          creature within 60 feet that is capable of casting spells (whether
          they are Arcana, divine, or psychic spells). This functions
          identically to blindsight, except that it applies only to creatures
          that can cast spells.
      subType: classFeat
    type: feat
  - _id: 9M9eMiuqCXH4SXg0
    _key: '!actors.items!9LdCM92EVUZvIBcJ.9M9eMiuqCXH4SXg0'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Shrouded Mind
    system:
      abilityType: su
      description:
        value: >-
          Brain moles are able to psychically shield their minds, allowing them
          to go undetected by predators that hunt psychically. Brain moles are
          immune to detect spells as well as spells that read or examine auras.
      subType: classFeat
    type: feat
  - _id: QN46DV8IwGhQJCry
    _key: '!actors.items!9LdCM92EVUZvIBcJ.QN46DV8IwGhQJCry'
