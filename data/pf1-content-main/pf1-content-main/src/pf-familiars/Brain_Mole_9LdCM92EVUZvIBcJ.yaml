  details:
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Brain Mole CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 5 pg. 46<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision, scent, second sight 60 ft., tremorsense 15 ft.; Perception +2; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 12 (+2 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 13 (2 HD; 2d10+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 5, <strong>Will</strong> 2\r\n            <br/><strong>Defensive Abilities</strong> shrouded mind; \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> bite +6 (1d3-3 plus attach)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 4, <strong>Dex</strong> 14, <strong>Con</strong> 13, <strong>Int</strong> 2, <strong>Wis</strong> 15, <strong>Cha</strong> 11<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +2; <strong>CMD</strong> 9<br/>\r\n            <strong>Feats</strong> Skill Focus (Stealth), Weapon Finesse<br/>\r\n            <strong>Skills</strong> Stealth +18<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate forests, hills, or plains<br/>\r\n                <strong>Organization</strong>: solitary, pair, or nest (3-5)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Brain Drain (su): When a brain mole maintains a grapple against a creature to which it is attached, it automatically deals an amount of damage equal to its bite damage. Whenever a brain mole successfully deals damage to a creature to which it is attached, it drains some of that creature&#x27;s mental energy. If the creature is a spellcaster, the spellcaster loses a single spell he has prepared, or a single unused spell slot if he is a spontaneous spellcaster. The creature chooses which spell or spell slot is lost, but can&#x27;t lose a 0-level spell in this way. If the creature is not a spellcaster or has no prepared spells or unused spell slots of 1st-level or higher, this ability instead deals 1 point of Intelligence, Wisdom, and Charisma damage. Either way, the brain mole gains 1 point each of psychic energy each time it uses this ability as long as it drains at least one spell or deals at least 1 point of ability damage.\n\nSecond Sight (su): Brain moles can sense the presence of creatures whose minds have been opened to the world of magic. Brain moles can notice and locate any creature within 60 feet that is capable of casting spells (whether they are Arcana, divine, or psychic spells). This functions identically to blindsight, except that it applies only to creatures that can cast spells.\n\nShrouded Mind (su): Brain moles are able to psychically shield their minds, allowing them to go undetected by predators that hunt psychically. Brain moles are immune to detect spells as well as spells that read or examine auras.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Unlike regular moles, which survive on earthworms and other mundane fare, brain moles feed on the psychic energy of other creatures, seeking it out with an addict&#x27;s fervor. Whenever a brain mole encounters a likely victim-preferably a spellcaster-it latches on via its toothy, circular mouth, then magically siphons mental energy until the prey either escapes or falls comatose. After draining energy from a foe, a brain mole usually flees rather than staying to fight, and uses its psychic ability to cast expeditious retreat to aid its escape.\n\nSpellcasters of 5th level or higher with an alignment within one step of neutral can gain a brain mole as a familiar by taking the Improved Familiar feat.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Brain Mole CR 1\nSource Bestiary 5 pg. 46\nXP 400\nN Tiny magical beast\nInit +2; Senses darkvision 60 ft., low-light vision, scent, second sight 60 ft., tremorsense 15 ft.; Perception +2\nDefense\nAC 14, touch 14, flat-footed 12 (+2 Dex, +2 size)\nhp 13 (2d10+2)\nFort +4, Ref +5, Will +2\nDefensive Abilities shrouded mind\nOffense\nSpeed 20 ft., burrow 20 ft.\nMelee bite +6 (1d3-3 plus attach)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks brain drain\nPsychic Magic (CL 2nd; concentration +2)\n12 PE-expeditious retreat (1 PE), mind thrust I (1 PE, DC 11), silent image (1 PE, DC 11)\nStatistics\nStr 4, Dex 14, Con 13, Int 2, Wis 15, Cha 11\nBase Atk +2; CMB +2 (+10 grapple); CMD 9 (17 vs. grapple, 13 vs. trip)\nFeats Skill Focus (Stealth), Weapon Finesse\nSkills Stealth +18\nEcology\nEnvironment temperate forests, hills, or plains\nOrganization solitary, pair, or nest (3-5)\nTreasure none\nSpecial Abilities\nBrain Drain (Su) When a brain mole maintains a grapple against a creature to which it is attached, it automatically deals an amount of damage equal to its bite damage. Whenever a brain mole successfully deals damage to a creature to which it is attached, it drains some of that creature's mental energy. If the creature is a spellcaster, the spellcaster loses a single spell he has prepared, or a single unused spell slot if he is a spontaneous spellcaster. The creature chooses which spell or spell slot is lost, but can't lose a 0-level spell in this way. If the creature is not a spellcaster or has no prepared spells or unused spell slots of 1st-level or higher, this ability instead deals 1 point of Intelligence, Wisdom, and Charisma damage. Either way, the brain mole gains 1 point each of psychic energy each time it uses this ability as long as it drains at least one spell or deals at least 1 point of ability damage.\n\nSecond Sight (Su) Brain moles can sense the presence of creatures whose minds have been opened to the world of magic. Brain moles can notice and locate any creature within 60 feet that is capable of casting spells (whether they are arcane, divine, or psychic spells). This functions identically to blindsight, except that it applies only to creatures that can cast spells.\n\nShrouded Mind (Su) Brain moles are able to psychically shield their minds, allowing them to go undetected by predators that hunt psychically. Brain moles are immune to detect spells as well as spells that read or examine auras.\nDescription\nUnlike regular moles, which survive on earthworms and other mundane fare, brain moles feed on the psychic energy of other creatures, seeking it out with an addict's fervor. Whenever a brain mole encounters a likely victim-preferably a spellcaster-it latches on via its toothy, circular mouth, then magically siphons mental energy until the prey either escapes or falls comatose. After draining energy from a foe, a brain mole usually flees rather than staying to fight, and uses its psychic ability to cast expeditious retreat to aid its escape.\n\nSpellcasters of 5th level or higher with an alignment within one step of neutral can gain a brain mole as a familiar by taking the Improved Familiar feat.</pre>\n        </div>\n    "
