    cr:
      base: 0.5
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Sootwing Bat CR 1/2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Monster Codex pg. 88<br/>\r\n            <strong>XP 200</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CE \r\n            Tiny \r\n            Undead <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> blindsense 20 ft.; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 13 (+1 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 7 (2 HD; 2d8-2)<br/>\r\n            <strong>Fort</strong> 1, <strong>Ref</strong> 1, <strong>Will</strong> 4\r\n            <br/><strong>Defensive Abilities</strong> channel resistance +2; \r\n            \r\n            <strong>Immune</strong> undead traits; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 40 ft. (good)<br/>\r\n                <strong>Melee</strong> bite +4 (1d3-3 plus disease and paralysis)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 5, <strong>Dex</strong> 12, <strong>Con</strong> 0, <strong>Int</strong> 2, <strong>Wis</strong> 13, <strong>Cha</strong> 8<br/>\r\n            <strong>Base Atk</strong> +1; <strong>CMB</strong> +0; <strong>CMD</strong> 7<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Fly +9, Perception +5 (+9 when using blindsense), Racial Modifiers +4 Perception when using blindsense<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any land<br/>\r\n                <strong>Organization</strong>: solitary or colony (4-12)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Disease (su): Ghoul Fever: See Pathfinder RPG Bestiary 146.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Ghoul spellcasters use these smaller cousins to skavelings as familiars. An evil spellcaster can gain a sootwing bat as a familiar at 5th level by taking the Improved Familiar feat. A sootwing bat familiar grants its master a +1 bonus to channel resistance (if the master has any).\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Sootwing Bat CR 1/2\nSource Monster Codex pg. 88\nXP 200\nCE Tiny undead\nInit +1; Senses blindsense 20 ft.; Perception +5\nDefense\nAC 14, touch 13, flat-footed 13 (+1 Dex, +1 natural, +2 size)\nhp 7 (2d8-2)\nFort -1, Ref +1, Will +4\nDefensive Abilities channel resistance +2; Immune undead traits\nOffense\nSpeed 5 ft. fly 40 ft. (good)\nMelee bite +4 (1d3-3 plus disease and paralysis)\nSpace 2 1/2 ft., Reach 0 ft.\nSpecial Attacks disease (DC 10), paralysis (1d4+1 rounds, DC 10, elves are immune to this effect)\nStatistics\nStr 5, Dex 12, Con -, Int 2, Wis 13, Cha 8\nBase Atk +1; CMB +0; CMD 7\nFeats Weapon Finesse\nSkills Fly +9, Perception +5 (+9 when using blindsense); Racial Modifiers +4 Perception when using blindsense\nEcology\nEnvironment any land\nOrganization solitary or colony (4-12)\nTreasure none\nSpecial Abilities\nDisease (Su) Ghoul Fever: See Pathfinder RPG Bestiary 146.\nDescription\nGhoul spellcasters use these smaller cousins to skavelings as familiars. An evil spellcaster can gain a sootwing bat as a familiar at 5th level by taking the Improved Familiar feat. A sootwing bat familiar grants its master a +1 bonus to channel resistance (if the master has any).</pre>\n        </div>\n    "
