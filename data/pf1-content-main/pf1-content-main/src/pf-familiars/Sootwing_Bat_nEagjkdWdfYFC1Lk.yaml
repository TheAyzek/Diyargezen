items:
  - _id: mp1Zmbx0OAzSW4oW
    _key: '!actors.items!nEagjkdWdfYFC1Lk.mp1Zmbx0OAzSW4oW'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/affliction_07.jpg
    name: Undead
    system:
      bab: med
      classSkills:
        clm: true
        dis: true
        fly: true
        int: true
        kar: true
        kre: true
        per: true
        sen: true
        spl: true
        ste: true
      description:
        value: >-
          <p>Undead are once-living creatures animated by spiritual or
          supernatural forces.</p><h2>Features</h2><p>An undead creature has the
          following features.</p><ul><li>d8 Hit Die.</li><li>Base attack bonus
          equal to 3/4 total Hit Dice (medium progression).</li><li>Good&nbsp;<a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Will"
          rel="nofollow">Will</a>&nbsp;Saves.</li><li>Skill points equal to 4 +
          Int modifier (minimum 1) per Hit Die. Many undead, however, are
          mindless and gain no skill points or feats. The following are class
          skills for undead: <a href="https://www.d20pfsrd.com/skills/climb"
          rel="nofollow">Climb</a>, <a
          href="https://www.d20pfsrd.com/skills/disguise"
          rel="nofollow">Disguise</a>, <a
          href="https://www.d20pfsrd.com/skills/fly" rel="nofollow">Fly</a>, <a
          href="https://www.d20pfsrd.com/skills/intimidate"
          rel="nofollow">Intimidate</a>, <a
          href="https://www.d20pfsrd.com/skills/knowledge"
          rel="nofollow">Knowledge</a> (arcane), <a
          href="https://www.d20pfsrd.com/skills/knowledge"
          rel="nofollow">Knowledge</a> (religion), <a
          href="https://www.d20pfsrd.com/skills/perception"
          rel="nofollow">Perception</a>, <a
          href="https://www.d20pfsrd.com/skills/sense-motive"
          rel="nofollow">Sense Motive</a>, <a
          href="https://www.d20pfsrd.com/skills/spellcraft"
          rel="nofollow">Spellcraft</a>, and <a
          href="https://www.d20pfsrd.com/skills/stealth"
          rel="nofollow">Stealth</a>.</li></ul><h2>Traits</h2><p>An undead
          creature possesses the following traits (unless otherwise noted in a
          creature’s entry).</p><ul><li>No Constitution score. Undead use
          their&nbsp;<a
          href="https://www.d20pfsrd.com/basics-ability-scores/ability-scores/#Charisma_Cha">Charisma</a>&nbsp;score
          in place of their Constitution score when calculating hit
          points,&nbsp;<a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Fortitude"
          rel="nofollow">Fortitude</a>&nbsp;saves, and any special ability that
          relies on Constitution (such as when calculating a breath weapon’s
          DC).</li><li><a
          href="https://www.d20pfsrd.com/gamemastering/special-abilities#TOC-Darkvision">Darkvision</a>&nbsp;60
          feet.</li><li>Immunity to all mind-affecting effects (charms,
          compulsions, morale effects, patterns, and
          phantasms).</li><li>Immunity to death effects, disease, paralysis,
          poison, sleep effects, and stunning.</li><li>Not subject to nonlethal
          damage,&nbsp;<a
          href="https://www.d20pfsrd.com/bestiary/rules-for-monsters/universal-monster-rules#TOC-Ability-Damage-and-Drain-Ex-or-Su-"
          rel="nofollow">ability drain</a>, or energy drain. Immune to&nbsp;<a
          href="https://www.d20pfsrd.com/bestiary/rules-for-monsters/universal-monster-rules#TOC-Ability-Damage-and-Drain-Ex-or-Su-"
          rel="nofollow">damage</a>&nbsp;to its physical ability scores
          (Constitution, Dexterity, and&nbsp;<a
          href="https://www.d20pfsrd.com/basics-ability-scores/ability-scores#TOC-Strength-Str-">Strength</a>),
          as well as to exhaustion and fatigue effects.</li><li>Cannot heal
          damage on its own if it has no&nbsp;<a
          href="https://www.d20pfsrd.com/basics-ability-scores/ability-scores#TOC-Intelligence-Int-">Intelligence</a>&nbsp;score,
          although it can be healed. Negative energy (such as
          an&nbsp;inflict&nbsp;spell) can heal undead creatures. The fast
          healing special quality works regardless of the creature’s&nbsp;<a
          href="https://www.d20pfsrd.com/basics-ability-scores/ability-scores#TOC-Intelligence-Int-">Intelligence</a>&nbsp;score.</li><li>Immunity
          to any effect that requires a&nbsp;<a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Fortitude"
          rel="nofollow">Fortitude</a>&nbsp;save (unless the effect also works
          on objects or is harmless).</li><li>Not at risk of death from massive
          damage, but is immediately destroyed when reduced to 0 hit
          points.</li><li>Not affected by&nbsp;<a
          href="https://www.d20pfsrd.com/magic/all-spells/r/raise-dead"
          rel="nofollow">raise dead</a>&nbsp;and&nbsp;<a
          href="https://www.d20pfsrd.com/magic/all-spells/r/reincarnate"
          rel="nofollow">reincarnate</a>&nbsp;spells or
          abilities.&nbsp;Resurrection&nbsp;and&nbsp;<a
          href="https://www.d20pfsrd.com/magic/all-spells/t/true-resurrection"
          rel="nofollow">true resurrection</a>&nbsp;can affect undead creatures.
          These spells turn undead creatures back into the living creatures they
          were before becoming undead.</li><li>Proficient with its natural
          weapons, all simple weapons, and any weapons mentioned in its
          entry.</li><li>Proficient with whatever type of armor (light, medium,
          or heavy) it is described as wearing, as well as all lighter types.
          Undead not indicated as wearing armor are not proficient with armor.
          Undead are proficient with shields if they are proficient with any
          form of armor.</li><li>Undead do not breathe, eat, or sleep.</li></ul>
      hp: 9
      level: 2
      savingThrows:
        will:
          value: high
      skillsPerLevel: 4
      tag: undead
