  details:
    cr:
      base: 0.25
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Peacock CR 1/4 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Familiar Folio pg. 27<br/>\r\n            <strong>XP 100</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Small \r\n            Animal <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> low-light vision; Perception -2; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 12, <strong>Touch</strong> 12, <strong>Flat-Footed</strong> 11 (+1 Dex, +1 size)<br/>\r\n            <strong>Hit Points</strong> 4 (1 HD; 1d8)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 3, <strong>Will</strong> 2\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 40 ft. (clumsy); drift<br/>\r\n                <strong>Melee</strong> 2 talons +2 (1d3-2)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 7, <strong>Dex</strong> 12, <strong>Con</strong> 10, <strong>Int</strong> 1, <strong>Wis</strong> 6, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-3; <strong>CMD</strong> 8<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Fly -1<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n                \r\n                \r\n                \r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Drift (ex): A peacock flies in short bursts, and can&#x27;t use its fly speed to hover. When it flies, a peacock must end its move action by landing or perching on a solid surface.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Peacocks are the male variety of a family of pheasants collectively called peafowls. Their female counterparts, peahens, don&#x27;t possess the brightly colored iridescent plumage typically associated with peacocks, and instead sport gray or brown feathers. Some cultures also breed peafowls with white plumage that may or may not have coloration on the rest of their bodies.\n\nA peacock displays its brightly colored feathers to impress and court peahens as well as to scare off potential predators. The colorful &#x27;eye&#x27; patterns in the feathers also make them popular symbols and decorations among fortune-tellers and royalty.\n\nWhile the male variety is more commonly recognized, all peafowl have identical statistics. A peacock is 3-1/2 feet tall and weighs about 10 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Peacock CR 1/4\nSource Familiar Folio pg. 27\nXP 100\nN Small animal\nInit +1; Senses low-light vision; Perception -2\nDefense\nAC 12, touch 12, flat-footed 11 (+1 Dex, +1 size)\nhp 4 (1d8)\nFort +2, Ref +3, Will -2\nOffense\nSpeed 20 ft., fly 40 ft. (clumsy); drift\nMelee 2 talons +2 (1d3-2)\nStatistics\nStr 7, Dex 12, Con 10, Int 1, Wis 6, Cha 13\nBase Atk +0; CMB -3; CMD 8\nFeats Weapon Finesse\nSkills Fly -1\nSpecial Abilities\nDrift (Ex) A peacock flies in short bursts, and can't use its fly speed to hover. When it flies, a peacock must end its move action by landing or perching on a solid surface.\nDescription\nPeacocks are the male variety of a family of pheasants collectively called peafowls. Their female counterparts, peahens, don't possess the brightly colored iridescent plumage typically associated with peacocks, and instead sport gray or brown feathers. Some cultures also breed peafowls with white plumage that may or may not have coloration on the rest of their bodies.\n\nA peacock displays its brightly colored feathers to impress and court peahens as well as to scare off potential predators. The colorful 'eye' patterns in the feathers also make them popular symbols and decorations among fortune-tellers and royalty.\n\nWhile the male variety is more commonly recognized, all peafowl have identical statistics. A peacock is 3-1/2 feet tall and weighs about 10 pounds.</pre>\n        </div>\n    "
