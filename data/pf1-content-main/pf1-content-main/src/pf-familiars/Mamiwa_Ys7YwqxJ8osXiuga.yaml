  details:
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Mamiwa CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ire of the Storm pg. 63<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Outsider (Air, Elemental, Native, Water) <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +7; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 12 (+2 Dex, +1 dodge, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 5, <strong>Will</strong> 2\r\n            \r\n            \r\n            <strong>Immune</strong> elemental traits; \r\n            <strong>Resist</strong> cold or electricity 5; \r\n            \r\n            \r\n            <br/><strong>Weaknesses</strong> \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 50 ft. (perfect)<br/>\r\n                <strong>Melee</strong> bite +7 (1d3-2)<br/>\r\n                <strong>Ranged</strong> elemental blast +7 (2d6 cold or electricity)<br/>\r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 7, <strong>Dex</strong> 15, <strong>Con</strong> 12, <strong>Int</strong> 10, <strong>Wis</strong> 12, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +3; <strong>CMD</strong> 12<br/>\r\n            <strong>Feats</strong> Dodge, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Acrobatics +8 (+0 when jumping), Fly +20, Knowledge (nature) +6, Perception +7, Survival +7 (+11 to predict the weather), Swim +12, Racial Modifiers -8 Acrobatics when jumping, +4 Survival to predict the weather<br/>\r\n            <strong>Languages</strong> Common, rain speaker, speak with animals<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any<br/>\r\n                <strong>Organization</strong>: solitary or stormfront (2-12)<br/>\r\n                <strong>Treasure</strong>: incidental<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Elemental Alignment (su): Each day at sunrise, a mamiwa must align itself toward either air or water. An air-aligned mamiwa gains electricity resistance 5, its elemental blast and elemental infusion abilities deal electricity damage, and it gains Auran as a bonus language. A mamiwa aligned with water instead gains cold resistance 5, deals cold damage with its attacks, and gains Aquan as a bonus language.\n\nElemental Blast (su): A mamiwa can unleash a blast of elemental energy as a ranged touch attack. Creatures struck by this blast take 2d6 points of cold or electricity damage, depending on the mamiwa&#x27;s elemental alignment for that day.\n\nElemental Infusion (su): As a standard action, a mamiwa can join itself with a single weapon or suit of armor. A mamiwa cannot act while infusing an object, except to end the infusion, but does impart some of its elemental nature to whatever it inhabits. An infused weapon deals an additional 1d6 points of energy damage, while an infused suit of armor instead grants both the armor and its wearer energy resistance 5. The energy type of this bonus damage and resistance depends on the mamiwa&#x27;s elemental alignment for that day. Each day, a mamiwa can maintain its elemental infusion for up to 1 minute per Hit Die. This time does not need to be consecutive, but must be used in 1-minute increments. If the infused object is destroyed, the mamiwa immediately appears adjacent to the wearer and is staggered for 1d6 rounds.\n\nRain Speaker (ex): A mamiwa gains telepathy out to 100 feet in any sort of precipitation, but can communicate only with other creatures that are also being rained upon.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">When powerful storms roll across the Material Plane, the elemental morass of air and water sometimes births mamiwas-curious and frantic little spirits of temperamental weather. Clever despite their animalistic appearance, they love investigating new sights and sounds, and find buildings made by humanoids endlessly fascinating. Many follow storms, and unwittingly cause extraordinary amounts of damage as they tear holes in roofs or clog drains just as the rainfall reaches its peak. They love silver-which reminds them of rainfall-and can be easily bribed into abandoning their mischief for a handful of coins.\n\nBecause they&#x27;re fragile and lack an intrinsic link to the Elemental Planes to bind them together, mamiwas must rest by binding themselves into solid objects each day to maintain their forms, or else they must dedicate themselves to a greater power and beg enough elemental energy to remain coherent. Many find succor in Gozreh, but a few malicious mamiwas follow the elemental lords Hshurha or Kelizandri instead. Mamiwas can also obtain the energy they need to survive from mortal mages, and a neutral-aligned 7th-level spellcaster who has the Improved Familiar feat can gain a mamiwa as a familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Mamiwa CR 2\nSource Ire of the Storm pg. 63\nXP 600\nN Tiny outsider (air, elemental, native, water)\nInit +2; Senses darkvision 60 ft.; Perception +7\nDefense\nAC 15, touch 15, flat-footed 12 (+2 Dex, +1 dodge, +2 size)\nhp 19 (3d10+3)\nFort +4, Ref +5, Will +2\nImmune elemental traits; Resist cold or electricity 5\nWeaknesses vulnerable to fire\nOffense\nSpeed 20 ft., fly 50 ft. (perfect), swim 50 ft.\nMelee bite +7 (1d3-2)\nRanged elemental blast +7 (2d6 cold or electricity)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks elemental blast, elemental infusion\nStatistics\nStr 7, Dex 15, Con 12, Int 10, Wis 12, Cha 13\nBase Atk +3; CMB +3; CMD 12 (can't be tripped)\nFeats Dodge, Weapon Finesse\nSkills Acrobatics +8 (+0 when jumping), Fly +20, Knowledge (nature) +6, Perception +7, Survival +7 (+11 to predict the weather), Swim +12; Racial Modifiers -8 Acrobatics when jumping, +4 Survival to predict the weather\nLanguages Common; rain speaker, speak with animals\nSQ elemental alignment\nEcology\nEnvironment any\nOrganization solitary or stormfront (2-12)\nTreasure incidental\nSpecial Abilities\nElemental Alignment (Su) Each day at sunrise, a mamiwa must align itself toward either air or water. An air-aligned mamiwa gains electricity resistance 5, its elemental blast and elemental infusion abilities deal electricity damage, and it gains Auran as a bonus language. A mamiwa aligned with water instead gains cold resistance 5, deals cold damage with its attacks, and gains Aquan as a bonus language.\n\nElemental Blast (Su) A mamiwa can unleash a blast of elemental energy as a ranged touch attack. Creatures struck by this blast take 2d6 points of cold or electricity damage, depending on the mamiwa's elemental alignment for that day.\n\nElemental Infusion (Su) As a standard action, a mamiwa can join itself with a single weapon or suit of armor. A mamiwa cannot act while infusing an object, except to end the infusion, but does impart some of its elemental nature to whatever it inhabits. An infused weapon deals an additional 1d6 points of energy damage, while an infused suit of armor instead grants both the armor and its wearer energy resistance 5. The energy type of this bonus damage and resistance depends on the mamiwa's elemental alignment for that day. Each day, a mamiwa can maintain its elemental infusion for up to 1 minute per Hit Die. This time does not need to be consecutive, but must be used in 1-minute increments. If the infused object is destroyed, the mamiwa immediately appears adjacent to the wearer and is staggered for 1d6 rounds.\n\nRain Speaker (Ex) A mamiwa gains telepathy out to 100 feet in any sort of precipitation, but can communicate only with other creatures that are also being rained upon.\nDescription\nWhen powerful storms roll across the Material Plane, the elemental morass of air and water sometimes births mamiwas-curious and frantic little spirits of temperamental weather. Clever despite their animalistic appearance, they love investigating new sights and sounds, and find buildings made by humanoids endlessly fascinating. Many follow storms, and unwittingly cause extraordinary amounts of damage as they tear holes in roofs or clog drains just as the rainfall reaches its peak. They love silver-which reminds them of rainfall-and can be easily bribed into abandoning their mischief for a handful of coins.\n\nBecause they're fragile and lack an intrinsic link to the Elemental Planes to bind them together, mamiwas must rest by binding themselves into solid objects each day to maintain their forms, or else they must dedicate themselves to a greater power and beg enough elemental energy to remain coherent. Many find succor in Gozreh, but a few malicious mamiwas follow the elemental lords Hshurha or Kelizandri instead. Mamiwas can also obtain the energy they need to survive from mortal mages, and a neutral-aligned 7th-level spellcaster who has the Improved Familiar feat can gain a mamiwa as a familiar.</pre>\n        </div>\n    "
