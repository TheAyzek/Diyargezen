  - _id: yAjvg1ecKIytaUIX
    _key: '!actors.items!Ys7YwqxJ8osXiuga.yAjvg1ecKIytaUIX'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Elemental Alignment
    system:
      abilityType: su
      description:
        value: >-
          Each day at sunrise, a mamiwa must align itself toward either air or
          water. An air-aligned mamiwa gains electricity resistance 5, its
          elemental blast and elemental infusion abilities deal electricity
          damage, and it gains Auran as a bonus language. A mamiwa aligned with
          water instead gains cold resistance 5, deals cold damage with its
          attacks, and gains Aquan as a bonus language.
      subType: classFeat
    type: feat
  - _id: gYtrG5ngMxGENGnO
    _key: '!actors.items!Ys7YwqxJ8osXiuga.gYtrG5ngMxGENGnO'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Elemental Blast
    system:
      abilityType: su
      description:
        value: >-
          A mamiwa can unleash a blast of elemental energy as a ranged touch
          attack. Creatures struck by this blast take 2d6 points of cold or
          electricity damage, depending on the mamiwa's elemental alignment for
          that day.
      subType: classFeat
    type: feat
  - _id: 4iddu9BlJYMVmbRW
    _key: '!actors.items!Ys7YwqxJ8osXiuga.4iddu9BlJYMVmbRW'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Elemental Infusion
    system:
      abilityType: su
      description:
        value: >-
          As a standard action, a mamiwa can join itself with a single weapon or
          suit of armor. A mamiwa cannot act while infusing an object, except to
          end the infusion, but does impart some of its elemental nature to
          whatever it inhabits. An infused weapon deals an additional 1d6 points
          of energy damage, while an infused suit of armor instead grants both
          the armor and its wearer energy resistance 5. The energy type of this
          bonus damage and resistance depends on the mamiwa's elemental
          alignment for that day. Each day, a mamiwa can maintain its elemental
          infusion for up to 1 minute per Hit Die. This time does not need to be
          consecutive, but must be used in 1-minute increments. If the infused
          object is destroyed, the mamiwa immediately appears adjacent to the
          wearer and is staggered for 1d6 rounds.
      subType: classFeat
    type: feat
  - _id: MnxbQrdxP6l6xusA
    _key: '!actors.items!Ys7YwqxJ8osXiuga.MnxbQrdxP6l6xusA'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Rain Speaker
    system:
      abilityType: ex
      description:
        value: >-
          A mamiwa gains telepathy out to 100 feet in any sort of precipitation,
          but can communicate only with other creatures that are also being
          rained upon.
      subType: classFeat
    type: feat
