    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Faerie Dragon CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 3 pg. 91, Bonus Bestiary pg. 9<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CG \r\n            Tiny \r\n            Dragon <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +8; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 18, <strong>Touch</strong> 16, <strong>Flat-Footed</strong> 14 (+3 Dex, +1 dodge, +2 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 22 (3 HD; 3d12+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 6, <strong>Will</strong> 5\r\n            \r\n            \r\n            <strong>Immune</strong> paralysis, sleep; \r\n            \r\n            <strong>SR</strong> 13\r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (perfect)<br/>\r\n                <strong>Melee</strong> bite +4 (1d3-1)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 9, <strong>Dex</strong> 17, <strong>Con</strong> 13, <strong>Int</strong> 16, <strong>Wis</strong> 14, <strong>Cha</strong> 16<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 14<br/>\r\n            <strong>Feats</strong> Acrobatic, Dodge<br/>\r\n            <strong>Skills</strong> Acrobatics +8 (+0 when jumping), Bluff +9, Diplomacy +9, Fly +23, Perception +8, Sense Motive +8, Stealth +17, Swim +17, Use Magic Device +9<br/>\r\n            <strong>Languages</strong> Common, Draconic, Elven, Sylvan, telepathy 100 ft.<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate or warm forests<br/>\r\n                <strong>Organization</strong>: solitary or clan (2-8)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Breath Weapon (su): 5-foot cone, euphoria for 1d6 rounds, DC 12 Fortitude negates. Creatures affected by euphoria are staggered, sickened, and immune to fear effects for the duration. A faerie dragon can use this breath weapon once every 1d4 rounds. The save DC is Constitution-based.\n\nSpells: A faerie dragon casts spells as a 3rd-level sorcerer.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Related to pseudodragons, faerie dragons are whimsical, playful pranksters that spend most of their time either relaxing in cool forest glades or engaged in some sort of prank. Although such mischief is usually spontaneous, some faerie dragons have been known to spend months or even years in preparation of one truly spectacular joke.Travelers making their way through lands known to be inhabited by these good-natured-but sometimes annoying-tricksters are advised to keep up their guard lest they face all manner of creative annoyances (horses painted with berry juice, squirrels placed inside bedrolls, and clothing decorating high branches being a few examples).\n\nUnlike true dragons, faerie dragons do not grow larger with age, but their scales do change color, starting with red and moving through the rainbow to reach dark violet at old age. Faerie dragons grow in power as spellcasters as they age (typically gaining levels in sorcerer), learning more powerful spells to complement their innate abilities. The spells of faerie dragons tend to focus on tools that can be used to create or enhance pranks, and illusion and enchantment spells are particularly popular.\n\nFaerie dragons avoid combat unless there is no other option. If forced to fight, faerie dragons attempt to confound enemies rather than kill them, using both spells and breath weapon to weaken and scatter foes before fleeing. The only exception to this is when a faerie dragon&#x27;s clan or allies are in danger. As capricious as these tiny dragons can be, many prove quick to bond with goodly creatures, especially fey and others they find interesting or hilarious-adventurers often fall into this latter camp, particularly those most outraged by a faerie dragon&#x27;s tricks.\n\nFaerie dragons sometimes ally with spellcasters, serving as curious, occasionally reckless, but always true familiars. An Arcana spellcaster of at least 7th level with an alignment within 1 step of chaotic good who has the Improved Familiar feat may select a faerie dragon as a familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Faerie Dragon CR 2\nSource Bestiary 3 pg. 91, Bonus Bestiary pg. 9\nXP 600\nCG Tiny dragon\nInit +3; Senses darkvision 60 ft., low-light vision; Perception +8\nDefense\nAC 18, touch 16, flat-footed 14 (+3 Dex, +1 dodge, +2 natural, +2 size)\nhp 22 (3d12+3)\nFort +4, Ref +6, Will +5\nImmune paralysis, sleep; SR 13\nOffense\nSpeed 10 ft., fly 60 ft. (perfect), swim 30 ft.\nMelee bite +4 (1d3-1)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks breath weapon (5-ft. cone, euphoria, Fort DC 12 negates, usable every 1d4 rounds)\nSpell-Like Abilities (CL 3rd; concentration +6)\n3/day-greater invisibility (self only)\nSpells Known (CL 3rd; concentration +6)\n1st (6/day)-grease (DC 14), silent image (DC 14), sleep (DC 14)\n0 (at will)-dancing lights, flare (DC 13), ghost sound (DC 13), mage hand, open/close\nStatistics\nStr 9, Dex 17, Con 13, Int 16, Wis 14, Cha 16\nBase Atk +3; CMB +4; CMD 14 (18 vs. trip)\nFeats Acrobatic, Dodge\nSkills Acrobatics +8 (+0 when jumping), Bluff +9, Diplomacy +9, Fly +23, Perception +8, Sense Motive +8, Stealth +17, Swim +17, Use Magic Device +9\nLanguages Common, Draconic, Elven, Sylvan; telepathy 100 ft.\nEcology\nEnvironment temperate or warm forests\nOrganization solitary or clan (2-8)\nTreasure standard\nSpecial Abilities\nBreath Weapon (Su) 5-foot cone, euphoria for 1d6 rounds, DC 12 Fortitude negates. Creatures affected by euphoria are staggered, sickened, and immune to fear effects for the duration. A faerie dragon can use this breath weapon once every 1d4 rounds. The save DC is Constitution-based.\n\nSpells A faerie dragon casts spells as a 3rd-level sorcerer.\nDescription\nRelated to pseudodragons, faerie dragons are whimsical, playful pranksters that spend most of their time either relaxing in cool forest glades or engaged in some sort of prank. Although such mischief is usually spontaneous, some faerie dragons have been known to spend months or even years in preparation of one truly spectacular joke.Travelers making their way through lands known to be inhabited by these good-natured-but sometimes annoying-tricksters are advised to keep up their guard lest they face all manner of creative annoyances (horses painted with berry juice, squirrels placed inside bedrolls, and clothing decorating high branches being a few examples).\n\nUnlike true dragons, faerie dragons do not grow larger with age, but their scales do change color, starting with red and moving through the rainbow to reach dark violet at old age. Faerie dragons grow in power as spellcasters as they age (typically gaining levels in sorcerer), learning more powerful spells to complement their innate abilities. The spells of faerie dragons tend to focus on tools that can be used to create or enhance pranks, and illusion and enchantment spells are particularly popular.\n\nFaerie dragons avoid combat unless there is no other option. If forced to fight, faerie dragons attempt to confound enemies rather than kill them, using both spells and breath weapon to weaken and scatter foes before fleeing. The only exception to this is when a faerie dragon's clan or allies are in danger. As capricious as these tiny dragons can be, many prove quick to bond with goodly creatures, especially fey and others they find interesting or hilarious-adventurers often fall into this latter camp, particularly those most outraged by a faerie dragon's tricks.\n\nFaerie dragons sometimes ally with spellcasters, serving as curious, occasionally reckless, but always true familiars. An arcane spellcaster of at least 7th level with an alignment within 1 step of chaotic good who has the Improved Familiar feat may select a faerie dragon as a familiar.</pre>\n        </div>\n    "
