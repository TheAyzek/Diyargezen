    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Scarlet Spider CR 1/4 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Magic pg. 120<br/>\r\n            <strong>XP 100</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Vermin <br/>\r\n            <strong>Init</strong> 5;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +4; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 18, <strong>Touch</strong> 17, <strong>Flat-Footed</strong> 13 (+5 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 4 (1 HD; 1d8)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 5, <strong>Will</strong> 0\r\n            \r\n            \r\n            <strong>Immune</strong> mind-affecting effects; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.<br/>\r\n                <strong>Melee</strong> bite +7 (1d3-4 plus poison)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 3, <strong>Dex</strong> 21, <strong>Con</strong> 10, <strong>Int</strong> 0, <strong>Wis</strong> 10, <strong>Cha</strong> 2<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +3; <strong>CMD</strong> 9<br/>\r\n            <strong>Feats</strong> Weapon FinesseB<br/>\r\n            <strong>Skills</strong> Acrobatics +13, Climb +21, Perception +4, Stealth +17, Racial Modifiers +8 Acrobatics, +8 Climb, +4 Perception, +4 Stealth<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any<br/>\r\n                <strong>Organization</strong>: solitary, pair, or colony (3-8)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Poison (ex): Bite-injury; save Fort DC 10; frequency 1/round for 4 rounds; effect 1 Str; cure 1 save.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Scarlet spiders are small arachnids with bright red bodies and black legs. Because they are hunting spiders, scarlet spiders don&#x27;t have a web attack.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Scarlet Spider CR 1/4\nSource Ultimate Magic pg. 120\nXP 100\nN Tiny vermin\nInit +5; Senses darkvision 60 ft.; Perception +4\nDefense\nAC 18, touch 17, flat-footed 13 (+5 Dex, +1 natural, +2 size)\nhp 4 (1d8)\nFort +2, Ref +5, Will +0\nImmune mind-affecting effects\nOffense\nSpeed 30 ft., climb 30 ft.\nMelee bite +7 (1d3-4 plus poison)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks poison\nStatistics\nStr 3, Dex 21, Con 10, Int -, Wis 10, Cha 2\nBase Atk +0; CMB +3; CMD 9 (21 vs. trip)\nFeats Weapon FinesseB\nSkills Acrobatics +13, Climb +21, Perception +4, Stealth +17; Racial Modifiers +8 Acrobatics, +8 Climb, +4 Perception, +4 Stealth\nEcology\nEnvironment any\nOrganization solitary, pair, or colony (3-8)\nTreasure none\nSpecial Abilities\nPoison (Ex) Bite-injury; save Fort DC 10; frequency 1/round for 4 rounds; effect 1 Str; cure 1 save.\nDescription\nScarlet spiders are small arachnids with bright red bodies and black legs. Because they are hunting spiders, scarlet spiders don't have a web attack.</pre>\n        </div>\n    "
