  details:
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Pseudowyvern CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Legacy of Dragons pg. 27<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Dragon <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision, scent; Perception +7; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 15 (+2 Dex, +3 Natural, +2 Size)<br/>\r\n            <strong>Hit Points</strong> 22 (3 HD; 3d12+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 5, <strong>Will</strong> 4\r\n            \r\n            \r\n            <strong>Immune</strong> paralysis, sleep; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (good)<br/>\r\n                <strong>Melee</strong> sting +7 (1d2-1 plus poison), bite +7 (1d3-1)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 14, <strong>Con</strong> 13, <strong>Int</strong> 7, <strong>Wis</strong> 12, <strong>Cha</strong> 9<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +3; <strong>CMD</strong> 12<br/>\r\n            <strong>Feats</strong> Flyby Attack, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Fly +16, Perception +7, Sense Motive +7, Stealth +16<br/>\r\n            <strong>Languages</strong> Draconic<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate or warm forests or hills<br/>\r\n                <strong>Organization</strong>: solitary, pair, or flight (3-6)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Poison (ex): Sting-injury; save DC 12; frequency 1/round for 2 rounds; effect 1 Constitution damage; cure 1 save. The save DC is Constitution-based.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Pseudowyverns are distant relatives of wyverns, and while they are much smaller than their infamous cousins, they share many traits, including vicious tempers. These twolegged dragons sleep during the day and are most active in the twilight hours. They are voracious creatures, mainly hunting mammals, birds, and lizards of their own size, but sometimes attacking larger creatures such as goats and sheep. Pseudowyverns hardly ever kill people for food, but they sometimes attack intelligent creatures whose jewelry and other precious items they want to steal and hoard in their nests.\n\nPseudowyverns speak Draconic crudely, employing a series of screeches that even other dragons find jarring to hear. Thankfully, they are rarely talkative unless there is food, treasure, or danger nearby.\n\nIn some lands, nobles and wealthy merchants value pseudowyverns as exotic pets, and one of their eggs can fetch as much as 1,200 gp in some markets. In truth, these illtempered and stubborn creatures make poor pets; keeping them happy requires no small amount of flattery, delicious foods, and shiny things as bribes. Hard to please, they are likely to attack their owners and try to escape unless kept on a very short leash or managed by a skilled handler.\n\nA 7th-level spellcaster with the Improved Familiar feat can gain a pseudowyvern as a familiar. A pseudowyvern is about 1 foot long with a 2-foot-long tail, has scales in shades of deep blue, and weighs about 15 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Pseudowyvern CR 2\nSource Legacy of Dragons pg. 27\nXP 600\nN Tiny dragon\nInit +2; Senses darkvision 60 ft., low-light vision, scent; Perception +7\nDefense\nAC 17, touch 14, flat-footed 15 (+2 Dex, +3 Natural, +2 Size)\nhp 22 (3d12+3)\nFort +4, Ref +5, Will +4\nImmune paralysis, sleep\nOffense\nSpeed 10 ft., fly 60 ft. (good)\nMelee sting +7 (1d2-1 plus poison), bite +7 (1d3-1)\nSpace 2-1/2 ft., Reach 0ft. (5 ft. with sting)\nStatistics\nStr 8, Dex 14, Con 13, Int 7, Wis 12, Cha 9\nBase Atk +3; CMB +3; CMD 12\nFeats Flyby Attack, Weapon Finesse\nSkills Fly +16, Perception +7, Sense Motive +7, Stealth +16\nLanguages Draconic\nEcology\nEnvironment temperate or warm forests or hills\nOrganization solitary, pair, or flight (3-6)\nTreasure standard\nSpecial Abilities\nPoison (Ex) Sting-injury; save DC 12; frequency 1/round for 2 rounds; effect 1 Constitution damage; cure 1 save. The save DC is Constitution-based.\nDescription\nPseudowyverns are distant relatives of wyverns, and while they are much smaller than their infamous cousins, they share many traits, including vicious tempers. These twolegged dragons sleep during the day and are most active in the twilight hours. They are voracious creatures, mainly hunting mammals, birds, and lizards of their own size, but sometimes attacking larger creatures such as goats and sheep. Pseudowyverns hardly ever kill people for food, but they sometimes attack intelligent creatures whose jewelry and other precious items they want to steal and hoard in their nests.\n\nPseudowyverns speak Draconic crudely, employing a series of screeches that even other dragons find jarring to hear. Thankfully, they are rarely talkative unless there is food, treasure, or danger nearby.\n\nIn some lands, nobles and wealthy merchants value pseudowyverns as exotic pets, and one of their eggs can fetch as much as 1,200 gp in some markets. In truth, these illtempered and stubborn creatures make poor pets; keeping them happy requires no small amount of flattery, delicious foods, and shiny things as bribes. Hard to please, they are likely to attack their owners and try to escape unless kept on a very short leash or managed by a skilled handler.\n\nA 7th-level spellcaster with the Improved Familiar feat can gain a pseudowyvern as a familiar. A pseudowyvern is about 1 foot long with a 2-foot-long tail, has scales in shades of deep blue, and weighs about 15 pounds.</pre>\n        </div>\n    "
