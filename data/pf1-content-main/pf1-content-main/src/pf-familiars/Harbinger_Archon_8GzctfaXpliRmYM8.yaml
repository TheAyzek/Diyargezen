    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Harbinger Archon CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 3 pg. 18<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            LG \r\n            Tiny \r\n            Outsider (Archon, Extraplanar, Good, Lawful) <br/>\r\n            <strong>Init</strong> 6;\r\n            <strong>Senses</strong> darkvision 60 ft., detect evil, low-light vision; Perception +7; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 13 (+2 Dex, +1 dodge, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 16 (3 HD; 3d10)<br/>\r\n            <strong>Fort</strong> 1, <strong>Ref</strong> 5, <strong>Will</strong> 4;  +4 vs. poison\r\n            \r\n            <strong>DR</strong> 5/evil\r\n            <strong>Immune</strong> electricity, petrification; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 50 ft. (perfect)<br/>\r\n                <strong>Melee</strong> 3 blades +4 (1d4-1)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 15, <strong>Con</strong> 11, <strong>Int</strong> 10, <strong>Wis</strong> 13, <strong>Cha</strong> 12<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +3; <strong>CMD</strong> 12<br/>\r\n            <strong>Feats</strong> Dodge, Improved Initiative<br/>\r\n            <strong>Skills</strong> Diplomacy +7, Fly +20, Knowledge (planes) +6, Knowledge (religion) +6, Perception +7, Sense Motive +7<br/>\r\n            <strong>Languages</strong> Celestial, Draconic, Infernal, truespeech<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Heaven)<br/>\r\n                <strong>Organization</strong>: solitary, pair, or constellation (3-12)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Blades (ex): A harbinger can extend blades from its body to strike with as primary natural attacks. These blades possess a +1 enhancement bonus on attack and damage rolls, and are treated as both magic and good-aligned for the purposes of penetrating damage reduction.\n\nDisassemble (su): As a move-equivalent action, a harbinger can break apart into its components. This is treated as gaseous form, except the archon retains its full flight speed and DR, and cannot fit through gaps smaller than 1 inch in diameter. Reforming into an orrery is a standard action.\n\nMinor Archon (ex): Harbinger archons lack the aura of menace and teleport abilities of more powerful archons.\n\nWrath (su): Once per minute, a harbinger archon can emit a blast of energy that deals 2d6 points of force damage to adjacent creatures. A DC 12 Reflex save halves this damage. The harbinger can choose to omit any target from this blast that it desires, damaging only those foes it chooses. The save DC is Charisma-based.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Though counted among the least of the archons, harbingers nonetheless remain steadfast in their dedication to combating evil. These tiny beings serve as heralds and assistants for the forces of Heaven. While on the Material Plane, they advise mortals on how best to serve the causes of order and light. Some even venture to the other Outer Planes as minor ambassadors. Harbingers can also be bound into service as familiars, a role they accept eagerly, taking full responsibility for guiding their masters&#x27; souls toward salvation. A spellcaster must have the Improved Familiar feat, a lawful good alignment, and be an Arcana caster level of 7th or higher to gain a harbinger familiar.\n\nA harbinger resembles a whirling mechanical model of a planetary system. Its sun, moons, and planets are crafted of tiny glowing jewels whose color shifts with the harbinger&#x27;s mood. Electric arcs and sparks of magical essence dance between its whirling pieces. The harbinger can dismantle itself into its component parts to squeeze through tiny gaps, its rings dissolving into glowing vapor while its star and planets remain. Harbingers shed light as brightly as a torch under normal conditions, but can dim to a faint glow if desired, and frequently spin off bits of their essence into dancing lights.\n\nA harbinger archon&#x27;s voice resembles the ringing of a dozen tiny bells, and regardless of the language the archon speaks, it retains that tinkling musical quality.\n\nMost harbinger archons form from souls that led simple lives of wisdom and piety before their deaths. They remember nothing of their mortal existences, but retain a decidedly practical, if parochial, view of worldly matters. Only rarely does a harbinger want for a parable or proverb apropos to the task at hand.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Harbinger Archon CR 2\nSource Bestiary 3 pg. 18\nXP 600\nLG Tiny outsider (archon, extraplanar, good, lawful)\nInit +6; Senses darkvision 60 ft., detect evil, low-light vision; Perception +7\nDefense\nAC 16, touch 15, flat-footed 13 (+2 Dex, +1 dodge, +1 natural, +2 size)\nhp 16 (3d10)\nFort +1, Ref +5, Will +4; +4 vs. poison\nDR 5/evil; Immune electricity, petrification\nOffense\nSpeed fly 50 ft. (perfect)\nMelee 3 blades +4 (1d4-1)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks wrath\nSpell-Like Abilities (CL 6th; concentration +7)\nConstant-detect evil\nAt will-dancing lights (duration lasts until dismissed)\n3/day-cure light wounds, protection from evil\n1/week-commune (CL 12th, 6 questions)\nStatistics\nStr 6, Dex 15, Con 11, Int 10, Wis 13, Cha 12\nBase Atk +3; CMB +3; CMD 12\nFeats Dodge, Improved Initiative\nSkills Diplomacy +7, Fly +20, Knowledge (planes) +6, Knowledge (religion) +6, Perception +7, Sense Motive +7\nLanguages Celestial, Draconic, Infernal; truespeech\nSQ disassemble, minor archon\nEcology\nEnvironment any (Heaven)\nOrganization solitary, pair, or constellation (3-12)\nTreasure none\nSpecial Abilities\nBlades (Ex) A harbinger can extend blades from its body to strike with as primary natural attacks. These blades possess a +1 enhancement bonus on attack and damage rolls, and are treated as both magic and good-aligned for the purposes of penetrating damage reduction.\n\nDisassemble (Su) As a move-equivalent action, a harbinger can break apart into its components. This is treated as gaseous form, except the archon retains its full flight speed and DR, and cannot fit through gaps smaller than 1 inch in diameter. Reforming into an orrery is a standard action.\n\nMinor Archon (Ex) Harbinger archons lack the aura of menace and teleport abilities of more powerful archons.\n\nWrath (Su) Once per minute, a harbinger archon can emit a blast of energy that deals 2d6 points of force damage to adjacent creatures. A DC 12 Reflex save halves this damage. The harbinger can choose to omit any target from this blast that it desires, damaging only those foes it chooses. The save DC is Charisma-based.\nDescription\nThough counted among the least of the archons, harbingers nonetheless remain steadfast in their dedication to combating evil. These tiny beings serve as heralds and assistants for the forces of Heaven. While on the Material Plane, they advise mortals on how best to serve the causes of order and light. Some even venture to the other Outer Planes as minor ambassadors. Harbingers can also be bound into service as familiars, a role they accept eagerly, taking full responsibility for guiding their masters' souls toward salvation. A spellcaster must have the Improved Familiar feat, a lawful good alignment, and be an arcane caster level of 7th or higher to gain a harbinger familiar.\n\nA harbinger resembles a whirling mechanical model of a planetary system. Its sun, moons, and planets are crafted of tiny glowing jewels whose color shifts with the harbinger's mood. Electric arcs and sparks of magical essence dance between its whirling pieces. The harbinger can dismantle itself into its component parts to squeeze through tiny gaps, its rings dissolving into glowing vapor while its star and planets remain. Harbingers shed light as brightly as a torch under normal conditions, but can dim to a faint glow if desired, and frequently spin off bits of their essence into dancing lights.\n\nA harbinger archon's voice resembles the ringing of a dozen tiny bells, and regardless of the language the archon speaks, it retains that tinkling musical quality.\n\nMost harbinger archons form from souls that led simple lives of wisdom and piety before their deaths. They remember nothing of their mortal existences, but retain a decidedly practical, if parochial, view of worldly matters. Only rarely does a harbinger want for a parable or proverb apropos to the task at hand.</pre>\n        </div>\n    "
