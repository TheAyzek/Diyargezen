  details:
    alignment: ne
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Esipil, Sahkil CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 5 pg. 213<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            NE \r\n            Tiny \r\n            Outsider (Evil, Extraplanar, Sahkil) <br/>\r\n            <strong>Init</strong> 7;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +7; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 13 (+3 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 4, <strong>Will</strong> 4\r\n            \r\n            <strong>DR</strong> 5/good\r\n            <strong>Immune</strong> death effects, disease, fear effects, poison; \r\n            <strong>Resist</strong> cold 10, electricity 10, sonic 10; \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.<br/>\r\n                <strong>Melee</strong> bite +4 (1d4-1 plus grab), 2 claws +4 (1d3-1)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 16, <strong>Con</strong> 13, <strong>Int</strong> 9, <strong>Wis</strong> 12, <strong>Cha</strong> 12<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Improved Initiative, Skill Focus (Intimidate)<br/>\r\n            <strong>Skills</strong> Acrobatics +9, Intimidate +10, Knowledge (planes) +5, Perception +7, Stealth +17<br/>\r\n            <strong>Languages</strong> Abyssal, Celestial, Common, Infernal, telepathy (touch)<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Ethereal Plane)<br/>\r\n                <strong>Organization</strong>: solitary or pack (2-12)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Bewildering Assault (su): If an esipil makes a successful critical hit with one of its natural attacks, the target is confused for 1 round.\n\nLook of Fear (su): A creature affected by an esipil&#x27;s gaze is shaken for 1 round.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Esipils prey upon the unease that comes from living among beasts. The civilized world has domesticated animals, but those creatures are just a step away from wild animals, and esipils make sure that humanoids who live around them remember that. They ingratiate themselves with humanoids (particularly neutral evil spellcasters who might take them on as familiars) by acting like loving pets. They then delight in aggressive episodes, barking and snapping until called down by their masters. They return to a fawning obedience for a time-until the next inevitable outburst.\n\nInstead of gnashing jaws, an esipil&#x27;s bite involves a lashing mass of f leshy veins and viscera that can grasp at its opponent. Esipils use this attack to distract their opponents, savaging entangled victims with their vicious claw attacks until their masters pull them away.\n\nAlthough an esipil&#x27;s ability to frighten its victims is potent, it relies on its cause fear spell-like ability only when grossly outnumbered, outmatched, or greatly injured. Esipils like to fight and scrap with nearly anything, and prefer that their victims not simply f lee in terror, as they wish to savor the fear. Esipils use their telepathic abilities to harass would-be opponents into attacking them first, f linging mental taunts that are vulgar and disconcerting. Once they engage, they are resilient and dogged fighters. An esipil stands 1 foot tall at the shoulder, and its thin, wormlike body stretches nearly 3 feet long. An esipil weighs around 13 pounds.\n\nThough they make unruly companions, esipils actually enjoy serving those mightier than themselves, taking pride in their masters&#x27; power, even if they continue to snap and snarl when given commands. A neutral evil spellcaster of at least 7th level who takes the Improved Familiar feat can select an esipil as a familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Esipil, Sahkil CR 2\nSource Bestiary 5 pg. 213\nXP 600\nNE Tiny outsider (evil, extraplanar, sahkil)\nInit +7; Senses darkvision 60 ft., low-light vision; Perception +7\nDefense\nAC 16, touch 15, flat-footed 13 (+3 Dex, +1 natural, +2 size)\nhp 19 (3d10+3)\nFort +4, Ref +4, Will +4\nDR 5/good; Immune death effects, disease, fear effects, poison; Resist cold 10, electricity 10, sonic 10\nOffense\nSpeed 30 ft.\nMelee bite +4 (1d4-1 plus grab), 2 claws +4 (1d3-1)\nSpecial Attacks bewildering assault, grab (Small), look of fear (30 ft., DC 14), spirit touch\nSpell-Like Abilities (CL 3rd; concentration +4)\nAt will-cause fear (DC 14), mage hand\n3/day-mirror image\n1/week-contact other plane\nStatistics\nStr 8, Dex 16, Con 13, Int 9, Wis 12, Cha 12\nBase Atk +3; CMB +4; CMD 13\nFeats Improved Initiative, Skill Focus (Intimidate)\nSkills Acrobatics +9, Intimidate +10, Knowledge (planes) +5, Perception +7, Stealth +17\nLanguages Abyssal, Celestial, Common, Infernal; telepathy (touch)\nSQ change shape (tiny cat or dog; beast shape II) easy to call, emotional focus\nEcology\nEnvironment any (Ethereal Plane)\nOrganization solitary or pack (2-12)\nTreasure standard\nSpecial Abilities\nBewildering Assault (Su) If an esipil makes a successful critical hit with one of its natural attacks, the target is confused for 1 round.\nLook of Fear (Su) A creature affected by an esipil's gaze is shaken for 1 round.\nDescription\nEsipils prey upon the unease that comes from living among beasts. The civilized world has domesticated animals, but those creatures are just a step away from wild animals, and esipils make sure that humanoids who live around them remember that. They ingratiate themselves with humanoids (particularly neutral evil spellcasters who might take them on as familiars) by acting like loving pets. They then delight in aggressive episodes, barking and snapping until called down by their masters. They return to a fawning obedience for a time-until the next inevitable outburst.\n\nInstead of gnashing jaws, an esipil's bite involves a lashing mass of f leshy veins and viscera that can grasp at its opponent. Esipils use this attack to distract their opponents, savaging entangled victims with their vicious claw attacks until their masters pull them away.\n\nAlthough an esipil's ability to frighten its victims is potent, it relies on its cause fear spell-like ability only when grossly outnumbered, outmatched, or greatly injured. Esipils like to fight and scrap with nearly anything, and prefer that their victims not simply f lee in terror, as they wish to savor the fear. Esipils use their telepathic abilities to harass would-be opponents into attacking them first, f linging mental taunts that are vulgar and disconcerting. Once they engage, they are resilient and dogged fighters. An esipil stands 1 foot tall at the shoulder, and its thin, wormlike body stretches nearly 3 feet long. An esipil weighs around 13 pounds.\n\nThough they make unruly companions, esipils actually enjoy serving those mightier than themselves, taking pride in their masters' power, even if they continue to snap and snarl when given commands. A neutral evil spellcaster of at least 7th level who takes the Improved Familiar feat can select an esipil as a familiar.</pre>\n        </div>\n    "
