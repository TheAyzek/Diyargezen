    name: Curative Skin
    system:
      abilityType: su
      description:
        value: >-
          A nehushtan's bronze scales repel disease and poison. A nehushtan can
          treat diseases and poisons (as per the Heal skill) without attempting
          Heal checks merely by remaining in continuous physical contact with
          the creature to be treated for 10 minutes. Additionally, a creature
          that takes a nehushtan as a familiar gains a +2 bonus on saving throws
          against disease or poison so long as the nehushtan remains within 1
          mile of its master.
      subType: classFeat
    type: feat
