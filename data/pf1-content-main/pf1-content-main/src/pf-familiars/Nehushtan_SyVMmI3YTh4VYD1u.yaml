    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Nehushtan CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder #107: Scourge of the Godclaw pg. 86<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            NG \r\n            Tiny \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +8; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 18, <strong>Touch</strong> 16, <strong>Flat-Footed</strong> 14 (+3 Dex, +1 dodge, +2 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 6, <strong>Will</strong> 3\r\n            \r\n            \r\n            <strong>Immune</strong> disease, poison; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 15 ft.<br/>\r\n                <strong>Melee</strong> bite +3 (1d3-2 plus poison)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 7, <strong>Dex</strong> 17, <strong>Con</strong> 12, <strong>Int</strong> 10, <strong>Wis</strong> 15, <strong>Cha</strong> 12<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Dodge, Mobility<br/>\r\n            <strong>Skills</strong> Acrobatics +6, Climb +11, Perception +8, Stealth +17<br/>\r\n            <strong>Languages</strong> Common (can&#x27;t speak)<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm deserts and hills<br/>\r\n                <strong>Organization</strong>: solitary, pair, nest (1-2 plus 2-4 young), colony (4-6 plus 6-8 young)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Curative Skin (su): A nehushtan&#x27;s bronze scales repel disease and poison. A nehushtan can treat diseases and poisons (as per the Heal skill) without attempting Heal checks merely by remaining in continuous physical contact with the creature to be treated for 10 minutes. Additionally, a creature that takes a nehushtan as a familiar gains a +2 bonus on saving throws against disease or poison so long as the nehushtan remains within 1 mile of its master.\n\nPoison (ex): Injury-bite; save Fort DC 12; frequency 1/round for 6 rounds; effect 1d4 fire damage; cure 1 save.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">In many of Golarion&#x27;s cultures, serpents symbolize wisdom, medicine, and the healing arts. This association may have its roots in nehushtans, a rare breed of bronze-colored serpents prized and venerated for their miraculous curative powers. Nehushtans&#x27; lustrous scales contain potent curative properties, making the snakes&#x27; shed skin extremely valuable to healers and apothecaries. In regions where nehushtans live, desperately sick or poor people sometimes turn to scavenging the hills, hoping to find the discarded, metallic skins in order to either use them or sell them.\n\nWere it not for their peculiarly metallic scales, nehushtans would be virtually indistinguishable from vipers of comparable size. A nehushtan&#x27;s body is 4 to 5 feet long, and it weighs 5 to 7 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Nehushtan CR 2\nSource Pathfinder #107: Scourge of the Godclaw pg. 86\nXP 600\nNG Tiny magical beast\nInit +3; Senses darkvision 60 ft., low-light vision; Perception +8\nDefense\nAC 18, touch 16, flat-footed 14 (+3 Dex, +1 dodge, +2 natural, +2 size)\nhp 19 (3d10+3)\nFort +4, Ref +6, Will +3\nImmune disease, poison\nOffense\nSpeed 30 ft., climb 15 ft.\nMelee bite +3 (1d3-2 plus poison)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks poison\nSpell-Like Abilities (CL 3rd; concentration +4)\nAt will-diagnose diseaseUM, speak with animals (snakes only)\n3/day-hypnotism (DC 12), remove sicknessUM, sanctuary (DC 12)\n1/day-neutralize poison, remove disease\nStatistics\nStr 7, Dex 17, Con 12, Int 10, Wis 15, Cha 12\nBase Atk +3; CMB +4; CMD 13 (can't be tripped)\nFeats Dodge, Mobility\nSkills Acrobatics +6, Climb +11, Perception +8, Stealth +17\nLanguages Common (can't speak)\nSQ curative skin\nEcology\nEnvironment warm deserts and hills\nOrganization solitary, pair, nest (1-2 plus 2-4 young), colony (4-6 plus 6-8 young)\nTreasure none\nSpecial Abilities\nCurative Skin (Su) A nehushtan's bronze scales repel disease and poison. A nehushtan can treat diseases and poisons (as per the Heal skill) without attempting Heal checks merely by remaining in continuous physical contact with the creature to be treated for 10 minutes. Additionally, a creature that takes a nehushtan as a familiar gains a +2 bonus on saving throws against disease or poison so long as the nehushtan remains within 1 mile of its master.\n\nA creature with at least 1 rank in Heal can use skin shed by a nehushtan to craft a draught that, when consumed, functions as either a potion of remove disease or a potion of neutralize poison, as chosen by the crafter. A nehushtan sheds enough skin to craft a single draught every 3 months, and crafting this draught takes 10 minutes.\n\nPoison (Ex) Injury-bite; save Fort DC 12; frequency 1/round for 6 rounds; effect 1d4 fire damage; cure 1 save.\nDescription\nIn many of Golarion's cultures, serpents symbolize wisdom, medicine, and the healing arts. This association may have its roots in nehushtans, a rare breed of bronze-colored serpents prized and venerated for their miraculous curative powers. Nehushtans' lustrous scales contain potent curative properties, making the snakes' shed skin extremely valuable to healers and apothecaries. In regions where nehushtans live, desperately sick or poor people sometimes turn to scavenging the hills, hoping to find the discarded, metallic skins in order to either use them or sell them.\n\nWere it not for their peculiarly metallic scales, nehushtans would be virtually indistinguishable from vipers of comparable size. A nehushtan's body is 4 to 5 feet long, and it weighs 5 to 7 pounds.</pre>\n        </div>\n    "
