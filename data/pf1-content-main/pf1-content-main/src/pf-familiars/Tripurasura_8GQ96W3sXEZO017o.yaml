  details:
    alignment: le
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Tripurasura CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 3 pg. 24<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            LE \r\n            Tiny \r\n            Outsider (Asura, Evil, Extraplanar, Lawful) <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> darkvision 60 ft., detect magic; Perception +10; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 16, <strong>Flat-Footed</strong> 13 (+2 Dex, +1 dodge, +1 insight, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3);  fast healing 2<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 3, <strong>Will</strong> 5\r\n            \r\n            <strong>DR</strong> 5/cold iron or good\r\n            <strong>Immune</strong> curse effects, disease, poison; \r\n            <strong>Resist</strong> acid 10, electricity 10; \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> <br/>\r\n                <strong>Melee</strong> sting +7 (1d4-1 plus poison)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 14, <strong>Con</strong> 12, <strong>Int</strong> 13, <strong>Wis</strong> 15, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +3; <strong>CMD</strong> 14<br/>\r\n            <strong>Feats</strong> Dodge, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Acrobatics +8 (+4 when jumping), Appraise +4, Bluff +7, Escape Artist +8, Knowledge (arcana) +4, Knowledge (planes) +7, Perception +10, Perform (dance) +5, Spellcraft +4, Stealth +14, Racial Modifiers -4 Acrobatics when jumping, +6 Escape Artist, +4 Perception<br/>\r\n            <strong>Languages</strong> Common, Infernal<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Hell)<br/>\r\n                <strong>Organization</strong>: solitary, pair, or gang (3-10)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Change Shape (su): The tripurasura has only one alternative form-when it uses change shape, it always appears as the same Small humanoid. Most take the form of gnomes or human children.\n\nElusive (su): The tripurasura and items it carries are considered to be under the effects of a nondetection spell. A caster must succeed at a DC 14 caster level check to overcome this effect.\n\nPoison (ex): Tongue-injury; save Fort DC 12; frequency 1/round for 6 rounds; effect 1d2 Wis damage; cure 1 save.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Tripurasuras, or sly ones, are among the weakest asuras, manifestations not of divine mistakes but instead creations of the most powerful of asuras exhibiting their loathing of the gods by creating blasphemous mockeries of their creations. A newly created tripurasura most commonly exists for one of two reasons: to give an asurendra sage the raw materials it needs to create more powerful asuras, or to seek out mortals-especially mortal spellcasters-to recruit into the asura cause.\n\nUsing its power to assume a pleasing or innocuous form, a tripurasura wanders the world, seeking pious mortals to corrupt. When it encounters a promising spellcaster (typically one who has some sort of link to a church or religion, but not necessarily a divine spellcaster), the tripurasura presents itself as an apprentice, pilgrim, or other type of curious student eager to learn from the spellcaster. The tripurasura keeps its true nature and its powers hidden, and seeks opportunities to steer its &#x27;master&#x27; away from decisions it might have made in good conscience to acts that promote the collapse of religious belief, faith, and society. When, as it inevitably does, the wayward spellcaster runs afoul of justice or is confronted by those seeking revenge, the tripurasura fades away to watch the final stage of the spellcaster&#x27;s fall from grace, then seeks a new victim in another city or region.\n\nSome spellcasters, on the other hand, actually seek out these tiny fiends to employ as familiars. A tripurasura greatly values these opportunities, since it need not abandon its master once its work is done and can continue to spread its agenda for as long as its master survives. A spellcaster must be lawful evil, at least 7th level, and have the Improved Familiar feat to gain a tripurasura as a familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Tripurasura CR 2\nSource Bestiary 3 pg. 24\nXP 600\nLE Tiny outsider (asura, evil, extraplanar, lawful)\nInit +2; Senses darkvision 60 ft., detect magic; Perception +10\nDefense\nAC 16, touch 16, flat-footed 13 (+2 Dex, +1 dodge, +1 insight, +2 size)\nhp 19 (3d10+3); fast healing 2\nFort +4, Ref +3, Will +5\nDR 5/cold iron or good; Immune curse effects, disease, poison; Resist acid 10, electricity 10\nOffense\nSpeed 20 ft.\nMelee sting +7 (1d4-1 plus poison)\nSpell-Like Abilities (CL 6th; concentration +7)\nConstant-detect magic\nAt will-feather fall\n3/day-levitate, locate object, spider climb\n1/week-commune (6 questions, CL 12th)\nStatistics\nStr 8, Dex 14, Con 12, Int 13, Wis 15, Cha 13\nBase Atk +3; CMB +3; CMD 14\nFeats Dodge, Weapon Finesse\nSkills Acrobatics +8 (+4 when jumping), Appraise +4, Bluff +7, Escape Artist +8, Knowledge (arcana) +4, Knowledge (planes) +7, Perception +10, Perform (dance) +5, Spellcraft +4, Stealth +14; Racial Modifiers -4 Acrobatics when jumping, +6 Escape Artist, +4 Perception\nLanguages Common, Infernal\nSQ change shape (any Small humanoid; alter self), elusive\nEcology\nEnvironment any (Hell)\nOrganization solitary, pair, or gang (3-10)\nTreasure standard\nSpecial Abilities\nChange Shape (Su) The tripurasura has only one alternative form-when it uses change shape, it always appears as the same Small humanoid. Most take the form of gnomes or human children.\n\nElusive (Su) The tripurasura and items it carries are considered to be under the effects of a nondetection spell. A caster must succeed at a DC 14 caster level check to overcome this effect.\n\nPoison (Ex) Tongue-injury; save Fort DC 12; frequency 1/round for 6 rounds; effect 1d2 Wis damage; cure 1 save.\nDescription\nTripurasuras, or sly ones, are among the weakest asuras, manifestations not of divine mistakes but instead creations of the most powerful of asuras exhibiting their loathing of the gods by creating blasphemous mockeries of their creations. A newly created tripurasura most commonly exists for one of two reasons: to give an asurendra sage the raw materials it needs to create more powerful asuras, or to seek out mortals-especially mortal spellcasters-to recruit into the asura cause.\n\nUsing its power to assume a pleasing or innocuous form, a tripurasura wanders the world, seeking pious mortals to corrupt. When it encounters a promising spellcaster (typically one who has some sort of link to a church or religion, but not necessarily a divine spellcaster), the tripurasura presents itself as an apprentice, pilgrim, or other type of curious student eager to learn from the spellcaster. The tripurasura keeps its true nature and its powers hidden, and seeks opportunities to steer its 'master' away from decisions it might have made in good conscience to acts that promote the collapse of religious belief, faith, and society. When, as it inevitably does, the wayward spellcaster runs afoul of justice or is confronted by those seeking revenge, the tripurasura fades away to watch the final stage of the spellcaster's fall from grace, then seeks a new victim in another city or region.\n\nSome spellcasters, on the other hand, actually seek out these tiny fiends to employ as familiars. A tripurasura greatly values these opportunities, since it need not abandon its master once its work is done and can continue to spread its agenda for as long as its master survives. A spellcaster must be lawful evil, at least 7th level, and have the Improved Familiar feat to gain a tripurasura as a familiar.</pre>\n        </div>\n    "
