  details:
    cr:
      base: 0.125
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Kakapo CR 1/8 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 198, Familiar Folio pg. 24<br/>\r\n            <strong>XP 50</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> low-light vision; Perception +3; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 13, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 12 (+1 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 4 (1 HD; 1d8)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 5, <strong>Will</strong> 1\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 10 ft.; glide<br/>\r\n                <strong>Melee</strong> bite -2 (1d3-4)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 3, <strong>Dex</strong> 13, <strong>Con</strong> 10, <strong>Int</strong> 2, <strong>Wis</strong> 8, <strong>Cha</strong> 12<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-1; <strong>CMD</strong> 5<br/>\r\n            <strong>Feats</strong> Lightning Reflexes<br/>\r\n            <strong>Skills</strong> Climb +4, Perception +3<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm jungles<br/>\r\n                <strong>Organization</strong>: solitary, pair, or family (3-4)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Glide (ex): Though it cannot fly, a kakapo can spread its wings midfall to glide safely to the ground without taking damage. For every 10 feet it falls, a kakapo can move 5 feet horizontally in midair. For instance, a kakapo falling a vertical distance of 20 feet can move 10 feet horizontally.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">The kakapo is a small, flightless parrot native to tropical islands. Primarily nocturnal creatures, the birds come out at night to forage for fruits, nuts, plants, and seeds. Kakapos can live to be over 100 years old, breeding only two or three times per decade.\n\nA kakapo is roughly 2 feet long from beak to tail tip and can weigh up to 9 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Kakapo CR 1/8\nSource Ultimate Wilderness pg. 198, Familiar Folio pg. 24\nXP 50\nN Tiny animal\nInit +1; Senses low-light vision; Perception +3\nDefense\nAC 13, touch 13, flat-footed 12 (+1 Dex, +2 size)\nhp 4 (1d8)\nFort +2, Ref +5, Will -1\nOffense\nSpeed 30 ft., climb 10 ft.; glide\nMelee bite -2 (1d3-4)\nSpace 2-1/2 ft., Reach 0 ft.\nStatistics\nStr 3, Dex 13, Con 10, Int 2, Wis 8, Cha 12\nBase Atk +0; CMB -1; CMD 5\nFeats Lightning Reflexes\nSkills Climb +4, Perception +3\nEcology\nEnvironment warm jungles\nOrganization solitary, pair, or family (3-4)\nTreasure none\nSpecial Abilities\nGlide (Ex) Though it cannot fly, a kakapo can spread its wings midfall to glide safely to the ground without taking damage. For every 10 feet it falls, a kakapo can move 5 feet horizontally in midair. For instance, a kakapo falling a vertical distance of 20 feet can move 10 feet horizontally.\nDescription\nThe kakapo is a small, flightless parrot native to tropical islands. Primarily nocturnal creatures, the birds come out at night to forage for fruits, nuts, plants, and seeds. Kakapos can live to be over 100 years old, breeding only two or three times per decade.\n\nA kakapo is roughly 2 feet long from beak to tail tip and can weigh up to 9 pounds.</pre>\n        </div>\n    "
