    name: Glide
    system:
      abilityType: ex
      description:
        value: >-
          Though it cannot fly, a kakapo can spread its wings midfall to glide
          safely to the ground without taking damage. For every 10 feet it
          falls, a kakapo can move 5 feet horizontally in midair. For instance,
          a kakapo falling a vertical distance of 20 feet can move 10 feet
          horizontally.
