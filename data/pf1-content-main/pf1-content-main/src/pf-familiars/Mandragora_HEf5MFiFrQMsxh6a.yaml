  details:
    alignment: ce
    cr:
      base: 4
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Mandragora CR 4 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 2 pg. 185, Pathfinder #17: A Memory of Darkness pg. 84<br/>\r\n            <strong>XP 1,200</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CE \r\n            Small \r\n            Plant <br/>\r\n            <strong>Init</strong> 4;\r\n            <strong>Senses</strong> low-light vision; Perception +9; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 13 (+4 Dex, +2 natural, +1 size)<br/>\r\n            <strong>Hit Points</strong> 37 (5 HD; 5d8+15)<br/>\r\n            <strong>Fort</strong> 7, <strong>Ref</strong> 7, <strong>Will</strong> 2\r\n            \r\n            \r\n            <strong>Immune</strong> plant traits; \r\n            <strong>Resist</strong> acid 5, cold 5, electricity 10; \r\n            \r\n            \r\n            <br/><strong>Weaknesses</strong> \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 10 ft.<br/>\r\n                <strong>Melee</strong> bite +8 (1d6+2 plus grab), 2 slam +8 (1d4+2 plus poison)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 15, <strong>Dex</strong> 18, <strong>Con</strong> 17, <strong>Int</strong> 8, <strong>Wis</strong> 13, <strong>Cha</strong> 10<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 18<br/>\r\n            <strong>Feats</strong> Lightning Reflexes, Skill Focus (Perception), Weapon Finesse<br/>\r\n            <strong>Skills</strong> Climb +10, Perception +9, Stealth +14 (+22 in vegetation), Racial Modifiers +8 Stealth in vegetation<br/>\r\n            <strong>Languages</strong> Abyssal, Common<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: cold or temperate forests<br/>\r\n                <strong>Organization</strong>: solitary, pair, or grove (3-12)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Poison (ex): Slam-injury; save Fort DC 15; frequency 1/round for 4 rounds; effect confusion and fatigue; cure no saves but &#x27;act normally&#x27; result on the confusion behavior table ends the effect.\n\nShriek (su): Once per day as a standard action, a mandragora can give voice to an unsettling shriek. All creatures within a 30-foot spread of a shrieking mandragora must make a DC 15 Will save or become nauseated for 1d4 rounds. This is a sonic, mind-affecting ability. The save DC is Constitution-based.\n\nVulnerable to Supernatural Darkness (ex): In areas of supernatural darkness (such as those created by deeper darkness, but not by darkness), a mandragora is slowed, as the slow spell.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">A mandragora rises spontaneously from a mandrake root that has drawn nutrition from the corpse or ichor of a demon. A typical mandragora stands at just over 3 feet tall and only weighs 30 pounds. However, its size hides the creature&#x27;s fantastic strength and brutality. When a mandragora attacks, its fingers grow into whipping, thorny vines nearly 10 feet long, with which it makes its slam attacks.\n\nA mandragora rarely strays far from its lair amid tangled roots or vines, but when it encounters any other creature, it attacks regardless of the odds. However, a mandragora can usually recognize druids and does not attack them or their animal companions unless they attack it first. It has no qualms about attacking a druid&#x27;s allies.\n\nWhen mandragora poison is mixed with its thick, gooey, sap-like blood and 1,000 gp worth of alchemical reagents, the resulting fluid can be used as a focus for the scrying spell. The fluid only lasts for the duration of the spell&#x27;s casting time and resulting effects but the subject of the spell takes a -4 penalty on the save to resist it.\n\nA mandrake root that is growing on or near a demon&#x27;s corpse or ichor has a 2% chance of awakening as a mandragora within a day of first absorbing the tainted material. A creature that wants to create a mandragora can do so with alchemy; the process requires a day of work, a mandrake root, several pints of ichor or the body of a demon of CR 6 or above, and a successful DC 25 Craft (alchemy) check. The newly created mandragora is hostile, even to its creator.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Mandragora CR 4\nSource Bestiary 2 pg. 185, Pathfinder #17: A Memory of Darkness pg. 84\nXP 1,200\nCE Small plant\nInit +4; Senses low-light vision; Perception +9\nDefense\nAC 17, touch 15, flat-footed 13 (+4 Dex, +2 natural, +1 size)\nhp 37 (5d8+15)\nFort +7, Ref +7, Will +2\nImmune plant traits; Resist acid 5, cold 5, electricity 10\nWeaknesses vulnerable to supernatural darkness\nOffense\nSpeed 40 ft., burrow 10 ft., climb 40 ft.\nMelee bite +8 (1d6+2 plus grab), 2 slam +8 (1d4+2 plus poison)\nSpace 5 ft., Reach 5 ft. (10 ft. with slam)\nSpecial Attacks blood drain (1d2 Constitution), shriek\nStatistics\nStr 15, Dex 18, Con 17, Int 8, Wis 13, Cha 10\nBase Atk +3; CMB +4 (+8 grapple); CMD 18\nFeats Lightning Reflexes, Skill Focus (Perception), Weapon Finesse\nSkills Climb +10, Perception +9, Stealth +14 (+22 in vegetation); Racial Modifiers +8 Stealth in vegetation\nLanguages Abyssal, Common\nEcology\nEnvironment cold or temperate forests\nOrganization solitary, pair, or grove (3-12)\nTreasure standard\nSpecial Abilities\nPoison (Ex) Slam-injury; save Fort DC 15; frequency 1/round for 4 rounds; effect confusion and fatigue; cure no saves but 'act normally' result on the confusion behavior table ends the effect.\n\nShriek (Su) Once per day as a standard action, a mandragora can give voice to an unsettling shriek. All creatures within a 30-foot spread of a shrieking mandragora must make a DC 15 Will save or become nauseated for 1d4 rounds. This is a sonic, mind-affecting ability. The save DC is Constitution-based.\n\nVulnerable to Supernatural Darkness (Ex) In areas of supernatural darkness (such as those created by deeper darkness, but not by darkness), a mandragora is slowed, as the slow spell.\nDescription\nA mandragora rises spontaneously from a mandrake root that has drawn nutrition from the corpse or ichor of a demon. A typical mandragora stands at just over 3 feet tall and only weighs 30 pounds. However, its size hides the creature's fantastic strength and brutality. When a mandragora attacks, its fingers grow into whipping, thorny vines nearly 10 feet long, with which it makes its slam attacks.\n\nA mandragora rarely strays far from its lair amid tangled roots or vines, but when it encounters any other creature, it attacks regardless of the odds. However, a mandragora can usually recognize druids and does not attack them or their animal companions unless they attack it first. It has no qualms about attacking a druid's allies.\n\nWhen mandragora poison is mixed with its thick, gooey, sap-like blood and 1,000 gp worth of alchemical reagents, the resulting fluid can be used as a focus for the scrying spell. The fluid only lasts for the duration of the spell's casting time and resulting effects but the subject of the spell takes a -4 penalty on the save to resist it.\n\nA mandrake root that is growing on or near a demon's corpse or ichor has a 2% chance of awakening as a mandragora within a day of first absorbing the tainted material. A creature that wants to create a mandragora can do so with alchemy; the process requires a day of work, a mandrake root, several pints of ichor or the body of a demon of CR 6 or above, and a successful DC 25 Craft (alchemy) check. The newly created mandragora is hostile, even to its creator.</pre>\n        </div>\n    "
