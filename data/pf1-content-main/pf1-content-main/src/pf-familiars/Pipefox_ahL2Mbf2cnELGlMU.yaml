  details:
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Pipefox CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 4 pg. 215<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Diminutive \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 7;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 17, <strong>Flat-Footed</strong> 13 (+3 Dex, +4 size)<br/>\r\n            <strong>Hit Points</strong> 13 (3 HD; 3d10-3)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 6, <strong>Will</strong> 1\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> bite +10 (1d2-5)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 1, <strong>Dex</strong> 16, <strong>Con</strong> 9, <strong>Int</strong> 14, <strong>Wis</strong> 11, <strong>Cha</strong> 14<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +2; <strong>CMD</strong> 8<br/>\r\n            <strong>Feats</strong> Improved Initiative, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Climb +7, Knowledge (arcana) +5, Knowledge (religion) +5, Perception +5, Sense Motive +2, Stealth +19<br/>\r\n            <strong>Languages</strong> Common, Draconic, comprehend languages<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any<br/>\r\n                <strong>Organization</strong>: solitary<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">A pipefox is a foot-long, furry, magical snake with the head of a fox. Often found either climbing in trees or snaking around pipes, these curious and stealthy creatures prefer to skulk about to observe and learn. Neither malicious nor particularly beneficial, pipefoxes love to gather knowledge and sometimes disseminate what they&#x27;ve acquired to those they find worthy.\n\nDesirous of knowledge, no matter how obscure, these creatures only see other like-minded creatures worthy of their interaction. Though they might become curious about a tribe of barbarians, take sudden interest in learning the cant of a local group of thieves, or even study the method of distribution for the local brewery, they watch such things from a distance, never interacting with such &#x27;lesser minds.&#x27; But if a pipefox finds a creature that loves knowledge as much as it does, it becomes intrigued, and after spending a period of time observing such a creature, will eventually muster up the courage to make the relationship more personal. Many pipefoxes are especially intrigued by spellcasters, and sometimes they offer to serve them as either familiars or confidants.\n\nPipefoxes are secretive by nature, and even when they make themselves known, they can be shy and evasive, both physically and intellectually. They often see knowledge as a type of spiritual currency, and are hesitant to give their knowledge away unless they gain something in return.\n\nSome believe pipefoxes are the spirits of legendary scribes and lore masters given new form. Others believe the creatures are related to kami, and serve to preserve the world&#x27;s knowledge.\n\nA spellcaster of at least 7th level who has the Improved Familiar feat may select the pipefox as a familiar, but only after the pipefox has agreed to pledge its services to the spellcaster.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Pipefox CR 2\nSource Bestiary 4 pg. 215\nXP 600\nN Diminutive magical beast\nInit +7; Senses darkvision 60 ft., low-light vision; Perception +5\nDefense\nAC 17, touch 17, flat-footed 13 (+3 Dex, +4 size)\nhp 13 (3d10-3)\nFort +2, Ref +6, Will +1\nOffense\nSpeed 30 ft., climb 20 ft.\nMelee bite +10 (1d2-5)\nSpace 1 ft., Reach 0 ft.\nSpell-Like Abilities (CL 3rd; concentration +5)\nConstant-comprehend languages\n3/day-augury, vanishAPG\n1/day-detect thoughts (DC 14), divination, greater invisibility (self only)\nStatistics\nStr 1, Dex 16, Con 9, Int 14, Wis 11, Cha 14\nBase Atk +3; CMB +2; CMD 8\nFeats Improved Initiative, Weapon Finesse\nSkills Climb +7, Knowledge (arcana) +5, Knowledge (religion) +5, Perception +5, Sense Motive +2, Stealth +19\nLanguages Common, Draconic; comprehend languages\nSQ compression\nEcology\nEnvironment any\nOrganization solitary\nTreasure standard\nDescription\nA pipefox is a foot-long, furry, magical snake with the head of a fox. Often found either climbing in trees or snaking around pipes, these curious and stealthy creatures prefer to skulk about to observe and learn. Neither malicious nor particularly beneficial, pipefoxes love to gather knowledge and sometimes disseminate what they've acquired to those they find worthy.\n\nDesirous of knowledge, no matter how obscure, these creatures only see other like-minded creatures worthy of their interaction. Though they might become curious about a tribe of barbarians, take sudden interest in learning the cant of a local group of thieves, or even study the method of distribution for the local brewery, they watch such things from a distance, never interacting with such 'lesser minds.' But if a pipefox finds a creature that loves knowledge as much as it does, it becomes intrigued, and after spending a period of time observing such a creature, will eventually muster up the courage to make the relationship more personal. Many pipefoxes are especially intrigued by spellcasters, and sometimes they offer to serve them as either familiars or confidants.\n\nPipefoxes are secretive by nature, and even when they make themselves known, they can be shy and evasive, both physically and intellectually. They often see knowledge as a type of spiritual currency, and are hesitant to give their knowledge away unless they gain something in return.\n\nSome believe pipefoxes are the spirits of legendary scribes and lore masters given new form. Others believe the creatures are related to kami, and serve to preserve the world's knowledge.\n\nA spellcaster of at least 7th level who has the Improved Familiar feat may select the pipefox as a familiar, but only after the pipefox has agreed to pledge its services to the spellcaster.</pre>\n        </div>\n    "
