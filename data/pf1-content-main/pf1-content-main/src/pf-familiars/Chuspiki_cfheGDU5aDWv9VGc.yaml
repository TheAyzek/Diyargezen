    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Chuspiki CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 5 pg. 56<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CN \r\n            Tiny \r\n            Magical Beast (Air) <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision, scent; Perception +3; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 12 (+3 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 6, <strong>Will</strong> 0\r\n            <br/><strong>Defensive Abilities</strong> wind blessed, wind form; \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (perfect)<br/>\r\n                <strong>Melee</strong> tail fan +8 (1d4-2/x3)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 17, <strong>Con</strong> 12, <strong>Int</strong> 12, <strong>Wis</strong> 9, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 12<br/>\r\n            <strong>Feats</strong> Point-Blank Shot, Precise Shot, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Acrobatics +9, Fly +13, Perception +3, Stealth +16<br/>\r\n            <strong>Languages</strong> Auran, Common<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm hills or mountains<br/>\r\n                <strong>Organization</strong>: solitary, pair, or flock (6-10)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Air Blast (sp): A chuspiki can make a ranged attack with an intense air blast, as the kineticist wild talent of the same name, using its Hit Dice as its kineticist level.\n\nBasic Aerokinesis (sp): A chuspiki can use basic aerokinesis, as the kineticist wild talent of the same name.\n\nWind Blessed (su): A chuspiki is treated as a Large creature for the purposes of determining the effects wind has upon it.\n\nWind Form (su): Three times per day as an immediate action, a chuspiki can become insubstantial for 1 round. It gains DR 10/magic and becomes immune to poison, sneak attacks, and critical hits. It can&#x27;t attack or use any of its spell-like abilities while in wind form, with the exception of basic aerokinesis.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Chuspikis are intelligent, mouselike creatures covered in a coat of downy tan fur which makes them appear much larger than they actually are. A chuspiki&#x27;s tail is substantially longer than the rest of its body, fanning out into a sail-like structure. The base of its tail is strong and flexible, allowing the chuspiki to whip around the fan at the tip with surprising speed. It can use this motion to create concussive blasts of air, or to scratch opponents with barbs on the underside of its tail bones.\n\nLike the wind itself, chuspikis are always moving. Chuspikis soar through the air, riding their fans like gliders and summoning minor gusts to steer their flight. They rest in short bursts, napping for just an hour at a time.\n\nWhenever they can, chuspikis seek out new experiences. They are social creatures that prefer to travel with others of their kind, or with members of other species. Chuspikis feel an especially strong connection with other creatures who share their bond with the skies, such as air elementals and sylphs. Chuspikis enjoy exploring unique locations, and when they find a particularly fascinating site, they announce their find on the winds to encourage others to share in their discovery. A mysterious disembodied voice promising glorious adventure may very well be a chuspiki; however, the playful creatures are just as likely to play pranks on hapless passersby as they are to provide legitimate guidance.\n\nA typical chuspiki is 1 foot long, with its tail extending out an additional 5 feet, and weighs 1 pound. Its bones are hollow, like a bird&#x27;s.\n\nA chuspiki will sometimes ally with a spellcaster as a familiar. A chaotic spellcaster can gain a chuspiki as a familiar at 7th level by taking the Improved Familiar feat.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Chuspiki CR 2\nSource Bestiary 5 pg. 56\nXP 600\nCN Tiny magical beast (air)\nInit +3; Senses darkvision 60 ft., low-light vision, scent; Perception +3\nDefense\nAC 15, touch 15, flat-footed 12 (+3 Dex, +2 size)\nhp 19 (3d10+3)\nFort +4, Ref +6, Will +0\nDefensive Abilities wind blessed, wind form\nOffense\nSpeed 30 ft., fly 60 ft. (perfect)\nMelee tail fan +8 (1d4-2/x3)\nRanged air blast +8 (2d6+3)\nSpace 2-1/2 ft., Reach 0 ft. (5 ft. with tail fan)\nSpell-Like Abilities (CL 3rd; concentration +4)\nConstant-feather fall\nPsychic Magic (CL 3rd; concentration +4)\n5 PE-alter winds (1 PE, DC 12), gust of wind (2 PE, DC 13), whispering wind (2 PE)\nStatistics\nStr 6, Dex 17, Con 12, Int 12, Wis 9, Cha 13\nBase Atk +3; CMB +4; CMD 12 (16 vs. trip)\nFeats Point-Blank Shot, Precise Shot, Weapon Finesse\nSkills Acrobatics +9, Fly +13, Perception +3, Stealth +16\nLanguages Auran, Common\nSQ basic aerokinesis\nEcology\nEnvironment warm hills or mountains\nOrganization solitary, pair, or flock (6-10)\nTreasure standard\nSpecial Abilities\nAir Blast (Sp) A chuspiki can make a ranged attack with an intense air blast, as the kineticist wild talent of the same name, using its Hit Dice as its kineticist level.\n\nBasic Aerokinesis (Sp) A chuspiki can use basic aerokinesis, as the kineticist wild talent of the same name.\n\nWind Blessed (Su) A chuspiki is treated as a Large creature for the purposes of determining the effects wind has upon it.\n\nWind Form (Su) Three times per day as an immediate action, a chuspiki can become insubstantial for 1 round. It gains DR 10/magic and becomes immune to poison, sneak attacks, and critical hits. It can't attack or use any of its spell-like abilities while in wind form, with the exception of basic aerokinesis.\nDescription\nChuspikis are intelligent, mouselike creatures covered in a coat of downy tan fur which makes them appear much larger than they actually are. A chuspiki's tail is substantially longer than the rest of its body, fanning out into a sail-like structure. The base of its tail is strong and flexible, allowing the chuspiki to whip around the fan at the tip with surprising speed. It can use this motion to create concussive blasts of air, or to scratch opponents with barbs on the underside of its tail bones.\n\nLike the wind itself, chuspikis are always moving. Chuspikis soar through the air, riding their fans like gliders and summoning minor gusts to steer their flight. They rest in short bursts, napping for just an hour at a time.\n\nWhenever they can, chuspikis seek out new experiences. They are social creatures that prefer to travel with others of their kind, or with members of other species. Chuspikis feel an especially strong connection with other creatures who share their bond with the skies, such as air elementals and sylphs. Chuspikis enjoy exploring unique locations, and when they find a particularly fascinating site, they announce their find on the winds to encourage others to share in their discovery. A mysterious disembodied voice promising glorious adventure may very well be a chuspiki; however, the playful creatures are just as likely to play pranks on hapless passersby as they are to provide legitimate guidance.\n\nA typical chuspiki is 1 foot long, with its tail extending out an additional 5 feet, and weighs 1 pound. Its bones are hollow, like a bird's.\n\nA chuspiki will sometimes ally with a spellcaster as a familiar. A chaotic spellcaster can gain a chuspiki as a familiar at 7th level by taking the Improved Familiar feat.</pre>\n        </div>\n    "
