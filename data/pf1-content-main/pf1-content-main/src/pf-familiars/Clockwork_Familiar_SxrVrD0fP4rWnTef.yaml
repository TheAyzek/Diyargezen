    type: feat
  - _id: gBnllb9s1GWo9DBR
    _key: '!actors.items!SxrVrD0fP4rWnTef.gBnllb9s1GWo9DBR'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/items/weapons/elven-curve-blade.PNG
    name: Weapon Finesse
    system:
      description:
        value: >-
          <em>You are trained in using your agility in melee combat, as opposed
          to brute strength.</em></p><p><strong>Benefits</strong><br/>With a
          light weapon, rapier, whip, or spiked chain made for a creature of
          your size category, you may use your Dexterity modifier instead of
          your Strength modifier on attack rolls. If you carry a shield, its
          armor check penalty applies to your attack
          rolls.</p><p><strong>Special</strong><br/>Natural weapons are
          considered light weapons.</p><p><strong>Combat Trick</strong><br/>You
          can spend 2 stamina points to negate the penalty on attack rolls from
          your shield's armor check penalty until the start of your next turn.
      tags:
        - Combat
    type: feat
