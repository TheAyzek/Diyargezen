      fly:
        base: 90
        maneuverability: good
    spells:
      spellbooks:
        primary:
          name: Primary
        secondary:
          name: Secondary
        spelllike:
          name: Spell-likes
        tertiary:
          name: Tertiary
    sr:
      formula: '13'
  details:
    alignment: ng
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Silvanshee CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 2 pg. 20<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            NG \r\n            Tiny \r\n            Outsider (Agathion, Extraplanar, Good) <br/>\r\n            <strong>Init</strong> 6;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +10; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 13 (+2 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 13 (2 HD; 2d10+2)<br/>\r\n            <strong>Fort</strong> 5, <strong>Ref</strong> 6, <strong>Will</strong> 2;  +4 vs. poison\r\n            \r\n            <strong>DR</strong> 5/evil or silver\r\n            <strong>Immune</strong> electricity, petrification; \r\n            <strong>Resist</strong> cold 10, sonic 10; \r\n            <strong>SR</strong> 13\r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 90 ft. (good)<br/>\r\n                <strong>Melee</strong> bite +6 (1d3-4), 2 claws +6 (1d2-4)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 3, <strong>Dex</strong> 15, <strong>Con</strong> 12, <strong>Int</strong> 10, <strong>Wis</strong> 12, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +2; <strong>CMD</strong> 8<br/>\r\n            <strong>Feats</strong> Improved Initiative, Weapon FinesseB<br/>\r\n            <strong>Skills</strong> Acrobatics +11, Climb +7, Fly +6, Knowledge (arcana) +5, Knowledge (planes) +5, Perception +10, Stealth +19, Racial Modifiers +4 Acrobatics, +4 Perception, +4 Stealth<br/>\r\n            <strong>Languages</strong> Celestial, Draconic, Infernal, speak with animals, truespeech<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any land (Nirvana)<br/>\r\n                <strong>Organization</strong>: solitary, pair, or clowder (3-10)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Cat&#x27;s Luck (su): A silvanshee adds its Charisma modifier as a luck bonus on all its saving throws. Once per day as a standard action, it can also grant this bonus to one ally within 30 feet for 10 minutes.\n\nHeroic Strength (su): Once per day, a silvanshee can grant itself a +8 enhancement bonus to Strength for 1 minute.\n\nSpectral Mist (su): A silvanshee can assume an eerie, mist-like form roughly the size and shape of a cat. This ability has the same effect as a gaseous form spell, except the silvanshee retains its own DR and supernatural abilities and can move at its normal speed. It can remain in mist form up to 5 minutes per day. This duration does not have to be consecutive, but it must be used in 1-minute increments.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Silvanshees are curious but reclusive cat agathions. Unobtrusive and able to blend in among normal animals (unlike the more anthropomorphic agathions), they are the eyes and ears of the good planes in the mortal world. Most roam hills, forests, and plains, keeping an eye out for evil influences. They can be taken as familiars by 7th-level good spellcasters who utilize the Improved Familiar feat and meet the proper prerequisites. As familiars, silvanshees act as moral guides and steer their mortal allies toward corruptive forces that must be eliminated. In some mortal lands, they are called cat sith or cath sidhe, and are believed to be disguised witches or fairies-and not necessarily benign creatures, which only encourages silvanshees to avoid strangers.\n\nSilvanshees are not fond of open combat, even against demons, devils, or other fiendish threats, and they&#x27;re likely to run away if confronted. When they must fight, they prefer greater numbers and the element of surprise, using their magic to temporarily overcome their physical weaknesses, and melting away into mist if the battle turns against them.\n\nA silvanshee is the size of a large domestic cat, though almost always sleek rather than fat, and weighs 20 pounds on average.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Silvanshee CR 2\nSource Bestiary 2 pg. 20\nXP 600\nNG Tiny outsider (agathion, extraplanar, good)\nInit +6; Senses darkvision 60 ft., low-light vision; Perception +10\nDefense\nAC 15, touch 14, flat-footed 13 (+2 Dex, +1 natural, +2 size)\nhp 13 (2d10+2)\nFort +5, Ref +6, Will +2; +4 vs. poison\nDR 5/evil or silver; Immune electricity, petrification; Resist cold 10, sonic 10; SR 13\nOffense\nSpeed 30 ft., fly 90 ft. (good)\nMelee bite +6 (1d3-4), 2 claws +6 (1d2-4)\nSpecial Attacks heroic strength, pounce\nSpell-Like Abilities (CL 2nd; concentration +3)\nConstant-know direction, speak with animals\nAt will-dancing lights, prestidigitation, stabilize\n1/day-dimension door (self plus 5 lbs. of objects only)\n1/week-commune (6 questions, CL 12th)\nStatistics\nStr 3, Dex 15, Con 12, Int 10, Wis 12, Cha 13\nBase Atk +2; CMB +2; CMD 8 (12 vs. trip)\nFeats Improved Initiative, Weapon FinesseB\nSkills Acrobatics +11, Climb +7, Fly +6, Knowledge (arcana) +5, Knowledge (planes) +5, Perception +10, Stealth +19; Racial Modifiers +4 Acrobatics, +4 Perception, +4 Stealth\nLanguages Celestial, Draconic, Infernal; speak with animals, truespeech\nSQ cat's luck, flight, lay on hands (1d6, 1/day, always as a 2nd-level paladin), spectral mist\nEcology\nEnvironment any land (Nirvana)\nOrganization solitary, pair, or clowder (3-10)\nTreasure standard\nSpecial Abilities\nCat's Luck (Su) A silvanshee adds its Charisma modifier as a luck bonus on all its saving throws. Once per day as a standard action, it can also grant this bonus to one ally within 30 feet for 10 minutes.\n\nHeroic Strength (Su) Once per day, a silvanshee can grant itself a +8 enhancement bonus to Strength for 1 minute.\n\nSpectral Mist (Su) A silvanshee can assume an eerie, mist-like form roughly the size and shape of a cat. This ability has the same effect as a gaseous form spell, except the silvanshee retains its own DR and supernatural abilities and can move at its normal speed. It can remain in mist form up to 5 minutes per day. This duration does not have to be consecutive, but it must be used in 1-minute increments.\nDescription\nSilvanshees are curious but reclusive cat agathions. Unobtrusive and able to blend in among normal animals (unlike the more anthropomorphic agathions), they are the eyes and ears of the good planes in the mortal world. Most roam hills, forests, and plains, keeping an eye out for evil influences. They can be taken as familiars by 7th-level good spellcasters who utilize the Improved Familiar feat and meet the proper prerequisites. As familiars, silvanshees act as moral guides and steer their mortal allies toward corruptive forces that must be eliminated. In some mortal lands, they are called cat sith or cath sidhe, and are believed to be disguised witches or fairies-and not necessarily benign creatures, which only encourages silvanshees to avoid strangers.\n\nSilvanshees are not fond of open combat, even against demons, devils, or other fiendish threats, and they're likely to run away if confronted. When they must fight, they prefer greater numbers and the element of surprise, using their magic to temporarily overcome their physical weaknesses, and melting away into mist if the battle turns against them.\n\nA silvanshee is the size of a large domestic cat, though almost always sleek rather than fat, and weighs 20 pounds on average.</pre>\n        </div>\n    "
