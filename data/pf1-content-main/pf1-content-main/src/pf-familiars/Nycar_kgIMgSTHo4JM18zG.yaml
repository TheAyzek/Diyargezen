  details:
    alignment: cn
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Nycar CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 4 pg. 207<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CN \r\n            Tiny \r\n            Dragon (Aquatic) <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision, scent; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 13 (+3 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 22 (3 HD; 3d12+3);  regeneration 1 (cold iron)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 6, <strong>Will</strong> 3\r\n            <br/><strong>Defensive Abilities</strong> ferocity; \r\n            \r\n            <strong>Immune</strong> paralysis, sleep; \r\n            <strong>Resist</strong> acid 5; \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.<br/>\r\n                <strong>Melee</strong> bite +8 (1d4+1 plus poison)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 13, <strong>Dex</strong> 16, <strong>Con</strong> 12, <strong>Int</strong> 5, <strong>Wis</strong> 10, <strong>Cha</strong> 9<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 15<br/>\r\n            <strong>Feats</strong> Skill Focus (Stealth), Weapon Finesse<br/>\r\n            <strong>Skills</strong> Escape Artist +13, Fly +11, Perception +5, Stealth +20, Swim +13, Racial Modifiers +8 Escape Artist<br/>\r\n            <strong>Languages</strong> Draconic (can&#x27;t speak)<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: cold marshes<br/>\r\n                <strong>Organization</strong>: solitary, pair, or clutch (3-8)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Elusive (ex): A nycar can make an Escape Artist check as a swift action.\n\nPoison (ex): Bite-injury; save Fort DC 12; frequency 1/round for 6 rounds; effect 1d4 acid and 1 Con damage; cure 2 consecutive saves.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">These diminutive serpentine creatures are distant cousins to powerful linnorms. Nycars live in the frigid, desolate moors and marshes of colder climates where their cruel and savage activities often escape unnoticed. A nycar relishes the hunt and often stalks a creature for hours before finally inflicting a single savage bite, then withdraws to safety to wait for its prey to sicken and die. Nycars often kill wastefully, attacking creatures much larger than they can eat. The opportunity to eat a human or other intelligent creature is a rare treat, as a nycar&#x27;s uninviting habitat usually prevents much interaction with all but the most isolated people.\n\nA nycar keeps a small subterranean lair, often accessed from an underwater entrance similar to the entrance to a beaver&#x27;s den. Like a linnorm, it seeks treasure and hoards it in its lair. Much of its treasure is worthless trinkets and shiny baubles of little value, but by random chance one may discover a few valuable items over the course of its lifetime. A nycar usually sets simple traps and snares to protect its lair and treasure hoard while it is away or sleeping.\n\nA nycar is about 2-1/2 feet long with two diminutive legs that it uses to pull its serpentine body along with deceptive speed. Nycars are jealous creatures and usually hunt alone, although a mated pair may stay together until the female lays her eggs. Nycar eggs are black and about the size of an adult human&#x27;s fist; a female will feed and look after hatchlings for up to a year, so long as they remain in her territory. Upon reaching adulthood, a nycar weighs about 12 pounds, and can live up to 90 years.\n\nNycars have been known to partner with humans or other intelligent creatures, provided they are offered easy kills and the occasional shiny bauble. A chaotic neutral spellcaster with the Improved Familiar feat can gain a nycar as a familiar at 7th level.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Nycar CR 2\nSource Bestiary 4 pg. 207\nXP 600\nCN Tiny dragon (aquatic)\nInit +3; Senses darkvision 60 ft., low-light vision, scent; Perception +5\nDefense\nAC 16, touch 15, flat-footed 13 (+3 Dex, +1 natural, +2 size)\nhp 22 (3d12+3); regeneration 1 (cold iron)\nFort +4, Ref +6, Will +3\nDefensive Abilities ferocity; DR 5/cold iron; Immune paralysis, sleep; Resist acid 5\nOffense\nSpeed 30 ft., swim 30 ft.\nMelee bite +8 (1d4+1 plus poison)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks poison\nStatistics\nStr 13, Dex 16, Con 12, Int 5, Wis 10, Cha 9\nBase Atk +3; CMB +4; CMD 15 (can't be tripped)\nFeats Skill Focus (Stealth), Weapon Finesse\nSkills Escape Artist +13, Fly +11, Perception +5, Stealth +20, Swim +13; Racial Modifiers +8 Escape Artist\nLanguages Draconic (can't speak)\nSQ amphibious, elusive\nEcology\nEnvironment cold marshes\nOrganization solitary, pair, or clutch (3-8)\nTreasure standard\nSpecial Abilities\nElusive (Ex) A nycar can make an Escape Artist check as a swift action.\n\nPoison (Ex) Bite-injury; save Fort DC 12; frequency 1/round for 6 rounds; effect 1d4 acid and 1 Con damage; cure 2 consecutive saves.\nDescription\nThese diminutive serpentine creatures are distant cousins to powerful linnorms. Nycars live in the frigid, desolate moors and marshes of colder climates where their cruel and savage activities often escape unnoticed. A nycar relishes the hunt and often stalks a creature for hours before finally inflicting a single savage bite, then withdraws to safety to wait for its prey to sicken and die. Nycars often kill wastefully, attacking creatures much larger than they can eat. The opportunity to eat a human or other intelligent creature is a rare treat, as a nycar's uninviting habitat usually prevents much interaction with all but the most isolated people.\n\nA nycar keeps a small subterranean lair, often accessed from an underwater entrance similar to the entrance to a beaver's den. Like a linnorm, it seeks treasure and hoards it in its lair. Much of its treasure is worthless trinkets and shiny baubles of little value, but by random chance one may discover a few valuable items over the course of its lifetime. A nycar usually sets simple traps and snares to protect its lair and treasure hoard while it is away or sleeping.\n\nA nycar is about 2-1/2 feet long with two diminutive legs that it uses to pull its serpentine body along with deceptive speed. Nycars are jealous creatures and usually hunt alone, although a mated pair may stay together until the female lays her eggs. Nycar eggs are black and about the size of an adult human's fist; a female will feed and look after hatchlings for up to a year, so long as they remain in her territory. Upon reaching adulthood, a nycar weighs about 12 pounds, and can live up to 90 years.\n\nNycars have been known to partner with humans or other intelligent creatures, provided they are offered easy kills and the occasional shiny bauble. A chaotic neutral spellcaster with the Improved Familiar feat can gain a nycar as a familiar at 7th level.</pre>\n        </div>\n    "
