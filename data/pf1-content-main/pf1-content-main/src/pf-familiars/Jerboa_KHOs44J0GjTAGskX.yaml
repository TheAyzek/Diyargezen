    cr:
      base: 0.1625
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Jerboa CR 1/6 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 198<br/>\r\n            <strong>XP 65</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Diminutive \r\n            Animal <br/>\r\n            <strong>Init</strong> 7;\r\n            <strong>Senses</strong> low-light vision, scent; Perception +6; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 17, <strong>Flat-Footed</strong> 14 (+3 Dex, +4 size)<br/>\r\n            <strong>Hit Points</strong> 3 (1 HD; 1d8-1)<br/>\r\n            <strong>Fort</strong> 1, <strong>Ref</strong> 5, <strong>Will</strong> 2\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> bite -1 (1d2-5)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 1, <strong>Dex</strong> 16, <strong>Con</strong> 8, <strong>Int</strong> 2, <strong>Wis</strong> 15, <strong>Cha</strong> 3<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-1; <strong>CMD</strong> 4<br/>\r\n            <strong>Feats</strong> Improved Initiative<br/>\r\n            <strong>Skills</strong> Acrobatics +11, Perception +6, Racial Modifiers +4 Acrobatics, +4 Perception<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm deserts<br/>\r\n                <strong>Organization</strong>: solitary, pair, or burrow (3-8)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Jerboas are desert rodents that live in burrows and hop around on long, thin legs. At night, they emerge from their burrows to eat plants and hunt insects under the light of the moon. Jerboas generally live to be around 6 years old.\n\nA jerboa is 6 inches long, has a 1-foot-long tail, and weighs between 1 and 3 ounces.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Jerboa CR 1/6\nSource Ultimate Wilderness pg. 198\nXP 65\nN Diminutive animal\nInit +7; Senses low-light vision, scent; Perception +6\nDefense\nAC 17, touch 17, flat-footed 14 (+3 Dex, +4 size)\nhp 3 (1d8-1)\nFort +1, Ref +5, Will +2\nOffense\nSpeed 20 ft.\nMelee bite -1 (1d2-5)\nSpace 1 ft., Reach 0 ft.\nStatistics\nStr 1, Dex 16, Con 8, Int 2, Wis 15, Cha 3\nBase Atk +0; CMB -1; CMD 4\nFeats Improved Initiative\nSkills Acrobatics +11, Perception +6; Racial Modifiers +4 Acrobatics, +4 Perception\nEcology\nEnvironment warm deserts\nOrganization solitary, pair, or burrow (3-8)\nTreasure none\nDescription\nJerboas are desert rodents that live in burrows and hop around on long, thin legs. At night, they emerge from their burrows to eat plants and hunt insects under the light of the moon. Jerboas generally live to be around 6 years old.\n\nA jerboa is 6 inches long, has a 1-foot-long tail, and weighs between 1 and 3 ounces.</pre>\n        </div>\n    "
