    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Sawleg Locust CR 1/4 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 205<br/>\r\n            <strong>XP 100</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Vermin <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +0; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 13 (+1 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 4 (1 HD; 1d8)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 1, <strong>Will</strong> 0\r\n            \r\n            \r\n            <strong>Immune</strong> mind-affecting effects; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 40 ft. (average)<br/>\r\n                <strong>Melee</strong> bite -1 (1d3-3)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 4, <strong>Dex</strong> 13, <strong>Con</strong> 11, <strong>Int</strong> 0, <strong>Wis</strong> 10, <strong>Cha</strong> 7<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-1; <strong>CMD</strong> 6<br/>\r\n            <strong>Feats</strong> <br/>\r\n            <strong>Skills</strong> Acrobatics +0 (+8 when jumping), Climb +9, Fly +5, Racial Modifiers +8 Acrobatics (when jumping)<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any desert or plains<br/>\r\n                <strong>Organization</strong>: solitary, pair, or flight (3-18)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Leap (ex): A sawleg locust can take 10 on Acrobatics checks to jump even if distracted or in danger.\n\nVoracious (ex): A sawleg locust&#x27;s bite attack deals double damage to creatures with the plant subtype and to objects made of paper, wood, or other plant materials.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">A sawleg locust is a larger variety of grasshopper that grows as large as 2 feet in length and feeds on a variety of plants. Periods of drought sometimes cause these locusts to gather in large groups, either to migrate to better feeding grounds or rarely to overpower and consume small animals.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Sawleg Locust CR 1/4\nSource Ultimate Wilderness pg. 205\nXP 100\nN Tiny vermin\nInit +1; Senses darkvision 60 ft.; Perception +0\nDefense\nAC 14, touch 13, flat-footed 13 (+1 Dex, +1 natural, +2 size)\nhp 4 (1d8)\nFort +2, Ref +1, Will +0\nImmune mind-affecting effects\nOffense\nSpeed 15 ft., climb 15 ft., fly 40 ft. (average)\nMelee bite -1 (1d3-3)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks voracious\nStatistics\nStr 4, Dex 13, Con 11, Int -, Wis 10, Cha 7\nBase Atk +0; CMB -1; CMD 6 (14 vs. trip)\nSkills Acrobatics +0 (+8 when jumping), Climb +9, Fly +5; Racial Modifiers +8 Acrobatics (when jumping)\nSQ leap\nEcology\nEnvironment any desert or plains\nOrganization solitary, pair, or flight (3-18)\nTreasure none\nSpecial Abilities\nLeap (Ex) A sawleg locust can take 10 on Acrobatics checks to jump even if distracted or in danger.\n\nVoracious (Ex) A sawleg locust's bite attack deals double damage to creatures with the plant subtype and to objects made of paper, wood, or other plant materials.\nDescription\nA sawleg locust is a larger variety of grasshopper that grows as large as 2 feet in length and feeds on a variety of plants. Periods of drought sometimes cause these locusts to gather in large groups, either to migrate to better feeding grounds or rarely to overpower and consume small animals.</pre>\n        </div>\n    "
