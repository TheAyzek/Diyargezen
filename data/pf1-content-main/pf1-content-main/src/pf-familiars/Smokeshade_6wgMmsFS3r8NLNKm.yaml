  - _id: 9kgFY75NHncKBVq1
    _key: '!actors.items!6wgMmsFS3r8NLNKm.9kgFY75NHncKBVq1'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Cloying Shade
    system:
      abilityType: su
      description:
        value: >-
          A smokeshade's tendrils deal negative energy damage. A creature that
          takes damage from a smokeshade's tendril attack is surrounded by a
          haze of cloying shadow for 1 round. This cloying shade imposes a -2
          penalty on attack rolls and Perception skill checks and grants the
          target concealment from attacks made by opponents that are not
          adjacent to it. This ability does not give the target concealment
          against the smokeshade.
      subType: classFeat
    type: feat
  - _id: eL0Q3Qdr0QKROs4w
    _key: '!actors.items!6wgMmsFS3r8NLNKm.eL0Q3Qdr0QKROs4w'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Hide In Plain Sight
    system:
      abilityType: su
      description:
        value: >-
          A smokeshade can use the Stealth skill even while being observed. As
          long as it is within 10 feet of an area of dim light, a smokeshade can
          hide itself from view in the open without anything to actually hide
          behind. A smokeshade can hide in the shadows of other creatures but
          not in its own shadow.
      subType: classFeat
    type: feat
  - _id: Miip6HYAPco1J77g
    _key: '!actors.items!6wgMmsFS3r8NLNKm.Miip6HYAPco1J77g'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Misty Form
    system:
      abilityType: ex
      description:
        value: >-
          A smokeshade's body is composed of a semisolid black mist similar in
          consistency to thick foam. In addition to the incorporeal subtype, the
          smokeshade's misty form grants it the amorphous defensive ability. The
          creature cannot speak or make other sounds beyond a low rumble. Unlike
          a normal incorporeal creature, a smokeshade cannot enter water or
          other fluids, and it is always treated as a Tiny creature for the
          purposes of how wind affects it, even if it increases in size.
      subType: classFeat
    type: feat
