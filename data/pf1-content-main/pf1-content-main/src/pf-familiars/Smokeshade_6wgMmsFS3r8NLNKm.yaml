    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Smokeshade CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Nidal, Land of Shadows pg. 64<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            NE \r\n            Tiny \r\n            Aberration (Extraplanar, Incorporeal) <br/>\r\n            <strong>Init</strong> 6;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +8; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 13 (+1 deflection, +2 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 22 (4 HD; 4d8+4)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 5, <strong>Will</strong> 5\r\n            <br/><strong>Defensive Abilities</strong> amorphous; \r\n            \r\n            \r\n            \r\n            <strong>SR</strong> 13\r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (good)<br/>\r\n                <strong>Melee</strong> tendril +5 (2d6 negative energy plus cloying shade)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 0, <strong>Dex</strong> 15, <strong>Con</strong> 12, <strong>Int</strong> 8, <strong>Wis</strong> 13, <strong>Cha</strong> 11<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +3; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Improved Initiative, Lightning Reflexes<br/>\r\n            <strong>Skills</strong> Acrobatics +9, Fly +15, Perception +8, Stealth +15<br/>\r\n            <strong>Languages</strong> Aklo (can&#x27;t speak), telepathy 60 ft.<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Plane of Shadow)<br/>\r\n                <strong>Organization</strong>: solitary or pair<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Cloying Shade (su): A smokeshade&#x27;s tendrils deal negative energy damage. A creature that takes damage from a smokeshade&#x27;s tendril attack is surrounded by a haze of cloying shadow for 1 round. This cloying shade imposes a -2 penalty on attack rolls and Perception skill checks and grants the target concealment from attacks made by opponents that are not adjacent to it. This ability does not give the target concealment against the smokeshade.\n\nHide in Plain Sight (su): A smokeshade can use the Stealth skill even while being observed. As long as it is within 10 feet of an area of dim light, a smokeshade can hide itself from view in the open without anything to actually hide behind. A smokeshade can hide in the shadows of other creatures but not in its own shadow.\n\nMisty Form (ex): A smokeshade&#x27;s body is composed of a semisolid black mist similar in consistency to thick foam. In addition to the incorporeal subtype, the smokeshade&#x27;s misty form grants it the amorphous defensive ability. The creature cannot speak or make other sounds beyond a low rumble. Unlike a normal incorporeal creature, a smokeshade cannot enter water or other fluids, and it is always treated as a Tiny creature for the purposes of how wind affects it, even if it increases in size.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Capricious natives of the Plane of Shadow, smokeshades are amorphous creatures that are made from semisolid smoke and shadow. Thought naturally wormlike in shape, smokeshades can contort themselves into rings, corkscrews, or even crude effigies with little effort. Regardless of a smokeshade&#x27;s shape, its composition remains purely a dark, roiling mist. Vain, preening creatures, smokeshades generally avoid combat and prefer to mock others with rude shapes or pantomime.\n\nA spellcaster of at least 7th level with an alignment within one step of neutral evil who has the Improved Familiar feat can select a smokeshade as a familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Smokeshade CR 2\nSource Nidal, Land of Shadows pg. 64\nXP 600\nNE Tiny aberration (extraplanar, incorporeal)\nInit +6; Senses darkvision 60 ft.; Perception +8\nDefense\nAC 15, touch 15, flat-footed 13 (+1 deflection, +2 Dex, +2 size)\nhp 22 (4d8+4)\nFort +2, Ref +5, Will +5\nDefensive Abilities amorphous; SR 13\nOffense\nSpeed 10 ft., fly 60 ft. (good)\nMelee tendril +5 (2d6 negative energy plus cloying shade)\nSpace 2-1/2 ft., Reach 0 ft. (5 ft. with tendril)\nStatistics\nStr -, Dex 15, Con 12, Int 8, Wis 13, Cha 11\nBase Atk +3; CMB +3; CMD 13 (can't be tripped)\nFeats Improved Initiative, Lightning Reflexes\nSkills Acrobatics +9, Fly +15, Perception +8, Stealth +15\nLanguages Aklo (can't speak); telepathy 60 ft.\nSQ hide in plain sight, misty form\nEcology\nEnvironment any (Plane of Shadow)\nOrganization solitary or pair\nTreasure standard\nSpecial Abilities\nCloying Shade (Su) A smokeshade's tendrils deal negative energy damage. A creature that takes damage from a smokeshade's tendril attack is surrounded by a haze of cloying shadow for 1 round. This cloying shade imposes a -2 penalty on attack rolls and Perception skill checks and grants the target concealment from attacks made by opponents that are not adjacent to it. This ability does not give the target concealment against the smokeshade.\n\nHide in Plain Sight (Su) A smokeshade can use the Stealth skill even while being observed. As long as it is within 10 feet of an area of dim light, a smokeshade can hide itself from view in the open without anything to actually hide behind. A smokeshade can hide in the shadows of other creatures but not in its own shadow.\n\nMisty Form (Ex) A smokeshade's body is composed of a semisolid black mist similar in consistency to thick foam. In addition to the incorporeal subtype, the smokeshade's misty form grants it the amorphous defensive ability. The creature cannot speak or make other sounds beyond a low rumble. Unlike a normal incorporeal creature, a smokeshade cannot enter water or other fluids, and it is always treated as a Tiny creature for the purposes of how wind affects it, even if it increases in size.\nDescription\nCapricious natives of the Plane of Shadow, smokeshades are amorphous creatures that are made from semisolid smoke and shadow. Thought naturally wormlike in shape, smokeshades can contort themselves into rings, corkscrews, or even crude effigies with little effort. Regardless of a smokeshade's shape, its composition remains purely a dark, roiling mist. Vain, preening creatures, smokeshades generally avoid combat and prefer to mock others with rude shapes or pantomime.\n\nA spellcaster of at least 7th level with an alignment within one step of neutral evil who has the Improved Familiar feat can select a smokeshade as a familiar.</pre>\n        </div>\n    "
