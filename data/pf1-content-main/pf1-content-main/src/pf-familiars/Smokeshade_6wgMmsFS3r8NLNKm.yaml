      description:
        value: >-
          <p>An aberration has a bizarre anatomy, strange abilities, an alien
          mindset, or any combination of the three.</p><h2>Features</h2><p>An
          aberration has the following features.</p><ul><li>d8 Hit
          Die.</li><li>Base attack bonus equal to 3/4 total Hit Dice (medium
          progression).</li><li>Good&nbsp;<a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Will"
          rel="nofollow">Will</a>&nbsp;Saves.</li><li>Skill points equal to 4 +
          Int modifier (minimum 1) per Hit Die. The following are class skills
          for aberrations: <a href="https://www.d20pfsrd.com/skills/acrobatics"
          rel="nofollow">Acrobatics</a>, <a
          href="https://www.d20pfsrd.com/skills/climb" rel="nofollow">Climb</a>,
          <a href="https://www.d20pfsrd.com/skills/escape-artist"
          rel="nofollow">Escape Artist</a>, <a
          href="https://www.d20pfsrd.com/skills/fly" rel="nofollow">Fly</a>, <a
          href="https://www.d20pfsrd.com/skills/intimidate"
          rel="nofollow">Intimidate</a>, <a
          href="https://www.d20pfsrd.com/skills/knowledge"
          rel="nofollow">Knowledge</a>&nbsp;(pick one), <a
          href="https://www.d20pfsrd.com/skills/perception"
          rel="nofollow">Perception</a>, <a
          href="https://www.d20pfsrd.com/skills/spellcraft"
          rel="nofollow">Spellcraft</a>, <a
          href="https://www.d20pfsrd.com/skills/stealth"
          rel="nofollow">Stealth</a>, <a
          href="https://www.d20pfsrd.com/skills/survival"
          rel="nofollow">Survival</a>, and <a
          href="https://www.d20pfsrd.com/skills/swim"
          rel="nofollow">Swim</a>.</li></ul><h2>Traits</h2><p>An aberration
          possesses the following traits (unless otherwise noted in a creature’s
          entry).</p><ul><li>Darkvision 60 feet.</li><li>Proficient with its
          natural weapons. If generally humanoid in form, proficient with all
          simple weapons and any weapon it is described as
          using.</li><li>Proficient with whatever type of armor (light, medium,
          or heavy) it is described as wearing, as well as all lighter types.
          Aberrations not indicated as wearing armor are not proficient with
          armor. Aberrations are proficient with shields if they are proficient
          with any form of armor.</li><li>Aberrations breathe, eat, and
          sleep.</li></ul>
      hp: 26
      level: 4
      savingThrows:
        will:
          value: high
      skillsPerLevel: 4
      tag: aberration
