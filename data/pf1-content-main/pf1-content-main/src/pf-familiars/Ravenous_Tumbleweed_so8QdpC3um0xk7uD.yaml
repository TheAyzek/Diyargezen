  - _id: UCm01rB5vkDnPjUn
    _key: '!actors.items!so8QdpC3um0xk7uD.UCm01rB5vkDnPjUn'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Wind-borne
    system:
      abilityType: ex
      description:
        value: >-
          While in an area of moderate wind (11-20 mph), a ravenous tumbleweed's
          speed increases by 10 feet when it moves in the direction of the wind.
          In an area of at least strong wind (21+ mph), its speed instead
          increases by 20 feet when it moves in the direction of the wind, and
          it gains a +2 dodge bonus to its AC against attacks of opportunity on
          any round in which it moves in that direction.
      subType: classFeat
    type: feat
