      base: 0.3375
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Ravenous Tumbleweed CR 1/3 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 205<br/>\r\n            <strong>XP 135</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Plant <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> low-light vision; Perception +0; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 13 (+1 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 5 (1 HD; 1d8+1)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 1, <strong>Will</strong> 0\r\n            \r\n            \r\n            <strong>Immune</strong> plant traits; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.<br/>\r\n                <strong>Melee</strong> slam +0 (1d4-2)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 13, <strong>Con</strong> 12, <strong>Int</strong> 0, <strong>Wis</strong> 11, <strong>Cha</strong> 4<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-1; <strong>CMD</strong> 7<br/>\r\n            <strong>Feats</strong> <br/>\r\n            <strong>Skills</strong> <br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm deserts or plains<br/>\r\n                <strong>Organization</strong>: solitary, pair, or drift (3-12)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Hurtling Charge (ex): A ravenous tumbleweed that travels at least 20 feet as part of a charge action does not provoke an attack of opportunity when it enters an opponent&#x27;s space to make a melee attack.\n\nWind-Borne (ex): While in an area of moderate wind (11-20 mph), a ravenous tumbleweed&#x27;s speed increases by 10 feet when it moves in the direction of the wind. In an area of at least strong wind (21+ mph), its speed instead increases by 20 feet when it moves in the direction of the wind, and it gains a +2 dodge bonus to its AC against attacks of opportunity on any round in which it moves in that direction.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Unlike its harmless counterpart, a ravenous tumbleweed uproots itself when nutrients are scarce in order to hunt down live prey. These seasonally carnivorous plants gather into imposing drifts that wait for periods of high winds before overwhelming birds, rabbits, and even deer.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Ravenous Tumbleweed CR 1/3\nSource Ultimate Wilderness pg. 205\nXP 135\nN Tiny plant\nInit +1; Senses low-light vision; Perception +0\nDefense\nAC 14, touch 13, flat-footed 13 (+1 Dex, +1 natural, +2 size)\nhp 5 (1d8+1)\nFort +3, Ref +1, Will +0\nImmune plant traits\nOffense\nSpeed 30 ft.\nMelee slam +0 (1d4-2)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks hurtling charge\nStatistics\nStr 6, Dex 13, Con 12, Int -, Wis 11, Cha 4\nBase Atk +0; CMB -1; CMD 7 (can't be tripped)\nSQ wind-borne\nEcology\nEnvironment warm deserts or plains\nOrganization solitary, pair, or drift (3-12)\nTreasure none\nSpecial Abilities\nHurtling Charge (Ex) A ravenous tumbleweed that travels at least 20 feet as part of a charge action does not provoke an attack of opportunity when it enters an opponent's space to make a melee attack.\n\nWind-Borne (Ex) While in an area of moderate wind (11-20 mph), a ravenous tumbleweed's speed increases by 10 feet when it moves in the direction of the wind. In an area of at least strong wind (21+ mph), its speed instead increases by 20 feet when it moves in the direction of the wind, and it gains a +2 dodge bonus to its AC against attacks of opportunity on any round in which it moves in that direction.\nDescription\nUnlike its harmless counterpart, a ravenous tumbleweed uproots itself when nutrients are scarce in order to hunt down live prey. These seasonally carnivorous plants gather into imposing drifts that wait for periods of high winds before overwhelming birds, rabbits, and even deer.</pre>\n        </div>\n    "
