    name: Slime Strand
    system:
      abilityType: ex
      description:
        value: >-
          A leopard slug can turn its mucus into a 30-foot-long strand, much
          like a spider's silk. It can hang from this strand indefinitely and
          lower itself safely at a rate of 5 feet per round. It can climb back
          up the strand at the same rate. Once the slug breaks contact with the
          strand, the mucus disintegrates in 1d4 rounds.
      subType: classFeat
    type: feat
  - _id: CuBPWEJpAZLBNiiN
