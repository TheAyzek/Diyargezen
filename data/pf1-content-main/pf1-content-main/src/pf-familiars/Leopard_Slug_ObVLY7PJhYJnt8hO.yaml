    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Suction
    system:
      abilityType: ex
      description:
        value: >-
          A leopard slug secretes sticky mucus, which allows it to apply its
          climb speed to any surface, even sheer walls and ceilings. Once
          attached to a surface, it has no chance of falling off unless it's
          grappled and actively peeled away.
      subType: classFeat
    type: feat
