  details:
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Leopard Slug CR 0 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 200, Familiar Folio pg. 30<br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            <br/>\r\n            <strong>Init</strong> 0;\r\n            \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 11, <strong>Touch</strong> 11, <strong>Flat-Footed</strong> 11 (-3 Dex, +4 size)<br/>\r\n            <strong>Hit Points</strong> 5 (1 HD; 1d8+1)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 3, <strong>Will</strong> 2\r\n            \r\n            \r\n            <strong>Immune</strong> mind-affecting effects; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 5 ft.<br/>\r\n                \r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 1, <strong>Dex</strong> 4, <strong>Con</strong> 12, <strong>Int</strong> 0, <strong>Wis</strong> 7, <strong>Cha</strong> 9<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-7; <strong>CMD</strong> 2<br/>\r\n            <strong>Feats</strong> <br/>\r\n            <strong>Skills</strong> Climb +3<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate forests<br/>\r\n                <strong>Organization</strong>: solitary, pair, or cornucopia (3-12)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Slime Strand (ex): A leopard slug can turn its mucus into a 30-foot-long strand, much like a spider&#x27;s silk. It can hang from this strand indefinitely and lower itself safely at a rate of 5 feet per round. It can climb back up the strand at the same rate. Once the slug breaks contact with the strand, the mucus disintegrates in 1d4 rounds.\n\nSuction (ex): A leopard slug secretes sticky mucus, which allows it to apply its climb speed to any surface, even sheer walls and ceilings. Once attached to a surface, it has no chance of falling off unless it&#x27;s grappled and actively peeled away.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Leopard slugs are distinctive due to their unique spotted coloration, which calls to mind the pelt of a leopard. This characteristic pattern allows leopard slugs to blend in with foliage and stones in the forest environments they call home. Occasionally, one can find more colorful varieties of leopard slug (such as bright yellow, flaming red, or fluorescent orange), bred specifically as pets or familiars by the esoteric masters who prefer such creatures. Although many find them disgusting, leopard slugs are completely harmless and award no XP if slain.\n\nLeopard slugs are about 6 inches long and weigh less than a pound.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Leopard Slug CR 0\nSource Ultimate Wilderness pg. 200, Familiar Folio pg. 30\nXP\nN Diminutive vermin\nInit -3; Senses darkvision 60 ft.; Perception -2\nDefense\nAC 11, touch 11, flat-footed 11 (-3 Dex, +4 size)\nhp 5 (1d8+1)\nFort +3, Ref -3, Will -2\nImmune mind-affecting effects\nOffense\nSpeed 5 ft., climb 5 ft.\nSpace 1 ft., Reach 0 ft.\nStatistics\nStr 1, Dex 4, Con 12, Int -, Wis 7, Cha 9\nBase Atk +0; CMB -7; CMD -2 (can't be tripped)\nSkills Climb +3\nSQ compression, slime strand, suction\nEcology\nEnvironment temperate forests\nOrganization solitary, pair, or cornucopia (3-12)\nTreasure none\nSpecial Abilities\nSlime Strand (Ex) A leopard slug can turn its mucus into a 30-foot-long strand, much like a spider's silk. It can hang from this strand indefinitely and lower itself safely at a rate of 5 feet per round. It can climb back up the strand at the same rate. Once the slug breaks contact with the strand, the mucus disintegrates in 1d4 rounds.\n\nSuction (Ex) A leopard slug secretes sticky mucus, which allows it to apply its climb speed to any surface, even sheer walls and ceilings. Once attached to a surface, it has no chance of falling off unless it's grappled and actively peeled away.\nDescription\nLeopard slugs are distinctive due to their unique spotted coloration, which calls to mind the pelt of a leopard. This characteristic pattern allows leopard slugs to blend in with foliage and stones in the forest environments they call home. Occasionally, one can find more colorful varieties of leopard slug (such as bright yellow, flaming red, or fluorescent orange), bred specifically as pets or familiars by the esoteric masters who prefer such creatures. Although many find them disgusting, leopard slugs are completely harmless and award no XP if slain.\n\nLeopard slugs are about 6 inches long and weigh less than a pound.</pre>\n        </div>\n    "
