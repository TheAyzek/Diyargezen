  details:
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Small Water Elemental CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder RPG Bestiary pg. 126<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Small \r\n            Outsider (Elemental, Extraplanar, Water) <br/>\r\n            <strong>Init</strong> 0;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +4; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 11, <strong>Flat-Footed</strong> 17 (+6 natural, +1 size)<br/>\r\n            <strong>Hit Points</strong> 13 (2 HD; 2d10+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 3, <strong>Will</strong> 0\r\n            \r\n            \r\n            <strong>Immune</strong> elemental traits; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 90 ft.<br/>\r\n                <strong>Melee</strong> slam +5 (1d6+3)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 14, <strong>Dex</strong> 10, <strong>Con</strong> 13, <strong>Int</strong> 4, <strong>Wis</strong> 11, <strong>Cha</strong> 11<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +3; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Power Attack<br/>\r\n            <strong>Skills</strong> Acrobatics +4, Escape Artist +4, Knowledge (planes) +1, Perception +4, Stealth +8, Swim +14<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Plane of Water)<br/>\r\n                \r\n                \r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Water elementals are patient, relentless creatures made of living fresh or salt water. They prefer to hide or drag their opponents into the water to gain an advantage.\n\nAs with other elementals, all water elementals have their own unique shapes and appearances. Most appear as wave-like creatures with vaguely humanoid faces and smaller wave “arms” to either side. Another common form is that of any aquatic creature, such as a shark or octopus, but made entirely out of water.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Small Water Elemental CR 1\nSource Pathfinder RPG Bestiary pg. 126\nXP 400\nN Small outsider (elemental, extraplanar, water)\nInit +0; Senses darkvision 60 ft.; Perception +4\nDefense\nAC 17, touch 11, flat-footed 17 (+6 natural, +1 size)\nhp 13 (2d10+2)\nFort +4, Ref +3, Will +0\nImmune elemental traits\nOffense\nSpeed 20 ft., swim 90 ft.\nMelee slam +5 (1d6+3)\nSpecial Attacks drench, vortex (DC 13), water mastery\nStatistics\nStr 14, Dex 10, Con 13, Int 4, Wis 11, Cha 11\nBase Atk +2; CMB +3; CMD 13\nFeats Power Attack\nSkills Acrobatics +4, Escape Artist +4, Knowledge (planes) +1, Perception +4, Stealth +8, Swim +14\nEcology\nEnvironment any (Plane of Water)\nDescription\nWater elementals are patient, relentless creatures made of living fresh or salt water. They prefer to hide or drag their opponents into the water to gain an advantage.\n\nAs with other elementals, all water elementals have their own unique shapes and appearances. Most appear as wave-like creatures with vaguely humanoid faces and smaller wave “arms” to either side. Another common form is that of any aquatic creature, such as a shark or octopus, but made entirely out of water.</pre>\n        </div>\n    "
