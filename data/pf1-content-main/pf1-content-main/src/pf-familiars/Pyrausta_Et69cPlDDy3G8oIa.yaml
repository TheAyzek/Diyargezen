    cr:
      base: 0.25
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Pyrausta CR 1/4 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 5 pg. 200<br/>\r\n            <strong>XP 100</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CN \r\n            Diminutive \r\n            Dragon (Fire) <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 16, <strong>Flat-Footed</strong> 14 (+2 Dex, +4 size)<br/>\r\n            <strong>Hit Points</strong> 5 (1 HD; 1d12-1);  fast healing 1<br/>\r\n            <strong>Fort</strong> 1, <strong>Ref</strong> 4, <strong>Will</strong> 3\r\n            \r\n            \r\n            <strong>Immune</strong> fire, paralysis, sleep; \r\n            \r\n            \r\n            \r\n            <br/><strong>Weaknesses</strong> \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (good)<br/>\r\n                <strong>Melee</strong> bite +7 (1d3-2 plus 1 fire)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 15, <strong>Con</strong> 8, <strong>Int</strong> 5, <strong>Wis</strong> 12, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +1; <strong>CMB</strong> +-1; <strong>CMD</strong> 7<br/>\r\n            <strong>Feats</strong> Flyby Attack, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Fly +16, Perception +5, Stealth +18<br/>\r\n            <strong>Languages</strong> Draconic<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any warm<br/>\r\n                <strong>Organization</strong>: solitary, pair, or swarm (12-20)<br/>\r\n                <strong>Treasure</strong>: double<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Heart of Flame (ex): A tiny spark of flame that acts as a pyrausta&#x27;s heart beats within its chest. Whenever a pyrausta takes cold damage, including damage from environmental cold, its little heart stalls. It loses its fast healing and breath weapon, gains the staggered condition, and takes 1 point of damage each round. This continues until it is exposed to a source of flame that would normally deal fire damage or until it successfully uses its spark spell-like ability to reignite its heart (doing so requires a successful DC 11 concentration check because of the ongoing damage).</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Though perhaps the smallest of dragons, pyraustas are not insecure about their size, for they lack the inflated egos so common among their larger kindred. Instead, pyraustas delight in being what they are, and live in the here and now. Though their natural life spans are similar to a human&#x27;s, their dependence on flame to keep their hearts beating means the average pyrausta meets its end much sooner.\n\nSome scholars believe that pyraustas, sometimes called &#x27;insect dragons&#x27; or &#x27;true dragonflies,&#x27; are spawned from the very hearts of volcanoes, where flickering flames are common. In truth, young pyraustas are conceived in the warmest months of the year, when swarms of the creatures gather high in the night skies and perform elaborate courtship rituals with their colorful flames, frolicking playfully in mid-flight. These swarms are often mistaken for fireflies, auroras, or other phenomena. A pyrausta&#x27;s flame and its heart are one, and its fiery breath changes color depending on the creature&#x27;s emotions. Pyraustas use their inner flames primarily to express themselves, creating vivid pyrotechnic displays to communicate their feelings. They can also use this flame as a weapon if necessary, but prefer not to.\n\nA typical pyrausta&#x27;s body is 9 inches long, though its wingspan is longer, and it weighs 1 to 2 pounds.\nElder Pyraustas\nPyraustas who outlive the short life spans their frailty often imposes on them can grow to become far larger and more dangerous than their younger kin. They gain the giant and advanced simple templates, and the range of their breath weapons increases to a 15-foot cone. Elder pyraustas don&#x27;t usually grow arrogant as their might increases; they instead either offer wisdom to other pyraustas, settling disputes and acting as guardians and mentors to their younger kin, or else travel far and wide, bridging the gaps between disparate pyrausta communities.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Pyrausta CR 1/4\nSource Bestiary 5 pg. 200\nXP 100\nCN Diminutive dragon (fire)\nInit +2; Senses darkvision 60 ft., low-light vision; Perception +5\nDefense\nAC 16, touch 16, flat-footed 14 (+2 Dex, +4 size)\nhp 5 (1d12-1); fast healing 1\nFort +1, Ref +4, Will +3\nImmune fire, paralysis, sleep\nWeaknesses heart of flame, vulnerable to cold\nOffense\nSpeed 20 ft., fly 60 ft. (good)\nMelee bite +7 (1d3-2 plus 1 fire)\nSpace 1 ft., Reach 0 ft.\nSpecial Attacks breath weapon (10-ft. cone, 1d4 fire, Reflex DC 9 half, usable every 1d4 rounds)\nSpell-Like Abilities (CL 1st; concentration +2)\nAt will-spark\nStatistics\nStr 6, Dex 15, Con 8, Int 5, Wis 12, Cha 13\nBase Atk +1; CMB -1; CMD 7 (11 vs. trip)\nFeats Flyby Attack, Weapon Finesse\nSkills Fly +16, Perception +5, Stealth +18\nLanguages Draconic\nEcology\nEnvironment any warm\nOrganization solitary, pair, or swarm (12-20)\nTreasure double\nSpecial Abilities\nHeart of Flame (Ex) A tiny spark of flame that acts as a pyrausta's heart beats within its chest. Whenever a pyrausta takes cold damage, including damage from environmental cold, its little heart stalls. It loses its fast healing and breath weapon, gains the staggered condition, and takes 1 point of damage each round. This continues until it is exposed to a source of flame that would normally deal fire damage or until it successfully uses its spark spell-like ability to reignite its heart (doing so requires a successful DC 11 concentration check because of the ongoing damage).\nDescription\nThough perhaps the smallest of dragons, pyraustas are not insecure about their size, for they lack the inflated egos so common among their larger kindred. Instead, pyraustas delight in being what they are, and live in the here and now. Though their natural life spans are similar to a human's, their dependence on flame to keep their hearts beating means the average pyrausta meets its end much sooner.\n\nSome scholars believe that pyraustas, sometimes called 'insect dragons' or 'true dragonflies,' are spawned from the very hearts of volcanoes, where flickering flames are common. In truth, young pyraustas are conceived in the warmest months of the year, when swarms of the creatures gather high in the night skies and perform elaborate courtship rituals with their colorful flames, frolicking playfully in mid-flight. These swarms are often mistaken for fireflies, auroras, or other phenomena. A pyrausta's flame and its heart are one, and its fiery breath changes color depending on the creature's emotions. Pyraustas use their inner flames primarily to express themselves, creating vivid pyrotechnic displays to communicate their feelings. They can also use this flame as a weapon if necessary, but prefer not to.\n\nA typical pyrausta's body is 9 inches long, though its wingspan is longer, and it weighs 1 to 2 pounds.\nElder Pyraustas\nPyraustas who outlive the short life spans their frailty often imposes on them can grow to become far larger and more dangerous than their younger kin. They gain the giant and advanced simple templates, and the range of their breath weapons increases to a 15-foot cone. Elder pyraustas don't usually grow arrogant as their might increases; they instead either offer wisdom to other pyraustas, settling disputes and acting as guardians and mentors to their younger kin, or else travel far and wide, bridging the gaps between disparate pyrausta communities.</pre>\n        </div>\n    "
