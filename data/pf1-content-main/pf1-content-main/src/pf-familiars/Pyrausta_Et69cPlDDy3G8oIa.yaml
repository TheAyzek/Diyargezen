  - _id: ErsZwONZMgajV0Bx
    _key: '!actors.items!Et69cPlDDy3G8oIa.ErsZwONZMgajV0Bx'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Heart Of Flame
    system:
      abilityType: ex
      description:
        value: >-
          A tiny spark of flame that acts as a pyrausta's heart beats within its
          chest. Whenever a pyrausta takes cold damage, including damage from
          environmental cold, its little heart stalls. It loses its fast healing
          and breath weapon, gains the staggered condition, and takes 1 point of
          damage each round. This continues until it is exposed to a source of
          flame that would normally deal fire damage or until it successfully
          uses its spark spell-like ability to reignite its heart (doing so
          requires a successful DC 11 concentration check because of the ongoing
          damage).
      subType: classFeat
    type: feat
