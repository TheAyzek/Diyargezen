  details:
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Small Fire Elemental CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder RPG Bestiary pg. 124<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Small \r\n            Outsider (Elemental, Extraplanar, Fire) <br/>\r\n            <strong>Init</strong> 5;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +4; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 14 (+1 Dex, +1 dodge, +3 natural, +1 size)<br/>\r\n            <strong>Hit Points</strong> 11 (2 HD; 2d10)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 4, <strong>Will</strong> 0\r\n            \r\n            \r\n            <strong>Immune</strong> elemental traits, fire; \r\n            \r\n            \r\n            \r\n            <br/><strong>Weaknesses</strong> \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 50 ft.<br/>\r\n                <strong>Melee</strong> slam +4 (1d4 plus burn)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 10, <strong>Dex</strong> 13, <strong>Con</strong> 10, <strong>Int</strong> 4, <strong>Wis</strong> 11, <strong>Cha</strong> 11<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +1; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Dodge, Improved InitiativeB, Weapon FinesseB<br/>\r\n            <strong>Skills</strong> Acrobatics +5, Climb +4, Escape Artist +5, Intimidate +4, Knowledge (planes) +1, Perception +4<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Plane of Fire)<br/>\r\n                \r\n                \r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Fire elementals are quick, cruel creatures of living flame. They enjoy frightening beings weaker than themselves, and terrorizing any creature they can set on fire.\n\nA fire elemental cannot enter water or any other nonflammable liquid. A body of water is an impassible barrier unless the fire elemental can step or jump over it or the water is covered with a flammable material (such as a layer of oil).\n\nFire elementals vary in appearance-they usually manifest as coiling serpentine forms made of smoke and flame, but some fire elementals take on shapes more akin to humans, demons, or other monsters in order to increase the terror of their sudden appearance. Features on a fire elemental’s body are made by darker bits of flame or patches of semi-stable smoke, ash, and cinders.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Small Fire Elemental CR 1\nSource Pathfinder RPG Bestiary pg. 124\nXP 400\nN Small outsider (elemental, extraplanar, fire)\nInit +5; Senses darkvision 60 ft.; Perception +4\nDefense\nAC 16, touch 13, flat-footed 14 (+1 Dex, +1 dodge, +3 natural, +1 size)\nhp 11 (2d10)\nFort +3, Ref +4, Will +0\nImmune elemental traits, fire\nWeaknesses vulnerability to cold\nOffense\nSpeed 50 ft.\nMelee slam +4 (1d4 plus burn)\nSpecial Attacks burn (1d4, DC 11)\nStatistics\nStr 10, Dex 13, Con 10, Int 4, Wis 11, Cha 11\nBase Atk +2; CMB +1; CMD 13\nFeats Dodge, Improved InitiativeB, Weapon FinesseB\nSkills Acrobatics +5, Climb +4, Escape Artist +5, Intimidate +4, Knowledge (planes) +1, Perception +4\nEcology\nEnvironment any (Plane of Fire)\nDescription\nFire elementals are quick, cruel creatures of living flame. They enjoy frightening beings weaker than themselves, and terrorizing any creature they can set on fire.\n\nA fire elemental cannot enter water or any other nonflammable liquid. A body of water is an impassible barrier unless the fire elemental can step or jump over it or the water is covered with a flammable material (such as a layer of oil).\n\nFire elementals vary in appearance—they usually manifest as coiling serpentine forms made of smoke and flame, but some fire elementals take on shapes more akin to humans, demons, or other monsters in order to increase the terror of their sudden appearance. Features on a fire elemental’s body are made by darker bits of flame or patches of semi-stable smoke, ash, and cinders.</pre>\n        </div>\n    "
