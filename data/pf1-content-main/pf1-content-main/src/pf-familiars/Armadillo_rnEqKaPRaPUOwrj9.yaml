                    </div>
                
                
                    <div style="break-inside:avoid">
                        <h3>Description</h3>        <div style="white-space:pre-wrap">These squat-bodied mammals are easily recognizable thanks to their distinctive leathery shells, which provide them with natural protection against numerous dangers and predators in their native environs. Armadillos have very poor eyesight, perceiving the world largely through scent and touch. They are exceptional diggers, and they burrow both to find food and to make their dens. When an armadillo goes underwater, it swallows air to increase its buoyancy, inflating its stomach up to twice its normal size so it won't immediately sink.

        An armadillo is 2-1/2 feet long and weighs roughly 10 pounds.

