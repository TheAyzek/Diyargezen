  - _id: lIkpvLe6Insmpn31
    _key: '!actors.items!FFWh9dZ3ucFHon1t.lIkpvLe6Insmpn31'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Empath
    system:
      abilityType: su
      description:
        value: >-
          Carbuncles possess a crude form of telepathy, allowing them to
          transmit mild impressions and remembered sensations to other
          creatures. This form of telepathy cannot convey language or hinder a
          target in any way (such as by transmitting pain). Thus, a carbuncle
          can relate a feeling of fear or the faint smell of leaves, but cannot
          directly warn an ally of a monster or tell of a treasure under a dirt
          mound.
      subType: classFeat
    type: feat
  - _id: E0bv6AMGL2HAUL0E
    _key: '!actors.items!FFWh9dZ3ucFHon1t.E0bv6AMGL2HAUL0E'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Fatal Faker
    system:
      abilityType: su
      description:
        value: >-
          As a standard action three times per day, a carbuncle can teleport as
          per the spell dimension door, but only within a range of 30 feet. Upon
          teleporting, the carbuncle leaves behind a perfect replica of itself
          amid a colored flash and the sound of a reptilian choke. This replica
          duplicates the carbuncle in all ways, though it is obviously dead and
          the colorless stone in its head is reduced to worthless dust.
      subType: classFeat
    type: feat
  - _id: szUChyUjFrFhcWm6
    _key: '!actors.items!FFWh9dZ3ucFHon1t.szUChyUjFrFhcWm6'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Specious Suggestion
    system:
      abilityType: su
      description:
        value: >-
          As a standard action three times per day, a carbuncle can concentrate
          intently on one creature within its line of sight and attempt to
          impose its will upon the target. A DC 11 Will save is enough to resist
          this compulsion. If the target fails to resist, roll 1d6. On a result
          of 1-2, the target gains a flash of insight and a +2 insight bonus to
          its Armor Class for 1 minute. On a result of 3-4, the victim is
          affected as if by suggestion for 1 minute, and must follow a single
          (usually embarrassing, always harmless) suggestion from the carbuncle.
          On a result of 5-6, the victim's thoughts are garbled with those of
          the carbuncle, imposing a -2 penalty to the victim's Will saving
          throws for 1 minute. This is a mind-affecting effect. The save DC is
          Charisma-based.
      subType: classFeat
    type: feat
  - _id: o2xDg2rQZvXcpHH2
    _key: '!actors.items!FFWh9dZ3ucFHon1t.o2xDg2rQZvXcpHH2'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Vulnerability To Suggestion
    system:
      abilityType: ex
      description:
        value: >-
          Any mind-affecting spell can affect a carbuncle regardless of creature
          type limitations. A spell like charm person, for example, which
          typically only affects humanoid creatures, can also affect carbuncles.
      subType: classFeat
    type: feat
  - _id: Z8TthfIECPw0hJYm
    _key: '!actors.items!FFWh9dZ3ucFHon1t.Z8TthfIECPw0hJYm'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: sbc | Conversion Buff
    system:
      active: true
      changes:
        - _id: tl9btndz
          formula: '1'
          target: cmb
          type: untypedPerm
      description:
        value: >-
          <h2>sbc | Conversion Buff</h2><p>This Buff was created by
          <strong>sbc</strong> to compensate for differences between the input
          and the values FoundryVTT calculates automatically.</p><p>Especially
          when the pathfinder system gets upgraded, entries in compendiums get
          updated or foundry changes in some way, this buff may become
          outdated.</p><p>For most mooks the conversion should more or less
          work, but for important NPCs or creatures it is adviced to double
          check the conversion manually.</p>
      hideFromToken: true
      subType: perm
      tag: sbcConversionBuff
    type: buff
