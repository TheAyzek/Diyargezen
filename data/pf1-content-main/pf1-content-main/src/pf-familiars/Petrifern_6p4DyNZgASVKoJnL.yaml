  - _id: uft39iVlr6ecRyTt
    _key: '!actors.items!6p4DyNZgASVKoJnL.uft39iVlr6ecRyTt'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Self-petrification
    system:
      abilityType: ex
      description:
        value: >-
          A petrifern can petrify itself as a standard action in order to defend
          itself from predators. When it does so, the petrifern's natural armor
          bonus to AC increases by 5, it gains resistance 10 to cold and fire,
          and it can take 20 on Stealth checks to appear as a sprout or fallen
          tree branch. While petrified, the petrifern can't move or take any
          actions. A petrifern can remain petrified indefinitely, and it can
          cease its petrification as a standard action.
      subType: classFeat
    type: feat
  - _id: mfHFlV6Rq6d85Bq9
    _key: '!actors.items!6p4DyNZgASVKoJnL.mfHFlV6Rq6d85Bq9'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Toxic Secretion
    system:
      abilityType: ex
      description:
        value: >-
          Petriferns secrete a bitter toxin meant to make them distasteful to
          predators. Once per day when a creature touches a petrifern, the plant
          can release its toxin, causing the attacker to become sickened for 1d4
          rounds if it fails a DC 11 Fortitude saving throw. The save DC is
          Constitution-based.
      subType: classFeat
    type: feat
