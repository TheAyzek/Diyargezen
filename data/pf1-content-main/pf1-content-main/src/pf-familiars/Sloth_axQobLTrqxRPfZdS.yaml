    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Sloth CR 1/6 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 4 pg. 97<br/>\r\n            <strong>XP 65</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal <br/>\r\n            <strong>Init</strong> -2;\r\n            <strong>Senses</strong> low-light vision, scent; Perception +1; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 11, <strong>Touch</strong> 10, <strong>Flat-Footed</strong> 11 (-2 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 5 (1 HD; 1d8+1)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 0, <strong>Will</strong> 1\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 5 ft.<br/>\r\n                <strong>Melee</strong> 2 claws -1 (1d2-3)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 5, <strong>Dex</strong> 7, <strong>Con</strong> 12, <strong>Int</strong> 2, <strong>Wis</strong> 12, <strong>Cha</strong> 7<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-4; <strong>CMD</strong> 3<br/>\r\n            <strong>Feats</strong> Skill Focus (Stealth)<br/>\r\n            <strong>Skills</strong> Climb +10, Stealth +17, Swim +2, Racial Modifiers +4 Climb, +4 Stealth, +4 Swim<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm forests<br/>\r\n                <strong>Organization</strong>: solitary or pair<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Sloths are tree-dwelling herbivores. They are known for their efficient metabolisms and slow movement.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Sloth CR 1/6\nSource Bestiary 4 pg. 97\nXP 65\nN Tiny animal\nInit -2; Senses low-light vision, scent; Perception +1\nDefense\nAC 11, touch 10, flat-footed 11 (-2 Dex, +1 natural, +2 size)\nhp 5 (1d8+1)\nFort +3, Ref +0, Will +1\nOffense\nSpeed 5 ft., climb 5 ft.\nMelee 2 claws -1 (1d2-3)\nSpace 2-1/2 ft., Reach 0 ft.\nStatistics\nStr 5, Dex 7, Con 12, Int 2, Wis 12, Cha 7\nBase Atk +0; CMB -4; CMD 3 (7 vs. trip)\nFeats Skill Focus (Stealth)\nSkills Climb +10, Stealth +17, Swim +2; Racial Modifiers +4 Climb, +4 Stealth, +4 Swim\nEcology\nEnvironment warm forests\nOrganization solitary or pair\nTreasure none\nDescription\nSloths are tree-dwelling herbivores. They are known for their efficient metabolisms and slow movement.</pre>\n        </div>\n    "
