    cr:
      base: 3
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Seru CR 3 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Monster Codex pg. 208<br/>\r\n            <strong>XP 800</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            NE \r\n            Small \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 6;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision, scent; Perception +10; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 12 (+2 Dex, +1 dodge, +1 natural, +1 size)<br/>\r\n            <strong>Hit Points</strong> 22 (3 HD; 3d10+6)<br/>\r\n            <strong>Fort</strong> 5, <strong>Ref</strong> 5, <strong>Will</strong> 2\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 40 ft. (average)<br/>\r\n                <strong>Melee</strong> bite +6 (1d4-2 plus poison)<br/>\r\n                <strong>Ranged</strong> spit venom +6 ranged touch (poison)<br/>\r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 15, <strong>Con</strong> 14, <strong>Int</strong> 11, <strong>Wis</strong> 13, <strong>Cha</strong> 10<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +0; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Dodge, Flyby AttackB, Improved Initiative, Weapon FinesseB<br/>\r\n            <strong>Skills</strong> Bluff +7, Fly +4, Perception +10, Stealth +10 (+14 in rocky areas), Racial Modifiers +4 Bluff, +4 Perception<br/>\r\n            <strong>Languages</strong> Aklo, Common (can&#x27;t speak any language), telepathy 60 ft.<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any land (jungles, swamps, or underground)<br/>\r\n                <strong>Organization</strong>: solitary, pair, or nest (3-8)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Poison (ex): Bite or spit venom-injury; save Fort DC 15; frequency 1/minute for 6 minutes; effect 1 Con damage plus blindness for 1 minute; cure 1 save.\n\nSpit Venom (ex): As a standard action, a seru can spit venom up to 30 feet. This is a ranged touch attack with no range increment. Any opponent hit by this attack is exposed to the seru&#x27;s poison.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">A seru is an underground variety of telepathic venomous snake with the wings of a bat. These creatures have long held a special relationship with serpentfolk, and some legends suggest the snake-god created these winged vipers to assist the serpentfolk in their war against humanity. Intelligent enough to form their own culture, many serus live entirely separate lives from serpentfolk enclaves. Even so, many serpentfolk wizards still seek out serus to bind them as familiars. A spellcaster must have the Improved Familiar feat, be of an evil alignment, and be an Arcana caster of level of 7th or higher to gain a seru familiar.\n\nSerus are natural predators that prefer to track prey by scent. When ready to strike, they spit venom into the eyes of a victim and use ambush tactics to wear down their targets. When presented with overwhelming odds or those capable of resisting their venom, serus tend to flee and hide among their cavern rocks.\n\nSerpentfolk often use serus to watch their territorial borders. These creatures serve both as a deterrent and as telepathic spies that can quickly alert their masters to the presence of outsiders. They sometimes enter into friendships with degenerate serpentfolk, participating in raiding parties as equal companions and trackers, or else command them by acting as mouthpieces for purecastes.\n\nAn adult seru weighs approximately 20 pounds, with a body nearly 3 feet long and a wingspan of 5 feet. A mated female lays two to five eggs every year, but many fall victim to underground predators before they ever hatch. Serus have an average life span of 25 years.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Seru CR 3\nSource Monster Codex pg. 208\nXP 800\nNE Small magical beast\nInit +6; Senses darkvision 60 ft., low-light vision, scent; Perception +10\nDefense\nAC 15, touch 14, flat-footed 12 (+2 Dex, +1 dodge, +1 natural, +1 size)\nhp 22 (3d10+6)\nFort +5, Ref +5, Will +2\nOffense\nSpeed 20 ft., fly 40 ft. (average)\nMelee bite +6 (1d4-2 plus poison)\nRanged spit venom +6 ranged touch (poison)\nSpecial Attacks poison, spit venom\nStatistics\nStr 6, Dex 15, Con 14, Int 11, Wis 13, Cha 10\nBase Atk +3; CMB +0; CMD 13\nFeats Dodge, Flyby AttackB, Improved Initiative, Weapon FinesseB\nSkills Bluff +7, Fly +4, Perception +10, Stealth +10 (+14 in rocky areas); Racial Modifiers +4 Bluff, +4 Perception\nLanguages Aklo, Common (can't speak any language); telepathy 60 ft.\nEcology\nEnvironment any land (jungles, swamps, or underground)\nOrganization solitary, pair, or nest (3-8)\nTreasure none\nSpecial Abilities\nPoison (Ex) Bite or spit venom-injury; save Fort DC 15; frequency 1/minute for 6 minutes; effect 1 Con damage plus blindness for 1 minute; cure 1 save.\n\nSpit Venom (Ex) As a standard action, a seru can spit venom up to 30 feet. This is a ranged touch attack with no range increment. Any opponent hit by this attack is exposed to the seru's poison.\nDescription\nA seru is an underground variety of telepathic venomous snake with the wings of a bat. These creatures have long held a special relationship with serpentfolk, and some legends suggest the snake-god created these winged vipers to assist the serpentfolk in their war against humanity. Intelligent enough to form their own culture, many serus live entirely separate lives from serpentfolk enclaves. Even so, many serpentfolk wizards still seek out serus to bind them as familiars. A spellcaster must have the Improved Familiar feat, be of an evil alignment, and be an arcane caster of level of 7th or higher to gain a seru familiar.\n\nSerus are natural predators that prefer to track prey by scent. When ready to strike, they spit venom into the eyes of a victim and use ambush tactics to wear down their targets. When presented with overwhelming odds or those capable of resisting their venom, serus tend to flee and hide among their cavern rocks.\n\nSerpentfolk often use serus to watch their territorial borders. These creatures serve both as a deterrent and as telepathic spies that can quickly alert their masters to the presence of outsiders. They sometimes enter into friendships with degenerate serpentfolk, participating in raiding parties as equal companions and trackers, or else command them by acting as mouthpieces for purecastes.\n\nAn adult seru weighs approximately 20 pounds, with a body nearly 3 feet long and a wingspan of 5 feet. A mated female lays two to five eggs every year, but many fall victim to underground predators before they ever hatch. Serus have an average life span of 25 years.</pre>\n        </div>\n    "
