  details:
    cr:
      base: 0.25
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Pufferfish CR 1/4 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 203, Familiar Folio pg. 25<br/>\r\n            <strong>XP 100</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal <br/>\r\n            <strong>Init</strong> 6;\r\n            <strong>Senses</strong> low-light vision; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 12 (+2 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 6 (1 HD; 1d8+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 4, <strong>Will</strong> 1\r\n            <br/><strong>Defensive Abilities</strong> spines; \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                \r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 4, <strong>Dex</strong> 14, <strong>Con</strong> 15, <strong>Int</strong> 1, <strong>Wis</strong> 12, <strong>Cha</strong> 9<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +0; <strong>CMD</strong> 7<br/>\r\n            <strong>Feats</strong> Improved Initiative<br/>\r\n            <strong>Skills</strong> Perception +5, Swim +5<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm oceans<br/>\r\n                <strong>Organization</strong>: solitary, pair, or school (3-12)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Poison (ex): Spines-injury; save Fort DC 12; frequency once; initial effect staggered for 1 round; secondary effect 1 Str damage; cure 2 consecutive saves. If certain portions of the pufferfish&#x27;s body are eaten, the poison&#x27;s effect is instead 1d4 points of Constitution damage. The save DC is Constitution-based.\n\nSpines (ex): Pufferfish aren&#x27;t equipped to attack other creatures, but foes that strike a pufferfish with an unarmed strike or a natural attack take 1 point of piercing damage from the fish&#x27;s toxic spines, and must immediately attempt a saving throw against the pufferfish&#x27;s poison.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Pufferfish are a category of poisonous fish that dwell in warm coastal waters. Pufferfish have the ability to rapidly fill their stomachs with water or air, causing their bodies to balloon out and make the poisonous spikes on their skin more pronounced, while increasing their apparent size to frighten predators. While certain aquatic sharks and other animals have adapted to eat pufferfish, the puffer&#x27;s tetrodotoxin (typically delivered via the spines on the fish&#x27;s skin, though prevalent throughout its organs as well) remains highly poisonous to humans and most mammals who must be careful if they wish to eat one of these fish.\n\nPufferfish come in a variety of sizes and types, and most range from 6 inches to 2 feet in length and weigh between 5 and 30 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Pufferfish CR 1/4\nSource Ultimate Wilderness pg. 203, Familiar Folio pg. 25\nXP 100\nN Tiny animal\nInit +6; Senses low-light vision; Perception +5\nDefense\nAC 14, touch 14, flat-footed 12 (+2 Dex, +2 size)\nhp 6 (1d8+2)\nFort +4, Ref +4, Will +1\nDefensive Abilities spines\nOffense\nSpeed swim 20 ft.\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks poison\nStatistics\nStr 4, Dex 14, Con 15, Int 1, Wis 12, Cha 9\nBase Atk +0; CMB +0; CMD 7\nFeats Improved Initiative\nSkills Perception +5, Swim +5\nEcology\nEnvironment warm oceans\nOrganization solitary, pair, or school (3-12)\nTreasure none\nSpecial Abilities\nPoison (Ex) Spines-injury; save Fort DC 12; frequency once; initial effect staggered for 1 round; secondary effect 1 Str damage; cure 2 consecutive saves. If certain portions of the pufferfish's body are eaten, the poison's effect is instead 1d4 points of Constitution damage. The save DC is Constitution-based.\n\nSpines (Ex) Pufferfish aren't equipped to attack other creatures, but foes that strike a pufferfish with an unarmed strike or a natural attack take 1 point of piercing damage from the fish's toxic spines, and must immediately attempt a saving throw against the pufferfish's poison.\nDescription\nPufferfish are a category of poisonous fish that dwell in warm coastal waters. Pufferfish have the ability to rapidly fill their stomachs with water or air, causing their bodies to balloon out and make the poisonous spikes on their skin more pronounced, while increasing their apparent size to frighten predators. While certain aquatic sharks and other animals have adapted to eat pufferfish, the puffer's tetrodotoxin (typically delivered via the spines on the fish's skin, though prevalent throughout its organs as well) remains highly poisonous to humans and most mammals who must be careful if they wish to eat one of these fish.\n\nPufferfish come in a variety of sizes and types, and most range from 6 inches to 2 feet in length and weigh between 5 and 30 pounds.</pre>\n        </div>\n    "
