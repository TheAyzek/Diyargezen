    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Dwarf Caiman CR 1/3 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 195, Pathfinder #55: The Wormwood Mutiny pg. 88<br/>\r\n            <strong>XP 135</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Small \r\n            Animal <br/>\r\n            <strong>Init</strong> 0;\r\n            <strong>Senses</strong> low-light vision; Perception +0; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 11, <strong>Flat-Footed</strong> 14 (+3 natural, +1 size)<br/>\r\n            <strong>Hit Points</strong> 6 (1 HD; 1d8+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 2, <strong>Will</strong> 0\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.; sprint<br/>\r\n                <strong>Melee</strong> bite +1 (1d4)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 10, <strong>Dex</strong> 11, <strong>Con</strong> 15, <strong>Int</strong> 1, <strong>Wis</strong> 11, <strong>Cha</strong> 2<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-1; <strong>CMD</strong> 9<br/>\r\n            <strong>Feats</strong> Skill Focus (Stealth)<br/>\r\n            <strong>Skills</strong> Stealth +11 (+19 in water), Swim +8, Racial Modifiers +8 Stealth in water<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm swamps and rivers<br/>\r\n                <strong>Organization</strong>: solitary, pair, or bask (3-12)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Sprint (ex): Once per minute, a dwarf caiman can sprint, increasing its base speed to 30 feet for 1 round.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Dwarf caimans are a small species of crocodilian predators that live amid the fast-running streams of tropical rainforests and swamps. These patient predators sometimes lie in awkward positions for hours before they strike their prey, their mottled scales disguising them as floating wood.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Dwarf Caiman CR 1/3\nSource Ultimate Wilderness pg. 195, Pathfinder #55: The Wormwood Mutiny pg. 88\nXP 135\nN Small animal\nInit +0; Senses low-light vision; Perception +0\nDefense\nAC 14, touch 11, flat-footed 14 (+3 natural, +1 size)\nhp 6 (1d8+2)\nFort +4, Ref +2, Will +0\nOffense\nSpeed 10 ft., swim 30 ft.; sprint\nMelee bite +1 (1d4)\nStatistics\nStr 10, Dex 11, Con 15, Int 1, Wis 11, Cha 2\nBase Atk +0; CMB -1; CMD 9 (13 vs. trip)\nFeats Skill Focus (Stealth)\nSkills Stealth +11 (+19 in water), Swim +8; Racial Modifiers +8 Stealth in water\nEcology\nEnvironment warm swamps and rivers\nOrganization solitary, pair, or bask (3-12)\nTreasure none\nSpecial Abilities\nSprint (Ex) Once per minute, a dwarf caiman can sprint, increasing its base speed to 30 feet for 1 round.\nDescription\nDwarf caimans are a small species of crocodilian predators that live amid the fast-running streams of tropical rainforests and swamps. These patient predators sometimes lie in awkward positions for hours before they strike their prey, their mottled scales disguising them as floating wood.</pre>\n        </div>\n    "
