  details:
    alignment: ce
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Quasit CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder RPG Bestiary pg. 66<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CE \r\n            Tiny \r\n            Outsider (Chaotic, Demon, Evil, Extraplanar) <br/>\r\n            <strong>Init</strong> 6;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +7; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 14 (+2 Dex, +2 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 16 (3 HD; 3d10);  fast healing 2<br/>\r\n            <strong>Fort</strong> 1, <strong>Ref</strong> 5, <strong>Will</strong> 4\r\n            \r\n            <strong>DR</strong> 5/cold iron or good\r\n            <strong>Immune</strong> electricity, poison; \r\n            <strong>Resist</strong> acid 10, cold 10, fire 10; \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 50 ft. (perfect)<br/>\r\n                <strong>Melee</strong> 2 claws +7 (1d3-1 plus poison), bite +7 (1d4-1)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 14, <strong>Con</strong> 11, <strong>Int</strong> 11, <strong>Wis</strong> 12, <strong>Cha</strong> 11<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +0; <strong>CMD</strong> 12<br/>\r\n            <strong>Feats</strong> Improved Initiative, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Bluff +6, Fly +20, Intimidate +6, Knowledge (planes) +6, Perception +7, Stealth +16<br/>\r\n            <strong>Languages</strong> Abyssal, Common, telepathy (touch)<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Abyss)<br/>\r\n                <strong>Organization</strong>: solitary or flock (2-12)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Poison (ex): Claw-injury; save Fortitude DC 13; frequency 1/round for 6 rounds; effect 1d2 Dexterity; cure 2 consecutive saves. The DC includes a +2 racial bonus.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">The quasit is perhaps the least powerful demon, yet it is not the least respected-even quasits hold themselves above the dretch horde, and true to their natures, dretches lack the courage or drive to prove the quaits wrong. A quasit&#x27;s first role in life is that of a familiar to a spellcasting master, but those quasits who escape from this humiliating servitude become free-willed and much more dangerous.\n\nA typical quasit stands a foot and a half tall, and weighs only 8 pounds. Alone among the demonic horde, quasits do not form from the dead souls of evil mortals. Instead, they form from living souls-when a spellcaster seeks out a quasit to serve him as a familiar, his soul brushes against the Abyss and it reacts, carving from itself a quasit linked to that spellcaster&#x27;s soul and forming a powerful bond between the two. Newly created quasits are birthed directly into the Material Plane, where they become familiars, and while bonded to their masters&#x27; wills, all quasits hate and loathe their lieges, as they can feel the pulse of their lords&#x27; souls and know that they could have been more. A quasit serves, yet it watches and waits for mistakes that might cost its master&#x27;s life, or even better, an error that might let the quasit turn against its master.\n\nWhen a quasit&#x27;s master dies, the quasit can attempt to follow the master&#x27;s soul into the Great Beyond by making a DC 15 Will save. This functions as plane shift, but affects only the quasit and transports it into the Abyss and places its master&#x27;s soul in the quasit&#x27;s possession as a writhing larvae rather than using the evil master&#x27;s soul to create new demonic life. In this manner, a quasit can use its newly captured soul to bargain with more powerful denizens of the lower planes, and perhaps secure a vile transformative &#x27;promotion&#x27; to a more powerful form of life in the process.\n\nRarely, a quasit elects to ignore its master&#x27;s death and instead remains on the Material Plane to seek other ways to entertain itself-usually settling in an urban area where there are plenty of folk to torment.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Quasit CR 2\nSource Pathfinder RPG Bestiary pg. 66\nXP 600\nCE Tiny outsider (chaotic, demon, evil, extraplanar)\nInit +6; Senses darkvision 60 ft.; Perception +7\nDefense\nAC 16, touch 14, flat-footed 14 (+2 Dex, +2 natural, +2 size)\nhp 16 (3d10); fast healing 2\nFort +1, Ref +5, Will +4\nDR 5/cold iron or good; Immune electricity, poison; Resist acid 10, cold 10, fire 10\nOffense\nSpeed 20 ft., fly 50 ft. (perfect)\nMelee 2 claws +7 (1d3-1 plus poison), bite +7 (1d4-1)\nSpace 2-1/2 ft., Reach 0 ft.\nSpell-Like Abilities (CL 6th)\nAt will-detect good, detect magic, invisibility (self only)\n1/day-cause fear (30-foot radius, DC 11)\n1/week-commune (six questions)\nStatistics\nStr 8, Dex 14, Con 11, Int 11, Wis 12, Cha 11\nBase Atk +3; CMB +0; CMD 12\nFeats Improved Initiative, Weapon Finesse\nSkills Bluff +6, Fly +20, Intimidate +6, Knowledge (planes) +6, Perception +7, Stealth +16\nLanguages Abyssal, Common; telepathy (touch)\nSQ change shape (2 of the following forms: bat, Small centipede, toad, or wolf; polymorph)\nEcology\nEnvironment any (Abyss)\nOrganization solitary or flock (2-12)\nTreasure standard\nSpecial Abilities\nPoison (Ex) Claw-injury; save Fortitude DC 13; frequency 1/round for 6 rounds; effect 1d2 Dexterity; cure 2 consecutive saves. The DC includes a +2 racial bonus.\nDescription\nThe quasit is perhaps the least powerful demon, yet it is not the least respected-even quasits hold themselves above the dretch horde, and true to their natures, dretches lack the courage or drive to prove the quaits wrong. A quasit's first role in life is that of a familiar to a spellcasting master, but those quasits who escape from this humiliating servitude become free-willed and much more dangerous.\n\nA typical quasit stands a foot and a half tall, and weighs only 8 pounds. Alone among the demonic horde, quasits do not form from the dead souls of evil mortals. Instead, they form from living souls-when a spellcaster seeks out a quasit to serve him as a familiar, his soul brushes against the Abyss and it reacts, carving from itself a quasit linked to that spellcaster's soul and forming a powerful bond between the two. Newly created quasits are birthed directly into the Material Plane, where they become familiars, and while bonded to their masters' wills, all quasits hate and loathe their lieges, as they can feel the pulse of their lords' souls and know that they could have been more. A quasit serves, yet it watches and waits for mistakes that might cost its master's life, or even better, an error that might let the quasit turn against its master.\n\nWhen a quasit's master dies, the quasit can attempt to follow the master's soul into the Great Beyond by making a DC 15 Will save. This functions as plane shift, but affects only the quasit and transports it into the Abyss and places its master's soul in the quasit's possession as a writhing larvae rather than using the evil master's soul to create new demonic life. In this manner, a quasit can use its newly captured soul to bargain with more powerful denizens of the lower planes, and perhaps secure a vile transformative 'promotion' to a more powerful form of life in the process.\n\nRarely, a quasit elects to ignore its master's death and instead remains on the Material Plane to seek other ways to entertain itself-usually settling in an urban area where there are plenty of folk to torment.</pre>\n        </div>\n    "
