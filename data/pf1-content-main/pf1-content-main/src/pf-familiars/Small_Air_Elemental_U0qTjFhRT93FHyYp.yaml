  details:
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Small Air Elemental CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder RPG Bestiary pg. 120<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Small \r\n            Outsider (Air, Elemental, Extraplanar) <br/>\r\n            <strong>Init</strong> 7;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +4; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 14 (+3 Dex, +3 natural, +1 size)<br/>\r\n            <strong>Hit Points</strong> 13 (2 HD; 2d10+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 6, <strong>Will</strong> 0\r\n            <br/><strong>Defensive Abilities</strong> air mastery; \r\n            \r\n            <strong>Immune</strong> elemental traits; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 100 ft. (perfect)<br/>\r\n                <strong>Melee</strong> slam +6 (1d4+1)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 12, <strong>Dex</strong> 17, <strong>Con</strong> 12, <strong>Int</strong> 4, <strong>Wis</strong> 11, <strong>Cha</strong> 11<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +2; <strong>CMD</strong> 15<br/>\r\n            <strong>Feats</strong> Flyby Attack, Improved Initiative, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Acrobatics +7, Escape Artist +7, Fly +17, Knowledge (planes) +1, Perception +4, Stealth +11<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: Plane of Air<br/>\r\n                \r\n                \r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Air elementals are fast, flying creatures made of living air. Primitive and territorial, they resent being summoned or doing the bidding of mortals, and much prefer to spend their time on the Plane of Air, swooping and racing through the endless skies.\n\nAlthough all air elementals of a similar size have identical statistics, the exact appearance of an air elemental can vary wildly between individuals. One might be an animated vortex of wind and smoke, while another might be a smoky bird-like creature with glowing eyes and wind for wings.\n\nAn air elemental prefers to attack flying or otherwise airbone targets, not only because its mastery over flight gives it a slight advantage, but also because it detests the thought of having to touch the ground. An air elemental can move underwater, and although it is an elemental and thus runs no risk of drowning, it has no ranks in Swim and loses much of its speed and mobility when underwater.\n\nElemental\tHeight\tWeight\tWhirlwind/Vortex Save DC\tWhirlwind/Vortex Height\nSmall\t4 ft.\t1 lb.\t12\t10-20 ft.\nMedium\t8 ft.\t2 lbs.\t14\t10-30 ft.\nLarge\t16 ft.\t4 lbs.\t18\t10-40 ft.\nHuge\t32 ft.\t8 lbs.\t22\t10-50 ft.\nGreater\t36 ft.\t10 lbs.\t23\t10-60 ft.\nElder\t40 ft.\t12 lbs.\t27\t10-60 ft.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Small Air Elemental CR 1\nSource Pathfinder RPG Bestiary pg. 120\nXP 400\nN Small outsider (air, elemental, extraplanar)\nInit +7; Senses darkvision 60 ft.; Perception +4\nDefense\nAC 17, touch 14, flat-footed 14 (+3 Dex, +3 natural, +1 size)\nhp 13 (2d10+2)\nFort +4, Ref +6, Will +0\nDefensive Abilities air mastery; Immune elemental traits\nOffense\nSpeed fly 100 ft. (perfect)\nMelee slam +6 (1d4+1)\nSpecial Attacks whirlwind (DC 12)\nStatistics\nStr 12, Dex 17, Con 12, Int 4, Wis 11, Cha 11\nBase Atk +2; CMB +2; CMD 15\nFeats Flyby Attack, Improved Initiative, Weapon Finesse\nSkills Acrobatics +7, Escape Artist +7, Fly +17, Knowledge (planes) +1, Perception +4, Stealth +11\nEcology\nEnvironment Plane of Air\nDescription\nAir elementals are fast, flying creatures made of living air. Primitive and territorial, they resent being summoned or doing the bidding of mortals, and much prefer to spend their time on the Plane of Air, swooping and racing through the endless skies.\n\nAlthough all air elementals of a similar size have identical statistics, the exact appearance of an air elemental can vary wildly between individuals. One might be an animated vortex of wind and smoke, while another might be a smoky bird-like creature with glowing eyes and wind for wings.\n\nAn air elemental prefers to attack flying or otherwise airbone targets, not only because its mastery over flight gives it a slight advantage, but also because it detests the thought of having to touch the ground. An air elemental can move underwater, and although it is an elemental and thus runs no risk of drowning, it has no ranks in Swim and loses much of its speed and mobility when underwater.\n\nElemental\tHeight\tWeight\tWhirlwind/Vortex Save DC\tWhirlwind/Vortex Height\nSmall\t4 ft.\t1 lb.\t12\t10-20 ft.\nMedium\t8 ft.\t2 lbs.\t14\t10-30 ft.\nLarge\t16 ft.\t4 lbs.\t18\t10-40 ft.\nHuge\t32 ft.\t8 lbs.\t22\t10-50 ft.\nGreater\t36 ft.\t10 lbs.\t23\t10-60 ft.\nElder\t40 ft.\t12 lbs.\t27\t10-60 ft.</pre>\n        </div>\n    "
