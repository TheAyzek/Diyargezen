    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Meerkat CR 1/4 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 200<br/>\r\n            <strong>XP 100</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> low-light vision, scent; Perception +1; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 12 (+2 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 5 (1 HD; 1d8+1)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 4, <strong>Will</strong> 1\r\n            \r\n            \r\n            <strong>Immune</strong> scorpion venom; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 5 ft.<br/>\r\n                <strong>Melee</strong> bite +4 (1d3-3)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 5, <strong>Dex</strong> 14, <strong>Con</strong> 13, <strong>Int</strong> 2, <strong>Wis</strong> 13, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +0; <strong>CMD</strong> 7<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Stealth +14<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm plains<br/>\r\n                <strong>Organization</strong>: solitary, pair, mob (3-16), or clan (17-30)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Immunity to Scorpion Venom (ex): Meerkats are immune to the poison of all scorpions.\n\nMob (ex): If two meerkats in the same square attack the same foe, they are considered to be flanking that foe as if they were in two opposite squares.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Meerkats are playful, highly social animals that hunt and forage during the day. They live in complex burrow systems consisting of numerous access holes, chambers, and tunnels. Their diet consists of eggs, fruit, insects, larvae, lizards, rodents, and scorpions. Using a wide range of sounds, they communicate and warn one another about threats, banding together in a mob when they need to defend themselves. Meerkats can live more than 10 years.\n\nA meerkat weighs around 2 pounds and is about 1 foot tall when standing upright.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Meerkat CR 1/4\nSource Ultimate Wilderness pg. 200\nXP 100\nN Tiny animal\nInit +2; Senses low-light vision, scent; Perception +1\nDefense\nAC 14, touch 14, flat-footed 12 (+2 Dex, +2 size)\nhp 5 (1d8+1)\nFort +3, Ref +4, Will +1\nImmune scorpion venom\nOffense\nSpeed 30 ft., burrow 5 ft.\nMelee bite +4 (1d3-3)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks mob\nStatistics\nStr 5, Dex 14, Con 13, Int 2, Wis 13, Cha 13\nBase Atk +0; CMB +0; CMD 7 (11 vs. trip)\nFeats Weapon Finesse\nSkills Stealth +14\nEcology\nEnvironment warm plains\nOrganization solitary, pair, mob (3-16), or clan (17-30)\nTreasure none\nSpecial Abilities\nImmunity to Scorpion Venom (Ex) Meerkats are immune to the poison of all scorpions.\n\nMob (Ex) If two meerkats in the same square attack the same foe, they are considered to be flanking that foe as if they were in two opposite squares.\nDescription\nMeerkats are playful, highly social animals that hunt and forage during the day. They live in complex burrow systems consisting of numerous access holes, chambers, and tunnels. Their diet consists of eggs, fruit, insects, larvae, lizards, rodents, and scorpions. Using a wide range of sounds, they communicate and warn one another about threats, banding together in a mob when they need to defend themselves. Meerkats can live more than 10 years.\n\nA meerkat weighs around 2 pounds and is about 1 foot tall when standing upright.</pre>\n        </div>\n    "
