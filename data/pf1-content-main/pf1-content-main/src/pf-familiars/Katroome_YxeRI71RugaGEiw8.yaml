  details:
    alignment: cn
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Katroome CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Gallows of Madness pg. 62<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CN \r\n            Small \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 13, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 11 (+2 Dex, +1 size)<br/>\r\n            <strong>Hit Points</strong> 11 (2 HD; 2d10)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 5, <strong>Will</strong> 2\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> slam +1 (1d3-2)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 15, <strong>Con</strong> 10, <strong>Int</strong> 14, <strong>Wis</strong> 11, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +-1; <strong>CMD</strong> 11<br/>\r\n            <strong>Feats</strong> Iron Will<br/>\r\n            <strong>Skills</strong> Acrobatics +5, Bluff +2, Climb +10, Knowledge (arcana) +3, Perception +5, Sense Motive +6, Spellcraft +4, Stealth +10 (+14 in forested environments), Racial Modifiers +4 Sense Motive, +4 Stealth in forested environments<br/>\r\n            <strong>Languages</strong> Common, Goblin, Sylvan<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any forest<br/>\r\n                <strong>Organization</strong>: solitary<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Brilliantly beautiful but nearly as elusive as the breeze, the caterpillar-like katroome is a little creature with an enormous ego. Katroomes are rare and mostly live deep within forests or similar uninhabited areas. Most travelers confuse them with fey creatures, given their magical abilities, capriciousness, and haughty demeanors. In reality, they are magical beasts that almost never reveal themselves to others unless they wish.\n\nKatroomes tend to view themselves as monarchs of their surroundings. They don&#x27;t believe themselves superior to all others in their demesnes; they simply think that it&#x27;s their birthright to protect their homelands and natural surroundings. In turn, they expect to be treated with the respect such a position deserves. To those unfamiliar with a katroome&#x27;s ways, the creature might come across as overbearing or imperious. Even to those who might compliment its beauty, a katroome might condescendingly issue a correction: &#x27;I&#x27;m not beautiful,&#x27; one might say, &#x27;I am regal.&#x27;\n\nTravelers typically encounter katroomes because the creatures are curious about any visitors in their realm. If the travelers seem innocuous and prove that they understand a katroome&#x27;s internalized hierarchy of the area, the katroome might aid them with information. If the travelers are wicked or have disrespected the katroome or its home, the creature might stalk them, using its compulsion abilities and its natural webbing to play malicious pranks on the party.\n\nIn addition to katroomes&#x27; self-assigned roles as protectors and emissaries of the forest, they are also rather avaricious, although they&#x27;ll never admit it. Katroomes love savory culinary items that might appeal to a typical human. They are also enamored of magic, particularly wondrous items. A katroome might descend from its verdant perch to approach a traveler on the pretense of asking her intentions, when in reality, the katroome is merely curious about the shiny brooch on her cloak.\n\nA 5th-level spellcaster can gain a katroome as a familiar if she has the Improved Familiar feat, although the katroome usually believes that the caster is the true familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Katroome CR 1\nSource Gallows of Madness pg. 62\nXP 400\nCN Small magical beast\nInit +2; Senses darkvision 60 ft., low-light vision; Perception +5\nDefense\nAC 13, touch 13, flat-footed 11 (+2 Dex, +1 size)\nhp 11 (2d10)\nFort +3, Ref +5, Will +2\nOffense\nSpeed 20 ft., climb 20 ft.\nMelee slam +1 (1d3-2)\nSpecial Attacks web (+5 ranged, DC 11, 2 hp)\nSpell-Like Abilities (CL 5th; concentration +6)\n3/day-command (DC 12), detect magic\n1/day-invisibility, suggestion (DC 14)\nStatistics\nStr 6, Dex 15, Con 10, Int 14, Wis 11, Cha 13\nBase Atk +2; CMB -1; CMD 11 (can't be tripped)\nFeats Iron Will\nSkills Acrobatics +5, Bluff +2, Climb +10, Knowledge (arcana) +3, Perception +5, Sense Motive +6, Spellcraft +4, Stealth +10 (+14 in forested environments); Racial Modifiers +4 Sense Motive, +4 Stealth in forested environments\nLanguages Common, Goblin, Sylvan\nEcology\nEnvironment any forest\nOrganization solitary\nTreasure standard\nDescription\nBrilliantly beautiful but nearly as elusive as the breeze, the caterpillar-like katroome is a little creature with an enormous ego. Katroomes are rare and mostly live deep within forests or similar uninhabited areas. Most travelers confuse them with fey creatures, given their magical abilities, capriciousness, and haughty demeanors. In reality, they are magical beasts that almost never reveal themselves to others unless they wish.\n\nKatroomes tend to view themselves as monarchs of their surroundings. They don't believe themselves superior to all others in their demesnes; they simply think that it's their birthright to protect their homelands and natural surroundings. In turn, they expect to be treated with the respect such a position deserves. To those unfamiliar with a katroome's ways, the creature might come across as overbearing or imperious. Even to those who might compliment its beauty, a katroome might condescendingly issue a correction: 'I'm not beautiful,' one might say, 'I am regal.'\n\nTravelers typically encounter katroomes because the creatures are curious about any visitors in their realm. If the travelers seem innocuous and prove that they understand a katroome's internalized hierarchy of the area, the katroome might aid them with information. If the travelers are wicked or have disrespected the katroome or its home, the creature might stalk them, using its compulsion abilities and its natural webbing to play malicious pranks on the party.\n\nIn addition to katroomes' self-assigned roles as protectors and emissaries of the forest, they are also rather avaricious, although they'll never admit it. Katroomes love savory culinary items that might appeal to a typical human. They are also enamored of magic, particularly wondrous items. A katroome might descend from its verdant perch to approach a traveler on the pretense of asking her intentions, when in reality, the katroome is merely curious about the shiny brooch on her cloak.\n\nA 5th-level spellcaster can gain a katroome as a familiar if she has the Improved Familiar feat, although the katroome usually believes that the caster is the true familiar.</pre>\n        </div>\n    "
