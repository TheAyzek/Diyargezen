    img: systems/pf1/icons/skills/shadow_12.jpg
    name: 'Sense: Darkvision 60ft.'
    system:
      abilityType: ex
      description:
        value: >-
          Darkvision is the extraordinary ability to see with no light source at
          all, out to a range specified for the creature. Darkvision is
          black-and-white only (colors cannot be discerned). It does not allow
          characters to see anything that they could not see otherwise—invisible
          objects are still invisible, and illusions are still visible as what
          they seem to be. Likewise, darkvision subjects a creature to gaze
          attacks normally. The presence of light does not spoil darkvision.
      subType: racial
    type: feat
  - _id: 4Q65m7wapo9Ki4QA
    _key: '!actors.items!HVhVphay56oZ3heg.4Q65m7wapo9Ki4QA'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/shadow_01.jpg
    name: 'Sense: Deathwatch'
    system:
      abilityType: ex
      description:
        value: >-
          Using the powers of necromancy, you can determine the condition of
          creatures near death within the spell’s range. You instantly know
          whether each creature within the area is dead, fragile (alive and
          wounded, with 3 or fewer hit points left), fighting off death (alive
          with 4 or more hit points), healthy, undead, or neither alive nor dead
          (such as a construct). Deathwatch sees through any spell or ability
          that allows creatures to feign death.
      subType: racial
    type: feat
