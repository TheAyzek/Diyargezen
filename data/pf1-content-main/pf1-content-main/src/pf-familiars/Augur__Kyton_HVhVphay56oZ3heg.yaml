  details:
    alignment: le
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Augur, Kyton CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 3 pg. 171<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            LE \r\n            Tiny \r\n            Outsider (Evil, Extraplanar, Kyton, Lawful) <br/>\r\n            <strong>Init</strong> 7;\r\n            <strong>Senses</strong> darkvision 60 ft., deathwatch; Perception +7; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 14 (+3 Dex, +2 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3); 19 (3d10+3), regeneration 2 (good weapons and spells, silver weapons)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 8, <strong>Will</strong> 4\r\n            \r\n            <strong>DR</strong> 5/good or silver\r\n            <strong>Immune</strong> cold; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 50 ft. (perfect)<br/>\r\n                <strong>Melee</strong> gore +4 (1d4-1 plus bleed)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 17, <strong>Con</strong> 12, <strong>Int</strong> 13, <strong>Wis</strong> 12, <strong>Cha</strong> 7<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Improved Initiative, Lightning Reflexes<br/>\r\n            <strong>Skills</strong> Bluff +4, Escape Artist +9, Fly +15, Intimidate +4, Perception +7, Sense Motive +7, Sleight of Hand +9, Stealth +17<br/>\r\n            <strong>Languages</strong> Common, Infernal (cannot speak)<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Plane of Shadow)<br/>\r\n                <strong>Organization</strong>: solitary, pair, pack (3-5), or squad (6-8)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Unnerving Gaze (ex): A creature that succumbs to an augur&#x27;s unnerving gaze becomes shaken for 1 round.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Gory sentinels with a lust for flesh and the myriad bodily fluids contained within, augurs number among the most common-as well as most despicable-kytons on the Plane of Shadow. Having given up their humanoid bodies in favor of the more stealthy and wretched guise of a singular large eye armored in bloodied metal plates, augurs act as spies and sycophants for more powerful kytons. Their miniscule size, sturdy exterior, and unnerving gazes make them ideally equipped for dangerous reconnaissance missions to the Material Plane, where the augurs are able to scout out potential raiding locations or spot vulnerable, lone travelers before their more powerful kyton brethren cross the planes to attack.\n\nWhile their usefulness in tasks of stealth and guile makes augurs deadly companions, their insatiable lust for blood often proves their ultimate downfall. Augurs, like most kytons, find themselves in a heightened state of arousal when witness to the destruction of flesh, but the extent to which these muscular orbs find pleasure in blood is far more treacherous than their more disciplined peers. Many augurs cannot help but indulge themselves when exposed to gore-rolling within and dipping their blades into freshly spilled pools-an unfortunate trait which has led many careless augurs to their capture or doom.\n\nAn augur&#x27;s gruesome appearance is not always self-inflicted. They are sometimes constructed by other kytons who seek to impose an everlasting punishment upon a particularly unwilling mortal sacrifice; the defiant individual&#x27;s body is cast aside for scraps as its mind and soul are transferred into the monocular shell, producing an augur when the ritual is complete. Augurs are the least pragmatic type of all kytons, and thus the least respected among their peers. The condemnation of an individual&#x27;s spirit to the cage-like body of a kyton augur is the precedent for a truly agonizing and lonely existence.\n\nA lawful evil spellcaster can gain an augur as a familiar at 7th level by taking the Improved Familiar feat.\n\nA typical augur kyton is 1 foot in diameter and weighs 30 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Augur, Kyton CR 2\nSource Bestiary 3 pg. 171\nXP 600\nLE Tiny outsider (evil, extraplanar, kyton, lawful)\nInit +7; Senses darkvision 60 ft., deathwatch; Perception +7\nDefense\nAC 17, touch 15, flat-footed 14 (+3 Dex, +2 natural, +2 size)\nhp 19 (3d10+3); regeneration 2 (good weapons and spells, silver weapons)\nFort +2, Ref +8, Will +4\nDR 5/good or silver; Immune cold\nOffense\nSpeed 20 ft., fly 50 ft. (perfect)\nMelee gore +4 (1d4-1 plus bleed)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks bleed (1d2), unnerving gaze (30 ft., DC 9)\nSpell-Like Abilities (CL 6th; concentration +4)\nConstant-deathwatch\nAt will-bleed (DC 8), mage hand, open/close\n3/day-inflict light wounds (DC 9)\n1/week-commune (CL 12th, 6 questions)\nStatistics\nStr 8, Dex 17, Con 12, Int 13, Wis 12, Cha 7\nBase Atk +3; CMB +4; CMD 13 (can't be tripped)\nFeats Improved Initiative, Lightning Reflexes\nSkills Bluff +4, Escape Artist +9, Fly +15, Intimidate +4, Perception +7, Sense Motive +7, Sleight of Hand +9, Stealth +17\nLanguages Common, Infernal (cannot speak)\nEcology\nEnvironment any (Plane of Shadow)\nOrganization solitary, pair, pack (3-5), or squad (6-8)\nTreasure standard\nSpecial Abilities\nUnnerving Gaze (Ex) A creature that succumbs to an augur's unnerving gaze becomes shaken for 1 round.\nDescription\nGory sentinels with a lust for flesh and the myriad bodily fluids contained within, augurs number among the most common-as well as most despicable-kytons on the Plane of Shadow. Having given up their humanoid bodies in favor of the more stealthy and wretched guise of a singular large eye armored in bloodied metal plates, augurs act as spies and sycophants for more powerful kytons. Their miniscule size, sturdy exterior, and unnerving gazes make them ideally equipped for dangerous reconnaissance missions to the Material Plane, where the augurs are able to scout out potential raiding locations or spot vulnerable, lone travelers before their more powerful kyton brethren cross the planes to attack.\n\nWhile their usefulness in tasks of stealth and guile makes augurs deadly companions, their insatiable lust for blood often proves their ultimate downfall. Augurs, like most kytons, find themselves in a heightened state of arousal when witness to the destruction of flesh, but the extent to which these muscular orbs find pleasure in blood is far more treacherous than their more disciplined peers. Many augurs cannot help but indulge themselves when exposed to gore-rolling within and dipping their blades into freshly spilled pools-an unfortunate trait which has led many careless augurs to their capture or doom.\n\nAn augur's gruesome appearance is not always self-inflicted. They are sometimes constructed by other kytons who seek to impose an everlasting punishment upon a particularly unwilling mortal sacrifice; the defiant individual's body is cast aside for scraps as its mind and soul are transferred into the monocular shell, producing an augur when the ritual is complete. Augurs are the least pragmatic type of all kytons, and thus the least respected among their peers. The condemnation of an individual's spirit to the cage-like body of a kyton augur is the precedent for a truly agonizing and lonely existence.\n\nA lawful evil spellcaster can gain an augur as a familiar at 7th level by taking the Improved Familiar feat.\n\nA typical augur kyton is 1 foot in diameter and weighs 30 pounds.</pre>\n        </div>\n    "
