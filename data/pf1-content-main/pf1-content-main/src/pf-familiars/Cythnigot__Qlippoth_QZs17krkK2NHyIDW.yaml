    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Cythnigot, Qlippoth CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 2 pg. 221<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CE \r\n            Tiny \r\n            Outsider (Chaotic, Evil, Extraplanar, Qlippoth) <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> darkvision 60 ft., detect law, detect magic; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 13 (+1 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 16 (3 HD; 3d10)<br/>\r\n            <strong>Fort</strong> 1, <strong>Ref</strong> 6, <strong>Will</strong> 2\r\n            \r\n            <strong>DR</strong> 5/cold iron or lawful\r\n            <strong>Immune</strong> cold, poison, mind-affecting effects; \r\n            <strong>Resist</strong> acid 10, electricity 10, fire 10; \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (good)<br/>\r\n                <strong>Melee</strong> bite +6 (1d6+1 plus spores)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 12, <strong>Dex</strong> 12, <strong>Con</strong> 11, <strong>Int</strong> 11, <strong>Wis</strong> 8, <strong>Cha</strong> 7<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +2; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Lightning Reflexes, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Acrobatics +7 (+11 jump), Fly +15, Knowledge (nature) +6, Knowledge (planes) +6, Perception +5, Stealth +15<br/>\r\n            <strong>Languages</strong> Abyssal, telepathy (touch)<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Abyss)<br/>\r\n                <strong>Organization</strong>: solitary or bloom (2-12)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Horrific Appearance (su): Creatures that succumb to a cythnigot&#x27;s horrific appearance become sickened for 1 round-a cythnigot&#x27;s horrific appearance only functions to a range of 10 feet. Once a creature makes a saving throw against a particular cythnigot&#x27;s horrific appearance, that creature is immune to the horrific appearance of all cythnigots for 24 hours. A spellcaster that has a cythnigot as a familiar is immune to the horrific appearance of all cythnigots, and also gains a +4 bonus on saving throws made against any qlippoth&#x27;s horrific appearance.\n\nSpores (su): Any creature bitten by a cythnigot must make a DC 11 Fortitude save or become infested by the creature&#x27;s otherworldly spores. These spores cause twitching spikes and hideous pallid growths of hair-like fibers to erupt from the bite wound and to writhe and wrap around the target&#x27;s limbs. A creature suffering from these spores is entangled, and can attempt a new DC 11 Fortitude save in later rounds as a standard action to rip the tendrils free and escape the entangled condition. The effects of multiple cythnigot bites on a creature do not stack. Plant creatures take a -4 penalty on saves against this effect. This is a disease effect. The save DC is Constitution-based.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">The cythnigot is a foul fungal parasite that grows and thrives within the corpses of small animals. The fungus transforms the host corpse in hideous ways, adding legs or rearranging features-a rat might gain an extra pair of legs and an insectoid visage, while a cat could lose all its legs and fur and gain a snake-like body. The only thing that all cythnigots have in common is a long stalk of fungal material that extends up from the creature&#x27;s body, ending in a surprisingly strong set of fanged jaws. A cythnigot without a host body appears as little more than a foul-smelling puffball the size of a human&#x27;s fist.\n\nChaotic evil spellcasters of caster level 7th who have the Improved Familiar feat can gain a cythnigot as a familiar-to do so, the spellcaster must already have a Tiny animal as a familiar. Infusing this familiar with the spores results in a cythnigot that is a loyal, if rather disgusting, minion of the spellcaster.\n\nA cythnigot is about 20 inches long and weighs 10 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Cythnigot, Qlippoth CR 2\nSource Bestiary 2 pg. 221\nXP 600\nCE Tiny outsider (chaotic, evil, extraplanar, qlippoth)\nInit +1; Senses darkvision 60 ft., detect law, detect magic; Perception +5\nDefense\nAC 14, touch 13, flat-footed 13 (+1 Dex, +1 natural, +2 size)\nhp 16 (3d10)\nFort +1, Ref +6, Will +2\nDR 5/cold iron or lawful; Immune cold, poison, mind-affecting effects; Resist acid 10, electricity 10, fire 10\nOffense\nSpeed 40 ft., fly 60 ft. (good)\nMelee bite +6 (1d6+1 plus spores)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks horrific appearance (10 feet, DC 9)\nSpell-Like Abilities (CL 6th, concentration +4)\nConstant-detect law, detect magic, fly\n1/day-soften earth and stone, warp wood\n1/week-commune (six questions)\nStatistics\nStr 12, Dex 12, Con 11, Int 11, Wis 8, Cha 7\nBase Atk +3; CMB +2; CMD 13 (21 vs. trip)\nFeats Lightning Reflexes, Weapon Finesse\nSkills Acrobatics +7 (+11 jump), Fly +15, Knowledge (nature) +6, Knowledge (planes) +6, Perception +5, Stealth +15\nLanguages Abyssal; telepathy (touch)\nEcology\nEnvironment any (Abyss)\nOrganization solitary or bloom (2-12)\nTreasure standard\nSpecial Abilities\nHorrific Appearance (Su) Creatures that succumb to a cythnigot's horrific appearance become sickened for 1 round-a cythnigot's horrific appearance only functions to a range of 10 feet. Once a creature makes a saving throw against a particular cythnigot's horrific appearance, that creature is immune to the horrific appearance of all cythnigots for 24 hours. A spellcaster that has a cythnigot as a familiar is immune to the horrific appearance of all cythnigots, and also gains a +4 bonus on saving throws made against any qlippoth's horrific appearance.\n\nSpores (Su) Any creature bitten by a cythnigot must make a DC 11 Fortitude save or become infested by the creature's otherworldly spores. These spores cause twitching spikes and hideous pallid growths of hair-like fibers to erupt from the bite wound and to writhe and wrap around the target's limbs. A creature suffering from these spores is entangled, and can attempt a new DC 11 Fortitude save in later rounds as a standard action to rip the tendrils free and escape the entangled condition. The effects of multiple cythnigot bites on a creature do not stack. Plant creatures take a -4 penalty on saves against this effect. This is a disease effect. The save DC is Constitution-based.\nDescription\nThe cythnigot is a foul fungal parasite that grows and thrives within the corpses of small animals. The fungus transforms the host corpse in hideous ways, adding legs or rearranging features-a rat might gain an extra pair of legs and an insectoid visage, while a cat could lose all its legs and fur and gain a snake-like body. The only thing that all cythnigots have in common is a long stalk of fungal material that extends up from the creature's body, ending in a surprisingly strong set of fanged jaws. A cythnigot without a host body appears as little more than a foul-smelling puffball the size of a human's fist.\n\nChaotic evil spellcasters of caster level 7th who have the Improved Familiar feat can gain a cythnigot as a familiar-to do so, the spellcaster must already have a Tiny animal as a familiar. Infusing this familiar with the spores results in a cythnigot that is a loyal, if rather disgusting, minion of the spellcaster.\n\nA cythnigot is about 20 inches long and weighs 10 pounds.</pre>\n        </div>\n    "
