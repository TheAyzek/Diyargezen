          tag: evasion
      associations:
        classes:
          - Monk
          - Rogue
      description:
        value: >-
          <p>This character can avoid damage from many area-effect attacks. If
          she makes a successful <a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Reflex">Reflex</a>&nbsp;<a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Saving-Throws">saving
          throw</a> against an attack that normally deals half damage on a
          successful save, she instead takes no damage. Evasion can be used only
          if the character is wearing light armor or no armor. A <a
          href="https://www.d20pfsrd.com/gamemastering/conditions#TOC-Helpless">helpless</a>
          character does not gain the benefit of <a
          href="https://www.d20pfsrd.com/classes/core-classes/rogue#TOC-Evasion-Ex-">evasion</a>.</p>
      subType: classFeat
