  details:
    cr:
      base: 0.3375
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Rhamphorhynchus CR 1/3 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder #37: Souls for Smuggler&#x27;s Shiv pg. 82<br/>\r\n            <strong>XP 135</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> low-light vision, scent; Perception +6; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 12 (+3 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 4 (1 HD; 1d8)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 7, <strong>Will</strong> 2\r\n            <br/><strong>Defensive Abilities</strong> evasion; \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 40 ft. (good)<br/>\r\n                <strong>Melee</strong> bite +0 (1d3-2)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 17, <strong>Con</strong> 11, <strong>Int</strong> 2, <strong>Wis</strong> 14, <strong>Cha</strong> 11<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +1; <strong>CMD</strong> 9<br/>\r\n            <strong>Feats</strong> Lightning Reflexes<br/>\r\n            <strong>Skills</strong> Fly +11, Perception +6, Stealth +11<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm coastline or forest<br/>\r\n                <strong>Organization</strong>: solitary, pair, or flock (3-16)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Sudden Swoop (ex): If a rhamphorhynchus makes a charge attack while flying, it does not provoke attacks of opportunity when it enters an opponent&#x27;s space to make a melee attack. It also gains a +2 bonus on damage rolls with its bite attack when it makes a sudden swoop.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Pterosaurs are often found in regions where dinosaurs and other prehistoric creatures are commonly encountered, yet they are not dinosaurs themselves. The pteranodon is the most well known and widespread of these f lying reptiles, but numerous other species exist, such as the relatively small rhamphorhynchus, the venomous dimorphodon, and the lumbering, giraffe-sized quetzalcoatlus. While the larger pterosaurs are awkward f liers, the smaller ones can be quite agile and quick. Pterosaurs generally dwell on coastlines, along rivers, or near swamps or lakes, for the majority of their diet consists of fish snatched from the water in daring dives. Pterosaurs are quite territorial, though, and most won&#x27;t hesitate to swoop down and hiss, shriek, and attack things their size or larger.\n\nRhamphorhynchus\nThis pterosaur is a quick-moving reptile with a 5-foot wingspan, a narrow snout filled with dozens of needle-like teeth, and a long tail tipped with an arrowheadshaped ridge. Males are generally quite brightly colored, displaying brilliant reds, greens, and bright blues, often bearing complex patterns like stripes; females tend to be more drably colored. Although tiny, the rhamphorhynchus is swift and aggressive, and its attack method of swooping down suddenly to attack creatures allows it to bite with increased damage and ferocity. At the end of a sudden swoop, a rhamphorhynchus is typically at a disadvantage, and most won&#x27;t stick around to keep fighting in melee, instead taking to the air once more to gain enough height to swoop again in a few rounds. Their tiny size, erratic f light patterns, and swift ref lexes make them difficult to affect with area effects. A pterosaur on the ground walks in a quadrupedal gait; the tips of its wings arc up alongside its body, while its lower torso remains closer to the ground than its shoulders and head as it moves.\n\nRhamphorhynchus Familiars\nRhamphorhynchuses (also called swoop lizards) make excellent familiars for spellcasters who are looking for a quick and nimble minion. A rhamphorhynchus familiar grants its master all of the typical benefits familiars grant, but their jittery and quick reactions also impart a +2 bonus on the master&#x27;s Initiative checks. A rhamphorhynchus is generally too small to serve well as an animal companion - if a character wishes to take one as a companion anyway, they have the same statistics as bird animal companions\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Rhamphorhynchus CR 1/3\nSource Pathfinder #37: Souls for Smuggler's Shiv pg. 82\nXP 135\nN Tiny animal\nInit +3; Senses low-light vision, scent; Perception +6\nDefense\nAC 15, touch 15, flat-footed 12 (+3 Dex, +2 size)\nhp 4 (1d8)\nFort +2, Ref +7, Will +2\nDefensive Abilities evasion\nOffense\nSpeed 10 ft., fly 40 ft. (good)\nMelee bite +0 (1d3-2)\nSpace 2-1/2 ft., Reach 2-1/2 ft.\nSpecial Attacks sudden swoop\nStatistics\nStr 6, Dex 17, Con 11, Int 2, Wis 14, Cha 11\nBase Atk +0; CMB +1; CMD 9\nFeats Lightning Reflexes\nSkills Fly +11, Perception +6, Stealth +11\nEcology\nEnvironment warm coastline or forest\nOrganization solitary, pair, or flock (3-16)\nTreasure none\nSpecial Abilities\nSudden Swoop (Ex) If a rhamphorhynchus makes a charge attack while flying, it does not provoke attacks of opportunity when it enters an opponent's space to make a melee attack. It also gains a +2 bonus on damage rolls with its bite attack when it makes a sudden swoop.\nDescription\nPterosaurs are often found in regions where dinosaurs and other prehistoric creatures are commonly encountered, yet they are not dinosaurs themselves. The pteranodon is the most well known and widespread of these f lying reptiles, but numerous other species exist, such as the relatively small rhamphorhynchus, the venomous dimorphodon, and the lumbering, giraffe-sized quetzalcoatlus. While the larger pterosaurs are awkward f liers, the smaller ones can be quite agile and quick. Pterosaurs generally dwell on coastlines, along rivers, or near swamps or lakes, for the majority of their diet consists of fish snatched from the water in daring dives. Pterosaurs are quite territorial, though, and most won't hesitate to swoop down and hiss, shriek, and attack things their size or larger.\n\nRhamphorhynchus\nThis pterosaur is a quick-moving reptile with a 5-foot wingspan, a narrow snout filled with dozens of needle-like teeth, and a long tail tipped with an arrowheadshaped ridge. Males are generally quite brightly colored, displaying brilliant reds, greens, and bright blues, often bearing complex patterns like stripes; females tend to be more drably colored. Although tiny, the rhamphorhynchus is swift and aggressive, and its attack method of swooping down suddenly to attack creatures allows it to bite with increased damage and ferocity. At the end of a sudden swoop, a rhamphorhynchus is typically at a disadvantage, and most won't stick around to keep fighting in melee, instead taking to the air once more to gain enough height to swoop again in a few rounds. Their tiny size, erratic f light patterns, and swift ref lexes make them difficult to affect with area effects. A pterosaur on the ground walks in a quadrupedal gait; the tips of its wings arc up alongside its body, while its lower torso remains closer to the ground than its shoulders and head as it moves.\n\nRhamphorhynchus Familiars\nRhamphorhynchuses (also called swoop lizards) make excellent familiars for spellcasters who are looking for a quick and nimble minion. A rhamphorhynchus familiar grants its master all of the typical benefits familiars grant, but their jittery and quick reactions also impart a +2 bonus on the master's Initiative checks. A rhamphorhynchus is generally too small to serve well as an animal companion - if a character wishes to take one as a companion anyway, they have the same statistics as bird animal companions</pre>\n        </div>\n    "
