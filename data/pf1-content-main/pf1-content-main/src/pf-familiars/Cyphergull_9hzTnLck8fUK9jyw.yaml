  details:
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Cyphergull CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder #133: Secrets of Roderic&#x27;s Cove pg. 82<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> Arcana sight, darkvision 60 ft., low-light vision; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 12 (+3 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 6, <strong>Will</strong> 4\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 50 ft. (good)<br/>\r\n                <strong>Melee</strong> bite +3 (1d4-1), 2 talons +3 (1d3-1)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 17, <strong>Con</strong> 13, <strong>Int</strong> 6, <strong>Wis</strong> 13, <strong>Cha</strong> 8<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 12<br/>\r\n            <strong>Feats</strong> Flyby Attack, Iron Will<br/>\r\n            <strong>Skills</strong> Acrobatics +15, Fly +15, Perception +5, Swim +11, Racial Modifiers +8 Acrobatics<br/>\r\n            <strong>Languages</strong> Common (can&#x27;t speak)<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate coasts<br/>\r\n                <strong>Organization</strong>: solitary, pair, flock (3-12), or colony<br/>\r\n                <strong>Treasure</strong>: incidental<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Arcane Attacks (su): A cyphergull&#x27;s natural weapons have a +1 bonus to damage and are treated as magic for the purpose of overcoming damage reduction. For every 5 Hit Dice the cyphergull has, this bonus increases by 1.\n\nCypher Synergy (ex): If the master of a cyphergull familiar is a cyphermage, the cyphergull gains the following cypher lore discoveries if its master has them: analyze scroll, bypass symbol, defensive scrollcaster, and glyph finder. Defensive scrollcaster affects spells the cyphergull casts using its devour scroll ability. Devour Scroll\n\nNatural Thief (ex): If a cyphergull succeeds at an Acrobatics check to move through a threatened square without provoking an attack of opportunity from an enemy, the cyphergull also doesn&#x27;t provoke an attack of opportunity when performing a steal combat maneuver against that enemy on the same turn.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">The noisy, enigmatic cyphergulls are a common sight in the coastal city of Riddleport, where they often circle above the ancient rune-carved Cyphergate as if they own it. Their appearance and behavior greatly resembles those of their mundane cousins-seagulls-but they are far more intelligent, and their connection to Riddleport&#x27;s ancient Thassilonian stone arch grants them many magical abilities.\n\nA cyphergull is a little over 2 feet long, has a wingspan of up to 5 feet, and weighs 3 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Cyphergull CR 2\nSource Pathfinder #133: Secrets of Roderic's Cove pg. 82\nXP 600\nN Tiny magical beast\nInit +3; Senses arcane sight, darkvision 60 ft., low-light vision; Perception +5\nDefense\nAC 15, touch 15, flat-footed 12 (+3 Dex, +2 size)\nhp 19 (3d10+3)\nFort +4, Ref +6, Will +4\nOffense\nSpeed 10 ft., fly 50 ft. (good), swim 10 ft.\nMelee bite +3 (1d4-1), 2 talons +3 (1d3-1)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks arcane attacks, natural thief\nSpell-Like Abilities (CL 3rd; concentration +2)\nConstant-arcane sight, read magic\nAt will-arcane mark\nStatistics\nStr 6, Dex 17, Con 13, Int 6, Wis 13, Cha 8\nBase Atk +3; CMB +4; CMD 12\nFeats Flyby Attack, Iron Will\nSkills Acrobatics +15, Fly +15, Perception +5, Swim +11; Racial Modifiers +8 Acrobatics\nLanguages Common (can't speak)\nSQ cypher synergy, devour scroll\nEcology\nEnvironment temperate coasts\nOrganization solitary, pair, flock (3-12), or colony\nTreasure incidental\nSpecial Abilities\nArcane Attacks (Su) A cyphergull's natural weapons have a +1 bonus to damage and are treated as magic for the purpose of overcoming damage reduction. For every 5 Hit Dice the cyphergull has, this bonus increases by 1.\n\nCypher Synergy (Ex) If the master of a cyphergull familiar is a cyphermage, the cyphergull gains the following cypher lore discoveries if its master has them: analyze scroll, bypass symbol, defensive scrollcaster, and glyph finder. Defensive scrollcaster affects spells the cyphergull casts using its devour scroll ability. Devour Scroll (Su) When a cyphergull eats a scroll (a full-round action), the spells in the scroll are stored in the gull's body. Thereafter, it can cast the spells as though it were a wizard of a level equal to half the cyphergull's Hit Dice casting spells from a scroll. The cyphergull intuitively understands how the spells function and counts as having the requisite ability score for casting the spell. A cyphergull can store a maximum number of spell levels equal to its Hit Dice.\n\nNatural Thief (Ex) If a cyphergull succeeds at an Acrobatics check to move through a threatened square without provoking an attack of opportunity from an enemy, the cyphergull also doesn't provoke an attack of opportunity when performing a steal combat maneuver against that enemy on the same turn.\nDescription\nThe noisy, enigmatic cyphergulls are a common sight in the coastal city of Riddleport, where they often circle above the ancient rune-carved Cyphergate as if they own it. Their appearance and behavior greatly resembles those of their mundane cousins-seagulls-but they are far more intelligent, and their connection to Riddleport's ancient Thassilonian stone arch grants them many magical abilities.\n\nA cyphergull is a little over 2 feet long, has a wingspan of up to 5 feet, and weighs 3 pounds.</pre>\n        </div>\n    "
