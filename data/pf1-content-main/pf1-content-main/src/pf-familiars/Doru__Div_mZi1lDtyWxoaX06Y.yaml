  details:
    alignment: ne
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Doru CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 3 pg. 86, Pathfinder #19: Howl of the Carrion King pg. 80<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            NE \r\n            Tiny \r\n            Outsider (Div, Evil, Extraplanar) <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> darkvision 60 ft., detect good, detect magic, see in darkness; Perception +7; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 18, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 15 (+3 Dex, +3 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 16 (3 HD; 3d10)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 4, <strong>Will</strong> 4\r\n            \r\n            <strong>DR</strong> 10/cold iron or good\r\n            <strong>Immune</strong> fire, poison; \r\n            <strong>Resist</strong> acid 10, electricity 10; \r\n            <strong>SR</strong> 13\r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 40 ft. (perfect)<br/>\r\n                <strong>Melee</strong> bite +9 (1d4-1 plus poison)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 17, <strong>Con</strong> 10, <strong>Int</strong> 10, <strong>Wis</strong> 12, <strong>Cha</strong> 14<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Weapon Finesse, Weapon Focus (bite)<br/>\r\n            <strong>Skills</strong> Bluff +8, Fly +15, Knowledge (arcana) +6, Knowledge (planes) +6, Perception +7, Spellcraft +6, Stealth +17<br/>\r\n            <strong>Languages</strong> Abyssal, Celestial, Infernal, telepathy 100 ft.<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Abaddon)<br/>\r\n                <strong>Organization</strong>: solitary<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Poison (ex): Bite-injury; save Fort DC 11; frequency 1/round for 6 rounds; effect 1d2 Wis; cure 2 consecutive saves.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Dorus are the divs that whisper in the night, the foul inspiration that drifts upon fetid winds, the messengers of pretender gods. Wild hair whips around a doru&#x27;s six twisting horns, while a flat nose, a fanged mouth, and red glowing eyes complete the terrifying image of this bodiless monstrosity. Dorus almost always fly, preferring to stay at heights that keep them at the eye level of those with whom they would have dealings. When not flying, dorus roll across the ground in a disturbing manner, horns bouncing and teeth clattering as the creatures cackle and cartwheel, terrifying children and shocking the faint of heart.\n\nThe least of the divs, dorus serve as messengers and servants of other divs and sometimes mortal spellcasters. While not strong combatants, dorus prefer to sow ruin in more subtle ways. They enjoy tainting mortals with exaggerated news and outright lies, trying to turn impressionable beings to waste and wickedness. Even if a doru fails to fully corrupt an intelligent being itself, it attempts to weaken the target&#x27;s will, making the victim more pliable to future corruption and ruin.\n\nAll divs have some manner of esoteric flaw in their personalities-dorus are obsessed with secrets. These covetous fiends hoard secrets and legends like a miser hoards gold. This thirst for information causes the curious dorus to enter into ridiculous bargains to obtain hidden knowledge from those they believe hold tales of special interest or value, especially when such information has the potential to aid in the corruption of future souls. Such bargains are usually what seal dorus to servitude, whether their service be to other divs or to mortal spellcasters. Cunning creatures, dorus often act as double (and sometimes triple) agents, but they rarely maintain this complex series of lies and deceptions for long. Dorus abhor mortals, as all divs do, and find it difficult to remain obedient to such beings for more than a span of a few decades at most. Only the most precious and profane secrets have the potential to keep a doru faithful to a mortal master for more than a century.\n\nServing greater divs or mortal spellcasters, divs deliver messages, most directly plucked from secret sources. Dorus&#x27; spell-like abilities make them excellent spies, granting them the ability to infiltrate, eavesdrop while invisible, and charm their way out of perilous situations. Those serving mortals pride themselves on manipulating their masters into furthering the divs&#x27; own ends. Many evil spellcasters seeking profane power and ancient evil secrets seek to take dorus as familiars. A neutral evil spellcaster of at least 7th level who takes the Improved Familiar feat can select a doru as a familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Doru CR 2\nSource Bestiary 3 pg. 86, Pathfinder #19: Howl of the Carrion King pg. 80\nXP 600\nNE Tiny outsider (div, evil, extraplanar)\nInit +3; Senses darkvision 60 ft., detect good, detect magic, see in darkness; Perception +7\nDefense\nAC 18, touch 15, flat-footed 15 (+3 Dex, +3 natural, +2 size)\nhp 16 (3d10)\nFort +3, Ref +4, Will +4\nDR 10/cold iron or good; Immune fire, poison; Resist acid 10, electricity 10; SR 13\nOffense\nSpeed 20 ft., fly 40 ft. (perfect)\nMelee bite +9 (1d4-1 plus poison)\nSpace 2-1/2 ft., Reach 0 ft.\nSpell-Like Abilities (CL 6th; concentration +8)\nConstant-detect good, detect magic\nAt will-invisibility (self only)\n3/day-charm person (DC 13), minor image (DC 14)\n1/day-suggestion (DC 15)\n1/week-commune (CL 12th, 6 questions)\nStatistics\nStr 8, Dex 17, Con 10, Int 10, Wis 12, Cha 14\nBase Atk +3; CMB +4; CMD 13 (can't be tripped)\nFeats Weapon Finesse, Weapon Focus (bite)\nSkills Bluff +8, Fly +15, Knowledge (arcana) +6, Knowledge (planes) +6, Perception +7, Spellcraft +6, Stealth +17\nLanguages Abyssal, Celestial, Infernal; telepathy 100 ft.\nEcology\nEnvironment any (Abaddon)\nOrganization solitary\nTreasure none\nSpecial Abilities\nPoison (Ex) Bite-injury; save Fort DC 11; frequency 1/round for 6 rounds; effect 1d2 Wis; cure 2 consecutive saves.\nDescription\nDorus are the divs that whisper in the night, the foul inspiration that drifts upon fetid winds, the messengers of pretender gods. Wild hair whips around a doru's six twisting horns, while a flat nose, a fanged mouth, and red glowing eyes complete the terrifying image of this bodiless monstrosity. Dorus almost always fly, preferring to stay at heights that keep them at the eye level of those with whom they would have dealings. When not flying, dorus roll across the ground in a disturbing manner, horns bouncing and teeth clattering as the creatures cackle and cartwheel, terrifying children and shocking the faint of heart.\n\nThe least of the divs, dorus serve as messengers and servants of other divs and sometimes mortal spellcasters. While not strong combatants, dorus prefer to sow ruin in more subtle ways. They enjoy tainting mortals with exaggerated news and outright lies, trying to turn impressionable beings to waste and wickedness. Even if a doru fails to fully corrupt an intelligent being itself, it attempts to weaken the target's will, making the victim more pliable to future corruption and ruin.\n\nAll divs have some manner of esoteric flaw in their personalities-dorus are obsessed with secrets. These covetous fiends hoard secrets and legends like a miser hoards gold. This thirst for information causes the curious dorus to enter into ridiculous bargains to obtain hidden knowledge from those they believe hold tales of special interest or value, especially when such information has the potential to aid in the corruption of future souls. Such bargains are usually what seal dorus to servitude, whether their service be to other divs or to mortal spellcasters. Cunning creatures, dorus often act as double (and sometimes triple) agents, but they rarely maintain this complex series of lies and deceptions for long. Dorus abhor mortals, as all divs do, and find it difficult to remain obedient to such beings for more than a span of a few decades at most. Only the most precious and profane secrets have the potential to keep a doru faithful to a mortal master for more than a century.\n\nServing greater divs or mortal spellcasters, divs deliver messages, most directly plucked from secret sources. Dorus' spell-like abilities make them excellent spies, granting them the ability to infiltrate, eavesdrop while invisible, and charm their way out of perilous situations. Those serving mortals pride themselves on manipulating their masters into furthering the divs' own ends. Many evil spellcasters seeking profane power and ancient evil secrets seek to take dorus as familiars. A neutral evil spellcaster of at least 7th level who takes the Improved Familiar feat can select a doru as a familiar.</pre>\n        </div>\n    "
