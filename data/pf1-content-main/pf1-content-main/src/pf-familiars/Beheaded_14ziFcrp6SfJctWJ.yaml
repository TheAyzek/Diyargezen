                        <h3>Description</h3>        <div style="white-space:pre-wrap">A beheaded is a severed head or skull animated as a mindless undead sentinel that silently floats at eye level as it lies in wait for living prey or is sent out into the lands of the living to terrorize everyone it finds. A beheaded set loose near populated areas thumps ominously against shut doors and windows, biding its time until someone responds to the incessant knocking. The beheaded then assaults this victim.

        Beheaded also guard grim crypts, abattoirs, and hideouts of murders who
        like to keep reminders of their past sins close at hand. Beheaded come
        in many varieties, usually based on the creature the head came from. A
        beheaded prefers to float at head height so it can more easily attack
        the face, neck, and shoulders of its victim.


        A neutral evil spellcaster can gain a beheaded as a familiar at 3rd
        level by taking the Improved Familiar feat. A beheaded familiar loses
        the mindless trait and has an Intelligence score appropriate for its
        master's level.

