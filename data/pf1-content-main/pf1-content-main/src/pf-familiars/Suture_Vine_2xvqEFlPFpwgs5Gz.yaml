    name: Blood Sense
    system:
      abilityType: ex
      description:
        value: >-
          A suture vine can sense badly wounded creatures, including those at
          less than half their normal hit point total or suffering from bleed
          damage, as if it had the scent ability.
      subType: classFeat
    type: feat
  - _id: QKYDcu1YK2cCuuXb
    _key: '!actors.items!2xvqEFlPFpwgs5Gz.QKYDcu1YK2cCuuXb'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Seal Wound
    system:
      abilityType: ex
      description:
        value: >-
          A suture vine instinctively latches on to a creature that suffers from
          bleed damage or is at less than half its normal hit point total. When
          it attempts to seal wounds in this way, it must make a normal vine
          attack but gains attach as per the universal monster rule. If it
          successfully attaches to the target (dealing damage as normal), any
          bleed damage currently suffered by the target immediately ends. The
          suture vine remains attached for 24 hours, gaining nutrients from
          sipping at the victim's blood but never enough to cause any further
          damage. The vine drops off automatically once a target has no hit
          point damage or 24 hours have passed, whichever comes first. A suture
          vine can seal wounds in this manner only once per day.
      subType: classFeat
    type: feat
  - _id: MuXruh1JrO6AqG7z
