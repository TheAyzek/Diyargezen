  - _id: vkzpUzXm3ufFFLpZ
    _key: '!actors.items!tFg4TBKkrBrzjGDn.vkzpUzXm3ufFFLpZ'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Dweomer Leap
    system:
      abilityType: su
      description:
        value: >-
          When a dweomercat is targeted by a spell or within the area of effect
          of a spell, it can, as a swift action, choose to teleport to a square
          adjacent to the spell's caster, effectively appearing mid-leap and
          aimed toward the caster. This ability takes effect regardless of
          whether or not the spell overcomes the dweomercat's spell resistance.
          If it chooses, the dweomercat can immediately make a full attack
          against the spell's caster as though pouncing. Using this ability does
          not provoke an attack of opportunity. If there is no safe space
          adjacent to the caster-or if the dweomercat chooses-the dweomercat can
          forgo using this ability.
      subType: classFeat
    type: feat
