  details:
    cr:
      base: 0.25
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Snark CR 1/4 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder #119: Prisoners of the Blight pg. 83<br/>\r\n            <strong>XP 100</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Diminutive \r\n            Animal <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> low-light vision, scent; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 14 (+1 Dex, +4 size)<br/>\r\n            <strong>Hit Points</strong> 3 (1 HD; 1d8-1)<br/>\r\n            <strong>Fort</strong> 1, <strong>Ref</strong> 3, <strong>Will</strong> 1\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft. (poor)<br/>\r\n                <strong>Melee</strong> 2 claws +5 (1d2-5)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 1, <strong>Dex</strong> 13, <strong>Con</strong> 8, <strong>Int</strong> 2, <strong>Wis</strong> 12, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-3; <strong>CMD</strong> 2<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Acrobatics +0, Climb +13, Fly +3, Perception +5, Stealth +17, Racial Modifiers +4 Climb, +4 Stealth<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (First World)<br/>\r\n                <strong>Organization</strong>: solitary, pair, or conspiracy (3-10)<br/>\r\n                <strong>Treasure</strong>: incidental<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Bioluminescence (ex): All snarks share the ability to glow, shedding light like a candle. This is an involuntary action, which a snark can suppress for 1d6 minutes with a successful DC 12 Will saving throw.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">If the gods were hung over when they made birds, as many fey claim, they were deep in their cups when they created snarks. Some unusual step between avians and bats, snarks come in a variety of shapes and sizes-from insect-sized to large and dangerous predators-but the smaller lyre snarks are the most common. Snarks live in forests, canyons, and towns of the First World. They mark their territory with loud songs, but keep themselves well hidden-so much so that many outsiders believe they can turn invisible at will. Their wings feature dexterous little hands to pick at fruit, nuts, and the occasional shiny object. They are adept at picking parasites from larger creatures, and are one of the few smaller creatures the Tane-including the voracious bandersnatch-generally permit in close proximity.\n\nAll varieties of snarks share the ability to glow softly when happy or excited-much to their detriment, as this light attracts predators. In some parts of the First World, snarks share territory with birds, and are generally strong fliers but less adapted to running along the ground or through trees. Lyre snarks rarely weigh more than a pound. For larger and more aggressive snarks-such as the flesh-eating boojum-use the statistics for an eagle, an owl, or a vulture.\n\nSmaller snarks, like the one presented here, make affectionate pets, but are known for stealing small objects and treats from their owners to line a variety of nests and secret stashes they maintain. An Arcana caster who selects a snark as a familiar gains a +3 bonus on Stealth checks, though snark familiars are vanishingly rare beyond the First World.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Snark CR 1/4\nSource Pathfinder #119: Prisoners of the Blight pg. 83\nXP 100\nN Diminutive animal\nInit +1; Senses low-light vision, scent; Perception +5\nDefense\nAC 15, touch 15, flat-footed 14 (+1 Dex, +4 size)\nhp 3 (1d8-1)\nFort +1, Ref +3, Will +1\nOffense\nSpeed 20 ft., climb 15 ft., fly 30 ft. (poor)\nMelee 2 claws +5 (1d2-5)\nSpace 1 ft., Reach 0 ft.\nStatistics\nStr 1, Dex 13, Con 8, Int 2, Wis 12, Cha 13\nBase Atk +0; CMB -3; CMD 2\nFeats Weapon Finesse\nSkills Acrobatics +0, Climb +13, Fly +3, Perception +5, Stealth +17; Racial Modifiers +4 Climb, +4 Stealth\nSQ bioluminescence\nEcology\nEnvironment any (First World)\nOrganization solitary, pair, or conspiracy (3-10)\nTreasure incidental\nSpecial Abilities\nBioluminescence (Ex) All snarks share the ability to glow, shedding light like a candle. This is an involuntary action, which a snark can suppress for 1d6 minutes with a successful DC 12 Will saving throw.\nDescription\nIf the gods were hung over when they made birds, as many fey claim, they were deep in their cups when they created snarks. Some unusual step between avians and bats, snarks come in a variety of shapes and sizes-from insect-sized to large and dangerous predators-but the smaller lyre snarks are the most common. Snarks live in forests, canyons, and towns of the First World. They mark their territory with loud songs, but keep themselves well hidden-so much so that many outsiders believe they can turn invisible at will. Their wings feature dexterous little hands to pick at fruit, nuts, and the occasional shiny object. They are adept at picking parasites from larger creatures, and are one of the few smaller creatures the Tane-including the voracious bandersnatch-generally permit in close proximity.\n\nAll varieties of snarks share the ability to glow softly when happy or excited-much to their detriment, as this light attracts predators. In some parts of the First World, snarks share territory with birds, and are generally strong fliers but less adapted to running along the ground or through trees. Lyre snarks rarely weigh more than a pound. For larger and more aggressive snarks-such as the flesh-eating boojum-use the statistics for an eagle, an owl, or a vulture.\n\nSmaller snarks, like the one presented here, make affectionate pets, but are known for stealing small objects and treats from their owners to line a variety of nests and secret stashes they maintain. An arcane caster who selects a snark as a familiar gains a +3 bonus on Stealth checks, though snark familiars are vanishingly rare beyond the First World.</pre>\n        </div>\n    "
