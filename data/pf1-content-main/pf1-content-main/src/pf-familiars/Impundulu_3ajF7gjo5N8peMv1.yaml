  - _id: PjyZQ0hErLVb57cY
    _key: '!actors.items!3ajF7gjo5N8peMv1.PjyZQ0hErLVb57cY'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Blood Drain
    system:
      abilityType: ex
      description:
        value: >-
          If it grapples a foe, an impundulu drains blood at the end of its
          turn, dealing Constitution damage.
      subType: classFeat
    type: feat
  - _id: py6ZypGwjqJNg5q3
    _key: '!actors.items!3ajF7gjo5N8peMv1.py6ZypGwjqJNg5q3'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Electrical Discharge
    system:
      abilityType: su
      description:
        value: >-
          An impundulu builds substantial electrical charges in its
          body-electrical charges visibly crackle about its form. If the
          impundulu hits a creature with two talons in the same round, this
          charge releases into that creature, dealing 4d6 points of electricity
          damage (this damage is in addition to the electricity damage from its
          talon attacks). The target may attempt a DC 21 Fortitude save for half
          damage. If one or both of the talon attacks is a critical hit, the
          jolt is so potent that the target is stunned for 1d4 rounds (creatures
          that are immune to electricity are immune to this stunning effect).
          The save DC is Constitution-based. Once the creature releases this
          charge, it cannot use this ability again for 1d4 rounds while it waits
          for the energy to build again (though this energy buildup does not
          affect the electrical damage from its regular talon attacks).
      subType: classFeat
    type: feat
  - _id: AFZcN9HV5ZM8OYRQ
    _key: '!actors.items!3ajF7gjo5N8peMv1.AFZcN9HV5ZM8OYRQ'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Familiar Service
    system:
      description:
        value: >-
          A mortal of 7th level or higher with the Improved Familiar feat can
          summon an impundulu to serve as her familiar; an impundulu familiar
          appears as a birdlike imp or quasit, has the normal statistics of an
          imp or quasit, and loses all of its own abilities except its subtypes,
          alignment, and damage reduction. If its master is slain, the impundulu
          seizes its former master's soul, retreats to a hidden place, and
          consumes the soul, after which it metamorphoses over the next 24 hours
          into its natural form, regains all of its normal abilities, and
          becomes free; most aging masters pass on their impundulu familiars to
          younger family members rather than let the creatures turn on them.
      subType: classFeat
    type: feat
  - _id: D6Anu4NJgDK1Be1a
    _key: '!actors.items!3ajF7gjo5N8peMv1.D6Anu4NJgDK1Be1a'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Shaman Form
    system:
      abilityType: su
      description:
        value: >-
          An impundulu using its change shape special quality can take on one
          specific humanoid form as if it had the change shape ability. This
          form usually resembles that of a jungle shaman, except it has
          claw-like fingernails and its feet end in talons. In this form, it
          cannot fly or use its breath weapon, electrical discharge, or hook
          attacks. An impundulu can remain in this form indefinitely. Its
          natural form is its bird form. If killed, it reverts to its true form.
      subType: classFeat
    type: feat
  - _id: llHTeiEtbKfwrruD
    _key: '!actors.items!3ajF7gjo5N8peMv1.llHTeiEtbKfwrruD'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Witchcraft
    system:
      description:
        value: >-
          An impundulu serving as a witch's familiar gives its master additional
          spells known, just like a witch's patron. The master must choose from
          one of the following patron themes when binding the impundulu, and
          this choice cannot be changed without dismissing and re-summoning the
          impundulu: Agility, Elements, or Transformation. These patron spells
          known are in addition to any granted by the witch's actual patron.
      subType: classFeat
    type: feat
  - _id: YjIOYvMBGMsozWUU
    _key: '!actors.items!3ajF7gjo5N8peMv1.YjIOYvMBGMsozWUU'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: sbc | Conversion Buff
    system:
      active: true
      changes:
        - _id: 8p0cxhyv
          formula: '5'
          target: fort
          type: untypedPerm
        - _id: kap36mhw
          formula: '-5'
          target: will
          type: untypedPerm
        - _id: qh3qsjtp
          formula: '-4'
          target: skill.fly
          type: untypedPerm
      contextNotes:
        - target: cmb
          text: +22 grapple
      description:
        value: >-
          <h2>sbc | Conversion Buff</h2><p>This Buff was created by
          <strong>sbc</strong> to compensate for differences between the input
          and the values FoundryVTT calculates automatically.</p><p>Especially
          when the pathfinder system gets upgraded, entries in compendiums get
          updated or foundry changes in some way, this buff may become
          outdated.</p><p>For most mooks the conversion should more or less
          work, but for important NPCs or creatures it is adviced to double
          check the conversion manually.</p>
      hideFromToken: true
      subType: perm
      tag: sbcConversionBuff
    type: buff
name: Impundulu
