        value: |2-

                          <em>You make a single attack that deals significantly more damage than normal.</em></p><p>
                          <p><strong>Prerequisites</strong></p><p>Base attack bonus +6.</p>
                      <br /><p><strong>Benefits</strong></p><p>When you use the attack action, you can make one attack at your highest base attack bonus that deals additional damage. Roll the weapon's damage dice for the attack twice and add the results together before adding bonuses from Strength, weapon abilities (such as <em>flaming</em>), precision based damage, and other damage bonuses. These extra weapon damage dice are not multiplied on a critical hit, but are added to the total.</p>
      tags:
        - Combat
        - Offensive
