  details:
    alignment: ne
    cr:
      base: 11
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Impundulu CR 11 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder #40: Vaults of Madness pg. 80<br/>\r\n            <strong>XP 12,800</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            NE \r\n            Medium \r\n            Outsider (Evil, Extraplanar, Shapechanger) <br/>\r\n            <strong>Init</strong> 9;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +21; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 25, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 20 (+5 Dex, +10 natural)<br/>\r\n            <strong>Hit Points</strong> 133 (14 HD; 14d10+56)<br/>\r\n            <strong>Fort</strong> 13, <strong>Ref</strong> 14, <strong>Will</strong> 10\r\n            \r\n            <strong>DR</strong> 10/magic and cold iron\r\n            <strong>Immune</strong> electricity; \r\n            <strong>Resist</strong> cold 10, fire 10; \r\n            <strong>SR</strong> 22\r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (good)<br/>\r\n                <strong>Melee</strong> bite +19 (1d6+4 plus 1d6 bleed and 1d6 electricity), 2 talons +19 (1d4+4 plus 1d6 electricity and grab), 2 hook +13 (1d4+2 plus 1d6 electricity)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 18, <strong>Dex</strong> 21, <strong>Con</strong> 19, <strong>Int</strong> 15, <strong>Wis</strong> 18, <strong>Cha</strong> 20<br/>\r\n            <strong>Base Atk</strong> +14; <strong>CMB</strong> +18; <strong>CMD</strong> 33<br/>\r\n            <strong>Feats</strong> Flyby Attack, Hover, Improved Initiative, Iron Will, Vital Strike, Weapon Focus (bite), Weapon Focus (talons)<br/>\r\n            <strong>Skills</strong> Bluff +22, Diplomacy +19, Fly +9, Intimidate +15, Knowledge (arcana) +12, Knowledge (nature) +12, Knowledge (planes) +12, Perception +21, Sense Motive +21, Spellcraft +19, Stealth +22<br/>\r\n            <strong>Languages</strong> Abyssal, Common, Fey, Infernal, Polyglot, speak with animals, telepathy 100 ft.<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate or warm forest<br/>\r\n                <strong>Organization</strong>: solitary, pair, or flock (2d6)<br/>\r\n                <strong>Treasure</strong>: standard (and impundulu fat, see sidebar)<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Blood Drain (ex): If it grapples a foe, an impundulu drains blood at the end of its turn, dealing Constitution damage.\n\nElectrical Discharge (su): An impundulu builds substantial electrical charges in its body-electrical charges visibly crackle about its form. If the impundulu hits a creature with two talons in the same round, this charge releases into that creature, dealing 4d6 points of electricity damage (this damage is in addition to the electricity damage from its talon attacks). The target may attempt a DC 21 Fortitude save for half damage. If one or both of the talon attacks is a critical hit, the jolt is so potent that the target is stunned for 1d4 rounds (creatures that are immune to electricity are immune to this stunning effect). The save DC is Constitution-based. Once the creature releases this charge, it cannot use this ability again for 1d4 rounds while it waits for the energy to build again (though this energy buildup does not affect the electrical damage from its regular talon attacks).\n\nFamiliar Service: A mortal of 7th level or higher with the Improved Familiar feat can summon an impundulu to serve as her familiar; an impundulu familiar appears as a birdlike imp or quasit, has the normal statistics of an imp or quasit, and loses all of its own abilities except its subtypes, alignment, and damage reduction. If its master is slain, the impundulu seizes its former master&#x27;s soul, retreats to a hidden place, and consumes the soul, after which it metamorphoses over the next 24 hours into its natural form, regains all of its normal abilities, and becomes free; most aging masters pass on their impundulu familiars to younger family members rather than let the creatures turn on them.\n\nShaman Form (su): An impundulu using its change shape special quality can take on one specific humanoid form as if it had the change shape ability. This form usually resembles that of a jungle shaman, except it has claw-like fingernails and its feet end in talons. In this form, it cannot fly or use its breath weapon, electrical discharge, or hook attacks. An impundulu can remain in this form indefinitely. Its natural form is its bird form. If killed, it reverts to its true form.\n\nWitchcraft: An impundulu serving as a witch&#x27;s familiar gives its master additional spells known, just like a witch&#x27;s patron. The master must choose from one of the following patron themes when binding the impundulu, and this choice cannot be changed without dismissing and re-summoning the impundulu: Agility, Elements, or Transformation. These patron spells known are in addition to any granted by the witch&#x27;s actual patron.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">The tribesfolk of southern Garund tell tales of a ruthless winged shapeshifter, a bloodthirsty demon and hunter of men. They call this being impundulu, a name that loosely translates to &#x27;lightning-bird&#x27; after its savage avian form. Legend describes this creature as a huge, stork-like bird that rides upon fierce storms and whose dark feathers crackle with lightning. It is believed that an evil shaman summoned the first impundulu and that using an ancient, taboo ritual, the two formed a blood pact. The shaman offered the impundulu the ability to wear his mortal f lesh in exchange for mastery over the demon&#x27;s significant occult powers. As soon as the impundulu seized control of the shaman&#x27;s body, it broke the pact- however, the ancient ritual bound the fiend to the mortal form, and even after the shaman perished, it could not shed its f lesh. Thus despite its own immortality, the impundulu became forever tied to the realm of mortals. For this reason, it is said, the creature continues to forge pacts with mortal spellcasters in the hope that one day it will unbind the secrets of its cursed existence.\nImpundulu Fat\nThe impundulu&#x27;s fat possesses magical properties and is a highly sought reagent among tribal witchdoctors throughout the Mwangi Expanse. When properly rendered with a DC 28 Craft (alchemy) check, the fat becomes approximately 1 cup of sticky, highly combustible oil. Weapons dipped in the oil gain the flaming property for 10 minutes; 1 cup of this oil can coat up to five weapons or 50 pieces of ammunition.\n\nSimilarly, the oil dilutes healing potions while maintaining their strength at the original concentration. One cup of oil can dilute one potion of cure serious wounds, two potions of cure moderate wounds, or 20 potions of cure light wounds, doubling the number of potions as a result (one potion becomes two, two become four, and so on). These potions cannot be diluted further without losing their potency.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Impundulu CR 11\nSource Pathfinder #40: Vaults of Madness pg. 80\nXP 12,800\nNE Medium outsider (evil, extraplanar, shapechanger)\nInit +9; Senses darkvision 60 ft., low-light vision; Perception +21\nDefense\nAC 25, touch 15, flat-footed 20 (+5 Dex, +10 natural)\nhp 133 (14d10+56)\nFort +13, Ref +14, Will +10\nDR 10/magic and cold iron; Immune electricity; Resist cold 10, fire 10; SR 22\nOffense\nSpeed 20 ft. (30 ft. in humanoid form), fly 60 ft. (good)\nMelee bite +19 (1d6+4 plus 1d6 bleed and 1d6 electricity), 2 talons +19 (1d4+4 plus 1d6 electricity and grab), 2 hook +13 (1d4+2 plus 1d6 electricity)\nSpecial Attacks bleed (1d6), breath weapon (60-ft. line, 8d6 electricity, Reflex DC 21 half, usable every 1d4 rounds), electrical discharge\nSpell-Like Abilities (CL 14th; concentration +19)\n3/day - call lightning, charm person, gust of wind\nStatistics\nStr 18, Dex 21, Con 19, Int 15, Wis 18, Cha 20\nBase Atk +14; CMB +18 (+22 grapple); CMD 33\nFeats Flyby Attack, Hover, Improved Initiative, Iron Will, Vital Strike, Weapon Focus (bite), Weapon Focus (talons)\nSkills Bluff +22, Diplomacy +19, Fly +9, Intimidate +15, Knowledge (arcana) +12, Knowledge (nature) +12, Knowledge (planes) +12, Perception +21, Sense Motive +21, Spellcraft +19, Stealth +22\nLanguages Abyssal, Common, Fey, Infernal, Polyglot; speak with animals, telepathy 100 ft.\nSQ change shape (one humanoid), shaman form\nEcology\nEnvironment temperate or warm forest\nOrganization solitary, pair, or flock (2d6)\nTreasure standard (and impundulu fat, see sidebar)\nSpecial Abilities\nBlood Drain (Ex) If it grapples a foe, an impundulu drains blood at the end of its turn, dealing Constitution damage.\n\nElectrical Discharge (Su) An impundulu builds substantial electrical charges in its body-electrical charges visibly crackle about its form. If the impundulu hits a creature with two talons in the same round, this charge releases into that creature, dealing 4d6 points of electricity damage (this damage is in addition to the electricity damage from its talon attacks). The target may attempt a DC 21 Fortitude save for half damage. If one or both of the talon attacks is a critical hit, the jolt is so potent that the target is stunned for 1d4 rounds (creatures that are immune to electricity are immune to this stunning effect). The save DC is Constitution-based. Once the creature releases this charge, it cannot use this ability again for 1d4 rounds while it waits for the energy to build again (though this energy buildup does not affect the electrical damage from its regular talon attacks).\n\nFamiliar Service A mortal of 7th level or higher with the Improved Familiar feat can summon an impundulu to serve as her familiar; an impundulu familiar appears as a birdlike imp or quasit, has the normal statistics of an imp or quasit, and loses all of its own abilities except its subtypes, alignment, and damage reduction. If its master is slain, the impundulu seizes its former master's soul, retreats to a hidden place, and consumes the soul, after which it metamorphoses over the next 24 hours into its natural form, regains all of its normal abilities, and becomes free; most aging masters pass on their impundulu familiars to younger family members rather than let the creatures turn on them.\n\nShaman Form (Su) An impundulu using its change shape special quality can take on one specific humanoid form as if it had the change shape ability. This form usually resembles that of a jungle shaman, except it has claw-like fingernails and its feet end in talons. In this form, it cannot fly or use its breath weapon, electrical discharge, or hook attacks. An impundulu can remain in this form indefinitely. Its natural form is its bird form. If killed, it reverts to its true form.\n\nWitchcraft An impundulu serving as a witch's familiar gives its master additional spells known, just like a witch's patron. The master must choose from one of the following patron themes when binding the impundulu, and this choice cannot be changed without dismissing and re-summoning the impundulu: Agility, Elements, or Transformation. These patron spells known are in addition to any granted by the witch's actual patron.\nDescription\nThe tribesfolk of southern Garund tell tales of a ruthless winged shapeshifter, a bloodthirsty demon and hunter of men. They call this being impundulu, a name that loosely translates to 'lightning-bird' after its savage avian form. Legend describes this creature as a huge, stork-like bird that rides upon fierce storms and whose dark feathers crackle with lightning. It is believed that an evil shaman summoned the first impundulu and that using an ancient, taboo ritual, the two formed a blood pact. The shaman offered the impundulu the ability to wear his mortal f lesh in exchange for mastery over the demon's significant occult powers. As soon as the impundulu seized control of the shaman's body, it broke the pact- however, the ancient ritual bound the fiend to the mortal form, and even after the shaman perished, it could not shed its f lesh. Thus despite its own immortality, the impundulu became forever tied to the realm of mortals. For this reason, it is said, the creature continues to forge pacts with mortal spellcasters in the hope that one day it will unbind the secrets of its cursed existence.\nImpundulu Fat\nThe impundulu's fat possesses magical properties and is a highly sought reagent among tribal witchdoctors throughout the Mwangi Expanse. When properly rendered with a DC 28 Craft (alchemy) check, the fat becomes approximately 1 cup of sticky, highly combustible oil. Weapons dipped in the oil gain the flaming property for 10 minutes; 1 cup of this oil can coat up to five weapons or 50 pieces of ammunition.\n\nSimilarly, the oil dilutes healing potions while maintaining their strength at the original concentration. One cup of oil can dilute one potion of cure serious wounds, two potions of cure moderate wounds, or 20 potions of cure light wounds, doubling the number of potions as a result (one potion becomes two, two become four, and so on). These potions cannot be diluted further without losing their potency.</pre>\n        </div>\n    "
