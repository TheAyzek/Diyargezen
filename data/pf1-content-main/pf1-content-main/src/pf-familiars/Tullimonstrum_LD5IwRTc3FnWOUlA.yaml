  - _id: wnaLz6tB1WRtBhN3
    _key: '!actors.items!LD5IwRTc3FnWOUlA.wnaLz6tB1WRtBhN3'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Attach
    system:
      abilityType: ex
      description:
        value: >-
          When a tullimonstrum hits with a bite attack, it automatically
          grapples its foe, dealing automatic bite damage each round. The
          tullimonstrum loses its Dexterity bonus to AC and has an AC of 12, but
          it holds on with great tenacity. While attached, a tullimonstrum has a
          +8 racial bonus to maintain its grapple on a foe. An attached
          tullimonstrum can be struck with a weapon or grappled itself-if its
          prey manages to succeed at a grapple check or Escape Artist check
          against it, the tullimonstrum is dislodged.
      subType: classFeat
    type: feat
