  details:
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Tullimonstrum CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder #124: City in the Deep pg. 87<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal (Aquatic) <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> low-light vision, scent; Perception +4; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 12 (+3 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 11 (2 HD; 2d8+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 6, <strong>Will</strong> 0\r\n            <br/><strong>Defensive Abilities</strong> all-around vision; \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.<br/>\r\n                <strong>Melee</strong> bite +6 (1d3-3 plus attach)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 5, <strong>Dex</strong> 16, <strong>Con</strong> 12, <strong>Int</strong> 1, <strong>Wis</strong> 10, <strong>Cha</strong> 5<br/>\r\n            <strong>Base Atk</strong> +1; <strong>CMB</strong> +2; <strong>CMD</strong> 9<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Perception +4, Stealth +15, Swim +5<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any oceans<br/>\r\n                <strong>Organization</strong>: solitary, pair, group (3-5), or school (6-20)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Attach (ex): When a tullimonstrum hits with a bite attack, it automatically grapples its foe, dealing automatic bite damage each round. The tullimonstrum loses its Dexterity bonus to AC and has an AC of 12, but it holds on with great tenacity. While attached, a tullimonstrum has a +8 racial bonus to maintain its grapple on a foe. An attached tullimonstrum can be struck with a weapon or grappled itself-if its prey manages to succeed at a grapple check or Escape Artist check against it, the tullimonstrum is dislodged.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">A tullimonstrum is strange, blood-drinking, deep-sea creature displaying features of both fish and invertebrates. While tullimonstrums are relatively weak individually, a group or school of the creatures poses a lethal threat to nearly any target. A typical tullimonstrum is 14 inches long and weighs 6 pounds. Tullimonstrums can serve as familiars for spellcasters, granting their masters a +3 bonus on Perception checks.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Tullimonstrum CR 1\nSource Pathfinder #124: City in the Deep pg. 87\nXP 400\nN Tiny animal (aquatic)\nInit +3; Senses low-light vision, scent; Perception +4\nDefense\nAC 15, touch 15, flat-footed 12 (+3 Dex, +2 size)\nhp 11 (2d8+2)\nFort +4, Ref +6, Will +0\nDefensive Abilities all-around vision\nOffense\nSpeed 0 ft., swim 30 ft.\nMelee bite +6 (1d3-3 plus attach)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks attach, blood drain (1d2 Constitution)\nStatistics\nStr 5, Dex 16, Con 12, Int 1, Wis 10, Cha 5\nBase Atk +1; CMB +2; CMD 9 (can't be tripped)\nFeats Weapon Finesse\nSkills Perception +4, Stealth +15, Swim +5\nEcology\nEnvironment any oceans\nOrganization solitary, pair, group (3-5), or school (6-20)\nTreasure none\nSpecial Abilities\nAttach (Ex) When a tullimonstrum hits with a bite attack, it automatically grapples its foe, dealing automatic bite damage each round. The tullimonstrum loses its Dexterity bonus to AC and has an AC of 12, but it holds on with great tenacity. While attached, a tullimonstrum has a +8 racial bonus to maintain its grapple on a foe. An attached tullimonstrum can be struck with a weapon or grappled itself-if its prey manages to succeed at a grapple check or Escape Artist check against it, the tullimonstrum is dislodged.\nDescription\nA tullimonstrum is strange, blood-drinking, deep-sea creature displaying features of both fish and invertebrates. While tullimonstrums are relatively weak individually, a group or school of the creatures poses a lethal threat to nearly any target. A typical tullimonstrum is 14 inches long and weighs 6 pounds. Tullimonstrums can serve as familiars for spellcasters, granting their masters a +3 bonus on Perception checks.</pre>\n        </div>\n    "
