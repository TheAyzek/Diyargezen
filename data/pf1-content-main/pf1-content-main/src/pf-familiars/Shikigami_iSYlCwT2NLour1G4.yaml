        primary:
          name: Primary
        secondary:
          name: Secondary
        spelllike:
          name: Spell-likes
        tertiary:
          name: Tertiary
  details:
    alignment: ln
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Shikigami CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 3 pg. 163<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            LN \r\n            Tiny \r\n            Outsider (Kami, Native) <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +11; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 14 (+1 Dex, +2 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3);  fast healing 2<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 2, <strong>Will</strong> 8\r\n            \r\n            <strong>DR</strong> 5/cold iron\r\n            <strong>Immune</strong> bleed, mind-affecting effects, petrification, polymorph; \r\n            <strong>Resist</strong> acid 10, electricity 10, fire 10; \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.<br/>\r\n                <strong>Melee</strong> improvised weapon +4 (1d4+2/x3)<br/>\r\n                <strong>Ranged</strong> improvised weapon +6 (1d3+2/x3)<br/>\r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 13, <strong>Con</strong> 12, <strong>Int</strong> 11, <strong>Wis</strong> 17, <strong>Cha</strong> 14<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +2; <strong>CMD</strong> 11<br/>\r\n            <strong>Feats</strong> Alertness, Catch Off-GuardB, Iron Will, Throw AnythingB<br/>\r\n            <strong>Skills</strong> Heal +9, Knowledge (nature) +6, Perception +11, Sense Motive +11, Stealth +15, Survival +9<br/>\r\n            <strong>Languages</strong> Common<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any<br/>\r\n                <strong>Organization</strong>: solitary, pair, or gang (3-8)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Improvised Weapon Mastery (ex): A shikigami gains Catch Off-Guard and Throw Anything as bonus feats, and adds its Charisma modifier instead of its Strength modifier to damage done with any improvised weapon, as attacks it makes with such weapons seem supernaturally lucky in landing damaging blows. Although a shikigami is Tiny, it never provokes attacks of opportunity when it attacks an adjacent foe with a melee weapon. If a shikigami critically hits an opponent with an improvised weapon, it deals x3 damage. A shikigami is proficient with improvised weapons.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Shikigami are the least of the kami, yet they make up for their lowly status with their loyalty and bravery. Unlike most other well-known types of kami, shikigami are more often associated with rural and urban regions than with natural settings. These kami are the protectors of the minor works of civilization-things like milestones, waymarkers, tiny garden statues, and other relatively mundane works of art crafted by humanoid hands.\n\nNo two shikigami look exactly alike, as befits a race of kami that associates with such a wide range of wards. While all shikigami have the ability to merge with their wards, these kami are also fond of spending time in their physical forms, watching over their wards either invisibly or in the form of a tiny statue. In combat, a shikigami fights with whatever objects it finds at hand. Although relatively weak, these improvised weapons have an uncanny knack for hitting harder than they should.\n\nShikigami are as friendly and curious as other kami, but they are quick to leave an area they see as being polluted by ideals that disrupt the virtues of nature. When they do, they generally take their wards with them. They do not engage humanoids who desecrate the environment, but their absence leaves a profound mark on the morale of perceptive villagers. Should the shikigami leave, town officials who know the function of the miniature kami are quick to change policies in their community to reflect a more naturalistic approach, hoping to rekindle the relationship between shikigami and people, lest the community fall into the disfavor of more powerful and less passive kami.\n\nShikigami typically stand 2 feet tall and weigh 30 pounds, or 50 pounds when taking their statue forms. A spellcaster must have the Improved Familiar feat, an alignment of lawful neutral, and an Arcana caster level of 7th or higher to gain a shikigami familiar. Whenever a shikigami becomes a familiar, it treats its master as its ward.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Shikigami CR 2\nSource Bestiary 3 pg. 163\nXP 600\nLN Tiny outsider (kami, native)\nInit +1; Senses darkvision 60 ft.; Perception +11\nDefense\nAC 15, touch 13, flat-footed 14 (+1 Dex, +2 natural, +2 size)\nhp 19 (3d10+3); fast healing 2\nFort +4, Ref +2, Will +8\nDR 5/cold iron; Immune bleed, mind-affecting effects, petrification, polymorph; Resist acid 10, electricity 10, fire 10\nOffense\nSpeed 30 ft.\nMelee improvised weapon +4 (1d4+2/x3)\nRanged improvised weapon +6 (1d3+2/x3)\nSpace 2-1/2 ft., Reach 0 ft.\nSpell-Like Abilities (CL 6th; concentration +8)\nAt will-invisibility (self only), statue (self only)\n3/day-hide from animals, purify food and drink\n1/week-commune with nature (CL 12th)\nStatistics\nStr 8, Dex 13, Con 12, Int 11, Wis 17, Cha 14\nBase Atk +3; CMB +2; CMD 11\nFeats Alertness, Catch Off-GuardB, Iron Will, Throw AnythingB\nSkills Heal +9, Knowledge (nature) +6, Perception +11, Sense Motive +11, Stealth +15, Survival +9\nLanguages Common\nSQ improvised weapon mastery, merge with ward, ward (minor works of civilization)\nEcology\nEnvironment any\nOrganization solitary, pair, or gang (3-8)\nTreasure standard\nSpecial Abilities\nImprovised Weapon Mastery (Ex) A shikigami gains Catch Off-Guard and Throw Anything as bonus feats, and adds its Charisma modifier instead of its Strength modifier to damage done with any improvised weapon, as attacks it makes with such weapons seem supernaturally lucky in landing damaging blows. Although a shikigami is Tiny, it never provokes attacks of opportunity when it attacks an adjacent foe with a melee weapon. If a shikigami critically hits an opponent with an improvised weapon, it deals x3 damage. A shikigami is proficient with improvised weapons.\nDescription\nShikigami are the least of the kami, yet they make up for their lowly status with their loyalty and bravery. Unlike most other well-known types of kami, shikigami are more often associated with rural and urban regions than with natural settings. These kami are the protectors of the minor works of civilization-things like milestones, waymarkers, tiny garden statues, and other relatively mundane works of art crafted by humanoid hands.\n\nNo two shikigami look exactly alike, as befits a race of kami that associates with such a wide range of wards. While all shikigami have the ability to merge with their wards, these kami are also fond of spending time in their physical forms, watching over their wards either invisibly or in the form of a tiny statue. In combat, a shikigami fights with whatever objects it finds at hand. Although relatively weak, these improvised weapons have an uncanny knack for hitting harder than they should.\n\nShikigami are as friendly and curious as other kami, but they are quick to leave an area they see as being polluted by ideals that disrupt the virtues of nature. When they do, they generally take their wards with them. They do not engage humanoids who desecrate the environment, but their absence leaves a profound mark on the morale of perceptive villagers. Should the shikigami leave, town officials who know the function of the miniature kami are quick to change policies in their community to reflect a more naturalistic approach, hoping to rekindle the relationship between shikigami and people, lest the community fall into the disfavor of more powerful and less passive kami.\n\nShikigami typically stand 2 feet tall and weigh 30 pounds, or 50 pounds when taking their statue forms. A spellcaster must have the Improved Familiar feat, an alignment of lawful neutral, and an arcane caster level of 7th or higher to gain a shikigami familiar. Whenever a shikigami becomes a familiar, it treats its master as its ward.</pre>\n        </div>\n    "
