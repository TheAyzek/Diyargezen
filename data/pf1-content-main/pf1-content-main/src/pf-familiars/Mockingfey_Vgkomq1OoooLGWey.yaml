  - _id: pttjPv3zrlzvmaTG
    _key: '!actors.items!Vgkomq1OoooLGWey.pttjPv3zrlzvmaTG'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Mock
    system:
      abilityType: su
      description:
        value: >-
          As a standard action, a mockingfey can take on the appearance of any
          creature it can see. This functions like veil, but affects only the
          mockingfey. The mockingfey does not change size, and if the creature
          it's mimicking is larger than itself, the mockingfey simply appears to
          be a miniature version of it. Anyone interacting with this effect can
          attempt a DC 12 Will save to see through the ruse. A mockingfey can
          maintain a guise indefinitely, but can't change to a form other than
          its own without a visual reference-once a given disguise has ended,
          the fey must see the subject again to resume that form. The save DC is
          Charisma-based.
      subType: classFeat
    type: feat
