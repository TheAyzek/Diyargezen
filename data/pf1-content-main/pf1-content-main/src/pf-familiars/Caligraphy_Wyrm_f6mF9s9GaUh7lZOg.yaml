  - _id: CDlXKXuTmpFymwsa
    _key: '!actors.items!f6mF9s9GaUh7lZOg.CDlXKXuTmpFymwsa'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Change Shape
    system:
      abilityType: su
      description:
        value: >-
          As a full-round action, a calligraphy wyrm can turn into a golden
          fountain pen decorated with designs reminiscent of sovereign dragons.
          The wyrm gains hardness 5 but loses all its senses except hearing and
          blindsight, and cannot take any actions other than to return to its
          dragon form as a full-round action. The golden pen counts as a
          masterwork tool for the purpose of Craft (calligraphy) checks.
      subType: classFeat
    type: feat
  - _id: wIJ0ZSre6IAYfURV
    _key: '!actors.items!f6mF9s9GaUh7lZOg.wIJ0ZSre6IAYfURV'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Ink Spray
    system:
      abilityType: ex
      description:
        value: >-
          As a standard action every 2d4 rounds, a calligraphy wyrm can sneeze a
          10-foot cone of ink. Creatures must succeed at a DC 12 Reflex save or
          be covered in ink. Affected creatures are treated as though they had
          failed a saving throw against glitterdust, except that affected
          creatures don't take a penalty on Stealth checks, and can remove the
          blinded condition automatically as a standard action. The save DC is
          Charisma-based.
      subType: classFeat
    type: feat
  - _id: cQ1EeTFATgYbxXBJ
    _key: '!actors.items!f6mF9s9GaUh7lZOg.cQ1EeTFATgYbxXBJ'
    _stats:
