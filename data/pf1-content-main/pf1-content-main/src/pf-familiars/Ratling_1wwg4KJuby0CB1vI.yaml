  details:
    alignment: ce
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Ratling CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 4 pg. 226, Pathfinder #49: The Brinewall Legacy pg. 86<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CE \r\n            Tiny \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> darkvision 60 ft., detect magic, low-light vision; Perception +6; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 13 (+2 Dex, +1 dodge, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 5, <strong>Will</strong> 1\r\n            <br/><strong>Defensive Abilities</strong> evasion; \r\n            \r\n            <strong>Immune</strong> disease, poison; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 10 ft.<br/>\r\n                <strong>Melee</strong> bite +3 (1d3-2 plus bleed 1)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 15, <strong>Con</strong> 13, <strong>Int</strong> 12, <strong>Wis</strong> 10, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +3; <strong>CMD</strong> 12<br/>\r\n            <strong>Feats</strong> Dodge, Mobility<br/>\r\n            <strong>Skills</strong> Climb +6, Knowledge (planes) +4, Perception +6, Stealth +16, Swim +6<br/>\r\n            <strong>Languages</strong> Aklo, speak with animals (rodents only), tongues<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any urban<br/>\r\n                <strong>Organization</strong>: solitary or conclave (2-20 plus 2-12 dire rats and 1-4 rat swarms)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Scroll Use (ex): A ratling can cast spells from any magic scroll as if it had the spell on its spell list.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">The ratling is a hideous amalgamation of rat and human: a long-haired rodent with handlike front paws and a face reminiscent of the face of a leering old man. Within the ratling&#x27;s humanoid mouth are long, yellow incisors more akin to those one might find in the jaws of a rat.\n\nRatlings are carnivores. While they can subsist on grubs, other rodents, and carrion, they prefer living food and fresh blood, particularly that of humanoid children and elderly folk. They also have a sense for magic, and lurk around temples and universities searching for scraps of knowledge or overlooked books and scrolls to steal.\n\nRatlings associate with common rats and even mate with them, producing anything from large, aggressive rats (often with vestigial humanlike features or other sickening deformities) to infant ratlings to deformed rats. In a mixed litter, the infant ratling usually kills and eats its siblings, then arranges the dismembered and disemboweled corpses in semi-occult patterns.\n\nElder ratlings often gain the advanced simple template or levels in cleric, oracle, witch, or wizard (a rare few gain rogue levels, especially if they associate with a thieves&#x27; guild or wererats). These elders often become leaders of their own kind, creating cabals organized like the universities they frequently inhabit. If the ratling can gain a familiar, it usually chooses a rat-an association that often brings with it more than mere supernatural companionship. Ratlings can never select another ratling as a familiar.\n\nA chaotic evil spellcaster can gain a ratling as a familiar at 7th level by taking the Improved Familiar feat. A ratling familiar gains commune once per week as a spell-like ability, which it can use on its master&#x27;s behalf. The master usually allows the familiar to drink her blood at least once per week.\n\nA ratling measures just over 2 feet long (although half that length is its long, ratty tail) and weighs 10 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Ratling CR 2\nSource Bestiary 4 pg. 226, Pathfinder #49: The Brinewall Legacy pg. 86\nXP 600\nCE Tiny magical beast\nInit +2; Senses darkvision 60 ft., detect magic, low-light vision; Perception +6\nDefense\nAC 16, touch 15, flat-footed 13 (+2 Dex, +1 dodge, +1 natural, +2 size)\nhp 19 (3d10+3)\nFort +4, Ref +5, Will +1\nDefensive Abilities evasion; Immune disease, poison\nOffense\nSpeed 30 ft., burrow 10 ft., climb 20 ft., swim 30 ft.\nMelee bite +3 (1d3-2 plus bleed 1)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks sneak attack +1d6\nSpell-Like Abilities (CL 6th; concentration +7)\nConstant-detect magic, read magic, speak with animals (rodents only), spider climb, tongues\n3/day-cause fear (DC 12), dimension door, invisibility (self only)\n1/day-summon swarm (rat swarm only)\n1/week-commune (only when serving as a familiar; 6 questions, CL 12th)\nStatistics\nStr 6, Dex 15, Con 13, Int 12, Wis 10, Cha 13\nBase Atk +3; CMB +3; CMD 12 (16 vs. trip)\nFeats Dodge, Mobility\nSkills Climb +6, Knowledge (planes) +4, Perception +6, Stealth +16, Swim +6\nLanguages Aklo; speak with animals (rodents only), tongues\nSQ scroll use\nEcology\nEnvironment any urban\nOrganization solitary or conclave (2-20 plus 2-12 dire rats and 1-4 rat swarms)\nTreasure standard\nSpecial Abilities\nScroll Use (Ex) A ratling can cast spells from any magic scroll as if it had the spell on its spell list.\nDescription\nThe ratling is a hideous amalgamation of rat and human: a long-haired rodent with handlike front paws and a face reminiscent of the face of a leering old man. Within the ratling's humanoid mouth are long, yellow incisors more akin to those one might find in the jaws of a rat.\n\nRatlings are carnivores. While they can subsist on grubs, other rodents, and carrion, they prefer living food and fresh blood, particularly that of humanoid children and elderly folk. They also have a sense for magic, and lurk around temples and universities searching for scraps of knowledge or overlooked books and scrolls to steal.\n\nRatlings associate with common rats and even mate with them, producing anything from large, aggressive rats (often with vestigial humanlike features or other sickening deformities) to infant ratlings to deformed rats. In a mixed litter, the infant ratling usually kills and eats its siblings, then arranges the dismembered and disemboweled corpses in semi-occult patterns.\n\nElder ratlings often gain the advanced simple template or levels in cleric, oracle, witch, or wizard (a rare few gain rogue levels, especially if they associate with a thieves' guild or wererats). These elders often become leaders of their own kind, creating cabals organized like the universities they frequently inhabit. If the ratling can gain a familiar, it usually chooses a rat-an association that often brings with it more than mere supernatural companionship. Ratlings can never select another ratling as a familiar.\n\nA chaotic evil spellcaster can gain a ratling as a familiar at 7th level by taking the Improved Familiar feat. A ratling familiar gains commune once per week as a spell-like ability, which it can use on its master's behalf. The master usually allows the familiar to drink her blood at least once per week.\n\nA ratling measures just over 2 feet long (although half that length is its long, ratty tail) and weighs 10 pounds.</pre>\n        </div>\n    "
