  - _id: IXQPuvuaz96Bd3cb
    _key: '!actors.items!OK8irhKaMVve6V45.IXQPuvuaz96Bd3cb'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Mask Symbiosis
    system:
      abilityType: ex
      description:
        value: >-
          A spirit oni can be worn as a mask by a willing Small or Medium
          creature. While worn in this way, the wearer can see through the oni's
          eyes and speak through its mouth, although the wearer retains its own
          senses and voice. The spirit oni remains a separate creature, and must
          detach from its host's face (as a move action) if it wishes to take
          any action of its own (including attacking or using a spell-like
          ability). While a spirit oni is worn as a mask, it grants a +2 insight
          bonus on its host's Perception checks.
      subType: classFeat
    type: feat
