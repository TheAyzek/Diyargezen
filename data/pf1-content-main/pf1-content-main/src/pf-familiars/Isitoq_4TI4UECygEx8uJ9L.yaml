    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Isitoq CR 1/2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 4 pg. 159<br/>\r\n            <strong>XP 200</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            NE \r\n            Diminutive \r\n            Undead <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +7; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 14 (+1 Dex, +4 size)<br/>\r\n            <strong>Hit Points</strong> 9 (2 HD; 2d8)<br/>\r\n            <strong>Fort</strong> 0, <strong>Ref</strong> 1, <strong>Will</strong> 5\r\n            \r\n            \r\n            <strong>Immune</strong> undead traits; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (perfect)<br/>\r\n                <strong>Melee</strong> slam +6 (1d2-3), 2 wings +6 (1d1-3 plus daze)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 4, <strong>Dex</strong> 13, <strong>Con</strong> 0, <strong>Int</strong> 7, <strong>Wis</strong> 14, <strong>Cha</strong> 11<br/>\r\n            <strong>Base Atk</strong> +1; <strong>CMB</strong> +-2; <strong>CMD</strong> 5<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Fly +15, Perception +7, Stealth +18<br/>\r\n            <strong>Languages</strong> Common (can&#x27;t speak)<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any<br/>\r\n                <strong>Organization</strong>: solitary or gang (2-8)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Daze (ex): An isitoq&#x27;s nerves form grotesque wings. Any creature struck by the creature&#x27;s wings must succeed at a DC 11 Will save or be dazed for 1 round as the target&#x27;s mind is flooded with images of the last seconds of the isitoq&#x27;s existence as a living creature. This is a mind-affecting fear effect. The save DC is Charisma-based.\n\nTears of Anguish (su): As a full-round action, an isitoq can make a ranged touch attack to squirt tears into the eyes of a creature within 30 feet. If the target fails a DC 11 saving throw, it experiences the effect of the isitoq&#x27;s daze ability. The save DC is Charisma-based.\n\nVisual Sensor (su): An isitoq&#x27;s creator or master can see through its eye at a range of 60 feet, using the eye&#x27;s normal vision and darkvision. The following spells have a 5% chance per caster level of the isitoq&#x27;s creator of operating through the isitoq: detect chaos, detect evil, detect good, detect law, detect magic, and message. If the creator is 15th level or higher, the following spells have the same chance of functioning through the isitoq: read magic and tongues.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Awkwardly flapping through the air, this creature constantly weeps salty tears, leaving a dripping trail behind it as it flies. Most often encountered in the company of necromancers or powerful undead creatures capable of casting spells, an isitoq serves as a companion, spy, or sometimes even a familiar. Its creator normally uses it as a sentinel, sending it flying through the halls of its laboratory, lair, or dungeon complex to watch for intruders or spy on guests and test subjects. As an isitoq&#x27;s creator can see through the creature&#x27;s single eye, the creator can keep watch over her domain without having to leave an inner sanctum or other heavily-guarded area.\n\nThough the isitoq&#x27;s attack is itself weak, any creature struck by the floating eyeball&#x27;s wings sees the last moments of life experienced by the creature from which the isitoq was created. This horror-filled vision is potent with emotion, making the victim feel as if it&#x27;s experiencing its own death.\nCreating an Isitoq\nA spellcaster can create an isitoq from the head of a Small or Medium corpse that has at least one intact eye. The head must be animated as a 1 Hit Die undead using animate dead (this counts toward the total HD animated by the spell and the total HD the caster can control), followed by casting clairaudience/clairvoyance or locate object to establish the sensory connection, and air walk, fly, levitate, or wind wall to give it the ability to fly. When these spells are finished, one of the head&#x27;s eyes pulls itself free of its socket and becomes an isitoq. The rest of the head remains part of a corpse.\n\nAn evil spellcaster with the Improved Familiar feat can gain an isitoq as a familiar at 5th level.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Isitoq CR 1/2\nSource Bestiary 4 pg. 159\nXP 200\nNE Diminutive undead\nInit +1; Senses darkvision 60 ft.; Perception +7\nDefense\nAC 15, touch 15, flat-footed 14 (+1 Dex, +4 size)\nhp 9 (2d8)\nFort +0, Ref +1, Will +5\nImmune undead traits\nOffense\nSpeed 5 ft., fly 60 ft. (perfect)\nMelee slam +6 (1d2-3), 2 wings +6 (1d1-3 plus daze)\nSpace 1 ft., Reach 0 ft.\nSpecial Attacks daze, tears of anguish\nStatistics\nStr 4, Dex 13, Con -, Int 7, Wis 14, Cha 11\nBase Atk +1; CMB -2; CMD 5 (can't be tripped)\nFeats Weapon Finesse\nSkills Fly +15, Perception +7, Stealth +18\nLanguages Common (can't speak)\nSQ visual sensor\nEcology\nEnvironment any\nOrganization solitary or gang (2-8)\nTreasure none\nSpecial Abilities\nDaze (Ex) An isitoq's nerves form grotesque wings. Any creature struck by the creature's wings must succeed at a DC 11 Will save or be dazed for 1 round as the target's mind is flooded with images of the last seconds of the isitoq's existence as a living creature. This is a mind-affecting fear effect. The save DC is Charisma-based.\n\nTears of Anguish (Su) As a full-round action, an isitoq can make a ranged touch attack to squirt tears into the eyes of a creature within 30 feet. If the target fails a DC 11 saving throw, it experiences the effect of the isitoq's daze ability. The save DC is Charisma-based.\n\nVisual Sensor (Su) An isitoq's creator or master can see through its eye at a range of 60 feet, using the eye's normal vision and darkvision. The following spells have a 5% chance per caster level of the isitoq's creator of operating through the isitoq: detect chaos, detect evil, detect good, detect law, detect magic, and message. If the creator is 15th level or higher, the following spells have the same chance of functioning through the isitoq: read magic and tongues.\nDescription\nAwkwardly flapping through the air, this creature constantly weeps salty tears, leaving a dripping trail behind it as it flies. Most often encountered in the company of necromancers or powerful undead creatures capable of casting spells, an isitoq serves as a companion, spy, or sometimes even a familiar. Its creator normally uses it as a sentinel, sending it flying through the halls of its laboratory, lair, or dungeon complex to watch for intruders or spy on guests and test subjects. As an isitoq's creator can see through the creature's single eye, the creator can keep watch over her domain without having to leave an inner sanctum or other heavily-guarded area.\n\nThough the isitoq's attack is itself weak, any creature struck by the floating eyeball's wings sees the last moments of life experienced by the creature from which the isitoq was created. This horror-filled vision is potent with emotion, making the victim feel as if it's experiencing its own death.\nCreating an Isitoq\nA spellcaster can create an isitoq from the head of a Small or Medium corpse that has at least one intact eye. The head must be animated as a 1 Hit Die undead using animate dead (this counts toward the total HD animated by the spell and the total HD the caster can control), followed by casting clairaudience/clairvoyance or locate object to establish the sensory connection, and air walk, fly, levitate, or wind wall to give it the ability to fly. When these spells are finished, one of the head's eyes pulls itself free of its socket and becomes an isitoq. The rest of the head remains part of a corpse.\n\nAn evil spellcaster with the Improved Familiar feat can gain an isitoq as a familiar at 5th level.</pre>\n        </div>\n    "
