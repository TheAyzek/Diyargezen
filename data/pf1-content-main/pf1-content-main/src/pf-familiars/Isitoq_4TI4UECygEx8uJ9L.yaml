    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Tears Of Anguish
    system:
      abilityType: su
      description:
        value: >-
          As a full-round action, an isitoq can make a ranged touch attack to
          squirt tears into the eyes of a creature within 30 feet. If the target
          fails a DC 11 saving throw, it experiences the effect of the isitoq's
          daze ability. The save DC is Charisma-based.
      subType: classFeat
    type: feat
  - _id: 17IlHux5pHxRpeaB
