    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Visual Sensor
    system:
      abilityType: su
      description:
        value: >-
          An isitoq's creator or master can see through its eye at a range of 60
