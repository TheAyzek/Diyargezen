    name: Daze
    system:
      abilityType: ex
      description:
        value: >-
          An isitoq's nerves form grotesque wings. Any creature struck by the
          creature's wings must succeed at a DC 11 Will save or be dazed for 1
          round as the target's mind is flooded with images of the last seconds
          of the isitoq's existence as a living creature. This is a
          mind-affecting fear effect. The save DC is Charisma-based.
      subType: classFeat
    type: feat
  - _id: SXA1vlgoPDOYmFub
