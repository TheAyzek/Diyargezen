     \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 10, <strong>Dex</strong> 15, <strong>Con</strong> 12, <strong>Int</strong> 10, <strong>Wis</strong> 13, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +3; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Improved Initiative, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Bluff +7, Intimidate +7, Knowledge (planes) +6, Perception +7, Sense Motive +7, Stealth +16<br/>\r\n            <strong>Languages</strong> Ignan<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n                \r\n                \r\n                \r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n        \r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Fire Wysp CR 2\nSource Bestiary 5 pg. 283\nXP 600\nN Tiny outsider (elemental, fire)\nInit +6; Senses darkvision 60 ft.; Perception +7\nAura resonance (30 ft.)\nDefense\nAC 14, touch 14, flat-footed 12 (+2 Dex, +2 size)\nhp 19 (3d10+3)\nFort +4, Ref +5, Will +2\nImmune elemental traits, fire\nWeaknesses vulnerable to cold\nOffense\nSpeed 60 ft., fly 20 ft. (poor)\nMelee 2 tendrils +9 (1d3+2 plus burn)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks burn (1d6 fire, DC 14)\nStatistics\nStr 10, Dex 15, Con 12, Int 10, Wis 13, Cha 13\