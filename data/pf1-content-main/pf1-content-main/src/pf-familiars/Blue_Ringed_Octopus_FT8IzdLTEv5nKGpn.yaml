    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Blue-Ringed Octopus CR 1/2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Magic pg. 117<br/>\r\n            <strong>XP 200</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal (Aquatic) <br/>\r\n            <strong>Init</strong> 5;\r\n            <strong>Senses</strong> low-light vision; Perception +1; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 17, <strong>Flat-Footed</strong> 12 (+5 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 4 (1 HD; 1d8)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 7, <strong>Will</strong> 1\r\n            <br/><strong>Defensive Abilities</strong> ink cloud; \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.<br/>\r\n                <strong>Melee</strong> bite +7 (1d2-1 plus poison), tentacles +5 (grab)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 21, <strong>Con</strong> 10, <strong>Int</strong> 2, <strong>Wis</strong> 13, <strong>Cha</strong> 3<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +3; <strong>CMD</strong> 12<br/>\r\n            <strong>Feats</strong> MultiattackB, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Escape Artist +15, Stealth +25, Swim +13, Racial Modifiers +10 Escape Artist, +8 Stealth<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate or cold aquatic<br/>\r\n                <strong>Organization</strong>: solitary<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Ink Cloud (ex): While within water, an octopus can emit a 5-foot-radius sphere of ink once per minute as a swift action. This ink provides total concealment and persists for 1 minute.\n\nJet (ex): The octopus can jet 60 feet in a straight line as a full-round action. This does not provoke attacks of opportunity.\n\nPoison (ex): Bite-injury; save Fort DC 10; frequency 1/round for 6 rounds; effect 1 Str; cure 1 save.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Blue-ringed octopuses are aquatic animals capable of a surprising amount of cunning. They cannot survive out of water.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Blue-Ringed Octopus CR 1/2\nSource Ultimate Magic pg. 117\nXP 200\nN Tiny animal (aquatic)\nInit +5; Senses low-light vision; Perception +1\nDefense\nAC 17, touch 17, flat-footed 12 (+5 Dex, +2 size)\nhp 4 (1d8)\nFort +2, Ref +7, Will +1\nDefensive Abilities ink cloud\nOffense\nSpeed 20 ft., swim 30 ft., jet 60 ft.\nMelee bite +7 (1d2-1 plus poison), tentacles +5 (grab)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks poison\nStatistics\nStr 8, Dex 21, Con 10, Int 2, Wis 13, Cha 3\nBase Atk +0; CMB +3 (+7 grapple); CMD 12 (can't be tripped)\nFeats MultiattackB, Weapon Finesse\nSkills Escape Artist +15, Stealth +25, Swim +13; Racial Modifiers +10 Escape Artist, +8 Stealth\nEcology\nEnvironment temperate or cold aquatic\nOrganization solitary\nTreasure none\nSpecial Abilities\nInk Cloud (Ex) While within water, an octopus can emit a 5-foot-radius sphere of ink once per minute as a swift action. This ink provides total concealment and persists for 1 minute.\n\nJet (Ex) The octopus can jet 60 feet in a straight line as a full-round action. This does not provoke attacks of opportunity.\n\nPoison (Ex) Bite-injury; save Fort DC 10; frequency 1/round for 6 rounds; effect 1 Str; cure 1 save.\nDescription\nBlue-ringed octopuses are aquatic animals capable of a surprising amount of cunning. They cannot survive out of water.</pre>\n        </div>\n    "
