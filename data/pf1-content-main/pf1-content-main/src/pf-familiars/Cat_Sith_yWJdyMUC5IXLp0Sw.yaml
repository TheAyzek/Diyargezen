  details:
    alignment: cn
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Cat Sith CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Familiar Folio pg. 28<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CN \r\n            Tiny \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision, see invisibility; Perception +6; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 12 (+3 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 6, <strong>Will</strong> 2\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.<br/>\r\n                <strong>Melee</strong> 2 claws +4 (1d2-1 plus no luck), bite +4 (1d3-1)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 16, <strong>Con</strong> 12, <strong>Int</strong> 11, <strong>Wis</strong> 13, <strong>Cha</strong> 15<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Ability Focus (false curse), Stealthy<br/>\r\n            <strong>Skills</strong> Bluff +4, Escape Artist +5, Perception +6, Stealth +18<br/>\r\n            <strong>Languages</strong> Common, speak with animals<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate hills<br/>\r\n                <strong>Organization</strong>: solitary, pair, or band (3-7)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>False Curse (su): Once per day, a cat sith can fool a creature into believing it has been cursed by the cat sith&#x27;s black magic. The target must be within 60 feet and must be able to see the cat sith to be affected by the false curse (Will DC 15 negates). An affected creature takes a -4 penalty on attack rolls, saving throws, ability checks, and skill checks, as if affected by bestow curse. Because this effect is not a true curse, the target gains a new saving throw to end the effect at the beginning of each day. This is a language-dependent, mind-affecting effect that can be affected by remove curse. The save DC is Charisma-based.\n\nNo Luck (su): A creature hit by a cat sith&#x27;s claws must succeed at a DC 13 Will save or be stricken with lucklessness. For 1d4 rounds, the affected creature can&#x27;t benefit from any luck bonuses. The save DC is Charisma-based.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Cat siths are inscrutable feline creatures that inhabit highlands around towns and cities. They resemble common housecats at a glance, but cat siths are supernatural beings that have the cunning of civilized races and strange magical powers rivaling those of fey. They&#x27;re capable of easily walking balanced on just their hind legs and wearing magic boots. They can carry one object in their front paws when walking bipedally, though they can&#x27;t manipulate such objects with the fine control required to use weapons, wands, and similar objects.\n\nUnpredictable yet sophisticated, these strange beings use their unassuming appearances to infiltrate civilized areas, either serving as spies for powerful spellcasters or entertaining their own unknowable agendas.\n\nMany cultures fear cat siths and tell myths about their otherworldly powers. Some say that letting a cat sith near an unburied corpse may allow the beast to steal the departed&#x27;s soul before it has made it to the Great Beyond.\n\nA 7th-level spellcaster with the Improved Familiar feat can gain a cat sith as a familiar. Cat siths are heavier than most housecats, weighing between 25 and 30 pounds. A cat sith is nearly 2 feet long from its nose to the base of its tail.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Cat Sith CR 2\nSource Familiar Folio pg. 28\nXP 600\nCN Tiny magical beast\nInit +3; Senses darkvision 60 ft., low-light vision, see invisibility; Perception +6\nDefense\nAC 15, touch 15, flat-footed 12 (+3 Dex, +2 size)\nhp 19 (3d10+3)\nFort +4, Ref +6, Will +2\nOffense\nSpeed 30 ft.\nMelee 2 claws +4 (1d2-1 plus no luck), bite +4 (1d3-1)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks false curse (DC 15)\nSpell-Like Abilities (CL 3rd; concentration +5)\nConstant-see invisibility\n3/day-ghost sound, hypnotism, magic aura\n1/week-rest eternalAPG\nStatistics\nStr 8, Dex 16, Con 12, Int 11, Wis 13, Cha 15\nBase Atk +3; CMB +4; CMD 13\nFeats Ability Focus (false curse), Stealthy\nSkills Bluff +4, Escape Artist +5, Perception +6, Stealth +18\nLanguages Common; speak with animals\nEcology\nEnvironment temperate hills\nOrganization solitary, pair, or band (3-7)\nTreasure standard\nSpecial Abilities\nFalse Curse (Su) Once per day, a cat sith can fool a creature into believing it has been cursed by the cat sith's black magic. The target must be within 60 feet and must be able to see the cat sith to be affected by the false curse (Will DC 15 negates). An affected creature takes a -4 penalty on attack rolls, saving throws, ability checks, and skill checks, as if affected by bestow curse. Because this effect is not a true curse, the target gains a new saving throw to end the effect at the beginning of each day. This is a language-dependent, mind-affecting effect that can be affected by remove curse. The save DC is Charisma-based.\n\nNo Luck (Su) A creature hit by a cat sith's claws must succeed at a DC 13 Will save or be stricken with lucklessness. For 1d4 rounds, the affected creature can't benefit from any luck bonuses. The save DC is Charisma-based.\nDescription\nCat siths are inscrutable feline creatures that inhabit highlands around towns and cities. They resemble common housecats at a glance, but cat siths are supernatural beings that have the cunning of civilized races and strange magical powers rivaling those of fey. They're capable of easily walking balanced on just their hind legs and wearing magic boots. They can carry one object in their front paws when walking bipedally, though they can't manipulate such objects with the fine control required to use weapons, wands, and similar objects.\n\nUnpredictable yet sophisticated, these strange beings use their unassuming appearances to infiltrate civilized areas, either serving as spies for powerful spellcasters or entertaining their own unknowable agendas.\n\nMany cultures fear cat siths and tell myths about their otherworldly powers. Some say that letting a cat sith near an unburied corpse may allow the beast to steal the departed's soul before it has made it to the Great Beyond.\n\nA 7th-level spellcaster with the Improved Familiar feat can gain a cat sith as a familiar. Cat siths are heavier than most housecats, weighing between 25 and 30 pounds. A cat sith is nearly 2 feet long from its nose to the base of its tail.</pre>\n        </div>\n    "
