  - _id: 4EOTvrlXTkjoRXKi
    _key: '!actors.items!yWJdyMUC5IXLp0Sw.4EOTvrlXTkjoRXKi'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: False Curse
    system:
      abilityType: su
      description:
        value: >-
          Once per day, a cat sith can fool a creature into believing it has
          been cursed by the cat sith's black magic. The target must be within
          60 feet and must be able to see the cat sith to be affected by the
          false curse (Will DC 15 negates). An affected creature takes a -4
          penalty on attack rolls, saving throws, ability checks, and skill
          checks, as if affected by bestow curse. Because this effect is not a
          true curse, the target gains a new saving throw to end the effect at
          the beginning of each day. This is a language-dependent,
          mind-affecting effect that can be affected by remove curse. The save
          DC is Charisma-based.
      subType: classFeat
    type: feat
  - _id: i9bi1J3EF3IZo542
    _key: '!actors.items!yWJdyMUC5IXLp0Sw.i9bi1J3EF3IZo542'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: No Luck
    system:
      abilityType: su
      description:
        value: >-
          A creature hit by a cat sith's claws must succeed at a DC 13 Will save
          or be stricken with lucklessness. For 1d4 rounds, the affected
          creature can't benefit from any luck bonuses. The save DC is
          Charisma-based.
      subType: classFeat
    type: feat
