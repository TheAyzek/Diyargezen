      classSkills:
        acr: true
        clm: true
        fly: true
        per: true
        ste: true
        swm: true
      description:
        value: >-
          <p>An animal is a living, nonhuman creature, usually a vertebrate with
          no magical abilities and no innate capacity for language or culture.
          Animals usually have additional information on how they can serve as
          companions.</p><h2>Features</h2><p>An animal has the following
          features (unless otherwise noted).</p><ul><li>d8 Hit Die.</li><li>Base
          attack bonus equal to 3/4 total Hit Dice (medium
          progression).</li><li>Good&nbsp;<a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Fortitude">Fortitude</a>&nbsp;and&nbsp;<a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Reflex">Reflex</a>&nbsp;saves.</li><li>Skill
          points equal to 2 +&nbsp;<a
          href="https://www.d20pfsrd.com/basics-ability-scores/ability-scores#TOC-Intelligence-Int-">Int</a>&nbsp;modifier
          (minimum 1) per Hit Die. The following are class skills for animals:
          <a href="https://www.d20pfsrd.com/skills/acrobatics">Acrobatics</a>,
          <a href="https://www.d20pfsrd.com/skills/climb">Climb</a>, <a
          href="https://www.d20pfsrd.com/skills/fly">Fly</a>, <a
          href="https://www.d20pfsrd.com/skills/perception">Perception</a>, <a
          href="https://www.d20pfsrd.com/skills/stealth">Stealth</a>, and <a
          href="https://www.d20pfsrd.com/skills/swim">Swim</a>.</li></ul><h2>Traits</h2><p>An
          animal possesses the following traits (unless otherwise noted in a
          creature’s entry).</p><ul><li><a
          href="https://www.d20pfsrd.com/basics-ability-scores/ability-scores#TOC-Intelligence-Int-">Intelligence</a>&nbsp;score
          of 1 or 2 (no creature with an&nbsp;<a
          href="https://www.d20pfsrd.com/basics-ability-scores/ability-scores#TOC-Intelligence-Int-">Intelligence</a>&nbsp;score
          of 3 or higher can be an animal).</li><li><a
          href="https://www.d20pfsrd.com/gamemastering/special-abilities#TOC-Low-Light-Vision">Low-light
          vision</a>.</li><li>Alignment: Always neutral.</li><li>Treasure:
          None.</li><li>Proficient with its natural weapons only. A
          non-combative herbivore treats its natural weapons as secondary
          attacks. Such attacks are made with a –5 penalty on the creature’s
          attack rolls, and the animal receives only 1/2 its&nbsp;<a
          href="https://www.d20pfsrd.com/basics-ability-scores/ability-scores#TOC-Strength-Str-">Strength</a>&nbsp;modifier
          as a damage adjustment.</li><li>Proficient with no armor unless
          trained for war. (See&nbsp;<a
          href="https://www.d20pfsrd.com/extras/pathfinder-faq#TOC-War-Trained-11-25-09-">FAQ</a>s
          and&nbsp;<a
          href="https://www.d20pfsrd.com/skills/handle-animal">Handle Animal
          Skill</a>.)</li><li>Animals breathe, eat, and sleep.</li></ul>
      hp: 12
      savingThrows:
        fort:
          value: high
        ref:
          value: high
      skillsPerLevel: 2
      tag: animal
    type: class
