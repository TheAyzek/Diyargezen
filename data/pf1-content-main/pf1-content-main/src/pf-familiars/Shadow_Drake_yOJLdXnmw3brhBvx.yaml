  - _id: 8ANclWoTGUVk5emK
    _key: '!actors.items!yOJLdXnmw3brhBvx.8ANclWoTGUVk5emK'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Speed Surge
    system:
      abilityType: ex
      description:
        value: >-
          Three times per day as a swift action, a shadow drake may draw on its
          draconic heritage for a boost of strength and speed to take an
          additional move action in that round.
      subType: classFeat
    type: feat
  - _id: W3dqIkP43zPmunGQ
    _key: '!actors.items!yOJLdXnmw3brhBvx.W3dqIkP43zPmunGQ'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Stygian Breath
    system:
      abilityType: su
      description:
        value: >-
          As a standard action, a shadow drake can exhale a ball of black liquid
          that explodes into a cloud of frigid black mist. This attack has a
          range of 60 feet and deals 2d6 points of cold damage (Reflex DC 12
          half) to all creatures within a 5-foot-radius spread. The mist snuffs
          out light sources in the area effect, extinguishing nonmagical light
          sources and dispelling light spells of 1st level or lower. Once a
          shadow drake has used its stygian breath, it cannot do so again for
          1d6 rounds. The save DC is Constitution-based.
      subType: classFeat
    type: feat
  - _id: aEGAgL8xLbTEt1Kc
