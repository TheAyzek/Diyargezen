  details:
    alignment: ce
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Shadow Drake CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 4 pg. 80<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CE \r\n            Tiny \r\n            Dragon (Cold) <br/>\r\n            <strong>Init</strong> 5;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +7; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 18, <strong>Touch</strong> 17, <strong>Flat-Footed</strong> 13 (+5 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 22 (3 HD; 3d12+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 8, <strong>Will</strong> 4\r\n            <br/><strong>Defensive Abilities</strong> shadow blend; \r\n            \r\n            <strong>Immune</strong> cold, paralysis, and sleep; \r\n            \r\n            \r\n            \r\n            <br/><strong>Weaknesses</strong> \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 90 ft. (perfect)<br/>\r\n                <strong>Melee</strong> bite +10 (1d3-1), tail slap +5 (1d3-1)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 9, <strong>Dex</strong> 20, <strong>Con</strong> 12, <strong>Int</strong> 11, <strong>Wis</strong> 12, <strong>Cha</strong> 16<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +6; <strong>CMD</strong> 15<br/>\r\n            <strong>Feats</strong> Flyby Attack, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Acrobatics +8 (+4 when jumping), Disable Device +8, Fly +23, Perception +7, Sleight of Hand +8, Stealth +19, Racial Modifiers -4 Acrobatics when jumping<br/>\r\n            <strong>Languages</strong> Common, Draconic<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any<br/>\r\n                <strong>Organization</strong>: solitary, pair, or rampage (3-5)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Shadow Blend (su): In conditions of illumination other than bright light, a shadow drake disappears into the shadows, giving it concealment (20% miss chance). It can resume or suspend this ability as a free action.\n\nSpeed Surge (ex): Three times per day as a swift action, a shadow drake may draw on its draconic heritage for a boost of strength and speed to take an additional move action in that round.\n\nStygian Breath (su): As a standard action, a shadow drake can exhale a ball of black liquid that explodes into a cloud of frigid black mist. This attack has a range of 60 feet and deals 2d6 points of cold damage (Reflex DC 12 half) to all creatures within a 5-foot-radius spread. The mist snuffs out light sources in the area effect, extinguishing nonmagical light sources and dispelling light spells of 1st level or lower. Once a shadow drake has used its stygian breath, it cannot do so again for 1d6 rounds. The save DC is Constitution-based.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Shadow drakes are mischievous and greedy. They often use their whiplike tails as third limbs, grasping small objects or even using their tails to work locks or swipe small objects they desire. Because they are so small and fast, they are master thieves and pickpockets. Unlike most drakes and dragonkin, shadow drakes like to haunt the fringes of civilization, often making lairs in abandoned buildings, forgotten attics, or unused bell towers, and stashing their tiny treasure hoards there.\n\nA shadow drake can be chosen as a familiar by a 7th-level evil spellcaster who has the Improved Familiar feat.\n\nYoung shadow drakes are almost pure black and have lustrous hides. As they age, their scales lose this luster and turn dull gray. Much like their larger dragon cousins, shadow drakes are long-lived, and can reach 150 to 200 years in age.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Shadow Drake CR 2\nSource Bestiary 4 pg. 80\nXP 600\nCE Tiny dragon (cold)\nInit +5; Senses darkvision 60 ft., low-light vision; Perception +7\nDefense\nAC 18, touch 17, flat-footed 13 (+5 Dex, +1 natural, +2 size)\nhp 22 (3d12+3)\nFort +4, Ref +8, Will +4\nDefensive Abilities shadow blend; Immune cold, paralysis, and sleep\nWeaknesses light sensitivity, vulnerable to fire\nOffense\nSpeed 20 ft., fly 90 ft. (perfect)\nMelee bite +10 (1d3-1), tail slap +5 (1d3-1)\nSpace 2-1/2 ft., Reach 0 ft. (5 ft. with tail)\nSpecial Attacks stygian breath\nStatistics\nStr 9, Dex 20, Con 12, Int 11, Wis 12, Cha 16\nBase Atk +3; CMB +6; CMD 15\nFeats Flyby Attack, Weapon Finesse\nSkills Acrobatics +8 (+4 when jumping), Disable Device +8, Fly +23, Perception +7, Sleight of Hand +8, Stealth +19; Racial Modifiers -4 Acrobatics when jumping\nLanguages Common, Draconic\nSQ speed surge\nEcology\nEnvironment any\nOrganization solitary, pair, or rampage (3-5)\nTreasure standard\nSpecial Abilities\nShadow Blend (Su) In conditions of illumination other than bright light, a shadow drake disappears into the shadows, giving it concealment (20% miss chance). It can resume or suspend this ability as a free action.\n\nSpeed Surge (Ex) Three times per day as a swift action, a shadow drake may draw on its draconic heritage for a boost of strength and speed to take an additional move action in that round.\n\nStygian Breath (Su) As a standard action, a shadow drake can exhale a ball of black liquid that explodes into a cloud of frigid black mist. This attack has a range of 60 feet and deals 2d6 points of cold damage (Reflex DC 12 half) to all creatures within a 5-foot-radius spread. The mist snuffs out light sources in the area effect, extinguishing nonmagical light sources and dispelling light spells of 1st level or lower. Once a shadow drake has used its stygian breath, it cannot do so again for 1d6 rounds. The save DC is Constitution-based.\nDescription\nShadow drakes are mischievous and greedy. They often use their whiplike tails as third limbs, grasping small objects or even using their tails to work locks or swipe small objects they desire. Because they are so small and fast, they are master thieves and pickpockets. Unlike most drakes and dragonkin, shadow drakes like to haunt the fringes of civilization, often making lairs in abandoned buildings, forgotten attics, or unused bell towers, and stashing their tiny treasure hoards there.\n\nA shadow drake can be chosen as a familiar by a 7th-level evil spellcaster who has the Improved Familiar feat.\n\nYoung shadow drakes are almost pure black and have lustrous hides. As they age, their scales lose this luster and turn dull gray. Much like their larger dragon cousins, shadow drakes are long-lived, and can reach 150 to 200 years in age.</pre>\n        </div>\n    "
