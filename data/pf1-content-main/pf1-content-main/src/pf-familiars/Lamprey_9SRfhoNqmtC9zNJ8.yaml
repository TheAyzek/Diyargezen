    cr:
      base: 0.3375
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Lamprey CR 1/3 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 199<br/>\r\n            <strong>XP 135</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal (Aquatic) <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> low-light vision; Perception +1; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 13 (+2 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 6 (1 HD; 1d8+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 4, <strong>Will</strong> 1\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.<br/>\r\n                <strong>Melee</strong> bite +4 (1d4-3 plus attach)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 4, <strong>Dex</strong> 14, <strong>Con</strong> 14, <strong>Int</strong> 1, <strong>Wis</strong> 12, <strong>Cha</strong> 2<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +0; <strong>CMD</strong> 7<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Stealth +14, Swim +5<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate oceans<br/>\r\n                <strong>Organization</strong>: solitary, pair, or school (3-12)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">A lamprey is a tiny jawless fish with a funnel-shaped sucking mouth that contains numerous razor-sharp teeth, which it uses to cut through skin and bore into the flesh of its victims to suck their blood. Lampreys are often found on larger fish in the ocean where they are engaged in symbiotic relationships.\n\nLampreys can reach a length of up to 4 feet and weigh up to 5 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Lamprey CR 1/3\nSource Ultimate Wilderness pg. 199\nXP 135\nN Tiny animal (aquatic)\nInit +2; Senses low-light vision; Perception +1\nDefense\nAC 15, touch 14, flat-footed 13 (+2 Dex, +1 natural, +2 size)\nhp 6 (1d8+2)\nFort +4, Ref +4, Will +1\nOffense\nSpeed swim 30 ft.\nMelee bite +4 (1d4-3 plus attach)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks blood drain (1 Str damage)\nStatistics\nStr 4, Dex 14, Con 14, Int 1, Wis 12, Cha 2\nBase Atk +0; CMB +0; CMD 7\nFeats Weapon Finesse\nSkills Stealth +14, Swim +5\nEcology\nEnvironment temperate oceans\nOrganization solitary, pair, or school (3-12)\nTreasure none\nDescription\nA lamprey is a tiny jawless fish with a funnel-shaped sucking mouth that contains numerous razor-sharp teeth, which it uses to cut through skin and bore into the flesh of its victims to suck their blood. Lampreys are often found on larger fish in the ocean where they are engaged in symbiotic relationships.\n\nLampreys can reach a length of up to 4 feet and weigh up to 5 pounds.</pre>\n        </div>\n    "
