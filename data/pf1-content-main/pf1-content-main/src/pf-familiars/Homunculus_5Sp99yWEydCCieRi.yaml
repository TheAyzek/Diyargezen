  details:
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Homunculus CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder RPG Bestiary pg. 176<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            Construct <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +3; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 12 (+2 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 11 (2 HD; 2d10)<br/>\r\n            <strong>Fort</strong> 0, <strong>Ref</strong> 4, <strong>Will</strong> 1\r\n            <br/><strong>Defensive Abilities</strong> construct traits; \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 50 ft. (good)<br/>\r\n                <strong>Melee</strong> 1 bite +3 (1d4-1 plus poison)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 15, <strong>Con</strong> 0, <strong>Int</strong> 10, <strong>Wis</strong> 12, <strong>Cha</strong> 7<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +2; <strong>CMD</strong> 11<br/>\r\n            <strong>Feats</strong> Lightning Reflexes<br/>\r\n            <strong>Skills</strong> Fly +10, Perception +3, Stealth +12<br/>\r\n            <strong>Languages</strong> Common (cannot speak), telepathic link<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any<br/>\r\n                <strong>Organization</strong>: solitary<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Poison (ex): Bite-injury; save Fort DC 13; frequency 1/minute for 60 minutes; effect sleep for 1 minute; cure 1 save. The save DC is Constitution-based and includes a +2 racial bonus.\n\nTelepathic Link (su): A homunculus cannot speak, but the process of creating one links it telepathically with its creator. A homunculus knows what its master knows and can convey to him or her everything it sees and hears, out to a distance of 1,500 feet.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">A homunculus is a miniature servant created by a spellcaster from his own blood. They are weak combatants but make effective spies, messengers, and scouts. A homunculus&#x27;s creator determines its precise features; some are more refined looking, but most creators don&#x27;t bother to improve the creature&#x27;s appearance beyond the minimum necessary for functioning.\n\nHomunculi are little more than tools designed to carry out assigned tasks. They are extensions of their creators, sharing the same alignment and basic nature. A homunculus never willingly travels more than a mile from its master, though it can be removed forcibly. If this occurs, the creature does everything in its power to return to this range, as it cannot communicate with its master beyond this distance. An attack that destroys a homunculus deals 2d10 points of damage to its master. If the creature&#x27;s master is slain, the homunculus goes insane-it loses its Intelligence score, all feats, and all skill ranks, and generally claims the immediate surroundings as its domain, mindlessly attacking any who intrude upon its lair.\n\nOn rare occasions, a homunculus freed from its servitude rises above its master&#x27;s original intent and becomes more than a half-insane construct guardian of a long-forgotten lair. In some cases, a homunculus might even come to see itself as the rightful heir to its master&#x27;s legacy, or even the reincarnated spirit of the master himself.\nConstruction\nA homunculus is shaped from a mixture of clay, ash, mandrake root, spring water, and one pint of the creator&#x27;s own blood. These materials cost 50 gp. After the body is sculpted, it is animated through an extended magical ritual that requires a specially prepared laboratory or workroom, similar to an alchemist&#x27;s laboratory, and costing an additional 1,000 gp to supply. If the creator is personally constructing the creature&#x27;s body, the building and ritual can be performed together. A homunculus with more than 2 Hit Dice can be created, but each additional Hit Die adds +2,000 gp to the cost to create.\n\nThe person whose blood is used to form a homunculus&#x27;s body becomes its master; it is possible for one person to give blood for the creation, another to sculpt the base material, and another to magically animate it as a minion for the one who provided the blood.\n\nCL 7th; Price 2,050 gp\nRequirements Craft Construct, Arcana eye, mirror image, mending; Skill Craft (leather) or Craft (sculptures) DC 12; Cost 1,050 gp.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Homunculus CR 1\nSource Pathfinder RPG Bestiary pg. 176\nXP 400\nAny alignment (same as creator) Tiny construct\nInit +2; Senses darkvision 60 ft., low-light vision; Perception +3\nDefense\nAC 14, touch 14, flat-footed 12 (+2 Dex, +2 size)\nhp 11 (2d10)\nFort +0, Ref +4, Will +1\nDefensive Abilities construct traits\nOffense\nSpeed 20 ft., fly 50 ft. (good)\nMelee 1 bite +3 (1d4-1 plus poison)\nSpace 2-1/2 ft., Reach 0 ft.\nStatistics\nStr 8, Dex 15, Con -, Int 10, Wis 12, Cha 7\nBase Atk +2; CMB +2; CMD 11\nFeats Lightning Reflexes\nSkills Fly +10, Perception +3, Stealth +12\nLanguages Common (cannot speak); telepathic link\nEcology\nEnvironment any\nOrganization solitary\nTreasure none\nSpecial Abilities\nPoison (Ex) Bite-injury; save Fort DC 13; frequency 1/minute for 60 minutes; effect sleep for 1 minute; cure 1 save. The save DC is Constitution-based and includes a +2 racial bonus.\n\nTelepathic Link (Su) A homunculus cannot speak, but the process of creating one links it telepathically with its creator. A homunculus knows what its master knows and can convey to him or her everything it sees and hears, out to a distance of 1,500 feet.\nDescription\nA homunculus is a miniature servant created by a spellcaster from his own blood. They are weak combatants but make effective spies, messengers, and scouts. A homunculus's creator determines its precise features; some are more refined looking, but most creators don't bother to improve the creature's appearance beyond the minimum necessary for functioning.\n\nHomunculi are little more than tools designed to carry out assigned tasks. They are extensions of their creators, sharing the same alignment and basic nature. A homunculus never willingly travels more than a mile from its master, though it can be removed forcibly. If this occurs, the creature does everything in its power to return to this range, as it cannot communicate with its master beyond this distance. An attack that destroys a homunculus deals 2d10 points of damage to its master. If the creature's master is slain, the homunculus goes insane-it loses its Intelligence score, all feats, and all skill ranks, and generally claims the immediate surroundings as its domain, mindlessly attacking any who intrude upon its lair.\n\nOn rare occasions, a homunculus freed from its servitude rises above its master's original intent and becomes more than a half-insane construct guardian of a long-forgotten lair. In some cases, a homunculus might even come to see itself as the rightful heir to its master's legacy, or even the reincarnated spirit of the master himself.\nConstruction\nA homunculus is shaped from a mixture of clay, ash, mandrake root, spring water, and one pint of the creator's own blood. These materials cost 50 gp. After the body is sculpted, it is animated through an extended magical ritual that requires a specially prepared laboratory or workroom, similar to an alchemist's laboratory, and costing an additional 1,000 gp to supply. If the creator is personally constructing the creature's body, the building and ritual can be performed together. A homunculus with more than 2 Hit Dice can be created, but each additional Hit Die adds +2,000 gp to the cost to create.\n\nThe person whose blood is used to form a homunculus's body becomes its master; it is possible for one person to give blood for the creation, another to sculpt the base material, and another to magically animate it as a minion for the one who provided the blood.\n\nCL 7th; Price 2,050 gp\nRequirements Craft Construct, arcane eye, mirror image, mending; Skill Craft (leather) or Craft (sculptures) DC 12; Cost 1,050 gp.</pre>\n        </div>\n    "
