  details:
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Small Earth Elemental CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder RPG Bestiary pg. 122<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Small \r\n            Outsider (Earth, Elemental, Extraplanar) <br/>\r\n            <strong>Init</strong> -1;\r\n            <strong>Senses</strong> darkvision 60 ft., tremorsense 60 ft.; Perception +4; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 10, <strong>Flat-Footed</strong> 17 (-1 Dex, +7 natural, +1 size)<br/>\r\n            <strong>Hit Points</strong> 13 (2 HD; 2d10+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 1, <strong>Will</strong> 3\r\n            \r\n            \r\n            <strong>Immune</strong> elemental traits; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> slam +6 (1d6+4)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 16, <strong>Dex</strong> 8, <strong>Con</strong> 13, <strong>Int</strong> 4, <strong>Wis</strong> 11, <strong>Cha</strong> 11<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +4; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Improved Bull RushB, Power Attack<br/>\r\n            <strong>Skills</strong> Appraise +1, Climb +7, Knowledge (dungeoneering) +1, Knowledge (planes) +1, Perception +4, Stealth +7<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Plane of Earth)<br/>\r\n                \r\n                \r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Elemental\tHeight\tWeight\nSmall\t4 ft.\t80 lbs.\nMedium\t8 ft.\t750 lbs.\nLarge\t16 ft.\t6,000 lbs.\nHuge\t32 ft.\t48,000 lbs.\nGreater\t36 ft.\t54,000 lbs.\nElder\t40 ft.\t60,000 lbs.\n\nEarth elementals are plodding, stubborn creatures made of living stone or earth. When utterly still, they resemble a heap of stone or a small hill.\n\nWhen an earth elemental lumbers into action, its actual appearance can vary, although its statistics remain identical to other elementals of its size. Most earth elementals look like terrestrial animals made out of rock, earth, or even crystal, with glowing gemstones for eyes. Larger earth elementals often have a stony humanoid appearance. Bits of vegetation frequently grow in the soil that makes up parts of an earth elemental’s body.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Small Earth Elemental CR 1\nSource Pathfinder RPG Bestiary pg. 122\nXP 400\nN Small outsider (earth, elemental, extraplanar)\nInit –1; Senses darkvision 60 ft., tremorsense 60 ft.; Perception +4\nDefense\nAC 17, touch 10, flat-footed 17 (–1 Dex, +7 natural, +1 size)\nhp 13 (2d10+2)\nFort +4, Ref –1, Will +3\nImmune elemental traits\nOffense\nSpeed 20 ft., burrow 20 ft., earth glide\nMelee slam +6 (1d6+4)\nSpecial Attacks earth mastery\nStatistics\nStr 16, Dex 8, Con 13, Int 4, Wis 11, Cha 11\nBase Atk +2; CMB +4; CMD 13\nFeats Improved Bull RushB, Power Attack\nSkills Appraise +1, Climb +7, Knowledge (dungeoneering) +1, Knowledge (planes) +1, Perception +4, Stealth +7\nEcology\nEnvironment any (Plane of Earth)\nDescription\nElemental\tHeight\tWeight\nSmall\t4 ft.\t80 lbs.\nMedium\t8 ft.\t750 lbs.\nLarge\t16 ft.\t6,000 lbs.\nHuge\t32 ft.\t48,000 lbs.\nGreater\t36 ft.\t54,000 lbs.\nElder\t40 ft.\t60,000 lbs.\n\nEarth elementals are plodding, stubborn creatures made of living stone or earth. When utterly still, they resemble a heap of stone or a small hill.\n\nWhen an earth elemental lumbers into action, its actual appearance can vary, although its statistics remain identical to other elementals of its size. Most earth elementals look like terrestrial animals made out of rock, earth, or even crystal, with glowing gemstones for eyes. Larger earth elementals often have a stony humanoid appearance. Bits of vegetation frequently grow in the soil that makes up parts of an earth elemental’s body.</pre>\n        </div>\n    "
