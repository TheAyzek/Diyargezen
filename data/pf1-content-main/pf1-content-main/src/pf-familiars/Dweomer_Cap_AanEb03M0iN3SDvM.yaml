    name: Aura Luminescence
    system:
      abilityType: ex
      description:
        value: >-
          A dweomer cap naturally emits dim light in a 10-foot radius. When in
          contact with a creature or object that has a faint or stronger magical
          aura, a dweomer cap's light shimmers perceptibly, changing its hue and
          pattern. A dweomer cap can suppress or resume its luminescence as a
          standard action, though it has reason to do so only when serving as a
          familiar and ordered by its master to do so.
