  - _id: bMBPZdSjxDj10AvR
    _key: '!actors.items!2bHmwMuLmrNHIwm2.bMBPZdSjxDj10AvR'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Haunting Melody
    system:
      abilityType: su
      description:
        value: >-
          A nosoi's song has the power to grip the spirits of those that hear
          it. All living and undead creatures within a 60-foot spread must
          succeed at a DC 14 Will saving throw or be fascinated. A creature that
          successfully saves is not subject to that nosoi's song for 24 hours.
          This effect continues for as long as the nosoi sings and for 1 round
          thereafter. A nosoi can sing for a number or rounds per day equal to
          twice its Hit Dice. This is a sonic mind-affecting charm effect. This
          ability can affect undead creatures, even though the undead subtype
          makes such creatures immune to mind-affecting effects (though undead
          creatures with immunity to mind-affecting effects from a source other
          than their creature type are still immune). The save DC is
          Charisma-based.
      subType: classFeat
    type: feat
  - _id: HWFMEPymxkDaL7MP
