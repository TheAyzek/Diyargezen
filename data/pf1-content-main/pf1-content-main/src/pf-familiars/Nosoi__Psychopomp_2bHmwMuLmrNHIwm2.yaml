  details:
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Nosoi, Psychopomp CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 4 pg. 220, Pathfinder #47: Ashes at Dawn pg. 86<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Outsider (Extraplanar, Psychopomp) <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision, spiritsense; Perception +9; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 12 (+3 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 6, <strong>Will</strong> 4\r\n            \r\n            <strong>DR</strong> 2/adamantine\r\n            <strong>Immune</strong> death effects, disease, poison; \r\n            <strong>Resist</strong> cold 10, electricity 10; \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 50 ft. (good)<br/>\r\n                <strong>Melee</strong> bite +8 (1d3-1)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 16, <strong>Con</strong> 12, <strong>Int</strong> 11, <strong>Wis</strong> 13, <strong>Cha</strong> 16<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Alertness, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Fly +17, Knowledge (history) +6, Knowledge (planes) +6, Perception +9, Profession (scribe) +7, Sense Motive +3, Stealth +17<br/>\r\n            <strong>Languages</strong> Abyssal, Celestial, Infernal<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Purgatory)<br/>\r\n                <strong>Organization</strong>: solitary, pair, or group (3-15)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Haunting Melody (su): A nosoi&#x27;s song has the power to grip the spirits of those that hear it. All living and undead creatures within a 60-foot spread must succeed at a DC 14 Will saving throw or be fascinated. A creature that successfully saves is not subject to that nosoi&#x27;s song for 24 hours. This effect continues for as long as the nosoi sings and for 1 round thereafter. A nosoi can sing for a number or rounds per day equal to twice its Hit Dice. This is a sonic mind-affecting charm effect. This ability can affect undead creatures, even though the undead subtype makes such creatures immune to mind-affecting effects (though undead creatures with immunity to mind-affecting effects from a source other than their creature type are still immune). The save DC is Charisma-based.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Nosois eagerly fill the roles of clerks, scribes, and messengers in Purgatory&#x27;s bureaucracy. They record the circumstances of each mortal&#x27;s death, any judgments for and against its soul, and its final destination among the Outer Planes. A noisoi looks like a songbird-usually a crow, sparrow, or whippoorwill-though it wears a funerary mask that accentuates its beak. Many nosois craft decorative artificial tails from grave goods and other decorations that trail behind them as they fly. A nosoi typically measures about 1 foot in length but is deceptively heavy, weighing between 10 and 15 pounds. It can use drawing and writing tools suitable for Small or Medium creatures without penalty.\n\nNosois serve within the libraries and scriptoriums of Purgatory, tirelessly scribbling away without rest. Being social creatures, they frequently chatter or sing with one another. A nosoi considers eating a rare treat, and sometimes shares the information it knows if given a suitable tasty bribe.\n\nA nosoi&#x27;s primary duties are to record happenings within Purgatory, conduct souls to and from their appointed destinations, and carry messages from Purgatory to agents in other planes. Most outsiders respect the couriers&#x27; neutrality and allow them safe passage. Many also serve as assistants to more powerful psychopomps or even to mortals with particularly morbid concerns or important fates. Nosois take pride in knowing that their trivial tasks aid in keeping one of the multiverse&#x27;s most important systems functioning with general reliability.\n\nA true neutral spellcaster can gain a nosoi as a familiar at 7th level by taking the Improved Familiar feat. A nosoi familiar grants its master a +2 bonus on skill checks made to scribe scrolls. A nosoi immediately leaves the service of any master who creates or permanently becomes an undead.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Nosoi, Psychopomp CR 2\nSource Bestiary 4 pg. 220, Pathfinder #47: Ashes at Dawn pg. 86\nXP 600\nN Tiny outsider (extraplanar, psychopomp)\nInit +3; Senses darkvision 60 ft., low-light vision, spiritsense; Perception +9\nDefense\nAC 15, touch 15, flat-footed 12 (+3 Dex, +2 size)\nhp 19 (3d10+3)\nFort +2, Ref +6, Will +4\nDR 2/adamantine; Immune death effects, disease, poison; Resist cold 10, electricity 10\nOffense\nSpeed 20 ft., fly 50 ft. (good)\nMelee bite +8 (1d3-1)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks haunting melody\nSpell-Like Abilities (CL 3rd; concentration +6)\nAt will-invisibility (self only)\n3/day-speak with dead (6 questions, CL 12th)\n1/day-hide from undead (DC 14), sound burst (DC 15)\nStatistics\nStr 8, Dex 16, Con 12, Int 11, Wis 13, Cha 16\nBase Atk +3; CMB +4; CMD 13\nFeats Alertness, Weapon Finesse\nSkills Fly +17, Knowledge (history) +6, Knowledge (planes) +6, Perception +9, Profession (scribe) +7, Sense Motive +3, Stealth +17\nLanguages Abyssal, Celestial, Infernal\nSQ change shape (raven or songbird [same statistics], beast shape II), spirit touch\nEcology\nEnvironment any (Purgatory)\nOrganization solitary, pair, or group (3-15)\nTreasure standard\nSpecial Abilities\nHaunting Melody (Su) A nosoi's song has the power to grip the spirits of those that hear it. All living and undead creatures within a 60-foot spread must succeed at a DC 14 Will saving throw or be fascinated. A creature that successfully saves is not subject to that nosoi's song for 24 hours. This effect continues for as long as the nosoi sings and for 1 round thereafter. A nosoi can sing for a number or rounds per day equal to twice its Hit Dice. This is a sonic mind-affecting charm effect. This ability can affect undead creatures, even though the undead subtype makes such creatures immune to mind-affecting effects (though undead creatures with immunity to mind-affecting effects from a source other than their creature type are still immune). The save DC is Charisma-based.\nDescription\nNosois eagerly fill the roles of clerks, scribes, and messengers in Purgatory's bureaucracy. They record the circumstances of each mortal's death, any judgments for and against its soul, and its final destination among the Outer Planes. A noisoi looks like a songbird-usually a crow, sparrow, or whippoorwill-though it wears a funerary mask that accentuates its beak. Many nosois craft decorative artificial tails from grave goods and other decorations that trail behind them as they fly. A nosoi typically measures about 1 foot in length but is deceptively heavy, weighing between 10 and 15 pounds. It can use drawing and writing tools suitable for Small or Medium creatures without penalty.\n\nNosois serve within the libraries and scriptoriums of Purgatory, tirelessly scribbling away without rest. Being social creatures, they frequently chatter or sing with one another. A nosoi considers eating a rare treat, and sometimes shares the information it knows if given a suitable tasty bribe.\n\nA nosoi's primary duties are to record happenings within Purgatory, conduct souls to and from their appointed destinations, and carry messages from Purgatory to agents in other planes. Most outsiders respect the couriers' neutrality and allow them safe passage. Many also serve as assistants to more powerful psychopomps or even to mortals with particularly morbid concerns or important fates. Nosois take pride in knowing that their trivial tasks aid in keeping one of the multiverse's most important systems functioning with general reliability.\n\nA true neutral spellcaster can gain a nosoi as a familiar at 7th level by taking the Improved Familiar feat. A nosoi familiar grants its master a +2 bonus on skill checks made to scribe scrolls. A nosoi immediately leaves the service of any master who creates or permanently becomes an undead.</pre>\n        </div>\n    "
