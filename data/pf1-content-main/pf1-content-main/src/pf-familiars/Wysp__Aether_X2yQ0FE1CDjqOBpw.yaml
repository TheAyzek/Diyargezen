    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Aether Wysp CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 5 pg. 282<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Outsider (Aether, Elemental) <br/>\r\n            <strong>Init</strong> 7;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +7; \r\n            <strong>Aura</strong>  resonance (30 ft.)\r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 12 (+3 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 22 (3 HD; 3d10+6)<br/>\r\n            <strong>Fort</strong> 5, <strong>Ref</strong> 6, <strong>Will</strong> 2\r\n            \r\n            \r\n            <strong>Immune</strong> elemental traits; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (good)<br/>\r\n                <strong>Melee</strong> 2 tendrils +10 (1d3+2)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 10, <strong>Dex</strong> 17, <strong>Con</strong> 14, <strong>Int</strong> 10, <strong>Wis</strong> 13, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 14<br/>\r\n            <strong>Feats</strong> Improved Initiative, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Bluff +7, Disable Device +9, Fly +15, Knowledge (planes) +4, Perception +7, Sense Motive +6, Sleight of Hand +9, Stealth +17<br/>\r\n            <strong>Languages</strong> Aquan, Auran, Ignan, Terran<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n                \r\n                \r\n                \r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Lesser Telekinesis (su): By extending its strands of aether, an aether wysp can move small objects at a distance, as per mage hand except that lesser telekinesis is a supernatural ability and can move magical or nonmagical objects weighing up to 10 pounds.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n        \r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Aether Wysp CR 2\nSource Bestiary 5 pg. 282\nXP 600\nN Tiny outsider (aether, elemental)\nInit +7; Senses darkvision 60 ft.; Perception +7\nAura resonance (30 ft.)\nDefense\nAC 15, touch 15, flat-footed 12 (+3 Dex, +2 size)\nhp 22 (3d10+6)\nFort +5, Ref +6, Will +2\nImmune elemental traits\nOffense\nSpeed fly 60 ft. (good)\nMelee 2 tendrils +10 (1d3+2)\nSpace 2-1/2 ft., Reach 0 ft.\nStatistics\nStr 10, Dex 17, Con 14, Int 10, Wis 13, Cha 13\nBase Atk +3; CMB +4; CMD 14 (can't be tripped)\nFeats Improved Initiative, Weapon Finesse\nSkills Bluff +7, Disable Device +9, Fly +15, Knowledge (planes) +4, Perception +7, Sense Motive +6, Sleight of Hand +9, Stealth +17\nLanguages Aquan, Auran, Ignan, Terran\nSQ lesser telekinesis, living battery, servitor\nSpecial Abilities\nLesser Telekinesis (Su) By extending its strands of aether, an aether wysp can move small objects at a distance, as per mage hand except that lesser telekinesis is a supernatural ability and can move magical or nonmagical objects weighing up to 10 pounds.</pre>\n        </div>\n    "
