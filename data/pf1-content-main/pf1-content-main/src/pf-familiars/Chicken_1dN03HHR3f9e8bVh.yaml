  details:
    cr:
      base: 0.1625
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Chicken CR 1/6 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 193, Familiar Folio pg. 24, Bestiary 5 pg. 112<br/>\r\n            <strong>XP 65</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal <br/>\r\n            <strong>Init</strong> 4;\r\n            <strong>Senses</strong> low-light vision; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 12, <strong>Touch</strong> 12, <strong>Flat-Footed</strong> 12 (+2 size)<br/>\r\n            <strong>Hit Points</strong> 5 (1 HD; 1d8+1)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 2, <strong>Will</strong> 1\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft. (clumsy); drift<br/>\r\n                <strong>Melee</strong> bite -2 (1d3-4)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 3, <strong>Dex</strong> 11, <strong>Con</strong> 12, <strong>Int</strong> 2, <strong>Wis</strong> 12, <strong>Cha</strong> 13<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-2; <strong>CMD</strong> 4<br/>\r\n            <strong>Feats</strong> Improved Initiative<br/>\r\n            <strong>Skills</strong> Fly -4, Perception +5<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any temperate<br/>\r\n                <strong>Organization</strong>: solitary, pair, or flock (3-20)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Drift (ex): A chicken flies in short bursts and can&#x27;t use its fly speed to hover. When it flies, a chicken must end its move action by landing or perching on a solid surface.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Chickens are prized for the hearty breakfast meals they provide if properly fed and cared for. Chickens are highly social creatures that raise their young communally. They&#x27;re picky about the spots where they roost, and a hen rarely strays from a particular nest once she&#x27;s laid her eggs there. A fertilized chicken egg hatches into a chick after roughly 3 weeks of incubation.\n\nIn addition to their quick reproductive cycles, chickens have the ability to thrive on simple foods, and they are valued in both rural farming communities and metropolitan areas for their delicious and nutrient-rich eggs and meat. A hen bred for laying eggs can produce up to one egg every 24 hours.\n\nA chicken is about 1 foot tall and weighs 5 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Chicken CR 1/6\nSource Ultimate Wilderness pg. 193, Familiar Folio pg. 24, Bestiary 5 pg. 112\nXP 65\nN Tiny animal\nInit +4; Senses low-light vision; Perception +5\nDefense\nAC 12, touch 12, flat-footed 12 (+2 size)\nhp 5 (1d8+1)\nFort +3, Ref +2, Will +1\nOffense\nSpeed 30 ft., fly 20 ft. (clumsy); drift\nMelee bite -2 (1d3-4)\nSpace 2-1/2 ft., Reach 0 ft.\nStatistics\nStr 3, Dex 11, Con 12, Int 2, Wis 12, Cha 13\nBase Atk +0; CMB -2; CMD 4\nFeats Improved Initiative\nSkills Fly -4, Perception +5\nEcology\nEnvironment any temperate\nOrganization solitary, pair, or flock (3-20)\nTreasure none\nSpecial Abilities\nDrift (Ex) A chicken flies in short bursts and can't use its fly speed to hover. When it flies, a chicken must end its move action by landing or perching on a solid surface.\nDescription\nChickens are prized for the hearty breakfast meals they provide if properly fed and cared for. Chickens are highly social creatures that raise their young communally. They're picky about the spots where they roost, and a hen rarely strays from a particular nest once she's laid her eggs there. A fertilized chicken egg hatches into a chick after roughly 3 weeks of incubation.\n\nIn addition to their quick reproductive cycles, chickens have the ability to thrive on simple foods, and they are valued in both rural farming communities and metropolitan areas for their delicious and nutrient-rich eggs and meat. A hen bred for laying eggs can produce up to one egg every 24 hours.\n\nA chicken is about 1 foot tall and weighs 5 pounds.</pre>\n        </div>\n    "
