  details:
    cr:
      base: 0.25
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Dodo CR 1/4 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 194, Pathfinder #55: The Wormwood Mutiny pg. 88, Bestiary 4 pg. 96<br/>\r\n            <strong>XP 100</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Small \r\n            Animal <br/>\r\n            <strong>Init</strong> 0;\r\n            <strong>Senses</strong> low-light vision; Perception +3; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 11, <strong>Touch</strong> 11, <strong>Flat-Footed</strong> 11 (+1 size)<br/>\r\n            <strong>Hit Points</strong> 6 (1 HD; 1d8+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 2, <strong>Will</strong> 1\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> bite +0 (1d3-2)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 7, <strong>Dex</strong> 11, <strong>Con</strong> 14, <strong>Int</strong> 2, <strong>Wis</strong> 9, <strong>Cha</strong> 6<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-3; <strong>CMD</strong> 7<br/>\r\n            <strong>Feats</strong> Weapon Focus (bite)<br/>\r\n            <strong>Skills</strong> Perception +3<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm coastlines and plains<br/>\r\n                <strong>Organization</strong>: solitary, pair, or huddle (3-6)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">These flightless birds typically inhabit isolated tropical islands and coastlines that are devoid of predators and other creatures that might kill them to use as a resource. Dodos&#x27; size and unfamiliarity with natural dangers contribute to a kind of boldness in their species-or what some would call stupidity-causing them to bumble into precarious situations and making them easy targets for other creatures that are on the prowl for a tasty meal. The birds can all too easily be caught and slain, and while their meat has a most unpleasant taste, few starving, shipwrecked sailors would turn such a providential meal down.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Dodo CR 1/4\nSource Ultimate Wilderness pg. 194, Pathfinder #55: The Wormwood Mutiny pg. 88, Bestiary 4 pg. 96\nXP 100\nN Small animal\nInit +0; Senses low-light vision; Perception +3\nDefense\nAC 11, touch 11, flat-footed 11 (+1 size)\nhp 6 (1d8+2)\nFort +4, Ref +2, Will -1\nOffense\nSpeed 20 ft.\nMelee bite +0 (1d3-2)\nStatistics\nStr 7, Dex 11, Con 14, Int 2, Wis 9, Cha 6\nBase Atk +0; CMB -3; CMD 7\nFeats Weapon Focus (bite)\nSkills Perception +3\nEcology\nEnvironment warm coastlines and plains\nOrganization solitary, pair, or huddle (3-6)\nTreasure none\nDescription\nThese flightless birds typically inhabit isolated tropical islands and coastlines that are devoid of predators and other creatures that might kill them to use as a resource. Dodos' size and unfamiliarity with natural dangers contribute to a kind of boldness in their species-or what some would call stupidity-causing them to bumble into precarious situations and making them easy targets for other creatures that are on the prowl for a tasty meal. The birds can all too easily be caught and slain, and while their meat has a most unpleasant taste, few starving, shipwrecked sailors would turn such a providential meal down.</pre>\n        </div>\n    "
