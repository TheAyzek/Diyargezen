  details:
    cr:
      base: 0.3375
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Fire Salamander CR 1/3 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 196<br/>\r\n            <strong>XP 135</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Diminutive \r\n            Animal <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> low-light vision, scent; Perception -1; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 16, <strong>Flat-Footed</strong> 14 (+2 Dex, +4 size)<br/>\r\n            <strong>Hit Points</strong> 3 (1 HD; 1d8-1)<br/>\r\n            <strong>Fort</strong> 1, <strong>Ref</strong> 4, <strong>Will</strong> 1\r\n            <br/><strong>Defensive Abilities</strong> skin secretions; \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> bite +6 (1d2-4)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 2, <strong>Dex</strong> 14, <strong>Con</strong> 8, <strong>Int</strong> 1, <strong>Wis</strong> 8, <strong>Cha</strong> 6<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-2; <strong>CMD</strong> 4<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Escape Artist +6, Stealth +18, Swim +10, Racial Modifiers +4 Escape Artist<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate forests<br/>\r\n                <strong>Organization</strong>: solitary, pair, or congress (3-10)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Skin Secretions (ex): A creature that strikes a fire salamander with an unarmed strike or natural weapon exposes itself to the salamander&#x27;s toxic skin and must immediately succeed at a DC 9 Fortitude save to resist being sickened for 1 round. The secretions also make the salamander difficult to grab, giving it a +4 racial bonus on Escape Artist checks. The save DC is Constitution-based.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Despite their name, fire salamanders have nothing to do with the evil outsiders known as salamanders. These are Diminutive poisonous amphibians that can live more than 50 years. They are most active after dusk, eating earthworms, insects, slugs, and spiders. During the day, they hide amid fallen leaves or near mossy tree trunks.\n\nFire salamanders are 6 to 10 inches long and weigh only 2 ounces.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Fire Salamander CR 1/3\nSource Ultimate Wilderness pg. 196\nXP 135\nN Diminutive animal\nInit +2; Senses low-light vision, scent; Perception -1\nDefense\nAC 16, touch 16, flat-footed 14 (+2 Dex, +4 size)\nhp 3 (1d8-1)\nFort +1, Ref +4, Will -1\nDefensive Abilities skin secretions\nOffense\nSpeed 10 ft., swim 20 ft.\nMelee bite +6 (1d2-4)\nSpace 1 ft., Reach 0 ft.\nStatistics\nStr 2, Dex 14, Con 8, Int 1, Wis 8, Cha 6\nBase Atk +0; CMB -2; CMD 4 (8 vs. trip)\nFeats Weapon Finesse\nSkills Escape Artist +6, Stealth +18, Swim +10; Racial Modifiers +4 Escape Artist\nEcology\nEnvironment temperate forests\nOrganization solitary, pair, or congress (3-10)\nTreasure none\nSpecial Abilities\nSkin Secretions (Ex) A creature that strikes a fire salamander with an unarmed strike or natural weapon exposes itself to the salamander's toxic skin and must immediately succeed at a DC 9 Fortitude save to resist being sickened for 1 round. The secretions also make the salamander difficult to grab, giving it a +4 racial bonus on Escape Artist checks. The save DC is Constitution-based.\nDescription\nDespite their name, fire salamanders have nothing to do with the evil outsiders known as salamanders. These are Diminutive poisonous amphibians that can live more than 50 years. They are most active after dusk, eating earthworms, insects, slugs, and spiders. During the day, they hide amid fallen leaves or near mossy tree trunks.\n\nFire salamanders are 6 to 10 inches long and weigh only 2 ounces.</pre>\n        </div>\n    "
