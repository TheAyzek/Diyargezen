    name: Skin Secretions
    system:
      abilityType: ex
      description:
        value: >-
          A creature that strikes a fire salamander with an unarmed strike or
          natural weapon exposes itself to the salamander's toxic skin and must
          immediately succeed at a DC 9 Fortitude save to resist being sickened
          for 1 round. The secretions also make the salamander difficult to
          grab, giving it a +4 racial bonus on Escape Artist checks. The save DC
          is Constitution-based.
      subType: classFeat
    type: feat
