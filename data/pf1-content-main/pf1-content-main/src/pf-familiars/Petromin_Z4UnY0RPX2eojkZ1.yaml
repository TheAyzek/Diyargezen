  details:
    cr:
      base: 0.3375
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Petromin CR 1/3 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder #85: Fires of Creation pg. 82<br/>\r\n            <strong>XP 135</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> low-light vision; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 12 (+2 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 4 (1 HD; 1d8)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 4, <strong>Will</strong> 1\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 40 ft. (poor)<br/>\r\n                <strong>Melee</strong> bite +4 (1d3-4)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 3, <strong>Dex</strong> 15, <strong>Con</strong> 10, <strong>Int</strong> 2, <strong>Wis</strong> 12, <strong>Cha</strong> 7<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +0; <strong>CMD</strong> 6<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Climb +4, Perception +5, Stealth +14, Racial Modifiers +4 Stealth<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any deserts<br/>\r\n                <strong>Organization</strong>: solitary, pair, or gathering (3-8)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Cloaked (ex): A petromin is invisible to creatures using only darkvision, but can be detected by other means.\n\nGliding Flight (ex): A petromin can&#x27;t hover or fly up at an angle greater than 45 degrees while flying. It must end its turn on the ground.\n\nLuminous (ex): A petromin naturally sheds light equal to that provided by a candle. It can control the color of the illumination. As a swift action, it can extinguish the light.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Petromins, also known as azure gliders, are desert cliff-top dwellers that glide down to snatch prey. As a defense, their coloration is countershaded; the blue, sky-like coloration on their undersides makes them hard to notice from the ground, while their brown fur helps them blend into desert vistas below, hiding them from predatory birds. The fur of petromins is awash in sapphire-blue bioluminescence, unnoticeable during the day but distinctive from dusk until dawn. Petromins have control over this natural light, which allows them to attract the large insects on which they feed. A petromin measures 30 inches in length (including a 6-inchlong tail) and weighs 5 pounds. A spellcaster can select a petromin as a familiar, and the master gains a +3 bonus on Stealth checks as a special ability.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Petromin CR 1/3\nSource Pathfinder #85: Fires of Creation pg. 82\nXP 135\nN Tiny animal\nInit +2; Senses low-light vision; Perception +5\nDefense\nAC 14, touch 14, flat-footed 12 (+2 Dex, +2 size)\nhp 4 (1d8)\nFort +2, Ref +4, Will +1\nOffense\nSpeed 20 ft., climb 20 ft., fly 40 ft. (poor)\nMelee bite +4 (1d3-4)\nSpace 2 1/2 ft., Reach 0 ft.\nStatistics\nStr 3, Dex 15, Con 10, Int 2, Wis 12, Cha 7\nBase Atk +0; CMB +0; CMD 6 (10 vs. trip)\nFeats Weapon Finesse\nSkills Climb +4, Perception +5, Stealth +14; Racial Modifiers +4 Stealth\nSQ cloaked, gliding flight, luminous\nEcology\nEnvironment any deserts\nOrganization solitary, pair, or gathering (3-8)\nTreasure none\nSpecial Abilities\nCloaked (Ex) A petromin is invisible to creatures using only darkvision, but can be detected by other means.\n\nGliding Flight (Ex) A petromin can't hover or fly up at an angle greater than 45 degrees while flying. It must end its turn on the ground.\n\nLuminous (Ex) A petromin naturally sheds light equal to that provided by a candle. It can control the color of the illumination. As a swift action, it can extinguish the light.\nDescription\nPetromins, also known as azure gliders, are desert cliff-top dwellers that glide down to snatch prey. As a defense, their coloration is countershaded; the blue, sky-like coloration on their undersides makes them hard to notice from the ground, while their brown fur helps them blend into desert vistas below, hiding them from predatory birds. The fur of petromins is awash in sapphire-blue bioluminescence, unnoticeable during the day but distinctive from dusk until dawn. Petromins have control over this natural light, which allows them to attract the large insects on which they feed. A petromin measures 30 inches in length (including a 6-inchlong tail) and weighs 5 pounds. A spellcaster can select a petromin as a familiar, and the master gains a +3 bonus on Stealth checks as a special ability.</pre>\n        </div>\n    "
