    name: Excellent Memory
    system:
      abilityType: ex
      description:
        value: >-
          A tauhoti's brain readily catalogues information that it can recall
          much later, granting it a +4 bonus on Intelligence checks to remember
          facts- typically the location of caches or identities of other
          animals. A tauhoti also gains a +2 racial bonus on saving throws
          against effects that would damage, drain, or reduce its Intelligence
          or Wisdom ability scores.
