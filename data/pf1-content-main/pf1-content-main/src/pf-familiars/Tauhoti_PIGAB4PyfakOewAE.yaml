  details:
    cr:
      base: 0.1625
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Tauhoti CR 1/6 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Druma, Profit and Prophecy pg. 63<br/>\r\n            <strong>XP 65</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Diminutive \r\n            Animal <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> low-light vision, scent; Perception +8; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 17, <strong>Flat-Footed</strong> 14 (+3 Dex, +4 size)<br/>\r\n            <strong>Hit Points</strong> 3 (1 HD; 1d8-1)<br/>\r\n            <strong>Fort</strong>, <strong>Ref</strong>, <strong>Will</strong> \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 5 ft.<br/>\r\n                <strong>Melee</strong> bite -1 (1d2-5)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 1, <strong>Dex</strong> 16, <strong>Con</strong> 8, <strong>Int</strong> 2, <strong>Wis</strong> 15, <strong>Cha</strong> 9<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-1; <strong>CMD</strong> 4<br/>\r\n            <strong>Feats</strong> Alertness<br/>\r\n            <strong>Skills</strong> Perception +8, Sense Motive +4<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate forests or hills<br/>\r\n                <strong>Organization</strong>: solitary, pair, or emporium (3-8)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Excellent Memory (ex): A tauhoti&#x27;s brain readily catalogues information that it can recall much later, granting it a +4 bonus on Intelligence checks to remember facts- typically the location of caches or identities of other animals. A tauhoti also gains a +2 racial bonus on saving throws against effects that would damage, drain, or reduce its Intelligence or Wisdom ability scores.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Tauhotis are ground squirrels famed for their humanoid-like proclivity for trading with other animals. Tauhotis avidly cache food across a wide territory during warmer seasons so they have ample food to eat during the winter. Though tauhotis share their plentiful larders with other animals in distress, this is no gift. A tauhoti can remember the scent and appearance of hundreds of animals, and it recalls which ones have taken or given it food. The following season, the tauhoti watches for its debtors, at first chirping at them and then nipping them until they provide some repayment. Some birds and mammals maintain mutual relationships with tauhotis, bringing them offerings of hard-to-access food either in exchange for something else the tauhoti has or to gain the rodent&#x27;s assistance in burying a morsel for later. Tauhotis&#x27; mercantile habits are endearing to most Drumans. It&#x27;s a common belief that anyone who can maintain a tauhoti as a pet is trustworthy, for the rodents practically never forget a slight and eagerly reward upstanding companions. Selective breeding has produced an albino variety that especially appeals to Kalistocrat owners.\n\nA spellcaster can select a tauhoti as a familiar. As a special ability the master gains a +3 bonus on one Profession check of her choice, selected when gaining the familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Tauhoti CR 1/6\nSource Druma, Profit and Prophecy pg. 63\nXP 65\nN Diminutive animal\nInit +3; Senses low-light vision, scent; Perception +8\nDefense\nAC 17, touch 17, flat-footed 14 (+3 Dex, +4 size)\nhp 3 (1d8-1)\nFort 1, Ref 5, Will 2; +2 vs. Intelligence and Wisdom damage\nOffense\nSpeed 20 ft., burrow 5 ft.\nMelee bite -1 (1d2-5)\nSpace 1 ft., Reach 0 ft.\nStatistics\nStr 1, Dex 16, Con 8, Int 2, Wis 15, Cha 9\nBase Atk 0; CMB -1; CMD 4 (8 vs. trip)\nFeats Alertness\nSkills Perception +8, Sense Motive +4\nSQ excellent memory\nEcology\nEnvironment temperate forests or hills\nOrganization solitary, pair, or emporium (3-8)\nTreasure none\nSpecial Abilities\nExcellent Memory (Ex) A tauhoti's brain readily catalogues information that it can recall much later, granting it a +4 bonus on Intelligence checks to remember facts- typically the location of caches or identities of other animals. A tauhoti also gains a +2 racial bonus on saving throws against effects that would damage, drain, or reduce its Intelligence or Wisdom ability scores.\nDescription\nTauhotis are ground squirrels famed for their humanoid-like proclivity for trading with other animals. Tauhotis avidly cache food across a wide territory during warmer seasons so they have ample food to eat during the winter. Though tauhotis share their plentiful larders with other animals in distress, this is no gift. A tauhoti can remember the scent and appearance of hundreds of animals, and it recalls which ones have taken or given it food. The following season, the tauhoti watches for its debtors, at first chirping at them and then nipping them until they provide some repayment. Some birds and mammals maintain mutual relationships with tauhotis, bringing them offerings of hard-to-access food either in exchange for something else the tauhoti has or to gain the rodent's assistance in burying a morsel for later. Tauhotis' mercantile habits are endearing to most Drumans. It's a common belief that anyone who can maintain a tauhoti as a pet is trustworthy, for the rodents practically never forget a slight and eagerly reward upstanding companions. Selective breeding has produced an albino variety that especially appeals to Kalistocrat owners.\n\nA spellcaster can select a tauhoti as a familiar. As a special ability the master gains a +3 bonus on one Profession check of her choice, selected when gaining the familiar.</pre>\n        </div>\n    "
