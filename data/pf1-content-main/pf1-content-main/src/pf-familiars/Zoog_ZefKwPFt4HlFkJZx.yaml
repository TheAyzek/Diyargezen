  details:
    alignment: ce
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Zoog CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 3 pg. 288<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CE \r\n            Tiny \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> darkvision 60 ft., detect magic, low-light vision, scent, spell sight; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 12 (+2 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 11 (2 HD; 2d10)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 5, <strong>Will</strong> 1\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.<br/>\r\n                <strong>Melee</strong> bite +6 (1d3-2 plus bleed 1), 2 claws +6 (1d2-2)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 15, <strong>Con</strong> 10, <strong>Int</strong> 5, <strong>Wis</strong> 12, <strong>Cha</strong> 5<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +2; <strong>CMD</strong> 10<br/>\r\n            <strong>Feats</strong> Weapon Finesse<br/>\r\n            <strong>Skills</strong> Acrobatics +12, Climb +16, Perception +5, Racial Modifiers +6 Acrobatics, +6 Climb<br/>\r\n            <strong>Languages</strong> Aklo, speak with animals<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any forest<br/>\r\n                <strong>Organization</strong>: solitary, pair, gang (3-14), tribe (15+ plus 50% noncombatants)<br/>\r\n                <strong>Treasure</strong>: incidental<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Otherworldly Touch (ex): A zoog&#x27;s natural attacks can strike incorporeal creatures as if they were ghost touch weapons.\n\nSpell Sight (su): A zoog&#x27;s eyes radiate normal light in a 15-foot cone and increase the light level by one step for an additional 15 feet beyond that area. Any magic effect in this area glows faintly. This glow does not reveal the magic effect&#x27;s school or strength. A zoog can quell or renew this light as a swift action.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Spiteful, nasty creatures with a taste for the flesh of sentient beings, zoogs lurk in the shadowy, moldering places of the world. Often mistaken merely for otherworldly animals, zoogs possess base intentions and vicious demeanors that set them apart from lowly beasts. Congregating in loose, tribal societies, these sinister creatures claim the depths of dark woodlands or moldy forests as their homes, favoring lands where the boundaries between worlds and planes grow thin and strange creatures-not unlike themselves-slip between reality&#x27;s cracks.\n\nAlthough lone zoogs shy away from attacking larger creatures, when zoogs outnumber an invader they launch deadly ambushes, leaping from sagging boughs and hidden dens to swarm foes. Only strangers with quick tongues and items that appeal to zoogs&#x27; interest in magical curiosities might manage to barter for safe passage through zoog territory. While many victims of zoog attacks are consumed on the spot, some less fortunate few are dragged back to the mystical, strangely carved stones that mark the center of zoog communities. There, such captives become the doomed focus of strange ceremonies before being sacrificed to the zoogs&#x27; depraved deities.\n\nCommonly, zoogs eat fungi and plants, but they also have a taste for the meat of sentient creatures, treating the butchering and consumption of such beings as a rare privilege. Zoogs also detest cats, and go to great lengths to slay felines of any sort and devour them.\n\nOccasionally a zoog allows a spellcaster of especial depravity, or with interests in the mysteries of realms and creatures beyond the mortal world, to employ it as a familiar. A spellcaster must have the Improved Familiar feat, be chaotic evil, and have an Arcana caster level of 5th or higher to gain a zoog familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Zoog CR 1\nSource Bestiary 3 pg. 288\nXP 400\nCE Tiny magical beast\nInit +2; Senses darkvision 60 ft., detect magic, low-light vision, scent, spell sight; Perception +5\nDefense\nAC 14, touch 14, flat-footed 12 (+2 Dex, +2 size)\nhp 11 (2d10)\nFort +3, Ref +5, Will +1\nOffense\nSpeed 30 ft., climb 30 ft.\nMelee bite +6 (1d3-2 plus bleed 1), 2 claws +6 (1d2-2)\nSpecial Attacks bleed 1\nSpell-Like Abilities (CL 1st; concentration -2)\nConstant-detect magic, speak with animals\nStatistics\nStr 6, Dex 15, Con 10, Int 5, Wis 12, Cha 5\nBase Atk +2; CMB +2; CMD 10 (14 vs. trip)\nFeats Weapon Finesse\nSkills Acrobatics +12, Climb +16, Perception +5; Racial Modifiers +6 Acrobatics, +6 Climb\nLanguages Aklo; speak with animals\nSQ otherworldly touch\nEcology\nEnvironment any forest\nOrganization solitary, pair, gang (3-14), tribe (15+ plus 50% noncombatants)\nTreasure incidental\nSpecial Abilities\nOtherworldly Touch (Ex) A zoog's natural attacks can strike incorporeal creatures as if they were ghost touch weapons.\n\nSpell Sight (Su) A zoog's eyes radiate normal light in a 15-foot cone and increase the light level by one step for an additional 15 feet beyond that area. Any magic effect in this area glows faintly. This glow does not reveal the magic effect's school or strength. A zoog can quell or renew this light as a swift action.\nDescription\nSpiteful, nasty creatures with a taste for the flesh of sentient beings, zoogs lurk in the shadowy, moldering places of the world. Often mistaken merely for otherworldly animals, zoogs possess base intentions and vicious demeanors that set them apart from lowly beasts. Congregating in loose, tribal societies, these sinister creatures claim the depths of dark woodlands or moldy forests as their homes, favoring lands where the boundaries between worlds and planes grow thin and strange creatures-not unlike themselves-slip between reality's cracks.\n\nAlthough lone zoogs shy away from attacking larger creatures, when zoogs outnumber an invader they launch deadly ambushes, leaping from sagging boughs and hidden dens to swarm foes. Only strangers with quick tongues and items that appeal to zoogs' interest in magical curiosities might manage to barter for safe passage through zoog territory. While many victims of zoog attacks are consumed on the spot, some less fortunate few are dragged back to the mystical, strangely carved stones that mark the center of zoog communities. There, such captives become the doomed focus of strange ceremonies before being sacrificed to the zoogs' depraved deities.\n\nCommonly, zoogs eat fungi and plants, but they also have a taste for the meat of sentient creatures, treating the butchering and consumption of such beings as a rare privilege. Zoogs also detest cats, and go to great lengths to slay felines of any sort and devour them.\n\nOccasionally a zoog allows a spellcaster of especial depravity, or with interests in the mysteries of realms and creatures beyond the mortal world, to employ it as a familiar. A spellcaster must have the Improved Familiar feat, be chaotic evil, and have an arcane caster level of 5th or higher to gain a zoog familiar.</pre>\n        </div>\n    "
