  details:
    alignment: ce
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Nuglub CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 2 pg. 143<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CE \r\n            Small \r\n            Fey <br/>\r\n            <strong>Init</strong> 4;\r\n            <strong>Senses</strong> darkvision 120 ft., low-light vision; Perception +9; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 18, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 14 (+4 Dex, +3 natural, +1 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d6+9)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 7, <strong>Will</strong> 2\r\n            \r\n            <strong>DR</strong> 5/cold iron\r\n            \r\n            \r\n            <strong>SR</strong> 13\r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> bite +3 (1d4+1 plus grab), 2 claws +4 (1d3+1 plus trip)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 13, <strong>Dex</strong> 18, <strong>Con</strong> 15, <strong>Int</strong> 8, <strong>Wis</strong> 9, <strong>Cha</strong> 12<br/>\r\n            <strong>Base Atk</strong> +1; <strong>CMB</strong> +1; <strong>CMD</strong> 15<br/>\r\n            <strong>Feats</strong> Step Up, ToughnessB, Weapon Focus (claw)<br/>\r\n            <strong>Skills</strong> Acrobatics +10, Climb +9, Craft (traps) +9, Intimidate +8, Perception +9, Stealth +14, Racial Modifiers +4 Craft (traps), +4 Intimidate, +4 Perception<br/>\r\n            <strong>Languages</strong> Undercommon<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any underground or urban<br/>\r\n                <strong>Organization</strong>: solitary, pair, or mob (3-6)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Kneecapper (ex): A nuglub has a +4 racial bonus on combat maneuver checks to trip an opponent.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Nuglub gremlins are deranged; they enjoy combat with a manic glee that other gremlins reserve for destroying devices or creating complex traps. Indeed, they spend long hours sharpening their claws, filing their teeth, and looking for the perfect ledge from which to leap into the fray. If combat doesn&#x27;t come to them, they seek it out, entering villages and killing innocents by night. Their idea of a good time is murder so silent that the victim never wakes up, so the family members find the remains the next morning and accuse one another of the atrocity.\n\nNuglubs jealously attack armored foes, as the gremlins&#x27; hunchbacked forms make it difficult to wear armor made for other humanoids. A group may use its heat metal and shocking grasp abilities to weaken an opponent before mobbing it and trying to knock the foe prone. As soon as an enemy falls to the ground, all nuglubs descend on that target in a frenzy of bloodlust, grappling and biting, holding on like perverse leeches until nothing remains.\n\nThough less technically inclined than some of their kin, nuglubs like using traps. Unlike most gremlins, who prefer to sabotage existing machines, nuglubs delight in the stealthy construction of traps in areas their victims consider familiar, rigging these painful and often deadly surprises on front doors, around the floor of beds, or near cribs in nurseries.\n\nNuglubs are the brutes of gremlin-kind. Groups of nuglubs remain small, as they tend to quarrel with each other and cannibalize those on the wrong side of an angry argument. Lone nuglubs often work with other gremlins, as they like proving they&#x27;re the strongest, and aren&#x27;t likely to kill and eat their smaller allies (though those slain by other enemies are fair game for a little snacking).\n\nNuglubs typically stand 2-1/2 feet tall and weigh approximately 25 pounds.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Nuglub CR 2\nSource Bestiary 2 pg. 143\nXP 600\nCE Small fey\nInit +4; Senses darkvision 120 ft., low-light vision; Perception +9\nDefense\nAC 18, touch 15, flat-footed 14 (+4 Dex, +3 natural, +1 size)\nhp 19 (3d6+9)\nFort +3, Ref +7, Will +2\nDR 5/cold iron; SR 13\nOffense\nSpeed 30 ft., climb 20 ft.\nMelee bite +3 (1d4+1 plus grab), 2 claws +4 (1d3+1 plus trip)\nSpell-Like Abilities (CL 3rd; concentration +4)\nAt will-prestidigitation\n1/hour-heat metal (DC 13), shocking grasp, snare\nStatistics\nStr 13, Dex 18, Con 15, Int 8, Wis 9, Cha 12\nBase Atk +1; CMB +1 (+5 grapple and trip); CMD 15\nFeats Step Up, ToughnessB, Weapon Focus (claw)\nSkills Acrobatics +10, Climb +9, Craft (traps) +9, Intimidate +8, Perception +9, Stealth +14; Racial Modifiers +4 Craft (traps), +4 Intimidate, +4 Perception\nLanguages Undercommon\nSQ kneecapper\nEcology\nEnvironment any underground or urban\nOrganization solitary, pair, or mob (3-6)\nTreasure standard\nSpecial Abilities\nKneecapper (Ex) A nuglub has a +4 racial bonus on combat maneuver checks to trip an opponent.\nDescription\nNuglub gremlins are deranged; they enjoy combat with a manic glee that other gremlins reserve for destroying devices or creating complex traps. Indeed, they spend long hours sharpening their claws, filing their teeth, and looking for the perfect ledge from which to leap into the fray. If combat doesn't come to them, they seek it out, entering villages and killing innocents by night. Their idea of a good time is murder so silent that the victim never wakes up, so the family members find the remains the next morning and accuse one another of the atrocity.\n\nNuglubs jealously attack armored foes, as the gremlins' hunchbacked forms make it difficult to wear armor made for other humanoids. A group may use its heat metal and shocking grasp abilities to weaken an opponent before mobbing it and trying to knock the foe prone. As soon as an enemy falls to the ground, all nuglubs descend on that target in a frenzy of bloodlust, grappling and biting, holding on like perverse leeches until nothing remains.\n\nThough less technically inclined than some of their kin, nuglubs like using traps. Unlike most gremlins, who prefer to sabotage existing machines, nuglubs delight in the stealthy construction of traps in areas their victims consider familiar, rigging these painful and often deadly surprises on front doors, around the floor of beds, or near cribs in nurseries.\n\nNuglubs are the brutes of gremlin-kind. Groups of nuglubs remain small, as they tend to quarrel with each other and cannibalize those on the wrong side of an angry argument. Lone nuglubs often work with other gremlins, as they like proving they're the strongest, and aren't likely to kill and eat their smaller allies (though those slain by other enemies are fair game for a little snacking).\n\nNuglubs typically stand 2-1/2 feet tall and weigh approximately 25 pounds.</pre>\n        </div>\n    "
