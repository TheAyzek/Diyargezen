  - _id: JHK2Rp4RxXFmGf6f
    _key: '!actors.items!TuYJILh48RimcJjf.JHK2Rp4RxXFmGf6f'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Change Shape
    system:
      abilityType: su
      description:
        value: >-
          As a full-round action, a raktavarna can take the shape of a handheld
          object, most often an ornamental light, a one-handed weapon, or a
          piece of treasure. If the rakshasa remains stationary in such a form,
          it can attempt Stealth checks even while being observed. It can remain
          motionless in object form indefinitely, but reverts to its true form
          as soon as it takes any action.
      subType: classFeat
    type: feat
  - _id: 2kQ6TDtr2OZ5vRpZ
    _key: '!actors.items!TuYJILh48RimcJjf.2kQ6TDtr2OZ5vRpZ'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Master's Eyes
    system:
      abilityType: su
      description:
        value: >-
          A raktavarna can designate a single creature as its master as a
          standard action. If the raktavarna is a spellcaster's familiar, its
          master is automatically that spellcaster, and the raktavarna cannot
          change this. As a full-round action, a raktavarna's master can observe
          the world as if looking through the raktavarna's eyes. The master must
          concentrate to maintain this link each round. The master's visual
          senses are suppressed for this time, and he uses the raktavarna's
          darkvision, detect magic, and regular eyesight to observe the world.
          This ability has no limit on range, and functions even across planar
          boundaries. If the raktavarna is slain while its master is using this
          ability, the master is stunned for 1d4 rounds (no save).
      subType: classFeat
    type: feat
  - _id: pbFlUUUmXHSQJEai
    _key: '!actors.items!TuYJILh48RimcJjf.pbFlUUUmXHSQJEai'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Poison
    system:
      abilityType: su
      description:
        value: >-
          Bite-injury; save Fort DC 13; frequency 1/round for 6 rounds; effect
          1d2 Wis plus modify memory; cure 1 save. Each time a victim takes
          Wisdom damage from this poison, a modify memory effect causes the
          victim to forget the previous minute's interactions with the
          raktavarna, as long as the raktavarna is no longer visible or is in
          object form. The save DC is Constitution-based.
      subType: classFeat
    type: feat
