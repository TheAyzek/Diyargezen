    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Raktavarna CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 3 pg. 229, Pathfinder #7: Edge of Anarchy pg. 86<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            LE \r\n            Tiny \r\n            Outsider (Native, Rakshasa, Shapechanger) <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> darkvision 60 ft., detect magic; Perception +9; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 14 (+3 Dex, +2 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 22 (3 HD; 3d10+6)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 6, <strong>Will</strong> 4\r\n            \r\n            <strong>DR</strong> 5/good or piercing\r\n            \r\n            \r\n            <strong>SR</strong> 17\r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> bite +8 (1d4-2 plus poison)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 7, <strong>Dex</strong> 16, <strong>Con</strong> 15, <strong>Int</strong> 12, <strong>Wis</strong> 13, <strong>Cha</strong> 14<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 12<br/>\r\n            <strong>Feats</strong> Alertness, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Bluff +12, Climb +14, Disguise +16, Escape Artist +6, Perception +9, Sense Motive +9, Stealth +17, Swim +11, Racial Modifiers +4 Bluff, +8 Disguise<br/>\r\n            <strong>Languages</strong> Common, Infernal, Undercommon, comprehend languages<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any<br/>\r\n                <strong>Organization</strong>: solitary, pair, or rack (3-10)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Change Shape (su): As a full-round action, a raktavarna can take the shape of a handheld object, most often an ornamental light, a one-handed weapon, or a piece of treasure. If the rakshasa remains stationary in such a form, it can attempt Stealth checks even while being observed. It can remain motionless in object form indefinitely, but reverts to its true form as soon as it takes any action.\n\nMaster&#x27;s Eyes (su): A raktavarna can designate a single creature as its master as a standard action. If the raktavarna is a spellcaster&#x27;s familiar, its master is automatically that spellcaster, and the raktavarna cannot change this. As a full-round action, a raktavarna&#x27;s master can observe the world as if looking through the raktavarna&#x27;s eyes. The master must concentrate to maintain this link each round. The master&#x27;s visual senses are suppressed for this time, and he uses the raktavarna&#x27;s darkvision, detect magic, and regular eyesight to observe the world. This ability has no limit on range, and functions even across planar boundaries. If the raktavarna is slain while its master is using this ability, the master is stunned for 1d4 rounds (no save).\n\nPoison (su): Bite-injury; save Fort DC 13; frequency 1/round for 6 rounds; effect 1d2 Wis plus modify memory; cure 1 save. Each time a victim takes Wisdom damage from this poison, a modify memory effect causes the victim to forget the previous minute&#x27;s interactions with the raktavarna, as long as the raktavarna is no longer visible or is in object form. The save DC is Constitution-based.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Made up of smoke, blood, and gold, raktavarnas are the least of the rakshasas-they are born not from humanoids, but from the souls of rakshasas who failed utterly in their previous incarnation and who are thus reborn from a serpent&#x27;s egg.\n\nThese terrors drift through society, passing from hand to hand as weapons or strange tokens from foreign lands, curiosities brought home by traders and emissaries and given to leaders as tribute. In this manner the raktavarnas gain entry into corridors of power throughout the world, and what they see, their foul masters know. A raktavarna&#x27;s servitude to a master ends only when its master decrees, or (more commonly) upon the master&#x27;s death. Little disconcerts raktavarnas more than having no master, and when they are cast adrift in this manner, they seek a replacement as soon as they can.\n\nA 7th-level lawful evil spellcaster with the Improved Familiar feat can gain a raktavarna rakshasa as a familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Raktavarna CR 2\nSource Bestiary 3 pg. 229, Pathfinder #7: Edge of Anarchy pg. 86\nXP 600\nLE Tiny outsider (native, rakshasa, shapechanger)\nInit +3; Senses darkvision 60 ft., detect magic; Perception +9\nDefense\nAC 17, touch 15, flat-footed 14 (+3 Dex, +2 natural, +2 size)\nhp 22 (3d10+6)\nFort +3, Ref +6, Will +4\nDR 5/good or piercing; SR 17\nOffense\nSpeed 20 ft., climb 20 ft., swim 20 ft.\nMelee bite +8 (1d4-2 plus poison)\nSpecial Attacks detect thoughts (DC 13)\nSpell-Like Abilities (CL 6th; concentration +8)\nConstant-comprehend languages\n1/day-charm person (DC 13), suggestion (DC 15)\n1/week-commune (CL 12th, 6 questions)\nStatistics\nStr 7, Dex 16, Con 15, Int 12, Wis 13, Cha 14\nBase Atk +3; CMB +4; CMD 12 (can't be tripped)\nFeats Alertness, Weapon Finesse\nSkills Bluff +12, Climb +14, Disguise +16, Escape Artist +6, Perception +9, Sense Motive +9, Stealth +17, Swim +11; Racial Modifiers +4 Bluff, +8 Disguise\nLanguages Common, Infernal, Undercommon; comprehend languages\nSQ change shape (Tiny living object), master's eyes\nEcology\nEnvironment any\nOrganization solitary, pair, or rack (3-10)\nTreasure standard\nSpecial Abilities\nChange Shape (Su) As a full-round action, a raktavarna can take the shape of a handheld object, most often an ornamental light, a one-handed weapon, or a piece of treasure. If the rakshasa remains stationary in such a form, it can attempt Stealth checks even while being observed. It can remain motionless in object form indefinitely, but reverts to its true form as soon as it takes any action.\n\nMaster's Eyes (Su) A raktavarna can designate a single creature as its master as a standard action. If the raktavarna is a spellcaster's familiar, its master is automatically that spellcaster, and the raktavarna cannot change this. As a full-round action, a raktavarna's master can observe the world as if looking through the raktavarna's eyes. The master must concentrate to maintain this link each round. The master's visual senses are suppressed for this time, and he uses the raktavarna's darkvision, detect magic, and regular eyesight to observe the world. This ability has no limit on range, and functions even across planar boundaries. If the raktavarna is slain while its master is using this ability, the master is stunned for 1d4 rounds (no save).\n\nPoison (Su) Bite-injury; save Fort DC 13; frequency 1/round for 6 rounds; effect 1d2 Wis plus modify memory; cure 1 save. Each time a victim takes Wisdom damage from this poison, a modify memory effect causes the victim to forget the previous minute's interactions with the raktavarna, as long as the raktavarna is no longer visible or is in object form. The save DC is Constitution-based.\nDescription\nMade up of smoke, blood, and gold, raktavarnas are the least of the rakshasas-they are born not from humanoids, but from the souls of rakshasas who failed utterly in their previous incarnation and who are thus reborn from a serpent's egg.\n\nThese terrors drift through society, passing from hand to hand as weapons or strange tokens from foreign lands, curiosities brought home by traders and emissaries and given to leaders as tribute. In this manner the raktavarnas gain entry into corridors of power throughout the world, and what they see, their foul masters know. A raktavarna's servitude to a master ends only when its master decrees, or (more commonly) upon the master's death. Little disconcerts raktavarnas more than having no master, and when they are cast adrift in this manner, they seek a replacement as soon as they can.\n\nA 7th-level lawful evil spellcaster with the Improved Familiar feat can gain a raktavarna rakshasa as a familiar.</pre>\n        </div>\n    "
