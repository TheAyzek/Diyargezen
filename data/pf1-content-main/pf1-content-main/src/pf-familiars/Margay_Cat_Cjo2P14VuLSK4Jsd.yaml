    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Margay Cat CR 1/4 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 193<br/>\r\n            <strong>XP 100</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> low-light vision, scent; Perception +0; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 12 (+2 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 4 (1 HD; 1d8)<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 4, <strong>Will</strong> 0\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> bite -1 (1d3-3), 2 claws -1 (1d2-3)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 4, <strong>Dex</strong> 14, <strong>Con</strong> 10, <strong>Int</strong> 2, <strong>Wis</strong> 11, <strong>Cha</strong> 9<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +0; <strong>CMD</strong> 7<br/>\r\n            <strong>Feats</strong> Skill Focus (Climb)<br/>\r\n            <strong>Skills</strong> Bluff +0 (+4 when mimicking animal sounds), Climb +8, Stealth +14, Racial Modifiers +4 Bluff to mimic animal sounds<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm forests<br/>\r\n                <strong>Organization</strong>: solitary or pair<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">The margay is a small cat that lives in dense tropical forests, preferring to spend most of its life in the trees. During the day, a margay lounges in liana tangles far above the ground, and at night it chases birds, frogs, lizards, and monkeys through the treetops. A margay can use its sound mimicry ability to imitate the sounds of any animal of its own size or one size category smaller, and it often does so to lure prey into an ambush.\n\nA margay weighs around 8 pounds and may reach a length of 3-4 feet, nearly half of which is its tail.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Margay Cat CR 1/4\nSource Ultimate Wilderness pg. 193\nXP 100\nN Tiny animal\nInit +2; Senses low-light vision, scent; Perception +0\nDefense\nAC 14, touch 14, flat-footed 12 (+2 Dex, +2 size)\nhp 4 (1d8)\nFort +2, Ref +4, Will +0\nOffense\nSpeed 20 ft., climb 20 ft.\nMelee bite -1 (1d3-3), 2 claws -1 (1d2-3)\nSpace 2-1/2 ft., Reach 0 ft.\nStatistics\nStr 4, Dex 14, Con 10, Int 2, Wis 11, Cha 9\nBase Atk +0; CMB +0; CMD 7 (11 vs. trip)\nFeats Skill Focus (Climb)\nSkills Bluff +0 (+4 when mimicking animal sounds), Climb +8, Stealth +14; Racial Modifiers +4 Bluff to mimic animal sounds\nSQ sound mimicry (animals)\nEcology\nEnvironment warm forests\nOrganization solitary or pair\nTreasure none\nDescription\nThe margay is a small cat that lives in dense tropical forests, preferring to spend most of its life in the trees. During the day, a margay lounges in liana tangles far above the ground, and at night it chases birds, frogs, lizards, and monkeys through the treetops. A margay can use its sound mimicry ability to imitate the sounds of any animal of its own size or one size category smaller, and it often does so to lure prey into an ambush.\n\nA margay weighs around 8 pounds and may reach a length of 3-4 feet, nearly half of which is its tail.</pre>\n        </div>\n    "
