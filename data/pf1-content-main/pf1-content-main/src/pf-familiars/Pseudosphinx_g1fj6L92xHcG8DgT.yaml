  details:
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Pseudosphinx CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Familiar Folio pg. 29<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +11; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 13 (+2 Dex, +1 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 16 (3 HD; 3d10)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 5, <strong>Will</strong> 6\r\n            \r\n            <strong>DR</strong> 5/magic\r\n            \r\n            \r\n            <strong>SR</strong> 13\r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft. (average)<br/>\r\n                <strong>Melee</strong> bite +2 (1d3-3), 2 claws +2 (1d2-3)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 5, <strong>Dex</strong> 14, <strong>Con</strong> 11, <strong>Int</strong> 9, <strong>Wis</strong> 16, <strong>Cha</strong> 12<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +3; <strong>CMD</strong> 10<br/>\r\n            <strong>Feats</strong> Alertness, Iron Will<br/>\r\n            <strong>Skills</strong> Fly +6, Perception +11, Sense Motive +5<br/>\r\n            <strong>Languages</strong> Common, Sphinx<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm deserts<br/>\r\n                <strong>Organization</strong>: solitary<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Aided Insight (su): Once per day, a pseudosphinx can tap into the wisdom of its ancestors to answer a question for another creature. To do so, the pseudosphinx attempts a Wisdom check, gaining a bonus on the check equal to the querent&#x27;s level and treating the result of the check as the result of an appropriate Knowledge check. The pseudosphinx must be touching the querent to use this ability.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Pseudosphinxes are cat-sized, fairylike creatures thought to be distant cousins to the larger and better-known true sphinxes. They most resemble gynosphinxes, though the pseudosphinxes&#x27; monkeylike heads and tiny bodies ensure that the two species are never confused for each other. A typical pseudosphinx is 2 feet long and weighs 10 pounds.\n\nPseudosphinxes are rarely found in groups, and scholars are unsure whether to attribute their cryptic origins to elusive demeanors or amnesic memories. Whether they&#x27;re the misbegotten progeny of generations of lesser sphinxes or the result of some magical experiment in the same deserts where sphinxes are found, none can say.\n\nA pseudosphinx can serve as the familiar for a 7th-level spellcaster with the Improved Familiar feat.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Pseudosphinx CR 2\nSource Familiar Folio pg. 29\nXP 600\nN Tiny magical beast\nInit +2; Senses darkvision 60 ft., low-light vision; Perception +11\nDefense\nAC 15, touch 14, flat-footed 13 (+2 Dex, +1 natural, +2 size)\nhp 16 (3d10)\nFort +3, Ref +5, Will +6\nDR 5/magic; SR 13\nOffense\nSpeed 20 ft., fly 30 ft. (average)\nMelee bite +2 (1d3-3), 2 claws +2 (1d2-3)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks aided insight\nSpell-Like Abilities (CL 5th; concentration +6)\nConstant-comprehend languages\nAt will-detect magic, detect secret doors\n3/day-burning hands, cause fear, identify, vanish\nStatistics\nStr 5, Dex 14, Con 11, Int 9, Wis 16, Cha 12\nBase Atk +3; CMB +3; CMD 10\nFeats Alertness, Iron Will\nSkills Fly +6, Perception +11, Sense Motive +5\nLanguages Common, Sphinx\nEcology\nEnvironment warm deserts\nOrganization solitary\nTreasure standard\nSpecial Abilities\nAided Insight (Su) Once per day, a pseudosphinx can tap into the wisdom of its ancestors to answer a question for another creature. To do so, the pseudosphinx attempts a Wisdom check, gaining a bonus on the check equal to the querent's level and treating the result of the check as the result of an appropriate Knowledge check. The pseudosphinx must be touching the querent to use this ability.\nDescription\nPseudosphinxes are cat-sized, fairylike creatures thought to be distant cousins to the larger and better-known true sphinxes. They most resemble gynosphinxes, though the pseudosphinxes' monkeylike heads and tiny bodies ensure that the two species are never confused for each other. A typical pseudosphinx is 2 feet long and weighs 10 pounds.\n\nPseudosphinxes are rarely found in groups, and scholars are unsure whether to attribute their cryptic origins to elusive demeanors or amnesic memories. Whether they're the misbegotten progeny of generations of lesser sphinxes or the result of some magical experiment in the same deserts where sphinxes are found, none can say.\n\nA pseudosphinx can serve as the familiar for a 7th-level spellcaster with the Improved Familiar feat.</pre>\n        </div>\n    "
