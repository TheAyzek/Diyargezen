  details:
    alignment: cn
    cr:
      base: 3
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Tidepool Dragon CR 3 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder #55: The Wormwood Mutiny pg. 82<br/>\r\n            <strong>XP 800</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CN \r\n            Tiny \r\n            Dragon (Aquatic) <br/>\r\n            <strong>Init</strong> 5;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +9; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 14 (+1 Dex, +2 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 30 (4 HD; 4d12+4)<br/>\r\n            <strong>Fort</strong> 5, <strong>Ref</strong> 7, <strong>Will</strong> 6\r\n            \r\n            \r\n            <strong>Immune</strong> paralysis, sleep; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft. (average)<br/>\r\n                <strong>Melee</strong> bite +6 (1d3), 2 claws +6 (1d3 plus attach)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 11, <strong>Dex</strong> 13, <strong>Con</strong> 13, <strong>Int</strong> 8, <strong>Wis</strong> 14, <strong>Cha</strong> 14<br/>\r\n            <strong>Base Atk</strong> +4; <strong>CMB</strong> +3; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Improved Initiative, Lightning Reflexes<br/>\r\n            <strong>Skills</strong> Fly +12, Knowledge (nature) +6, Perception +9, Survival +9, Swim +15<br/>\r\n            <strong>Languages</strong> Common, Draconic<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: warm coastlines<br/>\r\n                <strong>Organization</strong>: solitary, pair, or clutch (3-6)<br/>\r\n                \r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Attach (ex): When a tidepool dragon hits with a claw attack, it automatically grapples its foe, dealing automatic damage with that claw each round.\n\nBreath Weapon (su): When a tidepool dragon uses its breath weapon underwater, it creates a 10-foot cone of superheated water rather than a line of fire (as noted above). This effect deals the breath weapon&#x27;s damage to any creatures in the cone&#x27;s area, though victims can still save to take only half damage.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Aquatic dragons similar in size and fickleness to faerie dragons and pseudodragons, tidepool dragons rule as whimsical tyrants over miniature realms comprising coral forests, sand dune mountains, and low-tide menageries. Preferring to inhabit coastal regions throughout the world&#x27;s warmer climes, these dragon-kin make their lairs amid balmy lagoons and hidden coves, favoring any seaside setting devoid of stronger predators. A combination of chitinous shell-similar in shade to that of a blue crab-and scales the color of clear tropical waters covers every tidepool dragon, the shade deepening through twilight hues to a shade as dark as a ocean abyss.\n\nTidepool dragons typically measure about 2 feet long and weigh approximately 14 pounds. They are known to live for about 300 years. \n\nTidepool Dragons as Familiars\nAlthough difficult to approach, tidepool dragons sometimes choose to serve as the familiars of unruly spellcasters and those who go out of their way to feed them rich or exotic foods. Spellcasters of 7th level or higher with an alignment within one step of chaotic neutral can gain a tidepool dragon as a familiar by taking the Improved Familiar feat.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Tidepool Dragon CR 3\nSource Pathfinder #55: The Wormwood Mutiny pg. 82\nXP 800\nCN Tiny dragon (aquatic)\nInit +5; Senses darkvision 60 ft., low-light vision; Perception +9\nDefense\nAC 15, touch 13, flat-footed 14 (+1 Dex, +2 natural, +2 size)\nhp 30 (4d12+4)\nFort +5, Ref +7, Will +6\nImmune paralysis, sleep\nOffense\nSpeed 10 ft., fly 30 ft. (average), swim 60 ft.\nMelee bite +6 (1d3), 2 claws +6 (1d3 plus attach)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks breath weapon (5-ft. line, 2d6 fire damage, Reflex DC 13 for half, usable every 1d4 rounds)\nSpell-Like Abilities (CL 4th; concentration +6)\n3/day-freedom of movement (self only)\nSpells Known (caster level 4th; concentration +6)\n2nd (4/day)-slipstream\n1st (7/day)-hydraulic push, obscuring mist\n0 (at will)-acid splash, dancing lights, daze (DC 12), detect poison, mage hand, touch of fatigue (DC 12)\nStatistics\nStr 11, Dex 13, Con 13, Int 8, Wis 14, Cha 14\nBase Atk +4; CMB +3; CMD 13\nFeats Improved Initiative, Lightning Reflexes\nSkills Fly +12, Knowledge (nature) +6, Perception +9, Survival +9, Swim +15\nLanguages Common, Draconic\nSQ amphibious\nEcology\nEnvironment warm coastlines\nOrganization solitary, pair, or clutch (3-6)\nSpecial Abilities\nAttach (Ex) When a tidepool dragon hits with a claw attack, it automatically grapples its foe, dealing automatic damage with that claw each round.\n\nBreath Weapon (Su) When a tidepool dragon uses its breath weapon underwater, it creates a 10-foot cone of superheated water rather than a line of fire (as noted above). This effect deals the breath weapon's damage to any creatures in the cone's area, though victims can still save to take only half damage.\nDescription\nAquatic dragons similar in size and fickleness to faerie dragons and pseudodragons, tidepool dragons rule as whimsical tyrants over miniature realms comprising coral forests, sand dune mountains, and low-tide menageries. Preferring to inhabit coastal regions throughout the world's warmer climes, these dragon-kin make their lairs amid balmy lagoons and hidden coves, favoring any seaside setting devoid of stronger predators. A combination of chitinous shell-similar in shade to that of a blue crab-and scales the color of clear tropical waters covers every tidepool dragon, the shade deepening through twilight hues to a shade as dark as a ocean abyss.\n\nTidepool dragons typically measure about 2 feet long and weigh approximately 14 pounds. They are known to live for about 300 years. \n\nTidepool Dragons as Familiars\nAlthough difficult to approach, tidepool dragons sometimes choose to serve as the familiars of unruly spellcasters and those who go out of their way to feed them rich or exotic foods. Spellcasters of 7th level or higher with an alignment within one step of chaotic neutral can gain a tidepool dragon as a familiar by taking the Improved Familiar feat.</pre>\n        </div>\n    "
