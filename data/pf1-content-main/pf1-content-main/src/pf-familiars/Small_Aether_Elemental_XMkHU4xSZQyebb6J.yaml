  details:
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Small Aether Elemental CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 5 pg. 106<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Small \r\n            Outsider (Aether, Elemental, Extraplanar) <br/>\r\n            <strong>Init</strong> 6;\r\n            <strong>Senses</strong> blindsense 60 ft., darkvision 60 ft.; Perception +5; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 14, <strong>Flat-Footed</strong> 12 (+1 deflection, +2 Dex, +1 size)<br/>\r\n            <strong>Hit Points</strong> 13 (2 HD; 2d10+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 5, <strong>Will</strong> 0\r\n            <br/><strong>Defensive Abilities</strong> telekinetic deflection; \r\n            \r\n            <strong>Immune</strong> elemental traits, force; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (good)<br/>\r\n                <strong>Melee</strong> slam +4 (1d4+1)<br/>\r\n                <strong>Ranged</strong> telekinetic throw +5 (1d8+2)<br/>\r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 12, <strong>Dex</strong> 15, <strong>Con</strong> 12, <strong>Int</strong> 4, <strong>Wis</strong> 11, <strong>Cha</strong> 11<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +2; <strong>CMD</strong> 15<br/>\r\n            <strong>Feats</strong> Improved InitiativeB, Point-Blank Shot<br/>\r\n            <strong>Skills</strong> Acrobatics +6, Fly +12, Perception +5, Stealth +11<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Ethereal Plane)<br/>\r\n                <strong>Organization</strong>: solitary, pair, or gang (3-8)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Aether elementals are made of living aether, the rare fifth element that arises on the Ethereal Plane near the borders of the Elemental Planes.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Small Aether Elemental CR 1\nSource Bestiary 5 pg. 106\nXP 400\nN Small outsider (aether, elemental, extraplanar)\nInit +6; Senses blindsense 60 ft., darkvision 60 ft.; Perception +5\nDefense\nAC 14, touch 14, flat-footed 12 (+1 deflection, +2 Dex, +1 size)\nhp 13 (2d10+2)\nFort +4, Ref +5, Will +0\nDefensive Abilities telekinetic deflection; Immune elemental traits, force\nOffense\nSpeed fly 60 ft. (good)\nMelee slam +4 (1d4+1)\nRanged telekinetic throw +5 (1d8+2)\nSpecial Attacks telekinetic maneuver, telekinetic throw (DC 12)\nStatistics\nStr 12, Dex 15, Con 12, Int 4, Wis 11, Cha 11\nBase Atk +2; CMB +2; CMD 15\nFeats Improved InitiativeB, Point-Blank Shot\nSkills Acrobatics +6, Fly +12, Perception +5, Stealth +11\nSQ telekinetic invisibility\nEcology\nEnvironment any (Ethereal Plane)\nOrganization solitary, pair, or gang (3–8)\nTreasure none\nDescription\nAether elementals are made of living aether, the rare fifth element that arises on the Ethereal Plane near the borders of the Elemental Planes.</pre>\n        </div>\n    "
