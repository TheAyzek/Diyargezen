  details:
    cr:
      base: 0.25
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Lich Newt CR 1/4 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Pathfinder #115: Trail of the Hunted pg. 82<br/>\r\n            <strong>XP 100</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Animal (Aquatic) <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> low-light vision; Perception +4; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 13, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 12 (+1 Dex, +2 size)<br/>\r\n            <strong>Hit Points</strong> 5 (1 HD; 1d8+1)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 3, <strong>Will</strong> 1;  +2 vs. disease and poison\r\n            <br/><strong>Defensive Abilities</strong> paralyzing mucus; \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> slam -2 (1d2-4 plus poison)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 2, <strong>Dex</strong> 12, <strong>Con</strong> 13, <strong>Int</strong> 1, <strong>Wis</strong> 12, <strong>Cha</strong> 5<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-1; <strong>CMD</strong> 5<br/>\r\n            <strong>Feats</strong> Skill Focus (Perception)<br/>\r\n            <strong>Skills</strong> Perception +4, Stealth +13, Swim +9<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate marshes or plains<br/>\r\n                <strong>Organization</strong>: solitary, pair, or ning (3-12)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Paralyzing Mucus (ex): A lich newt secretes poison from its skin, and any creature that successfully hits it with a natural weapon or unarmed strike must immediately attempt a save against its poison.\n\nPoison (ex): Slam-injury or contact; save Fort DC 11; frequency 1/round for 2 rounds; effect 1d2 Str damage; cure 1 save.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Named for their distinctive black-and-white coloration and their opportunistic scavenging, these large amphibians live all along the polluted Inkwater River. A lich newt&#x27;s defenses include bony ridges growing along either side of their footlong bodies and a poisonous mucus that causes numbness and muscle spasms. Some humanoid tribes, especially the orcs of the Northern Fangwood Forest, trap these amphibians and refine their poison into weapon blanches and drugs. The desperate even eat lich newts; their poison breaks down if their meat is cooked in vinegar as part of a tough, gamy, but relatively sustaining stew.\n\nAfter battles waged by warring armies or mercenary bands, lich newts often swarm the rotting corpses, feasting on the softening flesh and hunting the various insects attracted by the carrion. As a result, many Nirmathi believe the newts to be bad omens, a legacy of Tar-Baphon, or otherwise associated with necromancy. Lich newt familiars are popular with wizards and witches who care more about the creatures&#x27; reputation than their true nature as bottom-feeders and scavengers. An Arcana caster who selects a lich newt as his familiar gains a +2 bonus on Fortitude saves against disease and poison.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Lich Newt CR 1/4\nSource Pathfinder #115: Trail of the Hunted pg. 82\nXP 100\nN Tiny animal (aquatic)\nInit +1; Senses low-light vision; Perception +4\nDefense\nAC 13, touch 13, flat-footed 12 (+1 Dex, +2 size)\nhp 5 (1d8+1)\nFort +3, Ref +3, Will +1; +2 vs. disease and poison\nDefensive Abilities paralyzing mucus\nOffense\nSpeed 15 ft., swim 20 ft.\nMelee slam -2 (1d2-4 plus poison)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks poison\nStatistics\nStr 2, Dex 12, Con 13, Int 1, Wis 12, Cha 5\nBase Atk +0; CMB -1; CMD 5 (9 vs. trip)\nFeats Skill Focus (Perception)\nSkills Perception +4, Stealth +13, Swim +9\nSQ amphibious\nEcology\nEnvironment temperate marshes or plains\nOrganization solitary, pair, or ning (3-12)\nTreasure none\nSpecial Abilities\nParalyzing Mucus (Ex) A lich newt secretes poison from its skin, and any creature that successfully hits it with a natural weapon or unarmed strike must immediately attempt a save against its poison.\n\nPoison (Ex) Slam-injury or contact; save Fort DC 11; frequency 1/round for 2 rounds; effect 1d2 Str damage; cure 1 save.\nDescription\nNamed for their distinctive black-and-white coloration and their opportunistic scavenging, these large amphibians live all along the polluted Inkwater River. A lich newt's defenses include bony ridges growing along either side of their footlong bodies and a poisonous mucus that causes numbness and muscle spasms. Some humanoid tribes, especially the orcs of the Northern Fangwood Forest, trap these amphibians and refine their poison into weapon blanches and drugs. The desperate even eat lich newts; their poison breaks down if their meat is cooked in vinegar as part of a tough, gamy, but relatively sustaining stew.\n\nAfter battles waged by warring armies or mercenary bands, lich newts often swarm the rotting corpses, feasting on the softening flesh and hunting the various insects attracted by the carrion. As a result, many Nirmathi believe the newts to be bad omens, a legacy of Tar-Baphon, or otherwise associated with necromancy. Lich newt familiars are popular with wizards and witches who care more about the creatures' reputation than their true nature as bottom-feeders and scavengers. An arcane caster who selects a lich newt as his familiar gains a +2 bonus on Fortitude saves against disease and poison.</pre>\n        </div>\n    "
