      description:
        value: >-
          <p>A fey is a creature with supernatural abilities and connections to
          nature or to some other force or place. Fey are usually
          human-shaped.</p><h2>Features</h2><p>A fey has the following
          features.</p><ul><li>d6 Hit Die.</li><li>Base attack bonus equal to
          1/2 total Hit Dice (slow progression).</li><li>Good&nbsp;<a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Reflex">Reflex</a>&nbsp;and&nbsp;<a
          href="https://www.d20pfsrd.com/gamemastering/combat#TOC-Will">Will</a>&nbsp;Saves.</li><li>Skill
          points equal to 6 + Int modifier (minimum 1) per Hit Die. The
          following are class skills for fey: <a
          href="https://www.d20pfsrd.com/skills/acrobatics">Acrobatics</a>, <a
          href="https://www.d20pfsrd.com/skills/bluff">Bluff</a>, <a
          href="https://www.d20pfsrd.com/skills/climb">Climb</a>, <a
          href="https://www.d20pfsrd.com/skills/craft">Craft</a>, <a
          href="https://www.d20pfsrd.com/skills/diplomacy">Diplomacy</a>, <a
          href="https://www.d20pfsrd.com/skills/disguise">Disguise</a>, <a
          href="https://www.d20pfsrd.com/skills/escape-artist">Escape
          Artist</a>, <a href="https://www.d20pfsrd.com/skills/fly">Fly</a>, <a
          href="https://www.d20pfsrd.com/skills/knowledge">Knowledge</a>&nbsp;(geography),
          <a
          href="https://www.d20pfsrd.com/skills/knowledge">Knowledge</a>&nbsp;(local),
          <a
          href="https://www.d20pfsrd.com/skills/knowledge">Knowledge</a>&nbsp;(nature),
          <a href="https://www.d20pfsrd.com/skills/perception">Perception</a>,
          <a href="https://www.d20pfsrd.com/skills/perform">Perform</a>, <a
          href="https://www.d20pfsrd.com/skills/sense-motive">Sense Motive</a>,
          <a href="https://www.d20pfsrd.com/skills/sleight-of-hand">Sleight of
          Hand</a>, <a
          href="https://www.d20pfsrd.com/skills/stealth">Stealth</a>, <a
          href="https://www.d20pfsrd.com/skills/swim">Swim</a>, <a
          href="https://www.d20pfsrd.com/skills/use-magic-device">Use Magic
          Device</a>.</li></ul><h2>Traits</h2><p>A fey possesses the following
          traits (unless otherwise noted in a creature’s entry).</p><ul><li><a
          href="https://www.d20pfsrd.com/gamemastering/special-abilities#TOC-Low-Light-Vision">Low-light
          vision</a>.</li><li>Proficient with all simple weapons and any weapons
          mentioned in its entry.</li><li>Proficient with whatever type of armor
          (light, medium, or heavy) it is described as wearing, as well as all
          lighter types. Fey not indicated as wearing armor are not proficient
          with armor. Fey are proficient with shields if they are proficient
          with any form of armor.</li><li>Fey breathe, eat, and sleep.</li></ul>
      hd: 6
      hp: 17
