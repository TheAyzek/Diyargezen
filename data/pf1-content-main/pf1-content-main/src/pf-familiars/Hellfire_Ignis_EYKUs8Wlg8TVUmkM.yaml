    system:
      abilityType: ex
      description:
        value: >-
          A hellfire ignis is the product of infernal energies coalescing with
          the First World's influence and thus gives off a faint, constant odor
          of brimstone. A hellfire ignis can suppress this odor as a swift
          action for up to 1 minute. Otherwise, the odor imposes a -2 penalty on
          Stealth checks the ignis attempts in areas devoid of brimstone.
