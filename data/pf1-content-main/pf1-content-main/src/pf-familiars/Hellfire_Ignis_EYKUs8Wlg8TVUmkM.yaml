    name: Combat Reflexes
    system:
      description:
        value: |2-

                          <em>You can make additional attacks of opportunity.</em></p><p>
                          <p><strong>Benefits</strong></p><p>You may make a number of additional attacks of opportunity per round equal to your Dexterity bonus. With this feat, you may also make attacks of opportunity while flat-footed.</p>
                      <br /><p><strong>Normal</strong></p><p>A character without this feat can make only one attack of opportunity per round and can't make attacks of opportunity while flat-footed.</p>
                      <br /><p><strong>Special</strong></p><p>The Combat Reflexes feat does not allow a rogue to use her opportunist ability more than once per round.</p>
