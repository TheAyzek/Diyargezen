  details:
    alignment: ne
    cr:
      base: 3
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Hellfire Ignis CR 3 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Cheliax, the Infernal Empire pg. 62<br/>\r\n            <strong>XP 800</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            NE \r\n            Small \r\n            Fey (Fire) <br/>\r\n            <strong>Init</strong> 5;\r\n            <strong>Senses</strong> low-light vision; Perception +8; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 16, <strong>Flat-Footed</strong> 11 (+5 Dex, +1 size)<br/>\r\n            <strong>Hit Points</strong> 27 (5 HD; 5d6+10)<br/>\r\n            <strong>Fort</strong> 3, <strong>Ref</strong> 9, <strong>Will</strong> 4\r\n            \r\n            <strong>DR</strong> 5/cold iron\r\n            <strong>Immune</strong> fire; \r\n            \r\n            \r\n            \r\n            <br/><strong>Weaknesses</strong> \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 30 ft.<br/>\r\n                <strong>Melee</strong> bite +8 (1d4+2), 2 claws +8 (1d3+2 plus burn)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 14, <strong>Dex</strong> 20, <strong>Con</strong> 15, <strong>Int</strong> 8, <strong>Wis</strong> 11, <strong>Cha</strong> 11<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +3; <strong>CMD</strong> 18<br/>\r\n            <strong>Feats</strong> Combat Reflexes, Step Up, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Acrobatics +13, Escape Artist +10, Intimidate +5, Perception +8, Stealth +17, Survival +3<br/>\r\n            <strong>Languages</strong> Common, Sylvan<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any forests or plains<br/>\r\n                <strong>Organization</strong>: solitary, gang (2-5), or crew (4-8 plus 1 advanced leader)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Brimstone Essence (ex): A hellfire ignis is the product of infernal energies coalescing with the First World&#x27;s influence and thus gives off a faint, constant odor of brimstone. A hellfire ignis can suppress this odor as a swift action for up to 1 minute. Otherwise, the odor imposes a -2 penalty on Stealth checks the ignis attempts in areas devoid of brimstone.\n\nMolten Flesh (ex): Three times per day as a standard action, a hellfire ignis can tear off a chunk of its molten flesh and hurl it as a ranged attack at an opponent within 20 feet. This attack deals 1d3 points of bludgeoning damage plus the effects of the hellfire ignis&#x27;s burn special attack.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Hellfire ignises roam the rural areas of Cheliax, committing acts of arson and leaving brush, forest, and structures ablaze in their wake. Cruel and sadistic pyromaniacs, hellfire ignises are corrupted versions of fey that once represented both the destructive and rejuvenating properties of fire within nature. Unlike their untainted kin, hellfire ignises see fire as merely a tool for destruction and revel in the raw power of its hungering flames.\n\nUnlike many fey creatures, hellfire ignises are surprisingly attracted to urban areas. The prevalence of wooden tenements, dense populations, and unpatrolled sewers through which they can travel unseen make towns tempting targets for the inveterate arsonists. There is a bounty on the heads of hellfire ignises in many cities and towns in Cheliax, with rewards reaching as much as 400 gp per specimen in some areas. Greedy hunters from Egorian and other cities have been known to travel far into the heart of the Barrowood and Whisperwood, hoping to carry a large collection of ignis heads back for a larger bounty in town.\n\nDespite their name and infernal origins, hellfire ignises have no allegiances to Hell or those who serve it. That said, many experienced pyromancersfind that the corrupted fey make excellent familiars. They tend to be more versatile than fire elementals and less sinister than imps, filling a specific niche between the two more commonly seen familiars. A spellcaster who takes a hellfire ignis as a familiar must be ever watchful that it keeps its arsonist spirit in check, however, as the mischievous fey have been known to set fire to their masters&#x27; workshops, libraries, and homes not out of spite or malice, but because they often contain so many combustible tools and decorations. A 7th-level spellcaster can gain a hellfire ignis as a familiar if she has the Improved Familiar feat.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Hellfire Ignis CR 3\nSource Cheliax, the Infernal Empire pg. 62\nXP 800\nNE Small fey (fire)\nInit +5; Senses low-light vision; Perception +8\nDefense\nAC 16, touch 16, flat-footed 11 (+5 Dex, +1 size)\nhp 27 (5d6+10)\nFort +3, Ref +9, Will +4\nDR 5/cold iron; Immune fire\nWeaknesses vulnerable to cold\nOffense\nSpeed 30 ft.\nMelee bite +8 (1d4+2), 2 claws +8 (1d3+2 plus burn)\nSpecial Attacks burn (1d3, DC 14), molten flesh\nSpell-Like Abilities (CL 3rd; concentration +3)\nAt will-flare (DC 10), sparkAPG (DC 10)\n3/day-pyrotechnics (DC 12)\nStatistics\nStr 14, Dex 20, Con 15, Int 8, Wis 11, Cha 11\nBase Atk +2; CMB +3; CMD 18\nFeats Combat Reflexes, Step Up, Weapon Finesse\nSkills Acrobatics +13, Escape Artist +10, Intimidate +5, Perception +8, Stealth +17, Survival +3\nLanguages Common, Sylvan\nSQ brimstone essence\nEcology\nEnvironment any forests or plains\nOrganization solitary, gang (2-5), or crew (4-8 plus 1 advanced leader)\nTreasure standard\nSpecial Abilities\nBrimstone Essence (Ex) A hellfire ignis is the product of infernal energies coalescing with the First World's influence and thus gives off a faint, constant odor of brimstone. A hellfire ignis can suppress this odor as a swift action for up to 1 minute. Otherwise, the odor imposes a -2 penalty on Stealth checks the ignis attempts in areas devoid of brimstone.\n\nMolten Flesh (Ex) Three times per day as a standard action, a hellfire ignis can tear off a chunk of its molten flesh and hurl it as a ranged attack at an opponent within 20 feet. This attack deals 1d3 points of bludgeoning damage plus the effects of the hellfire ignis's burn special attack.\nDescription\nHellfire ignises roam the rural areas of Cheliax, committing acts of arson and leaving brush, forest, and structures ablaze in their wake. Cruel and sadistic pyromaniacs, hellfire ignises are corrupted versions of fey that once represented both the destructive and rejuvenating properties of fire within nature. Unlike their untainted kin, hellfire ignises see fire as merely a tool for destruction and revel in the raw power of its hungering flames.\n\nUnlike many fey creatures, hellfire ignises are surprisingly attracted to urban areas. The prevalence of wooden tenements, dense populations, and unpatrolled sewers through which they can travel unseen make towns tempting targets for the inveterate arsonists. There is a bounty on the heads of hellfire ignises in many cities and towns in Cheliax, with rewards reaching as much as 400 gp per specimen in some areas. Greedy hunters from Egorian and other cities have been known to travel far into the heart of the Barrowood and Whisperwood, hoping to carry a large collection of ignis heads back for a larger bounty in town.\n\nDespite their name and infernal origins, hellfire ignises have no allegiances to Hell or those who serve it. That said, many experienced pyromancersfind that the corrupted fey make excellent familiars. They tend to be more versatile than fire elementals and less sinister than imps, filling a specific niche between the two more commonly seen familiars. A spellcaster who takes a hellfire ignis as a familiar must be ever watchful that it keeps its arsonist spirit in check, however, as the mischievous fey have been known to set fire to their masters' workshops, libraries, and homes not out of spite or malice, but because they often contain so many combustible tools and decorations. A 7th-level spellcaster can gain a hellfire ignis as a familiar if she has the Improved Familiar feat.</pre>\n        </div>\n    "
