  details:
    alignment: ng
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Cassisian, Angel CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 2 pg. 26<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            NG \r\n            Small \r\n            Outsider (Angel, Extraplanar, Good) <br/>\r\n            <strong>Init</strong> 0;\r\n            <strong>Senses</strong> darkvision 60 ft., detect evil, low-light vision; Perception +5; \r\n            <strong>Aura</strong>  lesser protective aura\r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 11, <strong>Flat-Footed</strong> 14 (+3 natural, +1 size)<br/>\r\n            <strong>Hit Points</strong> 13 (2 HD; 2d10+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 3, <strong>Will</strong> 2;  +4 vs. poison\r\n            \r\n            <strong>DR</strong> 5/cold iron or evil\r\n            <strong>Immune</strong> acid, cold, petrification; \r\n            <strong>Resist</strong> electricity 10, fire 10; \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (perfect)<br/>\r\n                <strong>Melee</strong> slam -1 (1d3-4)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 3, <strong>Dex</strong> 11, <strong>Con</strong> 12, <strong>Int</strong> 6, <strong>Wis</strong> 11, <strong>Cha</strong> 10<br/>\r\n            <strong>Base Atk</strong> +2; <strong>CMB</strong> +-3; <strong>CMD</strong> 7<br/>\r\n            <strong>Feats</strong> Iron Will<br/>\r\n            <strong>Skills</strong> Diplomacy +2, Fly +10, Knowledge (planes) +2, Knowledge (religion) +2, Perception +5, Sense Motive +4, Stealth +8<br/>\r\n            <strong>Languages</strong> Celestial, Draconic, Infernal, truespeech<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any good-aligned plane<br/>\r\n                <strong>Organization</strong>: solitary, pair, or squad (3-6)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Perfect Memory (ex): Though they are not particularly intelligent, cassisians have perfect memories and remember everything they see or hear. They can faultlessly recite conversations they heard hundreds of years before. They also have the power to erase portions of their own memories, which they do (usually under orders from superior angels) to protect sensitive information.\n\nLesser Protective Aura (su): A cassisian has a lesser form of the protective aura possessed by more powerful angels. This protective aura grants the cassisian a +2 deflection bonus to its AC against evil foes, and a +2 resistance bonus on all saving throws made against evil effects or spells cast by evil creatures. This aura extends to a radius of 5 feet, but can only benefit one additional creature other than the cassisian at any one time. A cassisian&#x27;s protective aura is fragile, and as soon as an evil creature successfully strikes the cassisian, or as soon as the cassisian fails a saving throw against an evil source, its protective aura fades away and is no longer applicable. The cassisian can reactivate its protective aura by spending 1 minute concentrating upon the task.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Cassisians are the weakest sort of angel, but are absolutely dedicated to the cause of good. They serve as messengers for more powerful angels, and on the Material Plane they are often bound to good mortals to serve as familiars, acting as spiritual guides, reciting platitudes and quoting scripture from various benign faiths and philosophies (some forgotten for centuries). A 7th-level lawful good with the Improved Familiar feat can select a cassisian as a familiar.\n\nA cassisian&#x27;s true form is a helmet possessing a pair of bird&#x27;s wings. The exact style of helmet varies by the deity the angel serves-most appear to be steel with angular cheek-plates, though some resemble bascinets, skullcaps, great helms, or even samurai helmets, and a few older cassisians appear to be bronze or even leather. Though cassisians can assume other forms (that of a child-sized angelic humanoid wearing a proportional helmet matching the cassisians&#x27; true form, a dove, a dog, or a fish), they find it strange and rarely stay in that form for more than a few minutes.\n\nTypically formed from the souls of trustworthy and pious soldiers, some cassisians arise spontaneously from the spiritual fragments of great angels destroyed while defending the celestial planes against fiendish incursions. In many cases, the lowly cassisian retains fragments of its previous life&#x27;s memories, and friends of that old soul may visit with the cassisian to reminisce with what remains. Unfortunately, the reincarnated angel&#x27;s memories are more like something memorized from a book, and lack the character and camaraderie the friends expect.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Cassisian, Angel CR 2\nSource Bestiary 2 pg. 26\nXP 600\nNG Small outsider (angel, extraplanar, good)\nInit +0; Senses darkvision 60 ft., detect evil, low-light vision; Perception +5\nAura lesser protective aura\nDefense\nAC 14, touch 11, flat-footed 14 (+3 natural, +1 size) (+2 deflection vs. evil)\nhp 13 (2d10+2)\nFort +4, Ref +3, Will +2; +4 vs. poison\nDR 5/cold iron or evil; Immune acid, cold, petrification; Resist electricity 10, fire 10\nOffense\nSpeed fly 60 ft. (perfect)\nMelee slam -1 (1d3-4)\nSpecial Attacks breath weapon (15-ft. line, 1d6 cold or 1d6 fire, Reflex DC 12 half, usable every 1d4 rounds)\nSpell-Like Abilities (CL 3rd; concentration +3)\nConstant-detect evil, know direction\n1/day-aid, daylight\n1/week-commune (six questions, CL 12th)\nStatistics\nStr 3, Dex 11, Con 12, Int 6, Wis 11, Cha 10\nBase Atk +2; CMB -3; CMD 7 (can't be tripped)\nFeats Iron Will\nSkills Diplomacy +2, Fly +10, Knowledge (planes) +2, Knowledge (religion) +2, Perception +5, Sense Motive +4, Stealth +8\nLanguages Celestial, Draconic, Infernal; truespeech\nSQ change shape (2 of the following forms: Small human-like angel, dove, dog, or Tiny fish, polymorph), perfect memory\nEcology\nEnvironment any good-aligned plane\nOrganization solitary, pair, or squad (3-6)\nTreasure none\nSpecial Abilities\nPerfect Memory (Ex) Though they are not particularly intelligent, cassisians have perfect memories and remember everything they see or hear. They can faultlessly recite conversations they heard hundreds of years before. They also have the power to erase portions of their own memories, which they do (usually under orders from superior angels) to protect sensitive information.\n\nLesser Protective Aura (Su) A cassisian has a lesser form of the protective aura possessed by more powerful angels. This protective aura grants the cassisian a +2 deflection bonus to its AC against evil foes, and a +2 resistance bonus on all saving throws made against evil effects or spells cast by evil creatures. This aura extends to a radius of 5 feet, but can only benefit one additional creature other than the cassisian at any one time. A cassisian's protective aura is fragile, and as soon as an evil creature successfully strikes the cassisian, or as soon as the cassisian fails a saving throw against an evil source, its protective aura fades away and is no longer applicable. The cassisian can reactivate its protective aura by spending 1 minute concentrating upon the task.\nDescription\nCassisians are the weakest sort of angel, but are absolutely dedicated to the cause of good. They serve as messengers for more powerful angels, and on the Material Plane they are often bound to good mortals to serve as familiars, acting as spiritual guides, reciting platitudes and quoting scripture from various benign faiths and philosophies (some forgotten for centuries). A 7th-level lawful good with the Improved Familiar feat can select a cassisian as a familiar.\n\nA cassisian's true form is a helmet possessing a pair of bird's wings. The exact style of helmet varies by the deity the angel serves-most appear to be steel with angular cheek-plates, though some resemble bascinets, skullcaps, great helms, or even samurai helmets, and a few older cassisians appear to be bronze or even leather. Though cassisians can assume other forms (that of a child-sized angelic humanoid wearing a proportional helmet matching the cassisians' true form, a dove, a dog, or a fish), they find it strange and rarely stay in that form for more than a few minutes.\n\nTypically formed from the souls of trustworthy and pious soldiers, some cassisians arise spontaneously from the spiritual fragments of great angels destroyed while defending the celestial planes against fiendish incursions. In many cases, the lowly cassisian retains fragments of its previous life's memories, and friends of that old soul may visit with the cassisian to reminisce with what remains. Unfortunately, the reincarnated angel's memories are more like something memorized from a book, and lack the character and camaraderie the friends expect.</pre>\n        </div>\n    "
