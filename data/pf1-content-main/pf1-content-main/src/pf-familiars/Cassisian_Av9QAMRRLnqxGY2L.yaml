  - _id: nM1Vvu2lg5RJnWYC
    _key: '!actors.items!Av9QAMRRLnqxGY2L.nM1Vvu2lg5RJnWYC'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Perfect Memory
    system:
      abilityType: ex
      description:
        value: >-
          Though they are not particularly intelligent, cassisians have perfect
          memories and remember everything they see or hear. They can
          faultlessly recite conversations they heard hundreds of years before.
          They also have the power to erase portions of their own memories,
          which they do (usually under orders from superior angels) to protect
          sensitive information.
      subType: classFeat
    type: feat
  - _id: 9SYUQJeHMF9vPAUK
    _key: '!actors.items!Av9QAMRRLnqxGY2L.9SYUQJeHMF9vPAUK'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Lesser Protective Aura
    system:
      abilityType: su
      description:
        value: >-
          A cassisian has a lesser form of the protective aura possessed by more
          powerful angels. This protective aura grants the cassisian a +2
          deflection bonus to its AC against evil foes, and a +2 resistance
          bonus on all saving throws made against evil effects or spells cast by
          evil creatures. This aura extends to a radius of 5 feet, but can only
          benefit one additional creature other than the cassisian at any one
          time. A cassisian's protective aura is fragile, and as soon as an evil
          creature successfully strikes the cassisian, or as soon as the
          cassisian fails a saving throw against an evil source, its protective
          aura fades away and is no longer applicable. The cassisian can
          reactivate its protective aura by spending 1 minute concentrating upon
          the task.
      subType: classFeat
    type: feat
  - _id: jdUiXr4gZc8RNYVL
