    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Psyche Serpent CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Occult Bestiary pg. 44<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Magical Beast <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> darkvision 60 ft., low-light vision; Perception +7; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 14 (+3 Dex, +2 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 6, <strong>Will</strong> 2\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 40 ft.<br/>\r\n                <strong>Melee</strong> bite +8 (1d3-2 plus poison)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 6, <strong>Dex</strong> 16, <strong>Con</strong> 13, <strong>Int</strong> 13, <strong>Wis</strong> 13, <strong>Cha</strong> 14<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +4; <strong>CMD</strong> 12<br/>\r\n            <strong>Feats</strong> Skill Focus (Diplomacy), Weapon Finesse<br/>\r\n            <strong>Skills</strong> Diplomacy +12, Perception +7, Sense Motive +4, Racial Modifiers +4 Diplomacy<br/>\r\n            <strong>Languages</strong> Common<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any temperate or warm<br/>\r\n                <strong>Organization</strong>: solitary<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Hypnotic Hood (su): A psyche serpent can use the hypnotism occult skill unlock (Pathfinder RPG Occult Adventures 195) to implant suggestions as a full-round action (instead of taking 1 minute) an unlimited number of times per day. While it hypnotizes its targets, it sways from side to side with the spiral pattern of its hood fully displayed. A successfully hypnotized victim can recall this spiral pattern but otherwise has no memory of the act of hypnotism unless the psyche serpent wishes it to.\n\nPainless Bite (ex): A psyche serpent&#x27;s venom has a powerful numbing effect, causing its bites to inflict no pain and allowing it to inject its poison without alerting its victims or awakening them from sleep. Even if the victim succeeded at its saving throw, it remains unaware it attempted a save against a psyche serpent&#x27;s venom.\n\nPoison (ex): Bite-injury; save Fort DC 14; frequency 1/round for 6 rounds; effect 1d3 Wisdom, and a creature that takes Wisdom damage from this poison is considered a willing creature for the purposes of the psyche serpent&#x27;s hypnotism occult skill unlock until the Wisdom damage is healed; cure 2 consecutive saves. The DC includes a +2 racial bonus.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">The unique spiral pattern on psyche serpent&#x27;s hoods mark them as something more than ordinary cobras. They are clever creatures with enough wit and magic to be dangerous. Though psyche serpents are solitary, they can not resist the lure of large cities, especially those rife with politics and scheming, which irresistibly call to them. Psyche serpents are cunning, patient, and manipulative, and enjoy seeing subtle, long-awaited plans come to fruition. They prefer to stay out of sight, waiting for the right moment to emerge and hypnotize the perfect subject. By drawing out secrets and forcing victims to act against their own will, psyche serpents enact their plots without ever being discovered as the true masterminds. Though their venom makes them dangerous, they are not hardy creatures and prefer to avoid physical combat.\n\nSome psyche serpents take on more official roles, acting as advisors and counselors to great leaders. Psyche serpents are fiercely competitive, especially with others of their kind, and rarely work together. They often take opposite sides of political conflicts simply for the sake of decent competition, finding almost as much pleasure in being outsmarted as they do from thwarting their rivals. A worthy rival is the greatest gift a psyche serpent can ever find, and they find the idea of eliminating their nemeses completely alien.\n\nPsyche serpents sometimes form strong bonds with those few individuals whom they see as mental equals, partnering with them as constantly competitive but loyal familiars. A spellcaster with an alignment within one step of true neutral who has the Improved Familiar feat and an Arcana caster level of 7th or higher can select a psyche serpent as a familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Psyche Serpent CR 2\nSource Occult Bestiary pg. 44\nXP 600\nN Tiny magical beast\nInit +3; Senses darkvision 60 ft., low-light vision; Perception +7\nDefense\nAC 17, touch 15, flat-footed 14 (+3 Dex, +2 natural, +2 size)\nhp 19 (3d10+3)\nFort +4, Ref +6, Will +2\nOffense\nSpeed 40 ft.\nMelee bite +8 (1d3-2 plus poison)\nSpace 2-1/2 ft., Reach 0 ft.\nPsychic Magic (CL 6th; concentration +8)\n5 PE-charm person (1 PE, DC 13), detect thoughts (2 PE, DC 13), invisibility (2 PE, self only)\nStatistics\nStr 6, Dex 16, Con 13, Int 13, Wis 13, Cha 14\nBase Atk +3; CMB +4; CMD 12\nFeats Skill Focus (Diplomacy), Weapon Finesse\nSkills Diplomacy +12, Perception +7, Sense Motive +4; Racial Modifiers +4 Diplomacy\nLanguages Common\nSQ hypnotic hood, painless bite\nEcology\nEnvironment any temperate or warm\nOrganization solitary\nTreasure standard\nSpecial Abilities\nHypnotic Hood (Su) A psyche serpent can use the hypnotism occult skill unlock (Pathfinder RPG Occult Adventures 195) to implant suggestions as a full-round action (instead of taking 1 minute) an unlimited number of times per day. While it hypnotizes its targets, it sways from side to side with the spiral pattern of its hood fully displayed. A successfully hypnotized victim can recall this spiral pattern but otherwise has no memory of the act of hypnotism unless the psyche serpent wishes it to.\n\nPainless Bite (Ex) A psyche serpent's venom has a powerful numbing effect, causing its bites to inflict no pain and allowing it to inject its poison without alerting its victims or awakening them from sleep. Even if the victim succeeded at its saving throw, it remains unaware it attempted a save against a psyche serpent's venom.\n\nPoison (Ex) Bite-injury; save Fort DC 14; frequency 1/round for 6 rounds; effect 1d3 Wisdom, and a creature that takes Wisdom damage from this poison is considered a willing creature for the purposes of the psyche serpent's hypnotism occult skill unlock until the Wisdom damage is healed; cure 2 consecutive saves. The DC includes a +2 racial bonus.\nDescription\nThe unique spiral pattern on psyche serpent's hoods mark them as something more than ordinary cobras. They are clever creatures with enough wit and magic to be dangerous. Though psyche serpents are solitary, they can not resist the lure of large cities, especially those rife with politics and scheming, which irresistibly call to them. Psyche serpents are cunning, patient, and manipulative, and enjoy seeing subtle, long-awaited plans come to fruition. They prefer to stay out of sight, waiting for the right moment to emerge and hypnotize the perfect subject. By drawing out secrets and forcing victims to act against their own will, psyche serpents enact their plots without ever being discovered as the true masterminds. Though their venom makes them dangerous, they are not hardy creatures and prefer to avoid physical combat.\n\nSome psyche serpents take on more official roles, acting as advisors and counselors to great leaders. Psyche serpents are fiercely competitive, especially with others of their kind, and rarely work together. They often take opposite sides of political conflicts simply for the sake of decent competition, finding almost as much pleasure in being outsmarted as they do from thwarting their rivals. A worthy rival is the greatest gift a psyche serpent can ever find, and they find the idea of eliminating their nemeses completely alien.\n\nPsyche serpents sometimes form strong bonds with those few individuals whom they see as mental equals, partnering with them as constantly competitive but loyal familiars. A spellcaster with an alignment within one step of true neutral who has the Improved Familiar feat and an arcane caster level of 7th or higher can select a psyche serpent as a familiar.</pre>\n        </div>\n    "
