  - _id: hzggE8Cq7MANwC0A
    _key: '!actors.items!ShT5pBiE0xq6L1hT.hzggE8Cq7MANwC0A'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Hypnotic Hood
    system:
      abilityType: su
      description:
        value: >-
          A psyche serpent can use the hypnotism occult skill unlock (Pathfinder
          RPG Occult Adventures 195) to implant suggestions as a full-round
          action (instead of taking 1 minute) an unlimited number of times per
          day. While it hypnotizes its targets, it sways from side to side with
          the spiral pattern of its hood fully displayed. A successfully
          hypnotized victim can recall this spiral pattern but otherwise has no
          memory of the act of hypnotism unless the psyche serpent wishes it to.
      subType: classFeat
    type: feat
  - _id: 9I1SL0eQkcvTjnrf
    _key: '!actors.items!ShT5pBiE0xq6L1hT.9I1SL0eQkcvTjnrf'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Painless Bite
    system:
      abilityType: ex
      description:
        value: >-
          A psyche serpent's venom has a powerful numbing effect, causing its
          bites to inflict no pain and allowing it to inject its poison without
          alerting its victims or awakening them from sleep. Even if the victim
          succeeded at its saving throw, it remains unaware it attempted a save
          against a psyche serpent's venom.
      subType: classFeat
    type: feat
  - _id: 0o3PfO8XdOPMb9nQ
    _key: '!actors.items!ShT5pBiE0xq6L1hT.0o3PfO8XdOPMb9nQ'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Poison
    system:
      abilityType: ex
      description:
        value: >-
          Bite-injury; save Fort DC 14; frequency 1/round for 6 rounds; effect
          1d3 Wisdom, and a creature that takes Wisdom damage from this poison
