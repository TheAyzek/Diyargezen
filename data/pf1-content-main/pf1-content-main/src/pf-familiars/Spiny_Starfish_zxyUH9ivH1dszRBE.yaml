    cr:
      base: 0.1625
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Spiny Starfish CR 1/6 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Ultimate Wilderness pg. 206<br/>\r\n            <strong>XP 65</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Vermin <br/>\r\n            <strong>Init</strong> 1;\r\n            <strong>Senses</strong> darkvision 60 ft., tremorsense 20 ft.; Perception +0; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 15, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 14 (+1 Dex, +2 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 6 (1 HD; 1d8+2)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 1, <strong>Will</strong> 0\r\n            <br/><strong>Defensive Abilities</strong> rapid healing; \r\n            \r\n            <strong>Immune</strong> mind-affecting effects; \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 5 ft.<br/>\r\n                <strong>Melee</strong> slam -1 (1d2-3 plus grab)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 4, <strong>Dex</strong> 13, <strong>Con</strong> 14, <strong>Int</strong> 0, <strong>Wis</strong> 11, <strong>Cha</strong> 3<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-1; <strong>CMD</strong> 6<br/>\r\n            <strong>Feats</strong> <br/>\r\n            <strong>Skills</strong> Climb +5, Swim +5<br/>\r\n            <strong>Languages</strong> <br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any ocean<br/>\r\n                <strong>Organization</strong>: solitary, pair, or cluster (3-22)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Firm Grip (ex): A spiny starfish excels at grappling prey, and it gains a +6 racial bonus on grapple checks (rather than the standard +4 bonus most creatures gain as a result of having the grab ability).\n\nRapid Healing (ex): A spiny starfish heals very quickly, regaining a number of hit points each hour equal to its Hit Dice (1 hp per hour for the typical spiny starfish).</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Spiny starfish are marine invertebrates that wander the sea floor in search of mollusks and other slow-moving prey. Their tube feet afford them an excellent grip on their chosen food source, and they can famously expel their stomachs into subdued shellfish to digest their meals. An injured spiny starfish heals wounds quickly, even regrowing lost limbs over time.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Spiny Starfish CR 1/6\nSource Ultimate Wilderness pg. 206\nXP 65\nN Tiny vermin\nInit +1; Senses darkvision 60 ft., tremorsense 20 ft.; Perception +0\nDefense\nAC 15, touch 13, flat-footed 14 (+1 Dex, +2 natural, +2 size)\nhp 6 (1d8+2)\nFort +4, Ref +1, Will +0\nDefensive Abilities rapid healing; Immune mind-affecting effects\nOffense\nSpeed 5 ft., climb 5 ft., swim 5 ft.\nMelee slam -1 (1d2-3 plus grab)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks grab (Small)\nStatistics\nStr 4, Dex 13, Con 14, Int -, Wis 11, Cha 3\nBase Atk +0; CMB -1 (+5 when grappling); CMD 6 (can't be tripped)\nSkills Climb +5, Swim +5\nSQ firm grip\nEcology\nEnvironment any ocean\nOrganization solitary, pair, or cluster (3-22)\nTreasure none\nSpecial Abilities\nFirm Grip (Ex) A spiny starfish excels at grappling prey, and it gains a +6 racial bonus on grapple checks (rather than the standard +4 bonus most creatures gain as a result of having the grab ability).\n\nRapid Healing (Ex) A spiny starfish heals very quickly, regaining a number of hit points each hour equal to its Hit Dice (1 hp per hour for the typical spiny starfish).\nDescription\nSpiny starfish are marine invertebrates that wander the sea floor in search of mollusks and other slow-moving prey. Their tube feet afford them an excellent grip on their chosen food source, and they can famously expel their stomachs into subdued shellfish to digest their meals. An injured spiny starfish heals wounds quickly, even regrowing lost limbs over time.</pre>\n        </div>\n    "
