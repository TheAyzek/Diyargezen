    value: >-
      <p>Whenever an arrow fired from this +1 adaptive seeking composite longbow
      damages the wielder's favored enemy or studied target (as per the ranger
      and slayer class features, respectively), in addition to its normal
      effects, it also deals 2 points of bleed damage. As long as the bleed
      effect continues, the wielder can sense that foe's approximate direction
      and distance twice per day by smelling the wind as a standard
      action.</p><p><strong>Base Item</strong>: adaptive seeking composite
