  description:
    value: >-
      <p>This long, curved +1 dagger gives off a contented hum when soaked with
      blood. It can be thrown normally despite its length and has a critical
      threat range of 18-20.  8th Level: The thirsting blade is a +1 keen
      dagger.  10th Level: The thirsting blade deals 1 point of bleed damage on
      a successful critical hit.  14th Level: The thirsting blade is a +1 keen
      wounding dagger. On a successful critical hit, the dagger deals 2 points
      of bleed damage instead of 1.  15th Level: The thirsting blade is a +2
      keen wounding dagger.  16th Level: The thirsting blade is a +3 keen
      wounding dagger.  17th Level: The thirsting blade is a +4 keen wounding
      dagger.  19th Level: On a successful critical hit against an opponent with
      blood, the thirsting blade's wielder recovers 2 hit points. This ability
      functions only for the first wielder each day to score a critical hit with
      the thirsting blade. The wielder can recover a number of hit points in
      this way each day up to that wielder's normal maximum hit points. On a
      successful critical hit against an opponent with blood, that opponent is
      flat-footed against the wielder's attacks with the thirsting blade as long
      as it continues to take the bleed damage from the critical hit.  20th
      level: The thirsting blade is a +5 keen vicious wounding
      dagger.</p><p><strong>Base Item</strong>: 
      dagger</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, bleed, enervation, keen edge, vampiric touch</p>
