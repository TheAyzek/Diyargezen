    value: >-
      <p>This bright, silver-and-gold +1 chainmail is so fine and light that it
      can be worn under normal clothing without betraying its presence. It has a
      maximum Dexterity bonus of +5, an armor check penalty of -2, and an arcane
      spell failure chance of 15%. It is considered light armor.  11th Level:
      The wearer can use fly on command once per day.  13th Level: The armor is
      +3 chainmail, and the maximum Dexterity bonus increases to +7.  15th
      Level: The armor is +4 chainmail, the maximum Dexterity bonus increases to
      +8, and the armor check penalty decreases to -1.  17th Level: The armor is
      +5 chainmail, and the wearer can activate the fly ability on command as a
      swift action.  19th Level: The armor causes the wearer to grow feathery
      white wings, granting her a constant fly speed of 60 feet with good
      maneuverability.</p><p><strong>Base Item</strong>: 
      chainmail</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
