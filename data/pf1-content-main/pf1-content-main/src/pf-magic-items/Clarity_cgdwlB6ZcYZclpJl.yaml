  description:
    value: >-
      <p>Clarity is a +1 holy scimitar crafted to vanquish the evil creatures of
      the night. Though she can't speak, her empathic communications clearly
      indicate a protective mindset. Clarity enjoys giving warm, encouraging
      energy to her wielder as long as that wielder opposes evil and gives his
      best effort. To preserve her wielder's valor in fights, she can cast
      remove fear up to three times per day, affecting only her
      wielder.</p><p><strong>Base Item</strong>: holy
      scimitar</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
