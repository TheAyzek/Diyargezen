  description:
    value: >-
      <p>This leathern lash is dyed with special unguents that give it a
      disturbing crimson hue. A tamer's whip is a +1 animal-bane whip that deals
      lethal damage to animals and magical beasts regardless of their natural
      armor bonus. Cracking a tamer's whip as a move action grants the wielder
      the following benefits until the end of her turn: a +4 competence bonus on
      Intimidate checks made against animals and magical beasts, a +4 competence
      bonus on Handle Animal checks made to push them, and a +2 bonus on any
      combat maneuvers against animals or magical beasts.</p><p><strong>Base
      Item</strong>: +1 animal-bane
      whip</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, animal trance, snare, summon nature's ally I</p>
