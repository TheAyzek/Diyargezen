  description:
    value: >-
      <p>Poison applied to this +1 dagger seeps into the blade, awaiting the
      perfect moment for release. After a hit with the dagger but before damage
      is determined, the wielder of an arachnid's fang can release a stored dose
      of poison into the creature struck by the blade as a free action. Up to 8
      doses of poison can be stored in the dagger at a time, but only 1 dose can
      be released on a given attack.</p><p><strong>Base Item</strong>: 
      dagger</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
