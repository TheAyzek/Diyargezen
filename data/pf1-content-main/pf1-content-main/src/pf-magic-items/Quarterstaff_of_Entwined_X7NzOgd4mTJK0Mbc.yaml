  description:
    value: >-
      <p>This +1 quarterstaff is made of wood carved and dyed to look like two
      entwined asps, one black and one white. At will, the wielder can use the
      staff to cast magic missile, creating two such missiles. One of the
      created missiles always takes the form of a glowing white snake, while the
      other missile always takes the form of a shadowy black snake. When held in
      hand, the wielder of the quarterstaff of entwined serpents can cast spells
      as i f he had the Eschew Materials feat.</p><p><strong>Base
      Item</strong>: 
      quarterstaff</p><h3>Construction</h3><p><strong>Requirements</strong>
