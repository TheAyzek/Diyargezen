  description:
    value: >-
      <p>This +1 dueling rapier ends duels quickly and decisively by depriving
      the wielder’s opponent of her weapon. Following a successful disarm
      attempt with the weapon, the wielder can move the disarmed weapon 5 feet
      in any direction as a swift
      action.</p><p><strong>Dueling</strong></p><p>This special ability can only
      be placed on melee weapons. A dueling weapon (which must be a weapon that
      can be used with the Weapon Finesse feat) gives the wielder a +4
      enhancement bonus on initiative checks, provided the weapon is drawn and
      in hand when the Initiative check is made.</p><p>It provides a +2 bonus on
      disarm checks and feint checks, a +2 bonus to CMD to resist disarm
      attempts, and a +2 to the DC to perform a feint against the
      wielder.</p><p><strong>Base Item</strong>: +1 dueling
      rapier</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, cat’s grace, mage hand</p>
