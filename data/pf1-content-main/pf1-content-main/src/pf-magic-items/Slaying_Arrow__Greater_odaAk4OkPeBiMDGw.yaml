  description:
    value: >-
      <p>This +1 arrow is keyed to a particular type or subtype of creature. If
      it strikes such a creature, the target must succeed at a DC 20 Fortitude
      save or take 50 points of damage. Note that even creatures normally exempt
      from Fortitude saves (undead and constructs) are subject to this attack.
      When keyed to a living creature, this is a death effect (and thus death
      ward protects a target). To determine the type or subtype of creature the
      arrow is keyed to, roll on the table below.  A greater slaying arrow
      functions just like a normal slaying arrow, but the DC to avoid the death
      effect is 23 and the arrow deals 100 points of damage if the saving throw
      is failed.   d% DESIGNATED TYPE OR SUBTYPE 01-05 Aberrations 06-09 Animals
      10-16 Constructs 17-27 Dragons 28-32 Fey 33 Humanoids, aquatic 34-35
      Humanoids, dwarf 36-37 Humanoids, elf 38-44 Humanoids, giant 45 Humanoids,
      gnoll 46 Humanoids, gnome 47-49 Humanoids, goblinoid 50 Humanoids,
      halfling 51-54 Humanoids, human 55-57 Humanoids, reptilian 58-60
      Humanoids, orc 61-65 Magical beasts 66-70 Monstrous humanoids 71-72 Oozes
      73 Outsiders, air 74-76 Outsiders, chaotic 77 Outsiders, earth 78-80
      Outsiders, evil 81 Outsiders, fire  82-84 Outsiders, good 85-87 Outsiders,
      lawful 88 Outsiders, water 89-90 Plants 91-98 Undead 99-100
      Vermi.</p><p><strong>Enhancement Bonus</strong>: +1
      </p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic Arms
      and Armor, heightened finger of death</p>
