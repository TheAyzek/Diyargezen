  description:
    value: >-
      <p>Appearing to have grown naturally into its shape, this oak, ash, or yew
      staff allows use of the following spells: • Charm animal (1 charge)  •
      Speak with animals (1 charge)  • Barkskin (2 charges)  • Summon nature's
      ally VI (3 charges)  • Wall of thorns (3 charges)  • Animate plants (4
      charges)  The staff may be used as a weapon, functioning as a +2
      quarterstaff. The staff of the woodlands also allows its wielder to cast
      pass without trace at will, with no charge cost. These two attributes
      continue to function after all the charges are
      expended.</p><p><strong>Base Item</strong>: +2
      quarterstaff</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, Craft Staff, animate plants, barkskin, charm
      animal, pass without trace, speak with animals, summon nature's ally VI,
      wall of thorns</p>
