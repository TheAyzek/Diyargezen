  description:
    value: >-
      <p>This wide machete is darkly stained with blood. It is treated as a +1
      keen short sword that also has a vicious cutting edge, allowing it to deal
      slashing damage in addition to piercing damage.  The murderer's machete
      grants its wielder the ability to move with unnatural grace and speed
      while stalking potential victims. The wielder gains a +2 competence bonus
      on Stealth checks and Survival checks to track. In addition, once per day,
      the wielder can lick the bloodstains on the blade as a standard action to
      gain the benefits of cruel jaunt (see page 114).</p><p><strong>Base
      Item</strong>: +1 keen short
      sword</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, cruel jaunt, keen edge, creator must sacrifice a sentient
      living creature</p>
