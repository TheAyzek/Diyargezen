  description:
    value: >-
      <p>This plain-looking +1 spring blade is attached to a weather-beaten
      cedar grip. By speaking a command word, the wielder can magically merge
      the grip into a larger wood handle, such as a cane, club, staff, stylus,
      or oar, transforming the infused item into either a +1 shortspear, +1
      spear, or +1 siangham (depending on the handle's size). The blade can even
      be affixed to magic items such as staves, rods, and wands so long as they
      are made of wood, but doing so renders their other magical properties
      nonfunctional until the grafting blade is removed.  Removing a grafting
      blade from an item it has merged with requires a full-round action, and
      leaves both items unharmed.</p><p><strong>Base Item</strong>: spring
      blade</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, wood shape</p>
