  description:
    value: >-
      <p>Thanks to the unusually light and fine links of this halfling-made +2
      chain shirt, it imposes no armor check penalty and the wearer's maximum
      Dexterity bonus is +5. After a melee attack hits the wearer, he can take a
      5-foot step as an immediate action, even if he already took a 5-foot step
      during his turn. Taking such a step does not interfere with the wearer's
      movement during his next turn. A suit of mail of sly steps is usually
      sized for Small creatures.</p><p><strong>Base Item</strong>: chain
      shirt</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, expeditious retreat, creator must be a halfling</p>
