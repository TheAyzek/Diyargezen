    value: >-
      <p>This +2 aberration-bane bastard sword is made of magically hardened
      bronze and has the special purpose of killing aberrations and creatures
      intrinsically tied to Xhamen-Dor (including seeded undead and the dormant
      Star Seed). Upianshe's spirit can sense such foes within 60 feet, her bane
