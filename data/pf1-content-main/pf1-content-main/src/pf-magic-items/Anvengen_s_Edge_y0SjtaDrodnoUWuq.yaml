  description:
    value: >-
      <p>This +1 keen glaive bears a fragment of the soul and mind of
      Westcrown's first mayor after the fall of Aroden and the rise of the House
      of Thrune. The glaive itself has taken Anvengen's name for its own, but
      can only communicate with its wielder via empathic urges. If its wielder
      worships Asmodeus, the glaive uses bleed on any of its wielder's foes it
      notices is dying, and grants divine favor on a wielder who commands it to
      do so. If the wielder doesn't worship Asmodeus, the glaive uses bleed on
      any dying creature it notices and only grants divine favor against chaotic
      or good foes-if a wielder commands it to not use bleed in a battle or
      commands it to grant divine favor against a nongood or nonchaotic foe, a
      personality conflict occurs and the glaive attempts to gain control of the
      wielder.<p><strong>Base Item</strong>: keen
      glaive</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor</p>
