  description:
    value: >-
      <p>This +1 dragon bane guisarme is has a shaft wound tightly with
      dragonhide. A dragoncatch guisarme can be used to make a special trip
      maneuver against creatures using wings to fly. If the maneuver succeeds,
      the target's wings are fouled and the creature is knocked off balance,
      falling to the ground and gaining the entangled condition. A creature
      tripped in this way can attempt a DC 15 Fly check as a move action to
      remove the entangled condition.</p><p><strong>Base Item</strong>: dragon
      bane guisarme</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, black tentacles, summon monster I</p>
