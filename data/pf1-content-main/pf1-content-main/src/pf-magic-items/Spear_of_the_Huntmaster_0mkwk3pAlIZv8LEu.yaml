  description:
    value: >-
      <p>This +1 spear of jet-black wood has a head of polished amber. The
      spear's wielder can use know direction at will.  8th Level: With the spear
      in hand, the wielder gains a +5 competence bonus on Survival checks.  10th
      Level: A wielder with the quarry class feature (Core Rulebook 67) can use
      the spear to use locate creature once per day to find his quarry. If his
      quarry is within range, the amber spearhead glows brightly when pointed in
      the proper direction.  12th Level: The spear gains the returning weapon
      special ability.</p><p><strong>Base Item</strong>: 
      spear</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, detect animals or plants, know direction, locate creature,
      telekinesis</p>
