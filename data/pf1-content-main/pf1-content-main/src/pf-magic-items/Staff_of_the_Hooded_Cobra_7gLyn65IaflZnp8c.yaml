  description:
    value: >-
      <p>Carved from a single piece of darkwood and topped by the head of a
      hooded cobra, this staff functions as a +3 defending darkwood
      quarterstaff. Additionally, once per day when the wielder hits a creature
      with the staff, she can cause the carved cobra head to bite her target.
      The attack deals an additional 1d6 points of damage and injects the target
      with a virulent poison (injury; save Fort DC 20; frequency 1/round for 6
      rounds; effect 1d2 Str and 1d2 Con damage; cure 2 consecutive
      saves).<p><strong>Base Item</strong>: defending darkwood
      quarterstaff</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, poison, shield of faith</p>
