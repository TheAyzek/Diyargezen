  description:
    value: >-
      <p>Ice covers the lash of this +1 frost vorpal whip. A frostkiss whip
      deals damage as though it were one size category larger (1d3 for a Small
      whip, 1d4 for a Medium whip, and so on). In addition, on command a
      frostkiss whip deals lethal damage instead of nonlethal damage, and it can
      deal damage even against creatures with armor bonuses greater than +1 or
      natural armor bonuses higher than +3.</p><p><strong>Base Item</strong>:
      frost vorpal whip</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, chill metal or ice storm, horrid wilting, keen
      edge</p>
