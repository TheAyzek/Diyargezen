  description:
    value: >-
      <p>This broad, heavy knife is used to chop through thick undergrowth in
      the jungle. Once per day on command, this +1 short sword can cast
      defoliate (see above) to clear vegetation either in a line 60 feet long or
      in a 10-foot radius spread. Explorers used to fighting the jungle's
      dangerous inhabitants sometimes commission machetes of clearing with
      either the animal bane or plant bane special abilities. Moderate
      conjuration; CL 8th.</p><p><strong>Base Item</strong>: short
      sword</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, defoliate (plus summon monster I for animal or plant
      bane)</p>
