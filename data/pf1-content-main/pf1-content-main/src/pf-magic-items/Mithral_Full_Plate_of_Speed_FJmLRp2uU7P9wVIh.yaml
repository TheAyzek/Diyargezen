  description:
    value: >-
      <p>As a free action, the wearer of this fine set of +1 mithral full plate
      can activate it, enabling him to act as though affected by a haste spell
      for up to 10 rounds each day. The duration of the haste effect need not be
      consecutive rounds. The armor has an arcane spell failure chance of 25%, a
      maximum Dexterity bonus of +3, and an armor check penalty of -3. It is
      considered medium armor, except that you must be proficient in heavy armor
      to avoid taking nonproficiency
      penalties.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, haste</p>
