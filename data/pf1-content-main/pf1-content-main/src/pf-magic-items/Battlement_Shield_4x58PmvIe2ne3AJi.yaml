  description:
    value: >-
      <p>Once per day on command, this +2 tower shield can transform into a
      solid, 1-foot-thick, 10-foot-by-10-foot wall of masonry with a battlement
      on top and an arrow slit in each 5-foot length. The wall acts as cover
      just like any physical wall. The wielder can touch the wall with one hand
      and command it to revert to a tower shield either resting on the ground
      and balanced against his hand or strapped to his arm in the normal
      fashion. The wall has all the characteristics of any other foot-thick wall
      of masonry (hardness 8, 90 hit points, break DC 35). Attacks sufficient to
      destroy the wall cause it to immediately transform back into a shield,
      which loses half its hit points and gains the broken condition. The shield
      remains in wall form until destroyed or commanded to return to shield
      form. The wall cannot appear in a space too small to accommodate
      it.</p><p><strong>Base Item</strong>: tower
      shield</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, wall of stone</p>
