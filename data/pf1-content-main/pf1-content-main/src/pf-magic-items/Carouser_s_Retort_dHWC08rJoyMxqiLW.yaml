    value: >-
      <p>This simple but finely crafted +1 rapier has a hilt in the shape of a
      tankard, open on one end for the wielder's hand. Once per day, the wielder
      can use remove fear; if the wielder ever becomes frightened or panicked
      and this ability has not already been expended for the day, the weapon
      automatically activates this ability on the wielder's next turn. Once per
      day, the wielder can turn up to 8 gallons of water (fresh, salt, or
      contaminated) into weak beer that is safe to drink.</p><p><strong>Base
      Item</strong>: +1
      rapier</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, purify food and drink, remove fear</p>
