      <p>Crafted in the forges of Alkenstar, this +1 merciful pistol is
      ornamented with filigree of angelic creatures along the barrel, and houses
      intricate brass gears. Whenever the wielder scores a critical hit while
      using this weapon to deal nonlethal damage, the target must succeed at a
      DC 12 Will saving throw or be dazed for 1 round. As a swift action, a
      wielder with the grit class feature can spend 1 grit point to increase the
      DC of this save by 4.</p><p><strong>Base Item</strong>: merciful
