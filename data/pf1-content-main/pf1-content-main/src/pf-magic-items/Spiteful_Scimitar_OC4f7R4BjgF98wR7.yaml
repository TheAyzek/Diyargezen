  description:
    value: >-
      <p>This +2 cruel furyborn scimitar was created accidentally by Treerazer
      when the demon lord plunged the glaistig Hephloma's scimitar through her
      own chest. Images of shriveled vines and wilted flowers decorate its
      blade. Three times per day as an immediate action after dealing damage to
      a creature, the wielder can cause the blighted plant life depicted on the
      blade to animate, embedding thorny vines in the creature's wounds. The
      creeping, twisting vines cause the creature to become entangled for 1d4
      rounds, and it is nauseated by the pain while the entangled condition
      persists. A successful DC 22 Fortitude saving throw negates the nauseated
      condition.</p><p><strong>Base Item</strong>: +2 cruel furyborn
      scimitar</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, cause fear, death knell, rage, sickening
      entanglement</p>
