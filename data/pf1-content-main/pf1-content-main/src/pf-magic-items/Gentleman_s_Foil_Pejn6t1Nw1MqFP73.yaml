  description:
    value: >-
      <p>This bejeweled +1 keen rapier has gilt edges and appears to be merely
      ornamental. It bears an enchantment that is intended to ensure its bearer
      is never bested by sheer weight of numbers. As long as the wielder is
      threatening an opponent with the foil, other foes must succeed at a DC 12
      Will save to move to a space where they would also be threatened by the
      foil; those who fail this save end their movement just outside the foil's
      reach.</p><p><strong>Base Item</strong>: keen
      rapier</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, sanctuary, creator must be a Taldan</p>
