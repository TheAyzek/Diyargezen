  description:
    value: >-
      <p>The Ulfen Guard favor a single-bladed battleaxe as their weapon of
      choice. An elite few are chosen to bear a crowcaller, a magically enhanced
      version that not only strikes down assassins, but also helps track the
      assassins' masters. A crowcaller is a +2 keen greataxe. Once per day, if
      the axe is laid across the chest of a foe it has slain, it compels the
      corpse to answer five questions as per the speak with dead
      spell.</p><p><strong>Base Item</strong>: keen
