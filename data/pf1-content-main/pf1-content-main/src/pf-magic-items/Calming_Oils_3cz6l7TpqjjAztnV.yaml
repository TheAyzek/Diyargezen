name: Calming Oils
system:
  aura:
    school: abj
  cl: 5
  description:
    value: >-
      <p>A vial of calming oils help to lessen the rip and fury of great storms,
      reducing the winds (and the dangerous swells they create) in a 50-foot
      radius by one step (see page 439 of the Core Rulebook). This radius is
      measured from the person or ship's deck onto which it is poured, and
      travels with the oiled creature or surface if it is in motion (such as a
      ship under sail). If a spell that affects the wind, like control weather
      or whirlwind, would affect an area under the effect of calming oils, the
      spell's caster must make an opposed caster level check against the
      potion's caster level or the spell immediately ends. The oil's effect
      lasts for 1 hour, after which time the weather returns to normal. If
      Gozreh is your patron, you may drink the oil to give you water breathing
      for 1 hour.</p><h3>Requirements</h3><p>Craft Potion, water breathing, wind
      wall</p>
  price: 1000
  sources:
    - id: PZO9418
type: consumable
