  description:
    value: >-
      <p>This shining golden staff is topped with a radiant gemstone that emits
      light like a torch. As a swift action, the wielder of the staff can cause
      it to change into a +2 lance, although it retains its other abilities. It
      can be made to revert to its staff form as a free action. The staff allows
      use of the following spells: • Bless weapon (1 charge, cast on the staff
      only)  • Shield other (1 charge)  • Discern lies (2 charges)  • Holy sword
      (4 charges, cast on the staff only.</p><p><strong>Base Item</strong>: +2
      lance</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, Craft Staff, bless weapon, discern lies, holy sword,
      shield other</p>
