  description:
    value: >-
      <p>The blade of this +1 living steel dagger (Ultimate Equipment 51) is
      always slightly damp to the touch. The save DC of any injury poison
      coating this blade increases by 2. Once per day, the wielder of a
      snakebite dagger can speak the weapon's command word to cause the dagger
      to seep a bright green neurotoxin. For 1 hour, the next time the wielder
      damages a creature with the dagger, the creature must succeed at a DC 16
      Will save or be affected by modify memory as if the wielder had spent 5
      minutes modifying the target's memory.</p><p><strong>Base Item</strong>:
      living steel
      dagger</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magical Arms and Armor, modify memory</p>
