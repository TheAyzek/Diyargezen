  description:
    value: >-
      <p>This +1 light mace has bands of several different metals around its
      hilt, each band one inch thick. Once per day, the mace's owner can
      transform the mace into a different metal as a standard action. The
      multimetal mace remains that type of metal until transformed again. To
      begin with, it can transform to silver or back to steel. It retains all
      magical abilities when it transforms, along with any ongoing spells and
      effects currently affecting it.  8th Level: The multimetal mace can be
      transformed into cold iron.  10th Level: The multimetal mace can be
      transformed into adamantine.  12th Level: The multimetal mace is a +2
      light mace.</p><p><strong>Base Item</strong>: light
      mace</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, heart of the metal</p>
