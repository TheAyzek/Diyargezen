  description:
    value: >-
      <p>This staff appears to be nothing more than a finely made walking stick,
      but closer inspection reveals that it is inlaid with a fine copper tracery
      that makes up an intricate and incomprehensible arcane map. The staff
      allows use of the following spells: • Dimension door (1 charge)  • Fly (1
      charge)  • Teleport (2 charges)  In addition to these spells, the wielder
      of the staff of travel receives a +10-foot enhancement bonus to his base
      speed.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Staff, dimension door, expeditious retreat, fly, teleport</p>
