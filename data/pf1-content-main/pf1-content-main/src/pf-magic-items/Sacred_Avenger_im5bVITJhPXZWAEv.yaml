    value: >-
      <p>This masterwork cold iron longsword becomes a +1 cold iron longsword in
      the hands of a paladin.   8th Level: The sacred avenger is a +1 cold iron
      longsword that becomes a +2 cold iron longsword in the hands of a
      paladin.  10th Level: The sacred avenger becomes a +3 cold iron longsword
      in the hands of a paladin.  12th Level: The sacred avenger is a +2 cold
      iron longsword that becomes a +4 cold iron longsword in the hands of a
      paladin.  14th Level: The sacred avenger becomes a +5 cold iron longsword
      in the hands of a paladin.  17th Level: The sacred avenger allows a
      paladin to use the area dispel version of greater dispel magic at will as
      a standard action and grants the paladin and adjacent allies spell
      resistance equal to 5 + her paladin level.</p><p><strong>Base
      Item</strong>: cold iron
      longsword</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
