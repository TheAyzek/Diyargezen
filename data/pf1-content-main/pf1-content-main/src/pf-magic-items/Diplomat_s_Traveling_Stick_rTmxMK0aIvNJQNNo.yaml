    value: >-
      <p>The blade of this +1 sword cane is sheathed within a polished oaken
      cane bearing a brass head in the shape of clasped hands. When sheathed,
      the diplomat's traveling stick grants the wielder a +3 competence bonus on
      Diplomacy checks. Once per day as part of an action to draw the blade, the
      wielder can attempt an Intimidate check to demoralize all foes within 30
      feet who can see or hear him.</p><p><strong>Base Item</strong>: sword
