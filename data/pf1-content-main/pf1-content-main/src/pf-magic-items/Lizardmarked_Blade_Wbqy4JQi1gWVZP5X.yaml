  description:
    value: >-
      <p>The pommel of this +1 shocking gladius is shaped like the head of a
      lightning-breathing linnorm. The wielder automatically detects any
      electrical discharges within 100 feet, and as a move action can
      concentrate on a creature within 60 feet to determine whether it has a
      resistance or immunity to electricity damage. Once per day, the wielder
      can speak the lizardmarked blade's command word to cause the weapon to
      deal damage as if it's one size category larger than it actually is
      (effectively increasing the gladius's damage die from 1d6 to 1d8). This
      lasts for 10 minutes.</p><p><strong>Base Item</strong>: shocking
      gladius</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, lead blades, lightning bolt</p>
