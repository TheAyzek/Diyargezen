  description:
    value: >-
      <p>The Azlanti devised this +2 longsword during their ancient wars with
      the serpentfolk. It has the bane property against reptilian humanoids, but
      this power also manifests against lizardlike or snake-like monstrous
      humanoids (at the GM's discretion), such as serpentfolk. Once per day,
      when the wielder fails a saving throw against an effect that would
      exercise mental control over her, she can immediately reroll that saving
      throw. She must use the new result, even if it is
      worse.</p><p><strong>Base Item</strong>: +2
      longsword</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, protection from evil, summon monster I, creator must
      be an Azlanti</p>
