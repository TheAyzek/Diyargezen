      talents, ninja tricks, rogue talents, or slayer talents), once per day she
      can spend 1 hour to swap out one talent for another for which she
      qualifies. She can't swap a talent that is a prerequisites for other
      talents or feats she has.</p><p><strong>Base Item</strong>: lamellar
      cuirass</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
