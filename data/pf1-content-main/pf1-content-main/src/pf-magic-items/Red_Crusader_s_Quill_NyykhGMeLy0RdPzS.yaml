  description:
    value: >-
      <p>The tip of this narrow +3 rapier can be used as a mundane writing
      instrument, producing any color of ink the wielder desires. Once per day
      as a free action when the wielder confirms a critical hit against a
      creature with the Red Crusader's quill, she can inscribe an arcane mark on
      the creature. Once per month, the wielder can instead inscribe a mark of
      justice; this mark ends immediately if the wielder inscribes another mark
      of justice with the Red Crusader's quill.<p><strong>Base Item</strong>: 
      rapier</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, arcane mark, mark of justice, creator must worship
      Arazni</p>
