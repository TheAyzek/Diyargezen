name: Staff of One Hundred Hands
system:
  aura:
    school: evo
  cl: 17
  description:
    value: >-
      <p>Sculpted into the shape of dozens of grasping, distorted hands, this
      staff appears to be carved entirely from one piece of clear crystal. When
      held, the hands that form the staff distort to resemble the gloves or
      hands of the person holding it. It allows the use of the following spells:
      • Forceful hand (1 charge)  • Interposing hand (1 charge)  • Clenched fist
      (2 charges)  • Grasping hand (2 charges)  • Crushing hand (3 charges) 
      This staff also allows the wielder to use mage hand at
      will.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Staff, clenched fist, crushing hand, forceful hand, grasping hand,
      interposing hand, mage hand</p>
