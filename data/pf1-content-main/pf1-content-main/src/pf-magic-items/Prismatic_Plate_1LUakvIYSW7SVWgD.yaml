  description:
    value: >-
      <p>This resplendent suit of +3 full plate shimmers and shifts between all
      the colors of the rainbow. A single color dominates the others at any
      given time. As a swift action, the wearer can change the dominant color.
      This color remains dominant until the wearer changes it again. When the
      wearer of prismatic plate is struck by a prismatic spray, or when he
      passes through a prismatic sphere or prismatic wall, he ignores the effect
      that matches the dominant armor color. He receives no special protection
      against the other colors of those spells. In addition to this benefit,
      each color provides a unique type of protection.  COLOR EFFECT Red Resist
      fire 30  Orange Resist acid 30  Yellow Resist electricity 30  Green
      Immunity to poison Blue Immunity to petrification Indigo +8 resistance
      bonus on saving throws against mind-affecting effects Violet Protected by
      dimensional anchor, as the spel.</p><p><strong>Base Item</strong>: full
      plate</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, dimensional anchor, mind blank, neutralize poison, resist
      energy, stone to flesh, and prismatic sphere, prismatic spray, or
      prismatic wall</p>
