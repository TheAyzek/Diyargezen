name: Staff of Curchanus
system:
  aura:
    school: trs
  cl: 8
  description:
    value: >-
      <p>This stout staff is made of wood and capped with steel. Elongated
      carvings of smiling beasts adorn its length. The staff of Curchanus
      functions as a +1/+1 quarterstaff and allows the use of the following
      spells.  • Charm animal (1 charge)  • Longstrider (1 charge)  • Monkey
      fish (1 charge)  • Speak with animals (1 charge)  • Greater longstrider (2
      charges)  If the staff's wielder has the Fleet feat, castings of greater
      longstrider, longstrider, or monkey fish from the staff are automatically
      extended, as the Extend Spell feat. If the wielder has the Animal Affinity
      feat, then charm animal or speak with animals spells cast from the staff
      are automatically extended, as the Extend Spell feat. This does not
      increase the spells' level or casting
      time.</p><h3>Requirements</h3><p>Craft Magic Arms and Armor, Craft Staff,
      charm animal, greater longstrider, longstrider, monkey fish, speak with
      animals</p>
