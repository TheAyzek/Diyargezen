name: Amorphous
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      8th</p><p><strong>Slot</strong> none; <strong>Price</strong> +4,500 gp;
      Armor with this special ability grants its wearer a +5 competence bonus on
      Escape Artist checks and to CMD against grapple combat maneuvers.
      Additionally, once per day on command, the wearer (along with any gear she
      is wearing) can take the form of viscous liquid that can pass through any
      space through which thick mud could reasonably flow. While using this
      ability, the wearer's speed is reduced by 10 feet, and she can take only
      move actions. The wearer can take this form for 1 minute or until she
      spends a move action to return to her normal form. <em>Amorphous
      </em>armor must be made primarily of leather, fabric, or another flexible,
      organic material.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>fluid form</em><sup>APG</sup>;
      <strong>Price</strong> 2,250 gp</p>
