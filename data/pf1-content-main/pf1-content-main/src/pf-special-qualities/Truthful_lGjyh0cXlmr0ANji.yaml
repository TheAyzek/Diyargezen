name: Truthful
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate abjuration <strong>CL</strong>
      11th</p><p><strong>Slot</strong> none; <strong>Price</strong> +2 bonus;
      This special ability can be placed only on a melee weapon. A <em>truthful
      </em>weapon unerringly pierces concealment provided by illusions, allowing
      the wielder to ignore the miss chance provided by illusions such as
      <em>blur, displacement</em>, and <em>invisibility</em>. Attacks with a
      <em>truthful </em>weapon against a creature affected by <em>mirror image
      </em>or a similar figment always attack the real target. This ability
      allows the wielder to ignore the miss chance, not to otherwise detect the
      target. When attacking an invisible creature, for instance, the wielder
      might still need to guess the target's location.<p>In addition to its
      other abilities, a <em>truthful </em>weapon functions as a special kind of
      <em>dispelling<sup>UE</sup></em> weapon against figments and shadow
      conjuration effects; if the wielder makes an attack against such an
      effect, the weapon automatically attempts to use the stored <em>dispel
      magic</em> against the illusion. If the attempt fails, the wielder is not
      aware of the attempt, and unless she disbelieves the illusion or the
      illusion's duration ends, the weapon continues to impart that it is
      storing <em>dispel magic</em> (though she is free to cast <em>dispel magic
      </em>on the weapon again if she has another reason to believe the effect
      was expended and failed to dispel an
      illusion).</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>greater dispel magic, true strike</em>;
      <strong>Price</strong> -</p>
