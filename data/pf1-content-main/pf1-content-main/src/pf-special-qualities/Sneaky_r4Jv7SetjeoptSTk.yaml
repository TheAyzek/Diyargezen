name: Sneaky
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate necromancy <strong>CL</strong>
      7th</p><p><strong>Slot</strong> none; <strong>Price</strong> +5,000 gp;
      This special ability can be placed only on a melee weapon. Once per day as
      a free action, the wielder of a <em>sneaky</em> weapon can designate a
      single foe within his melee reach as his prey. If the wielder has the
      sneak attack class feature, he adds his sneak attack damage to the next
      attack he makes against his prey, even if the wielder is not flanking and
      the target is not denied its Dexterity bonus to AC, as long as that attack
      is made before the end of the wielder's next turn. If the wielder is a
      rogue or slayer with the hunter's surprise talent, he can use that talent
      one additional time per
      day.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, <em>doom</em>; <strong>Price</strong> 2,500 gp</p>
