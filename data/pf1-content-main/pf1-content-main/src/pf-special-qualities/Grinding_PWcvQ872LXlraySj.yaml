    value: >-
      <p><strong>Aura</strong> faint transmutation <strong>CL</strong>
      5th</p><p><strong>Slot</strong> armor/shield quality;
      <strong>Price</strong> +1 bonus;</p><p>A shield or suit of armor with this
      special ability is covered with jagged burrs and razor-sharp serrations
      that saw and grind whenever the wearer is grappled or entangled. Any
      creature succeeding at a grapple combat maneuver check against the wearer
      takes damage equal to the armor or shield's enhancement bonus (with each
      successful check) as the barbs and blades bite into it. This special
      ability counts as armor spikes for the purpose of making attacks on the
      wearer's turn.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>keen edge</em>; <strong>Price</strong> +1
      bonus</p>
