name: Comfort
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint transmutation <strong>CL</strong>
      5th</p><p><strong>Slot</strong> armor quality; <strong>Price</strong>
      +5,000 gp;</p><p><em>Armor of comfort</em> sheds dirt and sweat as they
      accumulate, and remains as comfortable as weather-appropriate clothing
      regardless of environmental conditions. A suit of armor with this
      enhancement always looks immaculately clean, can be slept in as though it
      were light armor, and does not cause a penalty to the wearer's saving
      throws to resist the effects of extreme heat. In cold weather, it counts
      as cold-weather clothing. In addition, the armor's armor check penalty is
      reduced by 1 (to a minimum of
      0).</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, <em>endure elements</em>, <em>prestidigitation</em>;
      <strong>Price</strong> +2,500 gp</p>
