      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      7th</p><p><strong>Slot</strong> armor quality; <strong>Price</strong> +1
      bonus;</p><p>A <em>stanching </em>suit of armor helps stop the flow of b
      lood from the wearer's wounds, automatically tightening like a tourniquet
      in the appropriate places while also magically reducing the severity of
      the wound. <em>Stanching </em>armor reduces hit point damage, ability
      damage, or ability drain by an amount equal to its enhancement bonus if
      the damage or drain was from a bleed effect. The wearer also adds the
      armor's enhancement bonus to Constitution checks to become
      stable.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>stabilize</em>, <em>cure critical wounds </em>or
      <em>lesser restoration</em>; <strong>Price</strong> +1 bonus</p>
