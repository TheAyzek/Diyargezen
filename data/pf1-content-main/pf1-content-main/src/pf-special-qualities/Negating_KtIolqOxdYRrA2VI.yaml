name: Negating
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate abjuration <strong>CL</strong>
      5th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +2
      bonus;</p><p>A <em>negating </em>weapon briefly nullifies some forms of
      damage reduction when it damages a creature. Whenever a <em>negating
      </em>weapon damages a foe with DR/chaotic, DR/evil, DR/good, DR/lawful, or
      DR/magic, it reduces the value of that damage reduction by 5 points for 1
      round. For example, a <em>+1 negating lance </em>hitting a creature with
      DR 10/good and lawful reduces the creature's DR to 5/good and lawful. If
      the creature has a component to its damage reduction other than the
      alignment types listed above, that component is unaffected. Thus, if the
      <em>+1 negating lance </em>above hits a demon with DR 10/good and cold
      iron, it would leave the demon with DR 10/cold iron and 5/good for 1
      round. The effects of multiple <em>negating </em>weapons (or multiple hits
      from the same weapon) do not stack. This ability can only be placed on
      melee weapons.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>dispel chaos</em>, <em>evil</em>,
      <em>good</em>, or <em>law</em>; <strong>Price</strong> -</p>
