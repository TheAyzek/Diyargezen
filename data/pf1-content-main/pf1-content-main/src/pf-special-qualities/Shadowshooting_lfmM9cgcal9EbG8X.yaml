name: Shadowshooting
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate conjuration <strong>CL</strong>
      8th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1 bonus;
      This special ability can only be added to ranged projectile weapons
      (including slings and sling-like weapons). Black smoke constantly wafts
      from the firing mechanism of a <em>shadowshooting</em> weapon. A
      <em>shadowshooting</em> weapon never needs to be reloaded; after a shot is
      fired, this smoke immediately coalesces into the ammunition required to
      fire the weapon again. This doesn't prevent a <em>shadowshooting</em>
      weapon from firing ordinary projectiles appropriate to the
      weapon.<p>Ammunition created by this ability is only quasi-real, and the
      first time each round an opponent is hit by a piece of ammunition that
      this ability has created, it can attempt a Will saving throw to disbelieve
      (DC = 15 + the weapon's enhancement bonus). A failed Will saving throw
      means the weapon deals damage normally, while success means the weapon
      deals minimum damage against that opponent for 1
      round.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>reloading hands</em><sup>UC</sup>, <em>shadow
      weapon</em><sup>UM</sup>; <strong>Price</strong> -</p>
