name: Dispelling Burst
system:
  description:
    value: >-
      <p><strong>Aura</strong> strong abjuration <strong>CL</strong>
      12th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +2
      bonus;</p><p>A <em>dispelling burst </em>weapon functions like a
      <em>dispelling </em>weapon but may store <em>dispel magic </em>or
      <em>greater dispel magic</em>. In addition, these spells can be discharged
      as a free action when the wielder of a <em>dispelling burst </em>weapon
      confirms a critical hit. When the wielder does so, the bonus to the check
      made to dispel (including from dispelling strike, spell sunder, or sunder
      enchantment) increases by an amount equal to the weapon's enhancement
      bonus or the weapon's critical multiplier (whichever is higher).</p><p>If
      a <em>dispelling burst </em>weapon confirms a critical hit while it is not
      currently storing a <em>dispel magic </em>or <em>greater dispel magic</em>
      spell, yet if the wielder has either spell prepared (or is a spontaneous
      caster able to cast either spell), she may cast either spell into the
      weapon as a swift action and then immediately discharge it into the target
      as a free action.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>greater dispel magic</em>, creator must be
      a caster of at least 12th level; <strong>Price</strong> -</p>
