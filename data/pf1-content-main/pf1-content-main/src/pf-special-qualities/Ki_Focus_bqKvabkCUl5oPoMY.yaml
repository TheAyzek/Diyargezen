      bonus;</p><p>This special ability can be placed only on melee weapons. The
      magic weapon serves as a channel for the wielder's <em>ki</em>, allowing
      her to use her special <em>ki</em> attacks through the weapon as if they
      were unarmed attacks. These attacks include the monk's <em>ki</em> strike,
      quivering palm, and the Stunning Fist feat (including any condition that
      the monk can apply using this
      feat).</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
