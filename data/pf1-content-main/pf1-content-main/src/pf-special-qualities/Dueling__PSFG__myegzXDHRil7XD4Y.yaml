name: Dueling (PSFG)
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      7th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1
      bonus;</p><p>A <em>dueling weapon</em> bears magical enhancements that
      makes it particularly effective at performing certain combat maneuvers.
      When a<em> dueling weapon </em>is used to perform a combat maneuver that
      utilizes the weapon only (see below), it grants a luck bonus equal to
      twice its enhancement bonus on the CMB check made to carry out the
      maneuver. The <em>dueling weapon </em>also grants this same luck bonus to
      the wielder's CMD score against these types of combat maneuvers. These
      combat maneuvers include disarm and trip maneuvers, but not bull rush,
      grapple, or overrun maneuvers. If you're using the additional combat
      maneuvers in the <em>Advanced Player's Guide</em>, this also includes any
      dirty trick maneuvers that utilize the weapon, as well as reposition
      combat maneuvers, but not drag or steal combat maneuvers. Note that this
      luck bonus stacks with the weapon's enhancement bonus, which in and of
      itself adds to CMB checks
      normally.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>cat's grace</em>; <strong>Price</strong> -</p>
