      <p><strong>Aura</strong> strong enchantment <strong>CL</strong>
      13th</p><p><strong>Slot</strong> armor quality; <strong>Price</strong> +1
      bonus;</p><p>Armor with the <em>terrain-striding</em> special ability is
      attuned to a specific terrain when the armor is created, selected from
      rangers' favored terrains. The wearer of armor gains a 10-foot enhancement
      bonus to her speed while in the associated terrain, and the armor's armor
      check penalty does not apply to Acrobatics, Climb, and Stealth checks
      attempted in that terrain. The <em>terrain-striding</em> special ability
      can be applied only to medium
      armor.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>resistance</em>; <strong>Price</strong> +1
      bonus</p>
