      not get a saving throw to avoid catching fire, but can make a save each
      round on its turn to put out the fire. The <em>flaming </em>ability must
      be active for the weapon to set enemies on
      fire.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
