name: Distracting
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint enchantment <strong>CL</strong>
      5th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1 bonus;
      <p>Weapons with this special ability cause foes struck by them to have
      difficulty controlling their magic. Any time a creature that has been
      struck by a <em>distracting </em>weapon would have to succeed at a
      concentration check to complete a spell or use a special ability or item,
      the DC of that check increases by 5. This distraction lasts for 1 minute.
      Once a <em>distracting </em>weapon affects a creature in this way, that
      creature can't be affected by a <em>distracting </em>effect for 24 hours,
      though it can be affected by a <em>greater distracting
      </em>effect.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>qualm</em><sup>UC</sup>;
      <strong>Price</strong> -</p>
