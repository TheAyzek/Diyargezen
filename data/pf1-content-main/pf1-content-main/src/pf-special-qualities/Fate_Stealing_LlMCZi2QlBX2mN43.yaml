name: Fate-Stealing
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint necromancy <strong>CL</strong>
      5th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1 bonus;
      <p>This special ability can be placed only on melee weapons. When a
      <em>fate-stealing</em> weapon strikes a creature that possesses either
      grit or panache, the wielder can steal 1 grit point or panache point as a
      swift action. When the wielder steals a grit or panache point, she can
      regain 1 grit point or 1 panache point (if the wielder has any). The
      wielder can use a foe's grit to restore her own panache, or use a foe's
      panache to restore her own grit.</p><p>If the wielder attempts to use this
      ability against a foe that isn't a grit or panache user, or that currently
      has no points of grit or panache remaining, the wielder doesn't expend an
      action, and the attempt
      fails.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>vampiric touch</em>; <strong>Price</strong>
      -</p>
