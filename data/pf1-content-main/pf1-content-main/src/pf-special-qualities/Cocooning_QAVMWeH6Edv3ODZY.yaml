name: Cocooning
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      9th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1 bonus;
      <em>Cocooning</em> armor protects the wearer against planar hazards when
      she is defenseless, enveloping her in a thin, protective membrane. If the
      wearer falls unconscious on a plane other than her native plane, the armor
      grants her immunity to the harmful environmental effects of that plane,
      including toxicity, extreme temperatures, negative energy, and lack of
      air. This immunity lasts for as long as she remains
      unconscious.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>planar adaptation</em>;
      <strong>Price</strong> +1 bonus</p>
