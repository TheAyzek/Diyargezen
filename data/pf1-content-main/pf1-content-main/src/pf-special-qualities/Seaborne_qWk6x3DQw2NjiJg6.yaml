name: Seaborne
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      7th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +1
      bonus;</p><p>This special ability can only be placed on melee weapons. A
      <em>seaborne </em>weapon functions easily in watery environments. With the
      weapon in hand, the wielder gains a bonus on Swim checks equal to twice
      the weapon's enhancement bonus. In addition, the wielder does not take the
      normal penalties to attack and damage rolls imposed by being underwater,
      as if he were subject to the spell <em>freedom of
      movement</em>.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>freedom of movement</em>, <em>touch of the
      sea </em>(<em>Advanced Player's Guide</em>); <strong>Price</strong> -</p>
