name: Sensing
system:
  description:
    value: >-
      <p><strong>Aura</strong> strong divination <strong>CL</strong>
      14th</p><p><strong>Slot</strong> none; <strong>Price</strong> +3 bonus;
      <p>A set of <em>sensing </em>armor compensates when its wearer has been
      blinded, is in total darkness (as long as the wearer doesn't have
      darkvision or the see in darkness ability), or is in magical darkness (as
      long as the wearer doesn't have the see in darkness ability). When one of
      these conditions affects the wearer, <em>sensing armor</em> immediately
      grants its wearer blindsight with a 5-foot range and blindsense with a
      60-foot range. As soon as the wearer can see, the additional senses end.
      The wearer can't gain these abilities by closing her
      eyes.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, <em>true seeing</em>; <strong>Price</strong> +3 bonus</p>
