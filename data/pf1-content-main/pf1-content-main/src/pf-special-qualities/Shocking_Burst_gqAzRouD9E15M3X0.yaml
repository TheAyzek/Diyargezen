    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      10th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +2
      bonus;</p><p>A <em>shocking burst </em>weapon functions as a shock weapon
      that explodes with electricity upon striking a successful critical hit.
      The electricity does not harm the wielder. In addition to the extra
      electricity damage from the shock ability, a <em>shocking burst
      </em>weapon deals an extra 1d10 points of electricity damage on a
      successful critical hit. If the weapon's critical multiplier is x3, add an
      extra 2d10 points of electricity damage instead, and if the multiplier is
      x4, add an extra 3d10 points.<p>Even if the <em>shock </em>ability is not
      active, the weapon still deals its extra electricity damage on a
      successful critical
      hit.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, <em>call lightning </em>or <em>lightning bolt</em>;
      <strong>Price</strong> -</p>
