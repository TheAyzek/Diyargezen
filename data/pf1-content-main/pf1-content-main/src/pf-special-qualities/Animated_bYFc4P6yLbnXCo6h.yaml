name: Animated
system:
  description:
    value: >-
      <p><strong>Aura</strong> strong transmutation <strong>CL</strong>
      12th</p><p><strong>Slot</strong> shield quality; <strong>Price</strong> +2
      bonus;</p><p>As a move action, an <em>animated </em>shield can be loosed
      to defend its wielder on its own. For the following 4 rounds, the shield
      grants its bonus to the one who loosed it and then drops. While animated,
      the shield provides its shield bonus and the bonuses from all of the other
      shield special abilities it possesses, but it cannot take actions on its
      own, such as those provided by the <em>bashing </em>and <em>blinding</em>
      abilities. It can, however, use special abilities that do not require an
      action to function, such as <em>arrow deflection </em>and
      <em>reflecting</em>. While animated, a shield shares the same space as the
      activating character and accompanies the character who activated it, even
      if the character moves by magical means. A character with an <em>animated
      </em>shield still takes any penalties associated with shield use, such as
      armor check penalty, arcane spell failure chance, and nonproficiency. If
      the wielder who loosed it has an unoccupied hand, she can grasp it to end
      its animation as a free action. Once a shield has been retrieved, it
      cannot be animated again for at least 4 rounds. This special ability
      cannot be added to a tower
      shield.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>animate objects</em>; <strong>Price</strong> +2
      bonus</p>
