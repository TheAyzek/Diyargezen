    value: >-
      <p><strong>Aura</strong> moderate enchantment <strong>CL</strong>
      7th</p><p><strong>Slot</strong> none; <strong>Price</strong> +7,000 gp;
      This armor's ability functions only if its wearer has the panache class
      feature. When a melee attack made by an enemy within the wearer's melee
      reach would reduce the wearer to fewer than 0 hit points, the wearer can
      spend 1 panache point as an immediate action. This allows her to make a
      single melee attack against the creature that reduced her to 0 hit points
      or fewer. This occurs prior to the wearer falling unconscious or
      dead.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, <em>haste</em>; <strong>Price</strong> 3,500 gp</p>
