name: Slithering
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      11th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1 bonus;
      This special ability can be placed only on a melee weapon. A
      <em>slithering </em>weapon can bend and flex when swung at a target,
      allowing it to fit through narrow gaps and around difficult angles with
      greater ease and making the weapon difficult to strike. When a
      <em>slithering </em>weapon is used to attack a creature with cover, the
      target's cover bonus to Armor Class is halved. In addition, the wielder
      adds the weapon's enhancement bonus to her CMD against attempts to disarm
      or sunder her <em>slithering</em> weapon. If the wielder is squeezing in a
      narrow space, she takes only half the normal penalty on attack rolls with
      her <em>slithering
      </em>weapon.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>fluid form<sup>APG</sup></em>;
      <strong>Price</strong> -</p>
