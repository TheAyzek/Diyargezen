name: Martyring
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate conjuration <strong>CL</strong>
      9th</p><p><strong>Slot</strong> armor quality; <strong>Price</strong>
      +18,000 gp;</p><p>This armor allows the wearer to capitalize on her own
      injuries to heal her allies. Once per day as an immediate action, when an
      enemy confirms a critical hit against someone wearing <em>martyring
      </em>armor, the wearer can heal up to nine allies within 30 feet as if
      using the <em>mass cure light wounds </em>spell (1d8+9 hit points each).
      This special ability cannot be placed on armor that possesses an ability
      that reduces the chance of or negates a critical hit (such as the
      <em>fortification </em>special
      ability).</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>mass cure light wounds</em>;
      <strong>Price</strong> +9,000 gp</p>
