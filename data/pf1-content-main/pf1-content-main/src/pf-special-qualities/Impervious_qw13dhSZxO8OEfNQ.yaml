      <p><strong>Aura</strong>&nbsp;moderate
      transmutation&nbsp;<strong>CL</strong>&nbsp;7th</p><p><strong>Slot</strong>&nbsp;weapon
      quality;&nbsp;<strong>Price</strong>&nbsp;+3,000
      gp;&nbsp;<strong>Weight</strong>&nbsp;-</p><h3>Description</h3><p>An&nbsp;<em>impervious&nbsp;</em>weapon
      is warded from damage and decay. A metallic weapon cannot rust and a
      wooden weapon cannot rot or warp, even by magical or supernatural means.
      An&nbsp;<em>impervious</em>&nbsp;weapon gains double the normal bonus to
      its hardness and hit points for each point of its enhancement bonus. The
      break DC for an&nbsp;<em>impervious&nbsp;</em>weapon and the wielder's
      combat maneuver defense against sunder maneuvers against
      the&nbsp;<em>impervious</em>&nbsp;weapon each gain a bonus equal to twice
      the weapon's enhancement
      bonus.</p><h3>Construction</h3><p><strong>Requirements</strong>&nbsp;Craft
      Magic Arms and Armor,&nbsp;<em>fabricate</em>,&nbsp;<em>make
      whole</em>;&nbsp;<strong>Price</strong>&nbsp;+1,500 gp</p>
