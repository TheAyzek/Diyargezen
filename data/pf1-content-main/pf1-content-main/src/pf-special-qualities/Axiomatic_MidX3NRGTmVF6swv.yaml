name: Axiomatic
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      7th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +2
      bonus;</p><p>An <em>axiomatic </em>weapon is infused with lawful power. It
      makes the weapon law-aligned and thus bypasses the corresponding damage
      reduction. It deals an extra 2d6 points of damage against chaotic
      creatures. It bestows one permanent negative level (<em>Core Rulebook
      </em>562) on any chaotic creature attempting to wield it. The negative
      level remains as long as the weapon is in hand and disappears when the
      weapon is no longer wielded. This negative level cannot be overcome in any
      way (including <em>restoration</em> spells) while the weapon is
      wielded.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>order's wrath</em>, creator must be lawful;
      <strong>Price</strong> -</p>
