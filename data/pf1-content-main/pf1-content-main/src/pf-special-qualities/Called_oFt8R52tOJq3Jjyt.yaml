      <p><strong>Aura</strong> moderate conjuration <strong>CL</strong>
      9th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +1
      bonus;</p><p>A <em>called </em>weapon can be teleported to the wielder's
      hand as a swift action that does not provoke attacks of opportunity, even
      if the weapon is in the possession of another creature. This ability has a
      maximum range of 100 feet, and effects that block teleportation prevent
      the return of a <em>called </em>weapon. A <em>called </em>weapon must be
      in a creature's possession for at least 24 hours for this ability to
      function.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>teleport</em>; <strong>Price</strong> -</p>
