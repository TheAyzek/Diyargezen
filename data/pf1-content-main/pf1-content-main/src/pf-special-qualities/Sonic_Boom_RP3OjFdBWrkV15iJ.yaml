name: Sonic Boom
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      8th</p><p><strong>Slot</strong> none; <strong>Price</strong> +3 bonus;
      <p>This special ability can be placed only on firearms and firearm
      ammunition. Attacks with a <em>sonic boom</em> weapon deal an additional
      1d6 points of sonic damage to the target and 1d6 points of sonic damage to
      all creatures adjacent to the bullet's path within one range increment of
      the wielder, or adjacent to the cone of a scatter shot. Creatures that
      take sonic damage from the boom must succeed at a DC 16 Fortitude save or
      be deafened for 1
      minute.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>shout</em>; <strong>Price</strong> -</p>
