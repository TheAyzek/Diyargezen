name: Shadow Blending
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate illusion <strong>CL</strong>
      11th</p><p><strong>Slot</strong> none; <strong>Price</strong> +2 bonus;
      <p><em>Shadow blending</em> armor is drab and mutes any colors in its
      wearer's attire into dull grays. Attacks against the wearer in dim light
      have a 40% miss chance instead of the normal 20%. This ability does not
      grant total concealment; it only increases the miss chance. If the armor
      also has the <em>shadow</em>, <em>improved shadow</em>, or <em>greater
      shadow</em> armor special ability, the miss chance increases to
      50%.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, <em>shadow walk</em>; <strong>Price</strong> +2 bonus</p>
