    value: >-
      <p><strong>Aura</strong> evocation <strong>CL</strong>
      5th</p><p><strong>Slot</strong> armor quality; <strong>Price</strong>
      +3,000 gp;</p><p>Armor enhanced with the <em>mental focus</em> special
      ability grants its wearer a +2 enhancement bonus on concentration checks.
      If the wearer has the <em>mental focus</em><sup>OA</sup> occultist class
      feature, once per day he can also spend 1 hour attuning himself to the
      armor to gain 1 additional point of <em>mental focus</em>. This point of
      mental focus is lost if the armor is removed. The <em>mental focus</em>
      special ability can be applied only to medium
      armor.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>talismanic implement</em><sup>OA</sup>;
      <strong>Price</strong> 1,500 gp</p>
