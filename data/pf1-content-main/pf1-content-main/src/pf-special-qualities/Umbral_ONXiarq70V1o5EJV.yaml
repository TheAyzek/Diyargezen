name: Umbral
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      9th</p><p><strong>Slot</strong> none; <strong>Price</strong> +3 bonus;
      This special ability can be placed only on a melee weapon with a hilt or
      handle. An <em>umbral</em> weapon does not reflect any sources of ambient
      light and is perpetually cloaked in shadow. It is considered to have
      concealment for the purposes of attacks or effects directed at the weapon,
      such as combat maneuver checks made to disarm, steal<sup>APG</sup> or
      sunder it and <em>disintegrate</em> or <em>rusting grasp</em>. The wielder
      gains darkvision 30 feet while grasping the hilt or handle of the weapon,
      even if the weapon is not drawn.<p>Upon command, an <em>umbral</em> weapon
      radiates darkness in a 20-foot radius, causing illumination in the area to
      drop by one step (from bright light to normal light, normal light to dim
      light, or dim light to darkness). Due to the darkvision granted by the
      weapon, the wielder's vision is not impaired by darkness created by an
      umbral weapon. The darkness shed by an <em>umbral</em> weapon is
      considered a 2nd-level spell effect for the purpose of comparing its
      effect to the effects of magical light sources. This darkness suppresses
      light spells, but can't be used to counter or dispel them. The weapon must
      be drawn and in the wielder's hand to radiate darkness. The darkness ends
      immediately if the weapon is dropped, disarmed, sheathed, or otherwise
      stowed.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>darkness, darkvision</em>;
      <strong>Price</strong> -</p>
