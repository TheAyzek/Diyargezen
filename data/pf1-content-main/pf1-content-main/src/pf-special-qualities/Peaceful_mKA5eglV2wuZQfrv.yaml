    value: >-
      <p><strong>Aura</strong> moderate enchantment <strong>CL</strong>
      8th</p><p><strong>Slot</strong> none; <strong>Price</strong> +2
      bonus;</p><p>A creature that has taken nonlethal damage from a
      <em>peaceful</em> weapon becomes shaken for 1 round each time it deals
      lethal damage to another living creature. The duration stacks with
      multiple attacks, but this effect can't cause the affected creature to
      become frightened (even if it is affected by other fear effects). If the
      affected creature's nonlethal damage is completely healed, this prevents
      subsequent attacks from extending the duration of the shaken condition,
      but doesn't end the shaken condition from attacks already
      made.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, calm emotions, cure light wounds; <strong>Price</strong>
      -</p>
