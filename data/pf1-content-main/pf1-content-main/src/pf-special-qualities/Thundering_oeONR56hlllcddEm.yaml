    value: >-
      <p><strong>Aura</strong> faint necromancy <strong>CL</strong>
      5th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +1
      bonus;</p><p>A <em>thundering </em>weapon creates a cacophonous roar like
      abilities thunder whenever it strikes a target with a successful critical
      hit. The sonic energy does not harm the wielder. A <em>thundering
      </em>weapon deals an extra 1d8 points of sonic damage on a successful
      critical hit. If the weapon's critical multiplier is x3, add an extra 2d8
      points of sonic damage instead, and if the multiplier is x4, add an extra
      3d8 points of sonic damage. Subjects dealt critical hits by a
      <em>thundering</em> weapon must make a successful DC 14 Fortitude save or
      be deafened
      permanently.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>blindness/deafness</em>;
      <strong>Price</strong> -</p>
