name: Debilitating
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate necromancy <strong>CL</strong>
      7th</p><p><strong>Price</strong> +1 bonus;</p><p>A <em>debilitating</em>
      weapon has wicked ridges and gleams maliciously in any amount of light.
      Whenever a <em>debilitating</em> weapon is used to attack an opponent that
      is denied its Dexterity bonus to AC and hits, that opponent takes a -1
      penalty on attack rolls or to its AC for 1 round (wielder's choice). Any
      creature that is immune to sneak attacks is immune to this penalty, and
      any item or ability that protects a creature from critical hits also
      protects a creature from the penalties imposed by a <em>debilitating</em>
      weapon. Multiple hits from multiple <em>debilitating</em> weapons in the
      same round do not increase the penalty or its duration.</p><p>If the
      wielder has the debilitating injury (<em>Pathfinder RPG Pathfinder
      Unchained 22</em>) class ability, this special ability increases the
      penalty applied by the bewildered or disoriented effects by 1.
      </p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic Arms
      and Armor, <em>bestow curse</em>, creator must have 5 ranks in Heal;
      <strong>Price</strong> -</p>
