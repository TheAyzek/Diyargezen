    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      9th</p><p><strong>Slot</strong> none; <strong>Price</strong> +2 bonus;
      <p>A <em>heretical </em>weapon functions as a fervent weapon, but when
      wielded against a member of the religion to which it is attuned, the
      weapon's enhancement bonus is +2 better than its actual bonus. It also
      deals an extra 2d6 points of damage against followers of the designated
      religion.  This extra damage is not multiplied on a critical
      hit.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, <em>align weapon</em>, <em>weapon of
      awe</em><sup>APG</sup>, creator must be a member of the attuned religion;
      <strong>Price</strong> -</p>
