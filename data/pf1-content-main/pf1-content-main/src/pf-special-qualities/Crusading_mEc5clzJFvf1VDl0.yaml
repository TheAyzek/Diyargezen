      of Iomedae. As a swift action, a paladin or good warpriest wearing this
      armor can expend one use of the lay on hands or fervor ability to activate
      the armor's protective aura for 1 minute. This protective aura grants the
      wearer a +2 sacred bonus to AC. This bonus increases to +3 against evil
      dragons, evil outsiders, and
      undead.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
