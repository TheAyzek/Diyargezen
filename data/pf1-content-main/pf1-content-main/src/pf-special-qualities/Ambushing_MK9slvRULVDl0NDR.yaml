name: Ambushing
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      7th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1 bonus;
      This special ability can be placed only on ranged weapons. If the wielder
      spends at least 1 minute preparing a hiding place or when she uses the
      sniping rules (<em>Core Rulebook 106</em>), she adds the weapon's
      enhancement bonus as a competence bonus on Stealth checks. An
      <em>ambushing</em> weapon deals an additional 1d6 points of damage on a
      successful hit during a surprise round or against a creature that is
      unaware of the wielder's presence. This extra damage is precision damage;
      it is not multiplied on a critical hit but does stack with other forms of
      precision damage.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>cat's grace</em>, <em>invisibility</em>;
      <strong>Price</strong> -</p>
