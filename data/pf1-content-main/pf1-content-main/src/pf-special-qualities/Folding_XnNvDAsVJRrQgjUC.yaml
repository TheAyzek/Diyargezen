    value: >-
      <p><strong>Aura</strong> strong conjuration and transmutation
      <strong>CL</strong> 13th</p><p><strong>Slot</strong> shield quality;
      <strong>Price</strong> +1 bonus;</p><p>On command, a <em>folding</em>
      shield transforms to take on the form of another shield. As a move action,
      the wearer of a <em>folding</em> shield can change the shield from its
      current form into a buckler, heavy shield, or tower shield. The wearer of
      a <em>folding</em> shield must be proficient with the type of shield into
      which he wishes to transform the <em>folding</em>
      shield.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>instant summons, masterwork
      transformation</em><sup>UM</sup>; <strong>Price</strong> +1 bonus</p>
