name: Glorious
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      5th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +2
      bonus;</p><p>A <em>glorious </em>weapon glows with a dazzling light equal
      to a <em>daylight </em>spell when drawn. The wielder cannot suppress this
      light, though it can be temporarily suppressed by any effect that can
      suppress <em>daylight</em>. A <em>glorious </em>weapon flashes with light,
      and any creature the wielder attacks in melee is automatically dazzled
      until the beginning of the wielder's next turn. When a <em>glorious
      </em>weapon confirms a critical hit, the target is blinded until the
      beginning of the wielder's next turn (DC 14 Will negates); if the weapon's
      critical multiplier is greater than x2, this blindness lasts 1 additional
      round per multiple over x2. Only a melee weapon can have the <em>glorious
      </em>ability.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>blindness/deafness</em>,
      <em>daylight</em>, <em>flare</em>; <strong>Price</strong> -</p>
