name: Shrinking
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint transmutation <strong>CL</strong>
      5th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1,000 gp;
      This special ability can be placed only on melee weapons. When the wielder
      issues the command word, a <em>shrinking</em> weapon shrinks to the size
      of a standard dagger. While in this state, the weapon deals 1d4 points of
      damage but is more easily concealable. When the command word is spoken
      again, the weapon returns to its original
      state.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>shrink item</em>; <strong>Price</strong> +500
      gp</p>
