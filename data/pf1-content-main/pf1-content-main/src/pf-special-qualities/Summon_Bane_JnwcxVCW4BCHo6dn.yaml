name: Summon Bane
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate conjuration <strong>CL</strong>
      8th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1
      bonus;</p><p>A <em>summon bane</em> weapon excels against summoned
      creatures, including those summoned by conjuration (summoning) spells
      (such as <em>summon monster</em> and <em>summon nature's ally</em>
      spells), those summoned by conjuration (calling) spells (such as
      <em>planar ally</em> and <em>planar binding</em>), and eidolons. Against
      such summoned creatures, the weapon's enhancement bonus is +2 better than
      its normal bonus. It also deals an extra 2d6 points of damage against such
      foes.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, <em>summon monster IV</em> or <em>summon nature's ally
      IV</em>; <strong>Price</strong> -</p>
