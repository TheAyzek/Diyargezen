      bonus;</p><p>A <em>defending </em>weapon allows the wielder to transfer
      some or all of the weapon's enhancement bonus to his AC as a bonus that
      stacks with all others. As a free action, the wielder chooses how to
      allocate the weapon's enhancement bonus at the start of his turn before
      using the weapon, and the bonus to AC lasts until his next turn. This
      ability can only be placed on melee
      weapons.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
