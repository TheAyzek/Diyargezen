name: Liberating (UI)
system:
  description:
    value: >-
      <p><strong>Aura</strong> strong abjuration <strong>CL</strong>
      12th</p><p><strong>Slot</strong> none; <strong>Price</strong> +2 bonus;
      <p>This special ability can be placed only on a melee weapon. A
      <em>liberating </em>weapon grants its wielder a competence bonus equal to
      the weapon's enhancement bonus on Sense Motive checks, and this bonus is
      doubled when attempting a Sense Motive check to sense enchantment
      (<em>Core Rulebook 104</em>). This increased bonus also applies on
      Spellcraft checks to identify an enchantment spell as it is being cast.
      When a <em>liberating</em> weapon is used to attack a creature under
      direct mental control, such as from possession, charm effects, or
      compulsion effects like <em>command</em> and <em>dominate person</em>, the
      weapon deals nonlethal damage and grants the target a new saving throw
      against the effect, with a morale bonus on the save equal to the weapon's
      enhancement bonus. If this save succeeds, the effect is suppressed for 10
      minutes. If the target is affected by multiple such effects, the weapon's
      wielder chooses which effect the target can attempt a second save against.
      If the target fails this save, the effect is not suppressed and the target
      is immune to this effect of the same liberating weapon for 24
      hours.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>break enchantment, greater dispel magic</em>;
      <strong>Price</strong> -</p>
