name: Withstanding
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate enchantment <strong>CL</strong>
      10th</p><p><strong>Slot</strong> armor quality; <strong>Price</strong> +1
      bonus;</p><p>A suit of <em>withstanding</em> armor is inscribed with
      eldritch runes across its surface and decorated with the snarling
      countenances of specific creatures. Each suit of <em>withstanding</em>
      armor is tailored to a specific type of creature, chosen from the same
      list as the options for <em>bane</em> weapons. The wearer of this armor
      gains a +2 enhancement bonus on Knowledge checks related to the chosen
      type of creature, and when the wearer is struck by a sneak attack or a
      confirmed critical hit by creatures of the chosen type, there is a 50%
      chance that the critical hit or sneak attack is negated and damage is
      instead rolled normally. This does not stack with any other form of
      critical hit negation, such as that imposed by the <em>fortification</em>
      special ability. Only medium armor can be enchanted with the
      <em>withstanding</em> special
      ability.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>crushing despair</em>; <strong>Price</strong> +1
      bonus</p>
