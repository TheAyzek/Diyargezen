    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      7th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +2
      bonus;</p><p>An <em>unholy </em>weapon is imbued with unholy power. This
      power makes the weapon evil-aligned and thus bypasses the corresponding
      damage reduction. It deals an extra 2d6 points of damage against all
      creatures of good alignment. It bestows one permanent negative level on
      any good creature attempting to wield it. The negative level remains as
      long as the weapon is in hand and disappears when the weapon is no longer
      wielded. This negative level cannot be overcome in any way (including
      <em>restoration </em>spells) while the weapon is
      wielded.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>unholy blight</em>, creator must be evil;
      <strong>Price</strong> -</p>
