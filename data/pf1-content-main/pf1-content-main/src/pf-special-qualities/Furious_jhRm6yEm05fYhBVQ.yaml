name: Furious
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate enchantment <strong>CL</strong>
      8th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +1
      bonus;</p><p>This special ability can only be placed on melee weapons. A
      <em>furious </em>weapon serves as a focus for its wielder's anger. When
      the wielder is raging or under the effect of a <em>rage </em>spell, the
      weapon's enhancement bonus is +2 better than normal. If the wielder has a
      rage power that gives a skill bonus while raging (such as raging climber,
      raging leaper, or raging swimmer), the wielder gains an enhancement bonus
      to that skill whenever the weapon is wielded or held in her hand, even
      when she is not raging. This bonus is equal to the enhancement bonus of
      the weapon (and also includes the +2 if the wielder is
      raging).</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>rage</em>; <strong>Price</strong> -</p>
