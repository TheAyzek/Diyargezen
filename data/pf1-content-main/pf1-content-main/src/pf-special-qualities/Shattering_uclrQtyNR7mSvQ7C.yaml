name: Shattering
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      8th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +2
      bonus;</p><p>A <em>shattering </em>weapon functions as a <em>breaking
      </em>weapon that also explodes with a resounding crash upon striking a
      successful critical hit. In addition to the extra damage from the
      <em>breaking</em> ability, a <em>shattering </em>weapon deals an extra
      1d10 points of damage to objects and crystalline creatures on a successful
      critical hit. If the weapon's critical multiplier is x3, it deals an extra
      2d10 points of damage instead, and if the multiplier is x4, it deals an
      extra 3d10 points instead. When used against a crystalline creature, this
      damage stacks with <em>bane </em>and similar weapon special abilities
      (though the damage from the <em>breaking </em>ability still
      doesn't).<p>Even if the <em>breaking </em>ability is not active, the
      weapon still deals its extra damage on a successful critical hit. A
      <em>shattering </em>weapon ignores the hardness of objects with a hardness
      of 10 or lower.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>break</em> or <em>shatter</em>;
      <strong>Price</strong> -</p>
