name: Perilous Demesne, Minor
system:
  description:
    value: >-
      <p><strong>Type</strong> regional curse; <strong>Save</strong> Will DC
      13</p><p><strong>Effect</strong> Up to three hazards (see the Horror
      Environments section), each of CR 3 or less, imperil creatures in the
      area, though never with more than one hazard at a time. If a creature
      places this curse, it can choose the hazards. The hazards must be
      appropriate to the type of terrain (at the GM's discretion). Any of the
      hazards that are rendered safe reset themselves and become dangerous again
      at each midnight.</p>
