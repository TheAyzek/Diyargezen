name: Seasickness
system:
  description:
    value: >-
      <p>Characters unaccustomed to life on board ships run the risk of getting
      seasick. Such characters must succeed at a DC 5 Fortitude save or
      become&nbsp;<a>nauseated</a><a draggable="false"
      data-pack="pf1.conditions" data-id="1fkE2juoZHXjU90M">&nbsp;</a>for the
      rest of the day.</p><p>On the following day, the character is entitled to
      a new save. On a success, the character is sickened instead
      of&nbsp;<a>sickened</a>. On a failure, the&nbsp;<a>nauseated</a><a
      draggable="false" data-pack="pf1.conditions"
      data-id="1fkE2juoZHXjU90M">&nbsp;</a>condition persists for another
      day.</p><p>Each day thereafter, a character is entitled to another
      Fortitude save. Making two successful saves in a row allows the character
      to recover from seasickness for the duration of the voyage.</p><p>The DC
      of seasickness increases to 15 in rough weather, and those who succeed at
      a check to stave off seasickness for a day must make an additional save if
      conditions change for the worse.</p><p>Characters with 1 or more ranks in
      Profession (sailor) are never subject to seasickness.</p>
  subType: misc
  tags:
    - Maladies
    - Disease
type: feat
