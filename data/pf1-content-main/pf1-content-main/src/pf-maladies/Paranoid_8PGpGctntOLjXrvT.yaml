name: Paranoid
system:
  description:
    value: >-
      <p><strong>Type</strong> lesser madness; <strong>Save</strong> DC
      17</p><p><strong>Onset</strong> 2d6 days</p><p><strong>Effect</strong> The
      afflicted character gains a +2 bonus on saving throws against charm
      effects, but takes a -2 penalty on Bluff, Diplomacy, and Sense Motive
      checks. When the afflicted character attempts a Sense Motive check, the GM
      rolls the check in secret, and failure gives the afflicted character the
      impression that those whose motives he is trying to sense are plotting
      against him in some way. Lastly, any time the afflicted character tries to
      use or gain a benefit from the aid another action, or is the target of a
      beneficial spell or effect from an ally, he must succeed at a Will saving
      throw in order to take the aid another action or gain the benefit from the
      action, spell, or effect.</p><p><strong>Dormancy Effect</strong> The
      afflicted character gains a +2 bonus on saving throws against charm
      effects, but takes a -2 penalty on Bluff, Diplomacy, and Sense Motive
      checks.</p>A paranoid character is convinced that the world and society
      are conspiring toward his ruin. Typically those afflicted with paranoia
      are fidgety, argumentative, sullen, or extremely introverted.
