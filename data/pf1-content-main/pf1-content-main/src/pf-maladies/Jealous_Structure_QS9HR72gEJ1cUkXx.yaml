name: Jealous Structure
system:
  description:
    value: >-
      <p><strong>Type</strong> regional curse; <strong>Save</strong> Will DC
      19</p><p><strong>Effect</strong> A building can take on a life of its own
      if enough memories, fears, or other strong emotions become bound up in it.
      Such a building seeks to force residents to stay and either keep it
      company, serve it, protect it, or feed its unearthly hungers. The jealous
      structure is similar to a building-sized intelligent magic item of any
      evil alignment with Intelligence, Wisdom, and Charisma scores of 16, fast
      healing 5, and the ability to use the following spell-like abilities at
      caster level 11th a minimum of the number of times per day listed below:
      3/day-<em>animate objects</em> (furniture only), heightened <em>fear</em>
      (DC 19), heightened <em>telekinesis</em> (unattended objects only; DC 19);
      1/day-<em>guards and wards</em>.</p><p><strong>Cure</strong> A jealous
      structure can be put to rest only by a casting of <em>remove curse</em>
      followed by a casting of <em>hallow</em> over the entire structure.</p>
