name: Red Drip
system:
  description:
    value: >-
      <p><strong>Type</strong> disease (fungus),
      contact;&nbsp;<strong>Save</strong> Fortitude DC
      18;</p><p><strong>Onset</strong>&nbsp;1
      day;&nbsp;<strong>Frequency</strong>
      1/day</p><p><strong>Effect</strong>&nbsp;1d4 Dex damage and 1d2 Cha
      damage</p><p><strong>Cure</strong> 2 consecutive saves or amputation of
      infected hand</p><hr /><p>The first sign that a character has the red drip
      is an inflammation of the cuticles and hands. If left untreated, the
      cuticles begin to bleed and the hands swell until the nails blacken and
      fall off entirely. From there, the hands become a mess of oozing sores,
      festering and rotting. The infection then spreads up the arms and into the
      chest, killing the victim. Fortunately, this fungus generally only attacks
      one hand at a time, making amputation an effective cure.</p>
  subType: misc
  tags:
    - Maladies
    - Disease
type: feat
