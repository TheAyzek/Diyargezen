name: Brainworms
system:
  description:
    value: >-
      <p><strong>Type</strong>&nbsp;disease (parasite), contact or
      injury;&nbsp;<strong>Save</strong>&nbsp;Fortitude DC
      14;</p><p><strong>Onset</strong>&nbsp;1
      day;&nbsp;<strong>Frequency</strong>&nbsp;1/day</p><p><strong>Effect</strong>
      1d3 Wis damage and 1d3 Int damage, if damaged in combat, target must make
      a second Fort save or gain the&nbsp;<a>confused</a><a draggable="false"
      data-pack="pf1.conditions" data-id="VbG9W9dMz2jhgfCi">&nbsp;</a>condition
      for the duration of the encounter</p><p><strong>Cure</strong>&nbsp;2
      consecutive saves</p><hr /><p>Individually, these tiny parasites are
      almost invisible to the naked eye, yet en masse they&rsquo;re capable of
      taking down even the strongest animals. Entering the body through contact
      with an infected host or corpse (especially through open wounds), these
      thin worms quickly migrate to the brain and begin reproducing. The
      infestation is typically evidenced by a dulling of the senses and
      intellect and by erratic bouts of irrational rage toward other creatures
      during which the worms attempt to spread to other hosts through combat and
      injury. Examining the brain of a late-stage victim reveals a living carpet
      of thousands of tiny parasites.</p>
