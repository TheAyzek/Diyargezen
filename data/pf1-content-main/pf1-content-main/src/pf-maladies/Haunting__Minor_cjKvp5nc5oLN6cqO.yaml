name: Haunting, Minor
system:
  description:
    value: >-
      <p><strong>Type</strong> curse; <strong>Save</strong> Will DC
      13</p><p><strong>Effect</strong> The victim is haunted by a poltergeist.
      Once per day, the victim must attempt a Will save against the curse. If
      she succeeds, she takes a cumulative -1 penalty on future saving throws
      against the curse. If she fails, the poltergeist manifests within 300 feet
      and begins stalking her over the course of 2d12 hours, attempting to kill
      her when she appears to be most vulnerable. When combat begins, the victim
      automatically becomes shaken for 1 minute. The curse revives the destroyed
      poltergeist to haunt the victim again the next time she fails the saving
      throw against this curse.</p><p><strong>Cure</strong> In addition to the
      normal means for removing a curse, this one can be ended by determining
      the poltergeist's reason for existence and setting right whatever prevents
      it from resting in peace.</p>
