name: Demonplague
system:
  description:
    value: >-
      <p><strong>Type</strong> disease (injury or ingested);
      <strong>Save</strong> Fortitude DC 18;</p><p><strong>Onset</strong> 1
      day;&nbsp;<strong>Frequency</strong> 1/day</p><p><strong>Effect</strong>
      1d3 Con damage and 1d6 Wis damage, and victim is&nbsp;<a>fatigued</a><a
      draggable="false" data-pack="pf1.conditions"
      data-id="nku8mgRBNt0iXqzB">&nbsp;</a>if it takes any ability damage from
      the disease; certain creatures slain by demonplague rise as plagued
      beasts</p><p><strong>Cure</strong> 3 consecutive saves</p><hr /><p>Of the
      afflictions wreaked upon Sarkoris by the Worldwound and Deskari&rsquo;s
      host, the demonplague is perhaps the most insidious. This vile sickness
      spreads through water, affecting plant and animal life alike. In higher
      creatures, the demonplague causes madness and then death, but in animals
      and other unintelligent beasts, it continues beyond death, animating them
      as undead horrors called plagued beasts. The plague also twists and
      corrupts plant life&mdash; most of the hazardous plants detailed below are
      the results of normal plants becoming corrupted by the demonplague.</p>
  subType: misc
  tags:
