name: Cognitive Block
system:
  description:
    value: >-
      <p><strong>Type</strong> greater madness; <strong>Save</strong> DC
      20</p><p><strong>Onset</strong> immediate</p><p><strong>Effect</strong>
      The afflicted character can no longer speak or write and has difficulty
      concentrating. He can no longer use command word items, spell-trigger
      items, or spell-completion items. He takes a -10 penalty on concentration
      checks. He cannot cast spells with a verbal or thought component, and
      cannot prepare spells from a spellbook.</p><p><strong>Dormancy
      Effect</strong> The afflicted character takes a -4 penalty on
      concentration checks.</p>This affliction deprives a character of his
      concentration and his ability to speak, read, and write, though he can
      understand words he hears and can react to requests and commands as
      normal.
