name: Enteric Fever
system:
  description:
    value: >-
      <p><strong>Type</strong> disease (ingested); <strong>Save</strong>
      Fortitude DC 15;</p><p><strong>Onset</strong>
      3&nbsp;days;&nbsp;<strong>Frequency</strong>
      1/day</p><p><strong>Effect</strong> 1d4 Str damage, 1d4 Con damage
      and&nbsp;<a>sickened</a></p><p><strong>Cure</strong>
      &ndash;</p><hr><p>Enteric fever, also known as typhoid fever in temperate
      climates, breeds within contaminated foods, especially raw or undercooked
      meats. Symptoms include high fever, profuse sweating, and nausea. As the
      disease progresses, enteric fever victims become sickened and suffer from
      severe headaches, exhaustion, and abdominal pain, as rose-colored spots
      appear on the chest and abdominal areas. At that point, the victim is
      prone to dehydration and falls into bouts of delirium and nervous
      shakes.</p>
