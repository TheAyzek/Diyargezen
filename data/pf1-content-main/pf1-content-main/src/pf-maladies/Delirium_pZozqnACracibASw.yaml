  description:
    value: >-
      <p><strong>Type</strong> lesser madness; <strong>Save</strong> DC
      16</p><p><strong>Onset</strong> 1d4 days</p><p><strong>Effect</strong> -2
      penalty on Wisdom- and Intelligence-based checks; cannot take 10 or 20 on
      any check</p><p><strong>Dormancy Effect</strong> None</p>A character
      suffering from delirium experiences decreased cognition and attention.
      Often she has no real sense of this decline, or feels extremely frustrated
      when she does realize her concentration is impaired. Physical diseases,
      poisons, and ailments can also cause delirium.
