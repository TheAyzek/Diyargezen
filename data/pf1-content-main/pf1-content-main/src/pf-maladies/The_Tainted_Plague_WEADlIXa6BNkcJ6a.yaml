name: The Tainted Plague
system:
  description:
    value: >-
      <p><strong>Type</strong> disease (contact); <strong>Save</strong>
      Fortitude DC 15 (see description);</p><p><strong>Onset</strong>&nbsp;1
      day;&nbsp;<strong>Frequency</strong>&nbsp;1/day</p><p><strong>Effect</strong>&nbsp;1d6
      Con damage and 1d6 Wis damage</p><p><strong>Cure</strong>&nbsp;2
      consecutive saves</p><hr /><p>Even in the absence of ravening abyssal
      hordes, the Worldwound causes a supernatural disease called the tainted
      plague. Those exposed to the Worldwound or creatures native to it
      (including creatures already suffering ability damage from the disease)
      must make a DC 15 Fortitude save once per day or become infected. Those
      reduced to 0 Wisdom are driven mad by the mind-bending horrors they have
      witnessed. Those reduced to 0 Constitution perish, their bodies rotting
      from the inside out and dissolving within 24 hours into primordial chaos
      matter.</p><p>Creatures that do not need to breathe gain a +2 bonus on
      saves made to resist the tainted plague, but any creature eating or
      drinking anything from within the Worldwound must save immediately at a
      suffers a &ndash;5 penalty unless&nbsp;<a>purify food and drink</a><a
      draggable="false" data-pack="pf1.spells"
      data-id="xi1uouy7qlpfaqlr">&nbsp;</a>is first used.</p>
  subType: misc
  tags:
