name: Hallucination
system:
  description:
    value: >-
      <p><strong>Type</strong> lesser madness; <strong>Save</strong> DC
      14</p><p><strong>Onset</strong> 2d6 days</p><p><strong>Effect</strong> -4
      penalty on any Will saving throw against or to disbelieve illusions, and
      illusions of things that are not there (see below)</p><p><strong>Dormancy
      Effect</strong> The afflicted character takes a -2 penalty on Will saving
      throws against or to disbelieve illusions.</p><p>Hallucinations can affect
      all of the senses, but some of the most potentially debilitating are
      auditory hallucinations, where the afflicted character hears voices
      talking in his head, and visual hallucinations, where the afflicted
      character sees things that aren't there. Most hallucinations are
      intermittent and produce a muddling of reality.</p>
