name: Hunt of the Bogeyman
system:
  description:
    value: >-
      <p><strong>Type</strong> curse; <strong>Save</strong> Will DC
      19</p><p><strong>Effect</strong> The victim is hunted by a bogeyman. Once
      per day, the victim must attempt a Will save against the curse. If he
      succeeds, he takes a cumulative -1 penalty on future saving throws against
      the curse. If he fails, a bogeyman is called within 1 mile and begins
      stalking him over the course of 2d12 hours, attempting to kill him when he
      appears to be most vulnerable. When combat begins with the bogeyman, the
      victim automatically becomes shaken for 1 minute. The curse revives the
      slain bogeyman to hunt the victim again the next time he fails the saving
      throw against this curse.</p><p><strong>Cure</strong> Only a <em>limited
      wish</em>, <em>miracle</em>, or <em>wish</em> can free the hunted.</p>
