name: Psychosomatic Loss
system:
  description:
    value: >-
      <p><strong>Type</strong> greater madness; <strong>Save</strong> DC
      20</p><p><strong>Onset</strong> immediate</p><p><strong>Effect</strong>
      The afflicted character becomes blinded or deafened, loses another special
      sense (like scent or blindsense), loses the use of limbs, or loses a
      special movement speed (like a fly or swim speed). The GM chooses how the
      psychosomatic loss manifests.</p><p><strong>Dormancy Effect</strong>
      None</p>While there is nothing physically wrong with the afflicted
      character, some kind of mental trauma has forced her brain to shut down
      sensory or motor systems. Furthermore, magical effects that typically
      remove these conditions (such as <em>remove blindness/ deafness</em>) have
      no effect on this madness; the madness must be cured in order to regain
      the senses or motor skills.
