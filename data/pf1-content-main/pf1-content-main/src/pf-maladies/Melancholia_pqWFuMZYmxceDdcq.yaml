name: Melancholia
system:
  description:
    value: >-
      <p><strong>Type</strong> lesser madness; <strong>Save</strong> DC
      14</p><p><strong>Onset</strong> 1d4 days</p><p><strong>Effect</strong> -2
      penalty on initiative checks, and morale bonuses are halved (minimum
      +0)</p><p><strong>Dormancy Effect</strong> None</p>A character suffering
      from melancholia struggles with severe pessimism and can often be slow to
      respond to threats and events going on around him. He can seem quiet and
      withdrawn, and his sense of enthusiasm is dulled. In extreme cases, a
      character suffering from melancholia becomes entirely introverted and
      utterly withdrawn, even to the point of near catatonia.
