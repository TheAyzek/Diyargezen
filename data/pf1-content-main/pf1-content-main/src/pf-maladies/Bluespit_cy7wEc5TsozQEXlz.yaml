name: Bluespit
system:
  description:
    value: >-
      <p><strong>Type</strong> disease (inhaled);
      <strong>Save</strong>&nbsp;Fortitude DC
      14;</p><p><strong>Onset</strong>&nbsp;1
      hour;&nbsp;<strong>Frequency</strong>&nbsp;1/day</p><p><strong>Effect</strong>
      1d6 nonlethal damage and&nbsp;<a>fatigued</a>. The fatigue and nonlethal
      damage cannot be cured while the disease remains. This fatigue does not
      stack with itself to produce exhaustion, but does stack with other sources
      of fatigue. A victim that accumulates sufficient damage to fall
      <a>unconscious </a>while infected with bluespit begins to suffocate.
      Despite being&nbsp;<a draggable="false" data-pack="pf1.conditions"
      data-id="bj36eCfZGJG5AGTQ">unconscious</a>, the victim is considered to be
      holding its breath rather than immediately progressing to negative hit
      points and death.</p><p><strong>Cure</strong>&nbsp;2 consecutive
      saves</p><hr /><p>This bacterial infection thrives in avian and mammalian
      lungs. The name is derived from the blue-tinged sputum coughed up by
      victims&mdash;at least until they finally keel over.</p>
  subType: misc
  tags:
    - Maladies
