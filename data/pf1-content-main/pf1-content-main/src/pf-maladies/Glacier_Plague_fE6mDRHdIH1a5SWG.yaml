name: Glacier Plague
system:
  description:
    value: >-
      <p><strong>Type</strong> disease (contact or injury);
      <strong>Save</strong> Fortitude DC 15;</p><p><strong>Onset</strong> 1
      day;&nbsp;<strong>Frequency</strong> 1/day</p><p><strong>Effect</strong>
      1d6 points of Dex damage and target is&nbsp;<a>exhausted</a>, its speed is
      reduced by half, and it is unable to speak</p><p><strong>Cure</strong> 2
      consecutive saves</p><hr /><p>Known to take root in places long buried by
      supernatural cold, this affliction infects ruins and deep forests
      throughout Irrisen. It slowly freezes creatures from the inside out
      without dealing cold damage, so sufferers simply feel the weariness and
      fatigue of exerting themselves in a cold environment. The affliction
      reduces an affected creature&rsquo;s range of movement and acts in many
      ways like very gradual petrification. A sufferer is unable to speak, is
      severely slowed, and takes Dexterity damage; if the victim&rsquo;s
      Dexterity score drops below 5, it is unable to move at all. Creatures
      suffering from this plague don&rsquo;t die from it, but it often strands
      them out in the cold where they die from exposure.</p>
  subType: misc
  tags:
    - Maladies
    - Disease
type: feat
