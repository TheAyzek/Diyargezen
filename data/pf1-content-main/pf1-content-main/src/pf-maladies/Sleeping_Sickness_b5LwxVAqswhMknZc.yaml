name: Sleeping Sickness
system:
  description:
    value: >-
      <p><strong>Type</strong>&nbsp;disease (parasite),
      injury;&nbsp;<strong>Save</strong>&nbsp;Fortitude DC
      14;</p><p><strong>Onset</strong> 1d2 days;&nbsp;<strong>Frequency</strong>
      1/day</p><p><strong>Effect</strong> 1d4 Wis damage and target
      is&nbsp;<a>fatigued</a></p><p><strong>Cure</strong> 2 consecutive saves or
      arsenic (see text)</p><hr /><p>This parasitic affliction is spread by
      flying insects injecting tiny parasites into the victim&rsquo;s
      bloodstream and inducing fever, headache, joint pain, swelling of glands
      in the back and neck, and most notably fatigue. The disease gradually
      infects the brain, causing confusion, reduced coordination, difficulty
      keeping track of time, and insomnia. The best cure for this disease is
      dosing the patient with the poison arsenic if the patient survives,
      there&rsquo;s a cumulative 30% chance that the disease is immediately
      cured.</p>
