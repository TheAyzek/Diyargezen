name: Endless Night
system:
  description:
    value: >-
      <p><strong>Type</strong> regional curse; <strong>Save</strong> Will DC
      22</p><p><strong>Effect</strong> Nonmagical light and magical light
      sources that produce normal light create only dim light in the cursed
      area, and even direct sunlight leads to only an ambient dim light in the
      area (similar to a full moon). Twilight and night are always dark.
      Creatures harmed or weakened by daylight can move about during the day in
      this area and the only impairment they take from the dimmed sunlight is
      that they become dazzled in its area. Plant growth in the area is stunted,
      as per the stunt growth usage of <em>diminish plants</em>. Any spellcaster
      attempting to cast <em>daylight</em> or a spell that creates true daylight
      or bright light in the area fails unless she succeeds at a Will saving
      throw against the curse. Success leads to normal light, rather than bright
      light.</p><p><strong>Cure</strong> An endless night can be lifted only by
      successfully casting <em>remove curse</em> followed by <em>sunburst</em>
      at noon on a clear day.</p>
