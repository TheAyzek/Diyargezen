name: Perilous Demesne, Greater
system:
  description:
    value: >-
      <p><strong>Type</strong> regional curse; <strong>Save</strong> Will DC
      19</p><p><strong>Effect</strong> As per major perilous demesne, except up
      to six hazards, each of CR 10 or less, imperil creatures in the area. The
      hazards are arranged so that if any are encountered together, the
      encounter's effective CR from hazards must be no more than 11 (for
      instance, two CR 9 hazards could be encountered
      together).</p><p><strong>Cure</strong> <em>Remove curse</em> removes a
      greater perilous demesne only if followed by a casting of <em>hallow</em>
      at the effect's center.</p>
