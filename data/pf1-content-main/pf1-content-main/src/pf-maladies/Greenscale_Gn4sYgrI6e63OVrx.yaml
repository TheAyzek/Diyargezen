name: Greenscale
system:
  description:
    value: >-
      <p><strong>Type</strong> disease (injury); <strong>Save</strong> Fortitude
      DC 15;</p><p><strong>Onset</strong> 1d6
      days;&nbsp;<strong>Frequency</strong> 1/week</p><p><strong>Effect</strong>
      1d2 Cha damage and 1d2 Dex damage, target must make a second Fort save or
      1 point of the Cha damage is drain instead</p><p><strong>Cure</strong> 2
      consecutive saves</p><hr /><p>This disgusting disease causes patches of
      skin to harden and crack, weeping greenish pus and covering the body with
      putrid, scale-like patterns. The disease is most commonly contracted
      through injury or other blood-to-blood contact with an infected creature,
      though certain carrion eaters of the jungle particularly birds have been
      known to play host to the disease without themselves suffering from
      it.</p>
