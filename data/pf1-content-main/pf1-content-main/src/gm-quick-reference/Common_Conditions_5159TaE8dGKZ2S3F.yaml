        /><p><strong>Blinded</strong>: Creature takes a –2 penalty to AC, loses
        Dex bonus to AC, and takes a –4 penalty on most Str- and Dex-based skill
        checks and on opposed Perception skill checks. All opponents are
        considered to have total concealment (50% miss chance) against the
        blinded character. Creatures must make a DC 10 Acrobatics skill check to
        move faster than half speed or fall prone.
        </p><p><strong>Broken</strong>: Weapons suffer a –2 penalty on attack
        and damage rolls and only score a critical hit on a natural 20 and only
        deal ×2 damage. Armor and shields grant half AC bonus and double armor
        check penalty. Broken wands or staves use twice as many charges.
        </p><p><strong>Confused</strong>:</p><table><thead><tr><td>Result</td><td>Action</td></tr></thead><tbody><tr><td>01–25</td><td>Act
        normally</td></tr><tr><td>26–50</td><td>Babble for one
        round</td></tr><tr><td>51–75</td><td>Deal 1d8 + Str damage to
        self</td></tr><tr><td>76–100</td><td>Attack nearest
        creature</td></tr></tbody></table><p><strong>Entangled</strong>: No
        movement if bonds are anchored, otherwise move at half speed. Creature
        takes a –2 penalty on all attack rolls and a –4 penalty to Dex. Must
        make concentration check to cast spells.
        </p><p><strong>Exhausted</strong>: Creature moves at half speed. –6
        penalty to Str and Dex. Rest 1 hour to become fatigued.
        </p><p><strong>Fatigued</strong>: Creature cannot run or charge. –2
        penalty to Str and Dex. Rest 8 hours to remove.
        </p><p><strong>Frightened</strong>: As shaken, except creature must flee
        from source.</p><p><strong>Grappled</strong>: Creature cannot move or
        take action that requires 2 hands. –4 penalty to Dex. –2 penalty to
        attacks and combat maneuvers (except checks made to escape). Must make
        concentration check to cast spells. Cannot take attacks of opportunity.
        </p><p><strong>Nauseated</strong>: Creature can only take a move action
        and cannot attack, cast spells, or concentrate.
        </p><p><strong>Panicked</strong>: As frightened, except creature drops
        held items.</p><p><strong>Paralyzed</strong>: Creature's Str and Dex
        reduced to 0. Fliers using wings fall. Creature is helpless.
        </p><p><strong>Pinned</strong>: As grappled, except creature is f
        lat-footed, takes a –4 penalty to AC, and can only take verbal or mental
        actions (except checks made to escape).</p><p><strong>Shaken</strong>:
        Creature takes a –2 penalty on all attack rolls, saving throws, skill
        checks, and ability checks.</p><p><strong>Sickened</strong>: Creature
        takes a –2 penalty on all attack rolls, weapon damage rolls, saving
        throws, skill checks, and ability checks.
        </p><p><strong>Staggered</strong>: Creature can only take a move action
        or standard action (plus swift and immediate).
        </p><p><strong>Stunned</strong>: Creature cannot take actions, drops
        everything held, takes a –2 penalty to AC, and loses its Dex bonus to AC
        (if any).</p>
