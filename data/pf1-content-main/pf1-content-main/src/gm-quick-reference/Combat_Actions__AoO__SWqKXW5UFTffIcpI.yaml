    text:
      content: >-
        <div><h1>Actions in Combat</h1><table><caption>
        </caption><thead><tr><th>Standard Actions</th><th>Provokes an Attack of
        Opportunity<sup>1</sup></th></tr></thead><tbody><tr><td>Attack
        (melee)</td><td>No</td></tr><tr><td>Attack
        (ranged)</td><td>Yes</td></tr><tr><td>Attack
        (unarmed)</td><td>Yes</td></tr><tr><td>Activate a magic item other than
        a potion or oil</td><td>No</td></tr><tr><td>Aid
        another</td><td>Maybe<sup>2</sup></td></tr><tr><td>Cast a spell (1
        standard action casting time)</td><td>Yes</td></tr><tr><td>Channel
        energy</td><td>No</td></tr><tr><td>Concentrate to maintain an active
        spell</td><td>No</td></tr><tr><td>Dismiss a
        spell</td><td>No</td></tr><tr><td>Draw a hidden weapon (see Sleight of
        Hand skill)</td><td>No</td></tr><tr><td>Drink a potion or apply an
        oil</td><td>Yes</td></tr><tr><td>Escape a
        grapple</td><td>No</td></tr><tr><td>Feint</td><td>No</td></tr><tr><td>Light
        a torch with a tindertwig</td><td>Yes</td></tr><tr><td>Lower spell
        resistance</td><td>No</td></tr><tr><td>Read a
        scroll</td><td>Yes</td></tr><tr><td>Ready (triggers a standard
        action)</td><td>No</td></tr><tr><td>Stabilize a dying friend (see Heal
        skill)</td><td>Yes</td></tr><tr><td>Total
        defense</td><td>No</td></tr><tr><td>Use extraordinary
        ability</td><td>No</td></tr><tr><td>Use skill that takes 1
        action</td><td>Usually</td></tr><tr><td>Use spell-like
        ability</td><td>Yes</td></tr><tr><td>Use supernatural
        ability</td><td>No</td></tr><tr><th>Move Actions</th><th>Attack of
        Opportunity<sup>1</sup></th></tr><tr><td>Move</td><td>Yes</td></tr><tr><td>Control
