        Opportunity<sup>1</sup></th></tr><tr><td>Full
        attack</td><td>No</td></tr><tr><td>Charge<sup>4</sup></td><td>No</td></tr><tr><td>Deliver
        coup de grace</td><td>Yes</td></tr><tr><td>Escape from a
        net</td><td>Yes</td></tr><tr><td>Extinguish
        flames</td><td>No</td></tr><tr><td>Light a
        torch</td><td>Yes</td></tr><tr><td>Load a heavy or repeating
        crossbow</td><td>Yes</td></tr><tr><td>Lock or unlock weapon in locked
        gauntlet</td><td>Yes</td></tr><tr><td>Prepare to throw splash
        weapon</td><td>Yes</td></tr><tr><td>Run</td><td>Yes</td></tr><tr><td>Use
        skill that takes 1 round</td><td>Usually</td></tr><tr><td>Use a touch
        spell on up to six
        friends</td><td>Yes</td></tr><tr><td>Withdraw<sup>4</sup></td><td>No</td></tr><tr><th>Free
        Actions</th><th>Attack of Opportunity<sup>1</sup></th></tr><tr><td>Cease
        concentration on a spell</td><td>No</td></tr><tr><td>Drop an
        item</td><td>No</td></tr><tr><td>Drop to the
        floor</td><td>No</td></tr><tr><td>Prepare spell components to cast a
        spell<sup>5</sup></td><td>No</td></tr><tr><td>Speak</td><td>No</td></tr><tr><th>Swift
        Actions</th><th>Attack of Opportunity<sup>1</sup></th></tr><tr><td>Cast
        a quickened spell</td><td>No</td></tr><tr><th>Immediate
        Actions</th><th>Attack of Opportunity<sup>1</sup></th></tr><tr><td>Cast
        feather fall</td><td>No</td></tr><tr><th>No Action</th><th>Attack of
        Opportunity<sup>1</sup></th></tr><tr><td>Delay</td><td>No</td></tr><tr><td>5-foot
        step</td><td>No</td></tr><tr><th>Action Type Varies</th><th>Attack of
        Opportunity<sup>1</sup></th></tr><tr><td>Perform a combat
        maneuver<sup>6</sup></td><td>Yes</td></tr><tr><td>Use
        feat<sup>7</sup></td><td>Varies</td></tr></tbody></table></div><p><sup>1</sup>
        Regardless of the action, if you move out of a threatened square, you
        usually provoke an attack of opportunity. This column indicates whether
        the action itself, not moving, provokes an attack of opportunity.<br
        /><sup>2</sup> If you aid someone performing an action that would
        normally provoke an attack of opportunity, then the act of aiding
        another provokes an attack of opportunity as well.<br /><sup>3</sup> If
        you have a base attack bonus of +1 or higher, you can combine one of
        these actions with a regular move. If you have the Two-Weapon Fighting
        feat, you can draw two light or one-handed weapons in the time it would
        normally take you to draw one.<br /><sup>4</sup> May be taken as a
        standard action if you are limited to taking only a single action in a
        round.<br /><sup>5</sup> Unless the component is an extremely large or
        awkward item.<br /><sup>6</sup> Some combat maneuvers substitute for a
        melee attack, not an action. As melee attacks, they can be used once in
        an attack or charge action, one or more times in a full-attack action,
        or even as an attack of opportunity. Others are used as a separate
        action.<br /><sup>7</sup> The description of a feat defines its
        effect.</p><h1>Combat Options
