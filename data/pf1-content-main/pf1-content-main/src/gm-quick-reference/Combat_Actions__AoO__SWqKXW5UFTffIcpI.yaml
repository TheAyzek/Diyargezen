        active spell</td><td>No</td></tr><tr><td>Draw a
        weapon<sup>3</sup></td><td>No</td></tr><tr><td>Load a hand crossbow or
        light crossbow</td><td>Yes</td></tr><tr><td>Open or close a
        door</td><td>No</td></tr><tr><td>Mount/dismount a
        steed</td><td>No</td></tr><tr><td>Move a heavy
        object</td><td>Yes</td></tr><tr><td>Pick up an item (see
