    text:
      content: >-
        <p><strong>The Trumpet</strong> (lawful good, Constitution) is a
        declaration of power. This archon is an aggressive force who wades into
        the direst situations without hesitation in the cause of right.
        Misaligned, it suggests the motives aren't noble, bringing injury and
        crumbling strength. It is a card that grants all or nothing at
        all.</p><img
