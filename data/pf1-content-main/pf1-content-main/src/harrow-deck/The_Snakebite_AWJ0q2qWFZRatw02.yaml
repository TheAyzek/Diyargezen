    text:
      content: >-
        <p><strong>The Snakebite</strong> (chaotic evil, Intelligence) is a
        vile, poisoned weapon. Poison takes many forms - not all of them
        physical. The poison on the assassin's blade represents the death of
        ideas and freedom, as well as the ability to turn friends against each
        other or poison the minds of the virtuous. Misaligned, this card can
        mean a mental leap, a new friendship, or a discovery.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Snakebite.webp"
        width="300" height="494" />
