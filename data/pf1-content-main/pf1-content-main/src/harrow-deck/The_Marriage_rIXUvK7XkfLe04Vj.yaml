    text:
      content: >-
        <p><strong>The Marriage</strong> (lawful neutral, Charisma) can be a
        union of people, ideas, kingdoms, or other distinct things. The progeny
        of fire and water shows that a union might bring forth new power from
        both parties, or it might be a ruinous joining of that which should
        never have been united. Once wedded, the two cannot be parted. This is
        the card of permanent change.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Marriage.webp"
