    text:
      content: >-
        <p><strong>The Hidden Truth</strong> (lawful good, Intelligence)
        symbolizes the ability to see past the obvious and the banal to a
        greater truth within. Sometimes this discovery is an esoteric one,
        sometimes it is a literal find, such as an item revealed within a room.
        Regardless, it is a card with the power to reveal secrets. Misaligned,
        it can mean a secret being revealed to the subject's detriment.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Hidden%20Truth.webp"
        width="300" height="494" />
