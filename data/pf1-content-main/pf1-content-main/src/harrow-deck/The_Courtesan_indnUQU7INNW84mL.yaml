        <p><strong>The Courtesan</strong> (chaotic neutral, Charisma) is the
        card of political intrigue. Her mask embodies the social niceties that
        must be followed. If it slips, negotiations can take an unexpected turn.
        The card can also indicate a woman of power who shapes events. How she
        is treated decides the outcome of the situation.</p><img
