    text:
      content: >-
        <p><strong>The Teamster</strong> (neutral, Constitution) is a driving
        external force that keeps the subject going, no matter what. This force
        can be physical or mental, as a person who exhorts others to continue on
        when she has no more strength to give. The force can be for good or ill
        but cannot be ignored. The half-orc depicted is leading a life of
        constant toil, but for his own betterment.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Teamster.webp"
        width="300" height="494" />
