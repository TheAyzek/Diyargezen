    text:
      content: >-
        <p><strong>The Beating</strong> (neutral evil, Strength) signifies
        coming under attack from all sides, but it can also indicate the
        dissolution of the self - mentally. Whether the strength is of the flesh
        or the mind, it dissolves under the relentless attack. Misaligned, this
        card suggests that during the assault, undiscovered strength is
        found.</p><img
