        <p><strong>The Bear</strong> (neutral, Strength) is pure strength.
        People often make the mistake of thinking The Bear can be tamed or
        trained. When someone believes he has The Bear under control, that
        person eventually learns the error of his ways. Brute force might be
        required here, but the consequences of its use might be severe.</p><img
