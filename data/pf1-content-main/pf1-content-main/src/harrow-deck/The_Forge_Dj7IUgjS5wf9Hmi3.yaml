      content: >-
        <p><strong>The Forge</strong> (lawful neutral, Strength) evokes strength
        through great diversity. The blacksmith represents those who can survive
        the mephits' trial by fire, but The Forge's fire is so strong it burns
        many to cinders instead. This card often represents a dangerous event
        that requires many sources of strength to overcome.</p><img
