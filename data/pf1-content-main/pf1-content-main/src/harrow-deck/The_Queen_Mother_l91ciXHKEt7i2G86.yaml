    text:
      content: >-
        <p><strong>The Queen Mother</strong> (lawful neutral, Wisdom) is
        knowledge personified. The formian knows all but does not reveal
        anything to anyone who does not show her proper worship. She is fond of
        the powerless and the underclasses, for they serve her when the more
        powerful refuse. She represents the need to become part of a society, or
        to bow before those who know more than you.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Queen%20Mother.webp"
        width="300" height="494" />
