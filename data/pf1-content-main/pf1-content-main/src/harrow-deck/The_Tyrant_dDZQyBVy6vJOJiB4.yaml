    text:
      content: >-
        <p><strong>The Tyrant</strong> (lawful evil, Charisma) indicates a ruler
        who is a blight upon those ruled. The dragon might indicate a monarch,
        overseer, or head of a household. Whoever this person is, he does harm
        to those over whom he holds sway, whether he realizes it or not.
        Misaligned, this card might indicate a tyrant revealed or
        dethroned.</p><img
