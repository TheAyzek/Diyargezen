      content: >-
        <p><strong>The Fiend</strong> (lawful evil, Strength) depicts a devil
        swallowing innocents. It can indicate the deaths of many in a great
        calamity or, if misaligned, the salvation from the same calamity. The
        Fiend can also indicate that some sort of dark and intelligent creature
        is in the area, endangering the populace.</p><img
