    text:
      content: >-
        <p><strong>The Twin</strong> (neutral, Charisma) signals duality of
        purpose or identity. This doppelganger can also mean indecision, as a
        person or group wavers between very different options. It can also mean
        divided loyalties abound. The card makes a harrower wary, as it can also
        mean the entire spread has a hidden or reversed meaning.</p><img
