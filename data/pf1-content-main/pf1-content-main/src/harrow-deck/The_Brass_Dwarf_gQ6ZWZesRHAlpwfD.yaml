      content: >-
        <p><strong>The Brass Dwarf</strong> (lawful neutral, Constitution) shows
        an azer who represents invulnerability to a current danger. Although
        others might fall, he remains hale and strong. The Brass Dwarf can also
        mean a failure or dark fate for one, which in turn might save all others
        around him from a greater danger.</p><img
