    name: The Idiot
    sort: 0
    text:
      content: >-
        <p><strong>The Idiot</strong> (neutral evil, Intelligence) is a card of
        grave foolishness and greed. It can mean bribery, blackmail, or naivety
        so grand it can see no evil. The goblins have captured a foolhardy man,
        representing the knowledge that loss of dignity can precede loss of
        life. Misaligned, this card might indicate feigning of idiocy to
        disguise one's gifts.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Idiot.webp"
        width="300" height="494" />
