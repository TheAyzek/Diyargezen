      content: >-
        <p><strong>The Foreign Trader</strong> (neutral, Intelligence) is the
        card of spies and peddlers alike. Any who trade in information are
        subject to this card's influence. A bargain made under this card's
        auspice always concludes true, but the ramifications of the pact might
        be shocking for those who do not understand its implications.</p><img
