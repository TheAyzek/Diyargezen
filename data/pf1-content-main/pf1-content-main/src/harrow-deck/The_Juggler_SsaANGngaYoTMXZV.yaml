    text:
      content: >-
        <p><strong>The Juggler</strong> (chaotic good, Dexterity) represents
        fate, the gods, or those who play with the lives and destinies of
        others. If this titanic Juggler can keep up his rhythm, he will achieve
        his goals. But in a misaligned placement, he falters, and tragedy and
        failure are assured for those whose lives he meddled in.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Juggler.webp"
        width="300" height="494" />
