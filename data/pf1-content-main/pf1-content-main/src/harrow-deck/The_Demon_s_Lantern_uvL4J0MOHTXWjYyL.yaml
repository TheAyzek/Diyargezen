    text:
      content: >-
        <p><strong>The Demon's Lantern</strong> (chaotic evil, Dexterity) is the
        card of traps and tricks, sleight of hand and sleight of mind. These
        will-o'-wisps and the man who sought their light represent an impossible
        or intractable situation. Misaligned, The Demon's Lantern represents an
        opportunity or a guide arriving at a perfect moment to show the
        way.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Demon%27s%20Lantern.webp"
