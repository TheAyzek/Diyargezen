    name: The Harrow on Golarion
    sort: 0
    text:
      content: >-
        <p>The Harrow deck and the mysterious fortune-tellers known as harrowers
        feature prominently on Golarion, the world of the Pathfinder campaign
        setting. Harrow reading players and Game Masters looking for more
        details on how to use this mystical tradition in their game should check
        out the following sources.</p><h1>For Players</h1><p>The following
        accessories contain details and options for characters who use the
        Harrow.</p><p><em><strong>Pathfinder Campaign Setting: Inner Sea World
        Guide</strong>: </em> The perfect place for any character to start. This
        guide gives expansive details on the Varisian people, the fateshifting
        harrower prestige class, and game rules for the Harrow deck
        itself.</p><p><em><strong>Pathfinder Player Companion: Harrow
        Handbook</strong>: </em> Master the power of the Harrow with new
        archetypes and other options for a range of character classes based on
        the Harrow's various cards and their suits. Secret lost cards, variant
        Harrow decks, and alternate ways to tell fortunes also allow you to use
        your deck in distinctive new ways!</p><p><em><strong>Pathfinder Player
        Companion: Varisia, Birthplace of Legends</strong>: </em> Create a
        character steeped in ancient traditions of Varisia, with new details on
        mysterious fortune-tellers and card-slinging scoundrels.</p><h1>For Game
        Masters</h1><p>These adventures and campaign accessories prominently
        feature the Harrow deck or provide new options for its use in your
        game.</p><p><em><strong>Pathfinder Module: The Harrowing</strong>:</em>
        A magical Harrow deck transports the PCs to the Harrowed Realm, a land
        of deadly whimsy and strange magic where the characters of the Harrow
        deck come to life. Immerse your players in the legends and lore of the
        Harrow in the most unique way: from the
        inside.</p><p><em><strong>Pathfinder Adventure Path: Curse of the
        Crimson Throne</strong>: </em> The Varisian people and the enigmatic
        harrow features prominently throughout this far-ranging Adventure Path,
        reshaping players' destinies to bring them into opposition with a
        decadent tyrant.</p><p><em><strong>Pathfinder Campaign Setting: Occult
        Mysteries</strong>: </em> Use the Harrow in your game in entirely new
        ways in this guide to the Inner Sea's most esoteric mysteries and
        taboos. New systems for harrow points allow you to grant Harrow-themed
        bonuses in a subsystem similar to hero points. Additionally, Harrow deck
        plot twists give you a way to combine the fate-changing power of plot
        twist cards with scripted encounters to help make your Harrow
        predictions come true.</p><p><em><strong>Pathfinder Campaign Setting:
        Artifacts &amp; Legends</strong>: </em> Multiple magical Harrow decks
        exist on Golarion, but perhaps the most miraculous is the Harrow Deck of
        Many Things. Each draw from this deck brings to life a distinctive
        magical miracle - or nightmare.</p>
