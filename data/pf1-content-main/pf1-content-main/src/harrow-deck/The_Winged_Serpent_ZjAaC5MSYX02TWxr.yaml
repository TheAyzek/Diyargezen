      content: >-
        <p><strong>The Winged Serpent</strong> (lawful good, Wisdom) is a
        powerful being. Knowledge and prudence are separate keeps bridged by
        understanding. The couatl represents this bridge, knowing whether now is
        the time to strike. Misaligned, this card means either not seizing a
        moment or doing so ill-advisedly.</p><img
