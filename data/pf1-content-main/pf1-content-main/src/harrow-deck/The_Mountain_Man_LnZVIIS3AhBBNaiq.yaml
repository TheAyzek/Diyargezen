        <p><strong>The Mountain Man</strong> (chaotic neutral, Constitution)
        signifies an encounter with a physical power outside of one's control.
        The giant could personify an authority, an army, an earthquake, or even
        a desperately needed rainstorm in a parched land. Acceding to the force
        might be wise, but surviving it is paramount.</p><img
