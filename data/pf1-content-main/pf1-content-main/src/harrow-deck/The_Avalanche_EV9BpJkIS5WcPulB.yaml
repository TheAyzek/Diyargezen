    name: The Avalanche
    sort: 0
    text:
      content: >-
        <p><strong>The Avalanche</strong> (lawful evil, Dexterity) is disaster.
        It is an unthinking, unreasoning thing that overruns all who get in its
        way. It can represent physical disaster or the disaster that comes from
        a panicked crowd or other unthinking group or entity. If the card is
        misaligned, the calamity is likely to be averted, though not without
        consequence.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Avalanche.webp"
        width="300" height="494" />
