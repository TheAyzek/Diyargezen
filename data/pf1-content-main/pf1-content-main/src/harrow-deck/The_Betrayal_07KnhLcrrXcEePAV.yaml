    text:
      content: >-
        <p><strong>The Betrayal</strong> (neutral evil, Charisma) is selfishness
        incarnate. Envy twists the spirit and leads ultimately to devastation.
        It can also indicate a person whose loveliness hides an evil heart.
        Misaligned, the card means self-sacrifice or turning away from the
        material world and its temptations.</p><img
