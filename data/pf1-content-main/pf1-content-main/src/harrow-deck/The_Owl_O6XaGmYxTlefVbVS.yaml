    name: The Owl
    sort: 0
    text:
      content: >-
        <p><strong>The Owl</strong> (neutral, Wisdom) represents the eternal
        wisdom of the natural order. It is the harsh realism that causes a pack
        of wolves to cull the weak in the herd. It is tragic for the culled
        deer, but through such actions the herd grows stronger. The needle The
        Owl holds binds life together, but just as easily can pick that life
        apart.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Owl.webp" width="300"
        height="494" />
