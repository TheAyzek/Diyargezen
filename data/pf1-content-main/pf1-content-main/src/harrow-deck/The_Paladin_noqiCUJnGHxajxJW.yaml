    text:
      content: >-
        <p><strong>The Paladin</strong> (lawful good, Strength) symbolizes
        standing strong in the face of adversity. The Paladin does not back down
        under any circumstances. This card usually indicates the need to stay
        the course or do what one knows is right, even if it takes a heavy toll.
        If the card is misaligned, such a course might be foolhardy.</p><img
