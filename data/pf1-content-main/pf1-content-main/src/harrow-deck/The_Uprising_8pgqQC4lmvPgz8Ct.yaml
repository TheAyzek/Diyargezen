    text:
      content: >-
        <p><strong>The Uprising</strong> (chaotic neutral, Strength) represents
        being caught in the clutches of something much more powerful than you.
        It is an overwhelming strength that often crushes what comes in contact
        with it. The crown held high signifies an overthrowing of a leader of
        some sort. In the spread, it indicates a force much stronger than the
        person receiving the reading.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Uprising.webp"
