    text:
      content: >-
        <p><strong>The Desert</strong> (chaotic good, Constitution) is an
        environment so bleak that none can survive it without aid. For those who
        find that aid, the journey across the wastes can lead to great things.
        Misaligned, it implies the subject cannot rely on the help of others and
        will assuredly be lost. The sphinx on this card can refer to a mystic or
        doctor bringing salvation in times of plague or illness.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Desert.webp"
        width="300" height="494" />
