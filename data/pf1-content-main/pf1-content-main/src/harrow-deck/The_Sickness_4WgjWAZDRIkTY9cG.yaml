        <p><strong>The Sickness</strong> (neutral evil, Constitution) represents
        plague, pestilence, famine, and disease. It can also indicate corruption
        of the soul or of a multitude of souls. If misaligned, The Sickness
        represents either great health or a chance to stop such a
        disaster.</p><img
