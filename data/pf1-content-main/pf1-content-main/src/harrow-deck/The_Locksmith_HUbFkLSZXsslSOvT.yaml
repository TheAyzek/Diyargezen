      content: >-
        <p><strong>The Locksmith</strong> (lawful neutral, Dexterity) presents
        the subject with the keys she needs to unlock her destiny. He grants the
        tools to access a new location, clue, or treasure. He does not grant
        insight into how or where to use the tools granted. This card often
        represents a strange, ancient, or magical object.</p><img
