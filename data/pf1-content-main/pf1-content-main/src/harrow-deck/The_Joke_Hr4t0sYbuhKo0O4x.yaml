    text:
      content: >-
        <p><strong>The Joke</strong> (chaotic good, Intelligence) shows a terror
        that must be overcome - but not by physical means. This monster can only
        be defeated by trickery or artifice. This card can represent the value
        of humor in finding the way past a difficult person or task. When
        misaligned, it often signals that the joke will be on you.</p><img
