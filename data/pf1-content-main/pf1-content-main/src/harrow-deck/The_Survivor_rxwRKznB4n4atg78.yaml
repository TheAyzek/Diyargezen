    text:
      content: >-
        <p><strong>The Survivor</strong> (neutral good, Constitution) represents
        a person who has been through an ordeal of some kind. Surrounded by his
        fallen comrades, the man represents someone or something thought lost
        forever, but found once more. It can also represent rebirth. Misaligned,
        The Survivor can evoke terrible news or a profound loss.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Survivor.webp"
        width="300" height="494" />
