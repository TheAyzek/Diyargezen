    name: The Midwife
    sort: 0
    text:
      content: >-
        <p><strong>The Midwife</strong> (neutral good, Wisdom) is a conduit to
        creation, although she does not create on her own. This halfling is a
        key that lets new life or information into the world. Her heart can see
        the good in even the worst situation. She can see the import of any new
        arrival, but if the card is misaligned, the new arrival will likely not
        inspire much joy.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Midwife.webp"
        width="300" height="494" />
