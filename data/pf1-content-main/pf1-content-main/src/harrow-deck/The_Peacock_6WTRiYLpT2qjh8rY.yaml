    text:
      content: >-
        <p><strong>The Peacock</strong> (neutral, Dexterity) is a creature of
        astonishing beauty, but it is a beauty that can only be retained if
        frozen like a cockatrice's statues. Smarter people accept the passage of
        time and dance out of The Peacock's way. Its appearance always signifies
        a sudden personal shift in attitude or societal change.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Peacock.webp"
