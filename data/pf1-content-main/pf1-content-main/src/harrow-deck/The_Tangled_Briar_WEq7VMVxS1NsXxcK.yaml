      content: >-
        <p><strong>The Tangled Briar</strong> (lawful evil, Constitution) is a
        card of ancient deeds. It indicates an object or person from long ago
        that will somehow have great influence on the situation. The object or
        person in question is one lost or murdered in some foul way. Misaligned,
        the thorny past brings not just pain, but hope for the future.</p><img
