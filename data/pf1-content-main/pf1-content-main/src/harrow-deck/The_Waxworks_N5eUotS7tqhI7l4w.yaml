    text:
      content: >-
        <p><strong>The Waxworks</strong> (chaotic evil, Constitution) is a place
        of helplessness and physical entropy. The mind might be willing, but the
        flesh is frozen in this place of horror. It is also the card of torture
        and imprisonment, signifying literal inability to move or a paralysis of
        a more prosaic kind. Misaligned, this card indicates an abundance of
        energy at a crucial moment that changes all.</p><img
        src="modules/pf-content/assets/Harrow%20Deck/The%20Waxworks.webp"
        width="300" height="494" />
