    text:
      content: >-
        <p><strong>The Keep</strong> (neutral good, Strength) is a symbol of
        quiet strength, one that can move when necessary, yet stand firm through
        the greatest hardship. Those represented by The Keep are not shaken by
        any force. If The Keep appears misaligned, it can mean giving way to
        temptation or falling in the face of greater strength.</p><img
