name: Split
system:
  abilityType: ex
  description:
    value: >-
      <p>The creature splits into two identical copies of itself if subject to
      certain attacks or effects. Each copy has half the original&rsquo;s
      current hit points (rounded down). A creature reduced below the listed hit
      points cannot be further split and can be killed
      normally.</p>&nbsp;<p><em>Format</em>: split (piercing and slashing, 10
      hp)</p><p><em>Location</em>: Defensive Abilities.</p>
