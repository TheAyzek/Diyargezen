name: Dual Initiative [Mythic]
system:
  abilityType: ex
  description:
    value: >-
      <p>The creature gets two turns each round, one on its initiative count and
      another on its initiative count &ndash; 20. For example, if the
      monster&rsquo;s initiative is 23, on its first turn it could make a full
      attack (and take a 5-foot step) at initiative 23, and on its second turn
      at initiative 3 it could take a move action and cast a spell. This allows
      the monster to perform two actions per round that normally take an entire
      round, such as using a <a>summon monster</a> spell. For the purposes of
      spells and effects that have a duration of a round or longer or trigger at
      the beginning of the creature&rsquo;s round or the start of its turn (such
      as saving throws against ongoing effects or taking bleed damage), only the
      monster&rsquo;s first turn each round counts toward such
      durations.</p><p><em>Format</em>: 21</p><p><em>Location</em>: Init.</p>
  subType: misc
  tags:
    - Universal Monster Rules
type: feat
