name: Capsize
system:
  abilityType: ex
  description:
    value: >-
      <p>A creature with this special quality can attempt to capsize a boat or a
      ship by ramming it as a charge attack and attempting a combat maneuver
      check. The DC of this check is 25 or the result of the captain&rsquo;s
      <a>Profession</a> (sailor) check, whichever is higher. For each size
      category the ship is larger than the creature attempting to capsize it,
      the creature attempting to capsize the ship takes a cumulative &ndash;10
      penalty on its combat maneuver check.</p><p><em>Format</em>:
      capsize</p><p><em>Location</em>: Special Attacks.</p>
  subType: misc
  tags:
    - Universal Monster Rules
type: feat
