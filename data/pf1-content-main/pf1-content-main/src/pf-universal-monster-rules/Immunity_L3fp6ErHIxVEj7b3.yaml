name: Immunity
system:
  description:
    value: >-
      <p>A creature with immunities takes no damage from listed sources.
      Immunities can also apply to afflictions, conditions, spells (based on
      level, save type, or school), and other effects. A creature does not
      suffer any secondary effects that would normally be triggered by an effect
      it is immune to.</p>&nbsp;<p><em>Format</em>: <strong>Immune</strong>
      acid, fire, paralysis</p><p><em>Location</em>: Defensive Abilities.</p>
