name: Sound Mimicry
system:
  abilityType: ex
  description:
    value: >-
      <p>The creature perfectly imitates certain sounds or even specific voices.
      The creature attempts a <a>Bluff</a> check opposed by the listener&rsquo;s
      <a>Sense Motive</a> check to recognize the mimicry, although if the
      listener isn&rsquo;t familiar with the person or type of creatures
      mimicked, it takes a &ndash;8 penalty on its <a>Sense Motive</a> check.
      The creature has a +8 racial bonus on its Bluff check to mimic sounds
      (including accents and speech patterns, if a voice mimic) it has listened
      to for at least 10 minutes. The creature cannot duplicate the effects of
      magical abilities (such as <a>bardic performance</a>&nbsp;or a <a
      href="https://www.aonprd.com/MonsterDisplay.aspx?ItemName=Harpy">harpy&rsquo;s
      captivating song</a>), though it may be able to mimic the sound of those
      abilities. This ability does not allow the creature to speak or understand
      languages it doesn&rsquo;t know.</p><p><em>Format</em>: sound mimicry
      (voices)</p><p><em>Location</em>: SQ.</p>
  subType: misc
  tags:
    - Universal Monster Rules
type: feat
