  description:
    value: >-
      <p>A creature with the push ability can choose to attempt a free combat
      maneuver check with a certain successful attack (often a slam attack). If
      successful, this check pushes a creature directly away as with a bull
      rush, but the distance moved is set by this ability. The type of attack
      that causes the push and the distance pushed are included in the
      creature&rsquo;s description. This ability only works on creatures of a
      size equal to or smaller than the pushing creature. Creatures pushed in
      this way do not provoke attacks of opportunity and stop if the push would
      move them into a solid object or creature.</p><p><em>Format</em>: push
      (slam, 10 feet)</p><p><em>Location</em>: Special Attacks and individual
      attacks.</p>
