  description:
    value: >-
      <p>An empyreal lord can touch a willing creature and imbue it with magical
      healing power. The target radiates an aura of good as if it were an
      outsider and gains a +2 insight bonus on all saving throws against
      negative energy and death effects. As a standard action, the target can
      release this energy, turning it inward as a <a>heal</a> spell targeting
      itself or outward as <a>mass cure serious wounds</a>&nbsp;on allies within
      30 feet (caster level 15th). If not released, the energy dissipates
      harmlessly after 24 hours. The empyreal lord can use this ability 5 times
      per day, but only on other creatures.</p>
