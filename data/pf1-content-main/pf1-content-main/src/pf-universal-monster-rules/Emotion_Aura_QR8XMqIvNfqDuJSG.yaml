  description:
    value: >-
      <p>A creature with this ability surrounds itself with an area of swirling,
      chaotic emotions. These emotions make it difficult for spellcasters to
      cast spells with the <a
      href="https://www.aonprd.com/Rules.aspx?Name=Components&amp;Category=Psychic%20Magic">emotion
      component</a>. Living creatures within 30 feet must succeed at a
      concentration check (DC = 10 + 1/2 the HD of the creature with an emotion
      aura + that creature&rsquo;s Charisma modifier) to cast a spell with an
      emotion component. Failing this check causes the spell to be lost with no
      effect. In addition, any spellcaster casting spells with the emotion or
      fear descriptor on targets inside this aura must succeed at this check or
      the spell fails to affect targets within the aura (although others outside
      the area are affected as normal). Creatures with this ability are immune
      to its effects and can cast spells normally.</p><p><em>Format</em>:
      emotion (DC 17)</p><p><em>Location</em>: Aura.</p><p><em>Usage:</em>
      Replace Concentration check DC</p>
