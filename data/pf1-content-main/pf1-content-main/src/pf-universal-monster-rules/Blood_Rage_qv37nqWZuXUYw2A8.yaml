name: Blood Rage
system:
  abilityType: ex
  description:
    value: >-
      <p>When the creature takes damage in combat, on its next turn it can fly
      into a rage as a free action. It gains +2 Constitution and +2 Strength,
      but takes a &ndash;2 penalty to its AC. The rage lasts as long as the
      battle or 1 minute, whichever is shorter. It cannot end its rage
      voluntarily.</p><p><em>Format</em>: blood rage</p><p><em>Location</em>:
      Special Attacks.</p>
