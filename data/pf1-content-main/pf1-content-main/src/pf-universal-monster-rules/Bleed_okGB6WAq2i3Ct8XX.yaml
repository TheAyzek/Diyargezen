    value: >-
      <p>A creature with this ability causes wounds that continue to
      <a>bleed</a>, dealing additional damage each round at the start of the
      affected creature&rsquo;s turn. This bleeding can be stopped with a
      successful DC 15 <a>Heal</a> skill check or through the application of any
      magical healing. The amount of damage each round is specified in the
      creature&rsquo;s entry.</p><p><em>Format</em>: bleed
