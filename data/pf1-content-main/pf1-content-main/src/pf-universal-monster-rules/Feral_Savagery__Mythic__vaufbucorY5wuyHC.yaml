name: Feral Savagery [Mythic]
system:
  abilityType: su
  description:
    value: >-
      <p>Under the circumstances listed in the monster&rsquo;s stat
      block&mdash;such as when it makes a full attack or a rend attack&mdash;it
      can immediately attempt an additional attack against an opponent. This
      attack is made using the creature&rsquo;s full base attack bonus, plus any
      modifiers appropriate to the situation. This additional attack
      doesn&rsquo;t stack with similar means of gaining additional attacks, such
      as the <a>haste</a> spell or a speed weapon. This ability doesn&rsquo;t
      grant an extra action, so you can&rsquo;t use it to cast a second spell or
      otherwise take an extra action in the round.</p><p><em>Format</em>: feral
      savagery (full attack)</p><p><em>Location</em>: special attacks.</p>
  subType: misc
  tags:
    - Universal Monster Rules
