  description:
    value: >-
      <p>Fear attacks can have various effects.</p><p><em>Fear Aura (Su):</em>
      The use of this ability is a free action. The aura can freeze an opponent
      (as in the case of a <a
      href="https://www.aonprd.com/MonsterDisplay.aspx?ItemName=Mummy">mummy&rsquo;s
      despair</a>) or function like the <a>fear</a> spell. Other effects are
      possible. A fear aura is an area effect. The descriptive text gives the
      size and kind of the area.</p><p><em>Fear Cone (Sp) and Ray (Su):</em>
      These effects usually work like the <a>fear</a> spell. If a fear effect
      allows a saving throw, it is a Will save (DC = 10 + 1/2 the fearsome
      creature&rsquo;s racial HD + that creature&rsquo;s Charisma modifier; the
      exact DC is given in the creature&rsquo;s descriptive text). All fear
      attacks are mind-affecting fear effects.</p><p><em>Format</em>: fear aura
      (30 ft., DC 17) <em>or</em> fear cone (50 ft., DC
      19)</p><p><em>Location</em>: Aura <em>or</em> Special Attacks.</p>
