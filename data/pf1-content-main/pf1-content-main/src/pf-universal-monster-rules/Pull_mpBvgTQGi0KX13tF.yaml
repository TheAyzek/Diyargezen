  description:
    value: >-
      <p>A creature with this ability can choose to attempt a free combat
      maneuver check with a successful attack. If successful, this check pulls a
      creature closer. The distance pulled is set by this ability. The type of
      attack that causes the pull and the distance pulled are included in the
      creature&rsquo;s description. This ability works only on creatures of a
      size equal to or smaller than the pulling creature. Creatures pulled in
      this way do not provoke attacks of opportunity and stop if the pull would
      move them into a solid object or creature.</p><p><em>Format</em>: pull
      (tentacle, 5 feet)</p><p><em>Location</em>: Special Attacks and individual
      attacks.</p><p><em>Usage:</em> Replace range.</p>
