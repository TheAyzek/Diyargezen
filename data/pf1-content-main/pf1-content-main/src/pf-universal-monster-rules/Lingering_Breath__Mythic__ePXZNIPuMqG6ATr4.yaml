  description:
    value: >-
      <p>The creature can expend one use of <a>mythic power</a> as a free action
      when it uses its <a>breath weapon</a> to make the area radiate energy
      damage (of the same type as the breath weapon) for 1 round per mythic
      rank. Any creature in, entering, or passing through the breath
      weapon&rsquo;s area during this duration takes damage according to the
      creature&rsquo;s size. This ability has no effect on breath weapons that
      do not deal energy damage.</p><h2>Table 3-1: Lingering Breath
      Damage</h2><table><tbody><tr><th><strong>Creature
      Size</strong></th><th><strong>Points of Energy
      Damage</strong></th></tr><tr><td>Medium or
      smaller</td><td>2d4</td></tr><tr><td>Large</td><td>2d6</td></tr><tr><td>Huge</td><td>2d8</td></tr><tr><td>Gargantuan</td><td>4d6</td></tr><tr><td>Colossal</td><td>4d8</td></tr></tbody></table><p><em>Format</em>:
      lingering breath (2d6 fire, 5 rounds)</p><p><em>Location</em>: Special
      Attacks.</p>
