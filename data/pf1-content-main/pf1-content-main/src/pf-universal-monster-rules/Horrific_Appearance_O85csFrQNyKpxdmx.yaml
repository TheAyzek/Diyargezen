  description:
    value: >-
      <p>All qlippoth have such horrific and mind-rending shapes that those who
      gaze upon them suffer all manner of ill effects. A qlippoth can present
      itself as a standard action to assault the senses of all living creatures
      within 30 feet. The exact effects caused by a qlippoth&rsquo;s horrific
      appearance vary by the type of qlippoth. A successful Will save (DC 10 +
      1/2 the qlippoth&rsquo;s Hit Dice+ the qlippoth&rsquo;s Charisma
      modifier): reduces or negates the effect.</p><p>This ability is a
      mind-affecting <a>Gaze</a> attack.</p><p><em>Location:&nbsp;</em>Special
      Abilities</p><p><em>Usage:</em> Effect varies by Qlippoth, replace context
      notes.</p>
