name: Apocalyptic Resurrection
system:
  abilityType: ex
  description:
    value: >-
      <p>If a Horseman is killed, its body withers away into rot and corruption,
      leaving behind any gear it held or carried, while it is immediately
      restored to life (as per <a>true resurrection</a>) in a location of its
      choice in its domain.</p><p>A Horseman can&rsquo;t use this ability again
      for 1 year and avoids direct combat if possible until that year has
      passed. If slain again within 1 year or if killed by unusual methods (such
      as by a true deity, an artifact created for this purpose, or another
      Horseman), a Horseman is slain forever.</p><p>When this occurs, the CRs of
      the three remaining Horsemen immediately increase by 1 (typically via
      gaining a few Hit Dice and perhaps increasing some ability scores by 2 to
      4 points), while an entirely new Horseman ascends to the vacant role as a
      CR 27 demigod with its own unique abilities.</p>
  subType: misc
type: feat
