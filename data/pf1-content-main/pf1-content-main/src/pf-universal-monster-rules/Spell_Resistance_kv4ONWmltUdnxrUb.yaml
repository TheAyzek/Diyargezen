name: Spell Resistance
system:
  abilityType: ex
  description:
    value: >-
      <p>A creature with spell resistance can avoid the effects of spells and
      spell-like abilities that directly affect it. To determine if a spell or
      spell-like ability works against a creature with spell resistance, the
      caster must attempt a caster level check (1d20 + caster level). If the
      result equals or exceeds the creature&rsquo;s spell resistance, the spell
      works normally, although the creature is still allowed a saving
      throw.</p>&nbsp;<p><em>Format</em>: <strong>SR</strong>
      18</p><p><em>Location</em>: Defensive Abilities.</p>
  subType: misc
  tags:
    - Universal Monster Rules
type: feat
