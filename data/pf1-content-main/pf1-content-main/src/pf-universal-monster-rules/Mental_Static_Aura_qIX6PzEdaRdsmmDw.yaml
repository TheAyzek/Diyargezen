  description:
    value: >-
      <p>A creature with this ability creates a field around itself that makes
      concentrating difficult for those without this ability. Living creatures
      within 30 feet must succeed at a concentration check (DC = 10 + 1/2 the HD
      of the creature with the mental static aura + that creature&rsquo;s
      Charisma modifier) to cast a spell with a <a
      href="https://www.aonprd.com/Rules.aspx?Name=Components&amp;Category=Psychic%20Magic">thought
      component</a>. Failing this check causes the spell to be lost with no
      effect. In addition, all spellcasters must attempt this check at the start
      of their turns if they are concentrating on an active spell or effect.
      Failing it means that they cease concentrating on the spell or effect.
      Creatures with this ability are immune to its effects and can cast spells
      normally.</p><p><em>Format</em>: mental static (DC
      18)</p><p><em>Location</em>: Aura.</p><p><em>Usage:&nbsp;</em>Replace
      DC</p>
