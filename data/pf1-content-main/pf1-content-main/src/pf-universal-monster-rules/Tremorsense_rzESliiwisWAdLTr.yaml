name: Tremorsense
system:
  abilityType: ex
  description:
    value: >-
      <p>The creature is sensitive to vibrations in the ground and can
      automatically pinpoint the location of anything that is in contact with
      the ground. Aquatic creatures with tremorsense can also sense the location
      of creatures moving through water. The ability&rsquo;s range is specified
      in the creature&rsquo;s descriptive text.</p>&nbsp;<p><em>Format</em>:
      tremorsense 60 ft.</p><p><em>Location</em>: Senses.</p>
