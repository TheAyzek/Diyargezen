  description:
    value: >-
      <p>The creature can expend one use of <a>mythic power</a> as a free action
      to immediately end any one of the following conditions currently affecting
      it: <a>bleed</a>, <a>blind</a>, <a>confused</a>, <a>cowering</a>,
      <a>dazed</a>, <a>dazzled</a>, <a>deafened</a>, <a>entangled</a>,
      <a>exhausted</a>, <a>fascinated</a>, <a>fatigued</a>, <a>frightened</a>,
      <a>nauseated</a>, <a>panicked</a>, <a>paralyzed</a>, <a>shaken</a>,
      <a>sickened</a>, <a>staggered</a>, or <a>stunned</a>. All other conditions
      and effects remain, even those resulting from the same spell or effect
      that caused the selected condition. It can use this ability at the start
      of its turn even if a condition would prevent it from
      acting.</p><p><em>Format</em>: unstoppable</p><p><em>Location</em>:
      Defensive Abilities.</p>
