  description:
    value: >-
      <p><strong>Phantom Emotional Focus</strong></p><p>Grim phantoms influenced
      by Charon, the Horseman of Death, are dark, almost shapeless
      specters.</p><p><strong>Skills</strong>: The grim phantom gains ranks in
      Knowledge (history) and Stealth equal to its number of Hit
      Dice.</p><p><strong>Good Saves</strong>: Fortitude and
      Will.</p><p><strong>Fleet</strong>: The grim phantom gains Fleet as a
      bonus feat.</p><p><strong>Marked for Death (Su)</strong>: When manifested
      in ectoplasmic form, the grim phantom gains a +1 bonus on attack rolls
      against a creature the grim apostle has hit with a melee or ranged attack
      since its last turn (the phantom's 'marked target'). Additionally, such an
      attack by the grim phantom deals an additional 1d6 points of negative
      energy damage. At 5th level and every 5 spiritualist levels thereafter,
      the negative energy damage increases by 1d6.</p><p><strong>Fatal Aura
      (Su)</strong>: At 7th level, the grim phantom can create a 10-foot-radius
      aura as a swift action that makes healing more difficult. The DC of Heal
      checks to provide first aid and treat deadly wounds within the aura is
      increased by 5. Any creature within the aura that casts a conjuration
      (healing) spell, or casts another spell or uses an ability that restores
      hit points, must succeed at a Will saving throw or lose the spell or use
      of the ability. Ending the aura is a free action.</p><p><strong>No Escape
      (Su)</strong>: At 12th level, the grim phantom gains the benefits of the
      Following Step, Step Up, and Step Up and Strike feats but only against its
      marked target (see above).</p><p><strong>Killing Word (Sp)</strong>: At
      17th level, the grim phantom can cast power word kill once per day as a
      spell-like ability.</p>
