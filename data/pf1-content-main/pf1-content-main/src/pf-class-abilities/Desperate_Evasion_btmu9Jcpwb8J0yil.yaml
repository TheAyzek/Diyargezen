name: Desperate Evasion
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Dares</strong></p><p>While this dare is active, you
      gain the evasion class feature. If you already have this class feature,
      while this dare is active you roll twice when making a Reflex saving throw
      and take the higher result. You regain 1 grit or panache point when you
      succeed at two Reflex saving throws while using this dare.</p>
