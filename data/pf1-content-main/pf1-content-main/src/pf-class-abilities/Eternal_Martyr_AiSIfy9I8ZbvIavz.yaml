name: Eternal Martyr
system:
  associations:
    classes:
      - Bloodrager
  description:
    value: >-
      <p><strong>Bloodrager - Bloodline Powers</strong></p><p>Your ancestor's
      sacrifice transcends time and space, keeping you alive when you otherwise
      shouldn't be and sanctifying your form. At 20th level, your ancestor's act
      of martyrdom infuses your spirit. You become immune to death effects.
      Material components for spells and effects to bring you back to life (such
      as raise dead or resurrection) cost half as much as normal. Your body
      cannot be turned into an undead creature, as though you were affected by a
      permanent hallow effect (caster level = your bloodrager level). You have
      these benefits constantly, even while not bloodraging.</p>
  subType: classFeat
  tags:
    - Bloodrager - Bloodline Powers
type: feat
