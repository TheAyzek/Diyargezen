name: Hunter's Senses
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>You gain the ability to
      augment your senses on command. As a standard action, you grant yourself
      the scent special ability and improved vision. If you have normal vision,
      you gain low-light vision. If you have low-light vision, you gain
      darkvision out to a range of 30 feet. If you have darkvision, the range of
      your darkvision increases by 30 feet. You may use this ability a number of
      minutes per day equal to your druid level, in 1 minute increments.
      Dismissing these augmented senses is a free action.</p>
  subType: classFeat
  tags:
    - Druid Domain Power
type: feat
