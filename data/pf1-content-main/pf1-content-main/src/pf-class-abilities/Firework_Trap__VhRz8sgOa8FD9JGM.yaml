  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>A ranger can
      add this augmentation to a fire or smoke trap. The trap explodes in a
      flash of colored lights. All creatures within 10 feet must succeed at a
      saving throw (Fortitude if an extraordinary firework trap, Will if
      supernatural) or be blinded for 1d4+1 rounds. If this is an extraordinary
      trap, the ranger must use an alchemical weapon when setting the trap, such
      as flash powderUE or a fireworkUE.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
