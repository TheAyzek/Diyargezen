  description:
    value: >-
      <p><strong >Associated Deity</strong>: Asmodeus</p><p><strong>Associated
      Domain(s)</strong>:
      @UUID[Compendium.pf1.class-abilities.Item.T1zx6IZMFgUOTKuC]{Trickery}</p><p><em>While
      the church of Asmodeus periodically endorses the use of possession for
      certain reasons, it is usually vehemently against unsanctioned possession
      and the creation of uncontrolled undead forces. Asmodeans have a
      particular hatred for celestials who partake in acts of possession. Such
      outsiders are hunted down, and the Church of Asmodeus may offer its
      exorcising agents' services pro bono for the chance to strike at a
      particularly hated celestial. The eventual consequence of such
      arrangements-often left unsaid-is that Asmodeans track those they have
      helped in this way, and often return to force those individuals to host a
      devil for a period of predetermined length as recompense for their prior
      service.</em></p><p><strong>Replacement Powers</strong>: A cleric (or any
      other character capable of selecting a domain) who worships Asmodeus can
      choose to gain the variant domain power upon first gaining the domain in
      question, but the choice to replace the domain power must be made
      immediately upon gaining access to that domain and cannot be changed
      thereafter.</p><table><thead><tr><th>Replaced Power</th><th>Replacement
      Power</th></tr></thead><tbody><tr><td>@UUID[Compendium.pf1.class-abilities.Item.hVrmBvlqeeLbwVxn]{Copycat
      (Sp)}</td><td>@UUID[Compendium.pf-content.pf-class-abilities.Item.7tteNStE4vrkMdMz]{Deceptive
      Reprieve (Sp)}</td></tr></tbody></table>
