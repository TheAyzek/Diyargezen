name: Archon
system:
  associations:
    classes:
      - Medium
  description:
    value: >-
      <p><strong>Medium Outsider Spirit</strong></p><p>An archon is a celestial
      defender of Heaven, righteousness and justice
      personified.</p><p><strong>Alignment</strong>: Lawful
      good.</p><p><strong>Spirits</strong>: Codex archon (archmage), hound
      archon (champion), shield archon (guardian), spyglass archon (trickster),
      star archon (hierophant), and trumpet archon
      (marshal).</p><p><strong>Taboos</strong>: Choose one of the following: you
      must promote and uphold the tenants of law and good, and may never
      willingly break a law that is fair and just; you must act with honor and
      integrity at all times; you must eschew all vices and sinful temptations
      or desires.</p><p><strong>Aura of Menace (Intermediate, Su)</strong>: As a
      swift action, you activate a righteous aura that embodies your outsider's
      fury. Hostile creatures within a 20-foot radius of you must succeed at a
      Will save (DC = 10 + half your medium level + your Charisma modifier) or
      take a -2 penalty on attack rolls, on saving throws, and to AC. This
      penalty lasts for 1 minute, or until you become frightened, panicked,
      paralyzed, stunned, unconscious, or otherwise prevented from participating
      in the current encounter. Whether or not a creature fails its save, it
      can't be affected by your aura again for 24
      hours.</p><p><strong>Teleportation (Gift, Su)</strong>: Add dimension door
      to your medium spell list and list of spells known as a 4th-level spell.
      In addition, you can cast dimension door as a spell-like ability a number
      of times per day equal to your Charisma modifier, using your medium level
      as the spell's caster level.</p>
  subType: classFeat
