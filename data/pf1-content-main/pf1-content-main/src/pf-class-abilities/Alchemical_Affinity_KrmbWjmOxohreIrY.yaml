  description:
    value: >-
      <p><strong>Wizard Arcane Discovery</strong></p><p>Having studied alongside
      alchemists, you've learned to use their methodologies to enhance your
      spellcraft. Whenever you cast a spell that appears on both the wizard and
      alchemist spell lists, you treat your caster level as 1 higher than normal
      and the save DC of such spells increases by 1. Additionally, you may copy
      spells from an alchemist's formula book into your spellbook just as you
      could with another wizard's spellbook. You must be at least a 5th-level
      wizard to select this discovery.</p>
  tags:
    - Wizard Arcane Discovery
type: feat
