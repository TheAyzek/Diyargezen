name: The Winds of the Five Heavens (Act, Oratory)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>You control the wind by
      telling a tale demonstrating the hubris of mortals.</p><p>Prerequisite:
      Perform (act) or Perform (oratory) 10 ranks.</p><p>Cost: Feat or 4th-level
      bard spell known.</p><p>Effect: This short monologue tells the story of a
      village priest who thought to command the gods. This so annoyed the gods
      of the weather that they gave him exactly what he wished for, and the
      priest's long-winded sermons tore apart his temple and scattered his
      parishioners. When you complete the performance, you conjure a great wind
      as if you had cast control winds.</p><p>Use: 3 bardic performance
      rounds.</p><p>Action: 3 full rounds.</p>
  subType: classFeat
  tags:
