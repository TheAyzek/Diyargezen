name: Martial Performance
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard/Skald - Advanced Versatile Performances</strong></p><p>The
      bard chooses one weapon belonging to a fighter weapon group that is
      associated with a Perform skill he has selected with versatile performance
      (see below). He gains proficiency with this weapon. If the bard is already
      proficient with this weapon or later becomes proficient with it, he gains
      Weapon Focus with that weapon as a bonus feat instead. In addition, the
      bard's effective fighter level is equal to 1/2 his bard level for the
      purpose of qualifying for feats that specifically select weapons from
      those Perform skills' associated fighter weapon groups.</p><p>The types of
      Perform skills and their associated fighter weapon groups are: Act (close,
      double), Comedy (flails, thrown), Dance (monk, spears), Keyboard
      Instruments (hammers, siege engines), Oratory (heavy blades, light
      blades), Percussion (close, hammers), Sing (close, natural), String (axes,
      bows), and Wind (monk, thrown).</p>
  subType: classFeat
  tags:
    - Bard/Skald - Advanced Versatile Performances
type: feat
