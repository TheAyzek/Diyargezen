name: Cleanliness
system:
  associations:
    classes:
      - Monk
  description:
    value: >-
      <p><strong>Monk Vow</strong></p><p>A monk undertaking this vow must wash
      daily. He must change into fresh clothes daily or shortly after his robes
      become dirty. His appearance must be kept immaculate, including either
      neatly braiding or shaving off his hair (and, for male monks, maintaining
      a clean-shaven face). His vow forbids him from willingly touching the
      filthy, diseased, dead, or undead (though he may attempt to cleanse or
      heal those suffering from disease), though using manufactured weapons to
      attack these creatures is allowed. A monk with this vow increases his ki
      pool by 1 ki point for every 5 monk levels (minimum +1).</p>
  subType: classFeat
  tags:
    - Monk Vow
type: feat
