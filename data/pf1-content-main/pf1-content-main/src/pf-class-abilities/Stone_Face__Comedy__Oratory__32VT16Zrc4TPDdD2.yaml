name: Stone Face (Comedy, Oratory)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>Your antics can soften even
      the hardest visage.</p><p>Prerequisite: Perform (comedy) or Perform
      (oratory) 7 ranks.</p><p>Cost: Feat or 3rd-level bard spell
      known.</p><p>Effect: You tell an old and humorous tale about a woman who
      refused to smile at anything, no matter how funny. Through a series of
      increasingly unlikely events involving a cart of horse manure, a king, and
      a flying carpet, her legendary frown broke at last. When you complete the
      performance, the target is affected by stone to flesh.</p><p>Use: 2 bardic
      performance rounds.</p><p>Action: 1 minute.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
