name: Natural Healing
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>You can channel energy (as a
      cleric of your druid level) a number of times per day equal to 3 + your
      Charisma modifier, but only to heal animals, plants, and vermin. You may
      reduce the number of dice healed to cure ability damage (your choice) to
      all affected creatures, curing 1 point of ability damage for each d6 that
      the channel energy is reduced. You can take other feats to add to this
      ability, such as Extra Channel, but not feats that alter this ability,
      such as Elemental Channel and Alignment Channel.</p>
  subType: classFeat
  tags:
    - Druid Domain Power
type: feat
