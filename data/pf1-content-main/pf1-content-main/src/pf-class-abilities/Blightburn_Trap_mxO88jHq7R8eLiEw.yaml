name: Blightburn Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>This trap
      strikes the target with a small shard of blightburn, dealing 2d6 points of
      fire damage, 1d3 points of Constitution damage, and 1d3 points of Charisma
      damage. A successful Fortitude save negates the ability damage and halves
      the fire damage. The ranger must supply a sliver of blightburn, a
      dangerous task in itself, though storing the blightburn in a lead vial
      makes the task less risky.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
