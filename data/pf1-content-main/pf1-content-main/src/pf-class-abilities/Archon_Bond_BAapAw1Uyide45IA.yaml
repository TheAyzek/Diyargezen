name: Archon Bond
system:
  associations:
    classes:
      - Paladin
  description:
    value: >-
      <p><strong>Paladin Variant Divine Bond</strong></p><p>As a standard
      action, the paladin can call forth an archon spirit that bonds to her
      brow, causing her eyes to glow with righteous fury for 1 minute per
      paladin level. While this bond is active, any hostile creature within a
      10-foot radius of the paladin that looks at her must succeed at a Will
      saving throw (DC = 10 + 1/2 her paladin level + her Charisma modifier) or
      take a -2 penalty on attack rolls and saving throws and to AC for 24
      hours. Whether or not the saving throw is successful, a creature cannot be
      affected by the same paladin's archon bond again for 24 hours, and the
      penalties from multiple archon bonds don't stack. Creatures that don't
      have eyesight are not affected by this ability. For every 3 levels beyond
      5th, the radius of the paladin's archon bond increases by 5 feet, up to a
      35-foot radius at 20th level. The paladin can use this ability once per
      day at 5th level, and one additional time per day for every 4 levels
      beyond 5th, up to a total of four times per day at 17th level.</p>
  subType: classFeat
  tags:
    - Paladin Variant Divine Bond
type: feat
