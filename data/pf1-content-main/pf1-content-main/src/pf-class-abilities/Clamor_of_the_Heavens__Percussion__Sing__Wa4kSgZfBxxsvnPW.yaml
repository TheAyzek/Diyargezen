name: Clamor of the Heavens (Percussion, Sing)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>This confusing dirge of
      melody and counter-melody was composed for choirs celebrating the various
      martyrs of Ragathiel. It is intended to praise and magnify the glory of
      the empyreal lord, but to the uninitiated it sounds like a battle hymn. In
      fact, in Varisia, this is what the song has become to
      many.</p><p>Prerequisite: Perform (percussion or sing) 10
      ranks.</p><p>Cost: 5th-level bard spell known.</p><p>Effect: Evil
      creatures that hear the performance and fail a Will save against the
      effect are blinded and deafened for the duration. On a successful save,
      they are shaken instead. Undead or creatures with the evil subtype that
      fail their saves are stunned for the duration, while those that succeed
      are staggered.</p><p>Use: 3 bardic performance rounds, +1 round per
      additional round of duration.</p><p>Action: 3 full rounds.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
