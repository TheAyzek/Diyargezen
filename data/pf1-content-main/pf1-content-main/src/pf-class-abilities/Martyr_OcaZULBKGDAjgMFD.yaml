  description:
    value: >-
      <p><strong>Warpriest Blessing</strong></p><p><strong>Associated
      Blessing</strong>: Nobility</p><p><strong>Replacement Blessing</strong>:
      The following major blessing replaces the lead by example ability of the
      Nobility blessing.</p><p><strong>Martyr's Sacrifice (Major)</strong>: At
      10th level, your body can accept wounds meant for others you deem worthy.
      You can shoulder the wounds of an ally within 50 feet for 1 minute, and
      during this time, the ally is affected as if you had cast shield other on
      her (except with a range of 50 feet). You can have only one use of this
      ability active at a time; if you use this major blessing again, the
      previous use immediately expires.</p>
