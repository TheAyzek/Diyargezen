name: Limning Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>This trap
      sprays glowing dust into the trapped square and all adjacent squares. A
      creature covered in this dust glows like a candle (becoming visibly
      outlined if invisible) and takes a -20 penalty on Stealth checks. The
      dust's effects last for 1 round per ranger level or until the creature
      washes it off (a move action requiring water or some other cleanser). If
      this is an extraordinary trap, the ranger must use alchemical components
      when setting the trap, such as glowing inkUE or marker dyeUE.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
