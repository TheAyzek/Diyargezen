name: Wildsoul Aria (Sing, Wind)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>Channeling the mysterious
      power of the First World, you grant the listener the gift-or curse-of an
      animal's shape.</p><p>Prerequisite: Perform (sing) 7 ranks or Perform
      (wind instruments) 7 ranks.</p><p>Cost: Feat or 4th-level bard spell
      known.</p><p>Effect: When you complete the performance, one creature
      within 30 feet is affected by beast shape I. If your caster level is at
      least 10th, you can affect that creature with baleful polymorph instead;
      an affected creature automatically succeeds at the spell's secondary save.
      If your caster level is at least 15th and you spend 10 additional rounds
      of bardic performance, you can affect up to one creature per 3 bard levels
      with beast shape II instead. This performance allows a Fortitude save
      instead of a Will save to resist its effects.</p><p>Use: 10 rounds of
      bardic performance.</p><p>Action: 3 full rounds.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
