name: Melody of Surrender (Sing, Wind)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>This gentle, relaxing tune
      makes its listeners calm and receptive.</p><p>Prerequisite: Perform (sing)
      or Perform (wind instruments) 4 ranks.</p><p>Cost: Feat or 2nd-level bard
      spell known.</p><p>Effect: This lilting tune is soothing and repetitive.
      When you activate the performance, choose one creature per bard level
      within close range. Any targeted creature must succeed at a Will save or
      take a -2 penalty on saving throws against enchantment effects and on
      Sense Motive checks. This effect lasts for as long as you maintain the
      performance.</p><p>Although this performance does have words, it is not a
      language-dependent effect.</p><p>Use: 1 bardic performance round per
      round.</p><p>Action: 1 round.</p>
