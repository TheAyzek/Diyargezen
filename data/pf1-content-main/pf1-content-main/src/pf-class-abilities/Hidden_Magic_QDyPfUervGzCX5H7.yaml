  description:
    value: >-
      <p><strong>Vigilante Social Talent</strong></p><p>The auras of magic items
      the vigilante is carrying are hidden (as per magic aura). The vigilante
      can suppress or reactivate this effect as a standard action. At 11th
      level, the vigilante and any magic items he is carrying appear to be
      nonmagical (as if he had cast greater magic aura). The vigilante must be
      at least 5th level to select this talent.</p>
