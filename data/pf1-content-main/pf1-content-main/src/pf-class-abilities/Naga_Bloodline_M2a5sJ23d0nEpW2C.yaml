name: Naga Bloodline
system:
  associations:
    classes:
      - Sorcerer
  description:
    value: >-
      <p><strong>Sorcerer Bloodline</strong></p><p>Naga blood flows within your
      veins. Perhaps a curious naga experimented upon one of your ancestors in
      an attempt to create the perfect servant, or maybe one of your ancestors
      was a shapeshifting naga. Either way, you boast powers similar to those of
      true nagas.</p><p><strong>Class Skill</strong>: Knowledge
      (dungeoneering)</p><p><strong>Bonus Spells</strong>: ray of enfeeblement
      (3rd), invisibility (5th), lightning bolt (7th), poison (9th), dominate
      person (11th), veil (13th), limited wish (15th), mass charm monster
      (17th), shapechange (19th).</p><p><strong>Bonus Feats</strong>: Alertness,
      Blind-Fight, Combat Casting, Dodge, Improved Initiative, Lightning
      Reflexes, Skill Focus (Knowledge [dungeoneering]),
      Stealthy.</p><p><strong>Bloodline Arcana</strong>: Whenever you cast a
      spell with the poison descriptor, increase the spell's DC by
      2.</p><p><strong>Bloodline Powers</strong>: You can draw upon the ancient
      magic of the nagas to ensnare the minds of lesser creatures and destroy
      those who would defy your will.</p>
  subType: classFeat
  tags:
    - Sorcerer Bloodline
type: feat
