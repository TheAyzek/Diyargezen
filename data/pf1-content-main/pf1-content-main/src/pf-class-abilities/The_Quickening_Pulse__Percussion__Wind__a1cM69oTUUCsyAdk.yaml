name: The Quickening Pulse (Percussion, Wind)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>Your driving notes cause
      unnatural heart rates in your opponents.</p><p>Prerequisite: Perform
      (percussion) 7 ranks or Perform (wind) 7 ranks.</p><p>Cost: Feat or
      3rd-level bard spell known.</p><p>Effect: You create a musical tempo that
      first mirrors your enemies' heartbeats, and then quickens them to
      dangerous levels. When you complete the performance, all enemies within 30
      feet who can hear your performance must save or take 1d6 points of damage
      as their pounding heart causes them to sweat blood. Creatures that are
      immune to critical hits are unaffected by this ability.</p><p>Each round
      that you continue the performance adds another round to the bleed effect.
      Abilities that extend the duration of a bardic performance (such as
      Lingering Performance) affect this masterpiece.</p><p>Use: 1 bardic
      performance round per round of bleed.</p><p>Action: 1 standard action.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
