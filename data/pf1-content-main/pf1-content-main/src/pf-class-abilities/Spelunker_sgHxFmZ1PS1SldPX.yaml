name: Spelunker
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>You ably clamber through
      underground areas. As a free action, you can ignore difficult terrain from
      stony surfaces, you take no penalties for squeezing through rocky areas,
      and you gain damage reduction 5/- against rocky hazards such as spike
      growth. This effect lasts for 1 round, and you can use this ability a
      number of times per day equal to 3 + your Wisdom modifier.</p>
