name: The Cat-Step (Dance)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>Your agile dancing allows
      you and others to fall safely and land gracefully.</p><p>Prerequisite:
      Perform (dance) 5 ranks.</p><p>Cost: Feat or 2nd-level bard spell
      known.</p><p>Effect: This quick dance is a series of small steps
      culminating in a series of leaps. When you complete the performance, for
      the next 10 minutes you treat any distance fallen as if it were a number
      of feet shorter equal to half your bard level x 5. You may spend the first
      minute of this effect demonstrating the dance to up to one creature per
      two bard levels; if these students succeed at a DC 15 Perform (dance)
      check, they also gain the benefits of this masterpiece for the remainder
      of its duration.</p><p>Use: 4 bardic performance rounds.</p><p>Action: 4
      full rounds.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
