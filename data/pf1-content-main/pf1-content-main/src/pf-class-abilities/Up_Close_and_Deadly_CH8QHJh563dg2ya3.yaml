name: Up Close and Deadly
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 1st level, when the
      pistolero hits a target with a one-handed firearm that is not making a
      scatter shot, she can spend 1 grit point to deal 1d6 points of extra
      damage on a hit. If she misses with the attack, she grazes the target,
      dealing half the extra damage anyway. This is precision damage and is not
      multiplied if the attack is a critical hit. This precision damage
      increases to 2d6 at 5th level, to 3d6 at 10th level, to 4d6 at 15th level,
      and to 5d6 at 20th level. This precision damage stacks with sneak attack
      and other forms of precision damage. The cost of using this deed cannot be
      reduced with the Signature Deed feat, the true grit class feature, or any
      similar effect. This deed replaces the deadeye deed.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
