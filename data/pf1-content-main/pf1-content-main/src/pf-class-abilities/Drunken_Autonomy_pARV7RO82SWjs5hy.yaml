  description:
    value: >-
      <p><strong>Associated Faith</strong>:
      @UUID[Compendium.pf-content.pf-class-abilities.Item.JoZtlweyQsvXojS4]{Haunted
      Faith: Cayden Cailean}</p><p>As a swift action, whenever under the effects
      of mind-affecting magic, possession, or similar external control, you can
      channel the unrestricted nature of your god. Instead of acting under the
      compulsion, you instead act as though you had the confused condition for 1
      round. Producing the 'act normally' result allows you to act free of
      mental compulsion for that round. You can use this ability a number of
      times per day equal to 3 + your Wisdom modifier.</p><p>This replaces the
      @UUID[Compendium.pf1.class-abilities.Item.eZ569ZcO7BeZAqB6]{touch of
      chaos} domain power of the
      @UUID[Compendium.pf1.class-abilities.Item.Mh85MGrAFDPWHI3m]{Chaos}
      domain.</p>
