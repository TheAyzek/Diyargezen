name: Flash and Shock
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 1st level, the gulch gunner
      can take advantage of the flash and sound of a firearm to throw off an
      attacker's aim at close range. When she makes an attack against a foe
      within her firearm's first range increment, she may spend 1 grit point to
      gain a +4 circumstance bonus to AC against that opponent until the
      beginning of her next turn. She can only perform this deed while wearing
      medium, light, or no armor, and while carrying no more than a light load.
      This deed replaces the deadeye deed.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
