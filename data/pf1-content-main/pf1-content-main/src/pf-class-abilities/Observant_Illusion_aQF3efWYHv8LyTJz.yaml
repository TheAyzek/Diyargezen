name: Observant Illusion
system:
  associations:
    classes:
      - Wizard
  description:
    value: >-
      <p><strong>Wizard Arcane Discovery</strong></p><p>You can project your
      senses into any ongoing figment or shadow illusion you create with a spell
      of at least 3rd level. You can see through its eyes and hear through its
      ears as if you were standing where it is, and during your turn you can
      switch from using its senses to using your own, or back again, as a swift
      or move action. While you are using its senses, your body is considered
      blinded and deafened. You must be at least a 9th-level wizard to choose
      this discovery.</p>
  tags:
    - Wizard Arcane Discovery
type: feat
