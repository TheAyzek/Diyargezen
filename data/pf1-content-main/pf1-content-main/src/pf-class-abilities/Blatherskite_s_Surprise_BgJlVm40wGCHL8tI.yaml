name: Blatherskite's Surprise
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 7th level, when the
      blatherskite succeeds at a saving throw against a spell or an effect that
      would cause him to be blinded, confused, dazed, fascinated, frightened,
      nauseated, paralyzed, or stunned, he can allow the effect to affect him
      normally. As long as he has at least 1 grit point, as an immediate action
      he can cause the creature from which the effect originated to lose its
      Dexterity bonus to AC for a number of rounds equal to half the duration of
      the effect (in rounds) or half the gunslinger's level, whichever is lower
      (minimum 1 round). If he instead spends 1 grit point, he does not need to
      allow the effect to affect him normally to use this deed.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
