  description:
    value: >-
      <p><strong>Arcanist Exploit - Adept</strong></p><p>A blade adept can
      select any of the following magus arcana, using her arcane reservoir in
      place of the magus's arcane pool: arcane accuracy, close range, critical
      strike, dispelling strike, and hasted assault. The blade adept treats her
      arcanist level as her magus level when determining the effects of magus
      arcana and when specific arcana are available. A blade adept can take this
      exploit multiple times. Each time it is taken, it applies to a different
      magus arcana.</p>
  subType: classFeat
  tags:
