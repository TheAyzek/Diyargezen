      <p><strong>Bard/Skald - Advanced Versatile Performances</strong></p><p>The
      bard gains a bardic masterpiece, as if he were giving up a feat to learn
      it. He must meet the masterpiece's prerequisites, and the masterpiece must
      list ranks in a Perform skill that the bard has chosen with versatile
      performance as a prerequisite. This option can be selected multiple
      times.</p>
