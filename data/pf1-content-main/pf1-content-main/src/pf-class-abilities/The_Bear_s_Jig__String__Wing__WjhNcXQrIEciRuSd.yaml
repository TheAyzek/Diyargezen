name: The Bear's Jig (String, Wing)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>Your music makes animals act
      like people.</p><p>Prerequisite: Perform (string) or Perform (wind) 11
      ranks.</p><p>Cost: Feat or 4th-level bard spell known.</p><p>Effect: In
      the Varisian musical The Bear, a lively tune plays whenever the eponymous
      animal tumbles onto stage. When played with skill, the song actually has
      the power to grant an animal temporary intelligence. Choose a non-hostile
      animal within line of sight that can see and hear you perform. This
      masterpiece affects the target as the awaken spell for as long as you
      maintain the performance. Abilities that extend the duration of a bardic
      performance (such as Lingering Performance) affect this
      masterpiece.</p><p>Use: 1 round of bardic performance per
      round.</p><p>Action: 1 full round.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
