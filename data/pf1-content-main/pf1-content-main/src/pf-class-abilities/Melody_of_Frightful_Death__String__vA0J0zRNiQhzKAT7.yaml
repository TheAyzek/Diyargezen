name: Melody of Frightful Death (String)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>The pain and horror of the
      Abyss shrieks through your instrument to make a listener experience the
      death she dreads most.</p><p>Prerequisite: Perform (string) 7
      ranks.</p><p>Cost: Feat or 3rd-level bard spell known.</p><p>Effect: You
      produce a sound that causes creatures to believe they are suffering a
      particularly ghastly and terrifying death, such as immolation, freezing to
      death, or being eaten alive by insects. When you complete this
      performance, all creatures within 30 feet who can hear your performance
      must make a successful Will saving throw or take 1d6 points of energy
      damage. The energy type can be either acid, cold, or fire (your choice,
      chosen when you begin performing the masterpiece).</p><p>Affected
      creatures that fail their saving throws take damage on the round you begin
      the performance and each round you continue the performance as long as
      they remain in range. Abilities that extend the duration of a bardic
      performance affect this masterpiece.</p><p>Use: 1 bardic performance round
      per round.</p><p>Action: 1 standard action.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
