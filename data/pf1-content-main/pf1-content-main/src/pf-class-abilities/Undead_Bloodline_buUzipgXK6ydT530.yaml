  description:
    value: >-
      <p><strong>Bloodrager - Bloodline</strong></p><p>The foul corruption of
      undeath is a part of you. Somewhere in the past, death became infused with
      your lineage. Your connection to the attributes of the undead bestows
      frightening power when your bloodrage.</p><p><strong>Bonus Feats</strong>:
      Diehard, Dodge, Endurance, Intimidating Prowess, Iron Will, Mobility,
      Toughness.</p><p><strong>Bonus Spells</strong>: chill touch (7th), false
      life (10th), vampiric touch (13th), enervation
      (16th)</p><p><strong>Bloodline Powers</strong>: When you enter a
      bloodrage, the powers of undeath manifest, empowering your attacks with
      fear and your body with foul resistances.</p>
