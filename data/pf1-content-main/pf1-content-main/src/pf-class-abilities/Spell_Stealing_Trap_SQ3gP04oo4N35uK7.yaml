name: Spell-Stealing Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>The target
      is struck by a burst of abjuration that steals its magical ability. The
      target loses 1d4+1 levels of spells (of its choice). A ranger may increase
      the number of spell levels lost by 1d4 for each additional daily use of
      his trap ability he spends when creating this trap.</p>
