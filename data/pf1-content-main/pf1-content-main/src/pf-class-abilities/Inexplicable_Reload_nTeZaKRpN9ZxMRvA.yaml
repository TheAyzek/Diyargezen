name: Inexplicable Reload
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 11th level, loading a
      crossbow becomes unthinking and automatic for a bolt ace. As long as she
      has at least 1 grit point, she always starts each round of combat (even a
      surprise round) with her crossbow loaded. Also the amount of time needed
      to reload a crossbow decreases by one step: a standard action becomes a
      move action, a move action becomes a swift action, a swift action becomes
      a free action, and a free action becomes not an action. This deed replaces
      lightning reload.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
