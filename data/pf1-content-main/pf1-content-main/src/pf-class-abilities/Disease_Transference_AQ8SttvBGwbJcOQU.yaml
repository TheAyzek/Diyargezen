name: Disease Transference
system:
  associations:
    classes:
      - Psychic
  description:
    value: >-
      <p><strong>Psychic Psi-Tech Discovery</strong></p><p>You are able to
      psychically control and manipulate all manner of diseases. You can cast
      diagnose disease (Ultimate Magic 216) as a spell-like ability at will.
      Additionally, you can touch a creature afflicted with a disease as a
      standard action and draw the disease into yourself, or transfer it to
      another willing living creature that is susceptible to diseases and that
      you (or the afflicted creature) are also touching. Attempt a caster level
      check against a DC equal to 10 + the disease's Fortitude save DC. If you
      are successful, the afflicted creature is no longer affected by the
      disease. If you move the disease into yourself or another creature you (or
      the afflicted) are touching, the target receiving the disease must
      immediately attempt a Fortitude save as if it were initially exposed to
      the disease. If the target fails, the disease affects it immediately with
      no onset time. You can use this ability a number of times per day equal to
      3 + your Intelligence modifier. You must be at least 7th level to select
      this discovery.</p>
  subType: classFeat
  tags:
    - Psychic Psi-Tech Discovery
type: feat
