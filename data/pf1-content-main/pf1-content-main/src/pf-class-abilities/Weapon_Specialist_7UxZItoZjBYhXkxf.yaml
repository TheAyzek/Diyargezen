name: Weapon Specialist
system:
  associations:
    classes:
      - Fighter
  description:
    value: >-
      <p><strong>Advanced Weapon Training</strong></p><p>The fighter selects a
      number of combat feats that he knows equal to his weapon training bonus
      with the associated weapon group. The selected feats must be ones that
      require the fighter to choose a type of weapon (such as Weapon Focus and
      Weapon Specialization), and the fighter must have chosen weapons that
      belong to the associated fighter weapon group. The fighter is treated as
      having the selected feats for all the weapons in the associated weapon
      group that are legal choices for those feats. The fighter is also
      considered to have those feats with these weapons for the purpose of
      meeting prerequisites.</p>
  subType: classFeat
  tags:
    - Advanced Weapon Training
type: feat
