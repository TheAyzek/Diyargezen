name: Abrogail Thrune I (Hierophant)
system:
  associations:
    classes:
      - Medium
  description:
    value: >-
      <p><strong>Medium Legendary Spirit</strong></p><p>The ruthless monarch who
      single-handedly changed the course of Cheliax's history, Abrogail Thrune I
      struck a bargain with Hell to enable her to seize the nation's throne for
      her family, ending a bloody civil war.</p><p><strong>Gaining
      Favor</strong>: To gain Abrogail Thrune's favor, you must travel to the
      giant bronze statue of her in the Triumph district in Egorian, or to any
      place where a lawful outsider with at least 20 Hit Dice has visited or
      been called. Once there, you must vow to never break a binding contract,
      and must make a case for why you should be entrusted with power over
      others. Doing so requires a Wisdom check; if you succeed, Thrune answers
      your call.</p><p><strong>Taboos</strong>: If you accept a taboo while
      channeling Thrune, you must vow to fight against chaos wherever you see
      it.</p><p><strong>Dynamic Decree (Lesser, Su)</strong>: Thrune always
      grants the following spells of each level: 0-bleed, 1st-bane,
      2nd-enthrall, 3rd-agonize (Ultimate Magic 205), 4th-greater infernal
      healing (Pathfinder Campaign Setting: The Inner Sea World Guide 295),
      5th-true seeing, 6th-banishment. This ability alters divine
      surge.</p><p><strong>Supernatural Aid (Greater, Su)</strong>: Once per
      day, you can call an outsider with a number of Hit Dice equal to or less
      than yours (maximum 18 HD) as if casting the appropriate planar ally
      spell. You do not need to pay the material component required to cast the
      spell, but you still must bargain with and pay the outsider for its
      services. This ability replaces overflowing grace.</p>
  subType: classFeat
