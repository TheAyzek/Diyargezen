name: Stalwart Standard
system:
  associations:
    classes:
      - Cavalier
      - Samurai
  description:
    value: >-
      <p><strong>Cavalier/Samurai Banner</strong></p><p>These banners are common
      among the dwarven defenders of Kraggodan. An ally who benefits from this
      standard gains a +2 morale bonus to CMD and a +1 morale bonus on attack
      rolls to creatures threatening an ally. At 10th level and every 5 levels
      thereafter, the bonus to CMD increases by +1. At 14th level, an ally
      benefiting from the banner is treated as one size category larger for the
      purposes of determining which creatures can affect him with combat
      maneuvers. When the cavalier or samurai waves this standard, each ally
      within 60 feet can move up to 10 feet without provoking attacks of
      opportunities and ignoring difficult terrain as an immediate action.</p>
  subType: classFeat
  tags:
    - Cavalier/Samurai Banner
type: feat
