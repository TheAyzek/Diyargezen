name: Trained Initiative
system:
  associations:
    classes:
      - Fighter
  description:
    value: >-
      <p><strong>Advanced Weapon Training</strong></p><p>As long as he is
      wielding a weapon from the associated weapon group or is able to draw such
      a weapon (even if he is not currently wielding it), the fighter applies
      his weapon training bonus to initiative checks. In addition, if he has the
      Quick Draw feat and has a weapon from the appropriate weapon group that
      isn't hidden, he can draw that weapon as a free action as part of making
      an initiative check.</p>
  subType: classFeat
  tags:
    - Advanced Weapon Training
type: feat
