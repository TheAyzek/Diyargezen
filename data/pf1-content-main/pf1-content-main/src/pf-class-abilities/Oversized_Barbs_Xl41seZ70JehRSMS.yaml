name: Oversized Barbs
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>The target
      is speared with barbs that penetrate and protrude from its body, making
      squeezing, climbing, and swimming challenging. The trap implants 1d4+1
      barbs, each dealing 1 point of damage. A successful Reflex save halves the
      number of barbs. The target takes a penalty on Climb checks and Swim
      checks equal to the number of barbs attached, and is considered one size
      category larger for the purposes of determining what size of opening or
      passageway it must squeeze through as long as at least 1 barb remains
      attached. Each barb can be removed with a full minute of work and a Heal
      check that equals or exceeds the trap's DC. If this check fails, the barb
      is still removed but the target takes 1d4 points of damage. The barbs
      shake loose harmlessly after 10 minutes per ranger level.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
