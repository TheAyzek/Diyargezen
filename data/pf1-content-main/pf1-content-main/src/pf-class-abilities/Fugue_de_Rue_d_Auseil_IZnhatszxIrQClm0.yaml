  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>Your music provides a
      bastion that hedges out horrors and fiends.</p><p>Prerequisite: Perform
      (string instruments) 15 ranks.</p><p>Cost: Feat or 6th-level bard spell
      known.</p><p>Effect: This piece of music combines two discordant melodies:
      one that represents humanity, and another that represents the unsettling
      horror of the places between the stars. When you activate this
      performance, you create a hemispherical field that hedges out outsiders,
      aberrations, and undead. When you begin this performance, roll a Perform
      (string instruments) check; the radius of the hemisphere may be any size,
      measured in feet, up to the result of your check.</p><p>This effect can be
      used only defensively. Forcing the hemispherical barrier against creatures
      that the effect keeps at bay immediately collapses the barrier.</p><p>Use:
      1 bardic performance round per minute.</p><p>Action: 1 full round.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
