  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>Your song pierces to the
      heart of a creature's identity, weakening it against
      you.</p><p>Prerequisite: This haunting melody teases at the veils of
      understanding and drills into the bedrock of truth. Upon completing this
      performance, the target attempts a Will save. Failure means you understand
      the target's primal nature; you gain a +4 bonus on Charisma-based checks
      to influence the target, and the DCs of your abilities and spells that
      would influence the creature or its actions (including charm and
      compulsion effects) increase by +2. These bonuses last for 1
      day.</p><p>You must have an idea of who the creature is when you begin to
      play the song, either through researching the creature or by observing it
      directly from no farther than 100 feet.</p><p>Cost: Feat or 3rd-level bard
      spell known.</p><p>Effect: This haunting melody teases at the veils of
      understanding and drills into the bedrock of truth. Upon completing this
      performance, the target attempts a Will save. Failure means you understand
      the target's primal nature; you gain a +4 bonus on Charisma-based checks
      to inf luence the target, and the DCs of your abilities and spells that
      would inf luence the creature or its actions (including charm and
      compulsion effects) increase by +2. These bonuses last for 1
      day.</p><p>You must have an idea of who the creature is when you begin to
      play the song, either through researching the creature or by observing it
      directly from no farther than 100 feet.</p><p>Use: 5 rounds of bardic
      performance.</p><p>Action: 5 full rounds.</p>
