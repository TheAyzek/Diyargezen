  description:
    value: >-
      <p><strong>Sorcerer Wildblooded Bloodline</strong></p><p>The darkness
      between the stars calls to you.</p><p><strong>Associated
      Bloodline</strong>: Starsoul.</p><p><strong>Bloodline Arcana</strong>:
      Whenever you cast an evocation spell, you may select one affected target
      that fails its save to suffer the choking airlessness of the void,
      silencing it (as silence, but affecting only the target) for 1 round. This
      is a supernatural ability.</p><p><strong>Bloodline Powers</strong>: Your
      magic is blacker than any night.</p>
