  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 9th level, once per
      day after a foe has damaged you in melee, as an immediate action you can
      deal the same amount and type of damage to your foe (maximum amount of
      damage equal to double your character level). At 17th level, you can use
      this ability twice per day. This bloodline power replaces gift of
      blood.</p>
