name: Heratic (Hierophant)
system:
  associations:
    classes:
      - Medium
  description:
    value: >-
      <p><strong>Medium Legendary Spirit</strong></p><p>The Heretic warps the
      faith of a good deity.</p><p><strong>Gaining Favor</strong>: To gain the
      Heretic's favor, you must first pervert the worship of a congregation of
      worshipers of a good deity to evil. You must then vow to corrupt, debase,
      and violate the worship of that deity and never perform a truly altruistic
      act, and finally succeed at a Charisma check.</p><p><strong>Spirit
      Bonus</strong>: The Heretic warps the faith of a good
      deity.</p><p><strong>Seance Boon</strong>: For the purpose of spells and
      effects that have an effect based on which deity you worship, you count as
      worshiping the deity chosen in your vow. For the purpose of divinations,
      your alignment is the same as the deity's, and you have an aura
      corresponding to that deity's alignment as if you were a cleric of that
      deity. This doesn't alter other effects based on alignment, like smite
      evil.</p><p><strong>Favored Locations</strong>: Hidden shrines,
      repositories of dark knowledge, sacrificial altars,
      temples.</p><p><strong>Heresy (Lesser, Su)</strong>: This functions as the
      divine surge lesser spirit power but you gain the following inquisitor
      spells at the indicated spell levels, instead of selecting a set of cleric
      spells each day: 0-guidance; 1st-divine favor; 2nd- castigateAPG;
      3rd-terrible remorseUM; 4th-reprobationUM; 5th- mass castigateAPG;
      6th-overwhelming presenceUM. Whenever you use your spirit surge on a skill
      check or ability check to convince or trick someone into perverting his
      faith in the good deity you chose with your vow, the Heretic is pleased
      and does not gain the usual point of influence over
      you.</p><p><strong>False Front (Intermediate, Su)</strong>: You gain the
      effects of the energy font intermediate spirit power, but you must match
      the faith you chose to pervert, meaning that you always channel positive
      energy and add cure spells.</p><p><strong>Stolen Grace (Greater,
      Su)</strong>: When a member of your chosen faith who believes that you are
      a member of that faith's clergy requests you to cast a cleric spell of a
      spell level you can cast, you can allow the Heretic to gain 1 point of
      influence over you and expend a spell slot of the appropriate level to
      cast the spell.</p>
  subType: classFeat
