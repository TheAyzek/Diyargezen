  description:
    value: >-
      <p><strong>Hunter Animal Focus</strong></p><p>The creature gains the jet
      ability (Pathfinder RPG Bestiary 2 298) with a speed equal to its
      unmodified base land speed or four times its swim speed (if it has one),
      whichever is higher. If it has a swim speed, at 8th level, the jet
      ability's speed increases to five times its swim speed, and at 15th level,
      the speed increases to seven times its swim speed.</p>
