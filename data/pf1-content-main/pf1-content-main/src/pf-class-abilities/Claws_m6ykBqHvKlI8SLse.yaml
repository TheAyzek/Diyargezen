name: Claws
system:
  associations:
    classes:
      - Sorcerer
  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 1st level, you can
      grow claws as a free action. These claws are treated as natural weapons,
      allowing you to make two claw attacks as a full attack action using your
      full base attack bonus. These attacks deal 1d4 points of damage each (1d3
      if you are Small) plus your Strength modifier. At 5th level, these claws
      are considered magic weapons for the purpose of overcoming DR. At 7th
      level, the damage increases by one step to 1d6 points of damage (1d4 if
      you are Small). At 11th level, these claws become flaming weapons, each
      dealing an additional 1d6 points of fire damage on a successful hit. You
      can use your claws for a number of rounds per day equal to 3 + your
      Charisma modifier. These rounds do not need to be consecutive.</p>
  subType: classFeat
  tags:
    - Sorcerer Bloodline Power
type: feat
