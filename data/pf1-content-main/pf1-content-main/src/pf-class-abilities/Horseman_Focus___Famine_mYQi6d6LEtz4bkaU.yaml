  description:
    value: >-
      <p><strong>Phantom Emotional Focus</strong></p><p>Grim phantoms influenced
      by Trelmarixian, the Horseman of Famine, are gaunt with jackal-like
      features.</p><p><strong>Skills</strong>: The grim phantom gains ranks in
      Perception and Sense Motive equal to its number of Hit
      Dice.</p><p><strong>Good Saves</strong>: Reflex and
      Will.</p><p><strong>Weapon Finesse</strong>: The grim phantom gains Weapon
      Finesse as a bonus feat.</p><p><strong>Ravenous Bite (Ex)</strong>: The
      grim phantom's natural attacks take the form of bites that deal piercing
      damage as a creature one size category larger than its current size. It
      also gains Power Attack as a bonus feat.</p><p><strong>Aura of Starvation
      (Su)</strong>: At 7th level, the grim phantom can create a 10-foot-radius
      aura of starvation as a swift action. Enemies within the aura take a -2
      penalty on attack and damage rolls. Ending the aura is a free
      action.</p><p><strong>Wail of the Hungry (Sp)</strong>: At 12th level, the
      grim phantom can cast waves of fatigue once per day as a spell-like
      ability.</p><p><strong>Distended Gullet (Su)</strong>: At 17th level, as a
      swift action, the grim phantom in ectoplasmic form gains the swallow whole
      ability (4d8 negative energy damage, AC 17, one-tenth the phantom's total
      hit points) for a number of rounds equal to its Charisma modifier. This
      ability can affect creatures no more than two size categories larger than
      the phantom. Each creature the grim phantom swallows is shunted into an
      extradimensional space that can hold any number of creatures. When the
      duration of this ability ends, any creatures still within the
      extradimensional space appear adjacent to the grim phantom. The grim
      phantom is exhausted for 1 hour after using this ability and can't use it
      again during that time.</p>
  subType: classFeat
