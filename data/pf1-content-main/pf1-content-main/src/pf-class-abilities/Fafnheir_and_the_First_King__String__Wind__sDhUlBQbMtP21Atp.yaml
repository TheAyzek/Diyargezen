name: Fafnheir and the First King (String, Wind)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>You affect the mood of
      listeners by celebrating the defeat of the First Linnorm King at the claws
      of Fafnheir, the Father of All Linnorms.</p><p>Prerequisite: Perform
      (string) or Perform (wind) 6 ranks.</p><p>Cost: Feat or 2nd-level bard
      spell known.</p><p>Effect: This stirring pibroch reminds dragons of a
      significant victory by one of the legendary heroes of their kind and fills
      lesser races with a feeling of frustration and rage. Any creature of the
      dragon type that hears the entire performance must succeed at a Will save
      to avoid having her attitude toward the performer and his allies improved
      by two steps (from Hostile to Indifferent, for example).</p><p>A creature
      of any other type (apart from the bard and his allies) must succeed at a
      Will save to avoid having her attitude toward the performer and his allies
      worsened by two steps (from Indifferent to Hostile, for
      example).</p><p>These effects last for 1 minute per bard level, or until
      he or his comrades do anything to worsen the mood of the dragon, or
      improve the mood of those affected otherwise. Multiple uses of this
      masterpiece cannot improve or worsen attitudes more than two
      steps.</p><p>Use: 2 bardic performance rounds.</p><p>Action: 2 full
      rounds.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
