name: Shifty Shot
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 3rd level, a bushwhacker
      with at least 1 grit point deals 1d6 points of extra damage when using her
      firearm to attack opponents denied their Dexterity bonus to AC (whether
      the target actually has a Dexterity bonus or not). Except for the
      requirement that she must use a firearm and must have at least 1 grit
      point to use it, this deed otherwise works identically to a rogue's sneak
      attack class feature (including the requirement that she must be within 30
      feet of her target to deal this extra damage), and stacks with the sneak
      shot ability (see below) and sneak attack. This deed replaces the utility
      shot deed.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
