name: Symphony of Sylandurla's Ascent (Percussion, Wind)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>This elaborate arrangement
      for traditional elven instruments evokes Sylandurla's heroic climb up the
      spire from the planar city of Axis to the Boneyard, where it's said that
      she sang 8,008 tales to win elves their immunity to magical
      sleep.</p><p>Prerequisite: Perform (percussion or wind) 7
      ranks.</p><p>Cost: Feat or 3rd-level bard spell known.</p><p>Effect: All
      allies within 30 feet become immune to one of the following (your choice)
      while they can hear your performance: charm effects, the dazed condition,
      fear effects, magical sleep, paralysis, the staggered condition, or the
      stunned condition. You must choose the condition before activating the
      performance and can't change your choice during the performance. If any
      affected ally currently has the chosen condition, she can attempt a new
      saving throw against it each round she can hear your song. Success on this
      saving throw has its usual benefit, but failure has no effect at all. This
      performance relies on audible components.</p><p>Use: 1 bardic performance
      round per round.</p><p>Action: 1 full round.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
