name: Remorse
system:
  associations:
    classes:
      - Spiritualist
  description:
    value: >-
      <p><strong>Phantom Emotional Focus</strong></p><p>Spirits of creatures
      that died with heavy weights upon their consciences manifest with the
      remorse emotional focus. These phantoms, whose forms are often darkened by
      shadows, force foes to experience their regret and self-loathing. A
      spiritualist with the fated guide archetype (see page 18) must choose
      remorse as her phantom's emotional focus, but other spiritualists can also
      select this emotional focus for their
      phantoms.</p><p><strong>Skills</strong>: The phantom gains a number of
      ranks in Perception and Sense Motive equal to its Hit Dice. While confined
      in the spiritualist's consciousness, the phantom grants the spiritualist
      Skill Focus in each of these skills.</p><p><strong>Good Saves</strong>:
      Fortitude and Will.</p><p><strong>Antagonistic</strong>: The phantom gains
      Antagonize as a bonus feat.</p><p><strong>Long-Suffering Strike
      (Su)</strong>: When a phantom with this focus hits a creature with its
      slam attack, that creature must succeed at a Will saving throw (DC = 10 +
      1/2 the phantom's Hit Dice + the phantom's Charisma modifier) or any
      attacks targeting the creature gain a +1 bonus on their attack rolls and
      damage rolls until the beginning of the phantom's next turn. Penalties
      from multiple hits don't stack with themselves.</p><p><strong>Aura of
      Regret (Su)</strong>: When the spiritualist reaches 7th level, her phantom
      can emit a 10-foot-radius aura of regret as a swift action. Enemies within
      the aura take a -2 penalty on skill checks, on caster level checks, on
      combat maneuver checks, and to CMD. Ending the aura is a free action. The
      phantom can use this ability in either ectoplasmic or incorporeal
      form.</p><p><strong>Keening (Su)</strong>: When the spiritualist reaches
      12th level, her phantom can wail about its misdeeds once per day as a
      standard action, affecting all creatures within a 30-foot cone with the
      terrible remorseUM spell. The phantom uses its Hit Dice as its caster
      level for the effect, and the DC equals 10 + 1/2 the phantom's Hit Dice +
      the phantom's Charisma modifier. The phantom can use this ability in
      either ectoplasmic or incorporeal form.</p><p><strong>Utter Misery
      (Su)</strong>: When the spiritualist reaches 17th level, her phantom's
      long-suffering strike also causes a creature that fails its save to become
      stunned until the beginning of the phantom's next turn.</p><h>Other
      Remorse-Focused Abilities</h><p>If a spiritualist archetype allows the
      selection of an additional focus, add remorse to the list of available
      foci. Add the following to other character options for spiritualists with
      remorse phantoms.</p><p><strong>Emotional Conduit (Feat)</strong>:
      1st-inflict light wounds, 2nd-disfiguring touchUM, 3rd-howling agonyUM,
      4th-debilitating portentUC, 5th-nightmare,
      6th-harm.</p><p><strong>Fractured Mind (Archetype)</strong>: Doom (5th),
      inflict painOA (7th), stricken heartACG (9th), mind fog
      (16th).</p><p><strong>Spirit-Bound Blade (Spell)</strong>: The weapon also
      gains the heartseekerUE special ability.</p>
  subType: classFeat
  tags:
    - Phantom Emotional Focus
type: feat
