name: Knave Standard
system:
  associations:
    classes:
      - Cavalier
      - Samurai
  description:
    value: >-
      <p><strong>Cavalier/Samurai Banner</strong></p><p>The knave standard is
      common among cavaliers of the River Kingdoms. An ally who benefits from
      this standard gains a +2 dodge bonus to AC against attacks of opportunity
      provoked by movement and a +1 morale bonus on attack rolls that benefit
      from flanking. At 10th level and every 5 levels thereafter, the bonus to
      AC increases by 1. At 14th level, an ally benefiting from the banner gains
      sneak attack +1d6; this stacks with other sources of sneak attack. When
      the cavalier or samurai waves this standard, a number of allies equal to
      the cavalier or samurai's Charisma modifier (minimum 1) within 60 feet can
      each attempt a feint against a foe she threatens as an immediate
      action.</p>
