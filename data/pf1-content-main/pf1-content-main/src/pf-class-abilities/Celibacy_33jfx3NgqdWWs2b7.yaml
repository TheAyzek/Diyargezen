name: Celibacy
system:
  associations:
    classes:
      - Monk
  description:
    value: >-
      <p><strong>Monk Vow</strong></p><p>The monk must abstain from all sexual
      and intimate physical activity. A monk with this vow takes it to an
      extreme, refusing to even share a room with another person, or sleeping on
      the opposite side of a camp from other people in a group. A celibate monk
      is not allowed to touch others or have others touch him (including touch
      spells from allies). Striking enemies in battle or being struck by enemies
      is not prohibited, but the monk shuns all peaceful or pleasurable contact.
      A monk with this vow increases his ki pool by 1 ki point for every 5 monk
      levels (minimum +1).</p>
  subType: classFeat
  tags:
    - Monk Vow
type: feat
