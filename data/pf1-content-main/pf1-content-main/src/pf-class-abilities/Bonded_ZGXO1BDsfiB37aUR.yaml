  description:
    value: >-
      <p><strong>Cleric Domain</strong></p><p>A triadic priest selects only one
      domain granted by her deity. However, while she is within 10 feet of least
      one of her bonded allies, she gains the following
      benefits.</p><p><strong>Domain Spells</strong>: 1st-ill omen,
      2nd-blindness/deafness, 3rd-bestow curse, 4th-charm monster, 5th-baleful
      polymorph, 6th-control weather, 7th-forcecage, 8th-mind blank, 9th-astral
      projection.</p>
