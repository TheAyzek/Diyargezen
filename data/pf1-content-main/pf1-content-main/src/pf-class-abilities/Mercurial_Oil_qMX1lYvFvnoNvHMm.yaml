name: Mercurial Oil
system:
  associations:
    classes:
      - Alchemist
  description:
    value: >-
      <p><strong>Alchemist Discovery - Annointings</strong></p><p>This gleaming
      silver fluid sinks into a magical metal weapon or suit of armor and
      temporarily liquefies the interior. An affected weapon gains momentum as
      its center of gravity moves outward during a swing, dealing damage as if
      it were one size category larger than it actually is. Affected armor
      resists impact and provides the wearer DR 2/-.</p>
