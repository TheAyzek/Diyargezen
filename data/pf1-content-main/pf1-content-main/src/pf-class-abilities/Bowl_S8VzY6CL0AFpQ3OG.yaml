  description:
    value: >-
      <p><strong>Occultist Sacred Implement</strong></p><p><strong>Deity
      </strong>Asmodeus; <strong>Implement </strong>bowl; <strong>Opposition
      School </strong>transmutation</p><p><em>Amber Prison (Su): </em>You can
      expend 3 points of mental focus to entomb a creature within 40 feet in an
      amberlike prison, rendering it paralyzed and unconscious for 1 minute per
      occultist level you have. The amber prison has 20 hit points; destroying
      the prison frees the creature. A successful Reflex save negates this
      entombment. Whether or not the saving throw is successful, the creature
      can't be the target of this focus power again for 1 day.</p>
