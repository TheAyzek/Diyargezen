name: Battle Song of the People's Revolt
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>This song for fife and drum
      is found in many folios filled with music intended to unite the people of
      Andoran in their secession from Cheliax.</p><p>Prerequisite: Perform
      (percussion) or Perform (wind) 4 ranks.</p><p>Cost: Feat or 2nd-level bard
      spell known.</p><p>Effect: When you learn this masterpiece, choose a
      teamwork feat for which you meet the prerequisites. Once the feat is
      chosen, it can't be changed. This performance grants the chosen feat to
      all allies within 30 feet who can see and hear you. Your allies don't need
      to meet the prerequisites of this feat. Abilities that extend the duration
      of a bardic performance, such as Lingering Performance, affect this
      masterpiece.</p><p>Use: 1 bardic performance round per
      round.</p><p>Action: 1 standard action.</p><p>Special: You can gain this
      masterpiece multiple times. Each time you take this masterpiece, it grants
      a different teamwork feat.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
