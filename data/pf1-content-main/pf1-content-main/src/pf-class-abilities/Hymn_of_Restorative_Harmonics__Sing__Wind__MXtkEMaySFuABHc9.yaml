name: Hymn of Restorative Harmonics (Sing, Wind)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>You perform a song of such
      beauty that it touches the soul of any who hear it, allowing them to
      recover from any adverse conditions.</p><p>Prerequisite: Perform (sing) or
      Perform (wind) 6 ranks.</p><p>Cost: Feat or 3rd-level bard spell
      known.</p><p>Effect: At the end of the round on which you complete this
      song, all allies within 30 feet who observed your performance gain a new
      saving throw to end the ongoing effects of certain debilitating
      conditions. An ally who is exhausted, fatigued, nauseated, sickened,
      staggered, or stunned as the result of a previously failed saving throw
      can attempt a new saving throw to immediately end one of the above
      effects. Characters under multiple effects must choose which effect they
      wish to attempt to end prematurely. Effects that did not grant a save to
      resist (such as the stun effect of power word stun) can't be ended by this
      masterpiece.</p><p>In addition, anyone who observed this performance gains
      the effects of delay poison at a caster level equal to your bard
      level.</p><p>Use: 3 bardic performance rounds.</p><p>Action: 1 full
      round.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
