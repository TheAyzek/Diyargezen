  associations:
    classes:
      - Shaman
  description:
    value: >-
      <p>The shaman’s spirit animal transforms into a conduit of life energy
      able to store succoring magic that can keep the shaman’s allies safe. This
      allows the spirit animal to cast
      @UUID[Compendium.pf1.spells.Item.fipqx43u5blpjsvo]{stabilize} as a
      spell-like ability at will using the shaman’s level as the spell’s caster
      level. In addition, the shaman can transfer any cure spell (a spell with
      “cure” in its name) she casts to her spirit animal as a swift action,
      provided that the spirit animal is within 30 feet of her. This functions
      like @UUID[Compendium.pf1.spells.Item.0axqb92kzlesc24q]{imbue with spell
      ability}, except a spirit animal can be imbued with a cure spell of any
      spell level that its master can cast regardless of the spirit animal’s
      Intelligence or Wisdom score. The spirit animal can hold the spell
      indefinitely, but the shaman cannot prepare a new spell in the imbued
      spell’s spell slot until her spirit animal uses the spell or it is slain,
      or until she dismisses the imbue with spell ability effect (a free
      action). A spirit animal can be imbued with only one spell at a time in
      this manner. If the spirit animal is slain while it is imbued with a cure
      spell, that spell is lost.</p>
