name: Ambras Imre (Trickster)
system:
  associations:
    classes:
      - Medium
  description:
    value: >-
      <p><strong>Medium Legendary Spirit</strong></p><p>Seeking a place to
      practice his illegal art, Chelish poisoner Count Ambras Imre settled in
      Daggermark and eventually established the notorious Daggermark Poisoner's
      Guild.</p><p><strong>Gaining Favor</strong>: Ambras Imre answers only
      mediums who show ingenuity and proficiency in making poisons. To gain his
      favor, you must travel to the Daggermark Poisoners' Guild, or to the
      headquarters of any poisoners' guild, herbalists' guild, or similar
      organization. Once there, you must vow to use poison to eliminate foes
      significantly stronger than yourself, and stealthily place a poison you
      created on a guild member's person (without harming that person) or among
      the person's belongings, which requires a Dexterity check. If you succeed,
      Imre answers your call.</p><p><strong>Taboos</strong>: If you accept a
      taboo while channeling Imre, you must never work for or ally with a
      monarch or totalitarian.</p><p><strong>Apprentice Poisoner (Lesser,
      Su)</strong>: You gain poison use, as per the alchemist class feature.
      When using Craft (alchemy) to create poisons, you receive a bonus equal to
      1/2 your medium level (minimum 1). At 4th level, you gain a +2 bonus on
      all saving throws against poison. This ability replaces trickster's
      edge.</p>
  subType: classFeat
  tags:
    - Medium Legendary Spirit
type: feat
