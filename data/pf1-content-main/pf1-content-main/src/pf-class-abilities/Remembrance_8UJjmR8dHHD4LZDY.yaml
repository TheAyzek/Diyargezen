name: Remembrance
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>At 4th level, when within a
      ruin or other structure that is no longer claimed by civilization, you can
      call upon the wisdom of the land and its long-dead residents. Once per day
      for every 4 druid levels you possess, you can cast divination as a
      spell-like ability. Additionally, if you are within ruins when you cast
      commune with nature, you gain information about the crumbling structures
      around you as though they were part of nature.</p>
  subType: classFeat
  tags:
    - Druid Domain Power
type: feat
