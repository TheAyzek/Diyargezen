name: Stacked Deck
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 1st level, the maverick can
      spend 1 grit point when she attempts a Bluff, Profession (gambler), or
      Sleight of Hand check to roll 1d6 and add the result to the check. She can
      do this after she rolls the check but before the result is revealed. If
      the result of the d6 roll is a natural 6, she rolls another 1d6 and adds
      it to the check. She can continue to do this as long as she rolls natural
      6s, up to a number of times equal to her Wisdom modifier (minimum 1).</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
