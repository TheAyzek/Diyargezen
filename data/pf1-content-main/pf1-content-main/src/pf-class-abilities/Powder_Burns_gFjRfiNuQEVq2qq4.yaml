name: Powder Burns
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 3rd level, the gulch gunner
      learns to maximize the damage dealt by a firearm at extremely close range.
      When the gulch gunner successfully hits an adjacent foe with a ranged
      firearm attack, she may spend 1 grit point to deal an additional 1d6
      points of fire damage from the muzzle flash of her weapon. The target must
      also make a Reflex save (DC 10 + 1/2 the gulch gunner's level + the gulch
      gunner's Wisdom modifier) or catch on fire. This deed replaces the pistol
      whip deed.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
