name: Stirring Discourse of the Mind (Oratory)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>You lecture your audience on
      the merits of studious endeavors and inspire them with new insights into
      the subject matter. As a result of your discourse, those who listen become
      more receptive to knowledge.</p><p>Prerequisite: Perform (oratory) 4
      ranks.</p><p>Cost: Feat or 2nd-level bard spell known.</p><p>Effect: At
      the end of the round on which you complete this song, all allies within 30
      feet who observed your performance gain a new saving throw to end the
      ongoing effects of certain debilitating conditions. An ally who is
      exhausted, fatigued, nauseated, sickened, staggered, or stunned as the
      result of a previously failed saving throw can attempt a new saving throw
      to immediately end one of the above effects. Characters under multiple
      effects must choose which effect they wish to attempt to end prematurely.
      Effects that did not grant a save to resist (such as the stun effect of
      power word stun) can't be ended by this masterpiece.</p><p>In addition,
      anyone who observed this performance gains the effects of delay poison at
      a caster level equal to your bard level.</p><p>Use: 2 rounds of bardic
      performance.</p><p>Action: 1 minute.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
