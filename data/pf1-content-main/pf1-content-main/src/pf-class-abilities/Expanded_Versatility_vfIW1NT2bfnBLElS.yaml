name: Expanded Versatility
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard/Skald - Advanced Versatile Performances</strong></p><p>The
      bard chooses one Perform skill that he has already selected with versatile
      performance. He adds one of the following skills to the list of skills
      that are associated with the chosen Perform skill for the purpose of the
      versatile performance ability: Bluff, Diplomacy, Disguise, Escape Artist,
      Handle Animal, Intimidate, Sense Motive, or Use Magic Device. This option
      can be selected multiple times, but no skill can be associated with the
      same Perform skill more than once.</p>
