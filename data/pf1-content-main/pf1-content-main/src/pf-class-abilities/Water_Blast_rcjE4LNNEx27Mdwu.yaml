name: Water Blast
system:
  associations:
    classes:
      - Sorcerer
  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>As a standard action,
      you can fire a bolt of water at a foe within 30 feet as a ranged touch
      attack. The foe is knocked prone, and at your option may be pushed 5 feet
      directly away from you. A reflex save (DC 10 +1/2 your sorcerer level +
      your Charisma modifier) negates this effect. You can use this ability a
      number of times per day equal to 3 + your Charisma modifier. This
      bloodline power replaces dehydrating touch.</p>
