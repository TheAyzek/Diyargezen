  description:
    value: >-
      <p><strong>Warpriest Blessing</strong></p><p><strong>Associated
      Blessing</strong>: Healing</p><p><strong>Replacement Blessing</strong>:
      The following minor blessing replaces the powerful healer ability of the
      Healing blessing.</p><p><strong>Ameliorating Touch (Minor)</strong>: At
      1st level, your touch is a balm to your suffering allies. You can touch an
      ally as a swift action to temporarily relieve that ally of the fatigued,
      shaken, or sickened condition. This blessing suppresses those conditions
      for 1 minute. At 2nd level, you can spend two uses of your blessing
      ability whenever you heal yourself or an ally with your fervor class
      ability to use this minor blessing as a free action instead of a swift
      action.</p>
