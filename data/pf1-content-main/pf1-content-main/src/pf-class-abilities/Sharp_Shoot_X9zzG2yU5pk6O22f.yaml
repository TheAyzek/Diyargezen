name: Sharp Shoot
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 1st level, a bolt ace can
      resolve an attack against touch AC instead of normal AC when firing a
      crossbow at a target within its first range increment. Performing this
      deed costs 1 grit point. This deed's cost cannot be reduced by any ability
      or effect that reduces the amount of grit points a deed costs (such as
      Signature Deed). This deed replaces deadeye.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
