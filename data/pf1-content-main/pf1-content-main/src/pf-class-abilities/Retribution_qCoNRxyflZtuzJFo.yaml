    value: >-
      <p><strong>Sorcerer Wildblooded Bloodline</strong></p><p>One of your
      ancestors was unjustly executed, and your soul is infused with this
      forebear's vengeful spirit.</p><p><strong>Associated Bloodline</strong>:
      Martyred.</p><p><strong>Bloodline Arcana</strong>: Whenever a creature
      damages you, until the end of your next turn if you apply a metamagic feat
      to a spell that targets that creature, reduce the spell level increase of
      that metamagic feat by 1 (minimum 0).</p><p><strong>Bloodline
      Powers</strong>: You never forgive those who wrong you.</p>
