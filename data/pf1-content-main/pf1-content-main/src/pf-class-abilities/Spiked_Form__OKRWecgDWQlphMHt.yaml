name: Spiked Form*
system:
  associations:
    classes:
      - Shifter
  description:
    value: >-
      <p><strong>Shifter Reactive Form</strong></p><p>The adaptive shifter grows
      spines over her body. Any foe striking her with an unarmed strike or a
      melee natural weapon takes an amount of piercing damage equal to the base
      damage of her shifter claws, which ignores any damage reduction her
      shifter claws would ignore. She can learn this form a second time,
      allowing her to fling her spines as thrown natural weapons that deal
      piercing damage, have a range increment of 30 feet, and allow her to make
      multiple attacks with her spines as part of a full attack; these otherwise
      deal damage and overcome damage reduction as her shifter claws.</p>
  subType: classFeat
  tags:
    - Shifter Reactive Form
type: feat
