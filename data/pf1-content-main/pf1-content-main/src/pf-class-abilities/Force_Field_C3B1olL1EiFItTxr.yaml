name: Force Field
system:
  associations:
    classes:
      - Psychic
  description:
    value: >-
      <p><strong>Psychic Psi-Tech Discovery</strong></p><p>As a swift action,
      you can spend 1 point from your phrenic pool to activate a force field of
      raw psychic energy that provides you with a number of temporary hit points
      equal to 5 + your psychic level (maximum 10 temporary hit points). If you
      spend 2 points from your phrenic pool, the force field provides a number
      of temporary hit points equal to 10 + your psychic level (maximum 20
      temporary hit points). The force field lasts for a number of minutes equal
      to your psychic level. If you spend 3 points from your phrenic pool, the
      force field lasts for twice as long, and it provides fast healing 2. Once
      the temporary hit points are depleted, the force field disappears and you
      cannot reinstate it for 24 hours. You must be at least 3rd level to select
      this discovery.</p>
