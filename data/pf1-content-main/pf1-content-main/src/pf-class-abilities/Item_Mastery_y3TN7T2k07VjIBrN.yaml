  description:
    value: >-
      <p><strong>Advanced Weapon Training</strong></p><p>The fighter gains an
      item mastery feat (see pages 30-31 and pages 26-27 of Weapon Master's
      Handbook) as a bonus feat, which functions with any magic weapon he
      wields, even if the magic weapon does not meet the feat's normal
      requirements. He must meet all of the feat's prerequisites.</p>
