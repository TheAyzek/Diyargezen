name: Wind Savant
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>At 8th level, you treat the
      penalties from natural or magical wind effects as two steps less severe.
      In addition, you are surrounded by a cushion of air that grants you a
      bonus equal to 1/2 your druid level on saving throws against gases,
      gaseous breath weapons, inhaled poisons, and similar
      effects.</p><p>Alternatively, you can choose to gain a Small air elemental
      as a familiar, as if you possessed the Improved Familiar feat. Your
      effective wizard level for this ability is equal to your druid level and
      stacks with other classes that grant a familiar.</p>
  subType: classFeat
  tags:
    - Druid Domain Power
