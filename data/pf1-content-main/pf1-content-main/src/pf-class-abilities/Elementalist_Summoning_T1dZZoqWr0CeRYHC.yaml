name: Elementalist Summoning
system:
  associations:
    classes:
      - Sorcerer
  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 9th level, whenever
      you summon a creature, it gains energy resistance 10 against the energy
      type that matches your elemental bloodline (if it already has such
      resistance, its resistance increases by +5), and its natural attacks deal
      an additional 1d6 points of damage of the same energy type. This bloodline
      power replaces elemental blast.</p>
