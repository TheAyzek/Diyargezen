name: Essence Booster
system:
  associations:
    classes:
      - Alchemist
  description:
    value: >-
      <p><strong>Alchemist Discovery - Annointings</strong></p><p>The alchemist
      applies this golden liniment to a weapon or suit of armor that has a
      tiered special ability (a special ability available in varying degrees of
      potency, such as light fortification or shadow). The affected special
      ability increases by one step (to moderate fortification or greater
      shadow, for example). If the item has multiple tiered special abilities,
      the alchemist chooses one to affect. The item's enhancement bonus
      increases by 1 if it has no tiered magical qualities. The alchemist must
      be at least 8th level to choose this anointing.</p>
  subType: classFeat
  tags:
    - Alchemist Discovery - Annointings
type: feat
