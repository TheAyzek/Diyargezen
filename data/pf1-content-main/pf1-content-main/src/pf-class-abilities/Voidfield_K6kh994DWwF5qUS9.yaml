  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 9th level, you can
      create an area influenced by the black void. This ability acts as an ice
      storm, except the area is also subject to deeper darkness for 1 round per
      four sorcerer levels. You may use this ability once per day at 3rd level,
      and one additional time per day for every three additional levels. The
      bloodline power replaces aurora borealis.</p>
