name: Azata
system:
  associations:
    classes:
      - Medium
  description:
    value: >-
      <p><strong>Medium Outsider Spirit</strong></p><p>An azata is a whimsical
      outsider from Elysium, a living embodiment of freedom and
      goodness.</p><p><strong>Alignment</strong>: Chaotic
      good.</p><p><strong>Spirits</strong>: Bralani (champion), ghaele
      (hierophant), lillend (marshal), raelis (archmage), uinuja (guardian), and
      yamah (trickster).</p><p><strong>Taboos</strong>: Choose one of the
      following: whenever you encounter fine art, food, or performances, you
      must take no actions for 1d4+1 rounds other than to indulge in your find
      or until you see a potential or obvious threat (as per the fascinated
      condition); you must attempt any challenge or obstacle that blocks your
      path unless doing so would be obviously harmful to you or those under your
      care; you must always offer support and protection to any nonevil creature
      that is unable to protect itself.</p><p><strong>Slip the Surly Bonds
      (Intermediate, Sp)</strong>: You can ignore impediments to your mobility.
      For a number of rounds per day equal to your medium level, you can move
      normally regardless of magical effects that impede movement, as if you
      were affected by freedom of movement. In addition, you can cast liberating
      commandUC as a spell-like ability a number of times per day equal to your
      Charisma modifier, using your medium level as the spell's caster
      level.</p><p><strong>Gift of Flight (Gift, Ex)</strong>: You grow feathery
      wings as a swift action, which otherwise function as per fly. You can use
      this ability for a number of minutes each day equal to your medium level.
      These minutes don't need to be consecutive, but must be used in 1-minute
      increments.</p>
  subType: classFeat
