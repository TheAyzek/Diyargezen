name: Song of Sarkoris (Oratory, Sing)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>You recite inspirational
      lines from this epic poem commemorating the final stand at Storasta,
      keeping defiance alive even in the face of certain
      death.</p><p>Prerequisite: Perform (oratory) or Perform (sing) 10
      ranks.</p><p>Cost: Feat or 4th-level bard spell known.</p><p>Effect: When
      you complete the performance, all allies within 30 feet gain an attack of
      opportunity when reduced to negative hit points, or whenever a foe deals
      hit point damage equal to or greater than its Hit Dice, for the duration
      of the performance. The attack of opportunity can be made against any
      enemy within reach; it does not have to be against the source of the
      damage, and does not count toward your allies' maximum attacks of
      opportunity per round. This attack of opportunity is resolved prior to the
      enemy's attack, but the triggering attack is still resolved even if the
      enemy is killed or incapacitated.</p><p>Use: 2 bardic performance rounds
      per round.</p><p>Action: 1 full round.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
