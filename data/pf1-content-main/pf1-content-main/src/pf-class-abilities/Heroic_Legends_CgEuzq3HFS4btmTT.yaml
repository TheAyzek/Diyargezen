      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 15th level, you may
      inspire greatness or inspire heroics as a bard of your sorcerer level by
      sacrificing a spell slot as a swift or move action. The effect lasts a
      number of rounds equal to the sacrificed spell's level; this duration is
      doubled for human recipients.</p>
