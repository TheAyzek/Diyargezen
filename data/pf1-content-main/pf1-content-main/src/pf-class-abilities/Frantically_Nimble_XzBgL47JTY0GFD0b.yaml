  description:
    value: >-
      <p><strong>Gunslinger Dares</strong></p><p>While this dare is active, you
      gain a +2 dodge bonus to AC. You regain 1 grit or panache point when any
      enemy making a ranged or melee attack against you misses you three
      consecutive times. The attacks need not come from the same enemy.</p>
