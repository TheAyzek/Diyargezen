  description:
    value: >-
      <p><strong>Bloodrager - Bloodline Powers</strong></p><p>At 4th level, you
      gain fire resistance 5. Whenever you are subjected to a magical healing
      effect from a cure spell, you regain 1 additional hit point per die
      rolled. At 8th level, your fire resistance increases to 10, and you regain
      2 additional hit points per die rolled when you are healed by a cure
      spell.</p>
