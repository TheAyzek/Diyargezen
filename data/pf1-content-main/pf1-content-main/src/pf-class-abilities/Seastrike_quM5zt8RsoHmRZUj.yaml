name: Seastrike
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>At 6th level, as a free
      action, you may use natural and manufactured weapons in water as if you
      had continuous freedom of movement. As a standard action, you can throw a
      weapon underwater without the normal penalties for throwing weapons; if
      your target is in or under the water, the weapon also acts as a returning
      weapon (see page 471 of the Core Rulebook) for that attack.</p>
