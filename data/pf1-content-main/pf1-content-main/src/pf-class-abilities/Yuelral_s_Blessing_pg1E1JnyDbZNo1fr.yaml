    value: >-
      <p><strong>Wizard Arcane Discovery</strong></p><p>You cast any spells that
      appear on both the wizard and druid spell lists at +1 caster level and
      with +1 to the save DC. In addition, you may replace the material
      component of any arcane spell with gems of the same value. You must be at
      least a 5th-level wizard to select this discovery.</p>
