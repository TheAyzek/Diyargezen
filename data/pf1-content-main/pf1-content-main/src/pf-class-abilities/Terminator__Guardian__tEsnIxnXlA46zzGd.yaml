name: Terminator (Guardian)
system:
  associations:
    classes:
      - Medium
  description:
    value: >-
      <p><strong>Medium Legendary Spirit</strong></p><p>The Terminator is a
      stoic spirit of relentless death.</p><p><strong>Gaining Favor</strong>: To
      gain the Terminator's favor, you must engage in over 1 hour (600 combat
      rounds) of actual life-or-death battle in the same day, refusing to cease
      because of either fatigue or mercy. In addition to the battles themselves,
      this requires a Constitution check. If you succeed, you must swear an oath
      to never retreat from combat and to eschew all mercy, always killing
      unconscious, captured, or surrendered foes, regardless of extenuating
      circumstances.</p><p><strong>Favored Locations</strong>: Arenas,
      fortifications under siege, places of violence.</p><p><strong>Bloodless
      (Lesser, Su)</strong>: You automatically stabilize when at negative hit
      points, and you are killed only if your negative hit point total exceeds
      double your Constitution score. In addition, you can allow the Terminator
      to gain 1 point of influence over you to automatically end any bleed or
      blood drain effect or effect with the painUM descriptor. Doing so is not
      an action, so you can do this even if you are
      unconscious.</p><p><strong>Emotionless Killer (Intermediate, Su)</strong>:
      You are immune to emotionUM effects, including fear, but you can't benefit
      from morale bonuses or bardic performances.</p>
  subType: classFeat
  tags:
    - Medium Legendary Spirit
type: feat
