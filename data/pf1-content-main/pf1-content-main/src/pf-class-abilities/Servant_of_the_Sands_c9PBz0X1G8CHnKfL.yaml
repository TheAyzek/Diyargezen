name: Servant of the Sands
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>At 8th level, once per day,
      you may call upon the aid of a janni as if using lesser planar ally. At
      12th level, you may call upon the aid of any type of common (non-noble)
      genie as if using planar ally. At 16th level, you may call upon the aid of
      a noble genie as if using greater planar ally. If you use this power while
      in desert terrain, you need not make an offering to call the creature(s),
      and the cost of any service is halved.</p>
