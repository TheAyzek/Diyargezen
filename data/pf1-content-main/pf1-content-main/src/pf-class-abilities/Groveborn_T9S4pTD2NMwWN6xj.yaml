  description:
    value: >-
      <p><strong>Sorcerer Wildblooded Bloodline</strong></p><p>Some plant magic
      is more green, while some is more brown, like
      hardwood.</p><p><strong>Associated Bloodline</strong>:
      Verdant.</p><p><strong>Bloodline Arcana</strong>: Your powers of
      compulsion can affect even plant creatures. Whenever you cast a
      mind-affecting or language-dependent spell, it affects creatures of the
      plant type as if they were humanoids that understood your
      language.</p><p><strong>Bloodline Powers</strong>: Your nature powers
      create tough, resilient minions.</p>
