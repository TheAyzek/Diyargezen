name: Physical Enhancement
system:
  associations:
    classes:
      - Wizard
  description:
    value: >-
      <p><strong>Wizard School Power</strong></p><p>You gain a +1 enhancement
      bonus to one physical ability score (Strength, Dexterity, or
      Constitution). This bonus increases by +1 for every five wizard levels you
      possess to a maximum of +5 at 20th level. You can change this bonus to a
      new ability score when you prepare spells. At 20th level, this bonus
      applies to two physical ability scores of your choice.</p>
