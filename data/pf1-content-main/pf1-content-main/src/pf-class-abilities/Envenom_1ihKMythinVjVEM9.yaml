name: Envenom
system:
  associations:
    classes:
      - Sorcerer
  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 3rd level, as a
      swift action, you can lick or bite a melee weapon to imbue it with 1 dose
      of black adder venom. The poison's DC is equal to 10 + 1/2 your sorcerer
      level + your Charisma modifier. You may use this ability once per day at
      3rd level, and one additional time per day for every three additional
      levels. The poison cannot be removed or stored, and the weapon loses the
      benefit of the poison after the first successful attack or 1 hour has
      passed. The bloodline power replaces serpentfriend.</p>
  subType: classFeat
  tags:
    - Sorcerer Bloodline Power
type: feat
