name: Bonded Unity
system:
  associations:
    classes:
      - Cleric
  description:
    value: >-
      <p><strong>Cleric Domain Power</strong></p><p>As a move action, a triadic
      priest can share one teamwork feat she has with up to two bonded
      companions that are within 10 feet of her. Her bonded companions do not
      need to meet the feat's prerequisites and gain the benefits of the feat
      for 1 round plus 1 additional round for every 5 class levels the triadic
      priest has. A bonded companion can gain only one teamwork feat in this way
      at a time. The triadic priest can use this ability a number of times per
      day equal to 3 + her Wisdom modifier.</p>
  subType: classFeat
  tags:
    - Cleric Domain Power
type: feat
