name: Rust Monster Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>The trap
      throws up a cloud of dust ground from the antennae of a rust monster,
      dealing 1d4 points of damage to the target's metal armor and weapons. A
      ranger may increase the damage by 1 point for each additional daily use of
      his trap ability he spends when creating this trap. A successful Reflex
      save negates this damage. If this is an extraordinary trap, the ranger
      must supply a set of rust monster antennae.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
