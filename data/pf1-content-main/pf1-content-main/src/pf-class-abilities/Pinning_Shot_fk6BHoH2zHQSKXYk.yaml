name: Pinning Shot
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 15th level, the bolt ace can
      spend 1 grit point while shooting a crossbow and attempt to pin down its
      target with the bolt. If the crossbow attack hits, it pins the target to a
      nearby object, to a wall, or to the ground, entangling and staggering the
      target. While pinned by the bolt, the target cannot move out of its space
      until it takes a standard action to free itself from the pinning bolt,
      except by means of teleportation. This deed replaces menacing shot.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
