name: Trained Throw
system:
  associations:
    classes:
      - Fighter
  description:
    value: >-
      <p><strong>Advanced Weapon Training</strong></p><p>When the fighter makes
      a ranged attack with a thrown weapon and applies his Dexterity modifier on
      attack rolls and his Strength modifier on damage rolls, he doubles his
      weapon training bonus on damage rolls. Unless he has the Throw Anything
      feat, the fighter can choose only the thrown fighter weapon group with
      this option. If he has Throw Anything, the fighter can choose any fighter
      weapon group with this option and apply this option's benefits to any
      weapon from that group that he throws.</p>
  subType: classFeat
  tags:
    - Advanced Weapon Training
type: feat
