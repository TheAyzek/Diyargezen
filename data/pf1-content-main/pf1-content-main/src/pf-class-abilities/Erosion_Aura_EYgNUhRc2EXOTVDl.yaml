name: Erosion Aura
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>At 8th level, you can project
      an aura of magically enhanced erosion as a standard action. Objects made
      primarily of metal or stone within this aura lose 10 points of hardness.
      Magic items retain a minimum hardness equal to twice their enhancement
      bonus and can attempt a Fortitude saving throw (DC = 10 + half your druid
      level + your Wisdom modifier) to negate this effect. A construct made
      primarily of metal or stone must succeed at a Fortitude save or lose all
      damage reduction and hardness for 1 round. You can use this ability a
      number of times per day equal to 3 + your Wisdom modifier.</p>
  subType: classFeat
  tags:
    - Druid Domain Power
type: feat
