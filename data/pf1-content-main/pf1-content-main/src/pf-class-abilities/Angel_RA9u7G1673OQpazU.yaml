  description:
    value: >-
      <p><strong>Medium Outsider Spirit</strong></p><p>An angel is a servant of
      the good-aligned planes, a voice of unity and cooperation among celestial
      beings.</p><p><strong>Alignment</strong>: Any
      good.</p><p><strong>Spirits</strong>: Astral deva (trickster), balisse
      (hierophant), empyrean (archmage), movanic deva (champion), planetar
      (marshal), and solar (guardian).</p><p><strong>Taboos</strong>: Choose one
      of the following: you must not ignore an opportunity to destroy or hinder
      an evil creature or organization unless doing so would put innocents in
      harm's way; you must always offer your foes a chance to peacefully
      surrender to you, and you must accept and honor any such terms that your
      foes agree to; you must offer whatever support and assistance you can
      spare to any creature that asks such service from you, provided your
      actions do not further the cause of evil.</p><p><strong>Protective Aura
      (Intermediate, Su)</strong>: You gain a +4 deflection bonus to your AC and
      a +4 resistance bonus on saving throws against attacks made by or effects
      created by evil creatures. In addition, you are protected from effects
      created by evil creatures that possess you or exert mental control over
      you, as per protection from evil.</p><p>As a standard action, you can
      project this benefit to allies within 10 feet as an aura. You may use this
      ability for a number of rounds per day equal to your medium level. These
      rounds don't need to be consecutive.</p><p><strong>Truespeech (Gift,
      Su)</strong>: You gain tongues as a constant spell-like ability, with a
      caster level equal to your medium level.</p>
  subType: classFeat
