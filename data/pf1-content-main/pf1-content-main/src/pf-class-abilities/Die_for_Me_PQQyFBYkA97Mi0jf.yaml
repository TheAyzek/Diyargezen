name: Die for Me
system:
  associations:
    classes:
      - Mesmerist
  description:
    value: >-
      <p><strong>Mesmerist Masterful Trick</strong></p><p>The cult master
      instills within either his cohort or one of his followers the desire to
      give her life for him. The cult master can trigger this trick whenever he
      would take hit point damage from an attack, spell, or effect and the
      subject is with 60 feet of him. Half the damage is psychically transferred
      to the subject. This is an enchantment (compulsion) effect.</p>
