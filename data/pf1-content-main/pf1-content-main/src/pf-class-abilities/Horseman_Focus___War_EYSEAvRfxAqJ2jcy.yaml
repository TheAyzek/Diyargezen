  description:
    value: >-
      <p><strong>Phantom Emotional Focus</strong></p><p>Grim phantoms influenced
      by Szuriel, the Horseman of War, look like sinister, black-winged
      angels.</p><p><strong>Skills</strong>: The grim phantom gains ranks in
      Intimidate and Survival equal to its number of Hit
      Dice.</p><p><strong>Good Saves</strong>: Fortitude and
      Reflex.</p><p><strong>Strength Focus</strong>: The grim phantom gains a +2
      bonus to Strength and a -2 penalty to Dexterity. The phantom gains bonuses
      to Strength instead of Dexterity as the grim apostle gains spiritualist
      levels.</p><p><strong>Ruthless Combatant (Su)</strong>: The grim phantom
      threatens a critical hit with its slam attack on a roll of 19-20. At 11th
      level, the phantom's critical modifier with slam attacks increases to x3.
      This doesn't stack with Improved Critical or similar
      effects.</p><p><strong>Aura of Fury (Su)</strong>: At 7th level, the grim
      phantom can create a 20-foot-radius aura as a swift action. Creatures
      within the aura gain a +2 bonus on melee attack rolls but take a -2
      penalty to AC. Ending the aura is a free action.</p><p><strong>Bloodlust
      (Su)</strong>: At 12th level, the grim phantom regains 1d6 hit points with
      each successful slam attack it makes.</p><p><strong>Juggernaut
      (Su)</strong>: At 17th level, the grim phantom becomes immune to any
      effects that would cause it to become cowering, exhausted, fatigued,
      frightened, panicked, shaken, or slowed (as the slow spell).</p>
  subType: classFeat
  tags:
