name: Saga of the Witch Queen (Oratory, Sing)
system:
  associations:
    classes:
      - Skald
  description:
    value: >-
      <p><strong>Skald Saga</strong></p><p>Your tale of Baba Yaga's inexorable
      return allows you to unerringly locate your
      target.</p><p><strong>Prerequisite</strong>: Knowledge (history) 7 ranks,
      Perform (oratory) or Perform (sing) 15 ranks.</p><p><strong>Cost</strong>:
      Feat or 5th-level skald spell known.</p><p><strong>Effect</strong>: You
      tell the epic tale of the Baba Yaga, the Queen of Witches, who founded
      Irrisen after winning the Winter War. Once each century, she deposes one
      of her daughters as queen of Irrisen to install another daughter in her
      place. For 1,400 years, each reigning queen has known that her mother's
      return was a certainty. When you complete the performance, you name a
      creature you have seen or who once owned an item you have in your
      possession, and you immediately know the creature's location, as per
      discern location. At the same time, the creature learns your name and that
      you have determined its current whereabouts.</p><p><strong>Use</strong>:
      10 raging song rounds.</p><p><strong>Action</strong>: 10 minutes.</p>
  subType: classFeat
  tags:
    - Skald Saga
type: feat
