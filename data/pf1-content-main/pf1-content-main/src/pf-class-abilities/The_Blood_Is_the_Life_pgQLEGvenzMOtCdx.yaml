name: The Blood Is the Life
system:
  associations:
    classes:
      - Sorcerer
  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 1st level, you can
      gain sustenance from the blood of the recently dead. As a standard action,
      you can drink the blood of a creature that died within the past minute.
      The creature must be corporeal, must be at least the same size as you, and
      must have blood. This ability heals you 1d6 hit points and nourishes you
      as if you'd had a full meal. You may use this ability a number of times
      per day equal to 3 + your Charisma modifier. This bloodline power replaces
      grave touch.</p>
  subType: classFeat
  tags:
    - Sorcerer Bloodline Power
type: feat
