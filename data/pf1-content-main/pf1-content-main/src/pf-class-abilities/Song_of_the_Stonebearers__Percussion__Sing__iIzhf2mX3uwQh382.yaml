name: Song of the Stonebearers (Percussion, Sing)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>This working song consists
      of a strong rhythm and boneshaking drum beats.</p><p>Prerequisite: Perform
      (sing) or Perform (percussion) 7 ranks.</p><p>Cost: Feat or 3rd-level bard
      spell known.</p><p>Effect: By singing or beating a drum, you set up a good
      rhythm for manual labor, helping those who hear it push against the limits
      of their strength more easily. Up to one creature per bard level that can
      see and hear you can ignore the effects of encumbrance and armor on its
      skill checks and movement while you engage in this performance. This does
      not allow affected creatures to exceed their maximum carrying
      capacity.</p><p>Use: 2 bardic performance rounds per creature for every 10
      minutes of duration.</p><p>Action: 1 minute.</p>
