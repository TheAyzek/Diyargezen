name: Inspiring Confidence
system:
  associations:
    classes:
      - Fighter
  description:
    value: >-
      <p><strong>Advanced Weapon Training</strong></p><p>A number of times per
      day equal to his highest weapon training bonus as a swift action, the
      fighter can allow one ally within 30 feet to attempt a new saving throw
      against an ongoing fear effect that causes the ally to cower or to become
      frightened, panicked, or shaken. If the ally succeeds at the save, the
      effect ends. A fighter can use this option even when not wielding a weapon
      from the associated weapon group.</p>
  subType: classFeat
  tags:
    - Advanced Weapon Training
type: feat
