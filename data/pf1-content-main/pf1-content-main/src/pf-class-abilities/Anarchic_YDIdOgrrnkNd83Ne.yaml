  description:
    value: >-
      <p><strong>Sorcerer Wildblooded Bloodline</strong></p><p>Your magical
      power taps into pure anarchy.</p><p><strong>Associated Bloodline</strong>:
      Protean.</p><p><strong>Bloodline Arcana</strong>: Whenever you fail a
      concentration check to cast a spell, a cantrip effect is created. Randomly
      determine one of your cantrips known (for example, if you know 6 cantrips,
      roll 1d6). There is a 50% chance this cantrip affects a target of your
      choice within 60 feet; otherwise it affects you.</p><p><strong>Bloodline
      Powers</strong>: Raw magical energy lashes out when you destroy or negate
      hostile spells.</p>
