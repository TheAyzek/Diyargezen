name: Resilient Illusions
system:
  associations:
    classes:
      - Wizard
  description:
    value: >-
      <p><strong>Wizard Arcane Discovery</strong></p><p>You are able to conjure
      illusions so lifelike that they defy disbelief. Anytime a creature tries
      to disbelieve one of your illusion effects, make a caster level check.
      Treat the illusion's save DC as its normal DC or the result of the caster
      level check, whichever is higher. You must be at least an 8th-level wizard
      to select this discovery.</p>
  tags:
    - Wizard Arcane Discovery
type: feat
