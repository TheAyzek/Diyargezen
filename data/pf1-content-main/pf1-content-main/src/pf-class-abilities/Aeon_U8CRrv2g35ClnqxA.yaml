name: Aeon
system:
  associations:
    classes:
      - Medium
  description:
    value: >-
      <p><strong>Medium Outsider Spirit</strong></p><p>An aeon is an inscrutable
      force that dispassionately seeks to bring perfect balance to the
      multiverse.</p><p><strong>Alignment</strong>:
      Neutral.</p><p><strong>Spirits</strong>: Akhana (guardian), bythos
      (archmage), lipika (hierophant), paracletus (marshal), and pleroma
      (champion), theletos (trickster).</p><p><strong>Taboos</strong>: Choose
      one of the following: you must not be the willing target of a spell or
      ability that grants a morale bonus; you must not consciously lie or
      attempt to deceive; you must not purposefully end the life or stop the
      bleeding (through skill or magic) of a dying creature.</p><p><strong>Void
      Form (Intermediate, Su)</strong>: You gain a +2 deflection bonus to your
      AC. In addition, there is a 50% chance that a confirmed critical hit
      against you is negated, and the damage is rolled normally; this chance
      doesn't stack with any provided by similar abilities, such as from a suit
      of armor with the light, medium, or heavy fortification special
      ability.</p><p><strong>Telepathy (Gift, Su)</strong>: You can mentally
      communicate with any other creature within 100 feet that has a language.
      It is possible to telepathically address multiple creatures at once,
      although maintaining a telepathic conversation with more than one creature
      at a time is just as difficult as simultaneously speaking and listening to
      multiple people at the same time.</p>
  subType: classFeat
  tags:
    - Medium Outsider Spirit
type: feat
