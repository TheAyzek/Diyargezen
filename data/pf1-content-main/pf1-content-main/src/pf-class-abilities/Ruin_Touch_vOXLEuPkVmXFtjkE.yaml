name: Ruin Touch
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>You can strengthen or weaken
      objects with your touch. With a melee touch attack, you can increase or
      decrease the hardness of an object (up to a 10-foot cube) or construct by
      an amount equal to half your druid level (minimum 1) for 1 minute. You
      cannot reduce an object's hardness below 0, and the same target cannot be
      affected by this ability more than once. You can use this ability a number
      of times per day equal to 3 + your Wisdom modifier.</p>
