name: Shot on the Run
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 3rd level, if the black
      powder vaulter has at least 1 grit point, she gains the benefits of the
      Shot on the Run feat. She gains this benefit only when making an attack
      with a firearm with which she is proficient. At 7th level, she can use the
      targeting deed as part of the same full-round action as using Shot on the
      Run.</p>
