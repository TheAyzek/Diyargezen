name: Bludgeoning Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>The trap
      bludgeons the creature that triggers it. The trap makes an attack with a
      bonus equal to the ranger's character level + his Wisdom bonus. The
      triggering creature is denied its Dexterity bonus to AC if it was unaware
      of the trap. If the trap hits, it deals 1d6 points of bludgeoning damage
      for every 4 levels the ranger possesses (minimum 1d6). If it's an
      extraordinary trap, the ranger must provide an object suitable for dealing
      lethal bludgeoning damage, such as a large branch or heavy stone.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
