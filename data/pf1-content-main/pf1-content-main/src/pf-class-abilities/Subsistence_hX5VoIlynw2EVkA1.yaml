name: Subsistence
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>You can survive on very
      little food or water while helping others survive in harsh climates. When
      determining how long you can withstand starvation and thirst, including
      checks to avoid nonlethal damage, treat your Constitution score as though
      it were 10 points higher. Additionally, you gain a bonus equal to one half
      your druid level (minimum 1) on Survival checks in dry hills or desert
      terrain.</p>
  subType: classFeat
  tags:
    - Druid Domain Power
type: feat
