name: Focused Weapon
system:
  associations:
    classes:
      - Fighter
  description:
    value: >-
      <p><strong>Advanced Weapon Training</strong></p><p>The fighter selects one
      weapon for which he has Weapon Focus and that belongs to the associated
      fighter weapon group. The fighter can deal damage with this weapon based
      on the damage of the warpriest's sacred weaponACG class feature, treating
      his fighter level as his warpriest level. The fighter must have Weapon
      Focus with the selected weapon in order to choose this option.</p>
  subType: classFeat
  tags:
    - Advanced Weapon Training
type: feat
