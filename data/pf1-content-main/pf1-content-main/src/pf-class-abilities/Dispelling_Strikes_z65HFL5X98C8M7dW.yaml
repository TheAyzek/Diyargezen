name: Dispelling Strikes
system:
  associations:
    classes:
      - Bloodrager
  description:
    value: >-
      <p><strong>Bloodrager - Bloodline Powers</strong></p><p>At 1st level, when
      you confirm a critical hit against a target, you can also attempt to
      dispel the target as if you had cast dispel magic as a bloodrager spell
      and used the targeted dispel function. You can dispel only a single
      magical effect per use of this ability, and you can use this ability
      against a particular creature only once per day. At 8th level, you gain a
      +2 bonus on your dispel check when using this ability. At 20th level, you
      can attempt to dispel all magical effects on your target when using this
      ability.</p>
  subType: classFeat
  tags:
    - Bloodrager - Bloodline Powers
type: feat
