name: Lazurite Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p>Effect Lazurite radiation increases
      the victim's susceptibility to the attacks of undead creatures that are
      bolstered by the radiation. The target takes a -2 penalty to Armor Class
      against the attacks of undead creatures and on saving throws against
      effects created by undead. This effect lasts for 10 minutes per ranger
      level. A successful Will save negates this effect. If this is an
      extraordinary trap, the ranger must supply a sliver of lazurite.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
