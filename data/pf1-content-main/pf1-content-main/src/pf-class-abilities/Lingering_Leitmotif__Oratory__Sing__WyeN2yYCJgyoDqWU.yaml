name: Lingering Leitmotif (Oratory, Sing)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>Your clever turn of words or
      catchy musical jingle sticks in people's heads long after they have heard
      it.</p><p>Prerequisite: Perform (sing) or Perform (oratory) 4
      ranks.</p><p>Cost: Feat or 2nd-level bard spell known.</p><p>Effect: You
      sing or chant simple phrases or a distinctive series of notes that you
      associate with a specific trade good or service. While you perform these
      jingles, allies within 30 feet are affected by this performance's effects
      and are treated as being affected by your inspire confidence bardic
      performance. Furthermore, if an affected creature purchases the associated
      good or service, that creature immediately gains a number of temporary hit
      points equal to half your bard level.</p><p>Use: 3 bardic performance
      rounds, plus 1 round per additional person affected.</p><p>Action: 1
      standard action.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
