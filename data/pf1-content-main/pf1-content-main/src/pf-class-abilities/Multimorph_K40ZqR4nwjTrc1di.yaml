name: Multimorph
system:
  associations:
    classes:
      - Wizard
  description:
    value: >-
      <p><strong>Wizard Arcane Discovery</strong></p><p>Your studies in
      transmogrification have increased your control over shapechanging spells.
      When you cast a spell of the polymorph subschool on yourself, you may
      expend 1 minute of the spell's duration as a standard action to assume
      another form allowed by the spell. You can do this as often as you like,
      subject to the duration of the spell. You must be at least a 5th-level
      wizard to select this discovery.</p>
  tags:
    - Wizard Arcane Discovery
type: feat
