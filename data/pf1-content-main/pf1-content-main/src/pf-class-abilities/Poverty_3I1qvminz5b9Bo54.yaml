name: Poverty
system:
  associations:
    classes:
      - Monk
  description:
    value: >-
      <p><strong>Monk Vow</strong></p><p>The monk taking a vow of poverty must
      never own more than six possessions-a simple set of clothing, a pair of
      sandals or shoes, a bowl, a sack, a blanket, and any one other item. Five
      of these items must be of plain and simple make, though one can be of some
      value (often an heirloom of great personal significance to the monk). The
      monk can never keep more money or wealth on his person than he needs to
      feed, bathe, and shelter himself for 1 week in modest accommodations. He
      cannot borrow or carry wealth or items worth more than 50 gp that belong
      to others. He is allowed to accept and use curative potions (or similar
      magical items where the item is consumed and is valueless thereafter) from
      other creatures. A monk with this vow increases his ki pool by 1 ki point
      for every 2 monk levels (minimum +1).</p>
  subType: classFeat
  tags:
    - Monk Vow
type: feat
