name: Ectoplasmic Anchor
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 7th level, an incorporeal
      undead creature hit by one of the graveslinger's ghostbane shots becomes
      infused with ectoplasm, interfering with its defenses and mobility. The
      creature must succeed at a Will save (DC = 10 + half the graveslinger's
      level + the graveslinger's Wisdom modifier) or become semicorporeal for 1
      round. A semicorporeal creature takes half damage (50%) from nonmagical
      attack forms, and it takes full damage from magic weapons, spells,
      spell-like effects, and supernatural effects. During this time, it cannot
      enter or pass through solid objects.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
