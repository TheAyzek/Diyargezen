    value: >-
      <p><strong>Hunter Animal Focus</strong></p><p>The creature gains a +2
      competence bonus on Perception checks and reduces the flanking bonuses of
      creatures flanking it by 1. This Perception bonus increases to +3 at 8th
      level and +4 at 15th level. At 12th level, the creature can't be
      flanked.</p>
