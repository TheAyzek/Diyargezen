name: Toxic Fumes Trap*
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>A ranger can
      add this to a smoke trap. The smoke this trap creates is extremely
      noxious. Any breathing creature must succeed at a Fortitude saving throw
      (in addition to the Fortitude save for the smoke trap) or be nauseated
      every round it's within the smoke and for 1d4+1 rounds after leaving the
      smoke. If this is an extraordinary trap, the ranger must use a toxic
      material when setting the trap, such as noxious aromatic (Pathfinder
      Player Companion: Animal Archive 13).</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
