name: Channeled Energy Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>This trap
      creates a positive or negative energy effect designed to harm either
      undead or living creatures, respectively. The target takes a number of
      points of damage equal to 1d8 + the ranger's level from either positive
      energy or negative energy (Will save for half). If this is an
      extraordinary trap, the ranger must supply a vial of holy water (positive
      energy) or unholy water (negative energy).</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
