  description:
    value: >-
      <p><strong>Wizard Arcane Discovery</strong></p><p>You gain the ability to
      speak with and understand the response of any animal as if using speak
      with animals, though each time you speak to animals, you must decide to
      communicate with either amphibians, birds, fish, mammals, or reptiles, and
      can only speak to and understand animals of that type. You can make
      yourself understood as far as your voice carries. This discovery does not
      predispose any animal addressed toward you in any way. When you reach 12th
      level, you can also use this ability to communicate with vermin. You must
      be at least a 5th-level wizard to select this discovery.Fast Study</p>
  tags:
    - Wizard Arcane Discovery
type: feat
