name: The Canticle of Joy (Sing)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>Your haunting melody is
      capable of shattering the very minds of those who hear
      it.</p><p>Prerequisite: Perform (sing) 7 ranks.</p><p>Cost: Feat or
      3rd-level bard spell known.</p><p>Effect: This agonizing eulogy gets into
      a listener's blood, and bestows on him the phantom sensation of all the
      agonies suffered by Zon-Kuthon's most pious worshipers. One target within
      range is cursed as though affected by bestow curse as long as the bard
      maintains the performance. Although this lullaby does have words, it is
      not a language-dependent effect.</p><p>Use: 1 bardic performance round per
      round.</p><p>Action: 1 round.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
