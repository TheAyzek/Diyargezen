name: Distracting Shot
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 7th level, a bolt ace can
      spend 1 grit point and choose to miss a target that she could normally
      attack within her range with a crossbow attack. When she does, the target
      loses its Dexterity bonus to AC (if any) for 1 round. This deed replaces
      startling shot.</p>
