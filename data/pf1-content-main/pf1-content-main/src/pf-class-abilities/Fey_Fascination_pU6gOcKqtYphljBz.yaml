name: Fey Fascination
system:
  associations:
    classes:
      - Sorcerer
  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 1st level, as a
      standard action, you can force one target within 30 feet to make a Will
      save (DC = 10 + 1/2 your sorcerer level + your Charisma modifier) or be
      fascinated for 1 round for every 2 sorcerer levels you possess (minimum
      1). This is a mind-affecting, illusion (pattern) effect. You can use this
      ability a number of times per day equal to 3 + your Charisma modifier.
      This bloodline power replaces laughing touch.</p>
  subType: classFeat
  tags:
    - Sorcerer Bloodline Power
type: feat
