name: Fast Healing (Su)
system:
  associations:
    classes:
      - Arcanist
  description:
    value: >-
      <p><strong>Arcanist Exploit - Greater</strong></p><p>A white mage can
      spend 1 point from her arcane reservoir and expend a spell slot of at
      least 2nd level to grant her allies the fast healing ability. Allies
      within 30 feet gain fast healing (Bestiary 300) equal to 1/2 the level of
      the spell slot sacrificed. This effect lasts for a number of rounds equal
      to the arcanist's Charisma modifier (minimum 1).</p>
  subType: classFeat
  tags:
    - Arcanist Exploit - Greater
type: feat
