name: Wildfire
system:
  associations:
    classes:
      - Warpriest
  description:
    value: >-
      <p><strong>Warpriest Blessing</strong></p><p><strong>Deities</strong>:
      Evil deities that offer the Fire blessing or nonevil deities with
      disasters in their portfolios</p><p><strong>Leaping Flames
      (minor)</strong>: You touch an ally to bless it with the speed of a
      wildfire for 1 minute. The ally gains a +10-foot enhancement bonus to its
      base speed, and the ally gains a +1 dodge bonus to its AC against attacks
      of opportunity.</p><p><strong>Fiery Wake (major)</strong>: At 10th level,
      when you move, you can use a swift action to invoke a blazing blessing on
      yourself. For the rest of your turn, your movement leaves behind a
      10-foot-tall wall of opaque fire in your path. The wall burns for 1
      minute. A creature that touches the wall takes 2d6 points of fire
      damage.</p>
  subType: classFeat
  tags:
