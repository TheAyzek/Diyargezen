name: Triple Time (Percussion, String, Wind)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>Your lively cadence puts a
      spring in the step of weary marchers.</p><p>Prerequisite: Perform
      (percussion) 3 ranks, Perform (string) 3 ranks, or Perform (wind) 3
      ranks.</p><p>Cost: Feat or 1st-level bard spell known.</p><p>Effect: This
      bright and spritely tune mimics the sound of human feet, slowly building
      to a steady, ground-eating pace. When you complete this performance, you
      affect one ally in hearing range per bard level. This masterpiece
      increases the affected target's base land speed by 10 feet for 1 hour.
      This adjustment is treated as an enhancement bonus. There is no effect on
      other modes of movement, such as burrow, climb, fly, or swim. As with any
      effect that increases your speed, this spell affects your jumping distance
      (see the Acrobatics skill).</p><p>Use: 1 bardic performance
      round.</p><p>Action: 1 minute.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
