name: Agathion Bond
system:
  associations:
    classes:
      - Paladin
  description:
    value: >-
      <p><strong>Paladin Variant Divine Bond</strong></p><p>As a standard
      action, the paladin can call forth an agathion spirit that bonds to her
      healing hands for 1 minute per paladin level, causing her to manifest
      physical traits evocative of one kind of agathion. This bond allows the
      paladin to add her Charisma bonus to the amount of hit points that she
      restores with her spells, her lay on hands ability, and her channel energy
      ability. For every 3 levels beyond 5th, she restores 1 additional hit
      point with those abilities, up to a maximum of 5 + her Charisma modifier
      at 20th level. The paladin can use this ability once per day at 5th level,
      and one additional time per day for every 4 levels beyond 5th, up to a
      total of four times per day at 17th level.</p>
  subType: classFeat
  tags:
    - Paladin Variant Divine Bond
type: feat
