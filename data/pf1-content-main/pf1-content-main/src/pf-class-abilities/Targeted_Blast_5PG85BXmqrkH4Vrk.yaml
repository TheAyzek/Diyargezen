name: Targeted Blast
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 1st level, when using a
      firearm or siege engine that targets an area rather than a specific
      creature, the siege gunner can spend 1 grit point to focus the brunt of
      the blast on a single creature within the target area. The target creature
      takes 1 additional point of damage for each level the siege gunner
      possesses. This is precision damage and is not multiplied on a critical
      hit. At 5th level and for every 5 levels the siege gunner possesses beyond
      that, she can select an additional creature to target with this bonus
      damage. Targets must be selected before any attack rolls or saving throws
      are made. This ability replaces deadeye.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
