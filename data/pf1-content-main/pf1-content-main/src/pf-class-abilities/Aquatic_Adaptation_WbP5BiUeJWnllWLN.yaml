  description:
    value: >-
      <p><strong>Bloodrager - Bloodline Powers</strong></p><p>At 4th level, you
      gain a swim speed of 30 feet and the ability to breathe both underwater
      and in air. At 8th level, you gain cold resistance 5. At 12th level, your
      swim speed increases to 60 feet, and you have the 4thlevel benefits of
      aquatic adaptation constantly, even when not in bloodrage (but not the
      8th- and 12th-level benefits).</p>
