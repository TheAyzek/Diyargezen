name: Summoned Ally Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>The trap
      summons a creature as summon nature's ally I with a caster level equal to
      the ranger's level - 3. This trap functions as summon nature's ally II at
      8th level, summon nature's ally III at 11th level, and summon nature's
      ally IV at 14th level. The summoned creature or creatures appear in a
      location within the trap's range designated when the trap is set; if it's
      not possible for the creatures to appear in that location, they appear in
      the nearest unoccupied space. The ranger can choose a command of no more
      than 25 words when the trap is created; the creature or creatures follow
      those instructions, or otherwise attack the creature that triggered the
      trap.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
