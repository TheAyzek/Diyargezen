    value: >-
      <p><strong>Mesmerist Devilbane Gaze</strong></p><p>The target of your
      hypnotic stare must succeed at a concentration check (DC = 15 + the level
      of the spell) to activate any of its spell-like abilities (but not
      standard spellcasting). If the target fails the check, the spelllike
      ability doesn't function but is still expended.</p>
