  description:
    value: >-
      <p><strong>Advanced Weapon Training</strong></p><p>For any weapon in the
      associated weapon group with which the fighter is not proficient, the
      penalty on attack rolls taken as a result of not being proficient is
      reduced by an amount equal to the fighter's weapon training bonus with
      that weapon group. Once the penalty is reduced to 0, the fighter becomes
      proficient with such weapons.</p>
  subType: classFeat
  tags:
    - Advanced Weapon Training
type: feat
