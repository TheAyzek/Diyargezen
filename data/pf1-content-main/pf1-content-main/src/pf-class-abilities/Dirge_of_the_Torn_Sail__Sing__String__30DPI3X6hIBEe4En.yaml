name: Dirge of the Torn Sail (Sing, String)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>Your ominous refrain warns
      away those who would trespass in your domain.</p><p>Prerequisite: Perform
      (sing) or Perform (string instruments) 7 ranks.</p><p>Cost: Feat or
      2nd-level spell known.</p><p>Effect: Your song warns of the terrible fate
      awaiting anyone entering your territory. All creatures within 30 feet who
      can hear your performance must succeed at a Will saving throw or be
      compelled to flee from you, as per greater command. For creatures on a
      ship, this effect means taking efforts to alter course and sail away. An
      affected creature continues its efforts for as long as the performance
      continues, and it reacts with violence to anyone attempting to prevent it
      from fleeing. Abilities that extend the duration of a bardic performance
      (such as Lingering Performance) affect this masterpiece.</p><p>Use: 1
      bardic performance round per round.</p><p>Action: 1 standard action.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
