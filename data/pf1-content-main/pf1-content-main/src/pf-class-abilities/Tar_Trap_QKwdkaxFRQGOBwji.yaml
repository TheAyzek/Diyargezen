name: Tar Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>The target
      is coated in a thin layer of sticky tar unless it succeeds at a Reflex
      save. It is entangled, and becomes susceptible to catching fire from any
      source of flame. If lit on fire, the tar burns intensely for 1 round; it
      deals 2d6 points of fire damage and is destroyed in the process. Unless
      burned away, the tar remains for 1 round per ranger level. If this is an
      extraordinary trap, the ranger must supply a dose of tar.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
