name: Fascinate
system:
  associations:
    classes:
      - Sorcerer
  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 3rd level, you gain
      the ability to use a Perform skill to cause one or more creatures to
      become fascinated with you. This acts as the fascinate bardic perform
      ability, except the save DC is 10 + 1/2 your sorcerer level + your
      Charisma bonus, and it lasts 1 round/level. You may use this ability once
      per day at 3rd level, twice per day at 8th level, three times per day at
      13th level, and four times per day at 18th level.</p>
  subType: classFeat
  tags:
    - Sorcerer Bloodline Power
type: feat
