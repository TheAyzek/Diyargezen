name: Smoke Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>This trap
      bellows out thick, choking smoke that fills the trapped square and all
      adjacent squares. Any breathing creature in these squares must succeed at
      a Fortitude saving throws or take a -4 penalty to Strength and Dexterity
      every round it's within the smoke and for 1d4+1 rounds after leaving the
      smoke. All sight, even darkvision, is ineffective in or through the smoke.
      The smoke lasts for 1 round per 2 ranger levels, and is dispersed by wind
      as fog cloud. If this is an extraordinary trap, the ranger must use an
      alchemical component when setting the trap, such as a smokestick.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
