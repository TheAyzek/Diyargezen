name: Spell-Storing Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>This trap
      behaves like a greater glyph of warding, except the maximum level of spell
      it can hold is 1. A ranger may increase the maximum level by 1 for each
      daily use of his trap ability he spends when creating this trap. The spell
      contained must be supplied by either the ranger or another creature within
      1 round of the trap being laid. The duration of this trap is dependent on
      the ranger's level, but a target receives only one save, that of the spell
      contained.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
