  description:
    value: >-
      <p><strong>Wizard Arcane Discovery</strong></p><p>Select one spell granted
      by a domain belonging to the god you worship. This spell must be at least
      2 levels lower than the highest-level wizard spell you can cast. When you
      first prepare your spells for the day, you can prepare this spell once,
      using a spell slot 1 level higher than the spell's actual level. This is
      cast as a divine spell.</p>
