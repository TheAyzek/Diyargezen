  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>At 6th level, you can use the
      Disable Device and Sleight of Hand skills at a range of 30 feet. Working
      at a distance increases the normal skill check DC by 5, and you cannot
      take 10 on this check. Any object to be manipulated must weigh 5 pounds or
      less. You can only use this ability if you have at least 1 rank in the
      skill being used.</p>
