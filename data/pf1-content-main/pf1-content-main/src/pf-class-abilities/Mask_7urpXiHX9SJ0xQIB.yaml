    value: >-
      <p><strong>Occultist Sacred Implement</strong></p><p><strong>Deity
      </strong>Norgorber; <strong>Implement </strong>mask; <strong>Opposition
      School </strong>conjuration</p><p><em>Psychic Mirage (Sp): </em>You can
      expend 1 point of mental focus to become invisible to a single target
      within 30 feet, as per invisibility, and remain so for 1 minute per
      occultist level you have. This invisibility doesn't affect other
      creatures. While within 30 feet of the target, you can expend 1 point of
      mental focus to read the target's surface thoughts as per detect
      thoughts.</p>
