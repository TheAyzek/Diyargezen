name: Invoke the Harrow
system:
  associations:
    classes:
      - Sorcerer
  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 9th level, you can
      draw a random harrow card from a complete harrow deck you own as a
      standard action and channel the aspects of the card into your body. You
      take on superficial traits featured on the card and gain a +4 enhancement
      bonus to the ability score associated with the card's suit. You can invoke
      the harrow for a number of minutes per day equal to your sorcerer level;
      the duration need not be continuous, but it must be used in 1-minute
      increments.</p>
  subType: classFeat
  tags:
    - Sorcerer Bloodline Power
type: feat
