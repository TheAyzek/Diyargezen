name: Ghostbane Shot
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 1st level, once per day by
      spending 10 minutes to combine mundane ammunition with a mixture of grave
      dirt and powdered bone, the graveslinger can prepare a number of special
      bullets equal to her graveslinger level plus her Wisdom modifier (minimum
      1). When attacking incorporeal undead, these bullets are treated as if
      they had the ghost touch special ability. These bullets function only for
      the graveslinger, and if not fired within 24 hours, the bullets become
      inert, losing their ghost touch special ability.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
