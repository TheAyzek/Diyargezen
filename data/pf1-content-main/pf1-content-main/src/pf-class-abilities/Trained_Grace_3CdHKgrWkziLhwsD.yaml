  description:
    value: >-
      <p><strong>Advanced Weapon Training</strong></p><p>When the fighter uses
      Weapon Finesse to make a melee attack with a weapon, using his Dexterity
      modifier on attack rolls and his Strength modifier on damage rolls, he
      doubles his weapon training bonus on damage rolls. The fighter must have
      Weapon Finesse in order to choose this option.</p>
