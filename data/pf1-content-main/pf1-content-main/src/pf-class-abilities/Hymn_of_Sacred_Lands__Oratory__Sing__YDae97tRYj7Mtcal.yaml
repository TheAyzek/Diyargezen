name: Hymn of Sacred Lands (Oratory, Sing)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>You cherish and love your
      home with such strength that your words weave protective magic around your
      dwelling.</p><p>Prerequisite: Perform (oratory) 16 ranks or Perform (sing)
      16 ranks.</p><p>Cost: Feat or 5th-level bard spell known.</p><p>Effect:
      You can perform this masterpiece only within 1 mile of a location where
      you've lived for at least 1 uninterrupted month. When you complete the
      performance, the area within 1,000 feet of your home is protected by the
      effects of guards and wards for 1 week. This masterpiece's effects do not
      affect or hinder other residents who have a home, no matter how small or
      neglected, within the affected area.</p><p>Use: 30 rounds of bardic
      performance.</p><p>Action: 30 minutes.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
