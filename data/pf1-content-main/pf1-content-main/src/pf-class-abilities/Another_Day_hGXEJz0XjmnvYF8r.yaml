  description:
    value: >-
      <p><strong>Vigilante Talent</strong></p><p>When the vigilante is dropped
      unconscious due to hit point damage, he automatically stabilizes, but he
      can also appear to be dead, unless an examining creature succeeds at a
      Heal check (DC = 20 + the vigilante's class level) or, if using magic such
      as deathwatch, a caster level check with the same DC (the ability to
      affect spells is supernatural; the rest of the ability is extraordinary).
      The vigilante counts as having received aid and automatically succeeds at
      the Constitution check to become conscious after 1 hour (unless he has
      actually died in the meantime).</p>
  subType: classFeat
  tags:
    - Vigilante Talent
type: feat
