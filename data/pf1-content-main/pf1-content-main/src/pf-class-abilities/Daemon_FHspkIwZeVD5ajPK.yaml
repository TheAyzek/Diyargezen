name: Daemon
system:
  associations:
    classes:
      - Medium
  description:
    value: >-
      <p><strong>Medium Outsider Spirit</strong></p><p>A daemon is a nihilistic
      fiend from Abaddon, an entity obsessed with the eradication of mortal
      life.</p><p><strong>Alignment</strong>: Neutral
      evil.</p><p><strong>Spirits</strong>: Astradaemon (hierophant),
      ceustodaemon (guardian), derghodaemon (champion), phasmadaemon
      (trickster), purrodaemon (marshal), and venedaemon
      (archmage).</p><p><strong>Taboos</strong>: Choose one of the following:
      you must painfully end the life of a single mortal creature (with no fewer
      than half your Hit Dice) per day, provided that doing so does not
      jeopardize your own safety; you must take every opportunity to manipulate
      and coerce others into performing self-deprecating and self-destructive
      actions; you must consume a bit of every mortal creature you slay, be it
      flesh or soul.</p><p><strong>Summon Daemon (Intermediate, Sp)</strong>:
      You can summon a servant of Abaddon as a standard action. This functions
      as per summon monster II, but you can summon only animals with the
      fiendish template or outsiders with the daemon subtype-including any
      daemon from the Expanded Monster Summoning Options table (Pathfinder
      Player Companion: Monster Summoner's Handbook 28). This ability can summon
      only one creature, regardless of the list used. For every 2 medium levels
      beyond 6th, the level of the summon monster spell increases by 1 (to a
      maximum of summon monster IX at 20th level). You can use this ability a
      number of times per day equal to 3 + your Charisma
      modifier.</p><p><strong>Consume the Soul (Gift, Sp)</strong>: You can
      consume or imprison the soul of a dying creature. You gain the ability to
      cast death knell as a spell-like ability three times per day using your
      medium level as the spell's caster level. Instead of gaining the normal
      benefits of this spell when the target fails its save, you can instead
      lock the target's soul within a soul gem, functioning like the soul lock
      ability of a cacodaemon (Pathfinder RPG Bestiary 2 64). You count as an
      evil outsider for the purpose of determining whether you receive a benefit
      when you ingest a soul gem created by the soul lock ability.</p>
  subType: classFeat
