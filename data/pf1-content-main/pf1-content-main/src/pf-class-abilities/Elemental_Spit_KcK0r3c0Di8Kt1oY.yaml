  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>Starting at 1st level,
      you can fire an elemental ray that matches your linnorm bloodline's energy
      type as a standard action, targeting any foe within 30 feet as a ranged
      touch attack. The ray deals 1d6 points of damage + 1 for every two
      sorcerer levels you possess. You can use this ability a number of times
      per day equal to 3 + your Charisma modifier. This bloodline power replaces
      claws.</p>
