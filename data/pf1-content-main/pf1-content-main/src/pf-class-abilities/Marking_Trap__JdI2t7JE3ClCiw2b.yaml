  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>If the
      triggering creature fails its save against the trap, it is marked with a
      dye and/or scent of the ranger's choosing. A scent mark decreases the DC
      of tracking the marked creature by scent by 4. The mark can be washed off
      with vigorous scrubbing, but fades on its own over several days.</p>
