  description:
    value: >-
      <p><strong>Sorcerer Wildblooded Bloodline</strong></p><p>Your heavenly
      power derives from insight rather than force of
      personality.</p><p><strong>Associated Bloodline</strong>:
      Celestial.</p><p><strong>Bloodline Arcana</strong>: Unlike most sorcerers
      whose innate magic is powered by force of personality, you use pure
      willpower to master and fuel your magic. You use your Wisdom, rather than
      your Charisma, to determine all class features and effects relating to
      your sorcerer class, such as bonus spells per day, maximum spell level you
      can cast, and the save DCs of your spells. You gain a +2 bonus on all Heal
      and Knowledge (religion) checks.</p><p><strong>Bloodline Powers</strong>:
      Your quasi-divine nature gives you strange powers.</p>
