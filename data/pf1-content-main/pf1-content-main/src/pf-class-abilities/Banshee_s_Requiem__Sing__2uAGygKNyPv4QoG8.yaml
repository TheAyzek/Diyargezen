name: Banshee's Requiem (Sing)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>By filling your performance
      with the mournful angst of a lost love, your song evokes the inexorable
      pull of the grave upon every living thing.</p><p>Prerequisite: Perform
      (sing) 17 ranks.</p><p>Cost: Feat or 6th-level bard spell
      known.</p><p>Effect: All living creatures you select within 30 feet at the
      start of your turn each round gain 2 negative levels unless they succeed
      at a Fortitude saving throw (DC = 10 + 1/2 your bard level + your Charisma
      bonus). This is a death effect and a sonic effect. This performance has
      audible components.</p><p>Use: 3 rounds of bardic performance per
      round.</p><p>Action: 1 full round action.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
