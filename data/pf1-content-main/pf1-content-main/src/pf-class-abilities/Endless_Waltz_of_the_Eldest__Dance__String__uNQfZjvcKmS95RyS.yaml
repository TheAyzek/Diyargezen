name: Endless Waltz of the Eldest (Dance, String)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>This elegant but dizzyingly
      fast gnome waltz calls for rapidly changing roles inspired by the many
      faces that the legendary Eldest of the First World
      wear.</p><p>Prerequisite: Perform (dance or string) 4 ranks.</p><p>Cost:
      Feat or 2nd-level bard spell known.</p><p>Effect: One ally within 30 feet
      regains 3 hit points when you activate this performance and each round
      that you maintain it. Whenever the target casts a healing spell while you
      maintain your performance, one of the spell's targets regains 3 additional
      hit points (whether or not the spell normally heals damage). This
      performance relies on audible and visual components. You cannot change the
      targeted ally without ending the performance.</p><p>Use: 1 bardic
      performance round per round.</p><p>Action: 1 standard action.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
