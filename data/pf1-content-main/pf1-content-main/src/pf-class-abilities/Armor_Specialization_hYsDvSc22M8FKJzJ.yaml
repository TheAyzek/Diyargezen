name: Armor Specialization
system:
  associations:
    classes:
      - Fighter
  description:
    value: >-
      <p><strong>Advanced Armor Training</strong></p><p>The fighter selects one
      specific type of armor with which he is proficient, such as chain shirts
      or scale mail. While wearing the selected type of armor, the fighter adds
      one-quarter of his fighter level to the armor's armor bonus, up to a
      maximum bonus of +3 for light armor, +4 for medium armor, or +5 for heavy
      armor. This increase to the armor bonus doesn't increase the benefit that
      the fighter gains from feats, class abilities, or other effects that are
      determined by his armor's base armor bonus, including other advanced armor
      training options. A fighter can choose this option multiple times. Each
      time he chooses it, he applies its benefit to a different type of
      armor.</p>
  subType: classFeat
  tags:
    - Advanced Armor Training
type: feat
