  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>This medley of tales
      inspires listeners to new heights of bravery and self
      sacrifice.</p><p>Prerequisite: Perform (act) 3 ranks or Perform (oratory)
      3 ranks.</p><p>Cost: Feat or 2nd-level bard spell known.</p><p>Effect:
      This collection includes the stories of The Big Sky, The Rabbit Prince,
      and The Sickness, among others. When you complete the performance, choose
      one adjacent creature. You and that creature are affected as if you had
      cast shield other.</p><p>Use: 3 bardic performance rounds.</p><p>Action: 3
      rounds.</p>
