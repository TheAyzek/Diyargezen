name: Gun Tank's Resilience
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 15th level, when the gun
      tank has at least 1 grit point and makes a successful Fortitude saving
      throw against an attack that would deal half damage or have a partial
      effect, she takes no damage or other effects from that attack.
      Furthermore, she gains a +2 bonus on all saving throws against fear and
      mind-affecting effects. This deed replaces the evasive deed.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
