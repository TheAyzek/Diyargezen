name: Weapon Sacrifice
system:
  associations:
    classes:
      - Fighter
  description:
    value: >-
      <p><strong>Advanced Weapon Training</strong></p><p>When damage would cause
      the fighter or an adjacent ally to be knocked unconscious or killed, as a
      swift or immediate action the fighter can instead direct the damage to a
      weapon from the associated weapon group that he is wielding. The original
      target takes no damage, but the weapon receives only half its normal
      hardness. The fighter can use this option a number of times per day equal
      to the fighter's weapon training bonus with the associated weapon group.
      He cannot use this option with unarmed attacks.</p>
  subType: classFeat
  tags:
    - Advanced Weapon Training
type: feat
