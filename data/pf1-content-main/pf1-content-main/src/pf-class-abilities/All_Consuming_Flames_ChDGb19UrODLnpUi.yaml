name: All-Consuming Flames
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain Power</strong></p><p>At 8th level, you can channel
      the extraplanar heat into your allies' weapons within 30 feet as a
      standard action. For 1 minute, the affected weapons gain the
      cold-outsider-bane, fire-outsider-bane, or flaming weapon special
      abilities. You must grant each weapon the same ability, and this ability
      affects no more than two of any ally's weapons. You can use this ability
      once per day, plus an additional time per day for every four levels beyond
      8th.</p><p>Alternatively, you can choose to gain a Small fire elemental as
      a familiar, as if you possessed the Improved Familiar feat. Your effective
      wizard level for this ability is equal to your druid level and stacks with
      other classes that grant a familiar.</p>
  subType: classFeat
  tags:
    - Druid Domain Power
type: feat
