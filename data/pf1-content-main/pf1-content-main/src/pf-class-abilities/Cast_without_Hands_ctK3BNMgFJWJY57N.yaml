name: Cast without Hands
system:
  associations:
    classes:
      - Sorcerer
  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 15th level, you
      learn to eschew the use of your hands when casting spells, as a naga
      would. Whenever you cast an arcane spell with a somatic component, you can
      do so even with your hands full, by twisting and gyrating your body. This
      doubles the arcane spell failure chance from your armor (if any), and you
      can't use this ability if you are pinned or immobile.</p>
  subType: classFeat
  tags:
    - Sorcerer Bloodline Power
type: feat
