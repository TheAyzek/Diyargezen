  description:
    value: >-
      <p><strong>Sorcerer Bloodline Power</strong></p><p>At 9th level, when you
      sleep, you can gain information through prophetic visions. Once per day
      when sleeping, you may gain information about actions taken in the next
      week as if you had cast a divination spell. You can gain information about
      a single question at 9th level. At 17th level, you can have two questions
      answered while you sleep, and at 20th level, three questions. This
      bloodline power replaces dreamshaper.</p>
