  description:
    value: >-
      <p><strong>Gunslinger Dares</strong></p><p>While this dare is active, your
      critical threat range with firearms (for gunslingers) or light or
      onehanded piercing melee weapons (for swashbucklers) increases by 1 (20/ 4
      becomes 19-20/ 4, 19-20/ 2 becomes 18-20/ 2, and so on). This effect does
      not stack with similar effects that modify a weapon's critical threat
      range.</p>
