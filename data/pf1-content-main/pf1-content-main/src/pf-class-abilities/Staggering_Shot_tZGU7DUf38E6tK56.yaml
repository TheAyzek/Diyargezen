name: Staggering Shot
system:
  associations:
    classes:
      - Gunslinger
  description:
    value: >-
      <p><strong>Gunslinger Deeds</strong></p><p>At 15th level, when the gulch
      gunner hits an adjacent target with a ranged firearm attack, the target
      must also make a Fortitude save (DC 10 + 1/2 the gulch gunner's level +
      the gulch gunner's Wisdom modifier) or be staggered for 1d4 rounds. This
      deed replaces the menacing shot deed.</p>
  subType: classFeat
  tags:
    - Gunslinger Deeds
type: feat
