  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>The trap
      explodes in flames, dealing a number of points of fire damage equal to 1d6
      + 1/2 the ranger's level to the triggering creature (Reflex negates). If
      it is an extraordinary trap, the ranger must use an explosive material
      such as alchemist's fire when setting the trap.</p>
