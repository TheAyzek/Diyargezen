name: Shadow Splinter
system:
  associations:
    classes:
      - Mesmerist
  description:
    value: >-
      <p><strong>Mesmerist Trick</strong></p><p>The mesmerist protects the
      subject against an attack and redirects the harm to someone else. The
      mesmerist can trigger this trick when the subject takes damage from an
      attack. The damage the subject takes is reduced by an amount equal to 3 +
      the mesmerist's Charisma modifier (to a maximum of the total amount of
      damage the attack deals). Another creature within range of the original
      attack, other than the attacker, is affected by a shadow illusion that
      makes it appear as if the attacker is attacking that creature instead of
      the attacker's actual target. This second creature takes an amount of
      damage equal to the amount by which the attack's damage was reduced. This
      shadow doesn't require a roll to hit and ignores cover and concealment,
      but the target can attempt a Will save to disbelieve the effect. If it
      succeeds at this save, it neither takes the damage nor believes the
      attacker targeted it. This trick can't be triggered if there's no eligible
      second creature within range to take the redirected damage. This is an
      illusion (shadow) effect.</p>
  subType: classFeat
  tags:
    - Mesmerist Trick
type: feat
