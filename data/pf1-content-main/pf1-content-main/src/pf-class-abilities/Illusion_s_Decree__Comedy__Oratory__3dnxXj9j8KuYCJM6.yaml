name: Illusion's Decree (Comedy, Oratory)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>These stories of wiliness
      and mystery inspire listeners to see through
      deceptions.</p><p>Prerequisite: Perform (comedy) 5 ranks or Perform
      (oratory) 5 ranks.</p><p>Cost: Feat or 2nd-level bard spell
      known.</p><p>Effect: These tales include the stories of The Marriage, The
      Queen Mother, and The Rakshasa, among others. While performing this
      masterpiece, you gain a +4 bonus on saving throws to disbelieve illusions.
      You can expend 1 round of bardic performance for each ally other than
      yourself whom you want to gain this bonus.</p><p>Use: 1 bardic performance
      round per round, +1 round per ally affected.</p><p>Action: 1 full
      round.</p>
