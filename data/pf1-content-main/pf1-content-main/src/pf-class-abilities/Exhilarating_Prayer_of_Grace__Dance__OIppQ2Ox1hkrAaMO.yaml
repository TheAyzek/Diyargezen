name: Exhilarating Prayer of Grace (Dance)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>You lead your audience
      through a series of stretches and exercises designed to warm the muscles
      and increase blood circulation.</p><p>Prerequisite: Perform (dance) 4
      ranks.</p><p>Cost: Feat or 2nd-level bard spell known.</p><p>Effect: After
      completing the series of exercises, anyone who observed the performance
      (including yourself ) gains a circumstance bonus on all Acrobatics checks
      and to CMD equal to 1/5 of your bard level (minimum +1). This bonus
      persists for 10 minutes.</p><p>Use: 1 round of bardic
      performance.</p><p>Action: 3 rounds.</p>
