name: Wasteland Stride
system:
  associations:
    classes:
      - Druid
  description:
    value: >-
      <p><strong>Druid Domain</strong></p><p>At 2nd level, you may move through
      light or dense rubble, as well as up or down steep slopes, at your normal
      speed without suffering any impairment. Areas that have been magically
      manipulated to impede motion still affect you, however. This replaces
      woodland stride.</p>
