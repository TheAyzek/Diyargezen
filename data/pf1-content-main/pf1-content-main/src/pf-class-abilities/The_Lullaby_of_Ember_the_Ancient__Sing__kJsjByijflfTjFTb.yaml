name: The Lullaby of Ember the Ancient (Sing)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>You can put powerful
      creatures to sleep with the power of your song.</p><p>Prerequisite:
      Perform (sing) 7 ranks.</p><p>Cost: Feat or 3rd-level bard spell
      known.</p><p>Effect: When you activate this soothing performance, one
      target within close range falls asleep as if affected by deep slumber as
      long as you maintain the performance. Unlike the spell (which affects
      weaker creatures first), this masterpiece targets a specific creature of
      your choice. Although this lullaby does have words, it is not a
      language-dependent effect.</p><p>Use: 1 bardic performance round per
      round.</p><p>Action: 1 round.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
