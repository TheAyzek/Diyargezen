name: Psychopomp
system:
  associations:
    classes:
      - Medium
  description:
    value: >-
      <p><strong>Medium Outsider Spirit</strong></p><p>A psychopomp is a steward
      of souls from the Boneyard, tasked with bringing mortal souls to the
      afterlife.</p><p><strong>Alignment</strong>:
      Neutral.</p><p><strong>Spirits</strong>: Ahmuuth (hierophant), catrina
      (marshal), memitim (champion), morrigna (trickster), vanth (guardian), and
      viduus (archmage).</p><p><strong>Taboos</strong>: Choose one of the
      following: you must destroy all haunts and undead creatures whose paths
      you cross and oppose the creation of such creatures; you must destroy all
      creatures that would seek to imprison or destroy mortal souls, and set
      trapped souls free at every opportunity; you must wear a mask that covers
      the entirety of your face, and never allow it to be removed for as long as
      you channel the psychopomp.</p><p><strong>Spirit Touch (Intermediate,
      Su)</strong>: You gain powers that assist in battling evil spirits. You
      are always granted a saving throw to negate death spells, magical death
      effects, and energy drain, even if one is not normally allowed. In
      addition, as a swift action, you can grant your natural weapons, as well
      as any weapon you wield, the ghost touch weapon special ability for a
      number of rounds equal to your medium level. These rounds don't need to be
      consecutive.</p><p><strong>Spiritsense (Gift, Su)</strong>: You can
      notice, locate, and distinguish between living and undead creatures within
      30 feet, just as if you had the psychopomp's spiritsense ability.</p>
  subType: classFeat
