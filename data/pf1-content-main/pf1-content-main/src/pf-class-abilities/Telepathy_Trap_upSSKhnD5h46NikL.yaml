name: Telepathy Trap
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>The trap
      resonates at a high-pitched frequency audible only to creatures that
      communicate via telepathy. If the triggering creature has the ability to
      communicate via telepathy, the creature becomes overwhelmed by psychic
      feedback. The trapped creature is staggered for 1d4 rounds (Will negates),
      and may not communicate telepathically during this time. This is a sonic,
      mind-affecting effect. Creatures that lack telepathy are not affected by
      this trap, though they may still trigger it.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
