  description:
    value: >-
      <p><strong>Warpriest Blessing</strong></p><p><strong>Deities</strong>:
      Abadar, Asmodeus, Erastil, Iomedae, Irori, Torag,
      Zon-Kuthon.</p><p><strong>Axiomatic Strike (minor)</strong>: At 1st level,
      you can touch one weapon and enhance it with the essence of law. For 1
      minute, this weapon glows blue, pale yellow, or white and deals an
      additional 1d6 points of damage against chaotic creatures. During this
      time, it's treated as lawful for the purposes of overcoming damage
      reduction. This additional damage doesn't stack with the additional damage
      from the axiomatic weapon special ability.</p><p><strong>Battle Companion
      (major)</strong>: At 10th level, you can summon a battle companion. This
      ability functions as summon monster IV with a duration of 1 minute, but
      for only a lawful outsider or an animal with the resolute creature simple
      template (Bestiary 2 293). This ability can summon only one creature,
      regardless of the list used. For every 2 levels beyond 10th, the level of
      the summon monster spell increases by 1 (to a maximum of summon monster IX
      at 20 level).</p>
  subType: classFeat
  tags:
    - Warpriest Blessing
type: feat
