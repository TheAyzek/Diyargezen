    value: >-
      <p><strong>Bloodrager - Bloodline Powers</strong></p><p>At 20th level, you
      become infused with the power of the heavens. You gain immunity to acid,
      cold, and petrification. You also gain resistance 10 to electricity and
      fire, as well as a +4 racial bonus on saving throws against poison. You
      have these benefits constantly, even while not bloodraging.</p>
