name: Penetrating Trap*
system:
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Ranger Trap</strong></p><p><strong>Effect </strong>A ranger can
      only add this to a wounding trap. The damage die of a penetrating trap
      increases to 1d8. Choose either adamantine, cold iron, or silver. The trap
      counts as that material for the purposes of overcoming damage reduction.
      If this is an extraordinary trap, the ranger must provide 1 pound of the
      chosen material during the trap's construction.</p>
  subType: classFeat
  tags:
    - Ranger Trap
type: feat
