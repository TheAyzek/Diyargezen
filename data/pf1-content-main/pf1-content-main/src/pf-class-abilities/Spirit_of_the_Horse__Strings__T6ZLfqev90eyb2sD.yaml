name: Spirit of the Horse (Strings)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>This mournful song, which is
      typically played upon a traditional instrument known as a morin khuur,
      empowers animal companions.</p><p>Prerequisite: Perform (strings) 7
      ranks.</p><p>Cost: Feat or 3rd-level bard spell known.</p><p>Effect: You
      play a soulful melody inspired by the legend in which a boy's prized
      horse, slain by a wicked lord, returns in spirit form and instructs the
      boy to construct an instrument from its body so that neither boy nor horse
      would be lonely. Upon the completion of this performance, you inspire the
      animal (or similar) companions, familiars, and mounts of allies who can
      hear the performance to avoid a similar fate, granting them the benefits
      of greater magic fang with a caster level equal to your bard
      level.</p><p>Use: 1 round of bardic performance per creature
      affected.</p><p>Action: 1 round.</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
