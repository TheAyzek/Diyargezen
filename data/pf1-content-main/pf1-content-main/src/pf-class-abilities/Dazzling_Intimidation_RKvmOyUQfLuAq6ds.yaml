name: Dazzling Intimidation
system:
  associations:
    classes:
      - Fighter
  description:
    value: >-
      <p><strong>Advanced Weapon Training</strong></p><p>The fighter applies his
      weapon training bonus to Intimidate checks and can attempt an Intimidate
      check to demoralize an opponent as a move action instead of a standard
      action. If he has the Dazzling Display feat, he can use it as a standard
      action instead of a full-round action.</p>
