name: Night Queen's Fury (Act, Oratory)
system:
  associations:
    classes:
      - Bard
  description:
    value: >-
      <p><strong>Bard - Masterpieces</strong></p><p>You lay a curse on those who
      have wronged you.</p><p>Prerequisite: Perform (act) or Perform (oratory) 7
      ranks.</p><p>Cost: Feat or 3rd-level bard spell known.</p><p>Effect: You
      scream out a litany of every way you have been harmed by others, from
      physical abuse, to verbal insults, to subtle harassment, to any other
      number of contemptuous actions that denied you something you were
      rightfully due. When you complete the performance, you fall prone, the
      emotion or power behind your speech driving you to your knees. Any
      creature that damaged you within the last round must succeed at a Will
      save or be cursed, as per the bestow curse spell.</p><p>Once per day, if
      you are reduced to fewer than 0 hit points, you can activate this bardic
      masterpiece as an immediate action before you become dying or dead as long
      as you have at least 3 rounds of bardic performance remaining.</p><p>Use:
      3 rounds of bardic performance.</p><p>Action: 1 full-round action (see
      text).</p>
  subType: classFeat
  tags:
    - Bard - Masterpieces
type: feat
