  description:
    value: >-
      <p><strong>Sorcerer Wildblooded Bloodline</strong></p><p>The wintry origin
      of your magic flows like ice water in your veins.</p><p><strong>Associated
      Bloodline</strong>: Boreal.</p><p><strong>Bloodline Arcana</strong>:
      Whenever you cast a spell with the cold descriptor, you may select one
      target of the spell to be slowed (as the spell) for 1 round. A Fortitude
      save (DC 10 + the level of cold spell + your Charisma modifier) negates
      the effect.</p><p><strong>Bloodline Powers</strong>: Sometimes you must
      bring the cold to your enemies.</p>
