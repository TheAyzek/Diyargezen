name: Armed Bravery
system:
  associations:
    classes:
      - Fighter
  description:
    value: >-
      <p><strong>Advanced Weapon Training</strong></p><p>The fighter applies his
      bonus from bravery to Will saving throws. In addition, the DC of
      Intimidate checks to demoralize him increases by an amount equal to twice
      his bonus from bravery. The fighter must have the bravery class feature in
      order to select this option.</p>
