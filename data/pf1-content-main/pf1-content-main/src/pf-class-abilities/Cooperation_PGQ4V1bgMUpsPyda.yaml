  description:
    value: >-
      <p><strong>Warpriest Blessing</strong></p><p><strong>Associated
      Blessing</strong>: Community</p><p><strong>Replacement Blessing</strong>:
      The following minor blessing replaces the communal aid ability of the
      Community blessing.</p><p><strong>Team Effort (Minor)</strong>: At 1st
      level, you can touch an ally and grant it the blessing of cooperation.
      Choose one teamwork feat that you have. The touched ally gains the benefit
      of the chosen teamwork feat for a number of rounds equal to 1/2 your
      warpriest level (minimum 1). Alternatively, you can choose one teamwork
      feat that a touched ally has and gain the benefit of the chosen feat for a
      number of rounds equal to 1/2 your warpriest level (minimum 1).</p>
