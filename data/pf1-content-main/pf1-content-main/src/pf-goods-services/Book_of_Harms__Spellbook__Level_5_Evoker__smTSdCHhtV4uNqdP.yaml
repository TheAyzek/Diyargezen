name: Book of Harms (Spellbook, Level 5 Evoker)
system:
  description:
    value: >-
      <p><em>The leather wrapping of this book is of an indeterminate type, and
      gives off a faint and unpleasant scent, as of charred meat. The writing
      inside is in a jagged hand, and many notes on the ash-smudged pages
      indicate its previous owner sought ever more damaging magic. A glittering
      rune in the cover's center is shaped vaguely like a lightning
      bolt.</em></p><p><strong>Opposition</strong> Divination, transmutation<br
      /><strong>Protection</strong> Average lock (DC 25)<br
      /><strong>Value</strong> 535 gp (900 gp with the preparation
      ritual)</p><h2>Spells</h2><p>3rd-<em>fireball</em><sub>S</sub>,
      <em>lightning bolt</em><sub>S</sub></p><p>2nd-<em>acid arrow</em>,
      <em>darkness</em><sub>S</sub>, <em>ghoul touch</em>, <em>gust of
      wind</em><sub>S</sub></p><p>1st-<em>burning hands</em><sub>S</sub>,
      <em>color spray</em>, <em>corrosive touch</em>, <em>hydraulic
      push</em><sub>S</sub>, <em>hypnotism</em>, <em>magic
      missile</em><sub>S</sub>, <em>ray of enfeeblement</em>, <em>shocking
      grasp</em><sub>S</sub></p><h2>Ritual</h2><p><strong>Harmful Surge
      (Su)</strong> You can maximize a spell, but doing so damages you. Spend
      this boon effect as a free action when you cast a wizard evocation spell.
      When you do, you can treat that spell as if it were cast with the Maximize
      Spell metamagic feat, but you take 1d4 points of damage × the level of the
      spell that you are maximizing. The damage you take cannot be reduced in
      any way.</p>
