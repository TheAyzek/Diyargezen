name: Wisdom of Jatembe (Six Warriors Edition) (Spellbook, Level 11 Diviner)
system:
  description:
    value: >-
      <p><em>This book is bound in thick, rough rawhide. Several cloth ribbons
      are attached to the spine and used as bookmarks, each with a yellowed
      tooth tied to the loose end. Two silver plates are bound to the spine,
      each depicting the stylized face of a different beast. The spells and
      stories recorded throughout the book are each written in a different
      handwriting, ranging from neat block script to wild looping letters that
      are difficult to read at first glance.</em></p><p><strong>Value</strong>
      4,725 gp (6,025 gp with the preparation
      ritual)</p><h2>Spells</h2><p>6th-<em>chain lightning</em>, <em>contagious
      flames</em><sup>APG</sup>, <em>Jatembe's ire</em>, <em>legend lore</em>,
      <em>planar binding</em></p><p> 5th-<em>dismissal</em>, <em>lesser planar
      binding</em>, <em>overland flight</em>, <em>polymorph</em>,
      <em>sending</em>, <em>summon monster V</em>, <em>telepathic bond</em><br
      /> 4th-<em>black tentacles</em>, <em>dimensional anchor</em>, <em>greater
      celestial healing</em>, <em>wall of fire</em></p><p> 3rd-<em>dispel
      magic</em>, <em>haste</em>, <em>planar inquiry</em>, <em>stinking
      cloud</em></p><p> 2nd-<em>blindness/deafness</em>, <em>mirror image</em>,
      <em>spectral hand</em></p><p> 1st-<em>celestial healing</em>, <em>magic
      missile</em>, <em>shocking grasp</em>, <em>true
      strike</em></p><h2>Ritual</h2><p><strong>Jatembe's Vindication
      (Su)</strong> The Old-Mage's teachings are a call to arms for all good
      spellcasters, stressing the importance of using one's talents
      altruistically and philanthropically, and his teachings foster the power
      of good in even the most apathetic heart. Expend this boon when you cast a
      spell that targets one or more creatures. The spell gains the good
      descriptor as well as a +2 sacred bonus on caster level checks to overcome
      the spell resistance of evil creatures. An evil creature cannot use this
      preparation ritual.</p>
