name: Journeyman Book of Rul Thaven (Spellbook, Level 9 Diviner)
system:
  description:
    value: >-
      <p><em>This medium-sized book has a creased spine and supple gray leather
      covers. The leather has rubbed away in certain spots, tiny pinhole burns
      pock the surface, and a brass lock holds the book shut. A woman's portrait
      has been bound into the front cover, and text covers almost all of the
      image except her face: text in circles, with arrows pointing to new
      circles with suppositions. Underneath the woman's chin are the words
      'Diabolist sacrifice?'</em></p><p><strong>Opposition</strong> Illusion,
      transmutation</p><p><strong>Protection</strong> Average lock (DC 25), and
      the 5th-level spells are hidden with <em>secret page</em>. The special
      word is 'reveal.'</p><p><strong>Value</strong> 2,195 gp (3,320 gp with the
      preparation ritual)</p><h2>Spells</h2><p>5th-<em>contact other
      plane</em><sub>S</sub>, <em>major creation</em>, <em>telepathic
      bond</em><sub>S</sub>,</p><p>4th-<em>detect scrying</em><sub>S</sub>,
      <em>locate creature</em><sub>S</sub>, <em>remove curse</em>,
      <em>scrying</em><sub>S</sub></p><p>3rd-<em>arcane sight</em><sub>S</sub>,
      <em>clairaudience/clairvoyance</em><sub>S</sub>, <em>secret
      page</em><sub>OP</sub>, <em>tongues</em><sub>S</sub></p><p>2nd-<em>detect
      thoughts</em><sub>S</sub>, <em>flaming sphere</em>, <em>locate
      object</em><sub>S</sub>, <em>resist energy</em>, <em>see
      invisibility</em><sub>S</sub>, <em>summon monster II</em><br
      />1st-<em>cause fear</em>, <em>comprehend languages</em><sub>S</sub>,
      <em>detect secret doors</em><sub>S</sub>, <em>detect
      undead</em><sub>S</sub>, <em>disguise self</em><sub>OP</sub>,
      <em>identify</em><sub>S</sub>, <em>protection from evil</em>,
      <em>protection from law</em>, <em>true
      strike</em><sub>S</sub></p><h2>Ritual</h2><p><strong>Eyes of Rul Thaven
      (Su)</strong> You use a trick perfected by Rul Thaven to ferret out
      invisible creatures. Spend this boon's effect as a swift action. You gain
      the effects of see invisibility for 1 round.</p>
