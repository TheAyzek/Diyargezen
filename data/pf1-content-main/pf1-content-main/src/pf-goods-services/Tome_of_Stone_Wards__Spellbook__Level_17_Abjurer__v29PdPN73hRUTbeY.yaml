name: Tome of Stone Wards (Spellbook, Level 17 Abjurer)
system:
  description:
    value: >-
      <p><em>This heavy book is bound between a pair of thin stone tablets, its
      title carved in gold lettering. Scribed completely in the Dwarven tongue,
      the text contains numerous tips regarding the construction and upkeep of
      nearly every corridor, path, and tunnel in the Five Kings
      Mountains.</em></p><p><strong>Value</strong> 4,385 gp (8,385 gp with the
      preparation ritual)</p><h2>Spells</h2><p>9th-<em>imprisonment</em></p><p>
      8th-<em>dimensional lock</em>, <em>protection from spells</em></p><p>
      7th-<em>banishment</em>, <em>spell turning</em></p><p> 6th-<em>greater
      make whole</em> (<em>Pathfinder Campaign Setting: Technology Guide</em>
      10), <em>guards and wards</em>, <em>move earth</em>, <em>symbol of
      sealing</em></p><p> 5th-<em>life bubble</em><sup>APG</sup>, <em>major
      creation</em>, <em>passwall</em>, <em>wall of stone</em>, <em>wreath of
      blades</em><sup>UC</sup></p><p> 4th-<em>curse of magic
      negation</em><sup>UM</sup>, <em>make whole</em>, <em>stone shape</em>,
      <em>stoneskin</em></p><p> 3rd-<em>burrow</em><sup>UM</sup>, <em>communal
      spider climb</em><sup>UC</sup>, <em>dispel magic</em>, <em>explosive
      runes</em>, <em>shrink item</em>, <em>spiked pit</em><sup>APG</sup>,
      <em>stunning barrier</em><sup>ACG</sup> 2nd-<em>arcane lock</em>,
      <em>certain grip</em><sup>UC</sup>, <em>communal ant
      haul</em><sup>UC</sup>, <em>create pit</em><sup>APG</sup>, <em>knock</em>,
      <em>resist energy</em>, <em>spider climb</em>, <em>stone
      call</em><sup>APG</sup>, <em>warding weapon</em><sup>UC</sup>
      1st-<em>alarm</em>, <em>ant haul</em><sup>APG</sup>, <em>expeditious
      excavation</em><sup>APG</sup>, <em>invisibility
      alarm</em><sup>ACG</sup></p><h2>Ritual</h2><p><strong>Keeper of Stone
      (Ex/Su)</strong> The <em>Tome of Stone Wards</em> covers the geography of
      caves and mountains (especially the Five Kings Mountains) thoroughly, and
      gives eldritch insights into how such terrain is formed. This boon is not
      spent, but grants you a +1 insight bonus on Knowledge (dungeoneering),
      Knowledge (geography), and Knowledge (nature) checks, as well as on
      Survival checks attempted in hills, mountains, and underground terrain. In
      addition, whenever you cast <em>mending</em>, <em>make whole</em>, or
      <em>greater make whole</em> on an object made entirely from stone, add 1d6
      to the number of hit points restored to the object. These benefits last
      until you next regain spell slots or prepare spells.</p>
