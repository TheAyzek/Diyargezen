      <em>feather fall</em>, <em>magic missile</em>, <em>obscuring mist</em>,
      <em>true strike</em></p><h2>Ritual</h2><p><strong>Secrets of Jatembe
      (Su)</strong> This edition of the Wisdom of Jatembe includes a number of
      unique rituals and philosophical notes supposedly written by the Old-Mage
      himself. These secrets allow you to prepare one of the following spells as
      an arcane spell 1 level higher than its druid spell level:
      <em>barkskin</em>, <em>call lightning</em>, <em>cyclic reincarnation</em>,
      <em>entangle</em>, <em>forest friend</em><sup>UC</sup>, <em>lesser
      restoration</em>, <em>plant growth</em>, <em>speak with animals</em>, and
      <em>speak with plants</em>. At the GM's discretion, additional spells of
      6th level or lower from the druid spell list may be available through the
      preparation rituals of specific copies of this book (which increases the
      spellbook's price by twice the cost of adding a wizard spell of the same
      level to the spellbook).</p>
