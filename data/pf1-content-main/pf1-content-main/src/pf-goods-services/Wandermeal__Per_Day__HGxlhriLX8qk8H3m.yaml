name: Wandermeal (Per Day)
system:
  description:
    value: >-
      <p>This tough, dried cake is a halfling invention made from flour, water,
      and spices. Wandermeal keeps for months without spoiling, travels well,
      and fills the belly. However, eating it for over a week without other
      nutrients requires the eater to make a daily Fortitude saving throw (DC 15
      + 1 for each additional day) or be sickened. The effect ends 1 day after
      more nutritious food is eaten. The listed price is for a day's worth of
      food.</p>
