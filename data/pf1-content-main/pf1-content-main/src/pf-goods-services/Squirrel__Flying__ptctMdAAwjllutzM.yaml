      (flying)</p><h2>Description</h2><p>These tiny rodents are as common in the
      wild as rats are in cities. They typically eat nuts, seeds, and
      vegetation. Squirrels have the same statistics as rats (see the
      <em>Bestiary</em>).</p><p><em>Flying squirrel</em>: These Tiny squirrels
      use a membrane of skin between their front and hind legs to glide. They
      sometimes serve spellcasters as familiars. More information on flying
      squirrels can be found in the <em>Bestiary 3</em>.</p>
