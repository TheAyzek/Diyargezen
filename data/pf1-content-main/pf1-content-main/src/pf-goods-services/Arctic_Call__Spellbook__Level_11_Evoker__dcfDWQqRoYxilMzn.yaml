      <em>repulsion</em></p><p>5th-<em>cone of cold</em><sub>S</sub>, <em>mage's
      private sanctum</em>, <em>permanency</em>, <em>teleport</em>, <em>wall of
      force</em><sub>S</sub></p><p>4th-<em>ice storm</em><sub>S</sub>,
      <em>shout</em><sub>S</sub>, <em>stoneskin</em>, <em>symbol of
      revelation</em>, <em>wall of ice</em><sub>S</sub></p><p>3rd-<em>arcane
      sight</em>, <em>dispel magic</em>, <em>elemental aura</em><sub>S</sub>,
      <em>fire trap</em>, <em>heroism</em>, <em>lightning bolt</em><sub>S</sub>,
