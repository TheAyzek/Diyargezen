name: Saddle
system:
  description:
    value: >-
      <p><strong>Price</strong> 60 gp (exotic, military), 15 gp (exotic, pack),
      30 gp (exotic, riding), 20 gp (military), 5 gp (pack), 10 gp (riding);
      <strong>Weight</strong> 40 lbs. (exotic, military), 20 lbs. (exotic,
      pack), 30 lbs. (exotic, riding), 30 lbs. (military), 15 lbs. (pack), 25
      lbs. (riding)</p><h2>Description</h2><p>Saddles are used to support a
      rider or supplies on a mount.</p><p><em>Military Saddle</em>: This saddle
      braces the rider, providing a +2 circumstance bonus on Ride checks related
      to staying in the saddle. If the rider is knocked unconscious while in a
      military saddle, he has a 75% chance to stay in the saddle.</p><p><em>Pack
      Saddle</em>: A pack saddle holds gear and supplies, but not a rider. It
      holds as much gear as the mount can carry.</p><p><em>Riding Saddle</em>:
      These saddles are the most pervasive type of riding equipment. If the
      rider is knocked unconscious while in a riding saddle, he has a 50% chance
      to stay in the saddle.</p><p><em>Exotic Saddle</em>: These saddles are
      designed for a variety of unusual mounts, each customized for a specific
      type of beast. Exotic saddles come in military, pack, and riding styles,
      just as normal saddles do, and have the same traits.</p>
