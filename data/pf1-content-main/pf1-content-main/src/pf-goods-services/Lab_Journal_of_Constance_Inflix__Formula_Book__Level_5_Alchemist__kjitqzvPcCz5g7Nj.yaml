name: Lab Journal of Constance Inflix (Formula Book, Level 5 Alchemist)
system:
  description:
    value: >-
      <p><em>The steel cover of this slim journal has taken its fair share of
      abuse; acid scars and minor slag spots show where the journal was
      subjected to intense working conditions. Equations, balances, and chemical
      notations mark the margins of the pages-with some formulae, it is
      difficult to tell where the notes end and the formula begins.</em><br
      /><strong>Value</strong> 395 gp (770 gp with the preparation
      ritual)</p><h2>Spells</h2><p>2nd-<em>blur</em>, <em>delay poison</em>,
      <em>fire breath</em>, <em>transmute potion to poison</em>, <em>vomit
      swarm</em></p><p>1st-<em>bomber's eye</em>, <em>comprehend languages</em>,
      <em>cure light wounds</em>, <em>jump</em>, <em>keen senses</em>,
      <em>negate aroma</em>, <em>resist energy</em>, <em>touch of the
      sea</em></p><h2>Ritual</h2><p><strong>Alchemical Protection (Su)</strong>
      The alchemical knowledge granted by this book protects you from poisons
      and alchemical items. Spend this boon's effect as an immediate action when
      you make a saving throw against poison or an alchemical item but before
      rolling the saving throw. You gain a +4 bonus on that saving throw.</p>
