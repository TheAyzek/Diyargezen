      demonic hordes there, a detailed map of the City of Brass and surrounding
      areas on the Plane of Fire by famed cartographer Insitha Avari, and a full
      70 baudy songs and limericks gathered over the course of the decade Rarick
      Dell spent in the court of a powerful satyr on the First World.
      </p><h2>Skill Bonuses</h2><ul><li>Deliver dirty jokes (Perform [comedy]
