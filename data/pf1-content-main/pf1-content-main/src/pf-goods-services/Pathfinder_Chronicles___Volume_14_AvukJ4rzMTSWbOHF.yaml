      <p><strong>Category</strong> Pathfinder
      Chronicles</p><h2>Description</h2><p>The first volume of the
      <em>Pathfinder Chronicles</em> to contain only accounts of Pathfinders'
      exploits on other planes, the fourteenth volume features a record of
