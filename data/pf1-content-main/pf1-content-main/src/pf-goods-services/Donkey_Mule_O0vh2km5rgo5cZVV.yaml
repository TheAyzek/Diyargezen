name: Donkey/Mule
system:
  description:
    value: >-
      <p>Donkeys and mules are stolid in the face of danger, hardy, surefooted,
      and capable of carrying heavy loads over vast distances. Unlike a horse, a
      donkey or mule is willing (though not eager) to enter dungeons and other
      strange or threatening places. Donkeys and mules have the same statistics
      as ponies (see the <em>Bestiary</em>).</p>
